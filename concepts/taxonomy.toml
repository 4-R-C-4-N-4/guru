# Guru Concept Taxonomy v2 — three-tier hierarchy (domain → family → concept)
#
# Sectioning (the sync loader counts dots after the prefix to assign tiers):
#   [families.DOMAIN]         → domain row   (parent_id = NULL)
#   [families.DOMAIN.FAMILY]  → family row   (parent_id = DOMAIN)
#   [concepts.DOMAIN.FAMILY]  → concepts whose primary family is DOMAIN.FAMILY
#   [concept_aliases]         → concept synonyms (parallel to the concept_aliases table)
#
# Family/domain aliases are optional inline `aliases = [...]` arrays; concept
# aliases live in [concept_aliases]. All alias fields are optional and populated
# incrementally as queries surface (design.md §5.1, §6).
#
# Hand-clustered into the §4 two-tier hierarchy (22 families across 6 domains)
# — todo:ea1c2372. The family tier drives RETRIEVAL (guru-web query expansion /
# family browse), not tagging: tagging stays concept-driven on the flat v1 prompt
# (see docs/concept-hierarchy/bench-v1-vs-v2.md). Applied to SQLite by
# scripts/sync_taxonomy.py. See docs/concept-hierarchy/design.md §4, §6.

# ============================================================
# DOMAINS
# ============================================================
[families.cosmology]
label = "Cosmology"
definition = "Origin and structure of the universe."

[families.soteriology]
label = "Soteriology"
definition = "Salvation, liberation, and the soul's return."

[families.theology]
label = "Theology"
definition = "The nature of the divine and divine attributes."

[families.praxis]
label = "Praxis"
definition = "Practice, ritual, and spiritual method."

[families.anthropology]
label = "Anthropology"
definition = "The nature of the human being."

[families.ethics]
label = "Ethics"
definition = "Moral teaching and conduct."


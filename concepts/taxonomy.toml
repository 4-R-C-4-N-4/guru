# ============================================================
# CONCEPTS (grouped by family)
# ============================================================

[concepts.cosmology.divine_structure]
emanation_hierarchy = "A chain of divine beings or principles flowing downward from a single transcendent source (the One or the Father), each level less perfect than the one above."
pleroma = "The divine fullness or totality of the highest realm, populated by aeons and divine attributes, contrasted with the deficient material world."
kenoma = "The void or emptiness outside the pleroma; the realm of matter, ignorance, and deficiency."
qliphoth = "The 'shells' or 'husks' of Kabbalistic doctrine — the obverse, unbalanced counterpart that each Sephira throws off during its own emanation, going off by itself to form its own shadow-sphere in Chaos, the Habitations of Hell, personified as Qlippothic demons (the 'Obscene Ones,' the 'Disputers') mirroring the Archangels of the corresponding Sephira. Distinct from kenoma (the Gnostic void outside the pleroma generally, one undifferentiated realm of deficiency, not this specific one-shadow-per-Sephira structure) and archons (Gnostic planetary rulers governing matter directly, not an unbalanced-emanation byproduct)."
monad = "The absolutely simple, undivided first principle from which all multiplicity and existence flows."
aeons = "Divine archetypal beings or eternal attributes dwelling within the Pleroma, often arranged in male-female syzygies."
barbelo = "The Sethian divine realm of the first emanation — the 'immortal realm of Barbelo' in the Gospel of Judas, the womb or fullness of the supreme Spirit from which the aeons, the Self-Begotten, and the luminaries arise; the threshold between the hidden God and the structured light-world."
luminaries = "The light-world beings of Sethian cosmology — the twelve androgynous luminaries, expanded to seventy-two and then three hundred sixty in numerical hierarchies — the structured population of the divine realm, each ruling its own aeons and heavens; distinct from aeons (the divine archetypes themselves) in being the administrative light-orders of the pleroma."
logos = "The divine reason, word, or ordering principle through which the universe was created; mediates between the transcendent God and the material world."
sephirot = "The ten attributes or emanations through which the Ein Sof (Infinite) reveals itself and creates the universe in Kabbalistic theology."
christ_force = "In Western Hermetic Qabalah, the specific harmonizing cosmic force symbolised by Tiphareth, the central Sephira of the Tree of Life — the equilibriating, compensating, healing, redeeming, and purifying factor of the universe, recognised by the occultist as one power among the hierarchy of supreme cosmic forces rather than assigned the exclusive position it holds for the Christian mystic. Distinct from logos (the ordering principle through which the universe was created, not this specific mediating/healing Sephirotic force) and trinity (a claim about the Godhead's internal three-personed structure, not a single emanation's function within a tenfold system)."
sefirot_tree = "The diagrammatic arrangement of the ten Sephirot as a structured 'Tree of Life' mapping divine and cosmic forces."
world_tree_axis = "A vertical structure connecting cosmic levels — a tree, pillar, mountain, or ladder linking heaven, earth, and underworld around which the cosmos is organised. Yggdrasil binding the Nine Worlds in Norse cosmology, the Kalevala's Sampo as world-pillar, the Mayan ceiba, the Vedic Aśvattha, the shamanic central tree of Eliade's analyses. Cosmic-structural in character: distinct from sefirot_tree (a kabbalistic emanation diagram) and emanation_hierarchy (an ontological cascade); world_tree_axis is the cosmos's spine rather than the divine's outflow."
invisible_world = "A non-physical dimension of reality, interpenetrating the physical world, populated by forces, beings, and forms ordinarily imperceptible to physical senses and instruments, that can affect embodied life without being seen — Dion Fortune's 'mind-side of nature,' the astral plane of Western esotericism broadly construed. Distinct from astral_light (a specific transmitting medium or fluid operating within this realm, not the realm itself), pleroma (the divine fullness at the summit of a cosmic hierarchy, not a parallel plane coextensive with ordinary life), and animism (particular indwelling spirits bound to specific natural objects, not the general unseen dimension itself)."

[concepts.cosmology.cosmic_agents]
demiurge = "A secondary creator deity—often ignorant or malevolent—responsible for fashioning the material world, distinct from the supreme transcendent God."
archons = "Malevolent planetary rulers or demiurgic powers that govern the material world and obstruct the soul's ascent."
ahura_mazda_principle = "The divine ordering principle of truth and light."
angra_mainyu_principle = "The principle of cosmic disorder and falsity."
watchers_descent = "The 1 Enoch narrative in which a class of originally-good angelic beings (the Watchers) descends, mates with women, and teaches forbidden arts — the substrate that Gnostic archons inherits and inverts: archons are born malevolent, the Watchers fall through transgression."
trickster_mythology = "The trickster archetype: a boundary-breaking figure — Loki, Unktomee the Spider, the Cherokee Rabbit, Hermes — whose deception, cunning, and rule-violation drive mythic change, often doubling as culture hero; sacred disorder as an engine of the cosmos."
animism = "The doctrine and worldview that natural phenomena, places, and objects possess inherent spirit, soul, or personality — and that the cosmos is populated by countless local, plural, embodied divine agents: kami in mountain and tree, sidhe in cairn and well, landwights in field and stone, nymphs in spring and grove, haltija in forest and lake, lares and penates in household and threshold, Iamblichean daemons in element and place. Distinct from monotheism (single transcendent God), pantheism (one underlying substance), and emanation_hierarchy (cascading single source); animism's signature is the plurality, locality, and embodied-in-landscape character of the divine."
astral_light = "The universal fluid or medium of occult philosophy — Lévi's Great Magical Agent — that transmits will, thought, and magical influence between minds and matter, and preserves the impress of all forms and actions as a book of consciences; cognate with akasha and the anima mundi. Distinct from cosmic_sympathy (a doctrine of hidden affinity) in being a substantival medium that can be charged, directed, and abused."
haunting = "The interference of a discarnate human soul, or the lingering condition of a particular place, with the living — Dion Fortune's distinction between a soul in distress that clings out of ignorance and ties itself to a person or locality, versus deliberate malice. Distinct from animism (indwelling nature-spirits inherent to a place by nature, not a specific dead individual's soul) and from psychopomp_journey and ancestor_veneration (guiding the dead onward, or the living's ongoing ritual obligation to the honoured dead) in naming the pathological case: a soul that has NOT been guided onward and instead interferes, whether with a person or a place."
possession = "The state of a person being controlled or inhabited by an external spirit or entity — the entity as subject acting through the person's body, rather than merely troubling them from without. Distinct from haunting (a discarnate soul or place-bound presence that interferes without necessarily entering and controlling a living body) and from spirit_conjuration (an operator deliberately commanding a spirit's appearance, the reverse relation — here the spirit is uninvited and in control, not summoned and subordinated)."
collective_psychic_field = "A collective psychic entity or force generated by a group of people's shared emotional and ritual life — a religious community's corporate mind — which persists and can be disturbed or 'let loose' independently of any single member, producing effects (hauntings, disturbances, curses) at the group's former site long after the community itself has dispersed. Distinct from secret_societies (the organized institution itself, not the psychic field it generates) and artificial_elemental (a single operator's deliberate individual creation, not an unintentional collective byproduct)."
elemental_beings = "Naturally-existing, non-human intelligences native to a single element — earth, air, fire, or water — rather than the fourfold-composite human nature: Paracelsus's gnomes, sylphs, salamanders, and undines; the Deva Kingdom or fairy kingdom of Western occultism, forming their own parallel kingdom capable of incarnating in or forming relationships with humans. Distinct from artificial_elemental (a manufactured thought-entity deliberately created by a single operator, not a naturally-occurring species) and animism (the general doctrine that nature-places host indwelling spirits, of which this is one specific taxonomic system organised around the four elements rather than locality)."
thought_form = "A temporary mental construct given visible form on the astral plane by directed imagination — ordinarily without independent life, and dispellable by the same imaginative act that made it, unless invocation of elemental essence or projection of the maker's own force gives it sufficient sustained power to resist unmaking, at which point it escalates into an artificial_elemental. Distinct from artificial_elemental (the escalated, quasi-independently-alive entity this concept precedes and can turn into) and astral_light (the ambient medium in which a thought-form is formulated, not the construct itself)."

[concepts.cosmology.cosmic_order]
asha_cosmic_order = "Truth as the fundamental structure of reality."
maat_cosmic_order = "The Egyptian principle of truth, balance, and right order underlying both the cosmos and human conduct; the parallel to Zoroastrian asha and Greek dike."
correspondence = "The Hermetic axiom that the structure of the cosmos is reflected at every scale — 'as above, so below; as within, so without' — making each level a legible map of the others."
microcosm_macrocosm = "The human being as a small-scale image of the entire cosmos; the body, soul, and intellect mirroring the structure of the heavens and the divine — distinct from correspondence in that it makes the human the privileged mirror."
cosmic_sympathy = "The Stoic and Plotinian doctrine that all parts of the cosmos are bound by hidden affinities, so that a movement in one part resonates through the whole; the metaphysical basis for astrology, magic, and divination."
stellar_determinism = "The rule of the stars and planetary powers over mortal destiny — the astrological governors whose spheres bind souls to birth, error, and death; in Sethian gnosis the 'error of the stars' that the savior exposes, and from which the incorruptible generation alone is free. Distinct from cosmic_sympathy (a doctrine of universal affinity) in being a bondage-to-powers claim, and from archons (the rulers as personal beings) in concerning the astral machinery itself."
infinite_cosmos = "The doctrine of the universe as boundless and without center or circumference, populated by innumerable worlds — Bruno's rejection of the closed Aristotelian sphere; the divine and the cosmos as ontologically infinite."
magical_equilibrium = "The balance of two contrary forces as the structural law of cosmos and operation — Lévi's equilibrium, expressed in Kabbalah by the senary: the will of God in its first cause, liberty in man, mathematical equilibrium in matter; the twofold vibration required to direct the Astral Light safely."
dharma = "The cosmic law that manifests as each being's own duty — right order known not as abstract truth but as the specific obligation of one's nature and station (svadharma), so that maintaining the cosmos and performing one's proper work are one act; the Gita's 'one's own duty, though defective, is better than another's well performed.' Sits beside asha_cosmic_order and maat_cosmic_order as a right-order concept but is distinct in individuating the order into personal vocation; distinct from good_thought_word_deed (ethical triad) in binding duty to cosmic station."
vibration = "The Hermetic doctrine that nothing rests — matter, energy, mind, and spirit are a single continuum differing only in rate of vibration, from the grossest matter to the least material spirit. Distinct from cosmic_sympathy (affinity resonating BETWEEN separate things) in being a claim about what constitutes any one thing in the first place, and from magical_equilibrium (Lévi's operational balancing technique, which presupposes some vibration doctrine rather than stating this general principle)."
polarity = "The Hermetic doctrine that apparent opposites are identical in nature but differ in degree — two extremes of the same scale (hot/cold, love/hate) — such that one pole can be shifted toward its opposite by a change of degree ('mental transmutation'). Distinct from opposites_transcended (a completion-state marking the path's end, not this doctrine's active technique) and magical_equilibrium (balance held BETWEEN two forces, not identity-by-degree of what looks like two forces)."
rhythm = "The Hermetic doctrine of a measured swing or pendulum motion between poles — action and reaction, flow and outflow, rise and fall — operating in mental, physical, and cosmic-historical registers alike. Distinct from apocatastasis (cosmic-scale eschatological restoration after vast cycles) in naming a constant, ever-present oscillation rather than a singular restorative event."
gender = "The Hermetic doctrine that a masculine-feminine generative principle operates on every plane of being, not only the biological — present at all times as a structural feature of creation itself. Distinct from divine_marriage (a specific reunification event or symbol) and aeons (paired divine beings arranged in syzygies, not a universal structural claim)."

[concepts.cosmology.origin_events]
letters_of_creation = "The twenty-two Hebrew letters as the building blocks through which God creates and sustains all existence."
tzimtzum = "Luria's doctrine of the divine self-contraction by which Ein Sof withdraws to make ontological room for a created world; creation as divine self-limitation rather than emanation outward."
fall_of_sophia = "The Gnostic myth of Wisdom's prolapse from the Pleroma — her unilateral desire or error producing the Demiurge and the entrapment of divine sparks in matter."
frashokereti = "The final restoration/renovation of the cosmos."
apocatastasis = "The doctrine of the periodic restoration or recurrence of all things to their original state after vast cycles."
cosmogony = "Narratives or doctrines of cosmic origin — how heaven, earth, and the primordial deities first came into being. The Kojiki's deities born alone on the Plain of High Heaven, Voluspo's Ginnungagap, Genesis's tohu wa-bohu, the Timaeus's Demiurge fashioning the Receptacle, the Hesiodic Theogony, the Kalevala's egg-cosmogony, Egyptian Nun-and-Atum. Distinct from emanation_hierarchy (structural-ontological cascade), letters_of_creation (mechanism of creation), and apocatastasis/frashokereti (end-state restoration); cosmogony is temporally-narrative beginning."
involution = "The doctrine that the cosmos unfolds as a structured descent of spirit into matter — a directional process traced stage by stage from an unconditioned principle down through successive planes to full materialization — complemented by its own eventual return ('evolution'). Distinct from emanation_hierarchy (the static structure of the resulting levels of the cascade) and cosmogony (a single originating event rather than an ongoing staged process) in naming the directional cosmic PROCESS of descent itself, paired with its own complementary ascent."

[concepts.cosmology.soul_cosmology]
divine_sparks = "Fragments of divine light or spirit trapped inside material bodies, awaiting liberation and return to their source."
soul_migration = "The transmigration of the soul across lives."
psychopomp_journey = "Guided passage of the soul through afterlife realms."

[concepts.soteriology.knowledge_path]
gnosis_direct_knowledge = "Salvation through direct experiential knowledge of the divine nature, not through faith, ritual, or moral works alone."
self_knowledge = "The recognition of one's own true divine nature as the primary path to liberation; 'know thyself' as soteriology."
anamnesis = "Platonic recollection: knowledge as the soul's recovery of what it knew before birth, with learning as remembering rather than acquisition."
hidden_sayings = "Esoteric teachings reserved for those ready to receive them; outer meaning conceals an inner liberating truth."
oral_tradition = "Sacred knowledge transmitted as living speech rather than fixed writing — scripture carried in memory, song, and telling, renewed in each generation; the unwritten canon of a tradition."
forbidden_knowledge = "Transgressive knowing acquired against divine prohibition — the Watchers' teaching of metallurgy, sorcery, and cosmetics in 1 Enoch, the Gnostic Eve narratives, the Promethean mytheme; explicitly contrasted with gnosis_direct_knowledge, which is salvific."
emotional_epistemology = "The doctrine that emotions constitute a valid and necessary mode of knowing reality, complementing or surpassing intellectual cognition."
esoteric_lineage = "A historical or mythical chain of transmission for secret wisdom from master to disciple across time and cultures — the credential of the teaching, not merely its content. Distinct from oral_tradition (the spoken-not-written modality of transmission, which a lineage may or may not use) and hidden_sayings (the concealment-for-readiness of a teaching's meaning, independent of who transmitted it or in what unbroken chain)."
secret_societies = "Organized, persisting groups — fraternities, orders, lodges — that maintain esoteric knowledge or practices as an institution distinct from public religion or mainstream society, holding 'the keys' collectively rather than through any one master-disciple pair. Distinct from esoteric_lineage (a genealogical chain of individual transmission, not an institution) and hidden_sayings (the concealment of a teaching's meaning, independent of whether any organized body holds it)."
occult_police = "An informal, decentralised network of occultists — operating partly through inner-plane guidance and partly through organised physical-plane fraternities that hunt and disband harmful lodges — that polices the occult field against criminal or malevolent use, acting on inner-voice direction and coincidence-engineering rather than any single headquarters or centralised human command. Distinct from secret_societies (an institution that holds esoteric knowledge collectively, not one organised specifically around enforcement against occult wrongdoing) and left_hand_path (the malevolent orientation this network exists to counter, not the countering network itself)."

[concepts.soteriology.union_and_return]
return_to_source = "The soul's journey back to its divine origin, reversing the fall into matter through stages of purification or illumination."
divine_marriage = "The reunification of complementary divine principles (male-female, spirit-matter) as a symbol of wholeness and salvation."
mystical_union = "The merging of the individual soul or self with the divine, transcending personal identity."
theosis_deification = "The doctrine — central to Eastern Orthodox and Maximian theology — that the human person is progressively transformed into a partaker of the divine nature by grace, not merely justified or united in passing ecstasy."
fana_annihilation = "Sufi self-effacement in God — the via by which the lover is unmade as a separate ego and recovered as God's act; specifies the practice/event rather than mystical_union's resulting state."
bhakti = "The path of loving devotion and self-surrender to a personal deity as itself sufficient means of liberation — the Gita's 'to those constantly devoted, I come forward as their deliverer,' Kabir's and the Sant poets' love-religion, the devotional stream that parallels Sufi love-mysticism. Distinct from mystical_union (the resulting state), fana_annihilation (the ego's unmaking at the path's end), ladder_of_love (eros staged toward Beauty), and prayer (the practice of address): bhakti names devotion as the soteriological road itself."

[concepts.soteriology.ecstatic_ascent]
divine_madness = "Ecstatic irrational rapture — Plato's mania, Bruno's furore — by which the soul transcends ordinary reason and attains direct contact with divine reality; madness reframed as higher knowledge."
ladder_of_love = "Diotima's staged ascent from love of beautiful bodies → beautiful souls → beautiful pursuits → beautiful knowledge → Beauty itself; the canonical scala amoris that grounds Plotinus's On the Beautiful and Bruno's Eroici Furori — distinct from generic spiritual_ascent in that eros is the specific motive force."

[concepts.soteriology.purgation_and_emptiness]
dark_night = "John of the Cross's stage of contemplative purgation: a felt absence and aridity of God that strips the soul of attachments to its own consolations en route to deeper union."
separation_from_source = "The felt condition of exile from one's divine origin — Rumi's reed flute torn from its bed, Plotinus's 'we have forgotten,' the Gnostic forgetfulness; the affective wound that complements return_to_source and gives the return its motive."
sunyata_emptiness = "The Buddhist doctrine that all phenomena lack independent self-nature; emptiness as the positive recognition that things arise only in dependence on conditions — distinct from kenoma's mere deficiency."
contrition = "Penitential sorrow for sin as the first movement of the soul's healing — Julian's first of three medicines ('by contrition we are made clean'), the Christian compunction tradition, Sufi tawba, Greek metanoia, Hebrew teshuvah; the wound of sorrow that turns bitterness into hope of mercy. Distinct from self_examination (the diagnostic practice), rejection_of_hypocrisy (critique of others' form), and dark_night (imposed aridity): contrition is the soul's own penitent turning."

[concepts.soteriology.soteric_categories]
pneumatic_elect = "A spiritual elite who possess the divine spark and are predestined for salvation, contrasted with psychic (faithful) and hylic (material) persons."
incorruptible_generation = "The strong and holy generation that no star, angel, or ruler can govern — the elect of Sethian soteriology whose souls survive death and ascend, the 'seed' promised the kingdom; in the Gospel of Judas the central soteriological claim, and the fate Judas is told he is excluded from ('you'll become the thirteenth, and will be cursed by the other generations'). Distinct from pneumatic_elect (a classification of persons by spiritual substance) in being a corporate, trans-historical people with a cosmic destiny."
eschatological_judgment = "Final, collective cosmic judgment as an event in which the wicked are sentenced and the cosmos restored; distinct from psychopomp_journey (individual passage at death) and emphasising verdict where Zoroastrian frashokereti emphasises restoration."

[concepts.theology.divine_nature]
apophatic_theology = "Describing the divine only by negation—God transcends all positive categories and concepts; the via negativa."
divine_hiddenness = "The supreme God's radical concealment beyond ordinary knowledge or perception; the Hidden Father."
self_begotten = "The Self-Begotten (Autogenes) — the great angel and 'God of the Light' who emerges from the luminous cloud at the supreme Spirit's command and organizes the aeons, luminaries, and realms of light; the Sethian first-born of the divine fullness, distinct from the demiurge in being an emanation of light rather than an ignorant creator."
divine_simplicity = "The doctrine that God has no parts, divisions, or composite attributes; pure undivided being."
ein_sof = "The infinite, unknowable aspect of the divine prior to and beyond all emanation; the hidden root from which the Sephirot unfold."
anthropomorphism = "Attributing human characteristics, emotions, or form to the divine; embodied divine imagery."
shapeshifting_transformation = "Form-mutability as a constitutional property of divine and preternatural beings — gods, heroes, spirits, and their human practitioners possessing inherent capacity to alter form across human, animal, plant, or elemental states. Loki and Odin's transformations in Norse, Math's pigs and Blodeuwedd's owl-shape and Pwyll's exchange with Arawn in the Mabinogion, the Greek Proteus, the Indian dasavatara, Vainamoinen's bird-flight in the Kalevala, Ovid's metamorphoses, the shamanic and witch's capacity for ritual form-change. Distinct from anthropomorphism (divine taking specific human form, single embodiment) in that anthropomorphism establishes a stable form whereas this concept establishes form's plurality and instability."

[concepts.theology.divine_attributes_and_acts]
divine_light = "The uncreated luminous quality of the divine, sometimes experienced directly in mystical states; illumination as revelation."
living_god = "The divine conceived as active, present, and dynamic—not an abstract principle but a personal responsive reality."
sacred_names = "Divine names or formulas that carry ontological power, used in prayer, liturgy, or magical practice."
divine_providence = "Pronoia — the doctrine that the divine actively orders the unfolding of the cosmos and human affairs toward intelligible ends, against pure chance or blind necessity."
covenant = "A binding agreement or relationship between the divine and a people or individual, establishing mutual obligations."
incarnation = "The doctrine that the divine or a spiritual principle takes on a specific, bounded material or bodily form — descending from an unconditioned state into individual, corporeal existence — as a discrete act rather than a diffuse pervading presence. The Christian Word made flesh, the Hindu avatara, the Egyptian pharaoh as living Horus, the Vajrayana tulku. Distinct from divine_immanence (the general claim that the divine pervades all of creation diffusely, not a specific embodiment-event) and separation_from_source (the felt exile FROM origin, the opposite motion) in describing a specific, individuated descent INTO a particular body or form."

[concepts.theology.ontological_structure]
unity_of_being = "The doctrine that all existence is ultimately one substance or one divine reality; non-duality as a theological claim."
evil_as_privation = "Augustinian and Plotinian doctrine that evil has no positive being of its own but is a lack, distortion, or absence of the good — denying ontological dualism while preserving moral seriousness."
cosmic_dualism = "Ontological opposition between two primal principles (light/darkness, truth/lie, spirit/matter) as the fundamental structure of reality."
numerical_mysticism = "Numbers, proportions, and mathematical relationships as the underlying structure of divine reality."
mentalism = "The Hermetic doctrine that THE ALL is Mind, and the Universe is mental in nature — a created thought held in the mind of THE ALL. Distinct from unity_of_being in specifying WHAT the underlying oneness is (mind, not an unspecified single substance), and from logos (a mediating ordering word BETWEEN a transcendent God and a separate material world) in collapsing that mediation entirely — under mentalism there is no world outside mind to mediate to."
relative_truth = "The doctrine that reality has two registers — an Absolute truth as the divine or ultimate mind knows it, and a Relative truth as finite human reason perceives and must act on — with both held as legitimate on their own plane rather than the second being simply an error to correct. Distinct from apophatic_theology (a claim about how the divine may be described, by negation) and unity_of_being (a claim that being is ultimately one) in being a claim about two coexisting registers of truth-claim itself."
divine_immanence = "The doctrine that the divine is present within all things and the universe itself, pervading creation rather than remaining solely transcendent above it. Distinct from unity_of_being (the general claim that all existence is one substance, agnostic about whether that substance indwells its parts) and from kingdom_within (the divine present specifically IN THE INDIVIDUAL human, accessible without mediation) — divine_immanence is the general pervading-presence claim applied to all of creation, not a human-specific indwelling."
trinity = "The doctrine that the one Godhead or first principle subsists as three co-equal aspects or persons rather than a bare unity — the Christian Father/Son/Holy Ghost invoked in the recurring liturgical formula 'In the Name of the Father, and of the Son, and of the Holy Ghost,' but structurally the same pattern as the Egyptian Amen/Ptah/Osiris, the Hindu Brahma/Vishnu/Siva, and the Kabbalistic Chochmah/Binah/Kether triads that esoteric writers explicitly map onto it as instances of one universal law. Distinct from unity_of_being (the general claim that all existence is one substance, agnostic about internal plurality) and divine_simplicity (God as having no parts or divisions at all) in asserting a definite three-aspected differentiation within a single divine essence."

[concepts.praxis.contemplative_practice]
meditation = "Disciplined inward attention — sitting, focused, or open-awareness practice — as a stand-alone term that umbrellas active_contemplation, inner_silence, and dhyana-style sitting."
active_contemplation = "A form of meditation that uses imagery, imagination, or symbolic thought rather than purely empty stillness."
inner_silence = "The practice of stilling the mind and speech to open receptivity to divine knowledge or presence."
detachment_gelassenheit = "Eckhart's Abgeschiedenheit/Gelassenheit — radical letting-go of will, image, and grasping that opens the soul to God; distinct from inner_silence (quietness) and from material renunciation, and adjacent to Sufi tark and Buddhist non-grasping as a practice rather than a metaphysical claim."
wu_wei = "Effortless action aligned with the spontaneous flow of the Dao; non-coercive, non-striving conduct that yields results without forcing — the sage acts without acting."
nature_preservation = "The ethical imperative to live in accordance with one's innate nature and avoid artificial social constraints that harm it."

[concepts.praxis.ritual_and_symbolic]
letter_meditation = "Contemplative practice focused on Hebrew letters as cosmic symbols or gates of divine power."
permutation_of_letters = "Combining, transposing, or cycling through letters or names as a meditative or theurgical technique."
ritual_fire = "Fire as medium of divine presence."
rejection_of_sacrifice = "The polemic against animal and blood sacrifice as ignorant or demonic worship — the prophetic and gnostic critique that the cult the sacrificers serve is actually the archons' (in the Gospel of Judas, the disciples' offerings are revealed as service to Saklas, and the priests at the altar are the twelve themselves); distinct from ritual_purity (a state of preparation) and theurgy (consecrated engagement with the divine) in being a wholesale repudiation of sacrificial practice."
word_power_incantation = "The doctrine and practice that spoken or sung word carries causal-magical force — that uttering names, formulas, songs, or incantations alters reality directly rather than merely communicating about it. Vainamoinen's runo-songs that move mountains and command iron, Norse galdr, Vedic mantra, Shinto kotodama, the magician's barbarous names in the Greek Magical Papyri, Iamblichean arcane signatures and inexplicable symbols, biblical creation-by-word. Distinct from sacred_names (the ontological power of names themselves) and prayer (address to the divine); word_power_incantation is the magical-causal efficacy of the spoken word as such."
ancestor_veneration = "Ritual maintenance of relationship with the dead as ongoing presences whose favour is cultivated and whose offence is propitiated. Shinto uji-gami and obon, Norse disir and the alfablot, Celtic samhain and the feast for the deceased, Roman lares and parentalia, Chinese ancestor rites, Vedic śrāddha. Practice-coded rather than belief-coded: distinct from soul_migration (cosmological doctrine of soul-transmigration) and theosis_deification (deification trajectory); ancestor_veneration centres the living's ongoing ritual obligation to the dead."
funerary_navigation = "Texts and rituals guiding the soul through death."
theurgy = "Iamblichean ritual practice that engages the gods directly through consecrated material symbols and actions, on the premise that divine power descends into properly prepared matter — distinct from philosophical contemplation alone."
prayer = "Direct address to the divine, whether petitionary, contemplative, or liturgical; speech and silence offered upward."
spirit_conjuration = "The grimoire-tradition practice of ceremonially commanding or binding a spirit through consecrated seals, circles, divine names, and prescribed instruments, compelling its appearance and obedience. Distinct from theurgy in the direction of the power relationship — theurgy is reverent engagement with the gods on the premise of the operator's own ascent, this is subordination of a lesser spirit to the operator's will — and from word_power_incantation and sacred_names, which name components (verbal force, name-power) this practice deploys rather than the ritual structure itself."
exorcism = "A ritual intended to drive out an unwanted possessing or afflicting spirit from a person or place, restoring it to its unafflicted state. Distinct from spirit_conjuration (the operator summons and binds a spirit that was not already present, rather than expelling one) and from possession (the affliction this ritual answers, not the ritual itself)."
psychic_attack = "The doctrine and practice of one person deliberately inflicting harm on another through trained will, mind-power, or occult technique alone, without physical contact — producing exhaustion, illness, breakdown, or death in the victim; recognised cross-culturally as witchcraft, hexing, or the evil eye, and treated in Western esotericism as a genuine occult hazard requiring diagnosis and defence rather than dismissed as superstition. Distinct from magical_will (the general doctrine that trained volition has causal power, of which this is one malevolent application) and from spirit_conjuration (which subordinates an already-existing summoned spirit, rather than directing the operator's own power at a person)."
left_hand_path = "A magical or spiritual orientation that turns occult power toward self-aggrandizement, domination, or personal ends divorced from — or actively opposed to — service of the divine, contrasted with the Right-hand Path's use of the same powers in reverent service and selfless healing. Distinct from psychic_attack (one specific malevolent technique this orientation may employ, not the standing orientation itself) and forbidden_knowledge (a transgression-against-divine-prohibition narrative, not an ongoing praxis-orientation)."
right_hand_path = "A magical or spiritual orientation that directs occult power toward reverent service of the divine and the welfare of others, in disciplined subordination to a moral code — the positive complement to the Left-hand Path's self-aggrandizement, and the orientation an initiatory order upholds in barring seduction, extortion, and the sale of initiation for gain. Distinct from left_hand_path (the opposing orientation this concept mirrors) and theurgy (a specific ritual technique of divine engagement, not the standing ethical orientation of the practitioner)."
artificial_elemental = "The magical manufacture of a semi-autonomous entity from the operator's own creative mind-stuff, formulated with sufficient force and sustained attention that it acquires a distinct, independent life of its own beyond an ordinary passing thought-form — directable as tool, weapon, or guardian, but capable of escaping the operator's control if mishandled. Distinct from spirit_conjuration (binding a spirit that already exists, rather than manufacturing one) and from word_power_incantation (the causal force of the spoken word itself, rather than the sustained mental construction of an entity)."
talisman_magic = "The consecration of an inscribed physical object — seal, pentacle, amulet, character, or figure — so that it holds and channels magical power independent of any ongoing spoken formula, protecting, attracting, or acting on its bearer's behalf. Distinct from sacred_names (the power resides in the name itself, spoken or written, not in a dedicated physical vessel) and from spirit_conjuration (the object is not commanding or binding a spirit but is itself the locus of power)."
magical_absorption = "A high-grade defensive technique in which the operator, having steadied their own vibrations through meditation on the offending force's moral opposite, deliberately draws a hostile thought-form or psychic attack into themselves to neutralise it at its root, rather than merely dispelling or banishing it outward. Distinct from exorcism (expelling an affliction outward, not absorbing it inward) and magical_will (the general causal-power-of-volition doctrine this technique is one advanced application of)."
divination = "The ritual practice of discerning hidden knowledge — future events, concealed causes, or the will of higher powers — through a structured technique applied to cards, lots, astrological configuration, entrails, oracle, or other sortilege, rather than through direct unmediated insight. Distinct from gnosis_direct_knowledge (unmediated inner apprehension of ultimate truth, not a technique applied to an external medium) and cosmic_sympathy (the underlying doctrine of hidden affinity that many divinatory techniques presuppose, rather than the practice of consulting it)."
initiation = "The ritual admission of an individual into esoteric knowledge or a sacred order through a formal rite of passage — testing, ordeal, or ceremony — marking a definite before/after threshold in the initiate's status and access. Distinct from hidden_sayings (the doctrine being concealed, not the rite of admission to it) and esoteric_lineage (the historical chain of transmission across generations, not a single individual's admission)."

[concepts.praxis.ascetic_discipline]
fasting_and_prayer = "Ascetic disciplines that prepare the body and mind for spiritual receptivity or purification."
ritual_purity = "The maintenance of a state of cleanliness—physical, moral, or spiritual—required for encounter with the divine."
self_examination = "Daily review of thought and action as spiritual practice."

[concepts.praxis.ecstatic_modes]
heroic_furor = "Bruno's eroici furori — a passionate, ennobling spiritual ardor that drives the soul toward divine wisdom; distinguished from base or animal passions by its orientation to infinite truth."
divine_intoxication = "Ecstatic, non-rational receptivity to the divine figured as drunkenness — Plato's symposium wine, Rumi's sukr, Eckhart's 'sober drunkenness'; the passive/receptive metaphor for divine encounter, distinct from divine_madness's active possessing rapture."
shamanic_journey = "The living practitioner's deliberate trance-journey into spirit, underworld, or upper realms — Lemminkainen's descent into Tuoni and Wainamoinen's entry into Wipunen's body in the Kalevala, the Siberian shaman's drum-mediated travel, Inuit angakkuq's submarine journey to Sedna, classical katabasis as ritual technique. The practitioner returns with knowledge, songs, lost-words, or a recovered soul. Distinct from psychopomp_journey (which guides the *dead* soul through afterlife realms) and from spiritual_ascent (which is the soul's *upward* return to source); shamanic_journey is the *living* practitioner crossing into ordinarily-inaccessible domains as a worked technique."

[concepts.praxis.transformative_path]
alchemical_work = "The transformation of base substance — outer matter or the inner soul — into a purified, perfected, or 'gold' state; the magnum opus as both laboratory practice and spiritual allegory."
spiritual_ascent = "A staged journey of the soul upward through heavenly realms or levels of being toward the divine source."
magical_will = "The doctrine that human volition, cultivated by discipline and emancipated from passion and servitude, is the primary instrument of magical operation — will confirmed by persistent acts acquires causal power over self, others, and nature; distinct from faith and from mere desire."

[concepts.anthropology.divine_indwelling]
inner_light = "The divine spark or luminous quality residing within the human person, potentially recognisable through introspection."
higher_self = "The deeper aspect of the individual's own consciousness aligned with divine or spiritual truth, distinct from the ego or everyday personality — a locus of guidance and identity that can speak with its own recognisable 'voice' in moments of crisis, carrying memory or knowledge the ordinary self lacks. Distinct from inner_light (a static luminous quality or spark, not an alternate seat of identity and agency) and kingdom_within (the claim that the divine realm generally is present inside the individual, not this specific personal higher consciousness)."
inner_voice = "A channel of guidance received internally as a distinct voice or clear reply, addressable and answerable in dialogue, whose source — the practitioner's own higher consciousness, or an external discarnate or non-human intelligence — may be genuinely unknown to the one who receives it. Distinct from higher_self (one possible but not certain source of this voice, not the channel itself) and gnosis_direct_knowledge (unmediated apprehension of ultimate truth, not a two-way dialogic exchange with an addressable interlocutor)."
kingdom_within = "The claim that the divine realm is present inside the individual, accessible without external mediation."
birth_of_word_in_soul = "Eckhart's signature doctrine that the Father eternally begets the Son in the ground of the soul; the human interior as the actual site of the divine generative act, distinct from inner_light's static indwelling."

[concepts.anthropology.human_constitution]
tripartite_soul = "Division of the human being into three principles: spirit (pneuma), soul (psyche), and body/matter (hyle or soma)."
body_as_obstacle = "The material body viewed as a prison, tomb, or source of error that hinders spiritual knowledge and return."
mechanical_humanity = "Gurdjieff and Ouspensky's claim that ordinary human beings live in a state of waking sleep, reacting mechanically without unified will or consciousness, and that the spiritual path begins with recognising this condition."
linga_sharira = "The persistent form or image of a human being that exists from birth to death, distinct from the impermanent physical matter."
aura = "The subtle energy field or membrane surrounding the physical body, described across occultism as a protective boundary and interface through which psychic influence, suggestion, or attack must pass to reach the person within — pierced from within by the victim's own fear or desire, rather than breached from outside by force alone. Distinct from etheric_projection (the double's active departure FROM the body, not a boundary AROUND it) and linga_sharira (the persistent template-form of the subtle body, not its protective perimeter)."
psychic_vampirism = "The condition, often unconscious on the vampire's part, in which one person chronically drains the vital force of another in close relationship, leaving the victim persistently exhausted or ill while the vampire is sustained. Distinct from psychic_attack in mechanism (a parasitic, often unintentional energy-transfer within an ongoing relationship, rather than a deliberate willed assault) and in being a chronic condition rather than a discrete event."
etheric_projection = "The doctrine and practice by which the etheric or astral double separates from the physical body, at will or involuntarily, to act, travel, or encounter other entities on a plane subtler than the physical — remaining tethered to the body by a silver cord, and capable of returning physical injury (bruises, exhaustion) sustained while thus projected. Distinct from linga_sharira (the static doctrine that a subtle form persists as a template) in describing its active operative use, and from shamanic_journey (a trance-journey framed within a shamanic ritual complex, undertaken to return with knowledge, songs, or a recovered soul) in being a Western-esoteric technical practice with its own physiology of cord-attachment and reciprocal wounding."
astral_vision = "The perceptual faculty by which a trained practitioner directly sees phenomena on the astral plane — thought-forms, rapport-cords, auras, subtle entities — as visible forms, invisible to ordinary physical sight. Distinct from etheric_projection (the double's own active departure from the body, not a faculty for perceiving other things) and astral_light (the medium being perceived, not the faculty that perceives it)."
telepathy = "The direct transmission of thought, will, or information from one mind to another without physical sensory channels — visualising the intended recipient and addressing them by name being the standard technique for establishing the contact. Distinct from astral_light (the ambient transmitting medium telepathy may operate through, not the mind-to-mind practice itself) and cosmic_sympathy (the general metaphysical doctrine of hidden affinity between all things, of which telepathy is one specific, deliberately-worked mind-to-mind application)."

[concepts.anthropology.spiritual_completion]
opposites_transcended = "The dissolution of binary oppositions (male/female, inner/outer, above/below) as a mark of spiritual completion."
childlike_innocence = "The infant or child as symbol of the unfallen, undivided spiritual state; return to primordial simplicity."
poverty_of_spirit = "Eckhart's radical reading of Matthew 5:3 — the saint as one who wants nothing, knows nothing, and has nothing, having emptied even the will and the self with which to receive God; distinct from renunciation_of_wealth (material poverty)."
cosmic_consciousness = "A state of awareness transcending ordinary human consciousness, often involving unity with the universe or higher dimensions."

[concepts.ethics.moral_teaching]
renunciation_of_wealth = "The spiritual danger of attachment to material possessions; wealth as a spiritual obstacle."
love_of_neighbour = "Active compassionate care for others as a central spiritual obligation or expression of divine love."
rejection_of_hypocrisy = "Critique of outward religious observance that lacks inner transformation; form without substance."
paradox_as_teaching = "Using apparent contradiction, reversal, or riddle to destabilise ordinary understanding and induce insight."
good_thought_word_deed = "The Zoroastrian triad of right thought, right speech, and right action as the foundation of ethical life; truth-in-living."
prophetic_rejection = "The phenomenon where spiritual messengers or healers are rejected by their own community due to familiarity or lack of awe."

# ============================================================
# CONCEPT ALIASES
# ============================================================
# Natural-language synonyms that map a user query to a canonical concept via the
# graph leg (extractConcepts -> walkGraph), complementing the lexical leg.
#
# CRITERION (matcher = GRAPH_MATCH_MODE=regex, the default since 2026-05-29):
# word-boundary, case-insensitive (~*). An alias fires only on a WHOLE-WORD query
# match, so short forms no longer substring-collide ("mania" no longer fires on
# "man"). STILL true: a MULTI-WORD alias fires on each of its whole words, so a
# phrase with a common word over-fires ("dark night of the soul" -> "soul",
# "sacred marriage" -> "sacred", "the one" -> "one"). So prefer the rare/foreign
# token (hieros gamos, via negativa, deus absconditus) over the English phrase
# variant, and skip aliases already in the title-cased label (it self-matches).
# Highest value is foreign/transliterated terms, where the user's word isn't the
# corpus's word. List ALL hyphen/space/apostrophe spellings — the tokenizer does
# NOT bridge them. Stored lowercase (CHECK alias = LOWER(alias); tidy, though ~*
# is case-insensitive). The other ~62 concepts have plain-English self-matching
# labels (divine_light, prayer, covenant, logos, monad, correspondence, ...) and
# deliberately get none. Refined per downstream-matcher audit, 2026-05-29.
[concept_aliases]

# — alternate spelling / transliteration (the core recall gain) —
sefirot_tree = ["sephirot_tree"]
sephirot = ["sefirot", "sefiroth"]
ein_sof = ["ein-sof", "einsof", "ein soph", "ayn sof"]
tzimtzum = ["tsimtsum", "zimzum"]
maat_cosmic_order = ["ma'at", "maat"]
asha_cosmic_order = ["arta"]
ahura_mazda_principle = ["ohrmazd", "hormazd"]
angra_mainyu_principle = ["ahriman"]
frashokereti = ["frashegird", "frashokart"]
apocatastasis = ["apokatastasis"]       # thin: target has ~1 EXPRESSES edge
fana_annihilation = ["fana", "fana'", "fanaa"]
wu_wei = ["wu-wei", "wuwei"]
sunyata_emptiness = ["shunyata", "sunnata"]
linga_sharira = ["linga-sarira"]        # thin: target has ~1 EXPRESSES edge

# — foreign / technical term the label renames or buries (fires precisely) —
gnosis_direct_knowledge = ["gnosis"]
demiurge = ["yaldabaoth", "saklas", "nebro"]
cosmic_sympathy = ["sympatheia"]
mystical_union = ["unio mystica"]
ladder_of_love = ["scala amoris"]
divine_hiddenness = ["deus absconditus"]
return_to_source = ["reditus"]
detachment_gelassenheit = ["gelassenheit"]
heroic_furor = ["eroici furori", "furore"]
divine_intoxication = ["sukr"]
dharma = ["svadharma"]
divine_marriage = ["hieros gamos"]
divine_madness = ["mania"]
theosis_deification = ["divinization", "divinisation"]
apophatic_theology = ["via negativa"]
emanation_hierarchy = ["emanation"]

# — common name not in the label (precise single tokens / rare compounds) —
soul_migration = ["transmigration", "metempsychosis", "reincarnation"]
psychopomp_journey = ["psychopomp"]
anamnesis = ["recollection"]
watchers_descent = ["nephilim"]
alchemical_work = ["alchemy", "magnum opus"]

# — seeker-vocabulary gaps surfaced by the golden-set retrieval review
#   (todo:697f9e58). Each: a DISTINCTIVE term absent from the concept label,
#   routing to a well-tagged concept. Deliberately conservative — generic tokens
#   ("mind", "divine", "one", "word") are omitted because the per-word matcher
#   would over-fire them. Terms whose word already sits in the label are skipped
#   (self-match). NOTE: this pass cannot help wu_wei (concept has 0 EXPRESSES
#   edges — a tagging gap, not an alias gap) or "nous"→Corpus-Hermeticum
#   (that text expresses logos, not mentalism); see the ticket.
mentalism = ["nous", "universal mind"]
correspondence = ["as above so below"]
numerical_mysticism = ["gematria", "isopsephy"]
world_tree_axis = ["axis mundi"]
opposites_transcended = ["coincidentia oppositorum"]
evil_as_privation = ["privatio boni"]
spirit_conjuration = ["evocation"]

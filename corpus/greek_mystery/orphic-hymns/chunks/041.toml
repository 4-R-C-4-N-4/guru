[content]
body = "XLI. TO MISES. The FUMIGATION from STORAX. Call Thesmophorus * , spermatic God, Of various names, who bears the leafy rod: Mises, ineffable, pure, sacred queen, Two-fold Iacchus, male and female seen: Illustr'ous, whether to rejoice is thine In incense offer'd, in the fane divine + ; Or if in Phrygia most thy soul delights, Performing with thy mother sacred rites; Or if the land of Cyprus is thy care, Well pleas'd to dwell with Cytherea fair; 10 p. 174 Or if exulting in the fertile plains With thy dark mother Isis, where she reigns, 12 p. 175 With nurses pure attended, near the flood Of sacred Egypt, thy divine abode: p. 176 Wherever resident, blest pow'r attend, 15 And with benignant mind these labours end."


[content]
body = "III. TO HEAVEN. The FUMIGATION from FRANKINCENSE. GREAT Heav'n, whose mighty frame no respite knows, Father of all, from whom the world arose: Hear, bounteous parent, source and end of all, Forever whirling round this earthly ball; Abode of Gods, whose guardian pow'r surrounds 5 5 Th' eternal World with ever during bounds; p. 117 Whose ample bosom and encircling folds The dire necessity of nature holds. Ætherial, earthly, whose all-various frame 9 Azure and full of forms, no power can tame. 10 All-seeing Heav'n, progenitor of Time * , Forever blessed, deity sublime, Propitious on a novel mystic shine, And crown his wishes with a life divine."


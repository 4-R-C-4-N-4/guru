[content]
body = "VIII. TO THE MOON * . The FUMIGATION from AROMATICS. HEAR, Goddess queen, diffusing silver light, Bull-horn'd and wand'ring thro' the gloom of Night. 2 p. 125 With stars surrounded, and with circuit wide Night's torch extending, thro' the heav'ns you ride: Female and Male with borrow'd rays you shine, 5 5 And now full-orb'd, now tending to decline. Mother of ages, fruit-producing Moon, Whose amber orb makes Night's reflected noon: p. 126 Lover of horses, splendid, queen of Night, All-seeing pow'r bedeck'd with starry light. 10 Lover of vigilance, the foe of strife, In peace rejoicing, and a prudent life: Fair lamp of Night, its ornament and friend, Who giv'st to Nature's works their destin'd end. 14 Queen of the stars, all-wife Diana hail! 15 Deck'd with a graceful robe and shining veil; Come, blessed Goddess, prudent, starry, bright, Come moony-lamp with chaste and splendid light, Shine on these sacred rites with prosp'rous rays, And pleas'd accept thy suppliant's mystic praise."


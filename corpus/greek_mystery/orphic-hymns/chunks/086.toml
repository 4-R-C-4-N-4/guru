[content]
body = "LXXXVI. TO DEATH. The FUMIGATION from MANNA. HEAR me, O Death, whose empire unconfin'd, Extends to mortal tribes of ev'ry kind. On thee, the portion of our time depends, Whose absence lengthens life, whose presence ends. p. 225 Thy sleep perpetual bursts the vivid folds, 5 By which the soul, attracting body holds: 6 p. 226 Common to all of ev'ry sex and age, For nought escapes thy all-destructive rage; p. 227 Not youth itself thy clemency can gain, Vig'rous and strong, by thee untimely slain. 10 In thee, the end of nature's works is known, In thee, all judgment is absolv'd alone: No suppliant arts thy dreadful rage controul, No vows revoke the purpose of thy soul; O blessed pow'r regard my ardent pray'r, 15 And human life to age abundant spare. THE END."


[content]
body = "LXXV. TO THE MUSES. The FUMIGATION from FRANKINCENSE. Daughters of Jove, dire-sounding and divine, 1 Renown'd Pierian, sweetly speaking Nine; p. 206 To those whose breasts your sacred furies fire Much-form'd, the objects of supreme desire: p. 207 Sources of blameless virtue to mankind, 5 Who form to excellence the youthful mind; p. 208 Who nurse the soul, and give her to descry The paths of right with Reason's steady eye. p. 209 Commanding queens who lead to sacred light The intellect refin'd from Error's night; 10 p. 210 And to mankind each holy rite disclose, For mystic knowledge from your nature flows. p. 211 Clio, and Erato, who charms the sight, With thee Euterpe minist'ring delight: p. 212 Thalia flourishing, Polymina fam'd, 15 Melpomene from skill in music nam'd: p. 213 Terpischore, Urania heav'nly bright, With thee * who gav'st me to behold the light. Come, venerable, various, pow'rs divine, With fav'ring aspect on your mystics shine; 20 Bring glorious, ardent, lovely, fam'd desire, And warm my bosom with your sacred fire."


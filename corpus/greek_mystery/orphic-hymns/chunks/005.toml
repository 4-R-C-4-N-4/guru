[content]
body = "V. TO PROTOGONUS, Or the FIRST-BORN. The FUMIGATION from MYRRH. O Mighty first-begotten, hear my pray'r, 1 Two-fold, egg-born, and wand'ring thro' the air, p. 119 Bull-roarer, glorying in thy golden wings, 3 From whom the race of Gods and mortals springs. p. 120 Ericapæus, celebrated pow'r, 5 Ineffable, occult, all shining flow'r. From eyes obscure thou wip'st the gloom of night, All-spreading splendour, pure and holy light Hence Phanes call'd, the glory of the sky, On waving pinions thro' the world you fly. 10 Priapus, dark-ey'd splendour, thee I sing, Genial, all-prudent, ever-blessed king, p. 121 With joyful aspect on our rights divine And holy sacrifice propitious shine."


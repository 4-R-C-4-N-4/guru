[content]
body = "XXXVIII. TO CORYBAS * The FUMIGATION from FRANKINCENSE. THE mighty ruler of this earthly ball, For ever flowing, to these rites I call; p. 170 Martial and blest, unseen by mortal sight, Preventing fears, and pleas'd with gloomy night: Hence, fancy's terrors are by thee allay'd, 5 All-various king, who lov'st the desart shade: Each of thy brothers killing, blood is thine, Two-fold Curete, many-form'd, divine. By thee transmuted Ceres' body pure, Became a dragon's savage and obscure: 10 Avert thy anger, hear me when I pray, And by fix'd fate, drive fancy's fears away."


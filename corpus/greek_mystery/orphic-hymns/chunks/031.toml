[content]
body = "XXXI. TO PALLAS. A HYMN. ONLY-Begotten, noble race of Jove, Blessed and fierce, who joy'st in caves to rove: 2 p. 157 O, warlike Pallas, whose illustrious kind, Ineffable and effable we find: Magnanimous and fam'd, the rocky height, 5 And groves, and shady mountains thee delight: In arms rejoicing, who with Furies dire And wild, the souls of mortals dost inspire. Gymnastic virgin of terrific mind, Dire Gorgons bane, unmarried, blessed, kind: 10 Mother of arts, imperious; understood, Rage to the wicked., wisdom to the good: Female and male, the arts of war are thine, Fanatic, much-form'd dragoness, divine: 14 O'er the Phlegrean giants rous'd to ire, 15 15 Thy coursers driving, with destruction dire. p. 158 Sprung from the head of Jove, of splendid mien, Purger of evils, all-victorious queen. p. 159 Hear me, O Goddess, when to thee I pray, With supplicating voice both night and day, 20 p. 160 And in my latest hour, peace and health, Propitious times, and necessary wealth, And, ever present, be thy vot'ries aid, O, much implor'd, art's parent, blue eyed maid."


[content]
body = "LXXXIII. TO VESTA. The FUMIGATION from AROMATICS. Daughter of Saturn, venerable dame, The seat containing of unweary'd flame; 2 p. 221 In sacred rites these ministers are thine, Mystics much-blessed, holy and divine In thee, the Gods have fix'd place, 5 Strong, stable, basis of the mortal race: Eternal, much-form'd ever-florid queen, Laughing and blessed, and of lovely mien; 8 p. 222 Accept these rites, accord each just desire, And gentle health, and needful good inspire."


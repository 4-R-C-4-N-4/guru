[content]
body = "LXXVI. To MNEMOSYNE, or the GODDESS of MEMORY * . The FUMIGATION from FRANKINCENSE. THE consort I invoke of Jove divine, Source of the holy, sweetly-speaking Nine; p. 215 Free from th' oblivion of the fallen mind, By whom the soul with intellect is join'd: Reason's increase, and thought to thee belong, 5 All-powerful, pleasant, vigilant, and strong: 'Tis thine, to waken from lethargic rest All thoughts deposited within the breast; And nought neglecting, vigorous to excite The mental eye from dark oblivion's night. 10 Come, blessed power, thy mystic's mem'ry wake To holy rites, and Lethe's fetters break."


[content]
body = "XIII. TO RHEA * . The FUMIGATION from AROMATICS. DAUGHTER of great Protogonus, divine, 1 Illustrious Rhea, to my pray'r incline, p. 138 Who driv'st thy holy car with speed along, Drawn by fierce lions, terrible and strong. 4 Mother of Jove, whose mighty arm can wield 5 Th' avenging bolt, and shake the dreadful shield. Drum-beating, frantic, of a splendid mien, 7 Brass-sounding, honor'd, Saturn's blessed queen. Thou joy'st in mountains and tumultuous fight, And mankind's horrid howlings, thee delight. 10 p. 139 War's parent, mighty, of majestic frame, Deceitful saviour, liberating dame. 12 Mother of Gods and men, from whom the earth And lofty heav'ns derive their glorious birth; Th' ætherial gales, the deeply spreading sea 15 Goddess ærial form'd, proceed from thee. Come, pleas'd with wand'rings, blessed and divine, With peace attended on our labours shine; Bring rich abundance, and wherever found Drive dire disease, to earth's remotest bound. 20"


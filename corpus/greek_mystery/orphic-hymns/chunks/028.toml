[content]
body = "XXVIII. TO PROSERPINE. A HYMN DAUGHTER of Jove, almighty and divine, Come, blessed queen, and to these rites incline: Only-begotten, Pluto's honor'd wife, 3 O venerable Goddess, source of life: 'Tis thine in earth's profundities to dwell, 5 Fast by the wide and dismal gates of hell: Jove's holy offspring, of a beauteous mien, Fatal, with lovely locks, infernal queen: Source of the furies, whose blest frame proceeds From Jove's ineffable and secret seeds: 10 Mother of Bacchus, Sonorous, divine, And many-form'd, the parent of the vine: The dancing Hours attend thee, essence bright, All-ruling virgin, bearing heav'nly light: p. 154 Illustrious, horned, of a bounteous mind, 13 Alone desir'd by those of mortal kind. O, vernal queen, whom grassy plains delight, Sweet to the smell, and pleasing to the sight: Whose holy form in budding fruits we view, Earth's vig'rous offspring of a various hue: 20 Espous'd in Autumn: life and death alone 21 To wretched mortals from thy power is known: For thine the task according to thy will, 23 Life to produce, and all that lives to kill. p. 155 Hear, blessed Goddess, send a rich increase 25 Of various fruits from earth, with lovely Peace; Send Health with gentle hand, and crown my life With blest abundance, free from noisy strife; Last in extreme old age the prey of Death, Dismiss we willing to the realms beneath, 30 To thy fair palace, and the blissful plains Where happy spirits dwell, and Pluto reigns."


[content]
body = "X. TO PAN * The FUMIGATION from VARIOUS ODORS I Call strong Pan, the substance of the whole, Etherial, marine, earthly, general soul, Immortal fire; for all the world is thine, And all are parts of thee, O pow'r divine. p. 131 Come, blessed Pan, whom rural haunts delight, 5 Come, leaping, agile, wand'ring, starry light; The Hours and Seasons, wait thy high command, And round thy throne in graceful order stand. Goat-footed, horned, Bacchanalian Pan, Fanatic pow'r, from whom the world began, 10 Whose various parts by thee inspir'd, combine In endless dance and melody divine. In thee a refuge from our fears we find, Those fears peculiar to the human kind. Thee shepherds, streams of water, goats rejoice, 15 Thou. lov'st the chace, and Echo's secret voice: 16 The sportive nymphs, thy ev'ry step attend, 17 And all thy works fulfill their destin'd end. O all-producing pow'r, much-fam'd, divine, The world's great ruler, rich increase is thine. 20 All-fertile Pæan, heav'nly splendor pure, In fruits rejoicing, and in caves obscure. 22 p. 132 True serpent-horned Jove, whose dreadful rage 23 When rous'd, 'tis hard for mortals to asswage. By thee the earth wide-bosom'd deep and long, 25 Stands on a basis permanent and strong. Th' unwearied waters of the rolling sea, Profoundly spreading, yield to thy decree. Old Ocean too reveres thy high command, Whose liquid arms begirt the solid land. 30 The spacious air, whose nutrimental fire, And vivid blasts, the heat of life inspire The lighter frame of fire, whose sparkling eye Shines on the summit of the azure sky, Submit alike to thee, whole general sway 35 All parts of matter, various form'd obey. p. 133 All nature's change thro' thy protecting care, And all mankind thy lib'ral bounties share: For these where'er dispers'd thro' boundless space, Still find thy providence support their race. 40 Come, Bacchanalian, blessed power draw near, Fanatic Pan, thy humble suppliant hear, Propitious to these holy rites attend, And grant my life may meet a prosp'rous end; Drive panic Fury too, wherever found, 55 From human kind, to earth's remotest bound."


[content]
body = "LXI. TO JUSTICE. The FUMIGATION from FRANKINCENSE. THE piercing eye of Justice bright, I sing, 1 Plac'd by the throne of heav'n's almighty king, p. 194 Perceiving thence, with vision unconfin'd, The life and conduct of the human kind To thee, revenge and punishment belong, 5 Chastising ev'ry deed, unjust and wrong; Whose pow'r alone, dissimilars can join, And from th' equality of truth combine: For all the ill, persuasion can inspire, When urging bad designs, with counsel dire, 10 'Tis thine alone to punish; with the race Of lawless passions, and incentives base; For thou art ever to the good inclin'd, And hostile to the men of evil mind. Come, all-propitious, and thy suppliant hear, 15 When Fate's predestin'd, final hour draws near."


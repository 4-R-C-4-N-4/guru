body = "[41:45] And Pharaoh called Joseph’s name Zaphenath-paneah; and he gave him to wife Asenath, the daughter of Poti-phera priest of On. And Joseph went out over the land of Egypt.\n\n[41:46] And Joseph was thirty years old when he stood before Pharaoh king of Egypt. And Joseph went out from the presence of Pharaoh, and went throughout all the land of Egypt.\n\n[41:47] And in the seven plenteous years the earth brought forth by handfuls.\n\n[41:48] And he gathered up all the food of the seven years which were in the land of Egypt, and laid up the food in the cities: the food of the field, which was round about every city, laid he up in the same.\n\n[41:49] And Joseph laid up grain as the sand of the sea, very much, until he left off numbering; for it was without number.\n\n[41:50] And unto Joseph were born two sons before the year of famine came, whom Asenath, the daughter of Poti-phera priest of On, bare unto him.\n\n[41:51] And Joseph called the name of the first-born Manasseh: For, said he, God hath made me forget all my toil, and all my father’s house.\n\n[41:52] And the name of the second called he Ephraim: For God hath made me fruitful in the land of my affliction.\n\n[41:53] And the seven years of plenty, that was in the land of Egypt, came to an end.\n\n[41:54] And the seven years of famine began to come, according as Joseph had said: and there was famine in all lands; but in all the land of Egypt there was bread.\n\n[41:55] And when all the land of Egypt was famished, the people cried to Pharaoh for bread: and Pharaoh said unto all the Egyptians, Go unto Joseph; what he saith to you, do.\n\n[41:56] And the famine was over all the face of the earth: and Joseph opened all the store-houses, and sold unto the Egyptians; and the famine was sore in the land of Egypt.\n\n[41:57] And all countries came into Egypt to Joseph to buy grain, because the famine was sore in all the earth.\n\n[42:1] Now Jacob saw that there was grain in Egypt, and Jacob said unto his sons, Why do ye look one upon another?\n\n[42:2] And he said, Behold, I have heard that there is grain in Egypt: get you down thither, and buy for us from thence; that we may live, and not die.\n\n[42:3] And Joseph’s ten brethren went down to buy grain from Egypt.\n\n[42:4] But Benjamin, Joseph’s brother, Jacob sent not with his brethren; for he said, Lest peradventure harm befall him.\n\n[42:5] And the sons of Israel came to buy among those that came: for the famine was in the land of Canaan.\n\n[42:6] And Joseph was the governor over the land; he it was that sold to all the people of the land. And Joseph’s brethren came, and bowed down themselves to him with their faces to the earth.\n\n[42:7] And Joseph saw his brethren, and he knew them, but made himself strange unto them, and spake roughly with them; and he said unto them, Whence come ye? And they said, From the land of Canaan to buy food.\n\n[42:8] And Joseph knew his brethren, but they knew not him.\n\n[42:9] And Joseph remembered the dreams which he dreamed of them, and said unto them, Ye are spies; to see the nakedness of the land ye are come."


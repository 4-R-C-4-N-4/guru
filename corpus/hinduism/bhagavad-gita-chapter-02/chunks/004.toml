[content]
body = "For his mind is steady whose senses are under his control.\n\nThe man who ponders over objects of sense forms an attachment to them; from (that) attachment is produced desire; and from desire anger is produced ; from anger results want of discrimination ; from want of discrimination, confusion of the memory; from confusion of the memory, loss of reason; and in consequence of loss of reason.\n\nhe is utterly ruined.\n\nBut the self-restrained man who moves among objects with senses under the control of his own self, and free from affection and aversion, obtains tranquillity .\n\nWhen there is tranquillity, all his miseries are destroyed, for the mind of him whose heart is tranquil soon becomes steady.\n\nHe who is not self-restrained has no steadiness of mind; nor has he who is not self-restrained perseverance in the pursuit of self-knowledge; there is no tranquillity for him who does not persevere in the pursuit of self-knowledge; and whence can there be happiness for one who is not tranquil?\n\nFor the heart which follows the rambling senses leads away his judgment, as the wind leads a boat astray upon the waters.\n\nTherefore, O you of mighty arms!\n\nhis mind is steady whose senses are restrained on all sides from objects of sense.\n\nThe self-restrained man is awake, when it is night for all beings; and when all beings are awake, that is the night of the right-seeing sage .\n\nHe into whom all objects of desire enter, as waters enter the ocean, which, (though) replenished, (still) keeps its position unmoved,-he only obtains tranquillity; not he who desires (those) objects of desire.\n\nThe man who, casting off all desires, lives free from attachments, who is free from egoism , and from (the feeling that this or that is) mine , obtains tranquillity.\n\nThis, O son of P ri thâ!\n\nis the Brahmic state; attaining to this, one is never deluded; and remaining in it in (one's) last moments, one attains (brahma-nirvâ n a) the Brahmic bliss ."


[content]
body = "It is not born, nor does it ever die, nor, having existed, does it exist no more.\n\nUnborn, everlasting, unchangeable, and primeval, it is not killed when the body is killed .\n\nO son of P ri thâ!\n\nhow can that man who knows it thus to be indestructible, everlasting, unborn, and inexhaustible, how and whom can he kill, whom can he cause to be killed?\n\nAs a man, casting off old clothes, puts on others and new ones, so the embodied (self) casting off old bodies, goes to others and new ones.\n\nWeapons do not divide it (into pieces); fire does not burn it, waters do not moisten it; the wind does not dry it up.\n\nIt is not divisible; it is not combustible; it is not to be moistened; it is not to be dried up.\n\nIt is everlasting, all-pervading, stable, firm, and eternal .\n\nIt is said to be unperceived, to be unthinkable, to be unchangeable.\n\nTherefore knowing it to be such, you ought not to grieve, But even if you think that it is constantly born, and constantly dies, still, O you of mighty arms!\n\nyou ought not to grieve thus.\n\nFor to one that is born, death is certain; and to one that dies, birth is certain .\n\nTherefore about (this) unavoidable thing, you ought not to grieve.\n\nThe source of things, O descendant of Bharata!\n\nis unperceived; their middle state is perceived; and their end again is unperceived.\n\nWhat (occasion is there for any) lamentation regarding them ?\n\nOne looks upon it as a wonder; another similarly speaks of it as a wonder; another too hears of it as a wonder; and even after having heard of it, no one does really know it .\n\nThis embodied (self), O descendant of Bharata!\n\nwithin every one's body is ever indestructible.\n\nTherefore you ought not to grieve for any being.\n\nHaving regard to your own duty also, you ought not to falter, for there is nothing better for a Kshatriya than a righteous battle.\n\nHappy those Kshatriyas, O son of P ri thâ!\n\nwho can find such a battle (to fight)--come of itself --an open door to heaven!\n\nBut if you will not fight this righteous battle, then you will have abandoned your own duty and your fame, and you will incur sin.\n\nAll beings, too, will tell of your everlasting infamy; and to one who has been honoured, infamy is (a) greater (evil) than death.\n\n(Warriors who are) masters of great cars will think that you abstained from the battle through fear, and having been highly thought of by them, you will fall down to littleness.\n\nYour enemies, too, decrying your power, will speak much about you that should not be spoken.\n\nAnd what, indeed, more lamentable than that?\n\nKilled, you will obtain heaven; victorious, you will enjoy the earth.\n\nTherefore arise, O son of Kuntî!\n\nresolved to (engage in) battle.\n\nLooking alike on pleasure and pain, on gain and loss, on victory and defeat, then prepare for battle, and thus you will not incur sin.\n\nThe knowledge here declared to you is that relating to the Sâ n khya, .\n\nNow hear that relating to the Yoga.\n\nPossessed of this knowledge, O son of P ri thâ!\n\nyou will cast off the bonds of action.\n\nIn this (path to final emancipation) nothing that is commenced becomes abortive; no obstacles exist; and even a little of this (form of ) piety protects one from great danger .\n\nThere is here , O descendant of Kuru!\n\nbut one state of mind consisting in firm understanding."


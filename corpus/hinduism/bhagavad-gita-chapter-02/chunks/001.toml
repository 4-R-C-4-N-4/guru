[content]
body = "CHAPTER II.\n\nSañ g aya said: To him, who was thus overcome with pity, and dejected, and whose eyes were full of tears and turbid, the destroyer of Madhu spoke these words.\n\nThe Deity said: How (comes it that) this delusion, O Ar g una!\n\nwhich is discarded by the good, which excludes from heaven, and occasions infamy, has overtaken you in this (place of) peril?\n\nBe not effeminate, O son of P ri thâ!\n\nit is not worthy of you.\n\nCast off this base weakness of heart, and arise, O terror of (your) foes!\n\nAr g una said: How, O destroyer of Madhu!\n\nshall I encounter with arrows in the battle Bhîshma and Dro n a--both, O destroyer of enemies!\n\nentitled to reverence?\n\nNot killing (my) preceptors--(men) of great glory--it is better to live even on alms in this world.\n\nBut killing them, though they are avaricious of worldly goods, I should only enjoy blood-tainted enjoyments.\n\nNor do we know which of the two is better for us-whether that we should vanquish them, or that they should vanquish us.\n\nEven those, whom having killed, we do not wish to live--even those sons of Dh ri tarâsh t ra stand (arrayed) against us.\n\nWith a heart contaminated by the taint of helplessness , with a mind confounded about my duty, I ask you.\n\nTell me what is assuredly good for me.\n\nI am your disciple; instruct me, who have thrown myself on your (indulgence).\n\nFor I do not perceive what is to dispel that grief which will dry up my organs after I shall have obtained a prosperous kingdom on earth without a foe, or even the sovereignty of the gods .\n\nSañ g aya said: Having spoken thus to Hrishîkesa, O terror of (your) foes!\n\nGu d âke s a said to Govinda, 'I shall not engage in battle;' and verily remained silent.\n\nTo him thus desponding between the two armies, O descendant of Bharata!\n\nH ri shîkesa spoke these words with a slight smile.\n\nThe Deity said: You have grieved for those who deserve no grief, and you talk words of wisdom .\n\nLearned men grieve not for the living nor the dead.\n\nNever did I not exist, nor you, nor these rulers of men; nor will any one of us ever hereafter cease to be.\n\nAs, in this body, infancy and youth and old age (come) to the embodied (self) , so does the acquisition of another body; a sensible man is not deceived about that The contacts of the senses , O son of Kuntî!\n\nwhich produce cold and heat, pleasure and pain, are not permanent, they are ever coming and going.\n\nBear them, O descendant of Bharata!\n\nFor, O chief of men!\n\nthat sensible man whom they (pain and pleasure being alike to him) afflict not, he merits immortality.\n\nThere is no existence for that which is unreal; there is no non-existence for that which is real.\n\nAnd the (correct) conclusion about both is perceived by those who perceive the truth.\n\nKnow that to be indestructible which pervades all this; the destruction of that inexhaustible (principle) none can bring about.\n\nThese bodies appertaining to the embodied (self) which is eternal, indestructible, and indefinable, are said to be perishable; therefore do engage in battle, O descendant of Bharata!\n\nHe who thinks it to be the killer and he who thinks it to be killed, both know nothing.\n\nIt kills not, is not killed ."


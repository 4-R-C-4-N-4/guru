[content]
body = "CHAPTER VIII.\n\nAr g una said: What is that Brahman, what the Adhyâtma, and what, O best of beings!\n\nis action?\n\nAnd what is called the Adhibhûta?\n\nAnd who is the Adhiya g ña, and how in this body, O destroyer of Madhu?\n\nAnd how, too, are you to be known at the time of departure (from this world) by those who restrain their selfs?\n\nThe Deity said: The Brahman is the supreme, the indestructible.\n\nIts manifestation (as an individual self) is called the Adhyâtma.\n\nThe offering (of an oblation to any divinity), which is the cause of the production and development of all things, is named action.\n\nThe Adhibhûta is all perishable things.\n\nThe Adhidaivata is the (primal) being.\n\nAnd the Adhiya g ña, O best of embodied (beings)!\n\nis I myself in this body .\n\n[paragraph continues] And he who leaves this body and departs (from this world) remembering me in (his) last moments, comes into my essence.\n\nThere is no doubt of that.\n\nAlso whichever form (of deity) he remembers when he finally leaves this body, to that he goes, O son of Kuntî!\n\nhaving been used to ponder on it.\n\nTherefore, at all times remember me, and engage in battle.\n\nFixing your mind and understanding on me, you will come to me, there is no doubt.\n\nHe who thinks of the supreme divine Being, O son of P ri thâ!\n\nwith a mind not (running) to other (objects), and possessed of abstraction in the shape of continuous meditation (about the supreme), goes to him.\n\nHe who, possessed of reverence (for the supreme Being) with a steady mind, and with the power of devotion, properly concentrates the life-breath between the brows , and meditates on the ancient Seer, the ruler, more minute than the minutest atom , the supporter of all, who is of an unthinkable form, whose brilliance is like that of the sun, and who is beyond all darkness , he attains to that transcendent and divine Being.\n\nI will tell you briefly about the seat, which those who know the Vedas declare to be indestructible; which entered by ascetics from whom all desires have departed; and wishing for which, people pursue the mode of life of Brahma k ârins .\n\nHe who leaves the body and departs (from this world), stopping up all passages , and confining the mind within the heart , placing the life-breath in the head, and adhering to uninterrupted meditation , repeating the single syllable 'Om,' (signifying) the eternal Brahman , and meditating on me, he reaches the highest goal.\n\nTo the devotee who constantly practises abstraction, O son of P ri thâ!\n\nand who with a mind not (turned) to anything else, is ever and constantly meditating on me, I am easy of access.\n\nThe high-souled ones, who achieve the highest perfection, attaining to me, do not again come to life, which is transient, a home of woes .\n\nAll worlds, O Ar g una!\n\nup to the world of Brahman, are (destined) to return .\n\nBut, O son of Kuntî!\n\nafter attaining to me, there is no birth again.\n\nThose who know a day of Brahman to end after one thousand ages, and the night to terminate after one thousand ages, are the persons who know day and night .\n\nOn the advent of day, all perceptible things are produced from the unperceived; and on the advent of night they dissolve in that same (principle) called the unperceived."


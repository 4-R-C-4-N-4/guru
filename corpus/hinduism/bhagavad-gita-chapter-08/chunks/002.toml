[content]
body = "This same assemblage of entities, being produced again and again, dissolves on the advent of night, and, O son of P ri thâ!\n\nissues forth on the advent of day, without a will of its own .\n\nBut there is another entity, unperceived and eternal, and distinct from this unperceived (principle), which is not destroyed when all entities are destroyed.\n\nIt is called the unperceived, the indestructible; they call it the highest goal.\n\nAttaining to it, none returns .\n\nThat is my supreme abode.\n\nThat supreme Being, O son of P ri thâ!\n\nhe in whom all these entities dwell , and by whom all this is permeated, is to be attained to by reverence not (directed) to another.\n\nI will state the times, O descendant of Bharata!\n\nat which devotees departing (from this world) go, never to return, or to return.\n\nThe fire, the flame , the day, the bright fortnight, the six months of the northern solstice, departing (from the world) in these, those who know the Brahman go to the Brahman.\n\nSmoke, night, the dark fortnight, the six months of the southern solstice, (dying) in these, the devotee goes to the lunar light and returns .\n\nThese two paths, bright and dark, are deemed to be eternal in this world .\n\nBy the one, (a man) goes never to return, by the other he comes back.\n\nKnowing these two paths, O son of P ri thâ!\n\nno devotee is deluded .\n\nTherefore at all times be possessed of devotion, O Ar g una!\n\nA devotee knowing all this , obtains all the holy fruit which is prescribed for (study of) the Vedas, for sacrifices, and also for penances and gifts, and he attains to the highest and primeval seat."


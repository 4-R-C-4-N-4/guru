[content]
body = "CHAPTER V.\n\nAr g una said: O K ri sh n a!\n\nyou praise renunciation of actions and also the pursuit (of them).\n\nTell me determinately which one of these two is superior.\n\nThe Deity said: Renunciation and pursuit of action are both instruments of happiness.\n\nBut of the two, pursuit of action is superior to renunciation of action.\n\nHe should be understood to be always an ascetic , who has no aversion and no desire.\n\nFor, O you of mighty arms!\n\nhe who is free from the pairs of opposites is easily released from (all) bonds.\n\nChildren--not wise men--talk of sa n khya and yoga as distinct.\n\nOne who pursues either well obtains the fruit of both.\n\nThe seat which the sâ n khyas obtain is reached by the yogas also.\n\nHe sees (truly), who sees the sâ n khya and yoga as one.\n\nRenunciation, O you of mighty arms!\n\nis difficult to reach without devotion; the sage possessed of devotion attains Brahman without delay.\n\nHe who is possessed of devotion, whose self is pure, who has restrained his self , and who has controlled his senses, and who identifies his self with every being, is not tainted though he performs (actions).\n\nThe man of devotion, who knows the truth, thinks he does nothing at all, when he sees , hears, touches, smells, eats, move-b, sleeps, breathes, talks, throws out , takes, opens or closes the eyelids; he holds that the senses deal with the objects of the senses.\n\nHe who, casting off (all) attachment, performs actions dedicating them to Brahman, is not tainted by sin, as the lotus-leaf (is not tainted) by water.\n\nDevotees, casting off attachment, perform actions for attaining purity of self, with the body, the mind, the understanding, or even the senses --(all) free (from egoistic notions).\n\nHe who is possessed of devotion, abandoning the fruit of actions, attains the highest tranquillity.\n\nHe who is without devotion, and attached to the fruit (of action), is tied down by (reason of his) acting in consequence of (some) desire.\n\nThe self-restrained, embodied (self) lies at case within the city of nine portals , renouncing all actions by the mind, not doing nor causing (any thing) to be done.\n\nThe Lord is not the cause of actions, or of the capacity of performing actions amongst men, or of the connexion of action and fruit.\n\nBut nature only works.\n\nThe Lord receives no one's sin, nor merit either.\n\nKnowledge is enveloped by ignorance, hence all creatures are deluded .\n\nBut to those who have destroyed that ignorance by knowledge of the self, (such) knowledge, like the sun, shows forth that supreme (principle).\n\nAnd those whose mind is (centred) on it, whose (very) self it is, who are thoroughly devoted to it, and whose final goal it is, go never to return, having their sins destroyed by knowledge.\n\nThe wise look upon a Brâhma n a possessed of learning and humility, on a cow, an elephant, a dog, and a S vapâka, as alike .\n\nEven here, those have conquered the material world, whose mind rests in equability ; since Brahman is free from defects and equable, therefore they rest in [paragraph continues] Brahman.\n\nHe who knows Brahman, whose mind is steady, who is not deluded, and who rests in Brahman, does not exult on finding anything agreeable, nor does he grieve on finding anything disagreeable .\n\nOne whose self is not attached to external objects, obtains the happiness that is in (one's) self; and by means of concentration of mind, joining one's self (with the Brahman), one obtains indestructible happiness."


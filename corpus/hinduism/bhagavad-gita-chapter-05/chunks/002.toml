[content]
body = "For the enjoyments born of contact (between senses and their objects) are, indeed, sources of misery; they have a beginning as well as an end .\n\nO son of Kuntî!\n\na wise man feels no pleasure in them.\n\nHe who even in this world, before his release from the body, is able to bear the agitations produced from desire and wrath, is a devoted man, he is a happy man.\n\nThe devotee whose happiness is within (himself), whose recreation is within (himself), and whose light (of knowledge) also is within (himself), becoming (one with) the Brahman , obtain the Brahmic bliss .\n\nThe sages whose sins have perished, whose misgivings are destroyed, who are self-restrained, and who are intent on the welfare of all beings , obtain the Brahmic bliss.\n\nTo the ascetics, who are free from desire and wrath , and whose minds are restrained, and who have knowledge of the self, the Brahmic bliss is on both sides (of death).\n\nThe sage who excludes (from his mind) external objects, (concentrates) the visual power between the brows , and making the upward and downward life-breaths even, confines their movements within the nose, who restrains senses, mind, and understanding , whose highest goal is final emancipation, from whom desire, fear, and wrath have departed, is, indeed, for ever released (from birth and death).\n\nHe knowing me to be the enjoyer of all sacrifices and penances, the great Lord of all worlds, and the friend of all beings, attains tranquillity."


[content]
body = "CHAPTER X.\n\nYet again, O you of mighty arms!\n\nlisten to my excellent words, which, out of a wish for your welfare, I speak to you who are delighted (with them).\n\nNot the multitudes of gods, nor the great sages know my source; for I am in every way the origin of the gods and great sages.\n\nOf (all) mortals, he who knows me to be unborn, without beginning, the great lord of the world, being free from delusion, is released from all sins.\n\nIntelligence, knowledge, freedom from delusion, forgiveness, truth, restraint of the senses, tranquillity, pleasure, pain, birth, death, fear, and also security, harmlessness, equability, contentment, penance, (making) gifts, glory, disgrace, all these different tempers of living beings are from me alone.\n\nThe seven great sages, and likewise the four ancient Manus , whose descendants are (all) these people in the world, were all born from my mind , (partaking) of my powers.\n\nWhoever correctly knows these powers and emanations of mine, becomes possessed of devotion free from indecision; of this (there is) no doubt.\n\nThe wise, full of love , worship me, believing that I am the origin of all, and that all moves on through me.\n\n(Placing their) minds on me, offering (their) lives to me, instructing each other, and speaking about me, they are always contented and happy.\n\nTo these, who are constantly devoted, and who worship with love,, I give that knowledge by which they attain to me.\n\nAnd remaining in their hearts, I destroy, with the brilliant lamp of knowledge, the darkness born of ignorance in such (men) only, out of compassion for them.\n\nAr g una said: You are the supreme Brahman, the supreme goal, the holiest of the holy.\n\nAll sages, as well as the divine sage Nârada, Asita , Devala, and Vyâsa, call you the eternal being, divine, the first god, the unborn, the all-pervading.\n\nAnd so, too, you tell me yourself, O Kesava!\n\nI believe all this that you tell me (to be) true; for, O lord!\n\nneither the gods nor demons understand your manifestation .\n\nYou only know your self by your self.\n\nO best of beings!\n\ncreator of all things!\n\nlord of all things!\n\ngod of gods!\n\nlord of the universe!\n\nbe pleased to declare without, exception your divine emanations, by which emanations you stand pervading all these worlds.\n\nHow shall I know you, O you of mystic power!\n\nalways meditating on you?\n\nAnd in what various entities , O lord!\n\nshould I meditate on you?\n\nAgain, O Ganârdana!\n\ndo you yourself declare your powers and emanations; because hearing this nectar, I (still) feel no satiety.\n\nThe Deity said: Well then, O best of Kauravas!\n\nI will state to you my own divine emanations; but (only) the chief (ones), for there is no end to the extent of my (emanations).\n\nI am the self, O Gu d âkesa!\n\nseated in the hearts of all beings .\n\nI am the beginning and the middle and the end also of all beings.\n\nI am Vish n u among the Âdityas , the beaming sun among the shining (bodies); I am Marî k i among the Maruts , and the moon among the lunar mansions .\n\nAmong the Vedas, I am the Sâma-veda .\n\nI am Indra among the gods.\n\nAnd I am mind among the senses .\n\nI am consciousness in (living) beings."


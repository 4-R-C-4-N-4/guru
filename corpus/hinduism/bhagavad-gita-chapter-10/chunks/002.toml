[content]
body = "And I am S a n kara among the Rudras, the lord of wealth among Yakshas and Rakshases.\n\nAnd I am fire among the Vasus, and Meru among the high-topped (mountains).\n\nAnd know me, O Ar g una!\n\nto be B ri haspati, the chief among domestic priests.\n\nI am Skanda among generals.\n\nI am the ocean among reservoirs of water .\n\nI am Bh ri gu among the great sages.\n\nI am the single syllable (Om ) among words.\n\nAmong sacrifices I am the G apa sacrifice ; the Himâlaya among the firmly-fixed (mountains); the A s vattha among all trees, and Nârada among divine sages; K itraratha among the heavenly choristers, the sage Kapila among the Siddhas .\n\nAmong horses know me to be U kk ai ss ravas , brought forth by (the labours for) the nectar; and Airâvata among the great elephants, and the ruler.\n\nof men among men .\n\nI am the thunderbolt among weapons, the wish-giving (cow) among cows.\n\nAnd I am love which generates .\n\nAmong serpents I am Vâsuki.\n\nAmong Nâga snakes I am Ananta; I am Varu n a among aquatic beings.\n\nAnd I am Aryaman among the manes, and Yama among rulers.\n\nAmong demons, too, I am Pralhâda.\n\nI am the king of death (Kâla, time) among those that count .\n\nAmong beasts I am the lord of beasts, and the son of Vinatâ among birds.\n\nI am the wind among those that blow .\n\nI am Râma among those that wield weapons.\n\nAmong fishes I am Makara , and among streams the G âhnavî .\n\nOf created things I am the beginning and the end and the middle also, O Ar g una!\n\nAmong sciences, I am the science of the Adhyâtma, and I am the argument of controversialists.\n\nAmong letters I am the letter A , and among the group of compounds the copulative compound.\n\nI myself am time inexhaustible, and I the creator whose faces are in all directions.\n\nI am death who seizes all, and the source of what is to be.\n\nAnd among females, fame , fortune, speech, memory, intellect, courage.\n\nforgiveness.\n\nLikewise among Sâman hymns, I am the B ri hat-sâman , and I the Gâyatrî among metres.\n\nI am Mârga s îrsha among the months, the spring among the seasons ; of cheats, I am the game of dice; I am the glory of the glorious, I am victory, I am industry, I am the goodness of the good.\n\nI am Vâsudeva among the descendants of V ri sh ni , and Ar g una among the Pâ nd avas.\n\nAmong sages also, I am Vyâsa ; and among the discerning ones, I am the discerning U s anas .\n\nI am the rod of those that restrain, and the policy of those that desire victory.\n\nI am silence respecting secrets.\n\nI am the knowledge of those that have knowledge And, O Ar g una!\n\nI am also that which is the seed of all things.\n\nThere is nothing movable or immovable which can exist without me.\n\nO terror of your foes!\n\nthere is no end to my divine emanations.\n\nHere I have declared the extent of (those) emanations only in part.\n\nWhatever thing (there is) of power, or glorious, or splendid, know all that to be produced from portions of my energy.\n\nOr rather, O Ar g una!\n\nwhat have you to do, knowing all this at large?\n\nI stand supporting all this by (but) a single portion (of myself) ."


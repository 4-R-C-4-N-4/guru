[content]
body = "By perfectly concentrated Meditation on mind-images is gained the understanding of the thoughts of others. Here, for those who can profit by it, is the secret of thought-reading. Take the simplest case of intentional thought transference. It is the testimony of those who have done this, that the perceiving mind must be stilled, before the mind-image projected by the other mind can be seen. With it comes a sense of the feeling and temper of the other mind and so on, in higher degrees."


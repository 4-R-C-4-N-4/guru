[content]
body = "By perfectly concentrated Meditation on the centre of force in the well of the throat, there comes the cessation of hunger and thirst. We are continuing the study of the bodily powers and centres of force in their relation to the powers and forces of the spiritual man. We have already considered the dominant power of physical life, the creative power which secures the continuance of physical life; and, further, the manner in which, through aspiration and sacrifice, it is gradually raised and set to the work of upbuilding the body of the spiritual man. We come now to the dominant psychic force, the power which manifests itself in speech, and in virtue of which the voice may carry so much of the personal magnetism, endowing the orator with a tongue of fire, magical in its power to arouse and rule the emotions of his hearers. This emotional power, this distinctively psychical force, is the cause of 'hunger and thirst,' the psychical hunger and thirst for sensations, which is the source of our two-sided life of emotionalism, with its hopes and fears, its expectations and memories, its desires and hates. The source of this psychical power, or, perhaps we should say, its centre of activity in the physical body is said to be in the cavity of the throat. Thus, in the Taittirîya Upanishad it is written: 'There is this shining ether in the inner being. Therein is the spiritual man, formed through thought, immortal, golden. Inward, in the palate, the organ that hangs down like a nipple,—this is the womb of Indra. And there, where the dividing of the hair turns, extending upward to the crown of the head.' Indra is the name given to the creative power of which we have spoken, and which, we are told, resides in 'the organ which hangs down like a nipple, inward, in the palate.'"


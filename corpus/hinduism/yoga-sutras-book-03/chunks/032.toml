[content]
body = "Through perfectly concentrated Meditation on the light in the head comes the vision of the Masters who have attained. The tradition is, that there is a certain centre of force in the head, perhaps the 'pineal gland,' which some of our Western philosophers have supposed to be the dwelling of the soul,-a centre which is, as it were, the door way between the natural and the spiritual man. It is the seat of that better and wiser consciousness behind the outward looking consciousness in the forward part of the head; that better and wiser consciousness of 'the back of the mind,' which views spiritual things, and seeks to impress the spiritual view on the outward looking consciousness in the forward part of the head. It is the spiritual man seeking to guide the natural man, seeking to bring the natural man to concern himself with the things of his immortality. This is suggested in the words of the Upanishad already quoted: 'There, where the dividing of the hair turns, extending upward to the crown of the head'; all of which may sound very fantastical, until one comes to understand it. It is said that when this power is fully awakened, it brings a vision of the great Companions of the spiritual man, those who have already attained, crossing over to the further shore of the sea of death and rebirth. Perhaps it is to this divine sight that the Master alluded, who is reported to have said: 'I counsel you to buy of me eye-salve, that you may see.' It is of this same vision of the great Companions, the children of light, that a seer wrote: Though inland far we be, Our souls have sight of that immortal sea Which brought us hither, Can in a moment travel thither, And see the Children sport upon the shore And hear the mighty waters rolling evermore."


[content]
body = "By perfectly concentrated Meditation on the centre of force in the channel called the 'tortoise-formed,' comes steadfastness. We are concerned now with the centre of nervous or psychical force below the cavity of the throat, in the chest, in which is felt the sensation of fear; the centre, the disturbance of which sets the heart beating miserably with dread, or which produces that sense of terror through which the heart is said to stand still. When the truth concerning fear is thoroughly mastered, through spiritual insight into the immortal, fearless life, then this force is perfectly controlled; there is no more fear, just as, through the control of the psychic power which works through the nerve-centre in the throat, there comes a cessation of 'hunger and thirst.' Thereafter, these forces, or their spiritual prototypes, are turned to the building of the spiritual man. Always, it must be remembered, the victory is first a spiritual one; only later does it bring control of the bodily powers."


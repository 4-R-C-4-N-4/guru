[content]
body = "Thereupon are born the divine power of intuition, and the hearing, the touch, the vision, the taste and the power of smell of the spiritual man. When, in virtue of the perpetual sacrifice of the personal man, daily and hourly giving his life for his divine brother the spiritual man, and through the radiance ever pouring down from the Higher Self, eternal in the Heavens, the spiritual man comes to birth,—there awake in him those powers whose physical counterparts we know in the personal man. The spiritual man begins to see, to hear, to touch, to taste. And, besides the senses of the spiritual man, there awakes his mind, that divine counterpart of the mind of the physical man, the power of direct and immediate knowledge, the power of spiritual intuition, of divination. This power, as we have seen, owes its virtue to the unity, the continuity, of consciousness, whereby whatever is known to any consciousness, is knowable by any other consciousness. Thus the consciousness of the spiritual man, who lives above our narrow barriers of separateness, is in intimate touch with the consciousness of the great Companions, and can draw on that vast reservoir for all real needs. Thus arises within the spiritual man that certain knowledge which is called intuition, divination, illumination."


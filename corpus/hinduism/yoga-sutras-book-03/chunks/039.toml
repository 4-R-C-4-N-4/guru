[content]
body = "By mastery of the binding-life comes radiance. In the Upanishads, it is said that this binding-life unites the upward-life to the downward-life, and these lives have their analogies in the 'vital breaths' in the body. The thought in the text seems to be, that, when the personality is brought thoroughly under control of the spiritual man, through the life-currents which bind them together, the personality is endowed with a new force, a strong personal magnetism, one might call it, such as is often an appanage of genius. But the text seems to mean more than this and to have in view the 'vesture of the colour of the sun' attributed by the Upanishads to the spiritual man; that vesture which a disciple has thus described: 'The Lord shall change our vile body, that it may be fashioned like unto his glorious body'; perhaps 'body of radiance' would better translate the Greek. In both these passages, the teaching seems to be, that the body of the full-grown spiritual man is radiant or luminous,—for those at least, who have anointed their eyes with eye-salve, so that they see."


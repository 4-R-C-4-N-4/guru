[content]
body = "When the spiritual man is perfectly disentangled from the psychic body, he attains to mastery over all things and to a knowledge of all. The spiritual man is enmeshed in the web of the emotions; desire, fear, ambition, passion; and impeded by the mental forms of separateness and materialism. When these meshes are sundered, these obstacles completely overcome, then the spiritual man stands forth in his own wide world, strong, mighty, wise. He uses divine powers, with a divine scope and energy, working together with divine Companions. To such a one it is said: 'Thou art now a disciple, able to stand, able to hear, able to see, able to speak, thou hast conquered desire and attained to self-knowledge, thou hast seen thy soul in its bloom and recognized it, and heard the voice of the silence.'"


[content]
body = "By absence of all self-indulgence at this point, when the seeds of bondage to sorrow are destroyed, pure spiritual being is attained. The seeking of indulgence for the personal self, whether through passion or ambition, sows the seed of future sorrow. For this self indulgence of the personality is a double sin against the real; a sin against the cleanness of life, and a sin against the universal being, which permits no exclusive particular good, since, in the real, all spiritual possessions are held in common. This twofold sin brings its reacting punishment, its confining bondage to sorrow. But ceasing from self-indulgence brings purity, liberation, spiritual life."


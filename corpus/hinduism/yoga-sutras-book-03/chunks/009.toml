[content]
body = "One of the ascending degrees is the development of Control. First there is the overcoming of the mind-impress of excitation. Then comes the manifestation of the mind-impress of Control. Then the perceiving consciousness follows after the moment of Control. This is the development of Control. The meaning seems to be this: Some object enters the field of observation, and at first violently excites the mind, stirring up curiosity, fear, wonder; then the consciousness returns upon itself, as it were, and takes the perception firmly in hand, steadying itself, and viewing the matter calmly from above. This steadying effort of the will upon the perceiving consciousness is Control, and immediately upon it follows perception, understanding, insight. Take a trite example. Supposing one is walking in an Indian forest. A charging elephant suddenly appears. The man is excited by astonishment, and, perhaps, terror. But he exercises an effort of will, perceives the situation in its true bearings, and recognizes that a certain thing must be done; in this case, probably, that he must get out of the way as quickly as possible. Or a comet, unheralded, appears in the sky like a flaming sword. The beholder is at first astonished, perhaps terror-stricken; but he takes himself in hand, controls his thoughts, views the apparition calmly, and finally calculates its orbit and its relation to meteor showers. These are extreme illustrations; but with all knowledge the order of perception is the same: first, the excitation of the mind by the new object impressed on it; then the control of the mind from within; upon which follows the perception of the nature of the object. Where the eyes of the spiritual man are open, this will be a true and penetrating spiritual perception. In some such way do our living experiences come to us; first, with a shock of pain; then the Soul steadies itself and controls the pain; then the spirit perceives the lesson of the event, and its bearing upon the progressive revelation of life."


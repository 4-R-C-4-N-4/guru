[content]
body = "But this triad is still exterior to the soul vision which is unconditioned, free from the seed of mental analyses. The reason is this: The threefold power we have been considering, the triad of Attention, Contemplation, Meditation is, so far as we have yet considered it, the focussing of the beam of perceiving consciousness upon some form of manifesting being, with a view of understanding it completely. There is a higher stage, where the beam of consciousness is turned back upon itself, and the individual consciousness enters into, and knows, the All consciousness. This is a being, a being in immortality, rather than a knowing; it is free from mental analysis or mental forms. It is not an activity of the higher mind, even the mind of the spiritual man. It is an activity of the soul. Had Newton risen to this higher stage, he would have known, not the laws of motion, but that high Being, from whose Life comes eternal motion. Had Darwin risen to this, he would have seen the Soul, whose graduated thought and being all evolution expresses. There are, therefore, these two perceptions: that of living things, and that of the Life; that of the Soul's works, and that of the Soul itself."


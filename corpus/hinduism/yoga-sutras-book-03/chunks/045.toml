[content]
body = "Thereupon will come the manifestation of the atomic and other powers, which are the endowment of the body, together with its unassailable force. The body in question is, of course, the etheric body of the spiritual man. He is said to possess eight powers: the atomic, the power of assimilating himself with the nature of the atom, which will, perhaps, involve the power to disintegrate material forms; the power of levitation; the power of limitless extension; the power of boundless reach, so that, as the commentator says, 'he can touch the moon with the tip of his finger'; the power to accomplish his will; the power of gravitation, the correlative of levitation; the power of command; the power of creative will. These are the endowments of the spiritual man. Further, the spiritual body is unassailable. Fire burns it not, water wets it not, the sword cleaves it not, dry winds parch it not. And, it is said, the spiritual man can impart something of this quality and temper to his bodily vesture."


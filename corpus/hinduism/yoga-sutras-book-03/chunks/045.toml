[content]
body = "Shapeliness, beauty, force, the temper of the diamond: these are the endowments of that body. The spiritual man is shapely, beautiful strong, firm as the diamond. Therefore it is written: 'These things saith the Son of God, who hath his eyes like unto a flame of fire, and his feet are like fine brass: He that overcometh and keepeth my works unto the end, to him will I give power over the nations: and he shall rule them with a rod of iron; and I will give him the morning star.'"


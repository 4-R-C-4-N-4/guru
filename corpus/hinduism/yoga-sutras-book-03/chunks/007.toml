[content]
body = "This threefold power, of Attention, Meditation, Contemplation, is more interior than the means of growth previously described. Very naturally so; because the means of growth previously described were concerned with the extrication of the spiritual man from psychic bondages and veils; while this threefold power is to be exercised by the spiritual man thus extricated and standing on his feet, viewing life with open eyes."


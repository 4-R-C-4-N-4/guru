[content]
body = "Hence comes discernment between things which are of like nature, not distinguished by difference of kind, character or position. Here, as also in the preceding Sutra, we are close to the doctrine that distinctions of order, time and space are creations of the mind; the threefold prism through which the real object appears to us distorted and refracted. When the prism is withdrawn, the object returns to its primal unity, no longer distinguishable by the mind, yet clearly knowable by that high power of spiritual discernment, of illumination, which is above the mind."


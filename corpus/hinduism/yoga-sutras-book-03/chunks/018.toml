[content]
body = "When the mind-impressions become visible, there comes an understanding of previous births. This is simple enough if we grasp the truth of rebirth. The fine harvest of past experi ences is drawn into the spiritual nature, forming, indeed, the basis of its development. When the consciousness has been raised to a point above these fine subjective impressions, and can look down upon them from above, this will in itself be a remembering of past births."


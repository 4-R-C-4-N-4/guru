[content]
body = "The works which fill out the life-span may be either immediately or gradually operative. By perfectly concentrated Meditation on these comes a knowledge of the time of the end, as also through signs. A garment which is wet, says the commentator, may be hung up to dry, and so dry rapidly, or it may be rolled in a ball and dry slowly; so a fire may blaze or smoulder. Thus it is with Karma, the works that fill out the life-span. By an insight into the mental forms and forces which make up Karma, there comes a knowledge of the rapidity or slowness of their development, and of the time when the debt will be paid."


[content]
body = "Through frequent repetition of this process, the mind becomes habituated to it, and there arises an equable flow of perceiving consciousness. Control of the mind by the Soul, like control of the muscles by the mind, comes by practice, and constant voluntary repetition. As an example of control of the muscles by the mind, take the ceaseless practice by which a musician gains mastery over his instrument, or a fencer gains skill with a rapier. Innumerable small efforts of attention will make a result which seems well-nigh miraculous; which, for the novice, is really miraculous. Then consider that far more wonderful instrument, the perceiving mind, played on by that fine musician, the Soul. Here again, innumerable small efforts of attention will accumulate into mastery, and a mastery worth winning. For a concrete example, take the gradual conquest of each day, the effort to live that day for the Soul. To him that is faithful unto death, the Master gives the crown of life."


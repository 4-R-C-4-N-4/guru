[content]
body = "The wisdom which is born of discernment is starlike; it discerns all things, and all conditions of things, it discerns without succession: simultaneously. That wisdom, that intuitive, divining power is starlike, says the commentator, because it shines with its own light, because it rises on high, and illumines all things. Nought is hid from it, whether things past, things present, or things to come; for it is beyond the threefold form of time, so that all things are spread before it together, in the single light of the divine. This power has been beautifully described by Columba: 'Some there are, though very few, to whom Divine grace has granted this: that they can clearly and most distinctly see, at one and the same moment, as though under one ray of the sun, even the entire circuit of the whole world with its surroundings of ocean and sky, the inmost part of their mind being marvellously enlarged.'"


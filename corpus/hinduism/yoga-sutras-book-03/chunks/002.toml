[content]
body = "A prolonged holding of the perceiving consciousness in that region is meditation (dhyana). This will apply equally to outer and inner things. I may for a moment fix my attention on some visible object, in a single penetrating glance, or I may hold the attention fixedly on it until it reveals far more of its nature than a single glance could perceive. The first is the focussing of the searchlight of consciousness upon the object. The other is the holding of the white beam of light steadily and persistently on the object, until it yields up the secret of its details. So for things within; one may fix the inner glance for a moment on spiritual things, or one may hold the consciousness steadily upon them, until what was in the dark slowly comes forth into the light, and yields up its immortal secret. But this is possible only for the spiritual man, after the Commandments and the Rules have been kept; for until this is done, the thronging storms of psychical thoughts dissipate and distract the attention, so that it will not remain fixed on spiritual things. The cares of this world, the deceitfulness of riches, choke the word of the spiritual message."


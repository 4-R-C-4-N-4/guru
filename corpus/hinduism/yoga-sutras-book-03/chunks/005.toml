[content]
body = "By mastering this perfectly concentrated Meditation, there comes the illumination of perception. The meaning of this is illustrated by what has been said before. When the spiritual man is able to throw aside the trammels of emotional and mental limitation, and to open his eyes, he sees clearly, he attains to illuminated perception. A poet once said that Occultism is the conscious cultivation of genius; and it is certain that the awakened spiritual man attains to the perceptions of genius. Genius is the vision, the power, of the spiritual man, whether its possessor recognizes this or not. All true knowledge is of the spiritual man. The greatest in all ages have recognized this and put their testimony on record. The great in wisdom who have not consciously recognized it, have ever been full of the spirit of reverence, of selfless devotion to truth, of humility, as was Darwin; and reverence and humility are the unconscious recognition of the nearness of the Spirit, that Divinity which broods over us, a Master o’er a slave."


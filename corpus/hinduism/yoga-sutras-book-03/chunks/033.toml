[content]
body = "Or through the divining power of tuition he knows all things. This is really the supplement, the spiritual side, of the Sutra just translated. Step by step, as the better consciousness, the spiritual view, gains force in the back of the mind, so, in the same measure, the spiritual man is gaining the power to see: learning to open the spiritual eyes. When the eyes are fully opened, the spiritual man beholds the great Companions standing about him; he has begun to 'know all things.' This divining power of intuition is the power which lies above and behind the so-called rational mind; the rational mind formulates a question and lays it before the intuition, which gives a real answer, often immediately distorted by the rational mind, yet always embodying a kernel of truth. It is by this process, through which the rational mind brings questions to the intuition for solution, that the truths of science are reached, the flashes of discovery and genius. But this higher power need not work in subordination to the so-called rational mind, it may act directly, as full illumination, 'the vision and the faculty divine.'"


[content]
body = "When that condition of consciousness s reached, which is far-reaching and not confined to the body, which is outside the body and not conditioned by it, then the veil which conceals the light is worn away. Perhaps the best comment on this is afforded by the words of Paul: 'I knew a man in Christ above fourteen years ago, (whether in the body, I cannot tell; or whether out of the body, I cannot tell: God knoweth;) such a one caught up to the third heaven. And I knew such a man, (whether in the body, or out of the body, I cannot tell: God knoweth;) how that he was caught up into paradise, and heard unspeakable [or, unspoken] words, which it is not lawful for a man to utter.' The condition is, briefly, that of the awakened spiritual man, who sees and hears beyond the veil."


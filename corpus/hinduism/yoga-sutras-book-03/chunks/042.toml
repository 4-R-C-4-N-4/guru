[content]
body = "By perfectly concentrated Meditation on the correlation of the body with the ether, and by thinking of it as light as thistle-down, will come the power to traverse the ether. It has been said that he who would tread the path of power must look for a home in the air, and afterwards in the ether. This would seem to mean, besides the constant injunction to detachment, that he must be prepared to inhabit first a psychic, and then an etheric body; the former being the body of dreams; the latter, the body of the spiritual man, when he wakes up on the other side of dreamland. The gradual accustoming of the consciousness to its new etheric vesture, its gradual acclimatization, so to speak, in the etheric body of the spiritual man, is what our text seems to contemplate."


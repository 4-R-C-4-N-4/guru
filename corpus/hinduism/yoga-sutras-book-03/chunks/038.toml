[content]
body = "Through the weakening of the causes of bondage, and by learning the method of sassing, the consciousness is transferred to the other body. In due time, after the spiritual man has been formed and grown stable through the forces and virtues already enumerated, and after the senses of the spiritual man have awaked, there comes the transfer of the dominant consciousness, the sense of individuality, from the physical to the spiritual man. Thereafter the physical man is felt to be a secondary, a subordinate, an instrument through whom the spiritual man works; and the spiritual man is felt to be the real individuality. This is, in a sense, the attainment to full salvation and immortal life; yet it is not the final goal or resting place, but only the beginning of the greater way. The means for this transfer are described as the weakening of the causes of bondage, and an understanding of the method of passing from the one consciousness to the other. The first may also be described as detach meet, and comes from the conquest of the delusion that the personal self is the real man. When that delusion abates and is held in check, the finer consciousness of the spiritual man begins to shine in the background of the mind. The transfer of the sense of individuality to this finer consciousness, and thus to the spiritual man, then becomes a matter of recollection, of attention; primarily, a matter of taking a deeper interest in the life and doings of the spiritual man, than in the pleasures or occupations of the personality. Therefore it is said: 'Lay not up for yourselves treasures upon earth, where moth and rust cloth corrupt, and where thieves break through and steal: but lay up for yourselves treasures in heaven, where neither moth nor rust cloth corrupt, and where thieves do not break through nor steal: for where your treasure is, there will your heart be also.'"


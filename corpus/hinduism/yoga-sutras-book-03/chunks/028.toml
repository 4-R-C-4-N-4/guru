[content]
body = "By perfectly concentrated Meditation on the fixed pole-star comes a knowledge of the motions of the stars. Addressing Duty, stern daughter of the Voice of God, Wordsworth finely said: Thou cost preserve the stars from wrong, And the most ancient heavens through thee are fresh and strong— thus suggesting a profound relation between the moral powers and the powers that rule the worlds. So in this Sutra the fixed polestar is the eternal spirit about which all things move, as well as the star toward which points the axis of the earth. Deep mysteries attend both, and the veil of mystery is only to be raised by Meditation, by open-eyed vision of the awakened spiritual man."


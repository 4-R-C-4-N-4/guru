[content]
body = "By perfectly concentrated Meditation on the sun comes a knowledge of the worlds. This has several meanings: First, by a knowledge of the constitution of the sun, astronomers can understand the kindred nature of the stars. And it is said that there is a finer astronomy, where the spiritual man is the astronomer. But the sun also means the Soul, and through knowledge of the Soul comes a knowledge of the realms of life."


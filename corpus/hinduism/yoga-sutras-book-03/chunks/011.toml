[content]
body = "The gradual conquest of the mind's tendency to flit from one object to another, and the power of one-pointedness, make the development of Contemplation. As an illustration of the mind's tendency to flit from one object to another, take a small boy, learning arithmetic. He begins: two ones are two; three ones are three-and then he thinks of three coins in his pocket, which will purchase so much candy, in the store down the street, next to the toy-shop, where are base-balls, marbles and so on,—and then he comes back with a jerk, to four ones are four. So with us also. We are seeking the meaning of our task, but the mind takes advantage of a moment of slackened attention, and flits off from one frivolous detail to another, till we suddenly come back to consciousness after traversing leagues of space. We must learn to conquer this, and to go back within ourselves into the beam of perceiving consciousness itself, which is a beam of the Oversoul. This is the true one-pointedness, the bringing of our consciousness to a focus in the Soul."


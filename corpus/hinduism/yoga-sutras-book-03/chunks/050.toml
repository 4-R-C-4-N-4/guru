[content]
body = "There should be complete overcoming of allurement or pride in the invitations of the different realms of life, lest attachment to things evil arise once more. The commentator tells us that disciples, seekers for union, are of four degrees: first, those who are entering the path; second, those who are in the realm of allurements; third, those who have won the victory over matter and the senses; fourth, those who stand firm in pure spiritual life. To the second, especially, the caution in the text is addressed. More modern teachers would express the same truth by a warning against the delusions and fascinations of the psychic realm, which open around the disciple, as he breaks through into the unseen worlds. These are the dangers of the anteroom. Safety lies in passing on swiftly into the inner chamber. 'Him that overcometh will I make a pillar in the temple of my God, and he shall go no more out.'"


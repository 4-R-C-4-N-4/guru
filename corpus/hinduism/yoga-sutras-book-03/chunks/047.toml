[content]
body = "Mastery over the powers of perception and action comes through perfectly concentrated Meditation on their fivefold forms; namely, their power to grasp their distinctive nature, the element of self-consciousness in them, their inherence, and their purposiveness. Take, for example, sight. This possesses, first, the power to grasp, apprehend, perceive; second, it has its distinctive form of perception; that is, visual perception; third, it always carries with its operations self-consciousness, the thought: 'I perceive'; fourth sight has the power of extension through the whole field of vision, even to the utmost star; fifth, it is used for the purposes of the Seer. So with the other senses. Perfectly concentrated Meditation on each sense, a viewing it from behind and within, as is possible for the spiritual man, brings a mastery of the scope and true character of each sense, and of the world on which they report collectively."


[content]
body = "Thence comes the power swift as thought, independent of instruments, and the mastery over matter. We are further enumerating the endowments of the spiritual man. Among these is the power to traverse space with the swiftness of thought, so that whatever place the spiritual man thinks of, to that he goes, in that place he already is. Thought has now become his means of locomotion. He is, therefore, independent of instruments, and can bring his force to bear directly, wherever he wills."


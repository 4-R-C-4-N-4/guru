[content]
body = "From perfectly concentrated Meditation on the correlation of hearing and the ether, comes the power of spiritual hearing. Physical sound, we are told, is carried by the air, or by water, iron, or some medium on the same plane of substance. But then is a finer hearing, whose medium of transmission would seem to be the ether; perhaps no that ether which carries light, heat and magnetic waves, but, it may be, the far finer ether through which the power of gravity works. For, while light or heat or magnetic waves, travelling from the sun to the earth, take eight minutes for the journey, it is mathematically certain that the pull of gravitation does not take as much as eight seconds, or even the eighth of a second. The pull of gravitation travels, it would seem 'as quick as thought'; so it may well be that, in thought transference or telepathy, the thoughts travel by the same way, carried by the same 'thought-swift' medium. The transfer of a word by telepathy is the simplest and earliest form of the 'divine hearing' of the spiritual man; as that power grows, and as, through perfectly concentrated Meditation, the spiritual man comes into more complete mastery of it, he grows able to hear and clearly distinguish the speech of the great Companions, who counsel and comfort him on his way. They may speak to him either in wordless thoughts, or in perfectly definite words and sentences."


[content]
body = "CHAPTER XI.\n\nAr g una said: In consequence of the excellent and mysterious words concerning the relation of the supreme and individual soul,, which you have spoken for my welfare, this delusion of mine is gone away.\n\nO you whose eyes are like lotus leaves!\n\nI have heard from you at large about the production and dissolution of things, and also about your inexhaustible greatness.\n\nO highest lord!\n\nwhat you have said about yourself is so.\n\nI wish, O best of beings!\n\nto see your divine form.\n\nIf, O lord!\n\nyou think that it is possible for me to look upon it, then, O lord of the possessors of mystic power !\n\nshow your inexhaustible form to me.\n\nThe Deity said: In hundreds and in thousands see my forms, O son of P ri thâ!\n\nvarious, divine, and of various colours and shapes.\n\nSee the Âdityas, Vasus, Rudras, the two A s vins, and Maruts likewise.\n\nAnd O descendant of Bharata!\n\nsee wonders, in numbers, unseen before.\n\nWithin my body, O Gu d âkesa!\n\nsee to-day the whole universe, including (everything) movable and immovable, (all) in one, and whatever else you wish to see.\n\nBut you will not be able to see me with merely, this eye of yours.\n\nI give you an eye divine.\n\n(Now) see my divine power.\n\nSañ g aya said Having spoken thus, O king!\n\nHari, the great lord of the possessors of mystic power, then showed to the son of P ri thâ.\n\nhis supreme divine form, having many mouths and eyes, having (within it) many wonderful sights, having many celestial ornaments, having many celestial weapons held erect, wearing celestial flowers and vestments, having an anointment of celestial perfumes, full of every wonder, the infinite deity with faces in all directions .\n\nIf in the heavens, the lustre of a thousand suns burst forth all at once, that would be like the lustre of that mighty one.\n\nThere the son of Pâ nd u then observed in the body of the god of gods the whole universe (all) in one, and divided into numerous (divisions).\n\nThen Dhanañ g aya filled with amazement, and with hair standing on end, bowed his head before the god, and spoke with joined hands.\n\nAr g una said: O god!\n\nI see within your body the gods, as also all the groups of various beings; and the lord Brahman seated on (his) lotus seat, and all the sages and celestial snakes.\n\nI see you, who are of countless forms, possessed of many arms, stomachs, mouths, and eyes on all sides.\n\nAnd, O lord of the universe!\n\nO you of all forms!\n\nI do not see your end or middle or beginning.\n\nI see you bearing a coronet and a mace and a discus--a mass of glory, brilliant on all sides, difficult to look at, having on all sides the effulgence of a blazing fire or sun, and indefinable.\n\nYou are indestructible, the supreme one to be known.\n\nYou are the highest support of this universe.\n\nYou are the inexhaustible protector of everlasting piety.\n\nI believe you to be the eternal being.\n\nI see you void of beginning, middle, end--of infinite power, of unnumbered arms, having the sun and moon for eyes, having a mouth like a blazing fire, and heating the universe with your radiance.\n\nFor this space between heaven and earth and all the quarters are pervaded by you alone.\n\nLooking at this wonderful and terrible form of yours, O high-souled one!\n\nthe three worlds are affrighted.\n\nFor here these groups of gods are entering into you."


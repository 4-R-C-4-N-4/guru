[content]
body = "Some being afraid are praying with joined hands, and the groups of great sages and Siddhas are saying 'Welfare !' and praising you with abundant (hymns) of praise.\n\nThe Rudras, and Âdityas, the Vasus, the Sâdhyas, the Vi s vas, the two A s vins, the Maruts, and the Ushmapas, and the groups of Gandharvas, Yakshas, demons, and Siddhas are all looking at you amazed.\n\nSeeing your mighty form, with many mouths and eyes, with many arms, thighs, and feet, with many stomachs, and fearful with many jaws, all people, and I likewise, are much alarmed, O you of mighty arms!\n\nSeeing you, O Vish n u!\n\ntouching the skies, radiant, possessed of many hues, with a gaping mouth, and with large blazing eyes, I am much alarmed in my inmost self, and feel no courage, no tranquillity.\n\n[paragraph continues] And seeing your mouths terrible by the jaws, and resembling the fire of destruction, I cannot recognise the (various) directions, I feel no comfort.\n\nBe gracious, O lord of gods!\n\nwho pervadest the universe.\n\nAnd all these sons of Dh ri tarâsh t ra, together with all the bands of kings, and Bhîshma and Dro n a, and this charioteer's son likewise, together with our principal warriors also, are rapidly entering your mouths, fearful and horrific by (reason of your) jaws.\n\nAnd some with their heads smashed are seen (to be) stuck in the spaces between the teeth.\n\nAs the many rapid currents of a river's waters run towards the sea alone, so do these heroes of the human world enter your mouths blazing all round.\n\nAs butterflies, with increased velocity, enter a blazing fire to their destruction, so too do these people enter your mouths with increased velocity (only) to their destruction.\n\nSwallowing all these people, you are licking them over and over again from all sides, with your blazing mouths.\n\nYour fierce splendours, O Vish n u!\n\nfilling the whole universe with (their) effulgence, are heating it.\n\nTell me who you are in this fierce form.\n\nSalutations be to thee, O chief of the gods!\n\nBe gracious.\n\nI wish to know you, the primeval, one, for I do not understand your actions.\n\nThe Deity said: I am death, the destroyer of the worlds, fully developed, and I am now active about the overthrow of the worlds.\n\nEven without you, the warriors standing in the adverse hosts, shall all cease to be.\n\nTherefore, be up, obtain glory, and vanquishing (your) foes, enjoy a prosperous kingdom.\n\nAll these have been already killed by me.\n\nBe only the instrument, O Savyasâ k in !\n\nDro n a, and Bhîshma, and G ayadratha, and Kar n a, and likewise other valiant warriors also, whom I have killed, do you kill.\n\nBe not alarmed.\n\nDo fight.\n\nAnd in the battle you will conquer your foes.\n\nSañ g aya said: Hearing these words of Kesava, the wearer of the coronet , trembling, and with joined hands, bowed down; and sorely afraid, and with throat choked up, he again spoke to K ri sh n a after saluting him.\n\nAr g una said: It is quite proper, O H ri shîke s a!\n\nthat the universe is delighted and charmed by your renown, that the demons run away affrighted in all directions, and that all the assemblages of Siddhas bow down,(to you).\n\nAnd why, O high-souled one!\n\nshould they not bow down to you (who are) greater than Brahman, and first cause?"


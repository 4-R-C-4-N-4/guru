[content]
body = "I cannot be seen, as you have seen me, by (means of) the Vedas, not by penance, not by gift, nor yet by sacrifice.\n\nBut, O Ar g una!\n\nby devotion to me exclusively, I can in this form be truly known, seen, and assimilated with, O terror of your foes!\n\nHe who performs acts for (propitiating) me, to whom I am the highest (object), who is my devotee, who is free from attachment, and who has no enmity towards any being, he, O son of Pâ nd u!\n\ncomes to me."


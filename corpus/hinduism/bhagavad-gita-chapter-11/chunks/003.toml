[content]
body = "O infinite lord of gods!\n\nO you pervading the universe!\n\nyou are the indestructible, that which is, that which is not, and what is beyond them .\n\nYou are the primal god, the ancient being, you are the highest support of this universe .\n\nYou are that which has knowledge, that which is the object of knowledge, you are the highest goal.\n\nBy you is this universe pervaded., O you of infinite forms!\n\nYou are the wind, Yama, fire, Varu n a, the moon, you Pra g âpati, and the great grandsire .\n\nObeisance be to thee a thousand times, and again and again obeisance to thee!\n\nIn front and from behind obeisance to thee!\n\nObeisance be to thee from all sides, O you who are all!\n\nYou are of infinite power, of unmeasured glory; you pervade all, and therefore you are all!\n\nWhatever I have said contemptuously,--for instance, 'O K ri sh n a!' 'O Yâdava!' 'O friend!'--thinking you to be (my) friend, and not knowing your greatness (as shown in) this (universal form), or through friendliness, or incautiously; and whatever disrespect I have shown you for purposes of merriment, on (occasions of) play, sleep, dinner, or sitting (together), whether alone or in the presence (of friends),--for all that, O undegraded one!\n\nI ask pardon of you who are indefinable .\n\nYou are the father of the world-movable and immovable,--you its great and venerable master; there is none equal to you, whence can there be one greater, O you whose power is unparalleled in all the three worlds?\n\nTherefore I bow and prostrate myself, and would propitiate you, the praiseworthy lord.\n\nBe pleased, [paragraph continues] O god!\n\nto pardon (my guilt) as a father (that of his) son, a friend (that of his) friend, or a husband (that of his) beloved.\n\nI am delighted at seeing what I had never seen before, and my heart is also alarmed by fear.\n\nShow me that same form, O god!\n\nBe gracious, O lord of gods!\n\nO you pervading the universe!\n\nI wish to see you bearing the coronet and the mace, with the discus in hand, just the same (as before) .\n\nO you of thousand arms!\n\nO you of all forms!\n\nassume that same four-handed form.\n\nThe Deity said: O Ar g una!\n\nbeing pleased (with you), I have by my own mystic power shown you this supreme form, full of glory, universal, infinite, primeval, and which has not been seen before by any one else but you, O you hero among the Kauravas!\n\nI cannot be seen in this form by any one but you, (even) by (the help of) the study of the Vedas, or of sacrifices, nor by gifts, nor by actions, nor by fierce penances.\n\nBe not alarmed, be not perplexed, at seeing this form of mine, fearful like this.\n\nFree from fear and with delighted heart, see now again that same form of mine.\n\nSañ g aya said: Having thus spoken to Ar g una, Vâsudeva again showed his own form, and the high-souled one becoming again of a mild form, comforted him who had been affrighted.\n\nAr g una said: O G anardana!\n\nseeing this mild, human form of yours, I am new in my right mind, and have come to my normal state.\n\nThe Deity said: Even the gods are always desiring to see this form of mine, which it is difficult to get a sight of, and which you have seen."


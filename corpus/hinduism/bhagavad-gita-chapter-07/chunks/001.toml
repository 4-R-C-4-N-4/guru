[content]
body = "CHAPTER VII.\n\nThe Deity said: O son of P ri thâ!\n\nnow hear how you can without doubt know me fully, fixing your mind on me, and resting in me, and practising devotion.\n\nI will now tell you exhaustively about knowledge together with experience; that being known, there is nothing further left in this world to know.\n\nAmong thousands of men, only some work for perfection ; and even of those who have reached perfection, and who are assiduous, only some know me truly.\n\nEarth, water, fire, air, space, mind, understanding, and egoism , thus is my nature divided eightfold.\n\nBut this is a lower (form of my) nature.\n\nKnow (that there is) another (form of my) nature, and higher than this, which is animate, O you of mighty arms!\n\nand by which this universe is upheld.\n\nKnow that all things have these (for their) source .\n\nI am the producer and the destroyer of the whole universe.\n\nThere is nothing else, O Dhanañ g aya!\n\nhigher than myself; all this is woven upon me, like numbers of pearls upon a thread .\n\nI am the taste in water, O son of Kuntî!\n\nI am the light of the sun and moon.\n\nI am 'Om ' in all the Vedas, sound in space, and manliness in human beings; I am the fragrant smell in the earth, refulgence in the fire; I am life in all beings, and penance in those who perform penance.\n\nKnow me, O son of P ri thâ!\n\nto be the eternal seed of all beings; I am the discernment of the discerning ones, and I the glory of the glorious .\n\nI am also the strength, unaccompanied by fondness or desire , of the strong.\n\nAnd, O chief of the descendants of Bharata!\n\nI am love unopposed to piety among all beings.\n\nAnd all entities which are of the quality of goodness, and those which are of the quality of passion and of darkness, know that they are, indeed, all from me; I am not in them, but they are in me .\n\nThe whole universe deluded by these three states of mind, developed from the qualities, does not know me, who am beyond them and inexhaustible; for this delusion of mine, developed from the qualities, is divine and difficult to transcend.\n\nThose cross beyond this delusion who resort to me alone.\n\nWicked men, doers of evil (acts), who are deluded, who are deprived of their knowledge by (this) delusion, and who incline to the demoniac state of mind , do not resort to me.\n\nBut, O Ar g una!\n\ndoers of good (acts) of four classes worship me: one who is distressed, one who is seeking after knowledge, one who wants wealth, and one, O chief of the descendants of Bharata!\n\nwho is possessed of knowledge.\n\nOf these, he who is possessed of knowledge, who is always devoted, and whose worship is (addressed) to one (Being) only, is esteemed highest.\n\nFor to the man of knowledge I am dear above all things, and he is dear to me.\n\nAll these are noble.\n\nBut the man possessed of knowledge is deemed by me to be my own self.\n\nFor he with (his) self devoted to abstraction, has taken to me as the goal than which there is nothing higher.\n\nAt the end of many lives, the man possessed of knowledge approaches me, (believing) that Vâsudeva is everything.\n\nSuch a high-souled man is very hard to find.\n\nThose who are deprived of knowledge by various desires approach other divinities, observing various regulations , and controlled by their own natures ."


[content]
body = "Whichever form (of deity) any worshipper wishes to worship with faith, to that form I render his faith steady.\n\nPossessed Of that faith, he seeks to propitiate (the deity in) that (form), and obtains from it those beneficial things which he desires, (though they are) really given by me.\n\nBut the fruit thus (obtained) by them, who have little judgment, is perishable.\n\nThose who worship the divinities go to the divinities , and my worshippers, too, go to me.\n\nThe undiscerning ones, not knowing my transcendent and inexhaustible essence, than which there is nothing higher, think me, who am unperceived, to have become perceptible .\n\nSurrounded by the delusion of my mystic power , I am not manifest to all.\n\nThis deluded world knows not me unborn and inexhaustible.\n\nI know, O Ar g una!\n\nthe things which have been, those which are, and those which are to be.\n\nBut me nobody knows.\n\nAll beings, O terror of (your) foes!\n\nare deluded at the time of birth by the delusion, O descendant of Bharata!\n\ncaused by the pairs of opposites arising from desire and aversion.\n\nBut the men of meritorious actions, whose sins have terminated, worship me, being released from the delusion (caused) by the pairs of opposites, and being firm in their beliefs .\n\nThose who, resting on me, work for release from old age and death , know the Brahman , the whole Adhyâtma, and all action.\n\nAnd those who know me with the Adhibhûta, the Adhidaiva, and the Adhiya g ña, having minds devoted to abstraction, know me at the time of departure (from this world)."


[content]
body = "CHAPTER IX.\n\nNow I will speak to you, who are not given to carping, of that most mysterious knowledge, accompanied by experience, by knowing which you will be released from evil.\n\nIt is the chief among the sciences, the chief among the mysteries.\n\nIt is the best means of sanctification.\n\nIt is imperishable, not opposed to the sacred law.\n\nIt is to be apprehended directly , and is easy to practise.\n\nO terror of your foes!\n\nthose men who have no faith in this holy doctrine, return to the path of this mortal world, without attaining to me.\n\nThis whole universe is pervaded by me in an unperceived form.\n\nAll entities live in me, but I do not live in them .\n\nNor yet do all entities live in me.\n\nSee my divine power.\n\nSupporting all entities and producing all entities, my self lives not in (those) entities.\n\nAs the great and ubiquitous atmosphere always remains in space, know that similarly all entities live in me .\n\nAt the expiration of a Kalpa, O son of Kuntî!\n\nall entities enter my nature; and at the beginning of a Kalpa, I again bring them forth.\n\nTaking the control of my own nature , I bring forth again and again this whole collection of entities, without a will of its own , by the power of nature.\n\nBut, O Ar g una!\n\nthese actions do not fetter me, who remain like one unconcerned, and who am unattached to those actions.\n\nNature gives birth to movables and immovables through me, the supervisor, and by reason of that , O son of Kuntî!\n\nthe universe revolves.\n\nDeluded people of vain hopes, vain acts, vain knowledge , whose minds are disordered, and who are inclined to the delusive nature of Asuras and Râkshasas, not knowing my highest nature as great lord of all entities, disregard me as I have assumed a human body .\n\nBut the high-souled ones, O son of P ri thâ!\n\nwho are inclined to the godlike nature, knowing me as the inexhaustible source of (all) entities, worship me with minds not (turned) elsewhere.\n\nConstantly glorifying me, and exerting themselves , firm in their vows , and saluting me with reverence, they worship me, being always devoted.\n\nAnd others again, offering up the sacrifice of knowledge, worship me as one, as distinct, and as all-pervading in numerous forms .\n\nI am the Kratu , I am the Ya g ña, I am the Svadhâ, I the product of the herbs.\n\nI am the sacred verse.\n\nI too am the sacrificial butter, and I the fire, I the offering .\n\nI am the father of this universe, the mother, the creator, the grandsire, the thing to be known, the means of sanctification, the syllable Om , the Rik , Sâman, and Ya g us also; the goal, the sustainer, the lord, the supervisor, the residence , the asylum, the friend, the source, and that in which it merges, the support, the receptacle, and the inexhaustible seed.\n\nI cause heat and I send forth and stop showers.\n\nI am immortality and also death; and I, O Ar g una!\n\nam that which is and that which is not .\n\nThose who know the three (branches of) knowledge, who drink the Soma juice, whose sins are washed away, offer sacrifices and pray to me for a passage into heaven; and reaching the holy world of the lord of gods, they enjoy in the celestial regions the celestial pleasures of the gods.\n\nAnd having enjoyed that great heavenly world, they enter the mortal world when (their) merit is exhausted ."


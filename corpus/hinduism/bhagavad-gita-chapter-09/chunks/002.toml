[content]
body = "Thus those who wish for objects of desire, and resort to the ordinances of the three (Vedas), obtain (as the fruit) going and coming.\n\nTo those men who worship me, meditating on me and on no one else, and who are constantly devoted, I give new gifts and preserve what is acquired by them .\n\nEven those, O son of Kuntî!\n\nwho being devotees of other divinities worship with faith, worship me only, (but) irregularly .\n\nFor I am the enjoyer as well as the lord of all sacrifices.\n\nBut they know me not truly, therefore do they fall .\n\nThose who make vows to the gods go to the gods; those who make vows to the manes go to the manes, those who worship the Bhûtas go to the Bhûtas; and those likewise who worship me go to me.\n\nWhoever with devotion offers me leaf, flower, fruit, water, that, presented with devotion, I accept from him whose self is pure.\n\nWhatever you do, O son of Kuntî!\n\nwhatever you eat, whatever sacrifice you make, whatever you give, whatever penance you perform, do that as offered to me .\n\nThus will you be released from the bonds of action, the fruits of which are agreeable or disagreeable.\n\nAnd with your self possessed of (this) devotion, (this) renunciation , you will be released (from the bonds of action) and will come to me.\n\nI am alike to all beings; to me none is hateful, none dear.\n\nBut those who worship me with devotion (dwell) in me , and I too in them.\n\nEven if a very ill-conducted man worships me, not worshipping any one else, he must certainly be deemed to be good, for he has well resolved .\n\nHe soon becomes devout of heart, and obtains lasting tranquillity.\n\n(You may) affirm, O son of Kuntî!\n\nthat my devotee is never ruined.\n\nFor, O son of P ri thâ!\n\neven those who are of sinful birth , women, Vai s yas; and S ûdras likewise, resorting to me, attain the supreme goal.\n\nWhat then (need be said of) holy Brâhma n as and royal saints who are (my) devotees?\n\nComing to this transient unhappy world, worship me.\n\n(Place your) mind on me, become my devotee, my worshipper; reverence me, and thus making me your highest goal, and devoting your self to abstraction, you will certainly come to me."


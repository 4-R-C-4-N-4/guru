[content]
body = "For him who discerns between the Mind and the Spiritual Man, there comes perfect fruition of the longing after the real being of the Self. How many times in the long struggle have the Soul's aspirations seemed but a hopeless, impossible dream, a madman's counsel of perfection. Yet every finest, most impossible aspiration shall be realized, and ten times more than realized, once the long, arduous fight against the 'mind,' and the mind's worldview is won. And then it will be seen that unfaith and despair were but weapons of the 'mind,' to daunt the Soul, and put off the day when the neck of the 'mind' shall be put under the foot of the Soul. Have you aspired, well-nigh hopeless, after immortality? You shall be paid by entering the immortality of God. Have you aspired, in misery and pain, after consoling, healing love? You shall be made a dispenser of the divine love of God Himself to weary souls. Have you sought ardently, in your day of feebleness, after power? You shall wield power immortal, infinite, with God working the works of God. Have you, in lonely darkness, longed for companionship and consolation? You shall have angels and archangels for your friends, and all the immortal hosts of the Dawn. These are the fruits of victory. Therefore overcome. These are the prizes of regeneration. Therefore die to self, that you may rise again to God."


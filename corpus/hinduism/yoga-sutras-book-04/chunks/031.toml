[content]
body = "When all veils are rent, all stains washed away, his knowledge becomes infinite; little remains for him to know. The first veil is the delusion that thy soul is in some permanent way separate from the great Soul, the divine Eternal. When that veil is rent, thou shalt discern thy oneness with everlasting Life. The second veil is the delusion of enduring separateness from thy other selves, whereas in truth the soul that is in them is one with the soul that is in thee. The world's sin and shame are thy sin and shame: its joy also. These veils rent, thou shalt enter into knowledge of divine things and human things. Little will remain unknown to thee."


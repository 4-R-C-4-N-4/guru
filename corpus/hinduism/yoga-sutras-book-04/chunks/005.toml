[content]
body = "In the different fields of manifestation, the Consciousness, though one, is the elective cause of many states of consciousness. Here is the splendid teaching of oneness that lies at the heart of the Eastern wisdom. Consciousness is ultimately One, everywhere and forever. The Eternal, the Father, is the One Self of All Beings. And so, in each individual who is but a facet of that Self, Consciousness is One. Whether it breaks through as the dull fire of physical life, or the murky flame of the psychic and passional, or the radiance of the spiritual man, or the full glory of the Divine, it is ever the Light, naught but the Light. The one Consciousness is the effective cause of all states of consciousness, on every plane."


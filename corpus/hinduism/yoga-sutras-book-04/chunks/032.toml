[content]
body = "Thereafter comes the completion of the series of transformations of the three nature potencies, since their purpose is attained. It is a part of the beauty and wisdom of the great Indian teachings, the Vedanta and the Yoga alike, to hold that all life exists for the purposes of Soul, for the making of the spiritual man. They teach that all nature is an orderly process of evolution, leading up to this, designed for this end, existing only for this: to bring forth and perfect the Spiritual Man. He is the crown of evolution: at his coming, the goal of all development is attained."


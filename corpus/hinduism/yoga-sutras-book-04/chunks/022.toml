token_count = 157

[content]
body = "When the psychical nature takes on the form of the spiritual intelligence, by reflecting it, then the Self becomes conscious of its own spiritual intelligence. We are considering a stage of spiritual life at which the psychical nature has been cleansed and purified. Formerly, it reflected in its plastic substance the images of the earthy; purified now, it reflects the image of the heavenly, giving the spiritual intelligence a visible form. The Self, beholding that visible form, in which its spiritual intelligence has, as it were, taken palpable shape, thereby reaches self-recognition, self-comprehension. The Self sees itself in this mirror, and thus becomes not only conscious, but self-conscious. This is, from one point of view, the purpose of the whole evolutionary process."


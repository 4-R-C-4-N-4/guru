[content]
body = "The movements of the psychic nature are perpetually objects of perception, since the Spiritual Man, who is the lord of them, remains unchanging. Here is teaching of the utmost import, both for understanding and for practice. To the psychic nature belong all the ebb and flow of emotion, all hoping and fearing, desire and hate: the things that make the multitude of men and women deem themselves happy or miserable. To it also belong the measuring and comparing, the doubt and questioning, which, for the same multitude, make up mental life. So that there results the emotion-soaked personality, with its dark and narrow view of life: the shivering, terror driven personality that is life itself for all but all of mankind. Yet the personality is not the true man, not the living soul at all, but only a spectacle which the true man observes. Let us under stand this, therefore, and draw ourselves up inwardly to the height of the Spiritual Man, who, standing in the quiet light of the Eternal, looks down serene upon this turmoil of the outer life. One first masters the personality, the 'mind,' by thus looking down on it from above, from within; by steadily watching its ebb and flow, as objective, outward, and therefore not the real Self. This standing back is the first step, detachment. The second, to maintain the vantage-ground thus gained, is recollection."


[content]
body = "The psychic nature, taking on the colour of the Seer and of things seen, leads to the perception of all objects. In the unregenerate man, the psychic nature is saturated with images of material things, of things seen, or heard, or tasted, or felt; and this web of dynamic images forms the ordinary material and driving power of life. The sensation of sweet things tasted clamours to be renewed, and drives the man into effort to obtain its renewal; so he adds image to image, each dynamic and importunate, piling up sin's intolerable burden. Then comes regeneration, and the washing away of sin, through the fiery, creative power of the Soul, which burns out the stains of the psychic vesture, purifying it as gold is refined in the furnace. The suffering of regeneration springs from this indispensable purifying. Then the psychic vesture begins to take on the colour of the Soul, no longer stained, but suffused with golden light; and the man red generate gleams with the radiance of eternity. Thus the Spiritual Man puts on fair raiment; for of this cleansing it is said: Though your sins be as scarlet, they shall be white as snow; though they be as crimson, they shall be as wool."


[content]
body = "The series of dynamic mind-images is beginningless, because Desire is everlasting. The whole series of dynamic mind-images, which make up the entire history of the personal man, is a part of the mechanism which the Self employs, to mirror itself in a reflection, to embody its powers in an outward form, to the end of self-expression, self-realization, self-knowledge. Therefore the initial impulse behind these dynamic mind-images comes from the Self and is the descending ray of the Self; so that it cannot be said that there is any first member of the series of images, from which the rest arose. The impulse is beginningless, since it comes from the Self, which is from everlasting. Desire is not to cease; it is to turn to the Eternal, and so become aspiration."


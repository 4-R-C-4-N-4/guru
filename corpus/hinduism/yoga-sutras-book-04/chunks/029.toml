[content]
body = "He who, after he has attained, is wholly free from self, reaches the essence of all that can be known, gathered together like a cloud. This is the true spiritual consciousness. It has been said that, at the beginning of the way, we must kill out ambition, the great curse, the giant weed which grows as strongly in the heart of the devoted disciple as in the man of desire. The remedy is sacrifice of self, obedience, humility; that purity of heart which gives the vision of God. Thereafter, he who has attained is wrapt about with the essence of all that can be known, as with a cloud; he has that perfect illumination which is the true spiritual consciousness. Through obedience to the will of God, he comes into oneness of being with God; he is initiated into God's view of the universe, seeing all life as God sees it."


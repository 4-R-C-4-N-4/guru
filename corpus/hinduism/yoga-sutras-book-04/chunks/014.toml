[content]
body = "The external manifestation of an object takes place when the transformations ore in the same phase. We should be inclined to express the same law by saying, for example, that a sound is audible, when it consists of vibrations within the compass of the auditory nerve; that an object is visible, when either directly or by reflection, it sends forth luminiferous vibrations within the compass of the retina and the optic nerve. Vibrations below or above that compass make no impression at all, and the object remains invisible; as, for example, a kettle of boiling water in a dark room, though the kettle is sending forth heat vibrations closely akin to light. So, when the vibrations of the object and those of the perceptive power are in the same phase, the external manifestation of the object takes place. There seems to be a further suggestion that the appearance of an object in the 'present,' or its remaining hid in the 'past,' or 'future,' is likewise a question of phase, and, just as the range of vibrations perceived might be increased by the development of finer senses, so the perception of things past, and things to come, may be easy from a higher point of view."


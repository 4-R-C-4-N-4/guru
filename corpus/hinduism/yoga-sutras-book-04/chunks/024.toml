[content]
body = "The psychic nature, which has been printed with mind-images of innumerable material things, exists now for the Spiritual Man, building for him. The 'mind,' once the tyrant, is now the slave, recognized as outward, separate, not Self, a well-trained instrument of the Spiritual Man. For it is not ordained for the Spiritual Man that, finding his high realm, he shall enter altogether there, and pass out of the vision of mankind. It is true that he dwells in heaven, but he also dwells on earth. He has angels and archangels, the hosts of the just made perfect, for his familiar friends, but he has at the same time found a new kinship with the prone children of men, who stumble and sin in the dark. Finding sinlessness, he finds also that the world's sin and shame are his, not to share, but to atone; finding kinship with angels, he likewise finds his part in the toil of angels, the toil for the redemption of the world. For this work, he, who now stands in the heavenly realm, needs his instrument on earth; and this instrument he finds, ready to his hand, and fitted and perfected by the very struggles he has waged against it, in the personality, the 'mind,' of the personal man. This once tyrant is now his servant and perfect ambassador, bearing witness, before men, of heavenly things and even in this present world doing the will and working the works of the Father."


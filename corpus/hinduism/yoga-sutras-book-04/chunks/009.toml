[content]
body = "Works separated by different nature, or place, or time, are brought together by the correspondence between memory and dynamic impression. Just as, in the ripening out of mind-images into bodily conditions, the effect is brought about by the ray of creative force sent down by the Self, somewhat as the light of the magic lantern projects the details of a picture on the screen, revealing the hidden, and making secret things palpable and visible, so does this divine ray exercise a selective power on the dynamic mind-images, bringing together into one day of life the seeds gathered from many days. The memory constantly exemplifies this power; a passage of poetry will call up in the mind like passages of many poets, read at different times. So a prayer may call up many prayers. In like manner, the same over-ruling selective power, which is a ray of the Higher Self, gathers together from different births and times and places those mind-images which are conformable, and may be grouped in the frame of a single life or a single event. Through this grouping, visible bodily conditions or outward circumstances are brought about, and by these the soul is taught and trained. Just as the dynamic mind-images of desire ripen out in bodily conditions and circumstances, so the far more dynamic powers of aspiration, wherein the soul reaches toward the Eternal, have their fruition in a finer world, building the vesture of the spiritual man."


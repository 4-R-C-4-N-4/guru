[content]
body = "The works of followers after Union make neither for bright pleasure nor for dark pain The works of others make for pleasure or pain, or a mingling of these. The man of desire wins from his works the reward of pleasure, or incurs the penalty of pain; or, as so often happens in life, his guerdon, like the passionate mood of the lover, is part pleasure and part pain. Works done with self-seeking bear within them the seeds of future sorrow; conversely, according to the proverb, present pain is future gain. But, for him who has gone beyond desire, whose desire is set on the Eternal, neither pain to be avoided nor pleasure to be gained inspires his work. He fears no hell and desires no heaven. His one desire is, to know the will of the Father and finish His work. He comes directly in line with the divine Will, and works cleanly and immediately, without longing or fear. His heart dwells in the Eternal; all his desires are set on the Eternal."


[content]
body = "The series of transformations is divided into moments. When the series is completed, time gives place to duration. There are two kinds of eternity, says the commentary: the eternity of immortal life, which belongs to the Spirit, and the eternity of change, which inheres in Nature, in all that is not Spirit. While we are content to live in and for Nature, in the Circle of Necessity, Sansara, we doom ourselves to perpetual change. That which is born must die, and that which dies must be reborn. It is change evermore, a ceaseless series of transformations. But the Spiritual Man enters a new order; for him, there is no longer eternal change, but eternal Being. He has entered into the joy of his Lord. This spiritual birth, which makes him heir of the Everlasting, sets a term to change; it is the culmination, the crowning transformation, of the whole realm of change."


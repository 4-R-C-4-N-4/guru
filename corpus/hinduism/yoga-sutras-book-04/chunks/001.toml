[content]
body = "Psychic and spiritual powers may be inborn, or they may be gained by the use of drugs, or by incantations, or by fervour, or by Meditation. Spiritual powers have been enumerated and described in the preceding sections. They are the normal powers of the spiritual man, the antetype, the divine edition, of the powers of the natural man. Through these powers, the spiritual man stands, sees, hears, speaks, in the spiritual world, as the physical man stands, sees, hears, speaks in the natural world. There is a counterfeit presentment of the spiritual man, in the world of dreams, a shadow lord of shadows, who has his own dreamy powers of vision, of hearing, of movement; he has left the natural without reaching the spiritual. He has set forth from the shore, but has not gained the further verge of the river. He is borne along by the stream, with no foothold on either shore. Leaving the actual, he has fallen short of the real, caught in the limbo of vanities and delusions. The cause of this aberrant phantasm is always the worship of a false, vain self, the lord of dreams, within one's own breast. This is the psychic man, lord of delusive and bewildering psychic powers. Spiritual powers, like intellectual or artistic gifts, may be inborn: the fruit, that is, of seeds planted and reared with toil in a former birth. So also the powers of the psychic man may be inborn, a delusive harvest from seeds of delusion. Psychical powers may be gained by drugs, as poverty, shame, debasement may be gained by the self-same drugs. In their action, they are baneful, cutting the man off from consciousness of the restraining power of his divine nature, so that his forces break forth exuberant, like the laughter of drunkards, and he sees and hears things delusive. While sinking, he believes that he has risen; growing weaker, he thinks himself full of strength; beholding illusions, he takes them to be true. Such are the powers gained by drugs; they are wholly psychic, since the real powers, the spiritual, can never be so gained. Incantations are affirmations of half-truths concerning spirit and matter, what is and what is not, which work upon the mind and slowly build up a wraith of powers and a delusive well-being. These, too, are of the psychic realm of dreams. Lastly, there are the true powers of the spiritual man, built up and realized in Meditation, through reverent obedience to spiritual law, to the pure conditions of being, in the divine realm."


[content]
body = "In the internals of the batik, other thoughts will arise, through the impressions of the dynamic mind-images. The battle is long and arduous. Let there be no mistake as to that. Go not forth to this battle without counting the cost. Ages have gone to the strengthening of the foe. Ages of conflict must be spent, ere the foe, wholly conquered, becomes the servant, the Soul's minister to mankind. And from these long past ages, in hours when the contest flags, will come new foes, mind-born children springing up to fight for mind, reinforcements coming from forgotten years, forgotten lives. For once this conflict is begun, it can be ended only by sweeping victory, and unconditional, unreserved surrender of the vanquished."


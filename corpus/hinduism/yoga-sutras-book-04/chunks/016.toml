[content]
body = "Nor do material objects defend upon a single mind, for how could they remain objective to others, if that mind ceased to think of them? This is but a further development of the thought of the preceding Sutra, carrying on the thought that, while the universe is spiritual, yet its material expression is ordered, consistent, ruled by law, not subject to the whims or affirmations of a single mind. Unwelcome material things may be escaped by spiritual growth, by rising to a realm above them, and not by denying their existence on their own plane. So that our system is neither materialistic, nor idealistic in the extreme sense, but rather intuitional and spiritual, holding that matter is the manifestation of spirit as a whole, a reflection or externalization of spirit, and, like spirit, everywhere obedient to law. The path of liberation is not through denial of matter but through denial of the wills of self, through obedience, and that aspiration which builds the vesture of the spiritual man."


[content]
body = "These are to be overcome as it was taught that hindrances should be overcome. These new enemies and fears are to be overcome by ceaselessly renewing the fight, by a steadfast, dogged persistence, whether in victory or defeat, which shall put the stubbornness of the rocks to shame. For the Soul is older than all things, and invincible; it is of the very nature of the Soul to be unconquerable. Therefore fight on, undaunted; knowing that the spiritual will, once awakened, shall, through the effort of the contest, come to its full strength; that ground gained can be held permanently; that great as is the dead-weight of the adversary, it is yet measurable, while the Warrior who fights for you, for whom you fight, is, in might, immeasurable, invincible, everlasting."


[content]
body = "Thereon comes surcease from sorrow and the burden of toil. Such a one, it is said, is free from the bond of Karma, from the burden of toil, from that debt to works which comes from works done in self-love and desire. Free from self-will, he is free from sorrow, too, for sorrow comes from the fight of self-will against the divine will, through the correcting stress of the divine will, which seeks to counteract the evil wrought by disobedience. When the conflict with the divine will ceases, then sorrow ceases, and he who has grown into obedience, thereby enters into joy."


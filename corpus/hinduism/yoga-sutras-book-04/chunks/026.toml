[content]
body = "Thereafter, the whole personal being bends toward illumination, toward Eternal Life. This is part of the secret of the Soul, that salvation means, not merely that a soul shall be cleansed and raised to heaven, but that the whole realm of the natural powers shall be redeemed, building up, even in this present world, the kingly figure of the Spiritual Man. The traditions of the ages are full of his footsteps; majestic, uncomprehended shadows, myths, demi-gods, fill the memories of all the nobler peoples. But the time cometh, when he shall be known, no longer demi-god, nor myth, nor shadow, but the ever-present Redeemer, working amid men for the life and cleansing of all souls."


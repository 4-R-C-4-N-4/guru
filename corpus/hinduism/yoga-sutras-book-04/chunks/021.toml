[content]
body = "If the Mind be thought of as seen by another more inward Mind, then there would be an endless series of perceiving Minds, and a confusion of memories. One of the expedients by which the 'mind' seeks to deny and thwart the Soul, when it feels that it is beginning to be circumvented and seen through, is to assert that this seeing is the work of a part of itself, one part observing the other, and thus leaving no need nor place for the Spiritual Man. To this strategy the argument is opposed by our philosopher, that this would be no true solution, but only a postponement of the solution. For we should have to find yet another part of the mind to view the first observing part, and then another to observe this, and so on, endlessly. The true solution is, that the Spiritual Man looks down upon the psychic nature, and observes it; when he views the psychic pictures gallery, this is 'memory,' which would be a hopeless, inextricable confusion, if we thought of one part of the 'mind,' with its memories, viewing another part, with memories of its own. The solution of the mystery lies not in the 'mind' but beyond it, in the luminous life of the risen Lord, the Spiritual Man."


[content]
body = "Pure spiritual life is, therefore, the inverse resolution of the potencies of Nature, which have emptied themselves of their value for the Spiritual man; or it is the return of the power of pure Consciousness to its essential form. Here we have a splendid generalization, in which our wise philosopher finally reconciles the naturalists and the idealists, expressing the crown and end of his teaching, first in the terms of the naturalist, and then in the terms of the idealist. The birth and growth of the Spiritual Man, and his entry into his immortal heritage, may be regarded, says our philosopher, either as the culmination of the whole process of natural evolution and involution, where 'that which flowed from out the boundless deep, turns again home'; or it may be looked at, as the Vedantins look at it, as the restoration of pure spiritual Consciousness to its pristine and essential form. There is no discrepancy or conflict between these two views, which are but two accounts of the same thing. Therefore those who study the wise philosopher, be they naturalist or idealist, have no excuse to linger over dialetic subtleties or disputes. These things are lifted from their path, lest they should be tempted to delay over them, and they are left facing the path itself, stretching upward and onward from their feet to the everlasting hills, radiant with infinite Light. THE END"


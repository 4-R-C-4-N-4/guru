[content]
body = "Since the dynamic mind-images are held together by impulses of desire, by the wish for personal reward, by the substratum of mental habit, by the support of outer things desired; therefore, when these cease, the self reproduction of dynamic mind-images ceases. We are still concerned with the personal life in its bodily vesture, and with the process whereby the forces which have upheld it are gradually transferred to the life of the spiritual man, and build up for him his finer vesture in a finer world. How is the current to be changed? How is the flow of self-reproductive mind-images, which have built the conditions of life after life in this world of bondage, to be checked, that the time of imprisonment may come to an end, the day of liberation dawn? The answer is given in the Sutra just translated. The driving-force is withdrawn and directed to the upbuilding of the spiritual body. When the building impulses and forces are withdrawn, the tendency to manifest a new psychical body, a new body of bondage, ceases with them."


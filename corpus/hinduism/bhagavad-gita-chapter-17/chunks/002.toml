[content]
body = "That gift is said (to be) good, which is given, because it ought to be given, to one who (can) do no service (in return), at a (proper) place and time, an d to a (proper) person.\n\nBut that gift which is given with much difficulty, for a return of services, or even with an expectation of fruit , is said to be passionate.\n\nAnd that gift, is described as dark, which is given to unfit persons, at an unfit place and time, without respect, and with contempt.\n\nOm, Tad, and Sat, this is said (to be) the threefold designation of the Brahman.\n\nBy that , the Brâhma n as and the Vedas and sacrifices were created in olden times.\n\nHence, the performance by those who study the Brahman, of sacrifices, gifts, and penances, prescribed by the ordinances (of scripture), always commence after saying 'Om .' Those who desire final emancipation perform the various acts of sacrifice and penance, and the various acts of gift, without expectation of fruit, after (saying) 'Tad .' 'Sat' is employed to express existence and goodness; and likewise, O son of P ri thâ!\n\nthe word 'Sat' is used to express an auspicious act.\n\nConstancy in (making) sacrifices.\n\npenances, and gifts, is called 'Sat;' and (all) action, too, of which that is the object, is also called 'Sat.' Whatever oblation is offered, whatever is given, whatever penance is performed, and whatever is done, without faith , that, O son of P ri thâ!\n\nis called 'Asat,' and that is nought, both after death and here ."


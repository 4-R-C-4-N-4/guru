[content]
body = "Thence comes the mind's power to hold itself in the light. It has been well said, that what we most need is the faculty of spiritual attention; and in the same direction of thought it has been eloquently declared that prayer does not consist in our catching God's attention, but rather in our allowing God to hold our attention. The vital matter is, that we need to disentangle our consciousness from the noisy and perturbed thraldom of the psychical, and to come to consciousness as the spiritual man. This we must do, first, by purification, through the Commandments and the Rules; and, second, through the faculty of spiritual attention, by steadily heeding endless fine intimations of the spiritual power within us, and by intending our consciousness thereto; thus by degrees transferring the centre of consciousness from the psychical to the spiritual. It is a question, first, of love, and then of attention."


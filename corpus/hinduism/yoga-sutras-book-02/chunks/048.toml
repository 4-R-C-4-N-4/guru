[content]
body = "The fruit of right poise is the strength to resist the shocks of infatuation or sorrow. In the simpler physical sense, which is also coveted by the wording of the original, this sentence means that wise effort establishes such bodily poise that the accidents of life cannot disturb it, as the captain remains steady, though disaster overtake his ship. But the deeper sense is far more important. The spiritual man, too, must learn to withstand all shocks, to remain steadfast through the perturbations of external things and the storms and whirlwinds of the psychical world. This is the power which is gained by wise, continuous effort, and by filling the spirit with the atmosphere of the Eternal."


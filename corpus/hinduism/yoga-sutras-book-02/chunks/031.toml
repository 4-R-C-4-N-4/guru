[content]
body = "The Rules are these: purity, serenity fervent aspiration, spiritual reading, and per feet obedience to the Master. Here we have a finer law, one which humanity as a whole is less ready for, less fit to obey. Yet we can see that these Rules are the same in essence as the Commandments, but on a higher, more spiritual plane. The Commandments may be obeyed in outer acts and abstinences; the Rules demand obedience of the heart and spirit, a far more awakened and more positive consciousness. The Rules are the spiritual counterpart of the Commandments, and they have finer degrees, for more advanced spiritual growth."


[content]
body = "Their active turnings are to be removed by meditation. Here is, in truth, the whole secret of Yoga, the science of the soul. The active turnings, the strident vibrations, of selfishness, lust and hate are to be stilled by meditation, by letting heart and mind dwell in spiritual life, by lifting up the heart to the strong, silent life above, which rests in the stillness of eternal love, and needs no harsh vibration to convince it of true being."


[content]
body = "These bear fruits of rejoicing, or of affliction, as they are sprung from holy or unholy works. Since holiness is obedience to divine law, to the law of divine harmony, and obedience to harmony strengthens that harmony in the soul, which is the one true joy, therefore joy comes of holiness: comes, indeed, in no other way. And as unholiness is disobedience, and therefore discord, therefore unholiness makes for pain; and this two-fold law is true, whether the cause take effect in this, or in a yet unmanifested birth."


[content]
body = "To the pure of heart come also a quiet spirit, one-pointed thought, the victory over sensuality, and fitness to behold the Soul. Blessed are the pure in heart, for they shall see God, who is the supreme Soul; the ultimate Self of all beings. In the deepest sense, purity means fitness for this vision, and also a heart cleansed from all disquiet, from all wandering and unbridled thought, from the torment of sensuous imaginings; and when the spirit is thus cleansed and pure, it becomes at one in essence with its source, the great Spirit, the primal Life. One consciousness now thrills through both, for the psychic partition wall is broken down. Then shall the pure in heart see God, because they become God."


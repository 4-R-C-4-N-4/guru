[content]
body = "The right Withdrawal is the disengaging of the powers from entanglement in outer things, as the psychic nature has been withdrawn and stilled. To understand this, let us reverse the process, and think of the one consciousness, centred in the Soul, gradually expanding and taking on the form of the different perceptive powers; the one will, at the same time, differentiating itself into the varied powers of action. Now let us imagine this to be reversed, so that the spiritual force, which has gone into the differentiated powers, is once more gathered together into the inner power of intuition and spiritual will, taking on that unity which is the hallmark of spiritual things, as diversity is the seal of material things. It is all a matter of love for the quality of spiritual consciousness, as against psychical consciousness, of love and attention. For where the heart is, there will the treasure be also; where the consciousness is, there will the vesture with its powers be developed."


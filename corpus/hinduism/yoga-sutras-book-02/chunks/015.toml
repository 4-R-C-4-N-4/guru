[content]
body = "To him who possesses discernment, all personal life is misery, because it ever waxes and wanes, is ever afflicted with restlessness, makes ever new dynamic impresses in the mind; and because all its activities war with each other. The whole life of the psychic self is misery, because it ever waxes and wanes; because birth brings inevitable death; because there is no expectation without its shadow, fear. The life of the psychic self is misery, because it is afflicted with restlessness; so that he who has much, finds not satisfaction, but rather the whetted hunger for more. The fire is not quenched by pouring oil on it; so desire is not quenched by the satisfaction of desire. Again, the life of the psychic self is misery, because it makes ever new dynamic impresses in the mind; because a desire satisfied is but the seed from which springs the desire to find like satisfaction again. The appetite comes in eating, as the proverb says, and grows by what it feeds on. And the psychic self, torn with conflicting desires, is ever the house divided against itself, which must surely fall."


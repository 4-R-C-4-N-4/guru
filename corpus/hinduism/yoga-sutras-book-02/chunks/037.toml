[content]
body = "For him who is perfect in continence, the reward is valour and virility. The creative power, strong and full of vigour, is no longer dissipated, but turned to spiritual uses. It upholds and endows the spiritual man, conferring on him the creative will, the power to engender spiritual children instead of bodily progeny. An epoch of life, that of man the animal, has come to an end; a new epoch, that of the spiritual man, is opened. The old creative power is superseded and transcended; a new creative power, that of the spiritual man, takes its place, carrying with it the power to work creatively in others for righteousness and eternal life. One of the commentaries says that he who has attained is able to transfer to the minds of his disciples what he knows concerning divine union, and the means of gaining it. This is one of the powers of purity."


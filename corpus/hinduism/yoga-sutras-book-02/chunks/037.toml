[content]
body = "Where cessation from theft is perfected, all treasures present themselves to him who possesses it. Here is a sentence which may warn us that, beside the outer and apparent meaning, there is in many of these sentences a second and finer significance. The obvious meaning is, that he who has wholly ceased from theft, in act, thought and wish, finds buried treasures in his path, treasures of jewels and gold and pearls. The deeper truth is, that he who in every least thing is wholly honest with the spirit of Life, finds Life supporting him in all things, and gains admittance to the treasure house of Life, the spiritual universe."


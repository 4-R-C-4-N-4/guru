[content]
body = "The darkness of unwisdom is the field of the others. These hindrances may be dormant, or worn thin, or suspended, or expanded. Here we have really two Sutras in one. The first has been explained already: in the darkness of unwisdom grow the parasites, hate, lust, attachment. They are all outgrowths of the self-absorption of the psychical self. Next, we are told that these barriers may be either dormant, or suspended, or expanded, or worn thin. Faults which are dormant will be brought out through the pressure of life, or through the pressure of strong aspiration. Thus expanded, they must be fought and conquered, or, as Patanjali quaintly says, they must be worn thin,-as a veil might, or the links of manacles."


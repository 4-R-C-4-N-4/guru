[content]
body = "The darkness of unwisdom is the field of the others. These hindrances may be dormant, or worn thin, or suspended, or expanded. Here we have really two Sutras in one. The first has been explained already: in the darkness of unwisdom grow the parasites, hate, lust, attachment. They are all outgrowths of the self-absorption of the psychical self. Next, we are told that these barriers may be either dormant, or suspended, or expanded, or worn thin. Faults which are dormant will be brought out through the pressure of life, or through the pressure of strong aspiration. Thus expanded, they must be fought and conquered, or, as Patanjali quaintly says, they must be worn thin,-as a veil might, or the links of manacles. 5 The darkness of ignorance is: holding that which is unenduring, impure, full of pain, not the Soul, to be eternal, pure, full of joy, the Soul. This we have really considered already. The psychic man is unenduring, impure, full of pain, not the Soul, not the real Self. The spiritual man is enduring, pure, full of joy, the real Self. The darkness of unwisdom is, therefore, the self-absorption of the psychical, personal man, to the exclusion of the spiritual man. It is the belief, carried into action, that the personal man is the real man, the man for whom we should toil, for whom we should build, for whom we should live. This is that psychical man of whom it is said: he that soweth to the flesh, shall of the flesh reap corruption."


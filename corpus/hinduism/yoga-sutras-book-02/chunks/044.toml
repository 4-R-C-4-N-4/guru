[content]
body = "Through spiritual reading, the disciple gains communion with the divine Power on which his heart is set. Spiritual reading meant, for ancient India, something more than it does with us. It meant, first, the recital of sacred texts, which, in their very sounds, had mystical potencies; and it meant a recital of texts which were divinely emanated, and held in themselves the living, potent essence of the divine. For us, spiritual reading means a communing with the recorded teachings of the Masters of wisdom, whereby we read ourselves into the Master's mind, just as through his music one can enter into the mind and soul of the master musician. It has been well said that all true art is contagion of feeling; so that through the true reading of true books we do indeed read ourselves into the spirit of the Masters, share in the atmosphere of their wisdom and power, and come at last into their very presence."


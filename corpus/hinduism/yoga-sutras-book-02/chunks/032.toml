[content]
body = "When transgressions hinder, the weight of the imagination should be thrown on the opposite side. Let us take a simple case, that of a thief, a habitual criminal, who has drifted into stealing in childhood, before the moral consciousness has awakened. We may imprison such a thief, and deprive him of all possibility of further theft, or of using the divine gift of will. Or we may recognize his disadvantages, and help him gradually to build up possessions which express his will, and draw forth his self-respect. If we imagine that, after he has built well, and his possessions have become dear to him, he himself is robbed, then we can see how he would come vividly to realize the essence of theft and of honesty, and would cleave to honest dealings with firm conviction. In some such way does the great Law teach us. Our sorrows and losses teach us the pain of the sorrow and loss we inflict on others, and so we cease to inflict them. Now as to the more direct application. To conquer a sin. let heart and mind rest, not on the sin, but on the contrary virtue. Let the sin be forced out by positive growth in the true direction, not by direct opposition. Turn away from the sin and go forward courageously, constructively, creatively, in well-doing. In this way the whole nature will gradually be drawn up to the higher level, on which the sin does not even exist. The conquest of a sin is a matter of growth and evolution, rather than of opposition."


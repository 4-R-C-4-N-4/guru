[content]
body = "The bringing of this association to an end, by bringing the darkness of unwisdom to an end, is the great liberation; this is the Seer's attainment of his own pure being. When the spiritual man has, through the psychical, learned all life's lessons, the time has come for him to put off the veil and disguise of the psychical and to stand revealed a King, in the house of the Father. So shall he enter into his kingdom, and go no more out."


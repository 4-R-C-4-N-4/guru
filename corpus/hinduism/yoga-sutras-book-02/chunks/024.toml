[content]
body = "The cause of this association is the darkness of unwisdom. The darkness of unwisdom is the absorption of consciousness in the personal life, and in the things seen by the personal life. This is the fall, through which comes experience, the learning of the lessons of life. When they are learned, the day of redemption is at hand."


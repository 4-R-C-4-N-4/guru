[content]
body = "The Seer is pure vision. Though pure, he looks out through the vesture of the mind. The Seer, as always, is the spiritual man whose deepest consciousness is pure vision, the pure life of the eternal. But the spiritual man, as yet unseeing in his proper person, looks out on the world through the eyes of the psychical man, by whom he is enfolded and enmeshed. The task is, to set this prisoner free, to clear the dust of ages from this buried temple."


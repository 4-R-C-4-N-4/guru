[content]
body = "Right poise must be firm and without strain. Here we approach a section of the teaching which has manifestly a two-fold meaning. The first is physical, and concerns the bodily position of the student, and the regulation of breathing. These things have their direct influence upon soul-life, the life of the spiritual man, since it is always and everywhere true that our study demands a sound mind in a sound body. The present sentence declares that, for work and for meditation, the position of the body must be steady and without strain, in order that the finer currents of life may run their course. It applies further to the poise of the soul, that fine balance and stability which nothing can shake, where the consciousness rests on the firm foundation of spiritual being. This is indeed the house set upon a rock, which the winds and waves beat upon in vain."


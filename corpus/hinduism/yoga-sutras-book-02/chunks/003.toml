[content]
body = "These are the hindrances: the darkness of unwisdom, self-assertion, lust hate, attachment. Let us try to translate this into terms of the psychical and spiritual man. The darkness of unwisdom is, primarily, the self-absorption of the psychical man, his complete preoccupation with his own hopes and fears, plans and purposes, sensations and desires; so that he fails to see, or refuses to see, that there is a spiritual man; and so doggedly resists all efforts of the spiritual man to cast off his psychic tyrant and set himself free. This is the real darkness; and all those who deny the immortality of the soul, or deny the soul's existence, and so lay out their lives wholly for the psychical, mortal man and his ambitions, are under this power of darkness. Born of this darkness, this psychic self-absorption, is the dogged conviction that the psychic, personal man has separate, exclusive interests, which he can follow for himself alone; and this conviction, when put into practice in our life, leads to contest with other personalities, and so to hate. This hate, again, makes against the spiritual man, since it hinders the revelation of the high harmony between the spiritual man and his other selves, a harmony to be revealed only through the practice of love, that perfect love which casts out fear. In like manner, lust is the psychic man's craving for the stimulus of sensation, the din of which smothers the voice of the spiritual man, as, in Shakespeare's phrase, the cackling geese would drown the song of the nightingale. And this craving for stimulus is the fruit of weakness, coming from the failure to find strength in the primal life of the spiritual man. Attachment is but another name for psychic self-absorption; for we are absorbed, not in outward things, but rather in their images within our minds; our inner eyes are fixed on them; our inner desires brood over them; and so we blind ourselves to the presence of the prisoner, the enmeshed and fettered spiritual man."


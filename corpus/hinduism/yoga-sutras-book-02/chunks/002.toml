[content]
body = "Their aim is, to bring soul-vision, and to wear away hindrances. The aim of fervour, spiritual reading and obedience to the Master, is, to bring soul-vision, and to wear away hindrances. Or, to use the phrase we have already adopted, the aim of these practices is, to help the spiritual man to open his eyes; to help him also to throw aside the veils and disguises, the enmeshing psychic nets which surround him, tying his hands, as it were, and bandaging his eyes. And this, as all teachers testify, is a long and arduous task, a steady up-hill fight, demanding fine courage and persistent toil. Fervour, the fire of the spiritual will, is, as we said, two-fold: it illumines, and so helps the spiritual man to see; and it also burns up the nets and meshes which ensnare the spiritual man. So with the other means, spiritual reading and obedience. Each, in its action, is two-fold, wearing away the psychical, and upbuilding the spiritual man."


[content]
body = "Through purity a withdrawal from one's own bodily life, a ceasing from infatuation with the bodily life of others. As the spiritual light grows in the heart within, as the taste for pure Life grows stronger, the consciousness opens toward the great, secret places within, where all life is one, where all lives are one. Thereafter, this outer, manifested, fugitive life, whether of ourselves or of others, loses something of its charm and glamour, and we seek rather the deep infinitudes. Instead of the outer form and surroundings of our lives, we long for their inner and everlasting essence. We desire not so much outer converse and closeness to our friends, but rather that quiet communion with them in the inner chamber of the soul, where spirit speaks to spirit, and spirit answers; where alienation and separation never enter; where sickness and sorrow and death cannot come."


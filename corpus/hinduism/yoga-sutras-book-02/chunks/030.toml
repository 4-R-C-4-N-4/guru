[content]
body = "The Commandments are these: nom injury, truthfulness, abstaining from stealing, from impurity, from covetousness. These five precepts are almost exactly the same as the Buddhist Commandments: not to kill, not to steal, not to be guilty of incontinence, not to drink intoxicants, to speak the truth. Almost identical is St. Paul's list: Thou shalt not commit adultery, thou shalt not kill, thou shalt not steal, thou shalt not covet. And in the same spirit is the answer made to the young map having great possessions, who asked, What shall I do to be saved? and received the reply: Keep the Commandments. This broad, general training, which forms and develops human character, must be accomplished to a very considerable degree, before there can be much hope of success in the further stages of spiritual life. First the psychical, and then the spiritual. First the man, then the angel. On this broad, humane and wise foundation does the system of Patanjali rest."


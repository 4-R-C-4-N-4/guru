[content]
body = "The Commandments, not limited to any race, place, time or occasion, universal, are the great obligation. The Commandments form the broad general training of humanity. Each one of them rests on a universal, spiritual law. Each one of them expresses an attribute or aspect of the Self, the Eternal; when we violate one of the Commandments, we set ourselves against the law and being of the Eternal, thereby bringing ourselves to inevitable con fusion. So the first steps in spiritual life must be taken by bringing ourselves into voluntary obedience to these spiritual laws and thus making ourselves partakers of the spiritual powers, the being of the Eternal Like the law of gravity, the need of air to breathe, these great laws know no exceptions They are in force in all lands, throughout al times, for all mankind."


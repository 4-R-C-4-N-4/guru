[content]
body = "Thereby is worn away the veil which covers up the light. The veil is the psychic nature, the web of emotions, desires, argumentative trains of thought, which cover up and obscure the truth by absorbing the entire attention and keeping the consciousness in the psychic realm. When hopes and fears are reckoned at their true worth, in comparison with lasting possessions of the Soul; when the outer reflections of things have ceased to distract us from inner realities; when argumentative thought no longer entangles us, but yields its place to flashing intuition, the certainty which springs from within; then is the veil worn away, the consciousness is drawn from the psychical to the spiritual, from the temporal to the Eternal. Then is the light unveiled."


[content]
body = "Attachment is the desire toward life, even in the wise, carried forward by its own energy. The life here desired is the psychic life, the intensely vibrating life of the psychical self. This prevails even in those who have attained much wisdom, so long as it falls short of the wisdom of complete renunciation, complete obedience to each least behest of the spiritual man, and of the Master who guards and aids the spiritual man. The desire of sensation, the desire of psychic life, reproduces itself, carried on by its own energy and momentum; and hence comes the circle of death and rebirth, death and rebirth, instead of the liberation of the spiritual man."


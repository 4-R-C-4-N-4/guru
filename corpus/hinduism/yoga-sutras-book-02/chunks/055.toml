[content]
body = "Thereupon follows perfect mastery over the powers. When the spiritual condition which we have described is reached, with its purity, poise, and illuminated vision, the spiritual man is coming into his inheritance, and gaining complete mastery of his powers. Indeed, much of the struggle to keep the Commandments and the Rules has been paving the way for this mastery; through this very struggle and sacrifice the mastery has become possible; just as, to use St. Paul's simile, the athlete gains the mastery in the contest and the race through the sacrifice of his long and arduous training. Thus he gains the crown."


[content]
body = "From acceptance, the disciple gains happiness supreme. One of the wise has said: accept conditions, accept others, accept yourself. This is the true acceptance, for all these things are what they are through the will of the higher Self, except their deficiencies, which come through thwarting the will of the higher Self, and can be conquered only through compliance with that will. By the true acceptance, the disciple comes into oneness of spirit with the overruling Soul; and, since the own nature of the Soul is being, happiness, bliss, he comes thereby into happiness supreme."


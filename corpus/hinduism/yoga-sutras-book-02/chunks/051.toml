[content]
body = "The fourth degree transcends external and internal objects. The inner meaning seems to be that, in addition to the three degrees of control already described, control, that is, over the incoming current of life, over the outgoing current, and over the condition of pause or quiescence, there is a fourth degree of control, which holds in complete mastery both the outer passage of events and the inner currents of thoughts and emotions; a condition of perfect poise and stability in the midst of the flux of things outward and inward."


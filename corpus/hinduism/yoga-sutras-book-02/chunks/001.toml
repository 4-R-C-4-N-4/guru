[content]
body = "The practices which make for union with the Soul are: fervent aspiration, spiritual reading, and complete obedience to the Master. The word which I have rendered 'fervent aspiration' means primarily 'fire'; and, in the Eastern teaching, it means the fire which gives life and light, and at the same time the fire which purifies. We have, therefore, as our first practice, as the first of the means of spiritual growth, that fiery quality of the will which enkindles and illumines, and, at the same time, the steady practice of purification, the burning away of all known impurities. Spiritual reading is so universally accepted and understood, that it needs no comment. The very study of Patanjali's Sutras is an exercise in spiritual reading, and a very effective one. And so with all other books of the Soul. Obedience to the Master means, that we shall make the will of the Master our will, and shall confirm in all wave to the will of the Divine, setting aside the wills of self, which are but psychic distortions of the one Divine Will. The constant effort to obey in all the ways we know and understand, will reveal new ways and new tasks, the evidence of new growth of the Soul. Nothing will do more for the spiritual man in us than this, for there is no such regenerating power as the awakening spiritual will."


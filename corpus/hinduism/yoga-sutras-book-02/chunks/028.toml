[content]
body = "The eight means of Yoga are: the Commandments, the Rules, right Poise, right Control of the life-force, Withdrawal, Attention, Meditation, Contemplation. These eight means are to be followed in their order, in the sense which will immediately be made clear. We can get a ready understanding of the first two by comparing them with the Commandments which must be obeyed by all good citizens, and the Rules which are laid on the members of religious orders. Until one has fulfilled the first, it is futile to concern oneself with the second. And so with all the means of Yoga. They must be taken in their order."


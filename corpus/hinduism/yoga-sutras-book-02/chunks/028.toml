[content]
body = "From steadfastly following after the means of Yoga, until impurity is worn away, there comes the illumination of thought up to full discernment. Here, we enter on the more detailed practical teaching of Patanjali, with its sound and luminous good sense. And when we come to detail the means of Yoga, we may well be astonished at their simplicity. There is little in them that is mysterious. They are very familiar. The essence of the matter lies in carrying them out."


[content]
body = "Things seen have as their property manifestation, action, inertia. They form the basis of the elements and the sense-powers. They make for experience and for liberation. Here is a whole philosophy of life. Things seen, the total of the phenomenal, possess as their property, manifestation, action, inertia: the qualities of force and matter in combination. These, in their grosser form, make the material world; in their finer, more subjective form, they make the psychical world, the world of sense-impressions and mind-images. And through this totality of the phenomenal, the soul gains experience, and is prepared for liberation. In other words, the whole outer world exists for the purposes of the soul, and finds in this its true reason for being."


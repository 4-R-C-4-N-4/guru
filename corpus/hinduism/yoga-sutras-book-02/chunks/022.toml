[content]
body = "The association of the Seer with things seen is the cause of the realizing of the nature of things seen, and also of the realizing of the nature of the Seer. Life is educative. All life's infinite variety is for discipline, for the development of the soul. So passing through many lives, the Soul learns the secrets of the world, the august laws that are written in the form of the snow-crystal or the majestic order of the stars. Yet all these laws are but reflections, but projections outward, of the laws of the soul; therefore in learning these, the soul learns to know itself. All life is but the mirror wherein the Soul learns to know its own face."


token_count = 146

[content]
body = "Though fallen away from him who has reached the goal, things seen have not altogether fallen away, since they still exist for others. When one of us conquers hate, hate does not thereby cease out of the world, since others still hate and suffer hatred. So with other delusions, which hold us in bondage to material things, and through which we look at all material things. When the coloured veil of illusion is gone, the world which we saw through it is also gone, for now we see life as it is, in the white radiance of eternity. But for others the coloured veil remains, and therefore the world thus coloured by it remains for them, and will remain till they, too, conquer delusion."


[content]
body = "His illuminations is sevenfold, rising in successive stages. Patanjali's text does not tell us what the seven stages of this illumination are. The commentator thus describes them; First, the danger to be escaped is recognized; it need not be recognized a second time. Second, the causes of the danger to be escaped are worn away; they need not be worn away a second time. Third, the way of escape is clearly perceived, by the contemplation which checks psychic perturbation. Fourth, the means of escape, clear discernment, has been developed. This is the fourfold release belonging to insight. The final release from the psychic is three-fold: As fifth of the seven degrees, the dominance of its thinking is ended; as sixth, its potencies, like rocks from a precipice, fall of themselves; once dissolved, they do not grow again. Then, as seventh, freed from these potencies, the spiritual man stands forth in his own nature as purity and light. Happy is the spiritual man who beholds this seven-fold illumination in its ascending stages."


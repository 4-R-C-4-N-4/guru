[content]
body = "Where there is firm conquest of covetousness, he who has conquered it awakes to the how and why of life. So it is said that, before we can understand the laws of Karma, we must free ourselves from Karma. The conquest of covetousness brings this rich fruit, because the root of covetousness is the desire of the individual soul, the will toward manifested life. And where the desire of the individual soul is overcome by the superb, still life of the universal Soul welling up in the heart within, the great secret is discerned, the secret that the individual soul is not an isolated reality, but the ray, the manifest instrument of the Life, which turns it this way and that until the great work is accomplished, the age-long lesson learned. Thus is the how and why of life disclosed by ceasing from covetousness. The Commentator says that this includes a knowledge of one's former births."


[content]
body = "When this is gained, there follows the right guidance of the life-currents, the control of the incoming and outgoing breath. It is well understood to-day that most of our maladies come from impure conditions of the blood. It is coming to be understood that right breathing, right oxygenation, will do very much to keep the blood clean and pure. Therefore a right knowledge of breathing is a part of the science of life. But the deeper meaning is, that the spiritual man, when he has gained poise through right effort and aspiration, can stand firm, and guide the currents of his life, both the incoming current of events, and the outgoing current of his acts. Exactly the same symbolism is used in the saying: Not that which goeth into the mouth defileth a man; but that which cometh out of the mouth, this defileth a man. . . . Those things which proceed out of the mouth come forth from the heart . . . out of the heart proceed evil thoughts, murders, uncleanness, thefts, false witness, blasphemies. Therefore the first step in purification is to keep the Commandments."


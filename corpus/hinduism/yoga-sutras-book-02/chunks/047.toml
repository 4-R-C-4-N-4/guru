[content]
body = "Right poise is to be gained by steady and temperate effort, and by setting the heart upon the everlasting. Here again, there is the two-fold meaning, for physical poise is to be gained by steady effort of the muscles, by gradual and wise training, linked with a right understanding of, and relation with, the universal force of gravity. Uprightness of body demands that both these conditions shall be fulfilled. In like manner the firm and upright poise of the spiritual man is to be gained by steady and continued effort, always guided by wisdom, and by setting the heart on the Eternal, filling the soul with the atmosphere of the spiritual world. Neither is effective without the other. Aspiration without effort brings weakness; effort without aspiration brings a false strength, not resting on enduring things. The two together make for the right poise which sets the spiritual man firmly and steadfastly on his feet."


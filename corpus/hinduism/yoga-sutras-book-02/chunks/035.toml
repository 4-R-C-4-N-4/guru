[content]
body = "When he is perfected in truth, all acts and their fruits depend on him. The commentator thus explains: If he who has attained should say to a man, Become righteous! the man becomes righteous. If he should say, Gain heaven! the man gains heaven. His word is not in vain. Exactly the same doctrine was taught by the Master who said to his disciples: Receive ye the Holy Ghost: whose soever sins ye remit they are remitted unto them; and whose soever sins ye retain, they are retained."


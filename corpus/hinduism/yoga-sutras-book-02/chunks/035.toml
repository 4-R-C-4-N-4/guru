[content]
body = "Where non-injury is perfected, all enmity ceases in the presence of him who possesses it. We come now to the spiritual powers which result from keeping the Commandments; from the obedience to spiritual law which is the keeping of the Commandments. Where the heart is full of kindness which seeks no injury to another, either in act or thought or wish, this full love creates an atmosphere of harmony, whose benign power touches with healing all who come within its influence. Peace in the heart radiates peace to other hearts, even more surely than contention breeds contention."


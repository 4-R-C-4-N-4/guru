[content]
body = "CHAPTER XVI.\n\nFreedom from fear, purity of heart, perseverance in (pursuit of) knowledge and abstraction of mind, gifts , self-restraint , and sacrifice, study of the Vedas, penance, straightforwardness, harmlessness, truth , freedom from anger, renunciation , tranquillity, freedom from the habit of backbiting , compassion for (all) beings, freedom from avarice, gentleness, modesty, absence of vain activity, noblemindedness, forgiveness, courage, purity, freedom from a desire to injure others, absence of vanity, (these), O descendant of Bharata!\n\nare his who is born to godlike endowments.\n\nOstentatiousness, pride, vanity , anger, and also harshness and ignorance (are) his, O son of P ri thâ!\n\nwho is born to demoniac endowments.\n\nGodlike endowments are deemed to be (means) for final emancipation, demoniac for bondage .\n\nGrieve not, O descendant of Bharata!\n\nyou are born to godlike endowments.\n\n(There are) two classes of created beings in this world, the godlike and the demoniac; the godlike (class) has been described at length; now hear from me, O son of P ri thâ!\n\nabout the demoniac.\n\nDemoniac persons know not action or inaction , neither purity nor yet (correct) conduct nor veracity are in them.\n\nThey say the universe is devoid of truth , devoid of fixed principle , and devoid of a ruler, produced by union (of male and female) caused by lust , and nothing else.\n\nHolding this view, (these) enemies of the world, of ruined selfs, of little knowledge, and of ferocious actions, are born for the destruction (of the world).\n\nEntertaining insatiable desire, full of vanity, ostentatiousness, and frenzy, they adopt false notions through delusion, and engage in unholy observances.\n\nIndulging in boundless thoughts ending with death , given up to the enjoyment of objects of desire, being resolved that that is all, bound down by nets of hopes in hundreds, given up to anger and desire, they wish to obtain heaps of wealth unfairly for enjoying objects of desire.\n\n'This have I obtained to-day; this wish I will obtain; this wealth is mine; and this also shall be mine; this foe I have killed; others too I will destroy; I am lord, I am the enjoyer, I am perfect , strong, happy; I have wealth; I am of noble birth; who else is like me?\n\nI will sacrifice ; I will make gifts; I will rejoice.' Thus deluded by ignorance, tossed about by numerous thoughts, surrounded by the net of delusion, and attached to the enjoyment of objects of desire, they fall down into impure hell.\n\nHonoured (only) by themselves, void of humility, and full of the pride and frenzy of wealth, these calumniators (of the virtuous) perform sacrifices, which are sacrifices only in name, with ostentatiousness and against prescribed rules ; indulging (their) vanity, brute force, arrogance, lust, and anger; and hating me in their own bodies and in those of others .\n\nThese enemies , ferocious, meanest of men, and unholy, I continually hurl down, to these worlds , only into demoniac wombs.\n\nComing into demoniac wombs, deluded in every birth, they go down to the vilest state, O son of Kuntî!\n\nwithout ever coming to me.\n\nThreefold is this way, to hell,-- ruinous to the self ,--lust, anger, and likewise avarice; therefore one should abandon this triad.\n\nReleased from these three ways to darkness, O son of Kuntî!"


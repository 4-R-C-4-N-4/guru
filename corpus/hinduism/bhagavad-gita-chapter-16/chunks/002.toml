[content]
body = "a man works out his own welfare, and then proceeds to the highest goal.\n\nHe who abandoning scripture ordinances, acts under the impulse of desire, does not attain perfection , nor happiness, nor the highest goal.\n\nTherefore in discriminating between w hat should be done and what should not be done, your authority (must.\n\nbe) scripture.\n\nAnd knowing what is declared by the ordinances of scripture, you should perform action in this world."


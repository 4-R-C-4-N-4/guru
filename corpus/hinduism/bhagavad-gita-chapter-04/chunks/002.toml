[content]
body = "The acts of one who is devoid of attachment, who is free , whose mind is fixed on knowledge, and who performs action for (the purpose of) the sacrifice are all destroyed.\n\nBrahman is the oblation; with Brahman (as a sacrificial instrument) it is offered up; Brahman is in the fire; and by Brahman it is thrown; and Brahman, too, is the goal to which he proceeds who meditates on Brahman in the action .\n\nSome devotees perform the sacrifice to the gods, some offer up the sacrifice by the sacrifice itself in the fire of Brahman .\n\nOthers offer up the senses, such as the sense of hearing and others, in the fires of restraint ; others offer up the objects of sense, such as sound and so forth, into the fires of the senses .\n\nSome again offer up all the operations of the senses and the operations of the life-breaths into the fire of devotion by self-restraint , kindled by knowledge.\n\nOthers perform the sacrifice of wealth, the sacrifice of penance, the sacrifice of concentration of mind, the sacrifice of Vedic study , and of knowledge, and others are ascetics of rigid vows.\n\nSome offer up the upward life-breath into the downward life-breath, and the downward life-breath into the upper life-breath, and stopping up the motions of the upward and downward life-breaths, devote themselves to the restraint of the life-breaths .\n\nOthers, who (take) limited food, offer up the life-breaths into the life-breaths.\n\nAll of these, conversant with the sacrifice, have their sins destroyed by the sacrifice.\n\nThose who eat the nectar-like leavings of the sacrifice repair to the eternal Brahman .\n\nThis world is not for those who perform no sacrifice, whence (then) the other, O best of the Kauravas!\n\nThus sacrifices of various sorts are laid down in the Vedas.\n\nKnow them all to be produced from action , and knowing this you will be released (from the fetters of this world).\n\nThe sacrifice of knowledge, O terror of (your) foes!\n\nis superior to the sacrifice of wealth, for action, O son of P ri thâ!\n\nis wholly and entirely comprehended in knowledge.\n\nThat you should learn by salutation, question, and service .\n\nThe men of knowledge who perceive the truth will teach knowledge to you.\n\nHaving learnt that, O son of Pâ nd u!\n\nyou will not again fall thus into delusion; and by means of it, you will see all beings, without exception, first in yourself, and then in me .\n\nEven if you are the most sinful of all sinful men, you will cross over all trespasses by means of the boat of knowledge alone.\n\nAs a fire well kindled, O Ar g una!\n\nreduces fuel to ashes, so the fire of knowledge reduces all actions to ashes .\n\nFor there is in this world no means of sanctification like knowledge , and that one perfected by devotion finds within one's self in time.\n\nHe who has faith, whose senses are restrained, and who is assiduous, obtains knowledge .\n\nObtaining knowledge, he acquires, without delay, the highest tranquillity.\n\nHe who is ignorant and devoid of faith, and whose self is full of misgivings, is ruined.\n\nNot this world, not the next, nor happiness, is for him whose self is full of misgivings.\n\nActions, O Dhanañ g aya!\n\ndo not fetter one who is self-possessed , who has renounced action by devotion, and who has destroyed misgivings by knowledge.\n\nTherefore, O descendant of Bharata!\n\ndestroy, with the sword of knowledge, these misgivings of yours which fill your mind, and which are produced from ignorance.\n\nEngage in devotion.\n\nArise!"


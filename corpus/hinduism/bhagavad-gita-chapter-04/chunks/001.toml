[content]
body = "CHAPTER IV.\n\nThe Deity said: This everlasting (system of) devotion I declared to the sun, the sun declared it to Manu , and Manu communicated it to Ikshvâku.\n\nComing thus by steps, it became known to royal sages.\n\nBut, O terror of (your) foes!\n\nthat devotion was lost to the world by long (lapse of) time.\n\nThat same primeval devotion I have declared to you to-day, seeing.\n\nthat you are my devotee and friend, for it is the highest mystery.\n\nAr g una said: Later is your birth the birth of the sun is prior.\n\nHow then shall I understand that you declared (this) first?\n\nThe Deity said: I have passed through many births, O Ar g una I and you also.\n\nI know them all, but you, O terror of (your) foes!\n\ndo not know them.\n\nEven though I am unborn and inexhaustible in (my) essence, even though I am lord of all beings, still I take up the control of my own nature , and am born by means of my delusive power.\n\nWhensoever, O descendant of Bharata!\n\npiety languishes, and impiety is in the ascendant, I create myself.\n\nI am born age after age, for the protection of the good, for the destruction of evil-doers, and the establishment of piety.\n\nWhoever truly knows thus my divine birth and work, casts off (this) body and is not born again.\n\nHe comes to me, O Ar g una!\n\nMany from whom affection, fear , and wrath have departed, who are full of me, who depend on me, and who are purified by the penance of knowledge , have come into my essence.\n\nI serve men in the way in which they approach me .\n\nIn every way, O son of P ri thâ!\n\nmen follow in my path .\n\nDesiring the success of actions , men in this world worship the divinities, for in this world of mortals, the success produced by action is soon obtained.\n\nThe fourfold division of castes was created by me according to the apportionment of qualities and duties.\n\nBut though I am its author, know me to be inexhaustible, and not the author.\n\nActions defile me not.\n\nI have no attachment to the fruit of actions.\n\nHe who knows me thus is not tied down by actions.\n\nKnowing this, the men of old who wished for final emancipation, performed action.\n\nTherefore do you, too, perform action as was done by men of old in olden times.\n\nEven sages are confused as to what is action, what inaction.\n\nTherefore I will speak to you about action, and learning that, you will be freed from (this world of) evil.\n\nOne must possess knowledge about action; one must also possess knowledge about prohibited action; and again one must possess knowledge about inaction.\n\nThe truth regarding action is abstruse.\n\nHe is wise among men, he is possessed of devotion, and performs all actions , who sees inaction in action, and action in inaction.\n\nThe wise call him learned, whose acts are all free from desires and fancies, and whose actions are burnt down by the fire of knowledge.\n\nForsaking all attachment to the fruit of action, always contented, dependent on none, he does nothing at all, though he engages in action.\n\nDevoid of expectations, restraining the mind and the self, and casting off all belongings , he incurs no sin, performing actions merely for the sake of the body .\n\nSatisfied with earnings coming spontaneously , rising above the pairs of opposites, free from all animosity, and equable on success or ill-success, he is not fettered down, even though he performs (actions)."


[content]
body = "For should I at any time not engage without sloth in action, men would follow in my path from all sides, O son of P ri thâ!\n\nIf I did not perform actions, these worlds would be destroyed, I should be the cause of caste interminglings; and I should be ruining these people.\n\nAs the ignorant act, O descendant of Bharata!\n\nwith attachment to action, so should a wise man act without attachment, wishing to keep the people (to their duties).\n\nA wise man should not shake the convictions of the ignorant who are attached to action, but acting with devotion (himself ) should make them apply themselves to all action.\n\nHe whose mind is deluded by egoism thinks himself the doer of the actions, which, in every way, are done by the qualities of nature .\n\nBut he, O you of mighty arms!\n\nwho knows the truth about the difference from qualities and the difference from actions , forms no attachments, believing that qualities deal with qualities .\n\nBut those who are deluded by the qualities of nature form attachments to the actions of the qualities .\n\nA man of perfect knowledge should not shake these men of imperfect knowledge (in their convictions).\n\nDedicating all actions to me with a mind knowing the relation of the supreme and individual self, engage in battle without desire, without (any feeling that this or that is) mine, and without any mental trouble .\n\nEven those men who always act on this opinion of mine, full of faith, and without carping, are released from all actions.\n\nBut those who carp at my opinion and do not act upon it, know them to be devoid of discrimination, deluded as regards all knowledge , and ruined.\n\nEven a man of knowledge acts consonantly to his own nature .\n\nAll beings follow nature.\n\nWhat will restraint effect?\n\nEvery sense has its affections and aversions towards its objects fixed.\n\nOne should not become subject to them, for they are one's opponents .\n\nOne's own duty, though defective, is better than another's duty well performed.\n\nDeath in (performing) one's own duty is preferable; the (performance of the) duty of others is dangerous.\n\nAr g una said: But by whom, O descendant of V ri sh n i!\n\nis man impelled, even though unwilling, and, as it were, constrained by force, to commit sin?\n\nThe Deity said: It is desire, it is wrath , born from the quality of passion; it is very ravenous, very sinful.\n\nKnow that that is the foe in this world.\n\nAs fire is enveloped by smoke, a mirror by dust, the fœtus by the womb, so is this enveloped by desire.\n\nKnowledge, O son of Kuntî!\n\nis enveloped by this constant foe of the man of knowledge, in the shape of desire, which is like a fire and insatiable.\n\nThe senses, the mind, and the understanding are said to be its seat ; with these it deludes the embodied (self) after enveloping knowledge.\n\nTherefore, O chief of the descendants of Bharata!\n\nfirst restrain your senses, then cast off this sinful thing which destroys knowledge and experience .\n\nIt has been said , Great are the senses, greater than the senses is the mind, greater than the mind is the understanding.\n\nWhat is greater than the understanding is that .\n\nThus knowing that which is higher than the understanding, and restraining (your)self by (your)self, O you of mighty arms!\n\ndestroy this unmanageable enemy in the shape of desire."


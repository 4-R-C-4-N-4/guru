[content]
body = "CHAPTER III.\n\nAr g una said: If, O Ganârdana!\n\ndevotion is deemed by you to be superior to action, then why, O Kesava!\n\ndo you prompt me to (this) fearful action?\n\nYou seem, indeed, to confuse my mind by equivocal words.\n\nTherefore, declare one thing determinately, by which I may attain the highest good.\n\nThe Deity said: O sinless one!\n\nI have already declared, that in this world there is a twofold path --that of the Sâ n khyas by devotion in the shape of (true) knowledge; and that of the Yogins by devotion in the shape of action.\n\nA man does not attain freedom from action merely by not engaging in action; nor does he attain perfection by mere renunciation.\n\nFor nobody ever remains even for an instant without performing some action; since the qualities of nature constrain everybody, not having free-will (in the matter), to some action .\n\nThe deluded man who, restraining the organs of action , continues to think in his mind about objects of sense, is called a hypocrite.\n\nBut he, O Ar g una!\n\nwho restraining his senses by his mind .\n\nand being free from attachments, engages in devotion (in the shape) of action, with the organs of action, is far superior.\n\nDo you perform prescribed action, for action is better than inaction, and the support of your body, too, cannot be accomplished with inaction.\n\nThis world is fettered by all action other than action for the purpose of the sacrifice .\n\nTherefore, O son of Kuntî!\n\ndo you, casting off attachment, perform action for that purpose.\n\nThe Creator, having in olden times created men together with the sacrifice, said: 'Propagate with this.\n\nMay it be the giver to you of the things you desire.\n\nPlease the gods with this, and may those gods please you.\n\nPleasing each other, you will attain the highest good.\n\nFor pleased with the sacrifices, the gods will give you the enjoyments you desire.\n\nAnd he who enjoys himself without giving them what they have given, is, indeed, a thief.' The good, who eat the leavings of a sacrifice, are released from all sins.\n\nBut the unrighteous ones, who prepare food for themselves only, incur sin .\n\n[paragraph continues] From food are born (all) creatures; from rain is the production of food; rain is produced by sacrifices; sacrifices are the result of action; know that action has its source in the Vedas; the Vedas come from the Indestructible.\n\nTherefore the all-comprehending Vedas are always concerned with sacrifices .\n\nHe who in this world does not turn round the wheel revolving thus, is of sinful life, indulging his senses, and, O son of P ri thâ!\n\nhe lives in vain.\n\nBut the man who is attached to his self only, who is contented in his self, and is pleased with his self , has nothing to do.\n\nHe has no interest at all in what is done, and none whatever in what is not done, in this world ; nor is any interest of his dependent on any being.\n\nTherefore always perform action, which must be performed, without attachment.\n\nFor a man, performing action without attachment, attains the Supreme.\n\nBy action alone, did G anaka and the rest work for perfection .\n\nAnd having regard also to the keeping of people (to their duties) you should perform action.\n\nWhatever a great man does, that other men also do.\n\nAnd people follow whatever he receives as authority.\n\nThere is nothing, O son of P ri thâ!\n\nfor me to do in (all) the three worlds, nothing to acquire which has not been acquired.\n\nStill I do engage in action."


[content]
body = "This you should never declare to one who performs no penance , who is not a devotee , nor to one who does not wait on (some preceptor) , nor yet to one who calumniates me.\n\nHe who, with the highest devotion to me, will proclaim this supreme mystery among my devotees, will come to me, freed from (all) doubt.\n\nNo one amongst men is superior to him in doing what is dear to me.\n\nAnd there will never be another on earth dearer to me than he.\n\nAnd he who will study this holy dialogue of ours, will, such is my opinion, have offered to me the sacrifice of knowledge .\n\nAnd the man, also, who with faith and without carping will listen (to this), will be freed (from sin), and attain to the holy regions of those who perform pious acts .\n\nHave you listened to this, O son of P ri thâ!\n\nwith a mind (fixed) on (this) one point only?\n\nHas your delusion (caused) by ignorance been destroyed, O Dhanañ g aya?\n\nAr g una said: Destroyed is my delusion; by your favour, O undegraded one!\n\nI (now) recollect myself.\n\nI stand freed from doubts .\n\nI will do your bidding.\n\nSañ g aya said: Thus did I hear this dialogue between Vâsudeva and the high-minded son of P ri thâ, (a dialogue) wonderful and causing the hair to stand on end.\n\nBy the favour of Vyâsa, I heard this highest mystery, (this) devotion , from K ri sh n a himself, the lord of the possessors of mystic power, who proclaimed it in person.\n\nO king!\n\nremembering and (again) remembering this wonderful and holy dialogue of Ke s ava and Ar g una, I rejoice over and over again.\n\nAnd remembering and (again) remembering that excessively wonderful form of Hari also, great is my amazement, O king!\n\nand I rejoice over and over again.\n\nWherever (is) K ri sh n a, the lord of the possessors of mystic power, wherever (is the (great) archer, the son of Prithâ, there in my opinion (are) fortune, victory, prosperity , and eternal justice."


[content]
body = "Agriculture, tending cattle, trade, (this) is the natural duty of Vai s yas, And the natural duty of S ûdras, too, consists in service.\n\n(Every) man intent on his own respective duties obtains perfection .\n\nListen, now, how one intent on one's own duty obtains perfection.\n\nWorshipping, by (the performance of) his own duty, him from whom all things proceed, and by whom all this is permeated, a man obtains perfection.\n\nOne's duty, though defective, is better than another's duty well performed .\n\nPerforming the duty prescribed by nature, one does not incur sin.\n\nO son of Kuntî!\n\none should not abandon a natural duty though tainted with evil; for all actions are enveloped by evil, as fire by smoke .\n\nOne who is self-restrained, whose understanding is unattached everywhere, from whom affections have departed, obtains the supreme perfection of freedom from action by renunciation.\n\nLearn from me, only in brief, O son of Kuntî!\n\nhow one who has obtained perfection attains the Brahman, which is the highest culmination of knowledge.\n\nA man possessed of a pure understanding, controlling his self by courage, discarding sound and other objects of sense, casting off affection and aversion; who frequents clean places, who eats little, whose speech, body, and mind are restrained, who is always intent on meditation and mental abstraction , and has recourse to unconcern, who abandoning egoism , stubbornness, arrogance, desire, anger, and (all) belongings, has no (thought that this or that is) mine, and who is tranquil, becomes fit for assimilation with the Brahman.\n\nThus reaching the Brahman , and with a tranquil self, he grieves not, wishes not; but being alike to all beings, obtains the highest devotion to me.\n\nBy (that) devotion he truly understands who I am and how great.\n\nAnd then understanding me truly, he forthwith enters into my (essence).\n\nEven performing all actions, always depending on me, he, through my favour, obtains the imperishable and eternal seat.\n\nDedicating in thought all actions to me, be constantly given up to me, (placing) your thoughts on me, through recourse to mental abstraction.\n\n(Placing) your thoughts on me, you will cross over all difficulties by my favour.\n\nBut if you will not listen through egotism , you will be ruined.\n\nIf entertaining egotism, you think that you may not fight, vain, indeed, is that resolution of yours.\n\nNature will constrain you.\n\nThat, O son of Kuntî!\n\nwhich through delusion you do not wish to do, you will do involuntarily, tied down by your own duty, flowing from your nature.\n\nThe lord, O Ar g una!\n\nis seated in the region of the heart of all beings, turning round all beings (as though) mounted on a machine, by his delusion.\n\nWith him, O descendant of Bharata!\n\nseek shelter in every way ; by his favour you will obtain the highest tranquillity, the eternal seat.\n\nThus have I declared to you the knowledge more mysterious than any mystery.\n\nPonder over it thoroughly, and then act as you like.\n\nOnce more, listen to my excellent words-most mysterious of all.\n\nStrongly I like you, therefore I will declare what is for your welfare.\n\nOn me (place) your mind, become my devotee, sacrifice to me, reverence me, you will certainly come to me.\n\nI declare to you truly, you are dear to me.\n\nForsaking all duties , come to me as (your) sole refuge.\n\nI will release you from all sins.\n\nBe not grieved."


[content]
body = "That action is called good, which is prescribed, which is devoid of attachment, which is not done from (motives of) affection or aversion, (and which is done) by one not wishing for the fruit.\n\nThat is described as passionate, which (occasions) much trouble, is performed by one who wishes for objects of desire, or one who is full of egotism .\n\nThe action is called dark, which is commenced through delusion, without regard to consequences, loss, injury, or strength .\n\nThat agent is called good, who has cast off attachment, who is free from egotistic talk, who is possessed of courage and energy, and unaffected by success or ill-success.\n\nThat agent is called passionate, who is full of affections , who wishes for the fruit of actions, who is covetous, cruel, and impure, and feels joy and sorrow.\n\nThat agent is called dark, who is without application , void of discernment, headstrong, crafty, malicious, lazy, melancholy, and slow.\n\nNow hear, O Dhanañ g aya!\n\nthe threefold division of intelligence and courage, according to qualities, which I am about to declare exhaustively and distinctly.\n\nThat intelligence, O son of P ri thâ!\n\nis good which understands action and inaction , what ought to be done and what ought not to be done, danger and the absence of danger, emancipation and bondage.\n\nThat intelligence, O son of P ri thâ!\n\nis passionate, by which one imperfectly understands piety and impiety, what ought to be done and also what ought not to be done.\n\nThat intelligence, O son of P ri thâ!\n\nis dark, which shrouded by darkness, understands impiety (to be) piety, and all things incorrectly.\n\nThat courage, O son of P ri thâ!\n\nis good courage, which is unswerving , and by which one controls the operations of the mind, breath, and senses, through abstraction.\n\nBut, O Ar g una!\n\nthat courage is passionate, by which one adheres to piety, lust, and wealth , and through attachment wishes, [paragraph continues] O son of P ri thâ!\n\nfor the fruit, That courage is dark, O son of P ri thâ!\n\nby which an undiscerning man does not give up sleep, fear, sorrow, despondency, and folly.\n\nNow, O chief of the descendants of Bharata!\n\nbear from me about the three sorts of happiness.\n\nThat happiness is called good, in which one is pleased after repetition (of enjoyment), and reaches the close of all misery, which is like poison first and comparable to nectar in the long run, and which is produced from a clear knowledge of the self .\n\nThat happiness is called passionate, which (flows) from contact between the senses and their objects, and which is at first comparable to nectar and in the long run like poison.\n\nThat happiness is described as dark, which arises from sleep, laziness, heedlessness, which deludes the self, both at first and in its consequences.\n\nThere is no entity either on earth or in heaven among the gods, which is free from these three qualities born of nature.\n\nThe duties of Brâhma n as, Kshatriyas, and Vai s yas, and of S ûdras, too, O terror of your foes!\n\nare distinguished according to the qualities born of nature .\n\nTranquillity , restraint of the senses, penance, purity, forgiveness, straightforwardness, also knowledge, experience, and belief (in a future world), this is the natural duty of Brâhma n as.\n\nValour, glory, Courage, dexterity , not slinking away from battle, gifts, exercise of lordly power , this is the natural duty of Kshatriyas."


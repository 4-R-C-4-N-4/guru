[content]
body = "CHAPTER XVIII.\n\nAr g una said: O you of mighty arms!\n\nO H ri shîke s a!\n\nO destroyer of Ke s in!\n\nI wish to know the truth about renunciation and abandonment distinctly.\n\nThe Deity said: By renunciation the sages understand the rejection of actions done with desires.\n\nThe wise call the abandonment of the fruit of all actions (by the name) abandonment.\n\nSome wise men say, that action should be abandoned as being full of evil; and others, that the actions of sacrifice, gift, and penance should not be abandoned.\n\nAs to that abandonment, O best of the descendants of Bharata!\n\nlisten to my decision; for abandonment, O bravest of men!\n\nis described (to be) threefold.\n\nThe actions of sacrifice, gift, and penance should not be abandoned; they must needs be performed; for sacrifices, gifts, and penances are means of sanctification to the wise.\n\nBut even these actions, O son of P ri thâ!\n\nshould be performed, abandoning attachment and fruit; such is my excellent and decided opinion.\n\nThe renunciation of prescribed action is not proper.\n\nIts abandonment through delusion is described as of the quality of darkness.\n\nWhen a man abandons action, merely as being troublesome, through fear of bodily affliction, he does not obtain the fruit of abandonment by making (such) passionate abandonment.\n\nWhen prescribed action is performed, O Ar g una!\n\nabandoning attachment and fruit also, merely because it ought to be performed, that is deemed (to be) a good abandonment.\n\nHe who is possessed of abandonment , being full of goodness, and talented, and having, his doubts destroyed, is not averse from unpleasant actions, is not attached to pleasant (ones).\n\nSince no embodied (being) can abandon actions without exception , he is said to be possessed of abandonment, who abandons the fruit of action.\n\nThe threefold fruit of action, agreeable, disagreeable, and mixed, accrues after death to those who are not possessed of abandonment, but never to renouncers .\n\nLearn from me, O you of mighty arms!\n\nthese five causes of the completion of all actions, declared in the Sâ n khya system .\n\nThe substratum, the agent likewise, the various sorts of organs, and the various and distinct movements, and with these the deities, too, as the fifth.\n\nWhatever action, just or otherwise, a man performs with his body, speech, and mind, these five are its causes.\n\nThat being so, the undiscerning man, who being of an unrefined understanding, sees the agent in the immaculate self, sees not (rightly) .\n\nHe who has no feeling of egoism , and whose mind is not tainted, even though he kills (all) these people, kills not, is not fettered, (by the action).\n\nKnowledge , the object of knowledge, the knower--threefold is the prompting to action.\n\nThe instrument, the action, the agent, thus in brief is action threefold.\n\nKnowledge and action and agent are declared in the enumeration of qualities (to be) of three classes only, according to the difference of qualities.\n\nHear about these also as they really are.\n\nKnow that knowledge to be good, by which (a man) sees one entity, inexhaustible, and not different in all things (apparently) different (from one another).\n\nKnow that knowledge to be passionate, which is (based) on distinctions (between different entities), which sees in all things various entities of different kinds.\n\nAnd that is described as dark, which clings to one created (thing) only as everything, which is devoid of reason, devoid of real principle, and insignificant ."


[content]
body = "In consequence of the predominance of impiety, O K ri sh n a!\n\nthe women of the family become corrupt ; and the women becoming corrupt, O descendant of V ri sh n i!\n\nintermingling of castes results; that intermingling necessarily leads the family and the destroyers of the family to hell; for when the ceremonies of (offering) the balls of food and water (to them) fail , their ancestors fall down (to hell).\n\nBy these transgressions of the destroyers of families, which occasion interminglings of castes, the eternal rites of castes and rites, of families are subverted.\n\nAnd O G anârdana!\n\nwe have heard that men whose family-rites are subverted, must necessarily live in hell.\n\nAlas!\n\nwe are engaged in committing a heinous sin, seeing that we are making efforts for killing our own kinsmen out of greed of the pleasures of sovereignty.\n\nIf the sons of Dh ri tarâsh t ra, weapon in hand, should kill me in battle, me weaponless and not defending (myself), that would be better for me.\n\nSañ g aya said: Having spoken thus, Ar g una cast aside his bow together with the arrows, on the battle-field, and sat down in (his) chariot, with a mind agitated by grief."


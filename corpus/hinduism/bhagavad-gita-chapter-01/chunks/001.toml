[content]
body = "BHAGAVADGÎTÂ.\n\nCHAPTER I.\n\nDh ri tarâsh t ra said What did my (people) and the Pâ nd avas do, O Sañ g aya!\n\nwhen they assembled together on the holy field of Kurukshetra, desirous to do battle?\n\nSañ g aya said: Seeing the army of the Pâ nd avas drawn up in battle-array , the prince Duryodhana approached the preceptor, and spoke (these) words: 'O preceptor!\n\nobserve this grand army of the sons of Pâ nd u, drawn up in battle-array by your talented pupil, the son of Drupada.\n\nIn it are heroes (bearing) large bows, the equals of Bhîma and Ar g una in battle--(namely), Yuyudhâna, Virâ t a, and Drupada, the master of a great car , and Dh ri sh t aketu, K ekitâna, and the valiant king of Kâsî, Puru g it and Kuntibho g a, and that eminent man S aibya; the heroic Yudhâmanyu, the valiant Uttamau g as, the son of Subhadrâ, and the sons of Draupadî--all masters of great cars.\n\nAnd now, O best of Brâhma n as!\n\nlearn who are most distinguished among us, and are leaders of my army.\n\nI will name them to you, in order that you may know them well.\n\nYourself, and Bhîshma, and Kar n a, and K ri pa the victor of (many) battles; A s vatthâman, and Vikar n a, and also the son of Somadatta, and many other brave men, who have given up their lives for me, who fight with various weapons, (and are) all dexterous in battle.\n\nThus our army which is protected by Bhîshma is unlimited; while this army of theirs which is protected by Bhîma is very limited.\n\nAnd therefore do ye all, occupying respectively the positions assigned to you, protect Bhîshma only.' Then his powerful grandsire, Bhîshma, the oldest of the Kauravas, roaring aloud like a lion, blew his conch, (thereby) affording delight to Duryodhana.\n\nAnd then all at once, conchs, and kettledrums, and tabors, and trumpets were played upon; and there was a tumultuous din.\n\nThen, too, Mâdhava and the son of Pâ nd u (Ar g una), seated in a grand chariot to which white steeds were yoked, blew their heavenly conchs.\n\nH ri shîke s a blew the Pâñ k a g anya , and Dhanañ g aya the Devadatta, and Bhîma, (the doer) of fearful deeds, blew the great conch Pau nd ra.\n\nKing Yudhish th ira, the son of Kuntî , blew the Anantavi g aya, and Nakula and Sahadeva (respectively) the Sughosha and Ma n ipushpaka.\n\nAnd the king of Kâ s î, too, who has an excellent bow, and Sikha nd in, the master of a great car, and Dh ri sh t adyumna, Virâ t a, and the unconquered Sâtyaki, and Drupada, and the sons of Draupadî, and the son of Subhadrâ, of mighty arms, blew conchs severally from all sides, O king of the earth!"


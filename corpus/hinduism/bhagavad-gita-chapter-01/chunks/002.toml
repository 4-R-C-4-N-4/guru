[content]
body = "That tumultuous din rent the hearts of all (the people) of Dh ri tarâsh t ra's (party), causing reverberations throughout heaven and earth.\n\nThen seeing (the people of ) Dh ri tarâsh t ra's party regularly marshalled, the son of Pâ nd u, whose standard is the ape, raised his bow , after the discharge of missiles had commenced, and O king of the earth!\n\nspake these words to H ri shîke s a: 'O undegraded one!\n\nstation my chariot between the two armies, while I observe those, who stand here desirous to engage in battle, and with whom, in the labours of this struggle, I must do battle.\n\nI will observe those who are assembled here and who are about to engage in battle, wishing to do service in battle to the evil-minded son of Dh ri tarâsh t ra.' Sañ g aya said: Thus addressed by Gu d âke s a , O descendant of Bharata !\n\nH ri shîke s a stationed that excellent chariot between the two armies, in front of Bhîshma and Dro n a and of all the kings of the earth, and said O son of P ri thâ!\n\nlook at these assembled Kauravas.' There the son of P ri thâ saw in both armies, fathers and grandfathers, preceptors, maternal uncles, brothers, sons , grandsons, companions, fathers-in-law, as well as friends.\n\nAnd seeing all those kinsmen standing (there), the son of Kuntî was overcome by excessive pity, and spake thus despondingly.\n\nAr g una said: Seeing these kinsmen, O K ri sh n a!\n\nstanding (here) desirous to engage in battle, my limbs droop down; my mouth is quite dried up; a tremor comes on my body; and my hairs stand on end; the Gâ nd îva (bow) slips from my hand; my skin burns intensely.\n\nI am unable, too, to stand up; my mind whirls round, as it were; O Ke s ava!\n\nI see adverse omens ; and I do not perceive any good (to accrue) after killing (my) kinsmen in the battle.\n\nI do not wish for victory, O K ri sh n a!\n\nnor sovereignty, nor pleasures: what is sovereignty to us, O Govinda!\n\nwhat enjoyments, and even life?\n\nEven those, for whose sake we desire sovereignty, enjoyments, and pleasures, are standing here for battle, abandoning life and wealth-preceptors, fathers, sons as well as grandfathers, maternal uncles, fathers-in-law, grandsons, brothers-in-law, as also (other) relatives.\n\nThese I do not wish to kill, though they kill (me), O destroyer of Madhu !\n\neven for the sake of sovereignty over the three worlds, how much less then for this earth (alone)?\n\nWhat joy shall be ours, O G anârdana!\n\nafter killing Dh ri tarâsh t ra's sons?\n\nKilling these felons we shall only incur sin.\n\nTherefore it is not proper for us to kill our own kinsmen, the sons of Dh ri tarâsh t ra.\n\nFor how, O Mâdhava!\n\nshall we be happy after killing our own relatives?\n\nAlthough having their consciences corrupted by avarice, they do not see the evils flowing from the extinction of a family, and the sin in treachery to friends, still, O Ganârdana!\n\nshould not we, who do see the evils flowing from the extinction of a family, learn to refrain from that sin?\n\nOn the extinction of a family, the eternal rites of families are destroyed .\n\nThose rites being destroyed, impiety predominates over the whole family ."


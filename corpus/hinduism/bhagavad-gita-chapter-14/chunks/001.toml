[content]
body = "CHAPTER XIV.\n\nThe Deity said: Again I will declare (to you) the highest knowledge, the best of (all sorts of) knowledge, having learnt which, all sages have reached perfection beyond (the bonds of) this (body).\n\nThose who, resorting to this knowledge, reach assimilation with my essence, are not born at the creation, and are not afflicted at the destruction (of the universe).\n\nThe great Brahman is a womb for me, in which I cast the seed.\n\nFrom that, O descendant of Bharata!\n\nis the birth of all things.\n\nOf the bodies, O son of Kuntî!\n\nwhich are born from all wombs, the (main) womb is the great Brahman, and I (am) the father, the giver of the seed.\n\nGoodness, passion, darkness, these qualities born from nature, O you of mighty arms!\n\nbind down the inexhaustible soul in the body.\n\nOf these, goodness, which, in consequence of being untainted, is enlightening and free from (all) misery, binds the soul, O sinless one!\n\nwith the bond of pleasure and the bond of knowledge .\n\nKnow that passion consists in being enamoured, and is produced from craving and attachment.\n\nThat, O son of Kuntî!\n\nbinds down the embodied (self) with the bond of action.\n\nDarkness (you must) know to be born of ignorance, it deludes all embodied (selfs).\n\nAnd that, O descendant of Bharata!\n\nbinds down (the self) with heedlessness , indolence, and sleep.\n\nGoodness unites (the self) with pleasure; passion, O descendant of Bharata!\n\nwith action; and darkness with heedlessness, after shrouding up knowledge.\n\nPassion and darkness being repressed, goodness stands, O descendant of Bharata!\n\nPassion and goodness (being repressed), darkness; and likewise darkness and goodness (being repressed), passion .\n\nWhen in this body at all portals light (that is to say) knowledge prevails, then should one know goodness to be developed.\n\nAvarice, activity , performance of actions, want of tranquillity, desire, these are produced, O chief of the descendants of Bharata!\n\nwhen passion is developed.\n\nWant of light, want of activity , heedlessness, and delusion, these are produced, O descendant of Kuru!\n\nwhen darkness is developed.\n\nWhen an embodied (self) encounters death, while goodness is developed, then he reaches the untainted worlds of those who know the highest .\n\nEncountering death during (the prevalence of) passion, he is born among those attached to action.\n\nLikewise, dying during (the prevalence of) darkness, he is born in the wombs of the ignorant .\n\nThe fruit of meritorious action is said to be good, untainted; while the fruit of passion is misery; and the fruit of darkness ignorance.\n\nFrom goodness is produced knowledge, from passion avarice , and from darkness heedlessness and delusion and ignorance also.\n\nThose who adhere to (the ways of) goodness go up ; the passionate remain in the middle; while those of the qualities of darkness, adhering to the ways of the lowest quality, go down.\n\nWhen a right-seeing person sees none but the qualities (to be) the doers (of all action), and knows what is above the qualities , he enters into my essence.\n\nThe embodied (self), who transcends these three qualities, from which bodies are produced , attains immortality, being freed from birth and death and old age and misery.\n\nAr g una said: What are the characteristics, O lord!\n\nof one who has transcended these three qualities?\n\nWhat is his conduct, and how does he transcend these three qualities ?\n\nThe Deity said: He is said to have transcended the qualities, O son of Pându!"


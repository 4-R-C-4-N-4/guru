[content]
body = "who is not averse to light and activity and delusion (when they) prevail, and who does not desire (them when they) cease ; who sitting like one unconcerned is never perturbed by the qualities ; who remains steady and moves not, (thinking) merely that the qualities exist; who is self-contained ; to whom pain and pleasure are alike; to whom a sod and a stone and gold are alike; to whom what is agreeable and what is disagreeable are alike; who has discernment; to whom censure and praise of himself are alike; who is alike in honour and dishonour; who is alike towards the sides of friends and foes; and who abandons all action .\n\nAnd he who worships me with an unswerving devotion, transcends these qualities, and becomes fit for (entrance into) the essence of the Brahman.\n\nFor I am the embodiment of the Brahman , of indefeasible immortality, of eternal piety, and of unbroken happiness."


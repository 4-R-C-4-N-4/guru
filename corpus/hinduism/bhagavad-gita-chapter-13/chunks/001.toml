[content]
body = "CHAPTER XIII.\n\nThe Deity said: This body, O son of Kuntî!\n\nis called Kshetra , and the learned call him who knows it the Kshetra g ña.\n\n.\n\nAnd know me also, O descendant of Bharata!\n\nto be the Kshetra g ña in all Kshetras.\n\nThe knowledge of Kshetra and Kshetra g ña is deemed by me (to be real) knowledge.\n\nNow hear from me in brief what that Kshetra (is), what (it is) like, what changes (it undergoes), and whence (it comes), and what is he , and what his powers, (all which) is sung in various ways by sages in numerous hymns , distinctly, and in well-settled texts full of argument, giving indications or full instruction about the Brahman.\n\nThe great elements , egoism, the understanding, the unperceived also, the ten senses, and the one, and the five objects of sense, desire, aversion, pleasure, pain, body, consciousness, courage, thus in brief has been declared the Kshetra with changes .\n\nAbsence of vanity, absence of ostentatiousness, absence of hurtfulness, forgiveness, straightforwardness, devotion to a preceptor, purity , steadiness, self-restraint, indifference towards objects of sense, and also absence of egoism; perception of the misery and evil of birth, death , old age, and disease; absence of attachment, absence of self-identifying regard for son, wife , home, and so forth; and constant equability on the approach of (both what is) agreeable and (what is) disagreeable; unswerving devotion to me, without meditation on any one else; resorting to clean places, distaste for assemblages of men , constancy in knowledge of the relation of the individual self to the supreme, perception of the object of knowledge of the truth, this is called knowledge; that is ignorance which is opposed to this.\n\nI will declare that which is the object of knowledge, knowing which, one reaches immortality; the highest Brahman, having no beginning nor end, which cannot be said to be existent or non-existent .\n\nIt has hands and feet on all sides, it has eyes, heads, and faces on all sides, it has ears on all sides, it stands pervading everything in the world.\n\nPossessed of the qualities of all the senses, (but) devoid of all senses , unattached, it supports all, is devoid of qualities, and the enjoyer of qualities.\n\nIt is within all things and without them; it is movable and also immovable; it is unknowable through (its) subtlety; it stands afar and near .\n\nNot different in (different) things , but standing as though different, it should be known to be the supporter of (all) things, and that which absorbs and creates (them).\n\nIt is the radiance even of the radiant (bodies); it is said (to be) beyond darkness.\n\nIt is knowledge, the object of knowledge, that which is to be attained to by knowledge, and placed in the heart of all .\n\nThus in brief have Kshetra, knowledge, and the object of knowledge been declared.\n\nMy devotee, knowing this, becomes fit for assimilation with me.\n\nKnow nature and spirit both (to be) without beginning, and know all developments and qualities (to be) produced from nature.\n\nNature is said to be the origin of the capacity of working (residing) in the body and the senses; and spirit is said (to be) the origin of the capacity of enjoying pleasures and pains .\n\nFor spirit with nature joined, enjoys the qualities born of nature.\n\nAnd the cause of its birth in good or evil wombs is the connexion with the qualities ."


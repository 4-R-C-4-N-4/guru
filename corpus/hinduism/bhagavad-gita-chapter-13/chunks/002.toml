[content]
body = "The supreme spirit in this body is called supervisor, adviser , supporter, enjoyer, the great lord, and the supreme self also.\n\nHe who thus knows nature and spirit, together with the qualities, is not born again, however living .\n\nSome by concentration see the self in the self by the self; others by the Sâ n kya-yoga; and others still by the Karma-yoga ; others yet, not knowing this, practise concentration, after hearing from others .\n\nThey, too, being (thus) devoted to hearing (instruction) cross beyond death.\n\nWhatever thing movable or immovable comes into existence, know that to be from the connexion of Kshetra and Kshetra g ña, O chief of the descendants of Bharata!\n\nHe sees (truly) who sees the supreme lord abiding alike in all entities, and not destroyed though they are destroyed.\n\nFor he who sees the lord abiding everywhere alike, does not destroy himself by himself, and then reaches the highest goal.\n\nHe sees (truly), who sees (all) actions (to be) in every way done by nature alone, and likewise the self (to be) not the doer.\n\nWhen a man sees all the variety of entities as existing in one , and (all as) emanating from that, then he becomes (one with) the Brahman.\n\nThis inexhaustible supreme self, being without beginning and without qualities, does not act, and is not tainted, O son of Kuntî!\n\nthough stationed in the body.\n\nAs by (reason of its) subtlety the all-pervading space is not tainted, so the self stationed in every body is not tainted.\n\nAs the sun singly lights up all this world, so the Kshetra g ña, O descendant of Bharata!\n\nlights up the whole Kshetra.\n\nThose who, with the eye of knowledge, thus understand the difference between Kshetra and Kshetra g ña, and the destruction of the nature of all entities , go to the supreme."


[content]
body = "That (mental condition), in which the mind restrained by practice of abstraction, ceases to work; in which too, one seeing the self by the self , is pleased in the self; in which one experiences that infinite happiness which transcends the senses, and which can be grasped by the understanding only; and adhering to which, one never swerves from the truth; acquiring which, one thinks no other acquisition higher than it; and adhering to which, one is not shaken off even by great misery; that should be understood to be called devotion in which there is a severance of all connexion with pain.\n\nThat devotion should be practised with steadiness and with an undesponding heart.\n\nAbandoning, without exception, all desires , which are produced from fancies, and restraining the whole group of the senses on all sides by the mind only , one should by slow steps become quiescent , with a firm resolve coupled with courage ; and fixing his mind upon the self, should think of nothing.\n\nWherever the active and unsteady mind breaks forth , there one should ever restrain it, and fix it steadily on the self alone.\n\nThe highest happiness comes to such a devotee, whose mind is fully tranquil, in whom the quality of passion has been suppressed, who is free from sin, and who is become (one with) the Brahman.\n\nThus constantly devoting his self to abstraction, a devotee, freed from sin, easily obtains that supreme happiness--contact with the Brahman .\n\nHe who has devoted his self to abstraction, by devotion, looking alike on everything, sees the self abiding in all beings, and all beings in the self .\n\nTo him who sees me in everything, and everything in me, I am never lost, and he is not lost to me .\n\nThe devotee who worships me abiding in all beings, holding that all is one , lives in me, however he may be living .\n\nThat devotee, O Ar g una!\n\nis deemed to be the best, who looks alike on pleasure or pain, whatever it may be, in all (creatures), comparing.\n\nall with his own (pleasure or pain) .\n\nAr g una said: I cannot see, O destroyer of Madhu!\n\n(how) the sustained existence (is to be secured) of this devotion by means of equanimity which you have declared-in consequence of fickleness.\n\nFor, O K ri sh n a!\n\nthe mind is fickle, boisterous strong, and obstinate; and I think that to restrain it is as difficult as (to restrain) the wind.\n\nThe Deity said: Doubtless, O you of mighty arms!\n\nthe mind is difficult to restrain, and fickle .\n\nStill, O son of Kuntî!\n\nit may be restrained by constant practice and by indifference (to worldly objects).\n\nIt is my belief, that devotion is hard to obtain for one who does not restrain his self.\n\nBut by one who is self-restrained and assiduous, it can be obtained through (proper) expedients.\n\nAr g una said: What is the end of him, O K ri sh n a!\n\nwho does not attain the consummation of his devotion, being not assiduous , and having a mind shaken off from devotion, (though) full of faith?\n\nDoes he, fallen from both (paths) , go to ruin like a broken cloud, being, O you of mighty arms!\n\nwithout support, and deluded on the path (leading) to the Brahman?\n\nBe pleased, O K ri sh n a!\n\nto entirely destroy this doubt of mine, for none else than you can destroy this doubt.\n\nThe Deity said: O son of P ri thâ!\n\nneither in this world nor the next, is ruin for him; for, O dear friend!\n\nnone who performs good (deeds) comes to an evil end."


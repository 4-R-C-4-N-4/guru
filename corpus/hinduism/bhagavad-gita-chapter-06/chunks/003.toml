[content]
body = "He who is fallen from devotion attains the worlds of those who perform meritorious acts, dwells (there) for many a year, and is afterwards born into a family of holy and illustrious men.\n\nOr he is even born into a family of talented devotees; for such a birth as that in this world is more difficult to obtain.\n\nThere he comes into contact with the knowledge which belonged to him in his former body, and then again, O descendant of Kuru!\n\nhe works for perfection .\n\nFor even though reluctant , he is led away by the self-same former practice, and although he only wishes to learn devotion, he rises above the (fruits of action laid down in the) divine word.\n\nBut the devotee working with great efforts , and cleared of his sins, attains perfection after many births, and then reaches the supreme goal.\n\nThe devotee is esteemed higher than the performers of penances, higher even than the men of knowledge, and the devotee is higher than the men of action; therefore, O Ar g una!\n\nbecome a devotee.\n\nAnd even among all devotees, he who, being full of faith, worships me, with his inmost self intent on me, is esteemed by me to be the most devoted."


[content]
body = "CHAPTER VI.\n\nThe Deity said: He who, regardless of the fruit of actions, performs the actions which ought to be performed, is the devotee and renouncer; not he who discards the (sacred) fires , nor he who performs no acts.\n\nKnow, O son of Pâ nd u!\n\nthat what is called renunciation is devotion; for nobody becomes a devotee who has not renounced (all) fancies .\n\nTo the sage who wishes to rise to devotion, action is said to be a means, and to him, when he has risen to devotion, tranquillity is said to be a means.\n\nWhen one does not attach oneself to objects of sense, nor to action, renouncing all fancies, then is one said to have risen to devotion.\n\n(A man) should elevate his self by his self ; he should not debase his self, for even (a man's) own self is his friend, (a man's) own self is also his enemy .\n\nTo him who has subjugated his self by his self , his self is a friend; but to him who has not restrained his self, his own self behaves inimically, like an enemy.\n\nThe self of one who has subjugated his self and is tranquil, is absolutely concentrated (on itself), in the midst of cold and heat, pleasure and pain, as well as honour and dishonour.\n\nThe devotee whose self is contented with knowledge and experience , who is unmoved , who has restrained his senses, and to whom a sod, a stone, and gold are alike, is said to be devoted.\n\nAnd he is esteemed highest, who thinks alike about well-wishers, friends, and enemies, and those who are indifferent, and those who take part with both sides, and those who are objects of hatred, and relatives, as well as about the good and the sinful.\n\nA devotee should constantly devote his self to abstraction, remaining in a secret place , alone, with his mind and self restrained, without expectations, and without belongings.\n\nFixing his seat firmly in a clean place, not too high nor too low, and covered over with a sheet of cloth, a deerskin, and (blades of) Ku s a (grass),--and there seated on (that) seat, fixing his mind exclusively on one point, with the workings of the mind and senses restrained, he should practice devotion for purity of self.\n\nHolding his body, head, and neck even and unmoved, (remaining) steady, looking at the tip of his own nose , and not looking about in (all) directions, with a tranquil self, devoid of fear, and adhering to the rules of Brahma k ârins , he should restrain his mind, and (concentrate it) on me, and sit down engaged in devotion, regarding me as his final goal.\n\nThus constantly devoting his self to abstraction, a devotee whose mind is restrained, attains that tranquillity which culminates in final emancipation, and assimilation with me.\n\nDevotion is not his, O Ar g una!\n\nwho eats too much, nor his who cats not at all; not his who is addicted to too much sleep, nor his who is (ever) awake.\n\nThat devotion which destroys (all) misery is his, who takes due food and exercise , who toils duly in all works, and who sleeps and awakes (in) due (time) .\n\nWhen (a man's) mind well restrained becomes steady upon the self alone, then he being indifferent to all objects of desire, is said to be devoted.\n\nAs a light standing in a windless (place) flickers not, that is declared to be the parallel for a devotee, whose mind is restrained, and who devotes his self to abstraction."


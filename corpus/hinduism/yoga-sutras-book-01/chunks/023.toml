[content]
body = "Or spiritual consciousness may be gained by ardent service of the Master. If we think of our lives as tasks laid on us by the Master of Life, if we look on all duties as parts of that Master's work, entrusted to us, and forming our life-work; then, if we obey, promptly, loyally, sincerely, we shall enter by degrees into the Master's life and share the Master's power. Thus we shall be initiated into the spiritual will."


[content]
body = "The barriers to interior consciousness, which drive the psychic nature this way and that, are these: sickness, inertia, doubt, lightmindedness, laziness, intemperance, false notions, inability to reach a stage of meditation, or to hold it when reached. We must remember that we are considering the spiritual man as enwrapped and enmeshed by the psychic nature, the emotional and mental powers; and as unable to come to clear consciousness, unable to stand and see clearly, because of the psychic veils of the personality. Nine of these are enumerated, and they go pretty thoroughly into the brute toughness of the psychic nature. Sickness is included rather for its effect on the emotions and mind, since bodily infirmity, such as blindness or deafness, is no insuperable barrier to spiritual life, and may sometimes be a help, as cutting off distractions. It will be well for us to ponder over each of these nine activities, thinking of each as a psychic state, a barrier to the interior consciousness of the spiritual man."


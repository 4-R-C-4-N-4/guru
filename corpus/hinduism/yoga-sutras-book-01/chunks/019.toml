[content]
body = "Subjective consciousness arising from a natural cause is possessed by those who have laid aside their bodies and been absorbed into subjective nature. Those who have died, entered the paradise between births, are in a condition resembling meditation without an external object. But in the fullness of time, the seeds of desire in them will spring up, and they will be born again into this world."


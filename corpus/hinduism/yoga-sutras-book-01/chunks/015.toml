[content]
body = "Ceasing from self-indulgence is conscious mastery over the thirst for sensuous pleasure here or hereafter. Rightly understood, the desire for sensation is the desire of being, the distortion of the soul's eternal life. The lust of sensual stimulus and excitation rests on the longing to feel one's life keenly, to gain the sense of being really alive. This sense of true life comes only with the coming of the soul, and the soul comes only in silence, after self-indulgence has been courageously and loyally stilled, through reverence before the coming soul."


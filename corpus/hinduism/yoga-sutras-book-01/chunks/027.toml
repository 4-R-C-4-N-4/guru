[content]
body = "His word is OM. OM: the symbol of the Three in One, the three worlds in the Soul; the three times, past, present, future, in Eternity; the three Divine Powers, Creation, Preservation, Transformation, in the one Being; the three essences, immortality, omniscience, joy, in the one Spirit. This is the Word, the Symbol, of the Master and Lord, the perfected Spiritual Man."


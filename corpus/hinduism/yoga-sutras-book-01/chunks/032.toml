[content]
body = "Steady application to a principle is the way to put a stop to these. The will, which, in its pristine state, was full of vigour, has been steadily corrupted by self-indulgence, the seeking of moods and sensations for sensation's sake. Hence come all the morbid and sickly moods of the mind. The remedy is a return to the pristine state of the will, by vigorous, positive effort; or, as we are here told, by steady application to a principle. The principle to which we should thus steadily apply ourselves should be one arising from the reality of spiritual life; valorous work for the soul, in others as in ourselves."


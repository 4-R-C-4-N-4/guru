[content]
body = "Or the purging of self-indulgence from the psychic nature. We must recognize that the fall of man is a reality, exemplified in our own persons. We have quite other sins than the animals, and far more deleterious; and they have all come through self-indulgence, with which our psychic natures are soaked through and through. As we climbed down hill for our pleasure, so must we climb up again for our purification and restoration to our former high estate. The process is painful, perhaps, yet indispensable."


[content]
body = "Heretofore the Seer has been enmeshed in the activities of the psychic nature. The power and life which are the heritage of the spiritual man have been caught and enmeshed in psychical activities. Instead of pure being in the Divine, there has been fretful, combative. egotism, its hand against every man. Instead of the light of pure vision, there have been restless senses nave been re and imaginings. Instead of spiritual joy, the undivided joy of pure being, there has been self-indulgence of body and mind. These are all real forces, but distorted from their true nature and goal. They must be extricated, like gems from the matrix, like the pith from the reed, steadily, without destructive violence. Spiritual powers are to be drawn forth from the psychic meshes."


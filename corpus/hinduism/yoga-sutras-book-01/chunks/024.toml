[content]
body = "The Master is the spiritual man, who s free from hindrances, bondage to works, and the fruition and seed of works. The Soul of the Master, the Lord, is of the same nature as the soul in us; but we still bear the burden of many evils, we are in bondage through our former works, we are under the dominance of sorrow. The Soul of the Master is free from sin and servitude and sorrow."


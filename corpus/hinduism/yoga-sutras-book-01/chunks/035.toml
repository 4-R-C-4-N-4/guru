[content]
body = "Faithful, persistent application to any object, if completely attained, will bind the mind to steadiness. We are still considering how to overcome the wavering and perturbation of the psychic nature, which make it quite unfit to transmit the inward consciousness and stillness. We are once more told to use the will, and to train it by steady and persistent work: by 'sitting close' to our work, in the phrase of the original."


[content]
body = "Spiritual consciousness is nearest to those of keen, intense will. The image used is the swift impetus of the torrent; the kingdom must be taken by force. Firm will comes only through effort; effort is inspired by faith. The great secret is this: it is not enough to have intuitions; we must act on them; we must live them."


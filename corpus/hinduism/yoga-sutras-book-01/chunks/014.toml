[content]
body = "This becomes a firm resting-place, when followed long, persistently, with earnestness. We must seek spiritual life in conformity with the laws of spiritual life, with earnestness, humility, gentle charity, which is an acknowledgment of the One Soul within us all. Only through obedience to that shared Life, through perpetual remembrance of our oneness with all Divine Being, our nothingness apart from Divine Being, can we enter our inheritance."


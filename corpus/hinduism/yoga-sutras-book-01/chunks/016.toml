[content]
body = "The consummation of this is freedom from thirst for any mode of psychical activity, through the establishment of the spiritual man. In order to gain a true understanding of this teaching, study must be supplemented by devoted practice, faith by works. The reading of the words will not avail. There must be a real effort to stand as the Soul, a real ceasing from self-indulgence. With this awakening of the spiritual will, and purification, will come at once the growth of the spiritual man and our awakening consciousness as the spiritual man; and this, attained in even a small degree, will help us notably in our contest. To him that hath, shall be given."


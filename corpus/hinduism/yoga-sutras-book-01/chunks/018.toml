[content]
body = "After the exercise of the will has stilled the psychic activities, meditation rests only on the fruit of former meditations. In virtue of continued practice and effort, the need of an external object on which to rest the meditation is outgrown. An interior state of spiritual consciousness is reached, which is called 'the cloud of things knowable' (Book IV, 29)."


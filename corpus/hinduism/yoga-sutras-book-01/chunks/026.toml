[content]
body = "He is the Teacher of all who have gone before, since he is not limited by Time. From the beginning, the Oversoul has been the Teacher of all souls, which, by their entrance into the Oversoul, by realizing their oneness with the Oversoul, have inherited the kingdom of the Light. For the Oversoul is before Time, and Time, father of all else, is one of His children."


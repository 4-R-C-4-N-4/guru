[content]
body = "In the Master is the perfect seed of Omniscience. The Soul of the Master is in essence one with the Oversoul, and therefore partaker of the Oversoul's all-wisdom and all-power. All spiritual attainment rests on this, and is possible because the soul and the Oversoul are One."


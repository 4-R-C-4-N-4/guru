[content]
body = "Subtle substance rises in ascending degrees, to that pure nature which has no distinguishing mark. As we ascend from outer material things which are permeated by separateness, and whose chief characteristic is to be separate, just as so many pebbles are separate from each other; as we ascend, first, to mind-images, which overlap and coalesce in both space and time, and then to ideas and principles, we finally come to purer essences, drawing ever nearer and nearer to unity. Or we may illustrate this principle thus. Our bodily, external selves are quite distinct and separate, in form, name, place, substance; our mental selves, of finer substance, meet and part, meet and part again, in perpetual concussion and interchange; our spiritual selves attain true consciousness through unity, where the partition wall between us and the Highest, between us and others, is broken down and we are all made perfect in the One. The highest riches are possessed by all pure souls, only when united. Thus we rise from separation to true individuality in unity."


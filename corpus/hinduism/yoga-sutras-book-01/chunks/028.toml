[content]
body = "Let there be soundless repetition of OM and meditation thereon. This has many meanings, in ascending degrees. There is, first, the potency of the word itself, as of all words. Then there is the manifold significance of the symbol, as suggested above. Lastly, there is the spiritual realization of the high essences thus symbolized. Thus we rise step by step to the Eternal."


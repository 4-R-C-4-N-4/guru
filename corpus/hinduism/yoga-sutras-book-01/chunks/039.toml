[content]
body = "Or meditative brooding on what is dearest to the heart. Here is a thought which our own day is beginning to grasp: that love is a form of knowledge; that we truly know any thing or any person, by becoming one therewith, in love. Thus love has a wisdom that the mind cannot claim, and by this hearty love, this becoming one with what is beyond our personal borders, we may take a long step toward freedom. Two directions for this may be suggested: the pure love of the artist for his work, and the earnest, compassionate search into the hearts of others."


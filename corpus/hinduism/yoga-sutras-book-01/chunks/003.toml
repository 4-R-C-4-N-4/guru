[content]
body = "Then the Seer comes to consciousness in his proper nature. Egotism is but the perversion of spiritual being. Ambition is the inversion of spiritual power. Passion is the distortion of love. The mortal is the limitation of the immortal. When these false images give place to true, then the spiritual man stands forth luminous, as the sun, when the clouds disperse."


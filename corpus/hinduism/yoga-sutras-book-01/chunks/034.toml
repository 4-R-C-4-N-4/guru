[content]
body = "Or peace may be reached by the even sending forth and control of the life-breath. Here again we may look for a double meaning: first, that even and quiet breathing which is a part of the victory over bodily restlessness; then the even and quiet tenor of life, without harsh or dissonant impulses, which brings stillness to the heart."


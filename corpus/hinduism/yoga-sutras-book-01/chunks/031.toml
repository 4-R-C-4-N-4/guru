[content]
body = "Grieving, despondency, bodily restlessness, the drawing in and sending forth of the life-breath also contribute to drive the psychic nature to and fro. The first two moods are easily understood. We can well see bow a sodden psychic condition, flagrantly opposed to the pure and positive joy of spiritual life, would be a barrier. The next, bodily restlessness, is in a special way the fault of our day and generation. When it is conquered, mental restlessness will be half conquered, too. The next two terms, concerning the life breath, offer some difficulty. The surface meaning is harsh and irregular breathing; the deeper meaning is a life of harsh and irregular impulses."


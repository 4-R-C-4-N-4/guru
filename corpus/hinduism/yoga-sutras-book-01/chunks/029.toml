[content]
body = "Thence come the awakening of interior consciousness, and the removal of barriers. Here again faith must be supplemented by works, the life must be led as well as studied, before the full meaning can be understood. The awakening of spiritual consciousness can only be understood in measure as it is entered. It can only be entered where the conditions are present: purity of heart, and strong aspiration, and the resolute conquest of each sin. This, however, may easily be understood: that the recognition of the three worlds as resting in the Soul leads us to realize ourselves and all life as of the Soul; that, as we dwell, not in past, present or future, but in the Eternal, we become more at one with the Eternal; that, as we view all organization, preservation, mutation as the work of the Divine One, we shall come more into harmony with the One, and thus remove the barriers in our path toward the Light. In the second part of the first book, the problem of the emergence of the spiritual man is further dealt with. We are led to the consideration of the barriers to his emergence, of the overcoming of the barriers, and of certain steps and stages in the ascent from the ordinary consciousness of practical life, to the finer, deeper, radiant consciousness of the spiritual man."


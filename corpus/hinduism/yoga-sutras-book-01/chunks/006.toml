[content]
body = "These activities are: Sound intellection, unsound intellection, predication, sleep, memory. We have here a list of mental and emotional powers; of powers that picture and observe, and of powers that picture and feel. But the power to know and feel is spiritual and immortal. What is needed is, not to destroy it, but to raise it from the psychical to the spiritual realm."


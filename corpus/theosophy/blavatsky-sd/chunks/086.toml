body = "yet if you should work out the problem by yourself , it will be my duty to tell you so .\" But they never were so worked out, and the results were -- never-ceasing perplexity and mistakes.\n\nEven the teaching about the Septenary constitution of the sidereal bodies and of the macrocosm -- from which the septenary division of the microcosm, or Man -- has until now been among the most esoteric.\n\nIn olden times it used to be divulged only at the Initiation and along with the most sacred figures of the cycles.\n\nNow, as stated in one of the Theosophical journals,* the revelation of the whole system of Cosmogony had not been contemplated, nor even thought for one moment possible, at a time when a few bits of information were sparingly given out in answer to letters written by the author of \"Esoteric Buddhism,\" in which he put forward a multiplicity of questions.\n\nAmong these were questions on such problems as no MASTER , however high and independent he might be , would have the right to answer , thus divulging to the world the most time-honoured and archaic of the mysteries of the ancient college-temples.\n\nHence only a few of the doctrines were revealed in their broad outlines, while details were constantly withheld, and all the efforts made to elicit more information about them were systematically eluded from the beginning.\n\nThis is perfectly natural.\n\nOf the four Vidyas -- out of the seven branches of Knowledge mentioned in the Puranas -- namely, \"Yajna-Vidya\" (the performance of religious rites in order to [[Footnote(s)]] ------------------------------------------------- * \"Lucifer,\" May, 1888.\n\n[[Vol.\n\n1, Page]] 169 THE SEVEN BRANCHES OF THE TREE OF KNOWLEDGE.\n\nproduce certain results); \"Maha-Vidya,\" the great (Magic) knowledge, now degenerated into Tantrika worship; \"Guhya-Vidya,\" the science of Mantras and their true rhythm or chanting, of mystical incantations, etc.\n\n-- it is only the last one, \"Atma-Vidya,\" or the true Spiritual and Divine wisdom , which can throw absolute and final light upon the teachings of the three first named.\n\nWithout the help of Atma-Vidya, the other three remain no better than surface sciences, geometrical magnitudes having length and breadth, but no thickness.\n\nThey are like the soul, limbs, and mind of a sleeping man: capable of mechanical motions, of chaotic dreams and even sleep-walking, of producing visible effects, but stimulated by instinctual not intellectual causes, least of all by fully conscious spiritual impulses.\n\nA good deal can be given out and explained from the three first-named sciences.\n\nBut unless the key to their teachings is furnished by Atma-Vidya, they will remain for ever like the fragments of a mangled text-book, like the adumbrations of great truths, dimly perceived by the most spiritual, but distorted out of all proportion by those who would nail every shadow to the wall.\n\nThen, again, another great perplexity was created in the minds of students by the incomplete exposition of the doctrine of the evolution of the Monads.\n\nTo be fully realised, both this process and that of the birth of the Globes must be examined far more from their metaphysical aspect than from what one might call a statistical standpoint, involving figures and numbers which are rarely permitted to be broadly used.\n\nUnfortunately, there are few who are inclined to handle these doctrines only metaphysically.\n\nEven the best of the Western writers upon our doctrine declares in his work that \"on pure metaphysics of that sort we are not now engaged,\" when speaking of the evolution of the Monads (\"Esoteric Buddhism,\" p.\n\n46).\n\nAnd in such case, as the Teacher remarks in a letter to him, \"Why this preaching of our doctrines, all this uphill work and swimming in adversum flumen?\n\nWhy should the West .\n\n.\n\n.\n\nlearn .\n\n.\n\n.\n\nfrom the East .\n\n.\n\n.\n\nthat which can never meet the requirements of the special tastes of the aesthetics?\" And he draws his correspondent's attention \"to the formidable difficulties encountered by us (the Adepts) in every attempt we make to explain our metaphysics to the Western mind.\" And well he may; for outside of metaphysics no occult philosophy, no esotericism is possible.\n\nIt is like trying to explain the aspirations and affections, the love and hatred, the most private and sacred workings in [[Vol.\n\n1, Page]] 170 THE SECRET DOCTRINE.\n\nthe soul and mind of the living man, by an anatomical description of the chest and brain of his dead body.\n\nLet us now examine two tenets mentioned above and hardly alluded to in \"Esoteric Buddhism,\" and supplement them as far as lies in our power.\n\n--------------------- [[This page continued in next section]]"


[content]
body = "astronomically, with the one here intended.\" Now the secret reading of the first verse of Genesis being: \"In Rash (B'rash) or head, developed gods, the Heavens and the Earth\" -- it is easy to comprehend the esoteric meaning of the raven , once that the like meaning of the Flood (or Noah's Deluge) is ascertained.\n\nWhatever the many other meanings of this emblematical allegory may be, its chief meaning is that of a new cycle and a new Round (our Fourth Round.)* The \"Raven,\" or the Eth-H ' Orebv , yields the same numerical value as the \"Head,\" and returned not to the ark, while the dove returned, carrying the olive-branch, when Noah, the new man of the new Race (whose prototype is Vaivasvata Manu), prepared to leave the ark, the womb (or Argha ) of terrestrial nature, is the symbol of the purely spiritual, sexless and androgyne man of the first three Races, who vanished from earth for ever.\n\nNumerically Jehovah, Adam, Noah, are one in the Kabala: at best, then, it is Deity descending on to Ararat (later on Sinai), to incarnate in man his image , through the natural process, henceforth: the mother's womb, whose symbols are the ark, the mount (Sinai), etc., in Genesis.\n\nThe Jewish allegory is at once astronomical, and purely physiological rather than anthropomorphic.\n\nAnd here lies the abyss between the two systems (Aryan and Semitic), though built on the same foundation.\n\nAs shown by an expounder of the Kabala, \"the basic idea underlying the philosophy of the Hebrews was that God contained all things within himself and that man was his image; man, including woman (as Androgynes);\" and that \"geometry and numbers (and measures applicable to astronomy) are contained in the terms man and woman; and the apparent incongruity of such a mode was eliminated by showing the connection of man and woman with a particular system of numbers and measures and geometry, by the parturient time-periods, which furnished the connecting link between the terms and the facts shown, and perfected the mode used.\" It is argued that, the primal cause being absolutely incognizable, \"the symbol of its first comprehensible manifestation was the conception of a circle with its diameter line, so as at once to carry the idea of geometry, phallicism, and astronomy;\" and this was finally applied to the \"signification of simply human generative organs.\"** Hence the whole cycle of events [[Footnote(s)]] ------------------------------------------------- * Bryant is right in saying \"Druid Bardesin says of Noah that when he came out of the ark (the birth of a new cycle), after a stay therein of a year and a day, that 364 + 1 = 365 days, he was congratulated by Neptune upon his birth from the waters of the Flood, who wished him a happy New Year.\n\n\" The \"Year,\" or cycle, esoterically, was the new race of men born from woman after the separation of the sexes, which is the secondary meaning of the allegory: its primary meaning being the beginning of the Fourth Round, or the new Creation.\n\n** Unpubl.\n\nMSS.\n\n(But see \" Source of Measures.\n\n\") [[Vol.\n\n1, Page]] 445 GOD IS OUR HIGHER SELF.\n\nfrom Adam and the Patriarchs down to Noah is made to apply to phallic and astronomical uses, the one regulating the other, as the lunar periods, for instance.\n\nHence, too, their genesis begins after their coming out of the Ark, and the close of the flood -- at the Fourth Race.\n\nWith the Aryan people it is different.\n\nEastern Esotericism has never degraded the One Infinite Deity, the container of all things, to such uses; and this is shown by the absence of Brahma from the Rig Veda and the modest positions occupied therein by Rudra and Vishnu, who became the powerful and great Gods, the \"Infinites\" of the exoteric creeds, ages later.\n\nBut even they, \"Creators\" as the three may be, are not the direct creators and \"forefathers of men.\" The latter are shown occupying a still lower scale, and are called Prajapatis, the Pitris (our lunar ancestors), etc., etc.\n\n-- never the \"One Infinite God.\" Esoteric philosophy shows only physical man as created in the image of the Deity: but the latter is but \"the minor gods.\n\n\" It is the H IGHER- S ELF, the real E GO who alone is divine and GOD.\n\n-------------- [[This page continued in next section]]"


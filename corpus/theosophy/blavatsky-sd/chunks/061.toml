[content]
body = "They are, so to speak, the eternal prototypes of the Buddhas who appear on this earth, each of whom has his particular divine prototype.\n\nSo, for instance, Amitabha is the Dhyani-Buddha of Gautama Sakyamuni, manifesting through him whenever this great Soul incarnates on earth as He did in Tzon-kha-pa.** As the synthesis of the seven Dhyani-Buddhas, Avalokiteswara was the first Buddha (the Logos), so Amitabha is the inner \"God\" of Gautama, who, in China, is called Amita(-Buddha).\n\nThey are, as Mr.\n\nRhys Davids [[Footnote(s)]] ------------------------------------------------- * See A.\n\nP.\n\nSinnett's \"Esoteric Buddhism,\" 5th annotated edition, pp.\n\n171-173.\n\n** The first and greatest Reformer who founded the \"Yellow-Caps,\" Gyalugpas.\n\nHe was born in the year 1355 A.D.\n\nin Amdo, and was the Avatar of Amitabha, the celestial name of Gautama Buddha.\n\n[[Vol.\n\n1, Page]] 109 THEOGONY OF THE CREATORS.\n\ncorrectly states, \"the glorious counterparts in the mystic world, free from the debasing conditions of this material life\" of every earthly mortal Buddha -- the liberated Manushi-Buddhas appointed to govern the Earth in this Round.\n\nThey are the \"Buddhas of Contemplation,\" and are all Anupadaka (parentless), i.e.\n\n, self-born of divine essence.\n\nThe exoteric teaching which says that every Dhyani-Buddha has the faculty of creating from himself, an equally celestial son -- a Dhyani-Bodhisattva -- who, after the decease of the Manushi (human) Buddha, has to carry out the work of the latter, rests on the fact that owing to the highest initiation performed by one overshadowed by the \"Spirit of Buddha\" -- (who is credited by the Orientalists with having created the five Dhyani-Buddhas!), -- a candidate becomes virtually a Bodhisattva, created such by the High Initiator.\n\n( c ) Fohat, being one of the most, if not the most important character in esoteric Cosmogony, should be minutely described.\n\nAs in the oldest Grecian Cosmogony, differing widely from the later mythology, Eros is the third person in the primeval trinity: Chaos, Gaea, Eros: answering to the Kabalistic En-Soph (for Chaos is SPACE, [[ C haino ]], \"void\") the Boundless A LL, Shekinah and the Ancient of Days, or the Holy Ghost; so Fohat is one thing in the yet unmanifested Universe and another in the phenomenal and Cosmic World.\n\nIn the latter, he is that Occult, electric, vital power, which, under the Will of the Creative Logos, unites and brings together all forms, giving them the first impulse which becomes in time law.\n\nBut in the unmanifested Universe, Fohat is no more this, than Eros is the later brilliant winged Cupid, or L OVE.\n\nFohat has naught to do with Kosmos yet, since Kosmos is not born, and the gods still sleep in the bosom of \"Father-Mother.\" He is an abstract philosophical idea.\n\nHe produces nothing yet by himself; he is simply that potential creative power in virtue of whose action the N OUMENON of all future phenomena divides, so to speak, but to reunite in a mystic supersensuous act, and emit the creative ray.\n\nWhen the \"Divine Son\" breaks forth, then Fohat becomes the propelling force, the active Power which causes the O NE to become T WO and T HREE -- on the Cosmic plane of manifestation.\n\nThe triple One differentiates into the many, and then Fohat is transformed into that force which brings together the elemental atoms and makes them aggregate and combine.\n\nWe find an echo of this primeval teaching [[Vol.\n\n1, Page]] 110 THE SECRET DOCTRINE.\n\nin early Greek mythology.\n\nErebos and Nux are born out of Chaos, and, under the action of Eros, give birth in their turn to Ether and Hemera, the light of the superior and the light of the inferior or terrestrial regions.\n\nDarkness generates light.\n\nSee in the Puranas Brahma's \"Will\" or desire to create; and in the Phoenician Cosmogony of Sanchoniathon the doctrine that Desire, [[ pothos ]], is the principle of creation.\n\nFohat is closely related to the \"ONE LIFE.\" From the Unknown One, the Infinite TOTALITY, the manifested ONE, or the periodical, Manvantaric Deity, emanates; and this is the Universal Mind, which, separated from its Fountain-Source, is the Demiurgos or the creative Logos of the Western Kabalists, and the four-faced Brahma of the Hindu religion.\n\nIn its totality, viewed from the standpoint of manifested Divine Thought in the esoteric doctrine, it represents the Hosts of the higher creative Dhyan Chohans.\n\nSimultaneously with the evolution of the Universal Mind, the concealed Wisdom of Adi-Buddha -- the One Supreme and eternal -- manifests itself as Avalokiteshwara (or manifested Iswara), which is the Osiris of the Egyptians, the Ahura-Mazda of the Zoroastrians, the Heavenly Man of the Hermetic philosopher, the Logos of the Platonists, and the Atman of the Vedantins.* By the action of the manifested Wisdom, or Mahat, represented by these innumerable centres of spiritual Energy in the Kosmos, the reflection of the Universal Mind, which is Cosmic Ideation and the intellectual Force accompanying such ideation, becomes objectively the Fohat of the Buddhist esoteric philosopher.\n\nFohat, running along the seven principles of A KASA, acts upon manifested substance or the One Element, as declared above, and by differentiating it into various centres of Energy, sets in motion the law of Cosmic Evolution, which, in obedience to the Ideation of the Universal Mind, brings into existence all the various states of being in the manifested Solar System.\n\nThe Solar System, brought into existence by these agencies, consists of Seven Principles, like everything else within these centres.\n\nSuch is the teaching of the trans-Himalayan Esotericism.\n\nEvery philosophy, however, has its own way of dividing these principles.\n\n[[Footnote(s)]] ------------------------------------------------- * Mr.\n\nSubba Row seems to identify him with, and to call him, the L OGOS.\n\n(See his four lectures on the \"Bhagavadgita\" in the Theosophist.) [[Vol.\n\n1, Page]] 111 THE PROTEAN SPIRIT-SUBSTANCE."


[content]
body = "( Continental, not cosmic, catastrophes.) We learn from Plutarch that this was the theme of one of the hymns of Orpheus, so celebrated in the fabulous ages of Greece.\n\nIt was brought by him from the banks of the Nile; and we even find in his verses, as in the Indian systems, a definite period assigned for the duration of every successive World.\n\nThe returns of great catastrophes were determined by the present period of the Magnus Annus, or great year -- a cycle composed of the revolutions of the sun, moon, and planets, and terminating when these return together to the sign whence they were supposed at some remote epoch to set out.\n\nWe learn particularly from the Timaeus of Plato that the Egyptians believed the world to be subject to occasional conflagrations and deluges.\n\nThe sect of the Stoics adopted most fully the system of catastrophes destined at intervals to destroy the world.\n\nThese, they taught, were of two kinds -- the cataclysm, or destruction by water, and the Ecpyrosis, or destruction by fire (submarine volcanoes).\n\nFrom the Egyptians they derived the doctrine of the gradual debasement of man from a state of innocence\" (nascent simplicity of the first sub-races of each Root-Race).\n\n\"Towards the [[Footnote(s)]] ------------------------------------------------- * When Howard read, before the Royal Society of London, a paper on the first serious researches that were made on the aerolites, the Geneva naturalist Pictet, who was present, communicated, on his return to Paris, the facts reported to the French Academy of Sciences.\n\nBut he was forthwith interrupted by Laplace, the great astronomer, who cried: \"Stop!\n\nwe have had enough of such fables, and know all about them,\" thus making Pictet feel very small.\n\nGlobular-shaped lightnings or thunderbolts have been admitted by Science only since Arago demonstrated their existence, says de Rochat (\" Forces non-definies, \" p.\n\n4): \"Every one remembers Dr.\n\nBouilland's misadventure at the Academy of Medicine when he had declared Edison's phonograph 'a trick of ventriloquism!\n\n` \" [[Vol.\n\n2, Page]] 785 ASTRAEA FALLS ON HER HEAD.\n\ntermination of each era the gods could no longer bear with the wickedness of man, and a shock of the elements, or a deluge, overwhelmed them; (vide degeneracy into magical practices and gross animality of the Atlanteans) after which calamity, Astraea again descended on the earth to renew the golden age.\" (Dawn of a new Root-Race.) Astraea, the goddess of justice, is the last of the deities to forsake the earth, when the gods are said to abandon it and be taken up into heaven by Jupiter again.\n\nBut, no sooner does Zeus carry away from earth Ganymedes (the object of lust, personified) than the father of the gods throws down Astraea back on the earth again, on which she falls upon her head.\n\nAstraea is Virgo, the constellation of the Zodiac.\n\nAstronomically it has a very plain significance, and one which gives the Key to the occult meaning.\n\nBut it is inseparable from Leo, the sign that precedes it, and from the Pleiades and their sisters, the Hyades, of which Aldebaran is the brilliant leader.\n\nAll of these are connected with the periodical renovations of the earth, with regard to its continents -- even Ganymedes, who in astronomy is Aquarius.\n\nIt was already shown that while the South Pole is the pit (or the infernal regions figuratively and cosmologically), the North Pole is geographically the first continent; while astronomically and metaphorically the celestial pole, with its pole star in heaven, is Meru, or the seat of Brahma, the throne of Jupiter, etc.\n\nFor in the age when the gods forsook the earth and were said to ascend into heaven, the ecliptic had become parallel with the meridian, and part of the Zodiac appeared to descend from the north pole to the north horizon.\n\nAldebaran was in conjunction then with the Sun, as it was 40,000 years ago, at the great festival in commemoration of that Magnus Annus, of which Plutarch was speaking.\n\nSince that year (40,000 years ago) there has been a retrograde motion of the equator, and about 31,000 years ago Aldebaran was in conjunction with the vernal equinoctial point.\n\nThe part assigned to Taurus, even in Christian mysticism, is too well known to need repetition.\n\nThe famous Orphic hymn on the great periodical cataclysm divulges the whole esotericism of the event.\n\nPluto (in the pit) carries off Eurydice, bitten by the (polar) serpent.\n\nThen Leo, the lion, is vanquished.\n\nNow, when the Lion is in the pit, or below the south pole, then Virgo, as the next sign, follows him, and when her head, down to the waist, is below the South horizon -- she is inverted.\n\nOn the other hand, the Hyades are the rain or Deluge constellations; and Aldebaran (he who follows, or succeeds the daughters of Atlas, or the Pleiades) looks down from the eye of Taurus.\n\nIt is from this point of the ecliptic that the calculations of the new cycle were commenced.\n\nThe student has to remember also, that when Ganymedes ( Aquarius ) is raised to [[Vol.\n\n2, Page]] 786 THE SECRET DOCTRINE.\n\nheaven (or above the horizon of the North Pole) Virgo or Astraea, who is Venus-Lucifer, descends head downwards below the horizon of the South Pole, or the pit; which pit , or the pole, is also the Great Dragon, or the Flood.\n\nLet the student exercise his intuition by placing these facts together; no more can be said.\n\n\"The connection,\" comments Lyell, \"between the doctrine of successive catastrophes and repeated deteriorations in the moral character of the human race, is more intimate and natural than might at first be imagined.\n\nFor, in a rude state of society, all great calamities are regarded by the people as judgments of God on the wickedness of man.\n\n.\n\n.\n\n.\n\nIn like manner in the account given to Solon by the Egyptian priests of the submersion of the island of Atlantis under the waters of the ocean, after repeated shocks of an earthquake, we find that the event happened when Jupiter had seen the moral depravity of the inhabitants.\n\n\" True; but was it not owing to the fact that all esoteric truths were given out to the public by the Initiates of the temples under the guise of allegories?\n\n\"Jupiter,\" is merely the personification of that immutable Cyclic Law, which arrests the downward tendency of each Root-Race, after attaining the zenith of its glory.* Unless we hold with Prof."


body = "But the signification is, that it is androgyne or hermaphrodite, that is phallus and yoni combined, the number 10, the Hebrew letter Jod , the containment of Jehovah.\n\nShe, or rather she-he, gives the minutes of the same circle of 360 degrees.\" \"Jehovah,\" in its best aspect is Binah, \"the Upper mediating Mother, the Great Sea or Holy Spirit;\" therefore rather a synonym of Mary, the Mother of Jesus, than of his Father; that \"Mother, being the Latin Mare \" the Sea is here also, Venus, the Stella del Mare , or \"Star of the Sea.\" The ancestors of the mysterious Akkadians -- the Chandra or Indovansas , the Lunar Kings whom tradition shows reigning at Prayag (Allahabad) ages before our era -- had come from India, and brought with them the worship of their forefathers, of Soma, and his son Budha, which afterwards became that of the Chaldeans.\n\nYet such adoration, apart from popular Astrolatry and Heliolatry, was in no sense idolatry.\n\nNo more, at any rate, than the modern Roman Catholic symbolism which connects their Virgin Mary -- the Magna Mater of the Syrians and Greeks -- with the Moon.\n\nOf this worship, the most pious Roman Catholics feel quite proud, [[Vol.\n\n1, Page]] 393 COPIES AND ORIGINALS.\n\nand loudly confess to it.\n\nIn a Memoire to the French Academy, the Marquis De Mirville says: -- \"It is only natural that, as an unconscious prophecy, Ammon-Ra should be his mother ' s husband , since the Magna Mater of the Christians is precisely the spouse of that son she conceives .\n\n.\n\n.\n\n.\n\nWe (Christians) can understand now why Neithis throws radiance on the sun , while remaining the Moon , since the V IRGIN, who is the Q UEEN OF H EAVEN, as Neith was , clothes herself in her radiance, and clothes in his turn the C HRIST- S UN.\n\n\" Tu vestis solem et te sol vestit .\".\n\n.\n\n.\n\nis sung by the Roman Catholics during their service, and he adds: -- \"We (Christians) understand also how it is that the famous inscription at Sais should have stated that 'none has ever lifted my peplum (veil),' considering that this sentence, literally translated, is the summary of what is sung in the Church on the day of the immaculate conception.\n\n\" ( A RCHAEOLOGY OF THE V IRGIN M OTHER,\" p.\n\n117.) Surely nothing could be more sincere than this!\n\nIt justifies entirely what Mr.\n\nGerald Massey has said in his Lecture on \"Luniolatry, Ancient and Modern\": -- \"The man in the moon (Osiris-Sut, Jehovah-Satan, Christ-Judas, and other Lunar twins) is often charged with bad conduct.\n\n.\n\n.\n\n.\n\nIn the lunar phenomena the moon was one as the moon, which was two-fold in sex, and three-fold in character -- as mother, child, and adult male.\n\nThus the child of the moon became the consort of his own mother!\n\nIt could not be helped if there was to be any reproduction.\n\nHe was compelled to be his own father!\n\nThese relationships were repudiated by later sociology, and the primitive man in the moon got tabooed.\n\nYet, in its latest, most inexplicable phase, this has become the central doctrine of the grossest superstition the world has seen, for these lunar phenomena and their humanly represented relationships, the incestuous included, are the very foundations of the Christian Trinity in Unity.\n\nThrough ignorance of the symbolism, the simple representation of early time has become the most profound religious mystery in modern Luniolatry.\n\nThe Roman Church, without being in any wise ashamed of the proof, portrays the Virgin Mary arrayed with the sun, and the horned moon at her feet, holding the lunar infant in her arms -- as child and consort of the mother moon.\n\nThe mother, child, and adult male, are fundamental.\" \"In this way it can be proved that our Christology is mummified mythology, and legendary lore, which have been palmed off upon us in the Old Testament and the New, as divine revelation uttered by the very voice of God.\" A charming allegory is found in the Zohar , one which unveils better than anything ever did the true character of Jehovah or YHVH in the primitive conception of the Hebrew Kabalists.\n\nIt is now found in the philosophy of I'bn Gebirol's Kabbalah, translated by Isaac Myer.\n\n\"In the introduction written by R'Hez'quee-yah, which is very old,\" says our author, \"and forms part of our Brody edition of the Zohar (I, 5 b.\n\nsq.\n\n) is an account of a journey taken by R.\n\nEl'azar, son of R.\n\nShim-on b.\n\nIo'hai, and Rabbi Abbah.\" They met a man with a heavy burden and asked his name; but he refused to give it and proceeded to explain to them Thorah [[Vol.\n\n1, Page]] 394 THE SECRET DOCTRINE.\n\n(Law).\n\n\"They asked: 'Who caused thee thus to walk and carry such a heavy load?' He answered: 'The letter , (Yod, which = 10, and is the symbolical letter of Kether and the essence and germ of the Holy name Y HVH ) .\n\n.\n\n.\n\n.\n\nThey said to him: 'If thou wilt tell us the name of thy father, we will kiss the dust of thy feet.' He replied: 'As to my father, he had his dwelling in the Great Sea , and was a fish therein ' (like Vishnu and Dagon or Oannes), 'which (first) destroyed the great sea' .\n\n.\n\n.\n\n.\n\n.\n\nand he was great and mighty and 'Ancient of Days,' until he swallowed all the other fishes in the (Great) Sea .\n\n.\n\n.\n\nR.\n\nEl'azar listened and said to him: 'Thou art the Son of the Holy Flame, thou art the Son of Rab Ham -- ' nun -ah Sabah [the old: the fish in Aramaic or Chaldee is nun ( noon )] thou art the Son of the Light of the Thorah,\" ( Dharma ) etc.\n\nThen the author explains that the feminine Sephiroth, Binah , is termed by the Kabalist the great sea: therefore Binah, whose divine names are Jehovah, Yah , and Elohim, is simply the Chaldean Tiamat, the female power, the Thalatth of Berosus, who presides over the Chaos, and was made out later by Christian theology to be the serpent and the Devil.\n\nShe-He (Yah-hovah) is the supernal (Heh, and Eve).\n\nThis Yah-hovah then or Jehovah, is identical with our Chaos -- Father, Mother, Son, -- on the material plane and in the purely physical World.\n\nDemon and Deus at one and the same time; the sun and moon, good and evil, God and Demon."


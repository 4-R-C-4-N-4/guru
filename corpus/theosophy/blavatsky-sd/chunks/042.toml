body = "2.[[3.]] \" D ARKNESS\" RADIATES LIGHT, AND LIGHT DROPS ONE SOLITARY RAY INTO THE WATERS, INTO THE MOTHER DEEP.\n\nT HE RAY SHOOTS THROUGH THE VIRGIN-EGG; THE RAY CAUSES THE ETERNAL EGG TO THRILL, AND DROP THE NON-ETERNAL ( periodical ) GERM, WHICH CONDENSES INTO THE WORLD EGG ( a ) .\n\n( a ) The solitary ray dropping into the mother deep may be taken as meaning Divine Thought or Intelligence, impregnating chaos.\n\nThis, however, occurs on the plane of metaphysical abstraction, or rather the plane whereon that which we call a metaphysical abstraction is a reality.\n\nThe Virgin-egg being in one sense abstract Egg-ness, or the power of becoming developed through fecundation, is eternal and for ever the same.\n\nAnd just as the fecundation of an egg takes place before it is dropped; so the non-eternal periodical germ which becomes later in [[Vol.\n\n1, Page]] 65 NATURE'S SYMBOLS.\n\nsymbolism the mundane egg, contains in itself, when it emerges from the said symbol, \"the promise and potency\" of all the Universe.\n\nThough the idea per se is, of course, an abstraction, a symbolical mode of expression, it is a symbol truly, as it suggests the idea of infinity as an endless circle.\n\nIt brings before the mind's eye the picture of Kosmos emerging from and in boundless space, a Universe as shoreless in magnitude if not as endless in its objective manifestation.\n\nThe simile of an egg also expresses the fact taught in Occultism that the primordial form of everything manifested, from atom to globe, from man to angel, is spheroidal, the sphere having been with all nations the emblem of eternity and infinity -- a serpent swallowing its tail.\n\nTo realize the meaning, however, the sphere must be thought of as seen from its centre.\n\nThe field of vision or of thought is like a sphere whose radii proceed from one's self in every direction, and extend out into space, opening up boundless vistas all around.\n\nIt is the symbolical circle of Pascal and the Kabalists, \"whose centre is everywhere and circumference nowhere,\" a conception which enters into the compound idea of this emblem.\n\nThe \"Mundane Egg\" is, perhaps, one of the most universally adopted symbols, highly suggestive as it is, equally in the spiritual, physiological, and cosmological sense.\n\nTherefore, it is found in every world-theogony, where it is largely associated with the serpent symbol; the latter being everywhere, in philosophy as in religious symbolism, an emblem of eternity, infinitude, regeneration, and rejuvenation, as well as of wisdom.\n\n(See Part II.\n\n\"Tree and Serpent and Crocodile Worship.\") The mystery of apparent self-generation and evolution through its own creative power repeating in miniature the process of Cosmic evolution in the egg, both being due to heat and moisture under the efflux of the unseen creative spirit, justified fully the selection of this graphic symbol.\n\nThe \"Virgin Egg\" is the microcosmic symbol of the macrocosmic prototype -- the \"Virgin Mother\" -- Chaos or the Primeval Deep.\n\nThe male Creator (under whatever name) springs forth from the Virgin female, the immaculate root fructified by the Ray.\n\nWho, if versed in astronomy and natural sciences, can fail to see its suggestiveness?\n\nCosmos as receptive Nature is an Egg fructified -- yet left immaculate; once regarded as boundless, it could have no other representation than a spheroid.\n\nThe Golden Egg was surrounded by seven natural elements (ether, fire, air, water), \"four ready, three secret.\" It may be found [[Vol.\n\n1, Page]] 66 THE SECRET DOCTRINE.\n\nstated in Vishnu Purana, where elements are translated \"Envelopes\" and a secret one is added: \"Aham-kara\" (see Wilson's Vishnu Purana, Book I., p.\n\n40).\n\nThe original text has no \"Aham-kara;\" it mentions seven Elements without specifying the last three (see Part II.\n\non \"The Mundane Egg\").\n\n------- STANZA III.\n\n-- Continued.\n\n4.\n\n( Then ) THE THREE ( triangle ) FALL INTO THE FOUR ( quaternary ) .\n\nT HE RADIANT ESSENCE BECOMES SEVEN INSIDE, SEVEN OUTSIDE ( a ).\n\nTHE LUMINOUS EGG ( Hiranyagarbha ), WHICH IN ITSELF IS THREE ( the triple hypostases of Brahma , or Vishnu , the three \" Avasthas \"), CURDLES AND SPREADS IN MILK-WHITE CURDS THROUGHOUT THE DEPTHS OF MOTHER, THE ROOT THAT GROWS IN THE OCEAN OF LIFE ( b ) .\n\nThe use of geometrical figures and the frequent allusions to figures in all ancient scriptures (see Puranas, Egyptian papyri, the \"Book of the Dead\" and even the Bible) must be explained.\n\nIn the \"Book of Dzyan,\" as in the Kabala, there are two kinds of numerals to be studied -- the figures, often simple blinds, and the Sacred Numbers, the values of which are all known to the Occultists through Initiation.\n\nThe former is but a conventional glyph, the latter is the basic symbol of all.\n\nThat is to say, that one is purely physical, the other purely metaphysical, the two standing in relation to each other as matter stands to spirit -- the extreme poles of the ONE Substance.\n\nAs Balzac, the unconscious Occultist of French literature, says somewhere, the Number is to Mind the same as it is to matter: \"an incomprehensible agent;\" (perhaps so to the profane, never to the Initiated mind).\n\nNumber is, as the great writer thought, an Entity, and, at the same time, a Breath emanating from what he called God and what we call the ALL; the breath which alone could organize the physical Kosmos, \"where naught obtains its form but through the Deity, which is an effect of Number.\" It is instructive to quote Balzac's words upon this subject: -- \"The smallest as the most immense creations, are they not to be distinguished from each other by their quantities, their qualities, their dimensions, their forces and attributes, all begotten by the N UMBER?\n\nThe infinitude of the Numbers is a fact proven to our mind, but of which no proof can be physically [[Vol.\n\n1, Page]] 67 THE POWER OF NUMBERS.\n\ngiven.\n\nThe mathematician will tell us that the infinitude of the numbers exists but is not to be demonstrated.\n\nGod is a Number endowed with motion, which is felt but not demonstrated.\n\nAs Unity , it begins the Numbers , with which it has nothing in common .\n\n.\n\n.\n\n.\n\n.\n\nThe existence of the Number depends on Unity, which, without a single Number, begets them all.\n\n.\n\n.\n\n.\n\n.\n\nWhat!"


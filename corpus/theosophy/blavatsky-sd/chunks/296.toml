[content]
body = "Hence, when \" other worlds\" are mentioned -- whether better or worse, more spiritual or still more material, though both invisible -- the Occultist does not locate these spheres either outside or inside our Earth, as the theologians and the poets do; for their location is nowhere in the space known to, and conceived by, the profane.\n\nThey are, as it were, blended with our world -- interpenetrating it and interpenetrated by it.\n\nThere are millions and millions of worlds and firmaments visible to us; there still greater numbers beyond those visible to the telescopes, and many of the latter kind do not belong to our objective sphere of existence.\n\nAlthough as invisible as if they were millions of miles beyond our solar system, they are yet with us, near us, within our own world, as objective and material to their respective inhabitants as ours is to us.\n\nBut, again, the relation of these worlds to ours is not that of a series of egg-shaped boxes enclosed one within the other, like the toys called Chinese nests; each is entirely under its own special laws and conditions, having no direct relation to our sphere.\n\nThe inhabitants of these, as already said, may be, for all we know, or feel, passing through and around us as if through empty space, their very habitations and countries being interblended with ours, though not disturbing our vision, because we have not yet the faculties necessary for discerning them.\n\nYet by their spiritual sight the Adepts, and even some seers and sensitives, are always able to discern, whether in a greater or smaller degree, the presence and close proximity to us of Beings pertaining to other spheres of life.\n\nThose of the (spiritually) higher worlds, communicate only with those terrestrial mortals who ascend to them, through individual efforts, on to the higher plane they are occupying.\n\n.\n\n.\n\n.\n\n\" T HE SONS OF Bhumi ( E ARTH) REGARD THE S ONS OF Deva - lokas (ANGEL-SPHERES) AS THEIR GODS; AND THE S ONS OF LOWER KINGDOMS LOOK UP TO THE MEN OF Bhumi , AS TO THEIR devas (GODS); MEN REMAINING UNAWARE OF IT IN THEIR BLINDNESS.\n\n.\n\n.\n\n.\n\nT HEY ( me n) TREMBLE [[Vol.\n\n1, Page]] 606 THE SECRET DOCTRINE.\n\nBEFORE THEM WHILE USING THEM ( for magical purposes ).\n\n.\n\n.\n\n.\n\nT HE FIRST R ACE OF M EN WERE THE \" Mind - born sons \" OF THE FORMER.\n\nT HEY ( the pitris and devas ) ARE OUR PROGENITORS.\n\n.\n\n.\n\n.\n\n( Book II.\n\nof Commentary on the Book of DZYAN.\n\n) \"Educated people,\" so-called, deride the idea of Sylphs, Salamanders, Undines, and Gnomes; the men of science regard as an insult any mention of such superstitions; and with a contempt of logic and common good sense, that is often the prerogative of \"accepted authority,\" they allow those, whom it is their duty to instruct, to labour under the absurd impression that in the whole Kosmos, or at any rate in our own atmosphere, there are no other conscious, intelligent beings, save ourselves.* Any other humanity (composed of distinct human beings) than a mankind with two legs, two arms, and a head with man's features on it, would not be called human; though the etymology of the word would seem to have little to do with the general appearance of a creature.\n\nThus, while Science sternly rejects even the possibility of there being such (to us, generally) invisible creatures, Society, while believing in it all secretly , is made to deride the idea openly.\n\nIt hails with mirth such works as the Count de Gabalis , and fails to understand that open satire is the securest mask.\n\nNevertheless, such invisible worlds do exist.\n\nInhabited as thickly as our own is, they are scattered throughout apparent Space in immense number; some far more material than our own world, others gradually etherealizing until they become formless and are as \" Breaths.\n\n\" That our physical eye does not see them, is no reason to disbelieve in them; physicists can see neither their ether, atoms, nor \"modes of motion,\" or Forces.\n\nYet they accept and teach them.\n\nIf we find, even in the natural world with which we are acquainted, matter affording a partial analogy in the difficult conception of such invisible worlds, there seems little difficulty in recognizing the possibility of such a presence.\n\nThe tail of a comet, which, though attracting our attention by virtue of its luminosity, yet does not disturb or impede our vision of objects, which we perceive through and beyond it, affords the first stepping-stone toward a proof of the same.\n\nThe tail of a comet passes rapidly across our horizon, and we should neither feel it, nor be cognizant of its passage, but for the brilliant coruscation, often perceived only by a few interested in the phenomenon, while everyone else remains ignorant of its presence and passage through , or across, a portion of our globe.\n\nThis tail may, or may not, be an integral portion of the being of the comet, but its tenuity sub- [[Footnote(s)]] ------------------------------------------------- * Even the question of the plurality of worlds inhabited by sentient creatures is rejected or approached with the greatest caution!\n\nAnd yet see what the great astronomer, Camille Flammarion, says in his \" Pluralite des Mondes.\n\n\" [[Vol.\n\n1, Page]] 607 PLURALITY OF WORLDS.\n\nserves our purpose as an illustration.\n\nIndeed, it is no question of superstition, but simply a result of transcendental science, and of logic still more, to admit the existence of worlds formed of even far more attenuated matter than the tail of a comet.\n\nBy denying such a possibility, Science has played for the last century into the hands of neither philosophy nor true religion, but simply into those of theology.\n\nTo be able to dispute the better the plurality of even material worlds, a belief thought by many churchmen incompatible with the teachings and doctrines of the Bible,* Maxwell had to calumniate the memory of Newton, and try to convince his public that the principles contained in the Newtonian philosophy are those \"which lie at the foundation of all atheistical systems.\" ( Vide Vol.\n\nII., \" Plurality of Worlds.\n\n\") \"Dr.\n\nWhewell disputed the plurality of worlds by appeal to scientific evidence,\" writes Professor Winchell.** And if even the habitability of physical worlds, of planets, and distant stars which shine in myriads over our heads is so disputed, how little chance is there for the acceptance of invisible worlds within the apparently transparent space of our own!\n\nBut, if we can conceive of a world composed (for our senses) of matter still more attenuated than the tail of a comet, hence of inhabitants in it who are as ethereal, in proportion to their globe, as we are in comparison with our rocky, hard-crusted earth, no wonder if we do not perceive them, nor sense their presence or even existence.\n\nOnly, in what is the idea contrary to science?"


body = "Two expressions of circumference to diameter in integrals are used in the Bible: (1) The perfect, and (2) the imperfect.\n\nOne of the relations between these is such that (2) subtracted from (1) will leave a unit of a diameter value in terms, or in the denomination of the circumference value of the perfect circle, or a unit straight line having a perfect circular value, or a factor of circular value\" (p.\n\n22).\n\nSuch calculations can lead one no further than to unriddle the mysteries of the third stage of Evolution, or the \"third creation of Brahma.\" The initiated Hindus know how to \"square the circle\" far better than any European.\n\nBut of this more anon.\n\nThe fact is that the Western Mystics commence their speculation only at that stage when the universe \"falls into matter,\" as the occultists say.\n\nThroughout the whole series of Kabalistic books we have not met with one sentence that would hint in the remotest way at the psychological and spiritual, as well as at the mechanical and physiological secrets of \"creation.\" Shall we, then, regard the evolution of the Universe as simply a prototype, on a gigantic scale, of the act of procreation?\n\nas \"divine\" Phallicism, and rhapsodize on it as the evilly-inspired author of a late work of this name has done?\n\nThe writer does not think so.\n\nAnd she feels justified in saying so, since the most careful reading of the Old Testament -- esoterically, as well as exoterically -- seems to have carried the most enthusiastic enquirers no further than a certainty on mathematical grounds that from the first to the last chapter of the Pentateuch every scene, every character or event are shown connected, directly or indirectly, with the origin of birth in its crudest and most [[Vol.\n\n2, Page]] 545 A PLAGIARISM BY PASCAL.\n\nbrutal form.\n\nThus, however interesting and ingenious the rabbinical methods, the writer, in common with other Eastern Occultists, must prefer those of the Pagans.\n\nIt is not, then, in the Bible that we have to search for the origin of the Cross and Circle, but beyond the Flood.\n\nTherefore, returning to Eliphas Levi and the Zohar, we answer for the Eastern Occultists and say that, applying practice to principle, they agree entirely with Pascal, who says that \"God is a circle, the centre of which is everywhere and the circumference nowhere,\" whereas the Kabalists say the reverse, and maintain it solely out of their desire to veil their doctrine.\n\nBy the way, the definition of Deity by the Circle is not Pascal's at all, as E.\n\nLevi thought.\n\nIt was borrowed by the French philosopher from either Mercury Trismegistus or Cardinal Cusa's Latin work, De Docta Ignorantia, in which he makes use of it.\n\nIt is, moreover, disfigured by Pascal, who replaces the words \"Cosmic Circle,\" which stand symbolically in the original inscription, by the word Theos.\n\nWith the ancients both words were synonymous.\n\n------- A.\n\nC ROSS AND C IRCLE.\n\nSomething of the divine and the mysterious has ever been ascribed, in the minds of the ancient philosophers, to the shape of the circle.\n\nThe old world, consistent in its symbolism with its pantheistic intuitions, uniting the visible and the invisible Infinitudes into one, represented Deity and its outward VEIL alike -- by a circle.\n\nThis merging of the two into a unity, and the name theos given indifferently to both, is explained, and becomes thereby still more scientific and philosophical.\n\nPlato's etymological definition of the word theos has been shown elsewhere.\n\nHe derives it from the verb [[ theein ]] (see Cratylus ) , \"to move,\" as suggested by the motion of the heavenly bodies which he connects with deity.\n\nAccording to the Esoteric philosophy, this Deity is during its \"nights\" and its \"days\" ( i.e.\n\n, cycles of rest or activity) \"the eternal perpetual motion,\" \"the EVER-BECOMING, as well as the ever universally present, and the ever Existing.\" The latter is the root-abstraction, the former -- the only possible conception in human mind, if it disconnects this deity from any shape or form.\n\nIt is a perpetual, never-ceasing evolution, circling back in its incessant progress through aeons of duration into its original status -- A BSOLUTE U NITY.\n\nIt was only the minor gods, who were made to carry the symbolical attributes of the higher ones.\n\nThus, the god Shoo, the personification of Ra, who appears as \"the great Cat of the Basin of Persea, in An\" [[Vol.\n\n2, Page]] 546 THE SECRET DOCTRINE.\n\n( See \"Book of the Dead,\" Ritual XVII , 45-47), was often represented in the Egyptian monuments seated, and holding a cross, symbol of the four quarters, or the Elements, attached to a Circle.\n\nIn that very learned work, \"The Natural Genesis,\" by Mr.\n\nGerald Massey, on pp.\n\n408-455 (Vol.\n\nI.), under the heading, \"Typology of the Cross,\" there is more information to be had on the cross and circle than in any other work we know of.\n\nHe who would fain have proofs of the antiquity of the Cross is referred to these two volumes.\n\nThe author shows that \"the circle and the cross are inseparable.\n\n.\n\n.\n\n.\n\nThe crux ansata unites the circle and cross of the four corners.\n\nFrom this origin they came to be interchangeable at times.\n\nFor example, the Chakra, or Disk of Vishnu, is a circle.\n\nThe names denote the circling, wheeling round, periodicity, the wheel of time.\n\nThis the god uses as a weapon to hurl at the enemy.\n\nIn like manner, Thor throws his weapon, the Fylfot, a form of the four-footed cross (Swastica) and a type of the four quarters.\n\nThus the cross is equivalent to the circle of the year.\n\n.\n\n.\n\n.\n\nThe wheel emblem unites the cross and circle in one, as does the hieroglyphic cake and the Ankh-te .\" Nor was the double glyph sacred with the profane, but only with the Initiates.\n\nFor Raoul-Rochette shows ( ibid ) \"the sign , occurring as the reverse of a Phoenician coin, with a Ram as the obverse.\n\n.\n\n.\n\n.\n\n.The same sign, sometimes called Venus' Looking-Glass, because it typified reproduction, was employed to mark the hind-quarters of valuable brood mares of Corinthian and other beautiful breeds of horses\" (Raoul-Rochette, loc.\n\ncit.\n\nDe La Croix Ansee, Mem.\n\nde l'Academie des Sciences, pl.\n\n2, Nos.\n\n8, 9, also 16, 2, p.\n\n320, quoted in \"Nat.\n\nGen.\" ) , which proves that so far back as those early days the cross had already become the symbol of human procreation, and that oblivion of the divine origin of Cross and Circle had been forgotten."


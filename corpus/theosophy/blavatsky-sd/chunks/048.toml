[content]
body = "And the numbers of these three words, Hoa Atah Ani, are 12, 406, and 61, which are resumed in the key numbers of 3, 10, and 7, by the Qabalah of the Nine Chambers, which is a form of the exegetical rule of Temura.\" It is useless to attempt to explain the mystery in full.\n\nMaterialists and the men of modern Science will never understand it, since, in order [[Vol.\n\n1, Page]] 79 PRIMEVAL RADIATIONS FROM THE UNITY.\n\nto obtain clear perception of it, one has first of all to admit the postulate of a universally diffused, omnipresent, eternal Deity in Nature; secondly, to have fathomed the mystery of electricity in its true essence; and thirdly, to credit man with being the septenary symbol, on the terrestrial plane, of the One Great U NIT (the Logos), which is Itself the Seven-vowelled sign, the Breath crystallized into the W ORD.* He who believes in all this, has also to believe in the multiple combination of the seven planets of Occultism and of the Kabala, with the twelve zodiacal signs; to attribute, as we do, to each planet and to each constellation an influence which, in the words of Ely Star (a French Occultist), \"is proper to it, beneficent or maleficent, and this, after the planetary Spirit which rules it, who, in his turn, is capable of influencing men and things which are found in harmony with him and with which he has any affinity.\" For these reasons, and since few believe in the foregoing, all that can now be given is that in both cases the symbol of Hansa (whether \"I,\" \"He,\" Goose or Swan) is an important symbol, representing, for instance, Divine Wisdom, Wisdom in darkness beyond the reach of men.\n\nFor all exoteric purposes, Hansa, as every Hindu knows, is a fabulous bird, which, when given milk mixed with water for its food (in the allegory) separated the two, drinking the milk and leaving the water; thus showing inherent wisdom -- milk standing symbolically for spirit, and water for matter.\n\nThat this allegory is very ancient and dates from the very earliest archaic period, is shown by the mention (in Bhagavata Purana) of a certain caste named \"Hamsa\" or \"Hansa,\" which was the \"one caste\" par excellence ; when far back in the mists of a forgotten past there was among the Hindus only \"One Veda, One Deity, One Caste.\" There is also a range in the Himalayas, described in the old books as being situated north of Mount Meru, called \"Hamsa,\" and connected with episodes pertaining to the history of religious mysteries and initiations.\n\nAs to the name of Kala-Hansa being the supposed vehicle of Brahma-Prajapati, in the exoteric texts and translations of the [[Footnote(s)]] ------------------------------------------------- * This is again similar to the doctrine of Fichte and German Pantheists.\n\nThe former reveres Jesus as the great teacher who inculcated the unity of the spirit of man with the God-Spirit (the Adwaita doctrine) or universal Principle.\n\nIt is difficult to find a single speculation in Western metaphysics which has not been anticipated by Archaic Eastern philosophy.\n\nFrom Kant to Herbert Spencer, it is all a more or less distorted echo of the Dwaita, Adwaita, and Vedantic doctrines generally.\n\n[[Vol.\n\n1, Page]] 80 THE SECRET DOCTRINE.\n\nOrientalists, it is quite a mistake.\n\nBrahma, the neuter, is called by them Kala-Hansa and Brahma, the male, Hansa-Vahana, because forsooth \"his vehicle or Vahan is a swan or goose\" (vide \"the Hindu Classical Dictionary.\") This is a purely exoteric gloss.\n\nEsoterically and logically, if Brahma, the infinite, is all that is described by the Orientalists, namely, agreeably with the Vedantic texts, an abstract deity in no way characterised by the description of any human attributes, and it is still maintained that he or it is called Kala-Hansa -- then how can it ever become the Vahan of Brahma, the manifested finite god?\n\nIt is quite the reverse.\n\nThe \"Swan or goose\" (Hansa) is the symbol of that male or temporary deity, as he, the emanation of the primordial Ray, is made to serve as a Vahan or vehicle for that divine Ray, which otherwise could not manifest itself in the Universe, being, antiphrastically, itself an emanation of \"Darkness\" -- for our human intellect, at any rate.\n\nIt is Brahma, then, who is Kala-Hansa, and the Ray, the Hansa-Vahana.\n\nAs to the strange symbol chosen, it is equally suggestive; the true mystic significance being the idea of a universal matrix, figured by the primordial waters of the \"deep,\" or the opening for the reception, and subsequently for the issue, of that one ray (the Logos), which contains in itself the other seven procreative rays or powers (the logoi or builders).\n\nHence the choice by the Rosecroix of the aquatic fowl -- whether swan or pelican,* with seven young ones for a symbol, modified and adapted to the religion of every country.\n\nEn-Soph is called the \"Fiery Soul of the Pelican\" in the Book of Numbers.** (See Part II.\n\n\"The Hidden Deity and its Symbols and Glyphs.\") Appearing with every Manvantara as Narayan, or Swayambhuva (the [[Footnote(s)]] ------------------------------------------------- * Whether the genus of the bird be cygnus , anser , or pelecanus , it is no matter, as it is an aquatic bird floating or moving on the waters like the Spirit, and then issuing from those waters to give birth to other beings.\n\nThe true significance of the symbol of the Eighteenth Degree of the Rose-Croix is precisely this, though poetised later on into the motherly feeling of the Pelican rending its bosom to feed its seven little ones with its blood.\n\n** The reason why Moses forbids eating the pelican and swan, classing the two among the unclean fowls, and permits eating \"bald locusts, beetles, and the grasshopper after his kind\" (Leviticus xi.\n\nand Deuteronomy xiv.) is a purely physiological one, and has to do with mystic symbology only in so far as the word \"unclean,\" like every other word, ought not to be read and understood literally, as it is esoteric like all the [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 81 PRIMEVAL DIFFERENTIATIONS.\n\nSelf-Existent), and penetrating into the Mundane Egg, it emerges from it at the end of the divine incubation as Brahma or Prajapati, a progenitor of the future Universe into which he expands."


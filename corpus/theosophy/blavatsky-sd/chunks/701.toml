[content]
body = "The archaic records show the Initiates of the Second Sub-race of the Aryan family moving from one land to the other for the purpose of supervising the building of menhirs and dolmens, of colossal Zodiacs in stone, and places of sepulchre to serve as receptables for the ashes of generations to come.\n\nWhen was it?\n\nThe fact of their crossing from France to Great Britain by land may give an idea of the date when such a journey could have been performed on terra firma.\n\n[[Footnote(s)]] ------------------------------------------------- * \"In making soundings in the stony soil of the Nile Valley two baked bricks were discovered, one at the depth of 20, the other at 25 yards.\n\nIf we estimate the thickness of the annual deposit formed by the river at 8 inches per century (more careful calculations have shown no more than from three to five per century), we must assign to the first of these bricks 12,000 years, and to the second 14,000 years.\n\nBy means of analogous calculations, Burmeister supposes 72,000 years to have elapsed since the first appearance of man on the soil of Egypt, and Draper attributes to the European man, who witnessed the last glacial epoch, an antiquity of more than 250,000 years.\" (\" Man before Metals, \" p.\n\n183.) Egyptian Zodiacs show more than 75,000 years of observation!\n\n( See further.\n\n) Note well also that Burmeister speaks only of the Delta population.\n\n** Or on what are now the British Islands, which were not yet detached from the main continent in those days.\n\n\"The ancient inhabitant of Picardy could pass into Great Britain without crossing the Channel.\n\nThe British Isles were united to Gaul by an isthmus which has since been submerged.\" (\" Man before Metals, \" p.\n\n184.) [[Vol.\n\n2, Page]] 751 DARWINIANS REJECT THE TRUTH.\n\nIt was -- \"When the level of the Baltic and of the North Sea was 400 feet higher than it is now; when the valley of the Somme was not hollowed to the depth it has now attained; when Sicily was joined to Africa, Barbary to Spain,\" when \"Carthage, the Pyramids of Egypt, the palaces of Uxmal and Palenque were not in existence, and the bold navigators of Tyre and Sidon, who at a later date were to undertake their perilous voyages along the coasts of Africa, were yet unborn.\n\nWhat we know with certainty is that European man was contemporaneous with the extinct species of the quaternary epoch .\n\n.\n\n.\n\n.\n\nthat he witnessed the upheaval of the Alps* and the extension of the glaciers, in a word that he lived for thousands of years before the dawn of the remotest historical traditions .\n\n.\n\n.\n\n.\n\nIt is even possible that man was the contemporary of extinct mammalia of species yet more ancient .\n\n.\n\n.\n\n.\n\nof the Elephas meridionalis of the sands of St.\n\nPrest .\n\n.\n\n.\n\nand the Elephas antiquus, assumed to be prior to the elephas primigenius, since their bones are found in company with carved flints in several English caves, associated with those of the Rhinoceros hemitaechus and even of the Machairodus latidens, which is of still earlier date .\n\n.\n\n.\n\n.\n\nM.\n\nE.\n\nLartet is of opinion that there is nothing really impossible in the existence of man as early as the Tertiary period.\"** If \"there is nothing impossible\" scientifically in the idea, and it may be admitted that man lived already as early as the Tertiary period, then it is just as well to remind the reader that Mr.\n\nCroll places the beginning of that period 2,500,000 years back (See Croll's \" Climate and Time \"); but there was a time when he assigned to it 15,000,000 years.\n\nAnd if all this may be said of European man, how great is the antiquity of the Lemuro-Atlantean and of the Atlanto-Aryan man?\n\nEvery educated person who follows the progress of Science, knows how all vestiges of man during the Tertiary period are received.\n\nThe calumnies that were poured on Desnoyers in 1863, when he made known to the Institute of France that he had made a discovery \"in the undisturbed pliocene sands of St.\n\nPrest near Chartres, proving the co-existence of man and the Elephas meridionalis \" -- were equal to the occasion.\n\nThe later discovery (in 1867) by the Abbe Bourgeois, that man lived in the Miocene epoch, and the reception it was given at the Pre-historic Con- [[Footnote(s)]] ------------------------------------------------- * He witnessed and remembered it too, as \"the final disappearance of the largest continent of Atlantis was an event coincident with the elevation of the Alps,\" a master writes ( See Esoteric Buddhism p .\n\n70).\n\nPari passu, as one portion of the dry land of our hemisphere disappeared, some land of the new continent emerged from the seas.\n\nIt is on this colossal cataclysm, which lasted during a period of 150,000 years, that traditions of all the \"Deluges\" are built, the Jews building their version on an event which took place later in \"Poseidonis.\" ** The Antiquity of the Human Race in \"Men before Metals,\" by M.\n\nJoly, Professor at the Science Faculty of Toulouse, p.\n\n184.\n\n[[Vol.\n\n2, Page]] 752 THE SECRET DOCTRINE.\n\ngress held at Brussels in 1872, proves that the average man of Science will never see but that which he wants to see.* The modern archeologist, though speculating ad infinitum upon the dolmens and their builders, knows, in fact, nothing of them or their origin.\n\nYet, these weird, and often colossal monuments of unhewn stones -- which consist generally of four or seven gigantic blocks placed together -- are strewn over Asia, Europe, America, and Africa, in groups or rows.\n\nStones of enormous size are found placed horizontally and variously upon two, three, four, and as in Poitou, upon six and seven blocks.\n\nPeople name them \"devil's altars,\" druidic stones, and giant tombs.\n\nThe stones of Carnac in the Morbihan, Brittany -- nearly a mile in length and numbering 11,000 ranged in eleven rows -- are twin sisters of those at Stonehenge.\n\nThe Conical menhir of Loch-Maria-ker in Morbihan, measures twenty yards in length and nearly two yards across.\n\nThe Menhir of Champ Dolent (near St.\n\nMalo) rises thirty feet above the ground, and is fifteen feet in depth below.\n\nSuch dolmens and prehistoric monuments are met with in almost every latitude."


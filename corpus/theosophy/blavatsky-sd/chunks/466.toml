[content]
body = "These were the earliest Gibborim, \"the mighty men of renown in those [[Footnote(s)]] ------------------------------------------------- * The \"Gods of the Elements\" are by no means the Elementals.\n\nThe latter are at best used by them as vehicles and materials in which to clothe themselves.\n\n.\n\n.\n\n.\n\n.\n\n** Cain was the sacrificer, as shown at first in chap.\n\niv.\n\nof Genesis, of \"the fruit of the ground,\" of which he was first tiller , while Abel \"brought of the firstlings of his flock\" to the Lord.\n\nCain is the symbol of the first male, Abel of the first female humanity, Adam and Eve being the types of the third race.\n\n(See \" The Mystery of Cain and Abel.\n\n\") The \"murdering\" is blood-shedding, but not taking life.\n\n[[Vol.\n\n2, Page]] 274 THE SECRET DOCTRINE.\n\ndays\" ( Gen.\n\nvi.); who become with the Fifth Race the Kabirim: Kabiri with the Egyptians and the Phoenicians, Titans with the Greeks, and Rakshasas and Daityas with the Indian races.\n\nSuch was the secret and mysterious origin of all the subsequent and modern religions, especially of the worship of the later Hebrews for their tribal god.\n\nAt the same time this sexual religion was closely allied to, based upon and blended, so to say, with astronomical phenomena.\n\nThe Lemurians gravitated toward the North Pole, or the Heaven of their Progenitors (the Hyperborean Continent); the Atlanteans, toward the Southern Pole, the pit , cosmically and terrestrially -- whence breathe the hot passions blown into hurricanes by the cosmic Elementals, whose abode it is.\n\nThe two poles were denominated, by the ancients, Dragons and Serpents -- hence good and bad Dragons and Serpents, and also the names given to the \"Sons of God\" (Sons of Spirit and Matter): the good and bad Magicians.\n\nThis is the origin of this dual and triple nature in man.\n\nThe legend of the \"Fallen Angels\" in its esoteric signification, contains the key to the manifold contradictions of human character; it points to the secret of man's self-consciousness; it is the angle-iron on which hinges his entire life-cycle; -- the history of his evolution and growth.\n\nOn a firm grasp of this doctrine depends the correct understanding of esoteric anthropogenesis.\n\nIt gives a clue to the vexed question of the Origin of Evil; and shows how man himself is the separator of the O NE into various contrasted aspects.\n\nThe reader, therefore, will not be surprised if so considerable space is devoted in each case to an attempt to elucidate this difficult and obscure subject.\n\nA good deal must necessarily be said on its symbological aspect; because, by so doing, hints are given to the thoughtful student for his own investigations, and more light can thus be suggested than it is possible to convey in the technical phrases of a more formal, philosophical exposition.\n\nThe \"Fallen Angels,\" so-called, are Humanity itself.\n\nThe Demon of Pride, Lust, Rebellion, and Hatred, has never had any being before the appearance of physical conscious man.\n\nIt is man who has begotten, nurtured, and allowed the fiend to develop in his heart; he, again, who has contaminated the indwelling god in himself, by linking the pure spirit with the impure demon of matter.\n\nAnd, if the Kabalistic saying, \" Demon est Deus inversus \" finds its metaphysical and theoretical corroboration in dual manifested nature, its practical application is found in Mankind alone.\n\nThus it has now become self-evident that postulating as we do ( a ) the appearance of man before that of other mammalia, and even before the ages of the huge reptiles; ( b ) periodical deluges and glacial periods owing to the karmic disturbance of the axis; and chiefly ( c ) the birth of man [[Vol.\n\n2, Page]] 275 NO DEVILS OUTSIDE HUMANITY.\n\nfrom a Superior Being, or what materialism would call a supernatural Being, though it is only super- human -- it is evident that our teachings have very few chances of an impartial hearing.\n\nAdd to it the claim that a portion of the Mankind in the Third Race -- all those Monads of men who had reached the highest point of Merit and Karma in the preceding Manvantara -- owed their psychic and rational natures to divine Beings hypostasizing into their fifth principles, and the Secret Doctrine must lose caste in the eyes of not only Materialism but even of dogmatic Christianity.\n\nFor, no sooner will the latter have learned that those angels are identical with their \"Fallen\" Spirits, than the esoteric tenet will be proclaimed most terribly heretical and pernicious.* The divine man dwelt in the animal, and, therefore, when the physiological separation took place in the natural course of evolution -- when also \"all the animal creation was untied, \" and males were attracted to females -- that race fell: not because they had eaten of the fruit of Knowledge and knew good from evil, but because they knew no better.\n\nPropelled by the sexless creative instinct, the early sub-races had evolved an intermediate race in which, as hinted in the Stanzas, the higher Dhyan-Chohans had incarnated.** \"When we have ascertained the extent of the Universe and learnt to know all that there is in it, we will multiply our race,\" answer the Sons of Will and Yoga to their brethren of the same race, who invite them to do as they do.\n\nThis means that the great Adepts and Initiated ascetics will \"multiply,\" i.e ., once more produce Mind-born immaculate Sons -- in the Seventh Root-Race.\n\nIt is so stated in the Puranas; in Adi Parvan ( p.\n\n115) and Brahma Purana, etc.\n\nIn one portion of the Pushkara Mahatmya, moreover, the separation of the sexes is allegorized by Daksha, who, seeing that his will-born progeny (the \"Sons of passive Yoga\"), will not create men, \" converts half himself into a female by whom he begets daughters,\" the future females of the Third Race which begat the giants of Atlantis, [[Footnote(s)]] ------------------------------------------------- * It is, perhaps, with an eye to this degradation of the highest and purest Spirits, who broke through the intermediate planes of lower consciousness (the \"Seven circles of fire\" of Pymander), that St.\n\nJames is made to say that \"this Wisdom ( psuche in the original) descended not from above, but is earthly, sensual, devilish \"; and Psuche is Manas, the \"human soul,\" the Spiritual Wisdom or Soul being Buddhi.\n\nYet Buddhi per se, being so near the Absolute, is only latent consciousness."


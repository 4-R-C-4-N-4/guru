body = "In Assyrian Ak meant Creator, the letter K pronounced Kh (Ah) gutturally.\n\nAccording to Swedenborg's mysticism Adam was not a man but a church (?) of primitive light.\n\nIn the Vedas Ad -iti is the primitive light, the Akasa of the phenomenal world.\n\n[[Vol.\n\n2, Page]] 43 ADAM-ADAMI.\n\nuntouched by fruitless speculation.\n\nThe only reference made to it was the brief conception of its diastolic and systolic property, of its periodical expansion or dilatation, and contraction.\n\nIn the Universe with all its incalculable myriads of systems and worlds disappearing and re-appearing in eternity, the anthropomorphised powers, or gods, their Souls, had to disappear from view with their bodies: -- \"The breath returning to the eternal bosom which exhales and inhales them,\" says our Catechism.\n\n\" Ideal nature, \" the abstract Space in which everything in the Universe is mysteriously and invisibly generated, is the same female side of procreative power in Nature in the Vedic as in every other Cosmogony.\n\nAditi is Sephira, and the Sophia-Achamoth of the Gnostics, and Isis, the virgin Mother of Horus.\n\nIn every Cosmogony, behind and higher than the creative deity, there is a superior deity, a planner, an Architect, of whom the Creator is but the executive agent.\n\nAnd still higher, over and around, within and without, there is the UNKNOWABLE and the unknown, the Source and Cause of all these Emanations.\n\n.\n\n.\n\n.\n\n.\n\nIt thus becomes easy to account for the reason why \" Adam-Adami \" is found in the Chaldean scripture, certainly earlier than the Mosaic Books.\n\nIn Assyrian Ad is the father, and in Aramaean Ad is \"One,\" and Ad-ad the \"only one,\" while Ak is in Assyrian \"creator.\" Thus Ad-am-ak-ad-mon became Adam Kadmon in the Kabala ( Zohar ) , meaning as it did, the \"One (Son) of the divine Father, or the creator,\" for the words \" am \" and \" om \" meant at one time in nearly every language the divine, or the deity.\n\nThus Adam Kadmon and Adam-Adami came to mean: -- \"The first emanation of the Father-Mother or divine nature,\" and literally \"the first divine one.\" And it is easy to see that Ad -Argat (or Aster ' t, the Syrian goddess, the consort of Ad-on, the lord god of Syria or the Jewish Adonai), and Venus, Isis, Ishtar, Mylitta, Eve, etc., etc., are identical with the Aditi and Vach of the Hindus.\n\nThey are all the \"Mothers of all living\" and \"of the gods.\" On the other hand -- cosmically and astronomically -- all the male gods became at first \"Sun-gods,\" then, theologically, the \"Suns of Righteousness\" and the Logoi, all symbolised by the Sun.* They are all Protogonoi (the first-born) and [[Footnote(s)]] ------------------------------------------------- * Adam-Jehovah, Brahma and Mars are, in one sense, identical; they are all symbols for primitive or initial generative powers for the purposes of human procreation.\n\nAdam is red, and so also are Brahma-Viraj and Mars -- god and planet.\n\nWater is the blood of the Earth; therefore, all these names are connected with Earth and Water.\n\n\"It takes earth and water to create a human soul,\" says Moses.\n\nMars is identical with Kartikeya God of War (in one sense) -- which god is born of the Sweat of Siva, Siva Gharmaja and the Earth.\n\nIn the Mahabharata he is shown as born without the intervention of a woman.\n\nAnd he is also called \"Lohita,\" the red , like Adam, and the other \"first men.\" Hence, the author of \" The Source of Measures \" is quite right in thinking that Mars (and all the other gods of like attributes), \"being the god of war and of [[Footnote continued on next page]] [[Vol.\n\n2, Page]] 44 THE SECRET DOCTRINE.\n\nMikroprosopoi.\n\nWith the Jews Adam Kadmon was the same as Athamaz, Tamaz, or the Adonis of the Greeks -- \"the One with, and of his father\" -- the \"Father\" becoming during the later Races Helios, the Sun, as Apollo Karneios,* for instance, who was the \"Sun born\"; Osiris, Ormazd, and so on, were all followed by, and found themselves transformed later on into still more earthly types: such as Prometheus, the crucified of Mount Kajbee, Hercules, and so many others, sun-gods and heroes, until all of them came to have no better significance than phallic symbols.\n\nIn the Zohar is i t said \"Man was created by the Sephiroth (Elohim-Javeh, also) and they engendered by common power the earthly Adam.\" Therefore in Genesis the Elohim say: -- \"Behold Man is become as one of us.\n\n\" But in Hindu Cosmogony or \"Creation,\" Brahma-Prajapati creates Viraj and the Rishis, spiritually; therefore the latter are distinctly called \"the Mind-born Sons of Brahma\"; and this specified mode of engendering precluded every idea of Phallicism, at any rate in the earlier human nations.\n\nThis instance well illustrates the respective spirituality of the two nations.\n\n------- 3.\n\nS AID THE \" L ORD OF THE SHINING F ACE.\" \" I SHALL SEND THEE A FIRE WHEN THY WORK IS COMMENCED.\n\nR AISE THY VOICE TO OTHER L OKAS, APPLY TO THY F ATHER THE L ORD OF THE L OTUS ( Kumuda-Pati ) ( a ) FOR HIS S ONS .\n\n.\n\n.\n\n.\n\nT HY PEOPLE SHALL BE UNDER THE RULE OF THE F ATHERS ( Pitri-pati ) .\n\nT HY MEN SHALL BE MORTALS.\n\nT HE MEN OF THE L ORD OF W ISDOM ( Budha, Mercury ) NOT THE SONS OF S OMA ( the Moon ) ARE IMMORTAL.\n\nC EASE THY COMPLAINTS ( b ).\n\nT HY SEVEN SKINS ARE YET ON THEE.\n\n.\n\n.\n\n.\n\nT HOU ART NOT READY.\n\nT HY MEN ARE NOT READY ( c ).\n\n( a ) Kumuda-Pati is the Moon, the Earth's parent, in his region of Soma-loka.\n\nThough the Pitris (Pitar or \"Fathers\") are sons of the Gods, elsewhere sons of Brahma and even Rishis, they are generally known as the \"lunar\" ancestors.\n\n( b ) Pitri-pati is the lord or king of the Pitris, Yama, the god of Death and the Judge of mortals."


body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n1 [[Vol.\n\n1, Page]] 269 THE FIRST CHAPTER OF CREATION.\n\nSUMMING UP.\n\n\"The History of Creation and of this world from its beginning up to the present time is composed of seven chapters.\n\nThe seventh chapter is not yet written.\" (T.\n\nSubba Row, Theosophist, 1881.) T HE first of these Seven chapters has been attempted and is now finished.\n\nHowever incomplete and feeble as an exposition, it is, at any rate, an approximation -- using the word in a mathematical sense -- to that which is the oldest basis for all the subsequent Cosmogonies.\n\nThe attempt to render in a European tongue the grand panorama of the ever periodically recurring Law -- impressed upon the plastic minds of the first races endowed with Consciousness by those who reflected the same from the Universal Mind -- is daring, for no human language, save the Sanskrit -- which is that of the Gods -- can do so with any degree of adequacy.\n\nBut the failures in this work must be forgiven for the sake of the motive.\n\nAs a whole, neither the foregoing nor what follows can be found in full anywhere.\n\nIt is not taught in any of the six Indian schools of philosophy, for it pertains to their synthesis -- the seventh, which is the Occult doctrine.\n\nIt is not traced on any crumbling papyrus of Egypt, nor is it any longer graven on Assyrian tile or granite wall.\n\nThe Books of the Vedanta (the last word of human knowledge) give out but the metaphysical aspect of this world-Cosmogony; and their priceless thesaurus, the Upanishads -- Upa-ni-shad being a compound word meaning \"the conquest of ignorance by the revelation of secret, spiritual knowledge\" -- require now the additional possession of a Master-key to enable the student to get at their full meaning.\n\nThe reason for this I venture to state here as I learned it from a Master.\n\nThe name, \" Upanishads ,\" is usually translated \"esoteric doctrine.\" These treatises form part of the Sruti or \"revealed knowledge,\" Revelation, in short, and are generally attached to the Brahmana [[Vol.\n\n1, Page]] 270 THE SECRET DOCTRINE.\n\nportion of the Vedas,* as their third division.\n\nThere are over 150 Upanishads enumerated by, and known to, Orientalists, who credit the oldest with being written probably about 600 years B.C.; but of genuine texts there does not exist a fifth of the number.\n\nThe Upanishads are to the Vedas what the Kabala is to the Jewish Bible.\n\nThey treat of and expound the secret and mystic meaning of the Vedic texts.\n\nThey speak of the origin of the Universe, the nature of Deity, and of Spirit and Soul, as also of the metaphysical connection of mind and matter.\n\nIn a few words: They CONTAIN the beginning and the end of all human knowledge, but they have now ceased to REVEAL it , since the day of Buddha.\n\nIf it were otherwise, the Upanishads could not be called esoteric, since they are now openly attached to the Sacred Brahmanical books, which have, in our present age, become accessible even to the Mlechchhas (out- castes ) and the European Orientalists.\n\nOne thing in them -- and this in all the Upanishads -- invariably and constantly points to their ancient origin, and proves ( a ) that they were written, in some of their portions, before the caste system became the tyrannical institution which it still is; and ( b ) that half of their contents have been eliminated, while some of them were rewritten and abridged.\n\n\"The great Teachers of the higher Knowledge and the Brahmans are continually represented as going to Kshatriya (military caste) kings to become their pupils.\" As Cowell pertinently remarks, the Upanishads \"breathe an entirely different spirit\" (from other Brahmanical writings), \"a freedom of thought unknown in any earlier work except in the Rig Veda hymns themselves.\" The second fact is explained by a tradition recorded in one of the MSS .\n\non Buddha's life.\n\nIt says that the Upanishads were originally attached to their Brahmanas after the beginning of a reform, which led to the exclusiveness of the present caste system among the Brahmins, a few centuries after the invasion of India by the \"twice-born.\" They were complete in those days, and were used for the instruction of the chelas who were preparing for their initiation.\n\n[[Footnote(s) -------------------------------------------------]] * \"The Vedas have a distinct dual meaning -- one expressed by the literal sense of the words, the other indicated by the metre and the swara -- intonation -- which are as the life of the Vedas.\n\n.\n\n.\n\n.\n\nLearned pundits and philologists of course deny that swara has anything to do with philosophy or ancient esoteric doctrines; but the mysterious connection between swara and light is one of its most profound secrets.\" (T.\n\nSubba Row, Five Years of Theosophy, p.\n\n154.) [[Vol.\n\n1, Page]] 271 OCCULTISM IN THE UPANISHADS.\n\nThis lasted so long as the Vedas and the Brahmanas remained in the sole and exclusive keeping of the temple-Brahmins -- while no one else had the right to study or even read them outside of the sacred caste.\n\nThen came Gautama, the Prince of Kapilavastu.\n\nAfter learning the whole of the Brahmanical wisdom in the Rahasya or the Upanishads, and finding that the teachings differed little, if at all, from those of the \"Teachers of Life\" inhabiting the snowy ranges of the Himalaya,* the Disciple of the Brahmins, feeling indignant because the sacred wisdom was thus withheld from all but the Brahmins, determined to save the whole world by popularizing it.\n\nThen it was that the Brahmins, seeing that their sacred knowledge and Occult wisdom was falling into the hands of the \" Mlechchhas, \" abridged the texts of the Upanishads, originally containing thrice the matter of the Vedas and the Brahmanas together, without altering, however, one word of the texts.\n\nThey simply detached from the MSS .\n\nthe most important portions containing the last word of the Mystery of Being.\n\nThe key to the Brahmanical secret code remained henceforth with the initiates alone, and the Brahmins were thus in a position to publicly deny the correctness of Buddha's teaching by appealing to their Upanishads, silenced for ever on the chief questions.\n\nSuch is the esoteric tradition beyond the Himalayas.\n\nSri Sankaracharya, the greatest Initiate living in the historical ages, wrote many a Bhashya on the Upanishads.\n\nBut his original treatises, as there are reasons to suppose, have not yet fallen into the hands of the Philistines, for they are too jealously preserved in his maths (monasteries, mathams ) ."


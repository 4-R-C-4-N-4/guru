[content]
body = "And the Dragon was cast out, that old serpent, called the devil and Satan, which deceiveth the whole world.\" The Kabalistic version of the same story is given in the Codex Nazareus, the scripture of the Nazarenes, the real mystic Christians of John the Baptist and the Initiates of Christos.\n\nBahak-Zivo, the \"Father of the Genii,\" is ordered to construct creatures (to create).\n\nBut, as he is \"ignorant of Orcus,\" he fails to do so, and calls in Fetahil, a still purer spirit, to his aid, who fails still worse.\n\nThis is a repetition of the failure of the \"Fathers,\" the lords of light who fail one after the other.\n\n(Book II, Sloka 17.) We will now quote from our earlier Volumes: -- \"Then steps on the stage of creation the spirit** (of the Earth so-called, or the Soul, Psyche, which St.\n\nJames calls 'devilish') the lower portion the Anima Mundi or Astral Light.\n\n(See the close of this Sloka).\n\nWith the Nazarenes and the Gnostics this Spirit was [[Footnote(s)]] ------------------------------------------------- * Explaining Kabalistic views, the author of the \" New Aspects of Life \" says of the Fallen Angels that, \"According to the symbolical teaching, Spirit, from being simply a functionary agent of God, became volitional in its developed and developing action; and, substituting its own will for the Divine desire in its regard, so fell.\n\nHence the Kingdom and reign of Spirits and spiritual action, which flow from and are the product of Spirit-volition, are outside, and contrasted with, and in contradiction to the Kingdom of Souls and Divine action.\" So far, so good; but what does the Author mean by saying, \"When man was created, he was human in constitution, with human affections, human hopes and aspirations.\n\nFrom this state he fell -- into the brute and savage\"?\n\nThis is diametrically opposite to our Eastern teaching, and even to the Kabalistic notion so far as we understand it, and to the Bible itself.\n\nThis looks like Corporealism and Substantialism colouring positive philosophy, though it is rather hard to feel quite sure of the Author's meaning (see p.\n\n235).\n\nA FALL, however, \"from the natural into the supernatural and the animal\" -- supernatural meaning the purely spiritual in this case -- means what we suggest.\n\n** On the authority of Irenaeus, of Justin Martyr and the \"Codex\" itself, Dunlap shows that the Nazarenes regarded \"Spirit\" as a female and Evil Power in its connection with our Earth.\n\n(Dunlap: \"Sod,\" the Son of the Man, p.\n\n52).\n\n[[Vol.\n\n1, Page]] 195 THE CODEX REPEATS THE ALLEGORY.\n\nfeminine.\n\nThus the spirit of the Earth perceiving that for Fetahil,* the newest man (the latest), the splendour was 'changed,' and that for splendour existed 'decrease and damage,' she awakes Karabtanos,** 'who was frantic and without sense and judgment ,' and says to him: -- 'Arise, see, the splendour (light) of the newest man (Fetahil) has failed (to produce or create men), the decrease of this splendour is visible.\n\nRise up, come with thy MOTHER (the Spiritus) and free thee from limits by which thou art held, and those more ample than the whole world.' After which follows the union of the frantic and blind matter, guided by the insinuations of the spirit (not the Divine breath but the Astral spirit, which by its double essence is already tainted with matter); and the offer of the MOTHER being accepted, the Spiritus conceives \"Seven Figures,\" and the seven stellars (planets) which represent also the seven capital sins , the progeny of an astral soul separated from its divine source (spirit) and matter , the blind demon of concupiscence.\n\nSeeing this, Fetahil extends his hand towards the abyss of matter, and says: -- 'Let the Earth exist, just as the abode of the powers has existed.' Dipping his hand in the chaos, which he condenses, he creates our planet.***\" \"Then the Codex proceeds to tell how Bahak-Zivo was separated from the Spiritus, and the Genii or angels from the rebels.**** Then Mano***** (the greatest), who dwells with the greatest FERHO, call Kebar-Zivo (known also by the name of Nebat-Iavar bar Iufin Ifafin), Helm and Vine of the food of life,****** he being the third life, and commiserating the rebellious and foolish Genii, on account of the magnitude of their ambition, says: 'Lord of the Genii******* (AEons), see what the Genii, the [[Footnote(s)]] ------------------------------------------------- * Fetahil is identical with the host of the Pitris who \"created Man\" as only a \"shell.\" He was, with the Nazarenes, the king of light, and the creator; but in this instance he is the unlucky Prometheus, who fails to get hold of the Living Fire necessary for the formation of the divine Soul, as he is ignorant of the secret name, the ineffable or incommunicable name of the Kabalists.\n\n** The spirit of Matter and Concupiscence; \"Kamarupa\" minus \"Manas,\" Mind.\n\n*** See Franck's \" Codex Nazaraeus ,\" and Dunlap's \" Sod , the Son of the Man.\n\n\" **** Codex Nazaraeus , ii .\n\n, 233.\n\n***** This Mano of the Nazarenes strangely resembles the Hindu Manu, the Heavenly Man of the \" Rig Vedas.\n\n\" ****** \"I am the true Vine , and my father is the husbandman.\" ( John xv .\n\n, 1.) ******* With the Gnostics, Christ, as well as Michael who is identical with him in some respects, was the \"Chief of the AEons.\" [[Vol.\n\n1, Page]] 196 THE SECRET DOCTRINE.\n\nrebellious angels do, and about what they are consulting.* They say, 'Let us call for the world, and let us call the 'powers' into existence.\" The Genii are the Principes , the \"Sons of Light,\" but thou art the \" Messenger of Life.\n\n\" ** And in order to counteract the influence of the seven \"badly disposed\" principles, the progeny of Spiritus , CABAR-ZIO, the mighty Lord of Splendor, produces seven other lives (the cardinal virtues) who shine in their own form and light \"from on high\"*** and thus re-establish the balance between good and evil, light and darkness.\n\nHere one finds a repetition of the early allegorical , dual systems, as the Zoroastrian, and detects a germ of the dogmatic and dualistic religions of the future, a germ which has grown into such a luxuriant tree in ecclesiastical Christianity."


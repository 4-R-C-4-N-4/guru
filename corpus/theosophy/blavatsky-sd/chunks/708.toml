body = "2, Page]] 765 THE GOD-BEARING LAND.\n\nto the philosopher -- especially the Initiate -- Hesiod's theogony is as historical as any history can be.\n\nPlato accepts it as such, and gives out as much of its truths as his pledges permitted him.\n\nThe fact that the Atlantes claimed Uranos for their first king, and that Plato commences his story of Atlantis by the division of the great continent by Neptune, the grandson of Uranos, shows that there were continents and kings before Atlantis.\n\nFor Neptune, to whose lot that continent fell, finds on a small island only one human couple made of clay ( i.e.\n\n, the first physical human man, whose origin began with the last sub-races of the Third Root-Race).\n\nIt is their daughter Clito that the god marries, and it is his eldest son Atlas who receives for his part the mountain and the continent which was called by his name.\n\nNow all the gods of Olympus, as well as those of the Hindu Pantheon and the Rishis, were the septiform personations (1) of the noumena of the intelligent Powers of nature; (2) of Cosmic Forces; (3) of celestial bodies; (4) of gods or Dhyan Chohans; (5) of psychic and spiritual powers; (6) of divine kings on earth (or the incarnations of the gods); and (7) of terrestrial heroes or men.\n\nThe knowledge how to discern among these seven forms the one that is meant, belonged at all times to the Initiates, whose earliest predecessors had created this symbolical and allegorical system.\n\nThus while Uranos (or the host representing this celestial group) reigned and ruled over the Second Race and their (then) Continent; Kronos or Saturn governed the Lemurians; and Jupiter, Neptune* and others fought in the allegory for Atlantis, which was the whole earth in the day of the Fourth Race.\n\nPoseidonis, or the (last) island of Atlantis \"the third step of Idaspati\" (or Vishnu) in the mystic language of the secret books -- lasted till about 12,000 years ago.** The Atlantes of Diodorus were right in claiming that it was their country, the region surrounding Mount Atlas, where \"the gods were born\" -- i.e.\n\n, \"incarnated.\" But it was after their fourth incarnation that they became, for the first time, human Kings and rulers.\n\nDiodorus speaks of Uranos as the first king of Atlantis, confusing, either consciously or otherwise, the continents; but, as shown, Plato indirectly corrects the statement.\n\nThe first astronomical teacher of men was Uranos, because he is one of the seven Dhyan Chohans of that second period or Race.\n\nThus also in the second Manvantara [[Footnote(s)]] ------------------------------------------------- * Neptune or Poseidon is the Hindu Idaspati, identical with Narayana (the mover on the waters) or Vishnu, and like this Hindu god he is shown crossing the whole horizon in three steps.\n\nIdaspati means also \"the master of the waters.\" ** Bailly's assertion that the 9,000 years mentioned by the Egyptian priests do not represent \"solar years\" is groundless.\n\nBailly knew nothing of geology and its calculations; otherwise he would have spoken differently.\n\n[[Vol.\n\n2, Page]] 766 THE SECRET DOCTRINE.\n\n(that of Swarochisha), among the seven sons of the Manu, the presiding gods or Rishis of that race, we find Jyotis,* the teacher of astronomy (Jyotisha), one of the names of Brahma.\n\nAnd thus also the Chinese revere Tien (or the sky, Ouranos), and name him as their first teacher of astronomy.\n\nUranos gave birth to the Titans of the Third Race, and it is they who (personified by Saturn-Kronos) mutilated him.\n\nFor as it is the Titans who fell into generation, when \"creation by will was superseded by physical procreation,\" they needed Uranos no more.\n\nAnd here a short digression must be permitted and pardoned.\n\nIn consequence of the last scholarly production of Mr.\n\nGladstone in the Nineteenth Century, \"The Greater Gods of Olympos,\" the ideas of the general public about Greek Mythology have been still further perverted and biassed.\n\nHomer is credited with an inner thought, which is regarded by Mr.\n\nGladstone as \"the true key to the Homeric conception,\" whereas this \"key\" was merely a blind .\n\nPoseidon \"is indeed essentially of the earth earthy .\n\n.\n\n.\n\n.\n\nstrong and self-asserting, sensual and intensely jealous and vindictive,\" -- but this is because he symbolises the Spirit of the Fourth Root-Race, the ruler of the Seas, that race which lives above the surface of the seas ([[ limne ]], Il.\n\nxxiv., 79), which is composed of the giants, the children of Eurymedon, the race which is the father of Polyphemus, the Titan and one-eyed Cyclops.\n\nThough Zeus reigns over the Fourth Race, it is Poseidon who rules, and who is the true key to the triad of the Kronid Brothers and to our human races.\n\nPoseidon and Nereus are one : the former the ruler or spirit of Atlantis before the beginning of its submersion, the latter, after.\n\nNeptune is the titanic strength of the living race; Nereus, its spirit reincarnated in the subsequent Fifth or Aryan Race: and this is what the great Greek scholar of England has not yet discovered, or even dimly perceived.\n\nAnd yet he makes many observations upon the \"artfulness\" of Homer, who never names Nereus, at whose designation we arrive .\n\n.\n\n.\n\n.\n\nonly through the patronymic of the Nereids!\n\nThus the tendency of even the most erudite Hellenists is to confine their speculations to the exoteric images of mythology and to lose sight of their inner meaning: and it is remarkably illustrated in the case of the Right Hon.\n\nW.\n\nE.\n\nGladstone, as we have shown.\n\nWhile almost the most conspicuous figure of our age as a statesman, he is at the same time one of the most cultured scholars England has given birth to.\n\nGrecian literature has been the loving study of his life, and he has found time amid the bustle of public affairs to enrich contemporary literature with contributions to Greek scholarship which will make his name famous through coming generations.\n\nAt the same time, as his sincere [[Footnote(s)]] ------------------------------------------------- * See Matsya Purana, which places him among the seven Prajapatis of the period.\n\n[[Vol.\n\n2, Page]] 767 THE POWER OF NAMES.\n\nadmirer, the present writer cannot but feel a deep regret that posterity, while acknowledging his profound erudition and splendid culture, will yet, in the greater light which must then shine upon the whole question of symbolism and mythology, judge that he has failed to grasp the spirit of the religious system which he has often criticised from the dogmatic Christian standpoint."


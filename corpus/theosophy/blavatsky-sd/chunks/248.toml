body = "V., pp.\n\n329-34.\n\n[[Vol.\n\n1, Page]] 509 THE FIXING OF LIGHT.\n\nsensitive paper in a dark place, and at the end of 24 hours it will have left an impression of itself on the sensitive paper, the whites coming out as blacks.\n\n.\n\n.\n\n.\n\nThere seems to be no limit for the reproduction of engravings, etc., etc.\n\n.\n\n.\n\n.\n\n.\" What is it that remains fixed, nailed, so to say, on the paper?\n\nIt is a Force certainly, that fixed the thing, but what is that thing , the residue of which remains on the paper?\n\nOur learned men will get out of this through some scientific technicality; but what is it that is intercepted, so as to imprison a certain quantity of it on glass, paper, or wood?\n\nIs it \"Motion\" or is it \"Force\"?\n\nOr shall we be told that what remains behind is the effect only of the force or Motion?\n\nThen what is this Force?\n\nForce or energy is a quality; but every quality must belong to a something, or a somebody.\n\nIn Physics, Force is defined as \"that which changes or tends to change any physical relation between bodies, whether mechanical, thermal, chemical, electrical, magnetic, etc.\" But it is not that \"Force\" or that \"Motion\" which remains behind on the paper, when the Force or Motion has ceased to act; and yet something, which our physical senses cannot perceive, has been left there to become a cause in its turn and produce effects.\n\nWhat is it?\n\nIt is not matter, as defined by Science -- i.e.\n\n, matter in any of its known states.\n\nAn Alchemist would say it was a spiritual secretion -- and would be laughed at.\n\nBut yet, when the physicist said that Electricity, stored up, was a fluid, or that light fixed on paper is still Sunlight -- this is Science.* In the opinion of an experienced Occultist, one who has verified the whole series of Nidanas , of causes and effects that finally project their last effect on to this our plane of manifestations; one who has traced matter back to its noumenon, the explanation of the physicist is like calling anger, or its effects -- the exclamation provoked by it -- a secretion or a fluid, and man, the cause of it -- its material conductor.\n\nBut, as Grove prophetically remarked, that day is fast approaching when it will be confessed that the \"forces\" we know of are but the phenomenal manifestations of realities we know nothing about, -- but which were known to the ancients and -- by them worshipped.\n\nHe made one still more suggestive remark, however, which ought to have become the motto of Science, but has not.\n\nSir W.\n\nGrove said that \" S CIENCE SHOULD HAVE NEITHER DESIRES NOR PREJUDICES.\n\nT RUTH SHOULD BE HER SOLE AIM.\" Meanwhile, in our days, Scientists are more self-opinionated and bigoted than even the clergy.\n\nFor they minister to, if they do not actually worship, [[Footnote(s)]] ------------------------------------------------- * The newest Authorities have rejected these explanations as \"exploded theories,\" and have now deified \"Motion\" as their sole Idol.\n\nBut, surely, they and their idol will one day share the fate of their predecessors.\n\n[[Vol.\n\n1, Page]] 510 THE SECRET DOCTRINE.\n\n\"Force-Matter,\" which is their Unknown God.\n\nAnd how unknown it is may be inferred from the many confessions of the most eminent physicists and biologists, with Faraday at their head.\n\nNot only, he said, could he never presume to pronounce whether Force was a property or function of Matter, but he actually did not know what was meant by the word matter.\n\nThere was a time, he added, when he believed he knew something of matter.\n\nBut the more he lived, and the more carefully he studied it, the more he became convinced of his utter ignorance of the nature of matter.* (See Buckwell's \"Electric Science.\") The Occultists are often misunderstood because, for lack of better terms, they apply to the essence of Force under certain aspects the descriptive epithet of substance.\n\nNow the names for the varieties of \"substance\" on different planes of perception and being are legion.\n\nEastern Occultism has a special appellation for each kind; but Science -- like England, in the recollection of a witty Frenchman, blessed with thirty-six religions and only one fish-sauce -- has but one name for all, namely, \"Substance.\" Moreover, neither the orthodox physicists nor their critics seem to be very certain of their premises, and are as apt to confuse the effects as they do the causes.\n\nIt is incorrect, for instance, to say, as Stallo does, that \"matter can no more be realized or conceived as mere spacial presence than as a concretion of forces,\" or that \"force is nothing without mass, and mass is nothing without force\" -- for one is the noumenon and the other the phenomenon.\n\nAgain; Schelling, when saying that \"It is a mere delusion of the phantasy that something, we know not what, remains after we have denuded an object of all the predicates belonging to it\"** -- could never have applied the remark to the realm of transcendental metaphysics.\n\nIt is true that pure force is nothing in the world of physics; it is ALL in the domain of Spirit.\n\nSays Stallo: \"If we reduce the mass upon which a given force, however small, acts to its limit zero -- or, mathematically expressed, until it becomes infinitely small -- the consequence is that the velocity of the resulting motion is infinitely great, and that the 'thing' .\n\n.\n\n.\n\nis at any given moment neither here nor there, but everywhere -- that there is no [[Footnote(s)]] ------------------------------------------------- * This ominous confession was made, we believe, at a Scientific Congress at Swansea.\n\nFaraday held a similar opinion, however, as stated by Tyndall: \"What do we know of the atom apart from its force?\n\nYou imagine a nucleus which may be called a and surround it by forces which may be called m ; to my mind the a or nucleus vanishes and the substance consists of the powers m .\n\nAnd, indeed, what notion can we form of the nucleus independent of its powers?\n\nWhat thought remains on which to hang the imagination of an a independent of the acknowledged forces?\" ** Schelling, \"Ideen,\" etc., p.\n\n18.\n\n[[Vol.\n\n1, Page]] 511 WHAT IS FORCE?\n\nreal presence; it is impossible, therefore, to construct matter by a synthesis of forces\" (p.\n\n161).\n\nThis may be true in the phenomenal world, inasmuch as the illusive reflection of the one reality of the supersensual world may appear true to the dwarfed conceptions of a materialist.\n\nIt is absolutely incorrect when the argument is applied to things, in what the Kabalists call the supermundane spheres.\n\nInertia, so called, \"is force\" according to Newton ( Princ.\n\nDef.\n\niii.\n\n), and for the student of Esoteric Sciences the greatest of the occult forces."


[content]
body = "In Genesis (vi.) the \"Sons of God\" -- B ' ne Aleim -- become enamoured of the daughters of men, marry, and reveal to their wives the mysteries unlawfully learnt by them in heaven, according to Enoch; and this is the \"Fall of Angels.\"* But what is, in reality, the \"Book of Enoch\" itself, from which the author of Revelation and even the St.\n\nJohn of the Fourth Gospel have so profusely quoted?\n\n( e.g.\n\n, verse 8, in chapter 10, about all who have come before Jesus, being \"thieves and robbers.\") Simply a Book of Initiation, giving out in allegory and cautious phraseology the programme of certain archaic mysteries performed in the inner temples.\n\nThe author of the \"Sacred Mysteries among the Mayas and Quiches\" very justly suggests that the so-called \"Visions\" of Enoch relate to his (Enoch's) experience at initiation, and what he learned in the mysteries; while he very erroneously states his opinion that Enoch had learned them before being converted [[Footnote(s)]] ------------------------------------------------- * In general, the so-called orthodox Christian conceptions about the \"fallen\" angels or Satan, are as remarkable as they are absurd.\n\nAbout a dozen could be cited, of the most various character as to details, and all from the pen of educated lay authors, \"University graduates\" of the present quarter of our century.\n\nThus, the author of \"Earth's Earliest Ages,\" J.\n\nH.\n\nPember, M.A ., devotes a thick volume to proving Theosophists, Spiritualists, Metaphysicians, Agnostics, Mystics, poets, and every contemporary author on oriental speculations, to be the devoted servants of the \"Prince of the Air,\" and irretrievably damned.\n\nHe describes Satan and his Antichrist in this wise: -- \"Satan is the 'Anointed Cherub' of old.\n\n.\n\n.\n\n.\n\nGod created Satan, the fairest and wisest of all his creatures in this part of His Universe, and made him Prince of the World, and of the Power of the Air.\n\n.\n\n.\n\n.\n\nHe was placed in an Eden, which was both far anterior to the Eden of Genesis.\n\n.\n\n.\n\n.\n\nand of an altogether different and more substantial character, resembling the New Jerusalem.\n\nThus, Satan being perfect in wisdom, and beauty, His vast empire is our earth, if not the whole solar system.\n\n.\n\n.\n\n.\n\nCertainly no other angelic power of greater or even equal dignity has been revealed to us.\n\nThe Archangel Michael himself is quoted by Jude as preserving towards the Prince of Darkness the respect due to a superior, however wicked he may be, until God has formally commanded his deposition.\" Then we are informed that \"Satan was from the moment of his creation surrounded by the insignia of royalty \" (!\n\n!): that he \"awoke to consciousness to find the air filled with the rejoicing music of those whom God had appointed .\n\n.\n\n.\n\n.\" Then the Devil \" passes from the royalty to his priestly dignity \" (!\n\n!\n\n!) \"Satan was also a priest of the Most High, \" etc., etc.\n\nAnd now -- \"Antichrist will be Satan incarnate\" (pp.\n\n56-59).\n\nThe Pioneers of the coming Apollyon have already appeared -- they are the Theosophists, the Occultists, the authors of the \"Perfect Way,\" of \"Isis Unveiled,\" of the \"Mystery of the Ages,\" and even of the \" L ight of A sia\"!\n\n!\n\nThe author notes the \" avowed origin \" (of Theosophy) from the \" descending angels, \" from the \"Nephilim,\" or the angels of the VI th ch.\n\nof Genesis, and the Giants.\n\nHe ought to note his own descent from them also, as the present Secret Doctrine endeavours to show -- unless he refuses to belong to the present humanity.\n\n[[Vol.\n\n2, Page]] 230 THE SECRET DOCTRINE.\n\nto Christianity (!!); furthermore, he believes that this book was written \"at the beginning of the Christian era, when .\n\n.\n\n.\n\nthe customs and religion of the Egyptians fell into decadency\"!\n\nThis is hardly possible, since Jude quotes in his epistle from the \"Book of Enoch\" (verse 14); and, therefore, as Archbishop Laurence, the translator of the Book of Enoch from the Ethiopic version, remarks, it \"could not have been the production of a writer who lived after .\n\n.\n\n.\n\nor was even coeval with\" the writers of the New Testament: unless, indeed, Jude and the Gospels, and all that follows, was also a production of the already established Church -- which, some critics say, is not impossible.\n\nBut we are now concerned with the \"fallen Angels\" of Enoch, rather than with Enoch himself.\n\nIn Indian exotericism, these angels ( Asuras ) are also denounced as \"the enemies of the gods;\" those who oppose sacrificial worship offered to the latter.\n\nIn Christian theology they are broadly referred to as the \"Fallen Spirits,\" the heroes of various conflicting and contradictory legends about them, gathered from Pagan sources.\n\nThe coluber tortuosus \"the tortuous snake,\" a qualification said to have originated with the Jews, had quite another meaning before the Roman Church distorted it: -- among others, a purely astronomical meaning.\n\nThe \"Serpent\" fallen from on high, \" deorsum fluens, \" was credited with the possession of the Keys of the Empire of the Dead, [[ tou thanatus arche ]] to that day, when Jesus saw it \"falling like lightning from heaven\" ( Luke x.\n\n17, 18), the Roman Catholic interpretation of cadebat ut fulgur to the contrary, notwithstanding; and it means indeed that even \"the devils are subject\" to the Logos -- who is W ISDOM, but who, as the opponent of ignorance, is Satan or Lucifer at the same time.\n\nThis remark refers to divine Wisdom falling like lightning on, and quickening the intellects of those who fight the devils of ignorance and superstition.\n\nUp to the time when Wisdom, in the shape of the incarnating Spirits of M AHAT, descended from on high to animate and call the Third Race to real conscious life, humanity -- if it can be so called in its animal, senseless state --was of course doomed to - - moral as well as to physical death.\n\nThe Angels fallen into generation are referred to metaphorically as Serpents and Dragons of Wisdom.\n\nOn the other hand, regarded in the light of the L OGOS, the Christian Saviour, like Krishna, whether as man or logos, may be said to have saved those who believed in the secret teachings from \"eternal death,\" to have conquered the Kingdom of Darkness, or Hell, as every Initiate does."


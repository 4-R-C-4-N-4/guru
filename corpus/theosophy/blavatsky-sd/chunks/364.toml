[content]
body = "Laing's assurances that*** \"in (chronological) calculations of this sort, concerning older and later formations, there is no theory, and they are based on positive facts, limited only by a certain possible (?) amount of error either way,\" occultism will prove, scientific confessions in hand, that geology is very much in error, and very often even more so than Astronomy.\n\nIn this very passage by Mr.\n\nLaing, which gives to Geology pre-eminence for correctness over Astronomy, we find a passage in flagrant contradiction to the admissions of the best Geologists themselves.\n\nSays the author -- \"In short, the conclusions of Geology, at any rate up to the Silurian period,**** when the present order of things was fairly inaugurated, are approximate (truly so) facts and not theories, while the astronomical conclusions are theories based on data so uncertain, that while in some [[Footnote(s)]] ------------------------------------------------- * See article \" Geology, \" in \" Encyclopaedia Britannica.\n\n\" ** This allows a chance even to the Biblical \"Adam Chronology\" of 6,000 years.\n\n( Ibid.\n\n) *** See his \" Modern Science and Modern Thought.\n\n\" **** To the Silurian period as regards Molluscs and Animal life -- granted; but what do they know of man?\n\n[[Vol.\n\n2, Page]] 72 THE SECRET DOCTRINE.\n\ncases they give results incredibly short .\n\n.\n\n.\n\nin others they give results almost incredibly long.\" After which, the reader is advised that the safest course \"seems to be to assume that Geology really proves the duration of the present order of things to have been somewhere over 100 millions of years,\" as \"Astronomy gives an enormous though unknown time in the past, and to come in the future, for the birth, growth, maturity, decline, and death of the Solar System, of which our Earth is a small planet now passing through the habitable phase.\" (p.\n\n49.) Judging from past experience, we do not entertain the slightest doubt that, once called upon to answer \"the absurd unscientific and preposterous claims of exoteric (and esoteric) Aryan chronology,\" the scientist of \"the results incredibly short,\" i.e.\n\n, only 15,000,000 years, and the scientist, who \"would require 600,000,000 years,\" together with those who accept Mr.\n\nHuxley's figures of 1,000,000,000 \"since sedimentation began in Europe\" ( World Life ) , would all be as dogmatic one as the other.\n\nNor would they fail to remind the Occultist and the Brahmin, that it is the modern men of science alone who represent exact science, whose duty it is to fight inaccuracy and superstition.\n\nThe earth is passing through the \"habitable phase\" only for the present order of things, and as far as our present mankind is concerned with its actual \"coats of skin\" and phosphorus for bones and brain.\n\nWe are ready to concede the 100 millions of years offered by Geology, since we are taught that our present physical mankind -- or the Vaivasvata humanity -- began only 18 millions of years ago.\n\nBut Geology has no facts to give us for the duration of geological periods, as we have shown, no more indeed than has Astronomy.\n\nThe authentic letter from Mr.\n\nW.\n\nPengelly, F.R.S ., quoted elsewhere, says that: \"It is at present, and perhaps always will be, IMPOSSIBLE to reduce, even approximately, geological time into years or even into millenniums.\" And having never, hitherto, excavated a fossil man of any other than the present form -- what does Geology know of him?\n\nIt has traced zones or strata and, with these, primordial zoological life, down to the Silurian.\n\nWhen it has, in the same way, traced man down to his primordial protoplasmic form, then we will admit that it may know something of primordial man.\n\nIf it is not very material \"to the bearings of modern scientific discovery on modern thought,\" whether \"man has existed in state of constant though slow progression for the last 50,000 years of period of 15 millions, or for the last 500,000 years of a period of 150 millions\" (\"Modern Science, etc.\" p.\n\n49), as Mr.\n\nS.\n\nLaing tells his readers, it is very much so for the claims of the Occultists.\n\nUnless the latter show that it is a possibility, if not a perfect certainty, that man [[Vol.\n\n2, Page]] 73 COSMOGONY, AN INTELLIGENT PLAN.\n\nlived 18 millions of years ago, the Secret Doctrine might as well have remained unwritten.\n\nAn attempt must, therefore, be made in this direction, and it is our modern geologists and men of science generally who will be brought to testify to this fact in the third part of this volume.\n\nMeanwhile, and notwithstanding the fact that Hindu Chronology is constantly represented by the Orientalists as a fiction based on no \" actual computation,\"* but simply a \"childish boasting,\" it is nevertbeless often twisted out of recognition to make it yield to, and fit in with, Western theories.\n\nNo figures have ever been more meddled with and tortured than the famous 4, 3, 2, followed by cyphers of the Yugas and Maha-Yugas.\n\nAs the whole cycle of prehistoric events, such as the evolution and transformation of Races and the extreme antiquity of man, hangs upon the said Chronology, it becomes extremely important to check it by other existing calculations.\n\nIf the Eastern Chronology is rejected, we shall at least have the consolation of proving that no other -- whether the figures of Science or of the Churches -- is one whit more reliable.\n\nAs Professor Max Muller expresses it, it is often as useful to prove what a thing is not as to show what it may be.\n\nAnd once we succeed in pointing out the fallacies of both Christian and scientific computations -- by allowing them a fair chance of comparison with our Chronology -- neither of the two will have a reasonable ground to stand upon, in pronouncing the esoteric figures less reliable than its own.\n\nWe may here refer the reader to our earlier work \" Isis Unveiled, \" Vol.\n\nI., p.\n\n32, for some remarks concerning the figures which were cited a few pages back.\n\nTo-day a few more facts may be added to the information there given, which is already known to every Orientalist.\n\nThe sacredness of the cycle of 4320, with additional cyphers, lies in the fact that the figures which compose it, taken separately or joined in various combinations, are each and all symbolical of the greatest mysteries in Nature.\n\nIndeed, whether one takes the 4 separately, or the 3 by itself, or the two together making 7, or again the three added together and yielding 9, all these numbers have their application in the most sacred and occult things, and record the workings of Nature in her eternally periodical phenomena."


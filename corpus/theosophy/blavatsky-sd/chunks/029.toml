body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n1 [[Vol.\n\n1, Page]] 35 STANZA I.\n\nCOMMENTARIES ON THE SEVEN STANZAS AND THEIR TERMS, ACCORDING TO THEIR NUMERATION, IN STANZAS AND SLOKAS.\n\nSTANZA I.\n\n1.\n\n\" T HE E TERNAL P ARENT (Space), WRAPPED IN HER EVER INVISIBLE ROBES, HAD SLUMBERED ONCE AGAIN FOR SEVEN ETERNITIES ( a ).\" The \"Parent Space\" is the eternal, ever present cause of all -- the incomprehensible DEITY, whose \"invisible robes\" are the mystic root of all matter, and of the Universe.\n\nSpace is the one eternal thing that we can most easily imagine, immovable in its abstraction and uninfluenced by either the presence or absence in it of an objective Universe.\n\nIt is without dimension, in every sense, and self-existent.\n\nSpirit is the first differentiation from T HAT, the causeless cause of both Spirit and Matter.\n\nIt is, as taught in the esoteric catechism, neither limitless void, nor conditioned fulness, but both.\n\nIt was and ever will be.\n\n(See Proem pp.\n\n2 et seq.\n\n) Thus, the \"Robes\" stand for the noumenon of undifferentiated Cosmic Matter.\n\nIt is not matter as we know it, but the spiritual essence of matter, and is co-eternal and even one with Space in its abstract sense.\n\nRoot-nature is also the source of the subtile invisible properties in visible matter.\n\nIt is the Soul, so to say, of the ONE infinite Spirit.\n\nThe Hindus call it Mulaprakriti, and say that it is the primordial substance, which is the basis of the Upadhi or vehicle of every phenomenon, whether physical, mental or psychic.\n\nIt is the source from which Akasa radiates.\n\n( a ) By the Seven \"Eternities,\" aeons or periods are meant.\n\nThe word \"Eternity,\" as understood in Christian theology, has no meaning to the Asiatic ear, except in its application to the ONE existence; nor is [[Vol.\n\n1, Page]] 36 THE SECRET DOCTRINE.\n\nthe term sempiternity, the eternal only in futurity, anything better than a misnomer.* Such words do not and cannot exist in philosophical metaphysics, and were unknown till the advent of ecclesiastical Christianity.\n\nThe Seven Eternities meant are the seven periods, or a period answering in its duration to the seven periods, of a Manvantara, and extending throughout a Maha-Kalpa or the \"Great Age\" -- 100 years of Brahma -- making a total of 311,040,000,000,000 of years; each year of Brahma being composed of 360 \"days,\" and of the same number of \"nights\" of Brahma (reckoning by the Chandrayana or lunar year); and a \"Day of Brahma\" consisting of 4,320,000,000 of mortal years.\n\nThese \"Eternities\" belong to the most secret calculations, in which, in order to arrive at the true total, every figure must be 7 x (7 to the power of x ); x varying according to the nature of the cycle in the subjective or real world; and every figure or number relating to, or representing all the different cycles from the greatest to the smallest -- in the objective or unreal world -- must necessarily be multiples of seven.\n\nThe key to this cannot be given, for herein lies the mystery of esoteric calculations, and for the purposes of ordinary calculation it has no sense.\n\n\"The number seven,\" says the Kabala, \"is the great number of the Divine Mysteries;\" number ten is that of all human knowledge (Pythagorean decade); 1,000 is the number ten to the third power, and therefore the number 7,000 is also symbolical.\n\nIn the Secret Doctrine the figure and number 4 are the male symbol only on the highest plane of abstraction; on the plane of matter the 3 is the masculine and the 4 the female: the upright and the horizontal in the fourth stage of symbolism, when the symbols became the glyphs of the generative powers on the physical plane.\n\n------- STANZA I.\n\n-- Continued .\n\n2.\n\nT IME WAS NOT, FOR IT LAY ASLEEP IN THE INFINITE BOSOM OF DURATION ( a ).\n\n[[Footnote(s)]] ------------------------------------------------- * It is stated in Book II., ch.\n\nviii., of Vishnu Purana: \"By immortality is meant existence to the end of the Kalpa;\" and Wilson, the translator, remarks in a footnote: \"This, according to the Vedas, is all that is to be understood of the immortality (or eternity) of the gods; they perish at the end of universal dissolution (or Pralaya).\" And Esoteric philosophy says: They \"perish\" not, but are re-absorbed.\n\n[[Vol.\n\n1, Page]] 37 TIME AND UNIVERSAL MIND.\n\n( a ) Time is only an illusion produced by the succession of our states of consciousness as we travel through eternal duration, and it does not exist where no consciousness exists in which the illusion can be produced; but \"lies asleep.\" The present is only a mathematical line which divides that part of eternal duration which we call the future, from that part which we call the past.\n\nNothing on earth has real duration, for nothing remains without change -- or the same -- for the billionth part of a second; and the sensation we have of the actuality of the division of \"time\" known as the present, comes from the blurring of that momentary glimpse, or succession of glimpses, of things that our senses give us, as those things pass from the region of ideals which we call the future, to the region of memories that we name the past.\n\nIn the same way we experience a sensation of duration in the case of the instantaneous electric spark, by reason of the blurred and continuing impression on the retina.\n\nThe real person or thing does not consist solely of what is seen at any particular moment, but is composed of the sum of all its various and changing conditions from its appearance in the material form to its disappearance from the earth.\n\nIt is these \"sum-totals\" that exist from eternity in the \"future,\" and pass by degrees through matter, to exist for eternity in the \"past.\" No one could say that a bar of metal dropped into the sea came into existence as it left the air, and ceased to exist as it entered the water, and that the bar itself consisted only of that cross-section thereof which at any given moment coincided with the mathematical plane that separates, and, at the same time, joins, the atmosphere and the ocean."


body = "unable either to measure the first abstraction yielded to you by the Deity, or to get hold of it, you still hope to subject to your measurements the mystery of the Secret Sciences which emanate from that Deity?\n\n.\n\n.\n\n.\n\n.\n\nAnd what would you feel, were I to plunge you into the abysses of M OTION, the Force which organizes the Number?\n\nWhat would you think, were I to add that Motion and Number* are begotten by the WORD, the Supreme Reason of the Seers and Prophets, who, in days of old, sensed the mighty Breath of God, a witness to which is the Apocalypse?\" ( b ) \"The radiant essence curdled and spread throughout the depths\" of Space.\n\nFrom an astronomical point of view this is easy of explanation: it is the \"milky way,\" the world-stuff, or primordial matter in its first form.\n\nIt is more difficult, however, to explain it in a few words or even lines, from the standpoint of Occult Science and Symbolism, as it is the most complicated of glyphs.\n\nHerein are enshrined more than a dozen symbols.\n\nTo begin with, the whole pantheon of mysterious objects,** every one of them having some definite Occult meaning, extracted from the allegorical \"churning of the ocean\" by the Hindu gods.\n\nBesides Amrita , the water of life or immortality, \" Surabhi \" the \"cow of plenty,\" called \"the fountain of milk and curds,\" was extracted from this \"Sea of Milk.\" Hence the universal adoration of the cow and bull, one the productive, the other the generative power in Nature: symbols connected with both the Solar and the Cosmic deities.\n\nThe specific properties, for occult purposes, of the \"fourteen precious things,\" being explained only at the fourth Initiation, cannot be given here; but the following may be remarked.\n\nIn the \"Satapatha Brahmana\" it is stated that the churning of the \"Ocean of Milk\" took place in the Satya Yug, the first age which immediately followed the \"Deluge.\" As, however, neither the Rig-Veda nor [[Footnote(s)]] ------------------------------------------------- * Number, truly; but never M OTION.\n\nIt is Motion which begets the Logos, the Word, in occultism.\n\n** The \"Fourteen precious things.\" The narrative or allegory is found in the Satapatha Brahmana and others.\n\nThe Japanese Secret Science of the Buddhist Mystics, the Yamabooshi , has \"seven precious things.\" We will speak of them, hereafter.\n\n[[Vol.\n\n1, Page]] 68 THE SECRET DOCTRINE.\n\nManu -- both preceding Vaivasvata's \"deluge,\" that of the bulk of the Fourth Race -- mention this deluge, it is evident that it is not the \"great\" deluge, nor that which carried away Atlantis, nor even the deluge of Noah, which is meant here.\n\nThis \"churning\" relates to a period before the earth's formation, and is in direct connection with that other universal legend, the various and contradictory versions of which culminated in the Christian dogma of the \"War in Heaven,\" and the fall of the Angels (see Book II., also Revelations chap.\n\nxii.).\n\nThe Brahmanas, reproached by the Orientalists with their versions on the same subjects, often clashing with each other, are pre-eminently occult works , hence used purposely as blinds.\n\nThey were allowed to survive for public use and property only because they were and are absolutely unintelligible to the masses.\n\nOtherwise they would have disappeared from circulation as long ago as the days of Akbar.\n\n------- STANZA III.\n\n-- Continued.\n\n5.\n\nT HE ROOT REMAINS, THE LIGHT REMAINS, THE CURDS REMAIN, AND STILL O EAOHOO ( a ) IS ONE ( b ) .\n\n( a ) O EAOHOO is rendered \"Father-Mother of the Gods\" in the Commentaries, or the SIX IN ONE, or the septenary root from which all proceeds .\n\nAll depends upon the accent given to these seven vowels, which may be pronounced as one , three, or even seven syllables by adding an e after the letter \"o.\" This mystic name is given out, because without a thorough mastery of the triple pronunciation it remains for ever ineffectual.\n\n( b ) This refers to the Non-Separateness of all that lives and has its being, whether in active or passive state.\n\nIn one sense, Oeaohoo is the \"Rootless Root of All\"; hence, one with Parabrahmam; in another sense it is a name for the manifested ONE LIFE, the Eternal living Unity.\n\nThe \"Root\" means, as already explained, pure knowledge (Sattva),* [[Footnote(s)]] ------------------------------------------------- * The original for Understanding is Sattva , which Sankara (acharya) renders anta h karana.\n\n\"Refined,\" he says, \"by sacrifices and other sanctifying operations.\" In the Katha, at p.\n\n148, Sattva is said by Sankara to mean buddhi -- a common use of the word.\n\n(\"The B HAGAVATGITA with The Sanatsugatiya and The Anugita,\" trans- [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 69 THE BLOSSOM OF THE ROOT OF LIFE.\n\neternal ( Nitya ) unconditioned reality or SAT ( Satya ) , whether we call it Parabrahmam or Mulaprakriti, for these are the two aspects of the ONE.\n\nThe \"Light\" is the same Omnipresent Spiritual Ray, which has entered and now fecundated the Divine Egg, and calls cosmic matter to begin its long series of differentiations.\n\nThe curds are the first differentiation, and probably refer also to that cosmic matter which is supposed to be the origin of the \"Milky Way\" -- the matter we know.\n\nThis \"matter,\" which, according to the revelation received from the primeval Dhyani-Buddhas, is, during the periodical sleep of the Universe, of the ultimate tenuity conceivable to the eye of the perfect Bodhisatva -- this matter, radical and cool, becomes, at the first reawakening of cosmic motion, scattered through Space; appearing, when seen from the Earth, in clusters and lumps, like curds in thin milk.\n\nThese are the seeds of the future worlds, the \"Star-stuff.\" ------- STANZA III.\n\n-- Continued.\n\n6.\n\nT HE ROOT OF LIFE WAS IN EVERY DROP OF THE OCEAN OF IMMORTALITY ( Amrita ) * AND THE OCEAN WAS RADIANT LIGHT, WHICH WAS FIRE AND HEAT AND MOTION.\n\nD ARKNESS VANISHED AND WAS NO MORE.** I T DISAPPEARED IN ITS OWN ESSENCE, THE BODY OF FIRE AND WATER, OF FATHER AND MOTHER ( a ).\n\n( a ) The essence of darkness being absolute light, Darkness is taken as the appropriate allegorical representation of the condition of the Universe during Pralaya, or the term of absolute rest, or non-being, as it appears to our finite minds."


body = "183); the Arabs anciently divided the year into six seasons, each composed of two months; in the Chinese astronomical work called Kioo-tche, it is said that two moons make a measure of time, and six measures a year; and to this day the aborigines of Kamschatka have their years of six months, as they had when visited by Abbe Chappe (Voyage to Siberia, Vol.\n\nIII., p.\n\n19).\n\nBut is all this a reason to say that when the Hindu Puranas say \"a solar year \" they mean one solar day!\n\nIt is the knowledge of the natural laws that make of seven the root nature-number, so to say, in the manifested world -- at any rate in our present terrestrial life-cycle -- and the wonderful comprehension of its workings, that unveiled to the ancients so many of the mysteries of nature.\n\nIt is these laws, again, and their processes on the sidereal, terrestrial, and moral planes, which enabled the old astronomers to calculate correctly the duration of the cycles and their respective effects on the march of events; to record beforehand (prophecy, it is called) the influence which they will have on the course and development of the human races.\n\nThe Sun, Moon, and planets being the never-erring time measurers, whose potency and periodicity were well known, became thus the great Ruler and rulers of our little system in all its seven domains, or \"spheres of action.\"* This has been so evident and remarkable, that even many of the modern men of Science, Materialists as well as Mystics, had their attention called to this law.\n\nPhysicians and theologians, mathematicians and psychologists have drawn the attention of the world repeatedly to this fact of periodicity in the behaviour of \"Nature.\" These numbers are explained in the \"Commentaries\" in these words.\n\nT HE C IRCLE IS NOT THE \" O NE\" BUT THE ALL .\n\nI N THE HIGHER [ heaven ] THE IMPENETRABLE R AJAH [\" ad Mutant, \" see Atharva-Veda X., 105], IT [ the Circle ] BECOMES O NE, BECAUSE [ it is ] THE INDIVISIBLE, AND THERE CAN BE NO T AU IN IT.\n\nI N THE SECOND [ of the three \" Rajamsi \" ( tritiye ) , or the three \" Worlds \"] THE ONE BECOMES TWO [ male and female ] ; AND THREE [ add the Son or logos ] ; AND THE S ACRED F OUR [\" tetractis, \" or the \" Tetragrammaton.\n\n\"] I N THE THIRD [ the lower world or our earth ] THE NUMBER BECOMES FOUR, AND THREE, AND TWO.\n\nT AKE THE FIRST TWO, AND THOU WILT [[Footnote(s)]] ------------------------------------------------- * The spheres of action of the combined Forces of Evolution and Karma are (1) the Super-spiritual or noumenal; ( 2 ) the Spiritual; (3) the Psychic; (4) the Astro-ethereal; (5) the Sub-astral; (6) the Vital; and (7) the purely physical spheres.\n\n[[Vol.\n\n2, Page]] 622 THE SECRET DOCTRINE.\n\nOBTAIN S EVEN, THE SACRED NUMBER OF LIFE; BLEND [ the latter ] WITH THE MIDDLE R AJAH, AND THOU WILT HAVE N INE, THE SACRED NUMBER OF BEING AND BECOMING .\"* When the Western Orientalists have mastered the real meaning of the Rig Vedic divisions of the World -- the two-fold, three-fold, six and seven-fold, and especially the nine-fold division, the mystery of the cyclic divisions applied to heaven and earth, gods and men, will become clearer to them than it is now.\n\nFor -- \" T HERE IS A HARMONY OF NUMBERS IN ALL NATURE; in the force of gravity, in the planetary movements, in the laws of heat, light, electricity, and chemical affinity, in the forms of animals and plants, in the perception of the mind.\n\nThe direction, indeed, of modern natural and physical science, is towards a generalization which shall express the fundamental laws of all, by one simple numerical ratio.\n\nWe would refer to Professor Whewell's 'Philosophy of the Inductive Sciences,' and to Mr.\n\nHay's researches into the laws of harmonious colouring and form.\n\nFrom these it appears that the number seven is distinguished in the laws regulating the harmonious Perception of forms, colours, and sounds , and probably of taste also, if we could analyse our sensations of this kind with mathematical accuracy.\" (\"Medical Review,\" July, 1844).\n\nSo much so, indeed, that more than one physician has stood aghast at the periodical septenary return of the cycles in the rise and fall of various complaints, and naturalists have felt themselves at an utter loss to explain this law.\n\n\"The birth, growth, maturity, vital functions .\n\n.\n\n.\n\n.\n\nchange, diseases, decay and death, of insects, reptiles, fishes, birds, mammals, and even of man, are more or less controlled by a law of completion in weeks, \" or seven days.** Dr.\n\nLaycock ( Lancet, 1842-3), writing on the Periodicity of Vital Phenomena, records a \"most remarkable illustration and confirmation of the law in insects.\"*** [[Footnote(s)]] ------------------------------------------------- * In Hinduism, as understood by the Orientalists from the Atharvaveda, the three rajamsi refer to the three strides of Vishnu; his ascending higher step, being taken in the highest world (A.\n\nV., VII ., 99, 1, cf.\n\nI 155 , 5) .\n\nIt is the divo rajah, or the \"sky,\" as they take it.\n\nBut it is something besides this in Occultism.\n\nThe sentence pareshu, guhyeshu, vrateshu, cf.\n\nI, 155, 3, and IX.\n\n, 75, 2; or again, verse X., 114, in Atharvaveda -- has yet to be explained.\n\n** H.\n\nGrattan Guinness, F.R.G.S ., in his \"Approaching End of the Age.\" *** Having given a number of illustrations from natural history, the doctor adds: \"The facts I have briefly glanced at are general facts, and cannot happen day after day in so many millions of animals of every kind, FROM THE L ARVA OR O VUM OF A M INUTE I NSECT UP TO M AN, at definite periods, from a mere chance or coincidence .\n\n.\n\n.\n\nI think it impossible to come to any less general conclusion than this, that in animals, changes occur every three and a half, seven, fourteen, twenty-one, or twenty-eight days, or at some definite number of weeks \" or septenary cycles.\n\nAgain, the same Dr.\n\nLaycock states that: -- \"Whatever type the fever may exhibit, there will be a paroxysm on the seventh day .\n\n.\n\n.\n\nthe fourteenth will be remarkable as a day of amendment .\n\n.\n\n.\n\n\" (either cure or death taking place)."


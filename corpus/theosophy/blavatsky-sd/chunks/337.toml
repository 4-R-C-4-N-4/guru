body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n2 [[Vol.\n\n2, Page 13]] BOOK II.\n\n-- PART I.\n\nANTHROPOGENESIS.\n\n--------------------- STANZAS TRANSLATED WITH COMMENTARIES FROM THE SECRET BOOK OF DZYAN.\n\n[[Vol.\n\n2, Page 14]] In primeval times, a maiden, Beauteous Daughter of the Ether, Passed for ages her existence In the great expanse of Heaven, .\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\nSeven hundred years she wandered, Seven hundred years she laboured, Ere her first-born was delivered.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\nEre a beauteous duck descending, Hastens toward the water-mother.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\nLightly on the knee she settles, Finds a nesting-place befitting, Where to lay her eggs in safety, Lays her eggs within, at pleasure, Six, the golden eggs she lays them, Then a Seventh, an egg of iron .\n\n.\n\n.\n\n.\n\n.\" ( Kalevala, Rune I.) [[Vol.\n\n2, Page]] 15 STANZAS FROM THE BOOK OF DZYAN.\n\nANTHROPOGENESIS IN THE SECRET VOLUME.\n\n(VERBATIM EXTRACTS.*) I.\n\n1.\n\nT HE L HA WHICH TURNS THE FOURTH IS SUBSERVIENT TO THE L HA OF THE S EVEN, THEY WHO REVOLVE DRIVING THEIR CHARIOTS AROUND THEIR L ORD, THE O NE E YE.\n\nH IS BREATH GAVE LIFE TO THE S EVEN; IT GAVE LIFE TO THE FIRST.\n\n2.\n\nS AID THE E ARTH: -- \" L ORD OF THE S HINING F ACE; MY HOUSE IS EMPTY .\n\n.\n\n.\n\n.\n\nSEND THY SONS TO PEOPLE THIS WHEEL.\n\nT HOU HAST SENT THY SEVEN SONS TO THE L ORD OF W ISDOM.\n\nS EVEN TIMES DOTH HE SEE THEE NEARER TO HIMSELF, SEVEN TIMES MORE DOTH HE FEEL THEE.\n\nT HOU HAST FORBIDDEN THY SERVANTS, THE SMALL RINGS, TO CATCH THY LIGHT AND HEAT, THY GREAT BOUNTY TO INTERCEPT ON ITS PASSAGE.\n\nS END NOW TO THY SERVANT THE SAME.\" 3.\n\nS AID THE \" L ORD OF THE S HINING F ACE\": -- \" I SHALL SEND THEE A FIRE WHEN THY WORK IS COMMENCED.\n\nR AISE THY VOICE TO OTHER L OKAS; APPLY TO THY FATHER, THE L ORD OF THE L OTUS, FOR HIS SONS .\n\n.\n\n.\n\n.\n\nTHY PEOPLE SHALL BE UNDER THE RULE OF THE F ATHERS.\n\nT HY MEN SHALL BE MORTALS.\n\nT HE MEN OF THE L ORD OF W ISDOM, NOT THE L UNAR S ONS, ARE IMMORTAL.\n\nC EASE THY COMPLAINTS.\n\nT HY SEVEN SKINS ARE YET ON THEE .\n\n.\n\n.\n\n.\n\nTHOU ART NOT READY.\n\nT HY MEN ARE NOT READY.\" 4.\n\nA FTER GREAT THROES SHE CAST OFF HER OLD THREE AND PUT ON HER NEW SEVEN SKINS, AND STOOD IN HER FIRST ONE.\n\n------- II.\n\n5.\n\nT HE WHEEL WHIRLED FOR THIRTY CRORES MORE.\n\nI T CONSTRUCTED RUPAS: SOFT STONES THAT HARDENED; HARD PLANTS THAT SOFTENED.\n\nV ISIBLE FROM INVISIBLE, INSECTS AND SMALL LIVES.\n\nS HE SHOOK THEM OFF HER BACK WHENEVER THEY OVERRAN THE MOTHER.\n\n[[Footnote(s) -------------------------------------------------]] * Only forty-nine Slokas out of several hundred are here given.\n\nNot every verse is translated verbatim.\n\nA periphrasis is sometimes used for the sake of clearness and intelligibility, where a literal translation would be quite unintelligible.\n\n[[Vol.\n\n2, Page]] 16 THE SECRET DOCTRINE.\n\n.\n\n.\n\n.\n\n.\n\nA FTER THIRTY CRORES SHE TURNED ROUND.\n\nS HE LAY ON HER BACK; ON HER SIDE .\n\n.\n\n.\n\nS HE WOULD CALL NO SONS OF H EAVEN, SHE WOULD ASK NO SONS OF W ISDOM.\n\nS HE CREATED FROM HER OWN BOSOM.\n\nS HE EVOLVED WATER-MEN, TERRIBLE AND BAD.\n\n6.\n\nT HE WATER-MEN TERRIBLE AND BAD SHE HERSELF CREATED FROM THE REMAINS OF OTHERS, FROM THE DROSS AND SLIME OF HER FIRST, SECOND, AND THIRD, SHE FORMED THEM.\n\nT HE D HYANI CAME AND LOOKED -- T HE D HYANI FROM THE BRIGHT F ATHER-MOTHER, FROM THE WHITE REGIONS THEY CAME, FROM THE ABODES OF THE IMMORTAL MORTALS.\n\n7.\n\nD ISPLEASED THEY WERE.\n\nO UR FLESH IS NOT THERE.\n\nN O FIT RUPAS FOR OUR BROTHERS OF THE FIFTH.\n\nN O DWELLINGS FOR THE LIVES.\n\nP URE WATERS, NOT TURBID, THEY MUST DRINK.\n\nL ET US DRY THEM.\n\n8.\n\nT HE FLAMES CAME.\n\nT HE FIRES WITH THE SPARKS; THE NIGHT FIRES AND THE DAY FIRES.\n\nT HEY DRIED OUT THE TURBID DARK WATERS.\n\nW ITH THEIR HEAT THEY QUENCHED THEM.\n\nT HE L HAS OF THE H IGH, THE L HAMAYIN OF BELOW, CAME.\n\nT HEY SLEW THE FORMS WHICH WERE TWO- AND FOUR-FACED.\n\nT HEY FOUGHT THE GOAT-MEN, AND THE DOG-HEADED MEN, AND THE MEN WITH FISHES' BODIES.\n\n9.\n\nM OTHER-WATER, THE GREAT SEA, WEPT.\n\nS HE AROSE, SHE DISAPPEARED IN THE MOON WHICH HAD LIFTED HER, WHICH HAD GIVEN HER BIRTH.\n\n10.\n\nW HEN THEY WERE DESTROYED, M OTHER-EARTH REMAINED BARE.\n\nS HE ASKED TO BE DRIED.\n\n------- III.\n\n11.\n\nT HE L ORD OF THE L ORDS CAME.\n\nF ROM HER BODY HE SEPARATED THE WATERS, AND THAT WAS H EAVEN ABOVE, THE FIRST H EAVEN.\n\n12.\n\nT HE GREAT C HOHANS CALLED THE L ORDS OF THE M OON, OF THE AIRY BODIES.\n\n\" B RING FORTH MEN, MEN OF YOUR NATURE.\n\nG IVE THEM THEIR FORMS WITHIN.\n\nS HE WILL BUILD COVERINGS WITHOUT.\n\nM ALES-FEMALES WILL THEY BE.\n\nL ORDS OF THE F LAME ALSO .\n\n.\n\n.\n\n.\n\n\" 13.\n\nT HEY WENT EACH ON HIS ALLOTTED LAND: SEVEN OF THEM EACH ON HIS LOT.\n\nT HE L ORDS OF THE F LAME REMAIN BEHIND.\n\nT HEY WOULD NOT GO, THEY WOULD NOT CREATE.\n\n[[Vol."


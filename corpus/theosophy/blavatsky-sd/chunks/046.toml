[content]
body = "\"In the beginning, before Mother became Father-Mother, the fiery Dragon moved in the infinitudes alone\" ( Book of Sarparajni.\n\n) The Aitareya Brahmana calls the Earth Sarparajni, \"the Serpent Queen,\" and \"the Mother of all that moves.\" Before our globe became egg-shaped (and the Universe also) \"a long trail of Cosmic dust (or fire mist) moved and writhed like a serpent in Space.\" The \"Spirit of God moving on Chaos\" was symbolized by every nation in the shape of a fiery serpent breathing fire and light upon the primordial waters, until it had incubated cosmic matter and made it assume the annular shape of a serpent with its tail in its mouth -- which symbolises not only Eternity and Infinitude, but also the globular shape of all the bodies formed within the Universe from that fiery mist.\n\nThe Universe, as well as the Earth and Man, cast off periodically, serpent-like, their old skins, to assume new ones after a time of rest.\n\nThe serpent is, surely, a not less graceful or a more unpoetical image than the caterpillar and chrysalis from which springs the butterfly, the Greek emblem of Psyche, the human soul.\n\nThe \"Dragon\" was also the symbol of the Logos with the Egyptians, as with the Gnostics.\n\nIn the \"Book of Hermes,\" Pymander, the oldest and the most spiritual of the Logoi of the Western Continent, appears to Hermes in the shape of a Fiery Dragon of \"Light, Fire, and Flame.\" Pymander, the \"Thought Divine\" personified, says: The Light is me, I am the Nous (the mind or Manu), I am thy God, and I am far older than the human principle which escapes from the shadow (\" Darkness ,\" or the concealed Deity).\n\nI am the germ of thought, the resplendent Word, the Son of God.\n\nAll that thus sees and hears in thee is the Verbum of the Master, it is the Thought ( Mahat ) which is God, the Father.** [[Footnote(s)]] ------------------------------------------------- *The Astral Light, or the AEther, of the ancient pagans (for the name of Astral Light is quite modern) is Spirit .\n\n.\n\n.\n\n.\n\nMatter.\n\nBeginning with the pure spiritual plane, it becomes grosser as it descends until it becomes the Maya or the tempting and deceitful serpent on our plane.\n\n** By \"God, the Father,\" the seventh principle in Man and Kosmos are here unmistakeably meant, this principle being inseparable in its Esse and Nature from the seventh Cosmic principle.\n\nIn one sense it is the Logos of the Greeks and the Avalokiteswara of the esoteric Buddhists.\n\n[[Vol.\n\n1, Page]] 75 NOUMENAL AND PHENOMENAL LIGHT.\n\nThe celestial Ocean, the 'Ether .\n\n.\n\n.\n\n.\n\nis the Breath of the Father, the life-giving principle, the Mother , the Holy Spirit, for these are not separated, and their union is LIFE.\" Here we find the unmistakeable echo of the Archaic Secret Doctrine, as now expounded.\n\nOnly the latter does not place at the head and Evolution of Life \"the Father,\" who comes third and is the \"Son of the Mother,\" but the \"Eternal and Ceaseless Breath of the ALL.\" The Mahat (Understanding, Universal Mind, Thought, etc.), before it manifests itself as Brahma or Siva, appears as Vishnu, says Sankhya Sara (p.\n\n16); hence Mahat has several aspects, just as the logos has.\n\nMahat is called the Lord, in the Primary Creation, and is, in this sense, Universal Cognition or Thought Divine ; but, \"That Mahat which was first produced is (afterwards) called Ego-ism , when it is born as \"I,\" that is said to be the second Creation\" ( Anugita , ch.\n\nxxvi.).\n\nAnd the translator (an able and learned Brahmin, not a European Orientalist) explains in a foot-note (6), \" i.e.\n\n, when Mahat develops into the feeling of Self-Consciousness -- I -- then it assumes the name of Egoism,\" which, translated into our esoteric phraseology, means when Mahat is transformed into the human Manas (or even that of the finite gods), and becomes Aham -ship.\n\nWhy it is called the Mahat of the Second creation (or the ninth , that of the Kumara in Vishnu Purana ) will be explained in Book II.\n\nThe \"Sea of Fire\" is then the Super-Astral ( i.e.\n\n, noumenal) Light, the first radiation from the Root, the Mulaprakriti, the undifferentiated Cosmic Substance, which becomes Astral Matter.\n\nIt is also called the \"Fiery Serpent,\" as above described.\n\nIf the student bears in mind that there is but One Universal Element, which is infinite, unborn, and undying, and that all the rest -- as in the world of phenomena -- are but so many various differentiated aspects and transformations (correlations, they are now called) of that One, from Cosmical down to microcosmical effects, from super-human down to human and sub-human beings, the totality, in short, of objective existence -- then the first and chief difficulty will disappear and Occult Cosmology may be mastered.* All the Kabalists and Occultists, Eastern and Western, recognise ( a ) [[Footnote(s)]] ------------------------------------------------- * In the Egyptian as in the Indian theogony there was a concealed deity, the ONE, and the creative, androgynous god.\n\nThus Shoo is the god of creation and Osiris is, in his original primary form, the \"god whose name is unknown.\" (See Mariette's Abydos II., p.\n\n63, and Vol.\n\nIII., pp.\n\n413, 414, No.\n\n1122.) [[Vol.\n\n1, Page]] 76 THE SECRET DOCTRINE.\n\nthe identity of \"Father-Mother\" with primordial AEther or Akasa , (Astral Light)*; and ( b ) its homogeneity before the evolution of the \"Son,\" cosmically Fohat, for it is Cosmic Electricity.\n\n\"Fohat hardens and scatters the seven brothers\" (Book III.\n\nDzyan); which means that the primordial Electric Entity -- for the Eastern Occultists insist that Electricity is an Entity -- electrifies into life, and separates primordial stuff or pregenetic matter into atoms, themselves the source of all life and consciousness.\n\n\"There exists an universal agent unique of all forms and of life, that is called Od,** Ob, and Aour, active and passive, positive and negative, like day and night: it is the first light in Creation\" (Eliphas Levi's Kabala): --- the first Light of the primordial Elohim -- the Adam, \"male and female\" -- or (scientifically) ELECTRICITY AND LIFE."


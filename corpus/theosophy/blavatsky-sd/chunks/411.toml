body = "As described in the Commentary, the very earliest of that race were: -- \" The ' Sons of Passive Yoga.* They issued from the second Manushyas [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] has beyond a doubt (to the minds of Haeckel and his like) arisen from the lower mammalia, apes and the earlier simian creatures, the still earlier Marsupialia, Amphibia, Pisces, by progressive transformations,\" all produced by \"a series of natural forces working blindly .\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\naim, without design \" ( p.\n\n36).\n\nThe above-quoted passage bears its criticism on its own face.\n\nScience is made to teach that which, up to the present time, \" has never been actually observed.\n\n\" She is made to deny the phenomenon of an intelligent nature and a vital force independent of form and matter, and to find it more scientific to teach the miraculous performance of \"natural forces working blindly without aim or design.\n\n\" If so, then we are led to think that the physico-mechanical forces of the brains of certain eminent Scientists are leading them on as blindly to sacrifice logic and common sense on the altar of mutual admiration.\n\nWhy should the protoplasmic Moneron producing the first living creature through self-division be held as a very scientific hypothesis, and an ethereal pre-human race generating the primeval men in the same fashion be tabooed as unscientific superstition?\n\nOr has materialism obtained a sole monopoly in Science?\n\n* The Rakshasas, regarded in Indian popular theology as demons, are called the \"Preservers\" beyond the Himalayas.\n\nThis double and contradictory meaning has its origin in a philosophical allegory, which is variously rendered in the Puranas.\n\nIt is stated that when Brahma created the demons, Yakshas (from Yaksh, to eat) and the Rakshasas, both of which kinds of demons, as soon as born, wished to devour their creator, those among them that called out \"Not so!\n\noh, let him be saved (preserved)\" were named Rakshasas ( Vishnu Purana Book I.\n\nch.\n\nv .).\n\nThe Bhagavata Purana ( III, 20, 19-21) renders the allegory differently.\n\nBrahma transformed himself into night (or ignorance) invested with a body, upon which the Yakshas and Rakshasas seized, exclaiming \"Do not spare it; devour it.\" Brahma then cried out, \"Do not devour me, spare me.\" This has an inner meaning of course.\n\nThe \"body of Night\" is the darkness of ignorance, and it is the darkness of silence and secrecy.\n\nNow the Rakshasas are shown in almost every case to be Yogis, pious Saddhus and Initiates, a rather unusual occupation for demons.\n\nThe meaning then is that while we have power to dispel the darkness of ignorance, \" devour it, \" we have to preserve the sacred truth from profanation.\n\n\"Brahma is for the Brahmins alone,\" says that proud caste.\n\nThe moral of the fable is evident.\n\n** The gradual evolution of man in the Secret Doctrine shows that all the later (to the profane the earliest) Races have their physical origin in the early Fourth Race.\n\nBut it is the sub-race, which preceded the one that separated sexually, that is to be [[Footnote continued on next page]] [[Vol.\n\n2, Page]] 166 THE SECRET DOCTRINE.\n\n(human race), and became oviparous.\n\nThe emanations that came out of their bodies during the seasons of procreation were ovulary ; the small spheroidal nuclei developing into a large soft, egg-like vehicle, gradually hardened, when, after a period of gestation, it broke and the young human animal issued from it unaided, as the fowls do in our race.\n\n\" This must seem to the reader ludicrously absurd.\n\nNevertheless, it is strictly on the lines of evolutionary analogy, which science perceives in the development of the living animal species.\n\nFirst the moneron- like procreation by self-division ( vide Haeckel ); then, after a few stages, the oviparous, as in the case of the reptiles, which are followed by the birds; then, finally, the mammals with their ovoviviparous modes of producing their young ones.\n\nIf the term ovoviviparous is applied to some fish and reptiles, which hatch their eggs within their bodies, why should it not be applied to female mammalians, including woman?\n\nThe ovule, in which, after impregnation, the development of the foetus takes place, is an egg.\n\nAt all events, this conception is more philosophical than that of Eve with a suddenly created placenta giving birth to Cain, because of the Apple, when even the marsupial, the earliest of mammals, is not placental yet.\n\nMoreover, the progressive order of the methods of reproduction, as unveiled by science, is a brilliant confirmation of esoteric Ethnology.\n\nIt is only necessary to tabulate the data in order to prove our assertion.\n\n(Cf.\n\nespecially Schmidt ' s \" Doctrine of Descent and Darwinism, \" p.\n\n39, et.\n\nseq., and Laing ' s \" A Modern Zoroastrian, \" pp.\n\n102-111.)I 1.\n\nFission: - - ( a ) As seen in the division of the homogeneous speck of protoplasm, known as Moneron or Amoeba, into two.\n\n(b) As seen in the division of the nucleated cell, in which the cell-nucleus splits into two sub-nuclei, which either develop within the original cell-wall or burst it, and multiply outside as independent entities.\n\n( Cf., the First Root-Race.\n\n) II.\n\nBudding: - - A small portion of the parent structure swells out at the surface and finally parts company, growing to the size of the original organism; e.g.\n\n, many vegetables, the sea-anemone, etc.\n\n( Cf., the Second Root-Race.\n\n)* [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] regarded as the spiritual ancestors of our present generations, and especially of the Eastern Aryan Races.\n\nWeber's idea that the Indo-Germanic Race preceded the Aryan Vedic Race is, to the Occultist, grotesque to the last degree.\n\n* Every process of healing and cicatrization in the higher animal groups -- even in the case of reproduction of mutilated limbs with the Amphibians -- is effected by fission and gemmation of the elementary morphological elements.\n\n[[Vol.\n\n2, Page]] 167 MONADS AND ROUNDS.\n\nIII .\n\nSpores: -- A single cell thrown off by the parent organism, which develops into a multicellular organism reproducing the features of the latter, e.g ., bacteria and mosses.\n\nIV .\n\nIntermediate Hermaphroditism: -- Male and female organs inhering in the same individual; e.g ., the majority of plants, worms, and snails, etc.; allied to budding.\n\n(Cf.\n\nSecond and early Third Root-Races.\n\n) V."


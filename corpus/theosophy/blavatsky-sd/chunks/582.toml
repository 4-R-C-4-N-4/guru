body = "As in the Chaldean Cosmogony of Berosus and the Stanzas just given, some treatises on the Kabala speak of creatures with two faces, some with four, and some with one face: for \"the highest Adam did not come down in all the countries, or produce progeny and have many wives,\" but is a Mystery.\n\nSo is the Dragon a mystery.\n\nTruly, says Rabbi Simeon Ben-Iochai, that to understand the meaning of the Dragon is not given to the \"Companions\" (students, or chelas ) , but only to \"the little ones,\" i.e ., the perfect Initiates.* \"The work of the beginning the companions understand; but it is only the little ones who understand the parable on the work in the Principium by the mystery of the serpent of the Great Sea.\n\n\" ** And those Christians, who may happen to read this, will also understand by the light of the above sentence who their \"Christ\" was.\n\nFor Jesus states repeatedly that he who \"shall not receive the Kingdom of God as a little child, he shall not enter therein\"; and if some of his sayings have been meant to apply to children without any metaphor, most of what relates to the \"little ones\" in the Gospels, related to the Initiates, of whom Jesus was one.\n\nPaul (Saul) is referred to in the Talmud as \"the little one.\" That \"Mystery of the Serpent\" was this: Our Earth, or rather terrestrial life, is often referred to in the Secret Teachings as the great Sea, \"the sea of life\" having remained to this day a favourite metaphor.\n\nThe Siphrah Dzeniouta speaks of primeval chaos and the evolution of the Universe after a destruction ( pralaya ), comparing it to an uncoiling serpent: -- \"Extending hither and thither, its tail in its mouth, the head twisting on its neck, it is enraged and angry.\n\n.\n\n.\n\nIt watches and conceals itself.\n\nEvery thousand Days it is manifested.\" (I., § 16).\n\n[[Footnote(s)]] ------------------------------------------------- * Such was the name given in ancient Judea to the Initiates, called also the \"Innocents\" and the \"Infants,\" i.e ., once more reborn.\n\nThis key opens a vista into one of the New Testament mysteries; the slaughter by Herod of the 40,000 \"Innocents.\" There is a legend to this effect, and the event which took place almost a century B.C.\n\n, shows the origin of the tradition blended at the same time with that of Krishna and his uncle Kansa.\n\nIn the case of the N.\n\nT., Herod stands for Alexander Janneus (of Lyda), whose persecution and murder of hundreds and thousands of Initiates led to the adoption of the Bible story.\n\n** Zohar ii., 34.\n\n[[Vol.\n\n2, Page]] 505 THE SACREDNESS OF THE SERPENT.\n\nA commentary on the Puranas says: \"Ananta-Sesha is a form of Vishnu, the Holy Spirit of Preservation, and a symbol of the Universe, on which it is supposed to sleep during the intervals of the Days of Brahma.\n\nThe seven heads of Sesha support the Universe.\n\n.\n\n.\n\n.\n\n\" So the Spirit of God \"sleeps,\" is \"breathing\" (meracha' pheth') over the Chaos of undifferentiated matter, before each new \"Creation.\" ( Siphrah Dzeniouta ) .\n\nNow one \"Day\" of Brahma is composed, as already explained, of one thousand Mahayugas; and as each \"Night\" or period of rest is equal in duration to this \"day,\" it is easy to see to what this sentence in Siphrah Dzeniouta refers, viz.: -- that the serpent manifests \"once in a thousand days.\" Nor is it more difficult to see whither the initiated writer of the Siphrah is leading us, when he says: \"Its head is broken in the waters of the great sea, as it is written: 'Thou dividest the sea by thy strength, thou brakest the heads of the dragons in the waters' \" (lxxiv.\n\n13).\n\nIt refers to the trials of the Initiates in this physical life, the \"sea of sorrow,\" if read with one key; it hints at the successive destruction of the seven spheres of a chain of worlds in the great sea of space, when read with another key: for every sidereal globe or sphere, every world, star, or group of stars, is called in symbolism \"the Dragon's head.\" But however it may read, the Dragon was never regarded as Evil, nor was the Serpent either -- in antiquity.\n\nIn the metaphors, whether astronomical, cosmical, theogonical or simply physiological, i.e.\n\n, phallic -- the Serpent was always regarded as a divine symbol.\n\nWhen it is said \"The (Cosmic) Serpent which runs with 370 leaps\" ( Siphrah Dzeniouta , § 33) it means the cyclic periods of the great Tropical year (25,868 years), divided in the esoteric calculation into 370 periods or cycles, as one solar year is divided into 365 days.\n\nAnd if Michael was regarded by the Christians as the Conqueror of Satan, the Dragon, it is because in the Talmud this fighting personage is represented as the Prince of Waters, who had seven subordinate Spirits under him -- a good reason why the Latin Church made him the patron Saint of every promontory in Europe.\n\nIn the Kabala ( Siph.\n\nDzen .) the creative Force \"makes sketches and spiral lines of his creation in the shape of a Serpent.\n\n\" It \"holds its tail in its mouth,\" because it is the symbol of endless eternity and of cyclic periods.\n\nIts meanings, however, would require a volume, and we must end.\n\nThus the reader may now see for himself what are the several meanings of the \"War in Heaven,\" and of the \"great dragon.\" The most solemn and dreaded of church dogmas, the alpha and omega of Christian faith, and the pillar of its F ALL and A TONEMENT, dwindles down to a pagan symbol, in the many allegories about those prehistoric struggles.\n\n-------"


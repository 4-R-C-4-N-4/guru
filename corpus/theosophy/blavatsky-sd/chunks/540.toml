body = "The gift of Prometheus thus became a CURSE -- though foreknown and foreseen by the HOST personified in that personage, as his name well shows.* It is in this that rests, at one and the same time, [[Footnote(s)]] ------------------------------------------------- * Vide supra, a foot-note concerning the etymology of [[ prometis ]] prometis or forethought.\n\nPrometheus confesses it in the drama when saying: -- [[Footnote continued on next page]] [[Vol.\n\n2, Page]] 421 ONE OF THE FUNCTIONS OF ZEUS.\n\nits sin and its redemption.\n\nFor the Host that incarnated in a portion of humanity, though led to it by Karma or Nemesis, preferred free-will to passive slavery, intellectual self-conscious pain and even torture \"while myriad time shall flow\" -- to inane, imbecile, instinctual beatitude.\n\nKnowing such an incarnation was premature and not in the programme of nature, the heavenly host, \"Prometheus,\" still sacrificed itself to benefit thereby, at least, one portion of mankind.* But while saving man from mental darkness, they inflicted upon him the tortures of the self-consciousness of his responsibility -- the result of his free will -- besides every ill to which mortal man and flesh are heir to.\n\nThis torture Prometheus accepted for himself, since the Host became henceforward blended with the tabernacle prepared for them, which was still unachieved at that period of formation.\n\nSpiritual evolution being incapable of keeping pace with the physical, once its homogeneity was broken by the admixture, the gift thus became the chief cause, if not the sole origin of Evil.\n\n** The allegory which shows K RONOS cursing Zeus for dethroning him (in the primitive \"golden\" age of Saturn, when all men were demi-gods), and for creating a physical race of men weak and helpless in comparison; and then as delivering to his (Zeus') revenge the culprit, who despoiled the gods of their prerogative of creation and who thereby raised man to their level, intellectually and spiritually -- is highly philosophical.\n\nIn the case of Prometheus, Zeus represents the Host of the primeval progenitors, of the PITAR, the \"Fathers\" who created man senseless [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] \"Oh!\n\nholy Ether, swiftly-winged gales .\n\n.\n\n.\n\n.\n\nBehold what I, a god, from gods endure .\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\nAnd yet what say I?\n\nClearly I foreknew All that must happen .\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\nThe Destined it behoves, As best I may, to bear, for well I wot How incontestable the strength of Fate .\n\n.\n\n.\n\n.\n\n(88-105) \"Fate\" stands here for K ARMA, or Nemesis.\n\n* Mankind is obviously divided into god-informed men and lower human creatures.\n\nThe intellectual difference between the Aryan and other civilized nations and such savages as the South Sea Islanders, is inexplicable on any other grounds.\n\nNo amount of culture, nor generations of training amid civilization, could raise such human specimens as the Bushmen, the Veddhas of Ceylon, and some African tribes, to the same intellectual level as the Aryans, the Semites, and the Turanians so called.\n\nThe \"sacred spark\" is missing in them and it is they who are the only inferior races on the globe, now happily -- owing to the wise adjustment of nature which ever works in that direction -- fast dying out.\n\nVerily mankind is \"of one blood,\" but not of the same essence.\n\nWe are the hot-house, artificially quickened plants in nature, having in us a spark, which in them is latent.\n\n** The philosophical view of Indian metaphysics places the Root of Evil in the differentiation of the Homogeneous into the Heterogeneous, of the unit into plurality.\n\n[[Vol.\n\n2, Page]] 422 THE SECRET DOCTRINE.\n\nand without any mind; while the divine Titan stands for the Spiritual creators, the devas who \"fell\" into generation.\n\nThe former are spiritually lower, but physically stronger, than the \"Prometheans\": therefore, the latter are shown conquered.\n\n\"The lower Host, whose work the Titan spoiled and thus defeated the plans of Zeus,\" was on this earth in its own sphere and plane of action; whereas, the superior Host was an exile from Heaven, who had got entangled in the meshes of matter.\n\nThey (the inferior \"Host\") were masters of all the Cosmic and lower titanic forces; the higher Titan possessed only the intellectual and spiritual fire.\n\nThis drama of the struggle of Prometheus with the Olympic tyrant and despot, sensual Zeus, one sees enacted daily within our actual mankind: the lower passions chain the higher aspirations to the rock of matter, to generate in many a case the vulture of sorrow, pain, and repentance.\n\nIn every such case one sees once more -- \"A god .\n\n.\n\n.\n\nin fetters, anguish fraught; The foe of Zeus, in hatred held by all.\n\n.\n\n.\n\n.\n\n\" A god, bereft even of that supreme consolation of Prometheus, who suffered in self-sacrifice -- \"For that to men he bare too fond a mind.\n\n.\n\n.\" as the divine Titan is moved by altruism, but the mortal man by Selfishness and Egoism in every instance.\n\nThe modern Prometheus has now become Epi-metheus, \"he who sees only after the event\"; because the universal philanthropy of the former has long ago degenerated into selfishness and self-adoration.\n\nMan will rebecome the free Titan of old, but not before cyclic evolution has re-established the broken harmony between the two natures -- the terrestrial and the divine; after which he becomes impermeable to the lower titanic forces, invulnerable in his personality, and immortal in his individuality, which cannot happen before every animal element is eliminated from his nature.\n\nWhen man understands that \" Deus non fecit mortem \" ( Sap.\n\nI., 13), but that man has created it himself, he will re-become the Prometheus before his Fall.\n\nFor the full symbolism of Prometheus and the origin of this mythos in Greece, the reader is referred to Part II .\n\nof this Volume, chapter \"A Second Key to Prometheus,\" etc.\n\nIn the said Part -- a kind of supplement to the present portion -- every additional information is given upon those tenets that will be the most controverted and questioned.\n\nThis work is so heterodox, when confronted with the acknowledged standards of theology and modern science, that no proof which tends to show that these standards often usurp an illegal authority should be neglected."


body = "The \"Angel\" of that Star, or the Dhyani-Buddha will be either the guiding or simply the presiding \"Angel,\" so to say, in every new rebirth of the monad, which is part of his own essence , though his vehicle, man, may remain for ever ignorant of this fact.\n\nThe adepts have each their Dhyani-Buddha, their elder \"twin Soul,\" and they know it, calling it \"Father-Soul,\" and \"Father-Fire.\" It is only at the last and supreme initiation, however, that they learn it when placed face to face with the bright \"Image.\" How much has Bulwer Lytton known of this mystic fact when describing, in one of his highest inspirational moods, Zanoni face to face with his Augoeides?\n\nThe Logos , or both the unmanifested and the manifested W ORD, is called by the Hindus, Iswara, \"the Lord,\" though the Occultists give it another name.\n\nIswara, say the Vedantins, is the highest consciousness in nature.\n\n\"This highest consciousness,\" answer the Occultists, \"is only a synthetic unit in the world of the manifested Logos -- or on the plane of illusion; for it is the sum total of Dhyan-Chohanic consciousnesses.\n\n\" \"Oh, wise man, remove the conception that not - Spirit is Spirit ,\" says Sankaracharya.\n\nAtma is not - Spirit in its final Parabrahmic state, Iswara or Logos is Spirit; or, as Occultism explains, it is a compound unity of manifested living Spirits, the parent-source and nursery of all the mundane and terrestrial monads, plus their divine reflection, which emanate from, and return into, the Logos, each in the culmination of its time.\n\nThere are seven chief groups of such Dhyan Chohans, which groups will be found and recognised in every religion, for they are the primeval SEVEN Rays.\n\nHumanity, occultism teaches us, is divided into seven distinct groups and their sub-divisions, mental, spiritual, and physical.* The monad, then, viewed as ONE, is above the seventh principle (in Kosmos and man), and as a triad, it is the direct radiant progeny of the said compound UNIT, not the breath (and special creation out of nihil ) of \"God,\" as that unit is called; for such an idea is quite unphilosophical, and degrades Deity, dragging it down to a finite, attributive condition.\n\nAs well expressed by the translator of the \"Crest-Jewel of Wisdom\" -- though Iswara is \"God\" \"unchanged in the profoundest depths of pralayas and in the intensest activity of the manvantaras \" .\n\n.\n\n., still \" beyond (him) is [[Footnote(s)]] ------------------------------------------------- * Hence the seven chief planets, the spheres of the indwelling seven spirits, under each of which is born one of the human groups which is guided and influenced thereby.\n\nThere are only seven planets ( specially connected with earth), and twelve houses, but the possible combinations of their aspects are countless.\n\nAs each planet can stand to each of the others in twelve different aspects, their combinations must, therefore, be almost infinite; as infinite, in fact, as the spiritual, psychic, mental, and physical capacities in the numberless varieties of the genus homo , each of which varieties is born under one of the seven planets and one of the said countless planetary combinations.\n\nSee Theosophist , for August, 1886.\n\n[[Vol.\n\n1, Page]] 574 THE SECRET DOCTRINE.\n\n' A TMA,' round whose pavilion is the darkness of eternal M AYA.\"* The \"triads\" born under the same Parent-planet, or rather the radiations of one and the same Planetary Spirit (Dhyani Buddha) are, in all their after lives and rebirths, sister, or \" twin -souls,\" on this Earth.** This was known to every high Initiate in every age and in every country: \"I and my Father are one,\" said Jesus (John x.\n\n30).*** When He is made to say, elsewhere (xx.\n\n17): \"I ascend to my Father and your Father,\" it meant that which has just been stated.\n\nIt was simply to show that the group of his disciples and followers attracted to Him belonged to the same Dhyani Buddha, \"Star,\" or \"Father,\" again of the same planetary realm and division as He did.\n\nIt is the knowledge of this occult doctrine that found expression in the review of \"The Idyll of the White Lotus,\" when Mr.\n\nT.\n\nSubba Row wrote: \"Every Buddha meets at his last initiation all the great adepts who reached Buddhahood during the preceding ages .\n\n.\n\n.\n\nevery class of adepts has its own bond of spiritual communion which knits them together.\n\n.\n\n.\n\n.\n\n.\n\nThe only possible and effectual way of entering into such brotherhood .\n\n.\n\n.\n\n.\n\nis by bringing oneself within the influence of the Spiritual light which radiates from one ' s own Logos.\n\nI may further point out here .\n\n.\n\n.\n\n.\n\nthat such communion is only possible between persons whose souls derive their life and sustenance from the same divine RAY, and that, as seven distinct rays radiate from the 'Central Spiritual Sun,' all adepts and Dhyan Chohans are divisible into seven classes , each of which is guided, controlled, and overshadowed by one of the seven forms or manifestations of the divine Wisdom.\" (\" Theosophist ,\" Aug., 1886.) [[Footnote(s)]] ------------------------------------------------- * The now universal error of attributing to the ancients the knowledge of only seven planets, simply because they mentioned no others, is based on the same general ignorance of their occult doctrines.\n\nThe question is not whether they were, or were not, aware of the existence of the later discovered planets; but whether the reverence paid by them to the four exoteric and three secret great gods -- the star-angels, had not some special reason.\n\nThe writer ventures to say there was such a reason, and it is this.\n\nHad they known of as many planets as we do now (and this question can hardly be decided at present, either way), they would have still connected with their religious worship only the seven, because these seven are directly and specially connected with our earth, or, using esoteric phraseology, with our septenary ring of spheres.\n\n(See supra .) ** It is the same, only still more metaphysical idea, as that of the Christian Trinity -- \"Three in One\" -- i.e.\n\n, the Universal \"over-Spirit,\" manifesting on the two higher planes, those of Buddhi and Mahat; and these are the three hypostases, metaphysical, but never personal.\n\n*** The identity, and at the same time the illusive differentiation of the Angel -Monad and the Human -Monad is shown by the following sentences: \"My Father is greater than I\" (John xiv.\n\n26) ; \"Glorify your Father who is in Heaven \" (Matt.\n\nv."


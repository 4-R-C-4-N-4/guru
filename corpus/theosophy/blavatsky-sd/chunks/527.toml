body = "These kings answer to the ten antediluvian generations of kings as given by Berosus.\n\nDistorted as those legends are now found, one can hardly fail to identify them with the Chaldean, Egyptian, Greek, and even Hebrew traditions.\n\nThe latter, disdaining in its exclusiveness to speak of pre-adamite nations, yet allows these to be clearly inferred, by sending out Cain -- one of the two only living men on earth -- into the land of Nod, where he gets married and builds a city ( Gen.\n\niv.\n\n), etc.\n\nNow if we compare the 9,000 years mentioned by the Persian tales with the 9,000 years, which Plato declared had passed since the submersion of the last Atlantis, a very strange fact is made apparent.\n\nBailly remarked, but distorted it by his interpretation.\n\nThe Secret Doctrine may restore the figures to their true meaning.\n\n\"First of all,\" we read in \"Critias\" that \"one must remember that 9,000 years have elapsed since the war of the nations, which lived above and outside the Pillars of Hercules, and those which peopled the lands on this side.\" [[Footnote(s)]] ------------------------------------------------- * Some derive the word from Paras which produced Pars, Persia, Pars ; but it may be equally derived from Pitar or Pitris, the Hindu progenitors of the Fifth Race -- the Fathers of Wisdom or the Sons of \"Will and Yoga\" -- who were called Pitar, as were the divine Pitars of the First Race.\n\n** See for these traditions the \"Collection of Persian Legends,\" in Russian, Georgian, Armenian, and Persian; Herbelot's narrative Legendes Persanes, \"Bibliotheque Orientale,\" p.\n\n298, 387, etc., and Danville's Memoires.\n\nWe give in a condensed narrative that which is scattered in hundreds of volumes in European and Asiatic languages, as well as in oral traditions.\n\n[[Vol.\n\n2, Page]] 395 ESOTERIC CHRONOLOGY.\n\nIn \" Timaeus \" Plato says the same.\n\nThe Secret Doctrine declaring that most of the later islander Atlanteans perished in the interval between 850,000 and 700,000 years ago, and that the Aryans were 200,000 years old when the first great \"island\" or continent was submerged, there hardly seems any reconciliation possible between the figures.\n\nBut there is, in truth.\n\nPlato, being an Initiate, had to use the veiled language of the Sanctuary, and so had the Magi of Chaldea and Persia, through whose exoteric revelations the Persian legends were preserved and passed to posterity.\n\nThus, one finds the Hebrews calling a week \"seven days,\" and \"a week of years\" when each of its days represents 360 solar years, and the whole \"week\" is 2,520 years, in fact.\n\nThey had a Sabbatical week, a Sabbatical year, etc., etc., and their Sabbath lasted indifferently 24 hours or 24,000 years -- in their secret calculations of the Sods.\n\nWe of the present times call an age a century.\n\nThey of Plato's day, the initiated writers, at any rate, meant by a millenium, not a thousand but 100,000 years; Hindus, more independent than any, never concealed their chronology.\n\nThus, when saying 9,000 years, the Initiates will read 900,000 years, during which space of time - - i.e , from the first appearance of the Aryan race, when the Pliocene portions of the once great Atlantis began gradually sinking* and other continents to appear on the surface, down to the final disappearance of Plato's small island of Atlantis, the Aryan races had never ceased to fight with the descendants of the first giant races.\n\nThis war lasted till nearly the close of the age which preceded the Kali Yug, and was the Mahabharatean war so famous in Indian History.\n\nSuch blending of the events and epochs, and the bringing down of hundreds of thousands into thousands of years, does not interfere with the numbers of years that had elapsed, according to the statement made by the Egyptian priests to Solon, since the destruction of the last portion of Atlantis.\n\nThe 9,000 years were the correct figures given.\n\nThe latter event has never been kept a secret, and had only faded out of the memory of the Greeks.\n\nThe Egyptians had their records complete, because isolated; for, being surrounded by sea and desert, they had been left untrammelled by other nations, till about a few millenniums before our era.\n\nHistory, for the first time, catches a glimpse of Egypt and its great mysteries through Herodotus, if we do not take into account the Bible, and its queer chronology.** And how little Herodotus could tell is [[Footnote(s)]] ------------------------------------------------- * The main continent perished in the Miocene times, as already stated.\n\n** From Bede downwards all the chronologists of the Church have differed among themselves, and contradicted each other.\n\n\"The chronology of the Hebrew text has been grossly altered, especially in the interval next after the Deluge\": -- says Whiston ( Old Test., p.\n\n20).\n\n[[Vol.\n\n2, Page]] 396 THE SECRET DOCTRINE.\n\nconfessed by himself when speaking of a mysterious tomb of an Initiate at Sais, in the sacred precinct of Minerva.\n\nThere, he says \"behind the chapel .\n\n.\n\n.\n\nis the tomb of One, whose name I consider it impious to divulge .\n\n.\n\n.\n\nIn the enclosure stand large obelisks and there is a lake near, surrounded with a stone wall formed in a circle.\n\nIn this lake they perform by night, that person's adventures, which they call Mysteries: on these matters, however, though I am accurately acquainted with the particulars of them, I must observe a discreet silence \" ( ii.\n\n170).\n\nOn the other hand, it is well to know that no secret was so well preserved and so sacred with the ancients, as that of their cycles and computations.\n\nFrom the Egyptians down to the Jews it was held as the highest sin to divulge anything pertaining to the correct measure of time.\n\nIt was for divulging the secrets of the Gods, that Tantalus was plunged into the infernal regions; the keepers of the sacred Sibylline Books were threatened with the death penalty for revealing a word from them.\n\nSigalions (images of Harpocrates) were in every temple -- especially in those of Isis and Serapis -- each pressing a finger to the lips; while the Hebrews taught that to divulge, after initiation into the Rabbinical mysteries, the secrets of Kabala, was like eating of the fruit of the Tree of Knowledge: it was punishable by death.\n\nAnd yet, we Europeans accepted the exoteric chronology of the Jews!\n\nWhat wonder that it has influenced and coloured ever since all our conceptions of science and the duration of things!\n\nThe Persian traditions, then, are full of two nations or races, now entirely extinct, as some think; whereas, they are only transformed."


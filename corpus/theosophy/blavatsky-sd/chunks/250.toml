[content]
body = "How can Science presume to know anything certain of it?\n\nHow can it maintain its position and its hypotheses against those of the Occultists, who see in gravity only sympathy and antipathy, or attraction and repulsion, caused by physical polarity on our terrestrial plane, and by spiritual causes outside of its influence?\n\nHow can they disagree with the Occultists before they agree among themselves?\n\nIndeed one hears of the conservation of energy, and in the same breath of the perfect hardness and inelasticity of the atoms; of the Kinetic theory of gases being identical with \"potential energy,\" so called; and, at the same time, of the elementary units of mass being absolutely hard and inelastic!\n\nAn Occultist opens a scientific work and reads as follows: -- \"Physical atomism derives all the qualitative properties of matter from the forms of atomic motion.\n\nThe atoms themselves remain as elements utterly devoid of property.\n\n\" (Wundt, \" Die Theorie der Materie ,\" p.\n\n381.) And further: \"Chemistry in its ultimate form must be atomic mechanics.\n\n\" (Nazesmann, \" Thermochemie ,\" p.\n\n150.) And a moment after he is told that: \"Gases consist of atoms which behave like solid, perfectly elastic spheres.\" (Kroenig, Clausius, Maxwell, etc., Philosophical Magazine , Vol.\n\nXIX ., p.\n\n18.) Finally, to crown all, Sir W.\n\nThomson is found declaring that: \"We are forbidden by the modern theory of the conservation of [[Vol.\n\n1, Page]] 514 THE SECRET DOCTRINE.\n\nenergy to assume inelasticity, or anything short of perfect elasticity of the ultimate molecules whether of ultra mundane or mundane matter.\" (!!!) (\"Philosophical Magazine,\" p.\n\n321, loc.\n\ncit.\n\n) But what do the men of true Science say to all this?\n\nBy the \"men of true Science\" we mean those who care too much for truth and too little for their personal vanity to dogmatise on anything, as the majority do.\n\nThere are several among them -- perhaps more than dare publish openly their secret conclusions for fear of the cry \"Stone him to death!\" -- men, whose intuitions have made them span the abyss that lies between the terrestrial aspect of matter, and the -- to us, on our plane of illusion -- subjective, i.e.\n\n, TRANSCENDENTALLY OBJECTIVE SUBSTANCE, and led them to proclaim the existence of the latter.\n\nMatter, to the Occultist, it must be remembered, is that totality of existences in the Kosmos, which falls within any of the planes of possible perception.\n\nWe are but too well aware that the orthodox theories of sound, heat and light, are against the occult doctrines.\n\nBut, it is not enough for the men of Science, or their defenders, to say that they do not deny dynamic power to light and heat; and urge as a proof the fact that Mr.\n\nCrookes' radiometer has unsettled no views.\n\nIf they would fathom the ultimate nature of these Forces, they have first to admit their substantial nature, however supersensuous.\n\nNeither do the Occultists deny the correctness of the vibratory theory.* Only they limit its functions to our Earth -- declaring its inadequacy on other planes than ours, since \"Masters\" in the Occult Sciences perceive the CAUSES that produce ethereal vibrations.\n\nWere all these only the fictions of the alchemists, or dreams of the Mystics, such men as Paracelsus, Philalethes, Van Helmont, and so many others, would have to be regarded as worse than visionaries: they would become impostors and deliberate mystificators.\n\nThe Occultists are taken to task for calling the Cause of light, heat, sound, cohesion, magnetism, etc., etc., a substance .** Mr.\n\nClerk Maxwell has stated that the pressure of strong sunlight on a square mile is about 3 1/4 lbs.\n\nIt is, they are told, \"the energy of the myriad ether waves;\" and when they call it a \"substance\" impinging on that area, their explanation is proclaimed unscientific.\n\nThere is no justification for such an accusation.\n\nIn no way -- as stated [[Footnote(s)]] ------------------------------------------------- * Referring to the Aura , one of the Masters says in the \"Occult World,\" \"How could you make yourself understood by, command in fact, those semi-intelligent forces , whose means of communication with us are not through spoken words but through sounds and colours in correlation between the vibrations of the two.\" It is this \"correlation\" that is unknown to modern Science, yet was many times explained by the Alchemists.\n\n** The \"substance\" of the Occultist, however, is to the most refined substance of the physicist, what radiant matter is to the leather of the Chemist's boots.\n\n[[Vol.\n\n1, Page]] 515 THE MYSTIC RAYS.\n\nmore than once before now -- do the Occultists dispute the explanations of Science, as affording a solution of the immediate objective agencies at work.\n\nScience only errs in believing that, because it has detected in vibratory waves the proximate cause of these phenomena, it has, therefore, revealed ALL that lies beyond the threshold of Sense.\n\nIt merely traces the sequence of phenomena on a plane of effects, illusory projections from the region that Occultism has long since penetrated.\n\nAnd the latter maintains that those etheric tremors, are not, as asserted by Science, set up by the vibrations of the molecules of known bodies -- the matter of our terrestrial objective consciousness, -- but that we must seek for the ultimate causes of light, heat, etc., etc., in MATTER existing in super - sensuous states -- states, however, as fully objective to the spiritual eye of man, as a horse or a tree is to the ordinary mortal.\n\nLight and heat are the ghost or shadow of matter in motion.\n\nSuch states can be perceived by the SEER or the Adept during the hours of trance, under the Sushumna ray -- the first of the Seven Mystic rays of the Sun.* Thus, we put forward the Occult teaching which maintains the reality of a supersubstantial and supersensible essence of that Akasa (not ether, which is only an aspect of the latter), the nature of which cannot be inferred from its remoter manifestations -- its merely phenomenal phalanx of effects -- on this terrene plane.\n\nScience, on the contrary, informs us that heat can never be regarded as matter in any conceivable state.** We are also told that the two great obstacles to the fluid (?) theory of heat undoubtedly are: -- [[Footnote(s)]] ------------------------------------------------- * The names of the Seven Rays -- which are, Sushumna, Harikesa, Viswakarman, Viswatryarchas, Sannaddha, Sarvavasu and Swaraj -- are all mystical, and each has its distinct application in a distinct state of consciousness, for occult purposes.\n\nThe Sushumna , which, as said in the Nirukta (11, 6), is only to light up the moon, is the ray nevertheless cherished by the initiated Yogis."


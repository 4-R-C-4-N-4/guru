body = "It is from IT that issues the great unseen Logos, who evolves all the other logoi, the primeval M ANU who gives being to the other Manus, who emanate the universe and all in it collectively, and who represent in their aggregate the manifested Logos.* Hence we learn in the \"Commentaries\" that while no Dhyan Chohan, not even the highest, can realise completely \"the condition of the preceding Cosmic evolution,\" \"the Manus retain a knowledge of their experiences of all the Cosmic evolutions throughout Eternity.\" This is very plain: the first Manu is called Swayambhuva, [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] planetary chain, etc.; and Nitya (perpetual) Mahapralaya for the Universe, death -- for man, nitya is the extinction of life, like the extinction of a lamp,\" also \"in sleep at night.\" Nitya Sarga is \"constant or perpetual creation,\" as Nitya pralaya is \"constant or perpetual destruction of all that is born.\" \"That which ensues after a minor dissolution is called ephemeral creation.\n\n.\n\n.\n\n.\n\nThis is Samyama\" (production, existence, and dissolution) ( Vishnu Purana, Book I., ch.\n\nvii.\n\n) The subject is so difficult that we are obliged to repeat our statements.\n\n* But see the superb definitions of Parabrahmam and the Logos in Mr.\n\nSubba Row's Lectures on the Bhagavat Gita in the early numbers of the Theosophist of 1887, Feb., March, April, and May.\n\n[[Vol.\n\n2, Page]] 311 THE FOUR EARLIER RACES.\n\n\"the Self-manifested,\" the Son of the unmanifested F ATHER.\n\nThe Manus are the creators of the creators of our First Race -- the Spirit of mankind -- which does not prevent the seven Manus from having been the first \"pre-Adamic\" men on Earth.\n\nManu declares himself created by Viraj,* or Vaiswanara, (the Spirit of Humanity),** which means that his Monad emanates from the never resting Principle in the beginning of every new Cosmic activity: that Logos or U NIVERSAL M ONAD (collective Elohim) that radiates from within himself all those Cosmic Monads that become the centres of activity -- progenitors of the numberless Solar systems as well as of the yet undifferentiated human monads of planetary chains as well as of every being thereon.\n\nEach Cosmic Monad is \"Swayambhuva,\" the SELF-BORN, which becomes the Centre of Force, from within which emerges a planetary chain (of which chains there are seven in our system), and whose radiations become again so many Manus Swayambhuva (a generic name, mysterious and meaning far more than appears), each of these becoming, as a Host, the Creator of his own Humanity.\n\n( See \" The Manus and the Manvantaras Explained by a Western Mystic and Mathematician.\n\n\") As to the question of the four distinct races of mankind that preceded our Fifth Race, there is nothing mystical in it, except the ethereal bodies of the first races; and it is a matter of legendary, nevertheless, very correct history.\n\nThat legend is universal.\n\nAnd if the Western savant pleases to see in it only a myth, it does not make the slightest difference.\n\nThe Mexicans had, and still have, the tradition of the fourfold destruction of the world by fire and water, just as the Egyptians had, and the Hindus have, to this day.\n\nTrying to account for the community of legends in the remote antiquity -- held by Chinese, Chaldean, Egyptians, Indians and Greeks -- and for the absence of any certain vestige of civilization more ancient than 5,000 years, the author of \" Mythical Monsters, \" remarks, that \"we must not be surprised if we do not immediately discover the vestiges of the people of ten, fifteen, or twenty thousand years ago.\n\nWith an ephemeral architecture (as in China), the sites of vast cities may have become entirely lost to recollection in a few thousands of years from natural decay .\n\n.\n\n.\n\nand how much more .\n\n.\n\n.\n\nif .\n\n.\n\n.\n\nminor cataclysms have intervened, such as local inundations, earthquakes, deposition of volcanic ashes, the spread of sandy deserts, destruction of life by [[Footnote(s)]] ------------------------------------------------- * See preceding foot-note.\n\n** See Manu I., 32, 33.\n\nVaiswanara is, in another sense, the living magnetic fire that pervades the manifested solar system.\n\nIt is the most objective (to us the reverse) and ever present aspect of the ONE LIFE, for it is the Vital Principle.\n\n( See Theosophist, July, 1883, p .\n\n249).\n\nIt is also a name of Agni.\n\n[[Vol.\n\n2, Page]] 312 THE SECRET DOCTRINE.\n\ndeadly pestilence, by miasma, or by the outpour of sulphurous fumes.\" (\" Mythical Monsters, \" by Ch.\n\nGould, p.\n\n134.) And how many of such cataclysms have changed the whole surface of the earth may be inferred from this Stanza: \" During the first seven crores of the Kalpa (70,000,000 years) the Earth and its two Kingdoms (mineral and vegetable), one already having achieved its seventh circle, the other, hardly nascent, are luminous and semi-ethereal, cold, lifeless, and translucid.\n\nIn the eleventh crore* the mother (Earth) grows opaque, and in the FOURTEENTH** the throes of adolescence take place.\n\nThese convulsions of nature (geological changes) last till her twentieth crore of years, uninterruptedly, after which they become periodical, and at long intervals.\n\n\" The last change took place nearly twelve crores of years ago ( 120,000,000 ) .\n\nBut the Earth with everything on her face had become cool, hard and settled ages earlier.\n\n( Commentary, xxii.\n\n) Thus, if we are to believe esoteric teaching, there have been no more universal geological disturbances and changes for the last 120 millions of years, and the Earth was, even before that time, ready to receive her human stock.\n\nThe appearance of the latter, however, in its full physical development, as already stated, took place only about eighteen millions of years ago, after the first great failure of nature to create beings alone, without the help of the divine \"Fashioners,\" had been followed by the successive evolution of the first three races ( See above Stanzas III.\n\net seq .).\n\nThe actual duration of the first two and a-half Races is withheld from all but the higher Initiates.\n\nThe History of the Races begins at the separation of the Sexes, when the preceding egg-bearing androgynous race perished rapidly, and the subsequent sub-races of the [[Footnote(s)]] ------------------------------------------------- * This -- in the period of Secondary creation, so called."


[content]
body = "Its nucleus grows, changes, and forms a double cone or spindle, thus, within the cell.\n\nThis spindle approaches the surface of the cell, and one half of it is extruded in the form of what are called the \" polar cells.\n\n\" These polar cells now die, and the embryo develops from the growth and segmentation of the remaining part of the nucleus which is nourished by the substance of the cell.\n\nThen why could not beings have lived thus, and been created in this way -- at the very beginning of human and mammalian evolution?\n\nThis may, perhaps, serve as an analogy to give some idea of the process by which the Second Race was formed from the First.\n\nThe astral form clothing the Monad was surrounded, as it still is, by its egg-shaped sphere of aura, which here corresponds to the substance of the germ-cell or ovum.\n\nThe astral form itself is the nucleus, now, as then, instinct with the principle of life.\n\nWhen the season of reproduction arrives, the sub- astral \" extrudes \" a miniature of itself from the egg of surrounding aura.\n\nThis germ grows and feeds on the aura till it becomes fully developed, when it gradually separates from its parent, carrying with it its own sphere of aura; just as we see living cells reproducing their like by growth and subsequent division into two.\n\nThe analogy with the \" polar cells \" would seem to hold good, since their death would now correspond to the change introduced by the separation of the sexes, when gestation in utero, i.e., within the cell, became the rule.\n\n\" The early Second (Root) Race were the Fathers of the ' Sweat-born '; the later Second (Root) Race were ' Sweat-born ' themselves.\n\n\" This passage from the Commentary refers to the work of evolution from the beginning of a Race to its close.\n\nThe \"Sons of Yoga,\" or the primitive astral race, had seven stages of evolution racially, or collectively; as every individual Being in it had, and has now.\n\nIt is not Shakespeare only who divided the ages of man into a series of seven, but Nature herself.\n\nThus the first sub-races of the Second Race were born at first by the process described on the law of analogy; while the last began gradually, pari passu with the evolution of the human body, to be formed otherwise.\n\nThe process of reproduction had seven stages also [[Footnote(s)]] ------------------------------------------------- * See Book I.\n\nPart I.\n\nStanza VII Commentary 10 .\n\n[[Vol.\n\n2, Page]] 118 THE SECRET DOCTRINE.\n\nin each Race, each covering aeons of time.\n\nWhat physiologist or biologist could tell whether the present mode of generation, with all its phases of gestation, is older than half a million, or at most one million of years, since their cycle of observation began hardly half a century ago.\n\nPrimeval human hermaphrodites are a fact in Nature well known to the ancients, and form one of Darwin's greatest perplexities.\n\nYet there is certainly no impossibility, but, on the contrary, a great probability that hermaphroditism existed in the evolution of the early races; while on the grounds of analogy, and on that of the existence of one universal law in physical evolution, acting indifferently in the construction of plant, animal, and man, it must be so.\n\nThe mistaken theories of mono-genesis, and the descent of man from the mammals instead of the reverse, are fatal to the completeness of evolution as taught in modern schools on Darwinian lines, and they will have to be abandoned in view of the insuperable difficulties which they encounter.\n\nOccult tradition -- if the terms Science and Knowledge are denied in this particular to antiquity -- can alone reconcile the inconsistencies and fill the gap.\n\n\"If thou wilt know the invisible, open thine eye wide on the visible,\" says a Talmudic axiom.\n\nIn the \" Descent of Man \"* occurs the following passage; which shows how near Darwin came to the acceptance of this ancient teaching.\n\n\"It has been known that in the vertebrate kingdom one sex bears rudiments of various accessory parts appertaining to the reproductive system, which properly belong to the opposite sex.\n\n.\n\n.\n\n.\n\nSome remote progenitor of the whole vertebrate kingdom appears to have been hermaphrodite or androgynous** .\n\n.\n\n.\n\nBut here we encounter a singular difficulty.\n\nIn the mammalian class the males possess rudiments of a uterus with the adjacent passages in the Vesiculae prostaticae ; they bear also rudiments of mammae, and some male marsupials have traces of a marsupial sac.\n\nOther analogous facts could be added.\n\nAre we then to suppose that some extremely ancient mammal continued androgynous after it had acquired the chief distinctions of its class, and therefore after it had diverged from the lower classes of the vertebrate kingdom?\n\nThis seems very improbable,*** for we have to look to fishes, the lowest of all the classes, to find any still existent androgynous forms.\n\n\" Mr.\n\nDarwin is evidently strongly disinclined to adopt the hypothesis which the facts so forcibly suggest, viz., that of a primeval androgynous [[Footnote(s)]] ------------------------------------------------- * Second Edition, p.\n\n161.\n\n** And why not all the progenitive first Races, human as well as animal; and why one \"remote progenitor\"?\n\n*** Obviously so, on the lines of Evolutionism, which traces the mammalia to some amphibian ancestor.\n\n[[Vol.\n\n2, Page]] 119 THE BLASTEMA OF SCIENCE.\n\nstem from which the mammalia sprang.\n\nHis explanation runs: -- \"The fact that various accessory organs proper to each sex, are found in a rudimentary condition in the opposite sex may be explained by such organs having been gradually acquired by the one sex and then transmitted in a more or less imperfect condition to the other.\" He instances the case of \"spurs, plumes, and brilliant colours, acquired for battle or for ornament by male birds\" and only partially inherited by their female descendants.\n\nIn the problem to be dealt with, however, the need of a more satisfactory explanation is evident, the facts being of so much more prominent and important a character than the mere superficial details with which they are compared by Darwin.\n\nWhy not candidly admit the argument in favour of the hermaphroditism which characterises the old fauna?\n\nOccultism proposes a solution which embraces the facts in a most comprehensive and simple manner.\n\nThese relics of a prior androgyne stock must be placed in the same category as the pineal gland, and other organs as mysterious, which afford us silent testimony as to the reality of functions which have long since become atrophied in the course of animal and human progress, but which once played a signal part in the general economy of primeval life.\n\nThe occult doctrine, anyhow, can be advantageously compared with that of the most liberal men of science, who have theorised upon the origin of the first man.\n\nLong before Darwin, Naudin, who gave the name of Blastema to that which the Darwinists call protoplasm, put forward a theory half occult and half scientifico-materialistic."


[content]
body = "Descartes' plenum of matter differentiated into particles; Leibnitz's Ethereal Fluid and Kant's \"primitive fluid\" dissolved into its elements; Kepler's Solar Vortex and Systemic Vortices; in short, from the Elemental Vortices inaugurated by the universal mind -- through Anaxagoras, down to Galileo, Torricelli, and Swedenborg, and after them to the latest speculations by European mystics -- all this is found in the Hindu hymns and Mantras to the \"Gods, Monads, and Atoms,\" in their fulness, for they are inseparable.\n\nIn esoteric teachings, the most transcendental conceptions of the universe and its mysteries, as the most (seemingly) materialistic speculations are found reconciled, because those sciences embrace the whole scope of evolution from Spirit to matter.\n\nAs declared by an American Theosophist, \"The Monads (of Leibnitz) may from one point of view be called force , from another matter.\n\nTo occult Science, force and matter are only two sides of the same SUBSTANCE.\" (\"Path,\" No.\n\n10, p.\n\n297.) Let the reader remember these \"Monads\" of Leibnitz, every one of which is a living mirror of the universe, every monad reflecting every other, and compare this view and definition with certain Sanskrit stanzas ( Slokas ) translated by Sir William Jones, in which it is said that the creative source of the Divine Mind, .\n\n.\n\n.\n\n\"Hidden in a veil of thick darkness, formed mirrors of the atoms of the world, and cast reflection from its own face on every atom.\n\n.\n\n.\n\n.\n\n.\" When, therefore, Professor Crookes declares that \"If we can show how the so-called chemical elements might have been generated we shall be able to fill up a formidable gap in our knowledge of the universe, .\n\n.\n\n.\" the answer is ready.\n\nThe theoretical knowledge is contained in the esoteric meaning of every Hindu cosmogony in the Puranas; the practical demonstration thereof -- is in the hands of those who will not be recognised in this century, save by the very few.\n\nThe scientific possibilities of various discoveries, that must inexorably lead exact Science into the acceptation of Eastern Occult views, which contain all the requisite material for the filling of those \"gaps,\" are, so far, at the mercy of modern materialism.\n\nIt is only by working in the direction [[Vol.\n\n1, Page]] 624 THE SECRET DOCTRINE.\n\ntaken by Professor Crookes that there is any hope for the recognition of a few, hitherto Occult, truths.\n\nMeanwhile, one thirsting to have a glimpse at a practical diagram of the evolution of primordial matter, which, separating and differentiating under the impulse of cyclic law, divides itself into a septenary gradation of S UBSTANCE (from a general view), can do no better than examine the plates attached to Mr.\n\nCrookes' lecture: \"Genesis of the Elements,\" and ponder well over some passages of the text.\n\nIn one place (p.\n\n11) he says: -- \".\n\n.\n\n.\n\n.\n\nOur notions of a chemical element have expanded.\n\nHitherto the molecule has been regarded as an aggregate of two or more atoms, and no account has been taken of the architectural design on which these atoms have been joined.\n\nWe may consider that the structure of a chemical element is more complicated than has hitherto been supposed.\n\nBetween the molecules we are accustomed to deal with in chemical reactions and ultimate atoms as first created, come smaller molecules or aggregates of physical atoms; then sub-molecules differ one from the other, according to the position they occupied in the yttrium edifice.\" \"Perhaps this hypothesis can be simplified if we imagine yttrium to be represented by a five-shilling piece.\n\nBy chemical fractionation I have divided it into five separate shillings, and find that these shillings are not counterparts, but like the carbon atoms in the benzol ring, have the impress of their position, 1, 2, 3, 4, 5, stamped on them.\n\n.\n\n.\n\n.\n\nIf I throw my shillings into the melting-pot or dissolve them chemically, the mint stamp disappears and they all turn out to be silver.\" .\n\n.\n\n.\n\nThis will be the case with all the atoms and molecules when they have separated from their compound forms and bodies -- when pralaya sets in.\n\nReverse the case, and imagine the dawn of a new manvantara.\n\nThe pure \"silver\" of the absorbed material will once more separate into SUBSTANCE, which will generate \"Divine Essences\" whose \"principles\"* are the primary elements, the sub-elements, the physical energies and subjective and objective matter; or, as these are epitomised -- GODS, MONADS, and ATOMS.\n\nIf leaving for one moment the metaphysical or transcendental side of the question, -- dropping out of the present consideration the supersensuous and intelligent beings and entities believed in by the Kabalists and Christians -- we turn to the atomical theory of evolution, the occult teachings are still found corroborated by exact Science and its confessions, as far, at least, as regards the supposed \"simple\" elements, now suddenly [[Footnote(s)]] ------------------------------------------------- * Corresponding on the cosmic scale with the Spirit, Soul-mind, Life, and the three Vehicles -- the astral, the Mayavic and the physical bodies (of mankind) whatever division is made.\n\n[[Vol.\n\n1, Page]] 625 HERMES OR HUXLEY?\n\ndegraded into poor and distant relatives -- not even second cousins to the latter.\n\nFor we are told by Prof.\n\nCrookes that: \"Hitherto, it has been considered that if the atomic weight of a metal, determined by different observers, setting out from different compounds, was always found to be constant .\n\n.\n\n.\n\nthen such metal must rightly take rank among the simple or elementary bodies.\n\nWe learn .\n\n.\n\n.\n\nthat this is no longer the case.\n\nAgain, we have here wheels within wheels.\n\nGadolinium is not an element but a compound.\n\n.\n\n.\n\nWe have shown that yttrium is a complex of five or more new constituents.\n\nAnd who shall venture to gainsay that each of these constituents, if attacked in some different manner, and if the result were submitted to a test more delicate and searching than the radiant-matter test, might not be still further divisible?\n\nWhere, then, is the actual ultimate element?\n\nAs we advance it recedes like the tantalizing mirage lakes and groves seen by the tired and thirsty traveller in the desert.\n\nAre we in our quest for truth to be thus deluded and baulked?\n\nThe very idea of an element, as something absolutely primary and ultimate, seems to be growing less and less distinct.\n\n.\n\n.\" (p.\n\n16).\n\nOn page 429 of Isis Unveiled , Vol.\n\nI., we said that \"the mystery of first creation, which was ever the despair of Science, is unfathomable unless they (the Scientists) accept the doctrine of Hermes.\n\nThey will have to follow in the footsteps of the Hermetists.\n\n\" Our prophecy begins to assert itself.\n\nBut between Hermes and Huxley there is a middle course and point."


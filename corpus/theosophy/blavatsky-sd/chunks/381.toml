body = "T HE B REATH NEEDED THE SPIRIT OF LIFE; THE SOLAR LHAS BREATHED IT INTO ITS FORM.\n\nTHE BREATH NEEDED A MIRROR OF ITS BODY ( astral shadow ); \" W E GAVE IT OUR OWN,\" SAID THE D HYANIS.\n\nT HE BREATH NEEDED A VEHICLE OF DESIRES ( Kama Rupa ); \" I T HAS IT,\" SAID THE D RAINER OF W ATERS ( Suchi, the fire of passion and animal instinct ) .\n\nT HE BREATH NEEDS A MIND TO EMBRACE THE U NIVERSE; \" W E CANNOT GIVE THAT,\" SAID THE F ATHERS.\n\n\" I NEVER HAD IT,\" SAID THE S PIRIT OF THE E ARTH.\n\n\" T HE FORM WOULD BE CONSUMED WERE I TO GIVE IT MINE,\" SAID THE G REAT ( solar ) F IRE .\n\n.\n\n.\n\n.\n\n( nascent ) M AN REMAINED AN EMPTY, SENSELESS B HUTA .\n\n.\n\n.\n\n.\n\nT HUS HAVE THE BONELESS GIVEN LIFE TO THOSE WHO BECAME ( later ) MEN WITH BONES IN THE THIRD ( race ) ( a ) .\n\nAs a full explanation is found in Stanza V.\n\n( Vide paragraph ( a )), a few remarks will now suffice.\n\nThe \"Father\" of primitive physical man, or of his body, is the vital electric principle residing in the Sun.\n\nThe Moon is its Mother, because of that mysterious power in the Moon which has as decided an influence upon human gestation and generation, which it regulates, as it has on the growth of plants and animals.\n\nThe \"Wind\" or Ether, standing in this case for the agent of transmission by which those influences are carried down from the two luminaries and diffused upon Earth, is referred to as the \"nurse\"; while \"Spiritual Fire\" alone makes of man a divine and perfect entity.\n\nNow what is that \"Spiritual Fire\"?\n\nIn alchemy it is HYDROGEN, in general; while in esoteric actuality it is the emanation or the Ray which proceeds from its noumenon, the \"Dhyan of the first Element.\" Hydrogen is gas only on our terrestrial plane.\n\nBut even in chemistry hydrogen \"would be the only existing form of matter, in our sense of the term,\"* and is very nearly allied to protyle, which is our layam.\n\nIt is the father and generator, so to say, or rather the Upadhi (basis), of both AIR and WATER, and is \"fire, air and water,\" in fact: one under three aspects; hence the chemical and alchemical trinity.\n\nIn the world of manifestation or matter it is the objective symbol and the material emanation from the subjective and purely spiritual entitative Being in the region of noumena.\n\nWell might Godfrey Higgins have compared Hydrogen to, and even identified it with, the To ON, the \"One\" of the Greeks.\n\nFor, as he remarks, Hydrogen is not Water, though it generates it; Hydrogen is not fire, though it manifests or creates it; nor is it Air, though air may be regarded as a product of the union of Water and [[Footnote(s)]] ------------------------------------------------- * See \" Genesis of the Elements, \" by Prof.\n\nW.\n\nCrookes, p.\n\n21.\n\n[[Vol.\n\n2, Page]] 106 THE SECRET DOCTRINE.\n\nFire -- since Hydrogen is found in the aqueous element of the atmosphere.\n\nIt is three in one.\n\nIf one studies comparative Theogony, it is easy to find that the secret of these \"Fires\" was taught in the Mysteries of every ancient people, pre-eminently in Samothrace.\n\nThere is not the smallest doubt that the Kabeiri, the most arcane of all the ancient deities, gods and men, great deities and Titans, are identical with the Kumaras and Rudras headed by Kartikeya -- a Kumara also.\n\nThis is quite evident even exoterically; and these Hindu deities were, like the Kabeiri, the personified sacred Fires of the most occult powers of Nature.\n\nThe several branches of the Aryan Race, the Asiatic and the European, the Hindu and the Greek, did their best to conceal their true nature, if not their importance.\n\nAs in the case of the Kumaras, the number of the Kabeiri is uncertain.\n\nSome say that there were three or four only; others say seven.\n\nAschieros, Achiosersa, Achiochersus, and Camillus may very well stand for the alter egos of the four Kumaras -- Sanat-Kumara, Sananda, Sanaka, and Sanatana.\n\nThe former deities, whose reputed father was Vulcan, were often confounded with the Dioscuri, Corybantes, Anaces, etc.; just as the Kumara, whose reputed father is Brahma, (or rather, the \"Flame of his Wrath,\" which prompted him to perform the ninth or Kumara creation, resulting in Rudra or Nilalohita (Siva) and the Kumaras), were confounded with the Asuras, the Rudras, and the Pitris, for the simple reason that they are all one -- i.e.\n\n, correlative Forces and Fires.\n\nThere is no space to describe these \"fires\" and their real meaning here, though we may attempt to do so if the third and fourth volumes of this work are ever published.\n\nMeanwhile a few more explanations may be added.\n\nThe foregoing are all mysteries which must be left to the personal intuition of the student for solution, rather than described.\n\nIf he would learn something of the secret of the FIRES, let him turn to certain works of the Alchemists, who very correctly connect fire with every element, as do the Occultists.\n\nThe reader must remember that the ancients considered religion, and the natural sciences along with philosophy, to be closely and inseparably linked together.\n\nAEsculapius was the Son of Apollo -- the Sun or FIRE of Life; at once Helios, Pythios, and the god of oracular Wisdom.\n\nIn exoteric religions, as much as in esoteric philosophy, the Elements -- especially fire, water, and air -- are made the progenitors of our five physical senses, and hence are directly connected (in an occult way) with them.\n\nThese physical senses pertain even to a lower creation than the one called in the Puranas Pratisarga, or secondary Creation.\n\n\"Liquid fire proceeds from indiscrete fire,\" says an Occult axiom.\n\n\"The Circle is the THOUGHT; the diameter (or the line) is the WORD; [[Vol.\n\n2, Page]] 107 BATH-KOL, DAUGHTER OF THE VOICE.\n\nand their union is LIFE.\" In the Kabala, Bath-Kol is the daughter of the Divine Voice, or primordial light, Shekinah.\n\nIn the Puranas and Hindu exotericism, Vach (the Voice) is the female Logos of Brahma -- a permutation of Aditi, primordial light."


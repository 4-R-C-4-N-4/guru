body = "Thus \" S ATAN,\" once he ceases to be viewed in the superstitious, dogmatic, unphilosophical spirit of the Churches, grows into the grandiose image of one who made of terrestrial a divine MAN; who gave him, throughout the long cycle of Maha-kalpa the law of the Spirit of Life, and made him free from the Sin of Ignorance, hence of death.\n\n(See the Section On Satan in Part II.\n\nVol.\n\nII.) [[Footnote(s)]] ------------------------------------------------- * Jehovah's connection with the moon in the Kabala is well known to students.\n\n** About the Nazarenes see Isis , Vol.\n\nII.\n\np .\n\n131 and 132; the true followers of the true Christos were all Nazarenes and Christians, and were the opponents of the later Christians.\n\n*** Vide supra , the diagram of the lunar ring of seven worlds, where, as in our or any other chain, the upper worlds are spiritual, while the lowest, whether Moon, Earth, or any planet, is dark with matter.\n\n[[Vol.\n\n1, Page]] 199 THE SEVEN PLANES.\n\nSTANZA VI.\n\n-- Continued.\n\n6.\n\nT HE OLDER WHEELS ROTATED DOWNWARD AND UPWARD ( a ).\n\n.\n\n.\n\n.\n\nT HE M OTHER'S SPAWN FILLED THE WHOLE ( Kosmos ) .* T HERE WERE BATTLES FOUGHT BETWEEN THE C REATORS AND THE D ESTROYERS, AND BATTLES FOUGHT FOR S PACE; THE SEED APPEARING AND REAPPEARING CONTINUOUSLY ( b ).** ( a ) Here, having finished for the time being with our side-issues -- which, however they may break the flow of the narrative, are necessary for the elucidation of the whole scheme -- the reader must return once more to Cosmogony.\n\nThe phrase \"Older wheels\" refers to the worlds or Globes of our chain as they were during the \"previous Rounds.\" The present Stanza, when explained esoterically, is found embodied entirely in the Kabalistic works.\n\nTherein will be found the very history of the evolution of those countless Globes which evolve after a periodical Pralaya, rebuilt from old material into new forms.\n\nThe previous Globes disintegrate and reappear transformed and perfected for a new phase of life.\n\nIn the Kabala, worlds are compared to sparks which fly from under the hammer of the great Architect -- LAW, the law which rules all the smaller Creators.\n\nThe following comparative diagram shows the identity between the two systems, the Kabalistic and the Eastern.\n\nThe three upper are the three higher planes of consciousness, revealed and explained in both schools only to the Initiates, the lower ones represent the four lower planes -- the lowest being our plane, or the visible Universe.\n\nThese seven planes correspond to the seven states of consciousness in man.\n\nIt remains with him to attune the three higher states in himself to the three higher planes in Kosmos.\n\nBut before he can attempt to attune, he must awaken the three \"seats\" to life and activity.\n\nAnd how many are capable of bringing themselves to even a superficial comprehension of Atma-Vidya (Spirit-Knowledge), or what is called by the Sufis, Rohanee!\n\nIn Section the VII th of this Book, in Sub-section 3, [[Footnote(s)]] ------------------------------------------------- * The reader is reminded that Kosmos often means in our Stanzas only our own Solar System, not the Infinite Universe.\n\n** This is purely astronomical.\n\n[[Vol.\n\n1, Page]] 200 THE SECRET DOCTRINE.\n\nthe reader will find a still clearer explanation of the above in the Commentary upon Saptaparna -- the man-plant.\n\nSee also the Section of that name in Part II.\n\n[[Footnote(s) to diagram ------------------------------------------------- ]] * The Arupa or \"formless,\" there where form ceases to exist, on the objective plane.\n\n† The word \"Archetypal\" must not be taken here in the sense that the Platonists gave to it, i.e.\n\n, the world as it existed in the Mind of the Deity; but in that of a world made as a first model, to be followed and improved upon by the worlds which succeed it physically -- though deteriorating in purity.\n\n‡ These are the four lower planes of Cosmic Consciousness, the three higher planes being inaccessible to human intellect as developed at present.\n\nThe seven states of human consciousness pertain to quite another question.\n\n------------- ( b ) \"The Seed appears and disappears continuously.\" Here \"Seed\" stands for \"the World-germ,\" viewed by Science as material particles in a highly attenuated condition, but in Occult physics as \"Spiritual particles,\" i.e.\n\n, supersensuous matter existing in a state of primeval [[Vol.\n\n1, Page]] 201 NO SHADOW, NO LIGHT.\n\ndifferentiation.* In theogony, every Seed is an ethereal organism, from which evolves later on a celestial being, a God.\n\nIn the \"beginning,\" that which is called in mystic phraseology \"Cosmic Desire \" evolves into absolute Light.\n\nNow light without any shadow would be absolute light -- in other words, absolute darkness -- as physical science seeks to prove.\n\nThat shadow appears under the form of primordial matter, allegorized -- if one likes -- in the shape of the Spirit of Creative Fire or Heat.\n\nIf, rejecting the poetical form and allegory, science chooses to see in this the primordial Fire-Mist, it is welcome to do so.\n\nWhether one way or the other, whether Fohat or the famous FORCE of Science, nameless, and as difficult of definition as our Fohat himself, that Something \"caused the Universe to move with circular motion,\" as Plato has it; or, as the Occult teaching expresses it: \" The Central Sun causes Fohat to collect primordial dust in the form of balls , to impel them to move in converging lines and finally to approach each other and aggregate.\n\n\" ( Book of Dzyan ) .\n\n.\n\n.\n\n.\n\n.\n\n\" Being scattered in Space , without order or system , the world-germs come into frequent collision until their final aggregation , after which they become wanderers ( Comets ) .\n\nThen the battles and struggles begin.\n\nThe older ( bodies ) attract the younger , while others repel them.\n\nMany perish , devoured by their stronger companions.\n\nThose that escape become worlds.\n\n\" ** [[Footnote(s)]] ------------------------------------------------- * To see and appreciate the difference -- the immense gulf that separates terrestrial matter from the finer grades of supersensuous matter -- every astronomer, every chemist and physicist ought to be a psychometer , to say the least; he ought to be able to sense for himself that difference in which he now refuses to believe.\n\nMrs.\n\nElizabeth Denton, one of the most learned, and also one of the most materialistic and sceptical women of her age -- the wife of Professor Denton, the well-known American geologist and the author of \"The Soul of Things\" -- was, nevertheless, one of the most wonderful psychometers some years ago."


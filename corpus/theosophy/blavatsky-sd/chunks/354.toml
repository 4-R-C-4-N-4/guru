body = "And \"primitive man acted in the same manner independently of time or locality in every age,\" observes a French writer.\n\n[[Vol.\n\n2, Page]] 51 WHAT THE EARTH-WHIRL PRODUCED.\n\ntioned was compiled by two very learned Brahmins* in 1884 and 1885.\n\nThe work is proclaimed by the best Pundits as faultless -- from the Brahmanical standpoint -- and thus far relates to the chronology of the orthodox teachings.\n\nIf we compare its statements with those made several years earlier in \"Isis Unveiled,\" with the fragmentary teachings published by some Theosophists, and with the present data derived from the Secret Books of Occultism, the whole will be found to agree perfectly, save in some details which may not be explained; for secrets of higher Initiation -- as unknown to the writer as they are to the reader -- would have to be revealed, and that cannot be done.\n\n(But see \" Chronology of the Brahmins \" at the close of Stanza II .) [[Footnote(s)]] ------------------------------------------------- * The \" Tirukkanda Panchanga \" for the Kali Yug 4986, by Chintamany Raghanaracharya, son of the famous Government astronomer of Madras, and Tartakamala Venkata Krishna Rao.\n\n--------"


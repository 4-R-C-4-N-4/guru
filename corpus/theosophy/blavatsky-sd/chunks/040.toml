body = "-- Continued .\n\n5.\n\nT HE S EVEN ( Sons ) WERE NOT YET BORN FROM THE W EB OF L IGHT.\n\nD ARKNESS ALONE WAS F ATHER- M OTHER, S VABHAVAT, AND S VABHAVAT WAS IN DARKNESS ( a ).\n\n( a ) The Secret Doctrine, in the Stanzas given here, occupies itself chiefly, if not entirely, with our Solar System, and especially with our planetary chain.\n\nThe \"Seven Sons,\" therefore, are the creators of the latter.\n\nThis teaching will be explained more fully hereafter.\n\n(See Part II., \"Theogony of the Creative Gods.\") [[Vol.\n\n1, Page]] 61 DIVINE THOUGHT, DIVINE THINKERS.\n\nSvabhavat, the \"Plastic Essence\" that fills the Universe, is the root of all things.\n\nSvabhavat is, so to say, the Buddhistic concrete aspect of the abstraction called in Hindu philosophy Mulaprakriti.\n\nIt is the body of the Soul, and that which Ether would be to Akasa, the latter being the informing principle of the former.\n\nChinese mystics have made of it the synonym of \"being.\" In the Ekasloka-Shastra of Nagarjuna (the Lung-shu of China) called by the Chinese the Yih-shu-lu-kia-lun , it is said that the original word of Yeu is \"Being\" or \"Subhava,\" \"the Substance giving substance to itself,\" also explained by him as meaning \" without action and with action,\" \"the nature which has no nature of its own.\" Subhava , from which Svabhavat , is composed of two words: Su \"fair,\" \"handsome,\" \"good\"; Sva, \"self\"; and bhava, \"being\" or \"states of being.\" ------- STANZA II.\n\n-- Continued .\n\n6.\n\nT HESE TWO ARE THE G ERM, AND THE G ERM IS -- ONE.\n\nT HE U NIVERSE WAS STILL CONCEALED IN THE D IVINE T HOUGHT AND THE D IVINE B OSOM.\n\nThe \" Divine Thought \" does not imply the idea of a Divine thinker.\n\nThe Universe, not only past, present, and future -- which is a human and finite idea expressed by finite thought -- but in its totality, the Sat (an untranslateable term), the absolute being, with the Past and Future crystallized in an eternal Present, is that Thought itself reflected in a secondary or manifest cause.\n\nBrahma (neuter) as the Mysterium Magnum of Paracelsus is an absolute mystery to the human mind.\n\nBrahma, the male-female, its aspect and anthropomorphic reflection, is conceivable to the perceptions of blind faith, though rejected by human intellect when it attains its majority.\n\n(See Part II., \"Primordial Substance and Divine Thought.\") Hence the statement that during the prologue, so to say, of the drama of Creation, or the beginning of cosmic evolution, the Universe or the \"Son\" lies still concealed \"in the Divine Thought,\" which had not yet penetrated \"into the Divine Bosom.\" This idea, note well, is at the root, and forms the origin of all the allegories about the \"Sons of God\" born of immaculate virgins."


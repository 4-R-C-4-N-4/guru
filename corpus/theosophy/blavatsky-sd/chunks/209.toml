body = "The whole Kosmos in its objective form is Vaikhari Vach; the light of the Logos is the madhyama form; and the Logos itself the pasyanti form; while Parabrahmam is the para (beyond the noumenon of all Noumena ) aspect of that Vach.\" ( Notes on the Bhagavad-Gita ) .\n\nThus Vach, Shekinah, or the \"music of the spheres\" of Pythagoras, are one, if we take for our example instances in the three most (apparently) dissimilar religious philosophies in the world -- the Hindu, the Greek and the Chaldean Hebrew.\n\nThese personations and allegories may be viewed under four (chief) and three (lesser) aspects or seven in all, as in Esotericism.\n\nThe para form is the ever subjective and latent Light and Sound, which exist eternally in the bosom of the INCOGNISABLE; when transferred into the ideation of the Logos, or its latent light , it is called pasyanti , and when it becomes that light expressed , it is madhyama.\n\nNow the Kabala gives the definition thus: \"There are three kinds of light, and that (fourth) which interpenetrates the others; (1) the clear and the penetrating, the objective light , (2) the reflected light, and (3) the abstract light.\n\nThe ten Sephiroth, the three and the Seven, are called in the Kabala the 10 words, D-BRIM (Dabarim), the numbers and the Emanations of the heavenly light, which is both Adam Kadmon and Sephira, or (Brahma) Prajapati-Vach.\n\nLight, Sound, Number, are the three factors of creation in the Kabala.\n\nParabrahmam cannot be known except through the luminous Point (the L OGOS), which knows not Parabrahmam but only Mulaprakriti.\n\nSimilarly Adam Kadmon knew only Shekinah, though he was the vehicle of Ain-Soph.\n\nAnd, as Adam Kadmon, he is in the esoteric interpretation the total of the number ten, the Sephiroth (himself a trinity, or the three attributes of the [[Footnote(s)]] ------------------------------------------------- * Pranava , like Om , is a mystic term pronounced by the Yogis during meditation; of the terms called, according to exoteric Commentators, Vyahritis , or \"Om, Bhur , Bhuva , Swar \" (Om, earth, sky, heaven) -- Pranava is the most sacred, perhaps.\n\nThey are pronounced with breath suppressed.\n\nSee Manu II.\n\n76-81, and Mitakshara commenting on the Yajnavahkya-Suriti , i.\n\n23.\n\nBut the esoteric explanation goes a great deal further.\n\n[[Vol.\n\n1, Page]] 433 THE PYTHAGOREAN IDEA.\n\nincognisable D EITY in One).* \"When the Heavenly man (or L OGOS) first assumed the form of the Crown** (Kether) and identified himself with Sephira, he caused seven splendid lights to emanate from it (the Crown),\" which made in their totality ten; so the Brahma-Prajapati, once he became separated from, yet identical with Vach, caused the seven Rishis, the seven Manus or Prajapatis to issue from that crown.\n\nIn Exotericism one will always find 10 and 7, of either Sephiroth or Prajapati; in Esoteric rendering always 3 and 7, which yield also 10.\n\nOnly when divided in the manifested sphere into 3 and 7, they form , the androgyne, and , or the figure X manifested and differentiated.\n\nThis will help the student to understand why Pythagoras esteemed the Deity (the Logos) to be the centre of unity and \"Source of Harmony.\" We say this Deity was the Logos , not the MONAD that dwelleth in Solitude and Silence, because Pythagoras taught that UNITY being indivisible is no number.\n\nAnd this is also why it was required of the candidate, who applied for admittance into his school, that he should have already studied as a preliminary step, the Sciences of Arithmetic, Astronomy, Geometry and Music , held as the four divisions of Mathematics.*** Again, this explains why the Pythagoreans asserted that the doctrine of Numbers -- the chief of all in Esotericism -- had been revealed to man by the celestial deities; that the world had been called forth out of Chaos by Sound or Harmony, and constructed according to the principles of musical proportion; that the seven planets which rule the destiny of mortals have a harmonious motion \"and intervals corresponding to musical diastemes, rendering various sounds, so perfectly consonant, that they produce the sweetest melody, which is inaudible to us, only by reason of the greatness of the sound, which our ears are incapable of receiving.\" ( Censorinus.\n\n) In the Pythagorean Theogony the hierarchies of the heavenly Host and Gods were numbered and expressed numerically.\n\nPythagoras had studied Esoteric Science in India; therefore we find his pupils saying \"The monad (the manifested one) is the principle of all things.\n\nFrom the Monad and the indeterminate duad (Chaos), numbers; from [[Footnote(s)]] ------------------------------------------------- * It is this trinity that is meant by the \"three steps of Vishnu\"; which means: (Vishnu being considered as the Infinite in exotericism) -- that from the Parabrahm issued Mulaprakriti, Purusha (the Logos), and Prakriti: the four forms (with itself, the synthesis) of Vach.\n\nAnd in the Kabala -- Ain-Soph, Shekinah, Adam Kadmon and Sephirah, the four -- or the three emanations being distinct -- yet ONE.\n\n** Chaldean Book of Numbers.\n\nIn the current Kabala the name Jehovah replaces Adam Kadmon.\n\n*** Justin Martyr tells us that, owing to his ignorance of these four sciences, he was rejected by the Pythagoreans as a candidate for admission into their school.\n\n[[Vol.\n\n1, Page]] 434 THE SECRET DOCTRINE.\n\nnumbers, Points ; from points, Lines ; from lines, Superficies; from superficies, Solids; from these, solid Bodies, whose elements are four -- Fire, Water, Air, Earth; of all which transmuted (correlated), and totally changed, the world consists.\" -- (Diogenes Laertius in Vit.\n\nPythag.\n\n) And this may also, if it does not unriddle the mystery altogether, at any rate lift a corner of the veil off those wondrous allegories that have been thrown upon Vach, the most mysterious of all the Brahmanical goddesses, she who is termed \"the melodious cow who milked forth sustenance and water\" (the Earth with all her mystic powers); and again she \"who yields us nourishment and sustenance\" (physical Earth)."


[content]
body = "There are two esoteric schools -- or rather one school, divided into two parts -- one for the inner Lanoos, the other for the outer or semi-lay chelas beyond the Himalayas; the first teaching a septenary, the other a six-fold division of human principles.\n\nFrom a Cosmic point of view, Fohat taking \"five strides\" refers here to the five upper planes of Consciousness and Being, the sixth and the seventh (counting downwards) being the astral and the terrestrial, or the two lower planes.\n\n( b ) \"Four winged wheels at each corner .\n\n.\n\n.\n\n.\n\n.\n\nfor the four holy ones and their armies (hosts)\" .\n\n.\n\n.\n\n.\n\n.\n\nThese are the \"four Maharajahs\" or great Kings of the Dhyan-Chohans, the Devas who preside, each over one of the four cardinal points.\n\nThey are the Regents or Angels who rule over the Cosmical Forces of North, South, [[Footnote(s)]] ------------------------------------------------- * The four aspects are the body, its life or vitality, and the \"Double\" of the body, the triad which disappears with the death of the person, and the Kama-rupa which disintegrates in Kama-loka.\n\n[[Vol.\n\n1, Page]] 123 THE SECRET OF THE ELEMENTS.\n\nEast and West, Forces having each a distinct occult property.\n\nThese BEINGS are also connected with Karma, as the latter needs physical and material agents to carry out her decrees, such as the four kinds of winds, for instance, professedly admitted by Science to have their respective evil and beneficent influences upon the health of Mankind and every living thing.\n\nThere is occult philosophy in that Roman Catholic doctrine which traces the various public calamities, such as epidemics of disease, and wars, and so on, to the invisible \"Messengers\" from North and West.\n\n\"The glory of God comes from the way of the East\" says Ezekiel; while Jeremiah, Isaiah, and the Psalmist assure their readers that all the evil under the Sun comes from the North and the West -- which proposition, when applied to the Jewish nation, sounds like an undeniable prophecy for themselves.\n\nAnd this accounts also for St.\n\nAmbrose (On Amos, ch.\n\niv.) declaring that it is precisely for that reason that \"we curse the North-Wind, and that during the ceremony of baptism we begin by turning towards the West (Sidereal), to renounce the better him who inhabits it; after which we turn to the East.\" Belief in the \"Four Maharajahs\" -- the Regents of the Four cardinal points -- was universal and is now that of Christians,* who call them, after St.\n\nAugustine, \"Angelic Virtues,\" and \"Spirits\" when enumerated by themselves, and \"Devils\" when named by Pagans.\n\nBut where is the difference between the Pagans and the Christians in this cause?\n\nFollowing Plato, Aristotle explained that the term [[ stoicheia ]] was understood only as meaning the incorporeal principles placed at each of the four great divisions of our Cosmical world to supervise them.\n\nThus, no more than the Christians did, do they adore and worship the Elements and the cardinal (imaginary) points, but the \"gods\" that ruled these respectively.\n\nFor the Church there are two kinds of Sidereal beings, the [[Footnote(s)]] ------------------------------------------------- * Says the scholarly Vossius, in his Theol.\n\nCir.\n\nI.\n\nVII.: \"Though St.\n\nAugustine has said that every visible thing in this world had an angelic virtue as an overseer near it, it is not individuals but entire species of things that must be understood, each such species having indeed its particular angel to watch it.\n\nHe is at one in this with all the philosophers .\n\n.\n\n.\n\nFor us these angels are spirits separated from the objects .\n\n.\n\n.\n\nwhereas for the philosophers (pagan) they were gods.\" Considering the Ritual established by the Roman Catholic Church for \"Spirits of the Stars,\" the latter look suspiciously like \"Gods,\" and were no more honoured and prayed to by the ancient and modern pagan rabble than they are now at Rome by the highly cultured Catholic Christians.\n\n[[Vol.\n\n1, Page]] 124 THE SECRET DOCTRINE.\n\nAngels and the Devils.\n\nFor the Kabalist and Occultist there is but one; and neither of them makes any difference between \"the Rectors of Light\" and the Cosmocratores, or \"Rectores tenebrarum harum,\" whom the Roman Church imagines and discovers in a \"Rector of Light\" as soon as he is called by another name than the one she addresses him by.\n\nIt is not the \"Rector\" or \"Maharajah\" who punishes or rewards, with or without \"God's\" permission or order, but man himself -- his deeds or Karma, attracting individually and collectively (as in the case of whole nations sometimes), every kind of evil and calamity.\n\nWe produce CAUSES, and these awaken the corresponding powers in the sidereal world; which powers are magnetically and irresistibly attracted to -- and react upon -- those who produced these causes; whether such persons are practically the evil-doers, or simply Thinkers who brood mischief.\n\nThought is matter,* we are taught by modern Science; and \"every particle of the existing matter must be a register of all that has happened,\" as in their \" Principles of Science \" Messrs.\n\nJevons and Babbage tell the profane.\n\nModern Science is drawn more every day into the maelstrom of Occultism; unconsciously, no doubt, still very sensibly.\n\nThe two main theories of science -- re the relations between Mind and Matter -- are Monism and Materialism.\n\nThese two cover the whole ground of negative psychology with the exception of the quasi-occult views of the pantheistic German schools.** [[Footnote(s)]] ------------------------------------------------- * Not of course in the sense of the German Materialist Moleschott, who assures us that \"Thought is the movement of matter,\" a statement of almost unequalled absurdity.\n\nMental states and bodily states are utterly contrasted as such.\n\nBut that does not affect the position that every thought, in addition to its physical accompaniment (brain-change), exhibits an objective -- though to us supersensuously objective -- aspect on the astral plane.\n\n(See \"The Occult World,\" pp.\n\n89, 90.) ** The views of our present-day scientific thinkers as to the relations between mind and matter may be reduced to two hypotheses.\n\nThese show that both views equally exclude the possibility of an independent Soul, distinct from the physical brain through which it functions.\n\nThey are: -- (1.) M ATERIALISM, the theory which regards mental phenomena as the product of molecular change in the brain; i.e.\n\n, as the outcome of a transformation of motion into feeling (!).\n\nThe cruder school once went so far as to identify mind with a \"peculiar mode of motion\" (!!), but this view is now happily regarded as absurd by most of the men of science themselves."


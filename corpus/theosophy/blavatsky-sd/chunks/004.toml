[content]
body = "\"When Buddhi absorbs our E GOtism (destroys it) with all its Vikaras, Avalokiteshvara becomes manifested to us, and Nirvana, or Mukti, is reached,\" \"Mukti\" being the same as Nirvana, i.e.\n\n, freedom from the trammels of \"Maya\" or illusion.\n\n\"Bodhi\" is likewise the name of a particular state of trance condition, called Samadhi, during which the subject reaches the culmination of spiritual knowledge.\n\nUnwise are those who, in their blind and, in our age, untimely hatred of Buddhism, and, by re-action, of \"Budhism,\" deny its esoteric teachings (which are those also of the Brahmins), simply because the name [[Vol.\n\n1, Page]] xx INTRODUCTORY.\n\nsuggests what to them, as Monotheists, are noxious doctrines.\n\nUnwise is the correct term to use in their case.\n\nFor the Esoteric philosophy is alone calculated to withstand, in this age of crass and illogical materialism, the repeated attacks on all and everything man holds most dear and sacred, in his inner spiritual life.\n\nThe true philosopher, the student of the Esoteric Wisdom, entirely loses sight of personalities, dogmatic beliefs and special religions.\n\nMoreover, Esoteric philosophy reconciles all religions, strips every one of its outward, human garments, and shows the root of each to be identical with that of every other great religion.\n\nIt proves the necessity of an absolute Divine Principle in nature.\n\nIt denies Deity no more than it does the Sun.\n\nEsoteric philosophy has never rejected God in Nature, nor Deity as the absolute and abstract Ens.\n\nIt only refuses to accept any of the gods of the so-called monotheistic religions, gods created by man in his own image and likeness, a blasphemous and sorry caricature of the Ever Unknowable.\n\nFurthermore, the records we mean to place before the reader embrace the esoteric tenets of the whole world since the beginning of our humanity, and Buddhistic occultism occupies therein only its legitimate place, and no more.\n\nIndeed, the secret portions of the \" Dan \" or Jan-na \" * (\" Dhyan \") of Gautama's metaphysics -- grand as they appear to one unacquainted with the tenets of the Wisdom Religion of antiquity -- are but a very small portion of the whole.\n\nThe Hindu Reformer limited his public teachings to the purely moral and physiological aspect of the Wisdom Religion, to Ethics and MAN alone.\n\nThings \"unseen and incorporeal,\" the mystery of Being outside our terrestrial sphere, the great Teacher left entirely untouched in his public lectures, reserving the hidden Truths for a select circle of his Arhats.\n\nThe latter received their Initiation at the famous Saptaparna cave (the Sattapanni of Mahavansa) near Mount Baibhar (the Webhara of the Pali MSS.).\n\nThis cave was in Rajagriha, the ancient capital of Mogadha, and was the Cheta cave of Fa-hian, as rightly suspected by some archaeologists.** Time and human imagination made short work of the purity and philo- [[Footnote(s)]] ------------------------------------------------- * Dan , now become in modern Chinese and Tibetan phonetics ch ' an , is the general term for the esoteric schools, and their literature.\n\nIn the old books, the word Janna is defined as \"to reform one's self by meditation and knowledge,\" a second inner birth.\n\nHence Dzan, Djan phonetically, the \"Book of Dzyan .\" ** Mr.\n\nBeglor, the chief engineer at Buddhagaya, and a distinguished archaeologist, was the first, we believe, to discover it.\n\n[[Vol.\n\n1, Page]] xxi INTRODUCTORY.\n\nsophy of these teachings, once that they were transplanted from the secret and sacred circle of the Arhats, during the course of their work of proselytism, into a soil less prepared for metaphysical conceptions than India; i.e.\n\n, once they were transferred into China, Japan, Siam, and Burmah.\n\nHow the pristine purity of these grand revelations was dealt with may be seen in studying some of the so-called \"esoteric\" Buddhist schools of antiquity in their modern garb, not only in China and other Buddhist countries in general, but even in not a few schools in Thibet, left to the care of uninitiated Lamas and Mongolian innovators.\n\nThus the reader is asked to bear in mind the very important difference between orthodox Buddhism -- i.e.\n\n, the public teachings of Gautama the Buddha, and his esoteric Budhism.\n\nHis Secret Doctrine, however, differed in no wise from that of the initiated Brahmins of his day.\n\nThe Buddha was a child of the Aryan soil; a born Hindu, a Kshatrya and a disciple of the \"twice born\" (the initiated Brahmins) or Dwijas.\n\nHis teachings, therefore, could not be different from their doctrines, for the whole Buddhist reform merely consisted in giving out a portion of that which had been kept secret from every man outside of the \"enchanted\" circle of Temple-Initiates and ascetics.\n\nUnable to teach all that had been imparted to him -- owing to his pledges -- though he taught a philosophy built upon the ground-work of the true esoteric knowledge, the Buddha gave to the world only its outward material body and kept its soul for his Elect.\n\n(See also Volume II.) Many Chinese scholars among Orientalists have heard of the \"Soul Doctrine.\" None seem to have understood its real meaning and importance.\n\nThat doctrine was preserved secretly -- too secretly, perhaps -- within the sanctuary.\n\nThe mystery that shrouded its chief dogma and aspirations -- Nirvana -- has so tried and irritated the curiosity of those scholars who have studied it, that, unable to solve it logically and satisfactorily by untying the Gordian knot, they cut it through, by declaring that Nirvana meant absolute annihilation.\n\nToward the end of the first quarter of this century, a distinct class of literature appeared in the world, which became with every year more defined in its tendency.\n\nBeing based, soi-disant, on the scholarly researches of Sanskritists and Orientalists in general, it was held scientific.\n\nHindu, Egyptian, and other ancient religions, myths, and emblems were made to yield anything the symbologist wanted them to [[Vol.\n\n1, Page]] xxii INTRODUCTORY.\n\nyield, thus often giving out the rude outward form in place of the inner meaning.\n\nWorks, most remarkable for their ingenious deductions and speculations, in circulo vicioso, foregone conclusions generally changing places with premisses as in the syllogisms of more than one Sanskrit and Pali scholar, appeared rapidly in succession, over-flooding the libraries with dissertations rather on phallic and sexual worship than on real symbology, and each contradicting the other.\n\nThis is the true reason, perhaps, why the outline of a few fundamental truths from the Secret Doctrine of the Archaic ages is now permitted to see the light, after long millenniums of the most profound silence and secrecy."


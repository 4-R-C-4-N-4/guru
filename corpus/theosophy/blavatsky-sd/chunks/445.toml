[content]
body = "He is called respectively, Dattoi, Dattali, Dattotti, Dattotri, Dattobhri, Dambhobhi and Dambholi -- which seven variants have each a secret sense, and refer in the esoteric comments to various ethnological classifications, and also to physiological and anthropological mysteries of the primitive races.\n\nFor, surely, the Rakshasas are not demons, but simply the primitive and ferocious giants, the Atlanteans, who were scattered on the face of the globe as the Fifth Race is now.\n\nVasishta is a warrant to this, if his words addressed to Parasara, who attempted a bit of JADOO (sorcery), which he calls \"sacrifice,\" for the destruction of the Rakshasas, mean anything.\n\nFor he says, \"Let no more of these unoffending ' Spirits Darkness ' be destroyed.\" ( see for details Adiparvan, s.\n\n176 , Mahabharata ; also the Linga Purana \" Purvardha, \" s.\n\n64.) ** We have a passage from a Master's letter which has a direct bearing upon these [[Footnote continued on next page]] [[Vol.\n\n2, Page]] 233 HOLY SATAN.\n\nThe true esoteric view about \"Satan,\" the opinion held on this subject by the whole philosophic antiquity, is admirably brought out in an appendix, entitled \"The Secret of Satan,\" to the second edition of Dr.\n\nA.\n\nKingsford's \"Perfect Way.\" No better and clearer indication of the truth could be offered to the intelligent reader, and it is therefore quoted here at some length: -- \"1.\n\nAnd on the seventh day (seventh creation of the Hindus),* there went forth from the presence of God a mighty Angel, full of wrath and consuming, and God gave him the dominion of the outermost sphere.** 2.\n\n\"Eternity brought forth Time; the Boundless gave birth to Limit; Being descended into generation.\"*** 4 .\n\n\" Among the Gods is none like unto him, into whose hands are committed the kingdoms, the power and the glory of the worlds:\" 5.\n\n\"Thrones and empires, the dynasties of kings,**** the fall of nations, the birth of churches, the triumph of Time.\" For, as is said in Hermes, \"Satan is the door-keeper of the Temple of the King ; he standeth in Solomon's porch; he holdeth the key of the Sanctuary, that no man enter therein, save the Anointed having the arcanum of Hermes\" (v.\n\n20 and 21).\n\nThese suggestive and majestic verses had reference with the ancient Egyptians and other civilized peoples of antiquity to the creative and generative light of the Logos (Horus, Brahma, Ahura-Mazda, etc., etc., as primeval manifestations of the ever-unmanifested Principle, e.g.\n\n, Ain-Soph, Parabrahm, or Zeruana Akerne-- Boundless Time -- Kala ), but the [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] incarnating angels.\n\nSays the letter: \"Now there are, and there must be, failures in the ethereal races of the many classes of Dhyan-Chohans, or Devas ( progressed entities of a previous planetary period), as well as among men.\n\nBut still, as the failures are too far progressed and spiritualized to be thrown back forcibly from Dhyan-Chohanship into the vortex of a new primordial evolution through the lower Kingdoms, this then happens.\n\nWhere a new solar system has to be evolved these Dhyan-Chohans are borne in by influx 'ahead' of the Elementals (Entities .\n\n.\n\n.\n\nto be developed into humanity at a future time) and remain as a latent or inactive spiritual force, in the aura of a nascent world .\n\n.\n\n.\n\nuntil the stage of human evolution is reached.\n\n.\n\n.\n\n.\n\nThen they become an active force and commingle with the Elementals, to develop little by little the full type of humanity.\n\n\" That is to say, to develop in, and endow man with his Self-conscious mind, or Manas.\n\n* When the earth with its planetary chain and man were to appear.\n\n** Our earth and the physical plane of consciousness.\n\n*** When the pure, celestial Being (Dhyan Chohan) and the great Pitris of various classes were commissioned -- the one to evolve their images ( Chhaya ), and make of them physical man, the others to inform and thus endow him with divine intelligence and the comprehension of the Mysteries of Creation.\n\n**** The \"dynasties of the kings\" who all regard themselves as the \"anointed,\" reigning \"by the Grace of God,\" whereas in truth, they reign by the grace of matter, the great Illusion, the Deceiver.\n\n[[Vol.\n\n2, Page]] 234 THE SECRET DOCTRINE.\n\nmeaning is now degraded in the Kabala.\n\nThe \"Anointed,\" who has the secrets and mysteries of Hermes ( Buddha, Wisdom), and who alone is entrusted with the key to the \"Sanctuary,\" the Womb of nature, in order to fructify it and call to active life and being the whole Kosmos, has become, with the Jews, Jehovah, the \"God of generation\" on the lunar mountain (Sinai, the mountain of the moon, \" Sin \") .\n\nThe \"Sanctuary\" has become the \"Holy of Holies,\" and the arcanum has been anthropomorphised and phallicised and dragged down into matter, indeed.\n\nHence arose the necessity of making of the \"Dragon of Wisdom,\" the Serpent of Genesis: of the conscious god who needed a body to clothe his too subjective divinity, Satan.\n\nBut the \"innumerable incarnations of Spirit,\" and \"the ceaseless pulse and current of desire\" refer, the first one, to our doctrine of Karmic and cyclic rebirths, the second -- to E ROS, not the later god of material, physiological love, but to the divine desire in the gods, as well as in all nature, to create and give life to Beings.\n\nThis, the Rays of the one \"dark,\" because invisible and incomprehensible, F LAME could achieve only by themselves descending into matter.\n\nTherefore, as continued in the A PPENDIX: 12.\n\n\"Many names hath God given him (Satan), names of mystery, secret and terrible.\" 13.\n\n\"The Adversary, because matter opposeth Spirit.\n\nTime accuseth even the Saints of the Lord.\" 28, 29, 31.\n\n\"Stand in awe of him, and sin not; speak his name with trembling .\n\n.\n\n.\n\n.\n\nFor Satan is the magistrate of the justice of God (Karma); he beareth the balance and the sword .\n\n.\n\n.\n\n.\n\nFor to him are committed Weight and Measure and Number."


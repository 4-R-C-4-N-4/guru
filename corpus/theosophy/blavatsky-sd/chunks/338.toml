body = "2, Page]] 17 THE SLOKAS OF \"DZYAN.\" IV.\n\n14.\n\nT HE S EVEN H OSTS, THE \" W ILL-BORN L ORDS,\" PROPELLED BY THE S PIRIT OF L IFE-GIVING, SEPARATE MEN FROM THEMSELVES, EACH ON HIS OWN ZONE.\n\n15.\n\nS EVEN TIMES SEVEN S HADOWS OF FUTURE MEN WERE BORN, EACH OF HIS OWN COLOUR AND KIND.\n\nE ACH INFERIOR TO HIS FATHER.\n\nT HE FATHERS, THE BONELESS, COULD GIVE NO LIFE TO BEINGS WITH BONES.\n\nT HEIR PROGENY WERE B HUTA, WITH NEITHER FORM NOR MIND.\n\nT HEREFORE THEY ARE CALLED THE C HHAYA.\n\n16.\n\nH OW ARE THE M ANUSHYA BORN?\n\nT HE M ANUS WITH MINDS, HOW ARE THEY MADE?\n\nT HE FATHERS CALLED TO THEIR HELP THEIR OWN FIRE; WHICH IS THE FIRE THAT BURNS IN E ARTH.\n\nT HE S PIRIT OF THE E ARTH CALLED TO HIS HELP THE S OLAR F IRE.\n\nT HESE THREE PRODUCED IN THEIR JOINT EFFORTS A GOOD R UPA.\n\nI T COULD STAND, WALK, RUN, RECLINE, OR FLY.\n\nY ET IT WAS STILL BUT A C HHAYA, A SHADOW WITH NO SENSE .\n\n.\n\n.\n\n.\n\n17.\n\nT HE BREATH NEEDED A FORM; T HE F ATHERS GAVE IT.\n\nT HE BREATH NEEDED A GROSS BODY; THE E ARTH MOULDED IT.\n\nT HE BREATH NEEDED THE S PIRIT OF L IFE; THE S OLAR L HAS BREATHED IT INTO ITS FORM.\n\nT HE BREATH NEEDED A M IRROR OF ITS B ODY; \" W E GAVE IT OUR OWN,\" SAID THE D HYANIS.\n\nT HE B REATH NEEDED A V EHICLE OF D ESIRES; \" I T HAS IT,\" SAID THE D RAINER OF W ATERS.\n\nB UT B REATH NEEDS A MIND TO EMBRACE THE U NIVERSE; \" W E CANNOT GIVE THAT,\" SAID THE F ATHERS.\n\n\" I NEVER HAD IT,\" SAID THE S PIRIT OF THE E ARTH.\n\n\" T HE FORM WOULD BE CONSUMED WERE I TO GIVE IT MINE,\" SAID THE G REAT F IRE .\n\n.\n\n.\n\n.\n\nM AN REMAINED AN EMPTY SENSELESS B HUTA .\n\n.\n\n.\n\n.\n\nT HUS HAVE THE BONELESS GIVEN LIFE TO THOSE WHO BECAME MEN WITH BONES IN THE THIRD.\n\n------- V.\n\n18.\n\nT HE FIRST WERE THE SONS OF Y OGA.\n\nT HEIR SONS THE CHILDREN OF THE Y ELLOW F ATHER AND THE W HITE M OTHER.\n\n19.\n\nT HE S ECOND R ACE WAS THE PRODUCT BY BUDDING AND [[Vol.\n\n2, Page]] 18 THE SECRET DOCTRINE.\n\nEXPANSION, THE A - S EXUAL FROM THE S EXLESS* -- T HUS WAS, O L ANOO, THE S ECOND R ACE PRODUCED.\n\n20.\n\nT HEIR FATHERS WERE THE SELF-BORN.\n\nT HE SELF-BORN, THE C HHAYA FROM THE BRILLIANT BODIES OF THE L ORDS, THE F ATHERS, THE S ONS OF T WILIGHT.\n\n21.\n\nW HEN THE R ACE BECAME OLD, THE OLD WATERS MIXED WITH THE FRESHER WATERS.\n\nW HEN ITS DROPS BECAME TURBID, THEY VANISHED AND DISAPPEARED IN THE NEW STREAM, IN THE HOT STREAM OF LIFE.\n\nT HE OUTER OF THE FIRST BECAME THE INNER OF THE SECOND.\n\nT HE OLD W ING BECAME THE NEW S HADOW, AND THE S HADOW OF THE W ING.\n\n------- VI.\n\n22.\n\nT HEN THE SECOND EVOLVED THE E GG-BORN, THE THIRD.\n\nT HE SWEAT GREW, ITS DROPS GREW, AND THE DROPS BECAME HARD AND ROUND.\n\nT HE S UN WARMED IT; THE M OON COOLED AND SHAPED IT; THE WIND FED IT UNTIL ITS RIPENESS.\n\nT HE WHITE SWAN FROM THE STARRY VAULT OVERSHADOWED THE BIG DROP.\n\nT HE EGG OF THE FUTURE RACE, THE M AN-SWAN OF THE LATER THIRD.\n\nF IRST MALE-FEMALE, THEN MAN AND WOMAN.\n\n23.\n\nT HE SELF-BORN WERE THE C HHAYAS: THE S HADOWS FROM THE BODIES OF THE S ONS OF T WILIGHT.\n\n------- VII.\n\n24.\n\nT HE S ONS OF W ISDOM, THE S ONS OF N IGHT, READY FOR REBIRTH, CAME DOWN, THEY SAW THE VILE FORMS OF THE F IRST T HIRD, \" W E CAN CHOOSE,\" SAID THE L ORDS, \"WE HAVE WISDOM.\" S OME ENTERED THE C HHAYA.\n\nS OME PROJECTED THE S PARK.\n\nS OME DEFERRED TILL THE F OURTH.\n\nF ROM THEIR OWN R UPA THEY FILLED THE K AMA.\n\nT HOSE WHO ENTERED BECAME A RHATS.\n\nT HOSE WHO RECEIVED BUT A SPARK, REMAINED DESTITUTE OF KNOWLEDGE; THE SPARK BURNED LOW.\n\nT HE THIRD REMAINED MIND-LESS.\n\nT HEIR J IVAS WERE NOT [[Footnote(s) -------------------------------------------------]] * The idea and the spirit of the sentence is here given, as a verbal translation would convey very little to the reader.\n\n[[Vol.\n\n2, Page]] 19 THE SLOKAS OF \"DZYAN.\" READY.\n\nT HESE WERE SET APART AMONG THE S EVEN.\n\nT HEY BECAME NARROW-HEADED.\n\nT HE T HIRD WERE READY.\n\n\" I N THESE SHALL WE DWELL,\" SAID THE L ORDS OF THE F LAME.\n\n25.\n\nH OW DID THE M ANASA, THE S ONS OF W ISDOM, ACT?\n\nT HEY REJECTED THE S ELF-BORN.\n\nT HEY ARE NOT READY.\n\nT HEY SPURNED THE S WEAT-BORN.\n\nT HEY ARE NOT QUITE READY.\n\nT HEY WOULD NOT ENTER THE FIRST E GG-BORN.\n\n26.\n\nW HEN THE S WEAT-BORN PRODUCED THE E GG-BORN, THE TWOFOLD AND THE MIGHTY, THE POWERFUL WITH BONES, THE L ORDS OF W ISDOM SAID: \" N OW SHALL WE CREATE.\" 27.\n\nT HE T HIRD R ACE BECAME THE V AHAN OF THE L ORDS OF W ISDOM."


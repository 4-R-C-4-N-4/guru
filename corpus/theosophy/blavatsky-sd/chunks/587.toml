[content]
body = "As said: \"The Christians -- far less clear-sighted than the great Mystic and Liberator whose name they have assumed, whose doctrines they have misunderstood and travestied, and whose memory they have blackened by their deeds -- took the Jewish Jehovah as he was, and of course strove vainly to reconcile the Gospel of Light and Liberty with the Deity of Darkness and Submission.\" ( \"War in Heaven.\" ) * But, it is sufficiently proven now that all the soi-disant evil Spirits who are credited with having made war on the gods, are identical as personalities; moreover, that all the ancient religions taught the same tenet save the final conclusion, which latter differs from the Christian.\n\nThe seven primeval gods had all a dual state, one essential, the other accidental.\n\nIn their essential state they were all the \"Builders\" or Fashioners, the Preservers and the rulers of this world, and in the accidental state, clothing themselves in visible corporeality, they descended on the earth and reigned on it as Kings and Instructors of the lower Hosts, who had incarnated once more upon it as men.\n\n[[Footnote(s)]] ------------------------------------------------- * By Godolphin Mitford, later in life, Murad Ali Bey.\n\nBorn in India, the son of a Missionary, G.\n\nMitford was converted to Islam, and died a Mahomedan in 1884.\n\nHe was a most extraordinary Mystic, of a great learning and remarkable intelligence.\n\nBut he left the Right Path and forthwith fell under Karmic retribution.\n\nAs well shown by the author of the article quoted \"The followers of the defeated Elohim, first massacred by the victorious Jews (the Jehovites), and then persuaded by the victorious Christians and Mohamedans, continued nevertheless.\n\n.\n\n.\n\nSome of these scattered sects have lost even the tradition of the true rationale of their belief -- to worship in secrecy and mystery the Principle of Fire, Light, and Liberty.\n\nWhy do the Sabean Bedouins (avowedly Monotheists when dwelling in the Mohamedan cities) in the solitude of the desert night yet invoke the starry 'Host of Heaven'?\n\nWhy do the Yezidis, the 'Devil Worshippers,' worship the 'Muluk-Taoos' -- The 'Lord Peacock' -- the emblem of pride and of hundred-eyed intelligence (and of Initiation also), which was expelled from heaven with Satan, according to an old Oriental tradition?\n\nWhy do the Gholaites and their kindred Mesopotamo-Iranian Mohamedan Sects believe in the 'Noor Illahee' -- the Light of the Elohim -- transmitted in anastasis through a hundred Prophet Leaders?\n\nIt is because they have continued in ignorant superstition the traditional religion of the 'Light Deities whom Jahveh overthrew' (is said to have overthrown rather); for by overthrowing them he would have overthrown himself.\n\nThe'Muluk-Taoos' -- is Maluk -- 'Ruler' as is shown in the foot-note.\n\nIt is only a new form of Moloch, Melek, Molech, MaIayak, and Malachim \" -- Messengers, Angels, etc.\n\n[[Vol.\n\n2, Page]] 515 THE LOGOS AND SATAN ARE ONE.\n\nThus, esoteric philosophy shows that man is truly the manifested deity in both its aspects -- good and evil, but theology cannot admit this philosophical truth.\n\nTeaching the dogma of the Fallen Angels in its dead-letter meaning, and having made of Satan the corner-stone and pillar of the dogma of redemption -- to do so would be suicidal.\n\nHaving once shown the rebellious angels distinct from God and the Logos in their personalities, the admission that the downfall of the disobedient Spirits meant simply their fall into generation and matter, would be equivalent to saying that God and Satan were identical.\n\nFor since the L OGOS (or God) is the aggregate of that once divine Host accused of having fallen, it would follow that the Logos and Satan are one.\n\nYet such was the real philosophical view of the now disfigured tenet in antiquity.\n\nThe Verbum, or the \"Son,\" was shown in a dual aspect by the Pagan Gnostics -- in fact, he was a duality in full unity.\n\nHence, the endless and various national versions.\n\nThe Greeks had Jupiter, the son of Chronos, the Father, who hurls him down into the depths of Kosmos.\n\nThe Aryans had Brahma (in later theology) precipitated by Siva into the Abyss of Darkness, etc., etc.\n\nBut the fall of all these Logoi and Demiurgi from their primitive exalted position, had in all cases one and the same esoteric signification in it; the curse -- in its philosophical meaning -- of being incarnated on this earth; an unavoidable rung on the ladder of cosmic evolution, a highly philosophical and fitting Karmic law, without which the presence of Evil on Earth would have to remain for ever a closed mystery to the understanding of true philosophy.\n\nTo say, as the author of the Esprits Tombes des Paiens (p.\n\n347) does, that since \"Christianity is made to rest on two pillars, that of evil ([[ ponerou ]]), and of good [[ Iagathou ]]; on two forces, in short, [[ Iagathau kai kakai dunomeis ]]: hence, if we suppress the punishment of the evil forces, the protecting mission of the good Powers will have neither value nor sense\" -- is to utter the most unphilosophical absurdity.\n\nIf it fits in with, and explains Christian dogma, it obscures the facts and truths of the primitive wisdom of the ages.\n\nThe cautious hints of Paul have all the true esoteric meaning, and it took centuries of scholastic casuistry to give them the present false colouring in their interpretation.\n\nThe verbum and Lucifer are one in their dual aspect; and the \"Prince of the Air\" (princeps aeris hujus) is not the \"God of that period,\" but an everlasting principle.\n\nIf the latter was said to be ever circling around the world -- qui circumambulat terram -- the great Apostle referred simply to the never-ceasing cycles of human incarnations, in which evil will ever predominate unto the day when Humanity is redeemed by the true divine Enlightenment which gives the correct perception of things.\n\nIt is easy to disfigure vague expressions written in dead and long- [[Vol.\n\n2, Page]] 516 THE SECRET DOCTRINE.\n\nforgotten languages, and palm them off as truths and revealed facts on the ignorant masses.\n\nThe identity of thought and meaning is the one thing that strikes the student in all the religions which mention the tradition of the fallen Spirits, and in those great religions there is not one that fails to mention and describe it in one or another form.\n\nThus, Hoang-Ty, the great Spirit, sees his Sons, who had acquired active wisdom, falling into the valley of Pain.\n\nTheir leader, the F LYING D RAGON, having drunk of the forbidden ambrosia, fell to the Earth with his Host (Kings)."


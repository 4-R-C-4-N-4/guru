[content]
body = "Whether right or wrong with regard to the latter prophecy, the blessings of Kali Yuga are well described, and fit in admirably even with that which one sees and hears in Europe and other civilized and Christian lands in full XIXth, and at the dawn of the XXth century of our great era of E NLIGHTENMENT.\n\n[[Footnote(s)]] ------------------------------------------------- * Matsya Purana gives Katapa.\n\n** Max Muller translates the name as Morya, of the Morya dynasty, to which Chandragupta belonged (see Sanscrit Literature).\n\nIn Matsya Purana, chapter cclxxii, the dynasty of ten Moryas (or Maureyas) is spoken of.\n\nIn the same chapter, cclxxii, it is stated that the Moryas will one day reign over India, after restoring the Kshattriya race many thousand years hence.\n\nOnly that reign will be purely Spiritual and \"not of this world.\" It will be the kingdom of the next Avatar.\n\nColonel Tod believes the name Morya (or Maureyas ) a corruption of Mori, a Rajpoot tribe, and the commentary on Mahavansa thinks that some princes have taken their name Maurya from their town called Mori, or, as Professor Max Muller gives it, Morya-Nagara, which is more correct, after the original Mahavansa.\n\nVachaspattya, we are informed by our Brother, Devan Badhadur R.\n\nRagoonath Rao, of Madras, a Sanscrit Encyclopedia, places Katapa (Kalapa) on the northern side of the Himalayas, hence in Tibet.\n\nThe same is stated in chapter xii.\n\n(Skanda) of Bhagavat, Vol.\n\nIII, p.\n\n325.\n\n*** The Vayu Purana declares that Moru will re-establish the Kshattriya in the Nineteenth coming Yuga.\n\n( See \" Five years of Theosophy ,\" p.\n\n483 .\n\n\" The Moryas and Koothoomi.\n\n\") --------------"


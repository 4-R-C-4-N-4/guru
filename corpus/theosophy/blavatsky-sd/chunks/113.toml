[content]
body = "In order to form a clear conception of what is meant by the One becoming two, and then being transformed into the \"three-fold,\" the student has to make himself thoroughly acquainted with what we call \"Rounds.\" If he refers to \"Esoteric Buddhism\" -- the first attempt to sketch out an approximate outline of archaic Cosmogony -- he will find that by a \"Round\" is meant the serial evolution of nascent material nature, of the seven globes of our chain* with their mineral, [[Footnote(s)]] ------------------------------------------------- * Several inimical critics are anxious to prove that no seven principles of man nor septenary constitution of our chain were taught in our earlier volume, \"Isis Unveiled.\" Though in that work the doctrine could only be hinted at, there are many passages, nevertheless, in which the septenary constitution of both man and chain is openly mentioned.\n\nSpeaking of the Elohim in Vol.\n\nII., page 420, it is said: \"They remain over the seventh heaven (or spiritual world), for it is they who, according to the Kabalists, formed in succession the six material worlds, or rather, attempts at worlds that preceded our own, which, they say, is the seventh.\" Our globe is, of course, upon the diagram representing the \"chain,\" the seventh and the lowest; though, [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 232 THE SECRET DOCTRINE.\n\nvegetable, and animal kingdoms (man being there included in the latter and standing at the head of it) during the whole period of a life-cycle.\n\nThe latter would be called by the Brahmins \"a Day of Brahma.\" It is, in short, one revolution of the \"Wheel\" (our planetary chain), which is composed of seven globes (or seven separate \"Wheels,\" in another sense this time).\n\nWhen evolution has run downward into matter, from planet A to planet G, or Z, as the Western students call it, it is one Round.\n\nIn the middle of the Fourth revolution, which is our present \"Round\": \"Evolution has reached its acme of physical development, crowned its work with the perfect physical man, and, from this point, begins its work spirit-ward.\" All this needs little repetition, as it is well explained in \"Esoteric Buddhism.\" That which was hardly touched upon, and of which the little that was said has misled many, is the origin of man, and it is upon this that a little more light may now be thrown, just enough to make the Stanza more comprehensible, as the process will be fully explained only in its legitimate place, in Book II.\n\nNow every \"Round\" (on the descending scale) is but a repetition in a more concrete form of the Round which preceded it, as every globe -- down to our fourth sphere (the actual earth) -- is a grosser and more material copy of the more shadowy sphere which precedes it in their successive order, on the three higher planes.\n\n(See diagram in Stanza VI.\n\nComm.\n\n6).\n\nOn its way upwards on the ascending arc, Evolution spiritualises and etherealises, so to speak, the general nature of all, bringing it on to a level with the plane on which the twin globe on the opposite side is placed; the result being, that when the seventh globe is reached (in whatever Round) the nature of everything that is evolving returns to the condition it was in at its starting point -- plus, every time, a new and superior degree in the states of consciousness.\n\nThus it becomes clear that the \"origin of man,\" so-called, on this our present [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] as the evolution on these globes is cyclic, it is the fourth in descending the arc of matter.\n\nAnd again, on page 367, Vol.\n\nII., it is written: \"In the Egyptian notions, as in those of all other faiths founded on philosophy , man was not merely .\n\n.\n\n.\n\nan union of soul and body; he was a trinity when spirit was added to it; and besides that doctrine made him consist of body, astral form, or shadow, the animal soul, the higher soul, and terrestrial intelligence and a sixth principle, etc., etc.\n\n-- the seventh -- S PIRIT.\" So clearly are these principles mentioned, that even in the Index , one finds on page 683: -- \\\"Six principles of man\" -- the seventh being the synthesis of the six, and not a principle but a ray of the Absolute A LL -- in strict truth.\n\n[[Vol.\n\n1, Page]] 233 WHAT INCARNATES IN ANIMAL MAN.\n\nRound, or life-cycle on this planet, must occupy the same place in the same order -- save details based on local conditions and time -- as in the preceding Round.\n\nAgain, it must be explained and remembered that, as the work of each Round is said to be apportioned to a different group of so-called \"Creators\" or \"Architects,\" so is that of every globe; i.e.\n\n, it is under the supervision and guidance of special \"Builders\" and \"Watchers\" -- the various Dhyan-Chohans.\n\nThe group of the hierarchy which is commissioned to \"create\"* men is a special group, then; yet it evolved shadowy man in this cycle just as a higher and still more spiritual group evolved him in the Third Round.\n\nBut as it is the Sixth -- on the downward scale of Spirituality -- the last and seventh being the terrestrial Spirits (elementals) which gradually form, build, and condense his physical body -- this Sixth group evolves no more than the future man's shadowy form, a filmy, hardly visible transparent copy of themselves.\n\nIt becomes the task of the fifth Hierarchy -- the mysterious beings that preside over the constellation Capricornus, Makara, or \"Crocodile\" in India as in Egypt -- to inform the empty and ethereal animal form and make of it the Rational Man.\n\nThis is one of those subjects upon which very little may be said to the general public.\n\nIt is a MYSTERY, truly, but only to him who is prepared to reject the existence of intellectual and conscious spiritual Beings in the Universe, limiting full Consciousness to man alone, and that only as a \"function of the Brain.\" Many are those among the Spiritual Entities, who have incarnated bodily in man, since the beginning of his appearance, and who, for all that, still exist as independently as they did before, in the infinitudes of Space.\n\n.\n\n.\n\n.\n\nTo put it more clearly: the invisible Entity may be bodily present on earth without abandoning, however, its status and functions in the supersensuous regions.\n\nIf this needs explanation, we can do no better than remind the reader of like cases in Spiritualism, though such cases are very rare, at least as regards the nature of the Entity incarnating,** [[Footnote(s)]] ------------------------------------------------- * Creation is an incorrect word to use, as no religion, not even the sect of the Visishta Adwaitees in India -- one which anthropomorphises even Parabrahmam -- believes in creation out of nihil as Christians and Jews do, but in evolution out of preexisting materials."


[content]
body = "Crookes remarks to this that he does not \"wish to infer that the gaps in Mendeleef's table, and in this graphic representation of it (the diagram showing the evolution of atoms) necessarily mean that there are elements actually existing to fill up the gaps; these gaps may only mean that at the birth of the elements there was an easy potentiality of the formation of an element which would fit into the place\" -- an Occultist would respectfully remark to him that the latter hypothesis can only hold good, if the septenary arrangement of atoms is not interfered with.\n\nThis is the one law , and an infallible method that must always lead to success, one who follows it.\n\n[[Vol.\n\n1, Page]] 587 PURANAS VERSUS ROYAL SOCIETY.\n\ninstance, the mystical signification, alchemical and transcendental, of the many imponderable substances that fill interplanetary space, and which, interpenetrating each, are the direct cause, at the lower end, of the production of natural phenomena manifesting through vibration (so-called).\n\nThe knowledge of the real (not the hypothetical) nature of Ether, or rather of the Akasa , and other mysteries, in short, can alone lead to the knowledge of Forces.\n\nIt is that substance against which the materialistic school of the physicists rebels with such fury, especially in France,* and which exact Science has to advocate notwithstanding.\n\nThey cannot make away with it without incurring the risk, like a modern Samson, of pulling down the pillars of the Temple of Science, and getting buried under its roof.\n\nThe theories built upon the rejection of Force outside and independent of Matter pure and simple , have been all shown fallacious.\n\nThey do not, and cannot, cover the ground, and many of the scientific data are thus proved unscientific.\n\n\"Ether produced Sound\" is said in the Puranas, and the statement is laughed at.\n\nIt is the vibrations in the air , we are corrected.\n\nAnd what is air?\n\nCould it exist if there were no etheric medium in Space to buoy up its molecules?\n\nThe case stands simply thus.\n\nMaterialism cannot admit the existence of anything outside matter, because with the acceptance of an imponderable Force -- the source and head of all the physical Forces -- other intelligent Forces would have to be admitted virtually, and that would lead Science very far.\n\nFor it would have to accept as a sequel the presence in Man of a still more spiritual power -- entirely independent, for once, of any kind of matter physicists know anything about.\n\nHence, apart from an hypothetical ether of Space and gross physical bodies, the whole Sidereal and unseen Space is, in the sight of the materialists, one boundless void in nature -- blind, unintelligent, useless.\n\nAnd now the next question is: What is that Cosmic Substance, and how far can one go to suspect its nature or to wrench from it its secrets, and thus feel justified in giving it a NAME?\n\nHow far, especially, has modern Science gone in the direction of those secrets, and what it is doing to solve them.\n\nThe latest hobby of Science, the \"Nebular Theory,\" may afford us some answer to this question.\n\nLet us then examine the credentials of the N EBULAR T HEORY.\n\n[[Footnote(s)]] ------------------------------------------------- * A group of electricians has just protested against the new theory of Clausius, the famous professor of the University of Bonn.\n\nThe character of the protest is shown in the signature, which has \"Jules Bourdin, in the name of the group of Electricians, which had the honour of being introduced to Professor Clausius in 1881, and whose war-cry (cri de ralliement) is A bas l ' Ether \" -- down with ether, even; they want Universal Void , you see!"


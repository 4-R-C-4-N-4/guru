[content]
body = "Do not they, moreover, sacrifice to this day, to the same \" God of Wind and Water?\n\n\" They do; because special prayers for rain, dry weather, trade-winds and the calming of storms on the seas exist to this hour in the prayer-books of the three Christian churches; and the several hundred sects of the Protestant religion [[Vol.\n\n1, Page]] 467 THE FIGHTING GODS.\n\noffer them to their God upon every threat of calamity?\n\nThe fact that they are no more answered by Jehovah, than they were, probably, by Jupiter Pluvius , does not alter the fact of these prayers being addressed to the Power or Powers supposed to rule over the Elements, or of these Powers being identical in Paganism and Christianity; or have we to believe that such prayers are crass idolatry and absurd \"superstition\" only when addressed by a Pagan to his idol , and that the same superstition is suddenly transformed into praiseworthy piety and religion whenever the name of the celestial addressee is changed?\n\nBut the tree is known by its fruit.\n\nAnd the fruit of the Christian tree being no better than that of the tree of Paganism, why should the former command more reverence than the latter.\n\nThus, when we are told by the Chevalier Drach, a converted Jew, and the Marquis de Mirville, a Roman Catholic fanatic of the French aristocracy, that in Hebrew lightning is a synonym of fury , and is always handled by an evil Spirit; that Jupiter Fulgur or Fulgurans is also called by the Christians oelicius , and denounced as the soul of lightning , its daemon*; we have either to apply the same explanation and definitions to the \"Lord God of Israel,\" under the same circumstances, or renounce our right of abusing the gods and creeds of other nations.\n\nThe foregoing statements emanating as they do from two ardent and learned Roman Catholics, are, to say the least, dangerous , in the presence of the Bible and its prophets.\n\nIndeed, if Jupiter, the \"chief Daemon of the Pagan Greeks,\" hurled his deadly thunder-bolts and lightnings at those who excited his wrath, so did the Lord God of Abraham and Jacob.\n\nWe find in I.\n\nSamuel, that \"the Lord thundered from heaven, and the most High uttered his voice, and he sent out arrows (thunder bolts) and scattered them (Saul's armies) with lightning, and discomforted them.\" ( Chap.\n\nxxii.\n\n14, 15.) The Athenians are accused of having sacrificed to Boreas; and this \"Demon\" is charged with having submerged and wrecked 400 ships of the Persian fleet on the rocks of Mount Pelion, and of having become so furious \"that all the Magi of Xerxes could hardly counteract it by offering contra-sacrifices to Tethys\" [ Herodotus \"Polym.\" cxc].\n\nVery fortunately, no authenticated instance is on the records of Christian wars showing a like catastrophe on the same scale happening to one Christian fleet owing to the \"prayers\" of its enemy -- another Christian nation.\n\nBut this is from no fault of theirs, for each prays as ardently to Jehovah for the destruction of the other, as the Athenians prayed to Boreas.\n\nBoth resorted to a neat little piece of black magic con amore.\n\nSuch abstinence from divine interference being hardly due to lack of [[Footnote(s)]] ------------------------------------------------- * Cosmolatry, p.\n\n415.\n\n[[Vol.\n\n1, Page]] 468 THE SECRET DOCTRINE.\n\nprayers, sent to a common Almighty God for mutual destruction, where, then, shall we draw the line between Pagan and Christian?\n\nAnd who can doubt that all Protestant England would rejoice and offer thanks to the Lord, if, during some future war, 400 ships of the hostile fleet were to be wrecked owing to such holy prayers.\n\nWhat is, then, the difference, we ask again, between a Jupiter, a Boreas, and a Jehovah?\n\nNo more than this: The crime of one's own next-of-kin -- say of one's \"father\" -- is always excused and often exalted, whereas the crime of our neighbour's parent is ever gladly punished by hanging.\n\nYet the crime is the same.\n\nSo far the \"blessings of Christianity\" do not seem to have made any appreciable advance on the morals of the converted Pagans.\n\nThe above is not a defence of Pagan gods, nor is it an attack on the Christian deity, nor does it mean belief in either.\n\nThe writer is quite impartial, and rejects the testimony in favour of either, neither praying to, believing in, nor dreading any such \"personal\" and anthropomorphic God.\n\nThe parallels are brought forward simply as one more curious exhibition of the illogical and blind fanaticism of the civilized theologian.\n\nFor, so far, there is not a very great difference between the two beliefs, and there is none in their respective effects upon morality , or spiritual nature.\n\nThe \"light of Christ\" shines upon as hideous features of the animal-man now, as the \"light of Lucifer\" did in days of old.\n\n\"Those unfortunate heathens in their superstition regard even the Elements as something that has comprehension!\n\n.\n\n.\n\n.\n\n.\n\nThey still have faith in their idol Vayu -- the god or, rather, Demon of the Wind and Air .\n\n.\n\n.\n\nthey firmly believe in the efficacy of their prayers, and in the powers of their Brahmins over the winds and storms.\n\n.\n\n.\n\n.\n\n.\" (The Missionary Lavoisier, of Cochin, in the Journal des Colonies.\n\n) In reply to this, we may quote from Luke viii.\n\n, 24: \"And he (Jesus) arose and rebuked the Wind and the raging of the Water , and they ceased and there was a calm .\" And here is another quotation from a prayer book: .\n\n.\n\n.\n\n\"Oh, Virgin of the Sea, blessed Mother and Lady of the Waters, stay thy waves .\n\n.\n\n.\" etc., etc.\n\n(prayer of the Neapolitan and Provencal sailors, copied textually from that of the Phoenician mariners to their Virgingoddess Astarte.) The logical and irrepressible conclusion arising from the parallels brought forward, and the denunciation of the Missionary is this: The commands of the Brahmins to their element-gods not remaining \" ineffectual, \" the power of the Brahmins is thus placed on a par with that of Jesus.\n\nMoreover, Astarte is shown not a whit weaker in potency than the \"Virgin of the Sea\" of Christian sailors.\n\nIt is not enough to give a dog a bad name, and then hang him; the dog has to be proven guilty.\n\nBoreas and Astarte may be devils in theological [[Vol.\n\n1, Page]] 469 PRAYER IS OFTEN SORCERY.\n\nfancy, but, as just remarked, the tree has to be judged by its fruit.\n\nAnd once the Christians are shown as immoral and wicked as the pagans ever were, what benefit has humanity derived from its change of gods and idols?"


body = "And it is, therefore, with hardly a smile that we find another preposterous absurdity quoted about \"Budh,\" as being a name \"which signifies not only the sun as the source of generation but also the male organ ( Round Towers of Ireland; quoted by Mr.\n\nHargrave Jennings in \" Phallicism ,\" p.\n\n264).\n\nMax Muller, in his \"False Analogies,\" says that \"the most celebrated Chinese scholar of his time, Abel Remusat,\" maintains \"that the three syllables I Hi Wei (in the fourteenth chapter of the Tao-te-king ) were meant for Je-ho-vah ( Science of Religion , p .\n\n332); and again, Father Amyot, who \"feels certain that the three persons of the Trinity could be recognised\" in the same work.\n\nAnd if Abel Remusat, why not Hargrave Jennings?\n\nEvery scholar will recognise the absurdity of ever seeing in Budh, \"the enlightened\" and \"the awakened,\" a \"phallic symbol.\" Kwan-shi-yin, then, is \"the Son identical with his Father\" mystically, or the Logos -- the word.\n\nHe is called the \"Dragon of Wisdom\" in Stanza III., as all the Logoi of all the ancient religious systems are connected with, and symbolised by, serpents.\n\nIn old Egypt, the God Nahbkoon, \"he who unites the doubles,\" (astral light re-uniting by its dual physiological and spiritual potency the divine human to its purely divine Monad, the prototype \"in heaven\" or Nature) was represented as a serpent on human legs, either with or without arms.\n\nIt was the emblem of the resurrection of Nature, as also of Christ with the Ophites, and of Jehovah as the brazen serpent healing those who looked at him; the serpent being an emblem of Christ with the Templars also, (see the Templar degree in Masonry).\n\nThe symbol of Knouph (Khoum also), or the soul of the world, says Champollion ( Pantheon , text 3), \"is represented among other forms under that of a huge serpent on human legs; this reptile, being the emblem of the good genius and the veritable Agathodaemon, is sometimes bearded.\" The sacred animal is thus identical with the serpent of the Ophites, and is figured on a great number of engraved stones, called Gnostic or Basilidean gems.\n\nThis serpent appears with various heads (human and animal), but its gems [[Vol.\n\n1, Page]] 473 SNOBS, OR DRAGONS?\n\nare always found inscribed with the name [[ CHNOUBIS ]] (Chnoubis).\n\nThis symbol is identical with one which, according to Jamblichus and Champollion, was called \"the first of the celestial gods\"; the god Hermes, or Mercury with the Greeks, to which god Hermes Trismegistos attributes the invention of, and the first initiation of men into, magic; and Mercury is Budh, Wisdom, Enlightenment, or \"Re-awakening\" into the divine Science.\n\nTo close, Kwan-Shi-Yin and Kwan-Yin are the two aspects (male and female) of the same principle in Kosmos, Nature and Man, of divine wisdom and intelligence.\n\nThey are the \"Christos-Sophia\" of the mystic Gnostics -- the Logos and its Sakti.\n\nIn their longing for the expression of some mysteries never to be wholly comprehended by the profane, the Ancients, knowing that nothing could be preserved in human memory without some outward symbol, have chosen the (to us) often ridiculous images of the Kwan-Yins to remind man of his origin and inner nature.\n\nTo the impartial, however, the Madonnas in crinolines and the Christs in white kid gloves must appear far more absurd than the Kwan-Shi-Yin and Kwan-Yin in their dragon garb.\n\nThe subjective can hardly be expressed by the objective.\n\nTherefore, since the symbolic formula attempts to characterise that which is above scientific reasoning, and as often far beyond our intellects, it must needs go beyond that intellect in some shape or other, or else it will fade out from human remembrance.\n\n--------------------- Contents"


[content]
body = "Bacon was one of the first to strike the key-note of materialism, not only by his inductive method (renovated from ill-digested Aristotle), but by the general tenor of his writings.\n\nHe inverts the order of mental Evolution when saying that \"the first Creation of God was the light of the sense; the last was the light of the reason; and his Sabbath work ever since is the illumination of the Spirit.\" It is just the reverse.\n\nThe light of Spirit is the eternal Sabbath of the mystic or occultist, and he pays little attention to that of mere sense.\n\nThat which is meant by the allegorical sentence, \" Fiat Lux \" is,-- when esoterically rendered -- \"Let there be the 'Sons of Light,' \" or the noumena of all phenomena.\n\nThus the Roman Catholics rightly interpret the passage as referring to Angels, and wrongly as meaning Powers created by an anthropomorphic God, whom they personify in the ever thundering and punishing Jehovah.\n\nThese beings are the \"Sons of Light,\" because they emanate from, and are self-generated in, that infinite Ocean of Light, whose one pole is pure Spirit lost in the absoluteness of Non-Being, and the other, the matter in which it condenses, crystallizing into a more and more gross type as it descends into manifestation.\n\nTherefore matter, though it is, in one sense, but the illusive dregs of that Light whose limbs are the Creative Forces, yet has in it the full presence of the Soul thereof, of that Principle, which none -- not even the \"Sons of Light,\" evolved from its ABSOLUTE DARKNESS -- will ever know.\n\nThe idea is as beautifully, as it is truthfully, expressed by Milton, who hails the holy Light, which is the -- \".\n\n.\n\n.\n\n.\n\n.\n\nOffspring of Heaven, first-born, And of th' Eternal co-eternal beam; .\n\n.\n\n.\n\n.\n\n.\n\nSince God is light, And never but in unapproached Light Dwelt from Eternity,.\n\ndwelt then in thee Bright effluence, of bright essence increate.\""


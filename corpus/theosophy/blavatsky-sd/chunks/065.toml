body = "It was also taught by his pupil Ecphantus, and by Heraclides, a pupil of Plato.\n\nThe immobility of the Sun and the orbital rotation of the earth were shown by Aristarchus of Samos as early as 281 B.C .\n\nto be suppositions accordant with facts of observation.\n\nThe Heliocentric theory was taught about 150 B.C ., by Seleucus of Seleucia on the Tigris.\n\n-- [It was taught 500 B.C .\n\nby Pythagoras.\n\n-- H.\n\nP.\n\nB .] It is said also that Archimedes, in a work entitled Psammites, inculcated the Heliocentric theory.\n\nThe sphericity of the earth was distinctly taught by Aristotle, who appealed for proof to the figure of the Earth's shadow on the moon in eclipses (Aristotle, De Coelo, lib.\n\nII, cap.\n\nXIV.).\n\nThe same idea was defended by Pliny (Nat.\n\nHist., II., 65).\n\nThese views seem to have been lost from knowledge for more than a thousand years.\n\n.\n\n.\n\n.\n\n\" ( Comparative Geology , Part IV., \"Pre-Kantian Speculation,\" p.\n\n551, by Alex.\n\nWinchell, LL.D .).\n\n[[Vol.\n\n1, Page]] 118 THE SECRET DOCTRINE.\n\nmillenniums ago, is a question that is treated separately.\n\nSome were led to it by the natural progress in physical science and by independent observation; others -- such as Copernicus, Swedenborg, and a few more -- their great learning notwithstanding, owed their knowledge far more to intuitive than to acquired ideas, developed in the usual way by a course of study.* (See \"A Mystery about Buddha.\") By the \"Six directions of Space\" is here meant the \"Double Triangle,\" the junction and blending together of pure Spirit and Matter, of the Arupa and the Rupa, of which the Triangles are a Symbol.\n\nThis double Triangle is a sign of Vishnu, as it is Solomon's seal, and the Sri-Antara of the Brahmins.\n\n------- STANZA V.\n\n-- ( Continued.\n\n) 4.\n\nF OHAT TRACES SPIRAL LINES TO UNITE THE SIX TO THE SEVENTH -- THE CROWN ( a ); AN A RMY OF THE S ONS OF L IGHT STANDS AT EACH ANGLE ( and ) THE L IPIKA -- IN THE MIDDLE WHEEL.\n\nT HEY ( the Lipika ) SAY, \" T HIS IS GOOD\" ( b ).\n\nT HE FIRST DIVINE WORLD IS READY, THE FIRST ( is now ), THE SECOND ( world ), THEN THE \" D IVINE A RUPA\" ( the formless Universe [[Footnote(s)]] ------------------------------------------------- * That Swedenborg, who could not possibly have known anything of the esoteric ideas of Buddhism, came independently near the Occult teaching in his general conceptions, is shown by his essay on the Vortical Theory.\n\nIn Clissold's translation of it, quoted by Prof.\n\nWinchell, we find the following resume : -- \"The first Cause is the Infinite or Unlimited.\n\nThis gives existence to the First Finite or Limited.\" (The Logos in His manifestation and the Universe.) \"That which produces a limit is analogous to motion.\n\n(See first Stanza, supra .) The limit produced is a point, the Essence of which is Motion; but being without parts, this Essence is not actual Motion, but only a connatus to it.\" (In our Doctrine it is not a \"connatus,\" but a change from eternal vibration in the unmanifested, to Vortical Motion in the phenomenal or manifested World).\n\n.\n\n.\n\n\"From this first proceed Extension, Space, Figure, and Succession, or Time.\n\nAs in Geometry a point generates a line, a line a surface, and a surface a solid, so here the connatus of a point tends towards lines, surfaces and solids.\n\nIn other words, the Universe is contained in ovo in the first natural point .\n\n.\n\n.\n\nthe Motion toward which the connatus tends, is circular, since the circle is the most perfect of all figures .\n\n.\n\n.\n\nThe most perfect figure of a Motion .\n\n.\n\n.\n\nmust be the perpetually circular, that is to say, it must proceed from the centre to the periphery and from the periphery to the centre.\" (Quoted from Principia Rerum Naturalia.\n\n) This is Occultism pure and simple.\n\n[[Vol.\n\n1, Page]] 119 THE EVOLUTION OF THE PRINCIPLES.\n\nof Thought ) REFLECTS ITSELF IN C HHAYALOKA ( the shadowy world of primal form , or the intellectual ) THE FIRST GARMENT OF ( the ) ANUPADAKA ( c ) .\n\n( a ) This tracing of \"Spiral lines\" refers to the evolution of man's as well as Nature's principles; an evolution which takes place gradually (as will be seen in Book II., on \"The origin of the Human Races\"), as does everything else in nature.\n\nThe Sixth principle in Man (Buddhi, the Divine Soul) though a mere breath, in our conceptions, is still something material when compared with divine \"Spirit\" (Atma) of which it is the carrier or vehicle.\n\nFohat, in his capacity of D IVINE L OVE ( Eros ), the electric Power of affinity and sympathy, is shown allegorically as trying to bring the pure Spirit, the Ray inseparable from the ONE absolute, into union with the Soul, the two constituting in Man the M ONAD, and in Nature the first link between the ever unconditioned and the manifested.\n\n\"The first is now the second\" (world) -- of the Lipikas -- has reference to the same.\n\n( b ) The \"Army\" at each angle is the Host of angelic Beings (Dhyan-Chohans) appointed to guide and watch over each respective region from the beginning to the end of Manvantara.\n\nThey are the \"Mystic Watchers\" of the Christian Kabalists and Alchemists, and relate, symbolically as well as cosmogonically, to the numerical system of the Universe.\n\nThe numbers with which these celestial Beings are connected are extremely difficult to explain, as each number refers to several groups of distinct ideas, according to the particular group of \"Angels\" which it is intended to represent.\n\nHerein lies the nodus in the study of symbology, with which, unable to untie by disentangling it, so many scholars have preferred dealing as Alexander dealt with the Gordian knot; hence erroneous conceptions and teachings, as a direct result.\n\nThe \"First is the Second,\" because the \"First\" cannot really be numbered or regarded as the First, as that is the realm of noumena in its primary manifestation: the threshold to the World of Truth, or S AT, through which the direct energy that radiates from the ONE REALITY -- the Nameless Deity -- reaches us."


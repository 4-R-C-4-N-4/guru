body = "Thus the astral prototypes of the lower beings of the animal kingdom of the Fourth Round, which preceded (the chhayas of) Men, were the consolidated, though still very ethereal sheaths of the still more ethereal forms or models produced at the close of the Third Round on Globe D.* \"Produced from the residue of the substance matter; from dead bodies of men and (other extinct ) animals of the wheel before,\" or the previous Third Round -- as Stanza 24 tells us.\n\nHence, while the nondescript \"animals\" [[Footnote(s)]] ------------------------------------------------- * Vide \" Esoteric Buddhism.\n\n\" [[Vol.\n\n2, Page]] 187 THE DARWINISTS MISTAKEN.\n\nthat preceded the astral man at the beginning of this life-cycle on our Earth were still, so to speak, the progeny of the man of the Third Round, the mammalians of this Round owe their existence, in a great measure, to man again.\n\nMoreover, the \"ancestor\" of the present anthropoid animal, the ape, is the direct production of the yet mindless Man, who desecrated his human dignity by putting himself physically on the level of an animal.\n\nThe above accounts for some of the alleged physiological proofs, brought forward by the anthropologists as a demonstration of the descent of man from the animals.\n\nThe point most insisted upon by the Evolutionists is that, \"The history of the embryo is an epitome of that of the race.\" That \"every organism, in its development from the egg, runs through a series of forms, through which, in like succession, its ancestors have passed in the long course of Earth's history.* The history of the embryo .\n\n.\n\n.\n\n.\n\nis a picture in little, and outline of that of the race.\n\nThis conception forms the gist of our fundamental biogenetic law, which we are obliged to place at the head of the study of the fundamental law of organic development.\n\n\"** This modern theory was known as a fact to, and far more philosophically expressed by, the Sages and Occultists from the remotest ages.\n\nA passage from \" Isis Unveiled \" may here be cited to furnish a few points of comparison.\n\nIn Vol.\n\nI., pp.\n\n388-9, it was asked why, with all their great learning, physiologists were unable to explain teratological phenomena?\n\nAny anatomist who has made the development and growth of the embryo \"a subject of special study,\" can tell, without much brain-work, what daily experience and the evidence of his own eyes show him, viz., that up to a certain period, the human embryo is facsimile of a young batrachian in its first remove from the spawn -- tadpole.\n\nBut no physiologist or anatomist seems to have had the idea of applying to the development of the human being -- from the first [[Footnote(s)]] ------------------------------------------------- * \"A very strong argument in favour of variability is supplied by the science of Embryology.\n\nIs not a man in the uterus .\n\n.\n\n.\n\n.\n\n.\n\na simple cell, a vegetable with three or four leaflets, a tadpole with branchiae, a mammal with a tail, lastly a primate (?) and a biped?\n\nIt is scarcely possible not to recognise in the embryonic evolution a rapid sketch, a faithful summary, of the entire organic series.\" ( Lefevre, Philosophy, p.\n\n484).\n\nThe summary alluded to is, however, only that of the store of types hoarded up in man, the microcosm.\n\nThis simple explanation meets all such objections, as the presence of the rudimentary tail in the foetus -- a fact triumphantly paraded by Haeckel and Darwin as conclusively in favour of the Ape-Ancestor theory.\n\nIt may also be pointed out that the presence of a vegetable with leaflets in the embryonic stages is not explained on ordinary evolutionist principles.\n\nDarwinists have not traced man through the vegetable, but Occultists have.\n\nWhy then this feature in the embryo, and how do the former explain it?\n\n** \" The Proofs of Evolution, \" a lecture by Haeckel.\n\n[[Vol.\n\n2, Page]] 188 THE SECRET DOCTRINE.\n\ninstant of its physical appearance as a germ to its ultimate formation and birth -- the Pythagorean esoteric doctrine of metempsychosis, so erroneously interpreted by critics.\n\nThe meaning of the axiom: \"A stone becomes a plant; a plant, a beast; a beast, a man, etc.\" was mentioned in another place in relation to the spiritual and physical evolution of men on this Earth.\n\nWe will now add a few more words to make the matter clearer.\n\nWhat is the primitive shape of the future man?\n\nA grain, a corpuscle, say some physiologists; a molecule, an ovum of the ovum, say others.\n\nIf it could be analysed -- by the microscope or otherwise -- of what ought we to expect to find it composed?\n\nAnalogically, we should say, of a nucleus of inorganic matter, deposited from the circulation at the germinating point, and united with a deposit of organic matter.\n\nIn other words, this infinitesimal nucleus of the future man is composed of the same elements as a stone -- of the same elements as the Earth, which the man is destined to inhabit.\n\nMoses is cited by the Kabalists as authority for the remark that it required earth and water to make a living being, and thus it may be said that man first appears as a stone.\n\nAt the end of three or four weeks the ovum has assumed a plant-like appearance, one extremity having become spheroidal and the other tapering like a carrot.\n\nUpon dissection it is found to be composed, like an onion, of very delicate laminae or coats, enclosing a liquid.\n\nThe laminae approach each other at the lower end, and the embryo hangs from the root of the umbilicus almost like the fruit from the bough.\n\nThe stone has now become changed, by \"metempsychosis,\" into a plant.\n\nThen the embryonic creature begins to shoot out, from the inside outward, its limbs, and develops its features.\n\nThe eyes are visible as two black dots; the ears, nose, and mouth form depressions, like the points of a pineapple, before they begin to project.\n\nThe embryo develops into an animal-like foetus -- the shape of a tadpole -- and, like an amphibious reptile, lives in water and develops from it.\n\nIts Monad has not yet become either human or immortal, for the Kabalists tell us that this only occurs at the \"fourth hour.\" One by one the foetus assumes the characteristics of the human being, the first flutter of the immortal breath passes through its being; it moves; and the divine essence settles in the infant frame, which it will inhabit until the moment of physical death, when man becomes a spirit.\n\nThis mysterious process of a nine-months' formation, the Kabalists call the completion of the \"individual cycle of evolution.\" As the foetus develops amidst the liquor amnii in the womb, so the Earths germinate in the universal ether, or astral fluid, in the womb of the Universe."


body = "The Laplanders call their corpses to this day manee, ( Voyage de Renard en Laponie I., 184).\n\nMannus is the ancestor of the German race; the Hindu Manu, the thinking being, from man; the Egyptian Menes ; and Minos, the King of Crete, judge of the infernal regions after his death -- all proceed from the same root or word.\n\n[[Vol.\n\n2, Page]] 775 WHO WERE THE NEPHILIM?\n\nSinai, nor by a divine finger tracing the record on tablets of stone, but simply through tradition via pagan sources.\n\nIt was not surely the Pentateuch that Diodorus was repeating when he wrote upon the Titans -- the giants born of Heaven and Earth, or, rather, born of the Sons of God who took to themselves for wives the daughters of men who were fair.\n\nNor was Pherecydes quoting from Genesis when giving details on those giants which are not to be found in the Jewish Scriptures.\n\nHe says that the Hyperboreans were of the race of the Titans, which race descended from the earliest giants, and that it was that Hyperborean region which was the birth-place of the first giants.\n\nThe Commentaries on the sacred books explain that the said region was the far north, the polar lands now, the pre-Lemurian earliest continent, embracing once upon a time the present Greenland, Spitzbergen, Sweden, Norway, etc.\n\nBut who were the Nephilim of Genesis vi.\n\n4?\n\nThere were Palaeolithic and Neolithic men in Palestine ages before the events recorded in the book of the Beginnings.\n\nThe theological tradition identifies these Nephilim with hairy men or Satyrs, the latter being mythical in the Fifth Race and the former historical in both the Fourth and Fifth Races.\n\nWe have stated elsewhere what the prototypes of these Satyrs were, and have spoken of the bestiality of the early and later Atlantean race.\n\nWhat is the meaning of Poseidon's amours under such a variety of animal forms?\n\nHe became a dolphin to win Amphitrite; a horse, to seduce Ceres; a ram, to deceive Theophane, etc., etc.\n\nPoseidon is not only the personation of the Spirit and Race of Atlantis, but also of the vices of these giants.\n\nGesenius and others devote an enormous space to the meaning of the word Nephilim and explain very little.\n\nBut Esoteric records show these hairy creatures to be the last descendants of those Lemuro-Atlantean races, which begot children on female animals, of species now long extinct; thus producing dumb men, \"monsters,\" as the Stanzas have it.\n\nNow mythology, built upon Hesiod's Theogony, which is but a poetised record of actual traditions, or oral history, speaks of three giants, called Briareus, Kottos, and Gyges, living in a dark country where they were imprisoned by Kronos for their rebellion against him.\n\nAll the three are endowed by myth with an hundred arms and fifty heads, the latter standing for races, the former for sub-races and tribes.\n\nBearing in mind that in mythology every personage almost is a god or derni-god, and also a king or simple mortal in his second aspect;* and [[Footnote(s)]] ------------------------------------------------- * Thus, for instance, Gyges is a hundred-armed and fifty-headed monster, a demi-god in one case, and a Lydian, the successor of Candaules, king of the country, in another version.\n\nThe same is found in the Indian Pantheon, where Rishis and the Sons of Brahma are reborn as mortals.\n\n[[Vol.\n\n2, Page]] 776 THE SECRET DOCTRINE.\n\nthat both stand as symbols for lands, islands, powers of nature, elements, nations, races and sub-races, the esoteric Commentary will become comprehensible.\n\nIt says that the three giants are three polar lands which have changed form several times, at each new cataclysm, or disappearance of one continent to make room for another.\n\nThe whole globe is convulsed periodically; and has been so convulsed, since the appearance of the First Race, four times.\n\nYet, though the whole face of the earth was transformed thereby each time, the conformation of the arctic and antarctic poles has but little altered.\n\nThe polar lands unite and break off from each other into islands and peninsulas, yet remain ever the same.\n\nTherefore northern Asia is called the \"eternal or perpetual land,\" and the Antarctic the \"ever living\" and \"the concealed\"; while the Mediterranean, Atlantic, Pacific and other regions disappear and reappear in turn, into and above the great waters.\n\nFrom the first appearance of the great continent of Lemuria, the three polar giants had been imprisoned in their circle by Kronos.\n\nTheir gaol is surrounded by a wall of bronze, and the exit is through gates fabricated by Poseidon (or Neptune, hence by the seas), which they cannot cross; and it is in that damp region, where eternal darkness reigns, that the three brothers languish.\n\nThe Iliad (viii., 13) makes of it the Tartaros.\n\nWhen the gods and Titans rebelled in their turn against Zeus -- the deity of the Fourth Race -- the father of the gods bethought himself of the imprisoned giants in order to conquer the gods and Titans, and to precipitate the latter into Hades; or, in clearer words, to have Lemuria hurled amid thunder and lightning to the bottom of the seas, so as to make room for Atlantis, which was to be submerged and perish in its turn.* The geological upheaval and deluge of Thessaly was a repetition on a small scale of the great cataclysm; and, remaining impressed on the memory of the Greeks, was merged by them into, and confused with, the general fate of Atlantis.\n\nSo, also, the war between the Rakshasas of Lanka and the Bharateans, the melee of the Atlanteans and Aryans in their supreme struggle, or the conflict between the Devs and Izeds (or Peris), became, ages later, the struggle of Titans, separated into two inimical camps, and still later the war between the angels of God and the angels of Satan.\n\nHistorical facts became theological dogmas.\n\nAmbitious scholiasts, men of a small sub-race born but yesterday, and one of the latest issues of the Aryan stock, took upon themselves to overturn the religious [[Footnote(s)]] ------------------------------------------------- * The continents perish in turn by fire and water : either through earthquakes and volcanic eruptions, or by sinking and the great displacement of waters.\n\nOur continents have to perish owing to the former cataclysmal process.\n\nThe incessant earthquakes of this and the past years may be a warning.\n\n[[Vol.\n\n2, Page]] 777 MYTHOLOGY BUILT ON HISTORY.\n\nthought of the world, and succeeded.\n\nFor nearly two thousand years they impressed thinking Humanity with the belief in the existence of Satan."


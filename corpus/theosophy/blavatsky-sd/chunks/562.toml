body = "2, Page]] 465 THE \"FOUR-FACED\" BRAHMA.\n\nmade plain to any one who reads \" The Source of Measures, \" or \" Hebrew Egyptian Mystery, \" and understands the undeniable, clear, and mathematical proofs that the esoteric foundations, or the system used in the building of the Great Pyramid, and the architectural measurements in the Temple of Solomon (whether the latter be mythical or real), Noah's ark, and the ark of the Covenant, are the same.\n\nIf anything in the world can settle the dispute that the old, as much as the later, Jews (post-Babylonian), and especially the former, built their theogony and religion on the very same foundation as all Pagans did, it is the work in question.\n\nAnd now it may be as well to remind the reader of that which was said of I A O , in our work, \" Isis Unveiled.\n\n\" \"No other deity affords such a variety of etymologies as Jaho, nor is there any name which can be so variously pronounced.\n\nIt is only by associating it with the Masoretic points that the later Rabbins succeeded in making Jehovah read 'Adonai' -- or Lord, as Philo Byblus spells it in Greek letters [[IEUO]] -- IEVO .\n\nTheodoret says that the Samaritans pronounced it Jahe (yahra), and the Jews Yaho; which would make it as we have shown, I -- Ah -- O.\n\nDiodorus states that 'among the Jews they relate that Moses called the god Iao.' It is on the authority of the Bible itself, therefore, that we maintain that before his initiation by Jethro, his father-in-law, Moses had never known the word Jaho.\"* The above receives corroboration in a private letter from a very learned Kabalist.\n\nIn S TANZA IV .\n\nand elsewhere it is stated that exoterically Brahma (neuter), so flippantly and so often confused by the Orientalists with Brahma -- the male, is sometimes called Kala - hansa (Swan in the eternity), and the esoteric meaning of A - ham - sa, is given.\n\n(I -- am -- he, so ham being equal to sah \"he,\" and aham \"I\" -- a mystic anagram and permutation).\n\nIt is also the \"four-faced\" Brahma, the Chatur mukha (the perfect cube) forming itself within, and from the infinite circle; and again the use of the 1, 3, 5, and = 14, as the esoteric hierarchy of the Dhyan Chohans is explained.\n\nOn this, the said correspondent comments in this way: -- \"Of the 1, 3, 5, and twice 7, intending and very especially 13,514, which on a circle may be read as 31415 (or [[ pi ]] value), I think there cannot be a possibility of doubting; and especially when considered with symbol marks on sacr ,** 'Chakra,' or Circle of Vishnu.\n\n\"But let me carry your description a step further: -- You say 'The One from [[Footnote(s)]] ------------------------------------------------- * The student must be aware that Jethro is called the \"father-in-law\" of Moses; not because Moses was really married to one of his seven daughters.\n\nMoses was an Initiate, if he ever existed, and as such an ascetic, a nazar, and could never be married.\n\nIt is an allegory like everything else.\n\nZipporah (the shining) is one of the personified Occult Sciences given by Revel-Jethro, the Midian priest Initiator, to Moses, his Egyptian pupil.\n\nThe \"well\" by which Moses sat down in his flight from the Pharaoh symbolizes the \"well of Knowledge.\" ** In Hebrew the phallic symbol lingham and Yoni.\n\n[[Vol.\n\n2, Page]] 466 THE SECRET DOCTRINE.\n\nthe Egg, the six, and the five ( See Stanza IV., Book I.\n\n) give the numbers 1065, the value of the first born'.\n\n.\n\n.\n\n.\n\n.\n\n.\n\nIf it be so, then in 1065 we have the famous Jehovah's name, the Jve or Jave , or Jupiter, and by change of to or h to n , then or the Latin Jun or Juno, the base of the Chinese riddle, the key measuring numbers of Sni (Sinai) and Jehovah coming down on that mount, which numbers (1,065) are but the use of our ratio of 113 to 355 because 1,065 = 355 x 3 which is circumference to a diameter of 113 x 3 = 339.\n\nThus the first born of Brahma Prajapati (or any Demiurgos) indicates a measuring use of a circular relation taken from the Chakra (or Vishnu) and, as stated above, the Divine manifestation takes the form of life and the first born.\" \"It is a most singular thing: At the entrance passage to the King's chamber the measurement from the surface of the Great Step* and the Grand Gallery to the top of the said gallery, is by the very careful measures of Piazzi Smyth 339 inches.\n\nTake A as a centre and with this radius describe a circle; the diameter of that circle will be 339 x 2 = 678, and these numbers are those of the expression and the raven, in the 'Dove and raven' scenes or pictures of the Flood of Noah; (the radius is taken to show division into two parts, which are 1,065 each) for 113 ( man ) x 6 = 678; and the diameter to a circumference of 1,065 x 2 -- so we have here an indication of cosmic man on this high grade or step, at the entrance of the King's Chamber (the Holy of Holies) -- which is the womb.\n\nNow this passage is of such a height that a man to enter it must stoop.\n\nBut a man upright is 113, and broken, or stooping, he becomes 133 / 2 = 5 .\n\n65 or Jehovah.\n\nThat is, he personifies** him as entering the Holy of Holies.\n\nBut by Hebrew Esotericism the chief function of Jehovah was child giving, etc., and that because, by the numbers of his name, he was the measure of the lunar year, which cycle of time, because by its factor of 7 (seven) it ran so co-ordinately with the periods of the quickening, viability, and gestation, was taken as the causative of the generative action and therefore was worshipped and besought.\" This discovery connects Jehovah still more with all the other creative and generative gods, solar and lunar, and especially with \"King\" Soma, the Hindu Deus Lunus, the moon, because of the esoteric influence attributed to this planet in Occultism.\n\nThere are other corroborations of it, however, in Hebrew tradition itself."


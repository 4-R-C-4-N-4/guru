body = "Speaking of Adam, Kain, Mars, etc., as personifications, we find the author of \" The Source of Measures \" enunciating our very esoteric teachings in his Kabalistic researches.\n\nThus he says: -- \"Now Mars was the lord of birth and of death, of generation and of destruction, of ploughing, of building, of sculpture or stone-cutting, of Architecture .\n\n.\n\n.\n\n.\n\nin fine, of all .\n\n.\n\n.\n\n.\n\nARTS.\n\nHe was the primeval principle, disintegrating into the modification of two opposites for production.\n\nAstronomically, too,* he held the birthplace of the day and year, the place of its increase of strength, Aries, and likewise the place of its death, Scorpio.\n\nHe held the house of Venus, and that of the Scorpion.\n\nHe, as birth, was good; as death, was Evil .\n\nAs good, he was light; as bad, he was night.\n\nAs good, he was man ; as bad, he was woman.\n\nHe held the cardinal points, and as Cain , or Vulcan, ** or Pater Sadic, or Melchizadek, he was lord of the Ecliptic, or [[Footnote(s)]] ------------------------------------------------- * The AEolian name of Mars was [[ Areus ]], and the Greek Ares, [[ Ares ]], is a name over the etymological significance of which, philologists and Indianists, Greek and Sanskrit scholars have vainly worked to this day.\n\nVery strangely, Max Muller connects both the names Mars and Ares with the Sanskrit root mar , whence he traces their derivation, and from which, he says, the name of Maruts (the storm-gods) comes.\n\nWelcker, however, offers more correct etymologies.\n\n( See Griech.\n\nGotterlehre, I., 415.) However it may be, etymologies of roots and words alone will never yield the esoteric meaning fully, though they may help to useful guesses.\n\n** As the same author shows: \"The very name Vulcain appears in the reading; for in the first words (of chap.\n\niv.\n\nGenesis, 5 ) is to be found V'elcain, or V'ulcain, agreeably to the deepened u sound of the letter vau .\n\nOut of its immediate context, it may be [[Footnote continued on next page]] [[Vol.\n\n2, Page]] 393 THE LEGENDS OF IRAN.\n\nbalance, or line of adjustment, and therefore was THE JUST ONE.\n\nThe ancients held to there being seven planets, or great gods, growing out of eight, and Pater Sadik, the Just or Right One, was lord of the eighth, which was Mater Terra.\n\n(\"Source of Measures,\" p.\n\n186-70.) This makes their functions plain enough after they had been degraded, and establishes the identity.\n\nThe Noachian Deluge, as described in its dead letter and within the period of Biblical chronology, having been shown to have never existed, the pious, but very arbitrary supposition of Bishop Cumberland has but to follow that deluge into the land of fiction.\n\nIndeed it seems rather fanciful to any impartial observer to be told that there were \"two distinct races of Kabiri,\" the first consisting of Ham and Mizraim, whom he conceives to be Jupiter and Dionysus of Mnaseas; the second, \"of the children of Shem, are the Kabiri of Sochoniston, while their father Sydyk is consequently the Scriptural Shem.\" ( Append.\n\nde Cabiris, ap.\n\nOrig.\n\ngent.\n\np.\n\n364, 376, and the latter statement on p.\n\n357.) The Kabirim, \"the mighty ones,\" are identical with our primeval Dhyan-Chohans, with the corporeal and the incorporeal Pitris, and with all the rulers and instructors of the primeval races, which are referred to as the Gods and Kings of the divine Dynasties.\n\n------- T HE O LDEST P ERSIAN T RADITIONS ABOUT THE P OLAR, AND THE S UBMERGED C ONTINENTS.\n\nLegendary lore could not distort facts so effectually as to reduce them to unrecognisable shape.\n\nBetween the traditions of Egypt and Greece on the one hand, and Persia on the other -- a country ever at war with the former -- there is too great a similarity of figures and numbers to allow such coincidence to be due to simple chance.\n\nThis was well proven by Bailly.\n\nLet us pause for a moment to examine these traditions from every available source, to compare the better those of the Magi with the so-called Grecian \"fables.\" Those legends have now passed into popular tales, the folklore of Persia, as many a real fiction has found its way into our universal History.\n\nThe stories of King Arthur and his knights of the Round Table are also fairy tales to all appearance; yet they are based on facts, and pertain to the History of England.\n\nWhy should not the folklore of Iran be part and parcel of the history and the pre-historic events of Atlantis?\n\nThat folklore says as follows: [[Footnote ]]---------------------------- [[Continued from previous page]] read as \" and the god Cain, \" or Vulcain.\n\nIf, however, anything is wanting to confirm the Cain-Vulcain idea, Fuerst says: , Cain, the iron point of a lance, a smith (blacksmith), inventor of sharp iron tools and smith work\" (p.\n\n278).\n\n[[Vol.\n\n2, Page]] 394 THE SECRET DOCTRINE.\n\nBefore the creation of Adam, two races lived and succeeded each other on Earth; the Devs who reigned 7,000 years, and the Peris (the Izeds) who reigned but 2,000, during the existence of the former.\n\nThe Devs were giants, strong and wicked; the Peris were smaller in stature, but wiser and kinder.\n\nHere we recognize the Atlantean giants and the Aryans, or the Rakshasas of the Ramayana and the children of Bharata Varsha, or India; the ante- and the post-diluvians of the Bible.\n\nGyan (or rather Gnan, true or occult Wisdom and knowledge), also called Gian-ben-Gian (or Wisdom, son of Wisdom), was the king of the Peris.* He had a shield as famous as that of Achilles, only instead of serving against an enemy in war, it served as a protection against black magic, the sorcery of the Devs.\n\nGian-ben-Gian had reigned 2,000 years when Iblis, the devil, was permitted by God to defeat the Devs and scatter them to the other end of the world.\n\nEven the magic shield, which, produced on the principles of astrology, destroyed charms, enchantments, and bad spells, could not prevail against Iblis, who was an agent of Fate (or Karma).** They count ten kings in their last metropolis called Khanoom, and make the tenth, Kaimurath, identical with the Hebrew Adam."


[content]
body = "Kenealy believed that, in India, Karttikeya is the secret symbol of the cycle of Naros, composed of 600, 666, and 777 years, according to whether it is solar or lunar, divine or mortal, years that are counted; and the six visible, or the seven actual sisters, the Pleiades, are needed for the completion of this most secret and mysterious of all the astronomical and religious symbols.\n\nTherefore, when made to commemorate one particular event, Karttikeya appeared, of old, as a Kumara, an ascetic, with six heads -- one for each century of the Naros.\n\nWhen the symbolism was needed for another event, then, in conjunction with the seven sidereal sisters, Karttikeya is seen accompanied by Kaumara (or Sena) his female aspect.\n\nHe is then riding on a peacock -- the bird of Wisdom and Occult Knowledge, and the Hindu Phoenix, whose Greek relation with the 600 years of Naros is well-known.\n\nA six-rayed star (double triangle) a Swastica, a six and occasionally seven-pointed crown is on his brow; the peacock's tail represents the sidereal heavens; and the twelve signs of the Zodiac are hidden on his body; for which he is also called Dwadasa Kara,\" (\"the twelve-handed\"), and Dwadasaksha, \"twelve-eyed.\" It is as Sakti-dhara, however, the \"Spear-holder,\" and the conqueror of Taraka, \"Taraka-jit,\" that he is shown most famous.\n\nThe years of the Naros, being (in India) counted in two ways -- either \"100 years of the gods,\" ( divine years) -- or 100 mortal years -- one can see the tremendous difficulty for the non-initiated in comprehending correctly this cycle, which plays such an important part in St.\n\nJohn's Revelation.\n\nIt is the truly apocalyptic Cycle; yet in none of the numerous speculations about it have we found anything but a few approximate truths, because of its being of various lengths and relating to various pre-historic events.\n\nIt has been urged against the duration claimed by the Babylonians for their divine ages, that Suidas shows the ancients counting, in their chronological computations, days for years.\n\nDr.\n\nSepp in his ingenious plagiarism -- exposed elsewhere -- of the Hindu 432 in thousands and millions of years (the duration of the Yugas) which he dwarfed to 4,320 lunar years before the \"birth of Christ\" -- as \"foreordained\" in the sidereal (besides the invisible) heavens, and proved \"by the apparition of the Star of Bethlehem\" -- appeals to Suidas and his authority.\n\nBut Suidas had no other warrant for it than his own speculations, and he [[Vol.\n\n2, Page]] 620 THE SECRET DOCTRINE.\n\nwas no Initiate.\n\nHe cites, as a proof, Vulcan, in showing him as having, according to chronological claim, reigned 4,477 years, i.e.\n\n, 4,477 days, as he thinks, or rendered in years, 12 years, 3 months, and 7 days; he has 5 days in his original -- thus committing an error even in such an easy calculation.\n\n(See Suidas, art.\n\n[[ Heelios ]].) True, there are other ancient writers guilty of like fallacious speculations -- Calisthenes, for instance, who assigns to the astronomical observations of the Chaldeans only 1,903 years, whereas Epigenes recognises 720,000 years ( Pliny.\n\nHistor.\n\nNatur.\n\nLib.\n\nVII.\n\nc.\n\n56.) The whole of these hypotheses made by profane writers are based upon and due to a misunderstanding.\n\nThe chronology of all the Western peoples, ancient Greeks and Romans, was borrowed from India.\n\nNow, it is said in the Tamil edition of Bagavadam that 15 solar days make a Paccham; two paccham (or 30 days) are a month of the mortals, adding that such a month is only one day of the Pitar Devata ( Pitris ) .\n\nAgain, two of these months constitute a roodoo, three roodoo make an ayanam, and two ayanams a year -- which year of the mortals is but a day of the gods.\n\nIt is on such misunderstood teachings that some Greeks have imagined that all the initiated priests had transformed days into years!\n\nThis mistake of the ancient Greek and Latin writers became pregnant with results in Europe.\n\nAt the close of the past and the beginning of this century, relying upon the purposely mutilated accounts of Hindu chronology, brought from India by certain too zealous and as unscrupulous missionaries, Bailly, Dupuis, and others built quite a fantastic theory upon the subject.\n\nBecause the Hindus had made half a revolution of the moon, a measure of time; and because a month composed of only fifteen days -- of which Quint.\n\nCurtius speaks ( Menses in quinos dies descriperunt dies.\n\nQuint.\n\nCurt.\n\nLVIII ., c.\n\n9) -- is found mentioned in Hindu literature, therefore, it is a verified fact that their year was only half a year, when it was not called a day.\n\nThe Chinese, too, divided their Zodiac into twenty-four parts, hence their year into twenty-four fortnights, but such computation did not, nor does it prevent their having an astronomical year just the same as ours.\n\nAnd they have a period of sixty days -- the Southern Indian Roodoo, to this day in some provinces.\n\nMoreover, Diodorus Siculus (Lib.\n\nI.\n\n§ 26, p.\n\n30) calls \" thirty days an Egyptian year,\" or that period during which the moon performs a complete revolution.\n\nPliny and Plutarch both speak of it ( Hist.\n\nNat.\n\nLib.\n\nVII ., c.\n\n48, Vol .\n\nIII ., p.\n\n185, and Life of Numa, § 16); but does it stand to reason that the Egyptians, who knew astronomy as well as any other people did, made the lunar month consist of thirty days, when it is only twenty-eight days with fractions?\n\nThis lunary period had an occult meaning surely as much as the Ayanam and the roodoo of the Hindus had.\n\nThe year of two months' duration, and the period of sixty days also, [[Vol.\n\n2, Page]] 621 VARIOUS CYCLIC CALCULATIONS.\n\nwas a universal measure of time in antiquity, as Bailly himself shows in his Traite de l ' Astronomie Orientale.\n\nThe Chinamen, according to their own books, divided their year into two parts, from one equinox to the other ( Mem.\n\nAcad.\n\nIns.\n\nT.\n\nXVI ., c.\n\n48, Tom.\n\nIII ., p."


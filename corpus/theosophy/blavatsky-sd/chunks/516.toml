body = "But if it is asserted that there are no grains and fruits unknown to earth, then we may remind the reader that wheat has never been found in the wild state: it is not a product of the earth.\n\nAll the other cereals have been traced to their primogenital forms in various species of wild grasses, but wheat has [[Footnote(s)]] ------------------------------------------------- * The Secret Doctrine explains and expounds that which Plato says, for it teaches that those \"inventors\" were gods and demi-gods (Devas and Rishis) who had become -- some deliberately, some forced to by Karma -- incarnated in man.\n\n[[Vol.\n\n2, Page]] 374 THE SECRET DOCTRINE.\n\nhitherto defied the efforts of botanists to trace it to its origin.\n\nAnd let us bear in mind, in this connection, how sacred was that cereal with the Egyptian priests; wheat being placed even with their mummies, and found thousands of years later in their coffins.\n\nRemember: -- \"The servants of Horus glean the wheat in the field of Aanroo.\n\n.\n\n.\n\n.\n\nwheat seven cubits high.\n\n\" (\" Book of the Dead, \" chap.\n\nxcix., 33; and clvi., 4.)* The reader is referred to Stanza VII., Verse 3, Book I., wherein this verse is explained in another of its meanings, and also to the \" Book of the Dead, \" chap.\n\ncix., v.\n\n4 and 5.\n\n\"I am the Queen of these regions,\" says the Egyptian Isis; \"I was the first to reveal to mortals the mysteries of wheat and corn.\n\n.\n\n.\n\n.\n\nI am she who rises in the constellation of the dog .\n\n.\n\n.\n\n(Dog-star) .\n\n.\n\n.\n\n.\n\nRejoice, O Egypt!\n\nthou who wert my nurse.\" (Book I., chap.\n\nXIV .** Sirius was called the dog-star.\n\nIt was the star of Mercury or Budha, called the great instructor of mankind, before other Buddhas.\n\nThe book of the Chinese Y-King, attributes the discovery of agriculture to \"the instruction given to men by celestial genii.\" \"Woe, woe to the men who know nought, observe nought, nor will they see.\n\n.\n\n.\n\n.\n\nThey are all blind*** since they remain ignorant how much the world is full of various and invisible creatures which crowd even in the most sacred places\" ( Zohar, Part I., col.\n\n177.) The \"Sons of God\" have existed and do exist.\n\nFrom the Hindu Brahmaputras and Manasaputras (Sons of Brahma and Mind-born sons) down to the B ' ne-aleim of the Jewish Bible, the faith of the centuries and [[Footnote(s)]] ------------------------------------------------- * This is a direct reference to the esoteric division of man's principles symbolised by the divine wheat.\n\nThe legend which inscribes the third Registrar of the papyrus ( Chap.\n\ncx.\n\nof the \" Book of the Dead \") states: \"This is the region of the Manes (disembodied men) seven cubits high -- to wit: those just translated and supposed to be still sevenfold with all their principles, even the body represented astrally in the Kama-loka or Hades, before their separation .\n\n.\n\n.\n\n.\n\n.\n\n\" and, there is wheat three cubits high for mummies in a state of perfection \" ( i.e., those already separated, whose three higher principles are in Devachan \"who are permitted to glean it.\" This region (Devachan) is called \"the land of the re-birth of gods,\" and shown to be inhabited by Scheo, Tefnant, and Seb.\n\nThe \"region for the manes seven cubits high,\" (for the yet imperfect mummies), and the region for those \" in a state of perfection \" who \"glean wheat three cubits high,\" is as clear as possible.\n\nThe Egyptians had the same esoteric philosophy which is now taught by the cis-Himalayan adepts, who, when buried, have corn and wheat placed over them.\n\n** There are Egyptologists who have tried to identify Osiris with Menes, which is quite erroneous.\n\nBunsen assigns to Menes an antiquity of 5867 years B.C ., and is denounced for it by Christians.\n\nBut \"Isis-Osiris\" reigned in Egypt before the Dendera Zodiac was painted on the ceiling of that temple, and that is over 75,000 years ago!\n\n*** In the text, \"corked up\" or \"screwed up.\" [[Vol.\n\n2, Page]] 375 \"SONS OF GOD\" PERFECT AND IMPERFECT.\n\nuniversal tradition force reason to yield to such evidence.\n\nOf what value is independent criticism so called, or \"internal evidence\" (based usually on the respective hobbies of the critics), in the face of the universal testimony, which never varied throughout the historical cycles?\n\nRead esoterically the sixth chapter of Genesis, which repeats the statements of the Secret Doctrine, only changing slightly its form, and drawing a different conclusion which clashes even with the Zohar.\n\n\"There were giants in the earth in those days; and also after that when 'the Sons of God ' ( b ' ne-aleim ) \"came in unto the daughters of men, and they bare children to them, the same became mighty men which were of old, men of renown\" (or giants).* What does this sentence \"and also after that\" signify unless it means when explained: \"There were giants in the earth BEFORE, i.e ., before the sinless sons of the Third Race; and also after that when other sons of God, lower in nature, inaugurated sexual connection on earth (as Daksha did, when he saw that his Manasaputras would not people the earth)\"?\n\nAnd then comes a long break in this chapter vi.\n\nof Genesis, between verses 4 and 5.\n\nFor surely, it was not in or through the wickedness of the \"mighty men\" .\n\n.\n\n.\n\n.\n\nmen of renown, among whom is placed Nimrod the \"mighty hunter before the Lord,\" that \"god saw that the wickedness of man was great,\" nor in the builders of Babel, for this was after the Deluge; but in the progeny of the giants who produced monstra quaedam de genere giganteo, monsters from whence sprang the lower races of men, now represented on earth by a few miserable dying-out tribes and the huge anthropoid apes.\n\nAnd if we are taken to task by theologians, whether Protestant or Roman Catholic, we have only to refer them to their own literal texts.\n\nThe above quoted verse was ever a dilemma, not alone for the men of science and Biblical scholars, but also for priests.\n\nFor, as the Rev.\n\nFather Peronne puts it: -- \"Either they (the B'ne-aleim) were good angels, and in such case how could they fall?\n\nOr they were bad (angels) and in this case could not be called b ' ne-aleim, the \"sons of God.\n\n\" ( Praelectiones theol.\n\nch."


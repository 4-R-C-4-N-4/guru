[content]
body = "Even AEsculapius, called the \"Saviour of all,\" is identical, according to ancient classics, with Phta , the Egyptian Creative Intellect (or Divine Wisdom), and with Apollo, Baal, Adonis and Hercules ( see Dunlap ' s \" Mystery of Adonis ,\" pp.\n\n23 and 95); and Phta is, in one of its aspects, the \"Anima Mundi,\" the Universal Soul of Plato, the \"Divine Spirit\" of the Egyptians, the \"Holy Ghost\" of the early Christians and Gnostics, and the Akasa of the Hindus, and even, in its lower aspect, the Astral Light.\n\nFor Phta was originally the \"God of the Dead,\" he in whose bosom they were received, hence the Limbus of the Greek Christians, or the Astral Light.\n\nIt is far later that Phta was classed with the Sun-gods, his name signifying \"he who opens,\" as he is shown to be the first to unveil the face of the dead mummy, to call the soul to life in his bosom.\n\n(See Maspero ' s \" Bulaq Museum.\n\n\") K NEPH, the Eternal Unrevealed , is represented by the snake-emblem of eternity encircling a water-urn, with its head hovering over the \" waters \" which it incubates with its breath -- another form of one and the same idea of \"Darkness,\" its ray moving on the waters, &c.\n\nAs \"Logos-Soul,\" this permutation is called Phta; as Logos-Creator, he becomes Imhot-pou , his son, \"the god of the handsome face.\" In their primitive characters these two were the first Cosmic Duad, Noot , \"space or Sky ,\" and Noo , \"the primordial Waters,\" the Androgyne Unity, above whom was the Concealed B REATH of Kneph.\n\nAnd all of them had the aquatic animals and plants sacred to them, the ibis , the swan , the goose , the crocodile , and the lotus.\n\nReturning to the Kabalistic deity, this Concealed Unity is then = [[ to pan ]] = [[ apeiros ]], Endless, Boundless, non-Existent, so [[Footnote(s)]] ------------------------------------------------- * We use the term as one accepted and sanctioned by use, and therefore more comprehensible to the reader.\n\n[[Vol.\n\n1, Page]] 354 THE SECRET DOCTRINE.\n\nlong as the Absolute is within Oulom , * the boundless and termless time, as such, En-Soph cannot be the Creator or even the modeller of the Universe, nor can he be Aur (light).\n\nTherefore En-Soph is also Darkness.\n\nThe immutably Infinite and the absolutely Boundless can neither will, think, nor act.\n\nTo do this it has to become finite, and it does so, by its ray penetrating into the mundane egg -- infinite space -- and emanating from it as a finite god.\n\nAll this is left to the ray latent in the one.\n\nWhen the period arrives, the absolute will expands naturally the force within it, according to the Law of which it is the inner and ultimate Essence.\n\nThe Hebrews did not adopt the egg as a symbol, but they substituted for it the \"Duplex heavens,\" for, translated correctly, the sentence \"God made the heavens and the earth\" would read: -- \"In and out of his own essence as a womb (the mundane egg), God created the two heavens.\" But the Christians have chosen as the symbol of their Holy Ghost, the dove.\n\n\"Whosoever acquaints himself with the Mercaba and the lahgash (secret speech or incantation), will learn the secret of secrets.\" Lahgash is nearly identical in meaning with Vach, the hidden power of the Mantras.\n\nWhen the active period has arrived, from within the eternal essence of Ain-Soph, comes forth Sephira, the active Power, called the Primordial Point, and the Crown, Kether.\n\nIt is only through her that the \"Un-bounded Wisdom\" could give a concrete form to the abstract Thought.\n\nTwo sides of the upper triangle by which the ineffable Essence and the universe -- its manifested body -- are symbolized, the right side and the base are composed of unbroken lines; the third, the left side, is dotted.\n\nIt is through the latter that emerges Sephira.\n\nSpreading in every direction, she finally encompasses the whole triangle.\n\nIn this emanation the triple triad is formed.\n\nFrom the invisible Dew falling from the higher Uni-triad (thus leaving 7 sephiroths only), the \"Head\" Sephira creates primeval waters, i.e.\n\n, Chaos takes shape.\n\nIt is the first stage towards the solidification of spirit which through various modifications will produce earth.\n\n\" It requires earth and water to make a living soul ,\" says Moses.\n\nIt requires the image of an aquatic bird to connect it with water, the female element of procreation with the egg and the bird that fecundates it.\n\nWhen Sephira emerges like an active power from within the latent Deity, she is female; when she assumes the office of a creator, she becomes a male; hence, she is androgyne.\n\nShe is the \"Father and [[Footnote(s)]] ------------------------------------------------- * With the ancient Jews, as shown by Le Clerc, the word Oulom meant only a time whose beginning or end is not known.\n\nThe term \"eternity,\" properly speaking, did not exist in the Hebrew tongue with the meaning, for instance, applied by the Vedantins to Parabrahm.\n\n[[Vol.\n\n1, Page]] 355 INTERNATIONAL CORRELATION OF GODS.\n\nMother Aditi,\" of the Hindu Cosmogony and of the Secret Doctrine.\n\nIf the oldest Hebrew scrolls had been preserved, the modern Jehovah-worshipper would have found that many and uncomely were the symbols of the creative god.\n\nThe frog in the moon, typical of his generative character, was the most frequent.\n\nAll the birds and animals now held \"unclean\" in the Bible had been the symbols of the Deity in days of old.\n\nIt was because they were too sacred that a mask of uncleanness was placed over them, in order to preserve them from destruction.\n\nThe brazen serpent was not a bit more poetical than the goose or swan, if symbols are to be accepted a la lettre.\n\nIn the words of the Zohar: \"The Indivisible Point, which has no limit and cannot be comprehended because of its purity and brightness, expanded from without , forming a brightness that served the indivisible Point as a veil;\" yet the latter also \" could not be viewed in consequence of its immeasurable light.\n\nIt too expanded from without , and this expansion was its garment.\n\nThus through a constant upheaving (motion) finally the world originated\" ( Zohar I.\n\n20 a ) .\n\nThe Spiritual substance sent forth by the Infinite Light is the first Sephira or Shekinah: Sephira exoterically contains all the other nine Sephiroths in her ."


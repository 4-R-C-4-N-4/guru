body = "Starting from this, it becomes easy to understand how nature herself could have taught primeval mankind, even without the help of its divine instructors, the first principles of a numerical and geometrical symbol language.* Hence one finds numbers and figures used as an [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] \"The story,\" says Mr.\n\nG.\n\nSmith, \"is supposed to have happened about 1600 B.C.\n\nrather earlier than the supposed age of Moses.\n\nAs we know that the fame of Sargon reached Egypt, it is quite likely that this account had a connection with the event related in Exodus ii., for every action, when once performed, has a tendency to be repeated.\" But now, when Professor Sayce has had the courage to push back the dates of the Chaldean and Assyrian Kings by two thousand years more, Sargon must have preceded Moses by 2,000 years at the least.\n\n(See Professor Sayce's Lectures on the subject.) The confession is suggestive, but the figures lack a cypher or two.\n\n* As a reminder how the Esoteric religion of Moses was crushed several times, and the worship of Jehovah, as re-established by David, put in its place, by Hezekiah for one, read pp.\n\n436-42, vol.\n\nII., in Isis Unveiled.\n\nSurely there must have been some very [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 321 THE CROSS, A PHALLIC SYMBOL.\n\nexpression and a record of thought in every archaic symbolical Scripture.\n\nThey are ever the same, with only certain variations growing out of the first figures.\n\nThus the evolution and correlation of the mysteries of Kosmos, of its growth and development -- spiritual and physical, abstract and concrete -- were first recorded in geometrical changes of shape.\n\nEvery Cosmogony began with a circle, a point, a triangle, and a cube, up to number 9, when it was synthesized by the first line and a circle -- the Pythagorean mystic Decade , the sum of all, involving and expressing the mysteries of the entire Kosmos; recorded a hundred times more fully in the Hindu system, for him who can understand its mystic language.\n\nThe numbers 3 and 4, in their blending of 7, as those of 5, 6, 9, and 10, are the very corner-stone of Occult Cosmogonies.\n\nThis decade and its thousand combinations are found in every portion of the globe.\n\nOne recognizes them in the caves and rock-cut temples of Hindostan and Central Asia, as in the pyramids and lithoi of Egypt and America; in the Catacombs of Ozimandyas, in the mounds of the Caucasian snowcapped fastnesses, in the ruins of Palenque, in Easter Island, everywhere whither the foot of ancient man has ever journeyed.\n\nThe 3 and the 4, the triangle and the cube, or the male and female universal glyph, showing the first aspect of the evolving deity, is stamped for ever in the Southern Cross in the Heavens, as in the Egyptian Crux-Ansata.\n\nAs well expressed, \"The Cube unfolded is in display a cross of the tau , or Egyptian form, or of the Christian cross form.\n\n.\n\n.\n\n.\n\nA circle attached to the first, gives the ansated cross .\n\n.\n\n.\n\nnumbers 3 and 4 counted on the cross, showing a form of the (Hebrew) golden candlestick (in the Holy of Holies), and of the 3 + 4 = 7, and 6 + 1 = 7, days in the circle of the week , as 7 lights of the sun.\n\nSo also as the week of 7 lights gave origin to the month and year , so it is the time marker of birth .\n\n.\n\n.\n\n.\n\nThe cross form being shown, then, by the connected use of the form 113 : 355, the symbol is completed by the attachment of a man to the cross.* This kind of measure was made to co-ordinate with the idea of the origin of human life, and hence the phallic form.\n\n**\" The Stanzas show the cross and these numbers playing a prominent part in archaic cosmogony.\n\nMeanwhile we may profit by the evidence collected by the same author to show the identity of symbols and their esoteric meaning all over the globe, which he calls rightly the \"primordial vestiges of these symbols.\" [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] good reasons why the Sadducees, who furnished almost all the high Priests of Judea, held to the Laws of Moses and spurned the alleged \"Books of Moses,\" the Pentateuch of the Synagogue and the Talmud.\n\n* Once more, remember the Hindu Wittoba crucified in space; the significance of the \"sacred sign,\" the Swastica; Plato's Decussated man in Space, etc., etc.\n\n** \"Source of Measures.\" [[Vol.\n\n1, Page]] 322 THE SECRET DOCTRINE.\n\n\"Under the general view taken of the nature of the number forms.\n\n.\n\n.\n\n.\n\nit becomes a matter of research of the utmost interest as to when and where their existence and their use first became known.\n\nHas it been a matter of revelation in what we know as the historic age -- a cycle exceedingly modern when the age of the human race is contemplated?\n\nIt seems, in fact, as to the date of its possession by man, to have been farther removed in the past from the old Egyptians than are the old Egyptians from us.\n\n\"The Easter Isles in 'mid Pacific' present the feature of the remaining peaks of the mountains of a submerged continent , for the reason that these peaks are thickly studded with Cyclopean statues, remnants of the civilization of a dense and cultivated people, who must have of necessity occupied a widely extended area.\n\nOn the back of these images is to be found the ' ansated cross ' and the same modified to the outlines of the human form.\n\nA full description, with plate showing the land, with the thickly planted statues, also with copies of the images, is to be found in the January number 1870 of the London Builder.\n\n\"In the ' Naturalist ,' published at Salem, Massachusetts, in one of the early numbers, is to be found a description of some very ancient and curious carving on the crest walls of the mountains of South America, older by far, it is averred, than the races now living.\n\nThe strangeness of these tracings is in that they exhibit the outlines of a man stretched out on a cross,* by a series of drawings, by which from the form of a man that of a cross springs, but so done that the cross may be taken as the man, or the man as the cross; thus exhibiting a symbolic display of the interdependency of the forms set forth.\n\n\"It is known that tradition among the Aztecs has handed down a very perfect account of the deluge .\n\n.\n\n.\n\n."


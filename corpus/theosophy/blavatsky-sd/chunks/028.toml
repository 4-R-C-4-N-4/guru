body = "I T IS THEY WHO ARE THOU, ME, HIM, OH L ANOO.\n\nT HEY, WHO WATCH OVER THEE, AND THY MOTHER EARTH.\n\n[[Vol.\n\n1, Page]] 34 THE SECRET DOCTRINE.\n\n2.\n\nT HE ONE RAY MULTIPLIES THE SMALLER RAYS.\n\nL IFE PRECEDES FORM, AND LIFE SURVIVES THE LAST ATOM OF FORM.\n\nT HROUGH THE COUNTLESS RAYS PROCEEDS THE LIFE-RAY, THE ONE, LIKE A THREAD THROUGH MANY JEWELS.\n\n3.\n\nW HEN THE ONE BECOMES TWO, THE THREEFOLD APPEARS, AND THE THREE ARE ONE; AND IT IS OUR THREAD, OH L ANOO, THE HEART OF THE MAN-PLANT CALLED S APTASARMA.\n\n4.\n\nI T IS THE ROOT THAT NEVER DIES; THE THREE-TONGUED FLAME OF THE FOUR WICKS.\n\nT HE WICKS ARE THE SPARKS, THAT DRAW FROM THE THREE-TONGUED FLAME SHOT OUT BY THE SEVEN -- THEIR FLAME -- THE BEAMS AND SPARKS OF ONE MOON REFLECTED IN THE RUNNING WAVES OF ALL THE RIVERS OF EARTH.\n\n5.\n\nT HE SPARK HANGS FROM THE FLAME BY THE FINEST THREAD OF F OHAT.\n\nI T JOURNEYS THROUGH THE S EVEN W ORLDS OF M AYA.\n\nI T STOPS IN THE FIRST, AND IS A METAL AND A STONE; IT PASSES INTO THE SECOND AND BEHOLD -- A PLANT; THE PLANT WHIRLS THROUGH SEVEN CHANGES AND BECOMES A SACRED ANIMAL.\n\nF ROM THE COMBINED ATTRIBUTES OF THESE, M ANU, THE THINKER IS FORMED.\n\nW HO FORMS HIM?\n\nT HE SEVEN LIVES, AND THE ONE LIFE.\n\nW HO COMPLETES HIM?\n\nT HE FIVE-FOLD L HA.\n\nA ND WHO PERFECTS THE LAST BODY?\n\nF ISH, SIN, AND SOMA.\n\n.\n\n.\n\n.\n\n.\n\n6.\n\nF ROM THE FIRST-BORN THE THREAD BETWEEN THE S ILENT W ATCHER AND HIS S HADOW BECOMES MORE STRONG AND RADIANT WITH EVERY CHANGE.\n\nT HE MORNING SUN-LIGHT HAS CHANGED INTO NOON-DAY GLORY.\n\n.\n\n.\n\n.\n\n.\n\n7.\n\nT HIS IS THY PRESENT WHEEL, SAID THE F LAME TO THE S PARK.\n\nT HOU ART MYSELF, MY IMAGE, AND MY SHADOW.\n\nI HAVE CLOTHED MYSELF IN THEE, AND THOU ART MY V AHAN TO THE DAY, \" B E WITH US,\" WHEN THOU SHALT RE-BECOME MYSELF AND OTHERS, THYSELF AND ME.\n\nT HEN THE BUILDERS, HAVING DONNED THEIR FIRST CLOTHING, DESCEND ON RADIANT EARTH AND REIGN OVER MEN -- WHO ARE THEMSELVES.\n\n.\n\n.\n\n.\n\nThus ends this portion of the archaic narrative, dark, confused, almost incomprehensible.\n\nAn attempt will now be made to throw light into this darkness, to make sense out of this apparent NON-SENSE."


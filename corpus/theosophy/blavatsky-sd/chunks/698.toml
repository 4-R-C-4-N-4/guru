[content]
body = "\"The caves on the banks of the Lesse, in South-Eastern Belgium,\" says this Anthropologist, \"afford evidence of what is, perhaps, the lowest man, as shown by the Naulette jaw.\n\nSuch man, however, had amulets of stone, perforated for the purpose of ornament; these are made of a psammite now found in the basin of the Gironde.\" Thus Belgian man was extremely ancient.\n\nThat man who was antecedent to the great flood of waters -- which covered the highlands of Belgium with a deposit of lehm or upland gravel 30 metres above the level of the present rivers -- must have combined the characters of the Turanian and the negro.\n\nThe Canstadt, or La Naulette, man, may have been black, and had nothing to do with the Aryan type whose remains are contemporary with those of the cave bear at Engis.\n\nThe denizens of the Aquitaine bone-caves belong to a far later period of history, and may not be as ancient as the former.\n\nIf the statement is objected to on the ground that Science does not deny the presence of man on earth from an enormous antiquity, though that antiquity cannot be determined, since that presence is conditioned by the duration of geological periods, the age of which is not ascertained; if it is argued that the Scientists object most decidedly to the claim that man preceded the animals, for instance; or that civilization dates from the earliest Eocene period, or, again, that there have ever existed giants, three-eyed and four-armed and four-legged men, androgynes, etc., then the objectors are asked in their turn, \"How do you know?\n\nWhat proof have you besides your personal hypotheses, each of which may be upset any day by new discoveries?\" And these future discoveries are sure to prove that, whatever this earlier type of man known to Anthropologists was in complexion, he was in no respect apish.\n\nThe Canstadt man, the Engis man alike possessed essentially human attributes.\n\n( Vide de Quatrefages and Hamy.\n\n\" Cranes des Races Humaines.\n\n\") People have looked for the missing link at the wrong end of the chain; and the Neander valley man has long since been dismissed to the \"limbo of all hasty blunders\" ( Ibid.\n\n).\n\nDisraeli divided man into the associates of the [[Vol.\n\n2, Page]] 745 REMARKABLE \"COINCIDENCES.\" apes and the angels.\n\nReasons are given in the text in favour of an \"angelic theory,\" -- as Christians would say -- at least as applicable to some of the races of men.\n\nAt all events, if man exists only since the Miocene period, even then, humanity as a whole could not be composed of the abject savages of the Palaeolithic age, as they are now represented by the Scientists.\n\nAll they say is mere arbitrary speculative guess-work, invented by them to answer to and fit in with their own fanciful theories.\n\nWe speak of events hundreds of thousands years old, nay, even millions -- if man dates from the geological periods* -- not of any of those events which happened during the few thousand years of the pre-historic margin allowed by timid and ever-cautious history.\n\nYet there are men of science who are almost of our way of thinking.\n\nFrom the brave confession of the Abbe Brasseur de Bourbourg, who says that: -- \"Traditions, whose traces recur in Mexico, in Central America, in Peru, and in Bolivia, suggest the idea that man existed in these different countries at the time of the gigantic upheaval of the Andes, and that he has retained the memory of it\" -- down to the latest palaeontologists and anthropologists, the majority of scientific men is in favour of just such an antiquity.\n\nApropos of Peru, has any satisfactory attempt been made to determine the ethnological affinities and characteristics of the race which reared those Cyclopean erections, the ruins of which display the relics of a great civilization?\n\nAt Cuelap, for instance, such are found, consisting \"of a wall of wrought stones, 3,600 feet long, 560 broad, and 150 feet high, constituting a solid mass with a level summit.\n\nOn this mass was another, 600 feet long, 500 broad, and 150 feet high, making an aggregate height of 300 feet.\n\nIn it were rooms and cells.\" ( Cf., the mass of evidence collected by Donnelly to prove the Peruvian colony an offshoot of the Atlanteans.) A most suggestive fact is the startling resemblance between the architecture of these colossal buildings and that of the archaic European nations.\n\nMr.\n\nFergusson regards the analogies between the ruins of \"Inca\" civilization and the Cyclopean remains of the Pelasgians in Italy and Greece as a coincidence \"the most remarkable in the history of architecture.\" \"It is difficult to resist the conclusion that there may be some relation between them.\" The \"relation\" is simply explained by the derivation of the stocks, [[Footnote(s)]] ------------------------------------------------- * Haeckel's \"Man-ape\" of the Miocene period is the dream of a monomaniac, which de Quatrefages (see his \" Human Species, \" pp.\n\n105-113) has cleverly disposed of.\n\nIt is not clear why the world should accept the lucubrations of a psychophobic materialist, (to accept whose theory necessitates the acceptance on faith of various animals unknown to Science or Nature -- like the Sozura, for instance, that amphibian which has never existed anywhere outside Haeckel's imagination), rather than the traditions of antiquity.\n\n[[Vol.\n\n2, Page]] 746 THE SECRET DOCTRINE.\n\nwho devised these erections, from a common centre in an Atlantic continent.\n\nThe acceptance of the latter can alone assist us to approach a solution of this and similar problems in almost every branch of modern science.\n\nDr.\n\nLartet, treating upon the subject, settles the question by declaring that: -- \"The truth, so long contested, of the co-existence of man with the great extinct species ( Elephas primigenius, Rhinoceros tichorrhinus, Hyaena spelaea, Ursus spelaeus, etc., etc.\n\n) , appears to me to be henceforth unassailable and definitely conquered by science.\" (\" Cavernes de Perigord, \" p.\n\n35.) It is shown elsewhere that such is also de Quatrefages' opinion.\n\n\"Man has in all probability seen Miocene times* and consequently the entire Pliocene epoch,\" he says, and there are reasons for believing that \"his traces will be found further back still, .\n\n.\n\n.\n\n.\" he adds (\" The Human Species, \" p .\n\n152.) Egypt is far older than Europe as now traced on the map.\n\nAtlanto-Aryan tribes began to settle on it, when the British Islands** and France were not even in existence."


[content]
body = "In the conception of my vibratory engine, I did not seek to attain perpetual motion; but a circuit is formed that actually has a neutral centre , which is in a condition to be vivified by my vibratory ether, and, while under operation by said substance, is really a machine that is virtually independent of the mass (or globe),** and it is the wonderful velocity of the vibratory circuit which makes it so.\n\nStill, with all its perfection, it requires to be fed with the vibratory ether to make it an independent motor .\n\n.\n\n.\n\n.\" \"All structures require a foundation in strength according to the weight of the mass they have to carry, but the foundations of the universe rest on a vacuous point far more minute than a molecule; in fact, to express this truth properly, on an inter - etheric point , which requires an infinite mind to understand it.\n\nTo look down into the depths of an etheric centre is precisely the same as it would be to search into the broad space of heaven's ether to find the end, with this difference: that one is the positive field, while the other is the negative field .\n\n.\n\n.\n\n.\" [[Footnote(s)]] ------------------------------------------------- * It is not correct, when speaking of idealism , to show it based upon \"the old ontological assumptions that things or entities exist independently of each other, and otherwise than as terms of relations\" (Stallo).\n\nAt any rate, it is incorrect to say so of idealism in Eastern philosophy and its cognition, for it is just the reverse.\n\n** Independent, in a certain sense, but not disconnected with it.\n\n[[Vol.\n\n1, Page]] 557 AN UNCONSCIOUS OCCULTIST.\n\nThis, as easily seen, is precisely the Eastern doctrine.\n\nHis inter-etheric point is the laya-point of the Occultists, which, however, does not require \"an infinite mind to understand it,\" but only a specific intuition and ability to trace its hiding-place in this world of matter.\n\nOf course, the laya centre cannot be produced, but an inter - etheric vacuum can -- as proved in the production of bell-sounds in space.\n\nMr.\n\nKeely speaks as an unconscious Occultist, nevertheless, when he remarks in his theory of planetary suspension: -- \"As regards planetary volume, we would ask in a scientific point of view, How can the immense difference of volume in the planets exist without disorganising the harmonious action that has always characterised them?\n\nI can only answer this question properly by entering into a progressive analysis, starting on the rotating etheric centres that were fixed by the Creator* with their attractive or accumulative power.\n\nIf you ask what power it is that gives to each etheric atom its inconceivable velocity of rotation (or introductory impulse), I must answer that no finite mind will ever be able to conceive what it is.\n\nThe philosophy of accumulation is the only proof that such a power has been given.\n\nThe area, if we can so speak, of such an atom, presents to the attractive or magnetic, the elective or propulsive, all the receptive force and all the antagonistic force that characterises a planet of the largest magnitude; consequently, as the accumulation goes on, the perfect equation remains the same.\n\nWhen this minute centre has once been fixed, the power to rend it from its position would necessarily have to be so great as to displace the most immense planet that exists.\n\nWhen this atomic neutral centre is displaced, the planet must go with it.\n\nThe neutral centre carries the full load of any accumulation from the start, and remains the same, for ever balanced in the eternal space.\" Mr.\n\nKeely illustrates his idea of \"a neutral centre\" in this way: -- \"We will imagine that, after an accumulation of a planet of any diameter, say, 20,000 miles, more or less, for the size has nothing to do with the problem; there should be a displacement of all the material, with the exception of a crust 5,000 miles thick, leaving an intervening void between this crust and a centre of the size of an ordinary billiard ball, it would then require a force as great to move this small central mass as it would to move the shell of 5,000 miles thickness.\n\nMoreover, this small central mass would carry the load of this crust for ever, keeping it equidistant; and there could be no opposing power, however great, that could bring them together.\n\nThe imagination staggers in contemplating the immense load which bears upon this point of centre, where weight ceases.\n\n.\n\n.\n\n.\n\nThis is what we understand by a neutral centre.\" And what Occultists understand by a \"laya centre.\" The above is pronounced \"unscientific\" by many.\n\nBut so is everything that is not sanctioned and kept on strictly orthodox lines by physical science.\n\nUnless the explanation given by the inventor himself is accepted -- and his explanations, being, as observed, quite orthodox from [[Footnote(s)]] ------------------------------------------------- * \"By Fohat , more likely,\" would be an Occultist's reply.\n\n[[Vol.\n\n1, Page]] 558 THE SECRET DOCTRINE.\n\nthe spiritual and the Occult stand-points, if not from that of materialistic speculative (called exact ) Science, are therefore ours in this particular -- what can science answer to facts already seen which it is no longer possible for anyone to deny?\n\nOccult philosophy divulges few of its most important vital mysteries.\n\nIt drops them like precious pearls, one by one, far and wide apart, and only when forced to do so by the evolutionary tidal wave that carries on humanity slowly, silently, but steadily toward the dawn of the Sixth-Race mankind.\n\nFor once out of the safe custody of their legitimate heirs and keepers, those mysteries cease to be occult: they fall into the public domain and have to run the risk of becoming in the hands of the selfish -- of the Cains of the human race -- curses more often than blessings.\n\nNevertheless, whenever such individuals as the discoverer of Etheric Force -- John Worrell Keely -- men with peculiar psychic and mental capacities* are born, they are generally and more frequently helped than allowed to go unassisted; groping on their way, though, if left to their own resources, falling very soon victims to martyrdom and unscrupulous speculators.\n\nOnly they are helped on the condition that they should not become , whether consciously or unconsciously , an additional peril to their age: a danger to the poor , now offered in daily holocaust by the less wealthy to the very wealthy.** This necessitates a short digression and an explanation.\n\nSome twelve years back, during the Philadelphia Centennial Exhibition, the writer, in answering the earnest queries of a theosophist, one of the earliest admirers of Mr.\n\nKeely, repeated to him what she had heard in quarters, information from which she could never doubt."


body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n1 [[Vol.\n\n1, Page]] 668 THE SECRET DOCTRINE.\n\n[[This page continued from previous section ]] XVIII.\n\nSUMMARY OF THE MUTUAL POSITION.\n\nT HE reader has had the whole case presented to him from both sides, and it remains with him to decide whether its summary stands in our favour or not.\n\nIf there were such a thing as void, a vacuum in Nature, one would find it produced, according to a physical law, in the minds of helpless admirers of the \"lights\" of science, who pass their time in mutually destroying their teachings.\n\nIf ever the theory that \"two lights make darkness\" found its application it is in this case, when one half of the \"lights\" imposes its Forces and \"modes of motion\" on the belief of the faithful, and the other half opposes the very existence of the same.\n\n\"Ether, Matter, Energy\" -- the sacred hypostatical trinity, the three principles of the truly unknown God of Science, called by them P HYSICAL N ATURE!\n\nTheology is taken to task and ridiculed for believing in the union of three persons in one Godhead -- one God as to substance, three persons as to individuality; and we are laughed at for our belief in unproved and unprovable doctrines, in Angels and Devils, Gods and Spirits.\n\nAnd, [[Vol.\n\n1, Page]] 669 THE EXACT SCIENCES OF -- NEGATION.\n\nindeed, that which made the Scientists win the day over Theology in the Great \"Conflict between Religion and Science,\" was precisely the argument that neither the identity of that substance, nor the triple individuality claimed, after having been conceived, invented, and worked out in the depths of Theological Consciousness, could be proved by any Scientific inductive process of reasoning, least of all on the evidence of our senses.\n\nReligion must perish, it is said, because it teaches mysteries.\n\nMystery is the negation of Common Sense , and Science repels it.\n\nAccording to Mr.\n\nTyndall, metaphysics is fiction , like poetry.\n\nThe man of Science takes nothing on trust; rejects everything that is not proven to him , while the Theologian accepts everything on blind faith.\n\nThe Theosophist and the Occultist, who take nothing on trust, not even exact Science, the Spiritualist who denies dogma but believes in Spirits and in invisible but potential influences , all share in the same contempt.\n\nVery well, then; what we have to do now, is to examine for the last time whether exact Science does not act precisely in the same way as Theosophy, Spiritualism, and Theology do.\n\nIn a work by Mr.\n\nS.\n\nLaing, considered a standard book on Science, \"Modern Science and Modern Thought,\" the author of which, according to the laudatory review of the Times , \"exhibits with much power and effect the immense discoveries of Science, and its numerous victories over old opinions, whenever THEY HAVE THE RASHNESS TO CHALLENGE CONCLUSIONS WITH IT,\" one reads in chapter III.\n\n, \"On Matter,\" as follows: \" W HAT IS THE MATERIAL UNIVERSE COMPOSED OF?\n\nETHER , MATTER , ENERGY\" .\n\n.\n\n.\n\n.\n\n.\n\nis the answer.\n\nWe stop to ask, \"What is Ether?\" And Mr.\n\nLaing answers in the name of Science: -- \" Ether is not actually known to us BY ANY TEST OF WHICH THE SENSES CAN TAKE COGNIZANCE, but is a sort of mathematical substance which WE ARE COMPELLED TO ASSUME in order to account for the phenomena of light and heat.\n\n\" And [[sic]] what is matter?\n\nDo you know more about it than you do about the \"hypothetical\" agent, Ether?\n\n\" In perfect strictness , it is true that chemical investigations can tell us .\n\n.\n\n.\n\n.\n\nNOTHING DIRECTLY of the composition of living matter , and .\n\n.\n\n.\n\n.\n\nit is also in strictness true , THAT WE KNOW NOTHING about the composition of ANY ( material ) BODY WHATEVER AS IT IS.\" ( Lecture on Protoplasm by Mr.\n\nHuxley.\n\n) And Energy?\n\nSurely you can define the third person of the Trinity of your Material universe?\n\n\" T HE E NERGY IS THAT WHICH IS ONLY KNOWN TO US BY ITS EFFECTS .\n\n\" ( Books on Physics.\n\n) Pray explain, for this is rather hazy.\n\n\" I N MECHANICS THERE IS ACTUAL AND POTENTIAL ENERGY: WORK [[Vol.\n\n1, Page]] 670 THE SECRET DOCTRINE.\n\nACTUALLY PERFORMED, AND THE CAPACITY FOR PERFORMING IT.\n\nA S TO THE NATURE OF MOLECULAR E NERGY OR F ORCES, THE VARIOUS PHENOMENA WHICH BODIES PRESENT SHOW THAT THEIR MOLECULES ARE UNDER THE INFLUENCE OF TWO CONTRARY FORCES -- ONE WHICH TENDS TO BRING THEM TOGETHER, THE OTHER TO SEPARATE THEM.\n\n.\n\n.\n\n.\n\n.\n\nT HE FIRST IS MOLECULAR ATTRACTION, THE SECOND FORCE IS DUE TO vis viva , OR MOVING FORCE.\" .\n\n.\n\n.\n\n.\n\n( Ganot's Physics .) Just so: it is the nature of this moving force , the vis viva that we want to know.\n\nWhat is it?\n\n.\n\n.\n\n.\n\n.\n\n.\n\n\" WE DO NOT KNOW !\" IS THE INVARIABLE ANSWER.\n\n\" I T IS AN EMPTY SHADOW OF MY IMAGINATION,\" explains Mr.\n\nHuxley in his Physical Basis of Life.\n\nThus the whole structure of Modern Science is built on a kind of \"mathematical abstraction,\" on a Protean \"Substance which eludes the senses,\" (Dubois Reymond,) and on effects , the shadowy and illusive will-o'-the-wisps of a something entirely unknown to and beyond the reach of Science, \" Self - moving \" atoms!\n\nSelf - moving Suns, planets, and stars!\n\nBut who, then, or what are they all, if they are self-endowed with motion?\n\nWhy then should you, physicists, laugh and deride our \"Self-moving ARCHAEUS\"?\n\nMystery is rejected and scorned by Science, and \" MYSTERY is the fatality of Science ,\" as Father Felix has truly said.\n\n.\n\n.\n\n.\n\n.\n\nScience cannot escape it!\" The language of the French preacher is ours , and we quote it in \" Isis Unveiled \" ( Vide Vol.\n\nI.\n\n338-9).\n\nWho -- he asks -- who of you, men of Science: \".\n\n.\n\n.\n\n.\n\nhas been able to penetrate the secret of the formation of a body, the generation of a single atom?\n\nWhat is there, I will not say at the centre of a sun, but at the centre of an atom?\n\nWho has sounded to the bottom the abyss in a grain of sand?"


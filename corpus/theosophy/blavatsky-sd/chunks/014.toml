[content]
body = "Fragments have survived geological and political cataclysms to tell the story; and every survival shows evidence that the now Secret Wisdom was once the [[Vol.\n\n1, Page]] xlv INTRODUCTORY.\n\none fountain head, the ever-flowing perennial source, at which were fed all its streamlets -- the later religions of all nations -- from the first down to the last.\n\nThis period, beginning with Buddha and Pythagoras at the one end and the Neo-Platonists and Gnostics at the other, is the only focus left in History wherein converge for the last time the bright rays of light streaming from the aeons of time gone by, unobscured by the hand of bigotry and fanaticism.\n\nThis accounts for the necessity under which the writer has laboured to be ever explaining the facts given from the hoariest Past by evidence gathered from the historical period.\n\nNo other means was at hand, at the risk even of being once more charged with a lack of method and system.\n\nThe public must be made acquainted with the efforts of many World-adepts, of initiated poets, writers, and classics of every age, to preserve in the records of Humanity the Knowledge of the existence, at least, of such a philosophy, if not actually of its tenets.\n\nThe Initiates of 1888 would indeed remain incomprehensible and ever a seemingly impossible myth, were not like Initiates shown to have lived in every other age of history.\n\nThis could be done only by naming Chapter and Verse where may be found mention of these great characters, who were preceded and followed by a long and interminable line of other famous Antediluvian and Post-diluvian Masters in the arts.\n\nThus only could be shown, on semi-traditional and semi-historical authority, that knowledge of the Occult and the powers it confers on man, are not altogether fictions, but that they are as old as the world itself.\n\nTo my judges, past and future, therefore -- whether they are serious literary critics, or those howling dervishes in literature who judge a book according to the popularity or unpopularity of the author's name, who, hardly glancing at its contents, fasten like lethal bacilli on the weakest points of the body -- I have nothing to say.\n\nNor shall I condescend to notice those crack-brained slanderers -- fortunately very few in number -- who, hoping to attract public attention by throwing discredit on every writer whose name is better known than their own, foam and bark at their very shadows.\n\nThese, having first maintained for years that the doctrines taught in the Theosophist, and which culminated in \"Esoteric Buddhism,\" had been all invented by the present writer , have finally turned round, and denounced \"Isis Unveiled\" and the rest as a plagiarism from Eliphas Levi (!), Paracelsus (!!), and, mirabile [[Vol.\n\n1, Page]] xlvi INTRODUCTORY.\n\ndictu, Buddhism and Brahmanism (!!!) As well charge Renan with having stolen his Vie de Jesus from the Gospels, and Max Muller his \"Sacred Books of the East\" or his \"Chips\" from the philosophies of the Brahmins and Gautama, the Buddha.\n\nBut to the public in general and the readers of the \"Secret Doctrine\" I may repeat what I have stated all along, and which I now clothe in the words of Montaigne: Gentlemen, \" I HAVE HERE MADE ONLY A NOSEGAY OF CULLED FLOWERS, AND HAVE BROUGHT NOTHING OF MY OWN BUT THE STRING THAT TIES THEM.\" Pull the \"string\" to pieces and cut it up in shreds, if you will.\n\nAs for the nosegay of FACTS -- you will never be able to make away with these.\n\nYou can only ignore them, and no more.\n\nWe may close with a parting word concerning this Volume I.\n\nIn an I NTRODUCTION prefacing a Part dealing chiefly with Cosmogony, certain subjects brought forward might be deemed out of place, but one more consideration added to those already given have led me to touch upon them.\n\nEvery reader will inevitably judge the statements made from the stand-point of his own knowledge, experience, and consciousness, based on what he has already learnt.\n\nThis fact the writer is constantly obliged to bear in mind: hence, also the frequent references in this first Book to matters which, properly speaking, belong to a later part of the work, but which could not be passed by in silence, lest the reader should look down on this work as a fairy tale indeed -- a fiction of some modern brain.\n\nThus, the Past shall help to realise the P RESENT, and the latter to better appreciate the P AST.\n\nThe errors of the day must be explained and swept away, yet it is more than probable -- and in the present case it amounts to certitude -- that once more the testimony of long ages and of history will fail to impress anyone but the very intuitional -- which is equal to saying the very few.\n\nBut in this as in all like cases, the true and the faithful may console themselves by presenting the sceptical modern Sadducee with the mathematical proof and memorial of his obdurate obstinacy and bigotry.\n\nThere still exists somewhere in the archives of the French Academy, the famous law of probabilities worked out by an algebraical process for the benefit of sceptics by certain mathematicians.\n\nIt runs thus: If two persons give their evidence to [[Vol.\n\n1, Page]] xlvii INTRODUCTORY.\n\na fact, and thus impart to it each of them 5/6 of certitude; that fact will have then 35/36 of certitude; i.e.\n\n, its probability will bear to its improbability the ratio of 35 to 1.\n\nIf three such evidences are joined together the certitude will become 215/216.\n\nThe agreement of ten persons giving each 1/2 of certitude will produce 1023/1024 , etc., etc.\n\nThe Occultist may remain satisfied, and care for no more."


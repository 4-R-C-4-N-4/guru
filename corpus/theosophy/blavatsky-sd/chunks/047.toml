body = "( c ) The ancients represented it by a serpent, for \"Fohat hisses as he glides hither and thither\" (in zigzags).\n\nThe Kabala figures it with the Hebrew letter Teth , whose symbol is the serpent which played such a prominent part in the Mysteries.\n\nIts universal value is nine, for it is the ninth letter of the alphabet and the ninth door of the fifty portals or gateways that lead to the concealed mysteries of being.\n\nIt is the magical agent par excellence , and designates in Hermetic philosophy \"Life infused into primordial matter,\" the essence that composes all things, and the spirit that determines their form.\n\nBut there are two secret Hermetical operations, one spiritual, the other material-correlative, and for ever united.\n\n\"Thou shalt separate the earth from the fire, the subtile from the solid .\n\n.\n\n.\n\nthat which ascends from earth to heaven and descends again from heaven to earth.\n\nIt (the subtile light), is the strong force of every force, for it conquers every subtile thing and penetrates into every solid.\n\nThus was the world formed\" ( Hermes ) .\n\nIt was not Zeno alone, the founder of the Stoics, who taught that the [[Footnote(s)]] ------------------------------------------------- * See next note.\n\n** Od is the pure life-giving Light, or magnetic fluid; Ob the messenger of death used by the sorcerers, the nefarious evil fluid; Aour is the synthesis of the two, Astral Light proper.\n\nCan the Philologists tell why Od -- a term used by Reichenbach to denominate the vital fluid -- is also a Tibetan word meaning light, brightness, radiancy?\n\nIt equally means \"Sky\" in an occult sense.\n\nWhence the root of the word?\n\nBut Akasa is not quite Ether , but far higher than that, as will be shown.\n\n[[Vol.\n\n1, Page]] 77 DEITY IN SPACE AND TIME.\n\nUniverse evolves, when its primary substance is transformed from the state of fire into that of air, then into water, etc.\n\nHeracleitus of Ephesus maintained that the one principle that underlies all phenomena in Nature is fire.\n\nThe intelligence that moves the Universe is fire, and fires is intelligence.\n\nAnd while Anaximenes said the same of air, and Thales of Miletus (600 years B.C.) of water, the Esoteric Doctrine reconciles all those philosophers by showing that though each was right the system of none was complete.\n\n------- STANZA III.\n\n-- Continued.\n\n8.\n\nW HERE WAS THE GERM, AND WHERE WAS NOW DARKNESS?\n\nW HERE IS THE SPIRIT OF THE FLAME THAT BURNS IN THY LAMP, OH L ANOO?\n\nT HE GERM IS THAT, AND THAT IS LIGHT; THE WHITE BRILLIANT SON OF THE DARK HIDDEN FATHER ( a ).\n\n( a ) The answer to the first question, suggested by the second, which is the reply of the teacher to the pupil, contains in a single phrase one of the most essential truths of occult philosophy.\n\nIt indicates the existence of things imperceptible to our physical senses which are of far greater importance, more real and more permanent, than those that appeal to these senses themselves.\n\nBefore the Lanoo can hope to understand the transcendentally metaphysical problem contained in the first question he must be able to answer the second, while the very answer he gives to the second will furnish him with the clue to the correct reply to the first.\n\nIn the Sanscrit Commentary on this Stanza, the terms used for the concealed and the unrevealed Principle are many.\n\nIn the earliest MSS.\n\nof Indian literature this Unrevealed, Abstract Deity has no name.\n\nIt is called generally \" That \" ( Tad in Sanskrit), and means all that is, was, and will be, or that can be so received by the human mind.\n\nAmong such appellations, given, of course, only in esoteric philosophy, as the \"Unfathomable Darkness,\" the \"Whirlwind,\" etc.\n\n-- it is also called the \"It of the Kalahansa, the Kala-ham-sa,\" and even the \"Kali Hamsa,\" (Black swan).\n\nHere the m and the n are convertible, and [[Vol.\n\n1, Page]] 78 THE SECRET DOCTRINE.\n\nboth sound like the nasal French an or am, or, again, en or em ( Ennui , Embarras , etc.) As in the Hebrew Bible, many a mysterious sacred name in Sanscrit conveys to the profane ear no more than some ordinary, and often vulgar word, because it is concealed anagrammatically or otherwise.\n\nThis word of Hansa or esoterically \"hamsa\" is just such a case.\n\nHamsa is equal to a-ham-sa, three words meaning \"I am he\" (in English), while divided in still another way it will read \"So-ham,\" \"he (is) I\" -- Soham being equal to Sah, \"he,\" and aham, \"I,\" or \"I am he.\" In this alone is contained the universal mystery, the doctrine of the identity of man's essence with god-essence, for him who understands the language of wisdom.\n\nHence the glyph of, and the allegory about, Kalahansa (or hamsa), and the name given to Brahma neuter (later on, to the male Brahma) of \"Hansa-Vahana,\" he who uses the Hansa as his vehicle.\" The same word may be read \"Kalaham-sa\" or \"I am I\" in the eternity of Time, answering to the Biblical, or rather Zoroastrian \"I am that I am.\" The same doctrine is found in the Kabala, as witness the following extract from an unpublished MS.\n\nby Mr.\n\nS.\n\nLiddell McGregor Mathers, the learned Kabalist: \"The three pronouns , Hoa, Atah, Ani; He, Thou, I; are used to symbolize the ideas of Macroprosopus and Microprosopus in the Hebrew Qabalah.\n\nHoa, \"He,\" is applied to the hidden and concealed Macroprosopus; Atah, \"Thou,\" to Microprosopus; and Ani, \"I,\" to the latter when He is represented as speaking.\n\n(See Lesser Holy Assembly , 204 et seq.\n\n) It is to be noted that each of these names consists of three letters, of which the letter Aleph , A, forms the conclusion of the first word Hoa, and the commencement of Atah and Ani, as if it were the connecting link between them.\n\nBut is the symbol of the Unity and consequently of the unvarying Idea of the Divine operating through all these.\n\nBut behind the in the name Hoa are the letters and , the symbols of the numbers Six and Five, the Male and the Female, the Hexagram and the Pentagram."


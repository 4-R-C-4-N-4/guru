body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n1 [[Vol.\n\n1, Page]] 424 THE SECRET DOCTRINE.\n\n[[This page continued from previous section ]] § XII.\n\nTHE THEOGONY OF THE CREATIVE GODS.\n\nT O thoroughly comprehend the idea underlying every ancient cosmology necessitates the study, in a comparative analysis, of all the great religions of antiquity; as it is only by this method that the root idea will be made plain.\n\nExact science -- could the latter soar so high, while tracing the operations of nature to their ultimate and original sources -- would call this idea the hierarchy of Forces.\n\nThe original, transcendental and philosophical conception was one.\n\nBut as systems began to reflect with every age more and more the idiosyncracies of nations; and as the latter, after separating, settled into distinct groups, each evolving along its own national or tribal groove, the main idea gradually became veiled with the overgrowth of human fancy.\n\nWhile in some countries the F ORCES, or rather the intelligent Powers of nature, received divine honours they were hardly entitled to, in others -- as now in Europe and the civilized lands -- the very thought of any such Force being endowed with intelligence seems absurd, and is proclaimed unscientific.\n\nTherefore one finds relief in such statements as are found in the Introduction to \"Asgard and the Gods: Tales and Traditions of our Northern Ancestors,\" by W.\n\nS.\n\nW.\n\nAnson.\n\nThe author remarks, on p.\n\n3: \"Although in Central Asia, or on the banks of the Indus, in the land of the Pyramids, and in the Greek and Italian peninsulas, and even in the North, whither Kelts, Teutons and Slavs wandered, the religious conceptions of the people have taken different forms, yet their common origin is still perceptible.\n\nWe point out this connection between the stories of the gods, and the deep thought contained in them, and their importance, in order that the reader may see that it is not a magic world of erratic fancy which opens out before him, but that .\n\n.\n\n.\n\nLife and nature formed the basis of the existence and action of these divinities.\" And though it is impossible for any Occultist or student of Eastern Esotericism to concur in the strange idea that \"the religious con- [[Vol.\n\n1, Page]] 425 MYTH IS ORAL TRADITION.\n\nceptions of the most famous nations of antiquity are connected with the beginnings of civilization amongst the Germanic races,\" he is yet glad to find such truths expressed as that: \"These fairy tales are not senseless stories written for the amusement of the idle; they embody the profound religion of our forefathers .\n\n.\n\n.\n\n\" Precisely so.\n\nNot only their religion, but likewise their History.\n\nFor a myth, in Greek [[ mythos ]], means oral tradition, passed from mouth to mouth from one generation to the other; and even in the modern etymology the term stands for a fabulous statement conveying some important truth; a tale of some extraordinary personage whose biography has become overgrown, owing to the veneration of successive generations, with rich popular fancy, but which is no wholesale fable.\n\nLike our ancestors, the primitive Aryans, we believe firmly in the personality and intelligence of more than one phenomenon-producing Force in nature.\n\nAs time rolled on, the archaic teaching grew dimmer; and those nations more or less lost sight of the highest and One principle of all things, and began to transfer the abstract attributes of the \"causeless cause\" to the caused effects -- become in their turn causative -- the creative Powers of the Universe: the great nations, out of the fear of profaning the IDEA, the smaller, because they either failed to grasp it or lacked the power of philosophic conception needed to preserve it in all its immaculate purity.\n\nBut one and all, with the exception of the latest Aryans, now become Europeans and Christians, show this veneration in their Cosmogonies.\n\nAs Thomas Taylor,* the most intuitional of all the translators of Greek Fragments, shows, no nation has ever conceived the One principle as the immediate creator of the visible Universe, for no sane man would credit a planner and architect with having built the edifice he admires with his own hands.\n\nOn the testimony of Damascius ([[Peri archon]]) they referred to it as \"the Unknown D ARKNESS.\" The Babylonians passed over this principle in silence: \"To that god,\" says Porphyry, in [[ Peri apoches empsuchon ]], \"who is above all things, neither external speech ought to be addressed, nor yet that which is inward.\n\n.\n\n.\n\n.\n\n.\" Hesiod begins his theogony with: \"Chaos of all things was the first produced,\"** thus allowing the inference that its cause or producer must be passed over in reverential silence.\n\nHomer in his poems ascends no higher than Night , whom he represents Zeus as reverencing.\n\nAccording to all the ancient theologists, and to the doctrines of Pythagoras and Plato, Zeus, or the [[Footnote(s)]] ------------------------------------------------- * See \"Magazine\" for April, 1797.\n\n** [[ Etoi men protista chaos genet ; geneto ]] being considered in antiquity as meaning \"Was generated \" and not simply was.\n\n( See \" Taylor ' s Introd.\n\nto the Parmenides of Plato ,\" p.\n\n260.\n\n[[Vol.\n\n1, Page]] 426 THE SECRET DOCTRINE.\n\nimmediate artificer of the universe, is not the highest god; any more than Sir Christopher Wren in his physical, human aspect is the MIND in him which produced his great works of art.\n\nHomer, therefore, is not only silent with respect to the first principle, but likewise with respect to those two principles immediately posterior to the first, the AEther and Chaos of Orpheus and Hesiod, and the bound and infinity of Pythagoras and Plato.* .\n\n.\n\n.\n\n.\n\nProclus says of this highest principle that it is.\n\n.\n\n.\n\n.\n\n\"the Unity of Unities, and beyond the first adyte.\n\n.\n\n.\n\n.\n\n.\n\nmore ineffable than all silence, and more occult than all Essence.\n\n.\n\n.\n\n.\n\n.\n\nconcealed amidst the intelligible gods.\" ( Ibid.\n\n) To what was written by Thomas Taylor in 1797 -- namely, that the \"Jews appear to have ascended no higher.\n\n.\n\n.\n\n.\n\nthan the immediate artificer of the universe\"; as \"Moses introduces a darkness on the face of the deep, without even insinuating that there was any cause of its existence,\"** one might add something more.\n\nNever have the Jews in their Bible (a purely esoteric, symbolical work) degraded so profoundly their metaphorical deity as have the Christians, by accepting Jehovah as their one living yet personal God .\n\nThis first, or rather ONE, principle was called \"the circle of Heaven,\" symbolized by the hierogram of a point within a circle or equilateral triangle, the point being the LOGOS."


body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n1 [[Vol.\n\n1, Page]] 170 THE SECRET DOCTRINE.\n\n[[This page continued from previous section ]] ADDITIONAL FACTS AND EXPLANATIONS CONCERNING THE GLOBES AND THE MONADS.\n\nTwo statements made in \"Esoteric Buddhism\" must be noticed and the author's opinions quoted.\n\nOn p.\n\n47 (fifth edition) it is said: -- \" .\n\n.\n\n.\n\nthe spiritual monads .\n\n.\n\n.\n\ndo not fully complete their mineral existence on Globe A, then complete it on Globe B, and so on.\n\nThey pass several times round the whole circle as minerals, and then again several times round as vegetables, and several times as animals.\n\nWe purposely refrain for the present from going into figures,\" etc., etc.\n\nThis was a wise course to adopt in view of the great secrecy maintained with regard to figures and numbers.\n\nThis reticence is now partially relinquished; but it would perhaps have been better had the real numbers concerning Rounds and evolutional gyrations been either entirely divulged at the time, or as entirely withheld.\n\nMr.\n\nSinnett understood this difficulty well when saying (p.\n\n140) that: \"For reasons which are not easy for the outsider to divine, the possessors of occult knowledge are especially reluctant to give out facts relating to Cosmogony, though it is hard for the uninitiated to understand why they should be withheld.\" That there were such reasons is evident.\n\nNevertheless, it is to this reticence that most of the confused ideas of some Eastern as well as Western pupils are due.\n\nThe difficulties in the way of the acceptance of the two particular tenets under consideration seemed great, just because of the absence of any data to go upon.\n\nBut there it was.\n\nFor the figures belonging to the Occult calculations cannot be given -- as the Masters have many times declared -- outside the circle of pledged chelas, and not even these can break the rules.\n\nTo make things plainer, without touching upon the mathematical aspects of the doctrine, the teaching given may be expanded and some obscure [[Vol.\n\n1, Page]] 171 THE MYSTERY OF THE MOON, UNVEILED.\n\npoints solved.\n\nAs the evolution of the Globes and that of the Monads are so closely interblended, we will make of the two teachings one.\n\nIn reference to the Monads, the reader is asked to bear in mind that Eastern philosophy rejects the Western theological dogma of a newly-created soul for every baby born, as being as unphilosophical as it is impossible in the economy of Nature.\n\nThere must be a limited number of Monads evolving and growing more and more perfect through their assimilation of many successive personalities, in every new Manvantara.\n\nThis is absolutely necessary in view of the doctrines of Rebirth, Karma, and the gradual return of the human Monad to its source -- absolute Deity .\n\nThus, although the hosts of more or less progressed Monads are almost incalculable, they are still finite, as is everything in this Universe of differentiation and finiteness.\n\nAs shown in the double diagram of the human \"principles\" and the ascending Globes of the world-chains, there is an eternal concatenation of causes and effects, and a perfect analogy which runs through, and links together, all the lines of evolution.\n\nOne begets the other -- globes as personalities.\n\nBut, let us begin at the beginning.\n\nThe general outline of the process by which the successive planetary chains are formed has just been given.\n\nTo prevent future misconceptions, some further details may be offered which will also throw light on the history of humanity on our own chain, the progeny of that of the Moon.\n\nIn the diagrams on p.\n\n172, Fig.\n\n1 represents the \"lunar-chain\" of seven planets at the outset of its seventh or last Round; while Fig.\n\n2 represents the \"earth-chain\" which will be, but is not yet in existence.\n\nThe seven Globes of each chain are distinguished in their cyclic order by the letters A to G, the Globes of the Earth-chain being further marked by a cross -- + -- the symbol of the Earth.\n\nNow, it must be remembered that the Monads cycling round any septenary chain are divided into seven classes or hierarchies according to their respective stages of evolution, consciousness, and merit.\n\nLet us follow, then, the order of their appearance on planet A, in the first Round.\n\nThe time-spaces between the appearances of these hierarchies on any one Globe are so adjusted that when Class 7, the last, appears on Globe A, Class 1, the first, has just passed on to Globe B, and so on, step by step, all round the chain.\n\nAgain, in the Seventh Round on the Lunar chain, when Class 7, the [[Vol.\n\n1, Page]] 172 THE SECRET DOCTRINE.\n\nlast, quits Globe A, that Globe, instead of falling asleep, as it had done in previous Rounds, begins to die (to go into its planetary pralaya);* and in dying it transfers successively, as just said, its \"principles,\" or life-elements and energy, etc., one after the other to a new \"laya-centre,\" which commences the formation of Globe A of the Earth Chain.\n\nA similar process takes place for each of the Globes of the \"lunar chain\" one after the other, each forming a fresh Globe of the \"earth-chain.\" Our Moon was the fourth Globe of the series, and was on the same plane of perception as our Earth.\n\nBut Globe A of the lunar chain is not fully \"dead\" till the first Monads of the first class have passed from Globe G or Z, the last of the \"lunar chain,\" into the Nirvana [[Footnote(s)]] ------------------------------------------------- * Occultism divides the periods of Rest (Pralaya) into several kinds; there is the individual pralaya of each Globe, as humanity and life pass on to the next; seven minor Pralayas in each Round; the planetary Pralaya, when seven Rounds are completed; the Solar Pralaya, when the whole system is at an end; and finally the Universal Maha -- or Brahma -- Pralaya at the close of the \"Age of Brahma.\" These are the three chief pralayas or \"destruction periods.\" There are many other minor ones, but with these we are not concerned at present.\n\n[[Vol.\n\n1, Page]] 173 THE EARTH, THE CHILD OF THE MOON.\n\nwhich awaits them between the two chains; and similarly for all the other Globes as stated, each giving birth to the corresponding globe of the \"earth-chain.\" Further, when Globe A of the new chain is ready, the first class or Hierarchy of Monads from the Lunar chain incarnate upon it in the lowest kingdom, and so on successively.\n\nThe result of this is, that it is only the first class of Monads which attains the human state of development during the first Round, since the second class, on each planet, arriving later, has not time to reach that stage."


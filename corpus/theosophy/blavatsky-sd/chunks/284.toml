body = "Two proofs of it are to be found in the world of Science -- two great chemists, each among the greatest in his own country, and these are Mr.\n\nCrookes and the late Professor Butlerof: one, a thorough believer in abnormal phenomena; the other, as fervid a Spiritualist as he was great in natural Sciences.\n\nIt becomes evident that while pondering over the ultimate divisibility of matter, and in the hitherto fruitless chase after the element of negative atomic weight, the scientifically trained mind of the chemist must feel irresistibly drawn towards those ever-shrouded worlds, to the mysterious beyond, whose measureless depths seem to close against the approach of the too materialistic hand that would fain draw aside its veil.\n\n\"It is the unknown and the ever unknowable ,\" warns the Monist-Agnostic.\n\nNot so; answers the persevering chemist: -- \"We are on the track and are not daunted, and fain would we enter the mysterious region which ignorance tickets unknown.\n\n\"* A few lines at the very close of his lecture on the Genesis of the Elements -- two or three sentences -- showed the eminent Scientist to be on the royal road to the greatest discoveries.\n\nHe has been overshadowing for some time \"the original protyle ,\" and came to the conclusion that \"he who grasps the Key will be permitted to unlock some of the deepest mysteries of creation.\" The protyle , as that great chemist explains: -- \".\n\n.\n\n.\n\nis a word analogous to protoplasm, to express the idea of the original primal matter existing before the evolution of the chemical elements.\n\nThe word I have ventured to use for this purpose is compounded of [[ pro ]] (earlier than) and [[ hyle ]] (the stuff of which things are made).\n\nThe word is scarcely a new coinage, for 600 years ago Roger Bacon wrote in his Arte Chymiae , \"The elements are made out of [[ hyle ]] and every element is converted into the nature of another element.\" The Knowledge of Roger Bacon did not come to this wonderful old magician** by inspiration, but because he studied ancient works on [[Footnote(s)]] ------------------------------------------------- * Mr.\n\nCrookes' \"Presidential Address\" at Birmingham.\n\n\"There is but one unknown -- the ultimate substratum of Spirit (Space).\n\nThat which is not the Absolute and the One is, in virtue of that very differentiation, however far removed from the physical senses, always accessible to the spiritual human mind, which is a coruscation of the undifferentiable Integral.\" -- ( Practical Lessons on the Occult.\n\n) ** Thus, what the writer of the present work said ten years ago in \" Isis Unveiled \" ( Vol.\n\nI.\n\n) was prophetic, it seems.\n\nThese are the words: \"Many of these mystics, by following what they were taught by some treatises, secretly preserved from one generation to another, achieved discoveries which would not be despised even in our modern days of exact sciences.\n\nRoger Bacon, the friar, was laughed at as a quack, and is now generally numbered among 'pretenders' to magic art; but his discoveries were nevertheless accepted, and are now used by those who ridicule him the most.\n\nRoger Bacon belonged by right, if not by fact, to that Brotherhood which includes all those who [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 582 THE SECRET DOCTRINE.\n\nmagic and alchemy, having a key to the real meaning of words.\n\nBut see what Mr.\n\nCrookes says of protyle , next neighbour to the unconscious Mulaprakriti of the Occultists: -- .\n\n.\n\n.\n\n.\n\n.\n\n\"Let us start at the moment when the first element came into existence.\n\nBefore this time, matter, as we know it, was not.\n\nIt is equally impossible to conceive of matter without energy, as of energy without matter; from one point of view both are convertible terms.\n\nBefore the birth of atoms, all those forms of energy, which become evident when matter acts upon matter, could not have existed* -- they were locked up in the protyle as latent potentialities only.\n\nCoincident with the creation of atoms, all those attributes and properties, which form the means of discriminating one chemical element from another, start into existence fully endowed with energy.\" ( Presidential Address , p.\n\n16.) With every respect due to the great knowledge of the lecturer, the Occultist would put it otherwise.\n\nThey would say that no atom is ever \"created,\" for the atoms are eternal within the bosom of the One Atom , -- \"the atom of atoms\" -- viewed during Manvantara as the Jagad-Yoni the material causative womb of the world.\n\nPradhana (unmodified matter), that which is the first form of Prakriti , or material visible, as well as invisible nature, and Purusha , spirit, are eternally one; and they are Nirupadhi , (without adventitious qualities or attributes) only during Pralaya , and when beyond any of the planes of consciousness of existence.\n\nThe atom, as known to modern science, is inseparable from Purusha , which is spirit, but is now called \"Energy\" in Science.\n\nThe protyle atom has not been comminuted or subtilized: it has simply passed into that plane, which is no plane, but the eternal state of everything beyond the planes of illusion.\n\nBoth Purusha and Pradhana are immutable and unconsumable, or Aparinamin and Avyaya , in eternity; and both during the Mayavic periods may be referred to as Vyaya and Parinamin , or that which can expand, pass away and disappear, and is \"modifiable.\" In this sense Purusha , must of course, be held distinct in our conceptions from Parabrahmam .\n\nNevertheless that, which is called \"energy\" or \"force\" in Science and has been explained as a dual Force by Metcalfe, is never, in fact, and cannot be energy alone; for it is the substance of the world, its soul, the all - permeant \"Sarvaga,\" in conjunction with Kala \"time.\" The three are the trinity in one, during Manvantara, the all-potential Unity, which acts on the plane of illusion (Maya) as three distinct things.\n\nIn Orphic [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] study the occult sciences.\n\nLiving in the thirteenth century, almost a contemporary, therefore, of Albertus Magnus and Thomas Aquinas, his discoveries -- such as gunpowder and optical glasses, and his mechanical achievements -- were considered by everyone as so many miracles.\n\nHe was accused of having made a compact with the Evil One.\" * Just so; \"those forms of energy .\n\n.\n\n.\n\nwhich become evident .\n\n.\n\n.\" in the laboratory of the chemist and physicist; but there are other forms of energy wedded to other forms of matter, -- which are supersensuous , yet known to the adepts.\n\n[[Vol.\n\n1, Page]] 583 ALL-POTENTIAL UNITY.\n\nphilosophy in Greece they were called Phanes , Chaos , and Chronos -- the triad of the Occult philosophers of that period."


[content]
body = "Primarily, the angelic Fall , which has transformed the \"first-born\" of God into the Asuras, or into the Ahriman and Typhon of the \"pagans\" ( i.e ., if the accounts given in the Book of Enoch,* and in Hermes, in Puranas and Bible are taken literally), when read esoterically means simply this: -- Sentences such as: \"In his (Satan's) ambition he raises his hand against the Sanctuary of the God of Heaven\" etc., ought to read: \"Prompted by the law of eternal evolution and Karma, the angel incarnated on earth in man; and as his Wisdom and Knowledge are still divine, although his body is earthly, he is (allegorically) accused of divulging the mysteries of Heaven.\" He combines and uses the two for purposes of human, instead of super-human, procreation.\n\nHenceforth, \"man will beget, not create.\n\n\" ** But as, by so doing, he has to use [[Footnote(s)]] ------------------------------------------------- * Returning once more to the most important subject in the archaic Cosmogony, it may be said that even in the Norse legends, in the Sacred Scrolls of the goddess Saga, we find Loki, the brother by blood of Odin (as Typhon, Ahriman, and others are brothers of Osiris and Ormazd), becoming evil only later, when he has mixed too long with humanity.\n\nLike all other fire or light gods -- fire burning and destroying as well as warming and giving life -- he ended by being accepted in the destructive sense of \"fire.\" The name Loki, we learn (\" Asgard and the Gods, \" p.\n\n250) , has been derived from the old word \"liechan,\" to enlighten.\n\nIt has, therefore, the same origin as the Latin \" lux , light.\" Hence Loki is identical with Lucifer (light-bringer).\n\nThis title, given to the Prince of Darkness, is very suggestive and is a vindication in itself against theological slander.\n\nBut Loki is still more closely related to Prometheus, as he is shown chained to a sharp rock, while Lucifer, identified with Satan, was chained down in hell; a circumstance, however, which prevented neither of them from acting in all freedom on Earth, if we accept the theological paradox in its fulness.\n\nLoki is a beneficent, generous and powerful god in the beginning of times, and the principle of good, not of evil, in early Scandinavian theogony.\n\n** The Greek mythos just alluded to a few pages back, namely the mutilation of Uranos by his son Kronos in the Greek theogony, is an allusion to this theft by the Son of the Earth and Heavens of the divine creative fire.\n\nIf Uranos, the personification of the celestial Powers, has to stop creating (he is made impotent by Kronos, the god in time ) so, in the Egyptian Cosmogony it is Thot, the god of Wisdom, who regulates this fight between Horus and Set, the latter being served by the former as Uranos is by Kronos ( see \" Book of the Dead \" ch.\n\nXVII.\n\nV.\n\n26).\n\nIn the Babylonian account it is the god Zu, who strips \"the father of the gods\" of umsimi -- the ideal creative organ not the crown (!) as G.\n\nSmith thought (see pp.\n\n115 and 116 Chaldean Account).\n\nFor, in the fragment K.\n\n3454 (British Museum) it is said very clearly, that Zu having stripped the \"venerable [[Footnote continued on next page]] [[Vol.\n\n2, Page]] 284 THE SECRET DOCTRINE.\n\nhis weak body as the means of procreation, that body will pay the penalty for this wisdom, carried from heaven down to the earth; hence the corruption of physical purity will become a temporary curse.\n\nThe mediaeval Kabalists knew this well, since one of them did not fear to write: \"The Kabala was first taught by God himself to a select Company of Angels who formed a theosophic school in Paradise.\n\nAfter the F ALL the Angels most graciously communicated this heavenly doctrine to the disobedient child of Earth, to furnish the protoplasts with the means of returning to their pristine nobility and felicity\" ( Quoted by Christian Ginsburg from the Kabala ) .\n\nThis shows how the event -- of the Sons of God, marrying and imparting the divine Secrets of Heaven to the daughters of men -- allegorically told by Enoch and in the sixth chapter of Genesis was interpreted by the Christian Kabalists.\n\nThe whole of this period may be regarded as the pre-human period, that of divine man, or as plastic Protestant theology now has it -- the pre -adamite period.\n\nBut even Genesis begins its real history ( chap.\n\nvi.) by the giants of \"those days\" and the \"Sons of god\" marrying and teaching their wives -- the daughters of man.\n\nThis period is the one described in the Puranas; and relating as it does to days lost in archaic ages, hence pre-historic, how can any anthropologist feel certain whether the mankind of that period was or was not as he knows it now?\n\nThe whole personnel of the Brahmanas and Puranas -- the Rishis, Prajapatis, Manus, their wives and progeny -- belong to that pre-human period.\n\nAll these are the Seed of Humanity, so to speak.\n\nIt is around these \"Sons of God,\" the \"Mind born\" astral children of Brahma, that our physical frames have grown and developed to what they are now.\n\nFor, the Puranic histories of all those men are those of our Monads, in their various and numberless incarnations on this and other spheres, events perceived by the \"Siva eye\" of the ancient Seers, (the \"third eye\" of our Stanzas) and described allegorically.\n\nLater on, they were disfigured for Sectarian purposes; mutilated, but still left with a considerable ground-work of truth in them.\n\nNor is the philosophy less profound in such allegories for being so thickly veiled by the overgrowth of fancy.\n\nBut with the Fourth Race we reach the purely human period.\n\nThose who were hitherto semi-divine Beings, self-imprisoned in bodies which were human only in appearance, became physiologically changed and took unto themselves wives who were entirely human and fair to look [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] of Heaven\" of his desire, he carried away the umsimi of the gods, and burnt thereby the teroti (the power) of all the other gods, thus \"governing the seed of all the angels\" (15).\n\nAs the umsimi was on the seat of Bel, it could hardly be the \"crown.\" A fourth version is in the Bible.\n\nHam is the Chaldean Zu, and both are cursed for the same allegorically described crime.\n\n[[Vol.\n\n2, Page]] 285 THE TIBETAN LILITH.\n\nat, but in whom lower, more material, though sidereal, beings had incarnated."


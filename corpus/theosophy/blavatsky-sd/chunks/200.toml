[content]
body = "Everywhere the speculations of the Kabalists treat of Evil as a FORCE, which is antagonistic, but at the same time essential, to Good, as giving it vitality and existence, which it could never have otherwise.\n\nThere would be no life possible (in the Mayavic sense) without Death , nor regeneration and reconstruction without destruction.\n\nPlants would perish in eternal sunlight, and so would man, who would become an automaton without the exercise of his free will and aspirations [[Vol.\n\n1, Page]] 414 THE SECRET DOCTRINE.\n\nafter that sunlight, which would lose its being and value for him had he nothing but light.\n\nGood is infinite and eternal only in the eternally concealed from us, and this is why we imagine it eternal.\n\nOn the manifested planes, one equilibrates the other.\n\nFew are those theists and believers in a personal God, who do not make of Satan the shadow of God; or who, confounding both, do not believe they have a right to pray to that idol asking its help and protection for the exercise and impunity of their evil and cruel deeds.\n\n\"Lead us not into Temptation\" is addressed daily to \"our Father, which art in Heaven,\" and not to the Devil, by millions of human Christian hearts.\n\nThey do so, repeating the very words put in the mouth of their Saviour, and do not give one thought to the fact that their meaning is contradicted point blank by James \"the brother of the Lord.\" \"Let no man say when he is tempted, I am tempted of God: for God cannot be tempted with evil, neither tempteth he any man.\" -- (The Gen.\n\nEp.\n\nof James, i, 13).\n\nWhy, then, say that it is the Devil who tempts us, when the Church teaches us on the authority of Christ that it is God who does so?\n\nOpen any pious volume in which the word \"temptation\" is defined in its theological sense, and forthwith you find two definitions: (1) \"Those afflictions and troubles whereby God tries his people; \" (2) Those means and enticements which the Devil makes use of to ensnare and allure mankind.\n\n(St.\n\nJames i., 2, 12, and Mat.\n\nvi., 13.) If accepted literally, the two teachings of Christ and James contradict each other, and what dogma can reconcile the two if the occult meaning is rejected?\n\nBetween the alternative allurements, wise will be that philosopher who will be able to decide where God disappears to make room for the Devil!\n\nTherefore when we read that \"the Devil is a liar and the father of it,\" i.e.\n\n, INCARNATE LIE, and are told in the same breath that Satan -- the Devil -- was a son of God and the most beautiful of his archangels, rather than believe that Father and Son are a gigantic, personified and eternal LIE, we prefer to turn to Pantheism and to Pagan philosophy for information.\n\nOnce that the key to Genesis is in our hands, it is the scientific and symbolical Kabala which unveils the secret.\n\nThe great Serpent of the Garden of Eden and the \"Lord God\" are identical, and so are Jehovah and Cain ONE -- that Cain who is referred to in theology as the \"murderer\" and the LIAR to God!\n\nJehovah tempts the King of Israel to number the people, and Satan tempts him to do the same in another place.\n\nJehovah turns into the fiery serpents to bite those he is displeased with; and Jehovah informs the brazen serpent that heals them.\n\nThese short, and seemingly contradictory, statements in the Old Testament (contradictory because the two Powers are separated instead of being regarded as the two faces of one and the same thing) are the [[Vol.\n\n1, Page]] 415 THEOLOGICAL ETYMOLOGIES.\n\nechoes -- distorted out of recognition by exotericism and theology -- of the universal and philosophical dogmas in nature, so well understood by the primitive Sages.\n\nWe find the same groundwork in several personifications in the Puranas, only far more ample and philosophically suggestive.\n\nThus Pulastya, a \"Son of God\" -- one of the first progeny -- is made the progenitor of Demons, the Rakshasas, the tempters and the Devourers of men.\n\nPisacha (female Demon) is a daughter of Daksha, a \"Son of God\" too, and a God, and the mother of all the Pisachas ( Padma Purana ) .\n\nThe Demons, so called in the Puranas, are very extraordinary devils when judged from the standpoint of European and orthodox views about these creatures, since all of them -- Danavas, Daityas, Pisachas, and the Rakshasas -- are represented as extremely pious, following the precepts of the Vedas, some of them even being great Yogis.\n\nBut they oppose the clergy and Ritualism, sacrifices and forms -- just what the full-blown Yogins do to this day in India -- and are no less respected for it, though they are allowed to follow neither caste nor ritual; hence all those Puranic giants and Titans are called Devils.\n\nThe Missionaries, ever on the watch to show, if they can, the Hindu traditions no better than a reflection of the Jewish Bible, have evolved a whole romance on the alleged identity of Pulastya with Cain, and of the Rakshasas with the Cainites, \"the accursed,\" the cause of the Noachian Deluge.\n\n(See the work of Abbe Gorresio, who \"etymologises\" Pulastya's name as meaning the \"rejected,\" hence Cain, if you please).\n\nPulastya dwells in Kedara , he says, which means a \"dug-up place,\" a mine , and Cain is shown in tradition and the Bible as the first worker in metals and a miner thereof!\n\nWhile it is very probable that the Gibborim (the giants) of the Bible are the Rakshasas of the Hindus, it is still more certain that both are Atlanteans, and belong to the submerged races.\n\nHowever it may be, no Satan could be more persistent in slandering his enemy, or more spiteful in his hatred, than the Christian theologians are in cursing him as the father of every evil.\n\nCompare their vituperations and opinions given about the Devil with the philosophical views of the Puranic sages and their Christ-like mansuetude.\n\nWhen Parasara, whose father was devoured by a Rakshasa, was preparing himself to destroy (magically) the whole race, his grandsire, Vasishta, says a few extremely suggestive words to him.\n\nHe shows the irate Sage, on his own confession, that there is Evil and Karma , but no \"evil spirits.\" \"Let thy wrath be appeased,\" he says.\n\n\"The Rakshasas are not culpable; thy father's death was the work of Karma.\n\nAnger is the passion of fools; it becometh not a wise man.\n\nBy whom , it may be asked , is any one killed?\n\nEvery man reaps the consequences of his own acts."


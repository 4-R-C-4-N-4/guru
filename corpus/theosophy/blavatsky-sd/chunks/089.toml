[content]
body = "To return to \"Esoteric Buddhism.\" It is there stated with regard to the enormous period intervening between the mineral epoch on Globe A, and the man-epoch,* that: \"The full development of the [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] Earth as a plank of salvation for the personalities in which it indwells.\n\nIt is for the latter to cling to it; and thus partaking of its divine nature, obtain immortality.\n\nLeft to itself the Monad will cling to no one; but, like the \"plank,\" be drifted away to another incarnation by the unresting current of evolution.\n\n* The term \"Man epoch\" is here used because of the necessity of giving a name to that fourth kingdom which follows the animal.\n\nBut in truth the \"Man\" on Globe A during the First Round is no Man, but only his prototype or dimensionless image from the astral regions.\n\n[[Vol.\n\n1, Page]] 176 THE SECRET DOCTRINE.\n\nmineral epoch on Globe A, prepares the way for the vegetable development, and, as soon as this begins, the mineral life-impulse overflows into Globe B.\n\nThen, when the vegetable development on Globe A is complete and the animal development begins, the vegetable life-impulse overflows to Globe B, and the mineral impulse passes on to Globe C.\n\nThen finally comes the human life-impulse on Globe A.\" (Page 49.) And so it goes on for three Rounds, when it slackens, and finally stops at the threshold of our Globe, at the Fourth Round; because the human period (of the true physical men to be), the seventh, is now reached.\n\nThis is evident, for as said, \" .\n\n.\n\n.\n\nthere are processes of evolution which precede the mineral kingdom, and thus a wave of evolution, indeed several waves of evolution, precede the mineral wave in its progress round the spheres\" ( ibid ) .\n\nAnd now we have to quote from another article, \"The Mineral Monad\" in \" Five Years of Theosophy ,\" p.\n\n273 et seq.\n\n\"There are seven kingdoms.\n\nThe first group comprises three degrees of elementals, or nascent centres of forces -- from the first stage of differentiation of (from) Mulaprakriti (or rather Pradhana, primordial homogeneous matter) to its third degree -- i.e.\n\n, from full unconsciousness to semi-perception; the second or higher group embraces the kingdoms from vegetable to man; the mineral kingdom thus forming the central or turning point in the degrees of the \"Monadic Essence,\" considered as an evoluting energy.\n\nThree stages (sub-physical) on the elemental side; the mineral kingdom; three stages on the objective physical* side -- these are the (first or preliminary) seven links of the evolutionary chain.\" \"Preliminary\" because they are preparatory, and though belonging in fact to the natural, they yet would be more correctly described as sub-natural evolution.\n\nThis process makes a halt in its stages at the Third, at the threshold of the Fourth stage, when it becomes, on the plane of the natural evolution, the first really manward stage, thus forming with the three elemental kingdoms, the ten, the Sephirothal number.\n\nIt is at this point that begins: -- \"A descent of spirit into matter equivalent to an ascent in physical [[Footnote(s)]] ------------------------------------------------- * \"Physical\" here means differentiated for cosmical purposes and work; that \"physical side,\" nevertheless, if objective to the apperception of beings from other planes, is yet quite subjective to us on our plane.\n\n[[Vol.\n\n1, Page]] 177 AS ABOVE, SO BELOW, IS THE LAW.\n\nevolution; a re-ascent from the deepest depths of materiality (the mineral) towards its status quo ante , with a corresponding dissipation of concrete organism -- up to Nirvana, the vanishing point of differentiated matter.\" (\" Five Years of Theosophy ,\" p.\n\n276.) Therefore it becomes evident why that which is pertinently called in Esoteric Buddhism \"Wave of Evolution,\" and mineral-, vegetable-, animal- and man-\"impulse,\" stops at the door of our Globe, at its Fourth cycle or Round.\n\nIt is at this point that the Cosmic Monad (Buddhi) will be wedded to and become the vehicle of the Atmic Ray, i.e.\n\n, it (Buddhi) will awaken to an apperception of it (Atman); and thus enter on the first step of a new septenary ladder of evolution, which will lead it eventually to the tenth (counting from the lowest upwards) of the Sephirothal tree, the Crown.\n\nEverything in the Universe follows analogy.\n\n\"As above, so below\"; Man is the microcosm of the Universe.\n\nThat which takes place on the spiritual plane repeats itself on the Cosmic plane.\n\nConcretion follows the lines of abstraction; corresponding to the highest must be the lowest; the material to the spiritual.\n\nThus, corresponding to the Sephirothal Crown (or upper triad) there are the three elemental Kingdoms, which precede the Mineral (see diagram on p.\n\n277 in Five Years of Theosophy ), and which, using the language of the Kabalists, answer in the Cosmic differentiation to the worlds of Form and Matter from the Super-Spiritual to the Archetypal.\n\nNow what is a \"Monad?\" And what relation does it bear to an Atom?\n\nThe following reply is based upon the explanations given in answer to these questions in the above-cited article: \"The Mineral Monad,\" written by the author.\n\n\"None whatever,\" is answered to the second question, \"to the atom or molecule as existing in the scientific conception at present.\n\nIt can neither be compared with the microscopic organism, once classed among polygastric infusoria, and now regarded as vegetable, and classed among Algae; nor is it quite the Monas of the Peripatetics.\n\nPhysically or constitutionally the mineral monad differs, of course, from the human monad, which is neither physical nor can its constitution be rendered by chemical symbols and elements.\" In short, as the spiritual Monad is One, Universal, Boundless and Impartite, whose rays, nevertheless, form what we, in our ignorance, call the \"Individual Monads\" of men, [[Vol.\n\n1, Page]] 178 THE SECRET DOCTRINE.\n\nso the Mineral Monad -- being at the opposite point of the circle -- is also One -- and from it proceed the countless physical atoms, which Science is beginning to regard as individualized.\n\nOtherwise how could one account for and explain mathematically the evolutionary and spiral progress of the Four Kingdoms?\n\nThe \"Monad\" is the combination of the last two \"principles\" in man, the 6th and the 7th, and, properly speaking, the term \"human monad\" applies only to the dual soul (Atma-Buddhi), not to its highest spiritual vivifying Principle, Atma, alone.\n\nBut since the Spiritual Soul, if divorced from the latter (Atma) could have no existence, no being, it has thus been called .\n\n.\n\n.\n\n."


body = "\"If many men,\" he declares -- \"and among them even some scientists of repute -- hold that the whole of phylogeny is a castle in the air, and genealogical trees (from monkeys?) are empty plays of phantasy, they only in speaking thus demonstrate their ignorance of that wealth of empirical sources of knowledge to which reference has already been made\" (\"Pedigree of Man,\" p.\n\n273).\n\nWe open Webster's Dictionary and read the definitions of the word \"empirical\": \"Depending upon experience or observation alone, without due regard to modern science and theory.\n\n\" This applies to the Occultists, Spiritualists, Mystics, etc., etc.\n\nAgain, \"an Empiric -- One who confines himself to applying the results of his own observations\" (only) [[Vol.\n\n2, Page]] 665 MR.\n\nHUXLEY APPLIES AN \"EXTINGUISHER.\" (which is Haeckel's case); \"one wanting Science .\n\n.\n\n.\n\n.\n\nan ignorant and unlicensed practitioner; a quack; a CHARLATAN.\" No Occultist or \"magician,\" has ever been treated to any worse epithets.\n\nYet the Occultist remains on his own metaphysical grounds, and does not endeavour to rank his knowledge, the fruits of his personal observation and experience, among the exact sciences of modern learning.\n\nHe keeps within his legitimate sphere, where he is master.\n\nBut what is one to think of a rank materialist, whose duty is clearly traced before him, who uses such an expression as this: -- \"The origin of man from other mammals, and most directly from the catarrhine ape, is a deductive law, that follows necessarily from the inductive law of the T HEORY OF D ESCENT.\" (\" Anthropogeny, \" p.\n\n392).\n\nA \"theory\" is simply a hypothesis, a speculation, and no law.\n\nTo say otherwise is only one of the many liberties taken now-a-days by scientists.\n\nThey enunciate an absurdity, and then hide it behind the shield of Science.\n\nAny deduction from theoretical speculation is no better than a speculation on a speculation.\n\nNow Sir W.\n\nHamilton has already shown that the word theory is now used \"in a very loose and improper sense\" .\n\n.\n\n.\n\n.\n\n\"that it is convertible into hypothesis, and hypothesis is commonly used as another term for conjecture, whereas the terms 'theory' and 'theoretical' are properly used in opposition to the term practice and practical.\n\n\" But modern Science puts an extinguisher on the latter statement, and mocks at the idea.\n\nMaterialistic philosophers and Idealists of Europe and America may be agreed with the Evolutionists as to the physical origin of man -- yet it will never become a general truth with the true metaphysician, and the latter defies the materialists to make good their arbitrary assumptions.\n\nThat the ape-theory theme* of Vogt and Darwin, on which the Huxley-Haeckelians have composed of late such extraordinary variations, is far less scientific -- because clashing with the fundamental laws of that theme itself -- than ours can ever be [[Footnote(s)]] ------------------------------------------------- * The mental barrier between man and ape, characterized by Huxley as an \" enormous gap, a distance practically immeasurable \"!\n\n!\n\nis, indeed, in itself conclusive.\n\nCertainly it constitutes a standing puzzle to the materialist, who relies on the frail reed of \"natural selection.\" The physiological differences between Man and the Apes are in reality -- despite a curious community of certain features -- equally striking.\n\nSays Dr.\n\nSchweinfurth, one of the most cautious and experienced of naturalists: -- \"In modern times there are no animals in creation that have attracted more attention from the scientific student than the great quadrumana (the anthropoids), bearing such a striking resemblance to the human form as to have justified the epithet of anthropomorphic being conferred on them.\n\n.\n\n.\n\n.\n\nBut all investigation at present only leads human intelligence to a confession of its insufficiency ; and nowhere is caution more to be advocated, nowhere is premature judgment more to be deprecated than in the attempt to bridge over the MYSTERIOUS CHASM which separates man and beast.\n\n\" \" Heart of Africa \" i., 520.\n\n[[Vol.\n\n2, Page]] 666 THE SECRET DOCTRINE.\n\nshown to be, is very easy of demonstration.\n\nLet the reader only turn to the excellent work on \"Human Species\" by the great French naturalist de Quatrefages, and our statement will at once be verified.\n\nMoreover, between the esoteric teaching concerning the origin of man and Darwin's speculations, no man, unless he is a rank materialist, will hesitate.\n\nThis is the description given by Mr.\n\nDarwin of \"the earliest ancestors of man.\" \"They were without doubt once covered with hair; both sexes having beards; their ears were pointed and capable of movement; and their bodies were provided with a tail, having the proper muscles.\n\nTheir limbs and bodies were acted on by many muscles which now only occasionally reappear in man, but which are still normally present in the quadrumana.\n\n.\n\n.\n\n.\n\nThe foot, judging from the condition of the great toe in the foetus, was then prehensile, and our progenitors, no doubt, were arboreal in their habits, frequenting some warm forest-clad land, and the males were provided with canine teeth which served as formidable weapons.\n\n.\n\n.\n\n.\"* Darwin connects him with the type of the tailed catarrhines, \"and consequently removes him a stage backward in the scale of evolution.\n\nThe English naturalist is not satisfied to take his stand upon the ground of his own doctrines, and, like Haeckel, on this point places himself in direct variance with one of the fundamental laws which constitute the principal charm of Darwinism .\n\n.\n\n.\n\n\" And then the learned French naturalist proceeds to show how this fundamental law is broken.\n\n\"In fact,\" he says, \"in the theory of Darwin, transmutations do not take place, either by chance or in every direction.\n\nThey are ruled by certain laws which are due to the organization itself.\n\nIf an organism is once modified in a given direction, it can undergo secondary or tertiary transmutations, but will still preserve the impress of the original.\n\nIt is the law of permanent characterization, which alone permits Darwin to explain the filiation of groups, their characteristics, and their numerous relations.\n\nIt is by virtue of this law that all the descendants of the first mollusc have been molluscs; all the descendants of the first vertebrate have been vertebrates.\n\nIt is clear that this constitutes one of the foundations of the doctrine.\n\n.\n\n.\n\n.\n\nIt follows that two beings belonging to two distinct types can be referred to a common ancestor, but the one cannot be the descendant of the other\"; ( p .\n\n106).\n\n\"Now man and ape present a very striking contrast in respect to type.\n\nTheir organs .\n\n.\n\n.\n\ncorrespond almost exactly term for term: but these [[Footnote(s)]] ------------------------------------------------- * A ridiculous instance of evolutionist contradictions is afforded by Schmidt (\" Doctrine of Descent and Darwinism, \" on page 292)."


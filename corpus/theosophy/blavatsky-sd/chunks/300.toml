[content]
body = "For Roman Catholics, Satan is at the foundation of Kosmos, Christ in its centre, and Antichrist at its apex.\n\nFor both, the Hierarchy of Being begins and ends within the narrow frames of their respective theologies: one self-created personal God and an Empyrean ringing with the Hallelujas of created angels; the rest, false gods, Satan and fiends.\n\nTheophilosophy proceeds on broader lines.\n\nFrom the very beginning of AEons -- in time and space in our Round and Globe -- the Mysteries of Nature (at any rate, those which it is lawful for our races to know) were recorded by the pupils of those same now invisible \"heavenly men,\" in geometrical figures and symbols.\n\nThe keys thereto passed from one generation of \"wise men\" to the other.\n\nSome of the symbols, thus passed from the east to the west, were brought therefrom by Pythagoras, who was not the inventor of his famous \"Triangle.\" The latter figure, along with the plane cube and circle, are more eloquent and scientific descriptions of the order of the evolution of the Universe, spiritual and psychic, as well as physical, than volumes of descriptive Cosmogonies and revealed \" Geneses .\" The ten points inscribed within that \"Pythagorean triangle \" are worth all the theogonies and angelologies ever emanated from the theological brain.\n\nFor he who interprets them -- on their very face, and in the order given -- will find in these seventeen points (the seven Mathematical Points hidden) the uninterrupted series of the genealogies from the first Heavenly to terrestrial man.\n\nAnd, as they give the order of Beings, so they reveal the order in which were evolved the Kosmos, our earth, and the primordial elements by [[Vol.\n\n1, Page]] 613 THE MATHEMATICAL POINT.\n\nwhich the latter was generated.\n\nBegotten in the invisible Depths , and in the womb of the same \"Mother\" as its fellow-globes -- he who will master the mysteries of our Earth, will have mastered those of all others.\n\nWhatever ignorance, pride or fanaticism may suggest to the contrary, Esoteric Cosmology can be shown inseparably connected with both philosophy and modern science.\n\nThe gods of the ancients, the monads -- from Pythagoras down to Leibnitz -- and the atoms of the present materialistic schools (as borrowed by them from the theories of the old Greek Atomists) are only a compound unit, or a graduated unity like the human frame, which begins with body and ends with spirit.\n\nIn the occult sciences they can be studied separately, but never mastered unless viewed in their mutual correlations during their life-cycle, and as a Universal Unity during Pralayas.\n\nLa Pluche shows sincerity, but gives a poor idea of his philosophical capacities when declaring his personal views on the Monad or the Mathematical Point.\n\n\"A point,\" he says, \"is enough to put all the schools in the world in a combustion.\n\nBut what need has man to know that point, since the creation of such a small being is beyond his power?\n\nA fortiori , philosophy acts against probability when, from that point which absorbs and disconcerts all her meditations, she presumes to pass on to the generation of the world.\n\n.\n\n.\n\n.\" Philosophy, however, could never have formed its conception of a logical, universal, and absolute Deity if it had no Mathematical Point within the Circle to base its speculations upon.\n\nIt is only the manifested Point, lost to our senses after its pregenetic appearance in the infinitude and incognizability of the Circle, that made a reconciliation between philosophy and theology possible -- on condition that the latter should abandon its crude materialistic dogmas.\n\nAnd it is because it has so unwisely rejected the Pythagorean Monad and geometrical figures, that Christian theology has evolved its self-created human and personal God, the monstrous Head from whence flow in two streams the dogmas of Salvation and Damnation.\n\nThis is so true that even those clergymen who would be philosophers and who were masons, have, in their arbitrary interpretations, fathered upon the ancient sages the queer idea that \"the Monad represented (with them) the throne of the Omnipotent Deity, placed in the centre of the Empyrean to indicate T.G.A.O.T.U .\"* -- read \"the Great Architect of the Universe.\" A curious explanation this, more Masonic than strictly Pythagorean.\n\nNor did the \"hierogram within a Circle, or equilateral Triangle,\" [[Footnote(s)]] ------------------------------------------------- * \"Science of Numbers,\" by the Rev.\n\nG.\n\nOliver (p.\n\n36).\n\n[[Vol.\n\n1, Page]] 614 THE SECRET DOCTRINE.\n\never mean \"the exemplification of the unity of the divine Essence\"; for this was exemplified by the plane of the boundless Circle.\n\nWhat it really meant was the triune co-equal Nature of the first differentiated Substance, or the con - substantiality of the (manifested) Spirit, matter and the Universe -- their \"Son,\" who proceeds from the Point (the real, esoteric L OGOS) or the Pythagorean M ONAD.\n\nFor the Greek Monas signifies \"Unity\" in its primary sense.\n\nThose unable to seize the difference between the monad -- the Universal Unit -- and the Monads or the manifested Unity, as also between the ever-hidden and the revealed L OGOS or the Word , ought never to meddle in philosophy, let alone the Esoteric Sciences.\n\nIt is needless to remind the educated reader of Kant's Thesis to demonstrate his second Antinomy.\n\n* Those who have read and understood it will see clearly the line we draw between the absolutely Ideal Universe and the invisible though manifested Kosmos.\n\nOur Gods and Monads are not the Elements of extension itself, but only those of the invisible reality which is the basis of the manifested Kosmos.\n\nNeither esoteric philosophy, nor Kant, nor Leibnitz would ever admit that extension can be composed of simple or unextended parts.\n\nBut theologian-philosophers will not grasp this.\n\nThe Circle and the Point, which latter retires into and merges with the former, after having emanated the first three points and connected them with lines, thus forming the first noumenal basis of the Second Triangle in the Manifested World, have ever been an insuperable obstacle to theological flights into dogmatic Empyreans.\n\nOn the authority of this Archaic Symbol, a male, personal god, the Creator and Father of all, becomes a third-rate emanation, the Sephiroth standing fourth in descent, and on the left hand of En-Soph (see the Kabalistic Tree of Life ) .\n\nHence, the Monad is degraded into a Vehicle -- a \"throne\"!"


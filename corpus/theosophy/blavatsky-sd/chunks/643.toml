[content]
body = "The seven Rishis and the fourteen Manus of the seven Manvantaras -- issue from Brahma's head; they are his \"mind-born sons,\" and it is with them that begins the division of mankind and its races from the Heavenly man, \"the Logos\" (the manifested), who is Brahma Prajapati.\n\nSays (V.\n\n70 in) the \"Ha Idra Rabba Qadisha\" (the Greater Holy Assembly) of the skull (head) [[Footnote(s)]] ------------------------------------------------- * See for the length of such cycles or Yugas in Vriddha Garga and other ancient astronomical Sections (Jyotisha).\n\nThey vary from the cycle of five years -- which Colebrooke calls \"the cycle of the Vedas,\" specified in the institutes of Parasara, \"and the basis of calculation for larger cycles\" ( Miscell.\n\nEssays, Vol.\n\nI., pp.\n\n106 and 108) -- up to the Mahayuga or the famous cycle of 4,320,000 years.\n\n** The Hebrew word for \"week\" is Seven; and any length of time divided by Seven would have been a \"week\" in their day, even 49,000,000 years, as it is seven times seven millions.\n\nBut their calculation is throughout septiform.\n\n[[Vol.\n\n2, Page]] 625 THE HAIRY SYMBOL.\n\nof Macroprosopus, the ancient One* ( Sanat, an appellation of Brahma), that in every one of his hairs is a \"hidden fountain issuing from the concealed brain.\" \"And it shineth and goeth forth through that hair unto the hair of Microprosopus, and from it (which is the manifest Q UATERNARY, the Tetragrammaton ) his brain is formed; and thence that brain goeth into THIRTY and TWO paths\" (or the triad and the duad, or again 432).\n\nAnd again: (V.\n\n80) \"Thirteen curls of hair exist on the one side and on the other of the skull\" -- i.e.\n\n, six on one and six on the other, the thirteenth being also the fourteenth, as it is male-female, \"and through them commenceth the division of the hair\" (the division of things, Mankind and Races).\n\n\"We six are lights which shine forth from a seventh (light),\" saith Rabbi Abba; \" thou art the seventh light \" (the synthesis of us all, he adds, speaking of Tetragrammaton and his seven \"companions,\" whom he calls \"the eyes of Tetragrammaton.\") T ETRAGRAMMATON is Brahma Prajapati, who assumed four forms, in order to create four kinds of supernal creatures, i.e.\n\n, made himself fourfold, or the manifest Quaternary (see Vishnu Purana, Book I.\n\nch.\n\nV.); and who, after that, is re-born in the seven Rishis, his Manasaputras, \"mind-born sons,\" who became later, 9, 21 and so on, who are all said to be born from various parts of Brahma** [[Footnote(s)]] ------------------------------------------------- * Brahma creates in the first Kalpa (day one) various \"sacrificial animals\" pasu - - or the celestial bodies and the Zodiacal signs, and plants which he uses in sacrifices at the opening of Treta Yuga.\n\nThe esoteric meaning of it shows him proceeding cyclically and creating astral prototypes on the descending spiritual arc and then on the ascending physical arc.\n\nThe latter is the sub-division of a two-fold creation, subdivided again into seven descending and seven ascending degrees of spirit falling, and of matter ascending -- the inverse of what takes place (as in a mirror which reflects the right on the left side) in this manvantara of ours.\n\nIt is the same, esoterically, in the Elohistic Genesis (chap.\n\ni.), and in the Jehovistic copy, as in Hindu cosmogony.\n\n** It is very surprising to see theologians and Oriental scholars express indignation at the \" depraved taste of the Hindu mystics\" who, not content with having invented the \"Mind-born\" Sons of Brahma, make the Rishis, Manus, and Prajapatis of every kind spring from various parts of the body of their primal Progenitor -- Brahma (see Wilson's footnote in his Vishnu Purana, Vol.\n\nI., p.\n\n102).\n\nBecause the average public is unacquainted with the Kabala, the key to, and glossary of, the much veiled Mosaic Books, therefore, the clergy imagines the truth will never out.\n\nLet any one turn to the English, Hebrew, or Latin texts of the Kabala, now so ably translated by several scholars, and he will find that the Tetragrammaton, which is the Hebrew IHVH, is also both the \"Sephirothal Tree\"-- i.e.\n\n, it contains all the Sephiroth except Kether, the crown -- and the united body of the \"Heavenly man\" (Adam Kadmon) from whose limbs emanate the Universe and everything in it.\n\nFurthermore, he will find that the idea in the Kabalistic Books (the chief of which in the Zohar are the \"Books of Concealed Mystery,\" of the \"Greater,\" and the \"Lesser Holy Assembly\") is entirely phallic and far more crudely expressed than is the four-fold Brahma in any of the Puranas.\n\n(See \" Kabala Unveiled, \" by Mr.\n\nS.\n\nL.\n\nMathers, Chap.\n\nxxii., concerning the remaining members of Microprosopus).\n\n[[Vol.\n\n2, Page]] 626 THE SECRET DOCTRINE.\n\nThere are two Tetragrammatons: the Macro and the Microprosopus.\n\nThe first is the absolute perfect Square, or the T ETRACTIS within the Circle, both abstract conceptions, and is therefore called A IN -- the Non-being, i.e ., illimitable or absolute Be-ness.\n\nBut when viewed as Microprosopus, or the \"Heavenly man,\" the manifested Logos, he is the triangle in the square -- the sevenfold cube not the fourfold, or the plane Square.\n\nFor it is written in the same \"Greater Holy Assembly\" -- (83): \"And concerning this, the children of Israel wished to know in their minds, like as it is written ( Exod.\n\nxvii.\n\n7.): 'Is the Tetragrammaton in the midst of us, or the Negatively Existent One?'* ( Where did they distinguish between Microprosopus, who is called Tetragrammaton, and between Macroprosopus, who is called A IN, Ain the negatively existent?) \"** Therefore, Tetragrammaton is the THREE made four and the FOUR made three, and is represented on this Earth by his seven \"companions,\" or \"Eyes\" -- the \"Seven eyes of the Lord.\" Microprosopus is, at best, only a secondary manifested Deity."


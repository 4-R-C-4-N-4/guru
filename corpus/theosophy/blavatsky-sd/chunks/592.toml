body = "18.220 \" The average of the now living Europeans is 18.579 inches; of Hottentots, 17.795 inches!\n\nWhich figures show plainly \"that the size of the brain of the oldest populations known to us is not such as to place them on a lower level than that of the now living inhabitants of the Earth\" (\" The Age and Origin of Man \").\n\nBesides which, they show the \"missing link\" vanishing into thin air.\n\nOf these, however, more anon: we must return to our direct subject.\n\nThe race which Jupiter so ardently desired \"to quench, and plant a new one in its stead\" ( AEsch.* 241), suffered mental , not physical misery.\n\nThe first boon Prometheus gave to mortals, as he tells the \"Chorus,\" was to hinder them \"from foreseeing death\" (256); he \"saved the mortal race from sinking blasted down to Hades' gloom\" (244); and then only, \"besides\" that, he gave them fire (260).\n\nThis shows plainly the dual character, at any rate of the Promethean myth, if Orientalists will not accept the existence of the seven keys taught in Occultism.\n\nThis relates to the first opening of man's spiritual perceptions, not to his first seeing or discovering fire .\n\nFor fire was never \"discovered,\" but existed on earth since its beginning.\n\nIt existed in the seismic activity of the early ages, volcanic eruptions being as frequent and constant in those periods as fog is in England now.\n\nAnd if we are told that men appeared so late on Earth that nearly all the volcanoes, with the exception of a few, were already extinct, and that geological disturbances had made room for a more settled state of things, we answer: Let a new race of men -- whether evolved from angel or gorilla -- appear now on any uninhabited [[Footnote(s)]] ------------------------------------------------- * Prometheus Vinctus.\n\n[[Vol.\n\n2, Page]] 524 THE SECRET DOCTRINE.\n\nspot of the globe, with the exception perhaps of the Sahara, and a thousand to one it would not be a year or two old before discovering fire, through the fall of lightning setting in flames grass or something else.\n\nThis assumption, that primitive man lived ages on earth before he was made acquainted with fire, is one of the most painfully illogical of all.\n\nBut old AEschylus was an initiate, and knew well what he was giving out.* No occultist acquainted with symbology and the fact that Wisdom came to us from the East, will deny for a moment that the myth of Prometheus has reached Europe from Aryavarta.\n\nNor is he likely to deny that in one sense Prometheus represents fire by friction .\n\nTherefore, he admires the sagacity of M.\n\nF.\n\nBaudry, who shows in his Les Mythes du feu et breuvage celeste ( Revue germanique, 1861 p .\n\n356)** one of the aspects of Prometheus and his origin from India.\n\nHe shows the reader the supposed primitive process to obtain fire, still in use to-day in India to light the sacrificial flame.\n\nThis is what he says: -- \"This process, such as it is minutely described in the Vedic Sutras, consists in rapidly turning a stick in a socket made in the centre of a piece of wood.\n\nThe friction develops intense heat and ends by setting on fire the particles of wood in contact.\n\nThe motion of the stick is not a continuous rotation, but a series of motions in contrary senses, by means of a cord fixed to the stick in its middle: the operator holds one of the ends in each hand and pulls them alternately.\n\n.\n\n.\n\n.\n\nThe full process is designated in Sanskrit by the verb manthami, mathnani; which means 'to rub, agitate, shake and obtain by rubbing,' and is especially applied to rotatory friction, as proved by its derivation from mandala, which signifies a circle.\n\n.\n\n.\n\n.\n\nThe pieces of wood serving for the production of fire have each their name in Sanskrit.\n\nThe stick which turns is called pramantha; the discus which receives it is called arani and aranî two aranis' designating the ensemble of the instrument\" ( p .\n\n358 et seq .) .*** It remains to be seen what the Brahmins will say to this.\n\nBut supposing Prometheus has been conceived in one of the aspects of his [[Footnote(s)]] ------------------------------------------------- * The modern attempt of some Greek scholars (poor and pseudo scholars, they would have appeared in the day of the old Greek writers!) to explain the real meaning of the ideas of AEschylus, which, being an ignorant ancient Greek, he could not express so well himself, is absurdly ludicrous!\n\n** See also his Memoires de la Societe de la Linguistique following the \"Fire Myths,\" ( Vol.\n\nI , p.\n\n337, et seq.\n\n) *** There is the upper and nether piece of timber used to produce this sacred fire by attrition at sacrifices, and it is the aranî which contains the socket.\n\nThis is proven by an allegory in the Vayu Purana and others, which tell us that Nemi, the son of Ikshwaku, had left no successor, and that the Rishis, fearing to leave the earth without a ruler, introduced the king's body into the socket of an aranî -- like an upper aranî -- and produced from it a prince named Janaka.\n\n\"It was by reason of the peculiar way in which he was engendered that he was called Janaka.\" ( But see Goldstucker's Sanskrit Dictionary at the word Arani.\n\n) Devaki, Krishna's mother, in prayer addressed to her, is called \"the aranî whose attrition engenders fire.\" [[Vol.\n\n2, Page]] 525 GREEK IDEAS MISUNDERSTOOD.\n\nmyth as the producer of fire by means of pramantha, or as an animate and divine pramantha, would this imply that the symbolism had no other than the phallic meaning attributed to it by the modern symbologists?\n\nDecharme, at any rate, seems to have a correct glimmering of the truth; for he unconsciously corroborates by his remarks all that the Occult sciences teach with regard to the Manasa Devas, who have endowed man with the consciousness of his immortal soul: that consciousness which hinders man \"from foreseeing death,\" and makes him know he is immortal.* \"How has Prometheus got into the possession of the (divine) spark?\" he asks.\n\n\"Fire having its abode in heaven, it is there he must have gone to find it before he could carry it down to men, and, to approach the gods, he must have been a god himself.\" The Greeks held that he was of the divine race; the Hindus, that he was a Deva.\n\nHence \"with the Greeks he was the son of the Titan lapetos,\" [[ Iapetonides ]] ( Theog.\n\n528) .\n\n.\n\n.\n\n.\n\n\"But celestial fire belonged in the beginning to the gods alone; it was a treasure they reserved for themselves .\n\n.\n\n.\n\nover which they jealously watched .\n\n.\n\n."


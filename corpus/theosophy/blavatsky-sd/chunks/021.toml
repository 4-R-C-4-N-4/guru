[content]
body = "Herbert Spencer has of late so far modified his Agnosticism, as to assert that the nature of the \"First Cause,\"* which the Occultist more logically derives from the \"Causeless Cause,\" the \"Eternal,\" and the \"Unknowable,\" may be essentially the same as that of the Consciousness which wells up within us: in short, that the impersonal reality pervading [[Footnote(s)]] ------------------------------------------------- *The \"first\" presupposes necessarily something which is the \"first brought forth, the first in time, space, and rank\" -- and therefore finite and conditioned.\n\nThe \"first\" [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 15 PROEM.\n\nthe Kosmos is the pure noumenon of thought.\n\nThis advance on his part brings him very near to the esoteric and Vedantin tenet.* Parabrahm (the One Reality, the Absolute) is the field of Absolute Consciousness, i.e., that Essence which is out of all relation to conditioned existence, and of which conscious existence is a conditioned symbol.\n\nBut once that we pass in thought from this (to us) Absolute Negation, duality supervenes in the contrast of Spirit (or consciousness) and Matter, Subject and Object.\n\nSpirit (or Consciousness) and Matter are, however, to be regarded, not as independent realities, but as the two facets or aspects of the Absolute (Parabrahm), which constitute the basis of conditioned Being whether subjective or objective.\n\nConsidering this metaphysical triad as the Root from which proceeds all manifestation, the great Breath assumes the character of precosmic Ideation.\n\nIt is the fons et origo of force and of all individual consciousness, and supplies the guiding intelligence in the vast scheme of cosmic Evolution.\n\nOn the other hand, precosmic root-substance ( Mulaprakriti ) is that aspect of the Absolute which underlies all the objective planes of Nature.\n\nJust as pre-Cosmic Ideation is the root of all individual consciousness, so pre-Cosmic Substance is the substratum of matter in the various grades of its differentiation.\n\nHence it will be apparent that the contrast of these two aspects of the Absolute is essential to the existence of the \"Manifested Universe.\" Apart from Cosmic Substance, Cosmic Ideation could not manifest as individual consciousness, since it is only through a vehicle ** of matter that consciousness wells up as \"I am I,\" a physical basis being necessary to focus a ray of the Universal Mind at a certain stage of complexity.\n\nAgain, apart from Cosmic Ideation, Cosmic Substance would remain an empty abstraction, and no emergence of consciousness could ensue.\n\nThe \"Manifested Universe,\" therefore, is pervaded by duality, which is, as it were, the very essence of its EX-istence as \"manifestation.\" [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] cannot be the absolute , for it is a manifestation.\n\nTherefore, Eastern Occultism calls the Abstract All the \"Causeless One Cause,\" the \"Rootless Root,\" and limits the \"First Cause\" to the Logos, in the sense that Plato gives to this term.\n\n* See Mr.\n\nSubba Row's four able lectures on the Bhagavad Gita, \"Theosophist,\" February, 1887.\n\n** Called in Sanskrit: \"Upadhi.\" [[Vol.\n\n1, Page]] 16 THE SECRET DOCTRINE.\n\nBut just as the opposite poles of subject and object, spirit and matter, are but aspects of the One Unity in which they are synthesized, so, in the manifested Universe, there is \"that\" which links spirit to matter, subject to object.\n\nThis something, at present unknown to Western speculation, is called by the occultists Fohat.\n\nIt is the \"bridge\" by which the \"Ideas\" existing in the \"Divine Thought\" are impressed on Cosmic substance as the \"laws of Nature.\" Fohat is thus the dynamic energy of Cosmic Ideation; or, regarded from the other side, it is the intelligent medium, the guiding power of all manifestation, the \"Thought Divine\" transmitted and made manifest through the Dhyan Chohans,* the Architects of the visible World.\n\nThus from Spirit, or Cosmic Ideation, comes our consciousness; from Cosmic Substance the several vehicles in which that consciousness is individualised and attains to self -- or reflective -- consciousness; while Fohat, in its various manifestations, is the mysterious link between Mind and Matter, the animating principle electrifying every atom into life.\n\nThe following summary will afford a clearer idea to the reader.\n\n(1.) The A BSOLUTE; the Parabrahm of the Vedantins or the one Reality, S AT, which is, as Hegel says, both Absolute Being and Non-Being.\n\n(2.) The first manifestation, the impersonal, and, in philosophy, unmanifested Logos, the precursor of the \"manifested.\" This is the \"First Cause,\" the \"Unconscious\" of European Pantheists.\n\n(3.) Spirit-matter, L IFE; the \"Spirit of the Universe,\" the Purusha and Prakriti, or the second Logos.\n\n(4.) Cosmic Ideation, M AHAT or Intelligence, the Universal World-Soul; the Cosmic Noumenon of Matter, the basis of the intelligent operations in and of Nature, also called M AHA- B UDDHI.\n\nThe O NE R EALITY; its dual aspects in the conditioned Universe.\n\nFurther, the Secret Doctrine affirms: -- ( b.\n\n) The Eternity of the Universe in toto as a boundless plane; periodically \"the playground of numberless Universes incessantly manifesting and disappearing,\" called \"the manifesting stars,\" and the \"sparks of Eternity.\" \"The Eternity of the Pilgrim\"* * is like a wink [[Footnote(s)]] ------------------------------------------------- * Called by Christian theology: Archangels, Seraphs, etc., etc.\n\n** \"Pilgrim\" is the appellation given to our Monad (the two in one) during its cycle of incarnations.\n\nIt is the only immortal and eternal principle in us, being an indivisible part of the integral whole -- the Universal Spirit, from which it emanates, and into which it is absorbed at the end of the cycle.\n\nWhen it is said to emanate from the one [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 17 PROEM.\n\nof the Eye of Self-Existence (Book of Dzyan.) \"The appearance and disappearance of Worlds is like a regular tidal ebb of flux and reflux.\" (See Part II., \"Days and Nights of Brahma.\") This second assertion of the Secret Doctrine is the absolute universality of that law of periodicity, of flux and reflux, ebb and flow, which physical science has observed and recorded in all departments of nature.\n\nAn alternation such as that of Day and Night, Life and Death, Sleeping and Waking, is a fact so common, so perfectly universal and without exception, that it is easy to comprehend that in it we see one of the absolutely fundamental laws of the universe."


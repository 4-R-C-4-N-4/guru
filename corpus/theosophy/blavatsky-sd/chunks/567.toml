body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n2 [[Vol.\n\n2, Page]] 475 NATURE, A STONE-COLD MOTHER.\n\n§ XVIII.\n\nON THE MYTH OF THE \"FALLEN ANGEL,\" IN ITS VARIOUS ASPECTS.\n\n------- A .\n\nT HE E VIL S PIRIT: W HO, AND W HAT?\n\nO UR present quarrel is exclusively with theology.\n\nThe Church enforces belief in a personal god and a personal devil, while Occultism shows the fallacy of such a belief.\n\nAnd though for the Pantheists and Occultists, as much as for the Pessimists, Nature is no better than \"a comely mother, but stone cold\" -- this is true only so far as regards external physical nature.\n\nThey both agree that, to the superficial observer, she is no better than an immense slaughter-house wherein butchers become victims, and victims executioners in their turn.\n\nIt is quite natural that the pessimistically inclined profane, once convinced of Nature's numerous shortcomings and failures, and especially of her autophagous propensities, should imagine this to be the best evidence that there is no deity in abscondito within Nature, nor anything divine in her.\n\nNor is it less natural that the materialist and the physicist should imagine that everything is due to blind force and chance, and to the survival of the strongest, even more often than of the fittest.\n\nBut the Occultists, who regard physical nature as a bundle of most varied illusions on the plane of deceptive perceptions; who recognise in every pain and suffering but the necessary pangs of incessant procreation: a series of stages toward an ever-growing perfectibility, which is visible in the silent influence of never-erring Karma, or abstract nature -- the Occultists, we say, view the great Mother otherwise.\n\nWoe to those who live without suffering.\n\nStagnation and death is the future of all that vegetates without a change.\n\nAnd how can there be any change for the better without proportionate suffering during the preceding stage?\n\nIs it not those only who have learnt the deceptive value of earthly hopes and the illusive allurements of external nature who are destined to solve the great problems of life, pain, and death?\n\nIf our modern philosophers -- preceded by the medieval scholars -- have helped themselves to more than one fundamental idea of antiquity, theologians have built their God and his Archangels, their Satan and his Angels, along with the Logos and his staff, entirely out of the dramatis personae of the old heathen Pantheons.\n\nThey would have been [[Vol.\n\n2, Page]] 476 THE SECRET DOCTRINE.\n\nwelcome to these, had they not cunningly distorted the original characters, perverted the philosophical meaning, and taking advantage of the ignorance of Christendom -- the result of long ages of mental sleep, during which humanity was permitted to think only by proxy -- tossed every symbol into the most inextricable confusion.\n\nOne of their most sinful achievements in this direction, was the transformation of the divine alter ego into the grotesque Satan of their theology.\n\nAs the whole philosophy of the problem of evil hangs upon the correct comprehension of the constitution of the inner being of nature and man, of the divine within the animal, and hence also the correctness of the whole system as given in these pages, with regard to the crown piece of evolution -- M AN -- we cannot take sufficient precautions against theological subterfuges.\n\nWhen the good St.\n\nAugustine and the fiery Tertullian called the Devil \"the monkey of God,\" this could be attributed to the ignorance of the age they lived in.\n\nIt is more difficult to excuse our modern writers on the same ground.\n\nThe translation of Mazdean literature has afforded to the Roman Catholic writers the pretext for proving their point in the same direction once more.\n\nThey have taken advantage of the dual nature of Ahura Mazda in the Zend Avesta and the Vendidad, and of his Amshaspends, to emphasize still further their wild theories.\n\nSatan is the plagiarist and the copyist by anticipation of the religion which came ages later.\n\nThis was one of the master strokes of the Latin Church, its best trump-card after the appearance of Spiritualism in Europe.\n\nThough only a succes d'estime, in general, even among those who are not interested in either Theosophy or Spiritualism, yet the weapon is often used by the Christian (Roman Catholic) Kabalists against the Eastern Occultists.\n\nNow even the Materialists are quite harmless, and may be regarded as the friends of Theosophy, when compared to some fanatical \"Christian\" (as they call themselves, \"Sectarian\" as we call them) Kabalists, on the Continent.\n\nThese read the Zohar, not to find in it ancient Wisdom, but to discover in its verses, by mangling the texts and meaning, Christian dogmas, where none could ever have been meant; and, having fished them out with the collective help of jesuitical casuistry and learning, the supposed \"Kabalists\" proceed to write books and to mislead less far-sighted students of the Kabala.* [[Footnote(s)]] ------------------------------------------------- * Such a pseudo -Kabalist was the Marquis de Mirville in France, who, having studied the Zohar and other old remnants of Jewish Wisdom under the \"Chevalier\" Drach, an ancient Rabbi Kabalist converted to the Romish Church -- wrote with his help half a dozen volumes full of slander and calumnies against every prominent Spiritualist and Kabalist.\n\nFrom 1848 up to 1860 he persecuted unrelentingly the old Count d'Ourches, one of the earliest Eastern Occultists in France, a man the scope of whose occult knowledge will never be appreciated correctly by his survivors, because he screened his real beliefs and knowledge under the mask of Spiritism.\n\n[[Vol.\n\n2, Page]] 477 THE GENESIS OF THE DEVIL.\n\nMay we not then be permitted to drag the deep rivers of the Past, and thus bring to the surface the root idea that led to the transformation of the Wisdom-God, who had first been regarded as the creator of everything that exists, into an Angel of Evil -- a ridiculous horned biped, half goat and half monkey, with hoofs and a tail?\n\nWe need not go out of the way to compare the pagan demons of either Egypt, India, or Chaldea with the devil of Christianity, for no such comparison is possible.\n\nBut we may stop to glance at the biography of the Christian Devil, a piratical reprint from the Chaldeo-Judaean mythology: -- The primitive origin of this personification rests upon the Akkadian conception of the cosmic powers -- the Heavens and the Earth -- in eternal feud and struggle with Chaos.\n\nTheir Silik-Muludag, \"the God amongst all the Gods,\" the \"merciful guardian of men on Earth,\" was the Son of Hea (or Ea) the great God of Wisdom, called by the Babylonians Nebu.\n\nWith both peoples -- as in the case of the Hindu gods -- their deities were both beneficent and maleficent."


[content]
body = "The Tetraktis reflecting upon its own essence, the first unit, productrix of all things, and on its own beginning, saith thus: Once one, twice two, immediately ariseth a tetrad, having on its top the highest unit, and becomes a Pyramis, whose base is a plain tetrad, answerable to a superficies, upon which the radiant light of the divine unity produceth the form of incorporeal fire, by reason of the descent of Juno (matter) to inferior things.\n\nHence ariseth essential light, not burning but illuminating.\n\nThis is the creation of the middle world, which the Hebrews call the Supreme, the world of the ( their ) deity.\n\nIt is termed Olympus, entirely light, and replete with separate forms, where is the seat of the immortal gods, ' deum domus alta, ' whose top is UNITY, its wall trinity, and its superficies quaternity.\n\n\" (Reuchlin, Cabala, p.\n\n689).\n\nThe \"superficies\" has thus to remain a meaningless surface, if left by itself.\n\nU NITY only \"illuminating\" quaternity; the famous lower four has to build for itself also a wall from trinity, if it would be manifested.\n\nMoreover, the tetragrammaton, or Microprosopus, is \"Jehovah\" arrogating to himself very improperly the \"Was, Is, Will be,\" now translated into the \" I am that I am, \" and interpreted as referring to the highest abstract Deity, while esoterically and in plain truth, it means only periodically chaotic, turbulent, and eternal MATTER with all its potentialities.\n\nFor the Tetragrammaton is one with Nature or Isis, and is the exoteric series of androgyne gods such as Osiris-Isis, Jove-Juno, Brahma-Vach, or the Kabalistic Jah-hovah; all male-females.\n\nEvery anthropomorphic god, in old nations, as Marcelinus Vicinus well observed, [[Vol.\n\n2, Page]] 602 THE SECRET DOCTRINE.\n\nhas his name written with four letters.\n\nThus with the Egyptians, he was Teut; the Arabs, Alla ; the Persians, Sire ; the Magi, Orsi; the Mohammedans, Abdi ; the Greeks, Theos; the ancient Turks, Esar; the Latins, Deus; to which J.\n\nLorenzo Anania adds the German Gott; the Sarmatian, Bouh , etc., etc.\n\nThe Monad being one, and an odd number, the ancients therefore called the odd, the only perfect numbers; and -- selfishly, perhaps, yet as a fact -- considered them all as masculine and perfect, being applicable to the celestial gods, while even numbers, such as two, four, six, and especially eight, as being female, were regarded as imperfect, and given only to the terrestrial and infernal deities.\n\nIn his eighth eclogue, Virgil records the fact by saying, \" Numero deus impare gaudet, \" \"Unequal numbers please the gods.\" But number seven, or the heptagon, the Pythagoreans considered to be a religious and perfect number.\n\nIt was called \" Telesphoros, \" because by it all in the Universe and mankind is led to its end, i.e., its culmination ( Philo.\n\nde Mund.\n\nopif.\n\n) .\n\nBeing under the rule of seven sacred planets,* the doctrine of the Spheres shows, from Lemuria to Pythagoras, the seven powers of terrestrial and sublunary nature, as well as the seven great Forces of the Universe, proceeding and evolving in seven tones, which are the seven notes of the musical scale.\n\nThe heptad (our Septenary) was regarded \" as the number of a virgin, because it is unborn \" (like the Logos or the \"Aja\" of the Vedantins); \"without a father or a mother, but proceeding directly from the Monad, which is the origin and crown of all things.\" ( Pythag.\n\nTriangle, p.\n\n174.) And if the heptad is made to proceed from the Monad directly, then it is, as taught in the Secret Doctrine of the oldest schools, the perfect and sacred number of this Maha-Manvantara of ours.\n\nThe septenary, or heptad, was sacred indeed to several gods and goddesses; to Mars, with his seven attendants, to Osiris, whose body was divided into seven and twice seven parts; to Apollo (the Sun), between his seven planets, and playing the hymn to the seven-rayed on his seven-stringed harp; to Minerva, the fatherless and the motherless, and others.\n\nCis-Himalayan Occultism with its sevening, and because of such sevening, must be regarded as the most ancient, the original of all.\n\nIt is opposed by some fragments left by Neo-Platonists; and the admirers of the latter, who hardly understand what they defend, say to us: \"See, your forerunners believed only in triple man, composed of [[Footnote(s)]] ------------------------------------------------- * The seven planets are not limited to this number because the ancients knew of no others, but simply because they were the primitive or primordial houses of the seven Logoi.\n\nThere may be nine and ninety-nine other planets discovered -- this does not alter the fact of these seven alone being sacred.\n\n[[Vol.\n\n2, Page]] 603 THE SEPTENARY DEMONSTRATED.\n\nSpirit, Soul, and body.\n\nBehold, the Taraka Raja Yoga of India limits that division to 3, we, to 4, and the Vedantins to 5 (koshas).\" To this, we of the Archaic school, ask: -- Why then does the Greek poet say that \" it is not four but SEVEN who sing the praise of the Spiritual Sun,\" [[ HEPTA ME ]]?\n\nHe says-- \"Seven sounding letters sing the praise of me, The immortal God, the Almighty deity.\" .\n\n.\n\n.\n\nWhy again is the triune I AO (the Mystery God) called the \"fourfold,\" and yet the triad and tetradic symbols come under one unified name with the Christians -- the Jehovah of the seven letters?\n\nWhy again in the Hebrew Sheba is the Oath (the Pythagorean Tetraktis ) identical with number 7; or, as Mr.\n\nG.\n\nMassey has it, \"taking an oath was synonymous with 'to seven,' and the 10 expressed by the letter Yod, was the full number of I AO- S ABAOTH, the ten-lettered God\"?\n\nIn Lucian's Auction, Pythagoras asks, \"How do you reckon?\" The reply is, \"One, Two, Three, Four.\" \"Then, do you see,\" says Pythagoras, \"in what you conceive F OUR there are Ten; then, a perfect triangle and our Oath (tetraktis, four!\n\n) , \" or Seven.\n\nWhy does Proclus say in Timaeus, c .\n\niii."


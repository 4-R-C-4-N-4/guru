body = "Moreover, the modern symbologists and Orientalists -- from first to last -- [[Footnote(s)]] ------------------------------------------------- * The Natural Genesis , by Gerald Massey, Vol.\n\n1, p.\n\n340.\n\n[[Vol.\n\n1, Page]] 406 THE SECRET DOCTRINE.\n\nbeing ignorant of the real mysteries revealed by occultism, can necessarily see but this last stage.\n\nIf told that this mode of procreation, which the whole world of being has now in common on this earth, is but a passing phase, a physical means of furnishing the conditions to, and producing the phenomena of life which will alter with this, and disappear with the next Root-Race -- they would laugh at such a superstitious and unscientific idea.\n\nBut the most learned Occultists assert this because they know it.\n\nThe universe of living beings, of all those which procreate their species, is the living witness to the various modes of procreation in the evolution of animal and human species and races; and the naturalist ought to sense this truth intuitionally, even though he is yet unable to demonstrate it.\n\nAnd how could he, indeed, with the present modes of thought!\n\nThe landmarks of the archaic history of the past are few and scarce, and those that men of science come across are mistaken for finger-posts of our little era.\n\nEven so-called \"universal\" (?) history embraces but a tiny field in the almost boundless space of the unexplored regions of our latest, fifth Root-Race.\n\nHence, every fresh sign-post, every new glyph of the hoary Past that is discovered, is added to the old stock of information, to be interpreted on the same lines of pre-existing conceptions, and without any reference to the special cycle of thought which that particular glyph may belong to.\n\nHow can Truth ever come to light if this method is never changed!\n\nThus, in the beginning of their joint existence as a glyph of Immortal Being, the Tree and Serpent were divine imagery, truly.\n\nThe tree was reversed , and its roots were generated in Heaven and grew out of the Rootless Root of all-being.\n\nIts trunk grew and developed, crossing the planes of Pleroma, it shot out crossways its luxuriant branches, first on the plane of hardly differentiated matter, and then downward till they touched the terrestrial plane.\n\nThus, the Asvattha, tree of Life and Being, whose destruction alone leads to immortality, is said in the Bhagavatgita to grow with its roots above and its branches below (ch.\n\nxv.).\n\nThe roots represent the Supreme Being, or First Cause, the LOGOS; but one has to go beyond those roots to unite oneself with Krishna , who, says Arjuna ( XI .), is \"greater than Brahman, and First Cause .\n\n.\n\n.\n\nthe indestructible, that which is, that which is not, and what is beyond them.\" Its boughs are Hiranyagharba (Brahma or Brahman in his highest manifestations, say Sridhara and Madhusudana), the highest Dhyan Chohans or Devas.\n\nThe Vedas are its leaves.\n\nHe only who goes beyond the roots shall never return, i.e.\n\n, shall reincarnate no more during this \"age\" of Brahma.\n\nIt is only when its pure boughs had touched the terrestrial mud of the garden of Eden, of our Adamic race, that this Tree got soiled by the contact and lost its pristine purity; and that the Serpent of [[Vol.\n\n1, Page]] 407 THE SEVEN-HEADED DRAGONS.\n\nEternity -- the heaven-born L OGOS -- was finally degraded.\n\nIn days of old -- of the divine Dynasties on Earth -- the now dreaded Reptile was regarded as the first beam of light that radiated from the abyss of divine Mystery.\n\nVarious were the forms which it was made to assume, and numerous the natural symbols adapted to it, as it crossed aeons of Time: as from Infinite Time itself -- Kala -- it fell into the space and time evolved out of human speculation.\n\nThese forms were Cosmic and astronomical, theistic and pantheistic, abstract and concrete.\n\nThey became in turn the Polar Dragon and the Southern Cross, the Alpha Draconis of the Pyramid, and the Hindu-Buddhist Dragon, which ever threatens, yet never swallows the Sun during its eclipses.\n\nTill then, the Tree remained ever green, for it was sprinkled by the waters of life; the great Dragon, ever divine, so long as it was kept within the precincts of the sidereal fields.\n\nBut the tree grew and its lower boughs touched at last the infernal regions -- our Earth.\n\nThen the great serpent Nidhogg -- he who devours the corpses of the evil-doers in the \"Hall of Misery\" (human life), so soon as they are plunged into \"Hwergelmir,\" the roaring cauldron (of human passions) -- gnawed the World-tree.\n\nThe worms of materiality covered the once healthy and mighty roots, and are now ascending higher and higher along the trunk; while the Midgard-snake coiled at the bottom of the Seas, encircles the Earth, and, through its venomous breath, makes her powerless to defend herself.\n\nThey are all seven-headed, the dragons and serpents of antiquity -- \"one head for each race, and every head with seven hairs on it,\" as the allegory has it.\n\nAye, from Ananta, the Serpent of Eternity which carries Vishnu through the Manvantara, from the original primordial Sesha, whose seven heads become \"one thousand heads\" in the Puranic fancy, down to the seven-headed Akkadian Serpent.\n\nThis typifies the Seven principles throughout nature and man; the highest or middle head being the seventh.\n\nIt is not of the Mosaic, Jewish Sabbath that Philo speaks in his Creation of the World , when saying that the world was completed \"according to the perfect nature of number 6.\" For, \" when that reason ( nous ) which is holy in accordance with the number seven , has entered the soul (rather the living body), the number six is thus arrested, and all the mortal things which that number makes.\" And again: \"Number 7 is the festival day of all the earth, the birthday of the world.\n\nI know not whether any one would be able to celebrate the number 7 in adequate terms.\" .\n\n.\n\n.\n\n(Par.\n\npp.\n\n30 and 419).\n\nThe author of The Natural Genesis thinks that \"the Septenary of Stars seen in the great bear (the Septarshis ) and seven-headed Dragon furnished a visible origin for the symbolic seven of time above.\n\nThe goddess of the seven stars,\" he adds -- [[Vol.\n\n1, Page]] 408 THE SECRET DOCTRINE.\n\n\"Was the mother of time, as Kep; whence Kepti and Sebti for the two times and number seven.\n\nSo this is the star of the Seven by name.\n\nSevekt (Kronos), the Son of the goddess, has the name of the seven or seventh."


[content]
body = "Venus has always been identified, since the establishment of Roman Catholic dogmatism, with Satan and Lucifer, or the great Dragon, contrary to all reason and logic.\n\nAs shown by the symbologists and astronomers, the association between the serpent and the idea of darkness had an astronomical foundation.\n\nThe position which the constellation of Draco at one time occupied showed that the great serpent was the ruler of the night.\n\nThis constellation was formerly at the very centre of the heavens, and is so extensive that it was called the Great Dragon.\n\nIts body spreads over seven signs of the Zodiac; and Dupuis, \"who,\" says Staniland Wake, \"sees in the Dragon of the Apocalypse a reference to the celestial serpent,\" remarks that \"it is not astonishing that a constellation so extended should be represented by the author of that book as a Great Dragon with seven heads, who drew the third part of the stars from heaven and cast them to Earth\"; (Dupuis, tome III ., p.\n\n255).\n\nOnly Dupuis never knew why Draco, once the pole-star -- the symbol of \"Guide,\" Guru and director -- had been thus degraded by posterity.\n\n\"The gods of our fathers are our devils,\" says an Asiatic proverb.\n\nWhen Draco ceased to be the lode-star, the guiding sidereal divinity, it shared the fate of all the fallen gods.\n\nSeth and Typhon was at one time, Bunsen tells us, \"a great god universally adored throughout Egypt, who conferred on the sovereigns of the 18th and 19th Dynasties the symbols of life and power.\n\nBut subsequently, in the course of the 20th Dynasty, he is suddenly treated as an evil Demon, insomuch that his effigies and name are obliterated on all the monuments and inscriptions that could be reached.\" The real occult reason will be given in these pages.\n\n* Sukra is the son of Bhrigu the great Rishi, and one of the Seven Prajapati, the founder of the Race of Bhargavas, in which Parasu Rama is born.\n\n[[Vol.\n\n2, Page]] 33 PARENT STARS AND SISTER PLANETS.\n\nthat Occult mysticism has to deal.\n\nThe allegory which states that for killing Sukra's mother, Vishnu was cursed by him to be reborn seven times on the Earth, is full of occult philosophical meaning.\n\nIt does not refer to Vishnu's Avatars, since these number nine, the tenth being still to come, but to the Races on Earth.\n\nVenus, or Lucifer (also Sukra and Usanas) the planet, is the light-bearer of our Earth, in both its physical and mystic sense.\n\nThe Christians knew it well in early times, since one of the earliest popes of Rome is known by his Pontiff name as Lucifer.\n\n\" Every world has its parent star and sister planet.\n\nThus Earth is the adopted child and younger brother of Venus, but its inhabitants are of their own kind .\n\n.\n\n.\n\n.\n\nAll sentient complete beings (full septenary men or higher beings) are furnished, in their beginnings, with forms and organisms in full harmony with the nature and state of the sphere they inhabit.\n\n\" * \" The Spheres of Being, or centres of life, which are isolated nuclei breeding their men and their animals, are numberless; not one has any resemblance to its sister-companion or to any other in its own special progeny.\n\n\" ** \" All have a double physical and spiritual nature.\n\n\" \" The nucleoles are eternal and everlasting; the nuclei periodical and finite.\n\nThe nucleoles form part of the absolute.\n\nThey are the embrasures of that black impenetrable fortress, which is for ever concealed from human or even Dhyanic sight.\n\nThe nuclei are the light of eternity escaping therefrom.\n\n\" \" It is that L IGHT which condenses into the forms of the ' Lords of Being ' -- the first and the highest of which are, collectively, J IVATMA, or Pratyagatma (said figuratively to issue from Paramatma.\n\nIt is the Logos of the Greek philosophers -- appearing at the beginning of every new Manvantara).\n\nFrom these downwards -- formed from the ever-consolidating waves of that light, which becomes on the objective plane gross matter -- proceed the numerous hierarchies of the Creative Forces, some formless, others having their [[Footnote(s)]] ------------------------------------------------- * This is a flat contradiction of Swedenborg, who saw, in \"the first Earth of the astral world, \" inhabitants dressed as are the peasants in Europe; and on the Fourth Earth women clad as are the shepherdesses in a bal masque.\n\nEven the famous astronomer Huygens laboured under the mistaken idea that other worlds and planets have the same identical beings as those who live on our Earth, possessing the same figures, senses, brain-power, arts, sciences, dwellings and even to the same fabric for their wearing apparel!\n\n( Theorie du Monde ) .\n\nFor the clearer comprehension of the statement that the Earth \"is the progeny of the Moon,\" see Book I., stanza VI .\n\n** This is a modern gloss.\n\nIt is added to the old Commentaries for the clearer comprehension of those disciples who study esoteric Cosmogony after having passed through Western learning.\n\nThe earlier Glosses are too redundant with adjectives and figures of speech to be easily assimilated.\n\n[[Vol.\n\n2, Page]] 34 THE SECRET DOCTRINE.\n\nown distinctive form, others, again, the lowest ( Elementals ) , having no form of their own, but assuming every form according to the surrounding conditions.\n\n\" \" Thus there is but one Absolute Upadhi (basis) in the spiritual sense, from, on, and in which, are built for Manvantaric purposes the countless basic centres on which proceed the Universal, cyclic, and individual Evolutions during the active period.\n\n\" \" The informing Intelligences, which animate these various centres of Being, are referred to indiscriminately by men beyond the Great Range* as the Manus, the Rishis, the Pitris**, the Prajapati, and so on; and as Dhyani Buddhas, the Chohans, Melhas (fire-gods) , Bodhisattvas,*** and others, on this side.\n\nThe truly ignorant call them gods; the learned profane, the one God; and the wise, the Initiates, honour in them only the Manvantaric manifestations of THAT which neither our Creators (the Dhyan Chohans) nor their creatures can ever discuss or know anything about.\n\nThe ABSOLUTE is not to be defined, and no mortal or immortal has ever seen or comprehended it during the periods of Existence.\n\nThe mutable cannot know the Immutable, nor can that which lives perceive Absolute Life.\n\n\" Therefore, man cannot know higher beings than his own \"progenitors.\" \" Nor shall he worship them, \"but he ought to learn how he came into the world.\n\n(c) Number Seven, the fundamental figure among all other figures in every national religious system, from Cosmogony down to man, must have its raison d ' etre.\n\nIt is found among the ancient Americans, as prominently as among the archaic Aryans and Egyptians."


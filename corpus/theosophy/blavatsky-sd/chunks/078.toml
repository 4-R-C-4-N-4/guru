[content]
body = "In fact, to us the matter of the lower plane there vanishes from our perception into nothing -- or rather it passes on to the higher plane, and the state of matter corresponding to such a point of transition must certainly possess special and not readily discoverable properties.\n\nSuch \"Seven Neutral Centres,\"* then, are produced by Fohat, who, when, as Milton has it -- \"Fair foundations (are) laid whereon to build .\n\n.\n\n.\" quickens matter into activity and evolution.\n\nThe Primordial Atom ( anu ) cannot be multiplied either in its pregenetic state, or its primogeneity; therefore it is called \"SUM TOTAL,\" figuratively, of course, as that \"SUM TOTAL\" is boundless.\n\n(See Addendum to this Book.) That which is the abyss of nothingness to the physicist, who knows only the world of visible causes and effects, is the boundless Space of the Divine Plenum to the Occultist.\n\nAmong many other objections to the doctrine of an endless evolution and re-involution (or re-absorption) of the Kosmos, a process which, according to the Brahminical and Esoteric Doctrine, is without a beginning or an end, the Occultist is told that it cannot be, since \"by all the admissions of [[Footnote(s)]] ------------------------------------------------- * Such, we believe, is the name applied by Mr.\n\nKeely, of Philadelphia, the inventor of the famous \"Motor\" -- destined, as his admirers have hoped, to revolutionise the motor power of the world -- to what he again calls the \"Etheric Centres.\" [[Vol.\n\n1, Page]] 149 THE MOON IS NOT DEAD, BUT ONLY SLEEPETH.\n\nmodern scientific philosophy it is a necessity of Nature to run down.\" If the tendency of Nature \"to run down\" is to be considered so forcible an objection to Occult Cosmogony, \"How,\" we may ask, \"do your Positivists and Free-thinkers and Scientists account for the phalanx around us of active stellar systems?\" They had eternity to \"run down\" in; why, then, is not the Kosmos a huge inert mass?\n\nEven the moon is only hypothetically believed to be a dead planet, \"run down,\" and astronomy does not seem to be acquainted with many such dead planets.* The query is unanswerable.\n\nBut apart from this it must be noted that the idea of the amount of \"transformable energy\" in our little system coming to an end is based purely on the fallacious conception of a \"white-hot, incandescent Sun\" perpetually radiating away his heat without compensation into Space.\n\nTo this we reply that nature runs down and disappears from the objective plane, only to re-emerge after a time of rest out of the subjective and to reascend once more.\n\nOur Kosmos and Nature will run down only to reappear on a more perfect plane after every P RALAYA.\n\nThe matter of the Eastern philosophers is not the \"matter\" and Nature of the Western metaphysicians.\n\nFor what is Matter?\n\nAnd above all, what is our scientific philosophy but that which was so justly and so politely defined by Kant as \"the Science of the limits to our Knowledge\"?\n\nWhere have the many attempts made by Science to bind, to connect, and define all the phenomena of organic life by mere physical and chemical manifestations, brought it to?\n\nTo speculation generally -- mere soap-bubbles, that burst one after the other before the men of Science were permitted to discover real facts.\n\nAll this would have been avoided, and the progress of knowledge would have proceeded with gigantic strides, had only Science and its philosophy abstained from accepting hypotheses on the mere one-sided Knowledge of their Matter.** [[Footnote(s)]] ------------------------------------------------- * The moon is dead only so far as regards her inner \"principles\" -- i.e.\n\n, psychically and spiritually , however absurd the statement may seem.\n\nPhysically, she is only as a semi-paralysed body may be.\n\nShe is aptly referred to in Occultism as the \"insane mother,\" the great sidereal lunatic.\n\n** The instance of Uranus and Neptune, whose satellites, four and one respectively, revolved, it was thought, in their orbits from East to West, whereas all the other satellites rotate from West to East, is a very good one, as showing how unreliable are all a priori speculations even when based on the strictest mathematical analysis.\n\nThe famous hypothesis of the formation of our Solar System out of the nebulous rings, put [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 150 THE SECRET DOCTRINE.\n\nIf no physical intellect is capable of counting the grains of sand covering a few miles of sea-shore; or to fathom the ultimate nature and essence of those grains, palpable and visible on the palm of the naturalist, how can any materialist limit the laws changing the conditions and being of the atoms in primordial chaos, or know anything certain about the capabilities and potency of their atoms and molecules before and after their formation into worlds?\n\nThese changeless and eternal molecules -- far thicker in space than the grains on the ocean shore -- may differ in their constitution along the line of their planes of existence, as the soul-substance differs from its vehicle, the body.\n\nEach atom has seven planes of being or existence, we are taught; and each plane is governed by its specific laws of evolution and absorption.\n\nIgnorant of any, even approximate, chronological data from which to start in attempting to decide the age of our planet or the origin of the solar system, astronomers, geologists, and physicists are drifting with each new hypothesis farther and farther away from the shores of fact into the fathomless depths of speculative ontology.* The Law of Analogy in the plan of structure between the trans-Solar systems and the intra-Solar planets, does not necessarily bear upon the finite conditions to which every visible body is subject, in this our plane of being.\n\nIn Occult Science this law is the first and most important key to Cosmic physics; but it has to be studied in its minutest details and, \"to be [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] forward by Kant and Laplace, was chiefly based on the above fact that all the planets revolved in the same direction.\n\nIt is on this fact, mathematically demonstrated during the time of Laplace, that this great astronomer, calculating on the theory of probabilities, offered to bet three milliards to one that the next planet discovered would have in its system the same peculiarity of motion Eastward.\n\nThe immutable laws of scientific mathematics got \"worsted by further experiments and observations,\" it was said.\n\nThis idea of Laplace's mistake prevails generally to this day; but some astronomers have finally succeeded in demonstrating (?) that the mistake had been in accepting Laplace's assertion for a mistake; and steps to correct it without attracting general attention to the bevue are now being taken.\n\nMany such unpleasant surprises are in store for hypotheses of even a purely physical character.\n\nWhat further disillusions, then, may there not be in questions of a transcendental, Occult Nature?"


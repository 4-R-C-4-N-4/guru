[content]
body = "think it, \"less hard to believe that these wonderful stories of gods and demi-gods, of giants and dwarfs, of dragons and monsters of all descriptions, are transformations, than to believe them to be inventions.\" It is only such \"transformations\" in physical nature, as much as in the memory and conceptions of our present mankind, that the Secret Doctrine teaches.\n\nIt confronts the purely speculative hypotheses of modern Science, based upon the experience and exact observations of barely a few centuries, with the unbroken tradition and records of its Sanctuaries; and brushing away that tissue of cobweb-like theories, spun in the darkness that covers a period of hardly a few millenniums back, and which Europeans call their \"History,\" the Old Science says to us: Listen, now, to my version of the memoirs of Humanity.\n\nThe human Races are born one from the other, grow, develop, become [[Vol.\n\n2, Page]] 444 THE SECRET DOCTRINE.\n\nold, and die.\n\nTheir sub-races and nations follow the same rule.\n\nIf your all-denying modern science and so-called philosophy do not contest that the human family is composed of a variety of well-defined types and races, it is only because the fact is undeniable, no one would say that there was no external difference between an Englishman, an African negro, and a Japanese or Chinaman.\n\nOn the other hand it is formally denied by most naturalists that mixed human races, i.e., the seeds for entirely new races, are any longer formed in our days.\n\nBut this last is maintained on good grounds by de Quatrefages and some others.\n\nNevertheless our general proposition will not be accepted.\n\nIt will be said that whatever forms man has passed through in the long pre-historic Past there are no more changes for him (save certain variations, as at present) in the future.\n\nHence that our Sixth and Seventh Root Races are fictions.\n\nTo this it is again answered: How do you know?\n\nYour experience is limited to a few thousand years, to less than a day in the whole age of Humanity and to the present types of the actual continents and isles of our Fifth Race.\n\nHow can you tell what will or will not be?\n\nMeanwhile, such is the prophecy of the Secret Books and their no uncertain statements.\n\nSince the beginning of the Atlantean Race many million years have passed, yet we find the last of the Atlanteans, still mixed up with the Aryan element, 11,000 years ago.\n\nThis shows the enormous overlapping of one race over the race which succeeds it, though in character and external type the elder loses its characteristics, and assumes the new features of the younger race.\n\nThis is proved in all the formations of mixed human races.\n\nNow, Occult philosophy teaches that even now, under our very eyes, the new Race and Races are preparing to be formed, and that it is in America that the transformation will take place, and has already silently commenced.\n\nPure Anglo-Saxons hardly three hundred years ago, the Americans of the United States have already become a nation apart, and, owing to a strong admixture of various nationalities and inter-marriage, almost a race sui generis, not only mentally, but also physically.\n\n\"Every mixed race, when uniform and settled, has been able to play the part of a primary race in fresh crossings,\" says de Quatrefages.\n\n\"Mankind, in its present state, has thus been formed, certainly, for the greatest part, by the successive crossing of a number of races at present undetermined \" (\" The Human Species ,\" p.\n\n274.) Thus the Americans have become in only three centuries a \"primary race,\" pro tem., before becoming a race apart, and strongly separated from all other now existing races.\n\nThey are, in short, the germs of the Sixth sub-race, and in some few hundred years more, will become [[Vol.\n\n2, Page]] 445 THE COMING NEW RACE.\n\nmost decidedly the pioneers of that race which must succeed to the present European or fifth sub-race, in all its new characteristics.\n\nAfter this, in about 25,000 years, they will launch into preparations for the seventh sub-race; until, in consequence of cataclysms -- the first series of those which must one day destroy Europe, and still later the whole Aryan race (and thus affect both Americas), as also most of the lands directly connected with the confines of our continent and isles -- the Sixth Root-Race will have appeared on the stage of our Round.\n\nWhen shall this be?\n\nWho knows save the great Masters of Wisdom, perchance, and they are as silent upon the subject as the snow-capped peaks that tower above them.\n\nAll we know is, that it will silently come into existence; so silently, indeed, that for long millenniums shall its pioneers -- the peculiar children who will grow into peculiar men and women -- be regarded as anomalous lusus naturae, abnormal oddities physically and mentally.\n\nThen, as they increase, and their numbers become with every age greater, one day they will awake to find themselves in a majority.\n\nIt is the present men who will then begin to be regarded as exceptional mongrels, until these die out in their turn in civilised lands; surviving only in small groups on islands -- the mountain peaks of to-day -- where they will vegetate, degenerate, and finally die out, perhaps millions of years hence, as the Aztecs have, as the Nyam-Nyam and the dwarfish Moola Koorumba of the Nilghiri Hills are dying.\n\nAll these are the remnants of once mighty races, the recollection of whose existence has entirely died out of the remembrance of the modern generations, just as we shall vanish from the memory of the Sixth Race Humanity.\n\nThe Fifth will overlap the Sixth Race for many hundreds of millenniums, changing with it slower than its new successor, still changing in stature, general physique, and mentality, just as the Fourth overlapped our Aryan race, and the Third had overlapped the Atlanteans.\n\nThis process of preparation for the Sixth great Race must last throughout the whole sixth and seventh sub-races ( vide supra, the diagram of the Genealogical Tree of the Fifth Race).\n\nBut the last remnants of the Fifth Continent will not disappear until some time after the birth of the new Race; when another and new dwelling, the sixth continent, will have appeared above the new waters on the face of the globe, so as to receive the new stranger.\n\nTo it also will emigrate and settle all those who shall be fortunate enough to escape the general disaster.\n\nWhen this shall be -- as just said -- it is not for the writer to know.\n\nOnly, as nature no more proceeds by sudden jumps and starts, than man changes suddenly from a child into a mature man, the final cataclysm will be preceded by many smaller submersions and destructions both by wave and volcanic fires.\n\nThe exultant pulse will beat [[Vol.\n\n2, Page]] 446 THE SECRET DOCTRINE.\n\nhigh in the heart of the race now in the American zone, but there will be no more Americans when the Sixth Race commences; no more, in fact, than Europeans; for they will have now become a new race, and many new nations."


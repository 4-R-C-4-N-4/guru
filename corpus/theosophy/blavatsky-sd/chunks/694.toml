body = "\" The root to which these two families lead back IS UNKNOWN\" (Schmidt).\n\nNo.\n\nI.\n\nrepresents the realm explored by Western Evolutionists, the area in which climatic influences, \"natural selection,\" and all the other physical causes of organic differentiation are present.\n\nBiology and palaeontology find their province here in investigating the many physical agencies which contribute so largely, as shown by Darwin, Spencer and others, to the segregation of species.\n\nBut even in this domain the sub-conscious workings of the Dhyan-Chohanic wisdom are at the root of all the \"ceaseless striving towards perfection,\" though its influence is vastly modified by those purely material causes which de Quatrefages terms the \" milieux \" and Spencer the \"Environment.\" The \"midway point of evolution\" is that stage where the astral prototypes definitely begin to pass into the physical, and thus become subject to the differentiating agencies now operative around us.\n\nPhysical causation supervenes immediately on the assumption of \"coats of skin\" -- i.e.\n\n, the physiological equipment in general.\n\nThe forms of Men and mammalia previous to the separation of sexes* are woven out of astral matter, and possess a structure utterly unlike that of the physical organisms, which eat, drink, digest, etc., etc., etc.\n\nThe known physiological contrivances in organisms were almost entirely evolved subsequently to the incipient physicalization of the 7 Root-Types out of the astral -- during the \"midway halt\" between the two planes of existence.\n\nHardly had the \"ground-plan\" of evolution been limned out in these ancestral types, than the influence of the accessory terrestrial laws, familiar to us, supervened, resulting in the whole crop of mammalian species.\n\nAEons of slow differentiation were, however, required to effect this end.\n\n[[Footnote(s)]] ------------------------------------------------- * Bear in mind, please, that though the animals -- mammalians included -- have all been evolved after and partially from man's cast-off tissues, still, as a far lower being, the mammalian animal became placental and separated far earlier than man.\n\n[[Vol.\n\n2, Page]] 737 THE UNITY OF TYPE.\n\nNo.\n\nII .\n\nrepresents the domain of the purely astral prototypes previous to their descent into (gross) matter.\n\nAstral matter, it must be noted, is fourth state matter, having, like our gross matter, its own \"protyle.\" There are several \"protyles\" in Nature, corresponding to the various planes of matter.\n\nThe two sub-physical elemental kingdoms, the plane of mind ( manas, the fifth state matter), as also that of Buddhi (sixth state matter), are each and all evolved from one of the six \"protyles\" which constitute the basis of the Object-Universe.\n\nThe three \"states,\" so-called of our terrestrial matter, known as the \"solid,\" \"liquid,\" and \"gaseous,\" are only, in strict accuracy, SUB-states.\n\nAs to the former reality of the descent into the physical, which culminated in physiological man and animal, we have a palpable testimony in the fact of the so-called spiritualistic \"materializations.\" In all these instances a complete temporary mergence of the astral into the physical takes place.\n\nThe evolution of physiological Man out of the astral races of early Lemurian age -- the Jurassic age of Geology -- is exactly paralleled by the \"materialization\" of \"spirits\" (?) in the seance-room.\n\nIn the case of Professor Crookes' \"Katie King,\" the presence of a physiological mechanism -- heart, lungs, etc.\n\n-- was indubitably demonstrated!!\n\nThis, in a way, is the A RCHETYPE of Goethe.\n\nListen to his words: \"Thus much we should have gained .\n\n.\n\n.\n\nall the nine perfect organic beings .\n\n.\n\n.\n\n(are) formed according to an archetype which merely fluctuates more or less in its very persistent parts and, moreover, day by day, completes and transforms itself by means of reproduction.\" This is a seemingly imperfect foreshadowing of the occult fact of the differentiation of species from the primal astral root-types.\n\nWhatever the whole posse comitatus of \"natural selection,\" etc., etc., may effect, the fundamental unity of structural plan remains practically unaffected by all subsequent modifications.\n\nThe \"Unity of Type\" common, in a sense, to all the animal and human kingdoms, is not, as Spencer and others appear to hold, a proof of the consanguineity of all organic forms, but a witness to the essential unity of the \"ground-plan\" Nature has followed in fashioning her creatures.\n\nTo sum up the case, we may again avail ourselves of a tabulation of the actual factors concerned in the differentiation of species.\n\nThe stages of the process itself need no further comment here, being the basic principles underlying organic development, than to enter on the domain of the biological specialist.\n\n------- [[Vol.\n\n2, Page]] 738 THE SECRET DOCTRINE.\n\nF ACTORS CONCERNED IN THE O RIGIN OF S PECIES, A NIMAL AND V EGETABLE.\n\nB ASIC A STRAL P ROTOTYPES PASS INTO THE P HYSICAL.\n\n------- B .\n\nT HE E UROPEAN, P ALAEOLITHIC R ACES.\n\n-- W HENCE, AND H OW D ISTRIBUTED.\n\nI S Science against those who maintain that down to the Quaternary period the distribution of the human races was widely different from what it is now?\n\nIs Science against those who, further, maintain that the fossil men found in Europe -- although having almost reached a plane of sameness and unity from the fundamental physiological and anthropological aspects which continues till this day -- still differ, sometimes greatly, from the type of the now existing populations.\n\nThe late Littre confesses it in an article published by him on the Memoir called Antiquites Celtiques et Antediluviennes by Boucher de Perthes (1849) - - in the Revue des Deux Mondes ( March 1,1859) .\n\nHe says in it ( a ) that in these periods when the Mammoths, exhumed with the hatchets in Picardy, lived in the latter region, there must have been an eternal spring reigning over all the terrestrial globe*; nature was the contrary of what it is now -- thus leaving an enormous margin for the antiquity of [[Footnote(s)]] ------------------------------------------------- * Scientists now admit that Europe enjoyed in the Miocene times a warm, in the Pliocene or later Tertiary, a temperate climate.\n\nLittre's contention as to the balmy spring of the Quaternary -- to which deposits M.\n\nde Perthes' discoveries of flint implements are traceable (since when the Somme has worn down its valley many scores of feet) -- must be accepted with much reservation.\n\nThe Somme-valley relics are post-glacial, and possibly point to the immigration of savages during one of the more temperate periods intervening between minor ages of Ice.\n\n[[Vol.\n\n2, Page]] 739 AFRICA IN EUROPE."


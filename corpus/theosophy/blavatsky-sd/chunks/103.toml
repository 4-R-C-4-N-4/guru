[content]
body = "Although these matters were barely hinted at in \" Isis Unveiled ,\" it will be well to remind the reader of what was said in Vol.\n\nI., pp.\n\n587 to 593, concerning a certain Sacred Island in Central Asia, and to refer him for further details to the chapter in Book II.\n\non \"The Sons of God and the Sacred Island.\" A few more explanations, however, though thrown out in a fragmentary form, may help the student to obtain a glimpse into the present mystery.\n\nTo state at least one detail concerning these mysterious \"Sons of God\" in plain words.\n\nIt is from them, these Brahmaputras, that the high Dwijas, the initiated Brahmins of old justly claimed descent, while the modern Brahmin would have the lowest castes believe literally that they issued direct from the mouth of Brahma.\n\nThis is the esoteric teaching, which adds moreover that, although these descendants (spiritually of course) from the \"sons of Will and Yoga,\" became in time divided into opposite sexes, as their \" Kriyasakti \" progenitors did themselves, later on; yet even their degenerate descendants have down to the present day retained a veneration and respect for the creative [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] of those architectural proportions that the Ancients could build those wonders of all the subsequent ages, their Fanes, Pyramids, Cave-Temples, Cromlechs, Cairns, Altars, proving they had the powers of machinery and a knowledge of mechanics to which modern skill is like a child's play, and which that skill refers to itself as the 'works of hundred-handed giants.'\" ( See \" Book of God ,\" Kenealy.\n\n) Modern architects may not altogether have neglected those rules, but they have superadded enough empirical innovations to destroy those just proportions.\n\nIt is Vitruvius who gave to posterity the rules of construction of the Grecian temples erected to the immortal gods; and the ten books of Marcus Vitruvius Pollio on Architecture, of one, in short, who was an initiate , can only be studied esoterically.\n\nThe Druidical circles, the Dolmen, the Temples of India, Egypt and Greece, the Towers and the 127 towns in Europe which were found \"Cyclopean in origin\" by the French Institute, are all the work of initiated Priest-Architects, the descendants of those primarily taught by the \"Sons of God,\" justly called \"The Builders.\" This is what appreciative posterity says of those descendants.\n\n\"They used neither mortar nor cement, nor steel nor iron to cut the stones with; and yet they were so artfully wrought that in many places the joints are not seen, though many of the stones, as in Peru, are 18 ft.\n\nthick, and in the walls of the fortress of Cuzco there are stones of a still greater size.\" ( Acosta , vi., 14.) \"Again, the walls of Syene, built 5,400 years ago, when that spot was exactly under the tropic, which it has now ceased to be, were so constructed that at noon, at the precise moment of the solar solstice, the entire disc of the Sun was seen reflected on their surface -- a work which the united skill of all the astronomers of Europe would not now be able to effect.\" -- (Kenealy, \" Book of God.\n\n\") [[Vol.\n\n1, Page]] 210 THE SECRET DOCTRINE.\n\nfunction, and still regard it in the light of a religious ceremony, whereas the more civilized nations consider it as a mere animal function.\n\nCompare the western views and practice in these matters with the Institutions of Manu in regard to the laws of Grihasta and married life.\n\nThe true Brahmin is thus indeed \"he whose seven forefathers have drunk the juice of the moon-plant (Soma),\" and who is a \"Trisuparna,\" for he has understood the secret of the Vedas.\n\nAnd, to this day, such Brahmins know that, during its early beginnings, psychic and physical intellect being dormant and consciousness still undeveloped, the spiritual conceptions of that race were quite unconnected with its physical surroundings.\n\nThat divine man dwelt in his animal -- though externally human -- form; and, if there was instinct in him, no self-consciousness came to enlighten the darkness of the latent fifth principle.\n\nWhen, moved by the law of Evolution, the Lords of Wisdom infused into him the spark of consciousness, the first feeling it awoke to life and activity was a sense of solidarity, of one-ness with his spiritual creators.\n\nAs the child's first feeling is for its mother and nurse, so the first aspirations of the awakening consciousness in primitive man were for those whose element he felt within himself, and who yet were outside, and independent of him.\n\nD EVOTION arose out of that feeling, and became the first and foremost motor in his nature; for it is the only one which is natural in our heart, which is innate in us, and which we find alike in human babe and the young of the animal.\n\nThis feeling of irrepressible, instinctive aspiration in primitive man is beautifully, and one may say intuitionally, described by Carlyle.\n\n\"The great antique heart,\" he exclaims, \"how like a child's in its simplicity, like a man's in its earnest solemnity and depth!\n\nheaven lies over him wheresoever he goes or stands on the earth; making all the earth a mystic temple to him, the earth's business all a kind of worship.\n\nGlimpses of bright creatures flash in the common sunlight; angels yet hover, doing God's messages among men .\n\n.\n\n.\n\n.\n\n.\n\nWonder, miracle, encompass the man; he lives in an element of miracle* .\n\n.\n\n.\n\n.\n\nA great law of duty, high as these two infinitudes (heaven and hell), dwarfing all else, annihilating all else -- it was a reality, and it is one: the garment [[Footnote(s)]] ------------------------------------------------- * That which was natural in the sight of primitive man has become only now miracle to us; and that which was to him a miracle could never be expressed in our language.\n\n[[Vol.\n\n1, Page]] 211 THE SONS OF WISDOM.\n\nonly of it is dead; the essence of it lives through all times and all eternity!\" It lives undeniably, and has settled in all its ineradicable strength and power in the Asiatic Aryan heart from the Third Race direct through its first \"mind-born\" sons, -- the fruits of Kriyasakti.\n\nAs time rolled on the holy caste of Initiates produced but rarely, and from age to age, such perfect creatures: beings apart, inwardly, though the same as those who produced them, outwardly.\n\nWhile in the infancy of the third primitive race: -- \"A creature of a more exalted kind Was wanting yet, and therefore was designed; Conscious of thought, of more capacious breast For empire formed and fit to rule the rest.\n\n.\n\n.\n\n."


body = "2, Page]] 113 THE SECRET WORK OF CHIRAM.\n\nactive emanations from the three higher principles in man, namely, \"Spirit, Soul, and Mind,\" or Atma, Buddhi, and Manas.\n\nIt is the spiritual and also the material human basis.\n\nRudimentary man, having been nursed by the \"air\" or the \"wind,\" becomes the perfect man later on; when, with the development of \"Spiritual fire,\" the noumenon of the \"Three in One\" within his Self, he acquires from his inner Self, or Instructor, the Wisdom of Self-Consciousness, which he does not possess in the beginning.\n\nThus here again divine Spirit is symbolised by the Sun or Fire; divine Soul by Water and the Moon, both standing for the Father and Mother of Pneuma, human Soul, or Mind, symbolised by the Wind or air, for Pneuma, means \"breath.\" Hence in the Smaragdine Tablet, disfigured by Christian hands: -- \"The Superior agrees with the Inferior; and the Inferior with the Superior; to effect that one truly wonderful Work\" -- which is M AN.\n\nFor the secret work of Chiram, or King Hiram in the Kabala, \"one in Essence, but three in Aspect,\" is the Universal Agent or Lapis Philosophorum.\n\nThe culmination of the Secret Work is Spiritual Perfect Man, at one end of the line; the union of the three elements is the Occult Solvent in the \"Soul of the World,\" the Cosmic Soul or Astral Light, at the other; and, on the material plane, it is Hydrogen in its relation to the other gases.\n\nThe To ON, truly; the ONE \"whom no person has seen except the Son\"; this sentence applying both to the metaphysical and physical Kosmos, and to the spiritual and material Man.\n\nFor how could the latter understand the To ON the \"One Father,\" if his Manas, the \"Son,\" does not become ( as ) \"One with the Father,\" and through this absorption receive enlightenment from the \"divine instructor,\" Guru -- Atma-Buddhi?\n\n\" If thou would ' st understand the SECONDARY (\"Creation,\" so-called), oh Lanoo, thou should ' st first study its relation to the PRIMARY.\n\n\" (Commentary, Book of Dzyan, III.\n\n19.) The first Race had three elements, but no living Fire.\n\nWhy?\n\nBecause: -- \"We say four elements, my Son, but ought to say three,\" says Hermes Trismegistus.\n\n\"In the Primary Circle\" (creation) that which is marked reads \"Root,\" as in the Secondary likewise.\n\nThus in Alchemy or Western Hermetism (a variant on Eastern Esotericism) we find: -- X.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\nX.\n\nSulphur .\n\n.\n\n.\n\n.\n\n.\n\n.\n\nFlamma .\n\n.\n\n.\n\n.\n\n.\n\n.\n\nSpiritus Hydrargyum .\n\n.\n\nNatura .\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\nAqua Sal .\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\nMater .\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\nSanguis [[Vol.\n\n2, Page]] 114 THE SECRET DOCTRINE.\n\nAnd these three are all quaternaries completed by their Root, Fire.\n\nThe Spirit, beyond manifested Nature, is the fiery BREATH in its absolute Unity.\n\nIn the manifested Universe, it is the Central Spiritual Sun, the electric Fire of all Life.\n\nIn our System it is the visible Sun, the Spirit of Nature, the terrestrial god.\n\nAnd in, on, and around the Earth, the fiery Spirit thereof -- air, fluidic fire; water , liquid fire; Earth, solid fire.\n\nAll is fire -- ignis, in its ultimate constitution, or I, the root of which is O ( nought ) in our conceptions, the All in nature and its mind.\n\nPro-Mater is divine fire.\n\nIt is the Creator, the Destroyer, the Preserver.\n\nThe primitive names of the gods are all connected with fire, from AGNI, the Aryan, to the Jewish god who \"is a consuming fire.\" In India, God is called in various dialects, Eashoor, Esur, Iswur, and Is ' Vara, in Sanskrit the Lord, from Isa, but this is primarily the name of Siva, the Destroyer; and the three Vedic chief gods are Agni ( ignis ) , Vayu, and Surya -- Fire, Air, and the Sun, three occult degrees of fire.\n\nIn the Hebrew ( aza ), means to illuminate, and ( asha ) is fire.\n\nIn Occultism, \"to kindle a fire\" is synonymous to evoking one of the three great fire-powers, or \"to call on God.\" In Sanskrit Osch or Asch is fire or heat; and the Egyptian word Osiris is compounded (as shown by Schelling) of the two primitives aish and asr, or a \"fireenchanter.\" Aesar in the old Etruscan meant a God (being perhaps derived from Asura of the Vedas).\n\nAeswar and Eswara are analogous terms, as Dr.\n\nKenealy thought.\n\nIn the Bhagavad Gita we read, \"Iswara resides in every mortal being and puts in motion, by his supernatural power, all things which mount on the Wheel of Time.\" It is the creator and the destroyer, truly.\n\n\"The primitive fire was supposed to have an insatiable appetite for devouring.\n\nMaximus of Tyre relates that the ancient Persians threw into the fire combustible matter crying: 'Devour, oh Lord!' In the Irish language Easam, or Asam, means 'to create,' and Aesar was the name of an ancient Irish god, meaning 'to light a fire' \" ( Kenealy ) .\n\nThe Christian Kabalists and symbologists who disfigured Pymander -- prominent among them the Bishop of Ayre, Francois de Tours, in the 16th century -- divide the elements in this way: -- The four elements formed from divine substances and the Spirits of the Salts of Nature represented by - - .\n\n.\n\n.\n\nSt.\n\nMatthew.\n\n.\n\nAngel-Man .\n\n.\n\nWater .\n\n.\n\n(Jesus-Christ, Angel-Man, Mikael ) A - .\n\nSt.\n\nMark.\n\n.\n\n.\n\n.\n\n.The Lion .\n\n.\n\n.\n\n.\n\nFire E - Y .\n\n.St.\n\nLuke.\n\n.\n\n.\n\n.\n\n.\n\nThe Bull .\n\n.\n\n.\n\n.\n\nEarth I - O .\n\n.\n\nSt.\n\nJohn.\n\n.\n\n.\n\n.\n\n.\n\nThe Eagle .\n\n.\n\n.\n\nAir* [[Footnote(s)]] ------------------------------------------------- * To those who would inquire \"What has Hydrogen to do with air or oxygena- [[Footnote continued on next page]] [[Vol.\n\n2, Page]] 115 SONS OF YOGA.\n\nH , THE Q UINTESSENCE, [[ HEPHLOX ]], F LAMMA- V IRGO (virgin oil), F LAMMA D URISSIMA, V IRGO, L UCIS A ETERNA M ATER."


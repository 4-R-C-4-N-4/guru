body = "As Asuramaya is said to have been the greatest astronomer, so he is whispered to have also been the most powerful \"Sorcerer\" of the \" W HITE I SLAND, which had become B LACK with sin,\" i.e., of the islands of Atlantis.\n\nThe \"White Island\" is a symbolical name.\n\nAsuramaya is said to have lived (see the tradition of Jhana-bhaskara) in Romaka-pura in the West: because the name is an allusion to the land and cradle of the \"Sweat-born\" of the Third Race.\n\nThat land or continent had disappeared ages before Asuramaya lived, since he was an Atlantean; but he was a direct descendant of the Wise Race, the Race that never dies.\n\nMany are the legends concerning this hero, the pupil of Surya (the Sun-God) himself, as the Indian accounts allege.\n\nIt matters little whether he lived on one or another island, but the question is to prove that he was no myth, as Dr.\n\nWeber and others would make him.\n\nThe [[Vol.\n\n2, Page]] 68 THE SECRET DOCTRINE.\n\nfact of \" Romaka-pura in the West\" being named as the birth-place of this hero of the archaic ages, is the more interesting because it is so very suggestive of the esoteric teaching about the \"Sweat-born\" Races, the men born from the pores of their parents.\n\n\" R OMAKUPAS\" means \"hair-pores\" in Sanskrit.\n\nIn Mahabharata XII.\n\n10,308, a people named Raumyas are said to have been created from the pores of Virabhadara, the terrible giant, who destroyed Daksha's sacrifice.\n\nOther tribes and people are also represented as born in this way.\n\nAll these are references to the later Second and the earlier Third Root Races.\n\nThe following figures are from the calendar just referred to; a footnote marks the points of disagreement with the figures of the Arya Samaj school: -- I.\n\nFrom the beginning of cosmic evolution,* up to the Hindu year Tarana (or 1887) ....................\n\n1,955,884,687 years.\n\nII.\n\nThe (astral) mineral, vegetable and animal kingdoms up to Man, have taken to evolve** ........\n\n300,000,000 years.\n\nIII.\n\nTime, from the first appearance of \"Humanity\" (on planetary chain)..........................1,664,500,987 years.*** [[Footnote(s)]] ------------------------------------------------- * The esoteric doctrine says that this \"cosmic evolution\" refers only to our solar system; while exoteric Hinduism makes the figures refer, if we do not mistake, to the whole Universal System.\n\n** Another point of disagreement.\n\nOccultism says: \"The astral prototypes of the mineral, vegetable and animal kingdoms up to man have taken that time (300 million years) to evolve, re-forming out of the cast-off materials of the preceding Round, which, though very dense and physical in their own cycle, are relatively ethereal as compared with the materiality of our present middle Round.\n\nAt the expiration of these 300 million years, Nature, on the way to the physical and material, down the arc of descent, begins with mankind and works downwards, hardening or materialising forms as it proceeds.\n\nThus the fossils found in strata, to which an antiquity, not of eighteen, but of many hundreds of millions of years, must be ascribed, belong in reality to forms of the preceding Round, which, while living, were far more ethereal than physical, as we know the physical.\n\nThat we perceive and disinter them as tangible forms, is due to the process of materialization or crystallization referred to, which took place subsequently, at the beginning of the Fourth Round, and reached its maximum after the appearance of man, proceeding parallel with his physical evolution.\n\nThis alone illustrates the fact that the degree of materiality of the Earth changes pari passu with that of its inhabitants.\n\nAnd thus man now finds, as tangible fossils, what were once the (to his present senses) ethereal forms of the lower kingdoms.\n\nThe above Brahmanical figures refer to evolution beginning on Globe A, and in the First Round.\n\nIn this Volume we speak only of this, the Fourth Round.\" *** This difference and the change of cyphers in the last three triplets of figures, the writer cannot undertake to account for.\n\nAccording to every calculation, once the three hundred millions are subtracted, the figures ought to stand, 1,655,884,687.\n\nBut they are given as stated in the Tamil calendar above-named and as they were translated.\n\nThe school of the late Pandit Dayanand Saraswati, founder of the Arya Samaj, gives a date of 1,960,852,987.\n\nSee the \"Arya Magazine\" of Lahore, the cover of which bears the words: \"Aryan era 1,960,852,987.\" [[Vol.\n\n2, Page]] 69 THE VARIOUS PRALAYAS.\n\nIV.\n\nThe number that elapsed since the \" Vaivasvata Manvantara \" * -- or the human period -- up to the year 1887, is just .........................\n\n18,618,728 years.\n\nV.\n\nThe full period of one Manvantara is .....\n\n308,448,000 years.\n\nVI.\n\n14 \"Manvantaras\" plus the period of one Satya Yuga make ONE DAY OF B RAHMA, or complete Manvantara and make .................\n\n4,320,000,000 years.\n\nTherefore a Maha-Yuga consists of .............\n\n4,320,000 years.** The year 1887 is from the commencement of Kali-Yuga .....................................................\n\n4,989 years.\n\nTo make this still clearer in its details, the following computations by Rao Bahadur P.\n\nSreenivas Row, are given from the \" Theosophist \" of November, 1885.\n\n- - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - Mortal years.\n\n360 days of mortals make a year ...........................................\n\n1 Krita Yuga contains .................................................\n\n1,728,000 Treta Yuga contains .................................................\n\n1,296,000 Dwapara Yuga contains ..............................................\n\n864,000 Kali Yuga contains ......................................................\n\n432,000 The total of the said four Yugas constitute a Maha Yuga ...............................................................\n\n4,320,000 Seventy-one of such Maha-Yugas form the period of the reign of one Manu ..........................\n\n306,720,000 The reign of 14 Manus embraces the duration of 994 Maha-Yugas, which is equal to ..............\n\n4,294,080,000 [[Footnote(s)]] ------------------------------------------------- * V AIVASVATA Manu is the one human being -- some versions add to him the seven Rishis -- who in the Matsya Avatar allegory is saved from the Deluge in a boat, like Noah in the Ark.\n\nTherefore, this Vaivasvata Manvantara would be the \"post-Diluvian\" period."


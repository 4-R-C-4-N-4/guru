[content]
body = "The \"Lemuro-Atlantean\" was a highly civilized race, and if one accepts tradition, which is better history than the speculative fiction which now passes under that name, he was higher than we are with all our sciences and the degraded civilization of the day: at any rate, the Lemuro-Atlantean of the closing Third Race was so.\n\nAnd now we may return to the Stanzas.\n\n------- [[This page continued in next section]]"


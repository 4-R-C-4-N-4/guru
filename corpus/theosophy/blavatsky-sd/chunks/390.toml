body = "If from Greek mythology we pass to the Mosaic allegories and symbolism, we shall find a still more striking corroboration of the same tenet under another form.\n\nUnable to trace in Genesis the \"Egg-born,\" we shall still find there unmistakably the androgynes, and the first three races of the Secret Doctrine hidden under most ingenious symbology in the first four chapters of Genesis.\n\n------- T HE D IVINE H ERMAPHRODITE.\n\nAn impenetrable veil of secrecy was thrown over the occult and religious mysteries taught, after the submersion of the last remnant of the Atlantean race, some 12,000 years ago, lest they should be shared by the unworthy, and so desecrated.\n\nOf these sciences several have now become exoteric -- such as Astronomy, for instance, in its purely mathematical and physical aspect.\n\nHence their dogmas and tenets, being all symbolised and left to the sole guardianship of parable and allegory, have been forgotten, and their meaning has become perverted.\n\nNevertheless, one finds the hermaphrodite in the scriptures and traditions of almost every nation; and why such unanimous agreement if the statement is only a fiction?\n\nIt is this secrecy which led the Fifth Race to the establishment, or rather the re-establishment of the religious mysteries, in which ancient truths might be taught to the coming generations under the veil of allegory and symbolism.\n\nBehold the imperishable witness to the evolution of the human races from the divine, and especially from the androgynous Race -- the Egyptian Sphinx, that riddle of the Ages!\n\nDivine wisdom incarnating on earth, and forced to taste of the bitter fruit of personal experience of pain and suffering, generated under the shade of the tree of the knowledge of Good and Evil -- a secret first known only to the Elohim, the SELF-INITIATED, \" higher gods \" -- on earth only.* [[Footnote continued]]------------------------------- In the Book of Enoch we have Adam,** the first divine androgyne, Moon, conceived as twins .\n\n.\n\n.\n\nThe Sun, the immortal and powerful being that disappears every evening from the horizon and descends under the Earth, as though he would make room for the fraternal orb which comes to life with night, is Pollux, who sacrifices himself for Castor; Castor, who, inferior to his brother, owes to him his immortality: for the Moon, says Theophrastus, is only another, but feebler Sun.\" ( De Ventis 17.\n\nSee Decharme, p.\n\n655.) [[Footnote(s)]] ------------------------------------------------- * See \" Book of Enoch.\n\n\" ** Adam (Kadmon) is, like Brahma and Mars, the symbol of the generative and creative power typifying Water and Earth -- an alchemical secret.\n\n\"It takes Earth and Water to create a human soul,\" said Moses.\n\nMars is the Hindu Mangala, the planet Mars, identical with Kartikeya, the \"War-God,\" born of Gharma-ja (Siva's sweat ) and of the [[Footnote continued on next page]] [[Vol.\n\n2, Page]] 125 JAH-HOVAH ANDROGYNOUS.\n\nseparating into man and woman, and becoming J AH- H EVA in one form, or Race, and Cain and Abel* (male and female) in its other form or Race -- the double-sexed Jehovah** -- an echo of its Aryan prototype, Brahma-Vach.\n\nAfter which come the Third and Fourth Root-Races of mankind*** -- that is to say, Races of men and women, or individuals of opposite sexes, no longer sexless semi-spirits and androgynes, as were the two Races which precede them.\n\nThis fact is hinted at in every Anthropogony.\n\nIt is found in fable and allegory, in myth and revealed Scriptures, in legend and tradition.\n\nBecause, of all the great Mysteries, inherited by Initiates from hoary antiquity, this is one of the greatest.\n\nIt accounts for the bi-sexual element found in every creative deity, in Brahma-Viraj-Vach, as in Adam-Jehovah-Eve, also in \"Cain-Jehovah-Abel.\" For \"The Book of the Generations of Adam\" does not even mention Cain and Abel, but says only: \"Male and female created he them.\n\n.\n\n.\n\nand called their name Adam\" (ch.\n\nv.\n\n5).\n\nThen it proceeds to say: \"And Adam begat a son in his own likeness, after his image, and called his name Seth\" (v.\n\n3); after which he begets other sons and daughters, thus proving that Cain and Abel are his own allegorical permutations.\n\nAdam stands for the primitive human race, especially in its cosmo-sidereal sense.\n\nNot so, however, in its theo-anthropological meaning.\n\nThe compound name of Jehovah, or Jah-Hovah, meaning male life and female life -- first androgynous, then separated into sexes -- is used in this sense in Genesis from ch.\n\nv.\n\nonwards.\n\nAs the author of \"The Source of Measures\" says ( p.\n\n159): \"The two words of which Jehovah is composed make up the original idea of male-female, as the birth originators\"; for the Hebrew letter Jod was the membrum virile and Hovah was Eve, the mother of all living, or the procreatrix, Earth and Nature.\n\nThe author believes, therefore, that \"It is seen that the perfect one \" (the perfect female circle or Yoni, 20612 , numerically ) , \"as originator of measures, takes also the form of birth -origin, as Hermaphrodite one ; hence the phallic form and use.\" Precisely; only \"the phallic form and use\" came long ages later; and the first and original meaning of Enos, the son of Seth, was the First Race born in the present usual way from man and woman --for Seth is no man, but a race.\n\nBefore him humanity was hermaphrodite.\n\n[[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] Earth.\n\nHe is Lokita, the red, like Brahma also and Adam.\n\nThe Hindu Mars is, like Adam, born from no woman and mother.\n\nWith the Egyptians, Mars was the primeval generative Principle, and so are Brahma, in exoteric teaching, and Adam, in the Kabala.\n\n* Abel is Chebel, meaning \"Pains of Birth,\" conception.\n\n** See \" Isis Unveiled ,\" Vol.\n\nII, p.\n\n398, where Jehovah is shown to be Adam and Eve blended, and Hevah, and Abel, the feminine serpent.\n\n*** See \" Isis Unveiled, \" Vol.\n\nI., 305: \"The union of the two create a third Race, etc.\" [[Vol.\n\n2, Page]] 126 THE SECRET DOCTRINE.\n\nWhile Seth is the first result (physiologically) after the FALL, he is also the first man ; hence his son Enos is referred to as the \"Son of man.\" ( Vide infra."


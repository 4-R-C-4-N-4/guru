body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n1 [[Vol.\n\n1, Page]] 136 THE SECRET DOCTRINE.\n\nSTANZA VI.\n\n1.\n\nB Y THE POWER OF THE M OTHER OF M ERCY AND K NOWLEDGE ( a ), K WAN- Y IN,* THE \" T RIPLE\" OF K WAN- S HAI- Y IN, RESIDING IN K WAN- Y IN- T IEN ( b ), F OHAT, THE BREATH OF THEIR PROGENY, THE S ON OF THE S ONS, HAVING CALLED FORTH FROM THE LOWER ABYSS ( chaos ) THE ILLUSIVE FORM OF S IEN- T CHAN ( our Universe ) AND THE SEVEN ELEMENTS: -- ( a .) The Mother of Mercy and Knowledge is called \"the triple\" of Kwan-Shai-Yin because in her correlations, metaphysical and cosmical, she is the \"Mother, the Wife and the Daughter\" of the Logos , just as in the later theological translations she became \"the Father, Son and (the female) Holy Ghost\" -- the Sakti or Energy -- the Essence of the three.\n\nThus in the Esotericism of the Vedantins, Daiviprakriti , the Light manifested through Eswara, the Logos,** is at one and the same time the Mother and also the Daughter of the Logos or Verbum of Parabrahmam; while in that of the trans-Himalayan teachings it is -- in the hierarchy of allegorical and metaphysical theogony -- \"the M OTHER\" or abstract, ideal matter, Mulaprakriti, the Root of Nature; -- from the metaphysical standpoint, a correlation of Adi-Bhuta, manifested in the Logos, Avalokiteshwara; -- and from the purely occult and [[Footnote(s)]] ------------------------------------------------- * This stanza is translated from the Chinese text, and the names, as the equivalents of the original terms, are preserved.\n\nThe real esoteric nomenclature cannot be given, as it would only confuse the reader.\n\nThe Brahmanical doctrine has no equivalent to these.\n\nVach seems, in many an aspect, to approach the Chinese Kwan-yin, but there is no regular worship of Vach under this name in India, as there is of Kwan-Yin in China.\n\nNo exoteric religious system has ever adopted a female Creator, and thus woman was regarded and treated, from the first dawn of popular religions, as inferior to man.\n\nIt is only in China and Egypt that Kwan-Yin and Isis were placed on a par with the male gods.\n\nEsotericism ignores both sexes.\n\nIts highest Deity is sexless as it is formless, neither Father nor Mother; and its first manifested beings, celestial and terrestrial alike, become only gradually androgynous and finally separate into distinct sexes.\n\n** The \"Theosophist\" of February, 1887, p.\n\n305, first lecture on the Bhagavadgita.\n\n[[Vol.\n\n1, Page]] 137 THE MYSTERY OF THE FEMALE LOGOS.\n\nCosmical, Fohat,* the \"Son of the Son,\" the androgynous energy resulting from this \"Light of the Logos,\" and which manifests in the plane of the objective Universe as the hidden, as much as the revealed, Electricity -- which is L IFE.\n\n( b ) Kwan-Yin-Tien means the \"melodious heaven of Sound,\" the abode of Kwan-Yin, or the \" Divine Voice \" literally.\n\nThis \"Voice\" is a synonym of the Verbum or the Word: \"Speech,\" as the expression of thought.\n\nThus may be traced the connection with, and even the origin of the Hebrew Bath-Kol , the \"daughter of the Divine Voice,\" or Verbum, or the male and female Logos, the \"Heavenly Man\" or Adam Kadmon, who is at the same time Sephira.\n\nThe latter was surely anticipated by the Hindu Vach, the goddess of Speech, or of the Word.\n\nFor Vach -- the daughter and the female portion, as is stated, of Brahma, one \"generated by the gods\" -- is, in company with Kwan-Yin, with Isis (also the daughter , wife and sister of Osiris) and other goddesses, the female Logos, so to speak, the goddess of the active forces in Nature, the Word, Voice or Sound, and Speech.\n\nIf Kwan-Yin is the \"melodious Voice,\" so is Vach; \"the melodious cow who milked forth sustenance and water\" (the female principle) -- \"who yields us nourishment and sustenance,\" as Mother-Nature.\n\nShe is associated in the work of creation with the Prajapati.\n\nShe is male and female ad libitum , as Eve is with Adam.\n\nAnd she is a form of Aditi -- the principle higher than Ether -- in Akasa, the synthesis of all the forces in Nature; thus Vach and Kwan-Yin are both the magic potency of Occult sound in Nature and Ether -- which \"Voice\" calls forth Sien-Tchan, the illusive form of the Universe out of Chaos and the Seven Elements.\n\nThus in Manu Brahma (the Logos also) is shown dividing his body into two parts, male and female, and creating in the latter, who is Vach, Viraj, who is himself, or Brahma again -- it is in this way a learned Vedantin Occultist speaks of that \"goddess,\" explaining the reason why Eswara (or Brahma) is called Verbum or Logos ; why in fact it is called Sabda Brahmam: -- [[Footnote(s)]] ------------------------------------------------- * Says the lecturer on p.\n\n306: \"Evolution is commenced by the intellectual energy of the Logos , not merely on account of the potentialities locked up in Mulaprakriti.\n\nThis light of the Logos is the link .\n\n.\n\n.\n\nbetween objective matter and the subjective thought of Eswara (or Logos).\n\nIt is called in several Buddhist books Fohat.\n\nIt is the one instrument with which the Logos works.\" [[Vol.\n\n1, Page]] 138 THE SECRET DOCTRINE.\n\n\"The explanation I am going to give you will appear thoroughly mystical; but if mystical, it has a tremendous significance when properly understood.\n\nOur old writers said that Vach is of four kinds (see Rig Veda and the Upanishads).\n\nVaikhari-Vach is what we utter.\n\nEvery kind of Vaikhari-Vach exists in its Madhyama , further in its Pasyanti , and ultimately in its Para form.* The reason why this Pranava is called Vach is this, that the four principles of the great Kosmos correspond to these four forms of Vach.\n\nNow the whole manifested solar System exists in its Sukshma form in the light or energy of the Logos , because its energy is caught up and transferred to Cosmic matter.\n\n.\n\n.\n\n."


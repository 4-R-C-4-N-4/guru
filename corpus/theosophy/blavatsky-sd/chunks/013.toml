[content]
body = "Nor could the vast catalogue of the Archaic Sciences be attempted in the present volumes, before we have disposed of such tremendous problems as Cosmic and Planetary Evolution, and the gradual development of the mysterious Humanities and races that preceded our \"Adamic\" Humanity.\n\nTherefore, the present attempt to elucidate some mysteries of the Esoteric philosophy has, in truth, nothing to do with the earlier work.\n\nAs an instance, the writer must be allowed to illustrate what is said.\n\nVolume I.\n\nof \"Isis\" begins with a reference to \"an old book\" -- \"So very old that our modern antiquarians might ponder over its pages an indefinite time, and still not quite agree as to the nature of the fabric upon which it is written.\n\nIt is the only original copy now in existence.\n\nThe most ancient Hebrew document on occult learning -- the Siphrah Dzeniouta -- was compiled from it, and that at a time when the former was already considered in the light of a literary relic.\n\nOne of its illustrations represents the Divine Essence emanating from A DAM* like a luminous arc proceeding to form a circle; and then, having attained the highest point of its circumference, the ineffable glory bends back again, and returns to earth, bringing a higher type of humanity in its vortex.\n\nAs it approaches nearer and nearer to our planet, the Emanation becomes more and more shadowy, until upon touching the ground it is as black as night.\" [[Footnote(s)]] ------------------------------------------------- * The name is used in the sense of the Greek word [[ anthropos ]].\n\n[[Vol.\n\n1, Page]] xliii INTRODUCTORY.\n\nThe \"very old Book\" is the original work from which the many volumes of Kiu-ti were compiled.\n\nNot only this latter and the Siphrah Dzeniouta but even the Sepher Jezirah,* the work attributed by the Hebrew Kabalists to their Patriarch Abraham (!), the book of Shu-king, China's primitive Bible, the sacred volumes of the Egyptian Thoth-Hermes, the Puranas in India, and the Chaldean Book of Numbers and the Pentateuch itself, are all derived from that one small parent volume.\n\nTradition says, that it was taken down in Senzar, the secret sacerdotal tongue, from the words of the Divine Beings, who dictated it to the sons of Light, in Central Asia, at the very beginning of the 5th (our) race; for there was a time when its language (the Sen-zar ) was known to the Initiates of every nation, when the forefathers of the Toltec understood it as easily as the inhabitants of the lost Atlantis, who inherited it, in their turn, from the sages of the 3rd Race, the Manushis, who learnt it direct from the Devas of the 2nd and 1st Races.\n\nThe \"illustration\" spoken of in \"Isis\" relates to the evolution of these Races and of our 4th and 5th Race Humanity in the Vaivasvata Manvantara or \"Round\"; each Round being composed of the Yugas of the seven periods of Humanity; four of which are now passed in our life cycle, the middle point of the 5th being nearly reached.\n\nThe illustration is symbolical, as every one can well understand, and covers the ground from the beginning.\n\nThe old book, having described Cosmic Evolution and explained the origin of everything on earth, including physical man, after giving the true history of the races from the First down to the Fifth (our) race, goes no further.\n\nIt stops short at the beginning of the Kali Yuga just 4989 years ago at the death of Krishna, the bright \"Sun-god,\" the once living hero and reformer.\n\nBut there exists another book.\n\nNone of its possessors regard it as very ancient, as it was born with, and is only as old as the Black Age, [[Footnote(s)]] ------------------------------------------------- * Rabbi Jehoshua Ben Chananea, who died about A.D .\n\n72, openly declared that he had performed \"miracles\" by means of the Book of Sepher Jezireh, and challenged every sceptic.\n\nFranck, quoting from the Babylonian Talmud, names two other thaumaturgists, Rabbis Chanina and Oshoi.\n\n(See \" Jerusalem Talmud, Sanhedrin,\" c.\n\n7, etc.; and \" Franck, \" pp.\n\n55, 56.) Many of the Mediaeval Occultists, Alchemists, and Kabalists claimed the same; and even the late modern Magus, Eliphas Levi, publicly asserts it in print in his books on Magic.\n\n[[Vol.\n\n1, Page]] xliv INTRODUCTORY.\n\nnamely, about 5,000 years.\n\nIn about nine years hence, the first cycle of the first five millenniums, that began with the great cycle of the Kali-Yuga, will end.\n\nAnd then the last prophecy contained in that book (the first volume of the prophetic record for the Black Age) will be accomplished.\n\nWe have not long to wait, and many of us will witness the Dawn of the New Cycle, at the end of which not a few accounts will be settled and squared between the races.\n\nVolume II.\n\nof the Prophecies is nearly ready, having been in preparation since the time of Buddha's grand successor, Sankaracharya.\n\nOne more important point must be noticed, one that stands foremost in the series of proofs given of the existence of one primeval, universal Wisdom -- at any rate for the Christian Kabalists and students.\n\nThe teachings were, at least, partially known to several of the Fathers of the Church.\n\nIt is maintained, on purely historical grounds, that Origen, Synesius, and even Clemens Alexandrinus, had been themselves initiated into the mysteries before adding to the Neo-Platonism of the Alexandrian school, that of the Gnostics, under the Christian veil.\n\nMore than this, some of the doctrines of the Secret schools -- though by no means all -- were preserved in the Vatican, and have since become part and parcel of the mysteries, in the shape of disfigured additions made to the original Christian programme by the Latin Church.\n\nSuch is the now materialised dogma of the Immaculate Conception.\n\nThis accounts for the great persecutions set on foot by the Roman Catholic Church against Occultism, Masonry, and heterodox mysticism generally.\n\nThe days of Constantine were the last turning-point in history, the period of the Supreme struggle that ended in the Western world throttling the old religions in favour of the new one, built on their bodies.\n\nFrom thence the vista into the far distant Past, beyond the \"Deluge\" and the Garden of Eden, began to be forcibly and relentlessly closed by every fair and unfair means against the indiscreet gaze of posterity.\n\nEvery issue was blocked up, every record that hands could be laid upon, destroyed.\n\nYet there remains enough, even among such mutilated records, to warrant us in saying that there is in them every possible evidence of the actual existence of a Parent Doctrine."


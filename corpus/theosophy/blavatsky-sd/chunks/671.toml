body = "The embryological argument is thus a two-edged sword and here cuts its possessor.\n\n** \"Physiology,\" Lefevre, p.\n\n480.\n\n[[Vol.\n\n2, Page]] 686 THE SECRET DOCTRINE.\n\nsemi-human - - of our teachings.\n\nBut it can hardly do the same in the case of the Third at its closing period, the Fourth, and the Fifth Races, since it already divides mankind into Palaeolithic and Neolithic man.* The geologists of France place man in the mid-miocene age (Gabriel de Mortillet), and some even in the Secondary period, as de Quatrefages suggests; while the English savants do not generally accept such antiquity for their species.\n\nBut they may know better some day.\n\nFor \"If we consider,\" says Sir Charles Lyell in \"Antiquity of Man,\" p.\n\n246 -- \"the absence or extreme scarcity of human bones and works of art in all strata, whether marine or fresh water, even in those formed in the immediate proximity of land inhabited by millions of human beings, we shall be prepared for the general dearth of human memorials in glacial formations, whether recent, Pleistocene, or of more ancient date.\n\nIf there were a few wanderers over lands covered with glaciers, or over seas infested with icebergs, and if a few of them left their bones or weapons in moraines or in marine drifts, the chances, after the lapse of thousands of years, of a geologist meeting with one of them must be infinitesimally small.\" The men of Science avoid pinning themselves down to any definite statement concerning the age of man, as indeed they hardly could, and thus leave enormous latitude to bolder speculations.\n\nNevertheless, while the majority of the Anthropologists carry back the existence of man only into the period of the post -glacial drift, or what is called the Quaternary period, those of them who, as Evolutionists, trace man to a common origin with that of the monkey, do not show great consistency in their speculations.\n\nThe Darwinian hypothesis demands, in reality, a far greater antiquity for man, than is even dimly suspected by superficial thinkers.\n\nThis is proven by the greatest authorities on the question -- Mr.\n\nHuxley, for instance.\n\nThose, therefore, who accept the Darwinian evolution, ipso facto hold very tenaciously to an antiquity [[Footnote(s)]] ------------------------------------------------- * We confess to not being able to see any good reasons for Mr.\n\nE.\n\nClodd's certain statement in Knowledge.\n\nSpeaking of the men of Neolithic times, \"concerning whom Mr.\n\nGrant Allen has given .\n\n.\n\n.\n\na vivid and accurate sketch,\" and who are \"the direct ancestors of peoples of whom remnants yet lurk in out-of-the-way corners of Europe, where they have been squeezed or stranded,\" he adds to this: \"but the men of Palaeolithic times can be identified with no existing races; they were savages of a more degraded type than any extant; tall, yet barely erect, with short legs and twisted knees, with prognathous, that is, projecting ape-like jaws, and small brains.\n\nWhence they come we cannot tell, and their 'grave knoweth no man to this day.' \" Besides the possibility that there may be men who know whence they came and how they perished -- it is not true to say that the Palaeolithic men, or their fossils, are all found with \"small brains.\" The oldest skull of all those hitherto found, the \"Neanderthal skull,\" is of average capacity, and Mr.\n\nHuxley was compelled to confess that it was no real approximation whatever to that of the \"missing link.\" There are aboriginal tribes in India whose brains are far smaller and nearer to that of the ape than any hitherto found among the skulls of Palaeolithic man.\n\n[[Vol.\n\n2, Page]] 687 GRANT ALLEN'S ILLUSIONS.\n\nof man so very great, indeed, that it falls not so far short of the Occultist's estimate.* The modest thousands of years of the Encyclopaedia Britannica and the 100,000 years, to which Anthropology in general limits the age of Humanity, seem quite microscopical when compared with the figures implied in Mr.\n\nHuxley's bold speculations.\n\nThe former, indeed, makes of the original race of men ape-like cave-dwellers.\n\nThe great English biologist, in his desire to prove man's pithecoid origin, insists that the transformation of the primordial ape into a human being must have occurred millions of years back.\n\nFor in criticising the excellent average cranial capacity of the Neanderthal skull, notwithstanding his assertion that it is overlaid with \"pithecoid bony walls,\" coupled with Mr.\n\nGrant Allen's assurances that this skull \"possesses large bosses on the forehead, strikingly (?) suggestive of those which give the gorilla its peculiarly fierce appearance,\"** ( Fortnightly Review, 1882,) still Mr.\n\nHuxley is forced to admit that, in the said skull, his theory is once more defeated by the \"completely human proportions of the accompanying limb-bones, together with the fair development of the Engis skull.\" In consequence of all this we are notified that those skulls, \"clearly indicate that the first traces of the primordial stock whence man has proceeded, need no longer be sought by those who entertain any form of the doctrine of progressive development in the newest Tertiaries; but that they may be looked for in an epoch more distant from the age of the ELEPHAS PRIMIGENIUS than that is from us \" *** (Huxley).\n\n[[Footnote(s)]] ------------------------------------------------- * The actual time required for such a theoretical transformation is necessarily enormous.\n\n\"If,\" says Professor Pfaff, \"in the hundreds of thousands of years which you (the Evolutionists) accept between the rise of palaeolithic man and our own day, a greater distance of man from the brute is not demonstrable, ( the most ancient man was just as far removed from the brute as the now living man ), what reasonable ground can be advanced for believing that man has been developed from the brute, and has receded further from it by infinitely small gradations.\" .\n\n.\n\n.\n\n.\n\n\" The longer the interval of time placed between our times and the so-called palaeolithic men, the more ominous and destructive for the theory of the gradual development of man from the animal kingdom is the result stated.\n\n\" Huxley states (\"Man's Place in Nature,\" p.\n\n159) that the most liberal estimates for the antiquity of Man must be still further extended.\n\n** The baselessness of this assertion, as well as that of many other exaggerations of the imaginative Mr.\n\nGrant Allen, was ably exposed by the eminent anatomist, Professor R.\n\nOwen, in \"Longman's Magazine,\" No.\n\n1.\n\nMust it be repeated, moreover, that the Cro-Magnon Palaeolithic type is superior to a very large number of existing races?"


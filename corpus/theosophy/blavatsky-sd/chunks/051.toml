body = "`The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n1 [[Vol.\n\n1, Page]] 86 THE SECRET DOCTRINE.\n\nSTANZA IV.\n\nCOMMENTARY.\n\n1.\n\nL ISTEN, YE S ONS OF THE E ARTH, TO YOUR INSTRUCTORS -- THE S ONS OF THE F IRE ( a ).\n\nL EARN THERE IS NEITHER FIRST NOR LAST; FOR ALL IS ONE NUMBER, ISSUED FROM NO NUMBER ( b ).\n\n( a ) These terms, the \"Sons of the Fire,\" the \"Sons of the Fire-Mist,\" and the like, require explanation.\n\nThey are connected with a great primordial and universal mystery, and it is not easy to make it clear.\n\nThere is a passage in the Bhagavatgita (ch.\n\nviii.) wherein Krishna, speaking symbolically and esoterically , says: \"I will state the times (conditions) .\n\n.\n\n.\n\nat which devotees departing (from this life) do so never to return (be reborn), or to return (to incarnate again).\n\nThe Fire, the Flame, the day, the bright (lucky) fortnight, the six months of the Northern solstice, departing (dying) in these, those who know the Brahman (Yogis) go to the Brahman.\n\nSmoke, night, the dark (unlucky) fortnight, the six months of the Southern solstice, (dying) in these, the devotee goes to the lunar light (or mansion the astral light also) and returns (is reborn).\n\nThese two paths, bright and dark, are said to be eternal in this world (or great kalpa, 'Age').\n\nBy the one a man goes never to come back, by the other he returns.\" Now these names, \"Fire,\" \"Flame,\" \"Day,\" the \"bright fortnight,\" etc., as \"Smoke,\" \"Night,\" and so on, leading only to the end of the lunar path are incomprehensible without a knowledge of Esotericism.\n\nThese are all names of various deities which preside over the Cosmo-psychic Powers.\n\nWe often speak of the Hierarchy of \"Flames\" (see Book II.) of the \"Sons of Fire,\" etc.\n\nSankaracharya the greatest of the Esoteric masters of India, says that fire means a deity which presides over Time (kala).\n\nThe able translator of Bhagavatgita, Kashinath Trimbak Telang, M.A ., of Bombay, confesses he has \"no clear notion of the meaning of these verses\" (p.\n\n81, footnote).\n\nIt seems quite clear, on the contrary, to him who knows the occult doctrine.\n\nWith these verses the mystic sense of the solar and lunar symbols are connected: the Pitris are lunar deities and our ancestors, because they created the physical man.\n\n[[Vol.\n\n1, Page]] 87 THE SEVEN MYSTIC SENSES.\n\nThe Agnishwatha, the Kumara (the seven mystic sages), are solar deities, though the former are Pitris also; and these are the \"fashioners of the Inner Man.\" (See Book II.) They are: -- \"The Sons of Fire\" -- because they are the first Beings (in the Secret Doctrine they are called \"Minds\"), evolved from Primordial Fire.\n\n\"The Lord is a consuming Fire\" (Deuteronomy iv.\n\n24); \"The Lord (Christos) shall be revealed with his mighty angels in flaming fire\" (2 Thessal.\n\ni.\n\n7, 8).\n\nThe Holy Ghost descended on the Apostles like \"cloven tongues of fire,\" (Acts ii.\n\nv.\n\n3); Vishnu will return on Kalki , the White Horse, as the last Avatar amid fire and flames; and Sosiosh will be brought down equally on a White Horse in a \"tornado of fire.\" \"And I saw heaven open and behold a white horse, and he that sat upon him .\n\n.\n\n.\n\n.\n\nis called the Word of God,\" (Rev.\n\nxix.\n\n13) amid flaming Fire.\n\nFire is AEther in its purest form, and hence is not regarded as matter, but it is the unity of Aether -- the second manifested deity -- in its universality.\n\nBut there are two \"Fires\" and a distinction is made between them in the Occult teachings.\n\nThe first, or the purely Formless and invisible Fire concealed in the Central Spiritual Sun , is spoken of as \"triple\" (metaphysically); while the Fire of the manifested Kosmos is Septenary, throughout both the Universe and our Solar System.\n\n\"The fire or knowledge burns up all action on the plane of illusion,\" says the commentary.\n\n\"Therefore, those who have acquired it and are emancipated, are called 'Fires.' \" Speaking of the seven senses symbolised as Hotris, priests, the Brahmana says in Anugita : \"Thus these seven (senses, smell and taste, and colour, and sound, etc., etc.) are the causes of emancipation;\" and the commentator adds: \"It is from these seven from which the Self is to be emancipated.\n\n'I' (am here devoid of qualities) must mean the Self, not the Brahmana who speaks.\" (\" Sacred Books of the East ,\" ed.\n\nby Max Muller, Vol.\n\nVIII., 278.) ( b ) The expression \"All is One Number, issued from No Number\" relates again to that universal and philosophical tenet just explained in Stanza III.\n\n(Comm.\n\n4).\n\nThat which is absolute is of course No Number; but in its later significance it has an application in Space as in Time.\n\nIt means that not only every increment of time is part of a larger increment, up to the most indefinitely prolonged duration conceivable by the human intellect, but also that no manifested thing can [[Vol.\n\n1, Page]] 88 THE SECRET DOCTRINE.\n\nbe thought of except as part of a larger whole: the total aggregate being the One manifested Universe that issues from the unmanifested or Absolute -- called Non-Being or \"No-Number,\" to distinguish it from B EING or \"the One Number.\" ------- STANZA IV.\n\n-- Continued.\n\n(2) L EARN WHAT WE, WHO DESCEND FROM THE P RIMORDIAL S EVEN, WE, WHO ARE BORN FROM THE P RIMORDIAL F LAME, HAVE LEARNED FROM OUR F ATHERS ( a ).\n\n( a ) This is explained in Book II., and this name, \"Primordial Flame,\" corroborates what is said in the first paragraph of the preceding commentary on Stanza IV.\n\nThe distinction between the \"Primordial\" and the subsequent seven Builders is this: The former are the Ray and direct emanation of the first \"Sacred Four,\" the Tetraktis, that is, the eternally Self-Existent One (Eternal in Essence note well, not in manifestation, and distinct from the universal ONE)."


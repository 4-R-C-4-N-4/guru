body = ") ** The whole trouble is this: neither physiologists nor pathologists will recognize that the cell-germinating substance (the cytoblastema ) and the mother-lye from which crystals originate, are one and the same essence, save in differentiation for purposes.\n\n[[Vol.\n\n2, Page]] 256 THE SECRET DOCTRINE.\n\nBut we would ask, what does science and its exact and now axiomatic discoveries prove against our Occult theory?\n\nThose who believe in the law of Evolution and gradual progressive development from a cell (which from a vital has become a morphological cell, until it awoke as protoplasm pure and simple) -- these can surely never limit their belief to one line of evolution.\n\nThe types of life are innumerable; and the progress of evolution, moreover, does not go at the same rate in every kind of species.\n\nThe constitution of primordial matter in the Silurian age -- we mean \"primordial\" matter of science -- is the same in every essential particular, save its degree of present grossness, as the primordial living matter of to-day.\n\nNor do we find that which ought to be found, if the now orthodox theory of Evolution were quite correct, namely, a constant, ever-flowing progress in every species of being.\n\nInstead of that, what does one see?\n\nWhile the intermediate groups of animal being all tend toward a higher type, and while specializations, now of one type and now of another, develop through the geological ages, change forms, assume new shapes, appear and disappear with a kaleidoscopic rapidity in the description of paleontologists from one period to another, the two solitary exceptions to the general rule are those at the two opposite poles of life and type, namely -- M AN and the lower genera of being!\n\n\"Certain well-marked forms of living beings have existed through enormous epochs, surviving not only the changes of physical conditions, but persisting comparatively unaltered, while other forms of life have appeared and disappeared.\n\nSuch forms may be termed 'persistent types' of life; and examples of them are abundant enough in both the animal and the vegetable worlds\" (Huxley, \"Proceed.\n\nof Roy.\n\nInst.,\" vol.\n\niii., p.\n\n151).\n\nNevertheless, we are not given any good reason why Darwin links together reptiles, birds, amphibians, fishes, mollusca, etc., etc., as off-shoots of a moneric ancestry.\n\nNor are we told whether reptiles, for instance, are direct descendants of the amphibian, the latter of fishes, and fishes of lower forms -- which they certainly are.\n\nFor the Monads have passed through all these forms of being up to man, on every planet, in the Three preceding Rounds; every Round, as well as every subsequent Globe, from A to G, having been, and still having to be the arena of the same evolution, only repeated each time on a more solid material basis.\n\nTherefore the question: -- \"What relation is there between the Third Round astral prototypes and ordinary physical development in the course of the origination of pre-mammalian organic species?\" -- is easily answered.\n\nOne is the shadowy prototype of the other, the preliminary, hardly defined, and evanescent sketch on the canvas, of objects, which are destined to receive the final and vivid [[Vol.\n\n2, Page]] 257 THE CONTRADICTIONS OF SCIENCE.\n\nform under the brush of the painter.\n\nThe fish evolved into an amphibian -- a frog -- in the shadows of ponds, and man passed through all his metamorphoses on this Globe in the Third Round as he did in this, his Fourth Cycle.\n\nThe Third Round types contributed to the formation of the types in this one.\n\nOn strict analogy, the cycle of Seven Rounds in their work of the gradual formation of man through every kingdom of Nature, are repeated on a microscopical scale in the first seven months of gestation of a future human being.\n\nLet the student think over and work out this analogy.\n\nAs the seven months' old unborn baby, though quite ready, yet needs two months more in which to acquire strength and consolidate; so man, having perfected his evolution during seven Rounds, remains two periods more in the womb of mother-Nature before he is born, or rather reborn a Dhyani, still more perfect than he was before he launched forth as a Monad on the newly built chain of worlds.\n\nLet the student ponder over this mystery, and then he will easily convince himself that, as there are also physical links between many classes, so there are precise domains wherein the astral merges into physical evolution.\n\nOf this Science breathes not one word.\n\nMan has evolved with and from the monkey, it says.\n\nBut now see the contradiction.\n\nHuxley proceeds to point out plants, ferns, club mosses, some of them generically identical with those now living, which are met with in the carboniferous epoch, for: -- \"The cone of the oolitic Araucaria is hardly distinguishable from that of existing species.\n\n.\n\n.\n\n.\n\n.\n\nSubkingdoms of animals yield the same instances.\n\nThe globigerina of the Atlantic soundings is identical with the cretaceous species of the same genus .\n\n.\n\n.\n\nthe tabulate corals of the Silurian epoch are wonderfully like the millepores of our own seas.\n\n.\n\n.\n\n.\n\nThe arachnida, the highest group of which, the scorpions, is represented in the coal by a genus differing only from its living congeners only in .\n\n.\n\n.\n\nthe eyes,\" etc., etc.; all of which may be closed with Dr.\n\nCarpenter's authoritative statement about the Foraminifera.\n\n\"There is no evidence,\" he says, \"of any fundamental modification or advance in the Foraminiferous type from the palaeozoic period to the present time.\n\n.\n\n.\n\n.\n\nThe Forminiferous Fauna of our own series probably present a greater range of variety than existed at any previous period; but there is no indication of any tendency to elevation towards a higher type.\n\n\" (\"Introduction to the study of the Forminifera,\" p.\n\nxi.) Now, if there is no indication of change in the Forminifera, a protozoon of the lowest type of life, mouthless and eyeless, except its greater variety now than before, man, who is on the uppermost rung of the ladder of being, indicates still less change, as we have seen; the skeleton of his Palaeolithic ancestor being even found [[Vol.\n\n2, Page]] 258 THE SECRET DOCTRINE.\n\nsuperior in some respects to his present frame.\n\nWhere is, then, the claimed uniformity of law, the absolute rule for one species shading off into another, and, by insensible gradations, into higher types?\n\nWe see Sir William Thomson admitting as much as 400,000,000 of years in the earth's history, since the surface of the globe became sufficiently cool to permit of the presence of living things;\" and during that enormous lapse of time in the Oolitic period alone, the so-called \"age of reptiles,\" we find a most extraordinary variety and abundance of Saurian forms, the Amphibian type reaching its highest developments."


[content]
body = "Anger, my son, is the destruction of [[Vol.\n\n1, Page]] 416 THE SECRET DOCTRINE.\n\nall that man obtains .\n\n.\n\n.\n\nand prevents the attainment of emancipation.\n\nThe sages shun wrath.\n\nBe not thou, my child, subject to its influence.\n\nLet not those unoffending spirits of darkness be consumed; let thy sacrifice cease.\n\nMercy is the might of the righteous\" ( Vishnu Purana , Book i., ch.\n\ni.).\n\nThus, every such \"sacrifice\" or prayer to God for help is no better than an act of black magic.\n\nThat which Parasara prayed for, was the destruction of the Spirits of Darkness, for his personal revenge.\n\nHe is called a Pagan , and the Christians have doomed him as such, to eternal hell.\n\nYet, in what respect is the prayer of sovereigns and generals, who pray before every battle for the destruction of their enemy, any better?\n\nSuch a prayer is in every case black magic of the worst kind, concealed like a demon \"Mr.\n\nHyde\" under a sanctimonious \"Dr.\n\nJekyll.\" In human nature, evil denotes only the polarity of matter and Spirit, a struggle for life between the two manifested Principles in Space and Time, which principles are one per se , inasmuch they are rooted in the Absolute.\n\nIn Kosmos, the equilibrium must be preserved.\n\nThe operations of the two contraries produce harmony, like the centripetal and centrifugal forces, which are necessary to each other -- mutually inter-dependent -- \"in order that both should live.\" If one is arrested, the action of the other will become immediately self-destructive.\n\nSince the personification called Satan has been amply analyzed from its triple aspect -- in the Old Testament, Christian theology and the ancient Gentile attitude of thought -- those who would learn more of it are referred to Vol.\n\nII.\n\nof I SIS U NVEILED, chap.\n\nx.\n\nSee also several sections in Book II., Part II.\n\nof this work.\n\nThe present subject is touched upon and fresh explanations attempted for a very good reason.\n\nBefore we can approach the evolution of physical and divine man, we have first to master the idea of cyclic evolution, to acquaint ourselves with the philosophies and beliefs of the four races which preceded our present race, to learn what were the ideas of those Titans and giants -- giants, verily, mentally as well as physically.\n\nThe whole of antiquity was imbued with that philosophy which teaches the involution of spirit into matter, the progressive, downward cyclic descent, or active, self-conscious evolution.\n\nThe Alexandrian Gnostics have sufficiently divulged the secret of initiations, and their records are full of \"the sliding down of AEons \" in their double qualification of Angelic Beings and Periods: the one the natural evolution of the other.\n\nOn the other hand, Oriental traditions on both sides of the \"black water\" -- the oceans that separate the two Easts -- are as full of allegories about the downfall of Pleroma, of that of the gods and Devas.\n\nOne and all, they allegorized and explained the F ALL as the [[Vol.\n\n1, Page]] 417 THE ANGELS SLANDERED.\n\ndesire to learn and acquire knowledge -- to KNOW.\n\nThis is the natural sequence of mental evolution, the spiritual becoming transmuted into the material or physical.\n\nThe same law of descent into materiality and re-ascent into spirituality asserted itself during the Christian era, the reaction having stopped only just now, in our own special sub-race.\n\nThat which, perhaps ten millenniums ago, was allegorized in Pymander in a triune character of interpretation, meant as a record of an astronomical, anthropological, and even alchemical fact, namely, the allegory of the seven rectors breaking through the seven circles of fire, was dwarfed into one material and anthropomorphic interpretation -- the rebellion and Fall of the Angels.\n\nThe multivocal, profoundly philosophical narrative, under its poetical form of the \"Marriage of Heaven with Earth,\" the love of nature for Divine form and the \"Heavenly man,\" enraptured with his own beauty mirrored in nature -- i.e.\n\n, Spirit attracted into matter -- has now become, under theological handling: \"the seven Rectors disobeying Jehovah, self admiration generating Satanic Pride, followed by their F ALL, Jehovah permitting no worship to be lost save upon himself.\" In short, the beautiful Planet-Angels, the glorious cyclic aeons of the ancients, became henceforward synthesized in their most orthodox shape in Samael, the chief of the Demons in the Talmud, \"That great serpent with twelve wings that draws down after himself, in his Fall, the solar system, or the Titans.\" But Schemal , the alter ego and the Sabean type of Samael, meant, in his philosophical and esoteric aspect, the \"year\" in its astrological evil aspect, its twelve months or wings of unavoidable evils, in nature; and in esoteric theogony (see Chwolson in N ABATHEAN A GRICULTURE, Vol.\n\nII., p.\n\n217), both Schemal and Samael represented a particular divinity.\n\nWith the Kabalists they are \"the Spirit of the Earth,\" the personal god that governs it, identical de facto with Jehovah.\n\nFor the Talmudists admit themselves that S AMAEL is a god-name of one of the seven Elohim.\n\nThe Kabalists, moreover, show the two, Schemal and Samael, as a symbolical form of Saturn, C HRONOS, the twelve wings standing for the 12 months, and the symbol in its collectivity representing a racial cycle.\n\nJehovah and Saturn are also glyphically identical.\n\nThis leads in its turn to a very curious deduction from a Roman Catholic dogma.\n\nMany renowned writers belonging to the Latin Church admit that a difference exists, and should be made, between the Uranian Titans, the antediluvian giants (also Titans), and those post-diluvian giants in whom they (the Roman Catholics) will see the descendants of the mythical Ham.\n\nIn clearer words, there is a difference to be made between the Cosmic, primordial opposing Forces -- guided by cyclic law -- the Atlantean human giants, and the post-diluvian great adepts, whether [[Vol.\n\n1, Page]] 418 THE SECRET DOCTRINE.\n\nof the right or the left hand.\n\nAt the same time they show that Michael, \"the generalissimos of the fighting Celestial Host, the bodyguard of Jehovah ,\" as it would seem (see de Mirville) is also a Titan, only with the adjective of \"divine\" before the cognomen.\n\nThus those \"Uranides\" who are called everywhere \"divine Titans,\" and who, having rebelled against Kronos (Saturn), are therefore also shown to be the enemies of Samael (an Elohim, also and synonymous with Jehovah in his collectivity), are identical with Michael and his host.\n\nIn short, the roles are reversed, all the combatants are confused, and no student is able to distinguish clearly which is which."


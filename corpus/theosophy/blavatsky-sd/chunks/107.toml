body = "These, Tsanagi-Tsanami , descended into the Universe by the celestial Bridge (the milky way), and \" Tsanagi , perceiving far below a chaotic mass of cloud and water, thrust his jewelled spear into the depths, and dry land appeared.\" Then the two separated to explore Onokoro , the newly-created island-world; etc., etc.\n\n( Omoie ) .\n\n[[Vol.\n\n1, Page]] 218 THE SECRET DOCTRINE.\n\nSuch are the Japanese exoteric fables, the rind that conceals the kernel of the same one truth of the Secret Doctrine.\n\nTurning back to the esoteric explanations in every cosmogony: -- ( d ) The Third order corresponds to the Atma-Buddhi-Manas: Spirit, Soul and Intellect, and is called the \"Triads.\" ( e ) The Fourth are substantial Entities.\n\nThis is the highest group among the Rupas (Atomic Forms*).\n\nIt is the nursery of the human, conscious, spiritual Souls.\n\nThey are called the \"Imperishable Jivas,\" and constitute, through the order below their own, the first group of the first septenary** host -- the great mystery of human conscious and [[Footnote(s)]] ------------------------------------------------- * It is worthy of notice that, while rejecting as a superstition of Occultism, and religion too, the theory of substantial and invisible Beings called Angels, Elementals, etc.\n\n-- without, of course, having ever looked into the philosophy of these incorporeal Entities, or thought over them -- modern chemistry, owing to observation and discovery, should have unconsciously been forced to adopt and recognize the same ratio of progression and order in the evolution of chemical atoms as Occultism does, both for its Dhyanis and Atoms -- analogy being its first law.\n\nAs seen above, the very first group of the Rupa Angels is quaternary, an element being added to each in descending order.\n\nSo are the atoms, adopting the phraseology of chemistry, monatomic, diatomic, and tetratomic, progressing downwards.\n\nLet it be remembered that Fire, Water, and Air, or the \"Elements of primary Creation\" so-called, are not the compound Elements they are on Earth, but noumenal homogeneous Elements -- the Spirits thereof.\n\nThen follow the septenary groups or hosts.\n\nPlaced on parallel lines in a diagram with Atoms, the Natures of those Beings would be seen to correspond in their downward scale of progression to composite elements in a mathematically identical manner, as to analogy.\n\nThis refers, of course, only to diagrams made by the Occultists; for were the scale of Angelic Beings to be placed on a parallel line with the scale of the chemical atoms of Science -- from the hypothetical Helium down to Uranium -- they would of course be found to differ.\n\nFor these have, as correspondents on the Astral plane, only the four lowest orders -- the higher three principles in the atom, or rather molecule or chemical element, being perceptible only to the initiated Dangma's eye.\n\nBut then, if Chemistry desired to find itself on the right path, it would have to correct its tabular arrangement by that of the Occultists -- which it may refuse to do.\n\nIn Esoteric Philosophy, every physical particle corresponds to and depends on its higher noumenon -- the Being to whose essence it belongs; and above as below, the Spiritual evolves from the Divine, the psycho-mental from the Spiritual -- tainted from its lower plane by the astral -- the whole animate and (seemingly) inanimate Nature evolving on parallel lines, and drawing its attributes from above as well as from below.\n\n** The number seven does not imply only seven Entities, but seven groups or Hosts, as explained before.\n\nThe highest group, the Asuras born in Brahma's first body -- [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 219 THE HIERARCHIES OF SPIRITS.\n\nintellectual Being.\n\nFor the latter are the field wherein lies concealed in its privation the germ that will fall into generation.\n\nThat germ will become the spiritual potency in the physical cell that guides the development of the embryo, and which is the cause of the hereditary transmission of faculties and all the inherent qualities in man.\n\nThe Darwinian theory, however, of the transmission of acquired faculties, is neither taught nor accepted in Occultism.\n\nEvolution, in it, proceeds on quite other lines; the physical, according to esoteric teaching, evolving gradually from the spiritual, mental, and psychic.\n\nThis inner soul of the physical cell -- this \"spiritual plasm\" that dominates the germinal plasm -- is the key that must open one day the gates of the terra incognita of the Biologist, now called the dark mystery of Embryology.\n\n( See text and note infra.\n\n) ( f ) The Fifth group is a very mysterious one, as it is connected with the Microcosmic Pentagon, the five-pointed star representing man.\n\nIn India and Egypt these Dhyanis were connected with the Crocodile, and their abode is in Capricornus.\n\nThese are convertible terms in Indian astrology, as this (tenth) sign of the Zodiac is called Makara , loosely translated \"crocodile.\" The word itself is occultly interpreted in various ways, as will be shown further on.\n\nIn Egypt the defunct man -- whose symbol is the pentagram or the five-pointed star, the points of which represent the limbs of a man -- was shown emblematically transformed into a crocodile: Sebakh or Sevekh \"or seventh,\" as Mr.\n\nGerald Massey says, showing it as having been the type of intelligence, is a dragon in reality, not a crocodile.\n\nHe is the \"Dragon of Wisdom\" or Manas, the \"Human Soul,\" Mind, the Intelligent principle, called in our esoteric philosophy the \"Fifth\" principle.\n\nSays the defunct \"Osirified\" in ch.\n\nlxxxviii., \"Book of the Dead,\" or the Ritual , under the glyph of a mummiform god with a crocodile's head: -- (1) \"I am the god (crocodile) presiding at the fear .\n\n.\n\n.\n\nat the arrival of his Soul among men.\n\nI am the god-crocodile brought for destruction\" (an allusion to the destruction of divine spiritual purity [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] which turned into \"Night\" -- are septenary, i.e.\n\n, divided like the Pitris into seven classes, three of which are arupa (bodiless) and four with bodies.\n\n(See Vishnu Purana, Book I.) They are in fact more truly our Pitris (ancestors) than the Pitris who projected the first physical men.\n\n(See Book II.) [[Vol.\n\n1, Page]] 220 THE SECRET DOCTRINE.\n\nwhen man acquires the knowledge of good and evil; also to the \"fallen\" gods, or angels of every theogony).\n\n(2) \"I am the fish of the great Horus (as Mankara is the \"crocodile,\" the vehicle of Varuna)."


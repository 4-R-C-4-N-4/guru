[content]
body = "But spiritual Forces having been usually confused with the purely physical, the former are denied by, and therefore, have to remain unknown to Science, because left unexamined.* \"The history of the World begins with its general aim,\" says Hegel; \"the realization of the Idea of Spirit -- only in an implicit form ( an sich ), that is, as Nature; a hidden, most profoundly hidden unconscious instinct, and the whole process of History .\n\n.\n\n.\n\nis directed to rendering this unconscious impulse a conscious one.\n\nThus appearing in the form of merely natural existence, natural will -- that which has been called the subjective side -- physical craving, instinct, passion, private interest, as also opinion and subjective conception -- spontaneously present themselves at the very commencement.\n\nThis vast congeries of volitions , interests and activities constitute the instruments and means of the WORLD [[Footnote(s)]] ------------------------------------------------- * Men of science will say: We deny, because nothing of the kind has ever come within the scope of our experience.\n\nBut, as argued by Charles Richet, the physiologist: \"So be it, but have you at least demonstrated the contrary?\n\n.\n\n.\n\n.\n\nDo not, at any rate, deny a priori.\n\nActual Science is not sufficiently advanced to give you such right.\n\n\" (\"La suggestion mentale et le calcul des probabilites.\") [[Vol.\n\n1, Page]] 641 CYCLIC WHEELS WITHIN WHEELS.\n\nSPIRIT for attaining its object; bringing it to consciousness and realising it.\n\nAnd this aim is none other than finding itself -- coming to itself -- and contemplating itself in concrete actuality.\n\nBut that those manifestations of vitality on the part of individuals and peoples, in which they seek and satisfy their own purposes, are at the same time the means and instruments of a higher power , of a higher and broader purpose of which they know nothing -- which they realise unconsciously -- might be made a matter of question; rather has been questioned .\n\n.\n\n.\n\non this point I announced my view at the very outset, and asserted our hypothesis .\n\n.\n\n.\n\nand our belief that Reason governs the World and has consequently governed its history.\n\nIn relation to this independently universal and substantial existence -- all else is subordinate, subservient to it, and the means for its development.\"* No metaphysician or theosophist could demur to these truths, which are all embodied in esoteric teachings.\n\nThere is a predestination in the geological life of our globe, as in the history, past and future, of races and nations.\n\nThis is closely connected with what we call Karma and Western Pantheists, \"Nemesis\" and \"Cycles.\" The law of evolution is now carrying us along the ascending arc of our cycle, when the effects will be once more re - merged into , and re-become the (now neutralized) causes, and all things affected by the former will have regained their original harmony.\n\nThis will be the cycle of our special \"Round,\" a moment in the duration of the great cycle, or the Mahayuga.\n\nThe fine philosophical remarks of Hegel are found to have their application in the teachings of Occult Science, which shows nature ever acting with a given purpose, whose results are always dual.\n\nThis was stated in our first Occult volumes, in Isis Unveiled , p.\n\n268, Vol.\n\nII., in the following words: -- As our planet revolves once every year around the sun, and at the same time turns once in every twenty-four hours upon its own axis, thus traversing minor circles within a larger one, so is the work of the smaller cyclic periods accomplished and recommenced, within the Great Saros.\n\nThe revolution of the physical world, according to the ancient doctrine, is attended by a like revolution in the world of intellect -- the spiritual evolution of the world proceeding in cycles, like the physical one.\n\nThus we see in history a regular alternation of ebb and flow in the tide of human progress.\n\nThe great kingdoms and empires of the world, after reaching the culmination of their greatness, descend again, in accordance with the same law by which they ascended; till, having reached the lowest point, humanity reasserts itself and mounts up once more, the height of its attainment being, by this law of ascending progression by cycles, somewhat higher than the point from which it had before descended.\n\nBut these cycles -- wheels within wheels, so comprehensively and ingeniously symbolized by the various Manus and Rishis in India, and by the Kabiri in the West** -- do not affect all mankind at one and the same [[Footnote(s)]] ------------------------------------------------- * \"On World History\" in \"Philosophy of History,\" p.\n\n26.\n\n(Sibree's Eng.\n\nTransl.).\n\n** This symbolism does not prevent these now seemingly mythic personages from [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 642 THE SECRET DOCTRINE.\n\ntime -- as explained in the Racial division of Cycles ( See sub - section 6.) Hence, as we see, the difficulty of comprehending, and discriminating between them, with regard to their physical and spiritual effects, without having thoroughly mastered their relations with, and action upon the respective positions of nations and races, in their destiny and evolution.\n\nThis system cannot be comprehended if the spiritual action of these periods -- pre - ordained , so to say, by Karmic law --is separated from their physical course.\n\nThe calculations of the best astrologers would fail, or at any rate remain imperfect, unless this dual action is thoroughly taken into consideration and dealt with upon these lines.\n\nAnd this mastery can be achieved only through INITIATION.\n\nThe Grand Cycle includes the progress of mankind from the appearance of primordial man of ethereal form.\n\nIt runs through the inner cycles of his (man's) progressive evolution from the ethereal down to the semi-ethereal and purely physical: down to the redemption of man from his coat of skin and matter, after which it continues running its course downward and then upward again, to meet at the culmination of a Round, when the manvantaric \"Serpent swallows its tail\" and seven minor cycles are passed.\n\nThese are the great Racial Cycles which affect equally all the nations and tribes included in that special Race; but there are minor and national as well as tribal cycles within those, which run independently of each other.\n\nThey are called in the Eastern esotericism the Karmic cycles.\n\nIn the West, since Pagan Wisdom has been repudiated as having grown from and been developed by the dark powers supposed to be at constant war and in opposition to the little tribal Jehovah -- the full and awful significance of the Greek N EMESIS (or Karma) has been entirely forgotten.\n\nOtherwise Christians would have better realized the profound truth that Nemesis is without attributes; that while the dreaded goddess is absolute and immutable as a Principle, it is we ourselves -- nations and individuals -- who propel her to action and give the impulse to its direction.\n\nK ARMA- N EMESIS is the creator of nations and mortals, but once created, it is they who make of her either a fury or a rewarding Angel."


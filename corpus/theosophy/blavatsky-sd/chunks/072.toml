body = "She is before a dead wall, on the face of which she traces, as she imagines, great physiological and psychic discoveries, but every one of which will be shown later on to be no better than the cobwebs spun by her scientific fancies and illusions.\n\nThe tissues of our objective framework alone are subservient to the analysis and researches of physiological science.* The six higher principles in them will evade for ever the hand that is guided by an animus that purposely ignores and rejects the Occult Sciences.\n\nThe \"Great Day of B E-WITH-US,\" then, is an expression the only merit of which lies in its literal translation.\n\nIts significance is not so easily revealed to a public, unacquainted with the mystic tenets of Occultism, or rather of Esoteric Wisdom or \"Budhism.\" It is an expression peculiar to the latter, and as hazy for the profane as that of the Egyptians who called the same the \"Day of C OME-TO-US,\"** which [[Footnote(s)]] ------------------------------------------------- * E.g.\n\n, all that modern physiological research in connection with psychological problems has, and owing to the nature of things, could have shown, is, that every thought, sensation, and emotion is attended with a re-marshalling of the molecules of certain nerves.\n\nThe inference drawn by scientists of the type of Buchner, Vogt, and others, that thought is molecular motion, necessitates a complete abstraction being made of the fact of our subjective consciousness.\n\n** See \"Le Livre des Morts,\" by Paul Pierret; \"Le Jour de 'Viens a nous' .\n\n.\n\n.\n\nc'est le jour ou Osiris a dit au Soleil: Viens!\n\nJe le vois rencontrant le Soleil dans l'Amenti.\" (Chap.\n\nxvii., p.\n\n61.) The Sun here stands for the Logos (or Christos, or Horus) as central Essence synthetically, and as a diffused essence of radiated Entities, different in substance, but not in essence.\n\nAs expressed by the Bhagavadgita lecturer, \"it must not be supposed that the Logos is but a single centre of energy manifested from Parabrahmam; there are innumerable other centres .\n\n.\n\n.\n\nand their number is almost infinite in the bosom of Parabrahmam.\" Hence the expressions, \"The Day of Come to us\" and \"The Day of Be with us,\" etc.\n\nJust as the square is the Symbol of the Four sacred Forces or Powers -- Tetraktis -- so the Circle shows the boundary within the Infinity that no man can cross, even in spirit, nor Deva nor Dhyan Chohan.\n\nThe Spirits of those who \"descend and ascend\" during the course of cyclic evolution shall cross the \"iron-bound world\" only on the day of their approach to the threshold of Paranirvana.\n\nIf they reach it -- they will rest in the bosom of Parabrahmam, or the \"Unknown Darkness,\" which shall then become for all of them Light -- during the whole period of Mahapralaya, the \"Great N IGHT,\" namely, 311,040,000,000,000 years of absorption in Brahm.\n\nThe day of \"Be-With-Us\" is this period of rest or Paranirvana.\n\nSee also for other data on this peculiar expression, the day of \"Come-To-Us,\" The Funerary Ritual of the Egyptians , by Viscount de Rouge.\n\nIt corresponds to the Day of the Last Judgment of the Christians, which has been sorely materialised by their religion.\n\n[[Vol.\n\n1, Page]] 135 THE SOUL'S PILGRIMAGE.\n\nis identical with the former, though the verb \"be\" in this sense, might be still better replaced with either of the two words \"Remain\" or \"Rest-with-us,\" as it refers to that long period of R EST which is called Paranirvana.\n\nAs in the exoteric interpretation of the Egyptian rites the soul of every defunct person -- from the Hierophant down to the sacred bull Apis -- became an Osiris, was Osirified, though the Secret Doctrine had always taught, that the real Osirification was the lot of every Monad only after 3,000 cycles of Existences; so in the present case.\n\nThe \"Monad,\" born of the nature and the very Essence of the \"Seven\" (its highest principle becoming immediately enshrined in the Seventh Cosmic Element), has to perform its septenary gyration throughout the Cycle of Being and forms, from the highest to the lowest; and then again from man to God.\n\nAt the threshold of Paranirvana it reassumes its primeval Essence and becomes the Absolute once more.\n\n---------------------"


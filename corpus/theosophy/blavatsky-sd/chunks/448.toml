body = "This idea and representative notion is that of the all-powerful champion -- child-like in his 'Virgin innocence' -- so powerful that this god-filled innocence (the Seraphim 'Know most,' the Cherubim 'love most') can shatter the world (articulated, so to use the word -- in the magic of Lucifer, but condemned) in opposition to the artful constructions (this 'side-life') of the magnificent apostate, the mighty rebel, but yet at the same time the 'Light-bringer,' the Lucifer, the 'Morning Star,' the 'Son of the morning' -- the very highest title 'out of heaven, 'for in heaven it cannot be, but out of heaven it is everything.\n\nIn an apparently incredible side of his character -- qualities are of no sex -- this archangel, St.\n\nMichael, is the invincible, sexless, celestial 'Energy' -- to dignify him by his grand characteristics -- the invisible 'Virgin Combatant,' clothed .\n\n.\n\n.\n\nand at the same time armed, in the denying mail of the Gnostic 'refusal to create.' This is another .\n\n.\n\n.\n\n'myth within myths' .\n\n.\n\n.\n\na stupendous 'mystery of mysteries,' because it is so impossible and contradictory.\n\nUnexplainable as the Apocalypse.\n\nUnrevealable as the 'Revelation' \"( p .\n\n213).\n\nNevertheless, this unexplainable and unrevealable mystery will now be explained and revealed by the doctrines of the East.\n\nBut as the very erudite, but still more puzzling author of \"Phallicism\" gives it, of course, no uninitiated mortal would ever understand the real drift of his remarks.\n\n[[Vol.\n\n2, Page]] 239 THEOLOGICAL SNUFFERS.\n\na theological extinguisher on the radiant star-god, Lucifer, the \"Son of the Morning,\" thus created the most gigantic of all her paradoxes -- a black and tenebrous light -- the myth has struck its roots too deep in the soil of blind faith to permit, in our age, even those, who do not acquiesce in her dogmas and laugh at her horned and cloven-footed Satan, to come out bravely and confess the antiquity of the oldest of all traditions.\n\nIn a few brief words it is this.\n\nSemi-exoterically, the \"First-born\" of the Almighty -- Fiat Lux, -- or the angels of primordial light, were commanded to create ; one third of them rebelled and refused ; while those who \"obeyed as Fetahil did -- failed \" most signally.\n\nTo realise the refusal and failure in their correct physical meaning, one must study and understand Eastern philosophy; one has to be acquainted with the fundamental mystical tenets of the Vedantins, with regard to the utter fallacy of attributing functional activity to the infinite and absolute deity.\n\nEsoteric philosophy maintains that during the Sandhyas, the \"Central Sun\" emits creative light - - passively so to say.\n\nCausality is latent.\n\nIt is only during the active periods of being that it gives rise to a stream of ceaseless energy, whose vibrating currents acquire more activity and potency with every rung of the hebdomadic ladder of Being which they descend.\n\nHence it becomes comprehensible how the process of creating, or rather of fashioning, the organic Universe, with all its units of the seven kingdoms, necessitated intelligent beings -- who became collectively a Being or creative God -- differentiated already from the one absolute Unity, unrelated as the latter is to conditioned creation.* Now the Vatican MSS.\n\nof the Kabala -- a single copy of which (in Europe) is said to have been in the possession of Count St.\n\nGermain -- contains the most complete exposition of the doctrine, including the peculiar version accepted by the Luciferians** and other Gnostics; and in that parchment the Seven Suns of Life are given in the order they are found in the Saptasurya.\n\nOnly four of these, however, are mentioned in the editions of the Kabala which are procurable in the public libraries, and that even in a more or less veiled phraseology.\n\nNevertheless even this reduced number is amply sufficient to show an identical origin, as it refers to the quaternary group of the Dhyan-Chohans, and proves the speculation to have had its origin in the Secret Doctrines of the Aryans.\n\n[[Footnote(s)]] ------------------------------------------------- * \"Creation\" -- out of pre-existent eternal substance, or matter, of course, which substance, according to our teachings, is boundless, ever-existing space.\n\n** The Luciferians -- the sect of the fourth century who are alleged to have taught that the Soul was a carnal body transmitted to the child by its father; -- and that other religious and still earlier sect of the second century A.D ., the Lucianists, who taught all this, and further, that the animal Soul was not immortal, were philosophizing on the grounds of the real Kabalistic and Occult teachings.\n\n[[Vol.\n\n2, Page]] 240 THE SECRET DOCTRINE.\n\nAs is well known, the Kabala never originated with the Jews, who got their ideas from the Chaldeans and the Egyptians.\n\nThus even the now exoteric Kabalistic teachings speak of a Central Sun, and of three secondary suns in each solar system -- our own included.\n\nAs shown in that able though too materialistic work, \" New Aspects of Life and Religion, \" which is a synopsis of the views of the Kabalists in an aspect deeply thought out and assimilated: -- \"The Central Sun .\n\n.\n\n.\n\nwas to them (as much as to the Aryans) the centre of Rest ; the centre to which all motion was to be ultimately referred.\n\nRound this central sun .\n\n.\n\n.\n\n'the first of three systemic suns .\n\n.\n\n.\n\nrevolved on a polar plane .\n\n.\n\n.\n\nthe second, on an equatorial plane' .\n\n.\n\n.\n\nand the third only was our visible sun.\n\nThese four solar bodies were ' the organs on whose action what man calls the creation, the evolution of life on the planet, earth, depends.\n\n' The channels through which the influence of these bodies was conveyed to the earth they (the Kabalists) held to be electrical\" ( p .\n\n287).\n\n.\n\n.\n\n.\n\n\"The radiant energy flowing from the central sun* called the Earth into being as a watery globe,\" whose tendency, \"as the nucleus of a planetary body, was to rush to the (central) Sun .\n\n.\n\n.\n\n.\n\nwithin the sphere of whose attraction it had been created,\" \"but the radiant energy, similarly electrifying both, withheld the one from the other, and so changed motion towards into motion round the centre of attraction, which the revolving planet (earth) thus sought to reach.\n\n\"In the organic cell the visible sun found its own proper matrix, and produced through this the animal (while maturing the vegetable) Kingdom, finally placing man at its head, in whom, through the animating action of that Kingdom, it originated the psychic cell.\n\nBut the man so placed at the head of the animal kingdom, at the head of the creation, was the animal, the soul-less, the perishable man .\n\n.\n\n.\n\n."


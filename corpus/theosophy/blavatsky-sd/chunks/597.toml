[content]
body = "Now the figures on the upper triangle represent the Four Races, leaving out the first -- the Chhayas or Shadows -- and the \"Son of Man,\" Enos or Enoch, is in the centre, because he stands between the two (the Fourth and the Fifth) Races, as he represents the Secret Wisdom of both.\n\nThese are the four animals of Ezekiel and of the Revelation.\n\nThe same double triangle which in Isis, Vol.\n\nII , (p.\n\n453), faces the Hindu Adanari, is by far the best.\n\nFor there, only the three (for us) historical races are symbolized: the third, the androgynous, by Ada-nari; the fourth, symbolized by the strong, powerful lion; and the fifth -- the Aryan -- by that which is its most sacred symbol to this day, the bull (and the cow).\n\nA man of great erudition -- a French savant -- M.\n\nde Sacy, finds several most singular statements in the Book of Enoch, \"worthy of the most serious examination,\" he says.\n\nFor instance, \"the author (Enoch) makes the solar year consist of 364 days, and seems to know periods of three, of five, and of eight years, followed by four supplementary days, which, in his system, appear to be those of the equinoxes and solstices.\"* .\n\n.\n\n.\n\n.\n\nTo which he adds, later on, \"I see but one means to palliate them (these 'absurdities'), it is to suppose that the author expounds some fanciful system which may have existed BEFORE THE ORDER OF N ATURE HAD BEEN ALTERED AT THE PERIOD OF THE U NIVERSAL D ELUGE.\" Precisely so; and the Secret Doctrine teaches that that \"order of nature\" has been thus altered, and the series of the Earth's humanities too.\n\nFor, as the angel Uriel tells Enoch: \"Behold, I have showed thee all things, O Enoch; and all things have I revealed to thee.\n\nThou seest the Sun, the Moon, and those which conduct the stars in Heaven, which cause all their operations, seasons, and arrivals to return.\n\nIn the days of sinners THE YEARS SHALL BE SHORTENED .\n\n.\n\n.\n\n.\n\nthe moon shall change its laws, etc.\" (chap.\n\nlxxix).\n\nIn those days also, years before the great Deluge that carried away the Atlanteans and changed the face of the whole earth -- because \"the earth (on its axis) became inclined\" -- [[Footnote(s)]] ------------------------------------------------- * See Danielo's criticisms upon De Sacy, in the Annales de Philosophic, p.\n\n393.\n\n[[Vol.\n\n2, Page]] 534 THE SECRET DOCTRINE.\n\nnature, geologically, astronomically, and cosmically in general, could not have been the same, just because the Earth had inclined.\n\nSee chap.\n\n1xiv.\n\n(Sect.\n\nxi.) .\n\n.\n\n.\n\n.\n\n\"And Noah cried with a bitter voice 'Hear me, hear me, hear me'; three times.\n\nAnd he said 'The earth labours and is violently inclined; surely, I shall perish with it.' \" This, by the way, looks like one of those many \"inconsistencies,\" if the Bible is read literally.\n\nFor, to say the least, this is a very strange fear in one who had \"found grace in the eyes of the Lord\" and been told to build an ark!\n\nBut here we find the venerable Patriarch expressing as much fear as if, instead of a \"friend\" of God, he had been one of the Giants doomed by the wrathful deity.\n\nThe earth has already inclined, and the deluge of waters has become simply a question of time, and yet Noah seems to know nothing of his intended salvation.\n\nA decree had come indeed; the decree of nature and the Law of Evolution, that the earth should change its race, and that the Fourth Race should be destroyed to make room for a better one.\n\nThe Manvantara had reached its turning point of three and a half Rounds, and gigantic physical Humanity had reached the acme of gross materiality.\n\nHence the apocalyptic verse that speaks of a commandment gone forth that they may be destroyed, \"that their end may be\" (of the race); for they knew truly \"every secret of the angels, every oppressive and secret power of the Satans, and every power of those who commit sorcery, as well as of those who make molten images in the whole earth.\" And now a natural question.\n\nWho could have informed the apocryphal author of this powerful vision (to whatever age he may be assigned before the day of Galileo) that the Earth could occasionally incline her axis?\n\nWhence has he derived such astronomical and geological knowledge if the Secret Wisdom, of which the ancient Rishis and Pythagoras had drunk, is but a fancy, an invention of the later ages?\n\nHas Enoch read prophetically perchance in Frederick Klee's work on the Deluge (p.\n\n79) these lines: \"The position of the terrestrial globe with reference to the Sun has evidently been, in primitive times, different from what it is now; and this difference must have been caused by a displacement of the axis of rotation of the Earth.\"?\n\nThis reminds one of that other unscientific statement made by the Egyptian priests to Herodotus, namely, that the Sun has not always risen where it arises now, and that in former times the ecliptic had cut the equator at right angles.* There are many such \"dark sayings\" throughout Puranas, Bible and Mythology; and to the occultist they divulge two facts: ( a ) that the ancients knew as well, and better, perhaps, than the moderns [[Footnote(s)]] ------------------------------------------------- * Astronomie Ancienne, Bailly, Vol.\n\nI., p.\n\n203, and Vol.\n\nII ., p.\n\n216.\n\n[[Vol.\n\n2, Page]] 535 ST.\n\nAUGUSTINE AND ENOCH.\n\ndo, astronomy, geognosy and cosmography in general; and ( b ) that the globe and its behaviour have altered more than once since the primitive state of things.\n\nThus, on the blind faith of his \"ignorant\" religion, which taught that Phaeton, in his desire to learn the hidden truth, made the Sun deviate from its usual course -- Xenophantes asserts somewhere that, \"the Sun turned toward another country\"; which is a parallel, however slightly more scientific, if as bold, of Joshua stopping the course of the Sun altogether.\n\nYet it may explain the teaching of the Northern mythology (in Jeruskoven) that, before the actual order of things, the Sun arose in the South, and its placing the Frigid Zone in the East, whereas now it is in the North."


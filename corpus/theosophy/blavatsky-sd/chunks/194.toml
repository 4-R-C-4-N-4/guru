body = "The eye which Odin had to pledge to acquire that knowledge may be \"the Sun, which enlightens and penetrates all things; his other eye being the moon, whose reflection gazes out of the deep, and which at last, when setting, sinks into the Ocean.\" ( Ibid.\n\n) But it is something more, besides this.\n\nLoki, the fire-god, is said to have hidden in the water, as well as in the moon, the light-giver, whose reflection he found therein; and this belief that the fire finds refuge in the water was not limited to the old Scandinavians.\n\nIt was shared by all nations and was finally taken up by the early Christians, who symbolized the Holy Ghost under the shape of Fire, \"cloven tongues like as fire\" -- the breath of the Father- S UN.\n\nThis \"Fire\" descends also into the Water or the Sea: Mar , Mary.\n\nThe dove was the symbol of the Soul with several nations, it was sacred to Venus, the goddess born from the [[Footnote(s)]] ------------------------------------------------- * Quoted in Mr.\n\nG.\n\nMassey's Lecture.\n\n[[Vol.\n\n1, Page]] 403 IDENTITY OF TYPOLOGY.\n\nsea-foam, and it became later the symbol of the Christian Anima Mundi , or the Holy Spirit.\n\nOne of the most occult chapters in the \"Book of the Dead\" is ch.\n\nlxxx., entitled: \"To make the transformation into the god giving light to the path of Darkness,\" wherein \"Woman-light of the Shadow\" serves Thot in his retreat in the moon.\n\nThot-Hermes is said to hide therein, because he is the representative of the Secret Wisdom.\n\nHe is the manifested logos of its light side, the concealed deity or \"Dark Wisdom\" when he is supposed to retire to the opposite hemisphere.\n\nSpeaking of her power, the moon calls herself repeatedly: \"The Light which shineth in Darkness,\" the \"Woman-Light.\" Hence it became the accepted symbol of all the Virgin-Mother goddesses.\n\nAs the wicked \"evil\" spirits warred against the moon in days of yore, so they are supposed to war now, without being able to prevail, however, against the actual Queen of Heaven, Mary, the moon.\n\nHence also the moon was intimately connected in all the Pagan theogonies with the Dragon, her eternal enemy; the Virgin, or Madonna, standing on the mythical Satan under that form, crushed and made powerless, under her feet.\n\nThis, because the head and tail of the Dragon, which represent in Eastern astronomy to this day the ascending and descending nodes of the moon, were also symbolized in ancient Greece by the two serpents.\n\nHercules kills them on the day of his birth, and so does the babe in his virgin mother's arms.\n\nAs Mr.\n\nGerald Massey aptly observes in this connection: \"All such symbols figured their own facts from the first, and did not pre-figure others of a totally different order.\n\nThe Iconography (and dogmas, too) had survived in Rome from a period remotely pre-Christian.\n\nThere was neither forgery nor interpolation of types; nothing but a continuity of imagery with a perversion of its meaning.\n\n\" -------------- [[This page continued in next section]]"


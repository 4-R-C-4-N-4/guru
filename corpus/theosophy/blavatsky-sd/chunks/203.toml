[content]
body = "We bow to thee, in the nature of Brahma uncreated, undecaying ( avyaya ), who art in our bodies and in all other bodies , and in all living creatures , and beside whom nothing exists.\n\nWe glorify that Vasudeva, the lord of all, who is without soil, the seed of all things, exempt from dissolution, unborn, eternal; being in essence Paramapadatmavat (beyond the condition of spirit) and in essence and substance ( rupa ), the whole of this (Universe).\" (Book III., ch.\n\nxvii., Vish.\n\nPurana.\n\n) The above is quoted as an illustration of the vast field offered by the Puranas to adverse and erroneous criticism, by every European bigot who forms an estimate of an alien religion on mere external evidence.\n\nAny man accustomed to subject what he reads to thoughtful analysis, will see at a glance the incongruity of addressing the accepted \"Unknowable,\" the formless, and attributeless A BSOLUTE, such as the Vedantins define B RAHMA, as being \"one with the serpent-race, double-tongued, cruel and insatiable,\" thus associating the abstract with the concrete, and bestowing adjectives on that which is freed from any limitations, and conditionless.\n\nEven Dr.\n\nWilson, who, after living surrounded by Brahmins and Pundits in India for so many years, ought to have known better -- even that scholar lost no opportunity to criticize the Hindu Scriptures on this account.\n\nThus, he exclaims: --* \"The Puranas constantly teach incompatible doctrines!\n\nAccording to this passage, the Supreme being is not the inert cause of creation only, but exercises the functions of an active providence.\n\nThe Commentator quotes a text of the Veda in support of this view: 'Universal Soul entering into men, governs their conduct.' Incongruities, however, are as frequent in the Vedas as in the Puranas.\n\n.\n\n.\n\n.\n\n.\" Less frequent, in sober truth, than in the Mosaic Bible.\n\nBut prejudice is great in the hearts of our Orientalists -- especially in those of \"reverend\" scholars.\n\nU NIVERSAL S OUL is not the inert Cause of Creation or (Para) Brahma, but simply that which we call the sixth principle of intellectual Kosmos, on the manifested plane of being.\n\nIt is Mahat, or Mahabuddhi , the great Soul, the vehicle of Spirit, the first primeval reflection of the formless C AUSE, and that which is even beyond S PIRIT.\n\n[[Footnote(s)]] ------------------------------------------------- * In Book I., chap.\n\nxvii., narrating the story of Prahlada -- the Son of Hiranyakasipu, the Puranic Satan , the great enemy of Vishnu, and the King of the three worlds -- into whose heart Vishnu entered.\n\n[[Vol.\n\n1, Page]] 421 THE DECEPTION OF THE GODS.\n\nSo much for Professor Wilson's uncalled-for fling.\n\nAs for the apparently incongruous appeal to Vishnu by the defeated gods, the explanation is there, in the text of Vishnu Purana, if Orientalists would only notice it.* There is Vishnu, as Brahma, and Vishnu in his two aspects , philosophy teaches.\n\nThere is but one Brahma, \"essentially prakriti and Spirit ,\" &c.\n\nTherefore, it is not Vishnu -- \"the inert cause of creation\" -- which exercised the functions of an active Providence, but the Universal Soul, that which E.\n\nLevi calls Astral Light in its material aspect.\n\nAnd this \"Soul\" is, in its dual aspect of spirit and matter, the true anthropomorphic God of the Theists; as this God is a personification of that Universal Creative Agent, pure and impure both, owing to its manifested condition and differentiation in this Mayavic World -- God and Devil -- truly.\n\nBut Dr.\n\nWilson failed to see how Vishnu, in this character, closely resembles the Lord God of Israel, \"especially in his policy of deception, temptation, and cunning.\" In the Vishnu Purana this is made as plain as can be.\n\nFor it is said there, that \"at the conclusion of their prayers ( stotra ) the gods beheld the Sovereign Deity Hari (Vishnu) armed with the conch, the discus, and the mace, riding on Garuda.\n\n.\" Now \"Garuda\" is the manvantaric cycle , as will be shown in its place.\n\nVishnu, therefore, is the deity in space and time ; the peculiar God of the Vaishnavas (a tribal or racial God , as they are called in esoteric philosophy): i.e.\n\n, one of the many Dhyanis or Gods, or Elohim, one of whom was generally chosen for some special reasons by a nation or a tribe, and thus became gradually a \"God above all Gods\" (2 Chronicles ii.\n\n5,) the \"highest God\" as Jehovah, Osiris, Bel, or any other of the Seven Regents.\n\n\"The tree is known by its fruit,\" -- the nature of a God by his actions.\n\nThe latter, we have either to judge by the dead-letter narratives, or to accept allegorically.\n\nIf we compare the two -- Vishnu, as the defender and champion of the defeated gods; and Jehovah, the defender and champion of the \"chosen\" people, so called by antiphrasis, no doubt, as it is the Jews who had chosen that \"jealous\" God -- we shall find that both use deceit and cunning.\n\nThey do so on the principle of \"the end justifying the means,\" in order to have the best of their [[Footnote(s)]] ------------------------------------------------- * This ignorance is truly and beautifully expressed in the praise of the Yogins to Brahma, \"the upholder of the earth\" (in Book I., chap.\n\niv.\n\nof V.\n\nP.), when they say, \"Those who have not practised devotion conceive erroneously of the nature of the world.\n\nThe ignorant who do not perceive that this Universe is of the nature of wisdom, and judge of it as an object of perception only, are lost in the ocean of spiritual ignorance.\n\nBut they who know true wisdom, and whose minds are pure, behold this whole world as one with divine knowledge , as one with thee, O God!\n\nBe favourable, O universal Spirit!\" [[Vol.\n\n1, Page]] 422 THE SECRET DOCTRINE.\n\nrespective opponents and foes -- the demons.\n\nThus while (according to the Kabalists) Jehovah assumes the shape of the tempting Serpent in the Garden of Eden; sends Satan with a special mission to tempt Job; and harasses and wearies Pharaoh with Sarai, Abraham's wife, and \" hardens \" his heart against Moses, lest there should be no opportunity for plaguing his victims \"with great plagues\" ( Genesis xii., Exodus ) -- Vishnu is made in his Purana to resort to a trick no less unworthy of any respectable god.\n\n\"Have compassion upon us, O Lord, and protect us, who have come to thee for succour from the Daityas (demons)!\" pray the defeated Gods."


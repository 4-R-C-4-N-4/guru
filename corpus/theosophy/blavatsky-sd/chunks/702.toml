[content]
body = "They are found in the Mediterranean basin; in Denmark (among the local tumuli from twenty-seven to thirty-five feet in height); in Shetland, and in Sweden, where they are called ganggriften (or tombs with corridors); in Germany, where they are known as the giant tombs (Hunengraben); in Spain (see the dolmen of Antiguera near Malaga), and Africa; in Palestine and Algeria; in Sardinia (see the Nuraghi and Sepolture dei giganti, or tombs of giants); in Malabar, in India, where they are called the tombs of the Daityas (giants) and of the Rakshasas, the men-demons of Lanka ; in Russia and Siberia, where they are known as the Koorgan ; in Peru and Bolivia, where they are termed the chulpas or burial places, etc., etc., etc.\n\nThere is no country from which they are absent.\n\nWho built them?\n\nWhy are they all connected with Serpents and Dragons, with Alligators and Crocodiles?\n\nBecause remains of \"palaeolithic man\" were, it is thought, found in some of them, and because in the funeral mounds of America bodies of later races were discovered with the usual paraphernalia of bone necklaces, weapons, stone and copper urns, etc., hence they are declared ancient tombs.\n\nBut surely the two famous mounds -- one in the Mississippi valley and the other in Ohio -- known respectively as \"the Alligator Mound\" and \"the Great Serpent [[Footnote(s)]] ------------------------------------------------- * The scientific \"jury\" disagreed, as usual; while de Quatrefages, de Mortillet, Worsaae, Engelhardt, Waldemar, Schmidt, Capellini, Hamy, and Cartailhac, saw upon the flints the traces of human handiwork, Steenstrup, Virchow and Desor refused to do so.\n\nStill the majority, if we except some English Scientists, are for Bourgeois.\n\n[[Vol.\n\n2, Page]] 753 STILL MORE ASTOUNDING CONTRADICTIONS.\n\nMound,\" were never meant for tombs* ( Vide infra ) .\n\nYet one is told authoritatively that the Mounds, and the Mound or Dolmen Builders, are all \"Pelasgic\" in Europe, antecedent to the Incas, in America, yet of \"not extremely distant times.\" They are built by \" no race of Dolmen Builders,\" which never existed (opinion of De Mortillet, Bastian, and Westropp) save in the earlier archeological fancy.\n\nFinally Virchow's opinion of the giant tombs of Germany is now accepted as an axiom: -- \"The tombs alone are gigantic, and not the bones they contain\" -- says that German biologist; and archaeology has but to bow and submit to the decision.** That no gigantic skeletons have been hitherto found in the \"tombs\" is yet no reason to say there never were the remains of giants in them.\n\nCremation was universal till a comparatively recent period -- some 80, or 100,000 years ago.\n\nThe real giants, moreover, were nearly all drowned with Atlantis.\n\nNevertheless, the classics, as shown elsewhere, often speak of giant skeletons still excavated in their day.\n\nBesides this, human fossils may be counted on the fingers, as yet.\n\nNo skeleton ever yet found is older than between 50, or 60,000 years,*** and man's size was reduced from 15 to 10 or 12 feet, ever since the third sub-race of the Aryan stock, which sub-race -- born and developed in Europe and Asia Minor under new climates and conditions -- had become European.\n\nSince then, as said, it has steadily been decreasing.\n\nIt is truer therefore to say, that the tombs alone are archaic, and not necessarily the bodies of men occasionally found in them; and that those tombs, since they are gigantic, must have contained giants,**** or rather the ashes of generations of giants.\n\n[[Footnote(s)]] ------------------------------------------------- * We take the following description from a scientific work.\n\n\"The first of these animals (the alligator) designed with considerable skill, is no less than 250 ft.\n\nlong.\n\n.\n\n.\n\n.\n\n.\n\nThe interior is formed of a heap of stones, over which the form has been moulded in fine stiff clay.\n\nThe great serpent is represented with open mouth, in the act of swallowing an egg of which the diameter is 100 ft.\n\nin the thickest part; the body of the animal is wound in graceful curves and the tail is rolled into a spiral.\n\nThe entire length of the animal is 1,100 ft.\n\nThis work is unique .\n\n.\n\n.\n\n.\n\nand there is nothing on the old continent which offers any analogy to it.\" Except its symbolism, however, of the Serpent -- the cycle of Time -- swallowing Kosmos, the egg.\n\n** It might be better, perhaps, for FACT had we more Specialists in Science and fewer \"authorities\" on universal questions.\n\nOne never heard that Humboldt gave authoritative and final decisions in the matter of polypi, or the nature of an excrescence.\n\n*** 57,000 years is the date assigned by Dr.\n\nDowler to the remains of the human skeleton, found buried beneath four ancient forests at New Orleans on the banks of the Mississippi river.\n\n**** Murray says of the Mediterranean barbarians that they marvelled at the prowess of the Atlanteans.\n\n\"Their physical strength was extraordinary (witness indeed their cyclopean buildings), the earth shaking sometimes under their tread.\n\nWhatever they did, was done speedily.\n\n.\n\n.\n\n.\n\n.\n\n.\n\nThey were wise and communicated their wisdom to men\" ( Mythology p.\n\n4).\n\n[[Vol.\n\n2, Page]] 754 THE SECRET DOCTRINE Nor were all such cyclopean structures intended for sepulchres.\n\nIt is with the so-called Druidical remains, such as Carnac in Brittany and Stonehenge in Great Britain, that the travelling Initiates above alluded to had to do.\n\nAnd these gigantic monuments are all symbolic records of the World's history.\n\nThey are not Druidical, but universal.\n\nNor did the Druids build them, for they were only the heirs to the cyclopean lore left to them by generations of mighty builders and -- \"magicians,\" both good and bad.\n\nIt will always be a subject of regret that history, rejecting a priori the actual existence of giants, has preserved us so little of the records of antiquity concerning them.\n\nYet in nearly every mythology -- which after all is ancient history -- the giants play an important part.\n\nIn the old Norse mythology, the giants, Skrymir and his brethren, against whom the sons of the gods fought, were potent factors in the histories of deities and men.\n\nThe modern exegesis, that makes these giants to be the brethren of the dwarfs, and reduces the combats of the gods to the history of the development of the Aryan race, will only receive credence amongst the believers in the Aryan theory, as expounded by Max Muller."


[content]
body = "From Meru, the abode of gods, to Eden, the distance is very small, and from the Hindu Serpents to the Ophite Cherubim, the third out of the seven of which was the Dragon, the separation is still smaller, for both watched the entrance to the realm of Secret Knowledge.\n\nBut Ezekiel plainly describes the four Cosmic Angels: \"I looked, and behold, a whirlwind, a cloud and fire infolding it .\n\n.\n\n.\n\nalso out of the midst thereof came the likeness of four living creatures .\n\n.\n\n.\n\nthey had the likeness of a man.\n\nAnd every one had four faces and four wings .\n\n.\n\n.\n\nthe face of a man, and the face of a lion, the face of an ox, and the face of an eagle .\n\n.\n\n.\n\n\" (\"Man\" was here substituted for \"Dragon.\" Compare the \" Ophite Spirits.\n\n\" * ) .\n\n.\n\n.\n\n\"Now as I beheld the living creatures behold one wheel upon the Earth with his four faces .\n\n.\n\n.\n\nas it were a wheel in the middle of a wheel .\n\n.\n\n.\n\nfor the support of the living creature was in the wheel .\n\n.\n\n.\n\ntheir appearance was like coals of fire .\n\n.\n\n.\" etc.\n\n(Ezekiel, ch.\n\ni.) There are three chief groups of Builders and as many of the Planetary Spirits and the Lipika, each group being again divided into Seven sub-groups.\n\nIt is impossible, even in such a large work as this, to enter into a minute examination of even the three principal groups, as it would demand an extra volume.\n\nThe \"Builders\" are the representatives of the first \"Mind-Born\" Entities, therefore of the primeval Rishi-Prajapati: also of the Seven great Gods of Egypt, of which Osiris is the chief: of the Seven Amshaspends of the Zoroastrians, with [[Footnote(s)]] ------------------------------------------------- * The Angels recognised by the Roman Catholic Church who correspond to these \"Faces\" were with the Ophites: -- Dragon -- Raphael; Lion -- Michael; Bull, or ox -- Uriel; and Eagle -- Gabriel.\n\nThe four keep company with the four Evangelists, and preface the Gospels.\n\n[[Vol.\n\n1, Page]] 128 THE SECRET DOCTRINE.\n\nOrmazd at their head: or the \"Seven Spirits of the Face\": the Seven Sephiroth separated from the first Triad, etc., etc.* They build or rather rebuild every \"System\" after the \"Night.\" The Second group of the Builders is the Architect of our planetary chain exclusively; and the third, the progenitor of our Humanity -- the Macrocosmic prototype of the microcosm.\n\nThe Planetary Spirits are the informing spirits of the Stars in general, and of the Planets especially.\n\nThey rule the destinies of men who are all born under one or other of their constellations; the second and third groups pertaining to other systems have the same functions, and all rule various departments in Nature.\n\nIn the Hindu exoteric Pantheon they are the guardian deities who preside over the eight points of the compass -- the four cardinal and the four intermediate points -- and are called Loka-Palas , \"Supporters or guardians of the World\" (in our visible Kosmos), of which Indra (East), Yama (South), Varuna (West), and Kuvera (North) are the chief; their elephants and their spouses pertaining of course to fancy and afterthought, though all of them have an occult significance.\n\nThe Lipika (a description of whom is given in the Commentary on Stanza IV .\n\nNo.\n\n6) are the Spirits of the Universe, whereas the Builders are only our own planetary deities.\n\nThe former belong to the most occult portion of Cosmogenesis, which cannot be given here.\n\nWhether the Adepts (even the highest) know this angelic order in the completeness of its triple degrees, or only the lower one connected with the records of our world, is something which the writer is unprepared to say, and she would incline rather to the latter supposition.\n\nOf its highest grade one thing only is taught: the Lipika are connected with Karma -- being its direct Recorders.** [[Footnote(s)]] ------------------------------------------------- * The Jews, save the Kabalists, having no names for East, West, South, and North, expressed the idea by words signifying before, behind, right and left, and very often confounded the terms exoterically, thus making the blinds in the Bible more confused and difficult to interpret.\n\nAdd to this the fact that out of the forty-seven translators of King James I.\n\nof England's Bible \"only three understood Hebrew, and of these two died before the Psalms were translated\" ( Royal Masonic Cyclopaedia ), and one may easily understand what reliance can be placed on the English version of the Bible.\n\nIn this work the Douay Roman Catholic version is generally followed.\n\n** The Symbol for Sacred and Secret Knowledge was universally in antiquity, a Tree, by which a Scripture or a Record was also meant.\n\nHence the word Lipika, the [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 129 THE LIPIKA.\n\nSTANZA V.\n\n-- Continued.\n\n6.\n\nT HE L IPIKA CIRCUMSCRIBE THE TRIANGLE, THE FIRST ONE ( the vertical line or the figure 1 .\n\n), THE CUBE, THE SECOND ONE, AND THE PENTACLE WITHIN THE EGG ( circle ) ( a ) .\n\nI T IS THE RING CALLED \" P ASS NOT,\" FOR THOSE WHO DESCEND AND ASCEND ( as also for those ) WHO, DURING THE KALPA, ARE PROGRESSING TOWARD THE GREAT DAY \" B E WITH US\" ( b ).\n\n.\n\n.\n\n.\n\nT HUS WERE FORMED THE A RUPA AND THE R UPA ( the Formless World and the World of Forms ); FROM ONE LIGHT SEVEN LIGHTS; FROM EACH OF THE SEVEN SEVEN TIMES SEVEN LIGHTS.\n\nT HE \" W HEELS\" WATCH THE R ING.\n\nThe Stanza proceeds with a minute classification of the Orders of Angelic Hierarchy.\n\nFrom the group of Four and Seven emanates the \"mind-born\" group of Ten, of Twelve, of Twenty-one, etc., all these divided again into sub-groups of septenaries, novenaries, duodecimals, and so on, until the mind is lost in this endless enumeration of celestial hosts and Beings, each having its distinct task in the ruling of the visible Kosmos during its existence.\n\n( a ) The esoteric meaning of the first sentence of the Sloka is, that those who have been called Lipikas, the Recorders of the Karmic ledger, make an impassible barrier between the personal E GO and the impersonal S ELF, the Noumenon and Parent-Source of the former.\n\nHence the allegory."


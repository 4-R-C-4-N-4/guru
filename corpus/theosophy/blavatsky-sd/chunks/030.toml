[content]
body = "Even so of persons and things, which, dropping out of the to-be into the has-been, out of the future into the past -- present momentarily to our senses a cross-section, as it were, of their total selves, as they pass through time and space (as matter) on their way from one eternity to another: and these two constitute that \"duration\" in which alone anything has true existence, were our senses but able to cognize it there.\n\n------- STANZA I.\n\n-- Continued .\n\n3.\n\n.\n\n.\n\n.\n\nU NIVERSAL MIND WAS NOT, FOR THERE WERE NO A H-HI (celestial beings) TO CONTAIN (hence to manifest) IT ( a ) .\n\n[[Vol.\n\n1, Page]] 38 THE SECRET DOCTRINE.\n\n( a ) Mind is a name given to the sum of the states of Consciousness grouped under Thought, Will, and Feeling.\n\nDuring deep sleep, ideation ceases on the physical plane, and memory is in abeyance; thus for the time-being \"Mind is not,\" because the organ, through which the Ego manifests ideation and memory on the material plane, has temporarily ceased to function.\n\nA noumenon can become a phenomenon on any plane of existence only by manifesting on that plane through an appropriate basis or vehicle; and during the long night of rest called Pralaya, when all the existences are dissolved, the \" U NIVERSAL M IND\" remains as a permanent possibility of mental action, or as that abstract absolute thought, of which mind is the concrete relative manifestation.\n\nThe A H-HI (Dhyan-Chohans) are the collective hosts of spiritual beings -- the Angelic Hosts of Christianity, the Elohim and \"Messengers\" of the Jews -- who are the vehicle for the manifestation of the divine or universal thought and will.\n\nThey are the Intelligent Forces that give to and enact in Nature her \"laws,\" while themselves acting according to laws imposed upon them in a similar manner by still higher Powers; but they are not \"the personifications\" of the powers of Nature, as erroneously thought.\n\nThis hierarchy of spiritual Beings, through which the Universal Mind comes into action, is like an army -- a \"Host,\" truly -- by means of which the fighting power of a nation manifests itself, and which is composed of army corps, divisions, brigades, regiments, and so forth, each with its separate individuality or life, and its limited freedom of action and limited responsibilities; each contained in a larger individuality, to which its own interests are subservient, and each containing lesser individualities in itself.\n\n------- STANZA I.\n\n-- Continued .\n\n4.\n\nT HE SEVEN WAYS TO BLISS (Moksha* or Nirvana) WERE NOT ( a ) .\n\nT HE GREAT CAUSES OF MISERY (Nidana** and Maya) WERE NOT, FOR THERE WAS NO ONE TO PRODUCE AND GET ENSNARED BY THEM ( b ).\n\n( a ) There are seven \"Paths\" or \"Ways\" to the bliss of Non-Exist- [[Footnote(s)]] ------------------------------------------------- *Nippang in China; Neibban in Burmah; or Moksha in India.\n\n** The \"12\" Nidanas (in Tibetan Ten-brel chug-nyi) the chief causes of existence, effects generated by a concatenation of causes produced (see Comment.\n\nII).\n\n[[Vol.\n\n1, Page]] 39 THE CAUSES OF BEING.\n\nence, which is absolute Being, Existence, and Consciousness.\n\nThey were not, because the Universe was, so far, empty, and existed only in the Divine Thought.\n\nFor it is .\n\n.\n\n.\n\n( b ) The twelve Nidanas or causes of being.\n\nEach is the effect of its antecedent cause, and a cause, in its turn, to its successor; the sum total of the Nidanas being based on the four truths, a doctrine especially characteristic of the Hinayana System.* They belong to the theory of the stream of catenated law which produces merit and demerit, and finally brings Karma into full sway.\n\nIt is based upon the great truth that re-incarnation is to be dreaded, as existence in this world only entails upon man suffering, misery and pain; Death itself being unable to deliver man from it, since death is merely the door through which he passes to another life on earth after a little rest on its threshold -- Devachan.\n\nThe Hinayana System, or School of the \"Little Vehicle,\" is of very ancient growth; while the Mahayana is of a later period, having originated after the death of Buddha.\n\nYet the tenets of the latter are as old as the hills that have contained such schools from time immemorial, and the Hinayana and Mahayana Schools (the latter, that of the \"Great Vehicle\") both teach the same doctrine in reality.\n\nYana, or Vehicle (in Sanskrit, Vahan) is a mystic expression, both \"vehicles\" inculcating that man may escape the sufferings of rebirths and even the false bliss of Devachan, by obtaining Wisdom and Knowledge, which alone can dispel the Fruits of Illusion and Ignorance.\n\nMaya or illusion is an element which enters into all finite things, for everything that exists has only a relative, not an absolute, reality, since the appearance which the hidden noumenon assumes for any observer depends upon his power of cognition.\n\nTo the untrained eye of the savage, a painting is at first an unmeaning confusion of streaks and daubs of color, while an educated eye sees instantly a face or a landscape.\n\nNothing is permanent except the one hidden absolute existence which contains in itself the noumena of all realities.\n\nThe existences belonging to every plane of being, up to the highest Dhyan-Chohans, are, in degree, of the nature of shadows cast by a magic lantern on a colourless screen; but all things are relatively real, for the cogniser is also a reflection, and the things cognised are therefore as real to him as himself.\n\nWhatever reality things possess must be looked for in them [[Footnote(s)]] ------------------------------------------------- * See Wassilief on Buddhism, pp.\n\n97-950.\n\n[[Vol.\n\n1, Page]] 40 THE SECRET DOCTRINE.\n\nbefore or after they have passed like a flash through the material world; but we cannot cognise any such existence directly, so long as we have sense-instruments which bring only material existence into the field of our consciousness.\n\nWhatever plane our consciousness may be acting in, both we and the things belonging to that plane are, for the time being, our only realities.\n\nAs we rise in the scale of development we perceive that during the stages through which we have passed we mistook shadows for realities, and the upward progress of the Ego is a series of progressive awakenings, each advance bringing with it the idea that now, at last, we have reached \"reality;\" but only when we shall have reached the absolute Consciousness, and blended our own with it, shall we be free from the delusions produced by Maya.\n\n------- STANZA I.\n\n-- Continued .\n\n5."


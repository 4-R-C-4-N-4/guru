[content]
body = "\"the causes had to produce effects on earth.\"** Again, in the ancient Quiche Manuscript, the Popol Vuh -- published by the late Abbe Brasseur de Bourbourg -- the first men are described as a race \"whose sight was unlimited, and who knew all things at once\": thus showing the divine knowledge of Gods, not mortals.\n\nThe Secret Doctrine, correcting the unavoidable exaggerations of popular fancy, gives the facts as they are recorded in the Archaic symbols.\n\n[[Footnote(s)]] ------------------------------------------------- * In Isis Unveiled several of these Gnostic systems are given.\n\nOne is taken from the Codex Nazaraeus, the Scriptures of the Nazarenes, who, although they existed long before the days of Christ, and even before the laws of Moses, were Gnostics, and many of them Initiates.\n\nThey held their \"Mysteries of Life\" in Nazara (ancient and modern Nazareth), and their doctrines are a faithful echo of the teachings of the Secret Doctrine -- some of which we are now endeavouring to explain.\n\n** See the translation from the Greek by Francois, Monsieur de Foix, Evesque d'Ayre: the work dedicated to Marguerite de France, Reine de Navarre.\n\nEdition of 1579, Bordeaux.\n\n[[Vol.\n\n2, Page]] 97 THE TREES OF LIFE.\n\n( b ) These \"shadows\" were born \"each of his own colour and kind,\" each also \"inferior to his creator,\" because the latter was a complete being of his kind.\n\nThe Commentaries refer the first sentence to the colour or complexion of each human race thus evolved.\n\nIn Pymander, the Seven primitive men, created by Nature from the \"heavenly Man,\" all partake of the qualities of the \"Seven Governors, \" or Rulers, who loved Man -- their own reflection and synthesis.\n\nIn the Norse Legends, one recognizes in Asgard, the habitat of the gods, as also in the Ases themselves, the same mystical loci and personifications woven into the popular \"myths,\" as in our Secret Doctrine; and we find them in the Vedas, the Puranas, the Mazdean Scriptures and the Kabala.\n\nThe Ases of Scandinavia, the rulers of the world which preceded ours, whose name means literally the \"pillars of the world,\" its \"supports,\" are thus identical with the Greek Cosmocratores, the \"Seven Workmen or Rectors\" of Pymander, the seven Rishis and Pitris of India, the seven Chaldean gods and seven evil spirits, the seven Kabalistic Sephiroth synthesised by the upper triad, and even the seven Planetary Spirits of the Christian mystics.\n\nThe Ases create the earth, the seas, the sky and the clouds, the whole visible world, from the remains of the slain giant Ymir; but they do not create M AN, but only his form from the Ask or ash-tree.\n\nIt is Odin who endows him with life and soul, after Lodur had given him blood and bones, and finally it is Honir who furnishes him with his intellect ( manas ) and with his conscious senses.\n\nThe Norse Ask, the Hesiodic Ash-tree, whence issued the men of the generation of bronze, the Third Root-Race, and the Tzite tree of the Popol-Vuh, out of which the Mexican third race of men was created, are all one.* This may be plainly seen by any reader.\n\nBut the Occult reason why the Norse Yggdrasil, the Hindu Aswatha, the Gogard, the Hellenic tree of life, and the Tibetan Zampun, are one with the Kabalistic Sephirothal Tree, and even with the Holy Tree made by Ahura Mazda, and the Tree of Eden -- who among the western scholars can tell?** Nevertheless, the fruits of all those \"Trees,\" whether Pippala or Haoma or yet the more prosaic apple, are the \"plants of life,\" in fact and verity.\n\nThe prototypes of our races were all enclosed in the microcosmic tree, which grew and developed within and under the great mundane macrocosmic tree***; and the mystery is half revealed in the Dirghotamas, where it is said: \"Pippala, the sweet fruit of that tree upon which come spirits who [[Footnote(s)]] ------------------------------------------------- * See Max Muller's review of the Popol-Vuh.\n\n** Mr.\n\nJames Darmesteter, the translator of the Vendidad, speaking of it, says: \" The tree, whatever it is .\n\n.\n\n.\" (p.\n\n209).\n\n*** Plato's \" Timaeus .\" [[Vol.\n\n2, Page]] 98 THE SECRET DOCTRINE.\n\nlove the science, and where the gods produce all marvels.\" As in the Gogard, among the luxuriant branches of all those mundane trees, the \"Serpent\" dwells.\n\nBut while the Macroscosmic tree is the Serpent of Eternity and of absolute Wisdom itself, those who dwell in the Microcosmic tree are the Serpents of the manifested Wisdom.\n\nOne is the One and All; the others are its reflected parts.\n\nThe \"tree\" is man himself, of course, and the Serpents dwelling in each, the conscious Manas, the connecting link between Spirit and Matter, heaven and earth.\n\nEverywhere, it is the same.\n\nThe creating powers produce Man, but fail in their final object.\n\nAll these logoi strive to endow man with conscious immortal spirit, reflected in the Mind ( manas ) alone; they fail, and they are all represented as being punished for the failure, if not for the attempt.\n\nWhat is the nature of the punishment?\n\nA sentence of imprisonment in the lower or nether region, which is our earth ; the lowest in its chain ; an \"eternity\" -- meaning the duration of the life-cycle -- in the darkness of matter, or within animal Man.\n\nIt has pleased the half ignorant and half designing Church Fathers to disfigure the graphic symbol.\n\nThey took advantage of the metaphor and allegory found in every old religion to turn them to the benefit of the new one.\n\nThus man was transformed into the darkness of a material hell; his divine consciousness, obtained from his indwelling Principle (the Manasa), or the incarnated Deva, became the glaring flames of the infernal region; and our globe that Hell itself.\n\nPippala, Haoma, the fruit of the Tree of Knowledge, were denounced as the forbidden fruit, and the \"Serpent of Wisdom,\" the Voice of reason and consciousness, remained identified for ages with the Fallen Angel, which is the old Dragon, the Devil!\n\n( Vide Part II., \"The Evil Spirit, who, or what?\") The same for the other high symbols.\n\nThe Svastica, the most sacred and mystic symbol in India, the \"Jaina-Cross\" as it is now called by the Masons, notwithstanding its direct connection, and even identity with the Christian Cross, has become dishonoured in the same manner.\n\nIt is the \"devil's sign,\" we are told by the Indian missionaries."


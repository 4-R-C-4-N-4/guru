[content]
body = "T HEN THE SONS ( the Elements with their respective Powers , or Intelligences ) DISSOCIATE AND SCATTER, TO RETURN INTO THEIR MOTHER'S BOSOM AT THE END OF THE \"GREAT DAY\" AND REBECOME ONE WITH HER ( a ).\n\nW HEN IT ( the Web ) IS COOLING, IT BECOMES RADIANT, ITS SONS EXPAND AND CONTRACT THROUGH THEIR OWN SELVES AND HEARTS; THEY EMBRACE INFINITUDE.\n\n( b ) The expanding of the Universe under the breath of F IRE is very suggestive in the light of the \"Fire mist\" period of which modern science speaks so much, and knows in reality so little.\n\nGreat heat breaks up the compound elements and resolves the [[Vol.\n\n1, Page]] 84 THE SECRET DOCTRINE.\n\nheavenly bodies into their primeval one element, explains the commentary.\n\n\"Once disintegrated into its primal constituent by getting within the attraction and reach of a focus, or centre of heat (energy), of which many are carried about to and fro in space, a body, whether alive or dead, will be vapourised and held in \"the bosom of the Mother\" until Fohat, gathering a few of the clusters of Cosmic matter (nebulae) will, by giving it an impulse, set it in motion anew, develop the required heat, and then leave it to follow its own new growth.\n\nThe expanding and contracting of the Web -- i.e., the world stuff or atoms -- expresses here the pulsatory movement; for it is the regular contraction and expansion of the infinite and shoreless Ocean of that which we may call the noumenon of matter emanated by Swabhavat, which causes the universal vibration of atoms.\n\nBut it is also suggestive of something else.\n\nIt shows that the ancients were acquainted with that which is now the puzzle of many scientists and especially of astronomers: the cause of the first ignition of matter or the world-stuff, the paradox of the heat produced by the refrigerative contraction and other such Cosmic riddles.\n\nFor it points unmistakeably to a knowledge by the ancients of such phenomena.\n\n\"There is heat internal and heat external in every atom,\" say the manuscript Commentaries, to which the writer has had access; \"the breath of the Father (or Spirit) and the breath (or heat) of the Mother (matter);\" and they give explanations which show that the modern theory of the extinction of the solar fires by loss of heat through radiation, is erroneous.\n\nThe assumption is false even on the Scientists' own admission.\n\nFor as Professor Newcomb points out (Popular Astronomy, pp.\n\n506-508), \"by losing heat, a gaseous body contracts, and the heat generated by the contraction exceeds that which it had to lose in order to produce the contraction.\" This paradox, that a body gets hotter as the shrinking produced by its getting colder is greater, led to long disputes.\n\nThe surplus of heat, it was argued, was lost by radiation, and to assume that the temperature is not lowered pari passu with a decrease of volume under a constant pressure, is to set at nought the law of Charles (Nebular Theory, Winchell).\n\nContraction develops heat, it is true; but contraction (from cooling) is incapable of developing the whole amount of heat at any time existing in the mass, or even of maintaining a body at a constant temperature, etc.\n\nProfessor Winchell tries to reconcile the paradox -- only a seeming one in fact, as [[Vol.\n\n1, Page]] 85 CONSCIOUS ELECTRICITY.\n\nHomer Lanes proved, -- by suggesting \"something besides heat.\" \"May it not be,\" he asks, \"simply a repulsion among the molecules, which varies according to some law of the distance?\" But even this will be found irreconcileable, unless this \"something besides heat\" is ticketed \"Causeless Heat,\" the \"Breath of Fire,\" the all-creative Force Plus ABSOLUTE INTELLIGENCE, which physical science is not likely to accept.\n\nHowever it may be, the reading of this Stanza shows it, notwithstanding its archaic phraseology, to be more scientific than even modern science.\n\n------- STANZA III.\n\n-- Continued.\n\n12.\n\nT HEN S VABHAVAT SENDS F OHAT TO HARDEN THE ATOMS.\n\nE ACH ( of these ) IS A PART OF THE WEB ( Universe ) .\n\nR EFLECTING THE \" S ELF- E XISTENT L ORD\" ( Primeval Light ) LIKE A MIRROR, EACH BECOMES IN TURN A WORLD.* .\n\n.\n\n.\n\n\"Fohat hardens the atoms\"; i.e.\n\n, by infusing energy into them: he scatters the atoms or primordial matter.\n\n\"He scatters himself while scattering matter into atoms\" ( MSS .\n\nCommentaries.) It is through Fohat that the ideas of the Universal Mind are impressed upon matter.\n\nSome faint idea of the nature of Fohat may be gathered from the appellation \"Cosmic Electricity\" sometimes applied to it; but to the commonly known properties of electricity must, in this case, be added others, including intelligence.\n\nIt is of interest to note that modern science has come to the conclusion, that all cerebration and brain-activity are attended by electrical phenomena.\n\n( For further details as to \" Fohat \" See Stanza V.\n\nand Comments.\n\n\") [[Footnote(s)]] ------------------------------------------------- * This is said in the sense that the flame from a fire is endless, and that the lights of the whole Universe could be lit at one simple rush-light without diminishing its flame.\n\n---------------------"


body = "For \"the seven Souls of the Pharaoh are often mentioned in the Egyptian texts.\n\n.\n\n.\n\n.\n\nSeven Souls or principles in man were identified by our British Druids .\n\n.\n\n.\n\n.\n\n.\n\nThe Rabbins also ran the number of souls up to seven; so, likewise, do the Karens of India.\n\n.\n\n.\n\n.\" And then, the author tabulates the two teachings -- the Esoteric and the Egyptian, -- and shows that the latter had the same series and in the same order.\n\nFurther on, the lecturer formulates these seven (Egyptian) souls, as (1) The Soul of Blood -- the formative ; (2) The Soul of Breath -- \"that breathes \"; (3) The Shade or Covering Soul -- \"that envelopes \"; (4) The Soul of Perception -- \"that perceives ;\" (5) The Soul of Pubescence \"that procreates \"; (6) The Intellectual Soul -- \"that reproduces intellectually \"; and (7) The Spiritual Soul -- \"that is perpetuated permanently.\n\n\" From the exoteric and physiological standpoint this may be very correct; it becomes less so from the esoteric point of view.\n\nTo maintain this, does not at all mean that the \"Esoteric Buddhists\" resolve men into a number of elementary Spirits, as Mr.\n\nG.\n\nMassey, in the same lecture, accuses them of maintaining.\n\nNo \"Esoteric Buddhist\" has ever been guilty of any such absurdity.\n\nNor has it been ever imagined that these shadows \"become spiritual beings in another world,\" or \"seven potential spirits or elementaries of another life.\" What is maintained is simply that every time the immortal Ego incarnates it becomes, as a total, a com- [[Footnote(s)]] ------------------------------------------------- * This is a great mistake made in the Esoteric enumeration.\n\nManas is the fifth, not the fourth; and Manas corresponds precisely with Seb, the Egyptian fifth principle, for that portion of Manas, which follows the two higher principles, is the ancestral soul, indeed, the bright, immortal thread of the higher Ego, to which clings the Spiritual aroma of all the lives or births.\n\n[[Vol.\n\n2, Page]] 633 THE \"PRINCIPLES\" IN THE EGYPTIAN METAPHYSICS.\n\npound unit of Matter and Spirit, which together act on seven different planes of being and consciousness.\n\nElsewhere, Mr.\n\nG.\n\nMassey adds: -- \"The seven souls (our \"Principles\") are often mentioned in the Egyptian texts.\n\nThe moon god, Taht-Esmun, or the later sun god, expressed the seven nature-powers that were prior to himself, and were summed up in him as his seven souls (we say \"principles\") .\n\n.\n\n.\n\n.\n\nThe seven stars in the hand of Christ in the Revelation, have the same significance,\" etc.\n\nAnd a still greater one, as these stars represent also the seven keys of the Seven Churches or the S ODALIAN M YSTERIES, cabalistically.\n\nHowever, we will not stop to discuss, but add that other Egyptologists have also found out that the septenary constitution of man was a cardinal doctrine with the old Egyptians.\n\nIn a series of remarkable articles in the \"Sphinx\" (Munich) Herr Franz Lambert gives incontrovertible proof of his conclusions from the \"Book of the Dead\" and other Egyptian records.\n\nFor details the reader must be referred to the articles themselves, but the following diagram, summing up the author's conclusions, is demonstrative evidence of the identity of Egyptian psychology with the septenary division in \"Esoteric Buddhism.\" On the left hand side the Kabalistic names of the corresponding human principles are placed, and on the right the hieroglyphic names with their renderings as in the diagram of F.\n\nLambert.\n\n[[Footnote(s)]] ------------------------------------------------- * There seems a confusion -- lasting for many centuries -- in the minds of Western Kabalists.\n\nThey call Ruach (Spirit) what we call Kama -rupa; whereas, with us Ruach would be the \"Spiritual Soul\" Buddhi, and Nephesh the 4th principle, the Vital, Animal Soul.\n\nEliphas Levi falls into the same error.\n\n[[Vol.\n\n2, Page]] 634 THE SECRET DOCTRINE.\n\nThis is a very fair representation of the number of the \"principles\" of Occultism, but much confused; and this is what we call the 7 principles in man, and what Mr.\n\nMassey calls \"Souls,\" giving the same name to the Ego or the Monad which reincarnates and resurrects, so to speak, at each rebirth, as the Egyptians did, namely -- \"the Renewed.\" But how can Ruach (Spirit) be lodged in Kama-rupa?\n\nWhat does Bohme, the Prince of all the mediaeval Seers, say?\n\n\"We find Seven especial properties in nature whereby this only Mother works all things\" (which he calls -- fire, light, sound (the upper three) and desire, bitterness, anguish, and substantiality, thus analysing the lower in his own mystic way) .\n\n.\n\n.\n\n\"whatever the six forms are spiritually, that the seventh, the body (or substantiality), is essentially.\" These are the seven forms of the Mother of all Beings from whence all that is in this world is generated,* and again in Aurora xxiv.\n\np.\n\n27 (quoted in Natural Genesis ) -- \"The Creator hath in the body of this world generated himself as it were creaturely in his qualifying Fountain Spirits, and all the stars are .\n\n.\n\n.\n\nGod's powers, and the whole body of the world consisteth in the seven qualifying or Fountain Spirits.\" This is rendering in mystical language our theosophical doctrine.\n\n.\n\n.\n\nBut how can we agree with Mr.\n\nG.\n\nMassey when he states that -- \"The Seven Races of men that have been sublimated and made Planetary (?) by Esoteric Buddhism,** may be met with in the Bundahish as (1) the earth-men; (2) water-men; (3) breast-eared men; (4) breast-eyed men; (5) one-legged men; (6) bat-winged men; (7) men with tails.\" .\n\n.\n\n.\n\nEach of these descriptions, allegorical and even perverted in their later form -- is, nevertheless, an echo of the Secret Doctrine teaching.\n\nThey all refer to the pre-Human evolution of the water-men \"terrible and bad\" by unaided Nature through millions of years, as previously described.\n\nBut we deny point blank the assertion made that \"these were never real races,\" and point to the Archaic Stanzas for our answer.\n\nIt is easy to infer and to say that our \"instructors have mistaken these shadows of the Past, for things human and spiritual\"; but that \"they are neither, and never were either,\" it is less easy to prove.\n\nThe assertion must ever remain on a par with the Darwinian claim that man and the ape had a common pithecoid ancestor.\n\nWhat the Lecturer takes for a \"mode of expression\" and nothing more, in the Egyptian Ritual, we take as having quite another and an important meaning.\n\nHere is one instance."


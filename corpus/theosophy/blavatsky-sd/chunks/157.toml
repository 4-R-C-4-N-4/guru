[content]
body = "We shall speak further on of the intelligent \"principle,\" or rather of the invisible immaterial properties, in the visible and material elements, that \"sprung from the primordial Chaos.\" For, \"What is the primordial Chaos but AEther?\" it is asked in \"ISIS UNVEILED.\" Not the modern Ether; not such as is recognised now, but such as was known to the ancient philosophers long before the time of Moses; but AEther, with all its mysterious and occult properties, containing in itself the germs of universal creation.\n\nUpper A Ether or Akasa, is the celestial virgin and mother of every existing form and being, from whose bosom, as soon as \"incubated\" by the Divine Spirit, are called into existence Matter and Life, Force and Action.\n\nAEther is the Aditi of the Hindus, and it is Akasa.\n\nElectricity, magnetism, heat, light, and chemical action are so little understood even now that fresh facts are constantly widening the range of our knowledge.\n\nWho knows where ends the power of this protean giant -- AEther; or whence its mysterious origin?\n\nWho, we mean, that denies the spirit that works in it, and evolves out of it all visible forms?\n\nIt will be an easy task to show that the cosmogonical legends all over the world are based on a knowledge by the ancients of those sciences, which have allied themselves in our days in support of the doctrine of evolution; and that further research may demonstrate that those ancients were far better acquainted with the fact of evolution itself, embracing both its physical and spiritual aspects, than we are now.\n\n\"With the old philosophers, evolution was a universal theorem, a doctrine embracing the whole , and an established principle; while our modern evolutionists are enabled to present us merely with speculative theoretics; with particular , if not wholly negative theorems.\n\nIt is idle for the representatives of our modern wisdom to close the debate and pretend that the question is settled, merely because the obscure phraseology of the Mosaic, far later, account clashes with the definite exegesis of 'Exact Science'\" (\" Isis Unveiled \") .\n\n[[Vol.\n\n1, Page]] 333 WHAT MANU SAYS OF THIS.\n\nIf one turns to the \"Laws (or Ordinances) of Manu,\" one finds the prototype of all these ideas.\n\nMostly lost (to the Western world) in their original form, disfigured by later interpolations and additions, they have, nevertheless, preserved quite enough of their ancient Spirit to show its character.\n\n\"Removing the darkness, the Self-existent Lord\" ( Vishnu , Narayana , etc.\n\n) becoming manifest, and \"wishing to produce beings from his Essence, created, in the beginning, water alone.\n\nIn that he cast seed.\n\n.\n\n.\n\n.\n\n.\n\nThat became a golden Egg.\" (V.\n\n6, 7, 8, 9.) Whence this Self-existent Lord?\n\nIt is called THIS, and is spoken of as \"Darkness, imperceptible, without definite qualities, undiscoverable as if wholly in sleep.\" (V.\n\n5.) Having dwelt in that Egg for a whole divine year, he \"who is called in the world Brahma,\" splits that Egg in two, and from the upper portion he forms the heaven, from the lower the earth, and from the middle the sky and \"the perpetual place of waters.\" (12, 13.) But there is, directly following these verses, something more important for us, as it corroborates entirely our esoteric teachings.\n\nFrom verse 14 to 36, evolution is given in the order described in the Esoteric philosophy.\n\nThis cannot be easily gainsaid.\n\nEven Medhatithi, the son of Viraswamin, and the author of the Commentary, \"the Manubhasya,\" whose date, according to the western Orientalists, is 1,000 A.D., helps us with his remarks to the elucidation of the truth.\n\nHe showed himself either unwilling to give out more, because he knew that truth which has to be kept from the profane, or else he was really puzzled.\n\nStill, what he does give out makes the septenary principle in men and nature plain enough.\n\nLet us begin with Chapter 1.\n\nof the \"Ordinances\" or \"Laws\" after the Self-existent Lord, the unmanifesting Logos of the Unknown \"Darkness,\" becomes manifested in the golden Egg.\n\nIt is from this \"Egg,\" from ---- (11.) That which is the undiscrete (undifferentiated) cause, eternal, which Is and Is not , from It issued that male who is called in the world Brahma.\n\n.\n\n.\n\n.\n\n.\n\nHere we find, as in all genuine philosophical systems, even the \"Egg\" or the Circle (or Zero), boundless Infinity, referred to as I T,* and Brahma, the first unit only, referred to as the male god, i.e.\n\n, the fructifying Principle.\n\nIt is or 10 (ten) the Decade.\n\nOn the plane of the Septenary or our World only, it is called Brahma.\n\nOn that of the Unified Decade in the realm of Reality, this male Brahma is an illusion.\n\n(14.) \"From Self ( atmanah ) he created mind, (1) which is and is not; [[Footnote(s)]] ------------------------------------------------- The ideal apex of the Pythagorean triangle: vide Sections in Vol.\n\nII., \"Cross and Circle,\" and the \"Earliest Symbolics of the Cross.\" [[Vol.\n\n1, Page]] 334 THE SECRET DOCTRINE.\n\n(2) and from mind, Ego-ism (Self-Consciousness) the ruler; (3) the Lord.\" (1.) The mind is Manas.\n\nMedhatithi, the commentator, justly observes here that it is the reverse of this and shows already interpolation and rearranging; for it is Manas that springs from Ahamkara or (Universal) Self-Consciousness, as Manas in the microcosm springs from Mahat, or Maha-Buddhi (Buddhi, in man).\n\nFor Manas is dual, and as shown and translated by Colebrooke, \"is serving both for sense and action , is an organ by affinity, being cognate with the rest.\" \"The rest\" means, here, that Manas, our fifth principle (the fifth, because the body was named the first , which is the reverse of the true philosophical order)* is in affinity both with Atma-Buddhi and with the lower four principles.\n\nHence, our teaching: namely, that Manas follows Atma-Buddhi to Devachan, and that the lower (dregs, the residue of) Manas remains with Kama rupa, in Limbus , or Kama-loka, the abode of the \"Shells.\" (2.) Such is the meaning of Manas , which \" is , and is not.\n\n\" (3.) Medhatithi translates it as \"the one conscious of the I,\" or Ego, not \"ruler,\" as the Orientalists do."


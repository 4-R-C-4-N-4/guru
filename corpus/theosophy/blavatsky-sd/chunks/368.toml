[content]
body = "It is those who are unable to create the spiritual immortal man, who project the senseless model (the Astral ) of the physical Being; and, as will be seen, it was those who would not multiply, who sacrificed themselves to the good and salvation of Spiritual Humanity.\n\nFor, to complete the septenary man, to add to his three lower principles and cement them with the spiritual Monad -- which could never dwell in such a form otherwise than in an absolutely latent state -- two connecting principles are needed: Manas and Kama.\n\nThis requires a living Spiritual Fire of the middle principle from the fifth and third states of Pleroma.\n\nBut this fire is the possession of the Triangles, not of the (perfect) Cubes, which symbolize the Angelic Beings:* the former having from the first creation got hold of it and being said to have appropriated it for themselves, as in the allegory of Prometheus.\n\nThese are the active, and therefore -- in Heaven -- no longer \"pure\" Beings.\n\nThey have become the independent and free Intelligences, shown in every Theogony as fighting for that independence and freedom, and hence -- in the ordinary sense -- \"rebellious to the divine passive law.\" These are then those \"Flames\" (the Agnishwatta ) who, as shown in Sloka 13, \"remain behind\" instead of going along with the others to create men on Earth.\n\nBut the true esoteric meaning is that most of them were destined to incarnate as the Egos of the forthcoming crop of Mankind.\n\nThe human Ego is neither Atman nor Buddhi, but the higher Manas: the intellectual fruition and the efflorescence of the intellectual self-conscious Egotism -- in the higher spiritual sense.\n\nThe ancient works refer to it as Karana Sarira on the plane of Sutratma, which is the golden thread on which, like beads, the various personalities of this higher Ego are strung.\n\nIf the reader were told, as in the semi-esoteric allegories, that these Beings were returning Nirvanees, from preceding Maha-Manvantaras -- ages of incalculable dura- [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] Yogis are shown in the Puranas to be far more powerful than the gods.\n\nSecondary gods or temporary powers in Nature (the Forces) are doomed to disappear; it is only the spiritual potentiality in man which can lead him to become one with the INFINITE and the ABSOLUTE.\n\n* See Book I., Stanzas III.\n\nto V.\n\nThe triangle becomes a Pentagon (five-fold) on Earth.\n\n[[Vol.\n\n2, Page]] 80 THE SECRET DOCTRINE.\n\ntion which have rolled away in the Eternity, a still more incalculable time ago -- he would hardly understand the text correctly; while some Vedantins might say: \"This is not so; the Nirvanee can never return\"; which is true during the Manvantara he belongs to, and erroneous where Eternity is concerned.\n\nFor it is said in the Sacred Slokas: \"The thread of radiance which is imperishable and dissolves only in Nirvana, re-emerges from it in its integrity on the day when the Great Law calls all things back into action .\n\n.\n\n.\n\n.\" Hence, as the higher \"Pitris or Dhyanis\" had no hand in his physical creation, we find primeval man, issued from the bodies of his spiritually fireless progenitors, described as aeriform, devoid of compactness, and M INDLESS.\n\nHe had no middle principle to serve him as a medium between the highest and the lowest, the spiritual man and the physical brain, for he lacked Manas.\n\nThe Monads which incarnated in those empty S HELLS, remained as unconscious as when separated from their previous incomplete forms and vehicles.\n\nThere is no potentiality for creation, or self-Consciousness, in a pure Spirit on this our plane, unless its too homogeneous, perfect, because divine, nature is, so to say, mixed with, and strengthened by, an essence already differentiated.\n\nIt is only the lower line of the Triangle -- representing the first triad that emanates from the Universal M ONAD -- that can furnish this needed consciousness on the plane of differentiated Nature.\n\nBut how could these pure Emanations, which, on this principle, must have originally been themselves unconscious (in our sense), be of any use in supplying the required principle, as they could hardly have possessed it themselves?\n\nThe answer is difficult to comprehend, unless one is well acquainted with the philosophical metaphysics of a beginningless and endless series of Cosmic Re-births; and becomes well impressed and familiarised with that immutable law of Nature which is E TERNAL M OTION, cyclic and spiral, therefore progressive even in its seeming retrogression.\n\nThe one divine Principle, the nameless T HAT of the Vedas, is the universal Total, which, neither in its spiritual aspects and emanations, nor in its physical atoms, can ever be at \"absolute rest\" except during the \"Nights\" of Brahma.\n\nHence, also, the \"first-born\" are those who are first set in motion at the beginning of a Manvantara, and thus the first to fall into the lower spheres of materiality.\n\nThey who are called in Theology \"the Thrones,\" and are the \"Seat of God,\" must be the first incarnated men on Earth; and it becomes comprehensible, if we think of the endless series of past Manvantaras, to find that the last had to come first, and the first last.\n\nWe find, in short, that the higher Angels had broken, countless aeons before, through the \"Seven Circles,\" and thus robbed them of the Sacred fire; [[Vol.\n\n2, Page]] 81 MAN, A GOD IN ANIMAL FORM.\n\nwhich means in plain words, that they had assimilated during their past incarnations, in lower as well as in higher worlds, all the wisdom therefrom -- the reflection of M AHAT in its various degrees of intensity.\n\nNo Entity, whether angelic or human, can reach the state of Nirvana, or of absolute purity, except through aeons of suffering and the knowledge of EVIL as well as of good, as otherwise the latter remains incomprehensible.\n\nBetween man and the animal -- whose Monads (or Jivas) are fundamentally identical -- there is the impassable abyss of Mentality and Self-consciousness.\n\nWhat is human mind in its higher aspect, whence comes it, if it is not a portion of the essence -- and, in some rare cases of incarnation, the very essence - - of a higher Being: one from a higher and divine plane?\n\nCan man -- a god in the animal form -- be the product of Material Nature by evolution alone, even as is the animal, which differs from man in external shape, but by no means in the materials of its physical fabric, and is informed by the same, though undeveloped, Monad -- seeing that the intellectual potentialities of the two differ as the Sun does from the Glow-worm?\n\nAnd what is it that creates such difference, unless man is an animal plus a living god within his physical shell?"


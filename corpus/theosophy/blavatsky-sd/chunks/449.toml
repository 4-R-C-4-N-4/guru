body = "Hence man, although apparently its crown, would, by his advent have marked the close of creation; since creation, culminating in him, would at his death have entered on its decline\" .\n\n.\n\n.\n\n( p .\n\n289).\n\nThis Kabalistic view is here quoted, to show its perfect identity in spirit with the Eastern doctrine.\n\nExplain, or complete the teaching of the seven Suns with the seven systems of planes of being, of which the \"Suns\" are the central bodies, and you have the seven angelic planes, [[Footnote(s)]] ------------------------------------------------- * This \"central sun\" of the Occultists, which even Science is obliged to accept astronomically, for it cannot deny the presence in Sidereal Space of a central body in the milky way, a point unseen and mysterious, the ever-hidden centre of attraction of our Sun and system -- this \"Sun\" is viewed differently by the Occultists of the East.\n\nWhile the Western and Jewish Kabalists (and even some pious modern astronomers) claim that in this sun the God-head is specially present -- referring to it the volitional acts of God -- the Eastern Initiates maintain that, as the supradivine Essence of the Unknown Absolute is equally in every domain and place, the \"Central Sun\" is simply the centre of Universal life-Electricity; the reservoir within which that divine radiance, already differentiated at the beginning of every creation, is focussed.\n\nThough still in a laya, or neutral condition, it is, nevertheless, the one attracting, as also the ever-emitting, life Centre.\n\n[[Vol.\n\n2, Page]] 241 \"PRINCIPLES\" EXPLAINED.\n\nwhose \"Host\" are gods thereof, collectively.\n\n( See Comm.\n\nto Stanza VII Book I .) They are the Head-group divided into four classes from the incorporeal down to the semi-corporeal, which classes are directly connected -- though in very different ways as regards voluntary connection and functions -- with our mankind.\n\nThey are three, synthesized by the fourth (the first and highest), which is called the \"Central Sun\" in the Kabalistic doctrine just quoted.\n\nThis is the great difference between the Semitic and the Aryan Cosmogony; one materializing, humanizes the mysteries of nature; the other spiritualizes matter, and its physiology is always made subservient to metaphysics.\n\nThus, though the seventh principle reaches man through all the phases of being, pure as an indiscrete element and an impersonal unity, it passes through (the Kabala teaches from ) the Central Spiritual Sun and Group the second (the polar Sun), which two radiate on man his Atma.\n\nGroup Three (the equatorial Sun) cement the Buddhi to Atman and the higher attributes of Manas, while group Four (the spirit of our visible sun) endows him with his Manas and its vehicle -- the Kama rupa, or body of passions and desires, the two elements of Ahamkara which evolve individualized consciousness -- the personal ego.\n\nFinally, it is the spirit of the Earth in its triple unity that builds the physical body, attracting to it the Spirits of Life and forming his Linga Sarira.\n\nNow, as everything proceeds cyclically, the evolution of man like everything else, the order in which he is generated is described fully in the Eastern teachings, whereas it is only hinted at in the Kabala.\n\nSays the Book of Dzyan with regard to primeval man when first projected by the \"Boneless,\" the incorporeal Creator: \" First, the Breath, then Buddhi, and the Shadow-Son (the Body) were 'CREATED.' But where was the pivot (the middle principle, Manas)?\n\nMan is doomed.\n\nWhen alone, the indiscrete (undifferentiated Element) and the Vahan (Buddhi) -- the cause of the causeless -- break asunder from manifested life \" -- \" unless cemented and held together by the middle principle, the vehicle of the personal consciousness of J IVA\"; explains the Commentary.\n\nIn other words, the two higher principles can have no individuality on Earth, cannot be man, unless there is ( a ) the Mind, the Manas-Ego, to cognize itself, and ( b ) the terrestrial false personality, or the body of egotistical desires and personal Will, to cement the whole, as if round a pivot (which it is, truly), to the physical form of man.\n\nIt is the Fifth and the Fourth principles* -- Manas and Kama rupa -- that contain the dual personality: the real immortal Ego ( if it assimilates itself to the two higher ) and the false and transitory personality, the mayavi or astral body, so-called, or the animal-human Soul -- the two hav- [[Footnote(s)]] ------------------------------------------------- * The Fourth, and the Fifth from below beginning by the physical body; the Third and the Fourth, if we reckon from Atma.\n\n[[Vol.\n\n2, Page]] 242 THE SECRET DOCTRINE.\n\ning to be closely blended for purposes of a full terrestrial existence.\n\nIncarnate the Spiritual Monad of a Newton grafted on that of the greatest saint on earth -- in a physical body the most perfect you can think of -- i.e.\n\n, in a two or even a three-principled body composed of its Sthula Sarira, prana (life principle), and linga sarira -- and, if it lacks its middle and fifth principles, you will have created an idiot -- at best a beautiful, soul-less, empty and unconscious appearance.\n\n\" Cogito -- ergo sum \" -- can find no room in the brain of such a creature, not on this plane, at any rate.\n\nThere are students, however, who have long ago understood the philosophical meaning underlying the allegory -- so tortured and disfigured by the Roman Church -- of the Fallen Angels.\n\n\"The Kingdom of Spirits and spiritual action which flows from and is the product of Spirit Volition, is outside and contrasted with and in contradiction to the Kingdom of (divine) Souls and divine action.\"* As said in the text: -- \" Like produces like and no more at the genesis of being, and evolution with its limited conditioned laws comes later.\n\nThe Self-Existentt are called C REATIONS, for they appear in the Spirit Ray, manifested through the potency inherent in its UNBORN Nature, which is beyond time and (limited or conditioned) Space.\n\nTerrene products, animate and inanimate, including mankind, are falsely called creation and creatures: they are the development ( evolution ) of the discrete elements.\n\n\" (Com."


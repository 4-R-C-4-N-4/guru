[content]
body = "Hunt writes: -- \"But regarding Life -- Vital Force -- as a power far more exalted than either light, heat, or electricity, and indeed capable of exerting a controlling power over them all \" (this is absolutely occult).\n\n.\n\n.\n\n.\n\n.\n\n\"we are certainly disposed to view with satisfaction that speculation which supposes the photosphere to be the primary seat of vital power , and to regard with a poetic pleasure that hypothesis which refers the Solar energies to Life.\n\n\" Thus, we have an important scientific corroboration for one of our fundamental dogmas -- namely, that ( a ) the Sun is the store-house of Vital Force, which is the Noumenon of Electricity; and ( b ) that it is from its mysterious, never-to-be-fathomed depths, that issue those life currents which thrill through Space, as through the organisms of every living thing on Earth.\n\nFor see what another eminent physician says, who calls this (our life-fluid) \"nervous Ether.\" Change a few sentences in the article, extracts from which now follow, and you have another quasi - Occult treatise on Life Force.\n\nThis once, it is again Dr.\n\nB.\n\nW.\n\nRichardson, F.R.S., who gives his views in the \" Popular Science Review ,\" Vol.\n\nX.\n\n, p.\n\n380-3, on \"Nervous Ether,\" as he has on \"Sun-Force\" and \"Earth-Force\": -- \"The idea attempted to be conveyed by the theory is, that between the molecules of the matter, solid or fluid, of which the nervous organisms, and, indeed, of which all the organic parts of a body are composed, there exists a refined subtle medium, vaporous or gaseous, which holds the molecules in a condition for motion upon each other, and for arrangement and rearrangement of form; a medium by and through which all motion is conveyed; by and through which the one organ or part of the body is held in communion with the other parts, by which and through which the outer living world communicates with the living man: a medium, which, being present, enables the phenomena of life to be demonstrated, and which, being universally absent, leaves the body actually dead.\n\n.\n\n.\n\n.\n\n.\n\n.\" And the whole Solar System falls into Pralaya -- the author might have added.\n\nBut let us read further: .\n\n.\n\n.\n\n\"I use the word Ether in its general sense as meaning a very light, vaporous or gaseous matter; I use it, in short, as the astronomer uses it when he speaks of the Ether of Space, by which he means a subtle but material medium.\n\n.\n\n.\n\n.\n\n.\n\nWhen I speak of a nervous Ether, I do not convey that the ether is existent in nervous structure only: I believe truly that it is a special part of the nervous organization; but, as nerves pass into all structures that have capacities for movement and sensibilities, so the nervous ether passes into all such parts; and as the nervous ether is, according to my view, a direct product from blood, so we may look upon it as a part of the atmosphere of the blood.\n\n[[Vol.\n\n1, Page]] 532 THE SECRET DOCTRINE.\n\n.\n\n.\n\n.\n\nThe evidence in favour of the existence of an elastic medium pervading the nervous matter and capable of being influenced by simple pressure is all-convincing.\n\n.\n\n.\n\n.\n\nIn nervous structure there is, unquestionably, a true nervous fluid, as our predecessors taught * The precise chemical (?)** composition of this fluid is not yet well known; the physical characters of it have been little studied.\n\nWhether it moves in currents, we do not know; whether it circulates, we do not know; whether it is formed in the centres and passes from them to the nerves, or whether it is formed everywhere where blood enters nerve, we do not know.\n\nThe exact uses of the fluid we do not consequently know.\n\nIt occurs to my mind, however, that the veritable fluid of nervous matter is not of itself sufficient to act as the subtle medium that connects the outer with the inner universe of man and animal.\n\nI think -- and this is the modification I suggest to the older theory -- there must be another form of matter present during life; a matter which exists in the condition of vapour or gas, which pervades the whole nervous organism, surrounds as an enveloping atmosphere*** each molecule of nervous structure, and is the medium of all motion, communicated to and from the nervous centres.\n\n.\n\n.\n\n.\n\nWhen it is once fairly presented to the mind that during life there is in the animal body a finely diffused form of matter , a vapour filling every part -- and even stored in some parts; a matter constantly renewed by the vital chemistry; a matter as easily disposed of as the breath, after it has served its purpose -- a new flood of light breaks on the Intelligence .\" .\n\n.\n\n.\n\n.\n\nA new flood of light is certainly thrown on the wisdom of ancient and mediaeval Occultism and its votaries.\n\nFor Paracelsus wrote the same thing more than three hundred years ago, namely, in the sixteenth century, as follows: -- \"The whole of the Microcosm is potentially contained in the Liquor Vitae , a nerve fluid .\n\n.\n\n.\n\nin which is contained the nature, quality, character, and essence of beings.\" .\n\n.\n\n.\n\n( De Generatione Hominis ).\n\n.\n\n.\n\n.\n\n\"The Archaeus or Liquor Vitae is an essence that is equally distributed in all parts of the human body.\n\n.\n\n.\n\n.\n\nThe Spiritus Vitae takes its origin from the Spiritus Mundi.\n\nBeing an emanation of the latter , it contains the elements of all cosmic influences, and is therefore the cause by which the action of the stars (cosmic forces) upon the invisible body of man (his vital lingasharira ) may be explained.\" ( De Viribus Membrorum.\n\nSee \"Life of Paracelsus\" by Franz Hartmann, M.D., F.T.S.\n\n) Had Dr.\n\nRichardson studied all the secret works of Paracelsus, he would not have been obliged to confess so often -- \"we do not know\" .\n\n.\n\n.\n\n.\n\n\"it is not known to us\" .\n\n.\n\n.\n\n.\n\netc., etc.\n\nNor would he have ever pronounced the following sentence, recanting the best portions of his independent rediscovery , in which he says ( p .\n\n384): -- [[Footnote(s)]] ------------------------------------------------- * Paracelsus for one, who called it liquor vitae , and Archaeus.\n\n** Rather alchemical -- \"composition.\" *** \"This vital force .\n\n.\n\n.\n\nradiates around man like a luminous sphere\" .\n\n.\n\n.\n\nsays Paracelsus in Paragranum.\n\n[[Vol.\n\n1, Page]] 533 PANTHEISM OR MONOTHEISM.\n\n\"It may be urged that in this line of thought is included no more than the theory of the existence of the ether .\n\n.\n\n.\n\n.\n\nsupposed to pervade space.\n\n.\n\n.\n\n.\n\n.\n\nIt may be said that this universal ether pervades all the organism of the animal body as from without, and as part of every organization.\n\nThis view would be Pantheism physically discovered if it were true ( !!\n\n) It fails to be true because it would destroy the individuality of every individual sense.\n\n.\n\n."


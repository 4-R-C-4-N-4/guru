[content]
body = "It comes to this: Mankind in its first prototypal, shadowy form, is the offspring of the Elohim of Life (or Pitris); in its qualitative and physical aspect it is the direct progeny of the \"Ancestors,\" the lowest Dhyanis, or Spirits of the Earth; for its moral, psychic, and spiritual nature, it is indebted to a group of divine Beings, the name and characteristics of which will be given in Book II.\n\nCollectively, men are the handiwork of hosts of various spirits; distributively, the tabernacles of those hosts; and occasionally and singly, the vehicles of some of them.\n\nIn our present all-material Fifth Race, the earthly Spirit of the [[Vol.\n\n1, Page]] 225 SPIRIT FALLING INTO MATTER.\n\nFourth is still strong in us; but we are approaching the time when the pendulum of evolution will direct its swing decidedly upwards, bringing Humanity back on a parallel line with the primitive third Root-Race in Spirituality.\n\nDuring its childhood, mankind was composed wholly of that Angelic Host, who were the indwelling Spirits that animated the monstrous and gigantic tabernacles of clay of the Fourth Race built by (as they are now also) and composed of countless myriads of lives.* This sentence will be explained later on in the present Commentary.\n\nThe \"tabernacles\" have improved in texture and symmetry of form, growing and developing with the globe that bore them; but the physical improvement took place at the expense of the spiritual inner man and nature.\n\nThe three middle principles in earth and man became with every race more material; the Soul stepping back to make room for the physical intellect; the essence of elements becoming the material and composite elements now known.\n\nMan is not, nor could he ever be, the complete product of the \"Lord God\"; but he is the child of the Elohim , so arbitrarily changed into the singular masculine gender.\n\nThe first Dhyanis, commissioned to \"create\" man in their image, could only throw off their shadows, like a delicate model for the Nature Spirits of matter to work upon.\n\n(See Book II.) Man is, beyond any doubt, formed physically out of the dust of the Earth, but his creators and fashioners were many.\n\nNor can it be said that the \"Lord God breathed into his nostrils the breath of life,\" unless that God is identified with the \" O NE L IFE,\" Omnipresent though invisible, and unless the same operation is attributed to \"God\" on behalf of every living Soul -- or Nephesch , which is the vital Soul, not the divine Spirit or Ruach , which ensures to man alone a divine degree of immortality, that no animal, as such, could ever attain in this cycle of incarnation.\n\nIt is the inadequate distinctions made by the Jews, and now by our Western metaphysicians, who, not knowing of, and being unable to understand, hence to accept, more than a triune man -- Spirit, Soul, [[Footnote(s)]] ------------------------------------------------- * Science, dimly perceiving the truth, may find Bacteria and other infinitesimals in the human body, and see in them but occasional and abnormal visitors to which diseases are attributed.\n\nOccultism -- which discerns a life in every atom and molecule, whether in a mineral or human body, in air, fire or water -- affirms that our whole body is built of such lives, the smallest bacteria under the microscope being to them in comparative size like an elephant to the tiniest infusoria.\n\n[[Vol.\n\n1, Page]] 226 THE SECRET DOCTRINE.\n\nBody -- thus confuse the \"breath of life\" with immortal Spirit.* This applies also directly to the Protestant theologians, who, in translating verse 8 of Ch.\n\nIII.\n\nin the Fourth Gospel, have entirely perverted the meaning.\n\nIndeed the verse is made to say \"The wind bloweth where it listeth,\" instead of \"the Spirit goeth where it willeth,\" as in the original and also in the translation of the Greek Eastern Church.\n\nThus the philosophy of psychic, spiritual, and mental relations with man's physical functions is in almost inextricable confusion.\n\nNeither the old Aryan, nor the Egyptian psychology are now properly understood.\n\nNor can they be assimilated without accepting the esoteric septenary, or, at any rate, the Vedantic quinquepartite division of the human inner principles.\n\nFailing which, it will be for ever impossible to understand the metaphysical and purely psychic and even physiological relations between the Dhyan-Chohans, or Angels, on the one plane, and humanity on the other.\n\nNo Eastern (Aryan) esoteric works are so far published, but we possess the Egyptian papyri which speak clearly [[Footnote(s)]] ------------------------------------------------- * The learned and very philosophical author of \"New Aspects of Life\" would impress upon his reader that the Nephesh chaiah (living soul), according to the Hebrews, \"proceeded from, or was produced by, the infusion of the Spirit or Breath of Life into the quickening body of man, and was to supersede and take the place of that spirit in the thus constituted self, so that the spirit passed into, was lost sight of, and disappeared in the living Soul.\" The human body, he thinks, ought to be viewed as a matrix in which, and from which, the Soul (which he seems to place higher than the spirit) is developed -- considered functionally and from the standpoint of activity, the Soul stands undeniably higher in this finite and conditioned world of Maya -- the Soul, he says, \"is ultimately produced from the animated body of man.\" Thus the author identifies \"Spirit\" (Atma) simply with \"the breath of life.\" The Eastern Occultists will demur to this statement, for it is based on the erroneous conception that Prana and Atma or Jivatma are one and the same thing.\n\nThe author supports the argument by showing that with the ancient Hebrews, Greeks and even Latins, Ruach , Pneuma and Spiritus -- with the Jews undeniably, and with the Greeks and Romans very probably -- meant Wind; the Greek word Anemos (wind) and the Latin Anima \"Soul\" having a suspicious relation.\n\nThis is very far fetched.\n\nA legitimate battle-field for deciding this question is hardly to be found, since Mr.\n\nPratt seems to be a practical, matter-of-fact metaphysician, a kind of Kabalist-Positivist, and the Eastern metaphysicians, especially the Vedantins, are all Idealists.\n\nThe Occultists are also of the extreme esoteric Vedantin school, and they call the One Life (Parabrahm), the Great Breath and the Whirlwind; but they disconnect the seventh principle entirely from matter or any relation to, or connection with it.\n\n[[Vol.\n\n1, Page]] 227 THE EGYPTIAN SYSTEM."


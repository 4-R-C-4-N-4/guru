[content]
body = "Hence, the future plan, if not a DESIGN, must be there.\n\nMoreover, that seed has to be traced, and its nature ascertained.\n\nHave the Darwinists been successful in this?\n\nOr will the Moneron be cast in our teeth?\n\nBut this atom of the Watery Abysses is not homogeneous matter; and there must be something or somebody that had moulded and cast it into being.\n\nHere Science is once more silent.\n\nBut since there is no Self-consciousness as yet in either speck, seed, or germ, according to both Materialists and Psychologists of the modern school -- Occultists agreeing in this for once with their natural enemies -- what is it that guides the force or forces so unerringly in this process of evolution?\n\nBlind force?\n\nAs well call blind the brain which evolved in Haeckel his \"Pedigree of Man\" and other lucubrations.\n\nWe can easily conceive that the said brain lacks an important centre or two.\n\nFor, whoever knows anything of the anatomy of the human, or even of any animal, body, and is still an atheist and a materialist, must be \"hopelessly insane,\" according to Lord Herbert, who rightly sees in the frame of man's body and the coherence of its parts, something so strange and paradoxical that he holds it \"to be the greatest miracle of nature.\" Blind forces, \"and no design\" in anything under the Sun; when no sane man of Science would hesitate to say that, even from the little he knows and has hitherto discovered of the forces at work in Kosmos, he sees very plainly [[Vol.\n\n2, Page]] 654 THE SECRET DOCTRINE.\n\nthat every part, every speck and atom are in harmony with their fellow atoms, and these with the whole, each having its distinct mission throughout the life-cycle.\n\nBut, fortunately, the greatest, the most eminent thinkers and Scientists of the day are now beginning to rise against this \"Pedigree,\" and even Darwin's natural selection theory, though its author had never, probably, contemplated such widely stretched conclusions.\n\nThe remarkable work of the Russian Scientist N.\n\nT.\n\nDanilevsky -- \"Darwinism, a Critical Investigation of the Theory\" -- upsets it completely and without appeal, and so does de Quatrefages in his last work.\n\nOur readers are recommended to examine the learned paper by Dr.\n\nBourges -- read by its author, a member of the Paris Anthropological Society at a recent official meeting of the latter -- called \" Evolutionary Psychology ; the Evolution of Spirit, etc.\n\n\" in which he reconciles entirely the two teachings -- namely, those of the physical and spiritual evolutions.\n\nHe explains the origin of the variety of organic forms, made to fit their environments with such evident intelligent design, by the existence and the mutual help and interaction of two principles in (manifest) nature, the inner Conscious Principle adapting itself to physical nature and the innate potentialities in the latter.\n\nThus the French Scientist has to return to our old friend -- Archaeus, or the life-Principle -- without naming it, as Dr.\n\nRichardson has done in England in his \"Nerve-Force,\" etc.\n\nThe same idea was recently developed in Germany by Baron Hellenbach, in his remarkable work, \"Individuality in the light of Biology and modern Philosophy.\" We find the same conclusions arrived at in still another excellent volume of another Russian deep thinker, N.\n\nN .\n\nStrachof -- who says in his \"Fundamental Conceptions of Psychology and Physiology\": -- \"The most clear, as the most familiar, type of development may be found in our own mental or physical evolution, which has served others as a model to follow .\n\n.\n\n.\n\n.\n\nIf organisms are entities .\n\n.\n\n.\n\nthen it is only just to conclude and assert that the organic life strives to beget psychic life; but it would be still more correct and in accordance with the spirit of these two categories of evolution to say, that the true cause of organic life is the tendency of spirit to manifest in substantial forms, to clothe itself in substantial reality.\n\nIt is the highest form which contains the complete explanation of the lowest, never the reverse.\n\n\" This is admitting, as Bourges does in the Memoire above quoted, the identity of this mysterious, integrally acting and organizing Principle with the Self-Conscious and Inner Subject, which we call the E GO and the world at large -- the Soul.\n\nThus, gradually, all the best Scientists and Thinkers are approaching the Occultists in their general conclusions.\n\nBut such metaphysically inclined men of Science are out of court and will hardly be listened to.\n\nSchiller, in his magnificent poem on [[Vol.\n\n2, Page]] 655 THE ONE UNPARDONABLE SIN.\n\nthe Veil of Isis, makes the mortal youth who dared to lift the impenetrable covering fall down dead after beholding naked Truth in the face of the stern goddess.\n\nHave some of our Darwinians, so tenderly united in natural selection and affinity, also gazed at the Saitic Mother bereft of her veils?\n\nOne might almost suspect it after reading their theories.\n\nTheir great intellects must have collapsed while gauging too closely the uncovered face of Nature, leaving only the grey matter and ganglia in their brain, to respond to blind physico-chemical forces.\n\nAt any rate Shakespeare's lines apply admirably to our modem Evolutionist who symbolizes that \"proud man,\" who -- \" Dress ' d in a little brief authority ; Most ignorant of what he ' s most assured, His glassy essence -- like an angry ape, Plays such fantastic tricks before high heaven, As make the Angels weep!\n\n.\n\n.\n\n.\n\n.\n\n\" These have nought to do with the \"angels.\" Their only concern is the human ancestor, the pithecoid Noah who gave birth to three sons -- the tailed Cynocephalus, the tailless Ape, and the \"arboreal\" Palaeolithic man.\n\nOn this point, they will not be contradicted.\n\nEvery doubt expressed is immediately set down as an attempt to cripple scientific inquiry.\n\nThe insuperable difficulty at the very foundation of the evolution theory, namely, that no Darwinian is able to give even an approximate definition of the period at which, and the form in which, the first man appeared, is smoothed down to a trifling impediment, which is \"really of no account.\" Every branch of knowledge is in the same predicament, we are informed.\n\nThe chemist bases his most abstruse calculations simply \"upon a hypothesis of atoms and molecules, of which not one has ever been seen isolated, weighed, or defined.\n\nThe electrician speaks of magnetic fluids which have never tangibly revealed themselves.\n\nNo definite origin can be assigned either to molecules or magnetism.\n\nScience cannot and does not pretend to any knowledge of the beginnings of law, matter or life, .\n\n.\n\n.\" etc., etc.\n\n( Knowledge, January, 1882.) And, withal, to reject a scientific hypothesis, however absurd, is to commit the one unpardonable sin!\n\nWe risk it.\n\n-------"


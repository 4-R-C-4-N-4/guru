body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n1 [[Vol.\n\n1, Page]] 529 MYSTERIOUS SUN FLUID.\n\nVIII.\n\nLIFE, FORCE, OR GRAVITY.\n\nT HE imponderable fluids have had their day; \"mechanical Forces\" are less talked about; Science has put on a new face for this last quarter of a century; but gravitation has remained, owing its life to new combinations after the old ones had nearly killed it.\n\nIt may answer scientific hypotheses very well, but the question is whether it answers as well to truth, and represents a fact in nature.\n\nAttraction by itself is not sufficient to explain merely planetary motion; how can it presume to explain the rotatory motion in the infinitudes of Space?\n\nAttraction alone will never fill all the gaps, unless a special impulse is admitted for every sidereal body, and the rotation of every planet with its satellites is shown to be due to some one cause combined with attraction.\n\nAnd even then, says an astronomer (\" Philosophie Naturelle ,\" art.\n\n142), Science would have to name that cause.\n\nOccultism has named it for ages, and so have all the ancient philosophers; but then all such beliefs are now proclaimed exploded superstitions.\n\nThe \"extra cosmic\" God has killed every possibility of belief in intra cosmic intelligent Forces, yet who, or what is the original pusher in that motion?\n\n\"When we have learned the cause, unique et speciale , that pushes, we will be ready to combine it with the one which attracts,\" says Francoeur (\" Astronomie ,\" p.\n\n342).\n\nAnd again -- \"Attraction between the celestial bodies is only repulsion: it is the Sun that drives them incessantly onward; for otherwise, their motion would stop.\" If ever this theory of the Sun-Force being the primal cause of all life on earth and motion in heaven is accepted, and if that other far bolder one of Herschell -- about certain organisms in the Sun -- is accepted even as a provisional hypothesis, then will our teachings be vindicated, and esoteric allegory shown to have anticipated Modern Science by millions of years, probably, for these are the Archaic teachings.\n\nMarttanda (the Sun) watches and threatens -- without abandoning the central position to which his Mother, Aditi, relegated him -- his seven brothers, the planets; \"he pursues them, turning slowly around himself .\n\n.\n\n.\n\nand follows them from afar, moving in the same direction that they do, on the path that encircles their houses\" -- or the orbit.\n\n( See Comment to Stanza IV.\n\n, Book I.\n\n) It is the Sun-fluids or Emanations that impart all motion and awaken all into life, in the Solar System.\n\nIt is attraction and repulsion, but not as understood by modern physics and according to the law of gravity; but in harmony with the laws of Manvantaric motion de- [[Vol.\n\n1, Page]] 530 THE SECRET DOCTRINE.\n\nsigned from the early Sandhya , the Dawn of the rebuilding and higher reformation of the System.\n\nThese laws are immutable; but the motion of all the bodies, which motion is diverse and alters with every minor Kalpa -- is regulated by the Movers , the Intelligences within the Cosmic Soul.\n\nAre we so very wrong in believing all this?\n\nWell, here is a modern and a great man of Science who, speaking of vital electricity, uses language far more akin to Occultism than to modern materialistic thought.\n\nWe refer the sceptical reader to an article on \"The Source of Heat in the Sun,\" by Robert Hunt , F.R.S., (in \" Popular Science Review ,\" Vol.\n\nIV., p.\n\n148), who, speaking of the luminous envelope of the Sun and its \"peculiar curdy appearance,\" says: -- \"Arago proposed that this envelope should be called the Photosphere, a name now generally adopted.\n\nBy the elder Herschell, the surface of this photosphere was compared to mother-of-pearl.\n\n.\n\n.\n\n.\n\n.\n\nIt resembles the Ocean on a tranquil summer-day, when its surface is slightly crisped by a gentle breeze.\n\n.\n\n.\n\n.\n\nMr.\n\nNasmyth has discovered a more remarkable condition than any that had previously been suspected .\n\n.\n\n.\n\nobjects which are peculiarly lens-shaped .\n\n.\n\n.\n\n.\n\nlike 'willow leaves .\n\n.\n\n.\n\n.\n\ndifferent in size .\n\n.\n\n.\n\n.\n\n.\n\nnot arranged in any order crossing each other in all directions .\n\n.\n\n.\n\n.\n\n.\n\nwith an irregular motion among themselves .\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\nThey are seen approaching to and receding from each other, and sometimes assuming new angular positions, so that the appearance .\n\n.\n\n.\n\n.\n\n.\n\nhas been compared to a dense shoal of fish, which, indeed, they resemble in shape.\n\n.\n\n.\n\n.\n\nThe size of these objects gives a grand idea of the gigantic scale upon which physical (?) operations are carried out in the Sun.\n\nThey cannot be less than 1,000 miles in length, and from two to three hundred miles in breadth.\n\nThe most probable conjecture which has been offered respecting those leaf or lens-like objects, is that the photosphere* is an immense ocean of gaseous matter (what kind of \"matter?\") .\n\n.\n\n.\n\nin a state of intense (apparent) incandescence, and that they are perspective projections of the sheets of flame.\n\n.\n\n.\n\n.\" Solar \"flames\" seen through telescopes are reflections , says Occultism.\n\nBut see what Occultists have to say to this in Book I.\n\n\"Whatever they may be (those sheets of flame), it is evident they are the immediate sources of solar heat and light.\n\nHere we have a surrounding envelope of photogenic matter,** which pendulates with mighty energies, and by communicating its motion to the ethereal medium in stellar space, produces heat and light in far distant worlds.\n\nWe have said that those forms have been compared to certain organisms, and Herschell says, 'Though it would be too daring to speak of such organizations as partaking of life [why not?],*** yet we do not know that vital action is competent to develop heat, light, and electricity.' .\n\n.\n\n.\n\nCan it be that there is truth in this fine thought?\n\nMay the pulsing of vital matter [[Footnote(s)]] ------------------------------------------------- * And the central mass , too, as will be found, or rather the centre of the reflection.\n\n** That \"matter\" is just like the reflection in a mirror of the flame from a \"photogenic\" lamp - wick.\n\n*** See \" Five Years of Theosophy ,\" p.\n\n258 -- answer to this speculation of Herschell's.\n\n[[Vol.\n\n1, Page]] 531 SUN-FORCE AND EARTH-FORCE.\n\nin the central Sun of our System be the source of all that life which crowds the earth, and without doubt overspreads the other planets, to which the Sun is the mighty Minister?\n\n\" .\n\n.\n\n.\n\nOccultism answers these queries in the affirmative; and Science will find this to be the case, one day.\n\nAgain, on p.\n\n156, Mr."


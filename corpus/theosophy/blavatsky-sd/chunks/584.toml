[content]
body = "Lacking the Old Testament symbology, ignorant of the real connotation of the name of Jehovah -- the rabbinical secret substitute for the ineffable and unpronounceable name -- the Church mistook the cunningly fabricated shadow for the reality, the anthropomorphized generative symbol for the one Secondless Reality, the ever unknowable cause of all.\n\nAs a logical sequence the Church, for purposes of duality, had to invent an anthropomorphic Devil -- created, as taught by her, by God himself.\n\nSatan has now turned out to be the monster fabricated by the \"Jehovah-Frankenstein,\" -- his father's curse and a thorn in the divine side -- a monster, than whom no earthly Frankenstein could have fabricated a more ridiculous bogey.\n\nThe author of \"New Aspects of Life\" describes the Jewish God very correctly from the Kabalistic stand-point as \"the Spirit of the Earth, which had revealed itself to the Jew as Jehovah\" ( p .\n\n209).\n\n\"It was that Spirit again who, after the death of Jesus, assumed his form and personated him as the risen Christ\" -- the doctrine of Cerinthius and several Gnostic sects with slight variation, as one can see.\n\nBut the author's explanations and deductions are remarkable: \"None knew .\n\n.\n\n.\n\nbetter than Moses .\n\n.\n\n.\n\nand so well as he how great was the power of those (gods of Egypt) with whose priests he had contended,\" he says .\n\n.\n\n.\n\n\"the gods of which Jehovah is claimed to be the God\" (by the Jews only).\n\n\"What were these gods, these Achar of which Jehovah, the Achad, is claimed to be the God .\n\n.\n\n.\n\nby overcoming them?\" the author asks; to which our Occultism answers: \"those whom the Church now calls the Fallen Angels and collectively Satan, the Dragon, overcome, if we have to accept her dictum, by Michael and the Host, that Michael being simply Jehovah himself, one of the subordinate Spirits at best.\" Therefore, the author is again right in saying: \"The Greeks believed in the existence of .\n\n.\n\n.\n\ndaimons.\n\nBut .\n\n.\n\n.\n\nthey were anticipated by the Hebrews, who held that [[Vol.\n\n2, Page]] 509 JEHOVAH, A PERSONATING SPIRIT.\n\nthere was a class of personating spirits which they designated demons, 'personators.' Admitting with Jehovah, who expressly asserts it, the existence of other gods, which were personators of the One God, were these other gods simply a higher class of personating spirits, which had acquired and exercised greater powers?\n\nAnd is not personation the Key to the mystery of the Spirit state?\n\nBut once granting this position, how are we to know that Jehovah was not a personating Spirit, a Spirit which arrogated to itself that it was, and thus became, the personator of the one unknown and unknowable God?\n\nNay, how do we know that the Spirit calling itself Jehovah, in arrogating to itself his attributes did not thus cause its own designation to be imputed to the One who is in reality as nameless as incognizable?\" ( pp .\n\n144-145.) Then the author shows \"that the Spirit Jehovah is a personator\" on its own admission.\n\nIt acknowledged to Moses \"that it had appeared to the patriarchs as the God Shaddai\" .\n\n.\n\n.\n\n.\n\nand \"the god Helion \" .\n\n.\n\n.\n\n.\n\nWith the same breath it assumed the name of Jehovah; and it is on the faith of the assertion of this personator that the names El, Eloah, Elohim, and Shaddai, have been read and interpreted in juxtaposition with Jehovah as \"the Lord God Almighty.\" Then when the name Jehovah became ineffable .\n\n.\n\n.\n\n.\n\nthe designation Adonai, \"Lord\" was substituted for it, and\" .\n\n.\n\n.\n\n.\n\nit was owing to this substitution that the 'Lord' passed from the Jewish to the Christian 'Word' and 'World' as a designation of God\" ( p .\n\n146).\n\nAnd how are we to know, the author may add, that Jehovah was not many spirits personating even that seemingly one -- Jod or Jod-He?\n\nBut if the Christian Church was the first to make the existence of Satan a dogma, it was because, as shown in Isis, the Devil -- the powerful enemy of God (?\n\n!\n\n!) had to become the corner stone of the pillar of the Church.\n\nFor, as a Theosophist, M.\n\nJules Baissac, truly observes in his \"Satan ou le Diable\" ( p.\n\n9): \"Il fallait eviter de paraitre autoriser le dogme du double principe en faisant de ce Satan createur une puissance reelle, et pour expliquer le mal originel, on profere contre Manes l'hypothese d'une permission de l'unique tout Puissant.\"* The choice and policy were unfortunate, anyhow.\n\nEither the personator of the lower god of Abraham and Jacob ought to have been made entirely distinct from the mystic \"Father\" of Jesus, or -- the \"Fallen\" Angels should have been left unslandered by further fictions.\n\nEvery god of the Gentiles is connected with, and closely related to, [[Footnote(s)]] ------------------------------------------------- * After the polymorphic Pantheism of some Gnostics came the esoteric dualism of Manes, who was accused of personifying Evil and creating of the Devil a God -- rival of God himself.\n\nWe do not see that the Christian Church has so much improved on that exoteric idea of the Manicheans, for she calls God her King of Light, and Satan, the King of Darkness, to this day.\n\n[[Vol.\n\n2, Page]] 510 THE SECRET DOCTRINE Jehovah -- the Elohim ; for they are all One Host , whose units differ only in name in the esoteric teachings.\n\nBetween the \"Obedient\" and the \"Fallen\" Angels there is no difference whatever, except in their respective functions, or rather in the inertia of some, and the activity of others among those \"Dhyan Chohans\" or Elohim who were \" commissioned to create ,\" i.e ., to fabricate the manifested world out of the eternal material.\n\nThe Kabbalists say that the true name of Satan is that of Jehovah placed upside down, for \"Satan is not a black god but the negation of the white deity,\" or the light of Truth ."


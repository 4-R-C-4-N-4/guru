[content]
body = "\"Challenger\" and the \"Dolphin,\" have established the fact that a huge elevation some 3,000 miles in length, projecting upwards from the abysmal depths of the [[Vol.\n\n2, Page]] 793 RECENT SUGGESTIVE DISCOVERIES.\n\nAtlantic, extends from a point near the British Islands southwards, curving round near Cape de Verde, and running in a south-easterly direction along the West African Coast.\n\nThis elevation averages some 9,000 feet in height, and rises above the waves at the Azores, Ascension, and other places.\n\nIn the ocean depths around the neighbourhood of the former the ribs of a former massive piece of land have been discovered ( vide investigations of United States Ship \"Dolphin\" and others).\n\n\"The inequalities, the mountains and valleys of its surface could never have been produced in accordance with any known laws for the deposition of sediment, nor by submarine elevation ; but, on the contrary, must have been carved by agencies acting above the water-level.\" -- ( Scientific American, July 28th, 1877).\n\nIt is most probable that necks of land formerly existed knitting Atlantis to South America, somewhere above the mouth of the Amazon; to Africa near Cape de Verde, while a similar point of juncture with Spain is not unlikely, as contended for by Donnelly.\n\n( Vide his chart, \"Atlantis,\" p.\n\n47, Eng.\n\nEd., 1884, though he deals with only a fragment of the real continent.) Whether the latter existed or not, is of no consequence, as the fact that (what is now) N.\n\nW.\n\nAfrica was -- before the elevation of the Sahara and the rupture of the Gibraltar connection -- an extension of Spain.\n\nConsequently no difficulty can be raised as to how the migration of the European fauna (etc.) took place.\n\nEnough has now been said from the purely scientific standpoint, and it is needless, in view of the manner in which the subject has now been developed on the lines of esoteric knowledge, to swell the mass of testimony further.\n\nIn conclusion, the words of one of the most intuitive writers of the day may be cited as admirably illustrative of the opinions of the occultist, who awaits in patience the dawn of the coming day: -- \"We are but beginning to understand the past; one hundred years ago the world knew nothing of Pompeii or Herculaneum; nothing of the lingual tie that binds together the Indo-European nations; nothing of the significance of the vast volume of inscriptions upon the tombs and temples of Egypt; nothing of the meaning of the arrow-headed inscriptions of Babylon; nothing of the marvellous civilizations revealed in the remains of Yucatan, Mexico, and Peru.\n\nWe are on the threshold.\n\nScientific investigation is advancing with giant strides.\n\nWho shall say that one hundred years from now, the great museums of the world may not be adorned with gems, statues, arms, and implements from Atlantis, while the libraries of the world shall contain translations of its inscriptions, throwing new light upon all the past history of the human race, and all the great problems which now perplex the thinkers of to-day.\"* [[Footnote(s)]] ------------------------------------------------- * Donnelly, \" Atlantis ; the Ante-Diluvian World, \" p.\n\n480.\n\n[[Vol.\n\n2, Page]] 794 THE SECRET DOCTRINE.\n\nAnd now to conclude.\n\n------- We have concerned ourself with the ancient records of the nations, with the doctrine of chronological and psychic cycles, of which these records are the tangible proof; and with many other subjects, which may, at first sight, seem out of place in this volume.\n\nBut they were necessary in truth.\n\nIn dealing with the secret annals and traditions of so many nations, whose very origins have never been ascertained on more secure grounds than inferential suppositions, in giving out the beliefs and philosophy of more than prehistoric races, it is not quite as easy to deal with the subject matter as it would be if only the philosophy of one special race, and its evolution, were concerned.\n\nThe Secret Doctrine is the common property of the countless millions of men born under various climates, in times with which History refuses to deal, and to which esoteric teachings assign dates incompatible with the theories of Geology and Anthropology.\n\nThe birth and evolution of the Sacred Science of the Past are lost in the very night of Time; and that, even, which is historic -- i.e., that which is found scattered hither and thither throughout ancient classical literature -- is, in almost every case, attributed by modern criticism to lack of observation in the ancient writers, or to superstition born out of the ignorance of antiquity.\n\nIt is, therefore, impossible to treat this subject as one would the ordinary evolution of an art or science in some well-known historical nation.\n\nIt is only by bringing before the reader an abundance of proofs all tending to show that in every age, under every condition of civilization and knowledge, the educated classes of every nation made themselves the more or less faithful echoes of one identical system and its fundamental traditions -- that he can be made to see that so many streams of the same water must have had a common source from which they started.\n\nWhat was this source?\n\nIf coming events are said to cast their shadows before, past events cannot fall to leave their impress behind them.\n\nIt is, then, by those shadows of the hoary Past and their fantastic silhouettes on the external screen of every religion and philosophy, that we can, by checking them as we go along, and comparing them, trace out finally the body that produced them.\n\nThere must be truth and fact in that which every people of antiquity accepted and made the foundation of its religions and its faith.\n\nMoreover, as Haliburton said, \"Hear one side, and you will be in the dark; hear both sides, and all will be clear.\" The public has hitherto had access to, and heard but one side -- or rather the two one-sided views of two diametrically opposed classes of men, whose prima facie propositions or respective premises differ widely, but whose final conclusions are the same -- Science and Theology.\n\nAnd now our [[Vol.\n\n2, Page]] 795 OLD MASONIC SYMBOLISM.\n\nreaders have an opportunity to hear the other -- the defendants' -- justification on and learn the nature of our arguments.\n\nWere the public to be left to its old opinions: namely, on one side, that Occultism, Magic, the legends of old, etc., were all the outcome of ignorance and superstition; and on the other, that everything outside the orthodox groove was the work of the devil, what would be the result?\n\nIn other words, had no theosophical and mystic literature obtained a hearing for the few last years, the present work would have had a poor chance of impartial consideration.\n\nIt would have been proclaimed -- and by many will still be so proclaimed -- a fairy tale woven out of abstruse problems, poised in, and based on the air; built of soap bubbles, bursting at the slightest touch of serious reflection, with no foundation, as it would be alleged, to stand upon."


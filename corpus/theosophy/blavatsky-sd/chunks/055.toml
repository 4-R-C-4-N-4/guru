[content]
body = "But inasmuch, O beautiful one, as you came personally to speak to me (in the way you did, i.e.\n\nproudly), therefore, O, Sarasvati!\n\nyou shall never speak after (hard) exhalation.\" \"The goddess Speech\" (Sarasvati, a later form or aspect of Vach, the goddess also of secret learning or Esoteric Wisdom), \"verily, dwelt always between the Prana and the Apana.\n\nBut O noble one!\n\ngoing with the Apana wind (vital air), though impelled, without the Prana (expirational breath), she ran up to Prajapati (Brahma), saying, 'Be pleased, O venerable sir!' Then the Prana appeared again, nourishing Speech.\n\nAnd, therefore, Speech never speaks after (hard or inspirational) exhalation.\n\nIt is always noisy or noiseless.\n\nOf these two, the noiseless is the superior to the noisy (Speech) .\n\n.\n\n.\n\n.\n\nThe (speech) which is produced in the body by means of the Prana, and which then goes (is transformed) into Apana, and then becoming assimilated with the Udana (physical organs of Speech) .\n\n.\n\n.\n\nthen finally dwells in the Samana ('at the navel in the form of sound, as the material cause of all words,' says Arjuna Misra).\n\nSo Speech formerly spoke.\n\nHence the mind is distinguished by reason of its being immovable, and the Goddess (Speech) by reason of her being movable.\" This allegory is at the root of the Occult law, which prescribes silence upon the knowledge of certain secret and invisible things perceptible only to the spiritual mind (the 6th sense), and which cannot be expressed by \"noisy\" or uttered speech.\n\nThis chapter of Anugita explains, says Arjuna Misra, Pranayama, or regulation of the breath in Yoga practices.\n\nThis mode, however, without the previous acquisition of, or at least full understanding of the two higher senses, of which there are seven, as will be shown, pertains rather to the lower Yoga.\n\nThe Hatha so called was and still is discountenanced by the Arhats.\n\nIt is injurious to the health and alone can never develop into Raj Yoga.\n\nThis story is quoted to show how inseparably connected are, in the metaphysics of old, intelligent beings, or rather \"Intelligences,\" with every sense or [[Vol.\n\n1, Page]] 96 THE SECRET DOCTRINE.\n\nfunction whether physical or mental.\n\nThe Occult claim that there are seven senses in man, as in nature, as there are seven states of consciousness, is corroborated in the same work, chapter vii., on Pratyahara (the restraint and regulation of the senses, Pranayama being that of the \"vital winds\" or breath).\n\nThe Brahmana speaks in it \"of the institution of the seven sacrificial Priests (Hotris).\n\nHe says: \"The nose and the eyes, and the tongue, and the skin and the ear as the fifth (or smell, sight, taste, touch and hearing), mind and understanding are the seven sacrificial priests separately stationed\"; and which \"dwelling in a minute space (still) do not perceive each other\" on this sensuous plane, none of them except mind.\n\nFor mind says: \"The nose smells not without me, the eye does not take in colour, etc., etc.\n\nI am the eternal chief among all elements ( i.e.\n\n, senses).\n\nWithout me, the senses never shine, like an empty dwelling, or like fires the flames of which are extinct.\n\nWithout me, all beings, like fuel half dried and half moist, fail to apprehend qualities or objects even with the senses exerting themselves.\"* This, of course, with regard only to mind on the sensuous plane.\n\nSpiritual mind (the upper portion or aspect of the impersonal MANAS) takes no cognisance of the senses in physical man.\n\nHow well the ancients were acquainted with the correlation of forces and all the recently discovered phenomena of mental and physical faculties and functions, with many more mysteries also -- may be found in reading chapters vii.\n\nand viii.\n\nof this (in philosophy and mystic learning) priceless work.\n\nSee the quarrel of the senses about their respective superiority and their taking the Brahman, the lord of all creatures, for their arbiter.\n\n\"You are all greatest and not greatest,\" or superior to objects, as A.\n\nMisra says, none being independent of the other.\n\n\"You are all possessed of one another's qualities.\n\nAll are greatest in their own spheres and all support one another.\n\nThere is one unmoving (life-wind or breath, the ' Yoga inhalation, ' so called, which is the breath of the One or Higher S ELF).\n\nThat is the (or my) own Self, accumulated in numerous (forms).\" This Breath, Voice, Self or \"Wind\" ( pneuma?\n\n) is the Synthesis of the Seven Senses, noumenally all minor deities and esoterically -- the septenary and the \"Army of the V OICE.\" [[Footnote(s)]] ------------------------------------------------- * This shows the modern metaphysicians, added to all past and present Haegels, Berkeleys, Schopenhauers, Hartmanns, Herbert Spencers, and even the modern Hylo-Idealists to boot, no better than the pale copyists of hoary antiquity.\n\n[[Vol.\n\n1, Page]] 97 NATURE, THE PERPETUAL MOTION.\n\n( b ) Next we see Cosmic matter scattering and forming itself into elements; grouped into the mystic four within the fifth element -- Ether, the lining of Akasa, the Anima Mundi or Mother of Kosmos.\n\n\"Dots, Lines, Triangles, Cubes, Circles\" and finally \"Spheres\" -- why or how?\n\nBecause, says the Commentary, such is the first law of Nature, and because Nature geometrizes universally in all her manifestations.\n\nThere is an inherent law -- not only in the primordial, but also in the manifested matter of our phenomenal plane -- by which Nature correlates her geometrical forms, and later, also, her compound elements; and in which there is no place for accident or chance.\n\nIt is a fundamental law in Occultism, that there is no rest or cessation of motion in Nature.* That which seems rest is only the change of one form into another; the change of substance going hand in hand with that of form -- as we are taught in Occult physics, which thus seem to have anticipated the discovery of the \"Conservation of matter\" by a considerable time.\n\nSays the ancient Commentary** to Stanza IV.: -- \" The Mother is the fiery Fish of Life.\n\nShe scatters her spawn and the Breath ( Motion ) heats and quickens it.\n\nThe grains ( of spawn ) are soon attracted to each other and form the curds in the Ocean ( of Space ) ."


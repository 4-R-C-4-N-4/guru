[content]
body = "Such a use of ordinary language is now obsolete, but it has become a question with the writer whether at one time, far back in the past, it, or such, was not the language of the world and of universal use, possessed, however, as it became more and more moulded into its arcane forms, by a select class or caste.\n\nBy this I mean that the popular tongue or vernacular commenced even in its origin to be made use of as the vehicle of this peculiar mode of conveying ideas.\n\nOf this the evidences are very strong; and, indeed, it would seem that in the history of the human race there happened, from causes which at present, at any rate, we cannot trace, a lapse or loss from an original perfect language and a perfect system of science -- shall we say perfect because they were of divine origin and importation?\" \"Divine origin\" does not mean here a revelation from an anthropomorphic god on a mount amidst thunder and lightning; but, as we understand it, a language and a system of science imparted to the early mankind by a more advanced mankind , so much higher as to be divine in the sight of that infant humanity.\n\nBy a \"mankind,\" in short, from other spheres; an idea which contains nothing supernatural in it, but the acceptance or rejection of which depends upon the degree of conceit and arrogance in the mind of him to whom it is stated.\n\nFor, if the professors of modern knowledge would only confess that, though they know nothing of the future of the disembodied man -- or rather will accept nothing -- yet this future may be pregnant with surprises and unexpected revelations to them, once their Egos are rid of their gross bodies -- then materialistic unbelief would have fewer chances than it has.\n\nWho of them knows, or can tell, what may happen when once the life cycle of this globe is run down and our mother earth herself falls into her last sleep?\n\nWho is bold enough to say that the divine Egos of our mankind -- at least the elect out of the multitudes passing on to other spheres -- will not become in their turn the \"divine\" instructors of a new mankind generated by them on a new globe, called to life and activity by the disembodied \"principles\" of our Earth?\n\n(See Stanza VI., Book I., Part 1.) All this may have been the experience of the P AST, and these strange records lie embedded in the \"Mystery language\" of the prehistoric ages, the language now called S YMBOLISM.\n\n-------------- Next Chapter Contents"


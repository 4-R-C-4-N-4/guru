body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n1 [[Vol.\n\n1, Page]] 213 THE CREATIVE POWERS.\n\nSTANZA VII.\n\n1.\n\nB EHOLD THE BEGINNING OF SENTIENT FORMLESS LIFE ( a ).\n\nF IRST, THE DIVINE ( vehicle ) ( b ), THE ONE FROM THE MOTHER-SPIRIT ( Atman ) ; THEN THE S PIRITUAL -- ( Atma-Buddhi , Spirit-soul ) * ( c ); ( again ) THE THREE FROM THE ONE ( d ), THE FOUR FROM THE ONE ( e ), AND THE FIVE (f), FROM WHICH THE THREE, THE FIVE AND THE SEVEN ( g ) -- THESE ARE THE THREE-FOLD AND THE FOUR-FOLD DOWNWARD; THE \"MIND-BORN SONS OF THE FIRST L ORD ( Avalokiteswara ) THE S HINING S EVEN ( the \" Builders \") .\n\n** I T IS THEY WHO ARE THOU, ME, HIM, O L ANOO; THEY WHO WATCH OVER THEE AND THY MOTHER, B HUMI ( the Earth ) .\n\n( a ) The hierarchy of Creative Powers is divided into seven (or 4 and 3) esoteric, within the twelve great Orders, recorded in the twelve signs of the Zodiac; the seven of the manifesting scale being connected, moreover, with the Seven Planets.\n\nAll this is subdivided into numberless groups of divine Spiritual, semi-Spiritual, and ethereal Beings.\n\nThe Chief Hierarchies among these are hinted at in the great Quaternary, or the \"four bodies and the three faculties\" of Brahma exoterically, and the Panchasyam, the five Brahmas, or the five Dhyani-Buddhas in the Buddhist system.\n\nThe highest group is composed of the divine Flames, so-called, also spoken of as the \"Fiery Lions\" and the \"Lions of Life,\" whose esotericism is securely hidden in the Zodiacal sign of Leo.\n\nIt is the nucleole of the superior divine World (see Commentary in first pages of Addendum).\n\nThey are the formless Fiery Breaths, identical in one aspect with the upper Sephirothal T RIAD, which is placed by the Kabalists in the \"Archetypal World.\" The same hierarchy, with the same numbers, is found in the Japanese system, in the \"Beginnings\" as taught by both the Shinto and the Buddhist sects.\n\nIn this system, Anthropogenesis precedes Cosmogenesis, as the Divine merges into the human, and creates -- [[Footnote(s)]] ------------------------------------------------- * This relates to the Cosmic principles.\n\n** The seven creative Rishis now connected with the constellation of the Great Bear [[Vol.\n\n1, Page]] 214 THE SECRET DOCTRINE.\n\nmidway in its descent into matter -- the visible Universe.\n\nThe legendary personages -- remarks reverentially Omoie -- \"having to be understood as the stereotyped embodiment of the higher (secret) doctrine, and its sublime truths.\" To state it at full length, however, would occupy too much of our space, but a few words on this old system cannot be out of place.\n\nThe following is a short synopsis of this Anthropo-Cosmogenesis, and it shows how closely the most separated notions echoed one and the same Archaic teaching.\n\nWhen all was as yet Chaos ( Kon-ton ) three spiritual Beings appeared on the stage of future creation: (1) Ame no ani naka nushi no Kami , \"Divine Monarch of the Central Heaven\"; (2) Taka mi onosubi no Kami , \"Exalted, imperial Divine offspring of Heaven and the Earth\"; and (3) Kamu mi musubi no Kami , \"Offspring of the Gods,\" simply.\n\nThese were without form or substance (our arupa triad), as neither the celestial nor the terrestrial substance had yet differentiated, \"nor had the essence of things been formed.\" In the Zohar -- which, as now arranged and re-edited by Moses de Leon, with the help of Syrian and Chaldean Christian Gnostics in the XIIth century, and corrected and revised still later by many Christian hands, is only a little less exoteric than the Bible itself -- this divine \"Vehicle\" no longer appears as it does in the \"Chaldean Book of Numbers.\" True enough, Ain-Soph, the A BSOLUTE E NDLESS N O-THING, uses also the form of the O NE, the manifested \"Heavenly man\" (the FIRST CAUSE) as its chariot ( Mercabah , in Hebrew; Vahan , in Sanskrit) or vehicle to descend into, and manifest through, in the phenomenal world.\n\nBut the Kabalists neither make it plain how the A BSOLUTE can use anything, or exercise any attribute whatever, since, as the Absolute, it is devoid of attributes; nor do they explain that in reality it is the First Cause (Plato's Logos ) the original and eternal IDEA, that manifests through Adam Kadmon, the Second Logos, so to speak.\n\nIn the \"Book of Numbers\" it is explained that E N (or Ain , Aior) is the only self-existent, whereas its \"Depth\" ( Bythos or Buthon of the Gnostics, called Propator ) is only periodical.\n\nThe latter is Brahm as differentiated from Brahma or Parabrahm.\n\nIt is the Depth, the Source of Light, or Propator, which is the unmanifested Logos or the abstract Idea , and not Ain-Soph, whose ray uses Adam-Kadmon or the manifested Logos (the objective Universe) \"male and female\" -- as a chariot through which to manifest.\n\nBut in the Zohar we read the following incongruity: \" Senior [[Vol.\n\n1, Page]] 215 ONE PARENT FLAME, COUNTLESS FLAMES.\n\noccultatus est et absconditus; Microprosopus manifestus est , et non manifestus.\n\n\" ( Rosenroth; Liber Mysterii , IV .\n\n, 1.) This is a fallacy, since Microprosopus or the microcosm , can only exist during its manifestations, and is destroyed during the Maha-Pralayas.\n\nRosenroth's Kabala is no guide, but very often a puzzle.\n\n( b ) As in the Japanese system, in the Egyptian, and every old cosmogony -- at this divine FLAME, The \"One,\" are lit the three descending groups.\n\nHaving their potential being in the higher group, they now become distinct and separate Entities.\n\nThese are called the \"Virgins of Life,\" the \"Great Illusion,\" etc., etc., and collectively the \"Six-pointed Star.\" The latter is the symbol, in almost every religion, of the Logos as the first emanation.\n\nIt is that of Vishnu in India (the Chakra , or wheel), and the glyph of the Tetragrammaton, the \"He of the four letters\" or -- metaphorically -- \"the limbs of Microprosopos\" in the Kabala, which are ten and six respectively."


body = "principles), which move about in the body, and swallow up one another,* blazes the Vaishvana fire** sevenfold, of which 'I' am the goal,\" says the Brahmana.*** But the chief \"Soul\" is Manas or mind; hence, Soma, the moon, is shown as making an alliance with the solar portion in it, personified as the Prachetasas.\n\nBut of the seven keys that open the seven aspects of the Ramayana, as of every other Scripture, this is only one -- the metaphysical.\n\nThe symbol of the \"Tree\" standing for various Initiates was almost universal.\n\nJesus is called \"the tree of Life,\" as also all the adepts of the good Law, while those of the left Path are referred to as the \"withering trees.\" John the Baptist speaks of \"the axe\" which \"is laid to the root of the trees\" (Matth.\n\niii.\n\n10); and the King of Assyria's armies are called trees (Isaiah x.\n\n19).\n\nThe true meaning of the Garden of Eden was sufficiently given in \" Isis Unveiled.\n\n\" The writer has more than once heard surprise expressed that Isis should contain so few of the doctrines now taught.\n\nThis is quite erroneous.\n\nFor the allusions to such teachings are plentiful, even if the teachings themselves were still withheld.\n\nThe time had not arrived then, as the hour has not struck now to say all.\n\n\"No Atlanteans, or the Fourth Race which preceded our Fifth Race, are mentioned in ' Isis Unveiled, ' \" a critic on \"Esoteric Buddhism\" wrote one day.\n\nI, who wrote Isis Unveiled, maintain that the Atlanteans are mentioned as our predecessors, namely, in Volume I., p.\n\n133, when speaking of the Book of Job.\n\nFor what can be plainer than this: \"In the original text, instead of 'dead things,' it is written dead Rephaim, giants, or mighty primitive men, from whom 'Evolution' may one day trace our present race.\n\n\" It is invited to do so now, now that this hint is explained quite openly; but Evolutionists are as sure to [[Footnote(s)]] ------------------------------------------------- * This is explained by the able translator of Anugita in a foot-note (p.\n\n258) in these words: \"The sense appears to be this; the course of worldly life is due to the operations of the life-winds which are attached to the SELF , and lead to its manifestations as individual souls.\n\n**\" Vaisvanara (or Vaishvanara) is a word often used to denote the Self\" -- explains Nilakantha.\n\n*** Translated by Kashinath Trimbak Telang, M.A ., Bombay.\n\n[[Vol.\n\n2, Page]] 497 TRACES OF PRE-HISTORIC STRIFES.\n\ndecline nowadays as they did ten years ago.\n\nScience and theology are against us: therefore we question both, and have to do so in self-defence.\n\nOn the strength of hazy metaphors scattered throughout the prophets, and in St.\n\nJohn's Revelation, a grand but re-edited version of the Book of Enoch, on these insecure grounds Christian theology built its dogmatic Epos of the War in Heaven.\n\nIt did more: it used the symbolical visions, intelligible only to the Initiates, as pillars upon which to support the whole bulky edifice of its religion; and now the pillars have been found very weak reeds, and the cunning structure is foundering.\n\nThe entire Christian scheme rests upon these Jakin and Boaz -- the two contrary forces of good and evil, Christ and Satan the [[ agathai kai kakai dunameis ]].\n\nTake away from Christianity its main prop of the Fallen Angels, and the Eden Bower vanishes with its Adam and Eve into thin air; and Christ, in the exclusive character of the One God and Saviour, and the victim of Atonement for the Sin of animal-man, becomes forthwith a useless, meaningless myth.\n\nIn an old number of the Revue Archaeologique for the year 1845 (p.\n\n41), a French writer, M.\n\nMaury, remarks: -- \"This universal strife between good and bad spirits seems to be only the reproduction of another more ancient and more terrible strife, that, according to an ancient myth, took place before the creation of the universe, between the faithful and the rebellious legions.\" Once more, it is a simple question of priority.\n\nHad John's Revelation been written during the Vedic period, and were not one sure now of its being simply another version of the Book of Enoch and the Dragon legends of pagan antiquity -- the grandeur and the beauty of the imagery might have biased the critics' opinion in favour of the Christian interpretation of that first war, whose battle field was starry Heaven, and the first slaughterers -- the Angels.\n\nAs the matter stands now, however, one has to trace Revelation, event by event, to other and far older visions.\n\nFor the better comprehension of the Apocalyptic allegories and of the esoteric epos we ask the reader to turn to Revelation, and to read chapter xii., from verse 1 to verse 7.\n\nThis has several meanings, most of which have been found out with regard to the astronomical and numerical keys of this universal myth.\n\nThat which may be given now, is a fragment, a few hints as to its secret meaning, as embodying the record of a real war, the struggle between the Initiates of the two schools.\n\nMany and various are the still existing allegories built on that same foundation stone.\n\nThe true narrative, that which gives the full esoteric meaning, is in the Secret books, but the writer has had no access to these.\n\nIn the exoteric works, however, the episode of the Taraka war, and some esoteric commentaries, may offer a clue perhaps.\n\nIn every Purana [[Vol.\n\n2, Page]] 498 THE SECRET DOCTRINE.\n\nthe event is described with more or less variations, which show its allegorical character.\n\nIn the Mythology of the earliest Vedic Aryans as in the later Puranic narratives, mention is made of Budha, the \"Wise\"; one \"learned in the Secret Wisdom,\" and who is the planet Mercury in his euhemerization.\n\nThe Hindu Classical Dictionary credits Budha with being the author of a hymn in the Rig Veda.\n\nTherefore, he can by no means be \"a later fiction of the Brahmins,\" but is a very old personation indeed.\n\nIt is by inquiring into his genealogy, or theogony, rather, that the following facts are disclosed.\n\nAs a myth, he is the son of Tara, the wife of Brihaspati the \"gold coloured,\" and of \"Soma\" the (male) Moon, who, Paris-like, carries this new Helen of the Hindu sidereal Kingdom away from her husband, which causes a great strife and war in Swarga (Heaven)."


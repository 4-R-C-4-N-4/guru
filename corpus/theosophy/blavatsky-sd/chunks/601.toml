[content]
body = "Because, if the Father is the Sun (the elder Brother in the Eastern inner philosophy), the nearest planet to it is Mercury (Hermes, Budha, Thot), the name of whose mother on Earth was Maia; the planet which receives seven times more light than any other: which fact led the Gnostics to call their Christos, and the Kabalists their Hermes (in the astronomical meaning), the \"seven-fold light\" ( vide at end of this §) .\n\nFinally, this God was Bel; the Sun being \"Bel,\" with the Gauls, \"Helios\" with the Greeks, \"Baal,\" with the Phoenicians; \"El\" in Chaldean, hence \"EL-ohim,\" \"Emanu-EL,\" El , \"god,\" in Hebrew.\n\nBut even the Kabalistic god has vanished in the rabbinical workmanship, and one has now to turn to the innermost metaphysical sense of the Zohar to find in it anything like Ain-Soph, the nameless deity and the Absolute, so authoritatively and loudly claimed by the Christians.\n\nBut it is certainly not to be found in the Mosaic books, by those who try to read without a Key to them.\n\nEver since it was lost Jews and Christians have tried their best to blend these two conceptions, but in vain.\n\nThey have only succeeded in finally robbing even the Universal Deity of I TS majestic character and primitive meaning.\n\nThis is what was said in \"Isis Unveiled\" : - - It would seem, therefore, but natural to make a difference between the mystery-god [[ Iao ]], adopted from the highest antiquity by all who participated in the esoteric knowledge of the priests, and his phonetic counterparts, whom we find treated with so little reverence by the Ophites and other Gnostics.\n\n[[Vol.\n\n2, Page]] 541 THE ANTIQUITY OF THE CROSS.\n\nIn the Ophite gems of King (\"Gnostics\") we find the name of IAO repeated, and often confounded with that of Jevo, while the latter simply represents one of the genii antagonistic to Abraxas.\n\nBut the name IAO neither originated with, nor was it the sole property of the Jews.\n\nEven if it had pleased Moses to bestow the name upon the tutelary \"Spirit,\" the alleged protector and national deity of the \"chosen people of Israel,\" there is yet no possible reason why other nationalities should receive Him as the Highest and One-living God.\n\nBut we deny the assumption altogether.\n\nBesides, there is the fact that Jaho or Iao was a \"Mystery name\" from the beginning, for and never came into use before King David.\n\nAnterior to his time, few or no proper names were compounded with Iah or Jah.\n\nIt looks rather as though David, being a sojourner among the Tyrians and Philistines (2 Samuel), brought thence the name of Jehovah.\n\nHe made Zadok high priest, from whom came the Zadokites or Sadducees.\n\nHe lived and ruled first at Hebron , Habir-on or Kabeir-town, where the rites of the four (mystery-gods) were celebrated.\n\nNeither David nor Solomon recognized either Moses or the law of Moses.\n\nThey aspired to build a temple to , like the structures erected by Hiram to Hercules and Venus, Adon and Astarte.\n\nSays Furst: \"The very ancient name of God, Yaho, written in the Greek law, appears, apart from its derivation, to have been an old mystic name of the Supreme deity of the Shemites.\n\nHence it was told to Moses when he was initiated at Hor-eb -- the cave -- under the direction of Jethro, the Kenite (or Cainite) priest of Midian.\n\nIn an old religion of the Chaldeans, whose remains are to be found among the Neo-Platonists, the highest divinity, enthroned above the seven heavens, representing the Spiritual Light-Principle .\n\n.\n\n.\n\n.\n\nand also conceived of as Demiurgus,* was called [[ Iao ]]( ), who was, like the Hebrew Yaha, mysterious and unmentionable, and whose name was communicated to the Initiated.\n\nThe Phoenicians had a Supreme God, whose name was trilateral and secret, and he was [[ Iao ]].\"** ( Isis Unveiled ) , Vol.\n\nII ., p.\n\n298.) The Cross, say the Kabalists, repeating the lesson of the Occultists, is one of the most ancient -- nay, perhaps, the most ancient of symbols.\n\nThis is demonstrated at the very beginning of the Proem (Vol.\n\nI.).\n\nThe Eastern Initiates show it coeval with the circle of Deific infinitude and the first differentiation of the Essence, the union of spirit and matter.\n\nThis was rejected, and the astronomical allegory alone was accepted and made to fit into cunningly imagined terrestrial events.\n\nLet us demonstrate this statement.\n\nIn astronomy, as said, Mercury is the son of Coelus and Lux -- of the sky and light, or the Sun; in mythology he is the progeny of Jupiter and Maia.\n\nHe is the \"messenger\" of his Father Jupiter, the Messiah of the Sun; in Greek, his name \"Hermes,\" means, among other things, the \"Interpreter\" -- the \"Word\" by mouth; the LOGOS, or VERBUM.\n\nNow, Mercury, besides being born on Mount Cyllene among shepherds, is the patron of the [[Footnote(s)]] ------------------------------------------------- * By very few though, for the creators of the material universe were always considered as subordinate gods to the Most High Deity.\n\n** Lydus I., c.\n\nLedrenus, I.\n\nc.\n\n[[Vol.\n\n2, Page]] 542 THE SECRET DOCTRINE.\n\nlatter.\n\nA psychopompic genius, he conducted the souls of the dead to Hades and brought them back, an office attributed to Jesus, after his death and resurrection.\n\nThe symbols of Hermes-Mercury ( Dii Termini ) were placed along and at the turning points of highways (as crosses are now placed in Italy) and they were cruciform.* Every seventh day the priests anointed these termini with oil, and once a year hung them with garlands, hence they were the anointed.\n\nMercury, when speaking through his oracles said, \"I am he whom you call the Son of the Father (Jupiter) and Maia.\n\nLeaving the King of Heaven (the Sun) I come to help you, mortals.\" Mercury heals the blind and restores sight, mental and physical.** He was often represented as three-headed and called \"Tricephalos,\" \"Triplex,\" as one with the Sun and Venus."


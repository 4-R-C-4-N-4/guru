body = "Change of diet, drunkenness, etc., etc., have done much; but those who rely on such data as offering an all-sufficient explanation of the crux, cannot meet the phalanx of facts now so closely arrayed.\n\n\"Nothing,\" says even the materialist Lefevre, \"can save those that have run their course .\n\n.\n\n.\n\n.\n\nIt would be necessary to extend their destined cycle .\n\n.\n\n.\n\n.\n\nThe peoples that have been most spared .\n\n.\n\n.\n\nHawaiians or Maories, have been no less decimated than the tribes massacred or tainted by European intrusion.\n\n\" (\" Philosophy, \" p.\n\n508.) True; but is not the phenomenon here confirmed of the operation of C YCLIC L AW difficult to account for on materialist lines?\n\nWhence the \"destined cycle\" and the order here testified to?\n\nWhy does this (Karmic) sterility attack and root out certain races at their \"appointed hour\"?\n\nThe answer that it is due to a \"mental disproportion\" between the colonizing and aboriginal races is obviously evasive, since it does not explain the sudden \" checks to fertility \" which so frequently supervene.\n\nThe dying out of the Hawaiians, for instance, is one of the most mysterious problems of the day.\n\nEthnology will sooner or later have to recognize with Occultists that the true solution has to be sought for in a comprehension of the workings of Karma.\n\nAs Lefevre remarks, \"the time is drawing near when there will remain nothing but three great human types\" (before the Sixth Root-Race dawns), the white (Aryan, Fifth Root-Race), the yellow, and the African negro -- with their crossings (Atlanto-European divisions).\n\nRedskins, Eskimos, Papuans, Australians, Polynesians, etc., etc.\n\n-- all are dying out.\n\nThose who realize that every Root-Race runs through a gamut of seven sub-races with seven branchlets, etc., will understand the \"why.\" The tide-wave of incarnating E GOS has rolled past them to harvest experience in more developed and less senile stocks; and their extinction is hence a Karmic necessity.\n\nSome extraordinary and unexplained statistics as to Race extinction are given in de Quatrefages' \" Human Species, \" p.\n\n428 et seq.\n\nNo solution, except on the occult lines, is able to account for these.\n\nBut we have digressed from our direct subject.\n\nLet us hear now what Professor Huxley has to say on the subject of former Atlantic and Pacific Continents.\n\nHe writes in \" N ATURE,\" Nov.\n\n4th, 1880: \"There is nothing, so far as I am aware, in the biological or geological evidence at present accessible, to render untenable the hypothesis that an area of the mid - [[Vol.\n\n2, Page]] 781 TRADITION AS TRUE AS HISTORY.\n\nAtlantic or Pacific sea-bed as big as Europe, should have been uplifted as high as Mont Blanc, and have subsided again, any time since the Palaeozoic epoch, if there were any grounds for entertaining it.\" That is to say, then, that there is nothing which can militate against positive evidence to the fact; nothing, therefore, against the geological postulates of the Esoteric Philosophy.\n\nDr.\n\nSeemann assures us in the \"Popular Science Review\" (Vol.\n\nV., p.\n\n18), article \" Australia and Europe formerly one Continent, \" * that: -- \"The facts which botanists have accumulated for reconstructing these lost maps of the globe are rather comprehensive; and they have not been backward in demonstrating the former existence of large tracts of solid land in parts now occupied by the great oceans.\n\nThe many striking points of contact between the present flora of the United States and Eastern Asia, induced them to assume that, during the present order of things, there existed a continental connection between South-Eastern Asia and Western America.\n\nThe singular correspondence of the present flora of the Southern United States with that of the lignite flora of Europe induces them to believe that, in the Miocene period, Europe and America were connected by a land passage, of which Iceland, Madeira, and the other Atlantic islands are remnants ; that, in fact, the story of an Atlantis, which an Egyptian priest told to Solon, is not purely fictitious, but rests on a solid historical basis .\n\n.\n\n.\n\n.\n\nEurope of the Eocene period received the plants which spread over mountains and plains, valleys and river-banks (from Asia generally), neither exclusively from the South nor from the East.\n\nThe west also furnished additions, and if at that period these were rather meagre, they show, at all events, that the bridge was already building, which, at a late period, was to facilitate communication between the two continents in such a remarkable manner.\n\nAt that time some plants of the Western Continent began to reach Europe by means of the island of Atlantis, then probably just rising (?) above the ocean.\" And in another number of the same review (Vol.\n\nI., p.\n\n143) Mr.\n\nDuppa Crotch, M.A ., F.L.S ., in an article entitled \" The Norwegian Lemming and its Migrations, \" alludes to the same subject.\n\n\"Is it probable that land could have existed where now the broad Atlantic rolls?\n\nAll tradition says so: old Egyptian records speak of Atlantis, as Strabo and others have told us.\n\nThe Sahara itself is the sand of an ancient sea, and the shells which are found upon its surface [[Footnote(s)]] ------------------------------------------------- * Undoubtedly a fact and a confirmation of the esoteric conception of the Lemuria which originally not only embraced great areas in the Indian and Pacific oceans, but projected round South Africa into the North Atlantic.\n\nIts Atlantic portion subsequently became the geological basis of the future home of the Fourth Race Atlanteans.\n\n[[Vol.\n\n2, Page]] 782 THE SECRET DOCTRINE.\n\nprove that, no longer ago than the Miocene period, a sea rolled over what is now desert.\n\nThe voyage of the 'Challenger' has proved the existence of three long ridges* in the Atlantic Ocean,** one extending for more than three thousand miles, and lateral spurs may, by connecting these ridges, account for the marvellous similarity of the fauna of the Atlantic islands.*** .\n\n.\n\n.\n\n.\n\nThe submerged continent of L EMURIA, in what is now the Indian Ocean, is considered to afford an explanation of many difficulties in the distribution of organic life, and, I think, the existence of a M IOCENE A TLANTIS will be found to have a strong elucidative bearing on subjects of greater interest [Truly So!] than the migration of the lemming.\n\nAt all events, if it can be shown that land existed in former ages where the North Atlantic now rolls, not only is a motive found for these apparently suicidal migrations, but also a strong collateral proof that what we call instincts are but the blind and sometimes even prejudicial inheritance of previously acquired experiences.\" (At certain periods, we learn, multitudes of these animals swim to sea and perish."


[content]
body = ", a fiery serpent, the Gnostic Agathodaemon probably.* As explained, the \"sacred animals\" and the Flames or \"Sparks\" within the \"Holy Four\" refer to the prototypes of all that is found in the Universe in the Divine Thought , in the R OOT, which is the perfect cube, or the foundation of the Kosmos collectively and individually.\n\nThey have all an occult reference to primordial Cosmic forms and its first concretions, work, and evolution.\n\nIn the earliest Hindu exoteric cosmogonies, it is not even the Demiurge who creates.\n\nFor it is said in one of the Puranas that: \"The great Architect of the World gives the first impulse to the rotatory motion of our planetary system by stepping in turn over each planet and body.\" It is this action \"that causes each sphere to turn around itself, and all around the Sun.\" After which action, \"it is the Brahmandica , the Solar and Lunar Pitris (the Dhyani-Chohans)\" who take charge of their respective spheres (earths and planets), to the end of the Kalpa.\" The Creators are the Rishis; most of whom are credited with the authorship of the mantras or Hymns of the Rig Veda.\n\nThey are sometimes seven, sometimes ten, when they become prajapati , the \"Lord of Beings\"; then they rebecome the seven and the fourteen Manus, as the representatives of the seven and fourteen cycles of Existence (\"Days of Brahma\"); thus answering to the seven AEons , when at the end of the first stage of Evolution they are transformed into the seven stellar Rishis, the Saptarishis; while their human doubles appear as heroes, Kings and Sages on this earth.\n\n[[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] when thou shalt have thirty three years of age thou wilt comprehend me.\" So with the mystery of the tortoise.\n\nRejoicing over the poetry of Biblical metaphors, associating with the name of Jehovah, \"incandescent stones,\" \"sacred animals,\" etc., and quoting from the Bible de Vence ( Vol.\n\nXIX.\n\np.\n\n318) a French pious writer says: \"Indeed all of them are Elohim like their God; for, these Angels assume, through a holy usurpation , the very divine name of Jehovah each time they represent him.\" ( Pneumatologie , Vol.\n\nII.\n\n, p .\n\n294).\n\nNo one ever doubted that the NAME must have been assumed , when under the guise of the Infinite, One Incognizable, the Malachim (messengers) descended to eat and drink with men.\n\nBut if the Elohim (and even lower Beings), assuming the god-name, were and are still worshipped, why should the same Elohim be called devils , when appearing under the names of other Gods?\n\n* The choice is curious, and shows how paradoxical were the first Christians in their selections.\n\nFor why should they have chosen these symbols of Egyptian paganism, when the eagle is never mentioned in the New Testament save once, when Jesus refers to it as a carrion eater?\n\n( Matt.\n\nxxiv.\n\n28); and in the Old Testament it is called unclean ; that the Lion is made a point of comparison with Satan, both roaring for men to devour; and the oxen are driven out of the Temple.\n\nOn the other hand the Serpent, brought as an exemplar of wisdom to follow, is now regarded as the symbol of the Devil.\n\nThe esoteric pearl of Christ's religion degraded into Christian theology, may indeed be said to have chosen a strange and unfitting shell to be born in and evolved from.\n\n[[Vol.\n\n1, Page]] 443 THE MYSTERY OF BLACKNESS.\n\nThe Esoteric doctrine of the East having thus furnished and struck the key-note -- which is as scientific as it is philosophical and poetical, as may be seen, under its allegorical garb -- every nation has followed its lead.\n\nIt is from the exoteric religions that we have to dig out the root-idea before we turn to esoteric truths, lest the latter should be rejected.\n\nFurthermore, every symbol -- in every national religion -- may be read esoterically, and the proof furnished for its being correctly read by transliterating it into its corresponding numerals and geometrical forms -- by the extraordinary agreement of all -- however much the glyphs and symbols may vary among themselves.\n\nFor in the origin those symbols were all identical.\n\nTake, for instance, the opening sentences in various cosmogonies: in every case it is either a circle , an egg , or a head.\n\nD ARKNESS is always associated with this first symbol and surrounds it, -- as shown in the Hindu, the Egyptian, the Chaldeo-Hebrew and even the Scandinavian systems -- hence black ravens, black doves, black waters and even black flames; the seventh tongue of Agni, the fire-god being called \" Kali ,\" \"the black,\" as it was a black flickering flame.\n\nTwo black doves flew from Egypt and settling on the oaks of Dodona, gave their names to the Grecian gods.\n\nNoah lets out a black raven after the deluge, which is a symbol for the Cosmic pralaya, after which began the real creation or evolution of our earth and humanity.\n\nOdin's black ravens fluttered around the Goddess Saga and \"whispered to her of the past and of the future.\" What is the real meaning of all those black birds?\n\nThey are all connected with the primeval wisdom, which flows out of the pre-cosmic Source of all, symbolised by the Head, the Circle, the Egg; and they all have an identical meaning and relate to the primordial Archetypal man (Adam Kadmon) the creative origin of all things, which is composed of the Host of Cosmic Powers -- the Creative Dhyan-Chohans, beyond which all is darkness.\n\nLet us inquire of the wisdom of the Kabala -- even veiled and distorted as it now is, -- to explain in its numerical language an approximate meaning, at least of the word \"raven.\" This is its number value as given in the \"Source of Measures.\" \"The term Raven is used but once, and taken as eth-h ' orebv , = 678, or 113 x 6; while the Dove is mentioned five times.\n\nIts value is 71, and 71 x 5 = 355.\n\nSix diameters, or the raven , crossing, would divide the circumference of a circle of 355 into 12 parts or compartments; and 355 subdivided for each unit by 6, would equal 213-0, or the head (\"beginning\") in the first verse of Genesis.\n\nThis divided or subdivided, after the same fashion, by 2, or the 355 by 12, would give 213-2, or the word B ' rash , , or the first word of Genesis, with its prepositional prefix, signifying the same concreted general form [[Vol.\n\n1, Page]] 444 THE SECRET DOCTRINE."


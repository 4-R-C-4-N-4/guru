[content]
body = "In this \"Infinity\" of the full Initiate there is neither height, breadth nor thickness, but all is fathomless profundity, reaching down from the physical to the \"para-para-metaphysical.\" In using the word \"down,\" essential depth -- \"nowhere and everywhere\" -- is meant, not depth of physical matter.\n\nIf one searches carefully through the exoteric and grossly anthropomorphic allegories of popular religions, even in these the doctrine embodied in the circle of \"Pass-Not\" thus guarded by the Lipika, may be dimly perceived.\n\nThus one finds it even in the teachings of [[Vol.\n\n1, Page]] 132 THE SECRET DOCTRINE.\n\nthe Vedantin sect of the Visishtadwaita, the most tenaciously anthropomorphic in all India.\n\nFor we read of the released soul that: -- After reaching Moksha (a state of bliss meaning \"release from Bandha\" or bondage), bliss is enjoyed by it in a place called P ARAMAPADHA, which place is not material, but made of Suddasatwa (the essence, of which the body of Iswara -- \"the Lord\" -- is formed).\n\nThere, Muktas or Jivatmas (Monads) who have attained Moksha, are never again subject to the qualities of either matter or Karma.\n\n\"But if they choose, for the sake of doing good to the world , they may incarnate on Earth.\"* The way to Paramapadha, or the immaterial worlds, from this world, is called Devayana.\n\nWhen a person has attained Moksha and the body dies: -- \"The Jiva (Soul) goes with Sukshma Sarira** from the heart of the body, to the Brahmarandra in the crown of the head, traversing Sushumna, a nerve connecting the heart with the Brahmarandra.\n\nThe Jiva breaks through the Brahmarandra and goes to the region of the Sun (Suryamandala) through the solar Rays.\n\nThen it goes, through a dark spot in the Sun, to Paramapadha.\n\nThe Jiva is directed on its way by the Supreme Wisdom acquired by Yoga.*** The Jiva thus proceeds to Paramapadha by the aid of Athivahikas (bearers in transit), known by the names of Archi-Ahas .\n\n.\n\n.\n\nAditya, Prajapati, etc.\n\nThe Archis here mentioned are certain pure Souls, etc., etc.\" (Visishtadwaita Catechism, by Pundit Bhashyacharya, F.T.S .) No Spirit except the \"Recorders\" (Lipika) has ever crossed its forbidden line, nor will any do so until the day of the next Pralaya, for it is the boundary that separates the finite -- however infinite in man's sight -- from the truly I NFINITE.\n\nThe Spirits referred to, therefore, as those who \"ascend and descend\" are the \"Hosts\" of what we loosely call \"celestial Beings.\" But they are, in fact, nothing of the kind.\n\n[[Footnote(s)]] ------------------------------------------------- * These voluntary re-incarnations are referred to in our Doctrine as Nirmanakayas (the surviving spiritual principles of men).\n\n** Sukshma-sarira, \"dream-like\" illusive body, with which are clothed the inferior Dhyanis of the celestial Hierarchy.\n\n*** Compare this esoteric tenet with the Gnostic doctrine found in \"Pistis-Sophia\" (Knowledge = Wisdom), in which treatise Sophia Achamoth is shown lost in the waters of Chaos (matter), on her way to Supreme Light, and Christos delivering and helping her on the right Path.\n\nNote well, \"Christos\" with the Gnostics meant the impersonal principal, the Atman of the Universe, and the Atma within every man's soul -- not Jesus; though in the old Coptic MSS .\n\nin the British Museum \"Christos\" is almost constantly replaced by \"Jesus.\" [[Vol.\n\n1, Page]] 133 THE GOD OF MAN AND THE GOD OF THE ANT.\n\nThey are Entities of the higher worlds in the hierarchy of Being, so immeasurably high that, to us, they must appear as Gods, and collectively -- G OD.\n\nBut so we, mortal men, must appear to the ant, which reasons on the scale of its special capacities.\n\nThe ant may also, for all we know, see the avenging finger of a personal God in the hand of the urchin who, in one moment, under the impulse of mischief, destroys its anthill, the labour of many weeks -- long years in the chronology of insects.\n\nThe ant, feeling it acutely, and attributing the undeserved calamity to a combination of Providence and sin, may also, like man, see in it the result of the sin of its first parent.\n\nWho knows and who can affirm or deny?\n\nThe refusal to admit in the whole Solar system of any other reasonable and intellectual beings on the human plane, than ourselves, is the greatest conceit of our age.\n\nAll that science has a right to affirm, is that there are no invisible Intelligences living under the same conditions as we do.\n\nIt cannot deny point-blank the possibility of there being worlds within worlds, under totally different conditions to those that constitute the nature of our world; nor can it deny that there may be a certain limited communication* between some of those worlds and our own.\n\nTo the highest, we are taught, belong the seven orders of the purely divine Spirits; to the six lower ones belong hierarchies that can occasionally be seen and heard by men, and who do communicate with their progeny of the Earth; which progeny is indissolubly linked with them, each principle in man having its direct source in the nature of those great Beings, who furnish us with the respective invisible elements in us.\n\nPhysical Science is welcome to speculate upon the physiological mechanism of living beings, and to continue her fruitless efforts in trying to resolve our feelings, our sensations, mental and spiritual, into functions of their inorganic vehicles.\n\nNevertheless, all that will ever be accomplished in this direction has already been done, and Science will go no farther.\n\n[[Footnote(s)]] ------------------------------------------------- * The greatest philosopher of European birth, Imanuel Kant, assures us that such a communication is in no way improbable.\n\n\"I confess I am much disposed to assert the existence of Immaterial natures in the world, and to place my own soul in the class of these beings.\n\nIt will hereafter, I know not where, or when, yet be proved that the human soul stands even in this life in indissoluble connection with all immaterial natures in the spirit-world, that it reciprocally acts upon these and receives impressions from them.\" (Traume eines Geistersehers, quoted by C.\n\nC.\n\nMassey, in his preface to Von Hartmann's \"Spiritismus.\") [[Vol.\n\n1, Page]] 134 THE SECRET DOCTRINE."


[content]
body = "produced seven men in accordance with the seven natures of the Seven Spirits\" \"having in them, potentially, the two sexes.\" Metaphysically, the Father and the Son are the \"Universal Mind\" and the \"periodical Universe\"; the \"Angel\" and the \"Man.\" It is the S ON and the F ATHER at one and the same time; in Pymander, the active IDEA and the passive THOUGHT that generates it; the radical key-note in Nature which gives birth to the seven notes -- the septenary scale of the creative Forces, and to the seven prismatic aspects of colour, all born from the one white ray, or L IGHT -- itself generated in DARKNESS.\n\n------ [[This page continued in next section.]]"


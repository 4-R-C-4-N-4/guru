[content]
body = "As the Babylonian accounts are now only restored from hundreds of thousands of broken fragments (the mound of Kouyunjik alone having yielded to Layard's excavations over twenty thousand fragments of inscriptions), the proofs here cited are comparatively scanty; yet such as they are, they corroborate almost every one of our teachings, certainly three, at least.\n\nThese are: -- (1.) That the race which was the first to fall into generation was a dark Race ( Zalmat Gaguadi ) , which they call the Adami or dark Race, and that Sarku, or the light Race, remained pure for a long while subsequently.\n\n(2.) That the Babylonians recognised two principal Races at the time of the Fall, the Race of the Gods (the Ethereal doubles of the Pitris ), having preceded these two.\n\nThis is Sir H.\n\nRawlinson's opinion.\n\nThese \"Races\" are our second and third Root-races.\n\n(3) That these seven Gods, each of whom created a man, or group of men, were \"the gods imprisoned or incarnated.\" These gods were: the god Zi; the god Ziku (noble life, Director of purity); the god Mirku (noble crown) \"Saviour from death of the gods\" (later on) imprisoned, and the creator of \"the dark Race which his hand has made;\" the god Libzu \"wise among the gods\"; the god Nissi .\n\n.\n\n.\n\n.\n\nand the god Suhhab; and Hea or Sa, their synthesis, the god of wisdom and of the Deep, identified with Oannes-Dagon, at the time of the fall, and called (collectively) the Demiurge, or Creator.\n\n( See Chaldean Account Genesis, p.\n\n82.) There are two \"Creations\" so called, in the Babylonian fragments, and Genesis having adhered to this, one finds its first two chapters distinguished as the Elohite and the Jehovite creations.\n\nTheir proper order, however, is not preserved in these or in any other exoteric accounts.\n\nNow these \"Creations,\" according to the occult teachings, refer respectively to the formation of the primordial seven men by the progenitors (the Pitris, or Elohim): and to that of the human groups after the fall.\n\n[[Footnote(s)]] ------------------------------------------------- * See Pliny, 4, c.\n\n12; Strabo, 10; Herodotus, 7, c.\n\n108; Pausanias, 7, c.\n\n4, etc.\n\n[[Vol.\n\n2, Page]] 6 THE SECRET DOCTRINE.\n\nAll this will be examined in the light of science and comparisons drawn from the scriptures of all the ancient nations, the Bible included, as we proceed.\n\nMeanwhile, before we turn to the Anthropogenesis of the prehistoric Races, it may be useful to agree upon the names to be given to the Continents on which the four great Races, which preceded our Adamic Race, were born, lived, and died.\n\nTheir archaic and esoteric names were many, and varied with the language of the nationality which mentioned them in its annals and scriptures.\n\nThat which in the Vendidad, for instance, is referred to as Airyanem Vaego ( see Bund.\n\n79, 12) wherein was born the original Zoroaster,* is called in the Puranic literature \"Sveta-Dwipa,\" \"Mount Meru,\" the abode of Vishnu, etc., etc.; and in the Secret Doctrine is simply named the land of the \"Gods\" under their chiefs the \"Spirits of this Planet.\" Therefore, in view of the possible, and even very probable confusion, that may arise, it is considered more convenient to adopt, for each of the four Continents constantly referred to, a name more familiar to the cultured reader.\n\nIt is proposed, then, to call the first continent, or rather the first terra firma on which the first Race was evolved by the divine progenitors: -- I.\n\n\"The Imperishable Sacred Land.\" The reasons for this name are explained as follows: This \"Sacred Land\" -- of which more later on -- is stated never to have shared the fate of the other continents; because it is the only one whose destiny it is to last from the beginning to the end of the Manvantara throughout each Round.\n\nIt is the cradle of the first man and the dwelling of the last divine mortal, chosen as a Sishta for the future seed of humanity.\n\nOf this mysterious and sacred land very little can be said, except, perhaps, according to a poetical expression in one of the Commentaries, that the \"pole-star has its watchful eye upon it, from the dawn to the close of the twilight of 'a day' of the GREAT BREATH.\"** [[Footnote(s)]] ------------------------------------------------- * By \"original\" we mean the \"Amshaspend,\" called \"Zarathustra, the lord and ruler of the Vara made by Yima in that land.\" There were several Zarathustra or Zertusts, the Dabistan alone enumerating thirteen; but these were all the reincarnations of the first one.\n\nThe last Zoroaster was the founder of the Fire temple of Azareksh and the writer of the works on the primeval sacred Magian religion destroyed by Alexander.\n\n** In India called \"The Day of Brahma.\" [[Vol.\n\n2, Page]] 7 HYPERBOREAS AND LEMURIA.\n\nII.\n\nThe \" H YPERBOREAN\" will be the name chosen for the Second Continent, the land which stretched out its promontories southward and westward from the North Pole to receive the Second Race, and comprised the whole of what is now known as Northern Asia.\n\nSuch was the name given by the oldest Greeks to the far-off and mysterious region, whither their tradition made Apollo the \"Hyperborean\" travel every year.\n\nAstronomically, Apollo is of course the Sun, who, abandoning his Hellenic sanctuaries, loved to visit annually his far-away country, where the Sun was said never to set for one half of the year.\n\n[[ Eggus gar nuktos te kai ematos eisi keleuthoi ]], says a verse in the Odyssey (x.\n\n86).\n\nBut historically, or better, perhaps, ethnologically and geologically, the meaning is different.\n\nThe land of the Hyperboreans, the country that extended beyond Boreas, the frozen-hearted god of snows and hurricanes, who loved to slumber heavily on the chain of Mount Riphaeus, was neither an ideal country, as surmised by the mythologists, nor yet a land in the neighbourhood of Scythia and the Danube.* It was a real Continent, a bona-fide land which knew no winter in those early days, nor have its sorry remains more than one night and day during the year, even now.\n\nThe nocturnal shadows never fall upon it, said the Greeks; for it is the land of the Gods, the favourite abode of Apollo, the god of light, and its inhabitants are his beloved priests and servants."


[content]
body = "But whether, again, the deterioration produced in the populations of La Vezere was the result of violent crossings, or of a general retreat northwards in the wake of the reindeer, is of little moment to us.\" He continues: -- \"Meantime the bed of the ocean has been upheaved, Europe is now fully formed, her flora and fauna fixed.\n\nWith the taming of the dog begins the pastoral life.\n\nWe enter on those polished stone and bronze periods, which succeed each other at irregular intervals, which even overlap one another in the midst of ethnical fusions and migrations.\n\n.\n\n.\n\n.\n\nThe primitive European populations are interrupted in their special evolution and, without perishing, become absorbed in other races, engulfed .\n\n.\n\n.\n\nby successive waves of migration overflowing from Africa, possibly from a lost Atlantis [??\n\nfar too late by aeons of years] and from prolific Asia .\n\n.\n\n.\n\nall FORERUNNERS OF THE GREAT A RYAN I NVASION\" (Fifth Race).\n\n[[Footnote(s)]] ------------------------------------------------- * The artistic skill displayed by the old cave-men renders the hypothesis which regards them as approximations to the \"pithecanthropus alalus\" -- that very mythical Haeckelian monster -- an absurdity requiring no Huxley or Schmidt to expose it.\n\nWe see in their skill in engraving a gleam of Atlantean culture atavistically re-appearing.\n\nIt will be remembered that Donnelly regards modern European as a renaissance of Atlantean civilization.\n\n(\"Atlantis,\" pp.\n\n237-264.) -------"


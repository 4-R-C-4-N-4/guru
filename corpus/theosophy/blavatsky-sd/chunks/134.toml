body = "The 'Ideal Forms' are the archetypal or formative ideas of the Neo-Platonists; the eternal and subjective concepts of things subsisting in the divine mind prior to 'becoming'\" (p.\n\n134).\n\n[[Vol.\n\n1, Page]] 282 THE SECRET DOCTRINE.\n\nfrom which all things proceed, while the author of the \"Philosophy of the Unconscious\" has come (in this respect only) as near to a solution of the great Mystery as mortal man can.\n\nFew were those, whether in ancient or mediaeval philosophy, who have dared to approach the subject or even hint at it.\n\nParacelsus mentions it inferentially.\n\nHis ideas are admirably synthesized by Dr.\n\nF.\n\nHartmann, F.T.S., in his \"Life of Paracelsus.\" All the Christian Kabalists understood well the Eastern root idea: The active Power, the \"Perpetual motion of the great Breath\" only awakens Kosmos at the dawn of every new Period, setting it into motion by means of the two contrary Forces,* and thus causing it to become objective on the plane of Illusion.\n\nIn other words, that dual motion transfers Kosmos from the plane of the Eternal Ideal into that of finite manifestation, or from the Noumenal to the Phenomenal plane.\n\nEverything that is, was, and will be , eternally IS, even the countless forms, which are finite and perishable only in their objective, not in their ideal Form.\n\nThey existed as Ideas, in the Eternity,** and, when they pass away, will exist as reflections.\n\nNeither the form of man, nor that of any animal, plant or stone has ever been created, and it is only on this plane of ours that it commenced \"becoming,\" i.e., objectivising into its present materiality, or expanding from within outwards, from the most sublimated and supersensuous essence into its grossest appearance.\n\nTherefore our human forms have existed in the Eternity as astral or ethereal prototypes; according to which models, the Spiritual Beings (or Gods) whose duty it was to bring them into objective being and terrestrial Life, evolved the protoplasmic forms of the future Egos from their own essence.\n\nAfter which, when this human Upadhi, or basic mould was ready, the natural terrestrial Forces began to work on those supersensuous moulds which contained, besides their own, the elements of all the past vegetable and future animal forms of this globe in them.\n\nTherefore, man's outward shell passed through every vegetable and animal body before it assumed the human shape.\n\nAs this will be fully [[Footnote(s) -------------------------------------------------]] * The centripetal and the centrifugal forces, which are male and female, positive and negative, physical and spiritual, the two being the one Primordial Force.\n\n** Occultism teaches that no form can be given to anything, either by nature or by man, whose ideal type does not already exist on the subjective plane.\n\nMore than this; that no such form or shape can possibly enter man's consciousness, or evolve in his imagination, which does not exist in prototype, at least as an approximation.\n\n[[Vol.\n\n1, Page]] 283 PARACELSUS ANTICIPATED TYNDALL.\n\ndescribed in Book II., with the Commentaries thereupon, there is no need to say more of it here.\n\nAccording to the Hermetico-Kabalistic philosophy of Paracelsus, it is Yliaster -- the ancestor of the just-born Protyle, introduced by Mr.\n\nCrookes in chemistry -- or primordial Protomateria that evolved out of itself the Kosmos.\n\n\"When Evolution took place the Yliaster divided itself.\n\n.\n\n.\n\n.\n\nmelted and dissolved, developing from within itself the Ideos or Chaos, called re spectively Mysterium magnum, Iliados, Limbus Major, or Primordial Matter.\n\nThis Primordial essence is of a monistic nature, and manifests itself not only as vital activity, a spiritual force, an invisible, incomprehensible, and indescribable power, but also as vital matter of which the substance of living beings consists.\" In this Ideos of primordial matter, or the proto-ilos -- which is the matrix of all created things -- is contained the substance from which everything is formed.\n\nIt is the Chaos .\n\n.\n\n.\n\nout of which the Macrocosm, and, later on, by evolution and division in Mysteria Specialia,* each separate being, came into existence.\n\n\"All things and all elementary substances were contained in it in potentia but not in actu \" -- which makes the translator, Dr.\n\nF.\n\nHartmann, justly observe that \"it seems that Paracelsus anticipated the modern discovery of the 'potency of matter' three hundred years ago\" (P.\n\n42).\n\nThis Magnus Limbus, then, or Yliaster of Paracelsus, is simply our old friend \"Father-Mother,\" within, before it appeared in Space, of the second and other Stanzas.\n\nIt is the universal matrix of Kosmos, personified in the dual character of Macro- and Microcosm (or the Universe and our Globe)** by Aditi-Prakriti, the Spiritual and the physical nature.\n\nFor we find it explained in Paracelsus that \"the Magnus Limbus is the nursery out of which all creatures have grown, in the same sense as a tree grows out of a small seed; with the difference, however, that the great Limbus takes its origin from the Word, while the Limbus minor (the terrestrial seed or sperm) takes it from the earth.\n\n[[Footnote(s) -------------------------------------------------]] * This word is explained by Dr.\n\nHartmann from the original texts of Paracelsus before him, as follows.\n\nAccording to this great Rosicrucian: \"Mysterium is everything out of which something may be developed, which is only germinally contained in it.\n\nA seed is the 'Mysterium' of a plant, an egg that of a living bird, etc.\" ** It is only the mediaeval Kabalists who, following the Jewish and one or two Neo-Platonists, applied the term Microcosm to man.\n\nAncient philosophy called the Earth the Microcosm of the Macrocosm, and man the outcome of the two.\n\n[[Vol.\n\n1, Page]] 284 THE SECRET DOCTRINE.\n\nThe great Limbus is the seed out of which all beings have come, and the little Limbus is each ultimate being that reproduces its form, and that has itself been produced by the 'great.' The latter possesses all the qualifications of the great one, in the same sense as a son has an organization similar to that of his father.\" ( See Comment.\n\nBook II.\n\npara.\n\niii.\n\n) .\n\n.\n\n.\n\n\"As Yliaster dissolved, Ares, the dividing, differentiating, and individualising power ( Fohat, another old friend,) .\n\n.\n\n.\n\nbegan to act.\n\nAll production took place in consequence of separation."


body = "And this is metempsychosis ( See \" Mineral Monad \" in \" Five Years of Theosophy ,\" p.\n\n276).\n\nThis fifth stage of evolution, called exoterically \"Creation,\" may be viewed in both the Primary and Secondary periods, one as the Spiritual and Cosmic, the other as the material and terrestrial.\n\nIt is Archibiosis , or life-origination -- \"origination,\" so far, of course, as the manifestation of life on all the seven planes is concerned.\n\nIt is at this period of Evolution that the absolutely eternal universal motion, or vibration, that which is called in Esoteric language \"the GREAT BREATH,\" differentiates in the primordial, first manifested ATOM.\n\nMore and more, as chemical and physical sciences progress, does this occult axiom find its corroboration in the world of knowledge: the scientific hypothesis, that even the simplest elements of matter are identical in nature and differ from each other only owing to the variety of the distributions of atoms in the molecule or speck of substance, or by the modes of its atomic vibration , gains every day more ground.\n\nThus, as the differentiation of the primordial germ of life has to precede the evolution of the Dhyan Chohan of the third group or hierarchy of Being in Primary Creation, before those \"gods\" can become rupa (embodied in their first ethereal form), so animal creation has to precede , [[Footnote(s)]] ------------------------------------------------- * Professor Wilson translates it, as though animals were higher on the scale of \"creation\" than divinities, or angels, although the truth about the devas is very plainly stated further on.\n\nThis \"creation,\" says the text, is both primary ( Prakrita ) and secondary ( Vaikrita ) .\n\nIt is the latter, as regards the origin of the gods from Brahma (the personal anthropomorphic creator of our material universe); it is the former ( primary ) as affecting Rudra, who is the immediate production of the first principle.\n\nRudra is not alone a title of Siva, but embraces agents of creation, angels and men, as will be shown further on.\n\n** Neither plant nor animal, but an existence between the two.\n\n[[Vol.\n\n1, Page]] 456 THE SECRET DOCTRINE.\n\nfor that same reason, divine MAN on earth.\n\nAnd this is why we find in the Puranas: \"The fifth, the Tairyagyonya creation, was that of animals, and -- (VI).\n\nThe Urdhvasrotas creation, or that of divinities ( Vishnu Purana Book I.\n\nchap.\n\ni.\n\n) .\n\nBut these (divinities) are simply the prototypes of the First Race, the fathers of their \"mind-born\" progeny with the soft bones.* It is these who became the Evolvers of the \"Sweat-born\" -- an expression explained in Book II.\n\nFinally, the sixth \"Creation\" is followed, and \" Creation in general, closed by -- (VII.) The evolution of the \" Arvaksrotas beings, which was the seventh, and was that of man\" ( Vishnu Purana , Book I.\n\n) .\n\nThe \"eighth creation\" mentioned is no Creation at all; it is a blind again, for it refers to a purely mental process: the cognition of the \"ninth\" creation, which, in its turn, is an effect, manifesting in the secondary of that which was a \"Creation\" in the Primary ( Prakrita ) Creation.** The Eighth , then, called Anugraha (the Pratyayasarga or the intellectual creation of the Sankhyas, explained in Karika , v.\n\n46, p.\n\n146), is \"that creation of which we have a perception \" -- in its esoteric aspect -- and \"to which we give intellectual assent (Anugraha) in contradistinction to organic creation.\n\n\" It is the correct perception of our relations to the whole range of \"gods\" and especially of those we bear to the Kumaras -- the so-called \"Ninth Creation\" -- which is in reality an aspect of or reflection of the sixth in our manvantara (the Vaivasvata).\n\n\"There is a ninth , the Kumara Creation, which is both primary and secondary,\" says Vishnu Purana , the oldest of such texts.*** \"The Kumaras ,\" explains an esoteric text, [[Footnote(s)]] ------------------------------------------------- * \"Created beings\" -- explains Vishnu Purana -- \"although they are destroyed (in their individual forms) at the periods of dissolution, yet being affected by the good or evil acts of former existences , are never exempted from their consequences.\n\nAnd when Brahma produces the world anew, they are the progeny of his will .\n\n.\n\n.\" \" Collecting his mind into itself ( Yoga willing), Brahma creates the four orders of beings, termed gods, demons, progenitors , and MEN \" .\n\n.\n\n.\n\n\"progenitors\" meaning the prototypes and Evolvers of the first Root Race of men.\n\nThe progenitors are the Pitris, and are of seven classes.\n\nThey are said in exoteric mythology to be born of Brahma ' s side , like Eve from the rib of Adam.\n\n** \"These notions,\" remarks Dr.\n\nWilson, \"the birth of Rudra and the saints, seem to have been borrowed from the Saivas, and to have been awkwardly engrafted upon the Vaishnava system.\" The esoteric meaning ought to have been consulted before venturing such a hypothesis.\n\n*** Parasara, the Vedic Rishi, who received the Vishnu Purana from Pulastya and taught it to Maitreya, is placed by the Orientalists at various epochs.\n\nAs correctly observed, in the Hindu Class.\n\nDict: -- \"Speculations as to his era differ widely from 575 B.C.\n\nto 1391 B.C ., and cannot be trusted.\n\n\" Quite so; but no less, however, than any other date as assigned by the Sanskritists, so famous in this department of arbitrary fancy.\n\n[[Vol.\n\n1, Page]] 457 WHO THE KUMARAS ARE.\n\n\"are the Dhyanis, derived immediately from the supreme Principle, who reappear in the Vaivasvata Manu period, for the progress of mankind.\"* The commentator of the Vishnu Purana corroborates it, by remarking that \"these sages live as long as Brahma; and they are only created by him in the first Kalpa, although their generation is very commonly and inconsistently introduced in the Varaha , or Padma Kalpa\" (the secondary).\n\nThus, the Kumaras are, exoterically, \"the creation of Rudra or Nilalohita, a form of Siva, by Brahma, and of certain other mind-born sons of Brahma."


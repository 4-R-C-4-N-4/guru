body = "The \"mystery\" of the woman and of the beast, are the symbols of soul-killing Churchianity and of S UPERSTITION.\n\n\"The beast that was, and is not, and yet is.\" \"And here is the Mind which hath wisdom.\n\nThe seven heads are seven mountains (seven continents and seven races) on which the woman sitteth,\" the symbol of all the exoteric, barbarous, idolatrous faiths which have covered that symbol \"with the blood of the saints and the blood of the martyrs\" who protested and do protest.\n\n\"And there are seven Kings (seven races); five are fallen (our fifth race included), and one is (the fifth continues), and the other (the sixth and the seventh races) is not yet come.\n\n.\n\n.\n\n.\n\nAnd when he (the race \"King\") cometh, he must continue a short space\" (v.\n\n10).\n\nThere are many such Apocalyptic allusions, but the student has to find them out for himself.\n\nThese five Kings were mentioned before.\n\nIf the Bible combines with archaeology and geology to show that human civilization has passed through three more or less distinct stages, in Europe at least; and if man, both in America and Europe, as much as in Asia, dates from geological epochs -- why should not the statements of the Secret Doctrine be taken into consideration?\n\nIs it more philosophical or logical and scientific too, to disbelieve, with Mr.\n\nAlbert Gaudry, in Miocene man, while believing that the famous Thenay flints* \"were carved by the Dryopithecus monkey \"; or, with the Occultist, that the anthro- [[Footnote(s)]] ------------------------------------------------- * \"The flints of Thenay bear unmistakable trace of the work of human hands.\" ( G.\n\nde Mortillet, \" Promenades au Musee de St.\n\nGermain, \" p.\n\n76.) [[Vol.\n\n2, Page]] 749 THE APE LATER THAN MAN.\n\npomorphous monkey came ages after man?\n\nFor if it is once conceded, and even scientifically demonstrated, that \"there was not in the middle of the Miocene epoch a single species of mammal identical with species now extant\" (Albert Gaudry \" Les Enchainements du monde animal dans les temps geologiques \" p.\n\n240); and that man was then just as he is now; only taller, and more athletic than we are,* -- then where is the difficulty?\n\nThat they could hardly be the descendants of monkeys, which are themselves not traced before the Miocene epoch,** is, on the other hand, testified to by several eminent naturalists.\n\n\"Thus, in the savage of quaternary ages who had to fight against the mammoth with stone weapons, we find all those craniological characters generally considered as the sign of great intellectual development\" ( de Quatrefages, \" The Human Species, p.\n\n312.) Unless man emerged spontaneously, endowed with all his intellect and wisdom, from his brainless catarrhine ancestor, he could not have acquired such brain within the limits of the Miocene period, if we are to believe the learned Abbe Bourgeois ( Vide infra, footnote**).\n\nAs to the matter of giants, though the tallest man hitherto found in Europe among fossils is the \"Mentone man\" (6 ft.\n\n8 in.), others may yet be excavated.\n\nNilsson, quoted by Lubbock, states that \"in a tomb of the neolithic age .\n\n.\n\n.\n\n.\n\na skeleton of extraordinary size was found in 1807,\" and that it was attributed to a king of Scotland, Albus McGaldus.\n\nAnd if in our own day we occasionally find men and women from 7 ft.\n\nto even 9 ft.\n\nand 11 ft.\n\nhigh, this only proves -- on the law of atavism, or the reappearance of ancestral features of character -- that there was a time when 9 ft.\n\nand 10 ft.\n\nwas the average height of humanity, even in our latest Indo-European race.\n\nBut as the subject was sufficiently treated elsewhere, we may pass on to the Lemurians and the Atlanteans, and see what the old Greeks knew of these early races and what the moderns know now.\n\nThe great nation mentioned by the Egyptian priests, from which descended the forefathers of the Greeks of the age of Troy, and which, as averred, had been destroyed by the Atlantic race, was then, as we see, assuredly no race of Palaeolithic savages.\n\nNevertheless, already in the days of Plato, with the exception of priests and Initiates, no one seems [[Footnote(s)]] ------------------------------------------------- * Speaking of the reindeer hunters of Perigord, Joly says of them that \"they were of great height, athletic, with a strongly built skeleton .\n\n.\n\n.\" etc.\n\n(\" Man before Metals, \" p.\n\n353) .\n\n** \"On the shores of the lake of Beauce,\" says the Abbe Bourgeois, \"man lived in the midst of a fauna which completely disappeared ( Aceratherium, Tapir, Mastodon ) .\n\nWith the fluviatile sands of Orleanais came the anthropomorphous monkey (pliopithecus antiquus); therefore, later than man.\" ( See Comptes Rendus of the \" Prehistoric Congress \" of 1867 at Paris.\n\n) [[Vol.\n\n2, Page]] 750 THE SECRET DOCTRINE.\n\nto have preserved any distinct recollection of the preceding races.\n\nThe earliest Egyptians had been separated from the latest Atlanteans for ages upon ages; they were themselves descended from an alien race, and had settled in Egypt some 400,000 years before,* but their Initiates had preserved all the records.\n\nEven so late as the time of Herodotus, they had still in their possession the statues of 341 kings who had reigned over their little Atlanto-Aryan Sub-race ( Vide about the latter \" Esoteric Buddhism, \" p.\n\n66, Fifth Edition.) If one allows only twenty years as an average figure for the reign of each King, the duration of the Egyptian Empire has to be pushed back, from the day of Herodotus, about 17,000 years.\n\nBunsen allowed the great Pyramid an antiquity of 20,000 years.\n\nMore modern archaeologists will not give it more than 5,000, or at the utmost 6,000 years; and generously concede to Thebes with its hundred gates, 7,000 years from the date of its foundation.\n\nAnd yet there are records which show Egyptian priests -- Initiates -- journeying in a North-Westerly direction, by land, via what became later the Straits of Gibraltar; turning North and travelling through the future Phoenician settlements of Southern Gaul; then still further North, until reaching Carnac (Morbihan) they turned to the West again and arrived, still travelling by land, on the North-Western promontory of the New Continent.** What was the object of their long journey?\n\nAnd how far back must we place the date of such visits?"


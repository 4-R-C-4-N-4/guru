body = "Now it is a mysterious fact that in the higher and now terrestrial Vertebrata .\n\n.\n\n.\n\nmany normal and abnormal processes have one or more weeks (septenates) as their periods .\n\n.\n\n.\n\nsuch as gestation of mammals, the duration of fevers,\" etc.\n\n.\n\n.\n\n\"The eggs of the pigeon are hatched in two weeks (or 14 days); those of the fowl in three; those of the duck in four: those of the goose in five; and those of the ostrich in seven.\" (Bartlett's \"Land and Water.\") This number is closely connected with the moon, whose occult influence is ever manifesting itself in septenary periods.\n\nIt is the moon which is the guide of the occult side of terrestrial nature, while the Sun is the regulator and factor of manifested life; (See also Vol.\n\nI., Part II .), and this truth was ever evident to the Seers and the adepts.\n\nJacob Boehme, by insisting on the fundamental doctrine of the seven properties of everlasting mother Nature, proved himself thereby a great Occultist.\n\nBut to return to the consideration of the septenary in ancient religious symbolism.\n\nTo the metrological key to the symbolism of the Hebrews, which reveals numerically the geometrical relations of the Circle (All-Deity) to the Square, Cube, Triangle, and all the integral emanations of the divine area, may be added the theogonic Key.\n\nThis Key explains that Noah, the deluge-Patriarch, is in one aspect the permutation of the Deity (the Universal Creative Law), for the purpose of the formation of our Earth, its population, and the propagation of life on it, in general.\n\nNow bearing in mind the Septenary division in divine Hierarchies, as in Cosmic and human constitutions, the student will readily understand that Jah-Noah is at the head of, and is the synthesis of the lower Cosmic Quaternary.\n\nThe upper Sephirothal , triad -- of which Jehovah-Binah (Intelligence) is the left, female angle -- emanates the Quaternary.\n\nThe latter symbolizing by itself the \"Heavenly Man,\" the sexless Adam-Kadmon viewed as Nature in the abstract, becomes a septenate again by emanating from itself the additional three principles, the lower terrestrial or manifested physical Nature, Matter and our Earth (the seventh being Malkuth, the \"Bride of the Heavenly Man\"), thus forming, with the higher triad, or Kether, the Crown, the full number of the Sephirothal Tree -- the 10, the Total in Unity, or the Universe.\n\nApart from the higher Triad, the lower creative Sephiroth are seven.\n\nThe above is not directly to our point, though it is a necessary [[Vol.\n\n2, Page]] 596 THE SECRET DOCTRINE.\n\nreminder to facilitate the comprehension of what follows.\n\nThe question at issue is to show that Jah-Noah, or the Jehovah of the Hebrew Bible, the alleged Creator of our Earth, of man and all upon it, is: -- ( a ) The lowest Septenary, the Creative Elohim -- in his Cosmic aspect.\n\n( b ) The Tetragrammaton or the Adam-Kadmon, \"the Heavenly Man\" of the Four letters -- in his theogonic and Kabalistic aspects.\n\n( c ) Noah -- identical with the Hindu Sishta, the human seed, left for the peopling of the Earth from a previous creation or Manvantara, as expressed in the Puranas, or the pre-diluvian period as rendered allegorically in the Bible -- in his Cosmic character.\n\nBut whether a Quaternary (Tetragrammaton) or a Triad, the Bible Creative God is not the Universal 10, unless blended with A IN- S OPH (as Brahma with Parabrahm), but a septenary, one of the many Septenaries of the Universal Septenate.\n\nIn the explanation of the question now in hand, his position and status as Noah may best be shown by placing the 3, ,and 4, on parallel lines with the \"Cosmic\" and \"Human\" principles.\n\nFor the latter, the old familiar classification is made use of.\n\nThus: -- As an additional demonstration of the statement, let the reader turn to scientific works.\n\n\" Ararat = the mount of descent = , Hor-Jared.\n\nHatho mentions it out of composition by Areth = .\n\nEditor [[Footnote(s)]] ------------------------------------------------- N OTE.\n\n-- For footnotes, see next page.\n\n[[Vol.\n\n2, Page]] 597 NOAH IN A NEW DRESS.\n\nof Moses Cherenensis says: 'By this, they say, is signified the first place of descent (of the ark).' ( Bryant ' s Anal., Vol.\n\nIV ., pages 5, 6, 15.) Under \" Berge \" mountain, Nork says of Ararat: , for ( i.e., Ararat for Arath ) E ARTH, Aramaic reduplication.' Here it is seen that Nork and Hatho make use of the same equivalent in Arath, with the meaning of Earth.\n\n\"***** Noah thus symbolizing both the Root -Manu and the Seed -Manu, or the Power which developed the planetary chain, and our earth, and the Seed Race (the Fifth) which was saved while the last sub-races of the Fourth perished -- Vaivasvata Manu -- the number Seven will be seen to recur at every step.\n\nIt is he (Noah), who represents, as Jehovah's permutation, the septenary Host of the Elohim, and is thus the Father or Creator (the Preserver) of all animal life.\n\nHence verses 2 and 3 of [[Footnote(s)]] ------------------------------------------------- * The Adwaitee Vedantic philosophy classifies this as the highest trinity, or rather the Trinitarian aspect of Chinmatra (Parabrahmam), explained by them as the \"bare potentiality of Pragna\" -- the power or the capacity that gives rise to perception; Chidakasam, the infinite field or plane of Universal Consciousness; and Asath (Mulaprakriti), or undifferentiated matter.\n\n(See \" Personal and Impersonal God \" in \" Five Years of Theosophy.\n\n\") ** Differentiated matter existing in the Solar System (let us not touch the whole Kosmos) in seven different conditions, and Pragna, or the capacity of perception, existing likewise in seven different aspects corresponding to the seven conditions of matter, there must necessarily be seven states of consciousness in man; and according to the greater or smaller development of these states, the systems of religions and philosophies were schemed out.\n\n*** Represented as the jealous, angry, turbulent and ever active-god, revengeful, and kind only to his chosen people when propitiated by them.\n\n**** Noah and his three Sons are the collective symbol of this Quaternary in many and various applications, Ham being the Chaotic principle.\n\n***** \" Source of Measures, \" p.\n\n65."


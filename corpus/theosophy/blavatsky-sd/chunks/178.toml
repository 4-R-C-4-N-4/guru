[content]
body = "\"Awaking at the end of his night, the unborn .\n\n.\n\n.\n\ncreates the Universe anew.\n\n.\n\n.\n\n.\n\n\" ( Vishnu Purana.\n\n) This is \"incidental\" pralaya; what is the Elemental Dissolution?\n\n\"When by dearth and fire,\" says Parasara to Maitreya, \"all the worlds and Patalas (hells) are withered up .\n\n.\n\n.*** the progress of elemental dissolution is begun.\n\nThen, first the waters swallow up the property of Earth (which is the rudiment of smell), and earth deprived of this property proceeds to destruction -- and becomes one with water .\n\n.\n\n.\n\n.\n\nwhen the Universe is thus pervaded by the waves of the watery Element, its rudimentary flavour is locked up by the elements of fire .\n\n.\n\n.\n\non account of which the waters themselves are destroyed .\n\n.\n\n.\n\nand become one with fire; and the Universe is therefore, entirely filled with flame (ethereal) which gradually overspreads the whole world.\n\nWhile Space is one flame, the element of wind seizes upon the rudimental property or form, which is the cause of light, and that being withdrawn ( pralina ) all becomes of the nature of air.\n\nThe rudiment of form being destroyed, and Vibhavasu (fire?) deprived of its rudiment, air extinguishes fire and spreads over space, which is deprived of light when fire merges into air.\n\nAir, then, accompanied by sound, which is the source of Ether, extends everywhere throughout the ten regions .\n\n.\n\n.\n\n.\n\nuntil Ether seizes upon cohesion ( Sparsa -- Touch?) its rudimental property, by the loss of which, air is destroyed, and KHA remains unmodified; devoid of form, flavour, touch ( Sparsa ), and smell, it exists, embodied ( murttimat ) and vast, and pervades the whole Space.\n\nAkasa, whose characteristic property and rudiment is sound (the \"Word\"), occupies the whole containment of Space.\n\nThen the origin (Noumenon?) of the Elements ( Bhutadi ), devours sound (collective Demiurgos ); and the hosts of Dhyan Chohans, and all the existing [[Footnote(s)]] ------------------------------------------------- * The chief Kumara or Virgin-god (a Dhyan Chohan) who refuses to create.\n\nA prototype of St.\n\nMichael, who refuses to do the same.\n\n** See concluding lines in Section, \"Chaos, Theos, Kosmos.\" *** This prospect would hardly suit Christian theology, which prefers an eternal, everlasting hell for its followers.\n\n[[Vol.\n\n1, Page]] 373 THE DISSOLUTION OF THE EGG.\n\nElements* are at once merged into their original.\n\nThe primary Element, Consciousness, combined with tamasa (spiritual darkness) is itself disintegrated by MAHAT (the Universal Intellect), whose characteristic property is Buddhi , and earth and Mahat are the inner and outer boundaries of the Universe.\" Thus as (in the beginning) \"were the seven forms of Prakriti (nature) reckoned from Mahat to earth, so these seven successively re-enter into each other.\"** \"The Egg of Brahma ( Sarva - mandala ) is dissolved in the waters that surround it, with its seven zones ( dwipas ) seven oceans, seven regions, and their mountains; the investure of water is drunk by the fire; the ( stratum of) fire is absorbed by (that of) air; air blends itself with ether (Akasa); the Bhutadi (the origin, or rather the cause , of the primary element) devours the ether and is (itself) destroyed by Mahat (the Great, the Universal mind), which along with all these is seized upon by Prakriti and disappears.\n\nThe Prakriti is essentially the same, whether discrete or indiscrete; only that which is discrete is finally absorbed by and lost in the indiscrete.\n\nP UMS ( Spirit ) also, which is one, pure, imperishable, eternal, all-pervading, is a portion of that Supreme spirit which is all things.\n\nThat Spirit ( Sarvesa ) which is other than (embodied) Spirit, and in which there are no attributes of name, species ( naman and jati , or rupa , hence body rather than species), or the like -- remains as the sole existence ( S ATTA).\n\n.\n\n.\n\nPrakriti and Purusha both resolving finally into S UPREME S PIRIT.\n\n.\n\n.\n\n.\" ( From Vishnu Purana , Wilson's mistakes being here corrected, and original words put in brackets).\n\nThis is the final P RALAYA*** -- the Death of Kosmos -- after which its Spirit rests in Nirvana, or in T HAT for which there is neither Day nor Night.\n\nAll the other pralayas are periodical and follow, in regular succession, the Manvantaras, as the night follows the day of every human creature, animal, and plant.\n\nThe cycle of creation of the lives of Kosmos is run down, the energy of the manifested \"Word\" having [[Footnote(s)]] ------------------------------------------------- * The term \"Elements\" must be understood here to mean not only the visible and physical Elements, but also that which St.\n\nPaul calls Elements -- the spiritual, intelligent Potencies -- Angels and Demons in their Manvantaric form.\n\n** When this description is correctly understood by Orientalists in its esoteric significance then it will be found that this Cosmic correlation of World-Elements may explain the correlation of physical forces better than those now known.\n\nAt any rate, theosophists will perceive that Prakriti has seven forms , or principles, \"reckoned from Mahat to Earth.\" The \"Waters\" mean here the Mystic \"mother\"; the Womb of abstract nature, in which the manifested Universe is conceived.\n\nThe Seven \"zones\" have reference to the Seven Divisions of that Universe, or the Noumena of the Forces that bring it into being.\n\nIt is all allegorical.\n\n*** As it is the Maha , the Great, or so-called final P RALAYA which is here described, every thing is re-absorbed into its original ONE Element -- the \"Gods themselves, Brahma and the rest\" being said to die and disappear during that long NIGHT.\n\n[[Vol.\n\n1, Page]] 374 THE SECRET DOCTRINE.\n\nits growth, culmination, and decrease, as have all things temporary, however long their duration.\n\nThe Creative Force is Eternal as Noumenon; as a phenomenal manifestation in its aspects, it has a beginning and must, therefore, have an end.\n\nDuring that interval it has its periods of activity and its periods of rest.\n\nAnd these are the \"Days and the nights of Brahma.\" But Brahma, the Noumenon, never rests, as IT never changes and ever IS, though IT cannot be said to be anywhere.\n\n.\n\n.\n\n.\n\n.\n\nThe Jewish Kabalists felt this necessity of immutability in an eternal, infinite Deity, and therefore applied the same thought to the anthropomorphic god.\n\nThe idea is poetical and very appropriate in its application."


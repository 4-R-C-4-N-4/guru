[content]
body = "\"If the fourth (paroxysm) be severe, and the fifth less so, the disease will end at the seventh paroxysm, and .\n\n.\n\n.\n\nchange for the better .\n\n.\n\n.\n\nwill be seen on the fourteenth day , [[footnote continued on following page]] [[Vol.\n\n2, Page]] 623 THE SEPTENATE IN PHYSIOLOGY.\n\nTo all of which Mr.\n\nGrattan Guinness, the author of \"The Approaching End of the Age,\" says very pertinently, as he defends Biblical Chronology, \"And man's life .\n\n.\n\n.\n\nis a week, a week of decades.\n\n'The days of our years are threescore years and ten.' Combining the testimony of all these facts, we are bound to admit that there prevails in organic mature a law of septiform periodicity, a law of completion in weeks \" (p.\n\n269).\n\nWithout accepting the conclusions, and especially the premises of the learned Founder of \"the East London Institute for Home and Foreign Missions,\" the writer accepts and welcomes his researches in the occult chronology of the Bible.\n\nJust as, while rejecting the theories and hypotheses of modern Science and its generalizations, we bow before its great achievements in the world of the physical, or in all the minor details of material nature.\n\nThere is most assuredly an occult \"chronological system in Hebrew Scripture\" -- the Kabala being its warrant; there is in it \"a system of [[Footnote(s)]] ------------------------------------------------- [[Continued from previous page]] namely, about three or four o'clock a.m., when the system is most languid.\" (See \"Approaching End of the Age,\" by Grattan Guinness, pp.\n\n258 to 269, wherein this is quoted.) This is pure \"soothsaying\" by cyclic calculations, and it is connected with Chaldean astrolatry and astrology.\n\nThus materialistic Science -- medicine, the most materialistic of all -- applies our occult laws to diseases, studies natural history with its help, recognizes its presence as a fact in nature, and yet must needs pooh-pooh the same archaic knowledge when claimed by the Occultists.\n\nFor if the mysterious Septenary Cycle is a law in nature, and it is one, as proven; if it is found controlling the evolution and involution (or death) in the realms of entomology, icthyology and ornithology, as in the Kingdom of the Animal, mammalia and man -- why cannot it be present and acting in Kosmos, in general, in its natural (though occult) divisions of time, races, and mental development?\n\nAnd why, furthermore, should not the most ancient adepts have studied and thoroughly mastered these cyclic laws under all their aspects?\n\nIndeed, Dr.\n\nStratton states as a physiological and pathological fact, that \"in health the human pulse is more frequent in the morning than in the evening for six days out of seven; and that on the seventh day it is slower.\n\n\" ( Ibid.\n\nEdinb.\n\nMed.\n\nand Surg.\n\nJournal, Jan.\n\n1843.) Why, then, should not an Occultist show the same in cosmic and terrestrial life in the pulse of the planet and races?\n\nDr.\n\nLaycock divides life by three great septenary periods; the first and last, each stretching over 21 years, and the central period or prime of life lasting 28 years, or four times seven.\n\nHe subdivides the first into seven distinct stages, and the other two into three minor periods, and says that \"The fundamental unit of the greater periods is one week of seven days, each day being twelve hours \" ; and that \"single and compound multiples of this unit, determine the length of these periods by the same ratio, as multiples of the unit of twelve hours determine the lesser periods.\n\nThis law binds all periodic vital phenomena together, and links the periods observed in the lowest annulose animals, with those of man himself, the highest of the vertebrate.\n\n\" If Science does this, why should the latter scorn the Occult information, namely, that (speaking Dr.\n\nLaycock's language) \" one week of the manvantaric ( lunar ) fortnight, of fourteen days (or seven manus), that fortnight of twelve hours in a day representing seven periods or seven races -- is now passed?\" This language of science fits our doctrine admirably.\n\nWe (mankind) have lived over \" a week of seven days, each day being twelve hours, \" since three and a half races are now gone for ever, the fourth is submerged, and we are now in the Fifth Race.\n\n[[Vol.\n\n2, Page]] 624 THE SECRET DOCTRINE.\n\nweeks\" -- which is based on the archaic Indian system, which may still be found in the old Jyotisha.* And there are in it cycles of \"the week of days,\" of the \" week of months,\" of years, of centuries, and even of millenniums, decamillenniums, and more, or \"the week of years of years.\"** But all this can be found in the archaic doctrine.\n\nAnd if this common source of the chronology in every Scripture, however veiled, is denied in the case of the Bible, then the six days, and a Sabbath, the seventh, can hardly disconnect Genesis from the Puranic Cosmogonies.\n\nFor the first \"Week of Creation\" shows the septiformity of its chronology and thus connects it with Brahma's \"Seven Creations.\" The able volume from the pen of Mr.\n\nGrattan Guinness, in which he has collected on some 760 pages every proof of that septiform calculation, is good evidence.\n\nFor if the Bible chronology is, as he says, \"regulated by the law of weeks,\" and if it is septenary, whatever the measures of the creation week and the length of its days; and if, finally, \"the Bible system includes weeks on a great variety of scales,\" then this system is shown to be identical with all the pagan systems.\n\nMoreover, the attempt to show that 4,320 years (in lunar months) elapsed between \"Creation\" and the Nativity, is a clear and unmistakable connection with the 4,320,000 of the Hindu Yugas.\n\nOtherwise, why make such efforts to prove that these figures, which are pre-eminently Chaldean and Indo-Aryan, play such a part in the New Testament?\n\nWe shall prove it now still more forcibly.\n\nLet the impartial critic compare the two accounts -- the Vishnu Purana and the Bible -- and he will find that the \"seven creations\" of Brahma are at the foundation of the \"week\" of creation in Genesis i .\n\nThe two allegories are different, but the systems are all built on the same foundation-stone.\n\nThe Bible can be understood only by the light of the Kabala.\n\nTake the Zohar, the \"Book of Concealed Mystery,\" however now disfigured, and compare."


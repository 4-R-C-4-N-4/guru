[content]
body = "Thus, in the Rig Veda, wherein Brahma is not even named, Cosmogony is preluded with the Hiranyagharha , \"the Golden Egg,\" and Prajapati (Brahma later on), from whom emanate all the hierarchies of \"Creators.\" The Monad, or point, is the original and is the unit from which follows the entire numeral system.\n\nThis Point is the First Cause, but THAT from which it emanates, or of which, rather, it is the expression, the Logos, is passed over in silence.\n\nIn its turn, the universal symbol, the point within the circle , was not yet the Architect, but the cause of that Architect; and the latter stood to it in precisely the same relation as the point itself stood to the circumference of the Circle, which cannot be defined, according to Hermes Trismegistus.\n\nPorphyry shows that the Monad and the Duad of Pythagoras are identical with Plato's infinite and finite in \"Philebus\" -- or what Plato calls the [[ apeiron ]] and [[ peras ]].\n\nIt is the latter only (the mother) which is substantial, the former being the \" cause of all unity and measure of all things \" ( Vit.\n\nPyth.\n\np.\n\n47); the Duad (Mulaprakriti, the V EIL) being thus shown to be the mother of the Logos and, at the same time, his daughter -- i.e.\n\n, the object of his perception -- the produced [[Footnote(s)]] ------------------------------------------------- * It is the \"bound\" confused with the \" Infinite ,\" that Kapila overwhelms with sarcasms in his disputations with the Brahman Yogis, who claim in their mystical visions to see the \"Highest One.\" ** See T.\n\nTaylor's article in his Monthly Magazine quoted in the Platonist , edited by T.\n\nM.\n\nJohnson, F.T.S., Osceola, Missouri.\n\n(Feb.\n\nNumber of 1887.) [[Vol.\n\n1, Page]] 427 THE CREATIVE LOGOI, ANDROGYNOUS.\n\nproducer and the secondary cause of it.\n\nWith Pythagoras, the MONAD returns into silence and Darkness as soon as it has evolved the triad , from which emanate the remaining seven numbers of the 10 (ten) numbers which are at the base of the manifested universe.\n\nIn the Norse cosmogony it is again the same.\n\n\"In the beginning was a great abyss (Chaos), neither day nor night existed; the abyss was Ginnungagap, the yawning gulf, without beginning, without end.\n\nA LL F ATHER, the Uncreated, the Unseen, dwelt in the depth of the 'Abyss' ( S PACE) and willed , and what was willed came into being.\" (See \" Asgard and the Gods.\n\n\") As in the Hindu cosmogony, the evolution of the universe is divided into two acts: called in India the Prakriti and Padma Creations.\n\nBefore the warm rays pouring from the \"Home of Brightness\" awake life in the Great Waters of Space, the Elements of the first creation come into view, and from them is formed the Giant Ymir (also Orgelmir) -- primordial matter differentiated from Chaos (literally seething clay ) .\n\nThen comes the cow Audumla, the nourisher,* from whom is born Buri (the Producer) who, by Bestla, the daughter of the \"Frost-Giants\" (the sons of Ymir) had three sons, Odin , Willi and We , or \"Spirit,\" \"Will,\" and \"Holiness.\" ( Compare the Genesis of the Primordial Races , in this work.\n\n) This was when Darkness still reigned throughout Space, when the Ases , the creative Powers (Dhyan Chohans) were not yet evolved, and the Yggdrasil, the tree of the universe of Time and of Life, had not yet grown, and there was, as yet, no Walhalla, or Hall of Heroes.\n\nThe Scandinavian legends of creation, of our earth and world, begin with time and human life.\n\nAll that precedes it is for them \"Darkness,\" wherein All-Father, the cause of all, dwells.\n\nAs observed by the editor of \"Asgard and the Gods,\" though these legends have in them the idea of that A LL- F ATHER, the original cause of all, \"he is scarcely more than mentioned in the poems,\" not because, as he thinks, before the preaching of the gospel, the idea \"could not rise to distinct conceptions of the Eternal,\" but on account of its great esoteric character.\n\nTherefore, all the creative gods, or personal Deities, begin at the secondary stage of Cosmic evolution.\n\nZeus is born in , and out of Kronos -- Time.\n\nSo is Brahma the production and emanation of Kala , \"eternity and time,\" Kala being one of the names of Vishnu.\n\nHence we find Odin, the father of the gods and of the Ases , as Brahma is the father of the gods and of the Asuras , and hence also the androgyne character of all the chief creative gods, from the second M ONAD of the Greeks down to the Sephiroth Adam Kadmon, the Brahma or Prajapati-Vach of the Vedas, and the androgyne of Plato, which is but another version of the Indian symbol.\n\n[[Footnote(s)]] ------------------------------------------------- * Vach -- the \"melodious cow, who milks sustenance and water,\" and yields us \"nourishment and sustenance\" as described in Rig-Veda.\n\n[[Vol.\n\n1, Page]] 428 THE SECRET DOCTRINE.\n\nThe best metaphysical definition of primeval theogony in the spirit of the Vedantins may be found in the \"Notes on the Bhagavat-Gita,\" by Mr.\n\nT.\n\nSubba Row.\n\n( See \" Theosophist \" for February , 1887.) Parabrahmam, the unknown and the incognisable, as the lecturer tells his audience: \".\n\n.\n\n.\n\n.\n\n.\n\nIs not Ego, it is not non-ego, nor is it consciousness .\n\n.\n\n.\n\n.\n\n.\n\nit is not even Atma \" .\n\n.\n\n.\n\n.\n\n.\n\n\"but though not itself an object of knowledge, it is yet capable of supporting and giving rise to every kind of object and every kind of existence which becomes an object of knowledge.\n\nIt is the one essence from which starts into existence a centre of energy .\n\n.\n\n.\n\n.\n\n.\" which he calls Logos.\n\nThis Logos is the Sabda Brahmam of the Hindus, which he will not even call Eswara (the \"lord\" God), lest the term should create confusion in the people's minds.\n\nBut it is the Avalokiteswara of the Hindus, the Verbum of the Christians in its real esoteric meaning, not in the theological disfigurement.\n\n\"It is,\" he says, \"the Gnatha or the Ego in the Kosmos, and every other Ego .\n\n.\n\n.\n\n.\n\n.\n\n.\n\nis but its reflection and manifestation.\n\n.\n\n.\n\n.\n\n.\n\n."


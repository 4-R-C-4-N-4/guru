body = "Earth, Water, Fire, Air, Space (or Akasa , AEther), Mind, Understanding and Egoism (or the perception of all the former on the illusive plane).\n\n.\n\n.\n\nThis is a lower form of my nature.\n\nKnow (that there is) another (form of my) nature, and higher than this, which is animate, O you of mighty arms!\n\nand by which this Universe is upheld.\n\n.\n\n.\n\n.\n\nAll this is woven upon me, like numbers of pearls upon a thread ( Mundakopanishad , p.\n\n298).\n\n.\n\n.\n\n.\n\nI am the taste in the [[Footnote(s)]] ------------------------------------------------- * The division of the physical senses into five, comes to us from great antiquity.\n\nBut while adopting the number, no modern philosopher has asked himself how these senses could exist, i.e.\n\n, be perceived and used in a self-conscious way, unless there was the sixth sense, mental perception to register and record them; and (this for the Metaphysicians and Occultists) the S EVENTH to preserve the spiritual fruition and remembrance thereof, as in a Book of Life which belongs to Karma.\n\nThe ancients divided the senses into five, simply because their teachers (the Initiates) stopped at the hearing , as being that sense which developed in the physical plane (got dwarfed rather, limited to this plane) only at the beginning of the Fifth Race.\n\n(The Fourth Race already had begun to lose the spiritual condition, so pre-eminently developed in the Third Race.) ** The modern commentators, failing to comprehend the subtle meaning of the ancient Scholiasts, take this sentence, \"causes of the agents,\" to mean \"that the powers of smelling, etc., when attributed to the Self, make him appear as an agent, as an active principle\" (!), which is entirely fanciful.\n\nThese \"seven\" are understood to be the causes of the Agents, because \"the objects are causes, as their enjoyment causes an impression.\" It means esoterically that they, these seven senses, are caused by the A GENTS, which are the \"deities,\" for what does, or can, the sentence which follows this one mean?\n\n\"Thus,\" it is said, \"these seven (senses) are the causes of emancipation\" ( i.e.\n\n, when these causes are made ineffectual).\n\n\"And among the learned (the wise Initiates) who understand the qualities which are in the position (in the nature, rather) of the deities , each in its place,\" means simply that the \"learned\" understand the nature of the noumenoi of the various phenomena; and that \"qualities,\" in this instance, mean the qualities of the high planetary or Elementary gods or Intelligences, which rule the elements and their products , and not at all \"the senses,\" as the modern commentator thinks.\n\nFor the \"learned do not suppose their senses to have aught to do with them, any more than with their S ELF.\" ( Vide pp.\n\n278 and 279 of the VIII.\n\nVol.\n\nof \"The Sacred Books of the East.\" Anugita.\n\n) [[Vol.\n\n1, Page]] 536 THE SECRET DOCTRINE.\n\nwater, O son of Kunti!\n\nI am the light of the sun and moon.\n\nI am .\n\n.\n\n.\n\nsound (' i.e.\n\n, the Occult essence which underlies all these and the other qualities of the various things mentioned,' Transl.\n\n), in space .\n\n.\n\n.\n\nthe fragrant smell in the earth, refulgence in the fire .\n\n.\n\n.\n\netc., etc.\" Truly, then, one should study Occult philosophy before one begins to verify and seek the mysteries of nature on its surface alone, as he alone \"who knows the truth about the qualities of nature, who understands the creation of all entities .\n\n.\n\n.\n\nis emancipated\" from error.\n\nSays the \"preceptor\": \"Accurately understanding the great tree of which the unperceived (Occult nature, the root of all) is the sprout from the seed (Parabrahmam) which consists of the understanding ( Mahat , or the universal intelligent Soul) as its trunk, the branches of which are the great egoism,* in the holes of which are the sprouts, namely, the senses, of which the great (Occult, or invisible) elements are the flower-bunches,** the gross elements (the gross objective matter), the smaller boughs, which are always possessed of leaves, always possessed of flowers .\n\n.\n\n.\n\n.\n\nwhich is eternal and the seed of which is the Brahman (the deity); and cutting it with that excellent sword -- knowledge (secret wisdom) -- one attains immortality and casts off birth and death.\" This is the Tree of Life, the Asvattha tree, only after the cutting of which the slave of life and death, M AN, can be emancipated.\n\nBut the men of Science know nought, nor will they hear of the \"Sword of Knowledge\" used by the adepts and ascetics.\n\nHence the one-sided remarks of the most liberal among them, based on and flowing from undue importance given to the arbitrary divisions and classification of physical science.\n\nOccultism heeds them very little, and nature still less.\n\nThe whole range of physical phenomena proceed from the Primary of Ether -- Akasa, as dual-natured Akasa proceeds from undifferentiated Chaos , so-called, the latter being the primary aspect of Mulaprakriti, the root-matter and the first abstract Idea one can form of Parabrahmam.\n\nModern Science may divide its hypothetically conceived ether in as many ways as it likes; the real AEther of Space will remain as it is throughout.\n\nIt has its seven principles, as all the rest of nature has, and where there was no Ether there would be no sound , as it is the vibrating sound-board in nature in all of its seven differentiations.\n\nThis is the first mystery the Initiates of old have learned.\n\nOur present normal physical senses were (from our present point of view) abnormal in those days of slow and progressive downward evolution and fall into matter.\n\nAnd there was a day when all that which in our modern times is regarded as phenomena, so puzzling to the [[Footnote(s)]] ------------------------------------------------- * Ahamkara , I suppose, that Egoship (or Ahamship) which leads to every error.\n\n** The elements are the five tanmatras of earth, water, fire, air and ether, the producers of the grosser elements.\n\n[[Vol.\n\n1, Page]] 537 WHAT IS NERVOUS ETHER?\n\nphysiologists now compelled to believe in them -- such as thought transference, clairvoyance, clairaudience, etc.; in short, all that which is called now \"wonderful and abnormal\" -- all that and much more belonged to the senses and faculties common to all humanity.\n\nWe are, however, cycling back and cycling forward; i.e.\n\n, having lost in spirituality that which we acquired in physical development until almost the end of the Fourth Race, we (mankind) are as gradually and imperceptibly losing now in the physical all that we regain once more in the spiritual re -evolution."


body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n1 [[Vol.\n\n1, Page]] 342 THE SECRET DOCTRINE.\n\n§ IV.\n\nCHAOS -- THEOS -- KOSMOS.\n\nT HESE three are the containment of Space; or, as a learned Kabalist has defined it, \"Space, the all containing uncontained, is the primary embodiment of simply Unity.\n\n.\n\n.\n\n.\n\nboundless extension.\"* But, he asks again, \"boundless extension of what?\" -- and makes the correct reply -- \"The unknown container of all , the Unknown FIRST CAUSE.\n\n\" This is a most correct definition and answer, most esoteric and true, from every aspect of occult teaching.\n\nSPACE , which, in their ignorance and iconoclastic tendency to destroy every philosophic idea of old, the modern wiseacres have proclaimed \"an abstract idea\" and a void , is, in reality, the container and the body of the Universe with its seven principles.\n\nIt is a body of limitless extent, whose PRINCIPLES , in Occult phraseology -- each being in its turn a septenary -- manifest in our phenomenal world only the grossest fabric of their sub-divisions.\n\n\"No one has ever seen the Elements in their fulness,\" the Doctrine teaches.\n\nWe have to search for our Wisdom in the original expressions of the primeval people and in their synonyms.\n\nEven the latest of them -- the Jews -- show in their Kabalistic teachings this idea, e.g ., the seven-headed Serpent of Space, called \"the great Sea.\" \"In the beginning, the Alhim created the heavens and the earth; the 6 (Sephiroth).\n\n.\n\n.\n\n.\n\nThey created six, and on these all things are based.\n\nAnd those (six) depend upon the seven forms of the cranium up to Dignity of all Dignities ( Siphrah Dzenioota , i, § 16), see part ii., vol.\n\nii.\n\n\"Ancient Divisions and the Mystic Numbers.\" Now Wind , Air and Spirit have ever been synonymous with every nation.\n\nPneuma (Spirit) and Anemos (the wind) with the Greeks, Spiritus and Ventus with the Latins, were convertible terms even if dissociated from the original idea of the breath of life.\n\nIn the \"Forces\" of Science we see but the material effect of the spiritual affect of one or the other of the four primordial Elements, transmitted to us by the 4th Race, as we shall transmit Ether (or rather the gross subdivision of it) in its fulness to the Sixth Root Race.\n\nThis is explained in the text of this and the following Book.\n\n\"Chaos\" is called senseless by the ancients, because it represented and contained in itself (Chaos and Space being synonymous) all the Elements in their rudimentary, undifferentiated State.\n\nThey made of Ether, the fifth element, the synthesis of the other four; for the AEther of the Greek philosophers is not its dregs -- of which indeed they knew more [[Footnote(s)]] ------------------------------------------------- * \"New Aspects of Life,\" by Henry Pratt, M.D.\n\n[[Vol.\n\n1, Page]] 343 THE UNION OF CHAOS AND SPIRIT.\n\nthan science does now -- which are rightly enough supposed to act as an agent for many forces that manifest on Earth.\n\nTheir AEther was the Akasa of the Hindus; the Ether accepted in physics is but one of its subdivisions, on our plane, -- the Astral Light of the Kabalists with all its evil as well as good effects.\n\nOn account of the Essence of AEther, or the Unseen Space, being held divine as the supposed veil of Deity, it was regarded as the medium between this life and the next one.\n\nThe ancients considered that when the directing active \"Intelligences\" (the gods) retired from any portion of Ether in our Space -- the four realms which they superintend -- then that particular place was left in the possession of evil, so called by reason of the absence of the Good from it.\n\n\"The existence of spirit in the common mediator, the ether, is denied by materialism; while theology makes of it a personal god.\n\nBut the Kabalist holds that both are wrong, saying that in ether, the elements represent but matter -- the blind cosmic forces of nature; while Spirit represents the intelligence which directs them.\n\nThe Aryan, Hermetic, Orphic, and Pythagorean cosmogonical doctrines, as well as those of Sanchoniathon and Berosus, are all based upon one irrefutable formula, viz., that the aether and chaos, or, in the Platonic language, mind and matter, were the two primeval and eternal principles of the universe, utterly independent of anything else.\n\nThe former was the all-vivifying intellectual principle; the chaos, a shapeless liquid principle, without 'form or sense,' from the union of which two sprung into existence the universe, or rather the universal world, the first androgynous deity -- the chaotic matter becoming its body, and ether its soul.\n\nAccording to the phraseology of a Fragment of Hermias , 'chaos, from this union with spirit, obtaining sense , shone with pleasure, and thus was produced the Protogonos (the first-born) light.'* This is the universal trinity, based on the metaphysical conceptions of the ancients, who, reasoning by analogy, made of man, who is a compound of intellect and matter, the microcosm of the macrocosm, or great universe.\" ( Isis Unveiled.\n\n) \" Nature abhors Vacuum \" said the Peripatetics, who comprehended perhaps, though materialists in their way, why Democritus, with his instructor Leucippus, taught that the first principles of all things contained in the Universe were atoms and a vacuum.\n\nThe latter means simply latent Deity or force; which, before its first manifestation when it became WILL -- communicating the first impulse to these atoms -- was the great Nothingness , Ain-Soph, or NO-THING; was, therefore, to every sense, a Void -- or C HAOS.\n\nThat Chaos, however, became the \"Soul of the World,\" according to Plato and the Pythagoreans.\n\nAccording to Hindu teaching, Deity in the shape of AEther (Akasa) pervades all things; and it was called there- [[Footnote(s)]] ------------------------------------------------- * Damascius, in the \"Theogony,\" calls it Dis, \"the disposer of all things.\" Cory, \"Ancient Fragments,\" p.\n\n314.\n\n[[Vol.\n\n1, Page]] 344 THE SECRET DOCTRINE.\n\nfore by the theurgists \"the living fire,\" the \"Spirit of Light,\" and sometimes Magnes.\n\nIt was the highest Deity itself which, according to Plato, built the Universe in the geometrical form of the Dodecahedron; and its \"first begotten\" was born of Chaos and Primordial Light (the Central Sun)."


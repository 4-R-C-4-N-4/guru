[content]
body = "It is now amply proved that even horoscopes and judiciary astrology are not quite based on a fiction, and that stars and constellations, consequently, have an occult and mysterious influence on, and connection with, individuals.\n\nAnd if with the latter, why not with nations, races, and mankind in bulk?\n\nThis, again, is a claim made on the authority of the Zodiacal records.\n\nWe shall examine then, if you please, how far the Zodiac was known to the ancients, and how far it is forgotten by the moderns.\n\n------- [[This page continued in next section]]"


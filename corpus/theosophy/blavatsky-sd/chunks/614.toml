[content]
body = "By \"intelligence,\" the Occultist says, Narada means neither \"discussion\" nor \"argumentation,\" as Aruna Misra believes, but \"intelligence\" truly, or the adaptation of the fire of Wisdom to Exoteric Ritualism for the profane.\n\nThis is the chief concern of the Brahmans (who were the first to set the example to other nations who thus anthropomorphized and carnalized the grandest metaphysical truths).\n\nNarada makes it plain and is made to say: \"The smoke of that fire, which is of excellent glory, appears in the shape of darkness\" (verily so!); \"its ashes (are) passion; and goodness is that in connection with it in which the offering is thrown\": i.e.\n\n, that faculty in the disciple which apprehends the subtle truth (the flame) which escapes heavenward, while the objective sacrifice remains as a proof and evidence of piety only to the profane.\n\nFor what can Narada mean in teaching that \"those who understand the sacrifice understand the Samana and the Vyana as the principal (offering)\"; and \"the Prana and Apana, but portions of the offering .\n\n.\n\n.\n\nand between them is the fire .\n\n.\n\n.\n\n.\n\nthat is the excellent seat of the Udana as understood by Brahmanas.\n\nAs to that which is distinct from these pairs, hear me speak about that.\n\nDay and night are a pair, between them is the fire.\n\n.\n\n.\n\nThat which exists and that which does not exist are a pair, between them is the fire, etc.,\" and after every such contrast Narada adds \"That is the excellent seat of the Udana as understood by Brahmanas.\" Now many people do not know the full meaning of such terms as Samana and Vyana, Prana and Apana, explained as being \"life-winds\" (we say \"principles and their respective faculties and senses\"), being offered up to Udana, the soi-disant principal \"life wind,\" (?) said to act at all the joints.\n\nTherefore the reader, who is ignorant that the word \"fire\" means in these allegories both the \"Self\" and the higher divine knowledge, will understand nothing in this; and will therefore entirely miss the point of our argument, as its translators and even its editor the great Oxford Sanskritist, Max Muller, has missed the true meaning of Narada's words.\n\nExoterically, all this enumeration of \"life winds\" means, of course, approximately, that which is surmised in the foot-notes; namely, \"The sense appears to be this .\n\n.\n\n.\n\n.\n\nworldly life is due to the operations of the life-winds which are attached to the S ELF, and lead to its manifestations as individual souls (?).\n\nOf these the Samana and Vyana are controlled and held under check by [[Vol.\n\n2, Page]] 568 THE SECRET DOCTRINE.\n\nthe Prana and Apana.\n\n.\n\n.\n\n.\n\nThe latter two are held in check and controlled by the Udana, which thus controls all.\n\nAnd the control of this, which is the control of all five .\n\n.\n\n.\n\n.\n\nleads to the Supreme Self\" (p.\n\n259, Anugita, \"Sacred Books of the East,\" Vol.\n\nVIII.) The above is given as an explanation of the text, which records the words of the Brahmana, who narrates how he reached the ultimate Wisdom of Yogism, and had reached all knowledge in this wise.\n\nSaying that he had \"perceived by means of the S ELF the seat abiding in the S ELF,\" where dwells the Brahman free from all; and explaining that that indestructible principle was entirely beyond the perception of senses ( i.e., of the five \"life-winds\"), he adds that \"in the midst of an these (life-winds) which move about in the body and swallow up one another, blazes the Vaisvanara fire sevenfold.\" This \"Fire,\" according to Nilakantha's Commentary, is identical with the \"I,\" the SELF, which is the goal of the ascetic (Vaisvanara being a word often used for the Self ) .\n\nThen the Brahmana goes on to enumerate that which is meant by the word \"Sevenfold,\" and says, \"The nose (or smell), the tongue (taste), the eye, and the skin, and the ear as the fifth, the mind, and the understanding, these are the seven tongues of the blaze of Vaisvanara,*.\n\n.\n\n.\n\n.\n\n.\n\nthose are the seven (kinds of) fuel for me,**.\n\n.\n\n.\n\n.\n\n.\n\nthese are the seven great officiating priests.\" These seven priests are accepted by Arjuna Misra in the sense of meaning \"the soul distinguished as so many (souls, or principles) with reference to these several powers\"; and, finally, the translator seems to accept the explanation, and reluctantly admits that \"they may mean\" this; though he himself takes the sense to mean \"the powers of hearing, etc.\n\n(the physical senses, in short) which are presided over by the several deities.\" ( Vide loc.\n\ncit., p.\n\n259, f.n.\n\n6.) But whatever it may mean, whether in scientific or orthodox interpretations, this passage on page 259 explains Narada's statements on page 276, and shows them referring to exoteric and esoteric methods and contrasting them.\n\nThus the Samana and the Vyana, though subject to the Prana and the Apana, and all the four to Udana in the matter of acquiring the Pranayama (of the Hatha-Yogi, chiefly, or the \"lower\" form of the Yoga) are yet referred to as the principal offering, for, as rightly argued by the commentator, their \"operations are more practically important for vitality\"; i.e., they are the grossest, and are offered in the sacrifice, to disappear, so to speak, in the quality of darkness of that fire or its SMOKE (mere exoteric ritualistic form).\n\nBut [[Footnote(s)]] ------------------------------------------------- *In the astronomical and cosmical key, Vaisvanara is Agni, son of the Sun, or Viswanaras, but in the psycho-metaphysical symbolism it is the S ELF, in the sense of non-separateness, i.e.\n\n, both divine and human.\n\n**Here the speaker personifies the said divine S ELF.\n\n[[Vol.\n\n2, Page]] 569 THE DIVINE SELF'S WISDOM.\n\nPrana and Apana, though shown as subordinate (because less gross or more purified), have the FIRE between them: the Self and the secret knowledge possessed by that Self.\n\nSo for the good and evil, and for \"that which exists and that which does not exist\"; all these \"pairs\"* have fire between them, i.e.\n\n, esoteric knowledge, the Wisdom of the divine SELF.\n\nLet those who are satisfied with the Smoke of the F IRE remain wherein they are, that is to say within the Egyptian darkness of theological fictions and dead-letter interpretations.\n\nThe above is written only for the Western students of Occultism and Theosophy."


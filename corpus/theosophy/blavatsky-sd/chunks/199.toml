body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n1 [[Vol.\n\n1, Page]] 411 THE MYSTERY OF THE SEVEN THUNDERS.\n\n[[This page continued from previous section ]] § XI.\n\nDEMON EST DEUS INVERSUS.\n\nT HIS symbolical sentence, in its many-sided forms, is certainly most dangerous and iconoclastic in the face of all the dualistic later religions -- or rather theologies -- and especially so in the light of Christianity.\n\nYet it is neither just nor correct to say that it is Christianity which has conceived and brought forth Satan.\n\nAs an \"adversary,\" the opposing Power required by the equilibrium and harmony of things in Nature -- like Shadow to throw off still brighter the Light, like Night to bring into greater relief the Day, and like cold to make one appreciate the more the comfort of heat -- S ATAN has ever existed.\n\nHomogeneity is one and indivisible.\n\nBut if the homogeneous One and Absolute is no mere figure of speech, and if heterogeneity in its dualistic aspect, is its offspring -- its bifurcous shadow or reflection -- then even that divine Homogeneity must contain in itself the essence of [[Vol.\n\n1, Page]] 412 THE SECRET DOCTRINE.\n\nboth good and evil.\n\nIf \"God\" is Absolute, Infinite, and the Universal Root of all and everything in Nature and its universe, whence comes Evil or D'Evil if not from the same \"Golden Womb\" of the absolute?\n\nThus we are forced either to accept the emanation of good and evil, of Agathodaemon and Kakodaemon as offshoots from the same trunk of the Tree of Being, or to resign ourselves to the absurdity of believing in two eternal Absolutes!\n\nHaving to trace the origin of the idea to the very beginnings of human mind, it is but just, meanwhile, to give his due even to the proverbial devil.\n\nAntiquity knew of no isolated, thoroughly and absolutely bad \"god of evil.\" Pagan thought represented good and evil as twin brothers, born from the same mother -- Nature; so soon as that thought ceased to be Archaic, Wisdom too became Philosophy.\n\nIn the beginning the symbols of good and evil were mere abstractions, Light and Darkness; then their types became chosen among the most natural and ever-recurrent periodical Cosmic phenomena -- the Day and the Night, or the Sun and Moon.\n\nThen the Hosts of the Solar and Lunar deities were made to represent them, and the Dragon of Darkness was contrasted with the Dragon of Light (See Stanzas V .\n\n, VII.\n\nof Book I.) The Host of Satan is a Son of God, no less than the Host of the B'ni Alhim, these children of God coming to \"present themselves before the Lord,\" their father (see Job ii.\n\n) .\n\n\"The Sons of God\" become the \"Fallen Angels\" only after perceiving that the daughters of men were fair , ( Genesis vi.\n\n) In the Indian philosophy, the Suras are among the earliest and the brightest gods, and become Asuras only when dethroned by Brahminical fancy.\n\nSatan never assumed an anthropomorphic, individualized shape, until the creation by man, of a \"one living personal god,\" had been accomplished; and then merely as a matter of prime necessity.\n\nA screen was needed; a scape-goat to explain the cruelty, blunders, and but too-evident injustice, perpetrated by him for whom absolute perfection, mercy, and goodness were claimed.\n\nThis was the first Karmic effect of abandoning a philosophical and logical Pantheism, to build, as a prop for lazy man, \"a merciful father in Heaven,\" whose daily and hourly actions as Natura naturans , the \"comely mother but stone cold,\" belie the assumption.\n\nThis led to the primal twins, Osiris-Typhon, Ormazd-Ahriman, and finally Cain-Abel and the tutti-quanti of contraries.\n\nHaving commenced by being synonymous with Nature, \"God,\" the Creator, ended by being made its author.\n\nPascal settles the difficulty very cunningly: \"Nature has perfections, in order to show that she is the image of God: and defects, in order to show that she is only his image,\" he says.\n\nThe further back one recedes into the darkness of the prehistoric [[Vol.\n\n1, Page]] 413 DEATH IS LIFE.\n\nages, the more philosophical does the prototypic figure of the later Satan appear.\n\nThe first \"Adversary\" in individual human form that one meets with in old Puranic literature is one of her greatest Rishis and Yogis -- Narada, surnamed the \"Strife-maker.\" And he is a Brahmaputra, a son of Brahma, the male.\n\nBut of him later on.\n\nWho the great \"Deceiver\" really is, one can ascertain by searching for him with open eyes and an unprejudiced mind, in every old cosmogony and Scripture.\n\nIt is the anthropomorphised Demiurge , the Creator of Heaven and Earth, when separated from the collective Hosts of his fellow-Creators, whom, so to speak, he represents and synthesizes.\n\nIt is now the God of theologies.\n\n\"The thought is father to the wish.\" Once upon a time, a philosophical symbol left to perverse human fancy; afterwards fashioned into a fiendish, deceiving, cunning, and jealous God.\n\nDragons and other fallen angels being described in other parts of this work, a few words upon the much-slandered Satan will be sufficient.\n\nThat which the student will do well to remember is that, with every people except the Christian nations, the Devil is to this day no worse an entity than the opposite aspect in the dual nature of the so-called Creator.\n\nThis is only natural.\n\nOne cannot claim God as the synthesis of the whole Universe, as Omnipresent and Omniscient and Infinite, and then divorce him from evil.\n\nAs there is far more evil than good in the world, it follows on logical grounds that either God must include evil, or stand as the direct cause of it, or else surrender his claims to absoluteness.\n\nThe ancients understood this so well that their philosophers -- now followed by the Kabalists -- defined evil as the lining of God or Good: Demon est Deus inversus , being a very old adage.\n\nIndeed, evil is but an antagonizing blind force in nature; it is reaction , opposition , and contrast , -- evil for some, good for others.\n\nThere is no malum in se: only the shadow of light, without which light could have no existence, even in our perceptions.\n\nIf evil disappeared, good would disappear along with it from Earth.\n\nThe \"Old Dragon\" was pure spirit before he became matter, passive before he became active.\n\nIn the Syro-Chaldean magic both Ophis and Ophiomorphos are joined in the Zodiac, at the sign of the Androgyne Virgo-Scorpio.\n\nBefore its fall on earth the \"Serpent\" was Ophis-Christos , and after its fall it became Ophiomorphos- C HRESTOS."


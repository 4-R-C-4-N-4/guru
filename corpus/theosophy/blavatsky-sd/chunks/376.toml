[content]
body = "\"Man must not be like one of us,\" say the creative gods, entrusted with the fabrication of the lower animal but higher; (see Gen.\n\nand Plato ' s Timaeus ) .\n\nTheir creating the semblance of men out of their own divine Essence means, esoterically, that it is [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] giants and sorcerers, concealed the truth -- astronomical, physical, and divine , as it is a page out of pre-cosmic theogony -- under various allegories.\n\nIts esoteric, true interpretation is a veritable Theodice of the \"Fallen Angels,\" so called; the willing and the unwilling, the creators and those who refused to create, being now mixed up most perplexingly by Christian Catholics, who forget that their highest Archangel, St.\n\nMichael, who is shown to conquer (to master and to assimilate) the D RAGON OF W ISDOM and of divine Self-sacrifice (now miscalled and calumniated as Satan), WAS THE FIRST TO REFUSE TO CREATE!\n\nThis led to endless confusion.\n\nSo little does Christian theology understand the paradoxical language of the East and its symbolism, that it even explains, in its dead letter sense, the Chinese Buddhist and Hindu exoteric rite of raising a noise during certain eclipses to scare away the \"great red Dragon,\" which laid a plot to carry away the light!\n\nBut here \"Light\" means esoteric Wisdom, and we have sufficiently explained the secret meaning of the terms Dragon, Serpent, etc., etc., all of which refer to Adepts and Initiates.\n\n[[Vol.\n\n2, Page]] 95 WHAT PROMETHEUS SYMBOLIZED.\n\nthey who became the first Race, and thus shared its destiny and further evolution.\n\nThey would not, simply because they could not, give to man that sacred spark which burns and expands into the flower of human reason and self-consciousness, for they had it not to give.\n\nThis was left to that class of Devas who became symbolised in Greece under the name of Prometheus, to those who had nought to do with the physical body, yet everything with the purely spiritual man.\n\n( See Part II of this volume, \" The Fallen Angels \"; also \" The Gods of Light proceed from the Gods of Darkness.\n\n\") Each class of Creators endows man with what it has to give: the one builds his external form; the other gives him its essence, which later on becomes the Human Higher Self owing to the personal exertion of the individual ; but they could not make men as they were themselves -- perfect, because sinless; sinless, because having only the first, pale shadowy outlines of attributes, and these all perfect -- from the human standpoint -- white, pure and cold as the virgin snow.\n\nWhere there is no struggle, there is no merit.\n\nHumanity, \"of the Earth earthy,\" was not destined to be created by the angels of the first divine Breath: therefore they are said to have refused to do so, and man had to be formed by more material creators,* who, in their turn, could give only what they had in their own natures, and no more.\n\nSubservient to eternal law, the pure gods could only project out of themselves shadowy men, a little less ethereal and spiritual, less divine and perfect than themselves -- shadows still.\n\nThe first humanity, therefore, was a pale copy of its progenitors; too material, even in its ethereality, to be a hierarchy of gods; too spiritual and pure to be MEN, endowed as it is with every negative ( Nirguna ) perfection.\n\nPerfection, to be fully such, must be born out of imperfection, the incorruptible must grow out of the corruptible, having the latter as its vehicle and basis and contrast.\n\nAbsolute light is absolute darkness, and vice versa.\n\nIn fact, there is neither light nor [[Footnote(s)]] ------------------------------------------------- * In spite of all efforts to the contrary, Christian theology -- having burdened itself with the Hebrew esoteric account of the creation of man, which is understood literally -- cannot find any reasonable excuse for its \" God, the Creator,\" who produces a man devoid of mind and sense; nor can it justify the punishment following an act, for which Adam and Eve might plead non compos.\n\nFor if the couple is admitted to be ignorant of good and evil before the eating of the forbidden fruit, how could it be expected to know that disobedience was evil?\n\nIf primeval man was meant to remain a half-witted, or rather witless, being, then his creation was aimless and even cruel, if produced by an omnipotent and perfect God.\n\nBut Adam and Eve are shown, even in Genesis, to be created by a class of lower divine Beings, the Elohim, who are so jealous of their personal prerogatives as reasonable and intelligent creatures, that they will not allow man to become \"as one of us.\" This is plain, even from the dead-letter meaning of the Bible.\n\nThe Gnostics, then, were right in regarding the Jewish God as belonging to a class of lower, material and not very holy denizens of the invisible World.\n\n[[Vol.\n\n2, Page]] 96 THE SECRET DOCTRINE.\n\ndarkness in the realms of truth.\n\nGood and Evil are twins, the progeny of Space and Time, under the sway of Maya.\n\nSeparate them, by cutting off one from the other, and they will both die.\n\nNeither exists per se, since each has to be generated and created out of the other, in order to come into being; both must be known and appreciated before becoming objects of perception, hence, in mortal mind, they must be divided.\n\nNevertheless, as the illusionary distinction exists, it requires a lower order of creative angels to \"create\" inhabited globes -- especially ours -- or to deal with matter on this earthly plane.\n\nThe philosophical Gnostics were the first to think so, in the historical period, and to invent various systems upon this theory.\n\nTherefore in their schemes of creation, one always finds their Creators occupying a place at the very foot of the ladder of spiritual Being.\n\nWith them, those who created our earth and its mortals were placed on the very limit of mayavic matter, and their followers were taught to think -- to the great disgust of the Church Fathers -- that for the creation of those wretched races, in a spiritual and moral sense, which grace our globe, no high divinity could be made responsible, but only angels of a low hierarchy,* to which class they relegated the Jewish God, Jehovah.\n\nMankinds different from the present are mentioned in all the ancient Cosmogonies.\n\nPlato speaks, in the Phaedrus, of a winged race of men.\n\nAristophanes ( in Plato ' s Banquet ) , speaks of a race androgynous and with round bodies.\n\nIn Pymander, all the animal kingdom even is double-sexed.\n\nThus in § 18, it is said: \"The circuit having been accomplished, the knot was loosened .\n\n.\n\n.\n\n.\n\nand all the animals, which were equally androgynous, were untied (separated) together with man .\n\n.\n\n.\n\n.\n\n.\" for.\n\n.\n\n.\n\n."


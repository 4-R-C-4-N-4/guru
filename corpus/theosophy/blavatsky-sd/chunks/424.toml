[content]
body = "Even such belief is more logical and reasonable than the descent of man from the Quadrumana without any reservation; as the former hides an esoteric truth under a fabulous version, while the latter conceals no deeper fact than a desire to force upon mankind a materialistic fiction.\n\nThe rib is bone, and when we read in Genesis that Eve was made out of the rib, it only means that the Race with bones was produced out of a previous Race and Races, which were \"boneless.\" This is an esoteric tenet spread far and wide, as it is almost universal under its various forms.\n\nA Tahitian tradition states that man was created out of Araea, \"red [[Footnote(s)]] ------------------------------------------------- * This, regardless of modern materialistic evolution, which speculates in this wise: \"The primitive human form, whence as we think all human species sprang, has perished this long time.\" (This we deny; it has only decreased in size and changed in texture.) \"But many facts point to the conclusion that it was hairy and dolichocephalic.\" (African races are even now dolichocephalic in a great measure, but the palaeolithic Neanderthal skull, the oldest we know of, is of a large size, and no nearer to the capacity of the gorilla's cranium than that of any other now-living man).\n\n\"Let us, for the time being, call this hypothetical species Homo primigenius .\n\n.\n\n.\n\n.\n\nThis first species, or the Ape-man, the ancestor of all the others, PROBABLY arose in the tropical regions of the old world from ANTHROPOID APES.\" Asked for proofs, the evolutionist, not the least daunted, replies: \"Of these NO FOSSIL REMAINS ARE AS YET KNOWN TO US, BUT THEY WERE probably AKIN TO THE G ORILLA AND O RANG OF THE PRESENT DAY.\" And then the Papuan negro is mentioned as the probable descendant in the first line ( Pedigree of Man, p .\n\n80).\n\nHaeckel holds fast to Lemuria, which with East Africa and South Asia also, he mentions as the possible cradle of the primitive Ape-men; and so do many geologists.\n\nMr.\n\nA.\n\nR.\n\nWallace admits its reality, though in a rather modified sense, in his \" Geographical Distribution of Animals.\n\n\" But let not Evolutionists speak so lightly of the comparative size of the brains of man and the ape, for this is very unscientific, especially when they pretend to see no difference between the two, or very little at any rate.\n\nFor Vogt himself showed that, while the highest of the Apes, the gorilla, has a brain of only 30 to 51 cubic inches, the brain of the lowest of the Australian aborigines amounts to 99.35 cubic inches.\n\nThe former is thus \"not half of the size of the brain of a new-born babe,\" says Pfaff.\n\n[[Vol.\n\n2, Page]] 194 THE SECRET DOCTRINE.\n\nEarth.\" Taaroa, the creative power, the chief god, \"put man to sleep for long years, for several lives,\" which means racial periods, and is a reference to his mental sleep, as shown elsewhere.\n\nDuring that time the deity pulled an Ivi (bone) out of man and she became a woman.* Nevertheless, whatever the allegory may mean, even its exoteric meaning necessitates a divine Builder of man -- \"a Progenitor.\" Do we then believe in such \"supernatural\" beings?\n\nWe say, No.\n\nOccultism has never believed in anything, whether animate or inanimate, outside nature.\n\nNor are we Cosmolators or Polytheists for believing in \"Heavenly Man\" and divine men, for we have the accumulated testimony of the ages, with its unvarying evidence on every essential point, to support us in this; the Wisdom of the Ancients and UNIVERSAL tradition.\n\nWe reject, however, every groundless and baseless tradition, which, having outgrown strict allegory and symbolism, has found acceptance in exoteric creeds.\n\nBut that which is preserved in unanimous traditions, only the wilfully blind could reject.\n\nHence we believe in races of beings other than our own in far remote geological periods; in races of ethereal, following incorporeal, \" Arupa, \" men, with form but no solid substance, giants who preceded us pigmies; in dynasties of divine beings, those Kings and Instructors of the Third Race in arts and sciences, compared with which our little modern science stands less chance than elementary arithmetic with geometry.\n\nNo, certainly not.\n\nWe do not believe in the supernatural but only in the superhuman, or rather interhuman, intelligences.\n\nOne may easily appreciate the feeling of reluctance that an educated person would have to being classed with the superstitious and ignorant; and even realize the great truth uttered by Renan when he says that: \"The supernatural has become like the original sin, a blemish that every one seems ashamed of -- even those most religious persons who refuse in our day to accept even a minimum of Bible miracles in all their crudeness, and who, seeking to reduce them to the minimum, hide and conceal it in the furthermost corners of the past.\"** But the \"supernatural\" of Renan belongs to dogma and its dead letter.\n\nIt has nought to do with its Spirit nor with the reality of facts in Nature.\n\nIf theology asks us to believe that four or five thousand years ago men lived 900 years and more, that a portion of mankind, the enemies of the people of Israel exclusively, was composed of giants [[Footnote(s)]] ------------------------------------------------- * \" Polynesian Researches, \" Ellis.\n\nVol.\n\nII ., p.\n\n38.\n\nMissionaries seem to have pounced upon this name Ivi and made of it Eve .\n\nBut, as shown by Professor Max Muller, Eve is not the Hebrew name but an European transformation of , chavah, \"life,\" or mother of all living; \"while the Tahitian Ivi and the Maori Wheva meant bone and bone only.\" (\" False Analogies.\n\n\") ** Chaire d ' Hebreu au college de France, p.\n\n20.\n\n[[Vol.\n\n2, Page]] 195 THE HAIRY MEN OF CHINA.\n\nand monsters, we decline to believe that such a thing existed in Nature 5,000 years back.\n\nFor Nature never proceeds by jumps and starts, and logic and common sense, besides geology, anthropology and ethnology, have justly rebelled against such assertions.\n\nBut if that same theology, giving up her fantastic chronology, had claimed that men lived 969 years -- the age of Methuselah -- five million years ago, we would have nothing to say against the claim.\n\nFor in those days the physical frame of men was, compared to the present human body, as that of a megalosaurus to a common lizard.\n\nA naturalist suggests another difficulty.\n\nThe human is the only species which, however unequal in its races, can breed together."


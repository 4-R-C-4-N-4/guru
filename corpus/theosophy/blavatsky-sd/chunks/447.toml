[content]
body = "Therefore, once that the title was applied to Christ (declared God and the very God himself) Christian theology had no choice.\n\nIn order to support its dogma of the personal Trinity it had to proclaim, as it does, that the Christian Logos is the only true one, and that all the Logoi of other religions were false, and only the masquerading Evil Principles, S ATAN.\n\nNow see where this led Western theology to.\n\n*** \"For the Mind, a deity abounding in both sexes, being Life and Life, brought forth by its Word another Mind or Workman; which, being God of the Fire and the Spirit, fashioned and formed seven other Governors, which in their circles contain the [[Footnote continued on next page]] [[Vol.\n\n2, Page]] 237 MAHASURA AND SATAN.\n\nSynthetically every Creative Logos, or \"the Son who is one with the Father,\" is the Host of the Rectores Mundi in itself.\n\nEven Christian theology makes of the seven \"Angels of the Presence\" the Virtues, or the personified attributes of God, which, being created by him, as the Manus were by Brahma, became Archangels.\n\nThe Roman Catholic theodice itself recognising, in its creative Verbum Princeps, the head of those angels -- caput angelorum -- and the magni consilii Angelus (the Angel of the great Counsel), thus recognizes the identity of Christ and those Angels.\n\n\" The Gods became no-Gods, the Sura -- A -sura,\" says the text; i.e ., gods became fiends -- S ATAN, when read literally.\n\nBut Satan will now be shown, in the teaching of the Secret Doctrine, allegorized as Good, and Sacrifice, a God of Wisdom, under different names.\n\nThe Kabala teaches that Pride and Presumption -- the two chief prompters of Selfishness and Egotism -- are the causes that emptied heaven of one third of its divine denizens -- mystically, and of one third of the stars -- astronomically; in other words, the two statements are -- the first an allegory, and the second a fact.\n\nThe former, nevertheless, as shown, is intimately connected with humanity.\n\nIn their turn the Rosicrucians, who were well acquainted with the secret meaning of the tradition, kept it to themselves, teaching merely that the whole of creation was due to, and the result of, that legendary \"War in Heaven\" brought on by the rebellion of the angels * against creative law, or the Demiurge.\n\nThe statement is correct, but the inner meaning is to this day a mystery.\n\nTo elude further explanation of the difficulty by appealing to divine mystery, or to the sin of prying into its policy -- is to say nothing at all.\n\nIt may prove sufficient to [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] Phenomenal World, and whose disposition is called Fate or Destiny.\" ( Section 9, ch.\n\nI, ed.\n\nof 1579).\n\nHere it is evident that \"Mind\" (the primeval universal Divine Thought) is neither the Unknown unmanifested One, since it abounds in both sexes (is male and female), nor yet the Christian Father, as the latter is a male and not an androgyne.\n\nThe fact is that the Father, Son, and Man are hopelessly mixed up in the translations of Pymander.\n\n* The allegory of the fire of Prometheus is another version of the rebellion of the proud Lucifer, who was hurled down to the bottomless pit, or simply unto our Earth, to live as man.\n\nThe Hindu Lucifer, the Mahasura, is also said to have become envious of the Creator's resplendent light, and, at the head of inferior Asuras (not gods, but spirits), to have rebelled against Brahma; for which Siva hurled him down to Patala.\n\nBut, as philosophy goes hand in hand with allegorical fiction in Hindu myths, the devil is made to repent, and is afforded the opportunity to progress: he is a sinful man esoterically, and can by yoga devotion, and adeptship, reach his status of one with the deity, once more.\n\nHercules, the Sun-god, descends to Hades (the cave of Initiation) to deliver the victims from their tortures, etc., etc.\n\nThe Christian Church alone creates eternal torment for the devil and the damned, that she has invented.\n\n[[Vol.\n\n2, Page]] 238 THE SECRET DOCTRINE.\n\nbelievers in the Pope's infallibility, but will hardly satisfy the philosophical mind.\n\nYet the truth, although known to most of the higher Kabalists, has never been told by any of their number.\n\nOne and all, Kabalists and symbologists, showed an extraordinary reluctance to confess the primitive meaning of the Fall of the Angels.\n\nIn a Christian such silence is only natural.\n\nNeither alchemist nor philosopher could, during the Mediaeval Ages, utter that* which in the sight of orthodox theology was a terrible blasphemy, for it would have led them directly through the \"Holy\" office of the Inquisition, to stake and rack.\n\nBut for our modern Kabalists and Freethinkers the case is different.\n\nWith the latter, we fear, it is merely human pride, vanity based on a loudly rejected and as ineradicable superstition.\n\nSince the Church, in her struggle with Manichaeism, invented the devil, and by placing [[Footnote(s)]] ------------------------------------------------- * Why should, for instance, Eliphas Levi, the very fearless and outspoken Kabalist, have hesitated to divulge the mystery of the Fallen Angels so-called?\n\nThat he knew the fact and real meaning of the allegory -- both in its religious and mystical, as well as in its physiological sense -- is proved by his voluminous writings and frequent allusions and hints.\n\nYet Eliphas, after having alluded to it a hundred times in his previous works, says in his latest \" Histoire de la Magie, \" p.\n\n220 .\n\n.\n\n.\n\n\"We protest with all our might against the sovereignty and the ubiquity of Satan.\n\nWe pretend neither to deny nor affirm here the tradition on the Fall of the Angels .\n\n.\n\n.\n\nbut if so, then the prince of the Angelic Rebels can be at best the last and the most powerless among the condemned -- now that he is separated from deity -- which is the principle of every power.\n\n.\n\n.\n\n.\" This is hazy and evasive enough; but see what Hargrave Jennings writes in his weird, staccato-like style: -- \"Both Saint Michael and Saint George are types.\n\nThey are sainted personages, or dignified heroes, or powers apotheosized.\n\nThey are each represented with their appropriate faculties and attributes.\n\nThese are reproduced and stand multiplied -- distinguished by different names in all the mythologies .\n\n.\n\n.\n\n(including the Christian).\n\n.\n\n.\n\n.\n\nThe idea regarding each is a general one."


[content]
body = "The Book of Enoch, in short, is a resume, a compound of the main features of the History of the Third, Fourth and Fifth Races; a very few prophecies from the present age of the world; a long retrospective, introspective and prophetic summary of universal and quite historical events -- geological, ethnological, astronomical, and psychic -- with a touch of theogony out of the antediluvian records.\n\nThe Book of this mysterious personage is referred to and quoted copiously in the Pistis Sophia, and also in the Zohar and its most ancient Midrashim.\n\nOrigen and Clement of Alexandria held it in the highest esteem.\n\nTo say, therefore, that it is a post-Christian forgery is to utter an absurdity and to become guilty of an anachronism, since Origen, among others, lived in the second century of the Christian era, yet he mentions it as an ancient and venerable work.\n\nThe secret and sacred name and its potency are well and clearly though allegorically described in the old volume.\n\nFrom the XVIII th to the Lth chapter, the Visions of Enoch are all descriptive of the Mysteries of Initiation, one of which is the Burning Valley of the \"Fallen Angels.\" Perhaps St.\n\nAugustine was quite right in saying that the Church rejected the B OOK OF E NOCH out of her canon owing to its too great antiquity, ob nimiam antiquitatem.\n\n* There was no room for the events noticed in it within the limit of the 4004 years B.C .\n\nassigned to the world from its \"creation\"!\n\n[[Footnote(s)]] ------------------------------------------------- * City of God, I.\n\nxv.\n\nch.\n\nxxiii."


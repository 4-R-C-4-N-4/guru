[content]
body = "(See Weber, Max Muller, etc.) We labour under the impression that Colebrooke, \"the highest authority\" in such matters, had long ago settled the question by showing, that \"the Hindus were in this instance the teachers, not the learners.\" [[Vol.\n\n1, Page]] 48 THE SECRET DOCTRINE.\n\n( a ) Here we have before us the subject of centuries of scholastic disputations.\n\nThe two terms \"Alaya\" and \"Paramartha\" have been the causes of dividing schools and splitting the truth into more different aspects than any other mystic terms.\n\nAlaya is literally the \"Soul of the World\" or Anima Mundi, the \"Over-Soul\" of Emerson, and according to esoteric teaching it changes periodically its nature.\n\nAlaya, though eternal and changeless in its inner essence on the planes which are unreachable by either men or Cosmic Gods (Dhyani Buddhas), alters during the active life-period with respect to the lower planes, ours included.\n\nDuring that time not only the Dhyani-Buddhas are one with Alaya in Soul and Essence, but even the man strong in the Yoga (mystic meditation) \"is able to merge his soul with it\" (Aryasanga, the Bumapa school).\n\nThis is not Nirvana, but a condition next to it.\n\nHence the disagreement.\n\nThus, while the Yogacharyas (of the Mahayana school) say that Alaya is the personification of the Voidness, and yet Alaya ( Nyingpo and Tsang in Tibetan) is the basis of every visible and invisible thing, and that, though it is eternal and immutable in its essence, it reflects itself in every object of the Universe \"like the moon in clear tranquil water\"; other schools dispute the statement.\n\nThe same for Paramartha: the Yogacharyas interpret the term as that which is also dependent upon other things ( paratantra ); and the Madhyamikas say that Paramartha is limited to Paranishpanna or absolute perfection; i.e.\n\n, in the exposition of these \"two truths\" (out of four), the former believe and maintain that (on this plane, at any rate) there exists only Samvritisatya or relative truth; and the latter teach the existence of Paramarthasatya, the \"absolute truth.\"* \"No Arhat, oh mendicants, can reach absolute knowledge before he becomes one with Paranirvana.\n\nParikalpita and Paratantra are his two great enemies\" (Aphorisms of the Bodhisattvas).\n\nParikalpita (in Tibetan Kun-ttag ) is error, made by those unable to realize the emptiness and illusionary nature of all; who believe something to exist which does not -- e.g.\n\n, the Non-Ego.\n\nAnd [[Footnote(s)]] ------------------------------------------------- *\"Paramartha\" is self-consciousness in Sanskrit, Svasamvedana, or the \"self-analysing reflection\" -- from two words, parama (above everything) and artha (comprehension), Satya meaning absolute true being, or Esse.\n\nIn Tibetan Paramarthasatya is Dondampaidenpa.\n\nThe opposite of this absolute reality, or actuality, is Samvritisatya -- the relative truth only -- \"Samvriti\" meaning \"false conception\" and being the origin of illusion, Maya; in Tibetan Kundzabchi-denpa, \"illusion-creating appearance.\" [[Vol.\n\n1, Page]] 49 ALAYA, THE UNIVERSAL SOUL.\n\nParatantra is that, whatever it is, which exists only through a dependent or causal connexion, and which has to disappear as soon as the cause from which it proceeds is removed -- e.g ., the light of a wick.\n\nDestroy or extinguish it, and light disappears.\n\nEsoteric philosophy teaches that everything lives and is conscious, but not that all life and consciousness are similar to those of human or even animal beings.\n\nLife we look upon as \"the one form of existence,\" manifesting in what is called matter; or, as in man, what, incorrectly separating them, we name Spirit, Soul and Matter.\n\nMatter is the vehicle for the manifestation of soul on this plane of existence, and soul is the vehicle on a higher plane for the manifestation of spirit, and these three are a trinity synthesized by Life, which pervades them all.\n\nThe idea of universal life is one of those ancient conceptions which are returning to the human mind in this century, as a consequence of its liberation from anthropomorphic theology.\n\nScience, it is true, contents itself with tracing or postulating the signs of universal life, and has not yet been bold enough even to whisper \"Anima Mundi!\" The idea of \"crystalline life,\" now familiar to science, would have been scouted half a century ago.\n\nBotanists are now searching for the nerves of plants; not that they suppose that plants can feel or think as animals do, but because they believe that some structure, bearing the same relation functionally to plant life that nerves bear to animal life, is necessary to explain vegetable growth and nutrition.\n\nIt hardly seems possible that science can disguise from itself much longer, by the mere use of terms such as \"force\" and \"energy,\" the fact that things that have life are living things, whether they be atoms or planets.\n\nBut what is the belief of the inner esoteric Schools?\n\nthe reader may ask.\n\nWhat are the doctrines taught on this subject by the Esoteric \"Buddhists\"?\n\nWith them \"Alaya\" has a double and even a triple meaning.\n\nIn the Yogacharya system of the contemplative Mahayana school, Alaya is both the Universal Soul (Anima Mundi) and the Self of a progressed adept.\n\n\"He who is strong in the Yoga can introduce at will his Alaya by means of meditation into the true Nature of Existence.\" The \"Alaya has an absolute eternal existence,\" says Aryasanga -- the rival of Nagarjuna.* In one sense it is Pradhana; which [[Footnote(s)]] ------------------------------------------------- * Aryasanga was a pre-Christian Adept and founder of a Buddhist esoteric school, though Csoma di Koros places him, for some reasons of his own, in the seventh century [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 50 THE SECRET DOCTRINE."


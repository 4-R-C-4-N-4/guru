[content]
body = "\"The Head of a nation that has not been formed at the beginning in the likeness of the [[Footnote(s)]] ------------------------------------------------- * This sentence contains a dual sense and a profound mystery in the occult sciences the secret of which if , and when , known -- confers tremendous powers on the Adept to change his visible form.\n\n** Idra Suta, Zohar, iii.\n\n136, c.\n\n\"A sinking down from their status\" -- is plain; from active worlds they have fallen into a temporary obscuration -- they rest, and hence are entirely changed.\n\n[[Vol.\n\n2, Page]] 706 THE SECRET DOCTRINE.\n\nWhite Head: its people is not from this Form,\" states the Zohar (iii.).\n\n.\n\n.\n\n.\n\n\"Before it (the White Head, the Fifth Race or Ancient of the Ancients) arranged itself in its (own, or present) Form .\n\n.\n\n.\n\nall worlds have been destroyed; therefore it is written: And Bela, the Son of Beor, reigned in Edom\" (Gen.\n\nxxxvi.).\n\nHere the \"worlds\" stand for races.\n\n\"And he (such or another King of Edom) died, and another reigned in his stead\" ( ibid 31 et seq.\n\n) .\n\nNo Kabalist who has hitherto treated of the symbolism and allegory hidden under these \"Kings of Edom\" seems to have perceived more than one aspect of it.\n\nThey are neither the \" worlds that were destroyed,\" nor the \"Kings that died\" -- alone; but both, and much more, to treat of which there is no space at present.\n\nTherefore, leaving the mystic parables of the Zohar, we will return to the hard facts of materialistic science; first, however, citing a few from the long list of great thinkers who have believed in the plurality of inhabited worlds in general, and in worlds that preceded our own.\n\nThese are, the great mathematicians Leibnitz and Bernouilli, Isaac Newton himself, as can be read in his \"Optics\"; Buffon, the naturalist; Condillac, the sceptic; Bailly, Lavater, Bernardin de St.\n\nPierre, and, as a contrast to the two last named -- suspected at least of mysticism -- Diderot and most of the writers of the Encyclopaedia.\n\nFollowing these come Kant, the founder of modern philosophy; the poet philosophers, Goethe, Krause, Schelling; and many astronomers, from Bode, Fergusson and Herschell to Lalande and Laplace, with their many disciples in more recent years.\n\nA brilliant list of honoured names indeed; but the facts of physical astronomy speak even more strongly in favour of the presence of life, even organised life, on other planets.\n\nThus in four meteorites which fell respectively at Alais in France, the Cape of Good Hope, in Hungary, and again in France, there was found, on analysis, graphite, a form of carbon known to be invariably associated with organic life on this earth of ours.\n\nAnd that the presence of this carbon is not due to any action occurring within our atmosphere is shown by the fact that carbon has been found in the very centre of a meteorite; while in one which fell at Argueil, in the south of France, in 1857, there was found water and turf, the latter being always formed by the decomposition of vegetable substances.\n\nAnd further, examining the astronomical conditions of the other planets, it is easy to show that several are far better adapted for the development of life and intelligence -- even under the conditions with which men are acquainted -- than is our earth.\n\nFor instance, on the planet Jupiter the seasons, instead of varying between wide limits as do ours, change by almost imperceptible degrees, and last twelve times [[Vol.\n\n2, Page]] 707 WHAT FLAMMARION TELLS US.\n\nas long as ours.\n\nOwing to the inclination of its axis the seasons on Jupiter are due almost entirely to the eccentricity of its orbit, and hence change slowly and regularly.\n\nWe shall be told, that no life is possible on Jupiter, as it is in an incandescent state.\n\nBut not all astronomers agree with this.\n\nFor instance what we say, is said by M.\n\nFlammarion: and he ought to know.\n\nOn the other hand Venus would be less adapted for human life such as exists on earth, since its seasons are more extreme and its changes of temperature more sudden; though it is curious that the duration of the day is nearly the same on the four inner planets, Mercury, Venus, the Earth and Mars.\n\nOn Mercury, the Sun's heat and light are seven times what they are on the Earth, and astronomy teaches that it is enveloped in a very dense atmosphere.\n\nAnd as we see that life appears more active on earth in proportion to the light and heat of the sun, it would seem more than probable that its intensity is far, far greater on Mercury than here.\n\nVenus, like Mercury, has a very dense atmosphere, as also has Mars and the snows which cover their poles, the clouds which hide their surface, the geographical configuration of their seas and continents, the variations of seasons and climates, are all closely analogous -- at least to the eye of the physical astronomer.\n\nBut such facts and the considerations to which they give rise, have reference only to the possibility of the existence on these planets of human life as known on earth.\n\nThat some forms of life such as we know are possible on these planets, has been long since abundantly demonstrated, and it seems perfectly useless to go into detailed questions of the physiology, etc., etc., of these hypothetical inhabitants, since after all the reader can arrive only at an imaginary extension of his familiar surroundings.\n\nIt is better to rest content with the three conclusions which M.\n\nC.\n\nFlammarion, whom we have so largely quoted, formulates as rigorous and exact deductions from the known facts and laws of science.\n\nI.\n\nThe various forces which were active in the beginning of evolution gave birth to a great variety of beings on the several worlds; both in the organic and inorganic kingdoms.\n\nII .\n\nThe animated beings were constituted from the first according to forms and organisms in correlation with the physiological state of each inhabited globe.\n\nIII .\n\nThe humanities of other worlds differ from us, as much in their inner organization as in their external physical type.\n\nFinally the reader who may be disposed to question the validity of these conclusions as being opposed to the Bible, may be referred to an Appendix in M.\n\nFlammarion's work dealing in detail with this question; since in a work like the present it seems unnecessary to point out the [[Vol.\n\n2, Page]] 708 THE SECRET DOCTRINE.\n\nlogical absurdity of those churchmen, who deny the plurality of worlds on such grounds.\n\nIn this connection we may well recall those days when the burning zeal of the Primitive Church opposed the doctrine of the earth's rotundity, on the ground that the nations at the Antipodes would be outside the pale of salvation; and again how long it took for a nascent science to break down the idea of a solid firmament, in whose grooves the stars moved for the special edification of terrestrial humanity."


[content]
body = "No Orientalist, so far, seems to have thoroughly comprehended the real sense of the verses in the Purana, that treat of \"creation.\" Therein Brahma is the cause of the potencies that are to be generated subsequently for the work of \"creation.\" When a translator says, \"And from him proceed the potencies to be created, after they had become the real cause\": \"and from IT proceed the potencies that will create as they become the real cause\" (on the material plane) would perhaps be more correct?\n\nSave that one (causeless) ideal cause there is no other to which the universe can be referred.\n\n\"Worthiest of ascetics!\n\nthrough its potency -- i.e.\n\n, through the potency of that cause -- every created thing comes by its inherent or proper nature.\" If, in the Vedanta and Nyaya, nimitta is the efficient cause, as contrasted with upadana, the material cause, (and in the Sankhya, pradhana implies the functions of both); in the Esoteric philosophy, which reconciles all these systems, and the nearest exponent of which is the Vedanta as expounded by the Advaita Vedantists, none but the upadana can be speculated upon; that which is in the minds of the Vaishnavas (the Vasishta-dvaita) as the ideal in contradistinction to the real -- or Parabrahm and Isvara -- can find no room in published speculations, since [[Vol.\n\n1, Page]] 56 THE SECRET DOCTRINE.\n\nthat ideal even is a misnomer, when applied to that of which no human reason, even that of an adept, can conceive.\n\nTo know itself or oneself, necessitates consciousness and perception (both limited faculties in relation to any subject except Parabrahm), to be cognized.\n\nHence the \"Eternal Breath which knows itself not.\" Infinity cannot comprehend Finiteness.\n\nThe Boundless can have no relation to the bounded and the conditioned.\n\nIn the occult teachings, the Unknown and the Unknowable MOVER, or the Self-Existing, is the absolute divine Essence.\n\nAnd thus being Absolute Consciousness, and Absolute Motion -- to the limited senses of those who describe this indescribable -- it is unconsciousness and immoveableness.\n\nConcrete consciousness cannot be predicated of abstract Consciousness, any more than the quality wet can be predicated of water -- wetness being its own attribute and the cause of the wet quality in other things.\n\nConsciousness implies limitations and qualifications; something to be conscious of, and someone to be conscious of it.\n\nBut Absolute Consciousness contains the cognizer, the thing cognized and the cognition, all three in itself and all three one.\n\nNo man is conscious of more than that portion of his knowledge that happens to have been recalled to his mind at any particular time, yet such is the poverty of language that we have no term to distinguish the knowledge not actively thought of, from knowledge we are unable to recall to memory.\n\nTo forget is synonymous with not to remember.\n\nHow much greater must be the difficulty of finding terms to describe, and to distinguish between, abstract metaphysical facts or differences.\n\nIt must not be forgotten, also, that we give names to things according to the appearances they assume for ourselves.\n\nWe call absolute consciousness \"unconsciousness,\" because it seems to us that it must necessarily be so, just as we call the Absolute, \"Darkness,\" because to our finite understanding it appears quite impenetrable, yet we recognize fully that our perception of such things does not do them justice.\n\nWe involuntarily distinguish in our minds, for instance, between unconscious absolute consciousness, and unconsciousness, by secretly endowing the former with some indefinite quality that corresponds, on a higher plane than our thoughts can reach, with what we know as consciousness in ourselves.\n\nBut this is not any kind of consciousness that we can manage to distinguish from what appears to us as unconsciousness.\n\n[[Vol.\n\n1, Page]] 57 THE GERM OF LIFE.\n\nSTANZA II.\n\n-- Continued .\n\n3.\n\nT HE HOUR HAD NOT YET STRUCK; THE RAY HAD NOT YET FLASHED INTO THE GERM ( a ); THE MATRI-PADMA ( mother lotus ) HAD NOT YET SWOLLEN ( b ).* ( a ) The ray of the \"Ever Darkness\" becomes, as it is emitted, a ray of effulgent light or life, and flashes into the \"Germ\" -- the point in the Mundane Egg, represented by matter in its abstract sense.\n\nBut the term \"Point\" must not be understood as applying to any particular point in Space, for a germ exists in the centre of every atom, and these collectively form \"the Germ;\" or rather, as no atom can be made visible to our physical eye, the collectivity of these (if the term can be applied to something which is boundless and infinite) forms the noumenon of eternal and indestructible matter.\n\n( b ) One of the symbolical figures for the Dual creative power in Nature (matter and force on the material plane) is Padma , the water-lily of India.\n\nThe Lotus is the product of heat (fire) and water (vapour or Ether); fire standing in every philosophical and religious system as a representation of the Spirit of Deity,** the active, male, generative principle; and Ether, or the Soul of matter, the light of the fire, for the passive female principle from which everything in this Universe emanated.\n\nHence, Ether or Water is the Mother, and Fire is the Father.\n\nSir W.\n\nJones (and before him archaic botany) showed that the seeds of the Lotus contain -- even before they germinate -- perfectly formed leaves, the miniature shape of what one day, as perfect plants, they will become: nature thus giving us a specimen of the preformation of its production .\n\n.\n\n.\n\nthe seed of all phanerogamous plants bearing proper flowers containing an embryo plantlet ready formed.*** (See Part II., \"The Lotus Flower as an Universal Symbol.\") This explains the sentence \"The Mother had not yet swollen\" -- the form being usually sacrificed to the inner or root idea in Archaic symbology.\n\nThe Lotus, or Padma, is, moreover, a very ancient and favourite [[Footnote(s)]] ------------------------------------------------- * An unpoetical term, yet still very graphic.\n\n(See foot-note to Stanza III.) ** Even in Christianity.\n\n(See Part II., \"Primordial Substance and Divine Thought.\") *** Gross, \"The Heathen Religion,\" p.\n\n195.\n\n[[Vol.\n\n1, Page]] 58 THE SECRET DOCTRINE.\n\nsimile for the Kosmos itself, and also for man.\n\nThe popular reasons given are, firstly, the fact just mentioned, that the Lotus-seed contains within itself a perfect miniature of the future plant, which typifies the fact that the spiritual prototypes of all things exist in the immaterial world before those things become materialised on Earth.\n\nSecondly, the fact that the Lotus plant grows up through the water, having its root in the Ilus, or mud, and spreading its flower in the air above."


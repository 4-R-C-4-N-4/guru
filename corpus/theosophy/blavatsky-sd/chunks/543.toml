[content]
body = "Let every lord of the Dazzling Face (an adept of the White Magic) cause the Viwan of every lord of the Dark Face to come into his hands (or possession), lest any (of the Sorcerers) should by its means escape from the waters, avoid the rod of the Four, (Karmic deities) and save his wicked' (followers, or people).\n\n'May every yellow face send sleep from himself (mesmerize?) to every black face.\n\nMay even they (the Sorcerers) avoid pain and suffering.\n\nMay every man true to the Solar Gods bind (paralyze) every man under the lunar gods, lest he should suffer or escape his destiny.\n\n'And may every yellow face offer of his life-water (blood) to the speaking animal of a black face, lest he awaken his master.\n\n** 'The hour has struck, the black night is ready, etc., etc.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n'Let their destiny be accomplished.\n\nWe are the servants of the great Four.\n\n*** May the Kings of light return.' \" [[Footnote(s)]] ------------------------------------------------- * Wrote the late Brahmachari Bawa, a Yogi of great renown and holiness: \"Extensive works on Ashtar Vidya and such other sciences were at different times compiled in the languages of the times.\n\nBut the Sanskrit originals were lost at the time of the partial deluge of our country.\" .\n\n.\n\n.\n\n( See Theosophist of June, 1880, \"Some Things the Aryans Knew.\") For Agneyastra, see Wilson's Specimens of the Hindu Theatre, I., p.\n\n297.\n\n** Some wonderful, artificially-made beast, similar in some way to Frankenstein's creation, which spoke and warned his master of every approaching danger.\n\nThe master was a \"black magician,\" the mechanical animal was informed by a djin, an Elemental, according to the accounts.\n\nThe blood of a pure man alone could destroy him.\n\nVide Part II ., xxvii., \"Seven in Astronomy, Science, and Magic.\" *** The four Karmic gods, called the Four Maharajahs in the Stanzas.\n\n[[Vol.\n\n2, Page]] 428 THE SECRET DOCTRINE.\n\n\"The great King fell upon his dazzling Face and wept .\n\n.\n\n.\n\n.\n\n\"When the Kings assembled the waters had already moved .\n\n.\n\n.\n\n.\n\n\"(But) the nations had now crossed the dry lands.\n\nThey were beyond the water mark.\n\nTheir Kings reached them in their Viwans, and led them on to the lands of Fire and Metal (East and North).\" .\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\nStill, in another passage, it is said: -- \" .\n\n.\n\n.\n\n.\n\nStars (meteors) showered on the lands of the black Faces; but they slept.\n\n\"The speaking beasts (the magic watchers) kept quiet.\n\n\"The nether lords waited for orders, but they came not, for their masters slept.\n\n\"The waters arose, and covered the valleys from one end of the Earth to the other.\n\nHigh lands remained, the bottom of the Earth (the lands of the antipodes) remained dry.\n\nThere dwelt those who escaped; the men of the yellow-faces and of the straight eye (the frank and sincere people).\n\n\"When the Lords of the Dark Faces awoke and bethought themselves of their Viwans in order to escape from the rising waters, they found them gone.\" Then a passage shows some of the more powerful magicians of the \"Dark Face\" -- who awoke earlier than the others -- pursuing those who had \"spoilt them\" and who were in the rear-guard, for -- \"the nations that were led away, were as thick as the stars of the milky way,\" says a more modern Commentary, written in Sanskrit only.\n\n\"Like as a dragon-snake uncoils slowly its body, so the Sons of men, led on by the Sons of Wisdom, opened their folds, and spreading out, expanded like a running stream of sweet waters .\n\n.\n\n.\n\n.\n\n.\n\n.\n\nmany of the faint-hearted among them perished on their way.\n\nBut most were saved.\" Yet the pursuers, \"whose heads and chests soared high above the water,\" chased them \"for three lunar terms\" until finally reached by the rising waves, they perished to the last man, the soil sinking under their feet and the earth engulfing those who had desecrated her.\n\nThis sounds a good deal like the original material upon which the similar story in Exodus was built many hundred thousands of years later.\n\nThe biography of Moses, the story of his birth, childhood and rescue from the Nile by Pharaoh's daughter, is now shown to have been adapted from the Chaldean narrative about Sargon.\n\nAnd if so, the Assyrian tile in the British Museum being a good proof of it, why not that of the Jews robbing the Egyptians of their jewels, the death of Pharaoh and his army, and so on?\n\nThe gigantic magicians of Ruta and Daitya, the \"lords of the Dark Face,\" may have become in the later narrative the Egyptian Magi, and the yellow-faced nations of [[Vol.\n\n2, Page]] 429 SHADOWY MEMENTOS OF THE PAST.\n\nthe Fifth Race, the virtuous sons of Jacob, the \"chosen people.\" .\n\n.\n\n.\n\nOne more statement has to be made: There have been several Divine Dynasties -- a series for every Root Race beginning with the Third, each series according and adapted to its Humanity.\n\nThe last Seven Dynasties referred to in the Egyptian and Chaldean records belong to the Fifth Race, which, though generally called Aryan, was not entirely so, as it was ever largely mixed up with races to which Ethnology gives other names.\n\nIt would be impossible, in view of the limited space at our disposal, to go any further into the description of the Atlanteans, in whom the whole East believes as much as we believe in the ancient Egyptians, but whose existence the majority of the Western Scientists deny, as they have denied, before this, many a truth, from the existence of Homer down to that of the carrier pigeon.\n\nThe civilization of the Atlanteans was greater even than that of the Egyptians.\n\nIt is their degenerate descendants, the nation of Plato's Atlantis, which built the first Pyramids in the country, and that certainly before the advent of the \"Eastern AEthiopians,\" as Herodotus calls the Egyptians.\n\nThis may be well inferred from the statement made by Ammianus Marcellinus, who says of the Pyramids that \"there are also subterranean passages and winding retreats, which, it is said, men skilful in the ancient mysteries, by means of which they divined the coming of a flood, constructed in different places lest the memory of all their sacred ceremonies should be lost.\" These men who \"divined the coming of floods\" were not Egyptians, who never had any, except the periodical rising of the Nile.\n\nWho were they?\n\nThe last remnants of the Atlanteans, we maintain.\n\nThose races which are dimly suspected by Science, and thinking of which Mr.\n\nCh."


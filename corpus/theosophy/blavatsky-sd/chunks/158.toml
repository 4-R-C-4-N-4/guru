body = "Thus they translate verse 16: \"He also, having made the subtile parts of those six (the Great Self and the five organs of sense) of unmeasured brightness, to enter into the elements of Self ( Atmamatrasu ) created all beings.\" When, according to Medhatithi, it ought to read matra-Chit instead of \"Atmamatrasu,\" and thus be made to say: -- \"He having pervaded the subtile parts of those six, of unmeasured brightness, by elements of self, created all beings.\" This latter reading must be the correct one, since he, the Self , is what we call Atma, and thus constitutes the seventh principle, the synthesis of the \" six.\n\n\" Such is also the opinion of the editor of Manava-dharma Shastra , who seems to have intuitionally entered far deeper into the spirit of the philosophy than has the translator of the \"Ordinances of Manu,\" the late Dr.\n\nBurnell.\n\nFor he hesitates little between the text of Kulluka and the Commentaries of Medhatithi.\n\nRejecting the tanmatra , or subtile elements, and the atmamatrasu of Kulluka, he says, applying the principles to the Cosmic Self: \"The six appear rather to be the manas plus the five principles of Ether, air, fire, water, earth\"; \"having united five portions of these six with the spiritual element (the seventh ) he (thus) created all existing things;\" atmamatra is therefore the spiritual atom as opposed to the elementary, not reflective \"elements of himself.\" Thus he corrects the translation of verse -- \"17.\n\nAs the subtile elements of bodily forms of This One depend on these six, so [[Footnote(s)]] ------------------------------------------------- * Vide A.\n\nCoke Burnell's translation, edited by Ed.\n\nW.\n\nHopkins, Ph.D.\n\n[[Vol.\n\n1, Page]] 335 THE SEVEN PRAKRITIS.\n\nthe wise call his form carira \" (sharira) -- and he says that \"Elements\" mean here portions or parts (or principles), which reading is borne out by verse 19, which says: -- \"19.\n\nThis non-eternal (Universe) arises then from the Eternal, by means of the subtile elements of forms of those seven very glorious principles\" ( purusha ) .\n\nCommenting upon which, according to Medhatithi, the Editor remarks that \"the five elements plus mind ( Manas ) and Self-Consciousness (Ahamkara)* are meant;\" \"subtile elements,\" as before (meaning) \"five portions of form\" (or principles).\n\nFor verse 20 shows it, when saying of these (five elements, or \"five portions of form\" ( rupa , plus Manas and Self-Consciousness) that they constitute the \" seven purusha ,\" or principles , called in the Puranas the \"Seven Prakritis.\" Moreover, these \"five elements\" or \"five portions\" are spoken of in verse 27 as \"those which are called the atomic destructible portions\" -- therefore \"distinct from the atoms of the nyaya.\n\n\" This creative Brahma, issuing from the mundane or golden egg, unites in himself both the male and the female principles.\n\nHe is, in short, the same as all the creative Protologoi.\n\nOf Brahma, however, it could not be said, as of Dionysos: \"[[ protogonon diphue trigonon Baccheion Hanakta Hagrion arreton kruphion dikerota dimorphon ]]\" -- a lunar Jehovah -- Bacchus truly, with David dancing nude before his symbol in the ark -- because no licentious Dionysia were ever established in his name and honour.\n\nAll such public worship was exoteric, and the great universal symbols were distorted universally, as those of Krishna are now by the Vallabacharyas of Bombay, the followers of the infant god.\n\nBut are these popular gods the true Deity?\n\nAre they the Apex and synthesis of the sevenfold creation, man included?\n\nNever!\n\nEach and all are one of the rungs of that septenary ladder of Divine Consciousness, pagan as Christian.\n\nFor Ain-Soph also is said to manifest through the Seven Letters of Jehovah ' s name who, having usurped the place of the Unknown Limitless, was given by his devotees his Seven Angels of the Presence -- his Seven Principles.\n\nYet they are mentioned in almost every school.\n\nIn the pure Sankhya philosophy mahat , ahamkara and the five tanmatras are called the seven Prakritis (or Natures), and they are counted from Maha-Buddhi or Mahat down to Earth.\n\n(See Sankhya Karika III.\n\nand Commentaries.) Nevertheless, however disfigured for Rabbinical purposes is the original Elohistic version by Ezra, however repulsive at times even the [[Footnote(s)]] ------------------------------------------------- * Ahamkara , as universal Self-Consciousness, has a triple aspect, as also Manas.\n\nFor this conception of \"I,\" or one's Ego , is either sattwa , \"pure quietude,\" or appears as rajas , \"active,\" or remains tamas , \"stagnant,\" in darkness.\n\nIt belongs to Heaven and Earth, and assumes the properties of either.\n\n[[Vol.\n\n1, Page]] 336 THE SECRET DOCTRINE.\n\nesoteric meaning in the Hebrew scrolls, which is far more so than its outward veil or cloaking may be* -- once the Jehovistic portions are eliminated, the Mosaic books are found full of purely occult and priceless knowledge, especially in the first six chapters.\n\nRead by the aid of the Kabala one finds a matchless temple of occult truths, a well of deeply concealed beauty hidden under a structure, the visible architecture of which, its apparent symmetry notwithstanding, is unable to stand the criticism of cold reason, or to reveal its age, for it belongs to all the ages.\n\nThere is more wisdom concealed under the exoteric fables of Puranas and Bible than in all the exoteric facts and science in the literature of the world, and more OCCULT true Science, than there is of exact knowledge in all the academies.\n\nOr, in plainer and stronger language, there is as much esoteric wisdom in some portions of the exoteric Puranas and Pentateuch, as there is of nonsense and of designed childish fancy in it, when read only in the dead-letter murderous interpretations of great dogmatic religions, and especially of sects.\n\nLet anyone read the first verses of chapter i.\n\nof Genesis and reflect upon them.\n\nThere \"God\" commands to another \"god,\" who does his bidding -- even in the cautious English Protestant translation of James the First's authorised edition.\n\nIn the \"beginning,\" the Hebrew language having no word to express the idea of Eternity,** \"God\" fashions the heaven and the Earth ; and the latter is \"without form and void,\" while the former is no Heaven in fact, but the \"Deep,\" Chaos , with darkness upon its face.*** \"And the Spirit of G OD moved upon the face of the Waters\" (v."


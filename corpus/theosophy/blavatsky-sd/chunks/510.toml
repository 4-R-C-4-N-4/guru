[content]
body = "Seth and Enos were borrowed from the Sabeans and then disfigured by the Jews (exoterically); but the truth can still be traced about them even in Genesis.** Seth is the \"progenitor\" of those early men of the Third Race in whom the \"Planetary\" angels had incarnated -- a Dhyan Chohan himself, who belonged to the informing gods; and Enos (Hanoch or Enoch) or Hermes, was said to be his son -- because it was a generic name for all the early Seers (\"Enoichion\").\n\nThence the worship.\n\nThe Arabic writer Soyuti says that the earliest records mention Seth, or Set, as the founder of Sabeanism; and therefore that the pyramids which embody the planetary system were regarded as the place of sepulchre of both Seth and Idris (Hermes or Enoch), ( See Vyse, \" Operations, \" Vol.\n\nII., p.\n\n358); that thither Sabeans proceeded [[Footnote(s)]] ------------------------------------------------- * Who became later on, with the Greeks, limited only to Castor and Pollux.\n\nBut in the days of Lemuria, the Dioscuri, the \"Egg-born,\" were the Seven Dhyan Chohans (Agnishwatta-Kumara) who incarnated in the Seven Elect of the Third Race.\n\n** Clement of Alexandria recognized the astronomical significance of chapter xxv.\n\net seq.\n\nof Exodus.\n\nAccording to the Mosaic doctrine, he says that the seven planets help in the generation of terrestrial things.\n\nThe two cherubs standing on the two sides of the sacred tetragrammaton represent the Ursa Major and Ursa Minor.\n\n[[Vol.\n\n2, Page]] 362 THE SECRET DOCTRINE.\n\non pilgrimage, and chanted prayers seven times a day, turning to the North (the Mount Meru, Kaph, Olympus, etc., etc.) ( See Palgrave, Vol.\n\nII., p.\n\n264).\n\nAbd Allatif says curious things about the Sabeans and their books.\n\nSo does Eddin Ahmed Ben Yahya, who wrote 200 years later.\n\nWhile the latter maintains \"that each pyramid was consecrated to a star \" (a star regent rather), Abd Allatif assures us \"that he had read in Sabean books that one pyramid was the tomb of Agathodaemon and the other of Hermes\" ( Vyse, Vol.\n\nII., p.\n\n342).\n\n\"Agathodaemon was none other than Seth, and, according to some writers, Hermes was his son,\" adds Mr.\n\nStaniland Wake in \" The Great Pyramid, \" p.\n\n57.\n\nThus, while in Samothrace and the oldest Egyptian temples they were the great Cosmic Gods (the seven and the forty-nine Sacred Fires), in the Grecian fanes their rites became mostly phallic, therefore to the profane, obscene.\n\nIn the latter case they were 3 and 4, or 7 -- the male and female principles -- (the crux ansata ); this division showing why some classical writers held that they were only three, while others named four.\n\nAnd these were -- the Kabiri -- Axieros (in his female aspect, Demeter); Axio-Kersa (Persephone)*; Axiokersos (Pluto or Hades); and Kadmos or Kadmilos (Hermes -- not the ithyphallic Hermes mentioned by Herodotus ( II .\n\n51) but \"he of the sacred legend,\" explained only during the Samothracian mysteries).\n\nThis identification, due, according to the Scholiast Apollon (Rh.\n\nI.\n\n217), to an indiscretion of Mnaseas, is none at all, as names alone do not reveal much.\n\nThere were still others again who maintained, being as right in their way, that there were only two Kabiri.\n\nThese were, esoterically, the two Dioscuri, Castor and Pollux, and exoterically, Jupiter and Bacchus.\n\nThe two personified the terrestrial poles, geodesically; the terrestrial, and the pole of the heavens -- astronomically, as also the physical and the spiritual man.\n\nThe story of Semele and Jupiter and the birth of Bacchus, the Bimater, with all the circumstances attending it, needs only to be read esoterically to understand the allegory.\n\nThe parts played in the event by the fire, water, earth, etc., in the many versions, will show how \"the father of the gods\" [[Footnote(s)]] ------------------------------------------------- * It is a curious idea -- yet one not very far from the truth, perhaps -- that speculation of Mackey, the self-made Adept of Norwich, found in his \"Mythological Astronomy.\" He says that the Kabiri named Axieros and Axiokersa derived their names ( a ) from Kab or Cab, a measure, and from Urim , the heavens: the Kabirim being thus \"a measure of the heavens\"; and ( b ) that their distinctive names, implying the principle of generation, referred to the sexes.\n\nFor, \"the word sex was formerly understood by aix ; which has now settled .\n\n.\n\n.\n\n.\n\ninto sex.\" And he refers to \"Encyclopaedia Londinus\" at the word \" aspiration.\n\n\" Now if we give the aspirated sound to Axieros, it would be Saxieros ; and the other pole would be Saxiokersa.\n\nThe two poles would thus become the generators of the other powers of nature -- they would be the parents: therefore the most powerful gods.\n\n[[Vol.\n\n2, Page]] 363 THE POLES, THE \"HEAVENLY MEASURE.\" and the \"merry God of the wine\" were also made to personify the two terrestrial Poles.\n\nThe telluric, metalline, magnetic, electric and the fiery elements are all so many allusions and references to the cosmic and astronomic character of the diluvian tragedy.\n\nIn astronomy, the poles are indeed the \"heavenly measure\" ( vide note supra ); and so are the Kabiri Dioscuri, as will be shown, and the Kabiri-Titans, to whom Diodorus ascribes the invention of fire* and the art of manufacturing iron.\n\nMoreover, Pausanias shows that the original Kabiric deity was Prometheus.\n\n(I.\n\nix.\n\np.\n\n751.) But the fact that, astronomically, the Titans-Kabirim were also the generators and regulators of the seasons, and cosmically the great Volcanic Energies, the gods presiding over all the metals and terrestrial works, does not prevent them from being, in their original divine characters, the beneficent Entities who, symbolized in Prometheus, brought light to the world, and endowed humanity with intellect and reason.\n\nThey are pre-eminently in every theogony -- especially in the Hindu -- the sacred divine fires, 3, 7, or 49, according as the allegory demands it.\n\nTheir very names prove it, as they are the Agni-putra (Sons of the Fire) in India, and the genii of the fire under numerous names in Greece and elsewhere."


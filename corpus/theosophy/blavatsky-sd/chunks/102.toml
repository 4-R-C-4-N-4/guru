[content]
body = "Three further higher grades have to be conquered by the Arhan who would reach the apex of the ladder of Arhatship.\n\nThere are those who have reached it even in this fifth race of ours, but the faculties necessary for the attainment of these higher [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] (beginning of motion, hence of differentiation); (5) Germinal , fiery , (differentiated, but composed of the germs only of the Elements, in their earliest states, they having seven states, when completely developed on our earth); (6) Four-fold , vapoury (the future Earth); (7) Cold and depending (on the Sun for life and light).\n\n* This cannot be so very unscientific , since Descartes thought also that \"the planets rotate on their axes because they were once lucid stars, the centres of Vortices.\" [[Vol.\n\n1, Page]] 207 THE TREE FROM WHICH THE ADEPTS GROW.\n\ngrades will be fully developed in the average ascetic only at the end of this Root-Race, and in the Sixth and Seventh.\n\nThus there will always be Initiates and the Profane till the end of this minor Manvantara, the present life-cycle.\n\nThe Arhats of the \"fire-mist\" of the 7th rung are but one remove from the Root-Base of their Hierarchy -- the highest on Earth, and our Terrestrial chain.\n\nThis \"Root-Base\" has a name which can only be translated by several compound words into English\" -- \"the ever-living-human-Banyan.\" This \"Wondrous Being\" descended from a \"high region,\" they say, in the early part of the Third Age, before the separation of the sexes of the Third Race.\n\nThis Third Race is sometimes called collectively \"the Sons of Passive Yoga ,\" i.e.\n\n, it was produced unconsciously by the second Race, which, as it was intellectually inactive, is supposed to have been constantly plunged in a kind of blank or abstract contemplation, as required by the conditions of the Yoga state.\n\nIn the first or earlier portion of the existence of this third race, while it was yet in its state of purity, the \"Sons of Wisdom,\" who, as will be seen, incarnated in this Third Race, produced by Kriyasakti a progeny called the \"Sons of Ad\" or \"of the Fire-Mist,\" the \"Sons of Will and Yoga,\" etc.\n\nThey were a conscious production, as a portion of the race was already animated with the divine spark of spiritual, superior intelligence.\n\nIt was not a Race, this progeny.\n\nIt was at first a wondrous Being, called the \"Initiator,\" and after him a group of semi-divine and semi-human beings.\n\n\" Set apart \" in Archaic genesis for certain purposes, they are those in whom are said to have incarnated the highest Dhyanis, \"Munis and Rishis from previous Manvantaras\" -- to form the nursery for future human adepts , on this earth and during the present cycle.\n\nThese \"Sons of Will and Yoga\" born, so to speak, in an immaculate way, remained, it is explained, entirely apart from the rest of mankind.\n\nThe \" B EING\" just referred to, which has to remain nameless, is the Tree from which, in subsequent ages, all the great historically known Sages and Hierophants, such as the Rishi Kapila, Hermes, Enoch, Orpheus, etc., etc., have branched off.\n\nAs objective man , he is the mysterious (to the profane -- the ever invisible) yet ever present Personage about whom legends are rife in the East, especially among the Occultists and the students of the Sacred Science.\n\nIt is he who changes form, yet remains ever the same.\n\nAnd it is he again who holds spiritual sway over the [[Vol.\n\n1, Page]] 208 THE SECRET DOCTRINE.\n\ninitiated Adepts throughout the whole world.\n\nHe is, as said, the \"Nameless One\" who has so many names, and yet whose names and whose very nature are unknown.\n\nHe is the \"Initiator,\" called the \"GREAT SACRIFICE.\" For, sitting at the threshold of LIGHT, he looks into it from within the circle of Darkness, which he will not cross; nor will he quit his post till the last day of this life-cycle.\n\nWhy does the solitary Watcher remain at his self-chosen post?\n\nWhy does he sit by the fountain of primeval Wisdom, of which he drinks no longer, as he has naught to learn which he does not know -- aye, neither on this Earth, nor in its heaven?\n\nBecause the lonely, sore-footed pilgrims on their way back to their home are never sure to the last moment of not losing their way in this limitless desert of illusion and matter called Earth-Life.\n\nBecause he would fain show the way to that region of freedom and light, from which he is a voluntary exile himself, to every prisoner who has succeeded in liberating himself from the bonds of flesh and illusion.\n\nBecause, in short, he has sacrificed himself for the sake of mankind, though but a few Elect may profit by the GREAT SACRIFICE.\n\nIt is under the direct, silent guidance of this M AHA -- (great) -- G URU that all the other less divine Teachers and instructors of mankind became, from the first awakening of human consciousness, the guides of early Humanity.\n\nIt is through these \"Sons of God\" that infant humanity got its first notions of all the arts and sciences, as well as of spiritual knowledge; and it is they who have laid the first foundation-stone of those ancient civilizations that puzzle so sorely our modern generation of students and scholars.* [[Footnote(s)]] ------------------------------------------------- * Let those who doubt this statement explain the mystery of the extraordinary knowledge possessed by the ancients -- alleged to have developed from lower and animal-like savages, the cave-men of the Palaeolithic age -- on any other equally reasonable grounds.\n\nLet them turn to such works as those of Vitruvius Pollio of the Augustan age, on architecture, for instance, in which all the rules of proportion are those taught anciently at initiations , if he would acquaint himself with the truly divine art, and understand the deep esoteric significance hidden in every rule and law of proportion.\n\nNo man descended from a Palaeolithic cave-dweller could ever evolve such a science unaided, even in millenniums of thought and intellectual evolution.\n\nIt is the pupils of those incarnated Rishis and Devas of the third Root Race, who handed their knowledge from one generation to another, to Egypt and Greece with its now lost canon of proportion; as it is the Disciples of the Initiates of the 4th, the Atlanteans, who handed it over to their Cyclopes , the \"Sons of Cycles\" or of the \"Infinite,\" from whom the name passed to the still later generations of Gnostic priests.\n\n\"It is owing to the divine perfection [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 209 THE SACRED ISLAND."


[content]
body = "Were a truly learned Occultist-alchemist to write the \"Life and Adventures of an Atom\" he would secure thereby the eternal scorn of the modern chemist, perchance also his subsequent [[Footnote(s)]] ------------------------------------------------- * This is again corroborated by the same man of science in the same lecture, who quotes Clerk Maxwell, saying \"that the elements are not absolutely homogeneous.\" He writes: \"It is difficult to conceive of selection and elimination of intermediate varieties, for where can these eliminated molecules have gone to, if, as we have reason to believe, the hydrogen, &c.\n\nof the fixed stars is composed of molecules identical in all respects with our own.\" And he adds: \"In the first place we may call in question this absolute molecular identity, since we have hitherto had no means for coming to a conclusion save the means furnished by the spectroscope, while it is admitted that, for accurately comparing and discriminating the spectra of two bodies, they should be examined under identical states of temperature, pressure, and all other physical conditions.\n\nWe have certainly seen, in the spectrum of the sun, rays which we have not been able to identify.\" ** \"Each world has its Fohat, who is omnipresent in his own sphere of action.\n\nBut there are as many Fohats as there are worlds, each varying in power and degree of manifestations.\n\nThe individual Fohats make one Universal, Collective Fohat -- the aspect-Entity of the one absolute Non-Entity, which is absolute Be-Ness, 'SAT.' \"Millions and billions of worlds are produced at every Manvantara\" -- it is said.\n\nTherefore there must be many Fohats, whom we consider as conscious and intelligent Forces.\n\nThis, no doubt, to the disgust of scientific minds.\n\nNevertheless the Occultists, who have good reasons for it, consider all the forces of Nature as veritable, though supersensuous, states of Matter; and as possible objects of perception to Beings endowed with the requisite senses.\n\n[[Vol.\n\n1, Page]] 144 THE SECRET DOCTRINE.\n\ngratitude.* However it may be, \" The Breath of the Father-Mother issues cold and radiant and gets hot and corrupt , to cool once more, and be purified in the eternal bosom of inner Space ,\" says the Commentary.\n\nMan absorbs cold pure air on the mountain-top, and throws it out impure, hot and transformed.\n\nThus -- the higher atmosphere being the mouth, and the lower one the lungs of every globe -- the man of our planet breathes only the refuse of \"Mother\"; therefore, \"he is doomed to die on it.\"** ( b ) The process referred to as \"the small wheels giving birth, one to the other,\" takes place in the sixth region from above, and on the plane of the most material world of all in the manifested Kosmos -- our terrestrial plane.\n\nThese \"Seven Wheels\" are our planetary chain (see Commentary Nos.\n\n5 and 6).\n\nBy \"Wheels\" the various spheres and centres of forces are generally meant; but in this case they refer to our septenary ring.\n\n------- STANZA VI.\n\n-- Continued.\n\n4.\n\nH E BUILDS THEM IN THE LIKENESS OF OLDER W HEELS ( worlds ), PLACING THEM ON THE IMPERISHABLE CENTRES ( a ).\n\nH OW DOES F OHAT BUILD THEM?\n\nH E COLLECTS THE FIERY DUST.\n\nH E MAKES BALLS OF FIRE, RUNS THROUGH THEM AND ROUND THEM, INFUSING LIFE THEREINTO; THEN SETS THEM INTO MOTION, SOME ONE, SOME THE OTHER WAY.\n\nT HEY ARE COLD -- HE MAKES THEM HOT.\n\nT HEY ARE DRY -- HE MAKES THEM MOIST.\n\nT HEY SHINE -- HE FANS AND COOLS THEM ( b ).\n\nT HUS ACTS F OHAT FROM ONE Twilight TO THE OTHER DURING S EVEN E TERNITIES.*** ( a ) The Worlds are built \"in the likeness of older Wheels\" -- i.e.\n\n, those that existed in preceding Manvantaras and went into Pralaya, [[Footnote(s)]] ------------------------------------------------- * Indeed, if such an imaginary Chemist happened to be intuitional, and would for a moment step out of the habitual groove of strictly \"Exact Science,\" as the Alchemists of old did, he might be repaid for his audacity.\n\n** He who would allotropise sluggish oxygen into Ozone to a measure of alchemical activity, reducing it to its pure essence (for which there are means), would discover thereby a substitute for an \"Elixir of Life\" and prepare it for practical use.\n\n*** A period of 311,040,000,000,000 years, according to Brahminical calculations.\n\n[[Vol.\n\n1, Page]] 145 THE COSMIC PLANE, AN ILLUSION.\n\nbecause the L AW for the birth, growth, and decay of everything in Kosmos, from the Sun to the glow-worm in the grass, is O NE.\n\nIt is an everlasting work of perfection with every new appearance, but the Substance-Matter and Forces are all one and the same.\n\nBut this L AW acts on every planet through minor and varying laws.\n\nThe \"imperishable Laya Centres\" have a great importance, and their meaning must be fully understood if we would have a clear conception of the Archaic Cosmogony, whose theories have now passed into Occultism.\n\nAt present, one thing may be stated.\n\nThe worlds are built neither upon , nor over , nor in the Laya centres, the zero-point being a condition, not any mathematical point.\n\n( b ) Bear in mind that Fohat, the constructive Force of Cosmic Electricity, is said, metaphorically, to have sprung like Rudra from Brahma \"from the brain of the Father and the bosom of the Mother,\" and then to have metamorphosed himself into a male and a female, i.e.\n\n, polarity, into positive and negative electricity.\n\nHe has seven sons who are his brothers; and Fohat is forced to be born time after time whenever any two of his son-brothers indulge in too close contact -- whether an embrace or a fight.\n\nTo avoid this, he binds together and unites those of unlike nature and separates those of similar temperaments.\n\nThis, of course, relates, as any one can see, to electricity generated by friction and to the law involving attraction between two objects of unlike, and repulsion between those of like polarity.\n\nThe Seven \"Sons-brothers,\" however, represent and personify the seven forms of Cosmic magnetism called in practical Occultism the \"Seven Radicals,\" whose co-operative and active progeny are, among other energies, Electricity, Magnetism, Sound, Light, Heat, Cohesion, etc.\n\nOccult Science defines all these as Super-sensuous effects in their hidden behaviour, and as objective phenomena in the world of senses; the former requiring abnormal faculties to perceive them -- the latter, our ordinary physical senses.\n\nThey all pertain to, and are the emanations of, still more supersensuous spiritual qualities, not personated by, but belonging to, real and conscious CAUSES.\n\nTo attempt a description of such ENTITIES would be worse than useless."


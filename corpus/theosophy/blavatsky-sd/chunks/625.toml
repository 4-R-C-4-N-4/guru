[content]
body = "Tacitly admitting the All-Presence of the boundless Circle and making of it the universal Postulate upon which the whole of the manifested universe is based, the Sage keeps a reverential silence concerning that upon which no mortal men should dare to speculate.\n\n\"The Logos of God is the revealer of man, and the logos (the verb) of man is the revealer of God,\" says Eliphas Levi in one of his paradoxes.\n\nTo this, the Eastern Occultist would reply: -- \"On this condition, however, that man should be dumb on the CAUSE that produced both God and its logos.\n\nOtherwise, he becomes invariably the reviler, not the 'revealers' of the incognizable Deity.\" We have now to approach a mystery -- the Hebdomad in nature.\n\nPerchance, all that we may say, will be attributed to coincidence.\n\nWe may be told that this number in nature is quite natural (so we say too), and has no more significance than the illusion of motion which forms the so-called \"Strobic circles.\" No great importance was given to these \"singular illusions\" when Professor Sylvanus Thompson exhibited them at the meeting of the British Association in 1877.\n\nNevertheless we should like to learn the scientific explanation why seven should ever form itself as a pre-eminent number -- six concentric circles around a seventh, and seven rings within one another round a central point, etc., etc.\n\n-- in this illusion, produced by a swaying saucer, or any other vessel.\n\nWe give the solution refused by science in the section which follows.\n\n[[Footnote(s)]] ------------------------------------------------- * Sermon the 160th."


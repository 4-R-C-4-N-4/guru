[content]
body = "The Lingham and Yoni of the modern average Hindu is, on the face of it, of course, no better than the Rabbinical \"Holy of Holies,\" -- but it is no worse; and this is a point gained on the Christian traducers of the Asiatic religious philosophies.\n\nFor, in such religious myths, in the hidden symbolism of a creed and philosophy, the spirit of the tenets propounded ought to decide their relative value.\n\nAnd who will say, that, examined either way, this so-called \"Wisdom,\" applied solely to the uses and benefit of one little nation, has ever developed in it anything like national ethics.\n\nThe Prophets are there, to show the walk in life, before, during, and after the days of Moses, of the chosen but \"stiff-necked\" people.\n\nThat they have had at one time the Wisdom-Religion and use of the universal language and its symbols at their disposal and in their possession, is proved by the same esotericism existing to this day in India with regard to the \"Holy of Holies.\" This, as said, was and still is the passage through the \"golden\" cow in the same stooping position as the one shown in the gallery of the pyramid, which identified man with Jehovah in Hebrew esotericism.\n\nThe whole difference lies in the Spirit of Interpretation.\n\nWith the Hindus as with the ancient Egyptians that spirit was and is entirely metaphysical and psychological; with the Hebrews it was realistic and physiological.\n\nIt pointed to the first sexual separation of the human race (Eve giving birth to Cain-Jehovah, as shown in the \"Source of Measures\"); to the consummation of terrestrial physiological union and conception (as in the allegory of Cain shedding Abel's blood -- Habel, the feminine principle) and -- child-bearing; a process shown to have begun in the Third Race, or with Adam's THIRD son, Seth, with whose son Henoch, men began to call themselves Jehovah or Jah - hovah, the male Jod and Havah or Eve -- to wit, male and female beings .* Thus the difference lies in the religious and ethical feeling, but the two symbols are identical.\n\nThere is no doubt that, with the fully initiated Judaean Tanaim, the inner sense of the symbolism was as holy in its abstraction as with the ancient Aryan Dwijas.\n\nThe worship of the \"god in the ark\" dates only from David; and for a thousand years Israel knew of no phallic Jehovah.\n\nAnd now the old Kabala, edited and re-edited, has become tainted with it.\n\nWith the ancient Aryans the hidden meaning was grandiose, sublime, and poetical, however much the external appearance of their symbol may now militate against the claim.\n\nThe ceremony of passing through [[Footnote(s)]] ------------------------------------------------- * In the fourth chapter of Genesis, v.\n\n26, it is mis-translated, \" .\n\n.\n\n.\n\nAnd he called his name Enos (man); then began men to call upon the name of the Lord.\" -- which has no sense in it, since Adam and the others must have done the same.\n\n[[Vol.\n\n2, Page]] 470 THE SECRET DOCTRINE.\n\nthe Holy of Holies (now symbolized by the cow), in the beginning through the temple Hiranya gharba (the radiant Egg) -- in itself a symbol of Universal, abstract nature -- meant spiritual conception and birth, or rather the re - birth of the individual and his regeneration: the stooping man at the entrance of the Sanctum Sanctorum, ready to pass through the matrix of mother nature, or the physical creature ready to re-become the original spiritual Being, pre-natal M AN.\n\nWith the Semite, that stooping man meant the fall of Spirit into matter, and that fall and degradation were apotheosized by him with the result of dragging Deity down to the level of man.\n\nFor the Aryan, the symbol represented the divorce of Spirit from matter, its merging into and return to its primal Source; for the Semite, the wedlock of spiritual man with material female nature, the physiological being taking pre-eminence over the psychological and the purely immaterial.\n\nThe Aryan views of the symbolism were those of the whole Pagan world; the Semite interpretations emanated from, and were pre-eminently those of a small tribe, thus marking its national features and the idiosyncratic defects that characterize many of the Jews to this day -- gross realism, selfishness, and sensuality.\n\nThey had made a bargain, through their father Jacob, with their tribal deity, self-exalted above all others, and a covenant that his \"seed shall be as the dust of the earth\"; and that deity could have no better image henceforth than that of the symbol of generation, and, as representation, a number and numbers.\n\nCarlyle has wise words for both these nations.\n\nWith the Hindu Aryan -- the most metaphysical and spiritual people on earth -- religion has ever been, in his words, \"an everlasting lode-star, that beams the brighter in the heavens the darker here on earth grows the night around him.\" The religion of the Hindu detaches him from this earth; therefore, even now, the cow-symbol is one of the grandest and most philosophical among all others in its inner meaning.\n\nTo the \" M ASTERS\" and \"Lords\" of European potencies -- the Israelites -- certain words of Carlyle apply still more admirably; for them \"religion is a wise prudential feeling grounded on mere calculation \" -- and it was so from its beginnings.\n\nHaving burdened themselves with it, Christian nations feel bound to defend and poetise it, at the expense of all other religions.\n\nBut it was not so with the ancient nations.\n\nFor them the passage entrance and the sarcophagus in the King's chamber meant regeneration -- not generation.\n\nIt was the most solemn symbol, a Holy of Holies, indeed, wherein were created immortal Hierophants and \"Sons of God\" -- never mortal men and Sons of lust and flesh -- as now in the hidden sense of the Semite Kabalist.\n\nThe reason for the difference in the views of the two races is easy to account for.\n\nThe Aryan Hindu belongs to the oldest races now on earth; the Semite Hebrew to the latest.\n\nOne is nearly one [[Vol.\n\n2, Page 471]] THE CRAFT OF THE RABBINS.\n\nmillion years old; the other is a small sub-race some 8,000 years old and no more.* But Phallic worship has developed only with the gradual loss of the keys to the inner meaning of religious symbols; and there was a day when the Israelites had beliefs as pure as the Aryans have.\n\nBut now Judaism, built solely on Phallic worship, has become one of the latest creeds in Asia, and theologically a religion of hate and malice toward everyone and everything outside themselves.\n\nPhilo Judaeus shows what was the genuine Hebrew faith.\n\nThe sacred Writings, he says, prescribe what we ought to do .\n\n.\n\n.\n\ncommanding us to hate the heathen and their laws and institutions."


body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n1 [[Vol.\n\n1, Page]] 152 THE SECRET DOCTRINE.\n\n[[This page continued from previous section ]] A FEW EARLY THEOSOPHICAL MISCONCEPTIONS CONCERNING PLANETS, ROUNDS, AND MAN.\n\nAmong the eleven Stanzas omitted* there is one which gives a full description of the formation of the planetary chains one after another, after the first Cosmic and Atomic differentiation had commenced in the primitive Acosmism.\n\nIt is idle to speak of \"laws arising when Deity prepares to create\" for ( a ) laws or rather L AW is eternal and uncreated; and ( b ) that Deity is Law, and vice versa.\n\nMoreover, the one eternal L AW unfolds everything in the (to be) manifested Nature on a sevenfold principle; among the rest, the countless circular chains of worlds, composed of seven globes, graduated on the four lower planes of the world of formation (the three others belonging to the Archetypal Universe).\n\nOut of these seven only one , the lowest and the most material of those globes , is within our plane or means of perception, the six others lying outside of it and being therefore invisible to the terrestrial eye.\n\nEvery such chain of worlds is the progeny and creation of another, lower , and dead chain -- its reincarnation , so to say.\n\nTo make it clearer: we are told of the planets -- of which seven only were held as sacred, as being ruled by the highest regents or gods, and not at all because the ancients knew nothing of the others** -- that each of these, whether known or unknown, is a septenary, as is the chain to which the Earth belongs (see \"Esoteric [[Footnote(s)]] to diagram * See the note which follows the Commentary on the preceding page, and also the summary of the Stanzas in the Proem, page 22.\n\n** Many more planets are enumerated in the Secret Books than in modern astronomical works.\n\n[[Vol.\n\n1, Page]] 153 DESCENDING AND RE-ASCENDING STATES.\n\nBuddhism\").\n\nFor instance, all such planets as Mercury, Venus, Mars, Jupiter, Saturn, etc., etc., or our Earth, are as visible to us as our globe, probably, is to the inhabitants of the other planets, if any, because they are all on the same plane; while the superior fellow-globes of these planets are on other planes quite outside that of our terrestrial senses.\n\nAs their relative position is given further on, and also in the diagram appended to the Comments on Verse 7 of Stanza VI., a few words of explanation is all that is needed at present.\n\nThese invisible companions correspond curiously to that which we call \"the principles in Man.\" The seven are on three material planes and one spiritual plane, answering to the three Upadhis (material bases) and one spiritual vehicle ( Vahan ) of our seven principles in the human division.\n\nIf, for the sake of a clearer mental conception, we imagine the human principles to be arranged as in the following scheme, we shall obtain the annexed diagram of correspondences: -- D IAGRAM I .\n\n[[Footnote(s) to diagram]] ------------------------------------------------- *As we are proceeding here from Universals to Particulars, instead of using the inductive or Aristotelean method, the numbers are reversed.\n\nSpirit is enumerated the first instead of seventh, as is usually done, but, in truth, ought not to be done.\n\n† Or as usually named after the manner of Esoteric Buddhism and others: 1, Atma; 2, Buddhi (or Spiritual Soul); 3, Manas (Human Soul); 4, Kama Rupa (Vehicle of Desires and Passions); 5, Linga Sarira; 6, Prana; 7, Sthula Sarira.\n\n[[Vol.\n\n1, Page]] 154 THE SECRET DOCTRINE.\n\nThe dark horizontal lines of the lower planes are the Upadhis in one case, and the planes in the case of the planetary chain.\n\nOf course, as regards the human principles, the diagram does not place them quite in order, yet it shows the correspondence and analogy to which attention is now drawn.\n\nAs the reader will see, it is a case of descent into matter, the adjustment -- in both the mystic and the physical senses -- of the two, and their interblending for the great coming \"struggle of life\" that awaits both the entities.\n\n\"Entity\" may be thought a strange term to use in the case of a globe; but the ancient philosophers, who saw in the earth a huge \"animal,\" were wiser in their generation than our modern geologists are in theirs; and Pliny, who called the Earth our kind nurse and mother, the only element which is not inimical to man, spoke more truly than Watts, who fancied that he saw in her the footstool of God.\n\nFor Earth is only the footstool of man in his ascension to higher regions; the vestibule -- \".\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\nto glorious mansions, Through which a moving crowd for ever press.\" But this only shows how admirably the occult philosophy fits everything in Nature, and how much more logical are its tenets than the lifeless hypothetical speculations of physical science.\n\nHaving learned thus much, the mystic will be better prepared to understand the occult teaching, though every formal student of modern science may, and probably will, regard it as preposterous nonsense.\n\nThe student of occultism, however, holds that the theory at present under discussion is far more philosophical and probable than any other.\n\nIt is more logical, at any rate, than the theory recently advanced which made of the moon the projection of a portion of our Earth extruded when the latter was but a globe in fusion, a molten plastic mass.* It is said that the planetary chains having their \"Days\" and their [[Footnote(s)]] ------------------------------------------------- * Says the author of \"Modern Science and Modern Thought,\" Mr.\n\nSamuel Laing: \"The astronomical conclusions are theories based on data so uncertain, that while in some cases they give results incredibly short, like that of 15 millions of years for the whole past process of formation of the solar system, in others they give results almost incredibly long, as in that which supposes the moon to have been thrown off when the Earth was rotating in three hours , while the utmost actual retardation obtained from observation would require 600 millions of years to make it rotate in twenty-three hours instead of twenty-four\" (p.\n\n48).\n\nAnd if physicists persist, why should the chronology of the Hindus be laughed at as exaggerated?\n\n[[Vol.\n\n1, Page]] 155 EXCHANGE OF LIFE-PRINCIPLES.\n\n\"Nights\" -- i.e.\n\n, periods of activity or life, and of inertia or death -- and behave in heaven as do men on Earth: they generate their likes, get old, and become personally extinct, their spiritual principles only living in their progeny as a survival of themselves.\n\nWithout attempting the very difficult task of giving out the whole process in all its cosmic details, enough may be said to give an approximate idea of it."


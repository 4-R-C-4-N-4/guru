body = "D ARKNESS ALONE FILLED THE BOUNDLESS ALL ( a ), FOR FATHER, MOTHER AND SON WERE ONCE MORE ONE, AND THE SON HAD NOT AWAKENED YET FOR THE NEW WHEEL* AND HIS PILGRIMAGE THEREON ( b ).\n\n( a ) \"Darkness is Father-Mother: light their son,\" says an old Eastern proverb.\n\nLight is inconceivable except as coming from some source which is the cause of it; and as, in the instance of primordial light, that source is unknown, though as strongly demanded by reason and logic, therefore it is called \"Darkness\" by us, from an intellectual point of view.\n\nAs to borrowed or secondary light, whatever its source, it can be but of a temporary mayavic character.\n\nDarkness, then, is the eternal [[Footnote(s)]] ------------------------------------------------- * That which is called \"wheel\" is the symbolical expression for a world or globe, which shows that the ancients were aware that our Earth was a revolving globe, not a motionless square as some Christian Fathers taught.\n\nThe \"Great Wheel\" is the whole duration of our Cycle of being, or Maha Kalpa, i.e.\n\n, the whole revolution of our special chain of seven planets or Spheres from beginning to end; the \"Small Wheels\" meaning the Rounds, of which there are also Seven.\n\n[[Vol.\n\n1, Page]] 41 WHAT IS DARKNESS IN PHILOSOPHY?\n\nmatrix in which the sources of light appear and disappear.\n\nNothing is added to darkness to make of it light, or to light to make it darkness, on this our plane.\n\nThey are interchangeable, and scientifically light is but a mode of darkness and vice versa.\n\nYet both are phenomena of the same noumenon -- which is absolute darkness to the scientific mind, and but a gray twilight to the perception of the average mystic, though to that of the spiritual eye of the Initiate it is absolute light.\n\nHow far we discern the light that shines in darkness depends upon our powers of vision.\n\nWhat is light to us is darkness to certain insects, and the eye of the clairvoyant sees illumination where the normal eye perceives only blackness.\n\nWhen the whole universe was plunged in sleep -- had returned to its one primordial element -- there was neither centre of luminosity, nor eye to perceive light, and darkness necessarily filled the boundless all.\n\n( b ) The Father-Mother are the male and female principles in root-nature, the opposite poles that manifest in all things on every plane of Kosmos, or Spirit and Substance, in a less allegorical aspect, the resultant of which is the Universe, or the Son.\n\nThey are \"once more One\" when in \"The Night of Brahma,\" during Pralaya, all in the objective Universe has returned to its one primal and eternal cause, to reappear at the following Dawn -- as it does periodically.\n\n\"Karana\" -- eternal cause -- was alone.\n\nTo put it more plainly: Karana is alone during the \"Nights of Brahma.\" The previous objective Universe has dissolved into its one primal and eternal cause, and is, so to say, held in solution in space, to differentiate again and crystallize out anew at the following Manvantaric dawn, which is the commencement of a new \"Day\" or new activity of Brahma -- the symbol of the Universe.\n\nIn esoteric parlance, Brahma is Father-Mother-Son, or Spirit, Soul and Body at once; each personage being symbolical of an attribute, and each attribute or quality being a graduated efflux of Divine Breath in its cyclic differentiation, involutionary and evolutionary.\n\nIn the cosmicophysical sense, it is the Universe, the planetary chain and the earth; in the purely spiritual, the Unknown Deity, Planetary Spirit, and Man -- the Son of the two, the creature of Spirit and Matter, and a manifestation of them in his periodical appearances on Earth during the \"wheels,\" or the Manvantaras.\n\n-- ( See Part II.\n\n§: \" Days and Nights of Brahma.\n\n\") [[Vol.\n\n1, Page]] 42 THE SECRET DOCTRINE.\n\nSTANZA I.\n\n-- Continued .\n\n6.\n\nT HE SEVEN SUBLIME L ORDS AND THE SEVEN T RUTHS HAD CEASED TO BE ( a ), AND THE U NIVERSE, THE SON OF NECESSITY, WAS IMMERSED IN P ARANISHPANNA ( b ) (absolute perfection, Paranirvana, which is Yong-Grub) TO BE OUT-BREATHED BY THAT WHICH IS AND YET IS NOT.\n\nN AUGHT WAS ( c ).\n\n( a ) The seven sublime lords are the Seven Creative Spirits, the Dhyan-Chohans, who correspond to the Hebrew Elohim.\n\nIt is the same hierarchy of Archangels to which St.\n\nMichael, St.\n\nGabriel, and others belong, in the Christian theogony.\n\nOnly while St.\n\nMichael, for instance, is allowed in dogmatic Latin theology to watch over all the promontories and gulfs, in the Esoteric System, the Dhyanis watch successively over one of the Rounds and the great Root-races of our planetary chain.\n\nThey are, moreover, said to send their Bhodisatvas, the human correspondents of the Dhyani-Buddhas (of whom vide infra ) during every Round and Race.\n\nOut of the Seven Truths and Revelations, or rather revealed secrets, four only have been handed to us, as we are still in the Fourth Round, and the world also has only had four Buddhas, so far.\n\nThis is a very complicated question, and will receive more ample treatment later on.\n\nSo far \"There are only Four Truths, and Four Vedas\" -- say the Hindus and Buddhists.\n\nFor a similar reason Irenaeus insisted on the necessity of Four Gospels.\n\nBut as every new Root-race at the head of a Round must have its revelation and revealers, the next Round will bring the Fifth, the following the Sixth, and so on.\n\n( b ) \" Paranishpanna \" is the absolute perfection to which all existences attain at the close of a great period of activity, or Maha-Manvantara, and in which they rest during the succeeding period of repose.\n\nIn Tibetan it is called Yong-Grub.\n\nUp to the day of the Yogacharya school the true nature of Paranirvana was taught publicly, but since then it has become entirely esoteric; hence so many contradictory interpretations of it.\n\nIt is only a true Idealist who can understand it.\n\nEverything has to be viewed as ideal, with the exception of Paranirvana, by him who would comprehend that state, and acquire a knowledge of how Non Ego, Voidness, and Darkness are Three in One and alone Self-existent and perfect.\n\nIt is absolute, however, only in a relative [[Vol."


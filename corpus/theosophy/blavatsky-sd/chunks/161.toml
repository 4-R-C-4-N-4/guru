[content]
body = "\"Therefore, it was taught in the inner temples that this visible universe of spirit and matter is but the concrete image of the ideal abstraction; it was built on the model of the first DIVINE IDEA.\n\nThus our universe existed from Eternity in a latent state.\n\nThe soul animating this purely spiritual universe is the central sun, the highest deity itself.\n\nIt was not the One who built the concrete form of the idea, but the first-begotten; and as it was constructed on the geometrical figure of the dodecahedron,* the first-begotten 'was pleased to employ twelve thousand years in its creation.' The latter number is expressed in the Tyrrhenian cosmogony,** which shows man created in the sixth millennium.\n\nThis agrees with the Egyptian theory of 6,000 'years'*** and with the Hebrew computation.\n\nBut it is the exoteric form of it.\n\nThe secret computation explains that the 'twelve thousand and the 6,000 years' are YEARS OF B RAHMA -- one day of Brahma being equal to 4,320,000,000 years.\n\nSanchoniathon**** in his Cosmogony , declares that when the wind (spirit) became enamoured of its own principles (the chaos), an intimate union took place, which connection was called pothos , and from this sprang the seed of all.\n\nAnd the chaos knew not its own production, for it was senseless; but from its embrace with the wind was generated Mot, or the ilus (mud).***** From this proceeded the spores of creation and the generation of the universe.\n\n\"Zeus-Zen (aether), and Chthonia (the chaotic earth) and Metis (the water), his wives; Osiris and Isis-Latona -- the former god also representing ether -- the first emanation of the Supreme Deity, Amun, the primeval source of light; the goddess earth and water again; Mithras,****** the rock-born god, the symbol of the male mundane-fire, or the personified primordial light, and Mithra, the fire-goddess, at once his mother and his wife: the pure element of fire (the active or male principle) regarded as light and heat, in conjunction with earth and water, or matter (female, or passive, elements of Cosmical generation) [[Footnote(s)]] ------------------------------------------------- * Plato: \"Timaeus.\" ** \"Suidas\" v.\n\nTyrrhenia.\" *** The reader will understand that by \"years\" is meant \"ages,\" not mere periods of thirteen lunar months each.\n\n**** See the Greek translation by Philo Byblius.\n\n***** Cory: \"Ancient Fragment.\" ****** Mithras was regarded among the Persians as the Theos ekpetros -- god of the rock.\n\n[[Vol.\n\n1, Page]] 341 ONE TREE OF KNOWLEDGE.\n\nMithras is the son of Bordj, the Persian mundane mountain,* from which he flashed out as a radiant ray of light.\n\nBrahma, the fire-god, and his prolific consort; and the Hindu Agni, the refulgent deity from whose body issue a thousand streams of glory and seven tongues of flame, and in whose honour certain Brahmans preserve to this day a perpetual fire; Siva, personated by the mundane mountain of the Hindus, the Meru : these terrific fire-gods, who are said in the legend to have descended from heaven, like the Jewish Jehovah, in a pillar of fire , and a dozen other Archaic double-sexed deities, all loudly proclaim their hidden meaning.\n\nAnd what could these dual myths mean but the psychochemical principle of primordial creation?\n\nThe first Evolution in its triple manifestation of spirit, force and matter; the divine correllation at its starting point, allegorized as the marriage of Fire and water, products of electrifying spirit, union of the male active principle with the female passive element, which become the parents of their tellurian child, cosmic matter, the prima materia , whose soul is AEther, and whose shadow is the ASTRAL LIGHT!\" ( I SIS U NVEILED).\n\nThe fragments of the systems that have now reached us are rejected as absurd fables.\n\nNevertheless, occult Science -- having survived even the great Flood that submersed the antediluvian giants and with them their very memory, save in the Secret Doctrine, the Bible and other Scriptures -- still holds the Key to all the world problems.\n\nLet us apply that Key to the rare fragments of long-forgotten cosmogonies and try by their scattered parts to re-establish the once Universal Cosmogony of the Secret Doctrine.\n\nThe Key fits them all.\n\nNo one can study ancient philosophies seriously without perceiving that the striking similitude of conception between all -- in their exoteric form very often, in their hidden spirit invariably -- is the result of no mere coincidence, but of a concurrent design: and that there was, during the youth of mankind, one languages, one knowledge, one universal religion, when there were no churches, no creeds or sects, but when every man was a priest unto himself.\n\nAnd, if it is shown that already in those ages which are shut out from our sight by the exuberant growth of tradition, human religious thought developed in uniform sympathy in every portion of the globe; then, it becomes evident that, born under whatever latitude, in the cold North or the burning South, in the East or West, that thought was inspired by the same revelations, and man was nurtured under the protecting shadow of the same TREE OF KNOWLEDGE.\n\n[[Footnote(s)]] ------------------------------------------------- * Bordj is called a fire-mountain -- a volcano ; therefore it contains fire, rock, earth and water: the male, or active and the female, or passive, elements.\n\nThe myth is suggestive.\n\n-------------- Next Chapter Contents"


[content]
body = "\"There may have been not one, but twenty different races upon the earth before the time of Adam, just as there may be twenty different races of men on other worlds\" (p.\n\n55).\n\n.\n\n.\n\n.\n\nWho, then, or what were those races, since the author still maintains that Adam is the first man of our race?\n\nIt was THE SATANIC RACE AND RACES!\n\n\"Satan (was) never in heaven, Angels and men (being) one species.\" It was the pre-Adamic race of \"Angels that sinned.\" Satan was \"the first Prince of this world,\" we read.\n\nHaving died in consequence of his rebellion, he remained on earth as a disembodied Spirit , and tempted Adam and Eve.\n\n\"The earlier ages of the Satanic race, and more especially during the life-time of Satan ( !!!\n\n) may have been a period [[Footnote(s)]] ------------------------------------------------- * \"Primeval Man Unveiled, or the Anthropology of the Bible\"; author (unknown) of the \"Stars and the Angels\" 1870, p.\n\n195.\n\n** Especially in the face of the evidence furnished by the authorized Bible itself in ch.\n\niv.\n\nof Genesis , v .\n\n16 and 17, which shows Cain going to the land of Nod and there marrying a wife.\n\n[[Vol.\n\n1, Page]] 325 THE IMPARTIALITY OF SCIENTIFIC DENIALS.\n\nof patriarchal civilization and comparative repose -- a time of Tubal-Cains and Jubals, when both Sciences and arts attempted to strike their roots into the accursed ground.\n\n.\n\n.\n\n.\n\n.\n\nWhat a subject for an epic.\n\n.\n\n.\n\n.\n\n(when) there are inevitable incidents which must have occurred.\n\nWe see before us .\n\n.\n\n.\n\n.\n\nthe gay primeval lover wooing his blushing bride at dewy eve under the Danish oaks, that then grew where now no oaks will grow .\n\n.\n\n.\n\n.\n\nthe grey primeval patriarch .\n\n.\n\n.\n\n.\n\nthe primeval offspring innocently gambolling by his side.\n\n.\n\n.\n\n.\n\n.\n\nA thousand such pictures rise before us\"!\n\n.\n\n.\n\n.\n\n.\n\n(pp.\n\n206-207).\n\nThe retrospective glance at this Satanic \"blushing bride\" in the days of Satan's innocence, does not lose in poetry as it gains in originality.\n\nQuite the reverse.\n\nThe modern Christian bride -- who does not often blush nowadays before her gay modern lovers -- might even derive a moral lesson from this daughter of Satan, in the exuberant fancy of her first human biographer.\n\nThese pictures -- and to appreciate them at their true value they must be examined in the volume that describes them -- are all suggested with a view to reconcile the infallibility of revealed Scripture with Sir C.\n\nLyell's \"Antiquity of Man\" and other damaging scientific works.\n\nBut this does not prevent truth and fact appearing at the foundation of these vagaries, which the author has never dared to sign with his own, or even a borrowed name.\n\nFor, his pre-Adamic races -- not Satanic but simply Atlantic, and the Hermaphrodites before the latter -- are mentioned in the Bible when read esoterically, as they are in the Secret Doctrine.\n\nThe SEVEN KEYS open the mysteries, past and future, of the seven great Root Races, as of the seven Kalpas.\n\nThough the genesis of man, and even the esoteric geology, will surely be rejected by Science just as much as the Satanic and pre-Adamic races, yet if having no other way out of their difficulties the Scientists have to choose between the two, we feel certain that, Scripture notwithstanding, once the mystery language is approximately mastered, it is the archaic teaching that will be accepted.\n\n------- [[This page continued in next section]]"


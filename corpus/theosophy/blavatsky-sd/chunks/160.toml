[content]
body = ") But now the Elements are degraded into and limited to atoms of which nothing is known, so far, and which are only \"children of necessity\" as Ether is too -- as we said in \" I SIS.\" \"The poor primordial elements have long been exiled, and our ambitious physicists run races to determine who shall add one more to the fledgling brood of the sixty and odd elementary substances.\" Meanwhile there rages a war in modern chemistry about terms.\n\nWe are denied the right to call these substances \"chemical elements,\" for they are not \"primordial principles of self-existing essences out of which the universe was fashioned,\" according to Plato.\n\nSuch ideas associated with the word element were good enough for the \"old Greek philosophy,\" but modern science rejects them; for, as Professor Crookes says, \"they are unfortunate terms,\" and experimental science will have \"nothing to do with any kind of essences except those which it can see, smell, or taste.\n\nIt leaves others to the metaphysicians.\n\n.\n\n.\n\n.\" We must feel grateful even for so much.\n\n** Writing upon this subject in Isis Unveiled we said of it that it was: \"The Chaos of the ancients, the Zoroastrian sacred fire, or the Atash-Behram of the Parsees; the Hermes-fire, the Elmes-fire of the ancient Germans; the lightning of Cybele; the burning torch of Apollo; the flame on the altar of Pan; the inextinguishable fire in the temple on the Acropolis, and in that of Vesta; the fire-flame of Pluto's helm; the brilliant sparks on the hats of the Dioscuri, on the Gorgon head, the helm of Pallas, and the staff of Mercury; the Egyptian Phtha-Ra; the Grecian Zeus Cataibates (the descending) of Pausanias; the pentacostal fire-tongues; the burning bush of Moses; the pillar of fire of the Exodus , and the \"burning lamp\" of Abram, the eternal fire of the \"bottomless pit\"; the Delphic oracular vapours; the Sidereal light of the Rosicrucians; the A KASA of the Hindu adepts; the Astral Light of Eliphas Levi; the nerve-aura and the fluid of the magnetists; the od of the Reichenbach; the Psychod and ectenic force of Thury; the psychic force of Sergeant Cox, and the atmospheric magnetism of some naturalists; galvanism; and finally, electricity -- all these are but various names for many different manifestations or effects of the same mysterious, all-pervading cause, the Greek Archeus.\n\n\" We now add -- it is all this and much more.\n\n[[Vol.\n\n1, Page]] 339 THE MYSTIC FIRE.\n\nLight\" and Magnes.\n\nAs truly expressed by an opponent, Magus and magnes are two branches growing from the same trunk and shooting forth the same resultants.\n\nAnd in this appellation of \"living fire\" we may also discover the meaning of the puzzling sentence in the Zend-Avesta saying that there is \"a fire that gives knowledge of the future.\n\nScience and amiable speech,\" i.e.\n\n, develops an extraordinary eloquence in the sybil, the sensitive, and even some orators.\n\nThis \"fire\" is spoken of in all the Hindu Books, as also in the Kabalistic works.\n\nThe Zohar explains it as the \"white hidden fire, in the Resha trivrah \" (the White Head), whose Will causes the fiery fluid to flow in 370 currents in every direction of the universe.\n\nIt is identical with the \"Serpent that runs with 370 leaps\" of the Siphrah Dzenioota , which, when the \"Perfect Man,\" the Metatron, is raised , i.e.\n\n, when the divine man indwells in the animal man, it, the Serpent, becomes three spirits , that is to say, is Atma-Buddhi-Manas, in our theosophical phraseology.\n\n(Vide Part II.\n\nin Vol.\n\nII., §§ 3, \"The Many Meanings of the War in Heaven.\") Spirit, then, or Cosmic Ideation, and Cosmic Substance -- one of whose principles is Ether -- are one , and include the ELEMENTS, in the sense St.\n\nPaul attaches to them.\n\nThese Elements are the veiled Synthesis standing for Dhyan Chohans, Devas, Sephiroth, Amshaspends, Archangels, etc., etc.\n\nThe Ether of science -- the Ilus of Berosus, or the Protyle of Chemistry -- constitutes, so to speak, the rude material (relatively) out of which the above-named \"Builders,\" following the plan traced out for them eternally in the DIVINE THOUGHT, fashion the systems in the Cosmos.\n\nThey are \"myths,\" we are told.\n\n\"No more so than Ether and the Atoms,\" we answer.\n\nThe two latter are absolute necessities of physical science; the \"Builders\" are as absolute a necessity of metaphysics.\n\nWe are twitted with: \"You never saw them.\n\n\" We ask the materialists: \"Have you ever seen Ether, or your Atoms , or, again, your FORCE?\" Moreover, one of the greatest Western Evolutionists of our modern day, the coadjutor of Darwin, Mr.\n\nA.\n\nR.\n\nWallace, when discussing the inadequacy of Natural Selection alone to account for the physical form of Man, admits the guiding action of \"higher intelligences\" as a \" necessary part of the great laws which govern the material Universe\" (\" Contributions to Theory of Natural Selection \") .\n\nThese \"higher intelligences\" are the Dhyan Chohans of the Occultists.\n\nIndeed, there are few Myths in any religious system worthy of the name, but have an historical as well as a scientific foundation.\n\n\"Myths,\" justly observes Pococke, \"are now proved to be fables, just in proportion as we misunderstand them; truths , in proportion as they were once understood.\n\n\" The one prevailing, most distinct idea -- found in all ancient teaching, [[Vol.\n\n1, Page]] 340 THE SECRET DOCTRINE.\n\nwith reference to Cosmic Evolution and the first \"creation\" of our Globe with all its products, organic and inorganic (strange word for an Occultist to use) -- is that the whole Kosmos has sprung from the DIVINE THOUGHT.\n\nThis thought impregnates matter, which is co-eternal with the ONE REALITY; and all that lives and breathes evolves from the emanations of the ONE Immutable -- Parabrahm = Mulaprakriti, the eternal one-root.\n\nThe former of these is, so to say, the aspect of the central point turned inward into regions quite inaccessible to human intellect, and is absolute abstraction; whereas, in its aspect as Mulaprakriti -- the eternal root of all, -- it gives one some hazy comprehension at least of the Mystery of Being."


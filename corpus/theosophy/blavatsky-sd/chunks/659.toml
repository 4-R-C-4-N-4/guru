body = "And in such case the Bible is right, along with other national \"revelations.\" Hence the scientific scorn, so freely lavished by the author of \"A Modern [[Footnote(s)]] ------------------------------------------------- * Theosophists will remember that, according to Occult teaching, Cyclic pralayas so-called are but obscurations, during which periods Nature, i.e.\n\n, everything visible and invisible on a resting planet -- remains in statu quo.\n\nNature rests and slumbers, no work of destruction going on on the globe even if no active work is done.\n\nAll forms, as well as their astral types, remain as they were at the last moment of its activity.\n\nThe \"night\" of a planet has hardly any twilight preceding it.\n\nIt is caught like a huge mammoth by an avalanche, and remains slumbering and frozen till the next dawn of its new day -- a very short one indeed in comparison to the \"Day of Brahma.\" ** This will be pooh-poohed, because it will not be understood by our modern men of science; but every Occultist and theosophist will easily realize the process.\n\nThere can be no objective form on Earth (nor in the Universe either), without its astral prototype being first formed in Space.\n\nFrom Phidias down to the humblest workman in the ceramic art -- a sculptor has had to create first of all a model in his mind, then sketch it in one and two dimensional lines, and then only can he reproduce it in a three dimensional or objective figure.\n\nAnd if human mind is a living demonstration of such successive stages in the process of evolution -- how can it be otherwise when N ATURE'S M IND and creative powers are concerned?\n\n[[Vol.\n\n2, Page]] 661 WHERE ARE THE \"MISSING LINKS\"?\n\nZoroastrian\" upon ancient philosophies and exoteric creeds, becomes premature and uncalled for.\n\nNor would the sudden discovery of a \"missing-link\" -- like fossil mend matters at all.\n\nFor neither one such solitary specimen nor the scientific conclusions thereupon, could insure its being the long-sought-for relic, i.e.\n\n, that of an undeveloped, still a once speaking MAN.\n\nSomething more would be required as a final proof ( vide infra, Note ) .\n\nBesides which, even Genesis takes up man, her Adam of dust, only where the Secret Doctrine leaves her \"Sons of God and Wisdom\" and picks up the physical man of the T HIRD Race.\n\nEve is not \"begotten,\" but is extracted out of Adam on the manner of \"Amoeba, A,\" contracting in the middle and splitting into Amoeba B -- by division.\n\n( See p .\n\n103, in \" The Modern Zoroastrian.\n\n\") Nor has human speech developed from the various animal sounds.\n\nHaeckel's theory that \"speech arose gradually from a few simple, crude animal sounds .\n\n.\n\n.\n\n.\" as such \"speech still remains amongst a few races of lower rank\" ( Darwinian theory in \" Pedigree of Man, \" p.\n\n22) is altogether unsound, as argued by Professor Max Muller, among others.\n\nHe contends that no plausible explanation has yet been given as to how the \"roots\" of language came into existence.\n\nA human brain is necessary for human speech.\n\nAnd figures relating to the size of the respective brains of man and ape show how deep is the gulf which separates the two.\n\nVogt says that the brain of the largest ape, the gorilla, measures no more than 30.51 cubic inches; while the average brains of the flat-headed Australian natives -- the lowest now in the human races -- amount to 99.35 cubic inches!\n\nFigures are awkward witnesses and cannot lie.\n\nTherefore, as truly observed by Dr.\n\nF.\n\nPfaff, whose premises are as sound and correct as his biblical conclusions are silly: -- \"The brain of the apes most like man, does not amount to quite a third of the brain of the lowest races of men : it is not half the size of the brain of a new-born child.\n\n\" (\" The Age and Origin of Man.\n\n\") From the foregoing it is thus very easy to perceive that in order to prove the Huxley-Haeckelian theories of the descent of man, it is not one, but a great number of \" missing links \" -- a true ladder of progressive evolutionary steps -- that would have to be first found and then presented by Science to thinking and reasoning humanity, before it would abandon belief in gods and the immortal Soul for the worship of Quadrumanic ancestors.\n\nMere myths are now greeted as \"axiomatic truths.\" Even Alfred Russel Wallace maintains with Haeckel that primitive man was a speechless ape-creature.\n\nTo this Joly answers: -- \"Man never was, in my opinion, this pithecanthropus alalus whose portrait Haeckel has drawn as if he had seen and known him, whose singular and completely hypothetical genealogy he has even given, from the mere mass of living protoplasm to the man endowed with speech and a civilization analo- [[Vol.\n\n2, Page]] 662 THE SECRET DOCTRINE.\n\ngous to that of the Australians and Papuans.\" (\"Man before Metals,\" p.\n\n320 , N.\n\nJoly.\n\nInter.\n\nScient.\n\nSeries.\n\n) Haeckel, among other things, often comes into direct conflict with the Science of languages.\n\nIn the course of his attack on Evolutionism (1873, \"Mr.\n\nDarwin's Philosophy of Language\"), Prof.\n\nMax Muller stigmatized the Darwinian theory as \"vulnerable at the beginning and at the end.\" The fact is, that only the partial truth of many of the secondary \"laws\" of Darwinism is beyond question -- M.\n\nde Quatrefages evidently accepting \"Natural Selection,\" the \"struggle for existence\" and transformation within species, as proven not once and for ever, but pro.\n\ntem.\n\nBut it may not be amiss, perhaps, to condense the linguistic case against the \"Ape ancestor\" theory: -- Languages have their phases of growth, etc., like all else in nature.\n\nIt is almost certain that the great linguistic families pass through three stages.\n\n(1) All words are roots and merely placed in juxtaposition (Radical languages).\n\n(2) One root defines the other, and becomes merely a determinative element (Agglutinative).\n\n(3) The determinative element (the determinating meaning of which has long lapsed) unites into a whole with the formative element (Inflected).\n\nThe problem then is: Whence these ROOTS?\n\nMax Muller argues that the existence of these ready-made materials of speech is a proof that man cannot be the crown of a long organic series.\n\nThis potentiality of forming roots is the great crux which materialists almost invariably avoid.\n\nVon Hartmann explains it as a manifestation of the \"Unconscious,\" and admits its cogency versus mechanical Atheism.\n\nHartmann is a fair representative of the Metaphysician and Idealist of the present age.\n\nThe argument has never been met by the non-pantheistic Evolutionists."


[content]
body = "The first is from the Book of the Concealed Mystery: -- (429.) From a Light-Bearer (one of the seven sacred planets) of insupportable brightness proceeded a radiating Flame, dashing off, like a vast and mighty hammer, those sparks which were the prior worlds.\n\n(430.) And with most subtle ether were these intermingled and bound mutually together, but only when they were conjoined together, even the great Father and great Mother.\n\n(431.) From Hoa , himself, is AB, the Father; and from Hoa, himself, is RUACH, the Spirit; who are hidden in the Ancient of Days, and therein is that Ether concealed.\n\n(432.) And it was connected with a Light-Bearer (a planet and its angel or regent), which went forth from that Light-Bearer of insupportable brightness, which is hidden in the bosom of Aima, the Great Mother.* Now the following extract from the Zohar** also deals with the same mystery: -- \"The Pre-Adamite Kings.\n\n'We have learned in the Siphrah D'Tzniootha: That the At-tee'kah DAt-tee'keen, Ancient of Ancients, before He prepared his Form, built Kings, and engraved [[Footnote(s)]] ------------------------------------------------- * See Mr.\n\nMather's \"Kabbalah Unveiled.\" ** Translated in I.\n\nMyer's Qabbalah.\n\n[[Vol.\n\n2, Page]] 84 THE SECRET DOCTRINE.\n\nKings, and sketched out Kings (men, the Kings of the animals), and they could not exist: till he overthrew them and hid them until after a time, therefore it is written: 'And these are the Kings which reigned in the land of Edom' .\n\n.\n\n.\n\n.\n\nAnd they could not exist till Resha'Hiv'rah, the White Head, the At'-tee-'kah D'At-tee'keen, Ancient of Ancients, arranged Himself .\n\n.\n\n.\n\n.\n\nand formed all forms above and below.\n\n.\n\n.\n\n.\n\nBefore He arranged himself in his Form had not been formed all those whom he desired to form, and all worlds have been destroyed .\n\n.\n\n.\n\n.\n\nthey did not remain in their places, because the form of the Kings had not been formed as it ought to be, and the Holy City had not been prepared.\" ( Zohar iii., 135 a; 292a Idra Zootah.\n\nBrody, etc.) Now the plain meaning of these two allegorical and metaphysical disquisitions is simply this: Worlds and men were in turn formed and destroyed, under the law of evolution and from pre-existing material, until both the planets and their men, in our case our Earth and its animal and human races, became what they are now in the present cycle: opposite polar forces, an equilibrized compound of Spirit and Matter, of the positive and the negative, of the male and the female.\n\nBefore man could become male and female physically, his prototype, the creating Elohim, had to arrange his Form on this sexual plane astrally.\n\nThat is to say, the atoms and the organic forces, descending into the plane of the given differentiation, had to be marshalled in the order intended by Nature, so as to be ever carrying out, in an immaculate way, that law which the Kabala calls the Balance, through which everything that exists does so as male and female in its final perfection, in this present stage of materiality.\n\nChochmah, Wisdom, the Male Sephiroth, had to diffuse itself in , and through, Binah, intelligent Nature, or Understanding.\n\nTherefore the First Root-race of men, sexless and mindless, had to be overthrown and \"hidden until after a time\"; i.e.\n\n, the first race, instead of dying, disappeared in the second race, as certain lower lives and plants do in their progeny.\n\nIt was a wholesale transformation.\n\nThe First became the Second Root-race, without either begetting it, procreating it, or dying.\n\n\"They passed by together,\" as it is written: \"And he died and another reigned in his stead\" ( Genesis xxvi.\n\n31 et seq.\n\nZohar iii., 292 a ).\n\nWhy?\n\nBecause \"the Holy City had not been prepared.\" And what is the \"Holy City\"?\n\nThe Maquom (the Secret Place or the Shrine) on Earth: in other words, the human womb, the microcosmic copy and reflection of the Heavenly Matrix, the female space or primeval Chaos, in which the male Spirit fecundates the germ of the Son, or the visible Universe.* So much so, that in the paragraph on \"the Emanation of the Male and Female Principles\" in the Zohar [[Footnote(s)]] ------------------------------------------------- * Vide \"The Holy of Holies: its esoteric meaning,\" in Part IO of this Volume.\n\n[[Vol.\n\n2, Page]] 85 THE SON OF YAH.\n\n( ibid.\n\n) , it is said that, on this earth, the W ISDOM from the \"Holy Ancient\" \"does not shine except in male and female.\" \" Hohmah, Wisdom, is the Father, and B INAH, understanding, is the Mother .\n\n.\n\n.\n\n.\n\nand when they connect one with the other they bring forth and diffuse and emanate truth.\n\nIn the sayings of Rabbi Je-yeva Sabah, i.e.\n\n, the Old, we learned this: What is Binah Understanding?\n\nBut when they connect in one another, the [[diagram]] (Yod) in the [[diagram]] (Heh), they become impregnated and produce a Son.\n\nAnd, therefore, it is called Binah, Understanding.\n\nIt means BeN YaH, i.e.\n\n, Son of YaH.\n\nThis is the completeness of the whole.\"* This is also the \"completeness\" of phallicism by the Rabbis, its perfect apotheosis, the divine being dragged into the animal, the sublime into the grossness of the terrestrial.\n\nNothing so graphically gross exists in Eastern Occultism, nor in the primitive Kabala -- the \"Chaldean Book of Numbers.\" We have said so in \"Isis Unveiled\": -- \"We find it rather unwise on the part of Catholic writers to pour out their vials of wrath in such sentences as these: 'In a multitude of pagodas, the phallic stone, ever and always assuming, like the Grecian batylos, the brutally indecent form of the lingham .\n\n.\n\n.\n\nthe Maha Deva.' Before casting slurs on a symbol whose profound metaphysical meaning is too much for the modern champions of that religion of sensualism par excellence, Roman Catholicism, to grasp, they are in duty bound to destroy their oldest churches, and change the form of the cupolas of their own temples.\n\nThe Mahody of Elephanta, the Round Tower of Bhangulpore, the minarets of Islam -- either rounded or pointed -- are the originals of the Campanile column of San Marco, at Venice, of the Rochester Cathedral, and of the modern Duomo of Milan."


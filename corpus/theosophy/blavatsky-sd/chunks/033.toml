[content]
body = "The impalpable atoms of gold scattered through the substance of a ton of auriferous quartz may be imperceptible to the naked eye of the miner, yet he knows that they are not only present there but that they alone give his quartz any appreciable value; and this relation of the gold to the quartz may faintly shadow forth that of the noumenon to the phenomenon.\n\nBut the miner knows what the gold will look like when extracted from the quartz, whereas the common mortal can form no conception of the reality of things separated from the Maya which veils them, and in which they are hidden.\n\nAlone the Initiate, rich with the lore acquired by numberless generations of his predecessors, directs the \"Eye of Dangma\" toward the essence of things in which no Maya can have any influence.\n\nIt is here that the teachings of esoteric philosophy in relation to the Nidanas and the Four Truths become of the greatest importance; but they are secret.\n\n[[Vol.\n\n1, Page]] 46 THE SECRET DOCTRINE.\n\nSTANZA I.\n\n-- Continued .\n\n8.\n\nA LONE, THE ONE FORM OF EXISTENCE STRETCHED BOUNDLESS, INFINITE, CAUSELESS, IN DREAMLESS SLEEP ( a ); AND LIFE PULSATED UNCONSCIOUS IN UNIVERSAL SPACE, THROUGHOUT THAT A LL- P RESENCE WHICH IS SENSED BY THE \" O PENED E YE\"* OF THE D ANGMA ( b ).** ( a ) The tendency of modern thought is to recur to the archaic idea of a homogeneous basis for apparently widely different things -- heterogeneity developed from homogeneity.\n\nBiologists are now searching for their homogeneous protoplasm and chemists for their protyle, while science is looking for the force of which electricity, magnetism, heat, and so forth, are the differentiations.\n\nThe Secret Doctrine carries this idea into the region of metaphysics and postulates a \"One Form of Existence\" as the basis and source of all things.\n\nBut perhaps the phrase, the \"One Form of Existence,\" is not altogether correct.\n\nThe Sanskrit word is Prabhavapyaya, \"the place, or rather plane, whence emerges the origination, and into which is the resolution of all things,\" says a commentator.\n\nIt is not the \"Mother of the World,\" as translated by Wilson (see Book I., Vishnu Purana); for Jagad Yoni (as shown by FitzEdward Hall) is scarcely so much \"the Mother of the World\" or \"the Womb of the World\" as the \"Material Cause of the Universe.\" The Puranic Commentators explain it by Karana -- \"Cause\" -- but the Esoteric philosophy, by the ideal spirit of that cause.\n\nIt is, in its secondary stage, the Svabhavat of the Buddhist philosopher, the eternal cause and effect, omnipresent yet abstract, the self-existent plastic Essence and the root of all things, viewed in the same dual light as the Vedantin views his Parabrahm and Mulaprakriti, the one under two aspects.\n\nIt seems indeed extraordinary to find great scholars speculating on the possibility of the Vedanta, and the Uttara-Mimansa especially, having been \"evoked by the teachings of the Buddhists,\" [[Footnote(s)]] ------------------------------------------------- * In India it is called \"The Eye of Siva,\" but beyond the great range it is known as \"Dangma's opened eye\" in esoteric phraseology.\n\n** Dangma means a purified soul, one who has become a Jivanmukta, the highest adept, or rather a Mahatma so-called.\n\nHis \"opened eye\" is the inner spiritual eye of the seer, and the faculty which manifests through it is not clairvoyance as ordinarily understood, i.e.\n\n, the power of seeing at a distance, but rather the faculty of spiritual intuition, through which direct and certain knowledge is obtainable.\n\nThis faculty is intimately connected with the \"third eye,\" which mythological tradition ascribes to certain races of men.\n\nFuller explanations will be found in Book II.\n\n[[Vol.\n\n1, Page]] 47 THE EYE OF DANGMA.\n\nwhereas, it is on the contrary Buddhism (of Gautama, the Buddha) that was \"evoked\" and entirely upreared on the tenets of the Secret Doctrine, of which a partial sketch is here attempted, and on which, also, the Upanishads are made to rest.* The above, according to the teachings of Sri Sankaracharya,** is undeniable.\n\n( b ) Dreamless sleep is one of the seven states of consciousness known in Oriental esotericism.\n\nIn each of these states a different portion of the mind comes into action; or as a Vedantin would express it, the individual is conscious in a different plane of his being.\n\nThe term \"dreamless sleep,\" in this case is applied allegorically to the Universe to express a condition somewhat analogous to that state of consciousness in man, which, not being remembered in a waking state, seems a blank, just as the sleep of the mesmerised subject seems to him an unconscious blank when he returns to his normal condition, although he has been talking and acting as a conscious individual would.\n\n------- STANZA I.\n\n-- Continued .\n\n9.\n\nB UT WHERE WAS THE D ANGMA WHEN THE A LAYA OF THE U NIVERSE ( Soul as the basis of all, Anima Mundi ) WAS IN P ARAMARTHA ( a ) ( Absolute Being and Consciousness which are Absolute Non-Being and Unconsciousness ) AND THE GREAT WHEEL WAS A NUPADAKA ( b )?\n\n[[Footnote(s)]] ------------------------------------------------- * And yet, one, claiming authority, namely, Sir Monier Williams, Boden Professor of Sanskrit at Oxford, has just denied this fact.\n\nThis is what he taught his audience, on June the 4th, 1888, in his annual address before the Victoria Institute of Great Britain: \"Originally, Buddhism set its face against all solitary asceticism .\n\n.\n\n.\n\nto attain sublime heights of knowledge.\n\nIt had no occult, no esoteric system of doctrine .\n\n.\n\n.\n\nwithheld from ordinary men\" (!!) And, again: \" .\n\n.\n\n.\n\nWhen Gautama Buddha began his career, the later and lower form of Yoga seems to have been little known.\" And then, contradicting himself, the learned lecturer forthwith informs his audience that \"We learn from Lalita-Vistara that various forms of bodily torture, self-maceration, and austerity were common in Gautama's time.\" (!!) But the lecturer seems quite unaware that this kind of torture and self-maceration is precisely the lower form of Yoga, Hatha Yoga, which was \"little known\" and yet so \" common \" in Gautama's time.\n\n** It is even argued that all the Six Darsanas (Schools of philosophy) show traces of Buddha's influence, being either taken from Buddhism or due to Greek teaching!"


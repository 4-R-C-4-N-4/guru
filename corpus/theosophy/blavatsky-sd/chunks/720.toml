[content]
body = "Both Malacca and Polynesia, which lie at the two extremities of the ocean, and which, since the memory of man never had, and never could have any intercourse with, or even a knowledge of each other, have yet a tradition common to all the islands and islets, that their respective countries extended far, far into the Sea: that there were in the world but two immense continents, one inhabited by yellow, the other by dark men; and that the Ocean, by command of the gods, and to punish them for their incessant quarrelling, swallowed them up.\n\nNotwithstanding the geographical proof that New Zealand, the Sandwich and Easter Islands, are at a distance from each other of between 800 and 1,000 leagues, and that, according to every testimony, neither these nor any other intermediate islands, for instance, the Marquesan, Society, Fiji, Tahitian, Samoan, and other islands, could, since they became islands, ignorant as their people were of the compass, have communicated with each other before the arrival of Europeans; yet they one and all maintain that their respective countries extended far toward the West, on the Asian side.\n\nMoreover, with very small differences, they all speak dialects evidently of the same language; and understand each other with little difficulty; have the same religious beliefs and superstitions; and pretty much the same customs.\n\nAnd as few of the Polynesian islands were discovered earlier than a century ago, the Pacific Ocean itself being unknown to Europe till the days of Columbus, and as these islanders have never ceased repeating the same old traditions since the Europeans first set [[Footnote(s)]] ------------------------------------------------- * For the opinions of Jacolliot, after long travels through the Polynesian Islands and his proofs of a former great geological cataclysm in the Pacific Ocean, see his \" Histoire des Vierges : Peuples et Continents disparus, \" p.\n\n308.\n\n[[Vol.\n\n2, Page]] 789 HAECKEL FOR ONCE IS RIGHT.\n\nfoot on their shores, it seems to us a logical inference that our theory is nearer to the truth than any other.\n\n\"Chance would have to change its name and meaning, were all this due but to chance alone.\" \"A great series of animal-geographical facts,\" declares Professor Schmidt, writing in defence of the hypothesis of a former Lemuria, \"is explicable only on the theory of the former existence of a Southern Continent of which Australia is a remnant .\n\n.\n\n.\n\n.\n\n.\n\n\" [the distribution of species] \"points to the vanished land of the South where perhaps the home of the progenitors of the Maki of Madagascar may also be looked for.\"* Mr.\n\nA.\n\nR.\n\nWallace, in his \"Malay Archipelago,\" arrives at the following conclusion after a review of the mass of evidence at hand: -- \"The inference that we must draw from these facts is undoubtedly that the whole of the islands eastwards beyond Borneo and Sumatra do essentially form part of a former Australian or Pacific Continent .\n\n.\n\n.\n\nThis continent must have been broken up before the extreme south-eastern portion of Asia was raised above the waters of the ocean, for a great part of the land of Borneo and Java is known to be geologically of quite recent formation.\" According to Haeckel: -- \"Southern Asia itself was not the earliest cradle of the human race, but Lemuria, a continent that lay to the South of Asia, and sank later on beneath the surface of the Indian Ocean.\n\n\" (\" Pedigree of Man, \" Eng.\n\nTrans.\n\np.\n\n73.) In one sense Haeckel is right as to Lemuria -- the \"cradle of the Human race.\" That continent was the home of the first physical Human Stock -- the later Third-Race Men.\n\nPrevious to that epoch the Races were far less consolidated and physiologically quite different.\n\n(Haeckel makes Lemuria extend from Sunda Island to Africa and Madagascar and eastwards to Upper India.\n\n) Professor Rutimeyer, the eminent Palaeontologist, asks: -- \"Need the conjecture that the almost exclusively graminivorous and insectivorous marsupials, sloths, armadilloes, ant-eaters and ostriches, once possessed an actual point of union in a Southern Continent of which the present flora of Terra del Fuego and Australia must be the remains -- need this conjecture raise difficulties at a moment when from their fossil remains, Heer restores to sight the ancient forests of Smith's Sound and Spitzbergen.\" ( Cited in Schmidt ' s \" Doctrine of Descent and Darwinism, \" p .\n\n237.) Having now dealt generally with the broad scientific attitude on the two questions, it will, perhaps, conduce to an agreeable brevity, if we sum up the more striking isolated facts in favour of that fundamental contention of Esoteric Ethnologists -- the reality of Atlantis.\n\nLemuria [[Footnote(s)]] ------------------------------------------------- * \" Doctrine of Descent and Darwinism, \" p.\n\n236.\n\n(Cf.\n\nalso his lengthy arguments on the subject, pp.\n\n231-7.) [[Vol.\n\n2, Page]] 790 THE SECRET DOCTRINE.\n\nis so widely accepted, that further pursuit of the subject is unnecessary.\n\nWith regard, however, to the former, it is found that: -- (1) The Miocene flora of Europe have their most numerous and striking analogues in the flora of the United States.\n\nIn the forests of Virginia and Florida are found the magnolias, tulip-trees, evergreen oaks, plane trees, etc., etc., etc., which correspond with European Tertiary flora term for term.\n\nHow was the migration effected, if we exclude the theory of an Atlantic Continent bridging the ocean between America and Europe?\n\nThe proposed \"explanation\" to the effect that the transition was by way of Asia and the Aleutian islands is a mere uncalled-for theory, obviously upset by the fact that a large number of these flora only appear EAST of the Rocky Mountains.\n\nThis also negatives the idea of a trans-Pacific migration.\n\nThey are now superseded by European continents and islands to the North.\n\n(2) Skulls exhumed on the banks of the Danube and Rhine bear a striking similarity to those of the Caribs and Old Peruvians (Littre).\n\nMonuments have been exhumed in Central America, which bear representations of undoubted negro heads and faces.\n\nHow are such facts to be accounted for except on the Atlantean hypothesis?\n\nWhat is now N.\n\nW.\n\nAfrica was once connected with Atlantis by a network of islands, few of which now remain.\n\n(3) According to Farrar (\" Families of Speech \") the \" isolated language\" of the Basques has no affinities with the other languages* of Europe, but with \" the aboriginal languages of the vast opposite continent (America) and those alone.\n\n\" Professor Broca is also of the same opinion.\n\nPalaeolithic European man of the Miocene and Pliocene times was a pure Atlantean, as we have previously stated."


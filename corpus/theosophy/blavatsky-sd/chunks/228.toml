[content]
body = "That, however, which God and the Christian Saints are justified in doing, becomes a crime, if successful, in simple mortals.\n\nSorcery and incantations are regarded as fables now; yet from the day of the Institutes of Justinian down to the laws against witchcraft of England and America -- obsolete but not repealed to this day -- such incantations, even when only suspected, were punished as criminal.\n\nWhy punish a chimera?\n\nAnd still we read of Constantine, the Emperor, sentencing to death the philosopher Sopatrus for unchaining the winds, and thus preventing ships loaded with grain from arriving in time to put an end to famine.\n\nPausanias, when affirming that he saw with his own eyes \"men who by simple prayers and incantations \" stopped a strong hail-storm, is derided.\n\nThis does not prevent modern Christian writers from advising prayer during storm and danger, and believing in its efficacy.\n\nHoppo and Stadlein two magicians and sorcerers -- were sentenced to death for throwing charms on fruit and transferring a harvest by magic arts from one field to another, hardly a century ago, if we can believe Sprenger, the famous writer, who vouches for it: \" Qui fruges excantassent segetem pellicentes incantando.\n\n\" Let us close by reminding the reader that, without the smallest shadow of superstition, one may believe in the dual nature of every object on Earth -- in the spiritual and the material, the visible and the invisible nature, and that science virtually proves this, while denying its own demonstration.\n\nFor if, as Sir William Grove has it, the electricity we handle is but the result of ordinary matter affected by something invisible, the \" ultimate generating power\" of every Force, the \" one omnipresent influence, \" then it only becomes natural that one should believe as the ancients did; namely, that every Element is dual in its nature.\n\n\"ETHEREAL fire is the emanation of the KABIR proper; the aerial is but the union (correlation) of the former with terrestrial fire, and its guidance and application on our earthly plane belongs to a Kabir of a lesser dignity\" -- an Elemental, perhaps, as an Occultist would call it; and the same may be said of every Cosmic Element.\n\nNo one will deny that the human being is possessed of various forces: magnetic, sympathetic, antipathetic, nervous, dynamical, occult, mechanical, mental -- every kind of force; and that the physical forces are all biological in their essence, seeing that they intermingle with, and often merge into, those forces that we have named intellectual and moral -- the first being the vehicles, so to say, the upadhi, of the second.\n\nNo one, who does not deny soul in man, would hesitate in [[Vol.\n\n1, Page]] 470 THE SECRET DOCTRINE.\n\nsaying that their presence and commingling are the very essence of our being; that they constitute the Ego in man, in fact.\n\nThese potencies have their physiological, physical, mechanical, as well as their nervous, ecstatic, clairaudient, and clairvoyant phenomena, which are now regarded and recognised as perfectly natural, even by science.\n\nWhy should man be the only exception in nature, and why cannot even the ELEMENTS have their vehicles, their \"Vahans\" in what we call the PHYSICAL FORCES?\n\nAnd why, above all, should such beliefs be called \"superstition\" along with the religions of old?\n\n-------------- [[This page continued in next section]]"


[content]
body = "it was already an old one.\n\nThat Arjuna, Krishna's companion and chela, is said to have descended into Patala, the \"antipodes,\" and therein married Ulupi, * a Naga (or Nagini rather), the daughter of the king of the Nagas, Kauravya.** And now it may be hoped the full meaning of the serpent emblem is proven.\n\nIt is neither that of evil, nor, least of all, that of the devil; but is , indeed, the [[SEMES EILAM ABRASAX]] (\"the eternal Sun-Abrasax\"), the central spiritual sun of all the Kabalists, represented in some diagrams by the circle of Tiphereth.\n\nAnd here, again, we may quote from our earlier volumes and enter into further explanations.\n\n\"From this region of unfathomable depth (Bythos, Aditi, Shekinah, the veil of the unknown) issues forth a circle formed of spirals.\n\nThis is Tiphereth; which, in the language of symbolism, means a grand cycle, composed of smaller ones.\n\nCoiled within, so as to follow the spirals, lies the serpent -- emblem of Wisdom and Eternity -- the dual Androgyne; the cycle representing Ennoia , or the divine mind (a power which does not create but which must assimilate), and the serpent, the Agathodaemon, the Ophis, the Shadow of the Light (non-eternal, yet the greatest divine light on our plane).\n\nBoth were the Logoi of the Ophites: or the Unity as Logos manifesting itself as a double principle of Good and Evil.\" Were it light alone, inactive and absolute, the human mind could not appreciate nor even realise it.\n\nShadow is that which enables light to manifest itself, and gives it objective reality.\n\nTherefore, shadow is not evil, but is the necessary and indispensable corollary which completes Light or Good: it is its creator on Earth.\n\nAccording to the views of the Gnostics, these two principles are immutable Light and Shadow, Good and Evil being virtually one and having existed through all eternity, as they will ever continue to exist so long as there are manifested worlds.\n\nThis symbol accounts for the adoration by this sect of the Serpent, as the Saviour, coiled either around the sacramental loaf, or a Tau, the phallic emblem.\n\nAs a Unity, Ennoia and Ophis are the Logos.\n\nWhen separated, one is the Tree of Life (spiritual), the other, the Tree [[Footnote(s)]] ------------------------------------------------- * Ulupi has an entirely Atlantean ring about it.\n\nLike Atlantis, it is neither a Greek nor a Sanskrit name, but reminds one of Mexican names.\n\n** \"Mahabharata,\" Adiparva, Sloka, 7788, 7789.\n\nThe \"Bhagavata Purana,\" ix., xx., 31, as explained by Sridhera, the commentator, makes Ulupi the daughter of the king of Manipura; but the late Pundit Dayanand Saraswati, certainly the greatest Sanskrit and Puranic authority in India on such questions, personally corroborated that Ulupi was daughter of the king of the Nagas at Patala, or America, 5000 years ago, and that the Nagas were Initiates.\n\n[[Vol.\n\n2, Page]] 215 BUDDHA'S GREAT MOUNTAIN.\n\nof Knowledge of Good and Evil.\n\nTherefore, we find Ophis urging the first human couple -- the material production of Ilda-Baoth, but which owed its spiritual principle to Sophia-Achamoth -- to eat of the forbidden fruit, although Ophis represents divine Wisdom.\n\nThe serpent, the Tree of Knowledge of Good and Evil, and the Tree of Life, are all symbols transplanted from the soil of India.\n\nThe Arasa-Maram, the banyan tree, so sacred with the Hindus (since Vishnu during one of his incarnations, reposed under its mighty shade and there taught human philosophy and sciences), is called the Tree of Knowledge and the Tree of Life.\n\nUnder the protecting foliage of this king of the forests, the Gurus teach their pupils their first lessons on immortality and initiate them into the mysteries of life and death.\n\nThe Java-Aleim of the Sacerdotal College are said, in the Chaldean tradition, to have taught the sons of men to become like one of them.\n\nTo the present day Foh-tchou,* who lives in his Foh-Maeyu, or temple of Buddha, on the top of the \"Kouin-long-sang,\"** the great mountain, produces his greatest religious miracles under a tree called in Chinese Sung-Ming-Shu, or the Tree of Knowledge and the Tree of Life, for ignorance is death, and knowledge alone gives immortality.\n\nThis marvellous display takes place every three years, when an immense concourse of Chinese Buddhists assembles in pilgrimage at the holy place.\n\nNow it may become comprehensible why the earliest Initiates and Adepts, or the \"Wise Men,\" for whom it is claimed that they were initiated into the mysteries of nature by the UNIVERSAL MIND, represented by the highest angels, were named the \"Serpents of Wisdom\" and \"Dragons;\" as also how the first physiologically complete couples -- after being initiated into the mystery of human creation through Ophis, the manifested Logos and the androgyne, by eating of the fruit of knowledge -- gradually began to be accused by the material spirit of posterity of having committed Sin, of having disobeyed the \"Lord God,\" and of having been tempted by the Serpent.\n\nSo little have the first Christians (who despoiled the Jews of their Bible) understood the first four chapters of Genesis in their esoteric meaning, that they never perceived that not only was no sin intended in this disobedience, but that actually the \"Serpent\" was \"the Lord God\" himself, who, as the Ophis, the Logos, or the bearer of divine creative wisdom, taught mankind to become creators in their turn.*** They [[Footnote(s)]] ------------------------------------------------- * Foh-tchou, literally, in Chinese meaning Buddha's lord, or the teacher of the doctrines of Buddha-Foh.\n\n** This mountain is situated south-west of China, almost between China and Tibet.\n\n*** Let the reader be reminded that in the Zohar, and also in all the Kabalistic works, it is maintained that \"Metatron united to Shekinah \" (or Shekinah as the veil (grace) [[Footnote continued on next page]] [[Vol.\n\n2, Page]] 216 THE SECRET DOCTRINE.\n\nnever realised that the Cross was an evolution from the \"tree and the serpent,\" and thus became the salvation of mankind.\n\nBy this it would become the very first fundamental symbol of Creative cause, applying to geometry, to numbers, to astronomy, to measure and to animal reproduction.\n\nAccording to the Kabala the curse on man came with the formation of woman.\n\n* The circle was separated from its diameter line."


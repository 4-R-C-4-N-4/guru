body = ", twice as fast; and thirdly, a motion at right angles to these two (suppose downwards), which, in its simplest form, would be with unvarying velocity.\n\nIf we project this figure in space we find on examination that the points of the curves, where chlorine, bromine, and iodine are formed, come close under each other; so also will sulphur, selenium, and tellurium; again, phosphorus, arsenic, and antimony; and in like manner other series of analogous bodies.\n\nIt may be asked whether this scheme explains how and why the elements appear in this order?\n\nLet us imagine a cyclical translation in space, each evolution witnessing the genesis of the group of elements which I previously represented as produced during one complete vibration of the pendulum.\n\nLet us suppose that one cycle has thus been completed, the centre of the unknown creative force in its mighty journey through space having scattered along its track the primitive atoms -- the seeds, if I may use the expression -- which presently are to coalesce and develop into the groupings now known as lithium, beryllium, boron, carbon, nitrogen, oxygen, fluorine, sodium, magnesium, aluminium, silicon, phosphorus, sulphur, and chlorine.\n\nWhat is most probably the form of track now pursued?\n\nWere it strictly confined to the same plane of temperature and time, the next elementary groupings to appear would again have been those of lithium, and the original cycle would have been eternally repeated, producing again and again the same 14 elements.\n\nThe conditions, however, are not quite the same.\n\nSpace and electricity are as at first, but temperature has altered, and thus, instead of the atoms of lithium being supplemented with atoms in all respects analogous with themselves, the atomic groupings which come into being when the second cycle commences form, not lithium, but its lineal descendant, potassium.\n\nSuppose, therefore, the vis generatrix travelling to and fro in cycles along a lemniscate path, as above suggested, while simultaneously temperature is declining and time is flowing on -- variations which I have endeavoured to represent by the downward sink -- each coil of the lemniscate track crosses the same vertical line at lower and lower points.\n\nProjected in space, the curve shows a central line neutral as far as electricity is concerned, and neutral in chemical properties -- positive electricity on the north, negative on the south.\n\nDominant atomicities are governed by the distance east and west from the neutral centre line, monatomic elements being one remove from it, diatomic two removes, and so on.\n\nIn every successive coil the same law holds good.\" And, as if to prove the postulate of Occult Science and Hindu philos- [[Vol.\n\n1, Page]] 552 THE SECRET DOCTRINE.\n\nophy, that, at the hour of the Pralaya, the two aspects of the unknowable deity, \"the Swan in darkness\" -- Prakriti and Purusha, nature or matter in all its forms and Spirit -- \"no longer subsist but are ( absolutely ) dissolved,\" we learn the conclusive scientific opinion of the great English chemist, who caps his proofs by saying: -- \"We have now traced the formation of the chemical elements from knots and voids in a primitive, formless fluid.\n\nWe have shown the possibility, nay, the probability that the atoms are not eternal in existence, but share with all other created beings the attributes of decay and death.\" Occultism says amen to this, as the Scientific \"possibility\" and \"probability\" are for it facts demonstrated beyond the necessity of further proof or any extraneous physical evidence.\n\nNevertheless, it repeats with as much assurance as ever: \"MATTER IS ETERNAL, becoming atomic (its aspect) only periodically.\" This is as sure as that the other proposition, which is almost unanimously accepted by astronomers and physicists -- namely, that the wear and tear of the body of the Universe is steadily going on, and that it will finally lead to the extinction of the Solar fires and the destruction of the Universe -- is quite erroneous on the lines traced by Men of Science.\n\nThere will be, as there ever were in time and eternity, periodical dissolutions of the manifested Universe, but ( a ) a partial pralaya after every \"Day of Brahma;\" and ( b ) an Universal pralaya -- the M AHA-PRALAYA -- only after the lapse of every Brahma's age.\n\nBut the scientific causes for such dissolution, as brought forward by exact Science, have nothing to do with the true causes.\n\nHowever that may be, Occultism is once more justified by Science, for Mr.\n\nCrookes said: -- \"We have shown, from arguments drawn from the chemical laboratory, that in matter which has responded to every test of an element, there are minute shades of difference which may admit of selection.\n\nWe have seen that the time-honoured distinction between elements and compounds no longer keeps pace with the developments of chemical science, but must be modified to include a vast array of intermediate bodies -- \"meta-elements.\" We have shown how the objections of Clerk-Maxwell, weighty as they are, may be met; and finally, we have adduced reasons for believing that primitive matter was formed by the act of a generative force, throwing off at intervals of time atoms endowed with varying quantities of primitive forms of energy.\n\nIf we may hazard any conjectures as to the source of energy embodied in a chemical atom, we may, I think, premise that the heat radiations propagated outwards through the ether from the ponderable matter of the universe, by some process of nature not yet known to us, are transformed at the confines of the universe into the primary -- the essential -- motions of chemical atoms, which, the instant they are formed, gravitate inwards, and thus restore to the universe the energy which otherwise would be lost to it through radiant heat.\n\nIf this conjecture be well founded, Sir William Thomson's startling prediction of the final decrepitude of the universe through the dissipation of its energy falls to the ground.\n\nIn this [[Vol.\n\n1, Page]] 553 TRUE SIGNS OF THE TIMES.\n\nfashion, gentlemen, it seems to me that the question of the elements may be provisionally treated.\n\nOur slender knowledge of these first mysteries is extending steadily, surely, though slowly.\" By a strong and curious coincidence even our \"septenary\" doctrine seems to force the hand of Science.\n\nIf we understand rightly, Chemistry speaks of fourteen groupings of primitive atoms -- lithium, beryllium, boron, carbon, nitrogen, oxygen, fluorine, sodium, magnesium, aluminium, silicon, phosphorus, sulphur and chlorine; and Mr."


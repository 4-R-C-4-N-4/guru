[content]
body = "The mystery in the hierarchy of the Anupadaka is great, its apex being the universal Spirit-Soul, and the lower rung the Manushi-Buddha; and even every Soul-endowed man is an Anupadaka in a latent state.\n\nHence, when speaking of the Universe in its formless, eternal, or absolute condition, before it was fashioned by the \"Builders\" -- the expression, \"the Universe was Anupadaka.\" (See Part II., \"Primordial Substance.\") [[Footnote(s)]] ------------------------------------------------- * Vajra -- diamond-holder.\n\nIn Tibetan Dorjesempa; sempa meaning the soul, its adamantine quality referring to its indestructibility in the hereafter.\n\nThe explanation with regard to the \"Anupadaka\" given in the Kala Chakra, the first in the Gyu(t) division of the Kanjur, is half esoteric.\n\nIt has misled the Orientalists into erroneous speculations with respect to the Dhyani-Buddhas and their earthly correspondencies, the Manushi-Buddhas.\n\nThe real tenet is hinted at in a subsequent Volume, (see \"The Mystery about Buddha\"), and will be more fully explained in its proper place.\n\n** To quote Hegel again, who with Schelling practically accepted the Pantheistic conception of periodical Avatars (special incarnations of the World-Spirit in Man, as seen in the case of all the great religious reformers) .\n\n.\n\n.\n\n.\n\n\"the essence of man is spirit .\n\n.\n\n.\n\n.\n\nonly by stripping himself of his finiteness and surrendering himself to pure self-consciousness does he attain the truth.\n\nChrist-man, as man in whom the Unity of God-man (identity of the individual with the Universal consciousness as taught by the Vedantins and some Adwaitees) appeared, has, in his death and history generally, himself presented the eternal history of Spirit -- a history which every man has to accomplish in himself, in order to exist as Spirit.\" -- Philosophy of History.\n\nSibree's English translation, p.\n\n340."


body = "fThe Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n1 [[Vol.\n\n1, Page]] 445 GOD IS OUR HIGHER SELF.\n\n[[This page continued from previous section ]] § XIII.\n\nTHE SEVEN CREATIONS.\n\n\" T HERE was neither day nor night, nor sky nor earth, nor darkness nor light, nor any other thing save only ONE, unapprehensible by intellect, or THAT which is Brahma and Pumis (Spirit) and Pradhana (crude matter)\" ( Veda: \" Vishnu Purana Commentary \"); or literally: \"One Pradhanika Brahma Spirit: THAT was.\" The \"Pradhanika Brahma Spirit\" is Mulaprakriti and Parabrahmam.\n\nIn Vishnu Purana, Parasara says to Maitreya, his pupil: -- \"I have thus explained to you, excellent Muni, six creations.\n\n.\n\n.\n\n.\n\nthe creation of the Arvaksrotas beings was the seventh, and was that of man.\" Then he proceeds to speak of two additional and very mysterious creations, variously interpreted by the commentators.\n\nOrigen, commenting upon the books written by Celsus, his opponent -- books which were all destroyed by the prudent Church Fathers -- evidently answers the objections of his contradictor and reveals his system at the same time.\n\nThis was evidently septenary.\n\nBut his theogony, the genesis of the stars or planets, that of sound and colour, all found as an answer satire, and no better.\n\nCelsus, you see, \"desiring to exhibit his learning,\" speaks of a ladder of creation with seven gates , and on the top [[Vol.\n\n1, Page]] 446 THE SECRET DOCTRINE.\n\nof it the eighth -- ever closed.\n\nThe mysteries of the Persian Mithras are explained and \"musical reasons, moreover, are added.\" .\n\n.\n\n.\n\n.\n\nAnd to these again he strives \"to add a second explanation connected also with musical considerations,\"* -- i.e.\n\n, with the seven notes of the scale, the Seven Spirits of the Stars, &c., &c.\n\nValentinus expatiates upon the power of the great Seven , who were called to bring forth this universe after Ar ( r ) hetos , or the Ineffable, whose name is composed of seven letters, had represented the first hebdomad.\n\nThis name (Ar(r)hetos) is one to indicate the Sevenfold nature of the One (the logos ) .\n\n\"The goddess Rhea,\" says Proclus in Timaeus (p.\n\n121), \"is a Monad, Duad, and Heptad,\" comprehending in herself all the Titanidae , \"who are seven.\" The Seven Creations are found in almost every Purana.\n\nThey are all preceded by what Wilson translates -- \"the indiscrete Principle,\" absolute Spirit independent of any relation with objects of sense.\n\nThey are -- (1) Mahattattwa , the Universal Soul, Infinite Intellect, or Divine Mind; (2) Bhuta or Bhutasarga , elemental creation, the first differentiation of Universal indiscrete Substance; (3) Indriya or Aindriyaka , organic evolution.\n\n\"These three were the Prakrita creations, the developments of indiscrete nature preceded by indiscrete principle\"; (4) Mukhya , the fundamental creation of perceptible things, was that of inanimate bodies**; (5) Tairyagyonya , or Tiryaksrotas , was that of animals; (6) Urdhwasrotas , or that of divinities*** (?); (7) Arvaksrotas , was that of man.\n\n( See Vishnu Purana.\n\n) This is the order given in the exoteric texts.\n\nAccording to esoteric teaching there are seven primary, and seven secondary \"creations;\" the former being the Forces self-evolving from the one causeless FORCE; the latter, showing the manifested Universe emanating from the already differentiated divine elements.\n\nEsoterically, as well as exoterically, all the above enumerated Creations stand for the (7) periods of Evolution, whether after an \"Age\" or a \"Day\" of Brahma.\n\nThis is the teaching par excellence of Occult Philosophy, which, however, never uses the term \"creation,\" nor even that of evolution, \"with regard to primary 'Creation':\" but calls all such forces \"the aspects of the Causeless Force.\" In the Bible [[Footnote(s)]] ------------------------------------------------- * Origen contra Celsum, b.\n\nvi., chap.\n\nxxii.\n\n** The text says: \"And the fourth creation is here the primary, for things immovable are emphatically known as primary.\" ( See Fitzedward Hall ' s Corrections.\n\n) *** How can \"divinities\" have been created after the animals?\n\nThe esoteric meaning of the expression \"animals\" is the germs of all animal life including man.\n\nMan is called a sacrificial animal , and an animal that is the only one among animal creation who sacrifices to the gods.\n\nMoreover , by the \"sacred animals,\" the 12 signs of the zodiac are often meant in the sacred texts, as already stated.\n\n[[Vol.\n\n1, Page]] 447 THE ORDER OF THE EVOLUTION.\n\nthe seven periods are dwarfed into the six days of creation and the seventh day of rest, and the Westerns adhere to the letter.\n\nIn the Hindu philosophy, when the active Creator has produced the world of gods, the germs of all the undifferentiated elements and the rudiments of future senses (the world of noumena, in short), the Universe remains unaltered for a \"Day of Brahma,\" a period of 4,320,000,000 years.\n\nThis is the seventh passive period or the \"Sabbath day\" of Eastern philosophy, that follows six periods of active evolution.\n\nIn the Satapatha Brahmana \"Brahma\" (neuter), the absolute Cause of all Causes, radiates the gods.\n\nHaving radiated the gods (through its inherent nature) the work is interrupted.\n\nIn the 1st Book of Manu it is said, \"At the expiration of each night (pralaya) Brahma, having been asleep, awakes, and, through the sole energy of the motion , CAUSES to emanate from itself the spirit, which in its essence is, and yet is not.\" In the Sepher Jezirah , the Kabalistic Book of Creation, the author has evidently repeated the words of Manu.\n\nIn it the Divine Substance is represented as having alone existed from the eternity, boundless and absolute; and as having emitted from itself the Spirit.\n\n\"One is the Spirit of the living God, blessed be his Name, who liveth for ever!\n\nVoice, Spirit, and Word, this is the Holy Spirit.\" ( Sepher Jezireh , chap.\n\n1, Mishna IX.\n\n) And this is the Kabalistic abstract Trinity, so unceremoniously anthropomorphized by the Fathers.\n\nFrom this triple ONE emanated the whole Kosmos."


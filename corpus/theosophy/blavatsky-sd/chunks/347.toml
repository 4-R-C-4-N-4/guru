body = "\"The universe,\" says every Philosophy and Cosmogony, \"hath a Ruler (Rulers collectively) set over it, which is called the W ORD (Logos); the fabricating Spirit is its Queen: which two are the First Power after the O NE.\" These are the Spirit and Nature, which two form our illusory universe.\n\nThe two inseparables remain in the Universe of Ideas so long as it lasts, and then merge back into Parabrahm, the One ever changeless.\n\n\"The Spirit, whose essence is eternal, one and self-existent,\" emanates a pure ethereal LIGHT -- a dual light not perceptible to the elementary senses -- in the Puranas, in the Bible, in the Sepher [[Footnote(s)]] ------------------------------------------------- * The engraving is reproduced in the \" Sacred Mysteries of the Mayas and Quiches \" on p.\n\n134.\n\n** See \" Source of Measures \" p.\n\n50 to 53 and also Book II.\n\nPart 2.\n\n[[Vol.\n\n2, Page]] 37 THE THREE KINDS OF LIGHT.\n\nJezirah, the Greek and Latin hymns, in the Book of Hermes, in the Chaldean Book of Numbers, in the esotericism of Lao-tse, everywhere.\n\nIn the Kabala, which explains the secret meaning of Genesis, this light is the DUAL-MAN, or the Androgyne (rather the sexless) angels, whose generic name is A DAM K ADMON.\n\nIt is they who complete man, whose ethereal form is emanated by other divine, but far lower beings, who solidify the body with clay, or the \"dust of the ground\" -- an allegory indeed, but as scientific as any Darwinian evolution and more true .\n\nThe author of the \" Source of Measures \" says that the foundation of the Kabala and all its mystic books is made to rest upon the ten Sephiroth; which is a fundamental truth.* He shows these ten Sephiroth or the ten numbers in the following diagram: -- wherein the circle is the naught, its vertical diameter line is the first or primal ONE (the Word or Logos ) , from which springs the series of the other numbers up to 9, the limit of the digits.\n\nThe 10 is the first Divine Manifestation** containing \"every possible power of exact expression of proportion.\" By this Kabalistic speculation we are taught that the Sephiroth \"were the numbers or emanations of the Heavenly Light (figures 20612 to 6561), they were the 10 'Words,' DBRIM, 41224, the light, of which they were the flux, was the Heavenly Man, the Adam KDM (the 144- 144); and the Light, by the New Testament or Covenant (or 41224) created God; just as, by the Old Testament God (Alhim, 31415) creates light (20612 to 6561).\" Now there are three kinds of light in Occultism, as in the Kabala.\n\n(1) The Abstract and Absolute Light, which is Darkness; (2) The Light of the Manifested-Unmanifested, called by some the Logos; and (3) The latter light reflected in the Dhyan Chohans, the minor logoi (the Elohim, collectively), who, in their turn, shed it on the objective Universe.\n\nBut in the Kabala -- re-edited and carefully adjusted to fit the Christian tenets by the Kabalists of the XIII .\n\ncentury -- the three lights are described as: -- (1) The clear and penetrating, that of Jehovah; (2) reflected light; and (3) light in the abstract.\n\n\" This light abstractly taken (in a metaphysical or symbolical sense) is Alhim (Elohim God), [[Footnote(s)]] ------------------------------------------------- * See \" Masonic Review, \" Cincinnati, June 1886, Art.\n\nKabala No.\n\n6.\n\n** See \" Isis Unveiled, \" Vol.\n\nII., pp.\n\n300 et seq., for a proof of the antiquity of the decimal system of figures.\n\n[[Vol.\n\n2, Page]] 38 THE SECRET DOCTRINE.\n\nwhile the clear penetrating light is Jehovah.\n\nThe light of Alhim belongs to the world in general, in its allness and general fulness, but the light of Jehovah is that pertaining to the chiefest production, man, whom this light penetrated and made.\" The author of the \" Source of Measures \" pertinently refers the reader to Inman's \" Ancient Faiths embodied in Ancient Names, \" vol.\n\nii., p.\n\n648.\n\nThere, an engraving of \"the vesica piscis, Mary and the female emblem, copied from a rosary of the blessed Virgin .\n\n.\n\n.\n\n.\n\nprinted at Venice, 1542,\" and therefore, as Inman remarks, \"with a license from the Inquisition, consequently orthodox,\" will show the reader what the Latin Church understood by this \" penetrating power of light and its effects \" How sadly disfigured -- applied as they were to the grossest anthropomorphic conceptions -- have become, under Christian interpretation, the noblest and grandest, as the most exalted, ideas of deity of the Eastern philosophy!\n\nThe Occultists call this light Daiviprakriti in the East, and light of Christos in the West.\n\nIt is the light of the LOGOS, the direct reflection of the ever Unknowable on the plane of Universal manifestation.\n\nBut here is the interpretation thereof given by the modern Christians from the Kabala.\n\nAs declared by the author just cited: -- \"To the fulness of the world in general with its chiefest content, man, the term Elohim-Jehovah applies.\n\nIn extracts from the Zohar, the Rev.\n\nDr.\n\nCassell (a Kabalist), to prove that the Cabbalah sets forth the doctrine of the Trinity, among other things says: 'Jehovah is Elohim (Alhim) .\n\n.\n\n.\n\nby three steps God (Alhim), and Jehovah become the same, and though separated each and together, they are of the same one.'\" Similarly, Vishnu becomes the Sun, the visible symbol of the impersonal deity.\n\nVishnu is described as \"striding through the seven regions of the Universe in three steps.\n\n\" But with the Hindus this is an exoteric account, a surface tenet and an allegory, while the Kabalists give it out as the esoteric and final meaning.\n\nBut to proceed: -- \"Now light,\" explains the author, \"as shown, is 20612 to 6561, as the proper enunciation of the integral and numerical relation of diameter to circumference of a circle.\n\nGod (Alhim, i.e ., 3.1415 to one, a modified form of the above) is the reduction of this, so as to obtain a standard unit one, as the basis, in general, of all calculation and all mensuration.\n\nBut, for the production of animal life, and for especial time measure or the lunar year, that influence which causes conception and embryotic development, the numbers of the Jehovah measure (' man even Jehovah ' measure), viz."


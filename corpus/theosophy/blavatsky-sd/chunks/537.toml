body = "Says the crucified Titan: -- \"And, portent past belief, the speaking oaks By which full clearly, in no riddling phrase Wast hailed as the illustrious spouse of Zeus .\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n(v .\n\n853).\n\n.\n\n.\n\n.\n\n.\n\nstroking thee With touch alone of unalarming hand; Then thou dark Epaphos shalt bear, whose name Records his sacred gendering .\n\n.\n\n.\n\n.\n\n\" (870) This was construed by several fanatics -- des Mousseaux and de Mir- [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] Matarisvan, a divine .\n\n.\n\n.\n\n.\n\npersonage, closely associated with the fire god of the Veda, Agni.\n\n.\n\n.\n\n.\" Mati, in Sanskrit, is \"understanding,\" and a synonym of MAHAT and manas, and must be of some account in the origin of the name: Promati is the son of Fohat, and has his story also.\n\n* Kronos is \"time,\" and thus the allegory becomes very suggestive.\n\n( See closing pages of this Sub-section.\n\n) [[Vol.\n\n2, Page]] 415 CHRIST CONNECTED WITH EPAPHOS.\n\nville amongst others -- into a clear prophecy.\n\nIo -- \"is the mother of God,\" we are told, and \"dark Epaphos\" -- Christ.\n\nBut, the latter has not dethroned his father, except metaphorically, if one has to regard Jehovah as that \"Father\"; nor has the Christian Saviour hurled his Father down into Hades.\n\nPrometheus says, in verse 930, that Zeus will be humbled yet; as for himself: -- \" .\n\n.\n\n.\n\n.\n\nsuch marriage he prepares Which from his throne of power to nothingness Shall hurl him down; so shall be all fulfilled His father Kronos' curse .\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\nThen let him sit Confiding in his lofty thunder-peals, And wielding with both hands the fiery bolt; For these shall not avail, but fail he shall, A fall disgraceful, not to be endured .\n\n.\n\n.\n\n.\n\n\" (v.\n\n980).\n\n\"Dark Epaphos\" was the Dionysos-Sabazius, the son of Zeus and of Demeter in the Sabasian Mysteries, during which the \"father of the gods,\" assuming the shape of a Serpent, begot on Demeter, Dionysos, or the solar Bacchus.\n\nIo is the moon, and at the same time the E VE of a new race, and so is Demeter -- in the present case.\n\nThe Promethean myth is a prophecy indeed; but it does not relate to any of the cyclic Saviours who have appeared periodically in various countries and among various nations, in their transitionary conditions of evolution.\n\nIt points to the last of the mysteries of cyclic transformations, in the series of which mankind, having passed from the ethereal to the solid physical state, from spiritual to physiological procreation, is now carried onward on the opposite arc of the cycle, toward that second phase of its primitive state, when woman knew no man, and human progeny was created, not begotten.\n\nThat state will return to it and to the world at large, when the latter shall discover and really appreciate the truths which underlie this vast problem of sex.\n\nIt will be like \"the light that never shone on sea or land,\" and has to come to men through the Theosophical Society.\n\nThat light will lead on and up to the true spiritual intuition.\n\nThen (as expressed once in a letter to a theosophist), \"the world will have a race of Buddhas and Christs, for the world will have discovered that individuals have it in their own powers to procreate Buddha-like children -- or demons.\n\n\" \"When that knowledge comes, all dogmatic religions, and with these the demons, will die out.\" If we reflect upon the serial development of the allegory, and the character of the heroes, the mystery may be unriddled.\n\nK RONOS is of course \"time\" in its cyclic course.\n\nHe swallows his children -- the [[Footnote(s)]] ------------------------------------------------- * See, for explanation of this curse, the last page of the present sub-section.\n\n[[Vol.\n\n2, Page]] 416 THE SECRET DOCTRINE.\n\npersonal gods of exoteric dogmas included.\n\nHe has swallowed instead of Zeus, his stone idol; but the symbol has grown, and has only developed in human fancy as mankind was cycling down toward only its physical and intellectual -- not spiritual -- perfection.\n\nWhen it is as far advanced in its spiritual evolution Kronos will be no longer deceived.\n\nInstead of the stone image he will have swallowed the anthropomorphic fiction itself.\n\nBecause, the serpent of wisdom, represented in the Sabasian mysteries by the anthropomorphised Logos, the unity of spiritual and physical Powers, will have begotten in Time (Kronos) a progeny -- Dionysos-Bacchus or the \"dark Epaphos,\" the \"mighty one\" -- the race that will overthrow him.\n\nWhere will he be born?\n\nPrometheus traces him to his origin and birth-place in his prophecy to Io.\n\nIo is the moon-goddess of generation -- for she is Isis and she is Eve, the great mother.* He traces the path of the (racial) wanderings as plainly as words can express it.\n\nShe has to quit Europe and go to Asia's continent, reaching there the highest of the mountains of Caucasus (737), the Titan telling her: -- \"When thou hast crossed the flood, limit betwixt Two continents, fronting the burning East.\" (810) that she must travel eastward, after passing the \"Kimmerian Bosphorus,\" and cross what is evidently the Volga and now Astrakhan on the Caspian Sea.\n\nAfter this she will encounter \"fierce northern blasts\" and cross thither to the land of the \"Arimaspian host\" (east of Herodotus' Scythia) to -- \"Pluto's gold-abounding flood.\n\n.\n\n.\n\n.\"(825) Which is rightly conjectured by Professor Newman to have meant the [[Footnote(s)]] ------------------------------------------------- * It is complained by the author of the version on, and translator of, \"Prometheus Bound\" that in this tracing of Io's wanderings, \"no consistency with our known geography is attainable\" ( p.\n\n191, Vol.\n\nII ).\n\nThere may be good reason for it.\n\nFirst of all it is the journey and wandering from place to place of the race from which the \"tenth,\" or Kalki Avatar, so called, is to issue.\n\nThis he calls the \"Kingly race born in Argos \" (888).\n\nBut Argos has no reference here to Argos in Greece.\n\nIt comes from Arg or arca -- the female generative power symbolised in the moon -- the navi-formed Argha of the mysteries, meaning the Queen of Heaven.\n\nEustathius shows that, in the dialect of the Arg-ians, Io signified the moon; while esotericism explains it as the divine Androgyne, or the mystic 10; in Hebrew 10 is the perfect number, or Jehovah."


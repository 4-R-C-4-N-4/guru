body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n1 [[Vol.\n\n1, Page]] 53 THE STATE OF PARANIRVANA.\n\nSTANZA II.\n\nC OMMENTARY.\n\n1.\n\n.\n\n.\n\n.\n\n.\n\nW HERE WERE THE BUILDERS, THE LUMINOUS SONS OF MANVANTARIC DAWN ( a )?\n\n.\n\n.\n\n.\n\n.\n\nIN THE UNKNOWN DARKNESS IN THEIR A H-HI ( Chohanic, Dhyani-Buddhic ) P ARANISHPANNA, THE PRODUCERS OF FORM ( rupa ) FROM NO-FORM ( arupa ) , THE ROOT OF THE WORLD -- THE D EVAMATRI* AND S VABHAVAT, RESTED IN THE BLISS OF NON-BEING ( b ).\n\n( a ) The \"Builders,\" the \"Sons of Manvantaric Dawn,\" are the real creators of the Universe; and in this doctrine, which deals only with our Planetary System, they, as the architects of the latter, are also called the \"Watchers\" of the Seven Spheres, which exoterically are the Seven planets, and esoterically the seven earths or spheres (planets) of our chain also.\n\nThe opening sentence of Stanza I., when mentioning \"Seven Eternities,\" is made to apply both to the Maha-Kalpa or \"the (great) Age of Brahma,\" as well as to the Solar pralaya and subsequent resurrection of our Planetary System on a higher plane.\n\nThere are many kinds of pralaya (dissolution of a thing visible), as will be shown elsewhere.\n\n( b ) Paranishpanna, remember, is the summum bonum , the Absolute, hence the same as Paranirvana.\n\nBesides being the final state it is that condition of subjectivity which has no relation to anything but the one absolute truth (Para-marthasatya) on its plane.\n\nIt is that state which leads one to appreciate correctly the full meaning of Non-Being, which, as explained, is absolute Being.\n\nSooner or later, all that now seemingly exists, will be in reality and actually in the state of Paranishpanna.\n\nBut there is a great difference between conscious and unconscious \"being.\" The condition of Paranishpanna, without Paramartha, the Self-analys- [[Footnote(s)]] ------------------------------------------------- \"Mother of the Gods,\" Aditi, or Cosmic Space.\n\nIn the Zohar, she is called Sephira the Mother of the Sephiroth, and Shekinah in her primordial form, in abscondito.\n\n[[Vol.\n\n1, Page]] 54 THE SECRET DOCTRINE.\n\ning consciousness (Svasamvedana), is no bliss, but simply extinction (for Seven Eternities).\n\nThus, an iron ball placed under the scorching rays of the sun will get heated through, but will not feel or appreciate the warmth, while a man will.\n\nIt is only \"with a mind clear and undarkened by personality, and an assimilation of the merit of manifold existences devoted to being in its collectivity (the whole living and sentient Universe),\" that one gets rid of personal existence, merging into, becoming one with, the Absolute,* and continuing in full possession of Paramartha.\n\n------- STANZA II.\n\n-- Continued .\n\n2.\n\n.\n\n.\n\n.\n\n.\n\nW HERE WAS SILENCE?\n\nW HERE WERE THE EARS TO SENSE IT?\n\nN O!\n\nT HERE WAS NEITHER SILENCE, NOR SOUND ( a ).\n\nN AUGHT SAVE CEASELESS, ETERNAL BREATH ( Motion ) WHICH KNOWS ITSELF NOT ( b ).\n\n( a ) The idea that things can cease to exist and still BE, is a fundamental one in Eastern psychology.\n\nUnder this apparent contradiction in terms, there rests a fact of Nature to realise which in the mind, rather than to argue about words, is the important thing.\n\nA familiar instance of a similar paradox is afforded by chemical combination.\n\nThe question whether Hydrogen and Oxygen cease to exist, when they combine to form water, is still a moot one, some arguing that since they are found again when the water is decomposed they must be there all the while; others contending that as they actually turn into something totally different they must cease to exist as themselves for the time being; but neither side is able to form the faintest conception of the real condition of a thing, which has become something else and yet has not ceased to be itself.\n\nExistence as water may be said to be, for Oxygen and Hydrogen, a state of Non-being which is \"more real being\" than their existence as gases; and it may faintly symbolise the [[Footnote(s)]] ------------------------------------------------- * Hence Non-being is \" A BSOLUTE Being,\" in esoteric philosophy.\n\nIn the tenets of the latter even Adi-Budha (first or primeval wisdom) is, while manifested, in one sense an illusion, Maya, since all the gods, including Brahma, have to die at the end of the \"Age of Brahma\"; the abstraction called Parabrahm alone -- whether we call it Ensoph, or Herbert Spencer's Unknowable -- being \"the One Absolute\" Reality.\n\nThe One secondless Existence is ADWAITA, \"Without a Second,\" and all the rest is Maya, teaches the Adwaita philosophy.\n\n[[Vol.\n\n1, Page]] 55 THE ABSOLUTE KNOWS ITSELF NOT.\n\ncondition of the Universe when it goes to sleep, or ceases to be, during the \"Nights of Brahma\" -- to awaken or reappear again, when the dawn of the new Manvantara recalls it to what we call existence.\n\n( b ) The \"Breath\" of the One Existence is used in its application only to the spiritual aspect of Cosmogony by Archaic esotericism; otherwise, it is replaced by its equivalent in the material plane -- Motion.\n\nThe One Eternal Element, or element-containing Vehicle, is Space , dimensionless in every sense; co-existent with which are -- endless duration , primordial (hence indestructible) matter , and motion -- absolute \"perpetual motion\" which is the \"breath\" of the \"One\" Element.\n\nThis breath, as seen, can never cease, not even during the Pralayic eternities.\n\n( See \" Chaos , Theos , Kosmos ,\" in Part II.) But the \"Breath of the One Existence\" does not, all the same, apply to the One Causeless Cause or the \"All Be-ness\" (in contradistinction to All-Being, which is Brahma, or the Universe).\n\nBrahma (or Hari) the four-faced god who, after lifting the Earth out of the waters, \"accomplished the Creation,\" is held to be only the instrumental, and not, as clearly implied, the ideal Cause."


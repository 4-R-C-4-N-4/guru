[content]
body = "It had been stated that the inventor of the \"Self-Motor\" was what is called, in the jargon of the Kabalists, a \" natural - born magician.\" That he was and would remain unconscious of the full range of his powers, and would work out merely those which he had found out and ascertained in his own nature -- firstly , because, attributing them to a wrong source, he could never give them full sway; and [[Footnote(s)]] ------------------------------------------------- * The reason for such psychic capacities is given farther on.\n\n** The above was written two years ago, at a time when hopes of success for the \"Keely Motor\" were at their highest.\n\nWhat was then said by the writer proved true, in every word, and now only a few remarks are added to it with regard to the failure of his expectations, so far, which has now been admitted by the discoverer himself.\n\nThough, however, the word failure is here used the reader should understand it in a relative sense, for as Mrs.\n\nBloomfield-Moore explains: \"What Mr.\n\nKeely does admit is that, baffled in applying vibratory force to mechanics, upon his first and second lines of experimental research, he was obliged either to confess a commercial failure, or to try a third departure from his base or principle; seeking success through another channel.\" .\n\n.\n\nAnd this \"channel\" is on the physical plane.\n\n[[Vol.\n\n1, Page]] 559 THE FIRST-BORN OF ETHER.\n\nsecondly , because it was beyond his power to pass to others that which was a capacity inherent in his special nature.\n\nHence the whole secret could not be made over permanently to anyone for practical purposes or use.* Individuals born with such a capacity are not very rare.\n\nThat they are not heard of more frequently is due to the fact that they live and die, in almost every case, in utter ignorance of being possessed of abnormal powers at all.\n\nMr.\n\nKeely possesses powers which are called \"abnormal\" just because they happen in our day to be as little known as blood circulation was before Harvey's time.\n\nBlood existed, and it behaved as it does at present in the first man born from woman; and so does that principle in man which can control and guide etheric vibratory force.\n\nAt any rate it exists in all those mortals whose inner selves are primordially connected , by reason of their direct descent , with that group of Dhyan-Chohans who are called \" the first - born of Ether.\n\n\" Mankind, psychically considered, is divided into various groups, each of which is connected with one of the Dhyanic groups that first formed psychic man; ( see paragraphs 1, 2, 3, 4, 5 in the Commentary to Stanza VII.\n\n) Mr.\n\nKeely being greatly favoured in this respect, and moreover, besides his psychic temperament, being intellectually a genius in mechanics, may thus achieve most wonderful results.\n\nHe has achieved some already -- more than any mortal man, not initiated into the final mysteries , has achieved in this age up to the present day.\n\nWhat he has done is certainly quite sufficient \"to demolish with the hammer of Science the idols of Science\" -- the idols of matter with the feet of clay -- as his friends justly predict and say of him.\n\nNor would the writer for a moment think of contradicting Mrs.\n\nBloomfield-Moore, when in her paper on \"Psychic Force and Etheric Force,\" she states that Mr.\n\nKeely, as a philosopher, \"is great enough in soul, wise enough in mind, and sublime enough in courage to overcome all difficulties, and to stand at last before the world as the greatest discoverer and inventor in the world.\" And again she writes: -- \"Should Keely do no more than lead scientists from the dreary realms where they are groping into the open field of elemental force, where gravity and cohesion are disturbed in their haunts and diverted to use; where, from unity of origin, emanates infinite energy in diversified forms, he will achieve immortal fame.\n\nShould he demonstrate, to the destruction of materialism, that the universe is animated by a mysterious principle to which matter, however perfectly organized, is absolutely subservient, he will be a greater spiritual benefactor to our race than the modern world has yet found in any man.\n\nShould he be able to substitute, in the treatment of disease, [[Footnote(s)]] ------------------------------------------------- * We learn that these remarks are not applicable to Mr.\n\nKeely's latest discovery; time alone can show the exact limit of his achievements.\n\n[[Vol.\n\n1, Page]] 560 THE SECRET DOCTRINE.\n\nthe finer forces of nature for the grossly material agencies which have sent more human beings to their graves than war, pestilence and famine combined, he will merit and receive the gratitude of mankind.\n\nAll this and more will he do, if he and those who have watched his progress, day by day for years, are not too sanguine in their expectations.\" Writing in the T.\n\nP.\n\nS.\n\n(\"Theosophical Publication Society\") series (No.\n\n9), the same lady, in her pamphlet, \"Keely's Secrets,\" brings forward a passage from an article, written a few years ago by the writer of the present volume, in her journal, the Theosophist , in these words: -- \"The author of No.\n\n5 of the pamphlets issued by the Theosophical Publication Society, 'What is Matter and What is Force,' says therein, 'The men of science have just found out \"a fourth state of matter,\" whereas the Occultists have penetrated years ago beyond the sixth, and therefore do not infer, but know of, the existence of the seventh, the last.' This knowledge comprises one of the secrets of Keely's so-called 'compound secret.' It is already known to many that his secret includes 'the augmentation of energy,' the insulation of the ether, and the adaptation of dynaspheric force to machinery.\" It is just because Keely's discovery would lead to a knowledge of one of the most occult secrets, a secret which can never be allowed to fall into the hands of the masses, that his failure to push his discoveries to their logical end seems certain to Occultists.\n\nBut of this more presently.\n\nEven in its limitations this discovery may prove of the greatest benefit.\n\nFor: -- \"Step by step, with a patient perseverance which some day the world will honour, this man of genius has made his researches, overcoming the colossal difficulties which again and again raised up in his path what seemed to be (to all but himself) insurmountable barriers to further progress: but never has the world's index finger so pointed to an hour when all is making ready for the advent of the new form of force that mankind is waiting for.\n\nNature, always reluctant to yield her secrets, is listening to the demands made upon her by her master, necessity.\n\nThe coal mines of the world cannot long afford the increasing drain made upon them.\n\nSteam has reached its utmost limits of power, and does not fulfil the requirements of the age.\n\nIt knows that its days are numbered.\n\nElectricity holds back, with bated breath, dependent upon the approach of her sister colleague."


[content]
body = "He knows nothing, through exact Science, of what took place nearly 10,000 years ago; yet he may find consolation in the knowledge or -- if he so prefers -- speculation on the fate of every one of the modern nations he knows of -- about 16,000 years hence.\n\n[[Footnote(s)]] ------------------------------------------------- * There are other cycles, of course, cycles within cycles - - and this is just that which creates such a difficulty in the calculations of racial events.\n\nThe circuit of the ecliptic is completed in 25,868 years.\n\nAnd, with regard to our Earth, it is calculated that the equinoctial point falls back fifty minutes ten seconds, annually.\n\nBut there is another cycle within this one.\n\nIt is said that \"as the apsis goes forward to meet it at the rate of eleven minutes twenty-four seconds, annually,\" (see the article on Astronomy in Encyclopaedia Britannica ), \"this would complete a revolution in one hundred and fifteen thousand three hundred and two years (115,302).\n\nThe approximation of the equinox and the apsis is the sum of these motions, sixty-one minutes thirty-four seconds, and hence the equinox returns to the same position in relation to the apsis in 21,128 years.\" We have mentioned this cycle in Isis Unveiled, Vol.\n\nI., in relation to other cycles.\n\nEach has a marked influence on its contemporary race.\n\n[[Vol.\n\n2, Page]] 331 PRE-HISTORIC STATUES.\n\nOur meaning is very clear.\n\nEvery sidereal year the tropics recede from the pole four degrees in each revolution from the equinoctial points, as the equator rounds through the Zodiacal constellations.\n\nNow, as every astronomer knows, at present the tropic is only twenty-three degrees and a fraction less than half a degree from the equator.\n\nHence it has still 2 1/2 degrees to run before the end of the Sidereal year; which gives humanity in general, and our civilized races in particular, a reprieve of about 16,000 years.* After the Great Flood of the Third Race (the Lemurians) -- \" Men decreased considerably in stature, and the duration of their lives was diminished.\n\nHaving fallen down in godliness they mixed with animal races, and intermarried among giants and Pigmies (the dwarfed races of the Poles) .\n\n.\n\n.\n\nMany acquired DIVINE, more -- UNLAWFUL knowledge, and followed willingly the LEFT PATH.\n\n\" (Commentary xxxiii.) Thus were the Atlanteans approaching destruction in their turn.\n\nHow many geological periods it took to accomplish this fourth destruction?\n\nWho can tell.\n\n.\n\n.\n\n.\n\nBut we are told that -- ------- (44.) T HEY ( the Atlanteans ) BUILT GREAT IMAGES, NINE YATIS HIGH (27 feet ) -- THE SIZE OF THEIR BODIES ( a ).\n\nL UNAR FIRES HAD DESTROYED THE LAND OF THEIR FATHERS ( the Lemurians ).\n\nW ATER THREATENED THE F OURTH ( Race ) ( b ) .\n\n( a ) It is well worth noticing that most of the gigantic statues discovered on Easter Island, a portion of an undeniably submerged continent -- as also those found on the outskirts of Gobi, a region which had been submerged for untold ages -- are all between 20 and 30 feet high.\n\nThe statues found by Cook on Easter Island measured almost all twenty-seven feet in height, and eight feet across the shoulders.\n\n( See § \" Stones, Witnesses to Giants, \" at the end of this Stanza.) The writer is well aware that the modern archaeologists have decided now that \"these statues are not very old,\" as declared by one of the high officials of the British Museum, where some of them now are.\n\nBut this is one of those arbitrary decisions of modern science which does not carry much weight.\n\nWe are told that it is after the destruction of \"Lemuria\" by subterranean fires that men went on steadily decreasing in stature -- a process already commenced after their physical F ALL - - and that finally, some millions of years after, they reached between six and seven feet, and are now dwindling down (as the older Asiatic races) to nearer five than [[Footnote(s)]] ------------------------------------------------- * See at the end of this Stanza \"On the Duration of Ages and Cycles.\" [[Vol.\n\n2, Page]] 332 THE SECRET DOCTRINE.\n\nsix feet.\n\nAs Pickering shows, there is in the Malay race (a sub-race of the Fourth Root Race) a singular diversity of stature; the members of the Polynesian family (Tahitians, Samoans, and Tonga islanders) are of a higher stature than the rest of mankind ; but the Indian tribes and the inhabitants of the Indo-Chinese countries are decidedly below the general average.\n\nThis is easily explained.\n\nThe Polynesians belong to the very earliest of the surviving sub-races, the others to the very last and transitory stock.\n\nAs the Tasmanians are now completely extinct, and the Australians rapidly dying out, so will the other old races soon follow.\n\n( b ) Now, how could those records have been preserved?\n\nwe may be asked.\n\nEven the knowledge of the Zodiac is denied to the Hindus by our kind and learned Orientalists, who conclude that the Aryan Hindus knew nothing of it, before the Greeks brought it into the country.\n\nThis uncalled-for slander was so sufficiently refuted by Bailly, and what is more, by the clear evidence of facts, as not to need very much additional refutation.\n\nWhile the Egyptians have on their Zodiacs (See Denon ' s \" Voyage en Egypte \" Vol.\n\nII.\n\n) irrefutable proofs of records having embraced more than three-and-a-half sidereal years -- or about 87,000 years -- the Hindu calculations cover nearly thirty-three such years, or 850,000 years.\n\nThe Egyptian priests assured Herodotus that the Pole of the Earth and the Pole of the Ecliptic had formerly coincided.\n\nBut, as remarked by the author of the Sphinxiad, \"These poor benighted Hindoos have registered a knowledge of Astronomy for ten times 25,000 years since the (last local) Flood (in Asia), or Age of Horror, \" in the latitude of India.\n\nAnd they possess recorded observations from the date of the first Great Flood within the Aryan historical memory -- that which submerged the last portions of Atlantis, 850,000 years ago.\n\nThe floods which preceded are, of course, more traditional than historical.\n\nThe sinking and transformation of Lemuria beginning nearly at the Arctic Circle (Norway), the Third Race ended its career in Lanka, or rather on that which became Lanka with the Atlanteans.\n\nThe small remnant now known as Ceylon is the Northern highland of ancient Lanka, while the enormous island of that name was, in the Lemurian period, the gigantic continent described a few pages back.\n\nAs a M ASTER says (See \" Esoteric Buddhism, \" p .\n\n65): -- \"Why should not your geologists bear in mind that under the continents explored and fathomed by them .\n\n.\n\n.\n\n."


body = "We are made also to face the \"mammoth age\" -- the extreme or earliest division of the Palaeolithic age -- in which the great rudeness of implements reaches its maximum, and the brutal (?) appearance of contemporary skulls, such as the Neanderthal, point to a very low type of Humanity.\n\nBut they may sometimes point also to something besides; to a race of men quite distinct from our (Fifth Race) Humanity.\n\n[[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] too short for him to have been transformed -- stretch it as you may.\n\nAnd if he was, and if no monkey is found earlier, what follows?\n\n[[Vol.\n\n2, Page]] 725 STRANGE CONFESSIONS OF SCIENCE.\n\nAs said by an anthropologist in \" Modern Thought \" (art.\n\n\"The Genesis of Man \"): \"The theory, scientifically based or not, of Peyrere may be considered to be equivalent to that which divided man in two species.\n\nBroca, Virey, and a number of the French anthropologists have recognised that the lower race of man, comprising the Australian, Tasmanian, and Negro race, excluding the Kaffirs and the Northern Africans, should be placed apart.\n\nThe fact that in this species, or rather sub-species, the third lower molars are usually larger than the second, and the squamosal and frontal bones are generally united by suture, places the Homo Afer on the level of being as good a distinct species as many of the kinds of finches.\n\nI shall abstain on the present occasion from mentioning the facts of hybridity, whereon the late Professor Broca has so exhaustively commented.\n\nThe history, in the past ages of the world, of this race is peculiar.\n\nIt has never originated a system of architecture or a religion of its own \" (Dr.\n\nC.\n\nCarter Blake).\n\nIt is peculiar, indeed, as we have shown in the case of the Tasmanians.\n\nHowever it may be, fossil man in Europe can neither prove nor disprove the antiquity of man on this Earth nor the age of his earliest civilizations.\n\nIt is time the Occultists should disregard any attempts to laugh at them, scorning the heavy guns of the satire of the men of science as much as the pop-guns of the profane, since it is impossible, so far, to obtain either proof or disproof, while their theories can stand the test better than the hypotheses of the Scientists at any rate.\n\nAs to the proof for the antiquity which they claim for man, they have, moreover, Darwin himself and Lyell.\n\nThe latter confesses that they (the naturalists) \"have already obtained evidence of the existence of man at so remote a period that there has been time for many conspicuous mammalia, once his contemporaries, to die out, and this even before the era of the earliest historical records.\"* This is a statement made by one of England's great authorities upon the question.\n\nThe two sentences that follow are as suggestive, and may well be remembered by the students of Occultism, for with all others he says: \"In spite of the long lapse of prehistoric ages during which he (Man) must have flourished on Earth, there is no proof of any perceptible change in his bodily structure.\n\nIf, therefore, he ever diverged from some unreasoning brute ancestor, we must suppose him to have existed at a far more distant epoch, possibly on some continents or islands now submerged beneath the Ocean.\" Thus lost continents are officially suspected.\n\nThat worlds (also Races) are periodically destroyed by fire (volcanoes and earthquakes) and water, in turn, and renewed, is a doctrine as old as man.\n\nManu, Hermes, the Chaldees, all antiquity believed in this.\n\nTwice already [[Footnote(s)]] ------------------------------------------------- * \" Antiquity of Man, \" p .\n\n530.\n\n[[Vol.\n\n2, Page]] 726 THE SECRET DOCTRINE.\n\nhas the face of the globe been changed by fire, and twice by water, since man appeared on it.\n\nAs land needs rest and renovation, new forces, and a change for its soil, so does water.\n\nThence arises a periodical redistribution of land and water, change of climates, etc., all brought on by geological revolution, and ending in a final change in the axis.\n\nAstronomers may pooh-pooh the idea of a periodical change in the behaviour of the globe's axis, and smile at the conversation given in the Book of Enoch between Noah and his \"grandfather\" Enoch; the allegory is, nevertheless, a geological and an astronomical fact: there is a secular change in the inclination of the earth's axis, and its appointed time is recorded in one of the great Secret Cycles.\n\nAs in many other questions, Science is gradually moving toward our way of thinking.\n\nDr.\n\nHenry Woodward, F.R.S., F.G.S., writes in the Popular Science Review (New Series in Vol.\n\nI.\n\np.\n\n115), Art.: \"Evidences of the Age of Ice.\" .\n\n.\n\n.\n\n.\n\n\"If it be necessary to call in extramundane causes to explain the great increase of ice at this glacial period, I would prefer the theory propounded by Dr.\n\nRobert Hooke in 1688; since, by Sir Richard Phillips and others; and lastly by Mr.\n\nThomas Belt, C.E ., F.G.S .; namely, a slight increase in the present obliquity of the ecliptic, a proposal in perfect accord with other known astronomical facts, and the introduction of which is essential to our cosmical condition as a unit in the great solar system.\" The following, quoted from a Lecture by W.\n\nPengelly, F.R.S.\n\n, F.G.S ., delivered in March, 1885, on \"The extinct Lake of Bovey Tracey\" shows the hesitation, in the face of every evidence in favour of Atlantis, to accept the fact.\n\nIt is a quotation in the body of the Lecture: -- \"Evergreen Figs, Laurels, Palms, and Ferns having gigantic rhizomes have their existing congeners in a sub-tropical climate, such, it cannot be doubted, as prevailed in Devonshire in Miocene times, and are thus calculated to suggest caution when the present climate of any district is regarded as normal.\n\n\"When, moreover, Miocene plants are found in Disco Island, on the west coast of Greenland, lying between 69[[degrees]] 20' and 70[[degrees]] 30' N.\n\nlat.; when we learn that among them were two species found also at Bovey ( Sequoia couttsiae, Quercus Lyelli ); when, to quote Professor Heer, we find that \"the 'splendid evergreen' ( Magnolia Inglefieldi ) 'ripened its fruits so far north as on the parallel of 70 [[degrees]] ' \" ( Phil.\n\nTrans."


body = "Air ships are riding at anchor, as it were, waiting for the force which is to make aerial navigation something more than a dream.\n\nAs easily as men communicate with their offices from their homes by means of the telephone, so will the inhabitants of separate continents talk across the ocean.\n\nImagination is palsied when seeking to foresee the grand results of this marvellous discovery, when once it is applied to art and mechanics.\n\nIn taking the throne which it will force steam to abdicate, dynaspheric force will rule the world with a power so mighty in the interests of civilization, that no finite mind can conjecture the results.\n\nLaurence Oliphant, in his preface to 'Scientific Religion,' says: 'A new moral future is dawning upon the human race -- one, certainly, of which it stands much in need.' In no way could this [[Vol.\n\n1, Page]] 561 ETHERIC WAVES.\n\nnew moral future be so widely, so universally, commenced as by the utilizing of dynaspheric force to beneficial purposes in life.\n\n.\n\n.\n\n.\n\n.\" The Occultists are ready to admit all this with the eloquent writer.\n\nMolecular vibration is, undeniably, \"Keely's legitimate field of research,\" and the discoveries made by him will prove wonderful -- yet only in his hands and through himself.\n\nThe world so far will get but that with which it can be safely entrusted.\n\nThe truth of this assertion has, perhaps, not yet quite dawned upon the discoverer himself, since he writes that he is absolutely certain that he will accomplish all that he has promised, and will then give it out to the world; but it must dawn upon him, and at no very far distant date.\n\nAnd what he says in reference to his work is a good proof of it: -- \"In considering the operation of my engine, the visitor, in order to have even an approximate conception of its modus operandi , must discard all thought of engines that are operated upon the principle of pressure and exhaustion , by the expansion of steam or other analogous gas which impinges upon an abutment , such as the piston of a steam - engine.\n\nMy engine has neither piston nor eccentrics, nor is there one grain of pressure exerted in the engine, whatever may be the size or capacity of it.\n\n\"My system, in every part and detail, both in the developing of my power and in every branch of its utilization, is based and founded on sympathetic vibration.\n\nIn no other way would it be possible to awaken or develop my force, and equally impossible would it be to operate my engine upon any other principle.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.This, however, is the true system; and henceforth all my operations will be conducted in this manner -- that is to say, my power will be generated, my engines run, my cannon operated, through a wire.\n\n\"It has been only after years of incessant labour, and the making of almost innumerable experiments, involving not only the construction of a great many most peculiar mechanical structures, and the closest investigation and study of the phenomenal properties of the substance 'ether,' per se , produced, that I have been able to dispense with complicated mechanism, and to obtain, as I claim, mastery over the subtle and strange force with which I am dealing .\" The passages underlined by us, are those which bear directly on the occult side of the application of the vibratory force, or what Mr.\n\nKeely calls \"sympathetic vibration.\" The \"wire\" is already a step below, or downward from the pure etheric plane into the terrestrial.\n\nThe discoverer has produced marvels -- the word \"miracle\" is not too strong -- when acting through the inter-etheric Force alone, the fifth and sixth principles of Akasa.\n\nFrom a \"generator\" six feet long, he has come down to one \"no larger than an old-fashioned silver watch;\" and this by itself is a miracle of mechanical (but not spiritual) genius.\n\nBut, as well expressed by his great patroness and defender, Mrs.\n\nBloomfield-Moore, \"the two forms of force which he has been experimenting with, and the phenomena attending them, are the very antithesis of each other.\" One was generated and acted upon by and [[Vol.\n\n1, Page]] 562 THE SECRET DOCTRINE.\n\nthrough himself.\n\nNo one, who should have repeated the thing done by himself, could have produced the same results.\n\nIt was \"Keely's ether\" that acted truly, while \"Smith's or Brown's\" ether would have remained for ever barren of results.\n\nFor Keely's difficulty has hitherto been to produce a machine which would develop and regulate the \"force\" without the intervention of any \"will power\" or personal influence, whether conscious or unconscious of the operator.\n\nIn this he has failed, so far as others were concerned, for no one but himself could operate on his \"machines.\" Occultly this was a far more advanced achievement than the \"success\" which he anticipates from his \"wire,\" but the results obtained from the fifth and sixth planes of the etheric (or Astral) Force, will never be permitted to serve for purposes of commerce and traffic.\n\nThat Keely's organism is directly connected with the production of the marvellous results is proven by the following statement emanating from one who knows the great discoverer intimately.\n\nAt one time the shareholders of the \"Keely Motor Co.\" put a man in his workshop for the express purpose of discovering his secret.\n\nAfter six months of close watching, he said to J.\n\nW.\n\nKeely one day: \"I know how it is done, now.\" They had been setting up a machine together, and Keely was manipulating the stop-cock which turned the force on and off.\n\n\"Try it, then,\" was the answer.\n\nThe man turned the cock, and nothing came.\n\n\"Let me see you do it again,\" the man said to Keely.\n\nThe latter complied, and the machinery operated at once.\n\nAgain the other tried, but without success.\n\nThen Keely put his hand on his shoulder and told him to try once more.\n\nHe did so, with the result of an instantaneous production of the current.\n\nThis fact, if true, settles the question.\n\nWe are told that Mr.\n\nKeely defines electricity \"as a certain form of atomic vibration.\" In this he is quite right; but this is electricity on the terrestrial plane, and through terrestrial correlations.\n\nHe estimates -- Molecular vibrations at 100,000,000 per second.\n\nInter-molecular vibrations at 300,000,000 per second Atomic vibrations at 900,000,000 per second Inter-atomic vibrations at 2,700,000,000 per second AEtheric vibrations at 8,100,000,000 pper second Inter-AEtheric vibrations at 24,300,000,000 per second This proves our point.\n\nThere are no vibrations that could be counted or even estimated at an approximate rate beyond \"the realm of the fourth son of Fohat ,\" using an occult phraseology, or that motion which corresponds to the formation of Mr.\n\nCrookes' radiant matter, or lightly called some years ago the \"fourth state of matter\" -- on this our plane.\n\n[[Vol."


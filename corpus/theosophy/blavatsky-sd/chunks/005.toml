[content]
body = "I say \"a few truths,\" advisedly, because that which must remain unsaid could not be contained in a hundred such volumes, nor could it be imparted to the present generation of Sadducees.\n\nBut, even the little that is now given is better than complete silence upon those vital truths.\n\nThe world of to-day, in its mad career towards the unknown -- which it is too ready to confound with the unknowable, whenever the problem eludes the grasp of the physicist -- is rapidly progressing on the reverse, material plane of spirituality.\n\nIt has now become a vast arena -- a true valley of discord and of eternal strife -- a necropolis, wherein lie buried the highest and the most holy aspirations of our Spirit-Soul.\n\nThat soul becomes with every new generation more paralyzed and atrophied.\n\nThe \"amiable infidels and accomplished profligates\" of Society, spoken of by Greeley, care little for the revival of the dead sciences of the past; but there is a fair minority of earnest students who are entitled to learn the few truths that may be given to them now; and now much more than ten years ago, when \"Isis Unveiled,\" or even the later attempts to explain the mysteries of esoteric science, were published.\n\nOne of the greatest, and, withal, the most serious objection to the correctness and reliability of the whole work will be the preliminary S TANZAS: \"How can the statements contained in them be verified?\" True, if a great portion of the Sanskrit, Chinese, and Mongolian works quoted in the present volumes are known to some Orientalists, the chief work -- that one from which the Stanzas are given -- is not in the possession of European Libraries.\n\nThe Book of Dzyan (or \"Dzan\") is utterly unknown to our Philologists, or at any rate was never heard of by them under its present name.\n\nThis is, of course, a great drawback [[Vol.\n\n1, Page]] xxiii INTRODUCTORY.\n\nto those who follow the methods of research prescribed by official Science; but to the students of Occultism, and to every genuine Occultist, this will be of little moment.\n\nThe main body of the Doctrines given is found scattered throughout hundreds and thousands of Sanskrit MSS ., some already translated -- disfigured in their interpretations, as usual, -- others still awaiting their turn.\n\nEvery scholar, therefore, has an opportunity of verifying the statements herein made, and of checking most of the quotations.\n\nA few new facts ( new to the profane Orientalist, only) and passages quoted from the Commentaries will be found difficult to trace.\n\nSeveral of the teachings, also, have hitherto been transmitted orally: yet even those are in every instance hinted at in the almost countless volumes of Brahminical, Chinese and Tibetan temple-literature.\n\nHowever it may be, and whatsoever is in store for the writer through malevolent criticism, one fact is quite certain.\n\nThe members of several esoteric schools -- the seat of which is beyond the Himalayas, and whose ramifications may be found in China, Japan, India, Tibet, and even in Syria, besides South America -- claim to have in their possession the sum total of sacred and philosophical works in MSS .\n\nand type: all the works, in fact, that have ever been written, in whatever language or characters, since the art of writing began; from the ideographic hieroglyphs down to the alphabet of Cadmus and the Devanagari.\n\nIt has been claimed in all ages that ever since the destruction of the Alexandrian Library (see Isis Unveiled, Vol.\n\nII., p.\n\n27), every work of a character that might have led the profane to the ultimate discovery and comprehension of some of the mysteries of the Secret Science, was, owing to the combined efforts of the members of the Brotherhoods, diligently searched for.\n\nIt is added, moreover, by those who know, that once found, save three copies left and stored safely away, such works were all destroyed.\n\nIn India, the last of the precious manuscripts were secured and hidden during the reign of the Emperor Akbar.* It is maintained, furthermore, that every sacred book of that kind, whose text was not sufficiently veiled in symbolism, or which had any [[Footnote(s)]] ------------------------------------------------- * Prof.\n\nMax Muller shows that no bribes or threats of Akbar could extort from the Brahmans the original text of the Veda; and boasts that European Orientalists have it ( Lecture on the \" Science of Religion, \" p.\n\n23).\n\nWhether Europe has the complete text is very doubtful, and the future may have very disagreeable surprises in store for the Orientalists.\n\n[[Vol.\n\n1, Page]] xxiv INTRODUCTORY.\n\ndirect references to the ancient mysteries, after having been carefully copied in cryptographic characters, such as to defy the art of the best and cleverest palaeographer, was also destroyed to the last copy.\n\nDuring Akbar's reign, some fanatical courtiers, displeased at the Emperor's sinful prying into the religions of the infidels, themselves helped the Brahmans to conceal their MSS.\n\nSuch was Badaoni, who had an undisguised horror for Akbar's mania for idolatrous religions.* Moreover in all the large and wealthy lamasaries, there are subterranean crypts and cave-libraries, cut in the rock, whenever the gonpa and the lhakhang are situated in the mountains.\n\nBeyond the Western Tsay-dam, in the solitary passes of Kuen-lun** there are several such hiding places.\n\nAlong the ridge of Altyn-Toga, whose soil no European foot has ever trodden so far, there exists a certain hamlet, lost in a deep gorge.\n\nIt is a small cluster of houses, a hamlet rather than a monastery, with a poor-looking temple in it, with one old lama, a hermit, living near by to watch it.\n\nPilgrims say that the subterranean galleries and halls under it contain a collection of books, the number of which, according to the accounts given, is too large to find room even in the British Museum.*** All this is very likely to provoke a smile of doubt.\n\nBut then, before [[Footnote(s)]] ------------------------------------------------- * Badaoni wrote in his Muntakhab at Tawarikh: \"His Majesty relished inquiries into the sects of these infidels (who cannot be counted, so numerous they are, and who have no end of revealed books ) .\n\n.\n\n.\n\nAs they (the Sramana and Brahmins) surpass other learned men in their treatises on morals, on physical and religious sciences, and reach a high degree in their knowledge of the future , in spiritual power, and human perfection, they brought proofs based on reason and testimony, and inculcated their doctrines so firmly that no man could now raise a doubt in his Majesty even if mountains were to crumble to dust, or the heavens were to tear asunder.\" This work \"was kept secret, and was not published till the reign of Jahangir.\" (Ain i Akbari, translated by Dr.\n\nBlochmann, p.\n\n104, note.) ** Karakorum mountains, Western Tibet."


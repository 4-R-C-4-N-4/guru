body = "What can modern science have to say to such an euhemerization of old fictions?\n\nThe verdict is not difficult to foresee.\n\nTherefore an attempt must be made to answer by anticipation, and prove that fictions and empirical speculations are so much of the domain of that same science, that none of the men of learning have the slightest right, with such a heavy beam in their own eye, to point to the speck in the eye of the Occultist, even if that speck be not a figment of our opponents' imagination.\n\n--------- S TANZA X.\n\n-- ( Continued.\n\n) 40.\n\nT HEN THE THIRD AND FOURTH ( races ) BECAME TALL WITH PRIDE.\n\nW E ARE THE KINGS, WE ARE THE GODS ( a ) .\n\n41.\n\nT HEY TOOK WIVES FAIR TO LOOK AT.\n\nW IVES FROM THE \"MINDLESS,\" THE NARROW-HEADED.\n\nT HEY BRED MONSTERS, WICKED DEMONS, MALE AND FEMALE.\n\nA LSO K HADO ( Dakini ) WITH LITTLE MINDS ( b ).\n\n42.\n\nT HEY BUILT TEMPLES FOR HUMAN BODY.\n\nM ALE AND F EMALE THEY WORSHIPPED ( c ).\n\nT HEN THE THIRD EYE ACTED NO LONGER ( d ).\n\n( a ) Such were the first truly physical men, whose first characteristic was -- pride!\n\nIt is the Third Race and the gigantic Atlanteans, the [[Vol.\n\n2, Page]] 272 THE SECRET DOCTRINE.\n\nmemory of whom lingered from one generation and race to another generation and race down to the days of Moses, and which found an objective form in those antediluvian giants, those terrible sorcerers and magicians, of whom the Roman Church has preserved such vivid and at the same time distorted legends.\n\nOne who has read and studied the Commentaries on the archaic doctrine, will easily recognise in some Atlanteans, the prototypes of the Nimrods, the Builders of the Tower of Babel, the Hamites, and all these tutti quanti of \"accursed memory,\" as theological literature expresses it: of those, in short, who have furnished posterity with the orthodox types of Satan.\n\nAnd this leads us naturally to inquire into the religious ethics of these early races, mythical as these may be.\n\nWhat was the religion of the Third and Fourth Races?\n\nIn the common acceptation of the term, neither the Lemurians, nor yet their progeny, the Lemuro-Atlanteans, had any, as they knew no dogma, nor had they to believe on faith.\n\nNo sooner had the mental eye of man been opened to understanding, than the Third Race felt itself one with the ever-present as the ever to be unknown and invisible ALL, the One Universal Deity.\n\nEndowed with divine powers, and feeling in himself his inner God, each felt he was a Man-God in his nature, though an animal in his physical Self.\n\nThe struggle between the two began from the very day they tasted of the fruit of the Tree of Wisdom; a struggle for life between the spiritual and the psychic, the psychic and the physical.\n\nThose who conquered the lower principles by obtaining mastery over the body, joined the \"Sons of Light.\" Those who fell victims to their lower natures, became the slaves of Matter.\n\nFrom \"Sons of Light and Wisdom\" they ended by becoming the \"Sons of Darkness.\" They had fallen in the battle of mortal life with Life immortal, and all those so fallen became the seed of the future generations of Atlanteans.* At the dawn of his consciousness, the man of the Third Root Race had thus no beliefs that could be called religion.\n\nThat is to say, he was equally as ignorant of \"gay religions, full of pomp and gold\" as of any system of faith or outward worship.\n\nBut if the term is to be defined as the binding together of the masses in one form of reverence paid to those we feel higher than ourselves, of piety -- as a feeling expressed by a child toward a loved parent -- then even the earliest Lemurians had a religion -- and a most beautiful one -- from the very beginning of their intellectual life.\n\nHad they not their bright gods of the elements around [[Footnote(s)]] ------------------------------------------------- * The name is used here in the sense of, and as a synonym of \"sorcerers.\" The Atlantean races were many, and lasted in their evolution for millions of years: all were not bad.\n\nThey became so toward their end, as we (the fifth) are fast becoming now.\n\n[[Vol.\n\n2, Page]] 273 THE GOLDEN AGE.\n\nthem, and even within themselves?* Was not their childhood passed with, nursed and tendered by those who had given them life and called them forth to intelligent, conscious life?\n\nWe are assured it was so, and we believe it.\n\nFor the evolution of Spirit into matter could never have been achieved; nor would it have received its first impulse, had not the bright Spirits sacrificed their own respective super-ethereal essences to animate the man of clay, by endowing each of his inner principles with a portion, or rather, a reflection of that essence.\n\nThe Dhyanis of the Seven Heavens (the seven planes of Being) are the NOUMENOI of the actual and the future Elements, just as the Angels of the Seven Powers of nature - the grosser effects of which are perceived by us in what Science is pleased to call the \"modes of motion\" -- the imponderable forces and what not -- are the still higher noumenoi of still higher Hierarchies.\n\nIt was the \"Golden Age\" in those days of old, the age when the \"gods walked the earth, and mixed freely with the mortals.\" Since then, the gods departed ( i.e.\n\n, became invisible), and later generations ended by worshipping their kingdoms -- the Elements.\n\nIt was the Atlanteans, the first progeny of semi-divine man after his separation into sexes -- hence the first-begotten and humanly-born mortals -- who became the first \"Sacrificers\" to the god of matter.\n\nThey stand in the far-away dim past, in ages more than prehistoric, as the prototype on which the great symbol of Cain was built,** as the first anthropomorphists who worshipped form and matter.\n\nThat worship degenerated very soon into self-worship, thence led to phallicism, or that which reigns supreme to this day in the symbolisms of every exoteric religion of ritual, dogma, and form.\n\nAdam and Eve became matter, or furnished the soil, Cain and Abel -- the latter the life-bearing soil, the former \"the tiller of that ground or field.\" Thus the first Atlantean races, born on the Lemurian Continent, separated from their earliest tribes into the righteous and the unrighteous; into those who worshipped the one unseen Spirit of Nature, the ray of which man feels within himself -- or the Pantheists, and those who offered fanatical worship to the Spirits of the Earth, the dark Cosmic, anthropomorphic Powers, with whom they made alliance."


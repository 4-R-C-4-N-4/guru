body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n2 [[Vol.\n\n2, Page]] 109 THE TABULA SMARAGDINA.\n\nSTANZA V.\n\nTHE EVOLUTION OF THE SECOND RACE.\n\n------- §§ (18) The Sons of Yoga.\n\n(19) The Sexless Second Race.\n\n(20) The Sons of the Sons of Twilight.\n\n(21) The \"Shadow,\" or the Astral Man, retires within, and man develops a physical body.\n\n--------------------- 18.\n\nT HE FIRST ( Race ) WERE THE S ONS OF Y OGA.\n\nT HEIR SONS, THE CHILDREN OF THE Y ELLOW F ATHER AND THE W HITE M OTHER.\n\nIn the later Commentary, the sentence is translated: -- \" The Sons of the Sun and of the Moon, the nursling of ether (or the wind ) ( a ) .\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n\" They were the shadows of the shadows of the Lords ( b ) .\n\nThey (the shadows) expanded.\n\nThe Spirits of the Earth clothed them ; the solar Lhas warmed them ( i.e.\n\npreserved the vital fire in the nascent physical forms).\n\nThe Breaths had life, but had no understanding.\n\nThey had no fire nor water of their own ( c ) .\n\n( a ) Remember in this connection the Tabula Smaragdina of Hermes, the esoteric meaning of which has seven keys to it.\n\nThe Astro-Chemical is well known to students, the anthropological may be given now.\n\nThe \"One thing\" mentioned in it is MAN.\n\nIt is said: \"The Father of THAT ONE ONLY THING is the Sun; its Mother the Moon; the Wind carries it in his bosom, and its nurse is the Spirituous Earth.\" In the occult rendering of the same it is added: \"and Spiritual Fire is its instructor (Guru).\" This fire is the higher Self, the Spiritual Ego, or that which is eternally reincarnating under the influence of its lower personal Selves, changing with every re-birth, full of Tanha or desire to live.\n\nIt is a strange law of Nature that, on this plane, the higher (Spiritual) Nature should be, so to say, in bondage to the lower.\n\nUnless the Ego takes refuge in the Atman, the ALL-SPIRIT, and merges entirely into the essence thereof, the personal Ego may goad it to the bitter end.\n\nThis cannot be thoroughly understood unless the student makes himself familiar with the mystery of evolution, which proceeds on triple lines -- spiritual, psychic and physical.\n\nThat which propels towards, and forces evolution, i.e.\n\n, compels the growth and development of Man towards perfection, is (a) the MONAD, [[Vol.\n\n2, Page]] 110 THE SECRET DOCTRINE.\n\nor that which acts in it unconsciously through a force inherent in itself; and (b) the lower astral body or the personal SELF.\n\nThe former, whether imprisoned in a vegetable or an animal body, is endowed with, is indeed itself, that force.\n\nOwing to its identity with the ALL-FORCE, which, as said, is inherent in the Monad, it is all-potent on the Arupa, or formless plane.\n\nOn our plane, its essence being too pure, it remains all-potential, but individually becomes inactive: e.g.\n\n, the rays of the Sun, which contribute to the growth of vegetation, do not select this or that plant to shine upon.\n\nUproot the plant and transfer it to a piece of soil where the sunbeam cannot reach it, and the latter will not follow it.\n\nSo with the Atman: unless the higher Self or EGO gravitates towards its Sun the Monad -- the lower Ego, or personal Self, will have the upper hand in every case.\n\nFor it is this Ego, with its fierce Selfishness and animal desire to live a Senseless life ( Tanha ) , which is \"the maker of the tabernacle,\" as Buddha calls it in Dhammapada (153 and 154).\n\nHence the expression, \"the Spirits of the Earth clothed the shadows and expanded them.\" To these \"Spirits\" belong temporarily the human astral selves; and it is they who give, or build, the physical tabernacle of man, for the Monad and its conscious principle, Manas, to dwell in.\n\nBut the \"Solar\" Lhas, Spirits, warm them, the shadows.\n\nThis is physically and literally true; metaphysically, or on the psychic and spiritual plane, it is equally true that the Atman alone warms the inner man; i.e.\n\n, it enlightens it with the ray of divine life and alone is able to impart to the inner man, or the reincarnating Ego, its immortality.\n\nThus, as we shall find, for the first three and a half Root-Races, up to the middle or turning point, it is the astral shadows of the \"progenitors,\" the lunar Pitris, which are the formative powers in the Races, and which build and gradually force the evolution of the physical form towards perfection -- this, at the cost of a proportionate loss of spirituality.\n\nThen, from the turning point, it is the Higher Ego, or incarnating principle, the nous or Mind, which reigns over the animal Ego, and rules it whenever it is not carried down by the latter.\n\nIn short, Spirituality is on its ascending arc, and the animal or physical impedes it from steadily progressing on the path of its evolution only when the selfishness of the personality has so strongly infected the real inner man with its lethal virus, that the upward attraction has lost all its power on the thinking reasonable man.\n\nIn sober truth, vice and wickedness are an abnormal, unnatural manifestation, at this period of our human evolution -- at least they ought to be so.\n\nThe fact that mankind was never more selfish and vicious than it is now, civilized nations having succeeded in making of the first an ethical characteristic, of the second an art, is an additional proof of the exceptional nature of the phenomenon.\n\n[[Vol.\n\n2, Page]] 111 THE SHELLS OF SHEBA HACHALOTH.\n\nThe entire scheme is in the \" Chaldean Book of Numbers, \" and even in the Zohar, if one only understood the meaning of the apocalyptic hints."


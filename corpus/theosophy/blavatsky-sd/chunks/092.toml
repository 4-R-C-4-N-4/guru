[content]
body = "\" The Dhyanis ( Pitris ) are those who have evolved their BHUTA ( doubles ) from themselves , which RUPA ( form ) has become the vehicle of monads ( seventh and sixth principles ) that had completed their cycle of transmigration in the three preceding Kalpas ( Rounds ) .\n\nThen , they ( the astral doubles ) became the men of the first Human Race of the Round.\n\nBut they were not complete , and were senseless.\n\n\" This will be explained in the Books that follow.\n\nMeanwhile man -- or rather his Monad -- has existed on the earth from the very beginning of this Round.\n\nBut, up to our own Fifth Race, the external shapes which covered those divine astral doubles changed and consolidated with every sub-race; the form and physical structure of the fauna changing at the same time, as they had to be adapted to the ever-changing conditions of life on this globe during the geological periods of its formative cycle.\n\nAnd thus shall they go on changing with every [[Vol.\n\n1, Page]] 184 THE SECRET DOCTRINE.\n\nRoot Race and every chief sub-race down to the last one of the Seventh in this Round.\n\n3.\n\n\" The inner , now concealed , man , was then ( in the beginnings ) the external man.\n\nThe progeny of the Dhyanis ( Pitris ), he was ' the son like unto his father.\n\n' Like the lotus , whose external shape assumes gradually the form of the model within itself , so did the form of man in the beginning evolve from within without.\n\nAfter the cycle in which man began to procreate his species after the fashion of the present animal kingdom , it became the reverse.\n\nThe human foetus follows now in its transformations all the forms that the physical frame of man had assumed throughout the three Kalpas ( Rounds ) during the tentative efforts at Plastic formation around the monad by senseless , because imperfect , matter , in her blind wanderings.\n\nIn the present age , the physical embryo is a plant , a reptile , an animal , before it finally becomes man , evolving within himself his own ethereal counterpart , in his turn.\n\nIn the beginning it was that counterpart ( astral man ) which , being senseless , got entangled in the meshes of matter.\n\n\" But this \"man\" belongs to the fourth Round.\n\nAs shown, the MONAD had passed through, journeyed and been imprisoned in, every transitional form throughout every kingdom of nature during the three preceding Rounds.\n\nBut the monad which becomes human is not the Man.\n\nIn this Round -- with the exception of the highest mammals after man, the anthropoids destined to die out in this our race, when their monads will be liberated and pass into the astral human forms (or the highest elementals) of the Sixth* and the Seventh Races, and then into lowest human forms in the fifth Round -- no units of either of the kingdoms are animated any longer by monads destined to become human in their next stage, but only by the lower Elementals of their respective realms.** The last human Monad incarnated before the beginning of the 5th [[Footnote(s)]] ------------------------------------------------- * Nature never repeats herself, therefore the anthropoids of our day have not existed at any time since the middle of the Miocene period; when, like all cross breeds, they began to show a tendency, more and more marked as time went on, to return to the type of their first parent, the black and yellow gigantic Lemuro-Atlantean.\n\nTo search for the \"Missing Link\" is useless.\n\nTo the scientists of the closing sixth Root-race, millions and millions of years hence, our modern races, or rather their fossils, will appear as those of small insignificant apes -- an extinct species of the genus homo.\n\n** These \"Elementals\" will become human Monads, in their turn, only at the next great planetary Manvantara.\n\n[[Vol.\n\n1, Page]] 185 THE MAN, OR THE APE; WHICH THE FIRST?\n\nRoot-Race.* The cycle of metempsychosis for the human monad is closed, for we are in the Fourth Round and the Fifth Root-Race.\n\nThe reader will have to bear in mind -- at any rate one who has made himself acquainted with \"Esoteric Buddhism\" -- that the Stanzas which follow in this Book and Book II speak of the evolution in our Fourth Round only.\n\nThe latter is the cycle of the turning-point, after which, matter, [[Footnote(s)]] ------------------------------------------------- * Such anthropoids form an exception because they were not intended by Nature, but are the direct product and creation of \"senseless\" man.\n\nThe Hindus give a divine origin to the apes and monkeys because the men of the Third Race were gods from another plane who had become \"senseless\" mortals.\n\nThis subject had already been touched upon in \"Isis Unveiled\" twelve years ago as plainly as was then possible.\n\nOn pp.\n\n278-279, the reader is referred \"to the Brahmins, if he would know the reason of the regard they have for the monkeys.\n\nFor then he (the reader) would perhaps learn -- were the Brahman to judge him worthy of an explanation -- that the Hindu sees in the ape but what Manu desired he should: the transformation of species most directly connected with that of the human family, a bastard branch engrafted on their own stock before the final perfection of the latter.\n\nHe might learn, further, that in the eyes of the educated 'heathen' the spiritual or inner man is one thing, and his terrestrial physical casket another.\n\nThat physical nature, the great combination of physical correlations of forces, ever creeping onward towards perfection, has to avail herself of the material at hand; she models and remodels as she proceeds, and finishing her crowning work in man, presents him alone as a fit tabernacle for the overshadowing of the divine Spirit.\" Moreover, a German scientific work is mentioned in a footnote on the same page.\n\nIt says that a Hanoverian scientist had recently published a Book entitled \"Ueber die Auflosung der Arten durch Naturliche Zucht-wahl,\" in which he shows, with great ingenuity, that Darwin was wholly mistaken in tracing man back to the ape.\n\nOn the contrary, he maintains that it is the ape which is evolved from man.\n\nHe shows that, in the beginning, mankind were morally and physically the types and prototypes of our present Race, and of our human dignity, by their beauty of form, regularity of feature, cranial development, nobility of sentiments, heroic impulses, and grandeur of ideal conception.\n\nThis is a purely Brahmanic, Buddhistic and Kabalistic philosophy.\n\nThe Book is copiously illustrated with diagrams, tables, etc.\n\nIt asserts that the gradual debasement and degradation of man, morally and physically, can be readily traced throughout the ethnological transformation down to our time.\n\nAnd, as one portion has already degenerated into apes, so the civilized man of the present day will at last, under the action of the inevitable law of necessity, be also succeeded by like descendants.\n\nIf we may judge of the future by the actual Present, it certainly does seem possible that so unspiritual and materialistic a body should end as Simia rather than as Seraphs."


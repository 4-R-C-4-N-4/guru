[content]
body = "( a ) This sloka expresses the conception -- a purely Vedantic one, as already explained elsewhere -- of a life-thread, Sutratma , running through successive generations.\n\nHow, then, can this be explained?\n\nBy resorting to a simile, to a familiar illustration, though necessarily imperfect, as all our available analogies must be.\n\nBefore resorting to it, however, I would ask whether it seems unnatural , least of all \"supernatural,\" to any one of us, when we consider that process known as the growth and development of a foetus into a healthy baby weighing several pounds evolves from what?\n\nFrom the segmentation of an infinitesimally small ovum and a spermatozoon; and afterwards we see that baby develop into a six-foot man!\n\nThis refers to the atomic and physical [[Footnote(s)]] ------------------------------------------------- * Paracelsus calls them the Flagae; the Christians, the \"Guardian Angels;\" the Occultist, the \"Ancestors, the Pitris;\" they are the sixfold Dhyan Chohans, having the six spiritual Elements in the composition of their bodies -- in fact, men, minus the physical body.\n\n[[Vol.\n\n1, Page]] 223 THE MYSTERY OF BEING.\n\nexpansion from the microscopically small into something very large, from the -- to the naked eye -- unseen, into the visible and objective.\n\nScience has provided for all this; and, I dare say, her theories, embryological, biological, and physiological, are correct enough so far as exact observation of the material goes.\n\nNevertheless, the two chief difficulties of the science of embryology -- namely, what are the forces at work in the formation of the foetus, and the cause of \"hereditary transmission\" of likeness, physical, moral or mental -- have never been properly answered; nor will they ever be solved till the day when scientists condescend to accept the Occult theories.* But if this physical pheno- [[Footnote(s)]] ------------------------------------------------- * The materialists and the evolutionists of the Darwinian school would be ill-advised to accept the newly worked-out theories of Professor Weissmann, the author of Beitrage zur Descendenzlehre , with regard to one of the two mysteries of Embryology, as above specified, which he seems to have solved -- as he thinks.\n\nFor, when it is solved, Science will have stepped over into the domain of the truly occult, and stepped for ever out of the realm of transformation, as taught by Darwin.\n\nThe two are irreconcileable, from the standpoint of materialism.\n\nRegarded from that of the Occultists, it solves all these mysteries.\n\nThose who are not acquainted with the new discovery of Professor Weissman -- at one time a fervent Darwinist -- ought to hasten to repair the deficiency.\n\nThe German Embryologist-philosopher shows -- thus stepping over the heads of the Greek Hippocrates and Aristotle, right back into the teachings of the old Aryans -- one infinitesimal cell, out of millions of others at work in the formation of an organism, determining alone and unaided, by means of constant segmentation and multiplication, the correct image of the future man (or animal) in its physical, mental, and psychic characteristics.\n\nIt is that cell which impresses on the face and form of the new individual the features of the parents or of some distant ancestor; it is that cell again which transmits to him the intellectual and mental idiosyncracies of his sires, and so on.\n\nThis Plasm is the immortal portion of our bodies -- simply through the process of successive assimilations.\n\nDarwin's theory, viewing the embryological cell as an essence or the extract from all other cells, is set aside; it is incapable of accounting for hereditary transmission.\n\nThere are but two ways of explaining the mystery of heredity; either the substance of the germinal cell is endowed with the faculty of crossing the whole cycle of transformations that lead to the construction of a separate organism and then to the reproduction of identical germinal cells; or, those germinal cells do not have their genesis at all in the body of the individual , but proceed directly from the ancestral germinal cell passed from father to son through long generations.\n\nIt is the latter hypothesis that Weissmann accepted and has worked upon; and it is to this cell that he traces the immortal portion of man.\n\nSo far, so good; and when this almost correct theory is accepted, how will Biologists explain the first appearance of this everlasting cell?\n\nUnless man \"grew\" like the \"immortal Topsy,\" and was not born at all, but fell from the clouds, how was that embryological cell born in him?\n\n[[Vol.\n\n1, Page]] 224 THE SECRET DOCTRINE.\n\nmenon astonishes no one, except in so far as it puzzles the Embryologists, why should our intellectual and inner growth, the evolution of the human-spiritual to the Divine-Spiritual, be regarded as, or seem, more impossible than the other?\n\nNow to the simile.\n\nComplete the physical plasm, mentioned in the last foot-note, the \"Germinal Cell\" of man with all its material potentialities, with the \"spiritual plasm,\" so to say, or the fluid that contains the five lower principles of the six-principled Dhyan -- and you have the secret, if you are spiritual enough to understand it.\n\n\"When the seed of the animal man is cast into the soil of the animal woman, that seed cannot germinate unless it has been fructified by the five virtues (the fluid of, or the emanation from the principles) of the six-fold Heavenly man.\n\nWherefore the Microcosm is represented as a Pentagon, within the Hexagon Star, the \"Macrocosm.\" (\"[[ Anthropos ]],\") a work on Occult Embryology, Book I.).\n\nThen: \"The functions of Jiva on this Earth are of a five-fold character.\n\nIn the mineral atom it is connected with the lowest principles of the Spirits of the Earth (the six-fold Dhyanis); in the vegetable particle, with their second -- the Prana (life); in the animal, with all these plus the third and the fourth; in man, the germ must receive the fruition of all the five.\n\nOtherwise he will be born no higher than an animal\"; namely, a congenital idiot.\n\nThus in man alone the Jiva is complete.\n\nAs to his seventh principle, it is but one of the Beams of the Universal Sun.\n\nEach rational creature receives only the temporary loan of that which has to return to its source; while his physical body is shaped by the lowest terrestrial lives, through physical, chemical, and physiological evolution.\n\n\"The Blessed Ones have nought to do with the purgations of matter.\" (Kabala, Chaldean Book of Numbers)."


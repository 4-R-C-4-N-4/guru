body = "When Leverrier and Adams predicted a planet by calculation, it was gravely asserted in some quarters that the planet which had been calculated was not the planet but another which had clandestinely and improperly got into the neighbourhood of the true body.\n\nThe disposition to suspect hoax is stronger than the disposition to hoax.\n\nWho was it that first announced that the classical writings of Greece and Rome were one huge hoax perpetrated by the monks in what the announcer would be as little or less inclined than Dr.\n\nMaitland to call the dark ages?\" (p.\n\n13).\n\nThus let it be.\n\nNo disbeliever who takes the \"Secret Doctrine\" for a \"hoax\" is forced or even asked to credit our statements.\n\nThese have already been proclaimed to be such by certain very clever American journalists before even the work went to press.* Nor, is it after all, necessary that any one should believe in the Occult Sciences and the old teachings, before one knows anything or even [[Footnote(s)]] ------------------------------------------------- * So far back as July, 1888, at a time when the MSS .\n\nof this work had not yet left my writing table, and the Secret Doctrine was utterly unknown to the world, it was already being denounced as a product of my brain and no more.\n\nThese are the flattering terms in which the Evening Telegraph (of America) referred to this still unpublished work in its issue of June 30, 1888: \" Among the fascinating books for July reading is Mme.\n\nBlavatsky's new book on Theosophy .\n\n.\n\n.\n\n(!) the S ECRET D OCTRINE.\n\n.\n\n.\n\n.\n\nBut because she can soar back into the Brahmin ignorance .\n\n.\n\n.\n\n(!\n\n?) .\n\n.\n\n.\n\nis no proof that everything she says is true.\n\n\" And once the prejudiced verdict given on the mistaken notion that my book was out, and that the reviewer had read it, neither of which was or could be the case, now that it is really out the critic will have to support his first statement, whether correct or otherwise, and thus get out of it, probably by a more slashing criticism than ever.\n\n[[Vol.\n\n2, Page]] 442 THE SECRET DOCTRINE.\n\nbelieves in his own soul.\n\nNo great truth was ever accepted a priori, and generally a century or two passed before it began to glimmer in the human consciousness as a possible verity, except in such cases as the positive discovery of the thing claimed as a fact.\n\nThe truths of to-day are the falsehoods and errors of yesterday, and vice versa.\n\nIt is only in the XX th century that portions, if not the whole, of the present work will be vindicated.\n\nIt is no fact going against our statements, therefore, even if Sir John Evans does affirm that writing was unknown in the stone age.\n\nFor it may have been unknown during that period in the Fifth Aryan race, and have been perfectly known to the Atlanteans of the Fourth, in the palmy days of their highest civilization.\n\nThe cycles of the rise and fall of the nations and races are there to account for it.\n\nIf told that there have been cases before now of forged pseudographs being palmed off on the credulous, and that our work may be classed with Jacolliot's \"Bible in India\" (in which, by the way, there are more truths among its errors than are found in the works of orthodox and recognized Orientalists) -- the charge and comparison will dismay us very little.\n\nWe bide our time.\n\nEven the famous \"Ezour-Veda\" of the last century, considered by Voltaire \"the most precious gift from the East to the West,\" and by Max Muller \"about the silliest book that can be read,\" is not altogether without facts and truths in it.\n\nThe cases when the a priori negations of specialists became justified by subsequent corroborations form but an insignificant percentage of those that were fully vindicated by subsequent discoveries, and confirmed to the great dismay of the learned objectors.\n\n\"Ezour Veda,\" was a very small bone of contention compared with the triumph of Sir William Jones, Anquetil de Perron, and others in the matter of Sanskrit and its literature.\n\nSuch facts are recorded by Professor Max Muller himself, who, speaking of the discomfiture of Dugald Stewart and Co.\n\nin connection with this, states that \"if the facts about Sanskrit were true, Dugald Stewart was too wise not to see that the conclusions drawn from them were inevitable.\n\nHe therefore denied the reality of such a language as Sanskrit altogether, and wrote his famous essay to prove that Sanskrit had been put together after the model of Greek and Latin, by those arch-forgers and liars, the Brahmans, and that the whole of Sanskrit literature was an imposition\" ( Science of Language, p.\n\n168).\n\nThe writer is quite willing and feels proud to keep company with these Brahmans, and other historical \"liars,\" in the opinion of our modern Dugald Stewarts.\n\nShe has lived too long, and her experience has been too varied and personal, for her not to know at least something of human nature.\n\n\"When you doubt, abstain,\" says the wise Zoroaster, [[Vol.\n\n2, Page]] 443 PARADOXES OF SCIENCE.\n\nwhose prudent aphorism is found corroborated in every case by daily life and experience.\n\nYet, like St.\n\nJohn the Baptist, this sage of the past Ages is found preaching in the desert, in company with a more modern philosopher, namely Bacon, who offers the same priceless bit of practical Wisdom.\n\n\"In contemplation,\" he says (in any question of Knowledge, we add), \"if a man begin with certainties, he shall end in doubts; but if he will be content to begin with doubts, he shall end in certainties.\n\n\" With this piece of advice from the father of English Philosophy to the representatives of British scepticism we ought to close the debate, but our theosophical readers are entitled to a final piece of Occult information.\n\nEnough was said to show that evolution in general, events, mankind, and everything else in Nature proceed in cycles.\n\nWe have spoken of seven Races, five of which have nearly completed their earthly career, and have claimed that every Root-Race, with its sub-races and innumerable family divisions and tribes, was entirely distinct from its preceding and succeeding race.\n\nThis will be objected to, on the authority of uniform experience in the question of Anthropology, and Ethnology.\n\nMan was -- save in colour and type, and perhaps a difference in facial peculiarities and cranial capacity -- ever the same under every climate and in every part of the world, say the Naturalists: ay, even in stature.\n\nThis, while maintaining that man descends from the same unknown ancestor as the ape, a claim that is logically impossible without an infinite variation of stature and form, from his first evolution into a biped.\n\nThe very logical persons who maintain both propositions are welcome to their paradoxical views.\n\nOnce more we address only those who, doubting the general derivation of myths from \"the contemplation of the visible workings of external nature\" .\n\n.\n\n.\n\n."


body = "5, the Sloka simply says: \"Bhutas -- fiends, frightful from being monkey-coloured and carnivorous\"; and the word in India now means ghosts, ethereal or astral phantoms, while in esoteric teaching it means elementary substances, something made of attenuated, noncompound essence, and, specifically, the astral double of any man or animal.\n\nIn this case these primitive men are the doubles of the first ethereal Dhyanis or Pitris.\n\n[[Vol.\n\n2, Page]] 103 THE DIVINE REBELS.\n\nHIGHER SELF or human Monad -- and the animal Monad, both one and the same, although the former is endowed with divine intelligence, the latter with instinctual faculty alone.\n\nHow is the difference to be explained, and the presence of that HIGHER SELF in man accounted for?\n\n\" The Sons of MAHAT are the quickeners of the human Plant.\n\nThey are the Waters falling upon the arid soil of latent life, and the Spark that vivifies the human animal.\n\nThey are the Lords of Spiritual Life eternal.\n\n\" .\n\n.\n\n.\n\n.\n\n\" In the beginning (in the Second Race) some (of the Lords) only breathed of their essence into Manushya (men); and some took in man their abode.\n\n\" This shows that not all men became incarnations of the \"divine Rebels, \" but only a few among them.\n\nThe remainder had their fifth principle simply quickened by the spark thrown into it, which accounts for the great difference between the intellectual capacities of men and races.\n\nHad not the \"sons of Mahat,\" speaking allegorically, skipped the intermediate worlds, in their impulse toward intellectual freedom, the animal man would never have been able to reach upward from this earth, and attain through self-exertion his ultimate goal.\n\nThe cyclic pilgrimage would have to be performed through all the planes of existence half unconsciously, if not entirely so, as in the case of the animals.\n\nIt is owing to this rebellion of intellectual life against the morbid inactivity of pure spirit, that we are what we are -- self-conscious, thinking men, with the capabilities and attributes of Gods in us, for good as much as for evil.\n\nHence the REBELS are our saviours.\n\nLet the philosopher ponder well over this, and more than one mystery will become clear to him.\n\nIt is only by the attractive force of the contrasts that the two opposites -- Spirit and Matter -- can be cemented on Earth, and, smelted in the fire of self-conscious experience and suffering, find themselves wedded in Eternity.\n\nThis will reveal the meaning of many hitherto incomprehensible allegories, foolishly called \"fables.\" ( Vide infra, \" The Secret of Satan.\n\n\") It explains, to begin with, the statement made in Pymander: that the \"heavenly MAN,\" the \"Son of the Father,\" who partook of the nature and essence of the Seven Governors, or creators and Rulers of the material world, \"peeped through the Harmony and, breaking through the Seven Circles of Fire, made manifest the downward-born nature.\"* It explains every verse in that Hermetic narrative, as also the Greek allegory of Prometheus.\n\nMost important of all, it explains the many allegorical accounts about the \"Wars in Heaven,\" including that of Revelation with respect to the Christian dogma of the fallen angels.\n\nIt explains the \"rebellion\" of the oldest and highest Angels, and the meaning of their being cast down from Heaven into the depths of Hell, [[Footnote(s)]] ------------------------------------------------- * See \" Pymander, \" Bk.\n\nII., verses 17 to 29.\n\n[[Vol.\n\n2, Page]] 104 THE SECRET DOCTRINE.\n\ni.e ., MATTER.\n\nIt even solves the recent perplexity of the Assyriologists, who express their wonder through the late George Smith.\n\n\"My first idea of this part\" (of the rebellion), he says, \"was that the wars with the powers of Evil preceded the Creation ; I now think it followed the account of the fall\" ( Chaldean Account of Genesis, p.\n\n92).\n\nIn this work Mr.\n\nGeorge Smith gives an engraving, from an early Babylonian cylinder, of the Sacred Tree, the Serpent, man and woman.\n\nThe tree has seven branches: three on the man's side, four on that of the female.\n\nThese branches are typical of the seven Root-Races, in the third of which, at its very close, occurred the separation of the sexes and the so-called FALL into generation.\n\nThe three earliest Races were sexless, then hermaphrodite; the other four, male and female, as distinct from each other.\n\n\"The Dragon,\" says Mr.\n\nG.\n\nSmith, \"which in the Chaldean account of the creation leads man to sin, is the creation of Tiamat, the living principle of the Sea, or Chaos .\n\n.\n\n.\n\nwhich was opposed to the deities at the creation of the world.\" This is an error.\n\nThe Dragon is the male principle, or Phallus, personified, or rather animalized ; and Tiamat, \"the embodiment of the Spirit of Chaos,\" of the deep, or Abyss, is the female principle, the Womb.\n\nThe \"Spirit of Chaos and Disorder \" refers to the mental perturbation which it led to.\n\nIt is the sensual, attractive, magnetic principle which fascinates and seduces, the ever living active element which throws the whole world into disorder, chaos, and sin.\n\nThe Serpent seduces the woman, but it is the latter who seduces man, and both are included in the Karmic curse, though only as a natural result of a cause produced.\n\nSays George Smith: \"It is clear that the Dragon is included in the curse for the Fall, and that the Gods\" (the Elohim, jealous at seeing the man of clay becoming a Creator in his turn, like all the animals,) \"invoke on the head of the human Race all the evils which afflict humanity.\n\nWisdom and knowledge shall injure him, he shall have family quarrels, he will anger the gods, he shall submit to tyranny.\n\n.\n\n.\n\n.\n\nhe shall be disappointed in his desires, he shall pour out useless prayers, he shall commit future sin.\n\n.\n\nNo doubt subsequent lines continue this topic, but again our narrative is broken, and it re-opens only where the gods are preparing for war with the powers of evil, which are led by Tiamat (the woman).\n\n.\n\n.\n\n.\n\n\" ( Babylonian Legend of Creation, p.\n\n92.) This account is omitted in Genesis, for monotheistic purposes.\n\nBut it is a mistaken policy -- born no doubt of fear, and regard for dogmatic religion and its superstitions -- to have sought to restore the Chaldean fragments by Genesis, whereas it is the latter, far younger than any of the fragments, which ought to be explained by the former.\n\n------- [[Vol.\n\n2, Page]] 105 MAN'S FATHER, THE SUN.\n\n17.\n\nT HE BREATH ( human Monad ) NEEDED A FORM; THE F ATHERS GAVE IT.\n\nT HE BREATH NEEDED A GROSS BODY; T HE EARTH MOULDED IT."


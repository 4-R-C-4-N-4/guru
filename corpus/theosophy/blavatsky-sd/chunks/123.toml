[content]
body = "No Hindu has ever mistaken Prakriti -- the Astral Light being only above the lowest plane of Prakriti, the material Kosmos -- for the \"immortal Spirit.\" Prakriti is ever called Maya , illusion, and is doomed to disappear with the rest, the gods included, at the hour of the Pralaya; for it is shown that Akasa is not even the Ether, least of all then, we imagine, can it be the Astral Light.\n\nThose unable to penetrate beyond the dead letter of the Puranas, have occasionally confused Akasa with Prakriti, with Ether, and even with the visible Sky!\n\nIt is true also that those who have invariably translated the term Akasa by \"Ether\" (Wilson, for instance), finding it called \"the material cause of sound\" possessing, moreover, this one single property (Vishnu Purana), have ignorantly imagined it to be \"material,\" in the physical sense.\n\nTrue, again, that if the characteristics are accepted literally, then, since nothing material or physical, and therefore conditioned and temporary can be immortal -- according to metaphysics and philosophy -- it would follow that Akasa is neither infinite nor immortal.\n\nBut all this is erroneous, since both the words Pradhana [[Vol.\n\n1, Page]] 256 THE SECRET DOCTRINE.\n\n(primeval matter) and sound , as a property, have been misunderstood; the former term (Pradhana) being certainly synonymous with Mulaprakriti and Akasa, and the latter (sound) with the Verbum, the Word or the Logos.\n\nThis is easy to demonstrate; for it is shown in the following sentences in Vishnu Purana: \"In the beginning there was neither day nor night, nor sky, nor earth, nor darkness, nor light.\n\n.\n\n.\n\n.\n\n.\n\nSave only O NE, unapprehensible by intellect, or that which is Brahma and Pums (Spirit) and Pradhana (primordial matter).\" .\n\n.\n\n.\n\n.\n\n(Book I., ch.\n\nii.).\n\nNow, what is Pradhana, if it is not Mulaprakriti, the root of all, in another aspect?\n\nFor Pradhana, though said further on to merge into the Deity as everything else does, in order to leave the ONE absolute during the Pralaya, yet is held as infinite and immortal.\n\nThe Commentator describes the Deity as: \"One Pradhanika Brahma Spirit: THAT, was,\" and interprets the compound term as a substantive, not as a derivative word used attributively, i.e.\n\n, like something conjoined with Pradhana.* Hence Pradhana even in the Puranas is an aspect of Parabrahmam, not an evolution, and must be the same as the Vedantic Mulaprakriti.\n\n\"Prakriti in its primary state is Akasa,\" says a Vedantin scholar (see \"Five Years of Theosophy,\" p.\n\n169).\n\nIt is almost abstract Nature.\n\nAkasa, then, is Pradhana in another form, and as such cannot be Ether, the ever-invisible agent, courted even by physical Science.\n\nNor is it Astral Light.\n\nIt is, as said, the noumenon of the seven-fold differentiated Prakriti** -- the ever immaculate \"Mother\" of the fatherless Son, who becomes \"Father\" on the lower manifested plane.\n\nFor MAHAT is the first product of Pradhana, or Akasa, and Mahat -- Universal intelligence \"whose characteristic property is Buddhi\" -- is no other than the Logos , for he is called \"Eswara\" Brahma, Bhava, etc.\n\n( See Linga Purana , sec.\n\nlxx.\n\n12 et seq.; and Vayu Purana, but especially the former Purana -- prior, section viii., 67-74).\n\nHe is, in short, the \"Creator\" or the divine mind in creative operation, \"the cause of all things.\" He is [[Footnote(s)]] ------------------------------------------------- * The student has to note, moreover, that the Purana is a dualistic system, not evolutionary, and that, in this respect, far more will be found, from an esoteric standpoint, in Sankhya, and even in the Manava - dharma - Sastra , however much the latter differs from the former.\n\n** In the Sankhya philosophy, the seven Prakritis or \"productive productions\" are Mahat , Ahamkara , and the five tanmatras.\n\nSee \" Sankhya - karika ,\" III., and the Commentary thereon.\n\n[[Vol.\n\n1, Page]] 257 AKASA IS NOT ETHER.\n\nthe \"first-born\" of whom the Puranas tell us that \"Mahat and matter are the inner and outer boundaries of the Universe,\" or, in our language, the negative and the positive poles of dual nature (abstract and concrete), for the Purana adds: \"In this manner -- as were the seven forms (principles) of Prakriti reckoned from Mahat to Earth -- so at the time of pralaya (pratyahara) these seven successively re-enter into each other.\n\nThe egg of Brahma (Sarva-mandala) is dissolved with its seven zones (dwipa), seven oceans, seven regions, etc.\" (Vishnu Purana, Book vi., ch.\n\niv.)* These are the reasons why the Occultists refuse to give the name of Astral Light to Akasa, or to call it Ether.\n\n\"In my Father's house are many mansions,\" may be contrasted with the occult saying, \"In our Mother's house there are seven mansions,\" or planes, the lowest of which is above and around us -- the Astral Light.\n\nThe elements, whether simple or compound, could not have remained the same since the commencement of the evolution of our chain.\n\nEverything in the Universe progresses steadily in the Great Cycle, while incessantly going up and down in the smaller cycles.\n\nNature is never stationary during manvantara, as it is ever becoming ,** not simply being; and mineral, vegetable, and human life are always adapting their organisms to the then reigning Elements, and therefore those Elements were then fitted for them, as they are now for the life of present humanity.\n\nIt will only be in the next, or fifth, Round that the fifth Element, Ether -- the gross body of Akasa, if it can be called even that -- [[Footnote(s)]] ------------------------------------------------- * No use to say so to the Hindus, who know their Puranas by heart, but very useful to remind our Orientalists and those Westerns who regard Wilson's translations as authoritative, that in his English translation of the Vishnu Purana he is guilty of the most ludicrous contradictions and errors.\n\nSo on this identical subject of the seven Prakritis or the seven zones of Brahma's egg, the two accounts differ totally.\n\nIn Vol.\n\n1, page 40, the egg is said to be externally invested by seven envelopes -- Wilson comments: \"by Water, Air, Fire, Ether, and Ahamkara\" (which last word does not exist in the Sanskrit texts); and in vol.\n\nv., p."


body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n2 [[Vol.\n\n2, Page]] 52 THE SECRET DOCTRINE.\n\nSTANZA II.\n\nNATURE UNAIDED FAILS.\n\n------- § (5) After enormous periods the Earth creates monsters.\n\n(6) The \"Creators\" are displeased.\n\n(7) They dry the Earth.\n\n(8) The forms are destroyed by them.\n\n(9) The first great tides.\n\n(10) The beginning of incrustation.\n\n--------------------- 5.\n\nT HE W HEEL WHIRLED FOR THIRTY CRORES ( of years, or 300,000,000 * ) .\n\nI T CONSTRUCTED RUPAS ( forms ) .\n\nS OFT STONES, THAT HARDENED ( minerals ) ; HARD PLANTS, THAT SOFTENED ( vegetation ) .\n\nV ISIBLE FROM INVISIBLE, INSECTS AND SMALL LIVES ( sarisripa, swapada ) .\n\nS HE ( the Earth ) SHOOK THEM OFF HER BACK, WHENEVER THEY OVERRAN THE MOTHER ( a ).\n\nA FTER THIRTY CRORES OF YEARS, SHE TURNED ROUND.\n\nS HE LAID ON HER BACK; ON HER SIDE.\n\n.\n\n.\n\n.\n\n.\n\nS HE WOULD CALL NO SONS OF H EAVEN, SHE WOULD ASK NO SONS OF W ISDOM.\n\nS HE CREATED FROM HER OWN BOSOM.\n\nSHE EVOLVED WATER-MEN TERRIBLE AND BAD ( b ).\n\n( a ) This relates to an inclination of the axis -- of which there were several -- to a consequent deluge and chaos on Earth (having, however, no reference to primeval chaos), in which monsters, half-human, half-animal, were generated.\n\nWe find it mentioned in the \"Book of the Dead,\" and also in the Chaldean account of creation, on the Cutha Tablets, however mutilated.\n\n[[Footnote(s)]] ------------------------------------------------- * 300 million years, or Three Occult Ages.\n\nThe Rig Veda has the same division.\n\nIn the \" Physician ' s Hymn, \" (X 97 1) it is said that \"the plants came into being three ages (Triyugam) before the gods\" on our Earth (See \"Chronology of the Brahmins\" at the end of this Stanza).\n\n[[Vol.\n\n2, Page]] 53 THE MONSTERS OF CHAOS.\n\nIt is not even allegory.\n\nHere we have facts, that are found repeated in the account of Pymander, as well as in the Chaldean tablets of creation.\n\nThe verses may almost be checked by the Cosmogony, as given by Berosus, which has been disfigured out of recognition by Eusebius, but some of the features of which may yet be found in fragments left by ancient Greek authors -- Apollodorus, Alexander Polyhistor, etc., etc.\n\n\"The water-men terrible and bad,\" who were the production of physical nature alone, a result of the \"evolutionary impulse\" and the first attempt to create man the \"crown,\" and the aim and goal of all animal life on Earth -- are shown to be failures in our Stanzas.\n\nDo we not find the same in the Berosian Cosmogony, denounced with such vehemence as the culmination of heathen absurdity?\n\nAnd yet who of the Evolutionists can say that things in the beginning have not come to pass as they are described?\n\nThat, as maintained in the Puranas, the Egyptian and Chaldean fragments, and even in Genesis, there have not been two, and even more, \"creations\" before the last formation of the Globe; which, changing its geological and atmospheric conditions, changed also its flora, its fauna, and its men?\n\nThis claim agrees not only with every ancient Cosmogony, but also with modern science, and even, to a certain degree, with the theory of evolution, as may be demonstrated in a few words.\n\nThere is no \"dark creation,\" no \"Evil Dragon\" conquered by a Sun-God, in the earliest World-Cosmogonies.\n\nEven with the Akkads, the great Deep (the Watery Abyss, or S PACE) was the birthplace and abode of Ea, Wisdom, the incognizable infinite Deity.\n\nBut with the Semites and the later Chaldeans, the fathomless Deep of Wisdom becomes gross matter, sinful Substance, and Ea is changed into Tiamat, the dragon slain by Merodach, or Satan, in the astral waves.\n\nIn the Hindu Puranas, Brahma, the creator, is seen recommencing de novo several creations after as many failures; and two great creations are mentioned,* the Padma and the Varaha, the present, when the Earth was lifted out of the water by Brahma, in the shape of a boar, or \"Varaha Avatar.\" Creation is shown as a sport, an amusement (Lila) of the creative god.\n\nThe Zohar speaks of primordial worlds, which perished as soon as they came into existence.\n\nAnd the same is said in Midraish, Rabbi Abahu explaining distinctly (in Bereschith Rabba, Parscha IX .) that \"the Holy One\" had successively created and de- [[Footnote(s)]] ------------------------------------------------- * These two must not be confused with the seven creations or divisions in each Kalpa (See Book I.\n\n\" The Seven Creations \") .\n\nThe primary and secondary creations are here meant.\n\n[[Vol.\n\n2, Page]] 54 THE SECRET DOCTRINE.\n\nstroyed sundry worlds, before he succeeded in the present one.\n\nThis does not relate only to other worlds in space, but to a mystery of our own globe contained in the allegory about the \"kings of Edom.\" For the words, \"This one pleases me,\" are repeated in Genesis i.\n\n31, though in disfigured terms, as usual.\n\nThe Chaldean fragments of Cosmogony on the Cuneiform inscriptions, and elsewhere, show two distinct creations of animals and men, the first being destroyed, as it was a failure.\n\nThe Cosmogonical tablets prove that this our actual creation was preceded by others (See \"Hibbert Lectures,\" p.\n\n390); and as shown by the author of \"The Qabbalah,\" in the Zohar, Siphrah Dzeniouta, in Jovah Rabbah, 128 a , etc., etc.\n\nThe Kabala states the same.\n\n( b ) Oannes (or Dagon, the Chaldean \"Man-fish\") divides his Cosmogony and Genesis into two portions.\n\nFirst the abyss of waters and darkness, wherein resided most hideous beings -- -men with wings, four and two-faced men, human beings with two heads, with the legs and horns of a goat (our \"goat-men,\")* hippocentaurs, bulls with the heads of men, and dogs with tails of fishes."


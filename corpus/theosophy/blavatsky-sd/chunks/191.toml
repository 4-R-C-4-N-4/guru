[content]
body = "Maia, in its forced derivation, has come to mean with the Greeks, \"mother,\" from the root ma (nurse), and even gave its name to the month of May, which was sacred to all those goddesses before it became consecrated to Mary.* Its primitive meaning, however, was Maya , Durga , translated by the Orientalists as \"inaccessible,\" but meaning in truth the \" unreachable ,\" in the sense of illusion and unreality; as being the source and cause of spells, the personification of I LLUSION.\n\nIn religious rites the moon served a dual purpose.\n\nPersonified as a female goddess for exoteric purposes, or as a male god in allegory and symbol, in occult philosophy our satellite was regarded as a sexless Potency to be well studied, because it was to be dreaded.\n\nWith the initiated Aryans, Khaldii, Greeks and Romans, Soma, Sin, Artemis Soteira (the hermaphrodite Apollo, whose attribute is the lyre, and the bearded Diana of the bow and arrow), Deus Lunus , and especially Osiris-lunus and Thot-lunus,** were the occult potencies of the moon.\n\nBut whether male or female, whether Thot or Minerva, Soma or Astoreth, the Moon is the Occult mystery of mysteries, and more a symbol of evil than of good.\n\nHer seven phases (original, esoteric division) are divided into three astronomical phenomena and four [[Footnote(s)]] ------------------------------------------------- * The Roman Catholics are indebted for the idea of consecrating the month of May to the Virgin, to the pagan Plutarch, who shows that \"May is sacred to Maia ([[ Maia ]]) or Vesta\" ( Aulus-Gellius , word Maia) -- our mother-earth, our nurse and nourisher personified.\n\n** Thot-Lunus is \"Budha-Soma\" of India, or \"Mercury and the Moon.\" [[Vol.\n\n1, Page]] 397 THE MOON, BISEXUAL.\n\npurely psychic phases.\n\nThat the moon was not always reverenced is shown in the Mysteries, in which the death of the moon-god (the three phases of gradual waning and final disappearance) was allegorized by the moon standing for the genius of evil that triumphs for the time over the light and life-giving god (the sun), and all the skill and learning of the ancient Hierophants in Magic was required to turn this triumph into a defeat.\n\nIt was the most ancient worship of all, that of the third Race of our Round, the Hermaphrodites, to whom the male -moon became sacred, when after the \"Fall\" so-called, the sexes had become separated.\n\n\"Deus Lunus\" then became an androgyne, male and female in turn; to serve finally, for purposes of sorcery , as a dual power, to the Fourth Root-race, the Atlanteans.\n\nWith the Fifth (our own) the lunar-solar worship divided the nations into two distinct, antagonistic camps.\n\nIt led to events described aeons later in the Mahabharatan War, which to the Europeans is the fabulous , to the Hindus and Occultists the historical, strife between the Suryavansas and the Indovansas.\n\nOriginating in the dual aspect of the moon, the worship of the female and the male principles respectively, it ended in distinct solar and lunar cults.\n\nAmong the Semitic races, the sun was for a very long time feminine and the moon masculine -- the latter notion being adopted by them from the Atlantean traditions.\n\nThe moon was called \"the Lord of the sun,\" Bel-Skemesh , * before the Shemesh worship.\n\nThe ignorance of the incipient reasons for such a distinction, and of occult principles, led the nations into anthropomorphic idol-worship.\n\nBut the religion of every ancient nation had been primarily based upon the Occult manifestations of a purely abstract Force or Principle now called \"God.\" The very establishment of such worship shows, in its details and rites, that the philosophers who evolved those systems of nature, subjective and objective, possessed profound knowledge, and were acquainted with many facts [[Footnote(s)]] ------------------------------------------------- * During that period which is absent from the Mosaic books -- from the exile of Eden to the allegorical Flood -- the Jews worshipped with the rest of the Semites Dayanisi \"the Ruler of Men,\" the \"Judge,\" or the S UN.\n\nThough the Jewish canon and Christianism have made the sun become the \"Lord God\" and Jehovah in the Bible, yet the latter is full of indiscreet traces of the androgyne Deity, which was Jehovah the sun , and Astoreth the moon in its female aspect, and quite free from the present metaphorical element given to it.\n\nGod is a \"consuming fire,\" appears in , and is encompassed by fire.\" It was not only in vision that Ezekiel (viii., 16) saw the Jews \"worshipping the sun.\" The Baal of the Israelites (the Shemesh of the Moabites and the Moloch of the Ammonites) was the identical \"Sun-Jehovah,\" and he is till now \"the King of the Host of Heaven,\" the Sun, as much as Astoreth was the \"Queen of Heaven\" -- or the moon.\n\nThe \"Sun of Righteousness\" has become a metaphorical expression only now.\n\n[[Vol.\n\n1, Page]] 398 THE SECRET DOCTRINE.\n\nof a scientific nature.\n\nFor besides being purely Occult, the rites of lunar worship were based, as just shown, upon a knowledge of physiology (quite a modern science with us), psychology, sacred mathematics, geometry and metrology, in their right applications to symbols and figures, which are but glyphs, recording observed natural and scientific facts; in short, upon a most minute and profound knowledge of nature.\n\nLunar magnetism generates life, preserves and kills it.\n\nSoma embodies the triple power of the Trimurti , though it passes unrecognized by the profane to this day.\n\nThe allegory that makes Soma, the moon, produced by the churning of the Ocean of Life ( Space ) by the gods in another Manvantara ( i.e.\n\n, in the pre genetic day of our planetary system), and that other allegory, which shows \"the Rishis milking the earth, whose calf was Soma, the moon,\" has a deep cosmographical meaning; for it is neither our earth which is milked, nor was the moon, which we know, the calf.* Had our wise men of science known as much of the mysteries of nature as the ancient Aryans did, they would surely never have imagined that the moon was projected from the Earth.\n\nOnce more, the oldest of permutations in theogony, the Son becoming his own father and the mother generated by the Son, has to be remembered and taken into consideration if the symbolical language of the ancients is to be understood by us.\n\nOtherwise mythology will be ever haunting the Orientalists as simply \"the disease which springs up at a peculiar stage of human culture!\" -- as Renouf gravely observes in a Hibbert lecture."


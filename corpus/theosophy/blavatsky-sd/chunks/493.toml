[content]
body = "Yet, it is a mistake to call these \"sacred islands\" Atlantean -- as done by us; for, like everything else in the Hindu Sacred Books, they are made to refer to several things.\n\nThe heirloom left by Priyavrata, the Son of Swayambhuva Manu, to his seven sons -- was not Atlantis, even though one or two of these islands survived the subsidence of their fellows, and offered shelter, ages later, to Atlanteans, whose continent had been submerged in its turn.\n\nWhen originally mentioned by Parasara ( Vishnu Purana ) the seven refer to an esoteric doctrine which is explained further on.\n\nOf all the seven islands, Jambu-dwipa is the only one that is terrestrial, for it is our globe.\n\nIn the Puranas every reference to the North of Meru is connected with that primeval Eldorado, now the North Polar region; which, when the magnolia blossomed there where now we see an unexplored endless desert of ice, was then a continent again.\n\nScience speaks of an ancient continent which stretched from Spitzbergen down to the Straits of Dover.\n\nThe Secret Doctrine teaches that, in the earliest geological periods, these regions formed a horse-shoe-like continent, whose one end, the Eastern, far more northward than North Cornwall, included Greenland, and the other contained Behring Straits as an inland piece of ground, and descended southward in its natural trend down to the British Isles, which in those days must have been right under the lower curve of the semi-circle.\n\nThis continent was raised simultaneously with the submersion of the equatorial portions of Lemuria.\n\nAges later, some of the Lemurian remains re-appeared again on the face of the Oceans.\n\nTherefore, though it can be said without departing from truth that Atlantis is included in the Seven great insular continents, since the Fourth Race Atlanteans got some of the Lemurian relics, and, settling on the islands, included them among their lands and continents, yet a difference should be made and an explanation given, once that a fuller and more accurate account is attempted, as in the present work.\n\nEaster Island was also taken possession of in this manner by some Atlanteans; who, having escaped from the cataclysm which befell their own land, settled on that remnant of Lemuria only to perish thereon, when destroyed in one day by its volcanic fires and lava.\n\nThis may be regarded as fiction by certain geographers and geologists; to the Occul- [[Vol.\n\n2, Page]] 327 ON FOOT ACROSS THE OCEANS.\n\ntists it is history.\n\nWhat does Science know to the contrary?\n\n\"Until the appearance of a map, published at Basle in 1522, wherein the name of America appears for the first time, the latter was believed to be part of India .\n\n.\n\n.\n\n.\n\n.\n\nScience also refuses to sanction the wild hypothesis that there was a time when the Indian peninsula at one end of the line, and South America at the other, were connected by a belt of islands and continents.\n\nThe India of the pre-historic ages .\n\n.\n\n.\n\n.\n\nwas doubly connected with the two Americas.\n\nThe lands of the ancestors of those whom Ammianus Marcellinus calls the 'Brahmans of Upper India' stretched from Kashmir far into the (now) deserts of Schamo.\n\nA pedestrian from the north might then have reached -- hardly wetting his feet -- the Alaskan peninsula, through Manchooria, across the future Gulf of Tartary, the Kurile and Aleutian islands; while another traveller, furnished with a canoe, and starting from the South, could have walked over from Siam, crossed the Polynesian Islands and trudged into any part of the continent of South America.\" ( But see \" Five years of Theosophy, \" art.\n\n\" Leaflets from Esoteric History, \" pp.\n\n338 and 340.) This was written from the words of a M ASTER -- a rather doubtful authority for the materialists and the sceptics.\n\nBut here we have one of their own flock, and a bird of the same feather -- Ernest Haeckel, who, in his distribution of races, corroborates the statement almost verbatim: .\n\n.\n\n.\n\n.\n\n\"It would seem that the region on the earth's surface where the evolution of these primitive men from the CLOSELY RELATED CATARRHINE APES (!\n\n!) took place, must be sought either in Southern Asia or Eastern Africa [which, by the bye, was not even in existence when the Third Race flourished -- H.P.B.] or in Lemuria.\n\nLemuria is an ancient continent now sunk beneath the waters of the Indian Ocean, which, lying to the South of the Asia of to-day, stretched on the one hand eastwards to upper India and Sunda Island, on the other westward as far as Madagascar and Africa.\" ( See supra and compare \" The Pedigree of Man, \" p.\n\n80-81.) In the epoch we are treating of, the Continent of \"Lemuria,\" had already broken asunder in many places, and formed new separate continents.\n\nThere was, nevertheless, neither Africa nor the Americas, still less Europe in those days, all these slumbering yet on the Ocean floors.\n\nNor was there much of present Asia; for the cis-Himalayan regions were covered with seas, and beyond this stretched the \"lotus leaves\" of Sveta-dwipa, the countries now called Greenland, Eastern and Western Siberia, etc., etc.\n\nThe immense Continent, which had once reigned supreme over the Indian, Atlantic, and Pacific Oceans, now consisted of huge islands which were gradually disappearing one after the other, until the final convulsion engulfed the last remains of it.\n\nEaster Isle, for instance, belongs to the earliest civilisation of the Third [[Vol.\n\n2, Page]] 328 THE SECRET DOCTRINE.\n\nRace.\n\nSubmerged with the rest, a volcanic and sudden uplifting of the Ocean floor, raised the small relic of the Archaic ages untouched, with its volcano and statues, during the Champlain epoch of northern polar submersion, as a standing witness to the existence of Lemuria.\n\nIt is said that some of the Australian tribes are the last remnants of the last descendants of the Third Race.\n\nIn this we are again corroborated to a degree by materialistic Science.\n\nHaeckel, when speaking of Blumenbach's brown or Malay race and the Australians and Papuans, remarks: -- \"There is much likeness between these last and the Aborigines of Polynesia, that Australian island-world, that seems to have been once on a time a gigantic and continuous continent.\n\n\" (\" Pedigree of Man, \" p.\n\n82.\n\nBut see footnote supra and the Addenda.\n\n) It certainly was, since it stretched, during the Third Race, east and west, as far as where the two Americas now lie, and since the present Australia is but a portion of it, as are also a few surviving islands sown hither and thither on the face of the Pacific and a large bit of California, which belonged to it."


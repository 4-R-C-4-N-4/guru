[content]
body = "There were produced out of the Ideos, the elements of Fire, Water, Air and Earth, whose birth, however, did not take place in a material mode, or by simple separation,\" but by spiritual and dynamical, not even complex, combinations -- e.g., mechanical mixture as opposed to chemical combination -- just as fire may come out of a pebble, or a tree out of a seed, although there is originally no fire in the pebble, nor a tree in the seed.\n\nSpirit is living, and Life is Spirit, and Life and Spirit ( Prakriti Purusha ) (?) produce all things, but they are essentially one and not two.\n\n.\n\n.\n\n.\n\nThe elements too, have each one its own Yliaster, because all the activity of matter in every form is only an effluvium of the same fount.\n\nBut as from the seed grow the roots with their fibres, and after that the stalk with its branches and leaves, and lastly the flowers and seeds; likewise all beings were born from the elements, and consist of elementary substances out of which other forms may come into existence, bearing the characteristics of their parents.\" (\"This doctrine, preached 300 years ago,\" remarks the translator, \"is identical with the one that has revolutionized modern thought, after having been put into new shape and elaborated by Darwin.\n\nIt was still more elaborated by Kapila in the Sankhya philosophy\") .\n\n.\n\n.\n\n.\n\nThe elements as the mothers of all creatures are of an invisible, spiritual nature, and have souls.* They all spring from the \" Mysterium Magnum.\n\n\" ( Philosophia ad Athenienses.\n\n) Compare this with Vishnu Purana.\n\n\"From Pradhana (primordial substance) presided over by Kshetrajna (embodied Spirit?) proceeds the evolution of those qualities.......\n\nFrom the great Principle Mahat (Universal Intellect, or mind).....\n\nproceeds [[Footnote(s) -------------------------------------------------]] * The Eastern Occultist says -- \"are guided and informed by the Spiritual Beings\" the Workmen in the invisible worlds and behind the veil of Occult nature, or nature in Abscondito.\n\n[[Vol.\n\n1, Page]] 285 HERMES CHRISTIANIZED.\n\nthe origin of the subtle elements and from these the organs of sense ( Book I., ii.\n\n) .\n\nThus it may be shown that all the fundamental truths of nature were universal in antiquity, and that the basic ideas upon spirit, matter, and the universe, or upon God, Substance, and man, were identical.\n\nTaking the two most ancient religious philosophies on the globe, Hinduism and Hermetism, from the scriptures of India and Egypt, the identity of the two is easily recognisable.\n\nThis becomes apparent to one who reads the latest translation and rendering of the \"Hermetic Fragments\" just mentioned, by our late lamented friend, Dr.\n\nAnna Kingsford.\n\nDisfigured and tortured as these have been in their passage through Sectarian Greek and Christian hands, the translator has most ably and intuitionally seized the weak points and tried to remedy them by means of explanations and foot-notes.\n\nAnd she says:..........\n\nThe creation of the visible world by the 'working gods' or Titans, as agents of the Supreme God,* is a thoroughly Hermetic idea, recognisable in all religious systems, and in accordance with modern scientific research (?), which shows us everywhere the Divine power operating through natural Forces.\" \"That Universal Being, that contains all, and which is all, put into motion the Soul and the World, all that nature comprises, says Hermes.\n\nIn the manifold unity of universal life, the innumerable individualities distinguished by their variations, are, nevertheless, united in such a manner that the whole is one, and that everything proceeds from Unity.\" ( Asclepios, Part I.\n\n) \"God is not a mind, but the cause that the mind is; not a spirit, but the cause that the Spirit is; not light, but the cause that the Light is.\" ( Divine Pymander, Book IX., v.\n\n64.) The above shows plainly that \"Divine Pymander,\" however much distorted in some passages by Christian \"smoothing,\" was nevertheless written by a philosopher, while most of the so-called \"hermetic Fragments\" are the production of sectarian pagans with a tendency towards an anthropomorphic Supreme Being.\n\nYet both are the echo of the Esoteric philosophy and the Hindu Puranas.\n\nCompare two invocations, one to the Hermetic \"Supreme All,\" the [[Footnote(s) -------------------------------------------------]] * A frequent expression in the said Fragments, to which we take exception.\n\nThe Universal Mind is not a Being or \"God.\" [[Vol.\n\n1, Page]] 286 THE SECRET DOCTRINE.\n\nother to the \"Supreme All\" of the later Aryans.\n\nSays a Hermetic Fragment cited by Suidas (see Mrs.\n\nKingsford's \" The Virgin of the World \") : - \"I adjure thee, Heaven, holy work of the great God; I adjure thee, Voice of the Father, uttered in the beginning when the universal world was framed; I adjure thee by the word, only Son of the Father who upholds all things; be favourable, be favourable.\" This just preceded by the following: \"Thus the Ideal Light was before the Ideal Light, and the luminous Intelligence of Intelligence was always, and its unity was nothing else than the Spirit enveloping the Universe.\n\nOut of whom is neither God nor Angels, nor any other essentials, for He (It?) is the Lord of all things and the power and the Light; and all depends on Him (It) and is in Him (It), etc.\" ( Fragments of the writings of Hermes to Ammon.\n\n) This is contradicted by the very same Trismegistos, who is made to say: \"To speak of God is impossible.\n\nFor corporeal cannot express the incorporeal.\n\n.\n\n.\n\n.\n\n.\n\nThat which has not any body nor appearance, nor form, nor matter, cannot be apprehended by sense.\n\nI understand, Tatios, I understand, that which it is impossible to define -- that is God.\" ( Physical Eclogues, Florilegium of Stobaeus.\n\n) The contradiction between the two passages is evident; and this shows ( a ) that Hermes was a generic nom-de-plume used by a series of generations of mystics of every shade, and ( b ) that a great discernment has to be used before accepting a Fragment as esoteric teaching only because it is undeniably ancient.\n\nLet us now compare the above with a like invocation in the Hindu Scriptures -- undoubtedly as old, if not far older.\n\nHere it is Parasara, the Aryan \"Hermes\" who instructs Maitreya, the Indian Asclepios, and calls upon Vishnu in his triple hypostasis."


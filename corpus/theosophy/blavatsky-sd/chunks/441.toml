body = "had been hitherto allowed, is now spoken of in these terms: -- \"His city was Eridu, which stood 6,000 years ago on the shores of the Persian Gulf.\n\nThe name means 'the good city,' a particularly holy spot, since it was the centre from which the earliest Chaldean civilization made its way to the north.\n\nAs the culture-god was represented as coming from the sea, it was possible that the culture of which Eridu was the seat was of foreign importation.\n\nWe now know that there was intercourse at a very early period between Chaldea and the Sinaitic peninsula, as well as with India.\n\nThe statues discovered by the French at Tel-loh (dating from at latest B.C .\n\n4,000) were made of the extremely hard stone known as diorite, and the inscriptions on them stated the diorite to have been brought from Mazan -- i.e ., the Sinaitic peninsula, which was then ruled by the Pharaohs.\n\nThe statues are known to resemble in general style the diorite statue, Kephren, the builder of the second Pyramid, while, according to Mr.\n\nPetrie, the unit of measurement marked on the plan of the city, which one of the Tel-loh figures holds on his lap, is the same as that employed by the Pyramid builders.\n\nTeak wood has been found at Mugheir, or Ur of the Chaldees, although that wood is an Indian special product; add to this that an ancient Babylonian list of clothing mentions sindhu, or 'muslins,' explained as 'vegetable cloth.\n\n' \" Muslin, best known now as Dacca muslin, known in Chaldea as Hindu (Sindhu), and teak wood used 4,000 years B.C .; and yet the Hindus, to whom Chaldea owes its civilization (as well proven by Colonel vans Kennedy), were ignorant of the art of writing before the Greeks taught them their alphabet -- if we have to believe Orientalists!\n\n-------"


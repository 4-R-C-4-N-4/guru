[content]
body = "It is well known that \"the tongue of the AEgyptian Sea,\" or the Delta of lower Egypt, became firm land very gradually, and followed the highlands of Abyssinia; unlike the latter, which arose suddenly, comparatively speaking, it was very slowly formed, through long ages, from successive layers of sea slime and mud, deposited annually by the soil brought down by a large river, the present Nile.\n\nYet even the Delta as a firm and fertile land, has been inhabited for more than 100,000 years.\n\nLater tribes, with still more Aryan blood in them than their predecessors, arrived from the East, and conquered it from a people whose very name is lost to posterity, except in Secret works.\n\nIt is this natural barrier of slime, which sucked in slowly and surely every boat that approached these inhospitable shores, that was, till within a few thousand of years B.C ., the best safeguard of the later Egyptians, who had managed to reach it through Arabia, Abyssinia, and Nubia, led on by Manu Vina in the day of Visvamitra.\n\n( See in \" Isis Unveiled, \" vol.\n\n1, p.\n\n627, what Kulluka Bhatta says.) So evident does the antiquity of man become with every day that even the Church is preparing an honourable surrender and retreat.\n\nThe learned Abbe Fabre, professor at the Sorbonne, has categorically declared [[Footnote(s)]] ------------------------------------------------- * The ingenious author of \"Atlantis, the Ante-diluvian World,\" in discussing the origin of various Grecian and Roman institutions, expresses his conviction that \"the roots of the institutions of to-day reach back to the Miocene Age.\n\n\" Ay, and further yet, as already stated.\n\n** As we know them, however.\n\nFor not only does Geology prove that the British islands have been four times submerged and re-elevated, but that the straits between them and Europe were dry land at a remote former epoch.\n\n[[Vol.\n\n2, Page]] 747 THE SEVEN SABBATHS.\n\nthat pre-historic palaeontology and archaeology may, without any harm to the Scriptures, discover in the tertiary beds .\n\n.\n\n.\n\n.\n\n.\n\nthe traces of pre-adamite man as much as they like.\n\n\"Since it disregards all creations anterior to the last deluge but one, (that which produced the diluvium, according to the Abbe), Bible revelation leaves us free to admit the existence of man in the grey diluvium, in Pliocene, and even Eocene strata.\n\nOn the other hand, however, geologists are not all agreed in regarding the men who inhabited the globe in these primitive ages as our ancestors .* The day when the Church will find that its only salvation lies in the occult interpretation of the Bible, may not be so far off as some imagine.\n\nAlready many an abbe and ecclesiastic has become an ardent Kabalist, and as many appear publicly in the arena, breaking a lance with Theosophists and Occultists in support of the metaphysical interpretation of the Bible.\n\nBut they commence, unfortunately for them, from the wrong end.\n\nThey are advised, before they begin to speculate upon the metaphysical in their Scriptures, to study and master that which relates to the purely physical -- e.g., its geological and ethnological hints.\n\nFor such allusions to the Septenary constitution of the Earth and Man, to the seven Rounds and Races, abound in the New as in the Old Testaments, and are as visible as the sun in the heavens to him who reads both symbolically.\n\nWhat do the laws in chapter xxiii., v.\n\n15, of Leviticus apply to?\n\nWhat is the philosophy of reason for all such hebdomadic offerings and symbolical calculations as: \"ye shall count .\n\n.\n\n.\n\n.\n\nfrom the morrow after the Sabbath .\n\n.\n\n.\n\n.\n\nthat ye brought the sheaf of the wave offering; seven Sabbaths shall be completed \" (15), \"And ye shall offer with the bread seven lambs without blemish\" (18), etc.\n\netc.\n\nWe shall be contradicted, no doubt, when we say that all these \"wave\" and \"peace\" offerings were in commemoration of the Seven \"Sabbaths\" of the mysteries, which Sabbaths are seven pralayas, between seven manvantaras, or what we call Rounds -- for \"Sabbath\" is an elastic word, meaning a period of Rest of whatever nature, as explained elsewhere (Part II , \" Sections on the Septenary.\n\n\") And if this is not sufficiently conclusive, then we may turn to the verse which follows (16), and which adds, \"even unto the morrow after the seventh Sabbath shall ye number fifty days\" (forty-nine, 7 x 7, stages of activity, and forty-nine stages of rest, on the seven globes of the chain, and then [[Footnote(s)]] ------------------------------------------------- * \" Les origines de la terre et de l ' homme, \" p.\n\n454.\n\nTo this, Professor N.\n\nJoly, of Toulouse, who quotes the Abbe in his \" Man before Metals, \" expresses the hope that M.\n\nFabre will permit him \"to differ from him on this last point,\" p.\n\n186.\n\nSo do the Occultists; for though they claim a vast difference in the physiology and outward appearance of the five races so far evolved, still they maintain that the present human species has descended from one and the same primitive stock, evolved from the \"divine men\" -- our common ancestors and progenitors.\n\n[[Vol.\n\n2, Page]] 748 THE SECRET DOCTRINE.\n\ncomes the rest of Sabbath, the fiftieth ); after which \"ye shall offer a new meat offering unto the Lord,\" i.e.\n\n, ye shall make an offering of your flesh or \"coats of skin,\" and, divesting yourselves of your bodies, ye shall remain pure spirits.\n\nThis law of offering, degraded and materialized with ages, was an institution that dated from the earliest Atlanteans; it came to the Hebrews via the \"Chaldees,\" who were the \"wise men\" of a caste, not of a nation, a community of great adepts come from their \"Serpent-holes,\" and who had settled in Babylonia ages before.\n\nAnd if this interpretation from Leviticus (full of the disfigured laws of Manu) is found too far-fetched, then turn to Revelation.\n\nWhatever interpretation profane mystics may give to the famous Chapter xvii., with its riddle of the woman in purple and scarlet; whether Protestants nod at the Roman Catholics, when reading \" M YSTERY, B ABYLON THE G REAT, THE M OTHER OF H ARLOTS AND A BOMINATIONS OF THE E ARTH,\" or Roman Catholics glare at the Protestants, the Occultists pronounce, in their impartiality, that these words have applied from the first to all and every exoteric Churchianity, that which was the \"ceremonial magic\" of old, with its terrible effects, and is now the harmless (because distorted) farce of ritualistic worship."


body = "The three nails with the three wounds are in number 6, which denotes the 6 faces of the cube unfolded (which make the cross or man-form, or 7, counting three horizontal and four vertical bars) on which the man is placed; and this in turn points to the circular measure transferred on to the edges of the cube.\n\nThe one wound of the feet separates into two when the feet are separated, making three together for all, and four when separated, or 7 in all -- another most holy (and with the Jews ) feminine base number.\" Thus, while the phallic or sexual meaning of the \"Crucifixion Nails\" is proven by the geometrical and numerical reading, its mystical meaning is indicated by the short remarks upon it, as given above, in its connection with, and bearing upon, Prometheus.\n\nHe is another victim, for he is crucified on the Cross of Love, on the rock of human passions, a sacrifice to his devotion to the cause of the spiritual element in Humanity.\n\nNow, the primordial system, the double glyph that underlies the idea of the Cross, is not \"of human invention,\" for Cosmic ideation and the Spiritual representation of the divine Ego-man are at its basis.\n\nLater, it expanded in the beautiful idea adopted by and represented in the Mysteries, that of regenerated man, the mortal, who, by crucifying the man of flesh and his passions on the [[Vol.\n\n2, Page]] 562 THE SECRET DOCTRINE.\n\nProcrustean bed of torture, became reborn as an Immortal.\n\nLeaving the body, the animal-man, behind him, tied on the Cross of Initiation like an empty chrysalis, the Ego Soul became as free as a butterfly.\n\nStill later, owing to the gradual loss of spirituality, the cross became in Cosmogony and Anthropology no higher than a phallic symbol.\n\nWith the Esotericists, from the remotest times the Universal Soul or anima mundi, the material reflection of the Immaterial Ideal, was the Source of Life of all beings and of the life principle of the three kingdoms; and it was Septenary with the Hermetic philosophers, as with all ancients.\n\nFor it is represented as a Sevenfold cross, whose branches are respectively, light, heat, electricity, terrestrial magnetism, astral radiation, motion, and Intelligence, or what some call self-consciousness.\n\nWe have said it elsewhere.\n\nLong before the cross or its sign were adopted as symbols of Christianity, the sign of the cross was used as a sign of recognition among adepts and neophytes, the latter being called Chrests (from Chrestos, man of tribulation and sorrow).\n\nSays E.\n\nLevi: \"The sign of the cross adopted by the Christians does not belong exclusively to them.\n\nIt is Kabalistic, and represents the opposition and quaternary equilibrium of the elements.\n\nWe see by the Occult verse of the Paternoster that there were originally two ways of making it, or, at least two very different formulas to express its meaning -- one reserved for priests-initiates, the other given to neophites and the profane.\n\nThus, for example, the initiate, carrying his hand to his forehead, said: To thee; then he added, belong: and continued, while carrying his hand to the breast -- the kingdom; then, to the left shoulder -- justice: to the right shoulder -- and mercy.\n\nThen he joined the two hands, adding: throughout the generating cycles: 'Tibi sunt Malchut et Geburah et Chassed per Aeonas' -- a sign of the Cross, absolutely and magnificently kabalistic, which the profanations of Gnosticism made the militant and official Church completely lose.\" ( Dogma et Ritual, etc., Vol.\n\nII., p.\n\n88.) The \"militant and official Church\" did more: having helped herself to what had never belonged to her, she took only that which the \"profane\" had, the Kabalistic meaning of the male and female Sephiroth.\n\nShe never lost the inner and higher meaning since she never had it -- E.\n\nLevi's pandering to Rome, notwithstanding.\n\nThe sign of the cross adopted by the Latin Church was phallic from the beginning, while that of the Greeks was the cross of the neophytes, the C HREST.\n\n------"


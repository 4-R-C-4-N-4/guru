[content]
body = "Noah is either a myth along with the others, or one whose legend was built upon the Kabirian or Titanic tradition, as taught in Samothrace; he has, therefore, no claim to be monopolized by either Jew or Christian.\n\nIf, as Faber tried to demonstrate at such cost of learning and research, Noah is an Atlantean and a Titan, and his family are the Kabiri or pious Titans, etc.\n\n-- then biblical chronology falls by its own weight, and along with it all the patriarchs -- the antediluvian and pre-Atlantean Titans.\n\nAs now discovered and proven, Cain is Mars, the god of power and generation, and of the first (sexual) bloodshed.** Tubal-Cain is a Kabir, \"an instructor of every artificer in brass and iron\"; or -- if this will please better -- he is one with Hephaestos or Vulcan; Jabal is taken from the Kabiri -- instructors in agriculture, \"such as have cattle,\" and Jubal is \"the father of all those who handle the harp,\" he, or they who fabricated the harp for Kronos and the trident for Poseidon.*** [[Footnote(s)]] ------------------------------------------------- * Vide for further details upon the Satanic myth, Part II.\n\non Symbolism, in this volume.\n\n** As he is also Vulcan or Vul-cain, the greatest god with the later Egyptians, and the greatest Kabir.\n\nThe god of time was Chium in Egypt, or Saturn, or Seth, and Chium is the same as Cain.\n\n*** See Strabo, comparing them to the Cyclopes -- XIV .\n\np.\n\n653 et seq.\n\n( Callim in Del., 31 Stat.\n\nSilo.\n\nIV ., 6, 47; etc., etc .) [[Vol.\n\n2, Page]] 391 THE FLOOD LEGENDS.\n\nThe history or \"fables\" about the mysterious Telchines -- fables echoing each and all the archaic events of our esoteric teachings -- furnish us with a key to the origin of Cain ' s genealogy ( Genesis, ch.\n\niii.); they give the reason why the Roman Catholic Church identifies \"the accursed blood\" of Cain and Ham with Sorcery, and makes it responsible for the Deluge.\n\nWere not the Telchines -- it is argued -- the mysterious ironworkers of Rhodes; they who were the first to raise statues to the gods, furnish them with weapons, and men with magic arts?\n\nAnd is it not they who were destroyed by a deluge at the command of Zeus, as the Cainites were by that of Jehovah?\n\nThe Telchines are simply the Kabiri and the Titans, in another form.\n\nThey are the Atlanteans also.\n\n\"Like Lemnos and Samothrace,\" says Decharme, \"Rhodes, the birth-place of the Telchines, is an island of volcanic formation.\" ( Genii of Fire, p.\n\n271.) The island of Rhodes emerged suddenly out of the seas, after having been previously engulfed by the Ocean, say the traditions.\n\nLike Samothrace (of the Kabiri) it is connected in the memory of men with the Flood legends.\n\nAs enough has been said on this subject, however, it may be left for the present.\n\nBut we may add a few more words about Noah, the Jewish representative of nearly every pagan God in one or another character.\n\nThe Homeric songs contain, poetized, all the later fables about the Patriarchs, who are all sidereal, cosmic, and numerical symbols and signs.\n\nThe attempt to disconnect the two genealogies -- those of Seth and Cain* -- and the further attempt, as futile, to show them real, historical men, has only led to more serious inquiries into the history of the Past, and to discoveries which have damaged for ever the supposed revelation.\n\nFor instance, the identity of Noah and Melchizedek being established, the further identity of Melchizedek, or Father Sadik, with Kronos-Saturn is proved also.\n\nThat it is so may be easily demonstrated.\n\nIt is not denied by any of the Christian writers.\n\nBryant ( See \" Analysis of Ancient Mythology, \" Vol.\n\nII., p.\n\n760) concurs with all those who are of opinion, that Sydic, or [[Footnote(s)]] ------------------------------------------------- * Nothing could be more awkward and childish, we say, than this fruitless attempt to disconnect the genealogies of Cain and of Seth, or to conceal the identity of names under a different spelling.\n\nThus, Cain has a Son E NOCH, and Seth a Son E NOCH also (Enos, Ch'anoch, Hanoch; -- one may do what one likes with Hebrew unvowelled names).\n\nIn the Cainite line Enoch begets I RAD, Irad M EHUJAEL, the latter M ETHUSAEL, and Methusael, Lamech.\n\nIn the Sethite line, Enoch begets Cainan, and this one M AHALEEL (a variation on Mehujael), who gives birth to J ARAD (or Irad); Jarad to E NOCH (Number 3), who produces Methuselah (from Methusael), and finally Lamech closes the list.\n\nNow all these are symbols (Kabalistically) of solar and lunar years, of astronomical periods, and of physiological (phallic) functions, just as in any other pagan symbolical creed.\n\nThis has been proven by a number of writers.\n\n[[Vol.\n\n2, Page]] 392 THE SECRET DOCTRINE.\n\nSadic, was the patriarch Noah (as also Melchizedek); and that the name by which he is called, or Sadic, corresponds to the character given of him in Genesis, chap.\n\nvi., 9.\n\n\"He was , Sadic, a JUST man, and perfect in his generation.\n\nAll science and every useful art were attributed to him, and through his sons transmitted to posterity.\" ( See New Encyclopaedia by Abraham Rees, F.R.S .\n\n) Now it is Sanchoniathon, who informs the world that the Kabiri were the Sons of Sydic or Zedek (Melchizedek).\n\nTrue enough, this information, having descended to us through Eusebius ( Preparatio Evangelica ), may be regarded with a certain amount of suspicion, as it is more than likely that he dealt with Sanchoniathon's works as he has with Manetho's Synchronistic Tables.\n\nBut let us suppose that the identification of Sydic, Kronos, or Saturn with Noah and Melchizedek, is based on one of the Eusebian pious hypotheses.\n\nLet us accept it as such, along with Noah's characteristic as a just man, and his supposed duplicate, the mysterious Melchizedek, King of Salem, and priest of the high god, after \"his own order\" ( See Hebrews, ch.\n\nv .\n\n6, and vii.\n\n1, et seq.\n\n); and finally, having seen what they all were spiritually, astronomically, psychically and cosmically, let us now see what they became rabbinically and K ABALISTICALLY."


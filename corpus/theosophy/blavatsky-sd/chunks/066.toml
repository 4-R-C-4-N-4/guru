body = "Here again, the untranslateable term S AT ( Be-ness ) is likely to lead into an erroneous conception, since that which is manifested cannot be S AT, but is something phenomenal, not everlasting, nor, in truth, even sempiternal.\n\nIt is coeval and [[Vol.\n\n1, Page]] 120 THE SECRET DOCTRINE.\n\ncoexistent with the One Life, \"Secondless,\" but as a manifestation it is still a Maya -- like the rest.\n\nThis \"World of Truth\" can be described only in the words of the Commentary as \"A bright star dropped from the heart of Eternity; the beacon of hope on whose Seven Rays hang the Seven Worlds of Being.\" Truly so; since those are the Seven Lights whose reflections are the human immortal Monads -- the Atma, or the irradiating Spirit of every creature of the human family.\n\nFirst, this septenary Light; then: -- ( c ) The \"Divine World\" -- the countless Lights lit at the primeval Light -- the Buddhis, or formless divine Souls, of the last Arupa (formless) world; the \"Sum Total,\" in the mysterious language of the old Stanza.\n\nIn the Catechism, the Master is made to ask the pupil: -- \" Lift thy head, oh Lanoo; dost thou see one, or countless lights above thee, burning in the dark midnight sky?\n\n\" \" I sense one Flame, oh Gurudeva, I see countless undetached sparks shining in it.\n\n\" \" Thou sayest well.\n\nAnd now look around and into thyself.\n\nThat light which burns inside thee, dost thou feel it different in anywise from the light that shines in thy Brother-men?\n\n\" \" It is in no way different, though the prisoner is held in bondage by Karma, and though its outer garments delude the ignorant into saying, ' Thy Soul and My Soul.\n\n' \" The radical unity of the ultimate essence of each constituent part of compounds in Nature -- from Star to mineral Atom, from the highest Dhyan Chohan to the smallest infusoria, in the fullest acceptation of the term, and whether applied to the spiritual, intellectual, or physical worlds -- this is the one fundamental law in Occult Science.\n\n\"The Deity is boundless and infinite expansion,\" says an Occult axiom; and hence, as remarked, the name of Brahma.* There is a deep philosophy underlying the earliest worship in the world, that of the Sun and of Fire.\n\nOf all the Elements known to physical science, Fire is the one that has ever eluded definite analysis.\n\nIt is confidently asserted that [[Footnote(s)]] ------------------------------------------------- * In the Rig Veda we find the names Brahmanaspati and Brihaspati alternating and equivalent to each other.\n\nAlso see \"Brihad Upanishad\"; Brihaspati is a deity called \"the Father of the gods.\" [[Vol.\n\n1, Page]] 121 THE MYSTERY OF THE FIRE.\n\nAir is a mixture containing the gases Oxygen and Nitrogen.\n\nWe view the Universe and the Earth as matter composed of definite chemical molecules.\n\nWe speak of the primitive ten Earths, endowing each with a Greek or Latin name.\n\nWe say that water is, chemically, a compound of Oxygen and Hydrogen.\n\nBut what is F IRE?\n\nIt is the effect of combustion, we are gravely answered.\n\nIt is heat and light and motion, and a correlation of physical and chemical forces in general.\n\nAnd this scientific definition is philosophically supplemented by the theological one in Webster's Dictionary, which explains fire as \"the instrument of punishment, or the punishment of the impenitent in another state\" -- the \"state,\" by the bye, being supposed to be spiritual; but, alas!\n\nthe presence of fire would seem to be a convincing proof of its material nature.\n\nYet, speaking of the illusion of regarding phenomena as simple, because they are familiar, Professor Bain says ( Logic.\n\nPart II.): \"Very familiar facts seem to stand in no need of explanation themselves and to be the means of explaining whatever can be assimilated to them.\n\nThus, the boiling and evaporation of a liquid is supposed to be a very simple phenomenon requiring no explanation, and a satisfactory explanation of rarer phenomena.\n\nThat water should dry up is, to the uninstructed mind, a thing wholly intelligible; whereas to the man acquainted with physical science the liquid state is anomalous and inexplicable.\n\nThe lighting of a fire by a flame is a GREAT SCIENTIFIC DIFFICULTY, yet few people think so\" (p.\n\n125).\n\nWhat says the esoteric teaching with regard to fire?\n\n\"Fire,\" it says, \"is the most perfect and unadulterated reflection, in Heaven as on Earth, of the O NE F LAME.\n\nIt is Life and Death, the origin and the end of every material thing.\n\nIt is divine ' S UBSTANCE.' \" Thus, not only the F IRE- W ORSHIPPER, the Parsee, but even the wandering savage tribes of America, which proclaim themselves \"born of fire,\" show more science in their creeds and truth in their superstitions, than all the speculations of modern physics and learning.\n\nThe Christian who says: \"God is a living Fire,\" and speaks of the Pentecostal \"Tongues of Fire\" and of the \"burning bush\" of Moses, is as much a fire-worshipper as any other \"heathen.\" The Rosicrucians, among all the mystics and Kabalists, were those who defined Fire in the right and most correct way.\n\nProcure a sixpenny lamp, keep it only supplied with oil, and you will be able to light at its flame the lamps, candles, [[Vol.\n\n1, Page]] 122 THE SECRET DOCTRINE.\n\nand fires of the whole globe without diminishing that flame.\n\nIf the Deity, the radical One, is eternal and an infinite substance (\"the Lord thy God is a consuming fire\") and never consumed, then it does not seem reasonable that the Occult teaching should be held as unphilosophical when it says: \"Thus were the Arupa and Rupa worlds formed: from O NE light seven lights; from each of the seven, seven times seven,\" etc., etc.\n\n------- STANZA V.\n\n-- Continued.\n\n5.\n\nF OHAT TAKES FIVE STRIDES ( having already taken the first three ) ( a ) , AND BUILDS A WINGED WHEEL AT EACH CORNER OF THE SQUARE FOR THE FOUR HOLY ONES .\n\n.\n\n.\n\n.\n\n.\n\nAND THEIR ARMIES ( hosts ) ( b ) .\n\n( a ) The \"strides,\" as already explained (see Commentary on Stanza IV .), refer to both the Cosmic and the Human principles -- the latter of which consist, in the exoteric division, of three (Spirit, Soul, and Body), and, in the esoteric calculation, of seven principles -- three rays of the Essence and four aspects.* Those who have studied Mr.\n\nSinnett's \" Esoteric Buddhism \" can easily grasp the nomenclature."


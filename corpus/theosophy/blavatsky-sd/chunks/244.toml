[content]
body = "Thus neither Laplace's perceptions of a solar atmospheric fluid, which would extend beyond the orbits of the planets, nor Le Couturier's electricity, nor Foucault's heat ( Panorama des Mondes , p.\n\n55), nor this, nor the other, can ever help any of the numerous hypotheses about the origin and permanency of rotation to escape from this squirrel's wheel, any more than the theory of gravity itself.\n\nThis mystery is the Procrustean bed of physical Science.\n\nIf matter is, as now taught, passive, the simplest movement cannot be said to be an essential property of matter -- if the latter is simply an inert mass.\n\nHow, then, can such a complicated movement, compound and multiple, harmonious and equilibrated, lasting in the eternities for millions and millions of years, be attributed simply to its own inherent Force, unless the latter is an intelligence?\n\nA physical will is something new -- a conception that the ancients would have never entertained, indeed!* \"We talk of the weight of the heavenly bodies,\" says an astronomer; \"but since it is recognised that weight decreases in proportion to the distance from the centre, it becomes evident that, at a certain distance, that weight must be forcibly reduced to Zero?\n\nWere there any attraction there would be equilibrium .\n\n.\n\n.\n\n.\n\nAnd since the modern school recognizes neither a beneath nor an above in universal space, it is not clear what should cause the Earth to fall, were there even no gravitation, nor attraction.\" ( Cosmographie.\n\n) Methinks the Count de Maistre was right in solving the question in his own theological way.\n\nHe cuts the Gordian knot by saying: -- \"The [[Footnote(s)]] ------------------------------------------------- * For over a century all distinction between body and force is made away with.\n\n\"Force is but the property of a body in motion,\" say the physicists; and \" life -- the property of our animal organs -- is but the result of their molecular arrangement,\" answer the physiologists.\n\n\"In the bosom of that aggregate which is named planet,\" teaches Littre, \"are developed all the forces immanent to matter .\n\n.\n\n.\n\ni.e.\n\n, that matter possesses in itself and through itself the forces that are proper to it .\n\n.\n\n.\n\nand which are primary , not secondary.\n\nSuch forces are the property of weight, the property of electricity, of terrestrial magnetism, the property of life.\n\n.\n\n.\n\n.\n\nEvery planet can develop life .\n\n.\n\n.\n\nas earth, for instance, which had not always mankind on it, and now bears ( produit ) men\" .\n\n.\n\n.\n\n( Revue des Deux Mondes , July 15, 1860.) [[Vol.\n\n1, Page]] 503 SCIENTIFIC ABERRATIONS.\n\nplanets rotate because they are made to rotate .\n\n.\n\n.\n\n.\n\n.\n\nand the modern physical system of the universe is a physical impossibility.\n\n\" ( Soirees.\n\n) For did not Herschell say the same thing when he remarked that there is a will needed to impart a circular motion, and another will to restrain it?\n\n( Discours , 165.) This shows and explains how a retarded planet is cunning enough to calculate so well its time as to hit off its arrival at the fixed minute.\n\nFor, if Science sometimes succeeds with its great ingenuity in explaining some of such stoppages, retrograde motions, angles outside the orbits, &c., &c., by appearances resulting from the inequality of their progress and ours in the course of our mutual and respective orbits, we still know that there are others, and \"very real and considerable deviations,\" according to Herschell, \"which cannot be explained except by the mutual and irregular action of those planets and by the perturbing influence of the Sun.\" We understand, however, that there are, besides those little and accidental perturbations, continuous perturbations called \"secular\" -- because of the extreme slowness with which the irregularity increases and affects the relations of the elliptic movement -- and that these perturbations can be corrected.\n\nFrom Newton, who found that this world needed repairing very often, down to Reynaud, all say the same.\n\nIn his Ciel et Terre ( p.\n\n28), the latter speaks of -- \".\n\n.\n\n.\n\n.\n\n.\n\nThe orbits described by the planets as being very far from immutable; on the contrary, subject to a perpetual mutation in their position and form,\" -- all prove gravitation and the peripatetic laws to be as negligent as they are quick to repair their mistakes.\n\nThe charge as it stands seems to be that \"they (the orbits) are alternately widening and narrowing, their great axis lengthens and diminishes, or oscillates at the same time from right to left around the Sun, the plane itself, in which they are situated, raising and lowering itself periodically while pivoting around itself with a kind of tremor.\n\n.\n\n.\n\n.\" To this, De Mirville, who believes in intelligent \"workmen\" ruling invisibly the solar system -- as we do -- observes very wittily* .\n\n.\n\n.\n\n.\n\n.\n\n\" Voila certes , a voyage which has little in it of mechanical rigour; at the utmost, one could compare it to a steamer, pulled to and fro and tossed on the waves, retarded or accelerated, all and each of which impediments might put off its arrival indefinitely, were there not the intelligences of a pilot and engineers to catch up the time lost, and to repair the damages.\n\n.\n\n.\n\n.\n\n.\" The law of gravity, however, seems to be becoming an obsolete law in starry heaven.\n\nAt any rate those long-haired sidereal radicals , called comets, appear to be very poor respecters of the majesty of that law, [[Footnote(s)]] ------------------------------------------------- * Deuxieme memoire , \" Manifestations Historiques ,\" p.\n\n272.\n\n[[Vol.\n\n1, Page]] 504 THE SECRET DOCTRINE.\n\nand to beard it quite impudently.\n\nNevertheless, and though presenting in nearly every respect \"phenomena not yet fully understood ,\" comets and meteors are credited by the believers in modern Science with obeying the same laws and consisting of the same matter , \"as the Suns, stars and nebulae,\" and even \"the earth and its inhabitants.\" ( Laing ' s \" Modern Science and Modern Thought.\n\n\") This is what one might call taking things on trust, aye, even to blind faith.\n\nBut exact Science is not to be questioned, and he who rejects the hypotheses imagined by her students -- gravitation, for instance -- would be regarded as an ignorant fool for it; yet we are told by the just cited author a queer legend from the scientific annals.\n\n\"The comet of 1811 had a tail 120 millions of miles in length and 25 millions of miles in diameter at the widest part, while the diameter of the nucleus was about 127,000 miles, more than ten times that of the earth.\" He tells us, \"in order that bodies of this magnitude, passing near the earth, should not affect its motion or change the length of the year by even a single second, their actual substance must be inconceivably rare.\n\n.\n\n.\n\n.\" It must be so indeed, yet: -- \".\n\n.\n\n.\n\n.\n\n."


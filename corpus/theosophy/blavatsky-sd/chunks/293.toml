body = ".\" Such is the synopsis of the objections and difficulties to the acceptance of the nebular theory brought forward by the French savant , who concludes his interesting chapter by declaring that: -- \"The first part of the Cosmogonical problem, -- what is the primitive matter of chaos; and how did that matter give birth to the sun and stars?\n\n-- thus remains to this day in THE DOMAIN OF ROMANCE AND OF MERE IMAGINATION.\"** If this is the last word of Science upon that subject, whither then should one turn in order to learn what the nebular theory is supposed to teach?\n\nWhat, in fact, is this theory?\n\nWhat it is , no one seems to know for a certainty.\n\nWhat it is not -- we learn from the erudite author of the \"World-Life.\" He tells us that: -- (I.) It \" is not a theory of the evolution of the Universe .\n\n.\n\n.\n\nbut only and primarily a genetic explanation of the phenomena of the solar system, and accessorily a co-ordination of the principal phenomena in the stellar and nebular firmament, as far as human vision has been able to penetrate.\n\n\" (II.) \"That it does not regard the Comets as involved in that particular evolution which has produced the solar system.\" ( Esoteric doctrine does.\n\n) (It does, because it, too, recognises the comets as forms of cosmic existence co - ordinated with earlier stages of nebular evolution; and it actually assigns to them chiefly the formation of all worlds.) (III.) \" That it does not deny an antecedent history of the luminous fire mist \" -- (the secondary stage of evolution in the Secret Doctrine) .\n\n.\n\n.\n\n.\n\n\"and makes no claim to having reached an absolute beginning.\" And even [[Footnote(s)]] ------------------------------------------------- * See Stanza III.\n\nabout \"Light, or the cold Flame,\" and Commentary Number 8, where it is explained that the \"mother\" (Chaos) is a cold Fire, a cool Radiance, colourless, formless, devoid of every quality.\n\n\"Motion is the One Eternal is , and contains the potentialities of every quality in the Manvantaric Worlds,\" it is said.\n\n** Hypotheses Cosmogoniques , C.\n\nWolf, 1886.\n\n[[Vol.\n\n1, Page]] 600 THE SECRET DOCTRINE.\n\nit allows that this \"fire mist may have previously existed in a cold, nonluminous and invisible condition\" .\n\n.\n\n.\n\n.\n\n(IV.) \"And that finally: it does not profess to discover the ORIGIN of things, but only a stadium in material history \" .\n\n.\n\n.\n\n.\n\nleaving \"the philosopher and theologian as free as they ever were to seek for the origin of the modes of being.\"* But this is not all.\n\nEven the greatest philosopher of England -- Mr.\n\nHerbert Spencer -- arrayed himself against the fantastic theory by saying that ( a ) \"The problem of existence is not resolved\" by it; ( b ) the nebular hypothesis \"throws no light upon the origin of diffused matter,\" and ( c ) that \"the nebular hypothesis (as it now stands) implies a First Cause.\"** The latter, we are afraid, is more than our modern physicists have bargained for.\n\nThus, it seems that the poor \"hypothesis\" can hardly expect to find help or corroboration even in the world of the metaphysicians.\n\nConsidering all this, the Occultists believe they have a right to present their philosophy, however misunderstood and ostracised it may be at present.\n\nAnd they maintain that this failure of the scientists to discover the truth is entirely due to their materialism and contempt for transcendental sciences.\n\nYet although the scientific minds in our century are as far from the true and correct doctrine of Evolution as ever, there may be still some hope left for the future, as we find another great scientist giving us a faint glimmer of it.\n\nIn an article in Popular Science Review (Vol.\n\nXIV ., p.\n\n252) on \"Recent Researches in Minute Life,\" we find Mr.\n\nH.\n\nJ.\n\nSlack, F.C.S., Sec.\n\nR.M.S., saying: \"There is an evident convergence of all sciences, from physics to chemistry and physiology, toward some doctrine of evolution and development, of which the facts of Darwinism will form part , but what ultimate aspect this doctrine will take, there is little, if any, evidence to show, and perhaps it will not be shaped by the human mind until metaphysical as well as physical inquiries are much more advanced.\n\n\" This is a happy forecast indeed.\n\nThe day may come, then, when the \"Natural Selection,\" as taught by Mr.\n\nDarwin and Mr.\n\nHerbert Spencer, will form only a part , in its ultimate modification, of our Eastern doctrine of Evolution, which will be Manu and Kapila esoterically explained.\n\n[[Footnote(s)]] ------------------------------------------------- * \"World-Life,\" p.\n\n196.\n\n** Westminster Review , XX.\n\n, July 27, 1868."


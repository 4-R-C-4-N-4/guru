[content]
body = "(This is the Cosmical Aditi and Sephira.) 5.\n\nThose waters at the beginning were ordained but -- 6.\n\nA tree had not grown, a flower had not unfolded.\n\n7.\n\nWhen the gods had not sprung up, any one of them.\n\n8.\n\nA plant had not grown, and order did not exist.\n\nThis was the chaotic or ante-genetic period -- the double Swan and the Dark Swan, which becomes white, when Light is created.* The symbol chosen for the majestic ideal of the Universal Principle will seem little calculated to answer its sacred character.\n\nA goose, or even a swan, may appear unfit, no doubt, to represent the grandeur of the Spirit.\n\nNevertheless, it must have had some deep occult meaning, since it figures not only in every cosmogony and world religion, but even was chosen by the mediaeval Christians, the Crusaders, as the vehicle of the Holy Ghost supposed to lead the army to Palestine, to wrench the Tomb of the Saviour from the hands of the Saracen.\n\nIf we are to credit Professor Draper's statement in his \"Intellectual Development of Europe,\" the Crusaders, led on by Peter the Hermit, were preceded, at the head of the army, by the Holy Ghost under the shape of a white gander in company of a goat.\n\nThe Egyptian God of Time, Seb, carries a goose on his head.\n\nJupiter assumes the form of a swan and Brahma also, because the root of all this is that mystery of mysteries -- the M UNDANE E GG.\n\n(See preceding §).\n\n[[Footnote(s)]] ------------------------------------------------- * The Seven Swans that are believed to land from Heaven into Lake Mansarovara, are in the popular fancy the Seven Rishis of the Great Bear, who assume that form to visit the locality where the Vedas were written.\n\n[[Vol.\n\n1, Page]] 358 THE SECRET DOCTRINE.\n\nOne has to learn the reason of a symbol before one depreciates it.\n\nThe dual element of Air and Water is that of the ibis, swan, goose and pelican, of crocodiles and frogs, lotus flowers and water lilies, &c.; and the result is the choice of the most unseemly symbols among the modern as much as the ancient mystics.\n\nPan, the great god of nature, was generally figured in connection with aquatic birds, geese especially, and so were other gods.\n\nIf, later on, with the gradual degeneration of religion, the gods to whom geese were sacred, became Priapic deities, it does not stand to reason that water fowls were made sacred to Pan and other Phallic deities as some scoffers even of antiquity would have it ( see Petronii Satyrica , cxxxvi.); but that the abstract and divine power of procreative nature had become grossly anthropomorphized.\n\nNor does the Swan of Leda show \"Priapic doings and her enjoyment thereof,\" as Mr.\n\nHargrave Jennings chastely expresses it -- for the myth is but another version of the same philosophical idea of cosmogony.\n\nSwans are frequently found associated with Apollo, as they are the emblems of water and fire (sun-light also), before the separation of the Elements.\n\nOur modern symbologists might profit by some remarks made by a well-known writer, Mrs.\n\nLydia Maria Child.\n\n\"From time immemorial an emblem has been worshipped in Hindostan as the type of creation, or the origin of life.\n\n.\n\n.\n\n.\n\nSiva or the Mahadeva being not only the reproducer of human forms, but also the fructifying principle, the generative power that pervades the Universe.\n\nThe maternal emblem is likewise a religious type.\n\nThis reverence for the production of life, introduced into the worship of Osiris the sexual emblems.\n\nIs it strange that they regarded with reverence the great mystery of human birth?\n\nWere they impure thus to regard it?\n\nOr are we impure that do not so regard it?\n\nBut no clean and thoughtful mind could so regard them.\n\n.\n\n.\n\n.\n\nWe have travelled far, and unclean have been the paths, since those old Anchorites first spoke of God and the soul in the solemn depths of their first sanctuaries.\n\nLet us not smile at their mode of tracing the infinite and the incomprehensible Cause throughout all the mysteries of nature, lest by so doing we cast the shadow of our own grossness on their patriarchal simplicity.\" (\" Progress of Religious Ideas ,\" Vol.\n\n1, p.\n\n17, et seq.\n\n) -------------- Next Chapter Contents"


[content]
body = "The esoteric symbol of Kali Yuga is the five-pointed star reversed, thus -- the sign of human sorcery, with its two points (horns) turned heavenward, a position every [[Footnote(s)]] ------------------------------------------------- * See that suggestive work, \"The Source of Measures,\" where the author explains the real meaning of the word \"sacr',\" from which \"sacred,\" \"sacrament,\" are derived, which have now become synonyms of \"holiness,\" though purely phallic!\n\n[[Vol.\n\n1, Page]] 6 THE SECRET DOCTRINE.\n\nOccultist will recognise as one of the \"left-hand,\" and used in ceremonial magic.* It is hoped that during the perusal of this work the erroneous ideas of the public in general with regard to Pantheism will be modified.\n\nIt is wrong and unjust to regard the Buddhists and Advaitee Occultists as atheists.\n\nIf not all of them philosophers, they are, at any rate, all logicians, their objections and arguments being based on strict reasoning.\n\nIndeed, if the Parabrahmam of the Hindus may be taken as a representative of the hidden and nameless deities of other nations, this absolute Principle will be found to be the prototype from which all the others were copied.\n\nParabrahm is not \"God,\" because It is not a God.\n\n\"It is that which is supreme, and not supreme (paravara),\" explains Mandukya Upanishad (2.28).\n\nIT is \"Supreme\" as CAUSE, not supreme as effect.\n\nParabrahm is simply, as a \"Secondless Reality,\" the all-inclusive Kosmos -- or, rather, the infinite Cosmic Space -- in the highest spiritual sense, of course.\n\nBrahma (neuter) being the unchanging, pure, free, undecaying supreme Root, \"the ONE true Existence, Paramarthika,\" and the absolute Chit and Chaitanya (intelligence, consciousness) cannot be a cogniser, \"for THAT can have no subject of cognition.\" Can the flame be called the essence of Fire?\n\nThis Essence is \"the LIFE and LIGHT of the Universe, the visible fire and flame are destruction, death, and evil.\" \"Fire and Flame destroy the body of an Arhat, their essence makes him immortal.\" ( Bodhi-mur, Book II.\n\n) \"The knowledge of the absolute Spirit, like the effulgence of the sun, or like heat in fire, is naught else than the absolute Essence itself,\" says Sankaracharya.\n\nIT -- is \"the Spirit of the Fire,\" not fire itself; therefore, \"the attributes of the latter, heat or flame, are not the attributes of the Spirit, but of that of which that Spirit is the unconscious cause.\" Is not the above sentence the true key-note of later Rosicrucian [[Footnote(s)]] ------------------------------------------------- * We are told by the Western mathematicians and some American Kabalists, that in the Kabala also \"the value of the Jehovah name is that of the diameter of a circle.\" Add to this the fact that Jehovah is the third Sephiroth, Binah, a feminine word, and you have the key to the mystery.\n\nBy certain Kabalistic transformations this name, androgynous in the first chapters of Genesis, becomes in its transformations entirely masculine, Cainite and phallic.\n\nThe fact of choosing a deity among the pagan gods and making of it a special national God, to call upon it as the \"One living God,\" the \"God of Gods,\" and then proclaim this worship Monotheistic, does not change it into the ONE Principle whose \"Unity admits not of multiplication, change, or form,\" especially in the case of a priapic deity, as Jehovah now demonstrated to be.\n\n[[Vol.\n\n1, Page]] 7 PROEM.\n\nphilosophy?\n\nParabrahm is, in short, the collective aggregate of Kosmos in its infinity and eternity, the \"THAT\" and \"THIS\" to which distributive aggregates can not be applied.* \"In the beginning THIS was the Self, one only\" ( Aitareya Upanishad ) ; the great Sankaracharya, explains that \"THIS\" referred to the Universe (Jagat); the sense of the words, \"In the beginning,\" meaning before the reproduction of the phenomenal Universe.\n\nTherefore, when the Pantheists echo the Upanishads, which state, as in the Secret Doctrine, that \"this\" cannot create, they do not deny a Creator, or rather a collective aggregate of creators, but only refuse, very logically, to attribute \"creation\" and especially formation, something finite to an Infinite Principle.\n\nWith them, Parabrahmam is a passive because an Absolute Cause, the unconditioned Mukta.\n\nIt is only limited Omniscience and Omnipotence that are refused to the latter, because these are still attributes (as reflected in man's perceptions); and because Parabrahm, being the \"Supreme ALL,\" the ever invisible spirit and Soul of Nature, changeless and eternal, can have no attributes; absoluteness very naturally precluding any idea of the finite or conditioned from being connected with it.\n\nAnd if the Vedantin postulates attributes as belonging simply to its emanation, calling it \"Iswara plus Maya,\" and Avidya (Agnosticism and Nescience rather than ignorance), it is difficult to find any Atheism in this conception.** Since there can be neither two INFINITES nor two ABSOLUTES in a Universe supposed to be Boundless, this Self-Existence can hardly be conceived of as creating personally.\n\nIn the sense and perceptions of finite \"Beings,\" THAT is Non-\"being,\" in the sense that it is the one BE-NESS; for, in this ALL lies concealed its coeternal and coeval emanation or inherent radiation, which, upon becoming periodically Brahma (the male-female Potency) becomes or expands itself into the manifested Universe.\n\nNarayana moving on the (abstract) waters of Space, is transformed into the Waters of concrete substance moved by him, who now becomes the manifested WORD or Logos.\n\n[[Footnote(s)]] ------------------------------------------------- * See \"Vedanta Sara,\" by Major G.\n\nA.\n\nJacob; as also \"The Aphorisms of S'andilya,\" translated by Cowell, p.\n\n42.\n\n** Nevertheless, prejudiced and rather fanatical Christian Orientalists would like to prove this pure Atheism.\n\nFor proof of this, see about Major Jacob's \"Vedanta Sara.\" Yet, the whole Antiquity echoes this Vedantic thought: -- \"Omnis enim per se divom natura necesse est Immortali aevo summa cum pace fruatur.\" [[Vol.\n\n1, Page]] 8 THE SECRET DOCTRINE."


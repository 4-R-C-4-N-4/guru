[content]
body = "It is the emblem of the activity of Fohat, of the continual revolution of the \"wheels,\" and of the Four Elements, the \"Sacred Four,\" in their mystical, and not alone in their cosmical meaning; further, its four arms, bent at right angles, are intimately related, as shown elsewhere, to the Pythagorean and Hermetic scales.\n\nOne initiated into the mysteries of the meaning of the Swastica, say the Commentaries, \"can trace on it, with mathematical precision, the evolution of Kosmos and the whole period of Sandhya.\n\n\" Also \"the relation of the Seen to the Unseen,\" and \"the first procreation of man and species.\" To the Eastern Occultist the T REE of Knowledge in the Paradise of man's own heart, becomes the Tree of Life eternal, and has nought to do with man's animal senses.\n\nIt is an absolute mystery that reveals itself only through the efforts of the imprisoned Manas and the Ego to liberate themselves from the thraldom of sensuous perception and see, in the light of the one eternal present Reality.\n\nTo the Western Kabalist, and now far more to the superficial Symbologist, nursed in the lethal atmosphere of materialistic science, there is but one chief explanation of the mysteries of the Cross -- its sexual element.\n\nEven the otherwise spiritualistic modern commentator discerns in the Cross and Swastica, this feature before all others.\n\n[[Footnote(s)]] ------------------------------------------------- * So it was, and could not be otherwise.\n\nJulian (the Emperor) was an Initiate, and as such knew well the \"mystery-meaning,\" both metaphysical and physical.\n\n[[Vol.\n\n2, Page]] 588 THE SECRET DOCTRINE.\n\n\"The cross was used in Egypt as a protecting talisman and a symbol of saving power.\n\nTyphon, or Satan, is actually found chained and bound to the cross.\n\nIn the Ritual , the Osirian cries, ' The Apophis is overthrown, their cords bind the South, North, East, and West, their cords are on him.\n\nHar-ru-bah has knotted him .'* These were the cords of the four Quarters, or the cross.\n\nThor is said to smite the head of the Serpent with his hammer .\n\n.\n\n.\n\na form of Swastica or four-footed Cross.\n\n.\n\n.\n\n.\n\nIn the primitive sepulchres of Egypt the model of the Chamber had the form of a Cross.** The pagoda of Mathura .\n\n.\n\n.\n\nthe birth-place of Krishna, was built in the form of a Cross .\n\n.\n\n.\n\n.\n\n*** This is perfect and no one can discern in this \"sexual worship,\" with which the Orientalists love to break the head of Paganism.\n\nBut how about the Jews, and the exoteric religions of some Hindu sects, especially the rites of the Vallabacharyas?\n\nFor, as said, the Lingham and Yoni of Siva-worship stand too high philosophically, its modern degeneration notwithstanding, to be called a simple phallic worship.\n\nBut the tree or Cross- worship**** of the Jews, as denounced by their own Prophets, can hardly escape the charge.\n\nThe \"Sons of Sorcerers,\" \"the seed of the adulterer,\" as Isaiah calls them (lvii.), never lost an opportunity of \"enflaming themselves with idols under every green tree,\" which denotes no metaphysical recreation.\n\nIt is from these monotheistic Jews that the Christian nations have derived their religion, their \"God of gods, the One living God,\" while despising and deriding the worship of the Deity of the ancient philosophers.\n\nLet such believe in and worship the physical form of the Cross, by all means.\n\nBut to the follower of the true Eastern archaic Wisdom, to him who worships in spirit nought outside the Absolute Unity, that ever-pulsating great Heart that beats throughout, as in every atom of nature, each such atom contains the germ from which he may raise the Tree of Knowledge, whose fruits give life eternal and not physical life alone.\n\nFor him the Cross and Circle, the Tree or the Tau, are, after every symbol relating to these has been applied to, and read one after another, still a profound mystery in their Past, and it is to that Past alone that he directs his eager gaze.\n\nHe cares little whether it be the seed from [[Footnote(s)]] ------------------------------------------------- * Apophis or Apap is the Serpent of evil, symbol of human passions.\n\nThe Sun (Osiris-Horus), destroys him, when Apap is thrown down, bound and chained.\n\nThe god Aker, \"the chief of the gate of the Abyss,\" of Aker, the realm of the Sun (xv.\n\n39) binds him.\n\nApophis is the enemy of Ra (light), but the \"great Apap has fallen!\" exclaims the defunct.\n\n\"The Scorpion has hurt thy mouth,\" he says to the conquered enemy (xxxix.\n\nv.\n\n7).\n\nThe Scorpion is the \"worm that never dies\" of the Christians.\n\nApophis is bound on the Tau or Tat, \"the emblem of stability.\" (See the erection of Tat in Tatoo, Ritual xviii.).\n\n** So have the crypts in cis-Himalayan regions where Initiates live, and where their ashes are placed for seven lunar years.\n\n*** The Natural Genesis, Vol.\n\nI.\n\np.\n\n432.\n\n**** The Cross and the Tree are identical and synonymous in symbolism.\n\n[[Vol.\n\n2, Page]] 589 MAN, THE REVILER OF GOD.\n\nwhich grows the genealogical Tree of Being, called the Universe.\n\nNor is it the Three in One, the triple aspect of the seed -- its form, colour, and substance -- that interest him, but rather the F ORCE which directs its growth, the ever mysterious, as the ever unknown.\n\nFor this vital Force, that makes the seed germinate, burst open and throw out shoots, then form the trunk and branches, which, in their turn, bend down like the boughs of the Aswattha, the holy Tree of Bodhi, throw their seed out, take root and procreate other trees -- this is the only F ORCE that has reality for him, as it is the never-dying breath of life.\n\nThe pagan philosopher sought for the Cause, the modern is content with only the effects and seeks the former in the latter.\n\nWhat is beyond, he does not know, nor does the modern A-gnostic care: thus rejecting the only knowledge upon which he can with full security base his Science.\n\nYet this manifested Force has an answer for him who seeks to fathom it.\n\nHe who sees in the cross, the decussated circle of Plato, the Pagan, not the antitype of circumcision, as Christian (St.) Augustine did,* is forthwith regarded by the Church as a heathen: by Science, as a lunatic.\n\nThis because, while refusing to worship the god of physical generation, he confesses that he can know nothing of the Cause which underlies the so-called First Cause, the causeless Cause of this Vital Cause."


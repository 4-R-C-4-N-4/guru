[content]
body = "Esoterically she contains but two,* Chochmah or Wisdom , \"a masculine, active potency whose divine name is Jah ( ),\" and B INAH, a feminine passive potency, Intelligence, represented by the divine name Jehovah ( ); which two potencies form, with Sephira the third, the Jewish trinity or the Crown, K ETHER.\n\nThese two Sephiroths called Father, Abba , and Mother Amona , are the duad or the double-sexed logos from which issued the other seven Sephiroths.\n\n(See Zohar.\n\n) This first Jewish triad (Sephira, Chochmah, and Binah) is the Hindu Trimurti.* However veiled, even in the Zohar , and more still in the exoteric Pantheon of India, every particular connected with one is reproduced in the other.\n\nThe Prajapati are the Sephiroths.\n\nTen with Brahma they dwindle to seven, when the Trimurti, and the Kabalistic triad, are separated from the rest.\n\nThe seven Builders (Creators) become the seven Prajapati , or the seven Rishis, in the same order as the Sephiroths become the Creators; then the Patriarchs, etc.\n\nIn both Secret Systems, the One Universal Essence is incomprehensible and inactive in its absoluteness, and can be connected with the building of the Universe only in an indirect way.\n\nIn both, the primeval Malefemale or androgynous Principle, and their ten and seven Emanations (Brahma-Viraj and Aditi-Vach on the one part and the Elohim-Jehovah, or Adam-Adami (Adam Kadmon) and Sephira Eve on the [[Footnote(s)]] ------------------------------------------------- * In the Indian Pantheon the double-sexed Logos is Brahma, the Creator, whose seven \"mind born\" sons are the primeval Rishis -- the \"Builders.\" [[Vol.\n\n1, Page]] 356 THE SECRET DOCTRINE.\n\nother), with their Prajapati and Sephiroths, represent in their totality, first of all the Archetypal man, the Proto-logos; and only in their secondary aspect do they become Cosmic powers, and astronomical or sidereal bodies.\n\nIf Aditi is the mother of the gods, Deva-Matri , Eve is the mother of all living; they are the Sakti or generative power in their female aspect of the \"Heavenly man,\" and they are all compound Creators.\n\nSays a \" Gupta Vidya \" Sutra: \"In the beginning, a ray issuing from Paramarthika ( the one and only true existence), it became manifested in Vyavaharika (conventional existence) which was used as a Vahan to descend into the Universal Mother, and to cause her to expand (swell, brih ) .\n\n\" And in the Zohar it is stated: \"The Infinite Unity, formless and without similitude, after the form of the heavenly man was created, used it.\n\nThe Unknown Light* (Darkness) used the (heavenly form) as a chariot through which to descend, and wished to be called by this form, which is the sacred name Jehovah.\" As the Zohar says: \"In the beginning was the Will of the King, prior to any other existence.\n\n.\n\n.\n\n.\n\nIt (the Will) sketched the forms of all things that had been concealed but now came into view.\n\nAnd there went forth as a sealed secret from the head of Ain Soph, a nebulous spark of matter, without shape or form.\n\n.\n\n.\n\n.\n\nLife is drawn from below, and from above the source renews itself, the sea is always full and spreads its waters everywhere.\" Thus the deity is compared to a shoreless sea, to water which is \"the fountain of life\" (Zohar iii., 290).\n\n\"The seventh palace, the fountain of life, is the first in the order from above\" (ii.\n\n261).\n\nHence the Kabalistic tenet on the lips of the very Kabalistic Solomon, who says in Proverbs ix., 1: \"Wisdom hath builded her house; it hath hewn out its seven pillars.\" Whence then, all this identity of ideas, if there was no primeval U NIVERSAL Revelation?\n\nThe few points shown are like a few straws in a hayrick, in comparison to that which will be shown as the work proceeds.\n\nIf we turn to that most hazy of all Cosmogonies -- the Chinese, even there the same idea is found.\n\nTsi-tsai (the Self-Existent) is the unknown Darkness, the root of the Wuliang-sheu (Boundless Age), Amitabhe, and Tien (heaven) come later on.\n\nThe \"great Extreme\" of Confucius gives the same idea, his \"straws\" notwithstanding.\n\nThe latter are a source of great amusement to the missionaries.\n\nThese laugh at every \"heathen\" religion, despise and hate that of their [[Footnote(s)]] ------------------------------------------------- * Says Rabbi Simeon: \"Ah, companions, companions, man as an emanation was both man and woman, as well on the side of the ' Father ' as on the side of the ' Mother.\n\n' And this is the sense of the words: 'And Elohim spoke; Let there be Light, and it was Light' .\n\n.\n\n.\n\nand this is the two-fold man.\n\n\" (\" Auszuge aus dem Sohar ,\" p.\n\n13, 15.) Light, then, in Genesis stood for the Androgyne Ray or \"Heavenly Man.\" [[Vol.\n\n1, Page]] 357 ORNITHOLOGICAL SYMBOLS.\n\nbrother Christians of other denominations, and yet one and all accept a la lettre their own Genesis.\n\nIf we turn to Chaldea we find in it Anu , the concealed deity, the One, whose name, moreover, shows it to be of Sanskrit origin.\n\nAnu , which means in Sanskrit \"atom,\" aniyamsam aniyasam (smallest of the small), is a name of Parabrahm in the Vedantic philosophy; Parabrahm being described as smaller than the smallest atom, and greater than the greatest sphere or universe: \" Anagraniyam and Mahatorvavat.\n\n\" This is what George Smith gives as the first verses of the Akkadian Genesis as found in the Cuneiform Texts on the \" Lateras Coctiles.\n\n\" There also, we find Anu the passive deity or En-Soph, Bel , the Creator, the Spirit of God (Sephira) moving on the face of the waters, hence water itself, and Hea , the Universal Soul or wisdom of the three combined.\n\nThe first eight verses read thus: 1.\n\nWhen above, were not raised the heavens; 2 .\n\nAnd below on the earth a plant had not grown up.\n\n3.\n\nThe abyss had not broken its boundaries.\n\n4.\n\nThe chaos (or water) Tiamat (the sea) was the producing mother of the whole of them."


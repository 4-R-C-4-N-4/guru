body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n2 [[Vol.\n\n2, Page]] 351 THE \"GREAT DRAGONS\" AND SERPENTS.\n\nSTANZA XII.\n\nTHE FIFTH RACE AND ITS DIVINE INSTRUCTORS.\n\n------- §§ (47) The remnants of the first two races disappear for ever.\n\nGroups of the various Atlantean races saved from the Deluge along with the Forefathers of the Fifth.\n\n(48) The origins of our present Race, the Fifth.\n\nThe first divine Dynasties.\n\n(49) The earliest glimmerings in History, now pinned to the allegorical chronology of the Bible, and \"universal\" History slavishly following it.\n\n-- The nature of the first instructors and civilizers of mankind.\n\n--------------------- 47.\n\nF EW ( men ) REMAINED.\n\nS OME YELLOW, SOME BROWN AND BLACK, AND SOME RED, REMAINED.\n\nT HE MOON-COLOURED ( of the primitive Divine Stock ) WERE GONE FOR EVER ( a ) .\n\n.\n\n.\n\n.\n\n48.\n\nT HE F IFTH R ACE PRODUCED FROM THE H OLY S TOCK ( remained ) .\n\nI T WAS RULED BY H ER F IRST D IVINE K INGS.\n\n49.\n\nT HE \" S ERPENTS\" WHO RE-DESCENDED; WHO MADE PEACE WITH THE F IFTH ( Race ) , WHO TAUGHT AND INSTRUCTED IT ( b ) .\n\n.\n\n.\n\n.\n\n( a ) This verse (47) relates to the Fifth Race.\n\nHistory does not begin with it, but living and ever-recurring tradition does.\n\nHistory -- or what is called history -- does not go further back than the fantastic origins of our fifth sub-race, a \"few thousands\" of years.\n\nIt is the sub-divisions of this first sub-race of the Fifth Root-Race which are referred to in the sentence, \"Some yellow, some brown and black, and some red, remained.\" The \"moon coloured\" ( i.e ., the First and the Second Races) were gone for ever -- ay, without leaving any traces whatever; and that, so far back as the third \"Deluge\" of the Third Lemurian race, that \"Great Dragon,\" whose tail sweeps whole nations out of existence in the twinkling of an eye.\n\nAnd this is the true meaning of the Verse in the C OMMENTARY which says: \" The G REAT D RAGON has respect but for the ' S ERPENTS' of W ISDOM, the Serpents whose holes are now under the triangular stones, \" i.e., \"the Pyramids, at the four corners of the world.\" ( b ) This tells us clearly that which is mentioned more than once elsewhere in the Commentaries; namely, that the Adepts or \"Wise\" men of the three Races (the Third, Fourth and the Fifth) dwelt in subterranean habitats, generally under some kind of pyramidal structure, if not [[Vol.\n\n2, Page]] 352 THE SECRET DOCTRINE.\n\nactually under a pyramid.\n\nFor such \"pyramids\" existed in the four corners of the world and were never the monopoly of the land of the Pharaohs, though until found scattered all over the two Americas, under and over ground, beneath and amidst virgin forests, as in plain and vale, they were supposed to be the exclusive property of Egypt.\n\nIf the true geometrically correct pyramids are no longer found in European regions, many of the supposed early neolithic caves, of the colossal triangular, pyramidal and conical menhirs in the Morbihan, and Brittany generally; many of the Danish tumuli and even of the \"giant tombs\" of Sardinia with their inseparable companions, the nuraghi, are so many more or less clumsy copies of the pyramids.\n\nMost of these are the works of the first settlers on the newly-born continent and isles of Europe, the -- \"some yellow, some brown and black, and some red\" -- races that remained after the submersion of the last Atlantean continents and islands (850,000 years ago), with the exception of Plato's Atlantean island, and before the arrival of the great Aryan races; while others were built by the earliest immigrants from the East.\n\nThose who can hardly accept the antiquity of the human race so far back as the 57,000 years assigned by Dr.\n\nDowler to the skeleton found by him at New Orleans on the banks of the Mississippi, will, of course, reject these facts.\n\nBut they may find themselves mistaken some day.\n\nIt is the foolish self-glorification of the Arcadians who styled themselves [[ proselenoi ]] -- older than the moon -- and of the people of Attica, who claimed that they had existed before the sun appeared in heaven, that we may disparage, not their undeniable antiquity.\n\nNor can we laugh at the universal belief that we had giant ancestors.\n\nThe fact that the bones of the mammoth and mastodon, and, in one case, those of a gigantic salamander, have been mistaken for human bones, does not make away with the difficulty that, of all the mammalians, man is the only one whom science will not allow to have dwarfed down, like all other animal frames, from the giant homo diluvii to the creature between 5 and 6 feet that he is now.\n\nBut the \"Serpents of Wisdom\" have preserved their records well, and the history of the human evolution is traced in heaven as it is traced on underground walls.\n\nHumanity and the stars are bound together indissolubly, because of the intelligences that rule the latter.\n\nModern symbologists may scoff at this and call it \"fancy,\" but \"it is unquestionable that the Deluge has (ever) been associated in the legends of some Eastern peoples not only with the Pyramids, but also with the constellations,\" writes Mr.\n\nStaniland Wake ( \" The Great Pyramid \").\n\nThe \"Old Dragon\" is identical with the \"great Flood,\" says Mr.\n\nProctor ( in \" Knowledge, \" Vol.\n\nI., p.\n\n243): \"We know that in the past the constellation of the Dragon was at the pole, or boss, of the celestial sphere.\n\nIn stellar temples .\n\n.\n\n.\n\nthe Dragon would be the [[Vol.\n\n2, Page]] 353 THE ASTRONOMICAL DRAGON.\n\nuppermost or ruling constellation .\n\n.\n\n.\n\nit is singular how closely the constellations .\n\n.\n\n.\n\ncorrespond in sequence and in range of right ascension with the events recorded respecting the (Biblical) Flood.\" The reasons for this singularity have been made clear in this work.\n\nBut it shows only that there were several Deluges mixed up in the memories and traditions of the sub-races of the Fifth Race.\n\nThe first great \"Flood\" was astronomical and cosmical, while several others were terrestrial.\n\nYet, this did not prevent our very learned friend Mr."


body = ".' You can never impress it too profoundly on the minds of those to whom you impart some of the esoteric teachings.\n\n.\n\n.\" Again, here are more extracts from another letter written by the same authority.\n\nThis time it is in answer to some objections laid before the Teachers.\n\nThey are based upon extremely scientific, and as [[Vol.\n\n1, Page]] 166 THE SECRET DOCTRINE.\n\nfutile, reasonings about the advisability of trying to reconcile the Esoteric theories with the speculations of Modern Science, and were written by a young Theosophist as a warning against the \"Secret Doctrine\" and in reference to the same subject.\n\nHe had declared that if there were such companion Earths \"they must be only a wee bit less material than our globe.\" How then was it that they could not be seen?\n\nThe answer was: -- \".\n\n.\n\n.\n\n.\n\nWere psychic and spiritual teachings more fully understood , it would become next to impossible to even imagine such an incongruity.\n\nUnless less trouble is taken to reconcile the irreconcileable -- that is to say , the metaphysical and spiritual sciences with physical or natural philosophy , ' natural ' being a synonym to them ( men of science ) of that matter which falls under the perception of their corporeal senses -- no progress can be really achieved.\n\nOur Globe , as taught from the first , is at the bottom of the arc of descent , where the matter of our perceptions exhibits itself in its grossest form .\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\nHence it only stands to reason that the globes which overshadow our Earth must be on different and superior planes.\n\nIn short , as Globes , they are in CO-ADUNITION but not IN CONSUBSTANTIALITY WITH OUR EARTH and thus pertain to quite another state of consciousness.\n\nOur planet ( like all those we see ) is adapted to the peculiar state of its human stock , that state which enables us to see with our naked eye the sidereal bodies which are co-essential with our terrene plane and substance , just as their respective inhabitants , the Jovians , Martians and others can perceive our little world: because our planes of consciousness , differing as they do in degree but being the same in kind , are on the same layer of differentiated matter .\n\n.\n\n.\n\n.\n\n.\n\nWhat I wrote was ' The minor Pralaya concerns only our little STRINGS OF GLOBES.' ( We called chains ' Strings ' in those days of lip-confusion.\n\n) .\n\n.\n\n.\n\n' To such a string our Earth belongs.' This ought to have shown plainly that the other planets were also ' strings ' or CHAINS .\n\n.\n\n.\n\nIf he ( meaning the objector ) would perceive even the dim silhouette of one of such ' planets ' on the higher planes , he has to first throw off even the thin clouds of the astral matter that stands between him and the next plane .\n\n.\n\n.\n\n.\n\n.\" It becomes patent why we could not perceive, even with the help of the best earthly telescopes, that which is outside our world of matter.\n\nThose alone, whom we call adepts, who know how to direct their mental vision and to transfer their consciousness -- physical and psychic both -- [[Vol.\n\n1, Page]] 167 PRICELESS ADVICE, NEGLECTED.\n\nto other planes of being, are able to speak with authority on such subjects.\n\nAnd they tell us plainly: -- \" Lead the life necessary for the acquisition of such knowledge and powers , and Wisdom will come to you naturally.\n\nWhenever your are able to attune your consciousness to any of the seven chords of ' Universal Consciousness ,' those chords that run along the sounding-board of Kosmos , vibrating from one Eternity to another; when you have studied thoroughly ' the music of the Spheres ,' then only will you become quite free to share your knowledge with those with whom it is safe to do so.\n\nMeanwhile , be prudent.\n\nDo not give out the great Truths that are the inheritance of the future Races , to our present generation.\n\nDo not attempt to unveil the secret of being and non-being to those unable to see the hidden meaning of Apollo ' s HEPTACHORD -- the lyre of the radiant god , in each of the seven strings of which dwelleth the Spirit , Soul and Astral body of the Kosmos , whose shell only has now fallen into the hands of Modern Science .\n\n.\n\n.\n\n.\n\n.\n\n.\n\nBe prudent , we say , prudent and wise , and above all take care what those who learn from you believe in; lest by deceiving themselves they deceive others .\n\n.\n\n.\n\n.\n\n.\n\nfor such is the fate of every truth with which men are , as yet , unfamiliar .\n\n.\n\n.\n\n.\n\nLet rather the planetary chains and other super- and sub-cosmic mysteries remain a dreamland for those who can neither see , nor yet believe that others can.\n\n.\n\n.\n\n.\" It is to be regretted that few of us have followed the wise advice; and that many a priceless pearl, many a jewel of wisdom, has been cast to an enemy unable to understand its value and who has turned round and rent us.\n\n\" ' Let us imagine ,' wrote the same Master to his two 'lay chelas,' as he called the author of 'Esoteric Buddhism' and another gentleman, his co-student for some time -- ' let us imagine THAT OUR EARTH IS ONE OF A GROUP OF SEVEN PLANETS OR MAN-BEARING WORLDS.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n( The SEVEN planets are the sacred planets of antiquity , and are all septenary.\n\n) Now the life-impulse reaches A , or rather that which is destined to become A , and which so far is but cosmic dust (a \"laya centre\") .\n\n.\n\netc.\n\n' \" In these early letters, in which the terms had to be invented and words coined, the \"Rings\" very often became \"Rounds,\" and the \"Rounds\" life-cycles, and vice versa.\n\nTo a correspondent who called a \"Round\" a \"World-Ring,\" the Teacher wrote: \"I believe this will lead to a further confusion.\n\nA Round we are agreed to call the passage [[Vol.\n\n1, Page]] 168 THE SECRET DOCTRINE.\n\nof a monad from Globe A to Globe G or Z.\n\n.\n\n.\n\nThe 'World-Ring' is correct.\n\n.\n\n.\n\nAdvise Mr.\n\n.\n\n.\n\n.\n\nstrongly, to agree upon a nomenclature before going any further.\n\n.\n\n.\n\n\" Notwithstanding this agreement, many mistakes, owing to this confusion, crept into the earliest teachings.\n\nThe Races even were occasionally mixed up with the \"Rounds\" and \"Rings,\" and led to similar mistakes in \"Man.\" From the first the Master had written -- \"Not being permitted to give you the whole truth , or divulge the number of isolated fractions .\n\n.\n\n.\n\nI am unable to satisfy you.\" This in answer to the questions, \"If we are right, then the total existence prior to the man-period is 637,\" etc., etc.\n\nTo all the queries relating to figures, the reply was, \"Try to solve the problem of 777 incarnations.\n\n.\n\n.\n\n.\n\nThough I am obliged to withhold information .\n\n.\n\n."


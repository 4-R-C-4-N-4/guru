body = "390, and lastly in the year 640, A.D ., by the general of Kaliph Omar.\n\nWhat is this in comparison with the works and records destroyed in the primitive Atlantean Libraries, wherein records are said to have been traced on the tanned skins of gigantic antediluvian monsters?\n\nOr again the destruction of the countless Chinese books by command of the founder of the Imperial Tsin dynasty, Tsin Shi Hwang-ti, in 213 B.C .?\n\nSurely the brick-clay tablets of the Imperial Babylonian Library, and the priceless treasures of the Chinese collections could have never contained such information as one of the aforesaid \"Atlantean\" skins would have furnished to the ignorant world.\n\nBut even with the extremely meagre data at hand, Science has been able to see the necessity of throwing back nearly every Babylonian date, and has done so quite generously.\n\nWe learn from Professor Sayce that even the archaic statues at Tel-loh, in Lower Babylonia, have suddenly been assigned a date contemporary with the fourth dynasty in Egypt.\n\nUnfortunately, dynasties and Pyramids have the fate of geological periods; their dates are arbitrary, and depend on the respective whims of the men of science.\n\nArchaeologists know now, it is said, that the afore-mentioned statues are fashioned out of green diorite, that can only be got in the Peninsula of Sinai; and \"they accord in the style of art, and in the standard of measurement employed, with the similar diorite statues of the pyramid builders of the third and fourth Egyptian dynasties.\n\n.\n\n.\n\n.\n\n.\n\nMoreover, the only possible period for a Babylonian occupation of the Sinaitic quarries must be placed shortly after the close of the epoch at which the pyramids were built; and thus only can we understand how the name of Sinai could have been derived from that of Sin, the primitive Babylonian moon-god.\" This is very logical, but what is the date fixed for these \"dynasties\"?\n\nSanchoniathon's and Manetho's Synchronistic tables and their figures have been rejected, or whatever [[Vol.\n\n2, Page]] 693 NO AGREEMENT BETWEEN SCIENTISTS.\n\nremained of these after holy Eusebius' handling of them; and still we have to remain satisfied with the four or five thousand years B.C .\n\nso liberally allotted to Egypt.\n\nAt all events one point is gained.\n\nThere is, at last, a city on the face of the earth which is allowed, at least, 6,000 years, and it is Eridu.\n\nGeology has found it out.\n\nAccording to Professor Sayce again, -- \"They are now also able to obtain time for the silting up of the head of the Persian Gulf, which demands a lapse of between 5,000 and 6,000 years since the period when Eridu, now twenty-five miles inland, was the seaport at the mouth of the Euphrates, and the seat of Babylonian commerce with Southern Arabia and India.\n\nMore than all, the new chronology gives time for the long series of eclipses recorded in the great astronomical work called 'The Observations of Bel'; and we are also enabled to understand the otherwise perplexing change in the position of the vernal equinox, which has occurred since our present zodiacal signs were named by the Earliest Babylonian astronomers.\n\nWhen the Accadian calendar was arranged and the Accadian months were named, the sun at the vernal equinox was not, as now, in Pisces, or even in Aries, but in Taurus.\n\nThe rate of the precession of the equinoxes being known, we learn that at the vernal equinox the sun was in Taurus from about 4,700 years B.C ., and we thus obtain astronomical limits of date which cannot be impugned.\"* It may make our position plainer if we state at once that we use Sir C.\n\nLyell's nomenclature for the ages and periods, and that when we talk of the Secondary and Tertiary age, of the Eocene, Miocene and Pliocene periods -- this is simply to make our facts more comprehensible.\n\nSince these ages and periods have not yet been allowed fixed and determined durations, 2 1/2 and 15 million years being assigned at different times to one and the same age (the Tertiary) -- and since no two geologists and naturalists seem to agree on this point -- Esoteric teachings may remain quite indifferent to whether man is shown to appear in the Secondary or the Tertiary age.\n\nIf the latter age may be allowed even so much as 15 million years' duration -- well and good; for the Occult doctrine, jealously guarding its real and correct figures as far as concerns the First, Second, and two-thirds of the Third Root-Race -- gives clear information upon one point only -- the age of \"Vaivasvata Manu's humanity.\" ( Vide Part I., Vol.\n\nII., \" Chronology of the Brahmins.\n\n\") Another definite statement is this: It is during the so-called Eocene period that the continent to which the Fourth Race belonged, and on which it lived and perished, showed the first symptoms of sinking.\n\nAnd it was in the Miocene age, that it was finally destroyed -- save the little island mentioned by Plato.\n\nIt is these points that have to be checked by the scientific data.\n\n[[Footnote(s)]] ------------------------------------------------- * From a Report of the \"Hibbert Lectures, 1887.\n\nLectures on the Origin and Growth of Religion, and Illustrated by the Religion of the Ancient Babylonians.\" By A.\n\nH.\n\nSayce.\n\n(London: Williams and Norgate.) [[Vol.\n\n2, Page]] 694 THE SECRET DOCTRINE.\n\nA .\n\nM ODERN S CIENTIFIC S PECULATIONS ABOUT THE A GES OF THE G LOBE, A NIMAL E VOLUTION, AND M AN.\n\nMay we not be permitted to throw a glance at the works of Specialists?\n\nThe work on \"Comparative Geology: the World-Life,\" by Prof.\n\nA.\n\nWinchell, furnishes us with curious data.\n\nHere we find an opponent of the Nebular theory, a reverend gentleman, smiting with all the force of the hammer of his odium theologicum on the rather contradictory hypothesis of the great stars of Science, in the matter of sidereal and cosmical phenomena based on their respective relations to terrestrial durations.\n\nThe \"too imaginative physicists and naturalists\" do not fare very easily under this shower of their own speculative figures when placed side by side, and cut rather a sorry figure.\n\nThus he shows: -- \"Sir William Thomson, on the basis of the observed principles of cooling, concludes that no more than ten million years (elsewhere he makes it 100,000,000) can have elapsed since the temperature of the Earth was sufficiently reduced to sustain vegetable life.* Helmholz calculates that twenty million years would suffice for the original nebula to condense to the present dimensions of the sun.\n\nProf.\n\nS."


[content]
body = "On our globe this Substance is the second principle of the septenary Element -- Earth; in the atmosphere, it is that of air , which is the cosmic gross body; in the Sun it becomes the Solar body and that of the Seven rays; in sidereal space it corresponds with another principle, and so on.\n\nThe whole is a homogeneous Unity alone, the parts are all differentiations.\n\n** Or the reverberation, and for sound, repercussion on our plane of that which is a perpetual motion of that Substance on higher planes.\n\nOur world and senses are victims of Maya , ceaselessly.\n\n*** An honest admission, that.\n\n[[Vol.\n\n1, Page]] 526 THE SECRET DOCTRINE.\n\nis such that we have no word, except ether,* by which to express it.\n\nIt pervades and fills space, but alone it too is quiescent -- dead.** We bring together the two elements, the inert matter, the self-repulsive Ether (?) and thereupon dead (?) ponderable matter is vivified\"; [ Ponderable matter may be inert but never dead -- this is Occult Law.\n\n-- H.P.B.] .\n\n.\n\n.\n\n\"through the particles of the ponderable substance the ether [ Ether ' s second principle.\n\n-- H.P.B.] penetrates, and, so penetrating, it combines with the ponderable particles and holds them in mass, holds them together in bond of union; they are dissolved in the Ether.\" \"This distribution of solid ponderable matter through ether extends, according to the theory before us, to everything that exists at this moment.\n\nThe ether is all-pervading.\n\nThe human body itself is charged with the ether [ Say astral light.\n\n-- H.P.B.]; its minute particles are held together by it; the plant is in the same condition; the most solid earth, rock, adamant, crystal, metal, all are the same.\n\nBut there are differences in the capacities of different kinds of ponderable matter to receive sun-force, and upon this depends the various changing conditions of matter; the solid, the liquid, the gaseous condition.\n\nSolid bodies have attracted caloric in excess over fluid bodies, and hence their firm cohesion; when a portion of molten zinc is poured upon a plate of solid zinc, the molten zinc becomes as solid because there is a rush of caloric from the liquid to the solid, and in the equalization the particles, previously loose or liquid, are more closely brought together.\n\n.\n\n.\n\n.\n\nMetcalfe himself, dwelling on the above-named phenomena, and accounting for them by the unity of principle of action, which has already been explained, sums up his argument in very clear terms, in a comment on the densities of various bodies.\n\n'Hardness and softness' (he says), 'solidity and liquidity, are not essential conditions of bodies, but depend on the relative proportions of ethereal and ponderable matter of which they are composed.\n\nThe most elastic gas may be reduced to the liquid form by the abstraction of caloric, and again converted into a firm solid, the particles of which would cling together with a force proportional to their augmented affinity for caloric.\n\nOn the other hand, by adding a sufficient quantity of the same principle to the densest metals, their attraction for it is diminished when they are expanded into the gaseous state, and their cohesion is destroyed.' \" Having thus quoted at length the heterodox views of the great \"heretic\" -- views that need only a little alteration of terms here and there, the same eminent scientist -- an original and liberal thinker, undeniably -- proceeds to sum up those views, and continues: -- [[Footnote(s)]] ------------------------------------------------- * Yet it is not Ether , but only one of the principles of Ether, the latter being itself one of the principles of Akasa.\n\n** And so does prana (Jiva) pervade the whole living body of man; but alone, without having an atom to act upon, it would be quiescent -- dead; i.e.\n\n, would be in laya , or as Mr.\n\nCrookes has it, \"locked in protyle .\" It is the action of Fohat upon a compound or even a simple body that produces life.\n\nWhen a body dies it passes into the same polarity as its male energy and repels therefore the active agent, which, losing hold of the whole , fastens on the parts or molecules, this action being called chemical.\n\nVishnu, the Preserver, transforms himself into Rudra-Siva, the Destroyer -- a correlation seemingly unknown to Science.\n\n[[Vol.\n\n1, Page]] 527 WE DISAGREE.\n\n\"I shall not dwell at great length on this unity of sun-force and earth, which this theory implies.\n\nBut I may add that out of it, or out of the hypothesis of mere motion as force, and of virtue without substance, we may gather, as the nearest possible approach to the truth on this, the most complex and profound of all subjects, the following inferences: -- \"( a ) Space, inter-stellary, inter-planetary, inter-material, inter-organic, is not a vacuum, but is filled with a subtle fluid or gas, which for want of a better term* we may still call, as the ancients did, Aith - ur -- Solar fire, AE THER.\n\nThis fluid, unchangeable in composition, indestructible, invisible,** pervades everything and all [ ponderable.\n\n-- H.\n\nP.\n\nB.] matter,*** the pebble in the running brook, the tree overhanging, the man looking on, is charged with the ether in various degree; the pebble less than the tree, the tree less than man.\n\nAll in the planet is in like manner so charged!\n\nA world is built up in ethereal fluid, and moving through a sea of it.\n\n\"( b ) The Ether, whatever its nature is, is from the sun and from the suns**** the suns are the generators of it, the store-houses of it, the diffusers of it.***** \"( c .) Without the ether there could be no motion; without it particles of ponderable matter could not glide over each other; without it there could be no impulse to excite those particles into action.\n\n\"( d .) Ether determines the constitution of bodies.\n\nWere there no ether there could be no change of constitution in substance; water, for instance, could only exist as a substance, compact and insoluble beyond any conception we could form of it.\n\nIt could never even be ice, never flint, never vapour, except for ether.\n\n\"( e .) Ether connects sun with planet, planet with planet, man with planet, man with man.\n\nWithout ether there could be no communication in the Universe; no light, no heat, no phenomenon of motion.\" Thus we find that Ether and elastic atoms are, in the alleged mechanical conception of the Universe, the Spirit and Soul of Kosmos, and that the theory -- put it any way and under whatever disguise -- always leaves a more widely opened issue for men of [[Footnote(s)]] ------------------------------------------------- * Verily, unless the occult terms of the Kabalists are adopted!"


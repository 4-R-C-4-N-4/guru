body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n1 [[Vol.\n\n1, Page]] 238 THE SECRET DOCTRINE.\n\nSTANZA VII.\n\n-- Continued.\n\n(5) T HE SPARK HANGS FROM THE FLAME BY THE FINEST THREAD OF F OHAT.\n\nI T JOURNEYS THROUGH THE S EVEN W ORLDS OF M AYA ( a ).\n\nI T STOPS IN THE FIRST ( Kingdom ), AND IS A METAL AND A STONE; IT PASSES INTO THE SECOND ( Kingdom ), AND BEHOLD -- A PLANT; THE PLANT WHIRLS THROUGH SEVEN FORMS AND BECOMES A SACRED ANIMAL; ( the first shadow of the physical man ) ( b ) .\n\nF ROM THE COMBINED ATTRIBUTES OF THESE, MANU ( man ), THE THINKER, IS FORMED.\n\nW HO FORMS HIM?\n\nT HE SEVEN LIVES; AND THE ONE LIFE ( c ) .\n\nW HO COMPLETES HIM?\n\nT HE FIVEFOLD L HA.\n\nAND WHO PERFECTS THE LAST BODY?\n\nF ISH, SIN, AND SOMA ( the moon ) ( d ) .\n\n( a ) The phrase \"through the seven Worlds of Maya\" refers here to the seven globes of the planetary chain and the seven rounds, or the 49 stations of active existence that are before the \"Spark\" or Monad, at the beginning of every \"Great Life-Cycle\" or Manvantara.\n\nThe \"thread of Fohat\" is the thread of life before referred to.\n\nThis relates to the greatest problem of philosophy -- the physical and substantial nature of life, the independent nature of which is denied by modern science because that science is unable to comprehend it.\n\nThe reincarnationists and believers in Karma alone dimly perceive that the whole secret of Life is in the unbroken series of its manifestations: whether in, or apart from, the physical body.\n\nBecause if -- \"Life, like a dome of many-coloured glass, Stains the white radiance of Eternity\" -- yet it is itself part and parcel of that Eternity; for life alone can understand life.\n\nWhat is that \"Spark\" which \"hangs from the flame?\" It is J IVA, the MONAD in conjunction with MANAS, or rather its aroma -- that which remains from each personality, when worthy, and hangs from Atma-Buddhi, the Flame, by the thread of life.\n\nIn whatever way interpreted, and into whatever number of principles the human being is divided, it may easily be shown that this doctrine is supported by all the ancient [[Vol.\n\n1, Page]] 239 CHALDEAN METAPHYSICS.\n\nreligions, from the Vedic to the Egyptian, from the Zoroastrian to the Jewish.\n\nIn the case of the last-mentioned, the Kabalistic works offer abundant proof of this statement.\n\nThe entire system of the Kabalistic numerals is based on the divine septenary hanging from the Triad (thus forming the Decade ) and its permutations 7, 5, 4, and 3, which, finally, all merge into the ONE itself: an endless and boundless Circle.\n\n\"The Deity (the ever Invisible Presence),\" says the Zohar, \"manifests itself through the ten Sephiroth which are its radiating witnesses.\n\nThe Deity is like the Sea from which outflows a stream called WISDOM, the waters of which fall into a lake named Intelligence.\n\nFrom the basin, like seven channels, issue the Seven Sephiroth.\n\n.\n\n.\n\n.\n\n.\n\nFor ten equal seven: the Decade contains four Unities and three Binaries.\" The ten Sephiroth correspond to the limbs of MAN.\n\n\"When I framed Adam Kadmon,\" the Elohim are made to say, \"the Spirit of the Eternal shot out of his Body like a sheet of lightning that radiated at once on the billows of the Seven millions of skies, and my ten splendours were his limbs.\" But neither the Head nor the shoulders of Adam-Kadmon can be seen; therefore we read in the Sephra Dzenioutha (the \"Book of the Concealed Mystery\"): -- \"In the beginning of Time, after the Elohim (the \"Sons of Light and Life,\" or the \"Builders\") had shaped out of the eternal Essence the Heavens and the Earth, they formed the worlds six by six, the seventh being Malkuth , which is our Earth (see Mantuan Codex ) on its plane, and the lowest on all the other planes of conscious existence.\n\nThe Chaldean Book of Numbers contains a detailed explanation of all this.\n\n\"The first triad of the body of Adam Kadmon (the three upper planes of the seven*) cannot be seen before the soul stands in the presence of the Ancient of Days.\" The Sephiroth of this upper triad are: -- \"1, Kether (the Crown) represented by the brow of Macroprosopos; 2, Chochmah (Wisdom, a male Principle) by his right shoulder; and 3, Binah (Intelligence, a female Principle) by the left shoulder.\" Then come the seven limbs (or Sephiroth) on the planes of manifestation, the totality of these four planes being represented by Microprosopus (the [[Footnote(s)]] ------------------------------------------------- * The formation of the \"living Soul\" or man, would render the idea more clearly.\n\n\"A Living Soul\" is a synonym of man in the Bible.\n\nThese are our seven \"Principles.\" [[Vol.\n\n1, Page]] 240 THE SECRET DOCTRINE.\n\nlesser Face) or Tetragrammaton, the \"four-lettered\" Mystery.\n\n\"The seven manifested and the three concealed limbs are the Body of the Deity.\" Thus our Earth, Malkuth , is both the Seventh and the Fourth world, the former when counting from the first globe above, the latter if reckoned by the planes.\n\nIt is generated by the sixth globe or Sephiroth called Yezod , \"foundation,\" or as said in the Book of Numbers \"by Yezod, He (Adam Kadmon) fecundates the primitive Heva\" (Eve or our Earth).\n\nRendered in mystic language this is the explanation why Malkuth, called \"the inferior Mother,\" Matrona, Queen, and the Kingdom of the Foundation, is shown as the Bride of Tetragrammaton or Microprosopus (the 2nd Logos) the Heavenly Man.\n\nWhen free from all impurity she will become united with the Spiritual Logos , i.e.\n\n, in the 7th Race of the 7th Round -- after the regeneration, on the day of \" S ABBATH.\" For the \" seventh day\" has again an occult significance undreamt of by our theologians.\n\n\"When Matronitha, the Mother, is separated and brought face to face with the King, in the excellence of the Sabbath, all things become one body,\" says verse 746, in chapter xxii."


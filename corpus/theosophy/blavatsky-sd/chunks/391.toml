[content]
body = ") Seth represents the later Third Race.\n\nTo screen the real mystery name of AIN-SOPH -- the Boundless and Endless No-Thing -- the Kabalists have brought forward the compound attribute- appellation of one of the personal creative Elohim, whose name was Yak and Jab, the letters i or j or y being interchangeable, or Jah-Hovah, i.e.\n\nmale and female ; * Jah-Eve an hermaphrodite, or the first form of humanity, the original Adam of Earth, not even Adam Kadmon, whose \" mind-born son\" is the earthly Jah-Hovah, mystically.\n\nAnd knowing this, the crafty Rabbin-Kabalist has made of it a name so secret, that he could not divulge it later on without exposing the whole scheme; and thus he was obliged to make it sacred.\n\nHow close is the identity between Brahma-Prajapati and Jehovah-Sephiroth, between Brahma-Viraj and Jehovah-Adam, the Bible and the Puranas compared can alone show.\n\nAnalysed and read in the same light, they afford cogent evidence that they are two copies of the same original -- made at two periods far distant from each other.\n\nCompare once more in relation to this subject Genesis ch.\n\n4.\n\nverses 1 and 26 and Manu I., and they will both yield their meaning.\n\nIn Manu ( Book I.\n\n32) Brahma, who is also both man and god, and divides his body into male and female, stands in his esoteric meaning, as does Jehovah or Adam in the Bible, for the symbolical personification of creative and generative power, both divine and human.\n\nThe Zohar affords still more convincing proof of identity, while some Rabbins repeat word for word certain original Puranic expressions; e.g.\n\n, the \"creation\" of the world is generally considered in the Brahmanical books to be the Lila, delight or sport, the amusement of the Supreme Creator, \"Vishnu being thus discrete and indiscrete substance, spirit, and time, sports like a playful boy in frolics.\" (Vishnu Purana, Book I., ch.\n\nii.) Now compare this with what is said in the Book, \"Nobeleth' Hokhmah\": \"The Kabalists say that the entering into existence of the worlds happens through delight , in that Ain-Soph (?\n\n!) rejoiced in Itself, and flashed and beamed from Itself to Itself .\n\n.\n\n.\n\n.\n\nwhich are all called delight,\" etc.\n\n(Quoted in Myer ' s \" Qabbalah, \" p .\n\n110).\n\nThus it is not a \"curious idea of the Qabbalists,\" as the author just quoted remarks, but a purely Puranic, Aryan idea.\n\nOnly, why make of Ain-Soph a Creator?\n\nThe \"Divine Hermaphrodite\" is then Brahma-Vach-Viraj; and that of the Semites, or rather of the Jews, is Jehovah-Cain-Abel.\n\nOnly the \"Heathen\" were, and are, more sincere and frank than were the [[Footnote(s)]] ------------------------------------------------- * Jod in the Kabala has for symbol the hand, the forefinger and the lingham, while numerically it is the perfect one; but it is also the number 10, male and female, when divided.\n\n[[Vol.\n\n2, Page]] 127 SETH OUR PROGENITOR.\n\nlater Israelites and Rabbis, who undeniably knew the real meaning of their exoteric deity.\n\nThe Jews regard the name given to them -- the Yah-oudi -- as an insult.\n\nYet they have, or would have if they only wished it, as undeniable a right to call themselves the ancient Yah-oudi, \"Jah-hovians,\" as the Brahmins have to call themselves Brahmins, after their national deity.\n\nFor Jah-hovah is the generic name of that group or hierarchy of creative planetary angels, under whose star their nation has evolved.\n\nHe is one of the planetary Elohim of the regent group of Saturn.\n\nVerse 26 of Genesis, ch.\n\niv., when read correctly, would alone give them such a right, for it calls the new race of men sprung from Seth and Enos, Jehovah, something quite different from the translation adopted in the Bible: -- \"To him also, was born a son, Enos; then began men to call themselves Jah or Yah-hovah,\" to with men and women, the \"lords of creation.\" One has but to read the above-mentioned verse in the original Hebrew text and by the light of the Kabala, to find that, instead of the words as they now stand translated, it is: -- \"Then began men to call themselves Jehovah, \" which is the correct translation, and not \"Then began men to call upon the name of the Lord\"; the latter being a mistranslation, whether deliberate or not.\n\nAgain the well-known passage: \"I have gotten a man from the Lord,\" should read: \"I have gotten a man, even Jehovah.\"* Luther translated the passage one way, the Roman Catholics quite differently.\n\nBishop Wordsworth renders it: \"Cain -- I have gotten Kain, from Kanithi, I have gotten.\" Luther: \"I have gotten a man 0-- even the Lord\" (Jehovah); and the author of \"The Source of Measures\": \"I have measured a man, even Jehovah .\" The last is the correct rendering, because ( a ) a famous Rabbin, a Kabalist, explained the passage to the writer in precisely this way, and ( b ) because this rendering is identical with that in the Secret Doctrine of the East with regard to Brahma.\n\nIn \" Isis Unveiled, \" ** it was explained by the writer that \"Cain .\n\n.\n\n.\n\nis the son of the 'Lord' not of Adam ( Genesis iv .\n\nI)\" The \"Lord\" is Adam Kadmon, the \"father\" of Yodcheva, \"Adam-Eve,\" or Jehovah, the son of sinful thought, not the progeny of flesh and blood.\n\nSeth, on the other hand, is the leader and the progenitor of the Races of the Earth ; for he is the son of Adam, exoterically, but esoterically he is the progeny of Cain and Abel, since Abel or Hebel is a female, the counterpart and female half of the male Cain, and Adam is the collective name for man and woman: \"male and female ( Zachar va Nakobeh ) created he them .\n\n.\n\n.\n\nand called their name Adam.\" The verses in Genesis from chs.\n\ni.\n\nto v., are purposely mixed up for Kabalistic reasons.\n\nAfter MAN of [[Footnote(s)]] ------------------------------------------------- * See \" Source of Measures ,\" p.\n\n227.\n\n** Vol.\n\nII., p.\n\n264, et seq.\n\n[[Vol.\n\n2, Page]] 128 THE SECRET DOCTRINE.\n\nGenesis ch.\n\ni.\n\n26 and Enos, Son of Man of ch.\n\niv.\n\nv."


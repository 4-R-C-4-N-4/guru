[content]
body = "\"It was rendered entirely desolate during twelve hours, as is written.\" It is in the Thirteenth (twice six and the Synthesis) that everything shall be restored \"and the six will continue.\" Thus the author of the Qabbalah remarks quite truly that \"Long before his (Ibn Gebirol's) time .\n\n.\n\n.\n\nmany centuries before the Christian era, there was in Central Asia a 'Wisdom Religion;' fragments of which subsequently existed among the learned men of the archaic Egyptians, the ancient Chinese, Hindus, etc.\n\n.\n\n.\n\n.\" and that .\n\n.\n\n.\n\n.\n\n.\n\n\"The Qabbalah most likely originally came from Aryan sources, through Central Asia, Persia, India and Mesopotamia, for from Ur and Haran came Abraham and many others into Palestine\" (p.\n\n221).\n\nAnd such was the firm conviction of C.\n\nW.\n\nKing, the author of \"The Gnostics and their Remains.\" Vamadeva Modelyar ( Modely ) describes the coming \"night\" most poetically.\n\nThough it is given in Isis Unveiled , it is worthy of repetition.\n\n\"Strange noises are heard, proceeding from every point .\n\n.\n\n.\n\nThese are the precursors of the Night of Brahma; dusk rises at the horizon , and the Sun passes away behind the thirteenth degree of Macara (sign of the Zodiac), and will reach no more the sign of the Minas (zodiacal pisces , or fish).\n\nThe gurus of the pagodas appointed to watch the rasichakr (Zodiac), may now break their circle and instruments, for they are henceforth useless.\n\n\"Gradually light pales, heat diminishes, uninhabited spots multiply on the earth, the air becomes more and more rarified; the springs of waters dry up, the great rivers see their waves exhausted, the ocean shows its sandy bottom and plants die.\n\nMen and animals decrease in size daily.\n\nLife and motion lose their force, planets can hardly gravitate in space; they are extinguished one by one, like a lamp which the hand of the chokra (servant) neglects to replenish.\n\nSurya (the Sun) flickers and goes out, matter falls into dissolution (pralaya), and Brahma merges back into Dayus, the Unrevealed God, and, his task being [[Vol.\n\n1, Page]] 377 THE PURANIC PROPHECY.\n\naccomplished, he falls asleep.\n\nAnother day is passed, night sets in, and continues until the future dawn.\n\n\"And now again he re-enters into the golden egg of His Thought, the germs of all that exist, as the divine Manu tells us.\n\nDuring His peaceful rest, the animated beings, endowed with the principles of action, cease their functions, and all feeling (manas) becomes dormant.\n\nWhen they are all absorbed in the S UPREME S OUL, this Soul of all the beings sleeps in complete repose till the day when it resumes its form, and awakes again from its primitive darkness.\"* As the \" Satya - yuga \" is always the first in the series of the four ages or Yugas, so the Kali ever comes the last.\n\nThe Kali yuga reigns now supreme in India, and it seems to coincide with that of the Western age.\n\nAnyhow, it is curious to see how prophetic in almost all things was the writer of Vishnu Purana when foretelling to Maitreya some of the dark influences and sins of this Kali Yug.\n\nFor after saying that the \"barbarians\" will be masters of the banks of the Indus, of Chandrabhaga and Kasmera, he adds: \"There will be contemporary monarchs, reigning over the earth -- kings of churlish spirit, violent temper, and ever addicted to falsehood and wickedness.\n\nThey will inflict death on women, children, and cows; they will seize upon the property of their subjects, and be intent upon the wives of others; they will be of unlimited power, their lives will be short, their desires insatiable.\n\n.\n\n.\n\n.\n\nPeople of various countries intermingling with them, will follow their example; and the barbarians being powerful (in India) in the patronage of the princes, while purer tribes are neglected, the people will perish (or, as the Commentator has it, 'The Mlechchhas will be in the centre and the Aryas in the end.')** Wealth and piety will decrease until the world will be wholly depraved.\n\nProperty alone will confer rank; wealth will be the only source of devotion; passion will be the sole bond of union between the sexes; falsehood will be the only means of success in litigation; and women will be objects merely of sensual gratification.\n\n.\n\n.\n\n.\n\n.\n\n.\n\nExternal types will be the only distinction of the several orders of life; .\n\n.\n\n.\n\n.\n\n.\n\na man if rich will be reputed pure; dishonesty ( anyaya ) will be the universal means of subsistence, weakness the cause of dependence, menace and presumption will be substituted for learning; liberality will be devotion; mutual assent, marriage; fine clothes, dignity.\n\nHe who is the strongest will reign; the people, unable to bear the heavy burthen, Khara bhara (the load of taxes) will take refuge among the valleys.\n\n.\n\n.\n\n.\n\nThus, in the Kali age will decay constantly proceed, until [[Footnote(s)]] ------------------------------------------------- * See Jacquolliot's \" Les Fils de Dieu \"; l'Inde des Brahmes, p.\n\n230.\n\n** If this is not prophetic, what is?\n\n[[Vol.\n\n1, Page]] 378 THE SECRET DOCTRINE.\n\nthe human race approaches its annihilation (pralaya) .\n\n.\n\n.\n\n.\n\nWhen the close of the Kali age shall be nigh, a portion of that divine being which exists, of its own spiritual nature .\n\n.\n\n.\n\nshall descend on Earth .\n\n.\n\n.\n\n( Kalki Avatar ) endowed with the eight superhuman faculties.\n\n.\n\n.\n\n.\n\nHe will re-establish righteousness on earth, and the minds of those who live at the end of Kali Yuga shall be awakened and become as pellucid as crystal.\n\nThe men who are thus changed .\n\n.\n\n.\n\nshall be the seeds of human beings , and shall give birth to a race who shall follow the laws of the Krita age, the age of purity.\n\nAs it is said, 'When the sun and moon and the lunar asterism Tishya and the planet Jupiter are in one mansion, the Krita (or Satya) age shall return.' \" \".\n\n.\n\n.\n\n.\n\nTwo persons, Devapi, of the race of Kuru and Moru, of the family of Ikshwaku, continue alive throughout the four ages, residing at Kalapa.* They will return hither in the beginning of the Krita age .\n\n.\n\n.\n\nMoru** the son of Sighru through the power of Yoga is still living .\n\n.\n\n.\n\n.\n\nand will be the restorer of the Kshattriya race of the Solar dynasty.\"*** ( Vayu Purana , Vol.\n\nIII, p .\n\n197)."


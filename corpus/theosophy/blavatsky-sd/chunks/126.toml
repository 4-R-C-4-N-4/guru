body = "And though it is not yet fully determined whether poisons can be generated by the animal system of living beings without the participation and interference of microbes, it is ascertained that the animal does produce venomous substances in its physiological or living state.\n\n** It might be supposed that these \"fiery lives\" and the microbes of science are identical.\n\nThis is not true.\n\nThe \"fiery lives\" are the seventh and highest subdivision of the plane of matter, and correspond in the individual with the One Life of the Universe, though only on that plane.\n\nThe microbes of science are the first and lowest sub-division on the second plane -- that of material prana (or life).\n\nThe physical body of man undergoes a complete change of structure every seven years, and its destruction and preservation are due to the alternate function of the fiery lives as \"destroyers\" and \"builders.\" They are \"builders\" by sacrificing themselves in the form of vitality to restrain the destructive influence of the microbes, and, by supplying the microbes with what is necessary, they compel them under that restraint to build up the material body and its cells.\n\nThey are \"destroyers\" also when that restraint is [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 263 PARACELSUS DIED TOO EARLY.\n\nexperimenters as Pasteur are the best friends and helpers of the Destroyers and the worst enemies of the Creators -- if the latter were not at the same time destroyers too.\n\nHowever it may be, one thing is sure in this: The knowledge of these primary causes and of the ultimate essence of every element, of its lives, their functions, properties, and conditions of change -- constitutes the basis of MAGIC.\n\nParacelsus was, perhaps, the only Occultist in Europe, during the last centuries since the Christian era, who was versed in this mystery.\n\nHad not a criminal hand put an end to his life, years before the time allotted him by Nature, physiological Magic would have fewer secrets for the civilized world than it now has.\n\n( d ) But what has the Moon to do in all this?\n\nwe may be asked.\n\nWhat have \"Fish, Sin and Moon\" in the apocalyptic saying of the Stanza to do in company with the \"Life-microbes\"?\n\nWith the latter nothing, except availing themselves of the tabernacle of clay prepared by them; with divine perfect man everything, since \"Fish, Sin and Moon\" make conjointly the three symbols of the immortal Being.\n\nThis is all that can be given.\n\nNor does the writer pretend to know more of this strange symbol than may be inferred about it from exoteric religions; from the mystery perhaps, which underlies the Matsya (fish) [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] removed and the microbes, unsupplied with vital constructive energy, are left to run riot as destructive agents .\n\nThus, during the first half of a man's life (the first five periods of seven years each) the \"fiery lives\" are indirectly engaged in the process of building up man's material body; life is on the ascending scale, and the force is used in construction and increase.\n\nAfter this period is passed the age of retrogression commences, and, the work of the \"fiery lives\" exhausting their strength, the work of destruction and decrease also commences.\n\nAn analogy between cosmic events in the descent of spirit into matter for the first half of a manvantara (planetary as human) and its ascent at the expense of matter in the second half, may here be traced.\n\nThese considerations have to do solely with the plane of matter, but the restraining influence of the \"fiery lives\" on the lowest sub-division of the second plane -- the microbes -- is confirmed by the fact mentioned in the foot-note on Pasteur ( vide supra ) that the cells of the organs, when they do not find sufficient oxygen for themselves, adapt themselves to that condition and form ferments , which, by absorbing oxygen from substances coming in contact with them, ruin the latter.\n\nThus the process is commenced by one cell robbing its neighbour of the source of its vitality when the supply is insufficient; and the ruin so commenced steadily progresses.\n\n[[Vol.\n\n1, Page]] 264 THE SECRET DOCTRINE.\n\nAvatar of Vishnu, the Chaldean Oannes -- the Man-Fish, recorded in the imperishable sign of the Zodiac, Pisces , and running throughout the two Testaments in the personages of Joshua \"Son of the Fish (Nun)\" and Jesus; the allegorical \"Sin\" or Fall of Spirit into matter, and the Moon -- in so far as it relates to the \"Lunar\" ancestors, the Pitris.\n\nFor the present it may be as well to remind the reader that while the Moon-goddesses were connected in every mythology, especially the Grecian, with child-birth, because of the lunar influence on women and conception, the occult and actual connection of our satellite with fecundation is to this day unknown to physiology, which regards every popular practice in this reference as gross superstition.\n\nAs it is useless to discuss them in detail, we may only stop at present to discuss the lunar symbology casually, to show that the said superstition belongs to the most ancient beliefs, and even to Judaism -- the basis of Christianity.\n\nWith the Israelites, the chief function of Jehovah was child-giving, and the esotericism of the Bible, interpreted Kabalistically, shows undeniably the Holy of Holies in the temple to be only the symbol of the womb.\n\nThis is now proven beyond doubt and cavil, by the numerical reading of the Bible in general, and of Genesis especially.\n\nThis idea must certainly have been borrowed by the Jews from the Egyptians and Indians, whose Holy of Holies was, and with the latter is to this day, symbolised by the King's chamber in the Great Pyramid (see \" Source of Measures \") and the Yoni symbols of exoteric Hinduism.\n\nTo make the whole clearer and to show at the same time the enormous difference in the spirit of interpretation and the original meaning of the same symbols between the ancient Eastern Occultists and the Jewish Kabalists we refer the reader to Book II., \"The Holy of Holies.\"* ------- STANZA VII.\n\n-- Continued.\n\n6.\n\nF ROM THE FIRST-BORN ( primitive , or the first man ) THE THREAD BETWEEN THE SILENT WATCHER AND HIS SHADOW BECOMES MORE [[Footnote(s)]] ------------------------------------------------- * Phallic worship has developed only with the loss of the keys to the true meaning of the symbols.\n\nIt was the last and most fatal turning point from the highway of truth and divine knowledge into the side path of fiction, raised into dogma through human falsification and hierarchic ambition.\n\n[[Vol.\n\n1, Page]] 265 MAN, THE SHADOW OF HIS PROTOTYPE.\n\nSTRONG AND RADIANT WITH EVERY CHANGE ( re - incarnation ) ( a ) .\n\nT HE MORNING SUN-LIGHT HAS CHANGED INTO NOON-DAY GLORY .\n\n.\n\n.\n\n."


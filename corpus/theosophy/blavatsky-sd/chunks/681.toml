[content]
body = "The theory of the earth's rotation was met by a like opposition -- even to the martyrdom of its discoverers -- because, besides depriving our orb of its dignified central position in space, this theory produced an appalling confusion of ideas as to the Ascension -- the terms \"up\" and \"down\" being proved to be merely relative, thus complicating not a little the question of the precise locality of heaven.* According to the best modern calculations, there are no less than 500,000,000 of stars of various magnitudes, within the range of the best telescopes.\n\nAs to the distances between them, they are incalculable.\n\nIs, then, our microscopical Earth -- a \"grain of sand on an infinite sea-shore\" -- the only centre of intelligent life?\n\nOur own Sun, itself 1,300 times larger than our planet, sinks into insignificance beside that giant Sun -- Sirius, -- and the latter in its turn is dwarfed by other luminaries in infinite Space.\n\nThe self-centred conception of Jehovah as the special guardian of a small and obscure semi-nomadic tribe, is tolerable beside that which confines sentient existence to our microscopical globe.\n\nThe primary reasons were without doubt: (1) Astronomical ignorance on the part of the early Christians, coupled with an exaggerated appreciation of man's own importance -- a crude form of selfishness; and (2) the dread that, if the hypothesis of millions of other inhabited globes was accepted, the crushing rejoinder would ensue -- \"Was there then a Revelation to each world?\" involving the idea of the Son of God eternally \"going the rounds\" as it were.\n\nHappily it is now unnecessary to waste time and energy in proving the possibility of the existence of such worlds.\n\nAll intelligent persons admit it.\n\nThat which now remains to be demonstrated is, that if it is once proven that there are inhabited worlds besides our own with humanities entirely different from each other as from our own -- as maintained in the Occult [[Footnote(s)]] ------------------------------------------------- * In that learned and witty work, \"God and his Book,\" by the redoubtable \"Saladin\" of Agnostic repute, the amusing calculation that, if Christ had ascended with the rapidity of a cannon ball, he would not have reached even Sirius yet, reminds one vividly of the past.\n\nIt raises, perhaps, a not ill-founded suspicion that even our age of scientific enlightenment may be as grossly absurd in its materialistic negations, as the men of the middle ages were absurd and materialistic in their religious affirmations.\n\n[[Vol.\n\n2, Page]] 709 SCIENCE AND OCCULTISM MAY YET AGREE.\n\nSciences -- then the evolution of the preceding races is half proved.\n\nFor where is that physicist or geologist who is prepared to maintain that the Earth has not changed scores of times, in the millions of years which have elapsed in the course of its existence; and changing its \"skin,\" as it is called in Occultism, that the Earth has not had each time her special humanities adapted to such atmospheric and climatic conditions as were entailed.\n\nAnd if so, why should not our preceding four and entirely different mankinds have existed and thrived before our Adamic (Fifth Root) Race?\n\nBefore closing our debates, however, we have to examine the so-called organic evolution more closely.\n\nLet us search well and see whether it is quite impossible to make our Occult data and chronology agree up to a certain point with those of Science.\n\n------- [[This page continued in next section]]"


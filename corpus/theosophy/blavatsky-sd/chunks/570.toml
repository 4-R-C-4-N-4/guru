[content]
body = "Michael is the angel in the Vision, the Son of God, \"who was like unto a Son of Man.\" It is the Hermes-Christos of the Gnostics, the Anubis-Syrius of the Egyptians, the Counsellor of Osiris in Amenti, the Michael leontoid [[ ophiomorphos ]] of the Ophites, who wears on certain Gnostic jewels a lion head, like his father Ildabaoth.\n\n(See King's Gnostics .) Now to all this the Roman Catholic Church consents tacitly, many of her writers avowing it publicly.\n\nAnd, unable to deny the flagrant \"borrowing\" of their Church, who \"spoilt\" the symbols of her seniors, as the Jews had \"spoilt\" the Egyptians of their jewels of silver and gold, they explain the fact quite coolly and as seriously.\n\nThus the writers who were hitherto timid enough to see, in this repetition by Christian dogmas of old Pagan ideas, \"a legendary plagiarism perpetrated by man,\" are gravely assured that, far from such a simple solution of the almost perfect resemblance, it has to be attributed to quite another cause: \"to a prehistorical plagiarism, of a superhuman origin.\" If the reader would know how, he must kindly turn to the same fifth volume of de Mirville's work.\n\nPlease note that this author was the official and recognised defender of the Roman Church, and was helped by the learning of all the Jesuits.\n\nOn page 518 we read: -- \"We have pointed out several demi-gods, and also very historical heroes of the pagans, who were predestined from the moment of their birth, to ape while dishonouring it, the nativity of the hero, who was quite God, before whom the whole earth had to bow; we traced them being born as he was, from an immaculate mother; we saw them strangling serpents in their cradles, fighting against demons, performing miracles, dying as martyrs, descending to the nether world and rising again from the dead.\n\nAnd we have bitterly deplored that timid and shy Christians should feel compelled to explain all such identities on the ground of [[Vol.\n\n2, Page]] 482 THE SECRET DOCTRINE.\n\ncoincidence of myth and symbol.\n\nThey forgot apparently these words of the Saviour: ' A LL THAT CAME BEFORE ME ARE THIEVES AND ROBBERS,' a word which explains all without any absurd negation and which I commented in these words 'The Evangel is a sublime drama, parodied and played before its appointed time by ruffians.\n\n' \" The \"ruffians\" ( les droles ) , are of course demons whose manager is Satan.\n\nNow this is the easiest and the most sublime and simple way of getting out of the difficulty!\n\nThe Rev.\n\nDr.\n\nLundy, a Protestant de Mirville, followed the happy suggestion in his \"Monumental Christianity,\" and so did Dr.\n\nSepp of Munich in his works written to prove the divinity of Jesus and the Satanic origin of all other Saviours.\n\nSo much greater the pity that a systematic and collective plagiarism, which went on for several centuries on the most gigantic scale, should be explained by another plagiarism, this time in the fourth Gospel.\n\nFor the sentence quoted from it, \"All that ever came before me, etc.,\" is a verbatim repetition of words written in the \"Book of Enoch\" lxxxix.\n\nIn the Introduction to Archbishop Lawrence's translation of it from an Ethiopic MS .\n\nin the Bodleian Library, the editor, author of the \"Evolution of Christianity,\" remarks: -- \"In revising the proof-sheets of the Book of Enoch .\n\n.\n\n.\n\n.\n\n.\n\nthe parable of the sheep, rescued by the good Shepherd from hireling guardians and ferocious wolves, is obviously borrowed by the fourth Evangelist from Enoch, lxxxix., in which the author depicts the shepherds as killing .\n\n.\n\n.\n\nthe sheep before the advent of their Lord, and thus discloses the true meaning of that hitherto mysterious passage in the Johannine parable -- 'All that ever came before me are thieves and robbers' -- language in which we now detect an obvious reference to the allegorical shepherds of Enoch.\" It is too late in the day to claim that it is Enoch who borrowed from the New Testament, instead of vice versa.\n\nJude (14-15) quotes verbatim from Enoch a long passage about the coming of the Lord with his 10,000 saints, and naming specifically the prophet, acknowledges the source.\n\nThis \"parallelism between prophet and apostle, have placed beyond controversy that, in the eyes of the author of an Epistle accepted as divine revelation, the Book of Enoch was the inspired production of an antediluvian patriarch .\n\n.\n\n.\n\n\" and further \" .\n\n.\n\n.\n\nthe cumulative coincidence of language and ideas in Enoch and the authors of N.T .\n\nScripture, .\n\n.\n\n.\n\nclearly indicates that the work of the Semitic Milton was the inexhaustible source from which Evangelists and Apostles, or the men who wrote in their names, borrowed their conceptions of the resurrection, judgment, immortality, perdition, and of the universal reign of righteousness under the eternal dominion of the Son of Man.\n\nThis Evangelical plagiarism culminates in the Revelation of John, which adapts the visions [[Vol.\n\n2, Page]] 483 VEDAS, ONCE UNIVERSAL.\n\nof Enoch to Christianity, with modifications in which we miss the sublime simplicity of the great Master of apocalyptic prediction , who prophesied in the name of the antediluvian Patriarch.\" ( I NT.\n\nxxxv.) \"Antediluvian,\" truly; but if the phraseology of the text dates hardly a few centuries or even millenniums before the historical era, then it is no more the original prediction of the events to come, but, in its turn, a copy of some scripture of a prehistoric religion.\n\n.\n\n.\n\n.\n\n.\n\n\"In the Krita age, Vishnu, in the form of Kapila and other (inspired sages) .\n\n.\n\n.\n\nimparts to the world true wisdom as Enoch did.\n\nIn the Treta age he restrains the wicked, in the form of a universal monarch (the Chakravartin or the 'Everlasting King' of Enoch*) and protects the three worlds (or races).\n\nIn the Dwapara age, in the person of Veda-Vyasa, he divides the one Veda into four, and distributes it into hundreds ( Sata ) of branches.\" Truly so; the Veda of the earliest Aryans, before it was written, went forth into every nation of the Atlanto-Lemurians, and sowed the first seeds of all the now existing old religions.\n\nThe off-shoots of the never dying tree of wisdom have scattered their dead leaves even on Judaeo-Christianity.\n\nAnd at the end of the Kali, our present age, Vishnu, or the \"Everlasting King\" will appear as Kalki, and re-establish righteousness upon earth."


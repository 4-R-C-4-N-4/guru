body = "I T CREATED \" S ONS OF W ILL AND Y OGA,\" BY K RIYASAKTI IT CREATED THEM, THE H OLY F ATHERS, A NCESTORS OF THE A RHATS.\n\n.\n\n------- VIII.\n\n28.\n\nF ROM THE DROPS OF SWEAT; FROM THE RESIDUE OF THE SUBSTANCE; MATTER FROM DEAD BODIES OF MEN AND ANIMALS OF THE WHEEL BEFORE; AND FROM CAST-OFF DUST, THE FIRST ANIMALS WERE PRODUCED.\n\n29.\n\nA NIMALS WITH BONES, DRAGONS OF THE DEEP, AND FLYING S ARPAS WERE ADDED TO THE CREEPING THINGS.\n\nT HEY THAT CREEP ON THE GROUND GOT WINGS.\n\nT HEY OF THE LONG NECKS IN THE WATER BECAME THE PROGENITORS OF THE FOWLS OF THE AIR.\n\n30.\n\nD URING THE THIRD R ACE THE BONELESS ANIMALS GREW AND CHANGED: THEY BECAME ANIMALS WITH BONES, THEIR C HHAYAS BECAME SOLID.\n\n31.\n\nT HE ANIMALS SEPARATED THE FIRST.\n\nT HEY BEGAN TO BREED.\n\nT HE TWO-FOLD MAN SEPARATED ALSO.\n\nH E SAID: \" L ET US AS THEY; LET US UNITE AND MAKE CREATURES.\" T HEY DID.\n\n32.\n\nA ND THOSE WHICH HAD NO SPARK TOOK HUGE SHE-ANIMALS UNTO THEM.\n\nT HEY BEGAT UPON THEM DUMB R ACES.\n\nD UMB THEY WERE THEMSELVES.\n\nB UT THEIR TONGUES UNTIED.\n\nT HE TONGUES OF THEIR PROGENY REMAINED STILL.\n\nM ONSTERS THEY BRED.\n\nA RACE OF CROOKED RED-HAIR-COVERED MONSTERS GOING ON ALL FOURS.\n\nA DUMB RACE TO KEEP THE SHAME UNTOLD.\n\n[[Vol.\n\n2, Page]] 20 THE SECRET DOCTRINE.\n\nIX.\n\n33.\n\nS EEING WHICH, THE L HAS WHO HAD NOT BUILT MEN, WEPT, SAYING: -- 34.\n\n\" T HE A MANASA HAVE DEFILED OUR FUTURE ABODES.\n\nT HIS IS K ARMA.\n\nL ET US DWELL IN THE OTHERS.\n\nL ET US TEACH THEM BETTER, LEST WORSE SHOULD HAPPEN.\n\nT HEY DID .\n\n.\n\n.\n\n.\n\n35.\n\nT HEN ALL MEN BECAME ENDOWED WITH M ANAS.\n\nT HEY SAW THE SIN OF THE MINDLESS.\n\n36.\n\nT HE F OURTH R ACE DEVELOPED SPEECH.\n\n37.\n\nT HE O NE BECAME T WO; ALSO ALL THE LIVING AND CREEPING THINGS THAT WERE STILL ONE, GIANT FISH-BIRDS AND SERPENTS WITH SHELL-HEADS.\n\n------- X.\n\n38.\n\nT HUS TWO BY TWO ON THE SEVEN ZONES, THE T HIRD R ACE GAVE BIRTH TO THE F OURTH- R ACE MEN; THE GODS BECAME NO-GODS; THE SURA BECAME A-SURA.\n\n39.\n\nT HE FIRST, ON EVERY ZONE, WAS MOON-COLOURED; THE SECOND YELLOW LIKE GOLD; THE THIRD RED; THE FOURTH BROWN, WHICH BECAME BLACK WITH SIN.\n\nT HE FIRST SEVEN HUMAN SHOOTS WERE ALL OF ONE COMPLEXION.\n\nT HE NEXT SEVEN BEGAN MIXING.\n\n40.\n\nT HEN THE F OURTH BECAME TALL WITH PRIDE.\n\nW E ARE THE KINGS, IT WAS SAID; WE ARE THE GODS.\n\n41.\n\nT HEY TOOK WIVES FAIR TO LOOK UPON.\n\nW IVES FROM THE MINDLESS, THE NARROW-HEADED.\n\nT HEY BRED MONSTERS.\n\nW ICKED DEMONS, MALE AND FEMALE, ALSO K HADO (DAKINI), WITH LITTLE MINDS.\n\n42.\n\nTHEY BUILT TEMPLES FOR THE HUMAN BODY.\n\nM ALE AND FEMALE THEY WORSHIPPED.\n\nT HEN THE T HIRD E YE ACTED NO LONGER.\n\n------- XI.\n\n43.\n\nT HEY BUILT HUGE CITIES.\n\nO F RARE EARTHS AND METALS THEY BUILT, AND OUT OF THE FIRES VOMITED, OUT OF THE WHITE STONE OF [[Vol.\n\n2, Page]] 21 THE SLOKAS OF \"DZYAN.\" THE MOUNTAINS AND OF THE BLACK STONE, THEY CUT THEIR OWN IMAGES IN THEIR SIZE AND LIKENESS, AND WORSHIPPED THEM.\n\n44.\n\nT HEY BUILT GREAT IMAGES NINE YATIS HIGH, THE SIZE OF THEIR BODIES.\n\nI NNER FIRES HAD DESTROYED THE LAND OF THEIR FATHERS.\n\nT HE WATER THREATENED THE FOURTH.\n\n45.\n\nT HE FIRST GREAT WATERS CAME.\n\nT HEY SWALLOWED THE SEVEN GREAT ISLANDS.\n\n46.\n\nA LL H OLY SAVED, THE U NHOLY DESTROYED.\n\nW ITH THEM MOST OF THE HUGE ANIMALS, PRODUCED FROM THE SWEAT OF THE EARTH.\n\n------- XII.\n\n47.\n\nF EW MEN REMAINED: SOME YELLOW, SOME BROWN AND BLACK, AND SOME RED REMAINED.\n\nT HE MOON-COLOURED WERE GONE FOREVER.\n\n48.\n\nT HE FIFTH PRODUCED FROM THE H OLY STOCK REMAINED; IT WAS RULED OVER BY THE FIRST DIVINE K INGS.\n\n49.\n\n.\n\n.\n\n.\n\n.\n\nW HO RE-DESCENDED, WHO MADE PEACE WITH THE FIFTH, WHO TAUGHT AND INSTRUCTED IT.\n\n.\n\n.\n\n.\n\n.\n\n."


body = "First from ONE emanated number TWO, or Air, the creative element; and then number THREE, Water , proceeded from the air; Ether or Fire complete the mystic four, the Arba-il.\n\n(Ibid.) In the Eastern doctrine Fire is the first Element -- Ether , synthesizing the whole (since it contains all of them).\n\nIn the Vishnu Purana , the whole seven periods are given, and the progressive Evolution of \"Spirit-Soul,\" and of the seven forms of matter (or principles) are shown.\n\nIt is impossible to enumerate them in this work.\n\nThe reader is asked to peruse one of the Puranas.\n\n\"R.\n\nYehudah began, it is written: 'Elohim said: Let there be a firmament, in the midst of waters.\n\n.\n\n.\n\n.\n\n.\n\nAt the time that the Holy .\n\n.\n\n.\n\ncreated the world, He (they) created seven heavens Above.\n\nHe created seven earths Below, seven seas, seven days, seven rivers, seven weeks, seven years, seven times, and 7,000 years that the world has been.\n\n.\n\n.\n\n.\n\n.\n\nthe seventh of all the millennium.\n\nSo here are seven earths Below, they are all inhabited except those which are above, and those .\n\n.\n\n.\n\n.\n\nbelow.\n\nAnd .\n\n.\n\n.\n\n.\n\nbetween each earth, a heaven (firmament) is spread out between each other.\n\n.\n\n.\n\n.\n\n.\n\nAnd there are in them (these earths) creatures who look different from each other .\n\n.\n\n.\n\n.\n\nbut if you object and say that all the children of the world came out from Adam, [[Vol.\n\n1, Page]] 448 THE SECRET DOCTRINE.\n\nit is not so.\n\n.\n\n.\n\n.\n\n.\n\nAnd the lower earths, where do they come from?\n\nThey are from the chain of the earth , and from the heaven below,\" etc., etc.* Irenaeus is our witness (and a very unwilling one, too) that the Gnostics taught the same system, veiling very carefully the true esoteric meaning.\n\nThis \"veiling,\" however, is identical with that of the Vishnu Purana and others.\n\nThus Irenaeus writes of the Marcosians: \"They maintain that first of all the four elements, fire, water, earth and air, were produced after the image of the primary tetrad above, and that then if we add their operations, namely, heat, cold, dryness and moisture, an exact likeness of the ogdoad is presented.\" (B.\n\ni.\n\nch.\n\nxvii.) Only this \"likeness\" and the ogdoad itself is a blind, just as in the seven creations of the Vishnu Puranas, to which two more are added of which the eighth, termed Anugraha, \"possesses both the qualities of goodness and darkness,\" a Sankhyan more than a Puranic idea.\n\nFor Irenaeus says again (b.\n\nI.\n\nxxx.\n\n6) that \"they (the Gnostics) had a like eighth creation which was good and bad, divine and human.\n\nThey affirm that man was formed on the eighth day .\n\nSometimes they affirm that he was made on the sixth day , and at others on the eighth; unless, perchance, they mean that his earthly part was formed on the sixth day and his fleshly part (?) on the eighth day; these two being distinguished by them.\" They were so \"distinguished,\" but not as Irenaeus gives it.\n\nThe Gnostics had a superior Hebdomad , and an inferior one, in Heaven; and a third terrestrial Hebdomad , on the plane of matter.\n\nI AO, the mystery god and the Regent of the Moon, as given in Origen's chart, was the chief of these superior \" Seven Heavens ,\"** hence identical with the chief of the lunar Pitris, that name being given by them to the lunar Dhyan-Chohans.\n\n\"They affirm that these seven heavens are intelligent, and speak of them as being angels ,\" writes the same Irenaeus; and adds that on this account they termed Iao Hebdomas, while his mother was called \" Ogdoas ,\" because, as he explains, \"she preserved the number of the first begotten and primary Ogdoad of the Pleroma.\n\n\" (Ibid.\n\nb.\n\nI, v.\n\n2).\n\nThis \"first begotten Ogdoad \" was ( a ) in theogony the second Logos (the manifested) because he was born of the Seven-fold first Logos , hence he is the eighth on this manifested plane; and ( b ) in astrolatry, it was the Sun , Marttanda -- the eighth son of Aditi, whom she rejects while preserving her Seven Sons, the planets.\n\nFor the ancients have never regarded the Sun as a planet, but as a central and fixed Star.\n\nThis, then, is the second Hebdomad born of the Seven-rayed one, Agni, the Sun [[Footnote(s)]] ------------------------------------------------- * Qabbalah, p.\n\n415-16, by T.\n\nMyer, Philadelphia.\n\n** Superior to the Spirits or \"Heavens\" of the Earth only.\n\n[[Vol.\n\n1, Page]] 449 THE SIX STELLAR GODS.\n\nand what not, only not the seven planets, which are Surya's brothers , not his Sons.\n\nThese Astral gods, whose chief with the Gnostics was Ildabaoth* (from Ilda \"child,\" and Baoth \"the egg\"), the son of Sophia Achamoth, the daughter of Sophia (Wisdom), whose region is the Pleroma, were his (Ildabaoth's) sons.\n\nHe produces from himself these six stellar spirits: Jove (Jehovah), Sabaoth , Adonai , Eloi , Osraios , Astaphaios , ** and it is they who are the second, or inferior Hebdomad.\n\nAs to the third, it is composed of the seven primeval men, the shadows of the lunar gods, projected by the first Hebdomad.\n\nIn this the Gnostics did not, as seen, differ much from the esoteric doctrine except that they veiled it.\n\nAs to the charge made by Irenaeus, who was evidently ignorant of the true tenets of the \"Heretics,\" with regard to man being created on the sixth day, and man being created on the eighth , this relates to the mysteries of the inner man.\n\nIt will become comprehensible to the reader only after he has read Book II., and understood well the Anthropogenesis of the Esoteric doctrine.\n\nIldabaoth is a copy of Manu.\n\nThe latter boasts, \"Oh, best of twice-born men!\n\nKnow that I (Manu) am he, the creator of all this world, whom that male Viraj .\n\n.\n\n.\n\nspontaneously produced\" (I., 33).\n\nHe first creates the ten lords of Being, the Prajapatis, who, as verse 36 says .\n\n.\n\n.\n\n\"produce seven other Manus.\" ( The Ordinances of Manu.\n\n) Ildabaoth does likewise: \"I am Father and God, and there is no one above me,\" he exclaims."


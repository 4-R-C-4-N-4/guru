body = "But they are as rare as their language is unintelligible.\n\nSo far, one or two European archaeologists only have been able to procure such priceless works.\n\n[[Vol.\n\n2, Page]] 281 THE SEVEN VIRGIN-YOUTHS.\n\n\" according to our ancient documents, had, owing to the beguilements of Tchy-Yeoo, troubled all the earth, it became full of brigands.\n\n.\n\n.\n\n.\n\n.\" The Lord Chang-ty (a king of the divine dynasty) saw that his people had lost the last vestiges of virtue.\n\nThen he commanded Tehong and Lhy (two lower Dhyan Chohans) to cut away every communication between heaven and earth.\n\nSince then, there was no more going up and down!\n\n\" ** \"Going up and down\" means an untrammelled communication and intercourse between the two worlds.\n\nNot being in a position to give out a full and detailed history of the Third and Fourth Races, as many isolated facts concerning them as are permitted must be now collated together; especially those corroborated by direct as well as by inferential evidence found in ancient literature and history.\n\nAs the \"coats of skin\" of men thickened, and they fell more and more into physical sin, the intercourse between physical and ethereal divine man was stopped.\n\nThe veil of matter between the two planes became too dense for even the inner man to penetrate.\n\nThe mysteries of Heaven and Earth, revealed to the Third Race by their celestial teachers in the days of their purity, became a great focus of light, the rays from which became necessarily weakened as they were diffused and shed upon an uncongenial, because too material soil.\n\nWith the masses they degenerated into Sorcery, taking later on the shape of exoteric religions, of idolatry full of superstitions, and man-, or hero-worship.\n\nAlone a handful of primitive men -- in whom the spark of divine Wisdom burnt bright, and only strengthened in its intensity as it got dimmer and dimmer with every age in those who turned it to bad purposes -- remained the elect custodians of the Mysteries revealed to mankind by the divine Teachers.\n\nThere were those among them, who remained in their Kumaric condition from the beginning; and tradition whispers, what the secret teachings affirm, namely, that these Elect were the germ of a Hierarchy which never died since that period: - - \" The inner man of the first * * * only changes his body from time to time ; he is ever the same, knowing neither rest nor Nirvana, spurning Devachan and remaining constantly on Earth for the salvation of mankind .\n\n.\n\n.\n\n.\n\n.\n\n.\" \" Out of the seven virgin-men (Kumara**) four sacrificed themselves for the sins of the world and the instruction of [[Footnote(s)]] ------------------------------------------------- * Remember the same statement in the Book of Enoch, as also the ladder seen by Jacob in his dream.\n\nThe \"two worlds\" mean of course the \"two planes of Consciousness and Being.\" A seer can commune with beings of a higher plane than the earth, without quitting his arm-chair.\n\n** Vide supra the Commentary on the Four Races -- and on the \"Sons of Will and Yoga,\" the immaculate progeny of the Androgynous Third Race.\n\n[[Vol.\n\n2, Page]] 282 THE SECRET DOCTRINE.\n\nthe ignorant, to remain till the end of the present Manvantara.\n\nThough unseen, they are ever present.\n\nWhen people say of one of them, \" He is dead \"; behold, he is alive and under another form.\n\nThese are the Head, the Heart, the Soul, and the Seed of undying knowledge (Gnyana).\n\nThou shalt never speak, O Lanoo, of these great ones (Maha .\n\n.\n\n.\n\n) before a multitude, mentioning them by their names.\n\nThe wise alone will understand.\n\n\" .\n\n.\n\n.\n\n* (Catechism of the inner Schools.) It is these sacred \"Four\" who have been allegorized and symbolized in the \" Linga Purana, \" which states that Vamadeva (Siva) as Kumara is reborn in each Kalpa ( Race in this instance), as four youths -- four, white; four, red; four, yellow; and four, dark or brown.\n\nLet us remember that Siva is pre-eminently and chiefly an ascetic, the patron of all Yogis and Adepts, and the allegory will become quite comprehensible.\n\nIt is the spirit of Divine Wisdom and chaste asceticism itself which incarnates in these Elect.\n\nIt is only after getting married and being dragged by the gods from his terrible ascetic life, that Rudra becomes Siva, a god, and not one of a very virtuous or merciful type, in the Hindu Pantheon.\n\nHigher than the \"Four\" is only O NE on Earth as in Heavens -- that still more mysterious and solitary Being described in Book I.\n\nWe have now to examine the nature of the \"Sons of the Flame\" and of \"Dark Wisdom,\" as well as the pros and cons of the Satanic assumption.\n\nSuch broken sentences as could be made out from the fragments on the tile, which George Smith calls \"the Curse after the Fall\" (see p.\n\n81 of his \"Chaldean Account of Genesis\"), are of course allegorical; yet they corroborate that which is taught of the true nature of the fall of the angels in our Books.\n\nThus, it is said in line 12 that the \"Lord of the earth his name called out, the father Elu\" (Elohim), and pronounced his curse, which \"The God Hea heard, and his liver was angry, because his man (Angelic man) had corrupted his purity (14 and 15),\" for which Hea expresses the desire that \" ' Wisdom and knowledge ' hostilely may they injure him (man).\" The latter sentence points to the direct connection of the Chaldean with the Genetic account.\n\nWhile Hea tries to bring to nought the wisdom and knowledge gained by man, through his newly-acquired intellectual and conscious capacity of creating in his turn (thus taking the monopoly of creation out of the hands of God (the Gods)), the Elohim do the same in the third chapter of Genesis.\n\nTherefore the Elohim sent him out of Eden.\n\nBut this was of no avail.\n\nFor the spirit of divine Wisdom being [[Footnote(s)]] ------------------------------------------------- * In the Kabala the pronunciation of the four-lettered ineffable name is \"a most secret arcanum\" --- \"a secret of secrets.\" [[Vol.\n\n2, Page]] 283 THE SERPENT OF ETERNITY.\n\nupon and in man -- verily the Serpent of Eternity and all Knowledge, that Manasic spirit, which made him learn the secret of creation on the Kriyasaktic, and of procreation on the earthly planes -- led him as naturally to discover his way to immortality, notwithstanding the jealousy of all the Gods.\n\nThe early Atlanto-Lemurians are charged with taking unto themselves (divine incarnations) wives of a lower race, namely, the race of the hitherto mindless men.\n\nEvery ancient Scripture has the same, more or less disfigured legend."


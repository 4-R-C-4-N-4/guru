[content]
body = "[But Nephesh , the \"breath of [[first column continued on next page]] [[second column]] Say the Theosophists: -- E SOTERIC P NEUMATICS.\n\n1.\n\nDitto, for it is Atma-Buddhi- Manas.\n\n2.\n\nDitto.* 3.\n\nSpiritual Soul.\n\n4.\n\nMediator between Spirit and its Man, the Seat of Reason, the Mind, in man.\n\n5.\n\nCorrect.\n\n6.\n\nToo uselessly apocalyptic.\n\nWhy not say that the astral reflects the good as well as the bad man; man, who is ever tending to the upper triangle, or else disappears with the Quaternary.\n\n7.\n\nDitto, the earthly image.\n\n------- O CCULT P NEUMATICS.\n\nAs given by the Occultists.\n\n1.\n\nManas is immortal, because after every new incarnation it adds to Atma-Buddhi something of itself, and [[second column continued on next page]] [[Footnote(s)]] ------------------------------------------------- * Eliphas Levi has, whether purposely or otherwise, confused the numbers: with us his No.\n\n2 is No.\n\n1.\n\n(Spirit); and by making of Nephesch both the plastic mediator and Life, he thus makes in reality only six principles, because he repeats the first two.\n\n** Esotericism teaches the same.\n\nBut Manas is not Nephesch; nor is the latter the astral, but the 4th principle, if also the 2nd prana , for Nephesch is the \"breath of life\" in man, as in beast or insect, of physical, material life, which has no spirituality in it.\n\n[[Vol.\n\n1, Page]] 244 THE SECRET DOCTRINE.\n\n[[first column continued from last page]] life,\" is a misnomer and a useless puzzle to the student.] 2.\n\nRuach progresses by the evolution of ideas (!\n\n?).\n\n3.\n\nNeschamah is progressive without oblivion and destruction.\n\n4.\n\nThe soul has three dwellings.\n\n5.\n\nThese dwellings are: the plane of the mortals: the Superior Eden; and the Inferior Eden.\n\n6.\n\nThe image (man) is a sphinx that offers the riddle of birth.\n\n7.\n\nThe fatal image (the astral) endows Nephesch with its aptitudes; but Ruach is able to substitute for this (vitiated) Nephesch the image [[first column continued on next page]] [[second column continued from last page]] thus, assimilating itself to the Monad, shares its immortality.\n\n2.\n\nBuddhi becomes conscious by the accretions it gets from Manas after every new incarnation and the death of man.\n\n3.\n\nAtma neither progresses, forgets, nor remembers.\n\nIt does not belong to this plane: it is but the ray of light eternal which shines upon and through the darkness of matter -- when the latter is willing.\n\n4.\n\nThe Soul (collectively, as the upper Triad) lives on three planes, besides its fourth, the terrestrial sphere; and it exists eternally on the highest of the three.\n\n5.\n\nThese dwellings are: Earth for the physical man, or the animal Soul; Kama-loka (Hades, the Limbo) for the disembodied man, or his Shell; Devachan for the higher Triad.\n\n6.\n\nCorrect.\n\n7.\n\nThe astral through Kama (desire) is ever drawing Manas down into the sphere of material passions and desires.\n\nBut if the better man [[second column continued on next page]] [[Vol.\n\n1, Page]] 245 OCCULTISTS AND KABALISTS DIFFER.\n\n[[first column continued from last page]] conquered in accordance with the inspirations of Neschamah.\n\n------- [[second column continued from last page]] or Manas tries to escape the fatal attraction and turns its aspirations to Atma -- Spirit -- then Buddhi (Ruach) conquers, and carries Manas with it to the realm of eternal Spirit.\n\n------- It is very evident that the French Kabalist either did not know sufficiently the real tenet, or distorted it to suit himself and his object.\n\nThus he says again, treating upon the same subject, and we, Occultists, answer the late Kabalist and his admirers: -- [[first column]] 1.\n\nThe body is the mould of Nephesch; Nephesch the mould of Ruach; Ruach the mould of the garments of Neschamah.\n\n2.\n\nLight (the Soul) personifies in clothing itself (with a body); and personality endures only when the garment is perfect.\n\n3.\n\nThe angels aspire to become men; a perfect man, a man-god is above all the angels.\n\n4.\n\nEvery 14,000 years the soul rejuvenates and rests in the jubilean sleep of oblivion.\n\n[[second column]] 1.\n\nThe body follows the whims, good or bad, of Manas; Manas tries to follow the light of Buddhi, but often fails.\n\nBuddhi is the mould of the \"garments\" of Atma, because Atma is no body, or shape, or anything, and because Buddhi is its vehicle only figuratively.\n\n2 .\n\nThe Monad becomes a personal ego when it incarnates; and something remains of that personality through Manas, when the latter is perfect enough to assimilate Buddhi.\n\n3.\n\nCorrect.\n\n4.\n\nWithin a period, \"a great age\" or a day of Brahrna, 14 Manus reign; after which comes Pralaya when all the Souls rest in Nirvana.\n\n(Souls = Egos).\n\n[[Vol.\n\n1, Page]] 246 THE SECRET DOCTRINE.\n\nSuch are the distorted copies of the esoteric doctrine in the Kabala.\n\nBut see also \"The Primeval Manus of Humanity\" in Book II.\n\nTo return to Stanza VII.\n\n( b ) The well-known Kabalistic aphorism runs: -- \"A stone becomes a plant; a plant, a beast; the beast, a man; a man a spirit; and the spirit a god.\" The \"spark\" animates all the kingdoms in turn before it enters into and informs divine man, between whom and his predecessor, animal man, there is all the difference in the world.\n\nGenesis begins its anthropology at the wrong end (evidently for a blind) and lands nowhere.* Had it begun as it ought, one would have found in it, first, the celestial Logos, the \"Heavenly Man,\" which evolves as a Compound Unit of Logoi, out of whom after their pralayic sleep -- a sleep that gathers the cyphers scattered on the Mayavic plane into One, as the separate globules of quicksilver on a plate blend into one mass -- the Logoi appear in their totality as the first \"male and female\" or Adam Kadmon, the \"Fiat Lux\" of the Bible, as we have already seen.\n\nBut this transformation did not take place on our Earth, nor on any material plane, but in the Spacial Depths of the first differentiation of the eternal Root-matter.\n\nOn our nascent globe things proceed differently.\n\nThe Monad or Jiva, as said in \"Isis Unveiled,\" vol."


[content]
body = "It is mankind which has become the \"Serpent of Genesis,\" and thus causes daily and hourly the Fall and sin of the \"Celestial Virgin\" -- which thus becomes the Mother of gods and devils at one and the same time; for she is the ever-loving, beneficent deity to all those who stir her Soul and heart , instead of attracting to themselves her shadowy manifested essence, called by Eliphas Levi -- \"the fatal light\" which kills and destroys.\n\nHumanity, in its units, can overpower and master its effects; but only by the holiness of their lives and by producing good causes.\n\nIt has power only on the manifested lower principles -- the shadow of the Unknown and Incognizable Deity in Space.\n\nBut in antiquity and reality , Lucifer, or Luciferus , is the name of the angelic Entity presiding over the light of truth as over the light of the day.\n\nIn the great Valentinian gospel Pistis Sophia (§ 361) it is taught that of the three Powers emanating from the Holy names of the Three [[ Tridunameis ]], that of Sophia (the Holy Ghost according to these gnostics -- the most cultured of all), resides in the planet Venus or Lucifer.\n\nThus to the profane, the Astral Light may be God and Devil at once -- [[Footnote(s)]] ------------------------------------------------- * Says Johannes Tritheim, the Abbot of Spanheim, the greatest astrologer and Kabalist of his day: -- \"The art of divine magic consists in the ability to perceive the essence of things in the light of nature (astral light), and by using the soul-powers of the spirit to produce material things from the unseen universe, and in such operations the Above and the Below must be brought together and made to act harmoniously.\n\nThe spirit of Nature (astral light) is a unity, creating and forming everything, and acting through the instrumentality of man it may produce wonderful things.\n\nSuch are accomplished, if you learn to know yourself.\n\nYou will know it by the power of the spirit that is in yourself, and accomplish it by mixing your spirit with the essence that comes out of yourself.\n\nIf you wish to succeed in such a work you must know how to separate Spirit and Life in Nature, and, moreover, to separate the astral soul in yourself and to make it tangible, and then the substance of the soul will appear visibly and tangibly rendered objective by the power of the spirit.\" -- (Quoted in Dr.\n\nHartman's \"Paracelsus.\") [[Vol.\n\n2, Page]] 513 MIND, THE QUICKENING SPIRIT.\n\nDemon est Deus inversus: that is to say, through every point of Infinite Space thrill the magnetic and electrical currents of animate Nature, the life-giving and death-giving waves, for death on earth becomes life on another plane.\n\nLucifer is divine and terrestrial light, the \"Holy Ghost\" and \"Satan,\" at one and the same time, visible Space being truly filled with the differentiated Breath invisibly; and the Astral Light, the manifested effects of the two who are one, guided and attracted by ourselves, is the Karma of humanity, both a personal and impersonal entity: personal, because it is the mystic name given by St.\n\nMartin to the Host of divine Creators, guides and rulers of this planet; impersonal, as the Cause and effect of universal Life and Death.\n\nThe Fall was the result of man's knowledge, for his \"eyes were opened.\" Indeed, he was taught Wisdom and the hidden knowledge by the \"Fallen Angel,\" for the latter had become from that day his Manas, Mind and Self-consciousness.\n\nIn each of us that golden thread of continuous life -- periodically broken into active and passive cycles of sensuous existence on Earth, and super-sensuous in Devachan -- is from the beginning of our appearance upon this earth.\n\nIt is the Sutratma, the luminous thread of immortal impersonal monadship, on which our earthly lives or evanescent Egos are strung as so many beads -- according to the beautiful expression of Vedantic philosophy.\n\nAnd now it stands proven that Satan, or the Red Fiery Dragon, the \"Lord of Phosphorus\" (brimstone was a theological improvement), and Lucifer, or \"Light-Bearer,\" is in us: it is our Mind -- our tempter and Redeemer, our intelligent liberator and Saviour from pure animalism.\n\nWithout this principle -- the emanation of the very essence of the pure divine principle Mahat (Intelligence), which radiates direct from the Divine mind -- we would be surely no better than animals.\n\nThe first man Adam was made only a living soul (nephesh), the last Adam was made a quickening Spirit*: -- says Paul, his words referring to the building or Creation of man.\n\nWithout this quickening spirit, or human Mind or soul, there would be no difference between man and beast; as there is none, in fact, between animals with respect to their actions.\n\nThe tiger and the donkey, the hawk and the dove, are each one as pure and as innocent as the other, because irresponsible.\n\nEach follows its instinct, the tiger and the hawk killing with the same unconcern as the donkey eats a thistle, or the dove pecks at a grain of corn.\n\nIf the Fall had the significance given to it by theology; if that [[Footnote(s)]] ------------------------------------------------- * The real original text of I Corinthians, rendered Kabalistically and esoterically would read ( in Chap.\n\nxv ., verses 44 and 45): \"It is sown a soul body (not 'natural' body), it is raised a spirit body.\" St.\n\nPaul was an Initiate, and his words have quite a different meaning when read esoterically.\n\nThe body \"is sown in weakness (passivity); it is raised in power\" (43) -- or in spirituality and intellect.\n\n[[Vol.\n\n2, Page]] 514 THE SECRET DOCTRINE.\n\nfall occurred as a result of an act never intended by nature, -- a sin, how about the animals?\n\nIf we are told that they procreate their species in consequence of that same \"original sin,\" for which God cursed the earth -- hence everything living on it -- we will put another question.\n\nWe are told by theology, as by Science, that the animal was on earth far earlier than man?\n\nWe ask the former: How did it procreate its species, before the fruit of the Tree of Knowledge, of the Good and the Evil, had been plucked off?"


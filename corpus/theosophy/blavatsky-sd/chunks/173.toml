body = "These four \"animals\" may be seen in many of the Roman Catholic New Testaments where the portraits of the evangelists are given.\n\nThey are the animals of Ezekiel's Mercabah.\n\nAs truly stated by Ragon, \"the ancient Hierophants have combined so cleverly the dogmas and symbols of their religious philosophies, that these symbols can be fully explained only by the combination and knowledge of all the keys.\" They can be only approximately interpreted, even if one finds out three out of these seven systems: the anthropological , the psychic , and the astronomical.\n\nThe two chief interpretations, the highest and the lowest, the spiritual and the physiological, they preserved in the greatest secrecy until the latter fell into the dominion of the profane.\n\nThus far, with regard only to the pre-historic Hierophants, with whom that which has now become purely (or impurely) phallic, was a science as profound and as mysterious as biology and physiology are now.\n\nThis was their exclusive property, the fruit of their studies and discoveries.\n\nThe other two were those which dealt with the creative gods (theogony), and with creative man, i.e.\n\n, the ideal and the practical mysteries.\n\nThese interpretations were so cleverly veiled and combined, that many were those who, while arriving at the discovery of one meaning, were baffled in understanding the significance of the others, and could never unriddle them sufficiently to commit dangerous indiscretions.\n\nThe highest, the first and the fourth -- theogony in relation to anthropogony -- were almost impossible to fathom.\n\nWe find the proofs of this in the Jewish \"Holy Writ.\" It is owing to the serpent being oviparous, that it became a symbol of wisdom and an emblem of the Logoi, or the self-born.\n\nIn the temple of Philoe in Upper Egypt, an egg was artificially prepared of clay made of [[Vol.\n\n1, Page]] 364 THE SECRET DOCTRINE.\n\nvarious incenses, and it was made to hatch by a peculiar process, when a cerastes (the horned viper) was born.\n\nThe same was done in antiquity for the cobra in the Indian temples.\n\nThe creative God emerges from the egg that issues from the mouth of Kneph -- as a winged serpent -- because the Serpent is the symbol of the All-wisdom.\n\nWith the Hebrews he is glyphed by the \"flying or fiery serpents\" of the Wilderness and Moses, and with the Alexandrian mystics he becomes the Ophio-Christos, the Logos of the Gnostics.\n\nThe Protestants try to show that the allegory of the Brazen Serpent and of the \"fiery serpents\" has a direct reference to the mystery of Christ and Crucifixion*; but it has a far nearer relation, in truth, to the mystery of generation , when dissociated from the egg with the central germ, or the circle with its central point.\n\nThe brazen Serpent had no such holy meaning as that; nor was it, in fact, glorified above the \" fiery serpents \" for the bite of which it was only a natural remedy.\n\nThe symbological meaning of the word \"brazen\" being the feminine principle, and that of fiery, or \"gold,\" the male one.** In the Book of the Dead , as just shown, reference is often made to the Egg.\n\nRa, the mighty one, remains in his Egg, during the struggle between the \"children of the rebellion\" and Shoo (the Solar Energy and the Dragon of Darkness) (ch.\n\nxvii.).\n\nThe deceased is resplendent in his [[Footnote(s)]] ------------------------------------------------- * And this only because the brazen serpent was lifted on a pole!\n\nIt had rather a reference to Mico the Egyptian egg standing upright supported by the sacred Tau; since the Egg and the Serpent are inseparable in the old worship and symbology of Egypt, and since both the Brazen and \"fiery\" serpents were Saraphs , the \"burning fiery\" messengers, or the serpent Gods, the nagas of India.\n\nIt was a purely phallic symbol without the egg, while when associated with it -- it related to cosmic creation.\n\n** \"Brass was a metal symbolizing the nether world .\n\n.\n\n.\n\n.\n\nthat of the womb where life should be given .\n\n.\n\n.\n\nThe word for serpent was in Hebrew Nakash , but this is the same term for brass.\n\n\" It is said in Numbers (xxi.) that the Jews complained of the Wilderness where there was no water ( v .\n\n5); after which \"the Lord sent fiery serpents\" to bite them, when, to oblige Moses, he gives him as a remedy the brazen serpent on a pole to look at; after which \"any man when he beheld the serpent of brass .\n\n.\n\n.\n\n.\n\nlived \" (?).\n\nAfter that the \"Lord,\" gathering the people together at the well of Beer, gives them water, (14-16), and grateful Israel sang this song, \"Spring up, O Well,\" ( v .\n\n17).\n\nWhen, after studying symbology, the Christian reader comes to understand the innermost meaning of these three symbols -- water , brazen , the serpent , and a few more -- in the sense given to them in the Holy Bible , he will hardly like to connect the sacred name of his Saviour with the \"Brazen Serpent\" incident.\n\nThe Seraphim (fiery winged serpents) are no doubt connected with, and inseparable from, the idea \"of the serpent of eternity -- God,\" as explained in Kenealy's Apocalypse.\n\nBut the word cherub also meant serpent, in one sense, though its direct meaning is different; because the Cherubim and the Persian winged [[ gruphes ]] \"griffins\" -- the guardians of the golden mountain -- are the same, and their compound name shows their character, as it is formed of (kr) circle , and \"aub,\" or ob -- serpent -- therefore, a \"serpent in a circle.\" And this settles the phallic character of the Brazen Serpent, and justifies Hezekiah for breaking it.\n\n( See II.\n\nKings , 18, 4).\n\nVerbum sat.\n\nsapienti.\n\n[[Vol.\n\n1, Page]] 365 THE WINGED GLOBE.\n\nEgg when he crosses to the land of mystery (xxii.\n\ni.).\n\nHe is the Egg of Seb (liv.\n\n1-3).\n\n.\n\n.\n\n.\n\nThe Egg was the symbol of life in immortality and eternity; as also the glyph of the generative matrix; and the tau , associated with it, only of life and birth in generation.\n\nThe Mundane Egg was placed in Khnoom , the \"Water of Space,\" or the feminine abstract principle (Khnoom becoming, with the fall of mankind into generation and phallicism, Ammon, the creative God); and when Phtah , the \"fiery god,\" carries the Mundane egg in his hand, then the symbolism becomes quite terrestrial and concrete in its significance."


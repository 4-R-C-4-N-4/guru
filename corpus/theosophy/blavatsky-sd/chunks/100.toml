[content]
body = "This is what she described in one of her experiments; with a particle of a meteorite placed on her forehead, in an envelope, the lady, not being aware of what it contained, said: \"What a difference between that which we recognise as matter here and that which seems like matter there!\n\nIn the one, the elements are so coarse and so angular , I wonder that we can endure it all, much more that we can desire to continue our present relations to it; in the other, all the elements are so refined, they are so free from those great, rough angularities, which characterize the elements here, that I can but regard that as by so much the more than this, the real existence.\" ( Vol.\n\nIII.\n\np.\n\n345-6.) ** When carefully analysed and reflected upon, this will be found as scientific as Science could make it, even at our late period.\n\n[[Vol.\n\n1, Page]] 202 THE SECRET DOCTRINE.\n\nWe have been assured that there exist several modern works of speculative fancy upon such struggles for life in sidereal heaven, especially in the German language.\n\nWe rejoice to hear it, for ours is an Occult teaching lost in the darkness of archaic ages.\n\nWe have treated of it fully in \" Isis Unveiled ,\" and the idea of Darwinian-like evolution, of struggle for life and supremacy, and of the \"survival of the fittest\" among the Hosts above as the Hosts below, runs throughout both the volumes of our earlier work, written in 1876 ( See Index in \" Isis Unveiled \" at the words \" Evolution \" -- \" Darwin \" -- \" Kapila \" -- \" Battle of Life ,\" etc.\n\netc.\n\n) But the idea was not ours, it is that of antiquity.\n\nEven the Puranic writers have ingeniously interwoven allegory with Cosmic facts and human events.\n\nAny symbologist may discern the astro-cosmical allusion even though he be unable to grasp the whole meaning.\n\nThe great \"Wars in Heaven,\" in the Puranas; the wars of the Titans, in Hesiod and other classical writers; the \"struggles,\" also in the Egyptian legend between Osiris and Typhon, and even those in the Scandinavian legends, all refer to the same subject.\n\nNorthern Mythology refers to it as the battle of the Flames, the sons of Muspel who fought on the field of Wigred.\n\nAll these relate to Heaven and Earth, and have a double and often even a triple meaning, and esoteric application to things above as to things below.\n\nThey relate severally to astronomical, theogonical and human struggles; to the adjustment of orbs, and the supremacy among nations and tribes.\n\nThe \"Struggle for Existence\" and the \"Survival of the Fittest\" reigned supreme from the moment that Kosmos manifested into being, and could hardly escape the observant eye of the ancient Sages.\n\nHence the incessant fights of Indra, the god of the Firmament, with the Asuras -- degraded from high gods into Cosmic demons; and with Vritri or Ah-hi; the battles fought between stars and constellations, between Moon and planets -- later on incarnated as kings and mortals.\n\nHence also the War in Heaven of Michael and his Host against the Dragon (Jupiter and Lucifer-Venus), when a third of the stars of the rebellious host was hurled down into Space, and \"its place was found no more in Heaven.\" As said long ago -- \"This is the basic and fundamental stone of the secret cycles.\n\nIt shows that the Brahmins and Tanaim .\n\n.\n\n.\n\nspeculated on the creation and development of the world quite in a Darwinian way, both anticipating him and his school in the natural selection of species, the survival of the fittest, [[Vol.\n\n1, Page]] 203 THE BIRTH OF THE WORLDS.\n\nand transformation.\n\n.\n\n.\n\n.\n\nThere were old worlds that perished conquered by the new,\" etc., etc.\n\n(\" Isis Unveiled ,\" Vol.\n\nII.\n\n, p.\n\n260.) The assertion that all the worlds (Stars, planets, etc.) -- as soon as a nucleus of primordial substance in the laya (undifferentiated) state is informed by the freed principles, of a just deceased sidereal body -- become first comets, and then Suns to cool down to inhabitable worlds, is a teaching as old as the Rishis.\n\nThus the Secret Books distinctly teach, as we see, an astronomy that would not be rejected even by modern speculation could the latter thoroughly understand its teachings.\n\nFor, archaic astronomy, and the ancient, physical and mathematical sciences, expressed views identical with those of modern science, and many of far more momentous import.\n\nA \"struggle for life\" as a \"survival of the fittest\" in the worlds above, as on our planet here below, are distinctly taught.\n\nThis teaching, however, although it would not be \"entirely rejected\" by Science, is sure to be repudiated as an integral whole.\n\nFor it avers that there are only seven Self-born primordial \"gods\" emanated from the trinitarian ONE.\n\nIn other words, it means that all the worlds or sidereal bodies (always on strict analogy) are formed one from the other, after the primordial manifestation at the beginning of the \"Great Age\" is accomplished.\n\nThe birth of the celestial bodies in Space is compared to a crowd or multitude of \"pilgrims\" at the festival of the \"Fires.\" Seven ascetics appear on the threshold of the temple with seven lighted sticks of incense.\n\nAt the light of these the first row of pilgrims light their incense sticks.\n\nAfter which every ascetic begins whirling his stick around his head in space, and furnishes the rest with fire.\n\nThus with the heavenly bodies.\n\nA laya-centre is lighted and awakened into life by the fires of another \"pilgrim,\" after which the new \"centre\" rushes into space and becomes a comet.\n\nIt is only after losing its velocity, and hence its fiery tail, that the \"Fiery Dragon\" settles down into quiet and steady life as a regular respectable citizen of the sidereal family.\n\nTherefore it is said: -- Born in the unfathomable depths of Space, out of the homogeneous Element called the World-Soul, every nucleus of Cosmic matter, suddenly launched into being, begins life under the most hostile circumstances.\n\nThrough a series of countless ages, it has to conquer [[Vol.\n\n1, Page]] 204 THE SECRET DOCTRINE.\n\nfor itself a place in the infinitudes.\n\nIt circles round and round between denser and already fixed bodies, moving by jerks, and pulling towards some given point or centre that attracts it, trying to avoid, like a ship drawn into a channel dotted with reefs and sunken rocks, other bodies that draw and repel it in turn; many perish, their mass disintegrating through stronger masses, and, when born within a system, chiefly within the insatiable stomachs of various Suns.\n\n( See Comm.\n\nto Stanza IV ) .\n\nThose which move slower and are propelled into an elliptic course are doomed to annihilation sooner or later."


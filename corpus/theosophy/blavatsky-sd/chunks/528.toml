[content]
body = "They are ever speaking of, and describing the mountains of Kaf (Kafaristan?), which contain a gallery built by the giant Argeak, wherein the statues of the ancient men under all their forms are preserved.\n\nThey call them Sulimans (Solomons), or the wise kings of the East, and count seventy-two kings of that name.* Three among them reigned for 1,000 years each.\n\n( Herbelot, p.\n\n829.) Siamek, the beloved son of Kaimurath (Adam), their first king, died murdered by his giant brother.\n\nThe father had a perpetual fire preserved on the tomb which contained his cremated ashes; hence -- the origin of fire-worship, as some Orientalists think.\n\nThen came Huschenk, the prudent and the wise.\n\nIt was his dynasty which re-discovered metals and precious stones, which had been concealed by the Devs or Giants in the bowels of the earth; how to make brass-work, to cut canals, and improve agriculture.\n\nAs usual, it is Huschenk, again, who is credited with having written the work called [[Footnote(s)]] ------------------------------------------------- * Thence King Solomon, whose traces are nowhere to be found outside of the Bible, and the description of whose magnificent palace and city dovetail with those of the Persian tales; though they were unknown to all pagan travellers, even to Herodotus.\n\n[[Vol.\n\n2, Page]] 397 THE PERSIAN PHOENIX.\n\n\"Eternal Wisdom,\" and even with having built the cities of Luz, Babylon and Ispahan, though they were built ages later.\n\nBut as modern Delhi is built on six other older cities, so these just-named cities may be built on emplacements of other cities of an immense antiquity.\n\nAs to his date, it can only be inferred from another legend.\n\nIn the same tradition that wise prince is credited with having made war against the giants on a twelve-legged horse, whose birth is attributed to the amours of a crocodile with a female hippopotamus.\n\nThis dodecaped was found on the \"dry island\" or new continent; much force and cunning had to be used to secure the wonderful animal, but no sooner had Huschenk mounted him, than he defeated every enemy.\n\nNo giants could withstand his tremendous power.\n\nNotwithstanding, this king of kings was killed by an enormous rock thrown at him by the giants from the great mountains of Damavend.\n\n* Tahmurath is the third king of Persia, the St.\n\nGeorge of Iran, the knight who always has the best of, and who kills, the Dragon.\n\nHe is the great enemy of the Devs who, in his day, dwelled in the mountains of Kaf, and occasionally made raids on the Peris.\n\nThe old French chronicles of the Persian folklore call him the Dev-bend, the conqueror of the giants.\n\nHe, too, is credited with having founded Babylon, Nineveh, Diarbek, etc., etc.\n\nLike his grand-sire Huschenk, Tahmurath (Taimuraz) also had his steed, only far more rare and rapid -- a bird called Simorgh-Anke.\n\nA marvellous bird, in truth, intelligent, a polyglot, and even very religious.\n\n( See Orient.\n\nCollect.\n\nii., 119.) What says that Persian Phoenix?\n\nIt complains of its old age, for it is born cycles and cycles before the days of Adam (also Kaimurath).\n\nIt has witnessed the revolutions of long centuries.\n\nIt has seen the birth and the close of twelve cycles of 7,000 years each, which multiplied esoterically will give us again 840,000 years.** ( Orient.\n\nCollect.\n\nii., 119 et seq .) Simorgh is born with the last deluge of the pre-Adamites, says the \"romance of Simorgh and the good Khalif\"!\n\n( Tales of Derbent.\n\n) What says the \"Book of Numbers\"?\n\nEsoterically, Adam Rishoon is the lunar Spirit (Jehovah, in a sense, or the Pitris) and his three Sons -- Ka-yin, Habel, and Seth -- represent the three races, as already explained.\n\nNoah-Xisuthrus represents in his turn (in the cosmo-geological key) the 3rd Race separated, and his three sons, its last three races; Ham, moreover, symbolizing that race which uncovered the \" nakedness \" of the Parent Race, and of the \"Mindless,\" i.e.\n\n, committed sin.\n\n[[Footnote(s)]] ------------------------------------------------- * Orient.\n\nTrad., p.\n\n454.\n\nSee also Bailly ' s \" Lettres sur l ' Atlantide.\n\n\" ** Remember that the Rabbins teach that there are to be seven successive renewals of the globe; that each will last 7,000 years, the total duration being thus 49,000 years ( See Rabbi Parcha ' s \" wheel \"; also Kenealy ' s \" Book of God, \" p.\n\n176).\n\nThis refers to 7 Rounds, 7 Root-races, and sub-races, the truly occult figures, though sorely confused.\n\n[[Vol.\n\n2, Page]] 398 THE SECRET DOCTRINE.\n\nTahmurath visits on his winged steed (Ahriman) the Mountains of Koh-Kaf or Kaph.\n\nHe finds there the Peris ill-treated by the giants, and slays Argen, and the giant Demrusch.\n\nThen he liberates the good Peri, Mergiana*, whom Demrusch had kept as a prisoner, and takes her over to the dry island, i.e.\n\n, the new continent of Europe.** After him came Giamschid, who builds Esikekar, or Persepolis.\n\nThis king reigns 700 years, and believes himself, in his great pride, immortal, and demands divine honours.\n\nFate punishes him, he wanders for 100 years in the world under the name of Dhulkarnayn \"the two horned.\" But this epithet has no connection with the \"two-horned\" gentleman of the cloven foot.\n\nThe \"two-horned\" is the epithet given in Asia, uncivilized enough to know nothing of the attributes of the devil, to those conquerors who have subdued the world from the East to the West.\n\nThen come the usurper Zohac, and Feridan, one of the Persian heroes, who vanquishes the former, and shuts him up in the mountains of Damavend.\n\nThese are followed by many others down to Kaikobad, who founded a new dynasty.\n\nSuch is the legendary history of Persia, and we have to analyze it.\n\nWhat are the mountains of Kaf to begin with?\n\nWhatever they may be in their geographical status, whether they are the Caucasian or Central Asian mountains, it is far beyond these mountains to the North, that legend places the Devs and Peris; the latter the remote ancestors of the Parses or Farses."


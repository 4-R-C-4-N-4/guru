[content]
body = "In this extraordinary sculpture and painting one sees the disc of the Sun beaming upon an ansated cross placed upon a cross of which those of the Calvary were perfect copies.\n\nThe ancient MSS .\n\nmention these as the \"hard couches of those who were in (spiritual) travail, the act of giving birth to themselves.\n\n\" A quantity of such cruciform \"couches,\" on which the candidate, thrown into a dead trance at the end of his supreme initiation, was placed and secured, were found in the underground halls of the Egyptian temples after their destruction.\n\nThe worthy and holy Fathers of the Cyril and Theophilus types used them freely, believing they had been brought and concealed there by some new converts.\n\nAlone Origen, and after him Clemens Alexandrinus and other ex-initiates, knew better.\n\nBut they preferred to keep silent.\n\nAgain, let the reader read the Hindu \"fables,\" as the Orientalists call them, and remember the allegory of Visvakarma, the creative power, the great architect of the world, called in the Veda \"the all-seeing god,\" who \"sacrifices himself to himself\" (the Spiritual Egos of mortals are his own essence, one with him, therefore).\n\nRemember that he is called Deva Vardhika \"the builder of the gods\" and that it is he who ties (the Sun) Surya, his son-in-law, on his lathe, in the exoteric allegory; on the Swastika, in esoteric tradition, as on earth he is the Hierophant Initiator, and cuts away a portion of his brightness.\n\nVisvakarma, remember again, is the Son of Yoga-Siddha, i.e ., the holy power of Yoga, and the fabricator of the \"fiery weapon,\" the magic Agneyastra.\n\nThe narrative is given more fully elsewhere.\n\nThe author of the Kabalistic work so often quoted from, asks: -- \"The theoretical use of crucifixion must have been somehow connected with the personification of this symbol (the structure of the garden of Paradise symbolized by a crucified man).\n\nBut how?\n\nAnd as showing what?\n\nThe symbol was of the origin of measures, shadowing forth creative law or design.\n\nWhat practically, as regards humanity, [[Vol.\n\n2, Page]] 560 THE SECRET DOCTRINE.\n\ncould actual crucifixion betoken?\n\nYet, that it was held as the effigy of some mysterious working of the same system, is shown from the very fact of the use.\n\nThere seems to be deep below deep as to the mysterious workings of these number values -- (the symbolization of the connection of 113 : 355, with 20612 : 6561, by a crucified man ) .\n\nNot only are they shown to work in the Kosmos .\n\n.\n\n.\n\n.\n\nbut by sympathy, they seem to work out conditions relating to an unseen and spiritual world, and the prophets seem to have held knowledge of the connecting link.\n\n.\n\n.\n\n.\n\nReflection becomes more involved when it is considered that the power of expression of the law, exactly, by numbers, clearly defining a system, was not the accident of the language, but was its very essence, and of its primary organic construction; therefore, neither the language, nor the mathematical system attaching to it, could be of man's invention, unless both were founded upon a prior language, which afterwards became obsolete .\n\n.\n\n.\n\n\" (p.\n\n205).\n\nThe author proves these points by further elucidation, and reveals the secret meaning of more than one dead-letter narrative, by showing that probably man was the primordial word -- \"the very first word possessed by the Hebrews, whoever they were, to carry the idea by sound of a man.\n\nThe essential of this word was 113 (the numerical value of that word) from the beginning, and carried with it the elements of the cosmical system displayed.\" This is demonstrated by the Hindu Wittoba -- a form of Vishnu -- as said already.\n\nThe figure of Wittoba, even to the nail-marks on the feet,* is that of Jesus crucified, in all its details save the Cross; and that MAN was meant is proved to us further by the fact of the Initiate being reborn after his crucifixion on the TREE OF LIFE.\n\nThis \"tree\" has now become exoterically, through its use by the Romans as an instrument of torture, and the ignorance of the early Christian schemers, the tree of death!\n\nThus, one of the seven esoteric meanings implied in this mystery of Crucifixion by the mystic inventors of the system -- the original elaboration and adoption of which dates back to the very establishment of the MYSTERIES -- is discovered in the geometrical symbols containing the history of the evolution of man.\n\nThe Hebrews, whose prophet Moses was so learned in the esoteric Wisdom of Egypt, and who adopted their numerical system from the Phoenicians, and later from the Gentiles, from whom they borrowed most of their Kabalistic Mysticism, adapted, most ingeniously, the Cosmic and anthropological symbols of the \"heathen\" nations to their peculiar secret records.\n\nIf Christian [[Footnote(s)]] ------------------------------------------------- * See Moor's Hindu Pantheon, where Wittoba's left foot bears the mark of the nail -- on the figure of his idol.\n\n[[Vol.\n\n2, Page]] 561 THE MEANING OF THE CRUCIFIXION.\n\nsacerdotalism has lost the key of it to-day, the early compilers of the Christian Mysteries were well versed in Esoteric philosophy and the Hebrew occult metrology, and used it dexterously.\n\nThus they took the word aish (one of the Hebrew word forms for MAN) and used it in conjunction with that of Shanah \"lunar year,\" so mystically connected with the name of Jehovah, the supposed \"father\" of Jesus, and embosomed the mystic idea in an astronomical value and formula.\n\nThe original idea of \"Man Crucified\" in Space belongs certainly to the ancient Hindus, and Muir shows it in his \"Hindu Pantheon\" in the engraving that represents Wittoba.\n\nPlato adopted it in his decussated Cross in Space, the , \"the Second God who impressed himself on the Universe in the form of the Cross\"; Krishna is likewise shown \"crucified.\" (See Dr.\n\nLundy's Monumental Christianity, fig.\n\n72.) Again it is repeated in the Old Testament in the queer injunction to crucify men before the Lord, the Sun -- which is no prophecy at all, but has a direct phallic significance.\n\nIn § II .\n\nof that same most suggestive work on the Kabalistic meanings -- \"The Hebrew-Egyptian Mystery,\" we read again: -- \"In symbol, the nails of the cross have for the shape of the heads thereof a solid pyramid, and a tapering square obeliscal shaft, or phallic emblem, for the nail.\n\nTaking the position of the three nails in the Man's extremities and on the cross, they form or mark a triangle in shape, one nail being at each corner of the triangle.\n\nThe wounds or stigmata in the extremities are necessarily four designative of the square .\n\n.\n\n.\n\n."


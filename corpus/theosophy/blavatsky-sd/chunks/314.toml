body = "Yea -- \"Wise are they who worship Nemesis\"* [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] having ruled the earth once upon a time under the human form of actual living, though truly divine and god-like man.\n\nThe opinion of Colonel Vallancey (and also of Count de Gobelin) that the names of the Kabiri appear to be all allegorical , and to have signified no more (?) than an almanac of the vicissitudes of the seasons -- calculated for the operations of agriculture\" ( Collect.\n\nde Reb.\n\nHibern.\n\n, No.\n\n13, Praef.\n\nSect.\n\n5) is as absurd as his assertion that OEon, Kronos, Saturn and Dagon are all one, namely, the \"patriarch Adam.\" The Kabiri were the instructors of mankind in agriculture, because they were the regents over the seasons and Cosmic cycles.\n\nHence it was they who regulated, as planetary Spirits or \"Angels\" (messengers), the mysteries of the art of agriculture.\n\n* Who dread Karma-Nemesis would be better.\n\n[[Vol.\n\n1, Page]] 643 KARMA-NEMESIS.\n\n-- as the chorus tells Prometheus.\n\nAnd as unwise they, who believe that the goddess may be propitiated by whatever sacrifices and prayers, or have her wheel diverted from the path it has once taken.\n\n\"The triform Fates and ever mindful Furies\" are her attributes only on earth, and begotten by ourselves.\n\nThere is no return from the paths she cycles over; yet those paths are of our own making, for it is we, collectively or individually, who prepare them.\n\nKarma-Nemesis is the synonym of P ROVIDENCE, minus design , goodness, and every other finite attribute and qualification, so unphilosophically attributed to the latter.\n\nAn Occultist or a philosopher will not speak of the goodness or cruelty of Providence; but, identifying it with Karma-Nemesis, he will teach that nevertheless it guards the good and watches over them in this, as in future lives; and that it punishes the evil-doer -- aye, even to his seventh rebirth.\n\nSo long, in short, as the effect of his having thrown into perturbation even the smallest atom in the Infinite World of harmony, has not been finally readjusted.\n\nFor the only decree of Karma -- an eternal and immutable decree -- is absolute Harmony in the world of matter as it is in the world of Spirit.\n\nIt is not, therefore, Karma that rewards or punishes, but it is we, who reward or punish ourselves according to whether we work with, through and along with nature, abiding by the laws on which that Harmony depends, or -- break them.\n\nNor would the ways of Karma be inscrutable were men to work in union and harmony, instead of disunion and strife.\n\nFor our ignorance of those ways -- which one portion of mankind calls the ways of Providence, dark and intricate; while another sees in them the action of blind Fatalism; and a third, simple chance, with neither gods nor devils to guide them -- would surely disappear, if we would but attribute all these to their correct cause.\n\nWith right knowledge, or at any rate with a confident conviction that our neighbours will no more work to hurt us than we would think of harming them, the two-thirds of the World's evil would vanish into thin air.\n\nWere no man to hurt his brother, Karma-Nemesis would have neither cause to work for, nor weapons to act through.\n\nIt is the constant presence in our midst of every element of strife and opposition, and the division of races, nations, tribes, societies and individuals into Cains and Abels, wolves and lambs, that is the chief cause of the \"ways of Providence.\" We cut these numerous windings in our destinies daily with our own hands, while we imagine that we are pursuing a track on the royal high road of respectability and duty, and then complain of those ways being so intricate and so dark.\n\nWe stand bewildered before the mystery of our own making, and the riddles of life that we will not solve, and then accuse the great Sphinx of devouring us.\n\nBut verily there is not an accident in our lives, [[Vol.\n\n1, Page]] 644 THE SECRET DOCTRINE.\n\nnot a misshapen day, or a misfortune, that could not be traced back to our own doings in this or in another life.\n\nIf one breaks the laws of Harmony, or, as a theosophical writer expresses it, \"the laws of life,\" one must be prepared to fall into the chaos one has oneself produced.\n\nFor, according to the same writer, \"the only conclusion one can come to is that these laws of life are their own avengers; and consequently that every avenging Angel is only a typified representation of their re-action.\" Therefore, if any one is helpless before these immutable laws, it is not ourselves, the artificers of our destinies, but rather those angels, the guardians of harmony.\n\nKarma-Nemesis is no more than the (spiritual) dynamical effect of causes produced and forces awakened into activity by our own actions.\n\nIt is a law of occult dynamics that \"a given amount of energy expended on the spiritual or astral plane is productive of far greater results than the same amount expended on the physical objective plane of existence.\" This state will last till man's spiritual intuitions are fully opened, which will not happen before we fairly cast off our thick coats of matter; until we begin acting from within , instead of ever following impulses from without; namely, those produced by our physical senses and gross selfish body.\n\nUntil then the only palliative to the evils of life is union and harmony -- a Brotherhood IN ACTU, and altruism not simply in name.\n\nThe suppression of one single bad cause will suppress not one, but a variety of bad effects.\n\nAnd if a Brotherhood or even a number of Brotherhoods may not be able to prevent nations from occasionally cutting each other's throats -- still unity in thought and action, and philosophical research into the mysteries of being, will always prevent some, while trying to comprehend that which has hitherto remained to them a riddle, from creating additional causes in a world already so full of woe and evil.\n\nKnowledge of Karma gives the conviction that if -- \".\n\n.\n\n.\n\n.\n\nvirtue in distress, and vice in triumph Make atheists of mankind,\"* it is only because that mankind has ever shut its eyes to the great truth that man is himself his own saviour as his own destroyer.\n\nThat he need not accuse Heaven and the gods, Fates and Providence, of the apparent injustice that reigns in the midst of humanity.\n\nBut let him rather remember and repeat this bit of Grecian wisdom, which warns man to forbear accusing That which -- .\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n\"Just, though mysterious, leads us on unerring Through ways unmark'd from guilt to punishment .\n\n.\n\n.\" -- which are now the ways and the high road on which move onward the great European nations.\n\nThe Western Aryans had, every nation [[Footnote(s)]] ------------------------------------------------- * Dryden.\n\n[[Vol."


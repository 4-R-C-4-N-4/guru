body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n2 [[Vol.\n\n2, Page]] 760 THE SECRET DOCTRINE.\n\n[[This page continued from previous section ]] A .\n\nS OME S TATEMENTS A BOUT THE S ACRED I SLANDS AND C ONTINENTS IN THE C LASSICS, E XPLAINED E SOTERICALLY.\n\nAll that which precedes was known to Plato, and to many others.\n\nBut as no Initiate had the right to divulge and declare all he knew, posterity got only hints.\n\nAiming more to instruct as a moralist than as a geographer and ethnologist or historian, the Greek philosopher merged the history of Atlantis, which covered several million years, into one [[Vol.\n\n2, Page]] 761 WHO, OR WHAT WILL BE DENIED NEXT?\n\nevent which he located on one comparatively small island 3000 stadia long by 2000 wide; (or about 350 miles by 200, which is about the size of Ireland), whereas the priests spoke of Atlantis as a continent vast as \"all Asia and Lybia\" put together.\n\nBut, however altered in its general aspect, Plato's narrative bears the impress of truth upon it.* It was not he who invented it, at any rate, since Homer, who preceded him by many centuries, also speaks of the Atlantes (who are our Atlanteans) and of their island in his Odyssey.\n\nTherefore the tradition was older than the bard of Ulysses.\n\nThe Atlantes and the Atlantides of mythology are based upon the Atlantes and the Atlantides of history.\n\nBoth Sanchoniathon and Diodorus have preserved the histories of those heroes and heroines, however much these accounts may have become mixed up with the mythical element.\n\nIn our own day we witness the stupendous fact that such comparatively recent personages as Shakespeare and William Tell are all but denied, an attempt being made to show one to be a nom de plume, and the other a person who never existed.\n\nWhat wonder then, that the two powerful races -- the Lemurians and the Atlanteans -- have been merged into and identified, in time, with a few half mythical peoples, who all bore the same patronymic?\n\nHerodotus speaks of the Atlantes -- a people of Western Africa which gave its name to Mount Atlas; who were vegetarians, and \"whose sleep was never disturbed by dreams\"; and who, moreover, \"daily cursed the sun at his rising and at his setting because his excessive heat scorched and tormented them.\" These statements are based upon moral and psychic facts and not on physiological disturbance.\n\nThe story of Atlas ( Vide supra ) gives the key to it.\n\nIf the Atlanteans never had their sleep disturbed by dreams, it is because that particular tradition is concerned with the earliest Atlanteans, whose physical frame and brain were not yet sufficiently consolidated, in the physiological sense, to permit the nervous centres to act during sleep.\n\nWith regard to that other statement -- namely, that [[Footnote(s)]] ------------------------------------------------- * Plato's veracity has been so unwarrantably impeached by even such friendly critics as Professor Jowett, when the \"story of Atlantis\" is discussed, that it seems well to cite the testimony of a specialist on the subject.\n\nIt is sufficient to place mere literary cavillers in a very ridiculous position: -- \"If our knowledge of Atlantis was more thorough, it would no doubt appear that in every instance wherein the people of Europe accord with the people of America, they were both in accord with the people of Atlantis.\n\n.\n\n.\n\n.\n\n.\n\nIt will be seen that in every case where Plato gives us information in this respect as to Atlantis, we find this agreement to exist.\n\nIt existed in architecture, sculpture, navigation, engraving, writing, an established priesthood, the mode of worship, agriculture, and the construction of roads and canals ; and it is reasonable to suppose that the same correspondence extended down to all the minor details.\" (Donnelly, \"Atlantis,\" p.\n\n194.) [[Vol.\n\n2, Page]] 762 THE SECRET DOCTRINE.\n\nthey daily \"cursed the Sun\" -- this again has nothing to do with the heat, but with the moral degeneration that grew with the race.\n\nIt is explained in our Commentaries.\n\n\"They (the sixth sub-race of the Atlanteans) used magic incantations even against the Sun\" -- failing in which, they cursed it.\n\nThe sorcerers of Thessaly were credited with the power of calling down the moon, as Greek history assures us.\n\nThe Atlanteans of the later period were renowned for their magic powers and wickedness, their ambition and defiance of the gods.\n\nThence the same traditions taking form in the Bible about the antediluvian giants and the Tower of Babel, found also in the \"Book of Enoch.\" Diodorus records another fact or two: the Atlanteans boasted of possessing the land in which all the gods had received their birth; as also of having had Uranus for their first King, he being also the first to teach them astronomy.\n\nVery little more than this has come down to us from Antiquity.\n\nThe myth of Atlas is an allegory easily understood.\n\nAtlas is the old continents of Lemuria and Atlantis, combined and personified in one symbol.\n\nThe poets attribute to Atlas, as to Proteus, a superior wisdom and an universal knowledge, and especially a thorough acquaintance with the depths of the ocean : because both continents bore races instructed by divine masters, and because both were transferred to the bottom of the seas, where they now slumber until their next reappearance above the waters.\n\nAtlas is the son of an ocean nymph, and his daughter is Calypso -- \"the watery deep,\" ( See Hesiod ' s Theogony, 507-509, and Odyssey 1, 51): Atlantis has been submerged beneath the waters of the ocean, and its progeny is now sleeping its eternal sleep on the ocean floors.\n\nThe Odyssey makes of him the guardian and the \"sustainer\" of the huge pillars that separate the heavens from the earth (1, 52-53) .\n\nHe is their \"supporter.\" And as both Lemuria, destroyed by submarine fires, and Atlantis, submerged by the waves, perished in the ocean deeps,* Atlas is said to have been compelled to leave the surface of the earth, and join his brother Iapetos in the depths of Tartarus.\n\nSir Theodore Martin is right in interpreting this allegory as meaning, Atlas \"standing on the solid floor of the inferior hemisphere of the universe and thus carrying at the same time the disc of the earth and the celestial vault -- the solid envelope of the superior hemisphere\" .\n\n.\n\n.\n\n( Memoires de l ' Academie des [[Footnote(s)]] ------------------------------------------------- * Christians ought not to object to this doctrine of the periodical destruction of continents by fire and water; for St.\n\nPeter speaks of the earth \"standing out of the water, and in the water, which earth, being overflowed, perished, but is now reserved unto fire \"; ( See also the \" Lives of Alchemystical Philosophers, \" p.\n\n4 , London, 1815) ."


body = ".\n\n.\" We fail to see it, and we know it is not so.\n\nPantheism may be \"physically rediscovered.\n\n\" It was known, seen, and felt by the whole of antiquity.\n\nPantheism manifests itself in the vast expanse of the starry heavens, in the breathing of the seas and oceans and the quiver of life of the smallest blade of grass.\n\nPhilosophy rejects one finite and imperfect God in the universe, as the anthropomorphic deity of the monotheist is represented by his followers.\n\nIt repudiates in its name of Philo - Theo - Sophia the grotesque idea that Infinite, Absolute Deity should, or rather could , have any, whether direct or indirect, relation to finite illusive evolutions of matter, and therefore cannot imagine a universe outside that Deity, or the latter absent from the smallest speck of animate or inanimate substance.* Why either the Ether of Space, or \"nervous Ether\" should \"destroy the individuality of every sense\" seems incomprehensible for one acquainted with the real nature of that \"nervous ether\" under its Sanskrit, or rather esoteric and Kabalistic name.\n\nDr.\n\nRichardson agrees that -- \"If we did not individually produce the medium of communication between ourselves and the outer world, if it were produced from without and adapted to one kind of vibration alone , there were fewer senses required than we possess: for, taking two illustrations only -- ether of light is not adapted for sound, and yet we hear as well as see; while air, the medium of motion of sound, is not the medium of light, and yet we see and hear.\" This is not so.\n\nThe opinion that \"Pantheism fails to be true because it would destroy the individuality of every individual sense\" shows that all the conclusions of the learned doctor are based on the modern physical theories, though he would fain reform them.\n\nBut he will find it impossible to do this unless he allows the existence of spiritual senses to replace the gradual atrophy of the physical.\n\n\"We see and hear,\" in accordance (of course in Dr.\n\nRichardson's mind) with the explanations of the phenomena of sight and hearing, by that same materialistic [[Footnote(s)]] ------------------------------------------------- * This does not mean that every bush, tree or stone is God or a god; but only that every speck of the manifested material of Kosmos belongs to and is the substance of \"God,\" however low it may have fallen in its cyclic gyration through the Eternities of the ever becoming,; and also that every such speck individually, and Kosmos collectively, is an aspect and a reminder of that universal One Soul -- which philosophy refuses to call God, thus limiting the eternal and ever-present root and essence.\n\n[[Vol.\n\n1, Page]] 534 THE SECRET DOCTRINE.\n\nscience which postulates that we cannot see and hear otherwise.\n\nThe Occultists and mystics know better.\n\nThe Vedic Aryans were as familiar with the mysteries of sound and colour as our physiologists are on the physical plane, but they had mastered the secrets of both on planes inaccessible to the materialist.\n\nThey knew of a double set of senses; spiritual and material.\n\nIn a man who is deprived of one or more senses, the remaining become the more developed: e.g ., the blind man will recover his sight through the senses of touch, of hearing, etc., and he who is deaf will be able to hear through sight, by seeing audibly the words uttered by the lips and mouth of the speaker.\n\nBut these are cases that belong to the world of matter still.\n\nThe spiritual senses, those that act on a higher plane of consciousness are rejected a priori by physiology because the latter is ignorant of the sacred science.\n\nIt limits the action of ether to vibrations, and, dividing it from air -- though air is simply differentiated and compound ether -- makes it assume functions to fit in with the special theories of the physiologist.\n\nBut there is more real science in the teachings of the Upanishads when these are correctly understood, than the Orientalists, who do not understand them at all, are ready to admit.\n\nMental as well as physical correlations of the seven senses (seven on the physical and seven on the mental planes) are clearly explained and defined in the Vedas, and especially in the Upanishad called Anugita: \"The indestructible and the destructible, such is the double manifestation of the Self.\n\nOf these the indestructible is the existent (the true essence or nature of Self, the underlying principles).\n\nThe manifestation as an individual (or entity) is called the destructible.\" Thus speaks the A SCETIC in Anugita; and also: \"Every one who is twice-born (initiated) knows such is the teaching of the ancients.\n\n.\n\n.\n\n.\n\n.\n\nSpace is the first entity.\n\n.\n\n.\n\n.\n\n.\n\nNow Space ( Akasa , or the noumenon of Ether) has one quality .\n\n.\n\n.\n\nand that is sound only .\n\n.\n\n.\n\nand the qualities of sound are Shadga, Rishabha, Gandhara, Madhyama, Panchama, and beyond these five Nishada and Dhaivata\"; (the Hindu gamut).\n\nThese seven notes of the scale are the principles of sound.\n\n( Vide ch.\n\nxxxvi.\n\nof Anugita.\n\n) The qualities of every Element, as of every sense, are septenary, and to judge and dogmatize on them from their manifestation (likewise sevenfold in itself) on the material or objective plane above is quite arbitrary.\n\nFor it is only by the S ELF emancipating itself from these (seven) causes of illusion that one acquires the knowledge (secret wisdom) of the qualities of objects of sense on their dual plane of manifestation -- the visible and the invisible.\n\nThus it is said: -- \"State this wonderful mystery .\n\n.\n\n.\n\n.\n\n.\n\nHear the assignment of causes exhaustively.\n\nThe nose, and the tongue, and the eye, and the [[Vol.\n\n1, Page]] 535 THE SEVEN PHYSICAL SENSES.\n\nskin, and the ear as the fifth (organ of sense) Mind and Understanding,* these seven (senses) should be understood to be the causes of (the knowledge of their) qualities.\n\nSmell, and taste, and colour, sound, and touch as the fifth, the object of the mental operation, and the object of the Understanding (the highest spiritual sense or perception), these seven are causes of action.\n\nHe who smells, he who eats, he who sees, he who speaks, and he who hears as the fifth, he who thinks, and he who understands, these seven should be regarded as the causes of the agents .** These (the agents) being possessed of qualities ( sattwa , rajas , tamas ), enjoy their own qualities, agreeable and disagreeable\" ( Anugita ) .\n\nThen one reads in the Bhagavadgita (chap.\n\nvii.) the Deity (or Krishna) saying: -- \".\n\n.\n\n.\n\n.\n\nOnly some know me truly."


[content]
body = "*** It thus stands to reason that science would never dream of a pre -tertiary man, and that de Quatrefages' secondary man makes every Academician and \" F.R.S .\" faint with horror because, TO PRESERVE THE APE-THEORY, SCIENCE MUST MAKE MAN POST-SECONDARY.\n\nThis is just what de Quatrefages has twitted the Darwinists with, adding, that on the whole there were more scientific reasons to trace the ape from man than man from the anthropoid.\n\nWith this exception science has not one single valid argu- [[Footnote continued on next page]] [[Vol.\n\n2, Page]] 688 THE SECRET DOCTRINE.\n\nAn untold antiquity for man is thus, then, the scientific sine qua non in the question of Darwinian Evolution, since the oldest Palaeolithic man shows as yet no appreciable differentiation from his modern descendant.\n\nIt is only of late that modern Science began to widen with every year the abyss that now separates her from old Science, that of the Plinies and Hippocrateses, none of whom would have derided the archaic teachings with respect to the evolution of the human races and animal species, as the present day Scientist -- geologist or anthropologist -- is sure to do.\n\nHolding, as we do, that the mammalian type was a post-human Fourth Round product, the following diagram -- as the writer understands the teaching -- may make the process clear: -- The unnatural union was invariably fertile, because the then mammalian types were not remote enough from their Root-type* -- Primeval Astral [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] ment to offer against the antiquity of man.\n\nBut in this case modern Evolution demands far more than the fifteen million years of Croll for the Tertiary period, for two very simple but good reasons: ( a ) No anthropoid ape has been found before the Miocene period: ( b ) man's flint relics have been traced to the Pliocene and their presence suspected, if not accepted by all, in the Miocene strata.\n\nAgain, where is the \"missing link\" in such case?\n\nAnd how could even a Palaeolithic Savage, a \"Man of Canstadt,\" evolve into thinking men from the brute Dryopithecus of the Miocene in so short a time.\n\nOne sees now the reason why Darwin rejected the theory that only 60,000,000 years had elapsed since the Cambrian period.\n\n\"He judges from the small amount of organic changes since the glacial epoch, and adds that the previous 140 million years can hardly be considered as sufficient for the development of the varied forms of life which certainly existed toward the close of the Cambrian period.\" (Ch.\n\nGould.) * Let us remember in this connection the esoteric teaching which tells us of Man having had in the Third Round a GIGANTIC APE-LIKE FORM on the astral plane.\n\nAnd similarly at the close of the Third Race in this Round.\n\nThus it accounts for the human features of the apes, especially of the later anthropoids -- apart from the fact that these latter preserve by Heredity a resemblance to their Atlanto-Lemurian sires.\n\n[[Vol.\n\n2, Page]] 689 THE INCUBUS OF ETHNOLOGY.\n\nMan -- to develop the necessary barrier.\n\nMedical science records such cases of monsters, bred from human and animal parents, even in our own day.\n\nThe possibility is, therefore, only one of degree, not of fact.\n\nThus it is that Occultism solves one of the strangest problems presented to the consideration of the anthropologist.\n\nThe pendulum of thought oscillates between extremes.\n\nHaving now finally emancipated herself from the shackles of theology, Science has embraced the opposite fallacy; and in the attempt to interpret Nature on purely materialistic lines, she has built up that most extravagant theory of the ages -- the derivation of man from a ferocious and brutal ape.\n\nSo rooted has this doctrine, in one form or another, now become, that the most Herculean efforts will be needed to bring about its final rejection.\n\nThe Darwinian anthropology is the incubus of the ethnologist, a sturdy child of modem Materialism, which has grown up and acquired increasing vigour, as the ineptitude of the theological legend of Man's \"creation\" became more and more apparent.\n\nIt has thriven on account of the strange delusion that -- as a scientist of repute puts it -- \"All hypotheses and theories with respect to the rise of man can be reduced to two (the Evolutionist and the Biblical exoteric account) .\n\n.\n\n.\n\nThere is no other hypothesis conceivable .\n\n.\n\n.\n\n\" !!\n\nThe anthropology of the secret volumes is, however, the best possible answer to such a worthless contention.\n\nThe anatomical resemblance between Man and the higher Ape, so frequently cited by Darwinists as pointing to some former ancestor common to both, presents an interesting problem, the proper solution of which is to be sought for in the esoteric explanation of the genesis of the pithecoid stocks.\n\nWe have given it as far as was useful, by stating that the bestiality of the primeval mindless races resulted in the production of huge man-like monsters -- the offspring of human and animal parents.\n\nAs time rolled on, and the still semi-astral forms consolidated into the physical, the descendants of these creatures were modified by external conditions, until the breed, dwindling in size, culminated in the lower apes of the Miocene period.\n\nWith these the later Atlanteans renewed the sin of the \"Mindless\" -- this time with full responsibility.\n\nThe resultants of their crime were the species of apes now known as Anthropoid.\n\nIt may be useful to compare this very simple theory -- and we are willing to offer it even as a hypothesis to the unbelievers -- with the Darwinian scheme, so full of insurmountable obstacles, that no sooner is one of these overcome by a more or less ingenious hypothesis, than ten worse difficulties are forthwith discovered behind the one disposed of.\n\n-------"


body = "But though the apes descend from man, it is certainly not the fact that the human Monad, which has once reached the level of humanity, ever incarnates again in the form of an animal.\n\n[[Vol.\n\n1, Page]] 186 THE SECRET DOCTRINE.\n\nhaving reached its lowest depths, begins to strive onward and to get spiritualized with every new Race and with every fresh cycle.\n\nTherefore the student must take care not to see contradiction where there is none, as in \"Esoteric Buddhism\" Rounds are spoken of in general, while here only the Fourth, or our present Round, is meant.\n\nThen it was the work of formation; now it is that of reformation and evolutionary perfection.\n\nFinally, to close this chapter anent various, but unavoidable misconceptions, we must refer to a statement in \"Esoteric Buddhism\" which has produced a very fatal impression upon the minds of many Theosophists.\n\nOne unfortunate sentence from the work just referred to is constantly brought forward to prove the materialism of the doctrine.\n\nOn p.\n\n48, 5th Edition, the Author, referring to the progress of organisms on the Globes, says that \"the mineral kingdom will no more develop the vegetable .\n\n.\n\n.\n\nthan the Earth was able to develop man from the ape, till it received an impulse.\" Whether this sentence renders literally the thought of the author, or is simply (as we believe it is) a lapsus calami , may remain an open question.\n\nIt is really with surprise that we have ascertained the fact that \"Esoteric Buddhism\" was so little understood by some Theosophists, as to have led them into the belief that it thoroughly supported Darwinian evolution, and especially the theory of the descent of man from a pithecoid ancestor.\n\nAs one member writes: \"I suppose you realise that three-fourths of Theosophists and even outsiders imagine that, as far as the evolution of man is concerned, Darwinism and Theosophy kiss one another.\" Nothing of the kind was ever realised, nor is there any great warrant for it, so far as we know, in \"Esoteric Buddhism.\" It has been repeatedly stated that evolution as taught by Manu and Kapila was the groundwork of the modern teachings, but neither Occultism nor Theosophy has ever supported the wild theories of the present Darwinists -- least of all the descent of man from an ape.\n\nOf this, more hereafter.\n\nBut one has only to turn to p.\n\n47 of \"Esoteric Buddhism,\" 5th edition, to find there the statement that \"Man belongs to a kingdom distinctly separate from that of the animals.\" With such a plain and unequivocal statement before him, it is very strange that any careful student should have been so misled unless he is prepared to charge the author with a gross contradiction.\n\n[[Vol.\n\n1, Page]] 187 AN ERRONEOUS OPINION.\n\nEvery Round repeats on a higher scale the evolutionary work of the preceding Round.\n\nWith the exception of some higher anthropoids, as just mentioned, the Monadic inflow, or inner evolution, is at an end till the next Manvantara.\n\nIt can never be too often repeated, that the full-blown human Monads have to be first disposed of, before the new crop of candidates appears on this Globe at the beginning of the next cycle.\n\nThus there is a lull; and this is why, during the Fourth Round, man appears on Earth earlier than any animal creation, as will be described.\n\nBut it is still urged that the author of \"Esoteric Buddhism\" has \"preached Darwinism\" all along.\n\nCertain passages would undoubtedly seem to lend countenance to this inference.\n\nBesides which the Occultists themselves are ready to concede partial correctness to the Darwinian hypothesis, in later details, bye-laws of Evolution, and after the midway point of the Fourth Race.\n\nOf that which has taken place, physical science can really know nothing, for such matters lie entirely outside of its sphere of investigation.\n\nBut what the Occultists have never admitted, nor will they ever admit, is that man was an ape in this or in any other Round; or that he ever could be one, however much he may have been \"ape-like.\" This is vouched for by the very authority from whom the author of \"Esoteric Buddhism\" got his information.\n\nThus to those who confront the Occultists with these lines from the above-named volume: \"It is enough to show that we may as reasonably -- and that we must, if we would talk about these matters at all -- conceive a life-impulse giving birth to mineral form, as of the same sort of impulse concerned to raise a race of apes into a race of rudimentary men.\n\n\" To those who bring this passage forward as showing \"decided Darwinism,\" the Occultists answer by pointing to the explanation of the Master (Mr.\n\nSinnett's \"teacher\") which would contradict these lines, were they written in the spirit attributed to them.\n\nA copy of this letter was sent to the writer, together with others, two years ago (1886), with additional marginal remarks, to quote from, in the \" Secret Doctrine.\n\n\" It begins by considering the difficulty experienced by the Western student, in reconciling some facts, previously given, with the evolution of man from the animal, i.e.\n\n, from the mineral, vegetable and animal kingdoms, and advises the student to hold to the doctrine of analogy and correspondences.\n\nThen it touches upon the mystery of the Devas, [[Vol.\n\n1, Page]] 188 THE SECRET DOCTRINE.\n\nand even Gods, having to pass through states which it was agreed to refer to as \"Inmetallization, Inherbation, Inzoonization and finally Incarnation,\" and explains this by hinting at the necessity of failures even in the ethereal races of Dhyan Chohans.\n\nConcerning this it says: \"Still, as these 'failures' are too far progressed and spiritualized to be thrown back forcibly from Dhyan Chohanship into the vortex of a new primordial evolution through the lower kingdoms.\n\n.\n\n.\n\n.\n\n.\" After which only a hint is given about the mystery contained in the allegory of the fallen Asuras, which will be expanded and explained in Book II.\n\nWhen Karma has reached them at the stage of human evolution, \"they will have to drink it to the last drop in the bitter cup of retribution.\n\nThen they become an active force and commingle with the Elementals, the progressed entities of the pure animal kingdom, to develop little by little the full type of humanity.\" These Dhyan Chohans, as we see, do not pass through the three kingdoms as do the lower Pitris; nor do they incarnate in man until the Third Root Race.\n\nThus, as the teaching stands: \" Man in the First Round and First Race on Globe D , our Earth , was an ethereal being ( a Lunar Dhyani , as man ), non-intelligent but superspiritual; and correspondingly , on the law of analogy , in the First Race of the Fourth Round.\n\nIn each of the subsequent races and sub-races .\n\n.\n\n.\n\nhe grows more and more into an encased or incarnate being , but still preponderatingly ethereal.\n\n.\n\n.\n\n."


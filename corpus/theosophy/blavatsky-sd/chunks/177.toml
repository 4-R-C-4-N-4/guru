[content]
body = "No computation of either the Four Ages, or the Manvantaras, has ever been unriddled by our very learned Orientalists, who have therefore cut the Gordian Knot by proclaiming the whole \"a figment of the Brahmanical brain.\" So be it, and may the great scholars rest in peace.\n\nThis \"figment\" is given in the Preliminary Sections which preface Anthropogenesis in Book II., and with esoteric additions.\n\nLet us see, however, what were the three kinds of pralayas , and what is the popular belief about them.\n\nFor once it agrees with Esotericism.\n\nOf the pralaya before which fourteen Manvantaras elapse, having over them as many presiding Manus, and at whose close occurs the \"incidental\" or Brahma's dissolution, it is said in Vishnu Purana , in condensed form, that \"at the end of a thousand periods of four ages, which complete a day of Brahma, the earth is almost exhausted.\n\nThe eternal Avyaya (Vishnu) assumes then the character of Rudra (the destroyer, Siva) and re-unites all his creatures to himself.\n\nHe enters the Seven rays of the Sun and drinks up all the waters of the globe; he causes the moisture to evaporate, thus drying up the whole Earth.\n\nOceans and rivers, torrents and small streams, are all exhaled.\n\nThus fed with abundant moisture the seven solar rays become sevens suns by dilation, and they finally set the world on fire.\n\nHari, the destroyer of all things, who is 'the flame of time, Kalagni ,' finally consumes the Earth.\n\nThen Rudra, becoming Janardana, breathes clouds and rain.\" There are many kinds of Pralaya , but three chief ones are specially mentioned in old Hindu books; and of these, as Wilson shows: -- The first is called N AIMITTIKA* \"occasional\" or \"incidental,\" caused by the intervals of \"Brahma's Days;\" it is the destruction of creatures, of all that lives and has a form, but not of the substance which remains in statu quo till the new DAWN in that \"Night.\" The [[Footnote(s)]] ------------------------------------------------- * In the Vedanta and Nyaya \"nimitta\" (from which \"Naimittika\") is rendered as the efficient cause, when antithesized with upadana the physical or material cause.\n\nIn the Sankhya pradhana is a cause inferior to Brahma, or rather Brahma being himself a cause, is superior to Pradhana.\n\nHence \"incidental\" is wrongly translated, and ought to be translated, as shown by some scholars, \"Ideal\" cause, and even real cause would have been better.\n\n[[Vol.\n\n1, Page]] 371 THE RE-BIRTH OF GODS.\n\nother is called P RAKRITIKA -- and occurs at the end of the Age or Life of Brahma, when everything that exists is resolved into the primal element, to be remodelled at the end of that longer night.\n\nBut the third, Atyantika , does not concern the Worlds or the Universe, but only the individualities of some people; it is thus individual pralaya or NIRVANA; after having reached which, there is no more future existence possible, no rebirth till after the Maha Pralaya.\n\nThe latter night, lasting as it does 311,040,000,000,000 years, and having the possibility of being almost doubled in case the lucky Jivanmukti reaches Nirvana at an early period of a Manvantara, is long enough to be regarded as eternal , if not endless.\n\nThe Bhagavata ( XII ., iv, 35) speaks of a fourth kind of pralaya, the Nitya or constant dissolution, and explains it as the change which takes place imperceptibly in everything in this Universe from the globe down to the atom -- without cessation.\n\nIt is growth and decay (life and death).\n\nWhen the Maha Pralaya arrives, the inhabitants of Swar-loka (the upper sphere) disturbed by the conflagration, seek refuge \"with the Pitris, their progenitors, the Manus, the Seven Rishis, the various orders of celestial Spirits and the Gods, in Maharloka.\" When the latter is reached also, the whole of the above enumerated beings migrate in their turn from Maharloka, and repair to Jana-loka in \" their subtile forms , destined to become re - embodied , in similar capacities as their former , when the world is renewed at the beginning of the succeeding Kalpa ;\" (Vayu Purana).\n\n\" .\n\n.\n\n.\n\n.\n\nThese clouds, mighty in size, and loud in thunder, fill up all space (Nabhas-tala),\" goes on Vishnu Purana.\n\n-- (Book VI., ch.\n\niii.) \"Showering down torrents of water, these clouds quench the dreadful fires, and then they rain uninterruptedly for a hundred (divine) years, and deluge the whole world (Solar System).\n\nPouring down, in drops as large as dice, these rains overspread the earth, and fill the middle region ( Bhuvaloka ) and inundate heaven.\n\nThe world is now enveloped in darkness, and all things animate, or inanimate, having perished, the clouds continue to pour down their waters\" .\n\n.\n\n.\n\n\"and the Night of Brahma reigns supreme over the scene of desolation .\n\n.\n\n.\n\n.\n\n.\" This is what we call in the Esoteric Doctrine a \"Solar Pralaya\" .\n\n.\n\n.\n\nWhen the waters have reached the region of the Seven Rishis, and the world (our Solar System) is one ocean, they stop.\n\nThe breath of Vishnu becomes a strong wind, which blows for another hundred (divine) years until all clouds are dispersed.\n\nThe wind is then reabsorbed: and \" T HAT, of which all things are made, the Lord by whom all things exist, He who is inconceivable, without beginning, the beginning of the universe, reposes, sleeping upon Sesha (the Serpent of Infinity) in the midst of the deep.\n\nThe Adikrit [[Vol.\n\n1, Page]] 372 THE SECRET DOCTRINE.\n\n(Creator?) Hari , sleeps upon the ocean of Space in the form of Brahma -- glorified by Sanaka* and the Siddha (Saints) of Jana-loka, and contemplated by the holy denizens of Brahma-loka, anxious for final liberation, involved in mystic slumber, the celestial personification of his own illusions.\n\n.\n\n.\n\n.\" This is the Pratisanchara (dissolution?) termed incidental because Hari is its incidental (ideal) Cause.\n\n.\n\n.\n\n.\n\n.** When the Universal Spirit wakes, the world revives; when he closes his eyes, all things fall upon the bed of mystic slumber.\n\nIn like manner, as 1,000 great ages constitute a Day of Brahma (in the original it is Padma-yoni, the same as Abjayoni -- \"lotos-born,\" not Brahma), so his Night consists of the same period."


[content]
body = "We notice, first, that the Hindus seem to have combined two epochs together into the year 3102.\n\nThe Tirvalour Brahmins reckon primarily from the first moment of the Kali-Yug; but they have a second epoch placed 2d.\n\n3h.\n\n32m.\n\n30s.\n\nlater.\n\nThe latter is the true astronomical epoch, while the former seems to be a civil era.\n\nBut if this epoch of the Kali-Yug had no reality, and was the mere result of a calculation, why should it be thus divided?\n\nTheir calculated astronomical epoch would have become that of the Kali-Yug, which would have been placed at the conjunction of the sun and the moon, as is the case with the epochs of the three other tables.\n\nThey must have had some reason for distinguishing between the two; and this reason can only be due to the circumstances and the time of the epoch; which therefore could not be the result of calculation.\n\nThis is not all; starting from the solar epoch determined by the rising of the sun on February 18th, 3102, and tracing back events 2d.\n\n3h.\n\n32m.\n\n30s., we come to 2h.\n\n27m.\n\n30s.\n\na.m.\n\nof February 16th, which is the instant of the beginning of Kali-Yuga.\n\nIt is curious that this age has not been made to commence at one of the four great divisions of the day.\n\nIt might be suspected that the epoch should be midnight, and that the 2h.\n\n27m.\n\n30s.\n\nare a meridian correction.\n\nBut whatever may have been the reason for fixing on this moment, it is plain that were this epoch the result of calculation, it would have been just as easy to carry it back to midnight, so as to make the epoch correspond to one of the chief divisions of the day, instead of placing it at a moment fixed by the fraction of a day.\n\n2nd.\n\nThe Hindus assert that at the first moment of Kali-Yug there was a conjunction of all the planets; and their tables show this conjunction while ours indicate that it might actually have occurred.\n\nJupiter and Mercury were in exactly the same degree of the ecliptic; Mars being 8 [[degrees]] and Saturn 17 [[degrees]] distant from it.\n\nIt follows that about this time, or some fourteen days after the commencement of Kali-Yug, the Hindus saw four planets emerge successively from the Sun's rays; first Saturn, then Mars, then Jupiter and Mercury, and these planets appeared united in a somewhat small space.\n\nAlthough Venus was not among them, the taste for the marvellous caused it to be called a general conjunction of all the planets.\n\nThe testimony of the Brahmins here coincides with that of our tables; and this evidence, the result of a tradition, must be founded on actual observation.\n\n[[Vol.\n\n1, Page]] 663 THE EYE OF TAURUS.\n\n3rd.\n\nWe may remark that this phenomenon was visible about a fortnight after the epoch, and exactly at the time when the eclipse of the moon must have been observed, which served to fix the epoch.\n\nThe two observations mutually confirm each other; and whoever made the one must have made the other also.\n\n4th.\n\nWe may believe also that the Hindus made at the same time a determination of the place of the moon's node; this seems indicated by their calculation.\n\nThey give the longitude of this point of the lunar orbit for the time of their epoch, and to this they add as a constant 40m., which is the node's motion in 12d.\n\n14h.\n\nIt is as if they stated that this determination was made 13 days after their epoch, and that to make it correspond to that epoch, we must add the 40m.\n\nthrough which the node has retrograded in the interval.\n\nThis observation is, therefore, of the same date as that of the lunar eclipse; thus giving three observations, which are mutually confirmatory.\n\n5th.\n\nIt appears from the description of the Hindu Zodiac given by M.\n\nC.\n\nGentil, that on it the places of the stars named \"The Eye of Taurus\" and the \"Wheat-ear of Virgo,\" can be determined for the commencement of the Kali-Yug.\n\nNow, comparing these places with the actual positions, reduced by our precession of the equinoxes to the moment in question, we see that the point of origin of the Hindu Zodiac must lie between the fifth and sixth degree of Libra.\n\nThe Brahmins, therefore, were right in placing it in the sixth degree of that sign, the more so since this small difference may be due to the proper motion of the stars which is unknown.\n\nThus it was yet another observation which guided the Hindus in this fairly accurate determination of the first point of their movable zodiac.\n\nIt does not seem possible to doubt the existence in antiquity of observations of this date.\n\nThe Persians say that four beautiful stars were placed as guardians at the four corners of the world.\n\nNow it so happens that at the commencement of Kali Yug, 3000 or 3100 years before our era, the \"Eye of the Bull\" and the \"Heart of the Scorpion\" were exactly at the equinoctial points, while the \"Heart of the Lion\" and the \"Southern Fish\" were pretty near the solstitial points.\n\nAn observation of the rising of the Pleiades in the evening, seven days before the autumnal equinox, also belongs to the year 3000 before our era.\n\nThis and similar observations collected in Ptolemy's calendars, though he does not give their authors, these observations, which are older than those of the Chaldeans, may well be the work of the Hindus.\n\nThey are well acquainted with the constellation of the Pleiades, and while we call it vulgarly the \"Poussiniere\" they name it: Pillaloo - codi -- the \"Hen and chickens.\" This name has therefore, passed from people to [[Vol.\n\n1, Page]] 664 THE SECRET DOCTRINE.\n\npeople, and comes to us from the most ancient nations of Asia.\n\nWe see that the Hindus must have observed the rising of the Pleiades, and have made use of it to regulate their years and their months; for this constellation is also called Krittika.\n\nNow they have a month of the same name, and this coincidence can only be due to the fact that this month was announced by the rising or setting of the constellation in question.\n\nBut what is even more decisive as showing that the Hindus observed the stars, and in the same way that we do, marking their position by their longitude, is a fact mentioned by Augustinus Riccius that, according to observations attributed to Hermes, and made 1,985 years before Ptolemy, the brilliant star in the Lyre and that in the Heart of the Hydra were each seven degrees in advance of their respective positions as determined by Ptolemy.\n\nThis determination seems very extraordinary.\n\nThe stars advance regularly with respect to the equinox; and Ptolemy ought to have found the longitudes 28 degrees in excess of what they were 1985 years before his time."


[content]
body = "** This is the \"undying race\" as it is called in Esotericism, and exoterically the fruitless generation of the first progeny of Daksha, who curses Narada, the divine Rishi, alleged to have dissuaded the Haryaswas and the Sabalaswas, the sons of Daksha, from procreating their species, by saying \"Be born in the womb; there shall not be a resting place for thee in all these regions\"; after this Narada, the representative of that race of fruitless ascetics, is said, as soon as he dies in one body, to be reborn in another.\n\n[[Vol.\n\n2, Page]] 276 THE SECRET DOCTRINE.\n\nthe Fourth Race, so called.\n\nIn the Vishnu Purana it is simply said that Daksha, the father of mankind, established sexual intercourse as the means of peopling the world.\n\nHappily for the human race the \"Elect Race\" had already become the vehicle of incarnation of the (intellectually and spiritually) highest Dhyanis before Humanity had become quite material.\n\nWhen the last sub-races -- save some lowest -- of the Third Race had perished with the great Lemurian Continent, \"the seeds of the Trinity of Wisdom \" had already acquired the secret of immortality on Earth, that gift which allows the same great personality to step ad libitum from one worn-out body into another.\n\n( b ) The first war that earth knew, the first human gore shed, was the result of man's eyes and senses being opened; which made him see that the daughters of his Brethren were fairer than his own, and their wives also.\n\nThere were rapes committed before that of the Sabines, and Menelauses robbed of their Helens before the Fifth Race was born.\n\nTitans or giants were the stronger; their adversaries, the wiser.\n\nThis took place during the Fourth Race -- that of the giants.\n\nFor \"there were giants\" in the days of old, indeed* and the evolutionary series of the animal world is a warrant that the same thing took place within the human races.\n\nLower still in the order of creation we find witnesses for the same in the flora going pari passu with the fauna in respect of size.\n\nThe pretty ferns we collect and dry among the leaves of our favourite volumes are the descendants of the gigantic ferns which grew during the carboniferous period.\n\nScriptures, and fragments of philosophical and scientific works -- in short, almost every record that has come down to us from antiquity -- contain references to giants.\n\nNo one can fail to recognize the Atlanteans of the Secret Doctrine in the Rakshasas of Lanka -- the opponents conquered by Rama.\n\nAre these accounts no better than the production of empty fancy?\n\nLet us give the subject a few moments of attention.\n\n------- [[Footnote(s)]] ------------------------------------------------- * The traditions of every country and nation point to this fact.\n\nDonnelly quotes from Father Duran's Historia Antigua de la Nueva Espana of 1885, in which a native of Cholula, a centenarian, accounts for the building of the great pyramid of Cholula, by saying as follows: \"In the beginning, before the light of the Sun had been created, this land (Cholula) was in obscurity and darkness .\n\n.\n\n.\n\n.\n\nbut immediately after the light of the Sun arose in the East, there appeared gigantic men .\n\n.\n\n.\n\n.\n\nwho built the said pyramid, its builders being scattered after that to all parts of the Earth.\" \"A great deal of the Central American history is taken up with the doings of an ancient race of giants called Quinanes,\" says the author of \"Atlantis\" (p.\n\n204.)"


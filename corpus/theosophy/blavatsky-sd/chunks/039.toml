body = "The Lotus thus typifies the life of man and also that of the Kosmos; for the Secret Doctrine teaches that the elements of both are the same, and that both are developing in the same direction.\n\nThe root of the Lotus sunk in the mud represents material life, the stalk passing up through the water typifies existence in the astral world, and the flower floating on the water and opening to the sky is emblematical of spiritual being.\n\nSTANZA II.\n\n-- Continued .\n\n4.\n\nH ER HEART HAD NOT YET OPENED FOR THE ONE RAY TO ENTER, THENCE TO FALL AS THREE INTO FOUR IN THE LAP OF M AYA ( a ).\n\n( a ) The Primordial Substance had not yet passed out of its precosmic latency into differentiated objectivity, or even become the (to man, so far,) invisible Protyle of Science.\n\nBut, as the hour strikes and it becomes receptive of the Fohatic impress of the Divine Thought (the Logos, or the male aspect of the Anima Mundi, Alaya) -- its heart opens.\n\nIt differentiates, and the THREE (Father, Mother, Son) are transformed into four.\n\nHerein lies the origin of the double mystery of the Trinity and the immaculate Conception.\n\nThe first and Fundamental dogma of Occultism is Universal Unity (or Homogeneity) under three aspects.\n\nThis led to a possible conception of Deity, which as an absolute unity must remain forever incomprehensible to finite intellects.\n\n\"If thou wouldest believe in the Power which acts within the root of a plant, or imagine the root concealed under the soil, thou hast to think of its stalk or trunk and of its leaves and flowers.\n\nThou canst not imagine that Power independently of these objects.\n\nLife can be known only by the Tree of Life.\n\n.\n\n.\n\n.\" (Precepts for Yoga).\n\nThe idea of Absolute Unity [[Vol.\n\n1, Page]] 59 ASTRAL LIGHT IS NOT THE ANIMA MUNDI.\n\nwould be broken entirely in our conception, had we not something concrete before our eyes to contain that Unity.\n\nAnd the deity being absolute, must be omnipresent, hence not an atom but contains IT within itself.\n\nThe roots, the trunk and its many branches are three distinct objects, yet they are one tree.\n\nSay the Kabalists: \"The Deity is one, because It is infinite.\n\nIt is triple, because it is ever manifesting.\" This manifestation is triple in its aspects, for it requires, as Aristotle has it, three principles for every natural body to become objective: privation, form, and matter.* Privation meant in the mind of the great philosopher that which the Occultists call the prototypes impressed in the Astral Light -- the lowest plane and world of Anima Mundi.\n\nThe union of these three principles depends upon a fourth -- the LIFE which radiates from the summits of the Unreachable, to become an universally diffused Essence on the manifested planes of Existence.\n\nAnd this QUATERNARY (Father, Mother, Son, as a UNITY, and a quaternary, as a living manifestation) has been the means of leading to the very archaic Idea of Immaculate Conception, now finally crystallized into a dogma of the Christian Church, which carnalized this metaphysical idea beyond any common sense.\n\nFor one has but to read the Kabala and study its numerical methods of interpretation to find the origin of that dogma.\n\nIt is purely astronomical, mathematical, and pre-eminently metaphysical: the Male element in Nature (personified by the male deities and Logoi -- Viraj, or Brahma; Horus, or Osiris, etc., etc.) is born through, not from, an immaculate source, personified by the \"Mother\"; because that Male having a Mother cannot have a \"Father\" -- the abstract Deity being sexless, and not even a Being but Be-ness, or Life itself.\n\nLet us render this in the mathematical language of the author of \"The Source of Measures.\" Speaking of the \"Measure of a Man\" and his numerical (Kabalistic) value, he writes that in Genesis, ch.\n\niv., v.\n\n1, \"It is called the 'Man even Jehovah' [[Footnote(s)]] ------------------------------------------------- * A Vedantin of the Visishtadwaita philosophy would say that, though the only independent Reality, Parabrahmam is inseparable from his trinity.\n\nThat He is three, \"Parabrahmam, Chit, and Achit,\" the last two being dependent realities unable to exist separately; or, to make it clearer, Parabrahmam is the SUBSTANCE -- changeless, eternal, and incognizable -- and Chit (Atma), and Achit (Anatma) are its qualities, as form and colour are the qualities of any object.\n\nThe two are the garment, or body, or rather attribute (Sarira) of Parabrahmam.\n\nBut an Occultist would find much to say against this claim, and so would the Adwaitee Vedantin.\n\n[[Vol.\n\n1, Page 60]] THE SECRET DOCTRINE.\n\nMeasure, and this is obtained in this way, viz.: 113 x 5 = 565, and the value 565 can be placed under the form of expression 56.5 x 10 = 565.\n\nHere the Man-number 113 becomes a factor of 56.5 x 10, and the (Kabalistic) reading of this last numbered expression is Jod, He, Vau, He, or Jehovah.\n\n.\n\n.\n\n.\n\nThe expansion of 565 into 56.5 x 10 is purposed to show the emanation of the male (Jod) from the female (Eva) principle; or, so to speak, the birth of a male element from an immaculate source, in other words, an immaculate conception.\" Thus is repeated on Earth the mystery enacted, according to the Seers, on the divine plane.\n\nThe \"Son\" of the immaculate Celestial Virgin (or the undifferentiated cosmic protyle, Matter in its infinitude) is born again on Earth as the Son of the terrestrial Eve -- our mother Earth, and becomes Humanity as a total -- past, present, and future -- for Jehovah or Jod-he-vau-he is androgyne, or both male and female.\n\nAbove, the Son is the whole K OSMOS; below, he is M ANKIND.\n\nThe triad or triangle becomes Tetraktis, the Sacred Pythagorean number, the perfect Square, and a 6-faced cube on Earth.\n\nThe Macroprosopus (the Great Face) is now Microprosopus (the lesser face); or, as the Kabalists have it, the \"Ancient of Days,\" descending on Adam Kadmon whom he uses as his vehicle to manifest through, gets transformed into Tetragrammaton.\n\nIt is now in the \"Lap of Maya,\" the Great Illusion, and between itself and the Reality has the Astral Light, the great Deceiver of man's limited senses, unless Knowledge through Paramarthasatya comes to the rescue.\n\n------- STANZA II."


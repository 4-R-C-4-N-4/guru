[content]
body = "As may be judged, however, from the most important, as the best known of the Rosicrucians' symbols, there is one which has never been hitherto understood even by modern mystics.\n\nIt is that of the \"Pelican\" tearing open its breast to feed its seven little ones -- the real creed of the Brothers of the Rosie-Cross and a direct outcome from the Eastern [[Footnote(s)]] ------------------------------------------------- * Thus Spencer, who, nevertheless, like Schopenhauer and von Hartmann, only reflects an aspect of the old esoteric philosophers, and hence lands his readers on the bleak shore of Agnostic despair -- reverently formulates the grand mystery; \"that which persists unchanging in quantity, but ever changing in form, under these sensible appearances which the Universe presents to us, is an unknown and unknowable power, which we are obliged to recognise as without limit in Space and without beginning or end in time.\" It is only daring Theology -- never Science or philosophy -- which seeks to gauge the Infinite and unveil the Fathomless and Unknowable.\n\n[[Vol.\n\n1, Page]] 20 THE SECRET DOCTRINE.\n\nSecret Doctrine.\n\nBrahma (neuter) is called Kalahansa, meaning, as explained by Western Orientalists, the Eternal Swan or goose (see Stanza III., Comment.\n\n8), and so is Brahma, the Creator.\n\nA great mistake is thus brought under notice; it is Brahma (neuter) who ought to be referred to as Hansa-vahana (He who uses the swan as his Vehicle) and not Brahma the Creator, who is the real Kalahansa, while Brahma (neuter) is hamsa, and \"A-hamsa,\" as will be explained in the Commentary.\n\nLet it be understood that the terms Brahma and Parabrahmam are not used here because they belong to our Esoteric nomenclature, but simply because they are more familiar to the students in the West.\n\nBoth are the perfect equivalents of our one, three, and seven vowelled terms, which stand for the O NE A LL, and the One \"All in all.\" Such are the basic conceptions on which the Secret Doctrine rests.\n\nIt would not be in place here to enter upon any defence or proof of their inherent reasonableness; nor can I pause to show how they are, in fact, contained -- though too often under a misleading guise -- in every system of thought or philosophy worthy of the name.\n\nOnce that the reader has gained a clear comprehension of them and realised the light which they throw on every problem of life, they will need no further justification in his eyes, because their truth will be to him as evident as the sun in heaven.\n\nI pass on, therefore, to the subject matter of the Stanzas as given in this volume, adding a skeleton outline of them, in the hope of thereby rendering the task of the student more easy, by placing before him in a few words the general conception therein explained.\n\nStanza I.\n\nThe history of cosmic evolution, as traced in the Stanzas, is, so to say, the abstract algebraical formula of that Evolution.\n\nHence the student must not expect to find there an account of all the stages and transformations which intervene between the first beginnings of \"Universal\" evolution and our present state.\n\nTo give such an account would be as impossible as it would be incomprehensible to men who cannot even grasp the nature of the plane of existence next to that to which, for the moment, their consciousness is limited.\n\nThe Stanzas, therefore, give an abstract formula which can be applied, mutatis mutandis, to all evolution: to that of our tiny earth, to [[Vol.\n\n1, Page]] 21 PROEM.\n\nthat of the chain of planets of which that earth forms one, to the solar Universe to which that chain belongs, and so on, in an ascending scale, till the mind reels and is exhausted in the effort.\n\nThe seven Stanzas given in this volume represent the seven terms of this abstract formula.\n\nThey refer to, and describe the seven great stages of the evolutionary process, which are spoken of in the Puranas as the \"Seven Creations,\" and in the Bible as the \"Days\" of Creation.\n\n--------------------- The First Stanza describes the state of the ONE ALL during Pralaya, before the first flutter of re-awakening manifestation.\n\nA moment's thought shows that such a state can only be symbolised; to describe it is impossible.\n\nNor can it be symbolised except in negatives; for, since it is the state of Absoluteness per se, it can possess none of those specific attributes which serve us to describe objects in positive terms.\n\nHence that state can only be suggested by the negatives of all those most abstract attributes which men feel rather than conceive, as the remotest limits attainable by their power of conception.\n\nThe stage described in Stanza II.\n\nis, to a western mind , so nearly identical with that mentioned in the first Stanza, that to express the idea of its difference would require a treatise in itself.\n\nHence it must be left to the intuition and the higher faculties of the reader to grasp, as far as he can, the meaning of the allegorical phrases used.\n\nIndeed it must be remembered that all these Stanzas appeal to the inner faculties rather than to the ordinary comprehension of the physical brain.\n\nStanza III.\n\ndescribes the Re-awakening of the Universe to life after Pralaya.\n\nIt depicts the emergence of the \"Monads\" from thei[[r]] state of absorption within the ONE; the earliest and highest stage in the formation of \"Worlds,\" the term Monad being one which may apply equally to the vastest Solar System or the tiniest atom.\n\nStanza IV.\n\nshows the differentiation of the \"Germ\" of the Universe [[Vol.\n\n1, Page]] 22 THE SECRET DOCTRINE.\n\ninto the septenary hierarchy of conscious Divine Powers, who are the active manifestations of the One Supreme Energy.\n\nThey are the framers, shapers, and ultimately the creators of all the manifested Universe, in the only sense in which the name \"Creator\" is intelligible; they inform and guide it; they are the intelligent Beings who adjust and control evolution, embodying in themselves those manifestations of the ONE LAW, which we know as \"The Laws of Nature.\" Generically, they are known as the Dhyan Chohans, though each of the various groups has its own designation in the Secret Doctrine.\n\nThis stage of evolution is spoken of in Hindu mythology as the \"Creation\" of the Gods.\n\nIn Stanza V.\n\nthe process of world-formation is described: --- First, diffused Cosmic Matter, then the fiery \"whirlwind,\" the first stage in the formation of a nebula.\n\nThat nebula condenses, and after passing through various transformations, forms a Solar Universe, a planetary chain, or a single planet, as the case may be.\n\nThe subsequent stages in the formation of a \"World\" are indicated in Stanza VI., which brings the evolution of such a world down to its fourth great period, corresponding to the period in which we are now living.\n\nStanza VII."


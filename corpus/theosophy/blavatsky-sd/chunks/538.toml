body = "Arghya in Sanskrit is the libation cup, the navi -form or boat-shaped vessel in which flowers and fruit are offered to the deities.\n\nArghyanath is a title of the Maha-Chohan, meaning \"the Lord of Libations;\" and Arghya Varsha -- \"the land of libations\" -- is the mystery name of that region which extends from Kailas mountain nearly to the Schamo Desert -- from within which the Kalki Avatar is expected.\n\nThe Airyana-Varsedya of the Zoroastrians, as a locality, is identical with it.\n\nIt is now said to have been situated between the sea of Aral, Baltistan, and little Tibet; but in olden times its area was far larger, as it was the birth-place of physical humanity, of which Io is the mother and symbol.\n\n[[Vol.\n\n2, Page]] 417 THE MISTAKE OF ARRIAN EXPLAINED.\n\nUral, the Arimaspi of Herodotus being \"the recognised inhabitants of this golden region.\" And here comes, between verses 825 and 835, a puzzle to all the European interpreters.\n\nSays the Titan: -- \"To these (Arimaspi and Grypes) approach not; a far border land Thou next wilt reach, where dwells a swarthy race Near the Sun's founts, where is the AEthiop \"river\"; Along its banks proceed till thou attain The mighty rapids, where from Bybline heights Pure draughts of sacred water Neilos sends .\n\n.\n\n.\n\n\" There Io was ordained to found a colony for herself and sons.\n\nNow we must see how the passage is interpreted.\n\nAs Io is told that she has to travel eastward till she comes to the river Ethiops, which she is to follow till it falls into the Nile -- hence the perplexity.\n\n\"According to the geographical theories of the earliest Greeks\" we are informed by the author of the version on \"Prometheus Bound\" -- \"This condition was fulfilled by the river Indus.\n\nArrian ( vi.\n\ni.) mentions that Alexander the Great, when preparing to sail down the Indus (having seen crocodiles in the river Indus, and in no other river except the Nile .\n\n.\n\n.\n\n), seemed to himself to have discovered the sources of the Nile, as though the Nile, rising from some place in India, and flowing through much desert land, and thereby losing its name Indus, next .\n\n.\n\n.\n\nflowed through inhabited land, being now called the Nile by the Ethiopians of those parts and afterwards by the Egyptians.\n\nVirgil in the 4th Georgic echoes the absolute error\" ( p .\n\n197, Vol.\n\nII .).\n\nBoth Alexander and Virgil may have erred considerably in their geographical notions; but the prophecy of Prometheus has not so sinned, in the least -- not, at any rate, in its esoteric spirit.\n\nWhen a certain race is symbolised, and events pertaining to its history are rendered allegorically, no topographical accuracy ought to be expected in the itinerary traced for its personification.\n\nYet it so happens, that the river \"Ethiops\" is certainly the Indus, and it is also the Nil or Nila.\n\nIt is the river born on the Kailas (heaven) mountain, the mansion of the gods -- 22,000 feet above the level of the sea.\n\nIt was the Ethiops river -- and was so called by the Greeks, long before the days of Alexander, because its banks, from Attock down to Sind, were peopled by tribes generally referred to as the Eastern Ethiopians.\n\nIndia and Egypt were two kindred nations, and the Eastern Ethiopians -- the mighty builders -- have come from India, as is pretty well proved, it is hoped, in \" I SIS U NVEILED.\" (Vol.\n\nI.\n\np.\n\n569-70).\n\nThen why could not Alexander, and even the learned Virgil have used the word Nile or Neilos when speaking of the Indus, since it is one of its names?\n\nTo this day that river is called, in the regions around Kala-Bagh, nil (blue), and Nilah, \"the blue river.\" The water here is of such dark blue colour that the name given to it from time immemorial led to [[Vol.\n\n2, Page]] 418 THE SECRET DOCTRINE.\n\na small town on its banks being called by the same name.\n\nIt exists to this day.\n\nEvidently Arrian -- who wrote far later than the day of Alexander, and who was ignorant of the old name of the Indus -- has unconsciously slandered the Greek conqueror.\n\nNor are our modern historians much wiser, in judging as they do.\n\nFor they often make the most sweeping declarations on mere appearances, as much as their ancient colleagues ever did in days of old, when no Encyclopaedias were yet ready for them.\n\nThe race of IO, \"the cow-horned maid\" is then simply the first pioneer race of the AEthiopians brought by her from the Indus to the Nile (which received its name in memory of the mother river of the colonists from India*).\n\nFor does not Prometheus say to Io** that the sacred Neilos (the god, not the river) -- .\n\n.\n\n.\n\n\"He to the land, three-cornered, thee shall guide,\" -- namely, to the Delta, where her sons are foreordained to found -- .\n\n.\n\n.\n\n.\n\n.\n\n\"that far-off colony .\n\n.\n\n.\" ( v .\n\n830 et seq .).\n\nIt is there that a new race (the Egyptians) will begin, and a \"female race\" (873) which, \"fifth in descent\" from dark Epaphos -- \"Fifty in number shall return to Argos.\" .\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\nThen one of the fifty virgins will fail through love and shall -- .\n\n.\n\n.\n\nA kingly race in Argos bear .\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\nBut from this seed shall dauntless heroes spring, Bow-famous, who shall free me from these ills.\" When this hero shall arise, the Titan does not reveal; for as he remarks: -- \"This, to set forth at large needs lengthy speech.\" [[Footnote(s)]] ------------------------------------------------- * Alexander, who was better acquainted with Attock than with India (where he never went) could not have failed to hear the Indus near its very sources called Nil and Nilah.\n\nEven if a mistake, it is thus easily accounted for.\n\n** That Io is identical allegorically with Isis and the moon is shown by her being \"cow-horned.\" The allegory undeniably reached Greece from India, where Vach -- \"the melodious cow\" (Rig-Veda) \"from whom mankind was produced\" (Bhagavata Purana) is shown in the Aitareya Brahmana as pursued by her father Brahma, who was moved by an illicit passion, and changed her into a deer."


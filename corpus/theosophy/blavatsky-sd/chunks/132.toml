[content]
body = "It is on the acceptance or rejection of the theory of the Unity of all in Nature, in its ultimate Essence, that mainly rests the belief or unbelief in the existence around us of other conscious beings besides the Spirits of the Dead.\n\n[[Vol.\n\n1, Page]] 277 MANY BODIES BUT ONE SOUL.\n\nIt is on the right comprehension of the primeval Evolution of Spirit-Matter and its real essence that the student has to depend for the further elucidation in his mind of the Occult Cosmogony, and for the only sure clue which can guide his subsequent studies.\n\nIn sober truth, as just shown, every \"Spirit\" so-called is either a disembodied or a future man.\n\nAs from the highest Archangel (Dhyan Chohan) down to the last conscious \"Builder\" (the inferior class of Spiritual Entities), all such are men , having lived aeons ago, in other Manvantaras, on this or other Spheres; so the inferior, semi-intelligent and non-intelligent Elementals -- are all future men.\n\nThat fact alone -- that a Spirit is endowed with intelligence -- is a proof to the Occultist that that Being must have been a man, and acquired his knowledge and intelligence throughout the human cycle.\n\nThere is but one indivisible and absolute Omniscience and Intelligence in the Universe, and this thrills throughout every atom and infinitesimal point of the whole finite Kosmos which hath no bounds, and which people call SPACE, considered independently of anything contained in it.\n\nBut the first differentiation of its reflection in the manifested World is purely Spiritual, and the Beings generated in it are not endowed with a consciousness that has any relation to the one we conceive of.\n\nThey can have no human consciousness or Intelligence before they have acquired such, personally and individually.\n\nThis may be a mystery, yet it is a fact, in Esoteric philosophy, and a very apparent one too.\n\nThe whole order of nature evinces a progressive march towards a higher life.\n\nThere is design in the action of the seemingly blindest forces.\n\nThe whole process of evolution with its endless adaptations is a proof of this.\n\nThe immutable laws that weed out the weak and feeble species, to make room for the strong, and which ensure the \"survival of the fittest,\" though so cruel in their immediate action -- all are working toward the grand end.\n\nThe very fact that adaptations do occur, that the fittest do survive in the struggle for existence, shows that what is called \"unconscious Nature\"* is in reality an aggregate of forces mani- [[Footnote(s) -------------------------------------------------]] * Nature taken in its abstract sense, cannot be \"unconscious,\" as it is the emanation from, and thus an aspect (on the manifested plane) of the ABSOLUTE consciousness.\n\nWhere is that daring man who would presume to deny to vegetation and even to minerals a consciousness of their own.\n\nAll he can say is, that this consciousness is beyond his comprehension.\n\n[[Vol.\n\n1, Page]] 278 THE SECRET DOCTRINE.\n\npulated by semi-intelligent beings (Elementals) guided by High Planetary Spirits, (Dhyan Chohans), whose collective aggregate forms the manifested verbum of the unmanifested LOGOS, and constitutes at one and the same time the MIND of the Universe and its immutable LAW.\n\nThree distinct representations of the Universe in its three distinct aspects are impressed upon our thought by the esoteric philosophy: the PRE-EXISTING (evolved from) the EVER-EXISTING; and the PHENOMENAL -- the world of illusion, the reflection, and shadow thereof.\n\nDuring the great mystery and drama of life known as the Manvantara, real Kosmos is like the object placed behind the white screen upon which are thrown the Chinese shadows, called forth by the magic lantern.\n\nThe actual figures and things remain invisible, while the wires of evolution are pulled by the unseen hands; and men and things are thus but the reflections, on the white field, of the realities behind the snares of Mahamaya, or the great Illusion.\n\nThis was taught in every philosophy, in every religion, ante as well as post diluvian, in India and Chaldea, by the Chinese as by the Grecian Sages.\n\nIn the former countries these three Universes were allegorized, in exoteric teachings, by the three trinities emanating from the Central eternal germ and forming with it a Supreme Unity: the initial, the manifested, and the Creative Triad, or the three in One.\n\nThe last is but the symbol, in its concrete expression, of the first ideal two.\n\nHence Esoteric philosophy passes over the necessarianism of this purely metaphysical conception, and calls the first one, only, the Ever Existing.\n\nThis is the view of every one of the six great schools of Indian philosophy -- the six principles of that unit body of WISDOM of which the \" gnosis, \" the hidden knowledge, is the seventh.\n\nThe writer hopes that, superficially handled as may be the comments on the Seven Stanzas, enough has been given in this cosmogonic portion of the work to show Archaic teachings to be more scientific (in the modern sense of the word) on their very face, than any other ancient Scriptures left to be regarded and judged on their exoteric aspect.\n\nSince, however, as confessed before, this work withholds far more than it gives out, the student is invited to use his own intuitions.\n\nOur chief care is to elucidate that which has already been given out, and, to our regret, very incorrectly at times; to supplement the knowledge hinted at -- whenever and wherever possible -- by addi- [[Vol.\n\n1, Page]] 279 HERMES, OR ARISTOTLE?\n\ntional matter; and to bulwark our doctrines against the too strong attacks of modern Sectarianism, and more especially against those of our latter-day Materialism, very often miscalled Science, whereas, in reality, the words \"Scientists\" and \"Sciolists\" ought alone to bear the responsibility for the many illogical theories offered to the world.\n\nIn its great ignorance, the public, while blindly accepting everything that emanates from \"authorities,\" and feeling it to be its duty to regard every dictum coming from a man of Science as a proven fact -- the public, we say, is taught to scoff at anything brought forward from \"heathen\" sources.\n\nTherefore, as materialistic Scientists can be fought solely with their own weapons -- those of controversy and argument -- an Addendum is added to every Book contrasting our respective views and showing how even great authorities may often err.\n\nWe believe that this can be done effectually by showing the weak points of our opponents, and by proving their too frequent sophisms -- made to pass for scientific dicta -- to be incorrect.\n\nWe hold to Hermes and his \"Wisdom\" -- in its universal character; they -- to Aristotle as against intuition and the experience of the ages, fancying that Truth is the exclusive property of the Western world.\n\nHence the disagreement."


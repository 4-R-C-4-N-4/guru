[content]
body = "It is through this light that everything is created.\n\nThis ROOT of mental SELF is also the root of physical Self , for this light is the permutation, in our manifested world, of Mulaprakriti, called Aditi in the Vedas.\n\nIn its third aspect it becomes Vach ,*** the daughter and the mother of the Logos, as Isis is the daughter and the mother of Osiris, who is Horus; and Mout , the daughter, wife, and mother of Ammon, in the Egyptian Moon-glyph.\n\nIn the Kabala, Sephira is the same as Shekinah, and is, in another synthesis, the wife, daughter, and mother of the \"Heavenly man,\" Adam Kadmon, and is even identical with him, just as Vach is identical with Brahma, and is called the female Logos.\n\nIn the Rig-Veda, Vach is \"mystic speech,\" by whom Occult Knowledge and Wisdom are communicated to man, and thus Vach is said to have \"entered the Rishis.\" She is \"generated by the gods;\" she is the divine Vach -- the \"Queen of gods\"; and she is associated -- like Sephira with the Sephiroth -- with the Prajapati in their work of creation.\n\nMoreover, she is called \"the mother of the Vedas,\" \"since it is through her power (as mystic speech ) that Brahma revealed them, and also owing to her power that he produced the universe\" -- i.e.\n\n, through speech, and words (synthesized by the \"WORD\") and numbers.**** But Vach being also spoken of as the daughter of Daksha -- \"the god who lives in all the Kalpas\" -- her Mayavic character is thereby shown: [[Footnote(s)]] ------------------------------------------------- * Called, in the Bhagavat-Gita, Daiviprakriti.\n\n** Objective -- in the world of Maya, of course; still as real as we are.\n\n*** \"In the course of cosmic manifestation, this Daiviprakriti , instead of being the mother of the Logos, should, strictly speaking, be called his daughter.\" (\" Notes on the Bhagavat-Gita ,\" p .\n\n305, Theosophist.\n\n) **** The wise men, like Stanley Jevons amongst the moderns, who invented the scheme which makes the incomprehensible assume a tangible form, could only do so by resorting to numbers and geometrical figures.\n\n[[Vol.\n\n1, Page]] 431 THE FEMALE LOGOI.\n\nduring the pralaya she disappears, absorbed in the one, all-devouring Ray.\n\nBut there are two distinct aspects in universal Esotericism, Eastern and Western, in all those personations of the female Power in nature, or nature -- the noumenal and the phenomenal.\n\nOne is its purely metaphysical aspect, as described by the learned lecturer in his \"Notes on the Bhagavat-Gita;\" the other terrestrial and physical, and at the same time divine from the stand-point of practical human conception and Occultism.\n\nThey are all the symbols and personifications of Chaos , the \"Great Deep\" or the Primordial Waters of Space, the impenetrable VEIL between the INCOGNISABLE and the L OGOS of Creation.\n\n\"Connecting himself through his mind with Vach, Brahma (the Logos) created the primordial waters.\" In the Kathaka Upanishad it is stated still more clearly: \"Prajapati was this Universe.\n\nVach was a second to him.\n\nHe associated with her .\n\n.\n\n.\n\nshe produced these creatures and again re-entered Prajapati.\"* And here we may incidentally point out one of the many unjust slurs thrown by the pious and good missionaries in India on the religion of the land.\n\nThis allegory -- in the \"Satapatha Brahmana\" -- namely, that Brahma, as the father of men, performed the work of procreation by incestuous intercourse with his own daughter Vach, also called Sandhya (twilight), and Satarupa (the hundred formed), is incessantly thrown into the teeth of the Brahmins, as condemning their \"detestable, false religion.\" Besides the fact, conveniently forgotten by the Europeans, that the Patriarch Lot is shown guilty of the same crime under the human form , whereas Brahma, or rather Prajapati, accomplished the incest under the form of a buck with his daughter, who had that of a hind ( rohit ), the esoteric reading of Genesis ( ch.\n\niii.\n\n) shows the same.\n\nMoreover, there is certainly a cosmic , not a physiological meaning attached to the Indian allegory, since Vach is a permutation of Aditi and Mulaprakriti (Chaos), and Brahma a permutation of Narayana, the Spirit of God entering into, and fructifying nature; therefore, there is nothing phallic in the conception at all.\n\nAs already stated, Aditi-Vach is the female Logos , or the \"word,\" Verbum; and Sephira in the Kabala is the same.\n\nThese feminine Logoi are all correlations, in their noumenal aspect, of Light, and Sound, and Ether, showing how well-informed were the ancients both in [[Footnote(s)]] ------------------------------------------------- * This connects Vach and Sephira with the goddess Kwan-Yin, the \"merciful mother,\" the divine VOICE of the soul even in Exoteric Buddhism; and with the female aspect of Kwan-Shai-yin , the Logos, the verbum of Creation, and at the same time with the voice that speaks audibly to the Initiate, according to Esoteric Buddhism.\n\nBath Kol, the filia Vocis , the daughter of the divine voice of the Hebrews, responding from the mercy seat within the veil of the temple is -- a result.\n\n[[Vol.\n\n1, Page]] 432 THE SECRET DOCTRINE.\n\nphysical science (as now known to the moderns), and as to the birth of that science in the Spiritual and Astral spheres.\n\n\"Our old writers said that Vach is of four kinds .\n\n.\n\n.\n\n.\n\npara , pasyanti , madhyama , vaikhari (a statement found in the Rig-Veda and the Upanishads) .\n\n.\n\n.\n\n.\n\nVaikhari Vach is what we utter.\" It is sound, speech , that again which becomes comprehensive and objective to one of our physical senses and may be brought under the laws of perception.\n\nHence: \"Every kind of Vaikhari-Vach exists in its Madhyama .\n\n.\n\n.\n\n.\n\nPasyanti and ultimately in its Para form.\n\n.\n\n.\n\n.\n\n.\n\nThe reason why this Pranava* is called Vach is this, that these four principles of the great Kosmos correspond to these four forms of Vach.\n\n.\n\n.\n\n.\n\n."


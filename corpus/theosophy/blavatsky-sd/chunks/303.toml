body = "As such she becomes the Duad of Pythagoras, the two straight lines of the symbol that can never meet, which therefore form no geometrical figure and are [[Vol.\n\n1, Page]] 619 THE MONAD OF LEIBNITZ.\n\nthe symbol of matter.\n\nOut of this Duad, when united in one basic line of the triangle on the lower plane (the upper Triangle of the Sephirothal Tree), emerge the Elohim, or Deity in Cosmic Nature, with the true Kabalists the lowest designation, translated in the Bible \"God\" (see the same work and page).* Out of these issue the Scintillas.\n\nThe Scintillas are the \"Souls,\" and these Souls appear in the three-fold form of Monads (units), atoms and gods -- according to our teaching.\n\n\"Every atom becomes a visible complex unit (a molecule), and once attracted into the sphere of terrestrial activity, the Monadic Essence, passing through the mineral, vegetable, and animal kingdoms, becomes man.\" (Esot.\n\nCatechism.) Again, \"God, Monad, and Atom are the correspondences of Spirit, Mind, and Body ( Atma , Manas and Sthula Sarira ) in man.\" In their septenary aggregation they are the \"Heavenly Man\" (see Kabala for the latter term); thus, terrestrial man is the provisional reflection of the Heavenly.\n\n.\n\n.\n\n.\n\n.\n\n\"The Monads ( Jivas ) are the Souls of the Atoms, both are the fabric in which the Chohans (Dhyanis, gods ) cloth themselves when a form is needed.\" ( Esot.\n\nCat.\n\n) This relates to Cosmic and sub-planetary Monads, not to the Super-Cosmic Monas (the Pythagorean Monad) as called, in its synthetic character, by the Pantheistical Peripatetics.\n\nThe Monads of the present dissertation are treated from the standpoint of their individuality, as atomic Souls , before these atoms descend into pure terrestrial form.\n\nFor this descent into concrete matter marks the medial point of their own individual pilgrimage.\n\nHere, losing in the mineral kingdom their individuality, they begin to ascend through the seven states of terrestrial evolution to that point where a correspondence is firmly established between the human and Deva (divine) consciousness.\n\nAt present, however, we are not concerned with their terrestrial metamorphoses and tribulations, but with their life and behaviour in Space, on planes wherein the eye of the most intuitional chemist and physicist cannot reach them -- unless, indeed, he develops in himself highly clairvoyant faculties.\n\nIt is well known that Leibnitz came several times very near the truth, but defined monadic evolution incorrectly, which is not to be wondered at, since he was not an I NITIATE, nor even a Mystic, only a [[Footnote(s)]] ------------------------------------------------- * Such recent works as the Qabbalah of Mr.\n\nIsaac Myer and of Mr.\n\nS.\n\nL.\n\nMacGregor Mathers, fully justify our attitude towards the Jehovistic Deity.\n\nIt is not the transcendental, philosophical, and highly metaphysical abstraction of the original Kabalistic thought -- Ain-Soph-Shekinah-Adam-Kadmon, and all that follows -- that we oppose, but the crystallization of all these into the highly unphilosophical, repulsive, and anthropomorphic Jehovah, the androgynous and finite deity for which eternity, omnipotence, and omniscience are claimed.\n\nWe do not war against the IDEAL R EALITY, but the hideous theological Shadow .\n\n[[Vol.\n\n1, Page]] 620 THE SECRET DOCTRINE.\n\nvery intuitional philosopher.\n\nYet no psycho-physicist ever came nearer than he has to the esoteric general outline of evolution.\n\nThis evolution -- viewed from its several standpoints -- i.e.\n\n, as the universal and the individualized Monad; and the chief aspects of the Evolving Energy, after differentiation -- the purely Spiritual, the Intellectual, the Psychic and the Physical -- may be thus formulated as an invariable law; a descent of Spirit into Matter, equivalent to an ascent in physical evolution; a re-ascent from the depths of materiality towards its status quo ante , with a corresponding dissipation of concrete form and substance up to the L AYA state, or what Science calls \"the zero-point,\" and beyond.\n\nThese states -- once the spirit of Esoteric philosophy is grasped -- become absolutely necessary from simple logical and analogical considerations.\n\nPhysical Science having now ascertained, through its department of Chemistry, the invariable law of this evolution of atoms -- from their \" protylean \" state down to that of a physical and then a chemical particle (or molecule) -- cannot well reject the same as a general law.\n\nAnd once it is forced by its enemies -- Metaphysics and Psychology* -- out of its alleged impregnable strongholds, it will find it more difficult than it now appears to refuse room in the Spaces of S PACE to Planetary Spirits (gods), Elementals, and even the Elementary Spooks or Ghosts, and others.\n\nAlready Figuier and Paul D'Assier, two Positivists and Materialists, have succumbed before this logical necessity.\n\nOther and still greater Scientists will follow in that \"intellectual F ALL.\" They will be driven out of their position not by spiritual, theosophical, or any other physical or even mental phenomena, but simply by the enormous gaps and chasms that open daily and will still be opening before them, as one discovery follows the other, until they are finally knocked off their feet by the ninth wave of simple common sense.\n\nHere is an example: Prof.\n\nW.\n\nCrookes' latest discovery of what he has named protyle.\n\nIn the \"Notes on the Bhagavat Gita,\" by one of the best metaphysicians and Vedantic scholars in India,** the lecturer, referring cautiously to \"things occult\" in that great Indian esoteric work, makes a remark as suggestive as it is strictly correct.\n\n\".\n\n.\n\n.\n\nInto the details of the evolution of the solar system itself,\" he says, \" it is not necessary for me to enter.\n\nYou may gather some idea as to the way in which the various elements start into existence from these THREE principles into which M ULAPRAKRITI is differentiated (the Pythagorean triangle), by [[Footnote(s)]] ------------------------------------------------- * Let not the word \"psychology\" cause the reader to carry his thought by an association of ideas to modern \"Psychologists,\" so-called, whose idealism is another name for uncompromising materialism, and whose pretended Monism is no better than a mask to conceal the void of final annihilation -- even of consciousness.\n\nHere Spiritual psychology is meant.\n\n** T.\n\nSubba Row, see Theosophist for Feb., 1887.\n\n[[Vol.\n\n1, Page]] 621 THE CHEMISTRY OF THE FUTURE.\n\nexamining the lecture delivered by Professor Crookes a short time ago upon the so-called elements of modern chemistry."


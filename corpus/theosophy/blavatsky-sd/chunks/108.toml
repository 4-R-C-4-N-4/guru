body = "I am merged in Sekten.\" This last sentence gives the corroboration of, and repeats the doctrine of, esoteric Buddhism, for it alludes directly to the fifth principle (Manas), or the most spiritual part of its essence rather, which merges into, is absorbed by, and made one with Atma-Buddhi after the death of man.\n\nFor Se-khen is the residence or loka of the god Khem (Horus-Osiris, or Father and Son), hence the \"Devachan\" of Atma-Buddhi.\n\nIn the Ritual of the Dead the defunct is shown entering into Sekhem with Horus-Thot and \"emerging from it as pure spirit\" (lxiv., 29).\n\nThus the defunct says (v.\n\n130): \"I see the forms of (myself, as various) men transforming eternally .\n\n.\n\n.\n\nI know this (chapter).\n\nHe who knows it .\n\n.\n\n.\n\ntakes all kinds of living forms.\" .\n\n.\n\n.\n\nAnd in verse 35, addressing in magic formula that which is called, in Egyptian esotericism, the \"ancestral heart,\" or the re-incarnating principle, the permanent E GO, the defunct says: -- \"Oh my heart, my ancestral heart necessary for my transformations, .\n\n.\n\n.\n\n.\n\n.\n\n.\n\ndo not separate thyself from me before the guardian of the Scales.\n\nThou art my personality within my breast, divine companion watching over my fleshes (bodies).\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\" It is in Sekhem that lies concealed \"the Mysterious Face,\" or the real man concealed under the false personality, the triple-crocodile of Egypt, the symbol of the higher Trinity or human Triad, Atma , Buddhi and Manas.* In all the ancient papyri the crocodile is called Sebek (Seventh), while the water is the fifth principle esoterically; and, as already stated, Mr.\n\nGerald Massey shows that the crocodile was \"the Seventh Soul, the supreme one of seven -- the Seer unseen.\" Even exoterically Sekhem is the residence of the god Khem, and Khem is Horus avenging the death of his father Osiris, hence punishing the Sins of man when he becomes a disembodied Soul.\n\nThus the defunct [[Footnote(s)]] ------------------------------------------------- * One of the explanations of the real though hidden meaning of this Egyptian religious glyph is easy.\n\nThe crocodile is the first to await and meet the devouring fires of the morning sun, and very soon came to personify the solar heat.\n\nWhen the sun arose, it was like the arrival on earth and among men \"of the divine soul which informs the Gods.\" Hence the strange symbolism.\n\nThe mummy donned the head of a crocodile to show that it was a soul arriving from the earth.\n\n[[Vol.\n\n1, Page]] 221 CORRELATION OF BEINGS.\n\n\"Osirified\" became the god Khem, who \"gleans the field of Aanroo ,\" i.e.\n\n, he gleans either his reward or punishment, as that field is the celestial locality (Devachan) where the defunct is given wheat , the food of divine justice.\n\nThe fifth group of the celestial Beings is supposed to contain in itself the dual attributes of both the spiritual and physical aspects of the Universe; the two poles, so to say, of Mahat the Universal Intelligence, and the dual nature of man, the spiritual and the physical.\n\nHence its number Five, multiplied and made into ten, connecting it with Makara , the 10th sign of Zodiac.\n\n( g ) The sixth and seventh groups partake of the lower qualities of the Quaternary.\n\nThey are conscious, ethereal Entities, as invisible as Ether, which are shot out like the boughs of a tree from the first central group of the four, and shoot out in their turn numberless side groups, the lower of which are the Nature-Spirits, or Elementals of countless kinds and varieties; from the formless and unsubstantial -- the ideal THOUGHTS of their creators -- down to the Atomic, though, to human perception, invisible organisms.\n\nThe latter are considered as the \"Spirits of Atoms\" for they are the first remove (backwards) from the physical Atom -- sentient, if not intelligent creatures.\n\nThey are all subject to Karma, and have to work it out through every cycle.\n\nFor, as the doctrine teaches, there are no such privileged beings in the universe, whether in our or in other systems, in the outer or the inner worlds,* as the angels of the Western Religion and the Judean.\n\nA Dhyan Chohan has to become one; he cannot be born or appear suddenly on the plane of life as a full-blown angel.\n\nThe Celestial Hierarchy of the present Manvantara will find itself transferred in the next cycle of life into higher, superior worlds, and will make room for a new hierarchy, composed of the elect ones of our mankind.\n\nBeing is an endless cycle within the one absolute eternity, wherein move numberless inner cycles finite and conditioned.\n\nGods, created as such, would evince no personal merit in being gods.\n\nSuch a class of beings, perfect only by virtue of the special immaculate nature inherent in them, in the face of suffering and struggling humanity, and even of the lower creation, would be the [[Footnote(s)]] ------------------------------------------------- * A world when called \"a higher world\" is not higher by reason of its location, but because it is superior in quality or essence.\n\nYet such a world is generally understood by the profane as \"Heaven,\" and located above our heads.\n\n[[Vol.\n\n1, Page]] 222 THE SECRET DOCTRINE.\n\nsymbol of an eternal injustice quite Satanic in character, an ever present crime.\n\nIt is an anomaly and an impossibility in Nature.\n\nTherefore the \"Four\" and the \"Three\" have to incarnate as all other beings have.\n\nThis sixth group, moreover, remains almost inseparable from man, who draws from it all but his highest and lowest principles, or his spirit and body, the five middle human principles being the very essence of those Dhyanis.* Alone, the Divine Ray (the Atman) proceeds directly from the One.\n\nWhen asked how that can be?\n\nHow is it possible to conceive that those \"gods,\" or angels, can be at the same time their own emanations and their personal selves?\n\nIs it in the same sense in the material world, where the son is (in one way) his father, being his blood, the bone of his bone and the flesh of his flesh?\n\nTo this the teachers answer \"Verily it is so.\" But one has to go deep into the mystery of BEING before one can fully comprehend this truth.\n\n------- STANZA VII.\n\n-- Continued.\n\n2.\n\nT HE ONE RAY MULTIPLIES THE SMALLER RAYS.\n\nL IFE PRECEDES FORM, AND LIFE SURVIVES THE LAST ATOM ( of Form , Sthula-sarira , external body ) .\n\nT HROUGH THE COUNTLESS RAYS THE LIFE-RAY, THE ONE, LIKE A THREAD THROUGH MANY BEADS ( pearls ) ( a ) ."


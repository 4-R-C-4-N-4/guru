[content]
body = "xiv.) Again: -- \" The Heavenly rupa (Dhyan Chohan) creates ( man ) in his own form ; it is a spiritual ideation consequent on the first differentiation and awakening of the universal ( manifested ) Substance ; that form is the ideal shadow of Itself: and this is THE MAN OF THE FIRST RACE.\" To express it in still clearer form, limiting the explanation to this earth only, it was the duty of the first \"differentiated Egos\" -- the Church calls them Archangels -- to imbue primordial matter with the evolutionary impulse and guide its formative powers in the fashioning of its productions.\n\nThis it is which is referred to in the sentences both in the Eastern and Western tradition --\"the Angels were commanded to create.\n\n\" After the Earth had been made ready by the lower and more material powers, and its three Kingdoms fairly started on their way to be \"fruitful and multiply,\" the higher powers, the Archangels or Dhyanis, were compelled by the evolutionary Law to descend on Earth, in order to construct the crown of its evolution -- MAN.\n\nThus the \"Self-created\" [[Footnote(s)]] ------------------------------------------------- * \" New Aspects of Life.\n\n\" ** Angelic, Spiritual Essences, immortal in their being because unconditioned in Eternity; periodical and conditioned in their Manvantaric manifestations.\n\n[[Vol.\n\n2, Page]] 243 MAN, THE PALE SHADOW OF GOD.\n\nand the \"Self-existent\" projected their pale shadows; but group the Third, the Fire-Angels, rebelled and refused to join their Fellow Devas.\n\nHindu exotericism represents them all as Yogins, whose piety inspired them to refuse creating, as they desired to remain eternally Kumaras, \"Virgin Youths,\" in order to, if possible, anticipate their fellows in progress towards Nirvana -- the final liberation.\n\nBut, agreeably to esoteric interpretation, it was a self-sacrifice for the benefit of mankind.\n\nThe \"Rebels\" would not create will-less irresponsible men, as the \"obedient\" angels did; nor could they endow human beings with only the temporary reflections of their own attributes; for even the latter, belonging to another and a so-much higher plane of consciousness, would leave man still irresponsible, hence interfere with any possibility of a higher progress.\n\nNo spiritual and psychic evolution is possible on earth -- the lowest and most material plane -- for one who on that plane, at all events, is inherently perfect and cannot accumulate either merit or demerit.\n\nMan remaining the pale shadow of the inert, immutable, and motionless perfection, the one negative and passive attribute of the real I am that I am, would have been doomed to pass through life on earth as in a heavy dreamless sleep; hence a failure on this plane.\n\nThe Beings, or the Being, collectively called Elohim, who first (if ever) pronounced the cruel words, \"Behold, the man is become as one of us, to know good and evil; and now, lest he put forth his hand and take also of the tree of life and eat and live for ever .\n\n.\n\n.\n\n\" must have been indeed the Ilda-baoth, the Demiurge of the Nazarenes, filled with rage and envy against his own creature, whose reflection created Ophiomorphos.\n\nIn this case it is but natural -- even from the dead letter standpoint -- to view Satan, the Serpent of Genesis, as the real creator and benefactor, the Father of Spiritual mankind.\n\nFor it is he who was the \"Harbinger of Light,\" bright radiant Lucifer, who opened the eyes of the automaton created by Jehovah, as alleged; and he who was the first to whisper: \"in the day ye eat thereof ye shall be as Elohim, knowing good and evil\" -- can only be regarded in the light of a Saviour.\n\nAn \"adversary\" to Jehovah the \" personating spirit,\" he still remains in esoteric truth the ever-loving \"Messenger\" (the angel), the Seraphim and Cherubim who both knew well, and loved still more, and who conferred on us spiritual, instead of physical immortality -- the latter a kind of static immortality that would have transformed man into an undying \"Wandering Jew.\" As narrated in King's \"Gnostics,\" \"Ilda-Baoth, whom several sects regarded as the God of Moses, was not a pure spirit, he was ambitious and proud, and rejecting the spiritual light of the middle space offered him by his mother Sophia-Achamoth, he set himself to create a world of his own.\n\nAided by his sons, the six planetary genii, he fabricated man, [[Vol.\n\n2, Page]] 244 THE SECRET DOCTRINE.\n\nbut this one proved a failure.\n\nIt was a monster, soulless, ignorant, and crawling on all fours on the ground like a material beast.\n\nIlda-Baoth was forced to implore the help of his spiritual mother.\n\nShe communicated to him a ray of her divine light, and so animated man and endowed him with a soul.\n\nAnd now began the animosity of Ilda-Baoth toward his own creature.\n\nFollowing the impulse of the divine light, man soared higher and higher in his aspirations; very soon he began presenting not the image of his creator Ilda-Baoth but rather that of the Supreme Being, the 'primitive man,' Ennoia.\n\nThen the Demiurgos was filled with rage and envy; and fixing his jealous eye on the abyss of matter, his looks envenomed with passion were suddenly reflected as in a mirror; the reflection became animate, and there arose out of the abyss Satan, serpent, Ophiomorphos -- 'the embodiment of envy and cunning.\n\nHe is the union of all that is most base in matter, with the hate, envy, and craft of a spiritual intelligence.' \" This is the exoteric rendering of the Gnostics, and the allegory, though a sectarian version, is suggestive, and seems true to life.\n\nIt is the natural deduction from the dead letter text of chapter iii.\n\nof Genesis.\n\nHence the allegory of Prometheus, who steals the divine fire so as to allow men to proceed consciously on the path of spiritual evolution, thus transforming the most perfect of animals on earth into a potential god, and making him free to \"take the kingdom of heaven by violence.\" Hence also, the curse pronounced by Zeus against Prometheus, and by Jehovah-Il-da-Baoth against his \"rebellious son,\" Satan.\n\nThe cold, pure snows of the Caucasian mountain and the never-dying, singeing fire and flames of an extinguishable hell.\n\nTwo poles, yet the same idea; the dual aspect of a refined torture: a fire producer -- the personified emblem of [[ Phosphoros ]] of the astral fire and light in the anima mundi -- (that element of which the German materialist philosopher Moleschott said: \"ohne phosphor kein gedanke,\" i.e."


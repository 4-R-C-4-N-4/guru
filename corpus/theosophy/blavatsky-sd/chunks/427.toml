body = "** Language is certainly coeval with reason, and could never have been developed before men became one with the informing principles in them -- those who fructified and awoke to life the manasic element dormant in primitive man.\n\nFor, as Professor Max Muller tells us in his \" Science of Thought, \" \"Thought and language are identical.\" Yet to add to this the reflection that thoughts which are too deep for words, do not really exist at all, is rather risky, as thought impressed upon the astral tablets exists in eternity whether expressed or not.\n\nLogos is both reason and speech.\n\nBut language, proceeding in cycles, is not always adequate to express spiritual thoughts.\n\nMoreover, in one sense, the Greek Logos is the equivalent of the Sanscrit Vach, \"the immortal (intellectual) ray of spirit.\" And the fact that Vach (as Devasena, an aspect of Saraswati, the goddess of hidden Wisdom) is the spouse of the eternal celibate Kumara, unveils a suggestive, though veiled, reference to the Kumaras, those \"who refused to create,\" but who were compelled later on to complete divine Man by incarnating in him.\n\nAll this will be fully explained in the sections that follow.\n\n[[Vol.\n\n2, Page]] 200 THE SECRET DOCTRINE.\n\nIII .\n\nThe inflectional speech -- the root of the Sanskrit, very erroneously called \"the elder sister\" of the Greek, instead of its mother -- was the first language (now the mystery tongue of the Initiates, of the Fifth Race).\n\nAt any rate, the \"Semitic\" languages are the bastard descendants of the first phonetic corruptions of the eldest children of the early Sanskrit.\n\nThe occult doctrine admits of no such divisions as the Aryan and the Semite, accepting even the Turanian with ample reservations.\n\nThe Semites, especially the Arabs, are later Aryans -- degenerate in spirituality and perfected in materiality.\n\nTo these belong all the Jews and the Arabs.\n\nThe former are a tribe descended from the Tchandalas of India, the outcasts, many of them ex-Brahmins, who sought refuge in Chaldea, in Scinde, and Aria (Iran), and were truly born from their father A-bram (No Brahmin) some 8,000 years B.C.\n\nThe latter, the Arabs, are the descendants of those Aryans who would not go into India at the time of the dispersion of nations, some of whom remained on the borderlands thereof, in Afghanistan and Kabul,* and along the Oxus, while others penetrated into and invaded Arabia.\n\nBut this was when Africa had already been raised as a continent.\n\nWe have meanwhile to follow, as closely as limited space will permit, the gradual evolution of the now truly human species.\n\nIt is in the suddenly arrested evolution of certain sub-races, and their forced and violent diversion into the purely animal line by artificial cross-breeding, truly analogous to the hybridization, which we have now learned to utilize in the vegetable and animal kingdoms, that we have to look for the origin of the anthropoids.\n\n[[Footnote(s)]] ------------------------------------------------- * Ptolemy, speaking in his ninth table of the Kabolitae (Kabul tribes), calls them [[ Aristophuloi]], the aristocratic or noble tribes.\n\nThe Afghans call themselves Ben-Issrael (children of Is( sa )rael), from Issa, \"woman and also earth,\" Sons of Mother Earth.\n\nBut if you call an Afghan Yahoudi ( Jew ), he will kill you.\n\nThe subject is fully treated elsewhere.\n\nThe names of the supposed twelve tribes and the names of the real tribes, the same in number, of the Afghans, are the same.\n\nThe Afghans being far older (at any rate, their Arabic stock) than the Israelites, no one need be surprised to find such tribal names among them as Youssoufzic, \"Sons of Joseph\" in Punjcaure and Boonere; the Zablistanee (Zebulon); Ben-manasseh (sons of Manasseh) among the Khojar Tartars; Isaguri, or Issachar (now Ashnagor in Afghanistan), etc., etc.\n\nThe whole twelve names of the so-called twelve tribes are names of the signs of the Zodiac, as is now well proven.\n\nAt any rate, the names of the oldest Arabic tribes, re-transliterated, yield the names of the zodiacal signs and of the mythical sons of Jacob likewise.\n\nWhere are the traces of the Jewish twelve tribes?\n\nNowhere.\n\nBut there is a trace, and a good one, that the Jews have tried to deceive people with the help of those names.\n\nFor, see what happens ages after the ten tribes had wholly disappeared from Babylon.\n\nPtolemy Philadelphus, desiring to have the Hebrew Law translated for him into Greek (the famous Septuagint ), wrote to the high priest of the Jews, Eleazar, to send him six men from each of the twelve tribes ; and the seventy-two representatives (of whom sixty were ghosts apparently) came to the king in Egypt and translated the law amid miracles and wonders.\n\nSee Butler's \" Horae Biblicae, \" Josephus, and Philo Judaeus.\n\n[[Vol.\n\n2, Page]] 201 THE TRANSFORMATION OF THE EARTH.\n\nIn these red-haired and hair-covered monsters, the fruit of the unnatural connection between men and animals, the \"Lords of Wisdom\" did not incarnate, as we see.\n\nThus by a long series of transformations due to unnatural cross-breeding (unnatural \"sexual selection\"), originated in due course of time the lowest specimens of humanity; while further bestiality and the fruit of their first animal efforts of reproduction begat a species which developed into mammalian apes ages later.* As to the separation of sexes, it did not occur suddenly, as one may think.\n\nNature proceeds slowly in whatever she does.\n\n------- 37.\n\nT HE O NE ( androgyne ) BECAME T WO; ALSO ALL THE LIVING AND CREEPING THINGS, THAT WERE STILL ONE, GIANT-FISH, BIRDS, AND SERPENTS WITH SHELL-HEADS ( a ).\n\nThis relates evidently to the so-called age of the amphibious reptiles, during which ages science maintains that no man existed!\n\nBut what could the ancients know of antediluvian prehistoric animals and monsters!\n\nNevertheless, in Book VI .\n\nof the Commentaries is found a passage which says, freely translated: -- \" When the Third separated and fell into sin by breeding men-animals, these (the animals) became ferocious, and men and they mutually destructive.\n\nTill then, there was no sin, no life taken.\n\nAfter (the separation) the Satya (Yuga) was at an end.\n\nThe eternal spring became constant change and seasons succeeded.\n\nCold forced men to build shelters and devise clothing.\n\nThen man appealed to the superior Fathers (the higher gods or angels).\n\nThe Nirmanakaya of the Nagas, the wise Serpents and Dragons of Light came, and the precursors of the Enlightened (Buddhas)."


body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n1 [[Vol.\n\n1, Page]] 470 [[This page continued from previous section ]] § XV.\n\nON KWAN-SHI-YIN AND KWAN-YIN.\n\nL IKE Avalokiteshwara, Kwan-shi-yin has passed through several transformations, but it is an error to say of him that he is a modern invention of the Northern Buddhists, for under another appellation he has been known from the earliest times.\n\nThe Secret Doctrine teaches that \"He who is the first to appear at Renovation will be the last to come before Re-absorption (pralaya).\" Thus the logoi of all nations, from the Vedic Visvakarma of the Mysteries down to the Saviour of the present civilised nations, are the \"Word\" who was \"in the beginning\" (or the reawakening of the energising powers of Nature) with the One A BSOLUTE.\n\nBorn of Fire and Water, before these became distinct elements, IT was the \"Maker\" (fashioner or modeller) of all things; \"without him was not anything made that was made\"; \"in whom was life, and the life was the light of men\"; and who finally may be called, as he ever has been, the Alpha and the Omega of manifested Nature.\n\n\"The great Dragon of Wisdom is born of Fire and Water, and into Fire and Water will all be re-absorbed with him\" ( Fa-Hwa-King ) .\n\nAs this Bodhisatva is said \"to assume any form he pleases\" from the beginning of a Manvantara to its end, though his special birthday (memorial day) is celebrated according to the Kin-kwang-ming-King (\"Luminous Sutra of Golden Light\") in the second month on the nineteenth day, and that of \"Maitreya Buddha\" in the first month on the first day, yet the two are one.\n\nHe will appear as Maitreya Buddha, the last of the Avatars and Buddhas, in the seventh Race.\n\nThis belief and expectation are universal throughout the East.\n\nOnly it is not in the Kali yug , our present terrifically materialistic age of Darkness, the \"Black Age,\" that a new Saviour of Humanity can ever appear.\n\nThe Kali yug is [[Vol.\n\n1, Page]] 471 DISEASED IMAGINATION.\n\n\"l'Age d'Or\" (!) only in the mystic writings of some French pseudo-Occultists.\n\n(See \"La Mission des Juifs.\") Hence the ritual in the exoteric worship of this deity was founded on magic.\n\nThe Mantras are all taken from special books kept secret by the priests, and each is said to work a magical effect; as the reciter or reader produces, by simply chanting them, a secret causation which results in immediate effects.\n\nKwan-Shi-Yin is Avalokiteshwara, and both are forms of the seventh Universal Principle; while in its highest metaphysical character this deity is the synthetic aggregation of all the planetary Spirits, Dhyani Chohans.\n\nHe is the \"Self-manifested;\" in short, the \"Son of the Father.\" Crowned with seven dragons, above his statue there appears the inscription Pu-Tsi-K'iun-ling, \"the universal Saviour of all living beings.\" Of course the name given in the archaic volume of the Stanzas is quite different, but Kwan-Yin is a perfect equivalent.\n\nIn a temple of Pu'to, the sacred island of the Buddhists in China, Kwan-Shi-Yin is represented floating on a black aquatic bird ( Kala-Hansa ), and pouring on the heads of mortals the elixir of life, which, as it flows, is transformed into one of the chief Dhyani-Buddhas -- the Regent of a star called the \"Star of Salvation.\" In his third transformation Kwan-Yin is the informing spirit or genius of Water.\n\nIn China the Dalai-Lama is believed to be an incarnation of Kwan-Shi-Yin, who in his third terrestrial appearance was a Bodhisattva, while the Teshu Lama is an incarnation of Amitabha Buddha, or Gautama.\n\nIt may be remarked en passant that a writer must indeed have a diseased imagination to discover phallic worship everywhere, as do the authors of \"China Revealed\" (McClatchey) and \"Phallicism.\" The first discovers \"the old phallic gods, represented under two evident symbols -- the Khan or Yang, which is the membrum virile , and the Kwan or Yin, the pudendum muliebre.\n\n\" (See \" Phallicism ,\" p.\n\n273.) Such a rendering seems the more strange as Kwan-Shi-Yin (Avalokiteswara) and Kwan-Yin, besides being now the patron deities of the Buddhist ascetics, the Yogis of Thibet, are the gods of chastity, and are, in their esoteric meaning, not even that which is implied in the rendering of Mr.\n\nRhys Davids' \"Buddhism,\" (p.\n\n202): \"The name Avalokiteshwara .\n\n.\n\n.\n\nmeans 'the Lord who looks down from on high.' \"Nor is Kwan-Shi-Yin \"the Spirit of the Buddhas present in the Church,\" but, literally interpreted, it means \"the Lord that is seen,\" and in one sense, \"the divine SELF perceived by Self\" (the human) -- the Atman or seventh principle merged in the Universal, perceived by, or the object of perception to, Buddhi, the sixth principle or divine Soul in man.\n\nIn a still higher sense, Avalokiteshwara = Kwan-Shi-Yin, referred to as the seventh Universal principle, is the Logos [[Vol.\n\n1, Page]] 472 THE SECRET DOCTRINE.\n\nperceived by the Universal Buddhi -- or Soul, as the synthetic aggregate of the Dhyani-Buddhas: and is not the \"Spirit of Buddha present in the Church,\" but the omnipresent universal Spirit manifested in the temple of Kosmos or Nature.\n\nThis Orientalistic etymology of Kwan and Yin is on a par with that of \"Yogini,\" which, we are told by Mr.\n\nHargrave Jennings, \"is a Sanskrit word, in the dialects pronounced Yogi or Zogee (!), and is equivalent to Sena, and exactly the same as Duti or Duti-Ca' -- i.e.\n\n, a sacred prostitute of the temple, worshipped as Yoni or Sakti\" (p.\n\n60).\n\n\"The books of morality,\" in India, \"direct a faithful wife to shun the society of Yogini or females who have been adored as Sakti .\n\n.\n\n.\n\namongst the votaries of a most licentious description.\" Nothing should surprise us after this."


[content]
body = "Like the Hindus, the Greeks and Romans (we speak of the Initiates), the Chaldees and the Egyptians, the Druids believed in the doctrine of a succession of worlds, as also in that of seven \"creations\" (of new continents) and transformations of the face of the earth, and in a seven-fold night and day for each earth or globe ( See \" Esoteric Buddhism \") .\n\nWherever the Serpent with the egg is found, there this tenet was surely present.\n\nTheir Dracontia are a proof of it.\n\nThis belief was so universal that, if we seek for it in the esotericism of various religions, we shall discover it in all.\n\nWe shall find it among the Aryan Hindus and Mazdeans, the Greeks, the Latins, and even among the old Jews and early Christians, whose modern stocks [[Footnote(s)]] ------------------------------------------------- * But the Magi of Persia were never Persians -- not even Chaldeans.\n\nThey came from a far-off land, the Orientalists being of opinion that the said land was Media.\n\nThis may be so, but from what part of Media?\n\nTo this we receive no answer.\n\n[[Vol.\n\n2, Page]] 757 PAGANISM AND CHRISTIANITY AGREE.\n\nhardly comprehend now that which they read in their Scriptures.\n\nSee what Seneca says in Epistle 9, and Quaest.\n\nNat.\n\nIII ., c., ult.: \"The world being melted and having re-entered the bosom of Jupiter, this god continues for some time to remain absorbed in himself and concealed, wholly immersed in contemplation.\n\nAfter which a new world springs from him.\n\n.\n\n.\n\n.\n\nAn innocent race of men and animals are produced anew .\n\n.\n\n.\n\netc.\" Then again when speaking of periodical mundane dissolution involving universal death, he (Seneca) says that \"when the laws of nature shall be buried in ruin, and the last day of the world shall come, the southern pole shall crush, as it falls, all the regions of Africa, and the North pole shall overwhelm all the countries beneath its axis.\n\nThe affrighted sun shall be deprived of its light ; the palace of heaven falling to decay shall produce at once both life and death, and some kind of dissolution shall equally seize upon all deities, who thus shall return into their original chaos\" ( Quoted in \" Book of God, \" p.\n\n160.) One might imagine oneself reading the Puranic account by Parasara of the great Pralaya.\n\nIt is nearly the same thing, idea for idea.\n\nHas Christianity nothing of the kind?\n\nIt has, we say.\n\nLet the reader open any English Bible and read chapter iii.\n\nof the Second Epistle of Peter, from verse iii.\n\ntill the xivth, and he will find there the same ideas.\n\n.\n\n.\n\n.\n\n\"There shall come in the last days scoffers .\n\n.\n\n.\n\nsaying, 'where is the promise of his coming?\n\n.\n\n.\n\n.\n\n.\n\nSince the fathers fell asleep all things continue as they were from the beginning of creation.' For, they are ignorant .\n\n.\n\n.\n\n.\n\nthat by the word of God the heavens were of old, and the earth standing out of the water and in the water : whereby the world that then was, being overflowed with water, perished.\n\nBut the heavens and the earth that are now, are reserved unto the fire .\n\n.\n\n.\n\n.\n\nwherein the heavens .\n\n.\n\n.\n\n.\n\nshall be dissolved, and the elements shall melt with fervent heat .\n\n.\n\n.\n\n.\n\nwe nevertheless look for new heavens and new earth, etc., etc.\n\n\" If the interpreters chose to see in this a reference to creation, the deluge, and the promised coming of Christ, when they will live in a new Jerusalem in heaven, this is no fault of \"Peter.\" What the writer of the Epistles meant was the destruction of this Fifth Race of ours by subterranean fires and inundations, and the appearance of new continents for the Sixth Root-Race.\n\nFor the writers of these Epistles were all learned in symbology if not in the sciences.\n\nIt was mentioned elsewhere that the belief in the septenary constitution of our \"chain\" was the oldest tenet of the early Iranians, who got it from the first Zarathustra.\n\nIt is time to prove it to those Parsis who have lost the key to the meaning of their Scriptures.\n\nIn the Avesta the earth is considered septempartite and tripartite at one and the same time.\n\nThis is regarded by Dr.\n\nGeiger, as an incongruity, for the following reasons, which he calls discrepancies: the Avesta speaks [[Vol.\n\n2, Page]] 758 THE SECRET DOCTRINE.\n\nof the three-thirds of the earth because the Rig-Veda mentions \"three earths.\" .\n\n.\n\n.\n\n.\n\n\"Three strata or layers, one lying above the other, are said to be meant by this.\"* But he is quite mistaken, as are all exoteric profane translators.\n\nThe Avesta has not borrowed the idea from the Rig-Veda, but simply repeats the esoteric teaching.\n\nThe \"three strata or layers\" do not refer to our globe alone, but to three layers of the globes of our terrestrial chain -- two by two, on each plane, one on the descending, the other on the ascending arc.\n\nThus, with reference to the six spheres or globes above our earth, the seventh and the fourth, it is septempartite, while with regard to the planes over our plane -- it is tripartite.\n\nThis meaning is carried out and corroborated by the text in the Avesta and Vendidad, and even by the speculations -- a most laborious and unsatisfactory guess-work -- of the translators and commentators.\n\nIt thus follows that the division of the \"earth,\" or rather the earth's chain, into seven Karshvars is not in contradiction with the three \"zones,\" if this word is read \"planes.\" As Geiger remarks, this septenary division is very old -- the oldest of all -- since the Gathas already speak of the \"septempartite earth.\" ( Bumi haptaiti, Yasna, xxxii., 3.) For, \"according to the Parsee Scriptures, the seven Karshvars are to be considered as completely disconnected parts of the earth, \" which they surely are.\n\nFor, \"between them there flows the Ocean, so that it is impossible, as stated in several passages, to pass from one Karshvar to another.\"** The \"Ocean\" is space, of course, for the latter was called \"Waters of Space\" before it was known as Ether.\n\nMoreover, the word Karshvar is consistently rendered by Dwipa, and especially Qaniratha by Jambudwipa (\"Neriosengh, the translator of the Yasna.\")*** But this fact is not taken into account by the Orientalists, and therefore we find even such a learned Zoroastrian and Parsi by birth as the translator of Dr.\n\nGeiger's work passing unnoticed and without a word of comment sundry remarks of the former on the \"incongruities\" of this kind abounding in the Mazdean Scriptures."


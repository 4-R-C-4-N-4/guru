body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n1 [[Vol.\n\n1, Page]] 359 THE EGG-BORN GOD.\n\n§ VI.\n\nTHE MUNDANE EGG.\n\nW HENCE this universal symbol?\n\nThe Egg was incorporated as a sacred sign in the cosmogony of every people on the Earth, and was revered both on account of its form and its inner mystery.\n\nFrom the earliest mental conceptions of man, it was known as that which represented most successfully the origin and secret of being.\n\nThe gradual development of the imperceptible germ within the closed shell; the inward working, without any apparent outward interference of force, which from a latent nothing produced an active something , needing nought save heat; and which, having gradually evolved into a concrete, living creature, broke its shell, appearing to the outward senses of all a self-generated, and self-created being -- must have been a standing miracle from the beginning.\n\nThe secret teaching explains the reason for this reverence by the Symbolism of the prehistoric races.\n\nThe \"First Cause\" had no name in the beginnings.\n\nLater it was pictured in the fancy of the thinkers as an ever invisible, mysterious Bird that dropped an Egg into Chaos, which Egg becomes the Universe.\n\nHence Brahm was called Kalahansa, \"the swan in (Space and) Time.\" He became the \"Swan of Eternity,\" who lays at the beginning of each Mahamanvantara a \"Golden Egg.\" It typifies the great Circle, or O, itself a symbol for the universe and its spherical bodies.\n\nThe second reason for its having been chosen as the symbolical representation of the Universe, and of our earth, was its form.\n\nIt was a Circle and a Sphere; and the ovi-form shape of our globe must have been known from the beginning of symbology, since it was so universally adopted.\n\nThe first manifestation of the Kosmos in the form of an egg was the most widely diffused belief of antiquity.\n\nAs Bryant shows (iii., 165), it was a symbol adopted among the Greeks, the Syrians, Persians, and Egyptians.\n\nIn chap.\n\nliv.\n\nof the Egyptian Ritual, Seb, the god of Time and of the Earth, is spoken of as having laid an egg, or the Universe, \"an egg conceived at the hour of the great one of the Dual Force\" (Sec.\n\nV., 2, 3, etc.).\n\nRa is shown like Brahma gestating in the Egg of the Universe.\n\nThe deceased is \"resplendent in the Egg of the land of mysteries\" (xxii., 1).\n\nFor, this is \"the Egg to which is given life among the gods\" (xlii., 11).\n\n\"It is the Egg of the great clucking Hen, the Egg of Seb, who issues from it like a hawk\" (lxiv., 1, 2, 3; lxxvii., 1).\n\nWith the Greeks the Orphic Egg is described by Aristophanes, and was part of the Dionysiac and other mysteries, during which [[Vol.\n\n1, Page]] 360 THE SECRET DOCTRINE.\n\nthe Mundane Egg was consecrated and its significance explained; Porphyry showing it a representation of the world, [[ Ermenenei de to oon kosmon ]].\n\nFaber and Bryant have tried to show that the egg typified the ark of Noah, which, unless the latter is accepted as purely allegorical and symbolical, is a wild belief.\n\nIt can have typified the ark only as a synonym of the moon, the argha which carries the universal seed of life; but had surely nothing to do with the ark of the Bible.\n\nAnyhow, the belief that the universe existed in the beginning in the shape of an egg was general.\n\nAnd as Wilson has it: \"A similar account of the first aggregation of the elements in the form of an egg is given in all the (Indian) Puranas, with the usual epithet Haima or Hiranya, 'golden' as it occurs in Manu.\" Hiranya, however, means \"resplendent,\" \"shining,\" rather than \"golden,\" as proven by the great Indian scholar, the late Swami Dayanand Sarasvati, in his unpublished polemics with Professor Max Muller.\n\nAs said in the Vishnu Purana: \"Intellect (Mahat) .\n\n.\n\n.\n\nthe (unmanifested) gross elements inclusive, formed an egg .\n\n.\n\n.\n\nand the lord of the Universe himself abided in it, in the character of Brahma.\n\nIn that egg, O Brahman, were the continents, and seas and mountains, the planets and divisions of the universe, the gods, the demons and mankind.\" ( Book i., ch.\n\n2.) Both in Greece and in India the first visible male being, who united in himself the nature of either sex, abode in the egg and issued from it.\n\nThis \"first born of the world\" was Dionysius, with some Greeks; the god who sprang from the mundane egg, and from whom the mortals and immortals were derived.\n\nThe god Ra is shown in the Ritual (Book of the Dead, xvii., 50) beaming in his egg (the Sun), and he starts off as soon as the god Shoo (the Solar energy) awakens and gives him the impulse.\n\n\"He is in the Solar egg, the egg to which is given life among the gods\" ( Ibid.\n\n, xlii., 13).\n\nThe Solar god exclaims: \"I am the creative soul of the celestial abyss.\n\nNone sees my nest, none can break my egg, I am the Lord!\" ( Ibid.\n\n, LXXXV.).\n\nIn view of this circular form, the \"|\" issuing from the \" ,\" or the egg, or the male from the female in the androgyne, it is strange to find a scholar saying -- on the ground that the most ancient Indian MSS .\n\nshow no trace of it -- that the ancient Aryans were ignorant of the decimal notation.\n\nThe 10, being the sacred number of the universe, was secret and esoteric, both as the unit and cipher, or zero , the circle.\n\nMoreover, Professor Max Muller says that \"the two words cipher and zero , which are but one, are sufficient to prove that our figures are borrowed from the Arabs.* Cipher is the Arabic \"cifron,\" and means [[Footnote(s)]] ------------------------------------------------- * See Max Muller's \"Our Figures.\" [[Vol.\n\n1, Page]] 361 WHENCE OUR FIGURES?\n\nempty , a translation of the Sanscrit name of nought \"sunya,\" he says.* The Arabs had their figures from Hindustan, and never claimed the discovery for themselves.** As to the Pythagoreans, we need but turn to the ancient manuscripts of Boethius's Geometry , composed in the sixth century, to find among the Pythagorean numerals*** the 1 and the nought , as the first and final ciphers."


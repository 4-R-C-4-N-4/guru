body = "2, Page]] 463 CHRISTIAN SYMBOLISM Chaldean \"Nuah, the Universal Mother\" (female Noah, considered as one with the ark), and of the female triad, Ana, Belita and Davikina; called, when blended into one, \"Sovereign goddess, lady of the Nether Abyss, Mother of gods, Queen of the Earth, and Queen of fecundity.\" Later, Belita or Damti (the sea), the Mother of the City of Erech (the great Chaldean Necropolis) became Eve; and now she is Mary the Virgin, in the Latin Church, represented as standing on the crescent-moon, and, at times on the Globe, to vary the programme.\n\nThe navi , or ship-like form of the crescent, which blends in itself all those common symbols of the ship of life, such as Noah's ark, the Yoni of the Hindus, and the ark of the Covenant, is the female symbol of the Universal \"Mothers of the gods,\" and is now found under its Christian symbol in every Church, as the nave (from navis, the ship).* The navis -- the Sidereal vessel -- is fructified by the Spirit of Life -- the male God; or, as the learned Kenealy (in his Apocalypsis ) calls it very appropriately -- the Holy Spirit.\n\nIn Western religious symbology the Crescent was the male, the full moon, the female aspect of that universal Spirit.\n\n\"The mystic word Alm , which the prophet Mahomet prefixed to many chapters of the Koran, alludes to her as the Alm, the immaculate Virgin of the heavens.\n\nAnd -- the sublime ever falling into the ridiculous -- it is from this root Alm that we have to derive the word Almeh -- the Egyptian dancing-girls.\n\nThe latter are \"Virgins\" of the same type as the Nautchnis in India, and the (female) Kadeshim, the Holy Ones of the Jewish temples (those consecrated to Jehovah, who represented both sexes), whose holy functions in the Israelite fanes were identical with those of the Nautchnis.\n\nNow Eustathius declares that ([ IO ]) IO means the moon, in the dialect of the Argians; and it was one of the names of the same in Egypt.\n\nSays Jablonski, \"[[ IO ]], Ioh , AEgyptiis L UNAM significat neque habent illi in communi sermonis usu, aliud nomen quo Lunam, designent praeter IO.\n\n\" The pillar and Circle ( IO ), now constituting the first decimal number, and which with Pythagoras was the perfect number contained in the Tetractis,** became later a pre - eminently phallic Number -- amongst the Jews, foremost of all, with whom it is the male and female Jehovah.\n\nThis is how a scholar explains it: -- [[Footnote(s)]] ------------------------------------------------- * Timaeus, the Locrian, speaking of Arka, calls her \"the Principle of best things.\" The word arcane , \"hidden,\" or secret, is derived from Arka .\n\n\"To no one is the Arcane shown except to the most High\" ( Codex Nazareus ) , alluding to nature the female, and Spirit, the male Power.\n\nAll the Sun-Gods were called Archagetos \"born from the Arka, \" the divine Virgin-Mother of the Heavens.\n\n** Because composed of ten dots arranged triangularly in four rows.\n\nIt is the Tetragrammaton of the Western Kabalists.\n\n[[Vol.\n\n2, Page]] 464 THE SECRET DOCTRINE.\n\n\"I find, on the Rosetta stone of Uhlemann, the word mouth, also in Seiffarth, viz., the name of the Moon used as a cycle of Time, hence the lunar month from the hieroglyph with and as determinatives given, as the Coptic I O H , or I O H .\n\nThe Hebrew may also be used as I O H , for the letter yau, or , was used for o and for u , and for v or w .\n\nThis, before the Massora, of which the .\n\nwas used as = o, = u, and = v or w.\n\nNow I had worked it out by original search that the great distinctive function of the god-name Jehovah was designative of the influence of the moon as the causative of generation, and as of its exact value as a lunar year in the natural measure of days, as you will fully see, .\n\n.\n\n.\n\n.\n\nAnd here comes this linguistic same word from a source far more ancient; viz., the Coptic, or rather from the old Egyptian in time of the Coptic.\".\n\n.\n\n.\n\n.\n\n(From a MS .) This is the more remarkable when Egyptology compares this with the little which it knows about the Theban triad -- composed of Ammon, Mouth, (or Mout ) and their son Khonsoo.\n\nThis triad was, when united, contained in the moon as their common symbol; and when separated, it was Khonsoo who was the god, L UNUS, being thus confounded with Thot and Phtah.\n\nHis mother Mout( h ) -- the name signifying Mother, by the bye, not the moon, which was only her Symbol -- is called the \"Queen of Heaven\"; the \"Virgin,\" etc., etc., as she is an aspect of Isis, Hathor, and other mother goddesses.\n\nShe was less the wife than the mother of Ammon, whose distinct title is \"the husband of his Mother.\" In a statuette at Boulaq, Cairo, this triad is represented ( Number 1981 Serapeum, Greek Period ) as a mummy-god holding in his hand three different sceptres, and bearing the lunar disc on his head, the characteristic tress of hair showing the design of representing it as that of an infant god, or \"the Sun,\" in the triad.\n\nHe was the god of Destinies in Thebes, and appears under two aspects (1) as \"Khonsoo, the Lunar god, and Lord of Thebes, Nofir - hotpoo -- ' he who is in absolute repose'; and (2) as Khonsoo Iri - sokhroo, or 'Khonsoo, who executes Destiny': the former preparing the events and conceiving them for those born under his generative influence; the latter putting them into action.\" ( See Maspero ' s Definitions ) .\n\nUnder theogonic permutations Ammon becomes Horus, HOR-AMMON , and Mout(h)-Isis is seen suckling him in a statuette of the Saitic period.\n\n( Abydos.\n\n) In his turn, in this transformed triad, Khonsoo becomes Thot - Lunus, \"he who operates salvation.\" His brow is crowned with the head of an ibis decorated with the lunar disc and the diadem called IO- tef .\n\nNow all these symbols are certainly found reflected in (some believe them identical with) the Yave, or Jehovah of the Bible.\n\nThis will be [[Vol."


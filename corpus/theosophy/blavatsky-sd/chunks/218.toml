body = "For which his mother coolly puts him down by saying, \"Do not lie, Ildabaoth, for the father of all, the first man ( Anthropos ) is above thee , and so is Anthropos , the Son of Anthropos \" (Irenaeus, b.\n\nI, ch.\n\nxxx., 6).\n\nThis is a good proof that there were three Logoi (besides the Seven born of the First), one of these being the Solar Logos.\n\nAnd, again, who was that \"Anthropos\" himself, so much higher than Ildabaoth?\n\nThe Gnostic records alone can solve this riddle.\n\nIn Pistis Sophia the four-vowelled name I EOV is in each case accompanied by the epithet of \"the Primal, or First man.\" This shows again that the gnosis was but an echo of our archaic doctrine.\n\nThe names answering to Parabrahm, to Brahm, and Manu (the first thinking man) are composed of one-vowelled, three-vowelled and seven-vowelled sounds.\n\nMarcus, whose philosophy was certainly more Pythagorean than anything else, speaks of a revelation to him of the seven heavens sounding each one vowel as they pronounced the seven names of the seven (angelic) hierarchies.\n\nWhen spirit has permeated every minutest atom of the seven principles of Kosmos, then the secondary creation, after the above-mentioned period of rest, begins.\n\n[[Footnote(s)]] ------------------------------------------------- * See \"Isis Unveiled,\" Vol.\n\nII., p.\n\n183.\n\n** See also King's Gnostics.\n\nOther sects regarded Jehovah as Ildabaoth himself King identifies him with Saturn.\n\n[[Vol.\n\n1, Page]] 450 THE SECRET DOCTRINE.\n\n\"The creators (Elohim) outline in the second 'hour' the shape of man,\" says Rabbi Simeon ( The Nuctameron of the Hebrews ) .\n\n\"There are twelve hours in the day,\" says the Mishna , \"and it is during these that creation is accomplished.\" The \"twelve hours of the day\" are again the dwarfed copy, the faint, yet faithful, echo of primitive Wisdom.\n\nThey are like the 12,000 divine years of the gods, a cyclic blind.\n\nEvery \"Day of Brahma\" has 14 Manus, which the Hebrew Kabalists, following, however, in this the Chaldeans, have disguised into 12 \"Hours.\"* The Nuctameron of Apollonius of Tyana is the same thing.\n\n\"The Dodecahedron lies concealed in the perfect Cube,\" say the Kabalists.\n\nThe mystic meaning of this is, that the twelve great transformations of Spirit into matter (the 12,000 divine years) take place during the four great ages, or the first Mahayuga.\n\nBeginning with the metaphysical and the supra-human, it ends in the physical and purely human natures of Kosmos and man.\n\nEastern philosophy can give the number of mortal years that run along the line of spiritual and physical evolutions of the seen and the unseen, if Western science fails to do so.\n\nPrimary Creation is called the Creation of Light (Spirit); and the Secondary -- that of Darkness (matter).** Both are found in Genesis , chap.\n\ni., v.\n\n2, and at the beginning of chapter ii.\n\nThe first is the emanation of self -born gods (Elohim); the second of physical nature.\n\nThis is why it is said in the Zohar: -- \"Oh, companions, companions, man as emanation was both man and woman; as well on the side of the F ATHER as on the side of the M OTHER.\n\nAnd this is the sense of the words: -- And Elohim spoke: 'Let there be Light and it was Light!' .\n\n.\n\n.\n\nAnd this is the 'two-fold man'\" Light, moreover, on our plane, is darkness in the higher spheres.\n\n\"Man and woman on the side of the FATHER\" (Spirit) refers to Primary Creation; and on the side of the Mother (matter) to the secondary.\n\nThe two-fold man is Adam Kadmon, the male and female abstract prototype and the differentiated Elohim .\n\nMan proceeds from the Dhyan Chohan, and is a \"Fallen Angel,\" a god in exile, as will be shown.\n\nIn India these creations were described as follows: -- (I.) Mahat-tattwa creation -- so-called because it was the primordial self-evolution of that which had to become Mahat -- the \"divine M IND, conscious and intelligent\"; esoterically, \"the spirit of the Universal soul.\" .\n\n.\n\n.\n\n\"Worthiest of ascetics, through its potency ( the potency of that cause ); every produced cause comes by its proper nature.\" ( Vishnu Purana.\n\n) \"Seeing that the potencies of all beings are under- [[Footnote(s)]] ------------------------------------------------- * Elsewhere, however, the identity is revealed.\n\nSee supra , the quotation from Ibn-Gabirol and his 7 heavens, 7 earths, etc.\n\n** This must not be confused with precosmic \" D ARKNESS,\" the Divine ALL.\n\n[[Vol.\n\n1, Page]] 451 MANY VERSIONS OF THE ONE TRUTH.\n\nstood only through the knowledge of That (Brahma), which is beyond reasoning, creation, and the like, such potencies are referable to Brahma.\" T HAT, then, precedes the manifestation.\n\n\"The first was Mahat ,\" says Linga Purana; for the ONE (the That ) is neither first nor last , but ALL.\n\nExoterically, however, this manifestation is the work of the \"Supreme One\" (a natural effect , rather, of an Eternal Cause); or, as the Commentator says, it might have been understood to mean that Brahma was then created (?), being identified with Mahat, active intelligence or the operating will of the Supreme.\n\nEsoteric philosophy renders it \"the operating LAW.\" It is on the right comprehension of this tenet in the Brahmanas and Puranas that hangs, we believe, the apple of discord between the three Vedantin Sects: the Advaita, Dwaita, and the Visishtadvaitas.\n\nThe first arguing rightly that Parabrahman, having no relation, as the absolute all , to the manifested world -- the Infinite having no connection with the finite -- can neither will nor create; that, therefore, Brahma, Mahat, Iswara, or whatever name the creative power may be known by, creative gods and all, are simply an illusive aspect of Parabrahmam in the conception of the conceivers; while the other sects identify the impersonal Cause with the Creator, or Iswara.\n\nMahat (or Maha-Buddhi) is, with the Vaishnavas, however, divine mind in active operation , or, as Anaxagoras has it, \"an ordering and disposing mind, which was the cause of all things,\" -- [[ Nous o diakosmonte kai panton aitios ]]."


body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n1 [[Vol.\n\n1, Page 25]] PART I .\n\nCOSMIC EVOLUTION.\n\n--------------------- SEVEN STANZAS TRANSLATED WITH COMMENTARIES FROM THE SECRET BOOK OF DZYAN.\n\n[[Vol.\n\n1, Page 26]] Nor Aught nor Nought existed; yon bright sky Was not, nor heaven's broad roof outstretched above.\n\nWhat covered all?\n\nwhat sheltered?\n\nwhat concealed?\n\nWas it the water's fathomless abyss?\n\nThere was not death -- yet there was nought immortal, There was no confine betwixt day and night; The only One breathed breathless by itself, Other than It there nothing since has been.\n\nDarkness there was, and all at first was veiled In gloom profound -- an ocean without light -- The germ that still lay covered in the husk Burst forth, one nature, from the fervent heat.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\nWho knows the secret?\n\nwho proclaimed it here?\n\nWhence, whence this manifold creation sprang?\n\nThe Gods themselves came later into being -- Who knows from whence this great creation sprang?\n\nThat, whence all this great creation came, Whether Its will created or was mute, The Most High Seer that is in highest heaven, He knows it -- or perchance even He knows not.\" \"Gazing into eternity .\n\n.\n\n.\n\nEre the foundations of the earth were laid, .\n\n.\n\n.\n\n.\n\n.\n\nThou wert.\n\nAnd when the subterranean flame Shall burst its prison and devour the frame .\n\n.\n\n.\n\nThou shalt be still as Thou wert before And knew no change, when time shall be no more.\n\nOh!\n\nendless thought, divine E TERNITY.\" [[Vol.\n\n1, Page]] 27 THE SECRET DOCTRINE.\n\nCOSMIC EVOLUTION.\n\nIn Seven Stanzas translated from the Book of Dzyan.\n\n--------------------- STANZA I.\n\n1.\n\nT HE ETERNAL PARENT WRAPPED IN HER EVER INVISIBLE ROBES HAD SLUMBERED ONCE AGAIN FOR SEVEN ETERNITIES.\n\n2.\n\nT IME WAS NOT, FOR IT LAY ASLEEP IN THE INFINITE BOSOM OF DURATION.\n\n3.\n\nU NIVERSAL MIND WAS NOT, FOR THERE WERE NO A H-HI TO CONTAIN IT.\n\n4.\n\nT HE SEVEN WAYS TO BLISS WERE NOT.\n\nT HE GREAT CAUSES OF MISERY WERE NOT, FOR THERE WAS NO ONE TO PRODUCE AND GET ENSNARED BY THEM.\n\n5.\n\nD ARKNESS ALONE FILLED THE BOUNDLESS ALL, FOR FATHER, MOTHER AND SON WERE ONCE MORE ONE, AND THE SON HAD NOT AWAKENED YET FOR THE NEW WHEEL, AND HIS PILGRIMAGE THEREON.\n\n6.\n\nT HE SEVEN SUBLIME LORDS AND THE SEVEN TRUTHS HAD CEASED TO BE, AND THE U NIVERSE, THE SON OF N ECESSITY, WAS IMMERSED IN P ARANISHPANNA, TO BE OUTBREATHED BY THAT WHICH IS AND YET IS NOT.\n\nN AUGHT WAS.\n\n7.\n\nT HE CAUSES OF EXISTENCE HAD BEEN DONE AWAY WITH; THE VISIBLE THAT WAS, AND THE INVISIBLE THAT IS, RESTED IN ETERNAL NON-BEING -- THE ONE BEING.\n\n8.\n\nA LONE THE ONE FORM OF EXISTENCE STRETCHED BOUNDLESS, INFINITE, CAUSELESS, IN DREAMLESS SLEEP; AND LIFE PULSATED UNCONSCIOUS IN UNIVERSAL SPACE, THROUGHOUT THAT ALL-PRESENCE WHICH IS SENSED BY THE OPENED EYE OF THE D ANGMA.\n\n9.\n\nB UT WHERE WAS THE D ANGMA WHEN THE A LAYA OF THE UNIVERSE WAS IN P ARAMARTHA AND THE GREAT WHEEL WAS A NUPADAKA?\n\n[[Vol.\n\n1, Page]] 28 THE SECRET DOCTRINE.\n\nSTANZA II.\n\n1.\n\n.\n\n.\n\n.\n\nW HERE WERE THE BUILDERS, THE LUMINOUS SONS OF M ANVANTARIC DAWN?\n\n.\n\n.\n\n.\n\nI N THE UNKNOWN DARKNESS IN THEIR A H-HI P ARANISHPANNA.\n\nTHE PRODUCERS OF FORM FROM NO-FORM -- THE ROOT OF THE WORLD -- THE D EVAMATRI AND S VABHAVAT, RESTED IN THE BLISS OF NON-BEING.\n\n2.\n\n.\n\n.\n\n.\n\nW HERE WAS SILENCE?\n\nW HERE THE EARS TO SENSE IT?\n\nN O, THERE WAS NEITHER SILENCE NOR SOUND; NAUGHT SAVE CEASELESS ETERNAL BREATH, WHICH KNOWS ITSELF NOT.\n\n3.\n\nT HE HOUR HAD NOT YET STRUCK; THE RAY HAD NOT YET FLASHED INTO THE G ERM; THE M ATRIPADMA HAD NOT YET SWOLLEN.\n\n4.\n\nH ER HEART HAD NOT YET OPENED FOR THE ONE RAY TO ENTER, THENCE TO FALL, AS THREE INTO FOUR, INTO THE LAP OF M AYA.\n\n5.\n\nT HE SEVEN SONS WERE NOT YET BORN FROM THE WEB OF LIGHT.\n\nD ARKNESS ALONE WAS FATHER-MOTHER, S VABHAVAT; AND S VABHAVAT WAS IN DARKNESS.\n\n6.\n\nT HESE TWO ARE THE G ERM, AND THE G ERM IS ONE.\n\nT HE U NIVERSE WAS STILL CONCEALED IN THE D IVINE THOUGHT AND THE D IVINE BOSOM.\n\n.\n\n.\n\n.\n\n------- STANZA III.\n\n1.\n\n.\n\n.\n\n.\n\nT HE LAST VIBRATION OF THE SEVENTH ETERNITY THRILLS THROUGH INFINITUDE.\n\nT HE MOTHER SWELLS, EXPANDING FROM WITHIN WITHOUT, LIKE THE BUD OF THE LOTUS.\n\n2.\n\nT HE VIBRATION SWEEPS ALONG, TOUCHING WITH ITS SWIFT WING THE WHOLE UNIVERSE AND THE GERM THAT DWELLETH IN DARKNESS: T HE DARKNESS THAT BREATHES OVER THE SLUMBERING WATERS OF LIFE.\n\n.\n\n.\n\n3.\n\nD ARKNESS RADIATES LIGHT, AND LIGHT DROPS ONE SOLITARY RAY INTO THE MOTHER-DEEP.\n\nT HE RAY SHOOTS THROUGH THE VIRGIN EGG, THE RAY CAUSES THE ETERNAL EGG TO THRILL, AND DROP THE NON-ETERNAL GERM, WHICH CONDENSES INTO THE WORLD-EGG.\n\n[[Vol.\n\n1, Page]] 29 THE SECRET DOCTRINE.\n\n4.\n\nT HEN THE THREE FALL INTO THE FOUR.\n\nT HE RADIANT ESSENCE BECOMES SEVEN INSIDE, SEVEN OUTSIDE.\n\nT HE LUMINOUS EGG, WHICH IN ITSELF IS THREE, CURDLES AND SPREADS IN MILK-WHITE CURDS THROUGHOUT THE DEPTHS OF MOTHER, THE ROOT THAT GROWS IN THE DEPTHS OF THE OCEAN OF LIFE.\n\n5."


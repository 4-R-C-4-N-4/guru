[content]
body = "Perhaps we may admit scandium, ytterbium, and others of the like sort to elemental rank; but what are we to say in the case of praseo- and neo-dymium, between which there may be said to exist no well-marked chemical difference, their chief claim to separate individuality being slight differences in basicity and crystallizing powers, though their physical distinctions, as shown by spectrum observations, are very strongly marked?\n\nEven here we may imagine the disposition of the majority of chemists would incline toward the side of leniency, so that they would admit these two bodies within the charmed circle.\n\nWhether in so doing they would be able to appeal to any broad principle is an open question.\n\nIf we admit these candidates [[Vol.\n\n1, Page]] 547 OCCULT CHEMISTRY.\n\nhow in justice are we to exclude the series of elemental bodies or meta-elements made known to us by Kruss and Nilson?\n\nHere the spectral differences are well marked, while my own researches on didymium show also a slight difference in basicity between some at least of these doubtful bodies.\n\nIn the same category must be included the numerous separate bodies into which it is probable that yttrium, erbium, samarium, and other \"elements\" -- commonly so-called -- have been and are being split up.\n\nWhere then are we to draw the line?\n\nThe different groupings shade off so imperceptibly the one into the other that it is impossible to erect a definite boundary between any two adjacent bodies and to say that the body on this side of the line is an element, while the one on the other side is non-elementary, or merely something which simulates or approximates to an element.\n\nWherever an apparently reasonable line might be drawn it would no doubt be easy at once to assign most bodies to their proper side, as in all cases of classification the real difficulty comes in when the border-line is approached.\n\nSlight chemical differences, of course, are admitted, and, up to a certain point, so are well-marked physical differences.\n\nWhat are we to say, however, when the only chemical difference is an almost imperceptible tendency for the one body -- of a couple or of a group -- to precipitate before the other?\n\nAgain, there are cases where the chemical differences reach the vanishing point, although well-marked physical differences still remain.\n\nHere we stumble on a new difficulty: in such obscurities what is chemical and what is physical?\n\nAre we not entitled to call a slight tendency of a nascent amorphous precipitate to fall down in advance of another a \"physical difference?\" And may we not call coloured reactions depending on the amount of some particular acid present and varying, according to the concentration of the solution and to the solvent employed, \"chemical differences?\" I do not see how we can deny elementary character to a body which differs from another by well-marked colour, or spectrum-reactions, while we accord it to another body whose only claim is a very minute difference in basic powers.\n\nHaving once opened the door wide enough to admit some spectrum differences, we have to inquire how minute a difference qualifies the candidate to pass?\n\nI will give instances from my own experience of some of these doubtful candidates.\n\nAnd here the great chemist gives several cases of the very extraordinary behaviour of molecules and earths, apparently the same, and which yet, when examined very closely, were found to exhibit differences which, however imperceptible, still show that none of them are simple bodies, and that the 60 or 70 elements accepted in chemistry, can no longer cover the ground.\n\nTheir name, apparently, is legion, but as the so-called \"periodic theory\" stands in the way of an unlimited multiplication of elements, Mr.\n\nCrookes is obliged to find some means of reconciling the new discovery with the old theory.\n\n\"That theory,\" he says: -- \"Has received such abundant verification that we cannot lightly accept any interpretation of phenomena which fails to be in accordance with it.\n\nBut if we suppose the elements reinforced by a vast number of bodies slightly differing from each other in their properties, and forming, if I may use the expression, [[Vol.\n\n1, Page]] 548 THE SECRET DOCTRINE.\n\naggregations of nebulae where we formerly saw, or believed we saw, separate stars, the periodic arrangement can no longer be definitely grasped.\n\nNo longer, that is, if we retain our usual conception of an element.\n\nLet us, then, modify this conception.\n\nFor \"element\" read \"elementary group\" -- such elementary groups taking the place of the old elements in the periodic scheme -- and the difficulty falls away.\n\nIn defining an element, let us take not an external boundary, but an internal type.\n\nLet us say, e.g.\n\n, the smallest ponderable quantity of yttrium is an assemblage of ultimate atoms almost infinitely more like each other than they are to the atoms of any other approximating element.\n\nIt does not necessarily follow that the atoms shall all be absolutely alike among themselves.\n\nThe atomic weight which we ascribed to yttrium, therefore, merely represents a mean value around which the actual weights of the individual atoms of the \"element\" range within certain limits.\n\nBut if my conjecture is tenable, could we separate atom from atom, we should find them varying within narrow limits on each side of the mean.\n\nThe very process of fractionation implies the existence of such differences in certain bodies.\" Thus fact and truth have once more forced the hand of \"exact\" Science, and compelled it to enlarge its views and change its terms which, masking the multitude, reduced them to one body -- like the Septenary Elohim and their hosts transformed by the materialistic religionists into one Jehovah.\n\nReplace the chemical terms \"Molecule,\" \"atom,\" \"particle,\" etc., by the words \"Hosts,\" \"Monads,\" \"Devas,\" etc., and one might think the genesis of gods, the primeval evolution of manvantaric intelligent Forces, was being described.\n\nBut the learned lecturer adds something still more suggestive to his descriptive remarks; whether consciously or unconsciously, who knoweth?\n\nFor he says the following: -- \"Until lately such bodies passed muster as elements.\n\nThey had definite properties, chemical and physical; they had recognised atomic weights.\n\nIf we take a pure dilute solution of such a body, yttrium for instance, and if we add to it an excess of strong ammonia, we obtain a precipitate which appears perfectly homogeneous.\n\nBut if instead we add very dilute ammonia in quantity sufficient only to precipitate one-half of the base present, we obtain no immediate precipitate.\n\nIf we stir up the whole thoroughly so as to insure a uniform mixture of the solution and the ammonia, and set the vessel aside for an hour, carefully excluding dust, we may still find the liquid clear and bright, without any vestige of turbidity.\n\nAfter three or four hours, however, an opalescence will declare itself, and the next morning a precipitate will have appeared.\n\nNow let us ask ourselves, What can be the meaning of this phenomenon?\n\nThe quantity of precipitant added was insufficient to throw down more than half the yttria present, therefore a process akin to selection has been going on for several hours."


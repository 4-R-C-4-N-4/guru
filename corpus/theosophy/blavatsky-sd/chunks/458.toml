body = "We learn of Ichthyosauri and Plesiosauri in the lakes and rivers, and of winged crocodiles or lizards flying in the air.\n\nAfter which, in the Tertiary period \"we find the Mammalian type exhibiting remarkable divergences from previously existing forms .\n\n.\n\n.\n\n.\n\nMastodons, Megatheriums, and other unwieldy denizens of the ancient forests and plains; and subsequently,\" are notified of - - \" the gradual modification of one of the ramifications of the Quadrumanous order, into those beings from whom primeval man himself may claim to have been evolved.\n\n\" (\"The Beginnings of Life.\") He may ; but no one, except materialists, can see why he should; as there is not the slightest necessity for it, nor is such an evolution warranted by facts, for those most interested in the proofs thereof confess their utter failure to find one single fact to support their theory.\n\nThere is no need for the numberless types of life to represent the members of one progressive series.\n\nThey are \"the products of various and different evolutional divergences, taking place now in one direction and now in another.\" Therefore it is far more justifiable to say that the monkey evolved into the Quadrumanous order, than that primeval man, who has remained stationary in his human specialization ever since his fossil is found in the oldest strata, and of whom no variety is found save in colour and facial type -- has developed from a common ancestor together with the ape.\n\nThat man originates like other animals in a cell and develops \"through stages undistinguishable from those of fish, reptile, and mammal until the cell attains the highly specialized development of the quadrumanous and at last the human type, \" is an Occult axiom thousands of years old.\n\nThe Kabalistic axiom: \"A stone becomes a plant; a plant a beast; a beast a man; a man a God,\" holds good throughout the ages.\n\nHaeckel, in his Shopfungsgeschichte, shows a double drawing representing two embryos -- that of a dog six weeks old, and that of a man, eight weeks.\n\nThe two, except the slight difference in the head, larger and wider about the brain in the man, are [[Footnote(s)]] ------------------------------------------------- * \" Trans.\n\nof Geolog.\n\nSoc.\n\nof Glasgow,\" vol.\n\niii.\n\nVery strangely, however, he has just changed his opinion.\n\nThe sun, he says, is only 15,000,000 old.\n\n[[Vol.\n\n2, Page]] 259 IDENTITY OF HUMAN AND ANIMAL EMBRYOS.\n\nundistinguishable.\n\n\"In fact, we may say that every human being passes through the stage of fish and reptile before arriving at that of mammal and finally of man.\n\nIf we take him up at the more advanced stage where the embryo has already passed the reptilian form .\n\n.\n\n.\n\nfor a considerable time, the line of development remains the same as that of other mammalia.\n\nThe rudimentary limbs are exactly similar, the five fingers and toes develop in the same way, and the resemblance after the first four weeks' growth between the embryo of a man and a dog is such that it is scarcely possible to distinguish them.\n\nEven at the age of eight weeks the embryo man is an animal with a tail hardly to be distinguished from an embryo puppy\" (\"Modern Science,\" etc., p.\n\n171).\n\nWhy, then, not make man and dog evolve from a common ancestor, or from a reptile -- a Naga, instead of coupling man with the quadrumana?\n\nThis would be just as logical as the other, and more so.\n\nThe shape and the stages of the human embryo have not changed since historical times, and these metamorphoses were known to AEsculapius and Hippocrates as well as to Mr.\n\nHuxley.\n\nTherefore, since the Kabalists had remarked it since prehistoric times, it is no new discovery.\n\nIn \"Isis,\" Vol.\n\nI., 389, it is noticed and half explained.\n\nAs the embryo of man has no more of the ape in it than of any other mammal, but contains in itself the totality of the kingdoms of nature, and since it seems to be \"a persistent type\" of life, far more so than even the Foraminifera, it seems as illogical to make him evolve from the ape as it would be to trace his origin to the frog or the dog.\n\nBoth Occult and Eastern philosophies believe in evolution, which Manu and Kapila* give with far more clearness than any scientist does at present.\n\nNo need to repeat that which was fully debated in Isis Unveiled, as the reader may find all these arguments and the description of the basis on which all the Eastern doctrines of Evolution rested, in our earlier books.** But no Occultist can accept the unreasonable proposition that all the now existing forms, \"from the structureless Amoeba to man,\" are the direct lineal descendants of organisms which lived millions and millions of years before the birth of man, in the pre-Silurian epochs, in the sea or land- [[Footnote(s)]] ------------------------------------------------- * Hence the philosophy in the allegory of the 7, 10, and finally 21 Prajapati, Rishis, Munis, etc., who all are made the fathers of various things and beings.\n\nThe order of the seven classes or orders of plants, animals, and even inanimate things, given at random in the Puranas, is found in several commentaries in the correct rotation.\n\nThus, Prithu is the father of the Earth.\n\nHe milks her, and makes her bear every kind of grain and vegetable, all enumerated and specified.\n\nKasyapa is the father of all the reptiles, snakes, demons, etc., etc.\n\n** See Vol.\n\nI.\n\n152, et seq., about the tree of evolution -- The \"Mundane Tree.\" [[Vol.\n\n2, Page]] 260 THE SECRET DOCTRINE.\n\nmud.\n\nThe Occultists believe in an inherent law of progressive development.* Mr.\n\nDarwin never did, and says so himself.\n\nOn page 145 of the \"Origin of Species\" we find him stating that, since there can be no advantage \"to the infusorian animalcule or an intestinal worm .\n\n.\n\n.\n\nto become highly organized,\" therefore, \"natural selection,\" not including necessarily progressive development -- leaves the animalcule and the worm (the \"persistent types\") quiet.\n\nThere does not appear much uniform law in such behaviour of Nature; and it looks more like the discriminative action of some Super -Natural selection; perhaps, that aspect of Karma, which Eastern Occultists would call the \"Law of Retardation,\" may have something to do with it.\n\nBut there is every reason to doubt whether Mr.\n\nDarwin himself ever gave such an importance to his law -- as is given to it now by his atheistic followers.\n\nThe knowledge of the various living forms in the geological periods that have gone by is very meagre.\n\nThe reasons given for this by Dr."


[content]
body = "** The so-called \"Spirits\" that may occasionally possess themselves of the bodies of mediums are not the Monads or Higher Principles of disembodied personalities.\n\nSuch a \"Spirit\" can only be either an Elementary, or -- a Nirmanakaya.\n\n[[Vol.\n\n1, Page]] 234 THE SECRET DOCTRINE.\n\nor taking temporary possession of a medium.\n\nJust as certain persons -- men and women, reverting to parallel cases among living persons -- whether by virtue of a peculiar organization, or through the power of acquired mystic knowledge, can be seen in their \"double\" in one place, while the body is many miles away; so the same thing can occur in the case of superior Beings.\n\nMan, philosophically considered, is, in his outward form, simply an animal, hardly more perfect than his pithecoid-like ancestor of the third round.\n\nHe is a living body, not a living being, since the realisation of existence, the \"Ego-Sum,\" necessitates self-consciousness, and an animal can only have direct consciousness, or instinct.\n\nThis was so well understood by the Ancients that the Kabalist even made of soul and body two lives, independent of each other.* The soul, whose body vehicle is the Astral, ethero-substantial envelope, could die and man be still living on earth -- i.e.\n\n, the soul could free itself from and quit the tabernacle for various reasons -- such as insanity, spiritual and physical depravity, etc.** Therefore, that which living men (Initiates) [[Footnote(s)]] ------------------------------------------------- * On p.\n\n340-351 (Genesis of the Soul) in the \" New Aspects of Life ,\" the Author states the Kabalistic teaching: \"They held that, functionally, Spirit and Matter of corresponding opacity and density tended to coalesce; and that the resultant created Spirits, in the disembodied state, were constituted on a scale in which the differing opacities and transparencies of Elemental or uncreated Spirit were reproduced.\n\nAnd that these Spirits in the disembodied state attracted, appropriated, digested and assimilated Elemental Spirit and Elemental Matter whose condition was conformed to their own.\" \"They therefore taught that there was a wide difference in the condition of created Spirits; and that in the intimate association between the Spirit-world and the world of Matter, the more opaque Spirits in the disembodied state were drawn towards the more dense parts of the material world, and therefore tended towards the centre of the Earth, where they found the conditions most suited to their state; while the more transparent Spirits passed into the surrounding aura of the planet, the most rarified finding their home in its satellite.\" This relates exclusively to our Elementary Spirits, and has naught to do with either the Planetary, Sidereal, Cosmic or Inter-Etheric Intelligent Forces or \"Angels\" as they are termed by the Roman Church.\n\nThe Jewish Kabalists, especially the practical Occultists who dealt with ceremonial magic, busied themselves solely with the spirits of the Planets and the \"Elementals\" so-called.\n\nTherefore this covers only a portion of the Esoteric Teaching.\n\n** The possibility of the \"Soul\" ( i.e.\n\n, the eternal Spiritual Ego) dwelling in the unseen worlds, while its body goes on living on Earth, is a pre-eminently occult doctrine, especially in Chinese and Buddhist philosophy.\n\nSee \"Isis Unveiled,\" vol.\n\ni., [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 235 DII SUNT DEMONES INVERSI.\n\ncan do, the Dhyanis, who have no physical body to hamper them, can do still better.\n\nThis was the belief of the Antediluvians, and it is fast becoming that of modern intellectual society, in Spiritualism, besides the Greek and Roman Churches, which teach the ubiquity of their angels.\n\nThe Zoroastrians regarded their Amshaspends as dual entities (Ferouers), applying this duality -- in esoteric philosophy, at any rate -- to all the spiritual and invisible denizens of the numberless worlds in space which are visible to our eye.\n\nIn a note of Damascius (sixth century) on the Chaldean oracles, we have a triple evidence of the universality of this doctrine, for he says: \"In these oracles the seven Cosmocratores of the world, ('The World-Pillars,') mentioned likewise by St.\n\nPaul, are double -- one set being commissioned to rule the superior worlds the spiritual and the sidereal, and the other to guide and watch over the worlds of matter.\" Such is also the opinion of Jamblichus, who makes an evident distinction between the archangels and the \"Archontes.\" (See \"De Mysteriis,\" sec.\n\nii., ch.\n\n3.) The above may be applied, of course, to the distinction made between the degrees or orders of spiritual beings, and it is in this sense that the Roman Catholic Church tries to interpret and teach the difference; for while the archangels are in her teaching divine and holy, their doubles are denounced by her as devils.* But the word \"ferouer\" is not to be understood in this sense, for it means simply the reverse or the opposite side of some attribute or quality.\n\nThus when the Occultist says that the \"Demon is the lining of God\" (evil, the reverse of the medal), he does not mean two separate [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] p.\n\n602, for an illustration.\n\nMany are the Soulless men among us, for the occurrence is found to take place in wicked materialists as well as in persons \"who advance in holiness and never turn back.\" (See ibid and also \"Isis,\" vol.\n\nii., p.\n\n369.) * This identity between the Spirit and its material \"double\" (in man it is the reverse) explains still better the confusion, alluded to already in this work, made in the names and individualities, as well as the numbers, of the Rishis and the Prajapatis; especially between those of the Satyayuga and the Mahabharatan period.\n\nIt also throws additional light on what the Secret Doctrine teaches with regard to the Root and the Seed Manus (see Book ii.\n\n\"On the primitive Manus of humanity\").\n\nNot only those progenitors of our mankind, but every human being, we are taught, has its prototype in the Spiritual Spheres; which prototype is the highest essence of his seventh principle.\n\nThus the seven Manus become 14, the Root Manu being the Prime Cause, and the \"Seed-Manu\" its effect; and when the latter reach from Satyayuga (the first stage) to the heroic period, these Manus or Rishis become 21 in number.\n\n[[Vol.\n\n1, Page]] 236 THE SECRET DOCTRINE.\n\nactualities, but the two aspects or facets of the same Unity.\n\nNow the best man living would appear, side by side with an Archangel -- as described in Theology -- a fiend.\n\nHence a certain reason to depreciate a lower \"double,\" immersed far deeper in matter than its original."


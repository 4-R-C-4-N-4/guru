[content]
body = ") Since, in the exoteric accounts, the Asuras are the first beings created from the \"body of night,\" while the Pitris issue from that of Twilight ; the \"gods\" being placed by Parasara ( Vishnu Purana ) between the two, and shown to evolve from the \"body of the day,\" it is easy to discover a determined purpose to veil the order of creation.\n\nMan is the Arvaksrota coming from the \"Body of the Dawn\"; and elsewhere, man is again referred to, when the creator of the world, Brahma, is shown \"creating fierce beings, denominated Bhutas and eaters of flesh,\" or as the text has it, \"fiends frightful from being monkey-coloured and carnivorous.\"** Whereas the Rakshasas are generally translated by \"Evil Spirits\" and \"the enemies of the gods,\" which identifies them with the Asuras.\n\nIn the Ramayana, when Hanuman is reconnoitering the enemy in Lanka, he finds there Rakshasas, some hideous, \"while some were beautiful to look upon,\" and, in Vishnu Purana, there is a direct reference to their becoming the Saviours of \"Humanity,\" or of Brahma.\n\nThe allegory is very ingenious.\n\nGreat intellect and too much knowledge are a two-edged weapon in life, and instruments for evil as well as for good.\n\nWhen combined with Selfishness, they will make of the whole of Humanity a footstool for the elevation of him who possesses them, and a means for the attainment of his objects; while, applied to altruistic humanitarian purposes, they may become the means of the salvation of many.\n\nAt all events, the absence of self-consciousness and intellect will make of man an idiot, a brute in human form.\n\nBrahma is Mahat -- the universal Mind -- hence the too-selfish among the Rakshasas showing the desire to become possessed of it all -- to \"devour\" Mahat.\n\nThe allegory is transparent.\n\nAt any rate, esoteric philosophy identifies the pre-Brahmanical [[Footnote(s)]] ------------------------------------------------- * \" Vishnu Purana, \" Book I., chap.\n\nxv.\n\nof vol.\n\n2.\n\n** Ibid., Book I., chap.\n\nv.\n\n[[Vol.\n\n2, Page]] 164 THE SECRET DOCTRINE.\n\nAsuras, Rudras,* Rakshasas and all the \"Adversaries\" of the Gods in the allegories, with the Egos, which, by incarnating in the still witless man of the Third Race, made him consciously immortal.\n\nThey are, then, during the cycle of Incarnations, the true dual Logos -- the conflicting and two-faced divine Principle in Man.\n\nThe Commentary that follows, and the next Stanzas may, no doubt, throw more light on this very difficult tenet, but the writer does not feel competent to give it out fully.\n\nOf the succession of Races, however, they say: -- \" First come the SELF-EXISTENT on this Earth.\n\nThey are the ' Spiritual Lives ' projected by the absolute WILL and LAW, at the dawn of every rebirth of the worlds.\n\nThese LIVES are the divine ' Sishta, ' (the seed-Manus, or the Prajapati and the Pitris).\" From these proceed -- 1.\n\nThe First Race, the \" Self-born, \" which are the (astral) shadows of their Progenitors.\n\n** The body was devoid of all understanding (mind, intelligence, and will).\n\nThe inner being (the higher self or Monad), though within the earthly frame, was unconnected with it.\n\nThe link, the Manas, was not there as yet.\n\n2.\n\nFrom the First (race) emanated the second, called the \" Sweat-born \"*** and [[Footnote(s)]] ------------------------------------------------- * Whom Manu calls \"our paternal grandfathers\" ( III.\n\n, 284).\n\nThe Rudras are the seven manifestations of Rudra-Siva, \"the destroying god,\" and also the grand Yogi and ascetic.\n\n** See § II, §§ 1, Commentary.\n\n*** To speak of life as having arisen, and of the human race as having originated, in this absurdly unscientific way, in the face of the modern Pedigrees of Man, is to court instantaneous annihilation.\n\nThe esoteric doctrine risks the danger, nevertheless, and even goes so far as to ask the impartial reader to compare the above hypothesis (if it is one) with Haeckel's theory -- now fast becoming an axiom with science -- which is quoted verbatim: -- \".\n\n.\n\n.\n\nHow did life, the living world of organisms, arise?\n\nAnd, secondly, the special question: How did the human race originate?\n\nThe first of these two inquiries, that as to the first appearance of living beings, can only be decided empirically (!\n\n!) by proof of the so-called Archebiosis, or equivocal generation, or the spontaneous production of organisms of the simplest conceivable kind.\n\nSuch are the Monera (Protogenes, Protamoeba, etc), exceedingly simple microscopic masses of protoplasm without structure or organisation, which take in nutriment and reproduce themselves by division.\n\nSuch a Moneron as that primordial organism discovered by the renowned English zoologist Huxley, and named Bathybius Haeckelii, appears as a continuous thick protoplasmic covering at the greatest depths of the ocean, between 3,000 and 30,000 feet.\n\nIt is true that the first appearance of such Monera has not up to the present moment been actually observed ; but there is nothing intrinsically improbable in such an evolution.\" ( The \" Pedigree of Man, \" Aveling ' s translation, p 33.) The Bathybius protoplasm having recently turned out to be no organic substance at all, there remains little to be said.\n\nNor, after reading this, does one need to consume further time in refuting the further assertion that .\n\n.\n\n.\n\n.\n\n\"in that case man also [[Footnote continued on next page]] [[Vol.\n\n2, Page]] 165 TO THE MONERON THE CREATOR.\n\nthe \" Boneless.\n\n\" This is the Second Root-Race, endowed by the preservers (Rakshasas)* and the incarnating gods (Asuras and the Kumaras) with the first primitive and weak spark (the germ of intelligence) .\n\n.\n\nAnd from these in turn proceeds: - - 3.\n\nThe Third Root-Race, the \" Two-fold \" (Androgynes).\n\nThe first Races hereof are shells, till the last is \" inhabited \" (i.e., informed) by the Dhyanis.\n\nThe Second Race, as stated above, being also sexless, evolved out of itself, at its beginning, the Third Androgyne Race by an analogous, but already more complicated process."


body = "there may be hidden, deep in the fathomless, or rather unfathomed ocean beds, other and far older continents whose strata have never been geologically explored; and that they may some day upset entirely their present theories?\n\nWhy not admit that our present continents have, like Lemuria and Atlantis, [[Vol.\n\n2, Page]] 333 THE OLD CONTINENTS.\n\nbeen several times already submerged, and had the time to re-appear again and bear their new groups of mankind and civilisations; and that at the first great geological upheaval at the next cataclysm, in the series of periodical cataclysms that occur from the beginning to the end of every Round, our already autopsized continents will go down and the Lemurias and Atlantises come up again?\" Not the same identical continents, of course.\n\nBut here an explanation is needed.\n\nNo confusion need arise as regards the postulation of a Northern \"Lemuria.\" The prolongation of that great continent into the North Atlantic Ocean is in no way subversive of the opinions so widely held as to the site of the lost Atlantis, and one corroborates the other.\n\nIt must be noted that the Lemuria, which served as the cradle of the Third Root-Race, not only embraced a vast area in the Pacific and Indian Oceans, but extended in the shape of a horse-shoe past Madagascar, round \"South Africa\" (then a mere fragment in process of formation), through the Atlantic up to Norway.\n\nThe great English fresh-water deposit called the Wealden -- which every geologist regards as the mouth of a former great river -- is the bed of the main stream which drained Northern Lemuria in the Secondary Age.\n\nThe former reality of this river is a fact of science -- will its votaries acknowledge the necessity of accepting the Secondary-age Northern Lemuria, which their data demand?\n\nProfessor Berthold Seeman not only accepted the reality of such a mighty continent, but regarded Australia and Europe as formerly portions of one continent -- thus corroborating the whole \"horse-shoe\" doctrine already enunciated.\n\nNo more striking confirmation of our position could be given, than the fact that the ELEVATED RIDGE in the Atlantic basin, 9,000 feet in height, which runs for some two or three thousand miles southwards from a point near the British Islands, first slopes towards South America, then shifts almost at right angles to proceed in a SOUTH-EASTERLY line toward the African coast, whence it runs on southward to Tristan d'Acunha.\n\nThis ridge is a remnant of an Atlantic continent, and, could it be traced further, would establish the reality of a submarine horse-shoe junction with a former continent in the Indian Ocean.\n\n( Cf.\n\nchart adapted from the \" Challenger \" and \" Dolphin \" soundings in Mr.\n\nDonnelly ' s, \" Atlantis, the Antediluvian World, \" p.\n\n47.) The Atlantic portion of Lemuria was the geological basis of what is generally known as Atlantis.\n\nThe latter, indeed, must be regarded rather as a development of the Atlantic prolongation of Lemuria, than as an entirely new mass of land upheaved to meet the special requirements of the Fourth Root-Race.\n\nJust as in the case of Race-evolution, so in that of the shifting and re-shifting of continental masses, no hard and fast line can be drawn where a new order ends and another begins.\n\nContinuity in natural processes is never broken.\n\nThus the Fourth Race [[Vol.\n\n2, Page]] 334 THE SECRET DOCTRINE.\n\nAtlanteans were developed from a nucleus of Northern Lemurian Third Race Men, centred, roughly speaking, toward a point of land in what is now the mid-Atlantic Ocean.\n\nTheir continent was formed by the coalescence of many islands and peninsulas which were upheaved in the ordinary course of time and became ultimately the true home of the great Race known as the Atlanteans.\n\nAfter this consummation was once attained it follows, as stated on the highest \"occult\" authority, that \"Lemuria should no more be confounded with the Atlantis Continent, than Europe with America.\" (\" Esoteric Buddhism, \" p.\n\n58.) The above, coming from quarters so discredited by orthodox Science, will, of course, be regarded by it as a more or less happy fiction.\n\nEven the clever work of Donnelly, already mentioned, is put aside, notwithstanding that its statements are all confined within a frame of strictly scientific proofs.\n\nBut we write for the future.\n\nDiscoveries in this direction will vindicate the claims of the Asiatic philosophers, who maintain that Sciences -- Geology, Ethnology, and History included --were pursued by the Antediluvian nations who lived an untold number of ages ago.\n\nFuture finds will justify the correctness of the present observations of such acute minds as H.\n\nA.\n\nTaine and Renan.\n\nThe former shows that the civilizations of such archaic nations as the Egyptians, Aryans of India, Chaldeans, Chinese, and Assyrians are the result of preceding civilizations during \" myriads of centuries\";* and the latter points to the fact that, \"Egypt at the beginning appears mature, old, and entirely without mythical and heroic ages, as if the country had never known youth.\n\nIts civilization has no infancy, and its art no archaic period.\n\nThe civilization of the Old Monarchy did not begin with infancy.\n\nIt was already mature.\"** To this Professor R.\n\nOwen adds that, \"Egypt is recorded to have been a civilized and governed community before the time of Menes\"; and Winchell (\"Pre-Adamites,\" p.\n\n120), that \"at the epoch of Menes the Egyptians were already a civilized and numerous people.\n\nManetho tells us that Athotis, the son of this first king Menes, built the palace of Memphis; that he was a physician, and left anatomical books.\n\n\" This is quite natural if we have to believe the statements of Herodotus, who records in Euterpe (cxlii.), that the written history of the Egyptian priests dated from about 12,000 years before his time.\n\nBut what are 12,000 or even 120,000 years compared with the millions of years elapsed since the Lemurian period?\n\nThe latter, however, has not been left without witnesses, its tremendous antiquity, notwithstanding.\n\nThe complete records of the growth, development, social, and even political life of the Lemurians, have been preserved in the [[Footnote(s)]] ------------------------------------------------- * \" History of English Literature, \" p.\n\n23.\n\n** Quoted in \" Atlantis, \" etc., p.\n\n132.\n\n[[Vol.\n\n2, Page]] 335 HOW TO READ SYMBOLS.\n\nsecret annals.\n\nUnfortunately, few are those who can read them; and those who could would still be unable to understand the language, unless acquainted with all the seven keys of its symbolism.\n\nFor the comprehension of the Occult Doctrine is based on that of the seven sciences; which sciences find their expression in the seven different applications of the secret records to the exoteric texts.\n\nThus we have to deal with modes of thought on seven entirely different planes of Ideality."


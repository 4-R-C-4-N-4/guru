[content]
body = "As stated in \" Esoteric Buddhism, \" the Egyptians, as well as the Greeks and \"Romans\" some thousand years ago, were \"remnants of the Atlanto-Aryans,\" i.e.\n\n, the former, of the older, or the Ruta Atlanteans; the last-named, the descendants of the last race of that island, whose sudden disappearance was narrated to Solon by the Egyptian Initiates.\n\nThe human Dynasty of the older Egyptians, beginning with Menes, had all the knowledge of the Atlanteans, though there was no more Atlantean blood in their veins.\n\nNevertheless, they had preserved all their Archaic records.\n\nAll this has been shown long ago.*** And it is just because the Egyptian Zodiac is between 75 and 80,000 years old that the Zodiac of the Greeks is far later.\n\nVolney has correctly pointed out in his \"Ruins of Empires\" (p.\n\n360) that it is only 16,984 years old, or up to the present date 17,082.**** [[Footnote(s)]] ------------------------------------------------- * The forefathers of the Aryan Brahmins had their Zodiacal calculations and Zodiac from those born by Kriyasakti power, the \"Sons of Yoga\"; the Egyptians from the Atlanteans of Ruta.\n\n** The former, therefore, may have registered time for seven or eight millions of years, but the Egyptians could not.\n\n*** This question was amply challenged, and as amply discussed and answered.\n\nSee Five Years of Theosophy.\n\n( Art.\n\n\"Mr.\n\nSinnett's Esoteric Buddhism,\" pp.\n\n325-46).\n\n**** Volney says that, as Aries was in its 15th degree 1447 B.C ., it follows that the first degree of \"Libra\" could not have coincided with the vernal equinox more lately than 15,194 years B.C.\n\n, to which if you add 1790 since Christ, when Volney wrote this, it appears that 16,984 years have elapsed since the (Greek or rather Hellenic) origin of the Zodiac."


[content]
body = "The Monad -- only the emanation and reflection of the Point (Logos) in the phenomenal World -- becomes, as the apex of the manifested equilateral triangle, the \"Father.\" The left side or line is the Duad , the \"Mother,\" regarded as the evil, counteracting principle (Plutarch, De Placitis Placitorum ); the right side represents the Son (\"his Mother's husband\" in every Cosmogony, as one with the apex ); at the basic line is the Universal plane of productive Nature, unifying on the phenomenal plane Father-Mother-Son, as these were unified in the apex , in the supersensuous World.** By mystic transmutation they became the Quaternary -- the triangle became the T ETRAKTIS.\n\n[[Footnote(s)]] ------------------------------------------------- * See Kant's Critique de la Raison pure (Barni's transl., Vol.\n\nII., p.\n\n54).\n\n** In the Greek and Latin churches -- which regard marriage as one of the sacraments -- the officiating priest during the marriage ceremony represents the apex of the triangle; the bride its left feminine side and the bridegroom the right one, while the horizontal line is symbolised by the row of witness, the bridesmaids and best-men.\n\nBut behind [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 615 SPACE, FORCE AND MATTER.\n\nThis transcendental application of geometry to Cosmic and divine theogony -- the Alpha and the Omega of mystical conception -- became dwarfed after Pythagoras by Aristotle.\n\nBy omitting the Point and the Circle, and taking no account of the apex, he reduced the metaphysical value of the idea, and thus limited the doctrine of magnitude to a simple TRIAD -- the line , the surface , and the body.\n\nHis modern heirs, who play at Idealism, have interpreted these three geometrical figures as Space, Force, and Matter -- \"the potencies of an interacting Unity.\"* Materialistic Science, perceiving but the basic line of the manifested \"triangle\" -- the plane of matter -- translates it practically as (Father)- M ATTER, (Mother)- M ATTER, and (Son)- M ATTER, and theoretically as Matter, Force, and Correlation.\n\nBut to the average physicist, as remarked by a Kabalist, \"Space, Force, Matter, are, what signs in algebra are to the mathematician, merely conventional symbols;\" or \"Force as force, and Matter as matter, are as absolutely unknowable as is the assumed empty space in which they are held to interact.\" As symbols representing abstractions, \"the physicist bases reasoned hypotheses of the origin of things .\n\n.\n\n.\n\n.\n\nand sees three needs in what he terms creation: ( a ) a place wherein to create; ( b ) a medium by which to create; ( c ) a material from which to create.\n\nAnd in giving a logical expression to this hypothesis through the terms space, force, matter, he believes he has proved the existence of that which each of these represents as he conceives it to be .\"** The physicist who regards Space merely as a representation of our mind, or extension unrelated to things in it, which Locke defined as capable of neither resistance nor motion; the paradoxical materialist, who would have a void there, where he can see no matter, would reject with the utmost contempt the proposition that \"Space is a substantial though (apparently) an absolutely unknowable living Entity.\" ( New Aspects , p.\n\n9.) Such is, nevertheless, the Kabalistic teaching, and it is that of Archaic philosophy.\n\nSpace is the real world, while our world is an artificial one.\n\nIt is the One Unity throughout its infinitude: in its bottomless depths as on its illusive surface; a surface studded with countless phenomenal Universes, systems and mirage-like worlds.\n\nNevertheless, to the Eastern Occultist, who is an objective Idealist at the bottom, in the real world, which is a Unity of Forces, there is \"a connection of all matter in the plenum ,\" as Leibnitz would say.\n\nThis is symbolized in the Pythagorean Triangle.\n\n[[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] the priest there is the altar with its mysterious containments and symbolic meaning, inside of which no one but the consecrated priests ought to enter.\n\nIn the early days of Christianity the marriage ceremony was a mystery and a true symbol.\n\nNow, however, even the churches have lost the true meaning of this symbolism.\n\n* See Von Hartmann's and Herbert Spencer's works.\n\n** \"New Aspects of Life,\" by Henry Pratt, M.D.\n\n[[Vol.\n\n1, Page]] 616 THE SECRET DOCTRINE.\n\nIt consists of ten points inscribed pyramid-like (from one to the last four) within its three lines, and it symbolizes the Universe in the famous Pythagorean Decad.\n\nThe upper single dot is a Monad, and represents a Unit-Point, which is the Unity from whence all proceeds, and all is of the same essence with it.\n\nWhile the ten dots within the triangle represent the phenomenal world, the three sides of the equilateral triangle which enclose the pyramid of dots are the barriers of noumenal Matter, or Substance, that separate it from the world of Thought.\n\n\"Pythagoras considered a point to correspond in proportion to unity; a line to 2; a superficies to 3; a solid to 4; and he defined a point as a Monad having position, and the beginning of all things; a line was thought to correspond with duality, because it was produced by the first motion from indivisible nature, and formed the junction of two points.\n\nA superficies was compared to the number three because it is the first of all causes that are found in figures; for a circle, which is the principal of all round figures, comprises a triad, in centre -- space -- circumference.\n\nBut a triangle, which is the first of all rectilineal figures, is included in a ternary, and receives its form according to that number; and was considered by the Pythagoreans to be the creator of all sublunary things.\n\nThe four points at the base of the Pythagorean triangle correspond with a solid or cube, which combines the principles of length, breadth, and thickness, for no solid can have less than four extreme boundary points.\" ( Pythag.\n\nTriangle , p.\n\n19.) It is argued that \"the human mind cannot conceive an indivisible unit short of the annihilation of the idea with its subject.\" This is an error, as the Pythagoreans have proved, and a number of Seers before them, although there is a special training for it, and although the profane mind can hardly grasp it.\n\nBut there are such things as metamathematics and metageometry.\n\nEven mathematics pure and simple proceed from the Universal to the particular, from the mathematical, hence indivisible Point, to solid figures.\n\nThe teaching originated in India, and was taught in Europe by Pythagoras, who, throwing a veil over the Circle and the Point -- which no living man can define except as incomprehensible abstractions -- laid the origin of the differentiated Cosmic matter in the basic or horizontal line of the Triangle."


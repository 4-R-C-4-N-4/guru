[content]
body = "But this is a mystery which the writer dares not dwell upon at length, not being sure of being understood.\n\nThus the mystical side of the interpretation must be left to the intuition of the student.\n\nLet us note one more thing in relation to the mysterious number five.\n\nIt symbolizes at one and the same time the Spirit of life eternal and the Spirit of life and love terrestrial -- in the human compound; and, it includes divine and infernal magic, and the universal and the individual quintessence of being.\n\nThus, the five mystic words or vowels ( vide infra ) uttered by Brahma at \"creation,\" which forthwith became the Panchadasa (certain Vedic hymns, attributed to that God) are in their creative and magical potentiality, the white side of the black Tantrik five \"makaras,\" or the five m ' s.\n\n\"Makara,\" the constellation, is a seemingly meaningless and absurd name.\n\nYet, even besides its anagrammatical significance in conjunction with the term \"Kumara,\" the numerical value of its first syllable and its esoteric resolution into five has a very great and occult meaning in the mysteries of nature.\n\nSuffice it to say, that as the sign of Makara is connected with the birth of the spiritual \"microcosm,\" and the death or dissolution of the physical Universe (its passage into the realm of the Spiritual)*; so the Dhyan Chohans, called in India Kumara, are connected with both.\n\nMoreover, in the exoteric religions, they have become the synonyms of the Angels of Darkness.\n\nMara is the God of Darkness, the Fallen One, and Death**; and yet it is one of the names of Kama, the first god in the Vedas, the Logos, from whom have sprung the Kumaras, and this [[Footnote(s)]] ------------------------------------------------- * \"When the Sun passes away behind the 30th degree of Makara and will reach no more the sign of the Meenam (pisces) then the night of Brahma has come.\" .\n\n.\n\n.\n\n** Death of every physical thing truly; but Mara is also the unconscious quickener of the birth of the Spiritual.\n\n[[Vol.\n\n2, Page]] 580 THE SECRET DOCTRINE.\n\nconnects them still more with our \"fabulous\" Indian Makara, and the crocodile-headed God in Egypt.* The crocodiles in the Celestial Nile are Five , and the God Toum, the primordial deity creating the heavenly bodies and the living beings, calls forth these crocodiles in his fifth creation.\n\nWhen Osiris, \"the defunct Sun,\" is buried and enters into Amenti, the sacred crocodiles plunge into the abyss of primordial Waters -- \"the great Green One.\" When the Sun of life rises, they re-emerge out of the sacred river.\n\nAll this is highly symbolical, and shows how primeval esoteric truths found their expression in identical symbols.\n\nBut, as Mr.\n\nT.\n\nSubba Row truly declares, \"The veil, that was dexterously thrown over certain portions of the mystery connected with the (Zodiacal) signs by the ancient philosophers, will never be fully lifted up for the amusement or edification of the uninitiated public.\n\n\" Nor was number five less sacred with the Greeks.\n\nThe five words ( Panchadasa ) of Brahma have become with the Gnostics the \"Five Words\" written upon the akasic (shining) garment of Jesus at his glorification: the words [[ ZAMA ZAMA OZZA PAXAMA, OZAI ]], translated by the Orientalists \"the robe, the glorious robe of my strength.\" These words were, in their turn, the anagrammatic blind of the five mystic powers represented on the robe of the \"resurrected\" Initiate after his last trial of three days' trance; the five becoming seven only after his death, when the Adept became the full C HRISTOS, the full K RISHNA- V ISHNU, i.e.\n\n, merged in Nirvana.\n\nThe E Delphicum, a sacred symbol, was the numeral five , again; and how sacred it was is shown by the fact that the Corinthians (according to Plutarch) replaced the wooden numeral in the Delphic Temple by a bronze one; and this one was transmuted by Livia Augusta into a fac-simile of gold.\n\nIt is easy to recognize in the two spirits -- the Greek accents or signs ( ) spoken of by Ragon ( vide supra ) -- Atma and Buddhi, or \"divine spirit and its vehicle\" (spiritual soul).\n\nThe six or the \"Senary\" is dealt with later, while the Septenary will be fully treated in the course of this volume.\n\n( Vide the \" Mysteries of the Hebdomad.\n\n\") The Ogdoad or 8 symbolizes the eternal and spiral motion of cycles, the 8, , and is symbolized in its turn by the Caduceus.\n\nIt shows the regular breathing of the Kosmos presided over by the eight great gods -- the seven from the primeval Mother, the One and the Triad.\n\nThen comes the number nine or the triple ternary.\n\nIt is the number which reproduces itself incessantly under all shapes and figures in [[Footnote(s)]] ------------------------------------------------- * Osiris is called in the \" Book of the Dead \" \" Osiris, the double Crocodile.\" ( See Chapter \" On the Names of Osiris, \" cxlii.\n\n) \"He is the good and the bad Principle; the Day, and the Night Sun, the God, and the mortal man.\" Thus far the Macrocosm and the Microcosm.\n\n[[Vol.\n\n2, Page]] 581 THE MASTER MASON'S GRIP.\n\nevery multiplication.\n\nIt is the sign of every circumference, since its value in degrees is equal to 9, i.e., to 3 + 6 + 0.\n\nIt is a bad number under certain conditions, and very unlucky.\n\nIf number 6 was the symbol of our globe ready to be animated by a divine spirit, 9 symbolized our earth informed by a bad or evil spirit.\n\nTen, or the Decade, brings all these digits back to unity, and ends the Pythagorean table.\n\nHence this figure -- , unity within zero -- was the symbol of Deity, of the Universe, and of man.\n\nSuch is the secret meaning of \"the strong grip of the Lion's paw, of the tribe of Judah\" between two hands (the \" master mason ' s grip \") , the joint number of whose fingers is ten.\n\nIf we now give our attention to the Egyptian cross, or the Tau, we may discover this letter, so exalted by Egyptians, Greeks, and Jews, to be mysteriously connected with the Decade.\n\nThe tau is the Alpha and the Omega of secret divine Wisdom, which is symbolized by the initial and the final letter of Thot (Hermes)."


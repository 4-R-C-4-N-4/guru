[content]
body = "When the Chaldeans broke into the sanctuary and beheld this most astounding emblem, they naturally enough exclaimed, 'Is this your God, of whom you boast that He is such a lover of purity?' \" (p.\n\n441.) King thinks that this tradition \"savours too much of Alexandrian philosophy to demand any credit,\" to which we demur.\n\nThe shape and form of the wings of the two cherubim standing on the right and left sides of the Ark, these wings meeting over the \"Holy of Holies,\" are an emblem quite eloquent in itself, besides the \"holy\" Jod within the ark!\n\nThe Mystery of Agathadaemon, whose legend states, \"I am Chnumis, Sun of the Universe, 700,\" can alone solve the mystery of Jesus, the number of whose name is 888.\" It is not the key of St.\n\nPeter, or the Church dogma, but the narthex -- the wand of the candidate for initiation -- that has to be wrenched from the grasp of the long-silent Sphinx of the ages.\n\nMeanwhile ---- The augurs, who, upon meeting each other, have to thrust their tongues into their cheeks to suppress a fit of laughter, may be more numerous in our own age than they ever were in the day of Sylla.\n\n-------"


body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n2 [[Vol.\n\n2, Page]] 378 THE SECRET DOCTRINE.\n\n[[This page continued from previous section ]] T HE O RIGIN OF THE S ATANIC M YTH.\n\nLet us then fathom this creation of the Patristic fancy still deeper, and find its prototype with the Pagans.\n\nThe origin of the new Satanic myth is easy to trace.\n\nThe tradition of the Dragon and the Sun is echoed in every part of the world, both in its civilized and semi-savage regions.\n\nIt took rise in the whisperings about secret initiations among the profane, and was established universally through the once universal heliolatrous religion.\n\nThere was a time when the four parts of the world were covered with the temples sacred to the Sun and the Dragon; [[Vol.\n\n2, Page]] 379 THE SECRET OF THE DRAGON.\n\nbut the cult is now preserved mostly in China and the Buddhist countries, \"Bel and the Dragon being uniformly coupled together, and the priest of the Ophite religion as uniformly assuming the name of his God \" (\" Archaeology, \" Vol.\n\nxxv., p.\n\n220, London).\n\nIn the religions of the past, it is in Egypt we have to seek for its Western origin.\n\nThe Ophites adopted their rites from Hermes Trismegistus, and heliolatrous worship crossed over with its Sun-gods into the land of the Pharaohs from India.\n\nIn the gods of Stonehenge we recognise the divinities of Delphi and Babylon, and in those of the latter the devas of the Vedic nations.\n\nBel and the Dragon, Apollo and Python, Krishna and Kaliya, Osiris and Typhon are all one under many names -- the latest of which are Michael and the Red Dragon, and St.\n\nGeorge and his Dragon.\n\nAs Michael is \"one as God,\" or his \"Double,\" for terrestrial purposes, and is one of the Elohim, the fighting angel, he is thus simply a permutation of Jehovah.\n\nWhatever the Cosmic or astronomical event that first gave rise to the allegory of the \"War of Heaven,\" its earthly origin has to be sought in the temples of Initiation and archaic crypts.\n\nThe following are the proofs: -- We find ( a ) the priests assuming the name of the gods they served; ( b ) the \"Dragons\" held throughout all antiquity as the symbols of Immortality and Wisdom, of secret Knowledge and of Eternity; and ( c ) the hierophants of Egypt, of Babylon, and India, styling themselves generally the \"Sons of the Dragon\" and \"Serpents\"; thus the teachings of the Secret Doctrine are thereby corroborated.\n\nThere were numerous catacombs in Egypt and Chaldea, some of them of a very vast extent.\n\nThe most renowned of them were the subterranean crypts of Thebes and Memphis.\n\nThe former, beginning on the western side of the Nile, extended towards the Lybian desert, and were known as the Serpent ' s catacombs, or passages.\n\nIt was there that were performed the sacred mysteries of the kuklos anagkes, the \"Unavoidable Cycle,\" more generally known as \"the circle of necessity\"; the inexorable doom imposed upon every soul after the bodily death, and when it has been judged in the Amenthian region.\n\nIn de Bourbourg's book, Votan, the Mexican demi-god, in narrating his expedition, describes a subterranean passage which ran underground, and terminated at the root of the heavens, adding that this passage was a snake's hole, \"un agujero de colubra\"; and that he was admitted to it because he was himself \"a son of the snakes,\" or a serpent.\n\n(\"Die Phoinizier,\" 70.) This is, indeed, very suggestive; for his description of the snake ' s hole is that of the ancient Egyptian crypt, as above mentioned.\n\nThe hierophants, moreover, of Egypt, as of Babylon, generally styled them- [[Vol.\n\n2, Page]] 380 THE SECRET DOCTRINE.\n\nselves the \"Sons of the Serpent-god,\" or \"Sons of the Dragon,\" during the mysteries.\n\n\"The Assyrian priest bore always the name of his god,\" says Movers.\n\nThe Druids of the Celto-Britannic regions also called themselves snakes.\n\n\"I am a Serpent, I am a Druid,\" they exclaimed.\n\nThe Egyptian Karnak is twin brother to the Carnac of Bretagne, the latter Carnac meaning the serpent's mount.\n\nThe Dracontia once covered the surface of the globe, and these temples were sacred to the Dragon, only because it was the symbol of the sun, which, in its turn, was the symbol of the highest god -- the Phoenician Elon or Elion, whom Abraham recognised as El Elion.* Besides the surname of serpents, they were called the \"builders,\" the \"architects\"; for the immense grandeur of their temples and monuments was such that even now the pulverised remains of them \"frighten the mathematical calculations of our modern engineers,\" says Taliesin.** De Bourbourg hints that the chiefs of the name of Votan, the Quetzo-Cohuatl, or Serpent deity of the Mexicans, are the descendants of Ham and Canaan.\n\n\"I am Hivim,\" they say.\n\n\"Being a Hivim, I am of the great race of the Dragon (snake).\n\nI am a snake myself, for I am a Hivim.\" (\"Cartas,\" 51; \" Isis Unveiled, \" Vol.\n\nI., 553, et seq.\n\n) Furthermore, the \"War in Heaven\" is shown, in one of its significations, to have meant and referred to those terrible struggles in store for the candidate for adeptship, between himself and his (by magic) personified human passions, when the inner enlightened man had to either slay them or fail.\n\nIn the former case he became the \"Dragon-Slayer,\" as having happily overcome all the temptations; and a \"Son of the Serpent\" and a Serpent himself, having cast off his old skin and being born in a new body, becoming a Son of Wisdom and Immortality in Eternity.\n\n(See Part II .\n\non the Satanic Myth.) Seth, the reputed forefather of Israel, is only a Jewish travesty of Hermes, the God of Wisdom, called also Thoth, Tat, Seth, Set, and Satan.\n\nHe is also Typhon -- the same as Apophis, the Dragon slain by Horus; for Typhon was also called Set.\n\nHe is simply the dark side of Osiris, his brother, as Angra Mainyu is the black shadow of Ahura-mazda.\n\nTerrestrially, all these allegories were connected with the trials of adeptship and initiation.\n\nAstronomically, they referred to the Solar and Lunar eclipses, the mythical explanations of which we find to this day in India and Ceylon, where any one can study the allegorical narratives and traditions which have remained unchanged for many thousands of years."


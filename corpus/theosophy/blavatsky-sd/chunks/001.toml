body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n2 [[Vol.\n\n2, Page iii]] THE SECRET DOCTRINE: THE SYNTHESIS OF SCIENCE, RELIGION, AND PHILOSOPHY.\n\nby H.\n\nP.\n\nBLAVATSKY, Author of \"ISIS UNVEILED.\" \" There is no Religion higher than Truth.\n\n\" VOL.\n\nII.\n\n-- ANTHROPOGENESIS.\n\nLondon: THE THEOSOPHICAL PUBLISHING COMPANY, LIMITED.\n\n7, Duke Street, Adelphi, W.C.\n\nWILLIAM Q.\n\nJUDGE, 117, Nassau Street, New York.\n\nTHE MANAGER OF THE THEOSOPHIST.\n\nAdyar, Madras.\n\n--- 1888.\n\n[[Vol.\n\n2, Page iv]] \" Entered according to Act of Congress in the year 1888, by H.\n\nP.\n\nBlavatsky, in the Office of the Librarian of Congress at Washington, D.C.\n\n\" [[Vol.\n\n2, Page v]] This Work I Dedicate to all True Theosophists, In every Country, And of every Race, For they called it forth, and for them it was recorded.\n\n[[Vol.\n\n2, Page vii]] T ABLE OF CONTENTS.\n\n[[ Contents of Volume 1 , Secret Doctrine Homepage ]] ------- VOLUME SECOND.\n\nPRELIMINARY NOTES.\n\nOn the Archaic Stanzas, and the Four Prehistoric Continents ...\n\n1 The Imperishable Sacred Land ...\n\n6 The Hyperborean ...\n\n7 Lemuria ...\n\n7 Atlantis ...\n\n8 The Tropics at the Pole ...\n\n11 BOOK II.\n\n-- PART I.\n\nANTHROPOGENESIS.\n\nSTANZAS FROM THE BOOK OF DZYAN .\n\n.\n\n.\n\n15 ------- THE BEGINNINGS OF SENTIENT LIVE ...\n\n22 Man, the Third Logos ...\n\n25 The Celestial Governors of Humanity ...\n\n29 Parent Stars and Sister Planets ...\n\n33 Three Kinds of Light ...\n\n35 The Numbers of Creation ...\n\n39 The First War in Heaven ...\n\n45 ------- TWO ANTEDILUVIAN ASTRONOMERS ...\n\n47 ------- STANZA II.\n\n-- NATURE UNAIDED FAILS ...\n\n52 The Monsters of Chaos ...\n\n53 The \"Double Dragon\" ...\n\n57 Who are the Flames?\n\n...\n\n63 [[Vol.\n\n2, Page]] viii CONTENTS.\n\nTHE CHRONOLOGY OF THE BRAHMINS ...\n\n66 The Race that never dies ...\n\n67 Cosmogony, an intelligent plan ...\n\n73 ------- STANZA III.\n\n-- ATTEMPTS TO CREATE MAN ...\n\n75 The various cl
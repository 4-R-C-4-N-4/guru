atanic Myths ...\n\n233 Mahasura and Satan ...\n\n237 Man, the pale shadow of God ...\n\n243 The curse of Vasishta ...\n\n247 ------- ARCHAIC TEACHINGS IN THE PURANAS AND GENESIS ...\n\n251 From worm to man ...\n\n255 Identity of Human and Animal embryos ...\n\n259 ------- A PANORAMIC VIEW OF THE EARLY RACES ...\n\n263 The Natural \"Fall\" ...\n\n267 The Symbolism of Kronos ...\n\n269 [[Vol.\n\n2, Page]] x CONTENTS.\n\nSTANZA X.\n\n-- Continued ...\n\n271 The Golden Age ...\n\n273 No Devils outside Humanity ...\n\n275 ------- ARE GIANTS A FICTION?\n\n...\n\n277 The Seven Virgin Youths ...\n\n281 The Tibetan Lilith ...\n\n285 The Races of Men not all Human ...\n\n287 ------- THE RACES WITH THE \"THIRD EYE\" ...\n\n289 Occult Physiology ...\n\n295 The Evolution of the Eye ...\n\n299 The Third Eye is now a Gland ...\n\n301 ------- THE PRIMEVAL MANUS OF HUMANITY ...\n\n307 The Four Earlier Races ...\n\n311 The Esoteric Meaning of \" /Fish\" ...\n\n313 ------- STANZA XI.\n\n-- THE CIVILIZATION AND DESTRUCTION OF THE FOURTH AND FIFTH RACES ...\n\n316 Degeneration of Mankind ...\n\n319 Atlantis now Ocean Floor ...\n\n325 Changes of Climate ...\n\n329 How to Read Symbols ...\n\n335 The Antediluvian Buddhas ...\n\n339 ------- CYCLOPEAN RUINS AND COLOSSAL STONES AS WITNESSES TO GIANTS ...\n\n341 Living, Speaking, and Moving Stones ...\n\n345 It takes a God to become a Man ...\n\n349 ------- STANZA XII.\n\n-- THE FIFTH RACE AND ITS DIVINE INSTRUCTORS ...\n\n351 The Astronomical Dragon ...\n\n353 Serpents and Dragons under different Symbolisms ...\n\n355 The Sidereal and Cosmic Glyphs ...\n\n357 Our Divine Instructors ...\n\n365 The Origin of the Satanic Myth ...\n\n378 Noah was a Kabir, hence he must have been a Demon ...\n\n390 [[Vol.\n\n2, Page]] xi CONTENTS.\n\nThe oldest Persian Traditions about the Polar, and the Submerged Continents ...\n\n393 Western Speculations founded on the Greek and Puranic Traditions ...\n\n402 The \"Curse\" from a Philosophical point of view ...\
body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n1 [[Vol.\n\n1, Page]] 310 THE SECRET DOCTRINE.\n\n§ II.\n\nTHE MYSTERY LANGUAGE AND ITS KEYS.\n\nR ECENT discoveries made by great mathematicians and Kabalists thus prove, beyond a shadow of doubt, that every theology, from the earliest and oldest down to the latest, has sprung not only from a common source of abstract beliefs, but from one universal esoteric, or \"Mystery\" language.\n\nThese scholars hold the key to the universal language of old, and have turned it successfully, though only once , in the hermetically closed door leading to the Hall of Mysteries.\n\nThe great archaic system known from prehistoric ages as the sacred Wisdom Science, one that is contained and can be traced in every old as well as in every new religion, had, and still has, its universal language -- suspected by the Mason Ragon -- the language of the Hierophants, which has seven \"dialects,\" so to speak, each referring, and being specially appropriated, to one of the seven mysteries of Nature.\n\nEach had its own symbolism.\n\nNature could thus be either read in its fulness, or viewed from one of its special aspects.\n\nThe proof of this lies, to this day, in the extreme difficulty which the Orientalists in general, the Indianists and Egyptologists especially, experience in interpreting the allegorical writings of the Aryans and the hieratic records of old Egypt.\n\nThis is because they will never remember that all the ancient records were written in a language which was universal and known to all nations alike in days of old, but which is now intelligible only to the few.\n\nLike the Arabic figures which are plain to a man of whatever nation, or like the English word and , which becomes et for the Frenchman, und for the German, and so on, yet which may be expressed for all civilized nations in the simple sign & -- so all the words of that mystery language signified the same thing to each man of whatever nationality.\n\nThere have been several men of note who have tried to re-establish such a universal and philosophical tongue: Delgarme, Wilkins, Leibnitz; but Demaimieux, in his Pasigraphie , is the only one who has proven its possibility.\n\nThe scheme of Valentinius, called the \"Greek Kabala,\" based on the combination of Greek letters, might serve as a model.\n\nThe many-sided facets of the mystery language have led to the adoption of widely varied dogmas and rites in the exotericism of the Church rituals.\n\nIt is they, again, which are at the origin of most of the dogmas of the Christian Church, e.g., the seven Sacraments, the Trinity, the Resurrection; the seven capital Sins and the seven Virtues.\n\nThe seven keys to the mystery tongue, however, having always been in [[Vol.\n\n1, Page]] 311 EGYPT'S MANY RELIGIONS.\n\nthe keeping of the highest among the initiated Hierophants of antiquity, it is only the partial use of a few out of the seven which passed, through the treason of some early Church Fathers -- ex-initiates of the Temples -- into the hands of the new sect of the Nazarenes.\n\nSome of the early Popes were Initiates, but the last fragments of their knowledge have now fallen into the power of the Jesuits, who have turned them into a system of sorcery.\n\nIt is maintained that INDIA (not in its present limits, but including its ancient boundaries) is the only country in the world which still has among her sons adepts, who have the knowledge of all the seven sub-systems and the key to the entire system.\n\nSince the fall of Memphis, Egypt began to lose those keys one by one, and Chaldea had preserved only three in the days of Berosus.\n\nAs for the Hebrews, in all their writings they show no more than a thorough knowledge of the astronomical, geometrical and numerical systems of symbolizing all the human, and especially the physiological functions.\n\nThey never had the higher keys.\n\n\"Every time I hear people talking of the religion of Egypt,\" writes M.\n\nGaston Maspero, the great French Egyptologist and the successor of Mariette Bey, \"I am tempted to ask which of the Egyptian religions they are talking about?\n\nIs it of the Egyptian religion of the 4th Dynasty, or of the Egyptian religion of the Ptolemaic period?\n\nIs it of the religion of the rabble, or of that of the learned men?\n\nOf that which was taught in the schools of Heliopolis, or of that other which was in the minds and conceptions of the Theban sacerdotal class?\n\nFor, between the first tomb of Memphis, which bears the cartouche of a king of the third dynasty, and the last stones at Esneh under Caesar-Philippus, the Arabian, there is an interval of at least five thousand years.\n\nLeaving aside the invasion of the Shepherds, the Ethiopian and Assyrian dominions, the Persian conquest, Greek colonization, and the thousand revolutions of its political life, Egypt has passed during those five thousand years through many vicissitudes of life, moral and intellectual.\n\nChapter XVII .\n\nof the Book of the Dead which seems to contain the exposition of the system of the world as it was understood at Heliopolis during the time of the first dynasties, is known to us only by a few copies of the eleventh and twelfth dynasties.\n\nEach of the verses composing it was already at the time interpreted in three or four different ways; so different, indeed, that according to this or another school, the Demiurge became the solar fire -- Ra-shoo , or the primordial water.\n\nFifteen centuries later, the number of readings had increased considerably.\n\nTime had, in its course, modified the ideas about the universe and the forces that ruled it.\n\nDuring the hardly 18 centuries that Christianity exists, it has worked, [[Vol.\n\n1, Page]] 312 THE SECRET DOCTRINE.\n\ndeveloped and transformed most of its dogmas; how many times, then, might not the Egyptian clergy have altered its dogmas during those fifty centuries that separate Theodosius from the King Builders of the Pyramids?\" Here we believe the eminent Egyptologist is going too far.\n\nThe exoteric dogmas may often have been altered, the esoteric never.\n\nHe does not take into account the sacred immutability of the primitive truths, revealed only during the mysteries of initiation.\n\nThe Egyptian priests have forgotten much , they altered nothing.\n\nThe loss of a good deal of the primitive teaching was due to the sudden deaths of the great Hierophants, who passed away before they had time to reveal all to their successors; mostly, to the absence of worthy heirs to the knowledge.\n\nYet they have preserved in their rituals and dogmas the principal teachings of the secret doctrine."


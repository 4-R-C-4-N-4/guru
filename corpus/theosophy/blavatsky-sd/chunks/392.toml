body = "26, after Adam, the first androgyne, after Adam Kadmon, the sexless (the first) Logos, Adam and Eve once separated, come finally Jehovah-Eve and Cain-Jehovah.\n\nThese represent distinct Root-Races, for millions of years elapsed between them.\n\nHence the Aryan and the Semitic Theo-anthropographies are two leaves on the same stem; their respective personifications and symbolic personages standing in relation to each other in this way.\n\nI.\n\nThe Unknowable, referred to in various ways in Rig Vedic verse, such as \" Nought Was,\" called, later on \"Parabrahm;\" the ( Ain, nothing, or the \"Ain-Soph\" of the Kabalists), and again, the \"Spirit\" (of God) that moves upon the face of the waters, in Genesis.\n\nAll these are identical.\n\nMoreover, in Genesis, ch.\n\ni., v.\n\n2, is placed as verse 1 in the secret Kabalistic texts, where it is followed by the Elohim \"creating the Heaven and the Earth.\" This deliberate shifting of the order of the verses was necessary for monotheistic and Kabalistic purposes.\n\nJeremiah's curse against those Elohim (gods) who have not created the Heavens and the Earth, ch.\n\nx., v.\n\n11, shows that there were other Elohim who had.\n\nII.\n\nThe \"Heavenly\" Manu-Swayambhuva, who sprang from Swayambhu-Narayana, the \"Self-existent,\" and Adam Kadmon of the Kabalists, and the androgyne MAN of Genesis ch.\n\n1 are also identical.\n\nIII.\n\nManu-swayambhuva is Brahma, or the Logos; and he is Adam Kadmon, who in Genesis iv., 5, separates himself into two halves, male and female, thus becoming Jah-Hovah or Jehovah-Eve; as Manu Swayambhuva or Brahma separates himself to become \"Brahma-Viraj and Vach-Viraj,\" male and female; all the rest of the texts and versions being blinds.\n\nIV.\n\nVach is the daughter of Brahma and is named Sata-Rupa, \"the hundred-formed,\" and Savitri, \" generatrix, \" the mother of the gods and of all living.\n\nShe is identical with Eve, \"the mother (of all the lords or gods or) of all living.\" Besides this there are many other occult meanings.\n\nWhat is written in \" Isis, \" although scattered about and very cautiously expressed at the time, is correct: Explaining esoterically Ezekiel's wheel,* it is said of Jodhevah or Jehovah: - \"When the ternary is taken in the beginning of the Tetragram, it expresses the divine creation spiritually, without any carnal sin; taken at its opposite end it expresses the latter: it is feminine.\n\nThe name of Eva is composed of three letters, that of the primitive or heavenly [[Footnote(s)]] ------------------------------------------------- * \" Isis Unveiled ,\" Vol.\n\nII., p.\n\n462.\n\n[[Vol.\n\n2, Page]] 129 THE JEWISH GOD-NAME.\n\nAdam, is written with one letter, Jod or Yodh; therefore it must not be read Jehovah but Ieva, or Eve.\n\nThe Adam of the first chapter is the spiritual, therefore pure, androgyne Adam Kadmon.\n\nWhen woman issues from the rib of the second Adam (of dust), the pure Virgo is separated, and falling \"into generation,\" or the downward cycle, becomes Scorpio, emblem of sin and matter.\n\nWhile the ascending cycle points to the purely spiritual races, or the ten prediluvian patriarchs, the Prajapatis and Sephiroth are led on by the creative Deity itself, who is Adam Kadmon or Yod-cheva.\n\nSpiritually, the lower one (Jehovah) is that of the terrestrial races, led on by Enoch or Libra, the seventh; who, because he is half-divine, half-terrestrial, is said to have been taken by God alive.\n\nEnoch, Hermes, and Libra, are one.\" This is only one of the several meanings.\n\nNo need to remind the scholar that Scorpio is the astrological sign of the organs of reproduction.\n\nLike the Indian Rishis, the Patriarchs are all convertible in their numbers, as well as interchangeable.\n\nAccording to the subject to which they relate they become ten, twelve, seven or five, and even fourteen, and they have the same esoteric meaning as the Manus or Rishis.\n\nMoreover, Jehovah, as may be shown, has a variety of etymologies, but only those are true which are found in the Kabala.\n\n( Ieve ) is the Old Testament term, and was pronounced Ya- va .\n\nInman suggests that it is contracted from the two words Yaho-Iah, Jaho-Jah, or Jaho is Jah.\n\nPunctuated it is which is, however, a Rabbinical caprice to associate it with the name Adoni or , which has the same points.\n\nIt is curious, and indeed hardly conceivable, that the Jews anciently read the name ( Adoni ) , when they had so many names of which Jeho and Jah and Iah constituted a part.\n\nBut so it was; and Philo Byblus, who gives us the so-called fragment of Sanchoniathon, spelt it in Greek letters [[ IEUO ]], Javo or Jevo.\n\nTheodoret says that the Samaritans pronounced Yahva, and the Jews Yaho.\n\nProf .\n\nGibbs, however, suggests its punctuation thus: ( Ye-hou-vih ); and he cut the Gordian knot of its true occult meaning.\n\nFor in this last form, as a Hebrew verb, it means \"he will -- be.\"* It was also derived from the Chaldaic verb or eue ( eva ) or eua ( Eva ) \"to be.\" And so it was, since from Enosh, the \"Son of Man,\" only, were the truly human races to begin and \"to be,\" as males and females.\n\nThis statement receives further corroboration, inasmuch as Parkhurst makes the verb to mean: (1) \"To [[Footnote(s)]] ------------------------------------------------- * See for comparison Hosea, xii.\n\n6, where it is so punctuated.\n\n[[Vol.\n\n2, Page]] 130 THE SECRET DOCTRINE.\n\nfall down\" ( i.e.\n\ninto generation or matter); and (2) \" To be, to continue \" -- as a Race.\n\nThe aspirate of the word eua ( Eva ) \"to be\" being Heve ( Eve ) , which is the feminine of and the same as Hebe, the Grecian goddess of youth and the Olympian bride of Heracles, makes the name Jehovah appear still more clearly in its primitive double-sexed form.\n\nFinding in Sanskrit such syllables as Jah and Yah, e.g., Jah ( navi ) \"Ganges\" and Jagan-natha, \"Lord of the World,\" it becomes clear why Mr."


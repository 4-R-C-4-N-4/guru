[content]
body = "In the original allegory it is matter -- hence the more material angels -- which was regarded as the conqueror of Spirit, or the Archangels who \"fell\" on this plane.\n\n\"They of the flaming sword (or animal passions) had put to flight the Spirits of Darkness.\" Yet it is the latter who fought for the supremacy of the conscious and divine spirituality on Earth and failed, succumbing to the power of matter.\n\nBut in theological dogma we see the reverse.\n\nIt is Michael, \"who is like unto God,\" the representative of Jehovah, who is the leader of the celestial hosts -- as Lucifer, in Milton's fancy, is of the infernal hosts -- who has the best of Satan.\n\nIt is true that the nature of [[Vol.\n\n2, Page]] 63 WHO ARE THE \"FLAMES\"?\n\nMichael depends upon that of his Creator and Master.\n\nWho the latter is, one may find out by carefully studying the allegory of the \"War in Heaven\" with the astronomical key.\n\nAs shown by Bentley, the \"War of the Titans against the gods\" in Hesiod, and also the war of the Asuras (or the Tarakamaya) against the devas in Puranic legend, are identical in all save the names.\n\nThe aspects of the stars show (Bentley taking the year 945 B.C .\n\nas the nearest date for such conjunction) that \"all the planets, except Saturn, were on the same side of the heavens as the Sun and Moon,\" and hence were his opponents.\n\nAnd yet it is Saturn, or the Jewish \"Moon-god,\" who is shown as prevailing, both by Hesiod and Moses, neither of whom was understood.\n\nThus it was that the real meaning became distorted.\n\n------- STANZA II.\n\n-- Continued.\n\n8.\n\nT HE FLAMES CAME.\n\nT HE FIRES WITH THE SPARKS; THE NIGHT FIRES AND THE DAY FIRES ( a ).\n\nT HEY DRIED OUT THE TURBID DARK WATERS.\n\nW ITH THEIR HEAT THEY QUENCHED THEM.\n\nT HE L HAS ( Spirits ) OF THE HIGH; T HE LHAMAYIN ( those ) OF BELOW, CAME ( b ) .\n\nT HEY SLEW THE FORMS, WHICH WERE TWO- AND FOUR-FACED.\n\nT HEY FOUGHT THE GOAT-MEN, AND THE DOG-HEADED MEN, AND THE MEN WITH FISHES' BODIES.\n\n( a ) The \"Flames\" are a Hierarchy of Spirits parallel to, if not identical with, the \"burning\" fiery Saraph (Seraphim) mentioned by Isaiah (vi.\n\n2-6), those who attend, according to Hebrew Theogony, \"the Throne of the Almighty.\" Melha is the Lord of the \"Flames.\" When he appears on Earth, he assumes the personality of a Buddha, says a popular legend.\n\nHe is one of the most ancient and revered Lhas, a Buddhist St.\n\nMichael.\n\n( b ) The word \"Below\" must not be taken to mean infernal regions, but simply a spiritual, or rather ethereal, Being of a lower grade, because nearer to the Earth, or one step higher than our terrestrial sphere; while the Lhas are Spirits of the highest Spheres -- whence the name of the capital of Tibet, Lha-ssa.\n\nBesides a statement of a purely physical nature and belonging to the [[Vol.\n\n2, Page]] 64 THE SECRET DOCTRINE.\n\nevolution of life on Earth, there may be another allegorical meaning attached to this Sloka, or indeed, as is taught, several.\n\nThe FLAMES, or \"Fires,\" represent Spirit, or the male element, and \"Water,\" matter, or the opposite element.\n\nAnd here again we find, in the action of the Spirit slaying the purely material form, a reference to the eternal struggle, on the physical and psychic planes, between Spirit and Matter, besides a scientific cosmic fact.\n\nFor, as said in the next verse: -- ------- 9.\n\nM OTHER-WATER, THE GREAT SEA WEPT.\n\nS HE AROSE, SHE DISAPPEARED IN THE M OON, WHICH HAD LIFTED HER, WHICH HAD GIVEN HER BIRTH ( a ).\n\n( a ) Now what can this mean?\n\nIs it not an evident reference to tidal action in the early stage of the history of our planet in its fourth Round?\n\nModern research has been busy of late in its speculations on the Palaeozoic high-tides.\n\nMr.\n\nDarwin's theory was that not less than 52,000,000 years ago -- and probably much more -- the Moon originated from the Earth's plastic mass.\n\nStarting from the point where research was left by Helmholtz, Ferrel, Sir William Thomson and others, he retraced the course of tidal retardation of the earth's rotary motions far back into the very night of time, and placed the Moon during the infancy of our planet at only \"a fraction of its present distance.\" In short, his theory was that it is the Moon which separated from the Earth.\n\nThe tidal elevation concurring with the swing of the globular mass -- centrifugal tendency being then nearly equal to gravity -- the latter was overcome, and the tidally elevated mass could thus separate completely from the Earth.* The Occult teaching is the reverse of this.\n\nThe Moon is far older than the Earth; and, as explained in Book I., it is the latter which owes its being to the former, however astronomy and geology may explain the fact.\n\nHence, the tides and the attraction to the Moon, as shown by the liquid portion of the Globe ever striving to raise itself towards its parent.\n\nThis is the meaning of the sentence that \"the Mother-Water arose and disappeared in the Moon, which had lifted her, which had given her birth.\" ------- [[Footnote(s)]] ------------------------------------------------- * But see the difficulties suggested later, in the works of various geologists, against this theory.\n\nCompare Sir R.\n\nS.\n\nBull's article in \" Nature \" (Dec.\n\n1, 1881), and also what the American geologists say.\n\n[[Vol.\n\n2, Page]] 65 DIVINE WILL BECOMES EROS.\n\n10.\n\nW HEN THEY ( the Rupas ) WERE DESTROYED, M OTHER-EARTH REMAINED BARE,* SHE ASKED TO BE DRIED ( a ).** ( a ) The time for its incrustation had arrived.\n\nThe waters had separated and the process was started.\n\nIt was the beginning of a new life.\n\nThis is what one key divulges to us.\n\nAnother key teaches the origin of Water, its admixture with Fire (liquid fire it calls it),*** and enters upon an alchemical description of the progeny of the two -- solid matter such as minerals and earths.\n\nFrom the \"Waters of Space,\" the progeny of the male Spirit-Fire and the female (gaseous) Water has become the Oceanic expanse on Earth.\n\nVaruna is dragged down from the infinite Space, to reign as Neptune over the finite Seas.\n\nAs always, the popular fancy is found to be based on a strictly scientific foundation."


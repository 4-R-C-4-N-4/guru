body = "made by the Secret Doctrine.* For assigning as the latter does from four to five million years between the incipient and the final evolution of the Fourth Root-Race, on the Lemuro-Atlantean Continents; one million years for the Fifth, or Aryan Race, to the present date; and about 850,000 since the submersion of the last large peninsula of the great Atlantis -- all this may have easily taken place within the 15,000,000 years conceded by Mr.\n\nCroll to the Tertiary Age.\n\nBut, chronologically speaking, the duration of the period is of secondary importance, as we have, after all, certain American scientists to fall back upon.\n\nThese gentlemen, unmoved by the fact that their assertions are called not only dubious but absurd, yet maintain that man existed so far back as in the Secondary Age.\n\nThey have found human footprints on rocks of that formation; and furthermore, M.\n\nde Quatrefages finds no valid scientific reason why man should not have existed during the Secondary Age.\n\nThe \"Ages\" and periods in geology are, in sober truth, purely conventional terms, as they are still hardly delineated, and, moreover, [[Footnote(s)]] ------------------------------------------------- * Sir Charles Lyell, who is credited with having \" happily invented the terms Eocene, Miocene, and Pliocene,\" to mark the three divisions of the Tertiary age, ought really to have settled upon some approximate age for his \"Mind-offspring.\" Having left the duration of these periods, however, to the speculations of specialists, the greatest confusion and perplexity are the result of that happy thought.\n\nIt seems like a hopeless task to quote one set of figures from one work, without the risk of finding it contradicted by the same Author in an earlier or a subsequent volume.\n\nSir W.\n\nThomson, one of the most eminent among the modern authorities, has changed, about half-a-dozen times, his opinion upon the age of the Sun and the date of the consolidation of the Earth's crust.\n\nIn Thomson and Tait's \" Natural Philosophy, \" one finds only ten million years allowed, since the time when the temperature of the Earth permitted vegetable life to appear on it; ( App.\n\nD et seq.\n\nalso Trans.\n\nRoy.\n\nSoc.\n\nEdin.\n\nxxiii, Pt.\n\n1, 157, 1862, where 847 is cancelled).\n\nMr.\n\nDarwin gives Sir W.\n\nThomson's estimate as \"a minimum of 98 and a maximum of 200 millions of years since the consolidation of the crust\" (See Ch.\n\nGould).\n\nIn the same work ( Nat.\n\nPhil.\n\n) 80 millions are given from the time of incipient incrustation to the present state of the world.\n\nAnd in his last lecture, as shown elsewhere, Sir W.\n\nThomson declares (1887) that the Sun is not older than 15 millions of years!\n\nMeanwhile, basing his arguments as to the limits to the age of the Sun's heat, on figures previously established by Sir W.\n\nThomson, Mr.\n\nCroll allows 60 millions of years since the beginning of the Cambrian period.\n\nThis is hopeful for the lovers of exact knowledge.\n\nThus, whatever figures are given by Occult Science, they are sure to be corroborated by those of some one among the modern men of Science who are considered as authorities.\n\n[[Vol.\n\n2, Page]] 11 THE TROPICS AT THE POLE.\n\nno two geologists or naturalists agree as to the figures.\n\nThus, there is a wide margin for choice offered to the Occultist by the learned fraternity.\n\nShall we take for one of our supports Mr.\n\nT.\n\nMellard Reade?\n\nThis gentleman, in a paper on \"Limestone as an Index of Geological Time,\" read by him in 1878 before the Royal Society, claims that the minimum time required for the formation of the sedimentary strata and the elimination of the calcareous matter is in round numbers 600 million years ( See \" Proceedings of Royal Society, \" London, Vol.\n\nXXVIII ., p.\n\n281); or shall we ask support for our chronology from Mr.\n\nDarwin's works, wherein he demands for the organic transformations according to his theory from 300 to 500 million years?\n\nSir C.\n\nLyell and Prof.\n\nHoughton were satisfied with placing the beginning of the Cambrian Age at 200 and 240 millions of years back respectively.\n\nGeologists and zoologists claim the maximum time, though Mr.\n\nHuxley, at one time, placed the beginning of the incrustation of the earth 1,000 million years ago, and would not surrender a millennium of it.\n\nBut the main point for us lies not in the agreement or disagreement of the Naturalists as to the duration of geological periods, but rather in their perfect accord on one point, for a wonder, and this a very important one.\n\nThey all agree that during \"The Miocene Age\" -- whether one or ten million years ago -- Greenland and even Spitzbergen, the remnants of our Second or Hyperborean Continent, \"had almost a tropical climate.\n\n\" Now the pre-Homeric Greeks had preserved a vivid tradition of this \"Land of the Eternal Sun,\" whither their Apollo journeyed yearly.\n\n\"During the Miocene Age, Greenland (in N.\n\nLat.\n\n70 degrees) developed an abundance of trees, such as the Yew, the Redwood, the Sequoia, allied to the Californian species, Beeches, Planes, Willows, Oaks, Poplars and Walnuts, as well as a Magnolia and a Zamia,\" says Science; in short Greenland had Southern plants unknown to Northern regions.\n\nAnd now this natural question rises.\n\nIf the Greeks knew, in the days of Homer, of a Hyperborean land, i.e., a blessed land beyond the reach of Boreas, the god of winter and of the hurricane, an ideal region which the later Greeks and their classics have vainly tried to locate by searching for it beyond Scythia, a country where nights were short and days long, and beyond that land a country where the sun never set and the palm grew freely -- if they knew of all this, who then told them of it?\n\nIn [[Vol.\n\n2, Page]] 12 THE SECRET DOCTRINE.\n\ntheir day, and for ages previously, Greenland must certainly have been already covered with perpetual snows, with never-thawing ice, just as it is now.\n\nEverything tends to show that the land of the short nights and the long days was Norway or Scandinavia, beyond which was the blessed land of eternal light and summer; and to know of this, their tradition must have descended to the Greeks from some people more ancient than themselves, who were acquainted with those climatic details of which the Greeks themselves could know nothing.\n\nEven in our day, science suspects beyond the Polar seas, at the very circle of the Arctic Pole, the existence of a sea which never freezes and a continent which is ever green.\n\nThe archaic teachings, and likewise the Puranas -- for one who understands the allegories of the latter -- contain the same statements."


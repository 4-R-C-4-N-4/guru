body = "The early Christians -- besides the Ophite Gnostics -- had their dual Logos: the Good and the Bad Serpent, the Agathodaemon and the Kakodaemon.\n\nThis is demonstrated by the writings of Marcus, Valentinus, and many others, and especially in Pistis Sophia -- certainly a document of the earliest centuries of Christianity.\n\nOn the marble sarcophagus of a tomb, discovered in 1852 near the Porta Pia, one sees the scene of the adoration of the Magi, \"or else,\" remarks the late C.\n\nW.\n\nKing in \" The Gnostics ,\" \"the prototype of that scene, the 'Birth of the New Sun.'\" The mosaic floor exhibited a curious design which might have represented either ( a ) Isis suckling the babe Harpocrates, or ( b ) the Madonna nursing the infant Jesus.\n\nIn the smaller sarcophagi that surrounded the larger one, eleven leaden plates rolled like scrolls were found, three of which have been deciphered.\n\nThe contents of these ought to be regarded as final proof of a much-vexed question, for they show that either the early Christians, up to the VIth Century, were bond fide pagans, or that dogmatic Christianity was borrowed wholesale, and passed in full into the Christian Church -- Sun, Tree, Serpent, Crocodile and all.\n\n\"On the first is seen Anubis .\n\n.\n\n.\n\nholding out a scroll; at his feet are two female busts; below all are two serpents entwined .\n\n.\n\n.\n\na corpse swathed up like a mummy.\n\nIn the second scroll .\n\n.\n\n.\n\nis Anubis, holding out a cross, the \"Sign of Life.\" Under his feet lies the corpse encircled in the numerous folds of a huge serpent, the Agathodaemon, guardian of the deceased.\n\n.\n\n.\n\n.\n\n.\n\nIn the third scroll, Anubis bears on his arm .\n\n.\n\n.\n\n.\n\n.\n\nthe outline of .\n\n.\n\na complete Latin cross .\n\n.\n\n.\n\nAt the god's foot is a rhomboid, the Egyptian 'Egg of the World,' towards which crawls a serpent coiled into a circle .\n\n.\n\n.\n\n.\n\nUnder the busts is the letter [[omega]] repeated seven times in a line, reminding one of the 'names' .\n\n.\n\n.\n\nVery remarkable also is the line of characters, apparently Palmyrene, upon the legs of the first Anubis.\n\nAs for the figure of the serpent , supposing these talismans to emanate not from the Isiac but the newer Ophite creed, it may well stand for that \"True and perfect Serpent,\" who leads forth the souls of all that put their trust in him out of the Egypt of the body, and through the Red Sea of Death into the Land of Promise, saving them on their way from the Serpents of the Wilderness, that is, from the Rulers of the Stars.\" (King's \"Gnostics,\" p.\n\n366.) And this \"True and Perfect Serpent\" is the seven-lettered God who is now credited with being Jehovah, and Jesus One with him.\n\nTo this Seven-vowelled god the candidate for initiation is sent by Christos, in the Pistis Sophia , a work earlier than St.\n\nJohn's Revelation , and evidently of the same school.\n\n\"The (Serpent of the) Seven Thunders uttered [[Vol.\n\n1, Page]] 411 THE MYSTERY OF THE SEVEN THUNDERS.\n\nthese seven vowels,\" but \"Seal up those things which the seven thunders uttered, and write them not,\" says Revelation.\n\n\"Do ye seek after these mysteries?\" inquiries Jesus in Pistis Sophia.\n\n\"No mystery is more excellent than they (the seven vowels): for they shall bring your souls unto the Light of Lights\" -- i.e.\n\n, true Wisdom.\n\n\"Nothing, therefore, is more excellent than the mysteries which ye seek after, saving only the mystery of the Seven Vowels and their F ORTY AND NINE Powers , and the numbers thereof.\" In India, it was the mystery of the Seven F IRES and their forty-nine fires or aspects, or \"the members thereof,\" just the same.\n\nThese seven vowels are represented by the Swastika signs on the crowns of the seven heads of the Serpent of Eternity, in India, among esoteric Buddhists, in Egypt, in Chaldea, etc.\n\netc., and among the Initiates of every other country.\n\nIt is on the Seven zones of post mortem ascent, in the Hermetic writings, that the \"mortal\" leaves, on each, one of his \"Souls\" (or Principles); until arrived on the plane above all zones he remains as the great Formless Serpent of absolute wisdom -- or the Deity itself.\n\nThe seven-headed serpent has more than one signification in the Arcane teachings.\n\nIt is the seven-headed Draco , each of whose heads is a star of the Lesser Bear; but it was also, and pre-eminently, the Serpent of Darkness ( i.e.\n\n, inconceivable and incomprehensible) whose seven heads were the seven Logoi , the reflections of the one and first manifested Light -- the universal L OGOS.\n\n-------------- [[This page continued in next section]]"


[content]
body = "The idea of both was that, at the origin of things, all that matter which now enters into the composition of the planetary bodies was spread over all the space comprised in the solar system -- and even beyond.\n\nIt was a nebula of extremely small density, whose condensation gradually gave birth, by a mechanism that has hitherto never been explained, to the various bodies of our systems.\n\nThis is the original nebular theory, an incomplete yet faithful repetition -- a short chapter out of the large volume of universal esoteric cosmogony -- of the teachings in the Secret Doctrine.\n\nAnd both systems, Kant's and Laplace's, differ greatly from the modern theory, redundant with conflicting sub -theories and fanciful hypotheses.\n\n\" The essence of cometary matter and of that which composes the stars is totally different from any of the chemical or physical characteristics with which Western Science is now acquainted.\n\nWhile the spectroscope has shown the probable similarity (owing to the chemical action of terrestrial light upon the intercepted rays) of earthly and sidereal substance, the chemical actions, peculiar to the variously progressed orbs of space, have not been detected, nor proven to be identical with those observed on our own planet\" -- say the Teachers ( op.\n\ncit.\n\n) .\n\nMr.\n\nCrookes says almost the same in the fragment quoted from his lecture, \" Elements and Meta-Elements.\n\n\" \"At the utmost,\" observes C.\n\nWolf,* \"could the nebular hypothesis show in its favour, with W.\n\nHerschell, the existence of planetary nebulae in various degrees of condensation, and of spiral nebulae, with nuclei of condensation on the branches and centre.** But, in fact, the knowledge of the bond that unites the nebulae to the stars is yet denied to us; and lacking as we do direct observation, we are even debarred from establishing it even on the analogy of chemical composition.\" It is evident that, even if the men of science, leaving aside the [[Footnote(s)]] ------------------------------------------------- * Member of the Institute, Astronomer of the Observatory, Paris, \"Cosmogonical Hypotheses.\" ** But the spectra of these nebulae have never yet been ascertained.\n\nWhen they are found with bright lines, then only may they be cited.\n\n[[Vol.\n\n1, Page]] 598 THE SECRET DOCTRINE.\n\ndifficulty arising for them out of such undeniable variety and heterogeneity of matter in the constitution of nebulae, did admit, with the ancients, that the origin of all the visible and invisible heavenly bodies must be sought for in one primordial homogeneous world-stuff, in a kind of PRE- protyle ,* -- it is evident that this would not put an end to their perplexities.\n\nUnless they admit also that our actual visible Universe is merely the Sthula - Sharira , the gross body, of the sevenfold Kosmos, they will have to face another problem; especially if they risk maintaining that its now visible bodies are the result of the condensation of that one and single primordial matter.\n\nFor mere observation shows them that the actions which produced the actual Universe are far more complex than could ever be embraced in that theory.\n\nFirst of all, there are two distinct classes of irresolvable nebulae, -- as Science itself teaches.\n\nThe telescope is unable to distinguish between the two, but the spectroscope can, and notices, therefore, an essential difference between their physical constitutions.** \"Some of these,\" Wolf tells us, \"have a spectrum of three or four bright lines, others a continuous spectrum.\n\nThe first are gaseous, the others formed of a pulverulent matter.\n\nThe former must constitute a veritable atmosphere: it is among these that the solar nebula of Laplace has to be placed.\n\nThe latter form an ensemble of particles that may be considered as independent, and the rotation of which obeys the laws of [[Footnote(s)]] ------------------------------------------------- * Mr.\n\nCrookes' \"Protyle\" must not be regarded as the primary stuff, out of which the Dhyan Chohans, in accordance with the immutable laws of nature, wove our solar system.\n\nThis protyle cannot even be the first prima - materia of Kant, which that great mind saw used up in the formation of the worlds, and thus existing no longer in a diffused state.\n\nIt is a MEDIATE phase in the progressive differentiation of cosmic substance from its normal undifferentiated state.\n\nProtyle is then the aspect assumed by matter in its middle passage into full objectivity.\n\n** \"The question of the resolvability of the nebulae has been often presented in too affirmative a manner and quite contrary to the ideas expressed by the illustrious experimenter with the spectra of these constellations -- Mr.\n\nHuggins.\n\nEvery nebula whose spectrum contains only bright lines is gaseous, it is said, and hence is irresolvable; every nebula with a continuous spectrum must end by resolving into stars with an instrument of sufficient power.\n\nThis assumption is contrary at once to the results obtained, and to spectroscopic theory.\n\nThe Lyra nebula, the Dumb - bell nebula, the central region of the nebula of Orion, appear resolvable, and show a spectrum of bright lines; the nebula of Canis Venatici is not resolvable, and gives a continuous spectrum.\n\nBecause, indeed, the spectroscope informs us of the physical state of the constituent matter of the stars, but affords us no notions of their modes of aggregation.\n\nA nebula formed of gaseous globes (or even of nuclei, faintly luminous, surrounded by a powerful atmosphere) would give a spectrum of lines and be still resolvable; such seems to be the state of Huggins' region in the Orion nebula.\n\nA nebula formed of solid or fluidic particles in a state of incandescence, a true cloud, will give a continuous spectrum but will be irresolvable.\n\n\" ( C.\n\nWolf , Cosmogonical Hypotheses.\n\n) [[Vol.\n\n1, Page]] 599 THE NEBULAR THEORY A ROMANCE.\n\ninternal weight: such are the nebulae adopted by Kant and Faye.\n\nObservation allows us to place the one as the other at the very origin of the planetary world.\n\nBut when we try to go beyond and ascend to the primitive chaos which has produced the totality of the heavenly bodies, we have first to account for the actual existence of these two classes of nebulae.\n\nIf the primitive chaos were a cold luminous gas ,* one could understand how the contraction resulting from attraction could have heated it and made it luminous.\n\nWe have to explain the condensation of this gas to the state of incandescent particles, the presence of which is revealed to us in certain nebulae by the spectroscope.\n\nIf the original chaos was composed of such particles, how did certain of their portions pass into the gaseous state, while others have preserved their primitive condition?\n\n.\n\n.\n\n."


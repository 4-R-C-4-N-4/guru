[content]
body = "Now the Monadic, or rather Cosmic, Essence (if such a term be permitted) in the mineral, vegetable, and animal, though the same throughout the series of cycles from the lowest elemental up to the Deva Kingdom, yet differs in the scale of progression.\n\nIt would be very misleading to imagine a Monad as a separate Entity trailing its slow way in a distinct path through the lower Kingdoms, and after an incalculable series of transformations flowering into a human being; in short, that the Monad of a Humboldt dates back to the Monad of an atom of horneblende.\n\nInstead of saying a \"Mineral Monad,\" the more correct phraseology in physical Science, which differentiates every atom, would of course have been to call it \"the Monad manifesting in that form of Prakriti called the Mineral Kingdom.\" The atom, as represented in the ordinary scientific hypothesis, is not a particle of something, animated by a psychic something, destined after aeons to blossom as a man.\n\nBut it is a concrete manifestation of the Universal Energy which itself has not yet become individualized; a sequential manifestation of the one Universal Monas.\n\nThe ocean (of matter) does not divide into its potential and constituent drops until the sweep of the life-impulse reaches the evolutionary stage of man-birth.\n\nThe tendency towards segregation into individual Monads is gradual, and in the higher animals comes almost to the point.\n\nThe Peripatetics applied the word Monas to the whole Kosmos, in the pantheistic sense; and the Occultists, while accepting this thought for convenience sake, distinguish the progressive stages of the evolution of the concrete from the abstract by terms of which the \"Mineral, Vegetable, Animal, (etc.), Monad\" are examples.\n\nThe term merely means that the tidal wave of spiritual evolution is passing through that arc of its circuit.\n\nThe \"Monadic [[Vol.\n\n1, Page]] 179 THE LUNAR MONADS.\n\nEssence\" begins to imperceptibly differentiate towards individual consciousness in the Vegetable Kingdom.\n\nAs the Monads are uncompounded things, as correctly defined by Leibnitz, it is the spiritual essence which vivifies them in their degrees of differentiation, which properly constitutes the Monad -- not the atomic aggregation, which is only the vehicle and the substance through which thrill the lower and the higher degrees of intelligence.\n\nLeibnitz conceived of the Monads as elementary and indestructible units endowed with the power of giving and receiving with respect to other units, and thus of determining all spiritual and physical phenomena.\n\nIt is he who invented the term apperception, which together with nerve- (not perception, but rather) -- sensation, expresses the state of the Monadic consciousness through all the Kingdoms up to Man.\n\nThus it may be wrong on strictly metaphysical lines to call Atma-Buddhi a MONAD, since in the materialistic view it is dual and therefore compound.\n\nBut as Matter is Spirit, and vice versa; and since the Universe and the Deity which informs it are unthinkable apart from each other; so in the case of Atma-Buddhi.\n\nThe latter being the vehicle of the former, Buddhi stands in the same relation to Atma, as Adam-Kadmon, the Kabalistic Logos, does to En-Soph, or Mulaprakriti to Parabrahm.\n\nA few words more of the Moon.\n\nWhat, it may be asked, are the \"Lunar Monads,\" just spoken of?\n\nThe description of the seven classes of Pitris will come later, but now some general explanations may be given.\n\nIt must be plain to everyone that they are Monads, who, having ended their life-cycle on the lunar chain, which is inferior to the terrestrial chain, have incarnated on this one.\n\nBut there are some further details which may be added, though they border too closely on forbidden ground to be treated of fully.\n\nThe last word of the mystery is divulged only to the adepts, but it may be stated that our satellite is only the gross body of its invisible principles.\n\nSeeing then that there are 7 Earths, so there are 7 Moons, the last one alone being visible; the same for the Sun, whose visible body is called a Maya, a reflection, just as man's body is.\n\n\"The real Sun and the real Moon are as invisible as the real man,\" says an occult maxim.\n\nAnd it may be remarked en passant that those ancients were not so foolish after all who first started the idea of \"the seven moons.\" For though [[Vol.\n\n1, Page]] 180 THE SECRET DOCTRINE.\n\nthis conception is now taken solely as an astronomical measure of time, in a very materialised form, yet underlying the husk there can still be recognised the traces of a profoundly philosophical idea.\n\nIn reality the Moon is only the satellite of the Earth in one respect, viz., that physically the Moon revolves round the Earth.\n\nBut in every other respect it is the Earth which is the satellite of the Moon, and not vice versa.\n\nStartling as the statement may seem it is not without confirmation from scientific knowledge.\n\nIt is evidenced by the tides, by the cyclic changes in many forms of disease which coincide with the lunar phases; it can be traced in the growth of plants, and is very marked in the phenomena of human gestation and conception.\n\nThe importance of the Moon and its influence on the Earth were recognized in every ancient religion, notably the Jewish, and have been remarked by many observers of psychical and physical phenomena.\n\nBut, so far as Science knows, the Earth's action on the Moon is confined to the physical attraction, which causes her to circle in her orbit.\n\nAnd should an objector insist that this fact alone is sufficient evidence that the Moon is truly the Earth's satellite on other planes of action, one may reply by asking whether a mother, who walks round and round her child's cradle keeping watch over the infant, is the subordinate of her child or dependent upon it; though in one sense she is its satellite, yet she is certainly older and more fully developed than the child she watches.\n\nIt is, then, the Moon that plays the largest and most important part, as well in the formation of the Earth itself, as in the peopling thereof with human beings.\n\nThe \"Lunar Monads\" or Pitris, the ancestors of man, become in reality man himself.\n\nThey are the \"Monads\" who enter on the cycle of evolution on Globe A, and who, passing round the chain of planets, evolve the human form as has just been shown.\n\nAt the beginning of the human stage of the Fourth Round on this Globe, they \"ooze out\" their astral doubles from the \"ape-like\" forms which they had evolved in Round III.\n\nAnd it is this subtle, finer form, which serves as the model round which Nature builds physical man.\n\nThese \"Monads\" or \"divine sparks\" are thus the \"Lunar\" ancestors, the Pitris themselves.\n\nFor these \"Lunar Spirits\" have to become \"Men\" in order that their \"Monads\" may reach a higher plane of activity and self-consciousness, i.e.\n\n, the plane of the Manasa-Putras, those who [[Vol."


body = "He is Purusha (spirit), but he is also Prakriti (matter).\n\nTherefore it is only after separating himself into two halves -- Brahma-vach (the female) and Brahma-Viraj (the male), that the Prajapati becomes the male Brahma.\n\n------- STANZA III.\n\n-- Continued.\n\n9.\n\nL IGHT IS COLD FLAME, AND FLAME IS FIRE, AND THE FIRE PRODUCES HEAT, WHICH YIELDS WATER, THE WATER OF LIFE IN THE GREAT MOTHER ( Chaos ) ( a ) .\n\n( a ) It must be remembered that the words \"Light,\" \"Fire,\" and \"Flame\" used in the Stanzas have been adopted by the translators thereof from the vocabulary of the old \"Fire philosophers,\"** in order to render better the meaning of the archaic terms and symbols employed in the original.\n\nOtherwise they would have remained entirely unintelligible to a European reader.\n\nBut to a student of the Occult the terms used will be sufficiently clear.\n\nAll these -- \"Light,\" \"Flame,\" \"Hot,\" \"Cold,\" \"Fire,\" \"Heat,\" \"Water,\" and the \"water of life\" are all, on our plane, the progeny; or as a modern physicist would say, the correlations of ELECTRICITY.\n\nMighty word, and a still mightier symbol!\n\nSacred generator of a no less sacred progeny; of fire -- the creator, the preserver and the destroyer; of light -- the essence of our divine ancestors; of flame -- the Soul of things.\n\nElectricity, the ONE Life at the upper rung of Being, and Astral Fluid, the Athanor of the Alchemists, at its lowest; GOD and DEVIL, GOOD and EVIL.\n\n.\n\n.\n\n.\n\n[[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] rest, and may as well mean \"holy\" as not.\n\nIt is a blind, very suggestive in connection with certain superstitions -- e.g ., that of the Russian people who will not use the pigeon for food; not because it is \"unclean,\" but because the \"Holy Ghost\" is credited with having appeared under the form of a Dove.\n\n** Not the Mediaeval Alchemists, but the Magi and Fire-Worshippers, from whom the Rosicrucians or the Philosophers per ignem , the successors of the theurgists borrowed all their ideas concerning Fire, as a mystic and divine element.\n\n[[Vol.\n\n1, Page]] 82 THE SECRET DOCTRINE.\n\nNow, why is Light called in the Stanzas \"cold flame\"?\n\nBecause in the order of Cosmic evolution (as taught by the Occultist), the energy that actuates matter after its first formation into atoms is generated on our plane by Cosmic heat; and because Kosmos, in the sense of dissociated matter, was not, before that period.\n\nThe first primordial matter, eternal and coeval with Space, \"which has neither a beginning nor an end,\" is \"neither hot nor cold, but is of its own special nature,\" says the Commentary (Book II).\n\nHeat and cold are relative qualities and pertain to the realms of the manifested worlds, which all proceed from the manifested Hyle , which, in its absolutely latent aspect, is referred to as the \"cold Virgin,\" and when awakened to life, as the \"Mother.\" The ancient Western Cosmogonic myths state that at first there was but cold mist which was the Father, and the prolific slime (the Mother, Ilus or Hyle), from which crept forth the Mundane snake-matter, ( Isis, vol.\n\ni., p.\n\n146).\n\nPrimordial matter, then, before it emerges from the plane of the never-manifesting, and awakens to the thrill of action under the impulse of Fohat, is but \"a cool Radiance, colourless, formless, tasteless, and devoid of every quality and aspect.\" Even such are her first-born, the \"four sons,\" who \"are One, and become Seven,\" -- the entities, by whose qualifications and names the ancient Eastern Occultists called the four of the seven primal \"centres of Forces,\" or atoms, that develop later into the great Cosmic \"Elements,\" now divided into the seventy or so sub-elements, known to science.\n\nThe four primal natures of the first Dhyan Chohans, are the so-called (for want of better terms) \"Akasic,\" \"Ethereal,\" \"Watery,\" and \"Fiery,\" answering, in the terminology of practical occultism, to scientific definitions of gases, which, to convey a clear idea to both Occultists and laymen, must be defined as Parahydrogenic,* Paraoxygenic, Oxyhydrogenic, and Ozonic, or perhaps Nitr-ozonic; the latter forces or gases (in Occultism, supersensuous, yet atomic substances) being the most effective and active when energising on the plane of more grossly differentiated matter.** These are both electro-positive and electro-negative.\n\n[[Footnote(s)]] ------------------------------------------------- * [[ Para ]], \"beyond,\" outside.\n\n** Each of these and many more are probably the missing links of chemistry.\n\nThey are known by other names in Alchemy and to the Occultists who practise in phenomenal powers.\n\nIt is by combining and recombining in a certain way (or dissociating) the \"Elements\" by means of astral fire that the greatest phenomena are produced.\n\n[[Vol.\n\n1, Page]] 83 THE WEB OF BEING.\n\nSTANZA III.\n\n-- Continued.\n\n10.\n\nF ATHER- M OTHER SPIN A WEB WHOSE UPPER END IS FASTENED TO SPIRIT ( Purusha ) , THE LIGHT OF THE ONE DARKNESS, AND THE LOWER ONE TO MATTER ( Prakriti ) ITS ( the Spirit's ) SHADOWY END; AND THIS WEB IS THE UNIVERSE SPUN OUT OF THE TWO SUBSTANCES MADE IN ONE, WHICH IS SWABHAVAT ( a ).\n\n( a ) In the Mandukya (Mundaka) Upanishad it is written, \"As a spider throws out and retracts its web, as herbs spring up in the ground .\n\n.\n\n.\n\nso is the Universe derived from the undecaying one\" (I.\n\n1.\n\n7).\n\nBrahma, as \"the germ of unknown Darkness,\" is the material from which all evolves and develops \"as the web from the spider, as foam from the water,\" etc.\n\nThis is only graphic and true, if Brahma the \"Creator\" is, as a term, derived from the root brih, to increase or expand.\n\nBrahma \"expands\" and becomes the Universe woven out of his own substance.\n\nThe same idea has been beautifully expressed by Goethe, who says: \"Thus at the roaring loom of Time I ply, And weave for God the garment thou see'st Him by.\" ------- STANZA III.\n\n-- Continued.\n\n`.\n\nI T ( the Web ) EXPANDS WHEN THE BREATH OF FIRE ( the Father ) IS UPON IT; IT CONTRACTS WHEN THE BREATH OF THE MOTHER ( the root of Matter ) TOUCHES IT."


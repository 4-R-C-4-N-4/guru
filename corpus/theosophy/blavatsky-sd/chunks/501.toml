body = "de Cornouailles, sur les traces des giants, and of various learned works on the ruins of Stonehenge,* Carnac and West Hoadley, give far better and more reliable information upon this particular subject.\n\nIn those regions -- true forests of rocks -- immense monoliths are found, \"some weighing over 500,000 kilograms\" (Cambry).\n\nThese \"hinging stones\" of Salisbury Plain are believed to be the remains of a Druidical temple.\n\nBut the Druids were historical men and not Cyclopes, nor giants.\n\nWho then, if not giants, could ever raise such masses (especially those at Carnac and West Hoadley), range them in such symmetrical order that they should represent the planisphere, and place them in such wonderful equipoise that they seem to hardly touch the ground, are set in motion at the slightest touch of the finger, and would yet resist the efforts of twenty men who should attempt to displace them.\n\nWe say, that most of these stones are the relics of the last Atlanteans.\n\nWe shall be answered that all the geologists claim them to be of a natural origin.\n\nThat, a rock when \"weathering,\" i.e.\n\n, losing flake after flake of its substance under influence of weather, assumes this form.\n\nThat, the \"tors\" in West England exhibit curious forms, also produced by this cause.\n\nThat, finally, as all scientists consider the \"rocking stones to be of purely natural origin, wind, rain, etc., causing disintegration of rocks in layers\" -- our statement will be justly denied, especially as \" we see this process of rock-modification in progress around us to-day.\" Let us examine the case.\n\nBut read what Geology has to say, and you will learn that often these gigantic masses do not even belong to the countries wherein they are now fixed; that their geological congeners often pertain to strata unknown in those regions and to be found only far beyond the seas.\n\nMr.\n\nWilliam Tooke ( French trans., Sepulture des Tartares.\n\nArch.\n\nVII, p.\n\n222), speculating upon the enormous blocks of granite which are strewn over Southern Russia and Siberia, tells the reader that there, where they now rest, there are neither rocks nor mountains; and that they must have been brought over \"from immense distances and with prodigious efforts.\" Charton ( Voyageurs Anciens et Modernes, Vol.\n\nI., p.\n\n230) speaks of a specimen of such rock \"from Ireland,\" which had been submitted to the analysis of an eminent English geologist, who assigned to it a foreign origin, \" most probably African.\n\n\" This is a strange coincidence, as Irish tradition attributes the origin of her circular stones to a Sorcerer who brought them from Africa.\n\nDe Mirville sees in that sorcerer \"an accursed Hamite.\n\n\" We see in him a [[Footnote(s)]] ------------------------------------------------- * See, among others, \" History of Paganism in Caledonia, \" by Dr.\n\nTh.\n\nA.\n\nWise, F.R.A.S.\n\n, etc.\n\n** Ham was no more a Titan or Giant than Shem and Japhet.\n\nThey are either all Arkite Titans, as Faber shows them, or myths.\n\n[[Vol.\n\n2, Page]] 344 THE SECRET DOCTRINE dark Atlantean, or perhaps even some earlier Lemurian, who had survived till the birth of the British Islands -- G IANTS in every and any case.* \"Men,\" says Cambry, naively, \"have nothing to do with it .\n\n.\n\n.\n\nfor never could human power and industry undertake anything of this kind.\n\nNature alone has accomplished it all (!!) and Science will demonstrate it some day\" (!!) (p.\n\n88).\n\nNevertheless, it is a human , though gigantic power, which has accomplished it, and no more \"nature\" alone than god or devil.\n\n\"Science,\" having undertaken to demonstrate that even the mind and Spirit of man are simply the production of blind forces, is quite capable of accepting the task.\n\nIt may come out some fine morning, and seek to prove that nature alone has marshalled the gigantic rocks of Stonehenge, traced their position with mathematical precision, given them the form of the Dendera planisphere and of the signs of the Zodiac, and brought stones weighing over one million of pounds flying from Africa and Asia to England and Ireland!\n\nIt is true that Cambry recanted later on.\n\n\"I had believed for a long time,\" he says, \"that Nature alone could produce those wonders .\n\n.\n\n.\n\n.\n\nbut I recant .\n\n.\n\n.\n\n.\n\nchance is unable to create such marvellous combinations .\n\n.\n\n.\n\n.\n\nand those who placed the said rocks in equipoise, are the same who have raised the moving masses of the pond of Huelgoat, near Concarneau.\n\n.\n\n.\n\n.\n\n.\" Dr.\n\nJohn Watson, quoted by the same author \" Antiquites Celtiques ,\" p.\n\n99, says, when speaking of the moving rocks, or Rocking-Stones situated on the slope of Golcar (the \"Enchanter\"): \"The astonishing movement of those masses poised in equilibrium made the Celts compare them to gods.\" .\n\n.\n\n.\n\n.\n\nIn \"Stonehenge\" (Flinders Petrie) it is said that \"Stonehenge is built of the stone of the district, a red sandstone, or 'sarsen' stone, locally called 'grey wethers.' But some of the stones, especially those which are said to have been devoted to astronomical purposes, have been brought from a distance, probably the North of Ireland.\" To close, the reflections of a man of Science, in an article upon the subject published in 1850 in the Revue Archeologique ( p.\n\n473), are worthy of being quoted.\n\nSays the paper, concerning the rocking stones: -- \"Every stone is a block whose weight would try the most powerful machines.\n\nThere are, in a word, scattered throughout the globe, masses, before which the word materials seems to remain inexplicable, at the sight of which imagination is confounded, and that had to be endowed with a name as colossal as the [[Footnote(s)]] ------------------------------------------------- * Diodorus Siculus asserts that in the days of Isis, all men were of a vast stature, who were denominated by the Hellenes Giants.\n\n[Gk chars] \"[ Oi d ' en Aiguptoi muthologousi kata ten Isidos helikian gegonenai tinas polusomatous].\n\n\" [[Vol.\n\n2, Page]] 345 LIVING, SPEAKING, AND MOVING STONES.\n\nthings themselves.\n\nBesides which, these immense rocking stones, called sometimes routers -- placed upright on one of their sides as on a point, their equipoise being so perfect that the slightest touch is sufficient to set them in motion .\n\n.\n\n.\n\nbetray a most positive knowledge of statics.\n\nReciprocal counter-motion, surfaces, plane, convex and concave, in turn .\n\n.\n\n."


[content]
body = "The episode brings on a battle between the gods and the Asuras: King Soma, finds allies in Usanas (Venus), the leader of the Danavas; and the gods are led by Indra and Rudra, who side with Brihaspati.\n\nThe latter is helped by Sankara (Siva), who, having had for his guru Brihaspati's father, Angiras, befriends his son.\n\nIndra is here the Indian prototype of Michael, the Archistrategus and the slayer of the \"Dragon's\" angels -- since one of his names is Jishnu \"leader of the (celestial) Host.\" Both fight, as some Titans did against other Titans in defence of revengeful gods, one -- of Jupiter tonans (in India, Brihaspati is the planet Jupiter, which is a curious coincidence); the other, in support of the ever-thundering Rudra Sankara.\n\nDuring this war, he is deserted by his body-guard, the storm-gods (Maruts).\n\nThe story is very suggestive in some of its details.\n\nLet us examine some of them, and seek to discover their meaning.\n\nThe presiding genius, or \"regent\" of the planet Jupiter is Brihaspati, the wronged husband.\n\nHe is the instructor or spiritual guru of the gods, who are the representatives of the procreative powers.\n\nIn the Rig Veda, he is called Brahmanaspati, a name meaning \"the deity in whom the action of the worshipped upon the gods is personified.\" Hence Brahmanaspati represents the materialization of the divine grace, so to say, by means of ritual and ceremonies, or the exoteric worship.\n\n\" T ARA\"* -- his wife -- is on the other hand the personification of the powers of one initiated into Gupta Vidya (secret knowledge), as will be shown.\n\nS OMA is the moon astronomically; but in mystical phraseology, it is also the name of the sacred beverage drunk by the Brahmins and the Initiates during their mysteries and sacrificial rites.\n\nThe \"Soma\" plant is the asclepias acida, which yields a juice from which that mystic beverage, [[Footnote(s)]] ------------------------------------------------- * See Dowson's Classical Dictionary.\n\n[[Vol.\n\n2, Page]] 499 ALLEGORIES ON THE \"WAR IN HEAVEN.\" the Soma drink, is made.\n\nAlone the descendants of the Rishis, the Agnihotri (the fire priests) of the great mysteries knew all its powers.\n\nBut the real property of the true Soma was (and is ) to make a new man of the Initiate, after he is reborn, namely once that he begins to live in his astral body (See \"The Elixir of Life\"*); for, his spiritual nature overcoming the physical, he would soon snap it off and part even from that etherealized form.** Soma was never given in days of old to the non-initiated Brahman -- the simple Grihasta, or priest of the exoteric ritual.\n\nThus Brihaspati -- \"guru of the gods\" though he was -- still represented the dead-letter form of worship.\n\nIt is Tara his wife -- the symbol of one who, though wedded to dogmatic worship, longs for true wisdom -- who is shown as initiated into his mysteries by King Soma, the giver of that Wisdom.\n\nSoma is thus made in the allegory to carry her away.\n\nThe result of this is the birth of Budha -- esoteric Wisdom -- (Mercury, or Hermes in Greece and Egypt).\n\nHe is represented as \"so beautiful,\" that even the husband, though well aware that Budha is not the progeny of his dead-letter worship -- claims the \"new-born\" as his Son, the fruit of his ritualistic and meaningless forms.*** Such is, in brief, one of the meanings of the allegory.\n\nWar in Heaven refers to several events of that kind on various and different planes of being.\n\nThe first is a purely astronomical and cosmical fact pertaining to cosmogony.\n\nMr.\n\nJohn Bentley thought that with the Hindus war in Heaven is only a figure referring to their calculations of time periods (see Bentley's Hindu Astronomy ) .* *** [[Footnote(s)]] ------------------------------------------------- * See \"Five Years of Theosophy.\" ** The partaker of Soma finds himself both linked to his external body, and yet away from it in his spiritual form.\n\nThe latter, freed from the former, soars for the time being in the ethereal higher regions, becoming virtually \"as one of the gods,\" and yet preserving in his physical brain the memory of what he sees and learns.\n\nPlainly speaking, Soma is the fruit of the Tree of Knowledge forbidden by the jealous Elohim to Adam and Eve or Yah-ve , \"lest Man should become as one of us.\" *** We see the same in the modern exoteric religions.\n\n**** \"Historical Views of Hindu Astronomy.\n\n\" Quoting from the work in reference to Aryachatta, who is said to give a near approach to the true relation among the various values for the computations of the value of [[ pi ]], the author of the \"Source of Measures\" reproduces a curious statement.\n\nMr.\n\nBentley, it is said, \"was greatly familiar with the Hindu astronomical and mathematical knowledge .\n\n.\n\n.\n\nthis statement of his then may be taken as authentic: the same remarkable trait, among so many Eastern and ancient nations of sedulously concealing the arcana of this kind of knowledge, is a marked one among the Hindus.\n\nThat which was given out to be popularly taught and to be exposed to public inspection, was but the approximate of a more exact but hidden knowledge.\n\nAnd this very formulation of Mr.\n\nBentley will strangely exemplify the assertion; and explained, will show that it (the Hindu exoteric astronomy and sciences) was derived from a system exact beyond the European one, in which Mr.\n\nBentley himself, of [[footnote continued on following page]] [[Vol.\n\n2, Page]] 500 THE SECRET DOCTRINE.\n\nThis served as a prototype, he thinks, for the Western nations to build their war of the Titans upon.\n\nThe author is not quite wrong, but neither is he quite right.\n\nIf the sidereal prototype refers indeed to a pre -manvantaric period, and rests entirely on the Knowledge claimed by the Aryan Initiates of the whole programme and progress of cosmogony,* the war of the Titans is but a legendary and deified copy of the real war that took place in the Himalayan Kailasa (heaven) instead of in the depths of Cosmic interplanetary Space.\n\nIt is the record of the terrible strife between the \"Sons of God\" and the \"Sons of the Shadow\" of the Fourth and the Fifth Races.\n\nIt is on these two events, blended together by legends borrowed from the exoteric account of the war waged by the Asuras against the gods, that every subsequent national tradition on the subject has been built.\n\nEsoterically, the Asuras, transformed subsequently into evil Spirits and lower gods, who are eternally at war with the great deities -- are the gods of the Secret Wisdom."


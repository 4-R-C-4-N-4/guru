body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n2 [[Vol.\n\n2, Page]] 675 DRYOPITHECUS, THE MISSING LINK.\n\n§ III.\n\nTHE FOSSIL RELICS OF MAN AND THE ANTHROPOID APE.\n\n------- A .\n\nG EOLOGICAL F ACTS BEARING ON THE Q UESTION OF THEIR R ELATIONSHIP.\n\nT HE data derived from scientific research as to \"primeval man\" and the ape lend no countenance to theories deriving the former from the latter.\n\n\"Where, then, must we look for primeval man?\" still queries Mr.\n\nHuxley, after having vainly searched for him in the very depths of the quaternary strata.\n\n\"Was the oldest Homo sapiens Pliocene or Miocene, or yet more ancient?\n\nIn still older strata do the fossilized bones of an ape more anthropoid, or a man more pithecoid than any yet known, await the researches of some unborn palaeontologist?\n\nTime will show .\n\n.\n\n.\n\n.\" (\"Man's Place in Nature,\" p.\n\n159).\n\nIt will -- undeniably -- and thus vindicate the anthropology of the Occultists.\n\nMeanwhile, in his eagerness to vindicate Mr.\n\nDarwin's Descent of Man, Mr.\n\nBoyd Dawkins believes he has all but found the \"missing link\" -- in theory.\n\nIt was due to theologians more than to geologists that, till nearly 1860, man had been considered a relic no older than the Adamic orthodox 6,000 years.\n\nAs Karma would have it though, it was left to a French Abbe -- l'abbe Bourgeois -- to give this easy-going theory even a worse blow than had been given to it by the discoveries of Boucher de Perthes.\n\nEveryone knows that the Abbe discovered and brought to light good evidence that man already existed during the Miocene period; for flints of undeniably human making were excavated from Miocene strata.\n\nIn the words of the author of \"Modern Science and Modern Thought\": -- \"They must either have been chipped by man, or, as Mr.\n\nBoyd Dawkins supposes, by the Dryopithecus or some other anthropoid ape which had a dose of intelligence so much superior to the gorilla, or chimpanzee, as to be able to fabricate tools.\n\nBut in this case the problem would be solved and the missing link discovered, for such an ape might well have been the ancestor of Palaeolithic man.\" Or -- the descendant of Eocene Man, which is a variant offered to the theory.\n\nMeanwhile, the Dryopithecus with such fine mental endowments is yet to be discovered.\n\nOn the other hand, Neolithic and even Palaeolithic man having become an absolute certainty, -- and, as the same author justly observes: \"If 100,000,000 years have elapsed since [[Vol.\n\n2, Page]] 676 THE SECRET DOCTRINE.\n\nthe earth became sufficiently solidified to support vegetable and animal life, the Tertiary period may have lasted for 5,000,000; or for 10,000,000 years, if the life-sustaining order of things has lasted, as Lyell supposes, for at least 200,000,000 years\" -- why should not another theory be tried?\n\nLet us carry man, as an hypothesis, to the close of Mesozoic times -- admitting argumenti causa that the (much more recent) higher apes then existed!\n\nThis would allow ample time to man and the modern apes to have diverged from the mythical \" ape more anthropoid, \" and even for the latter to have degenerated into those that are found mimicking man in using \"branches of trees as clubs, and cracking cocoa-nuts with hammer and stones.\"* Some savage tribes of hillmen in India build their abodes on trees, just as the gorillas build their dens.\n\nThe question, which of the two, the beast or the man, has become the imitator of the other, is scarcely an open one, even granting Mr.\n\nBoyd Dawkins' theory.\n\nThe fanciful character of his hypothesis, is, however, generally admitted.\n\nIt is argued that while in the Pliocene and Miocene periods there were true apes and baboons, and man was undeniably contemporaneous with the former of those times -- though as we see orthodox anthropology still hesitates in the teeth of facts to place him in the era of the Dryopithecus, which latter \"has been considered by some anatomists as in some respects superior to the chimpanzee or the gorilla\" -- yet, in the Eocene there have been no other fossil primates unearthed and no pithecoid stocks found save a few extinct lemurian forms.\n\nAnd we find it also hinted that the Dryopithecus may have been the \"missing link,\" though the brain of the creature no more warrants the theory than does the brain of the modern gorilla.\n\n( Vide also Gaudry's speculations.) Now we would ask who among the Scientists is ready to prove that there was no man in existence in the early Tertiary period?\n\nWhat is it that prevented his presence?\n\nHardly thirty years ago his existence any farther back than 6, or 7,000 years was indignantly denied.\n\nNow he is refused admission into the Eocene age.\n\nNext century it may become a question whether man was not contemporary with the \"flying Dragons;\" the pterodactyl, the plesiosaurus and iguanodon, etc., etc.\n\nLet us listen, however, to the echo of Science.\n\n[[Footnote(s)]] ------------------------------------------------- * This the way primitive man must have acted?\n\nWe do not know of men, not even of savages, in our age, who are known to have imitated the apes who live side by side with them in the forests of America and the islands.\n\nWe do know of large apes who, tamed and living in houses, will mimic men to the length of donning hats and coats.\n\nThe writer had personally a chimpanzee who, without being taught, opened a newspaper and pretended to read in it.\n\nIt is the descending generations, the children, who mimic their parents -- not the reverse.\n\n[[Vol.\n\n2, Page]] 677 INSURMOUNTABLE DIFFICULTIES.\n\n\"Now wherever anthropoid apes lived, it is clear that, whether as a question of anatomical structure, or of climate and surroundings, man, or some creature which was the ancestor of man, might have lived also.\n\nAnatomically speaking, apes and monkeys are as much special variations of the mammalian type as man, whom they resemble, bone for bone, and muscle for muscle, and the physical animal man is simply an instance of the quadrumanous type specialised for erect posture and a larger brain* .\n\n.\n\n.\n\n.\n\nIf he could survive, as we know he did, the adverse conditions and extreme vicissitudes of the Glacial period, there is no reason why he might not have lived in the semi-tropical climate of the Miocene period, when a genial climate extended even to Greenland and Spitzbergen .\n\n.\n\n."


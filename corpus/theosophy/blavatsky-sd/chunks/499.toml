body = "Talbot, who has made the most careful examination, found that this drapery belonged to a far later epoch.\n\nThe statue itself has therefore to be assigned to a far earlier period than Buddhism.\n\nWhom does it represent in such case, it may be asked?\n\nOnce more tradition, corroborated by written records, answers the query, and explains the mystery.\n\nThe Buddhist Arhats and Ascetics found the five statues, and many more, now crumbled down to dust, and as the three were found by them in colossal niches at the entrance of their future abode, they covered the figures with plaster, and, over the old, modelled new statues made to represent Lord Tathagata.\n\nThe interior walls of the niches are covered to this day with bright paintings of human figures, and the sacred image of Buddha is repeated in every group.\n\nThese frescoes and ornaments -- which remind one of the Byzantine style of painting -- are all due to the piety of the monk-ascetics, like some other minor figures and rock-cut ornamentations.\n\nBut the five statues belong to the handiwork of the Initiates of the Fourth Race, who sought refuge, after the submersion of their continent, in the fastnesses and on the summits of the Central Asian mountain chains.\n\nMoreover, the five statues are an imperishable record of the esoteric teaching about the gradual evolution of the races.\n\nThe largest is made to represent the First Race of mankind, its ethereal body being commemorated in hard, everlasting stone, for the instruction of future generations, as its remembrance would otherwise never have [[Vol.\n\n2, Page]] 340 THE SECRET DOCTRINE.\n\nsurvived the Atlantean Deluge.\n\nThe second -- 120 feet high -- represents the sweat-born; and the third -- measuring 60 feet -- immortalizes the race that fell, and thereby inaugurated the first physical race, born of father and mother, the last descendants of which are represented in the Statues found on Easter Isle; but they were only from 20 to 25 feet in stature at the epoch when Lemuria was submerged, after it had been nearly destroyed by volcanic fires.\n\nThe Fourth Race was still smaller, though gigantic in comparison with our present Fifth Race, and the series culminated finally in the latter.\n\n(See the following sub-section on \"Cyclopean Ruins, and Colossal Stones as Witnesses to Giants.\") These are, then, the \"Giants\" of antiquity, the ante- and post-diluvian Gibborim of the Bible.\n\nThey lived and flourished one million rather than between three and four thousand years ago.\n\nThe Anakim of Joshua, whose hosts were as \"grasshoppers\" in comparison with them, are thus a piece of Israelite fancy, unless indeed the people of Israel claim for Joshua an antiquity and origin in the Eocene, or at any rate in the Miocene age, and change the millenniums of their chronology into millions of years.\n\nIn everything that pertains to prehistoric times the reader ought to bear the wise words of Montaigne in his mind.\n\nSaith the great French philosopher: -- \" .\n\n.\n\n.\n\nIt is a sottish presumption to disdaine and condemne that for false, which unto us seemeth to beare no show of likelihood or truth: which is an ordinarie fault in those who persuade themselves to be of more sufficiencie than the vulgar sort.\n\n\" .\n\n.\n\n.\n\nBut reason hath taught me, that so resolutely to condemne a thing for false and impossible, is to assume unto himself the advantage to have the bounds and limits of God's will, and the power of our common Mother Nature tied to his sleeve, and that there is no greater folly in the world than to reduce them to the measure of our capacitie and bounds of our sufficiencie.\n\n\"If we term those things monsters or miracles to which our reason cannot attain, how many doe such daily present themselves unto our sight?\n\nLet us consider through what cloudes, and how blinde-folde we are led to the knowledge of most things that passe our hands; verily we shall finde it is rather custome than Science that receiveth, the strangenesse of them from us: and that those things, were they newly presented unto us, wee should doubtless deeme them as much or more unlikely and incredible than any other.\" ( Essays, chap.\n\nxxvi.) A fair-minded scholar should, before denying the possibility of our history and records, search modern History, as well as the universal traditions scattered throughout ancient and modern literature, for traces left by these marvellous early races.\n\nFew among the unbelievers suspect the wealth of corroborative evidence which is found scattered about and buried even in the British Museum alone.\n\nThe [[Vol.\n\n2, Page]] 341 THE MATERIALISM OF THE BIBLE.\n\nreader is asked to throw one more glance at the subject-matte r treated of in the chapter which follows: -- ------- [[This page continued in next section]]"


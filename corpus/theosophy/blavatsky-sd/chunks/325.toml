body = "Besides, there is a remarkable peculiarity about this fact; the same error or difference being found in the positions of both stars; therefore the error was due to some cause affecting both stars equally.\n\nIt was to explain this peculiarity that the Arab Thebith imagined the stars to have an oscillatory movement, causing them to advance and recede alternately.\n\nThis hypothesis was easily disproved; but the observations attributed to Hermes remained unexplained.\n\nTheir explanation, however, is found in Hindu Astronomy.\n\nAt the date fixed for these observations, 1985 years before Ptolemy, the first point of the Hindu Zodiac was 35 degrees in advance of the equinox; therefore the longitudes reckoned for this point are 35 degrees in excess of those reckoned from the equinox.\n\nBut after the lapse of 1985 years the stars would have advanced 28 degrees, and there would remain a difference of only 7 degrees between the longitudes of Hermes and those of Ptolemy, and the difference would be the same for the two stars, since it is due to the difference between the starting-points of the Hindu Zodiac and that of Ptolemy, which reckons from the equinox.\n\nThis explanation is so simple and natural that it must be true.\n\nWe do not know whether Hermes, so celebrated in antiquity, was a Hindu, but we see that the observations attributed to him are reckoned in the Hindu manner, and we conclude that they were made by the Hindus, who, therefore, were able to make all the observations we have enumerated, and which we find noted in their tables.\n\n6th.\n\nThe observation of the year 3102, which seems to have fixed their epoch, was not a difficult one.\n\nWe see that the Hindus, having once determined the moon's daily motion of 13deg.\n\n10m.\n\n35sec., made [[Vol.\n\n1, Page]] 665 HINDU ASTRONOMICAL METHODS.\n\nuse of it to divide the Zodiac into 27 constellations, related to the period of the moon, which takes about 27 days to describe it.\n\nIt was by this method that they determined the positions of the stars in this Zodiac; it was thus they found that a certain star of the Lyre was in 8h.\n\n24m., the Heart of the Hydra in 4d.\n\n7h., longitudes which are ascribed to Hermes, but which are calculated on the Hindu Zodiac.\n\nSimilarly, they discovered that the \"Wheatear of Virgo\" forms the commencement of their fifteenth constellation, and the \"Eye of Taurus\" the end of the fourth; these stars being the one in 6d.\n\n6h.\n\n40m., the other in 1d.\n\n23h.\n\n20min.\n\nof the Hindu Zodiac.\n\nThis being so, the eclipse of Moon which occurred 14 days after the Kali Yug epoch, took place at a point between the \"Wheat Ear\" of Virgo and the star [[ ]] of the same constellation.\n\nThese stars are very approximately a constellation apart, the one beginning the fifteenth, the other the sixteenth.\n\nThus it would not be difficult to determine the moon's place by measuring her distance from one of these stars; from this they deduced the position of the sun, which is opposite to the moon, and then, knowing their average motions, they calculated that the moon was at the first point of the Zodiac according to her average longitude at midnight on the 17th-18th February of the year 3,102 before our era, and that the sun occupied the same place six hours later according to his true longitude; an event which fixes the commencement of the Hindu year.\n\n7th.\n\nThe Hindus state that 20,400 years before the age of Kali Yug, the first point of their Zodiac coincided with the vernal equinox, and that the sun and moon were in conjunction there.\n\nThis epoch is obviously fictitious;* but we may inquire from what point, from what epoch, the Hindus set out in establishing it.\n\nTaking the Hindu values for the revolution of the sun and moon, viz., 365d.\n\n6h.\n\n12m.\n\n30s., and 27d.\n\n7h.\n\n43m.\n\n13s., we have -- 20,400 revolutions of the sun = 7,451,277d.\n\n2h.\n\n272,724 revolutions of the moon = 7,451,277d.\n\n7h.\n\nSuch is the result obtained by starting from the Kali Yuga epoch; and the assertion of the Hindus, that there was a conjunction at the time stated, is founded on their tables; but if, using the same elements, we start from the era of the year 1491, or from another placed in the year 1282, of which we shall speak later, there will always be a difference of almost one or two days.\n\nIt is both just and natural, in verifying the Hindu calculations, to take those among their elements which give the same result as they had themselves arrived at, and to set out from that one among their epochs which enables us to arrive at [[Footnote(s)]] ------------------------------------------------- * Why it should be \"fictitious\" can never be made plain by European scientists.\n\n[[Vol.\n\n1, Page]] 666 THE SECRET DOCTRINE.\n\nthe fictitious epoch in question.\n\nHence, since to make this calculation they must have set out from their real epoch, the one which was founded on an observation and not from any of those which were derived by this very calculation from the former, it follows that their real epoch was that of the year 3102 before our era.\n\n8th.\n\nThe Tiravalore Brahmins give the Moon's motion as 7d.\n\n2h.\n\n8m.\n\non the movable Zodiac, and as 9d.\n\n7h.\n\n45m.\n\n1s.\n\nas referred to the equinox in a great period of 1,600,984 days, or 4,386 years and 94 days.\n\nWe believe this motion to have been determined by observation; and we must state at the outset that this period is of an extent which renders it but ill suited to the calculation of the mean motions.\n\nIn their astronomical calculations the Hindus make use of periods of 248, 3,031, and 12,372 days; but, apart from the fact that these periods, though much too short, do not present the inconvenience of the former, they contain an exact number of revolutions of the moon referred to its apogee.\n\nThey are in reality mean motions.\n\nThe great period of 1,600,984 is not a sum of accumulated revolutions; there is no reason why it should contain 1,600,984 rather than 1,600,985 days.\n\nIt would seem that observation alone must have fixed the number of days and marked the beginning and end of the period.\n\nThis period ends on the 21st of May, 1282, of our era at 5h.\n\n15m.\n\n30s.\n\nat Benares.\n\nThe moon was then in apogee, according to the Hindus, and her longitude was ...\n\n7d.\n\n13h.\n\n45m.\n\n1s.\n\nMaier gives the longitude as ...\n\n7d.\n\n13h.\n\n53m.\n\n48s."


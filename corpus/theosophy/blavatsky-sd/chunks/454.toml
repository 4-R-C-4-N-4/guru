[content]
body = "The cycles that intervened since then, have already carried us onward, on the opposite ascending arc, some steps toward our dematerialization, as the spiritualists would say.\n\nThe Earth, ourselves, and all things have softened since then -- aye, even our brains.\n\nBut it has been objected by some theosophists that an ethereal Earth even some 15, or 20,000,000 years ago, does not square with Geology, which teaches us that winds blew, rains fell, waves broke on the shore, sands shifted and accumulated, [[Footnote(s)]] ------------------------------------------------- * It must be remembered that the \"last remnants\" here spoken of, refer to those portions of the \"great continent\" which still remained, and not to any of the numerous islands which existed contemporaneously with the continent.\n\nPlato's \"island\" was, for instance, one of such remnants; the others having sunk at various periods previously.\n\nAn occult \"tradition\" teaches that such submersions occur whenever there is an eclipse of the \"spiritual sun.\" [[Vol.\n\n2, Page]] 251 ANSWERS TO OBJECTIONS.\n\netc., etc., that, in short, all natural causes now in operation were then in force, \" in the very earliest ages of geological time, aye, that of the oldest palaeozoic rocks.\" To this the following answers are given.\n\nFirstly, what is the date assigned by geology to those \"oldest palaezoic rocks\"?\n\nAnd secondly, why could not the winds blow, rain fall, and waves (of carbonic acid apparently, as science seems to imply) break on the shore, on an Earth semi-astral, i.e ., viscid?\n\nThe word \"astral\" does not necessarily mean as thin as smoke, in occult phraseology, but rather \"starry,\" shining or pellucid, in various and numerous degrees, from a quite filmy to a viscid state, as just observed.\n\nBut it is further objected: How could an astral Earth have affected the other planets in this system?\n\nWould not the whole process get out of gear now if the attraction of one planet was suddenly removed?\n\nThe objection is evidently invalid, since our system is composed of older and younger planets, some dead (like the moon), others in process of formation, for all astronomy knows to the contrary.\n\nNor has the latter ever affirmed, so far as we know, that all the bodies of our system have sprung into existence and developed simultaneously.\n\nThe Cis-Himalayan secret teachings differ from those of India in this respect.\n\nHindu Occultism teaches that the Vaivasvata Manu Humanity is eighteen million and odd years old.\n\nWe say, yes; but only so far as physical, or approximately physical, man is concerned, who dates from the close of the Third Root-Race.\n\nBeyond that period MAN, or his filmy image, may have existed for 300 million years, for all we know; since we are not taught figures which are and will remain secret with the Masters of Occult Science, as justly stated in \"Esoteric Buddhism.\" Moreover, whereas the Hindu Puranas speak of one Vaivasvata Manu, we affirm that there were several, the name being a generic one.\n\n( Vide supra ) .\n\nWe must now say a few more words on the physical evolution of man.\n\n------- [[This page continued in next section]]"


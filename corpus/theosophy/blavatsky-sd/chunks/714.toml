body = "But as it is now the conviction of more than one Greek scholar -- as it was that of Bailly and Voltaire -- that Hesiod's theogony was based upon historical facts ( see Decharme ' s Mythol.\n\nde la Grece Antique ) , it becomes easier for the occult teachings to find their way into the minds of thoughtful men, and therefore are these passages from mythology brought forward in our discussion upon modern learning in this Addendum.\n\nSuch symbolisms as are found in all the exoteric creeds, are so many landmarks of prehistoric truths.\n\nThe sunny, happy land, the primitive cradle of the earliest human races, has become several times since then hyperborean and Saturnine*; thus showing the Golden Age and reign of Saturn from multiform aspects.\n\nIt was many-sided in its character indeed -- climatically, ethnologically and morally.\n\nFor, the Third, Lemurian Race must be physiologically divided into the early androgynous and the later bi-sexual race; and the climate of its dwelling places and continents into that of an eternal spring and eternal winter, into life and death, purity and impurity.\n\nThe Cycle of legends is ever being transformed on its journey by popular fancy.\n\nYet it may be cleansed from the dross it has picked up on its way through many nations and through the countless minds which have added their own exuberant additions to the original facts.\n\nLeaving for a while the Greek interpretations we may seek for some more corroborations of the latter in the scientific and geological proofs.\n\n[[Footnote(s)]] ------------------------------------------------- * Denis, the geographer, tells us that the great sea North of Asia was called glacial, or Saturnine ( v.\n\n35).\n\nOrpheus ( v .\n\n1077) and Pliny ( Book IV., c.\n\n16) corroborate the statement by showing that it is its giant inhabitants who gave it the name.\n\nAnd the Secret Doctrine explains both assertions by telling us that all the continents were formed from North to South; and that as the sudden change of climate dwarfed the race that had been born on it, arresting its growth, so, several degrees southward, various conditions had always produced the tallest men in every new humanity, or race.\n\nWe see it to this day.\n\nThe tallest men now found are those in Northern countries, while the smallest are Southern Asiatics, Hindus, Chinamen, Japanese, etc.\n\nCompare the tall Sikhs and Punjabees, the Afghans, Norwegians, Russians, Northern Germans, Scotchmen, and the English, with the inhabitants of central India and the average European on the continent.\n\nThus also the giants of Atlantis, and hence the Titans of Hesiod, are all Northerners.\n\n-------"


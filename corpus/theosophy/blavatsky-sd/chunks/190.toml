[content]
body = "Lunar magnetism generates life, preserves and destroys it, psychically as well as physically.\n\nAnd if, astronomically, she is one of the seven planets of the ancient world, in theogony she is one of the regents thereof; with Christians now as much as with Pagans, the former referring to her under the name of one of their archangels, and the latter under that of one of their gods.\n\nTherefore the meaning of the \"fairy tale\" translated by Chwolson from an old Chaldean MSS.\n\ntranslated into Arabic, about Qu-tamy being instructed by the idol of the moon, is easily understood ( vide Book III.) Seldenus tells us the secret as well as Maimonides ( More Nevochim , Book III., ch.\n\nxxx).\n\nThe worshippers of the Teraphim (the Jewish Oracles) \"carved images and claimed that the light of the principal stars (planets) permeating these through and through, the angelic V IRTUES (or the regents of the stars and planets) conversed with them, teaching them many most useful things and arts.\" And Seldenus explains that the Teraphim were built and composed after the position of certain planets, those which the Greeks called [[ stoicheia ]], and according to figures that were located in the sky and called [[ alexeteroi ]], or the tutelary gods .\n\nThose who traced out the [[ stoicheia ]] were called [[ stoicheiomatichoi ]], or the diviners by the [[ stoicheia ]] .\n\n( De Diis Syriis , Teraph , II.\n\nSynt.\n\np.\n\n31) vide infra , the Teraphim.\n\nIt is such sentences, however, in the \"Nabathean agriculture,\" that [[Vol.\n\n1, Page]] 395 SOLAR-LUNAR WORSHIP IN THE CHURCH.\n\nhave frightened the men of science and made them proclaim the work \"either an apocrypha or a fairy tale, unworthy of the notice of an Academician.\" At the same time, as shown, zealous Roman Catholics and Protestants tore it metaphorically to pieces; the former because \"it described the worship of demons,\" the latter because it is \"ungodly.\" They are all wrong, once more.\n\nIt is not a fairy tale; and as far as regards pious Churchmen, the same worship may be shown in the Scriptures, however disfigured by translation.\n\nSolar and Lunar worship, as well as that of the Stars and Elements, are traced, and figure in the Christian theology; defended by Papists, they are stoutly denied by the Protestants only at their own risk and peril.\n\nTwo instances may be given.\n\nAmmianus Marcellinus teaches that ancient divinations were always accomplished with the help of the Spirits of the Elements, \" Spiritus elementorum , and in Greek [[ pneumata ton stoicheion ]]\" (1.\n\nI., 21).\n\nBut it is found now that the planets, the Elements, and the Zodiac, were figured not only in Heliopolis by the twelve stones called \"mysteries of the elements,\" elementorum arcana , but also in Solomon's temple, and, as pointed out by various writers, in several old Italian churches and even at Notre Dame de Paris where they can be seen to this day.\n\nNo symbol -- the sun included -- was more complex in its manifold meanings than the lunar symbol.\n\nThe sex was, of course, dual.\n\nWith some it was male, e.g ., the Hindu \"King Soma,\" and the Chaldean Sin; with other nations it was female, the beauteous goddesses Diana-Luna, I'lythia, Lucina.\n\nIn Tauris, human victims were sacrificed to Artemis, a form of the lunar goddess; the Cretans called her Dictynna, and the Medes and Persians Anaitis, as shown by an inscription of Koloe: '[[ Artemidi ' Anaeiti ]].\n\nBut, we are now concerned chiefly with the most chaste and pure of the virgin goddesses, Luna-Artemis, to whom Pamphos was the first to give the surname of [[ Kalliste ]], and of whom Hippolitus wrote: [[ Kallista polu parthenon ]].\n\n(See Pausanias viii., 35, 8.) This Artemis-Lochia, the goddess that presided at conception and child-birth (Iliad, Pausanias, etc., etc.), is, in her functions and as the triple Hecate, the Orphic deity, the predecessor of the God of the Rabbins and pre-Christian Kabalists, and his lunar type.\n\nThe goddess [[ Trimorphos ]] was the personified symbol of the various and successive aspects represented by the moon in each of her three phases; and this interpretation was already that of the Stoics (Cornut.\n\nDe Nat , D.\n\n34, 1), while the Orpheans explained the epithet ([[ Trimorphos ]]) by the three kingdoms of nature over which she reigned.\n\njealous, blood-thirsty, revengeful and exacting, Hecate-Luna is a worthy counterpart of the \"Jealous God\" of the Hebrew prophets.\n\n[[Vol.\n\n1, Page]] 396 THE SECRET DOCTRINE.\n\nThe whole riddle of the solar and lunar worship, as now traced in the churches, hangs indeed on this world-old mystery of lunar phenomena.\n\nThe correlative forces in the \"Queen of Night,\" that lie latent for modern science, but are fully active to the knowledge of Eastern adepts, explain well the thousand and one images under which the moon was represented by the ancients.\n\nIt also shows how much more profoundly learned in the Selenic mysteries were the ancients than are now our modern astronomers.\n\nThe whole Pantheon of the lunar gods and goddesses, Nephtys or Neith, Proserpina, Melytta, Cybele, Isis, Astarte, Venus, and Hecate, on the one hand, and Apollo, Dionysius, Adonis, Bacchus, Osiris, Atys, Thammuz, etc., etc., on the other, all show on the face of their names and titles -- those of \"Sons\" and \"Husbands\" of their mothers -- their identity with the Christian Trinity.\n\nIn every religious system the gods were made to merge their functions as Father, Son, and Husband, into one, and the goddesses were identified as \"Wife, Mother, and Sister\" of the male God; the former synthesizing the human attributes as the \"Sun, the giver of Life,\" the latter merging all the other titles in the grand synthesis known as Maia, Maya, Maria, etc., a generic name."


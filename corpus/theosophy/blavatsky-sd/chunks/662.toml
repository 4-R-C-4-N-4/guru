[content]
body = "He says, \"Man's kinship with the apes is not impugned by the bestial strength of the teeth of the male orang or gorilla.\" Mr.\n\nDarwin, on the contrary, endows this fabulous being with teeth used as weapons!\n\n[[Vol.\n\n2, Page]] 667 A WALKER OR A CLIMBER.\n\norgans are arranged after a very different plan.\n\nIn man they are so arranged that he is essentially a walker, while in apes they necessitate his being a climber .\n\n.\n\n.\n\n.\n\nThere is here an anatomical and mechanical distinction.\n\n.\n\n.\n\n.\n\nA glance at the page where Huxley has figured side by side a human skeleton and the skeletons of the most highly developed apes is a sufficiently convincing proof.\" The consequence of these facts, from the point of view of the logical application of the law of permanent characterizations, is that man cannot be descended from an ancestor who is already characterized as an ape, any more than a catarrhine tailless ape can be descended from a tailed catarrhine.\n\nA walking animal cannot be descended from a climbing one.\n\n\"Vogt, in placing man among the primates, declares without hesitation that the lowest class of apes have passed the landmark (the common ancestor), from which the different types of this family have originated and diverged.\" (This ancestor of the apes, occult science sees in the lowest human group during the Atlantean period, as shown before.) .\n\n.\n\n.\n\n\"We must, then, place the origin of man beyond the last apes,\" goes on de Quatrefages, thus corroborating our Doctrine, \"if we would adhere to one of the laws most emphatically necessary to the Darwinian theory.\n\nWe then come to the prosimiae of Haeckel, the loris, indris, etc.\n\nBut those animals also are climbers; we must go further, therefore, in search of our first direct ancestor.\n\nBut the genealogy by Haeckel brings us from the latter to the marsupials.\n\n.\n\n.\n\n.\n\nFrom men to the Kangaroo the distance is certainly great.\n\nNow neither living nor extinct fauna show the intermediate types which ought to serve as landmarks.\n\nThis difficulty causes but slight embarrassment to Darwin.* We know that he considers the want of information upon similar questions as a proof in his favour.\n\nHaeckel doubtless is as little embarrassed.\n\nHe admits the existence of an absolutely theoretical pithecoid man.\n\n\" \"Thus, since it has been proved that, according to Darwinism itself, the origin of man must be placed beyond the eighteenth stage, and since it becomes, in consequence, necessary to fill up the gap between marsupials and man, will Haeckel admit the existence of four unknown intermediate groups instead of one?\" asks de Quatrefages.\n\n\"Will he complete his genealogy in this manner?\n\nIt is not for me to answer.\" (\" The Human Species, \" p.\n\n107-108.) But see Haeckel's famous genealogy, in \"The Pedigree of Man,\" called by him \"Ancestral Series of Man.\" In the \"Second Division\" [[Footnote(s)]] ------------------------------------------------- * According even to a fellow-thinker, Professor Schmidt, Darwin has evolved \"a certainly not flattering, and perhaps in many points an incorrect, portrait of our presumptive ancestors in the dawn of humanity.\" (\" Doctrine of Descent and Darwinism, \" p.\n\n284.) [[Vol.\n\n2, Page]] 668 THE SECRET DOCTRINE.\n\n(Eighteenth Stage) he describes \"Prosimiae, allied to the Loris (Stenops) and Makis (Lemur) as without marsupial bones and cloaca, but with placenta.\n\n\" And now turn to de Quatrefages' \" The Human Species, \" pp.\n\n109, 110, and see his proofs, based on the latest discoveries, to show that \"the prosimiae of Haeckel have no decidua and a diffuse placenta.\" They cannot be the ancestors of the apes even, let alone man, according to a fundamental law of Darwin himself, as the great French Naturalist shows.\n\nBut this does not dismay the \"animal theorists\" in the least, for self-contradiction and paradoxes are the very soul of modern Darwinism.\n\nWitness -- Mr.\n\nHuxley.\n\nHaving himself shown, with regard to fossil man and the \"missing link,\" that \"neither in quaternary ages nor at the present time does any intermediary being fill the gap which separates man from the Troglodyte\"; and that to \"deny the existence of this gap would be as reprehensible as absurd, \" the great man of Science denies his own words in actu by supporting with all the weight of his scientific authority that most \"absurd\" of all theories -- the descent of man from an ape!\n\n\"This genealogy,\" says de Quatrefages, \" is wrong throughout, and is founded on a material error.\" Indeed, Haeckel bases his descent of man on the 17th and 18th stages ( See Aveling ' s \" Pedigree of Man, \" p.\n\n77), the marsupialia and prosimiae -- (genus Haeckelii?).\n\nApplying the latter term to the Lemuridae -- hence making of them animals with a placenta -- he commits a zoological blunder.\n\nFor after having himself divided mammals according to their anatomical differences into two groups: the indeciduata, which have no decidua (or special membrane uniting the placentae), and the deciduata, those who possess it: he includes the prosimiae in the latter group.\n\nNow we have shown elsewhere what other men of science had to say to this.\n\nAs de Quatrefages says, \"The anatomical investigations of .\n\n.\n\n.\n\nMilne Edwards and Grandidier upon these animals .\n\n.\n\n.\n\nplace it beyond all doubt that the prosimiae of Haeckel have no decidua and a diffuse placenta.\n\nThey are indeciduata.\n\nFar from any possibility of their being the ancestors of the apes, according to the principles laid down by Haeckel himself, they cannot be regarded even as the ancestors of the zonoplacental mammals .\n\n.\n\n.\n\nand ought to be connected with the pachydermata, the edentata, and the cetacea\"; ( p .\n\n110).\n\nAnd yet Haeckel's inventions pass off with some as exact science!\n\nThe above mistake, if indeed, one, is not even hinted at in Haeckel's \"Pedigree of Man,\" translated by Aveling.\n\nIf the excuse may stand good that at the time the famous \"genealogies\" were made, \"the embryogenesis of the prosimiae was not known,\" it is familiar now.\n\nWe shall see whether the next edition of Aveling's translation will have this important error rectified, or if the 17th and 18th stages remain [[Vol.\n\n2, Page]] 669 A PITHECOID MAN WANTED.\n\nas they are to blind the profane, as one of the real intermediate links."


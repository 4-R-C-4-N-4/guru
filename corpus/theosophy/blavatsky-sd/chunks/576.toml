body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n2 [[Vol.\n\n2, Page]] 492 THE SECRET DOCTRINE.\n\n[[This page continued from previous section ]] C.\n\nT HE M ANY M EANINGS OF THE \" W AR IN H EAVEN.\" The Secret Doctrine points out, as a self-evident fact, that Mankind, collectively and individually, is, with all manifested nature, the vehicle ( a ) of the breath of One Universal Principle, in its primal differentiation; and ( b ) of the countless \"breaths\" proceeding from that One B REATH in its secondary and further differentiations, as Nature with its many mankinds proceeds downwards toward the planes that are ever increasing in materiality.\n\nThe primary Breath informs the higher Hierarchies; the secondary -- the lower, on the constantly descending planes.\n\nNow there are many passages in the Bible which prove on their face, exoterically, that this belief was at one time Universal ; and the most convincing are the two chapters Ezekiel xxviii.\n\nand Isaiah xiv.\n\nChristian theologians are welcome to interpret both as referring to the great War before Creation, the Epos of Satan's rebellion, etc., if they so choose, but the absurdity of the idea is too apparent.\n\nEzekiel addresses his lamentations and reproofs to the King of Tyre; Isaiah -- to King Ahaz, who indulged in the worship of idols, as did the rest of the nation, with the exception of a few Initiates (the Prophets, so called), who tried to arrest it on its way to exotericism, or idolatry, which is the same thing.\n\nLet the student judge.\n\nIn Ezekiel xxviii.\n\nit is said, \"Son of Man, say unto the prince of Tyrus, thus saith the Lord God (as we understand it, the \"god\" K ARMA): Because thine heart is lifted up, and thou hast said I am a God .\n\n.\n\n.\n\n.\n\nand yet thou art a man .\n\n.\n\n.\n\n.\n\nbehold I shall bring strangers upon thee .\n\n.\n\n.\n\n.\n\nand they shall draw their swords against the beauty of thy wisdom .\n\n.\n\n.\n\n.\n\nand they shall bring thee down to the pit .\n\n.\n\n.\n\n.\" or Earth-life.\n\nThe origin of the \"prince of Tyrus\" is to be traced to, and sought in [[Vol.\n\n2, Page]] 493 THE REAL MEANING OF THE CHERUB.\n\nthe \"divine Dynasties\" of the iniquitous Atlanteans, the Great Sorcerers (See last Comments, on Stanza XII ., verses 47-49).\n\nThere is no metaphor in the words of Ezekiel, but actual history, this time.\n\nFor the voice in the prophet, the voice of the \"Lord,\" his own Spirit, which spake unto him, says: -- \"Because thou hast said, 'I am a God, I sit in the seat of God(s) -- (divine Dynasties), in the midst of the seas ,' yet thou art a man.\n\n.\n\n.\n\n.\n\n.\n\nBehold thou art wiser than Daniel; there is no secret that they can hide from thee: with thy wisdom .\n\n.\n\n.\n\nthou hast increased thy riches, and thine heart is lifted up because of thy riches.\n\nBehold therefore .\n\n.\n\n.\n\nstrangers shall draw their swords against the beauty of thy wisdom .\n\n.\n\n.\n\nthey shall bring thee down .\n\n.\n\n.\n\nand thou shalt die the deaths of them that are slain in the midst of the seas.\n\n\" (Verses 3-8.) All such imprecations are not prophecy, but simply reminders of the fate of the Atlanteans, the \"Giants on Earth.\" What can be the meaning of this last sentence if it is not a narrative of the fate of the Atlanteans?\n\nVerse 17 saying, \"thine heart was lifted up because of thy beauty,\" may refer to the \"Heavenly Man\" in Pymander, or to the Fallen Angels, who are accused of having fallen through pride on account of the great beauty and wisdom which became their lot.\n\nThere is no metaphor here, except in the preconceived ideas of our theologians, perhaps.\n\nThese verses relate to the Past and belong more to the Knowledge acquired at the mysteries of Initiation than to retrospective clairvoyance!\n\nSays the voice, again: -- \"Thou hast been in Eden, the garden of God (in the Satya Yuga) every precious stone was thy covering .\n\n.\n\n.\n\n.\n\nthe workmanship of thy tabrets and thy pipes was prepared in thee in the day thou was created .\n\n.\n\n.\n\nThou art the anointed cherub .\n\n.\n\n.\n\nthou hast walked up and down in the midst of the stones of fire .\n\n.\n\n.\n\nthou wast perfect in thy ways from the day that thou wast created, till iniquity was found in thee.\n\nTherefore I will cast thee out of the mountain of God and destroy thee.\n\n.\n\n.\n\n.\n\n\" The \"Mountain of God\" means the \"Mountain of the Gods \" or Meru, whose representative in the Fourth Race was Mount Atlas, the last form of one of the divine Titans, so high in those days that the ancients believed that the heavens rested on its top.\n\nDid not Atlas assist the giants in their war against the gods?\n\n(Hyginus).\n\nAnother version shows the fable as arising from the fondness of Atlas, son of Iapetus and Clymene, for astronomy, and from his dwelling for that reason on the highest mountain peaks.\n\nThe truth is that Atlas, \"the mountain of the gods,\" and also the hero of that name, are the esoteric symbols of the Fourth Race, and his seven daughters, the Atlantides, are the symbols of its Seven Sub-races.\n\nMount Atlas, according to all the legends, was three times as high as it is now; having sunk at two different times.\n\nIt is of a volcanic origin, and therefore the voice [[Vol.\n\n2, Page]] 494 THE SECRET DOCTRINE.\n\nwithin Ezekiel says: \"I will bring forth a fire from the midst of thee, it shall devour thee,\" etc.\n\n(v.\n\n18).\n\nSurely it does not mean, as seems to be the case from the translated texts, that this fire was to be brought from the midst of the Prince of Tyrus, or his people, but from Mount Atlas, symbolising the proud race, learned in magic and high in arts and civilization, whose last remnant was destroyed almost at the foot of the range of those once gigantic mountains.\n\nTruly, \"thou shalt be a terror, and never shalt thou be any more \"; as the very name of the race and its fate is now annihilated from man's memory."


body = "T HEY MAKE OF HIM THE MESSENGER OF THEIR WILL.\n\nT HE D ZYU BECOMES F OHAT, THE SWIFT SON OF THE D IVINE SONS WHOSE SONS ARE THE L IPIKA, RUNS CIRCULAR ERRANDS.\n\nF OHAT IS THE STEED AND THE THOUGHT IS THE RIDER.\n\nH E PASSES LIKE LIGHTNING THROUGH THE FIERY CLOUDS; TAKES THREE, AND FIVE, AND SEVEN STRIDES THROUGH THE SEVEN REGIONS ABOVE, AND THE SEVEN BELOW.\n\nH E LIFTS HIS VOICE, AND CALLS THE INNUMERABLE SPARKS, AND JOINS THEM.\n\n3.\n\nH E IS THEIR GUIDING SPIRIT AND LEADER.\n\nW HEN HE COMMENCES WORK, HE SEPARATES THE SPARKS OF THE L OWER K INGDOM THAT FLOAT AND THRILL WITH JOY IN THEIR RADIANT DWELLINGS, AND FORMS THEREWITH THE GERMS OF WHEELS.\n\nH E PLACES THEM IN THE SIX DIRECTIONS OF SPACE, AND ONE IN THE MIDDLE -- THE CENTRAL WHEEL.\n\n4.\n\nF OHAT TRACES SPIRAL LINES TO UNITE THE SIXTH TO THE SEVENTH -- THE CROWN; AN ARMY OF THE S ONS OF L IGHT STANDS AT EACH ANGLE, AND THE L IPIKA IN THE MIDDLE WHEEL, T HEY SAY: T HIS IS GOOD, THE [[Vol.\n\n1, Page]] 32 THE SECRET DOCTRINE.\n\nFIRST D IVINE WORLD IS READY, THE FIRST IS NOW THE SECOND.\n\nT HEN THE \" D IVINE A RUPA\" REFLECTS ITSELF IN C HHAYA L OKA, THE FIRST GARMENT OF THE A NUPADAKA.\n\n5.\n\nF OHAT TAKES FIVE STRIDES AND BUILDS A WINGED WHEEL AT EACH CORNER OF THE SQUARE, FOR THE FOUR HOLY ONES AND THEIR ARMIES.\n\n6.\n\nT HE L IPIKA CIRCUMSCRIBE THE TRIANGLE, THE FIRST ONE, THE CUBE, THE SECOND ONE, AND THE PENTACLE WITHIN THE EGG.\n\nI T IS THE RING CALLED \" P ASS N OT\" FOR THOSE WHO DESCEND AND ASCEND.\n\nA LSO FOR THOSE WHO DURING THE K ALPA ARE PROGRESSING TOWARDS THE GREAT DAY \" B E WITH US.\" T HUS WERE FORMED THE R UPA AND THE A RUPA: FROM ONE LIGHT SEVEN LIGHTS; FROM EACH OF THE SEVEN, SEVEN TIMES SEVEN LIGHTS.\n\nT HE WHEELS WATCH THE RING.\n\n.\n\n.\n\n.\n\n.\n\n------- STANZA VI.\n\n1.\n\nB Y THE POWER OF THE M OTHER OF M ERCY AND K NOWLEDGE -- K WAN- Y IN -- THE \"TRIPLE\" OF K WAN-SHAI- Y IN, RESIDING IN K WAN-YIN- T IEN, F OHAT, THE B REATH OF THEIR P ROGENY, THE S ON OF THE S ONS, HAVING CALLED FORTH, FROM THE LOWER ABYSS, THE ILLUSIVE FORM OF S IEN- T CHANG AND THE S EVEN E LEMENTS:* 2.\n\nT HE S WIFT AND R ADIANT O NE PRODUCES THE S EVEN L AYA C ENTRES, AGAINST WHICH NONE WILL PREVAIL TO THE GREAT DAY \" B E-WITH- U S,\" AND SEATS THE U NIVERSE ON THESE E TERNAL F OUNDATIONS SURROUNDING T SIEN- T CHAN WITH THE E LEMENTARY G ERMS.\n\n3.\n\nO F THE S EVEN -- FIRST ONE MANIFESTED, SIX CONCEALED, TWO MANIFESTED, FIVE CONCEALED; THREE MANIFESTED, FOUR CONCEALED; FOUR PRODUCED, THREE HIDDEN; FOUR AND ONE TSAN REVEALED, TWO AND ONE HALF CONCEALED; SIX TO BE MANIFESTED, ONE LAID ASIDE.\n\nL ASTLY, SEVEN SMALL WHEELS REVOLVING; ONE GIVING BIRTH TO THE OTHER.\n\n[[Footnote(s)]] ------------------------------------------------- * Verse 1 of Stanza VI.\n\nis of a far later date than the other Stanzas, though still very ancient.\n\nThe old text of this verse, having names entirely unknown to the Orientalists would give no clue to the student.\n\n[[Vol.\n\n1, Page]] 33 THE SECRET DOCTRINE.\n\n4.\n\nH E BUILDS THEM IN THE LIKENESS OF OLDER WHEELS, PLACING THEM ON THE I MPERISHABLE C ENTRES.\n\nH OW DOES F OHAT BUILD THEM?\n\nHE COLLECTS THE FIERY DUST.\n\nH E MAKES BALLS OF FIRE, RUNS THROUGH THEM, AND ROUND THEM, INFUSING LIFE THEREINTO THEN' SETS THEM INTO MOTION; SOME ONE WAY, SOME THE OTHER WAY.\n\nT HEY ARE COLD, HE MAKES THEM HOT.\n\nT HEY ARE DRY, HE MAKES THEM MOIST.\n\nT HEY SHINE, HE FANS AND COOLS THEM.\n\nT HUS ACTS F OHAT FROM ONE TWILIGHT TO THE OTHER, DURING S EVEN E TERNITIES.\n\n5.\n\nA T THE FOURTH, THE SONS ARE TOLD TO CREATE THEIR IMAGES.\n\nO NE THIRD REFUSES -- TWO OBEY.\n\nT HE CURSE IS PRONOUNCED; THEY WILL BE BORN ON THE FOURTH, SUFFER AND CAUSE SUFFERING; THIS IS THE FIRST WAR.\n\n6.\n\nT HE OLDER WHEELS ROTATED DOWNWARDS AND UPWARDS.\n\n.\n\n.\n\n.\n\nT HE MOTHER'S SPAWN FILLED THE WHOLE.\n\nT HERE WERE BATTLES FOUGHT BETWEEN THE C REATORS AND THE D ESTROYERS, AND BATTLES FOUGHT FOR SPACE; THE SEED APPEARING AND RE-APPEARING CONTINUOUSLY.\n\n7.\n\nM AKE THY CALCULATIONS, L ANOO, IF THOU WOULDEST LEARN THE CORRECT AGE OF THY SMALL WHEEL.\n\nI TS FOURTH SPOKE IS OUR MOTHER.\n\nR EACH THE FOURTH \"FRUIT\" OF THE FOURTH PATH OF KNOWLEDGE THAT LEADS TO N IRVANA, AND THOU SHALT COMPREHEND, FOR THOU SHALT SEE .\n\n.\n\n.\n\n.\n\n.\n\n------- STANZA VII.\n\n1.\n\nB EHOLD THE BEGINNING OF SENTIENT FORMLESS LIFE.\n\nF IRST THE D IVINE, THE ONE FROM THE M OTHER- S PIRIT; THEN THE S PIRITUAL; THE THREE FROM THE ONE, THE FOUR FROM THE ONE, AND THE FIVE FROM WHICH THE THREE, THE FIVE, AND THE SEVEN.\n\nT HESE ARE THE THREE-FOLD, THE FOUR-FOLD DOWNWARD; THE \"MIND-BORN\" SONS OF THE FIRST L ORD; THE SHINING SEVEN."


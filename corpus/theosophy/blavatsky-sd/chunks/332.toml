body = "This is very clear, but yet, see the interpretations of even our modern theologians, men supposed to be intellectual and learned!\n\nIn the \" Theological and philosophical works of Hermes Trismegistus, Christian ( ?\n\n) Neoplatonist, \" a work compiled by John David Chambers, of Oriel College, Oxford, the translator wonders \"for whom these seven men are intended?\" He solves the difficulty by concluding that, as \"the original pattern man ( Adam Kadmon of ch.\n\ni.\n\nGenesis ) was masculine-feminine, the seven may signify the succeeding patriarchs named in Genesis\" (p.\n\n9) .\n\n.\n\n.\n\nA truly theological way of cutting the Gordian knot.\n\n[[Vol.\n\n2, Page]] 3 THE LEMNOS-BORN KABIRI.\n\n(potentially); the latter in the Androgynes; these again in the sexual, the later third Race; (for further explanation, vide infra ) .\n\nWere the tablets less mutilated, they would be found to contain word for word the same account as given in the archaic records and in Hermes, at least as regards the fundamental facts, if not as regards minute details; for Hermes is a good deal disfigured by mistranslations.\n\nIt is quite certain that the seeming supernaturalism of these teachings, although allegorical, is so diametrically opposed to the dead-letter statements of the Bible* as well as to the latest hypotheses of science, that it will evoke passionate denial.\n\nThe Occultists, however, know that the traditions of Esoteric Philosophy must be the right ones, simply because they are the most logical, and reconcile every difficulty.\n\nBesides, we have the Egyptian \" Books of Thoth, \" and \" Book of the Dead, \" and the Hindu Puranas with the seven Manus, as well as the Chaldeo-Assyrian accounts, whose tiles mention seven primitive men, or Adams, the real meaning of which name may be ascertained through the Kabala.\n\nThose who know anything of the Samothracian mysteries will also remember that the generic name of the Kabiri was the \"Holy Fires,\" which created on seven localities of the island of Electria (or Samothrace) the \"Kabir born of the Holy Lemnos\" (the island sacred to Vulcan ).\n\nAccording to Pindar ( See \" Philosophumena, \" Miller ' s edition, p.\n\n98), this Kabir, whose name was Adamas, was, in the traditions of Lemnos, the type of the primitive man born from the bosom of the Earth.\n\nHe was the Archetype of the first males in the order of generation, and was one of the seven autochthonous ancestors or progenitors of mankind ( ibid, p.\n\n108).\n\nIf, while coupling with this the fact that Samothrace was colonised by the Phoenicians, and before them by the mysterious Pelasgians who came from the East, one remembers also the identity of the mystery gods of the Phoenicians, Chaldeans, and Israelites, it will be easy to discover whence came also the confused account of the Noachian deluge.\n\nIt has become undeniable of late that the Jews, who obtained their primitive ideas about creation from Moses, who had them from [[Footnote(s)]] ------------------------------------------------- * As it is now asserted that the Chaldean tablets, which give the allegorical description of Creation, the Fall, and the Flood, even to the legend of the Tower of Babel, were written \"before the time of Moses\" ( See G.\n\nSmith ' s \" Chaldean Account of Genesis, \" p .\n\n86), how can the Pentateuch be called a revelation?\n\nIt is simply another version of the same story.\n\n[[Vol.\n\n2, Page]] 4 THE SECRET DOCTRINE.\n\nthe Egyptians, compiled their Genesis and first Cosmogonic traditions -- when these were rewritten by Ezra and others -- from the Chaldeo-Akkadian account.\n\nIt is, therefore, sufficient to examine the Babylonian and Assyrian cuneiform and other inscriptions to find also therein, scattered here and there, not only the original meaning of the name Adam, Admi, or Adami,* but also the creation of seven Adams or roots of men, born of Mother Earth, physically, and of the divine fire of the progenitors, spiritually or astrally.\n\nThe Assyriologists, ignorant of the esoteric teachings, could hardly be expected to pay any greater attention to the mysterious and ever-recurring number seven on the Babylonian cylinders, than they paid to it on finding the same in Genesis and the Bible.\n\nYet the number of the ancestral spirits and their seven groups of human progeny are there, notwithstanding the dilapidated condition of the fragments, as plainly as they are to be found in \" Pymander \" and in the \" Book of the Concealed Mystery \" of the Kabala.\n\nIn the latter Adam Kadmon is the Sephirothal TREE, as also the \"Tree of the Knowledge of Good and Evil.\" And that \" Tree, \" says verse 32, \"hath around it seven columns,\" or palaces, of the seven creative Angels operating in the spheres of the seven planets on our Globe.\n\nAs Adam Kadmon is a collective name, so also is the name of the man Adam.\n\nSays George Smith in his \" Chaldean Account of Genesis :\" -- \"The word Adam used in these legends for the first human being is evidently not a proper name, but is only used as a term for mankind.\n\nAdam appears as a proper name in Genesis, but certainly in some passages is only used in the same sense as the Assyrian word\" ( p.\n\n86).\n\nMoreover, neither the Chaldean nor the Biblical deluge (the stories of Xisuthrus and Noah) is based on the universal or even on the Atlantean deluges, recorded in the Indian allegory of Vaivaswata Manu.\n\nThey are the exoteric allegories based on the esoteric mysteries of Samothrace.\n\nIf the older Chaldees knew the esoteric truth concealed in the Puranic legends, the other nations were aware only of the Samothracian mystery, and allegorised it.\n\nThey adapted it to their astronomical and anthropological, or rather phallic, notions.\n\nSamothrace is known historically to have been famous in antiquity for a deluge, which submerged the country and reached the top of the highest mountains; an event which happened before the age of the Argonauts.\n\nIt was overflowed very [[Footnote(s)]] ------------------------------------------------- * Vide § \"Adam-Adami,\" in Part II.\n\nof this volume.\n\n[[Vol.\n\n2, Page]] 5 THE SECRETS OF KOUYUNJIK.\n\nsuddenly by the waters of the Euxine, regarded up to that time as a lake.* But the Israelites had, moreover, another legend upon which to base their allegory: the \"deluge,\" that transformed the present Gobi Desert into a sea for the last time, some 10 or 12,000 years ago, and which drove many Noahs and their families on to the surrounding mountains."


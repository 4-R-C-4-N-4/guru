[content]
body = "Helped by his knowledge of landscapes left behind him, he can get a general and pretty correct idea of the transmural view, if he will only climb to the loftiest summit of the altitudes in front of him.\n\nOnce there, he can gaze at it, at his leisure, comparing that which he dimly perceives with that which he has just left below, now that he is, thanks to his efforts, beyond the line of the mists and the cloud-capped cliffs.\n\nSuch a point of preliminary observation, for those who would like to get a more correct understanding of the mysteries of the pre-archaic periods given in the texts, cannot be offered to them in these two volumes.\n\nBut if the reader has patience, and would glance at the present state of beliefs and creeds in Europe, compare and check it with what is known to history of the ages directly preceding and [[Vol.\n\n1, Page]] xl INTRODUCTORY.\n\nfollowing the Christian era, then he will find all this in Volume III.\n\nof this work.\n\nIn that volume a brief recapitulation will be made of all the principal adepts known to history, and the downfall of the mysteries will be described; after which began the disappearance and final and systematic elimination from the memory of men of the real nature of initiation and the Sacred Science.\n\nFrom that time its teachings became Occult, and Magic sailed but too often under the venerable but frequently misleading name of Hermetic philosophy.\n\nAs real Occultism had been prevalent among the Mystics during the centuries that preceded our era, so Magic, or rather Sorcery, with its Occult Arts, followed the beginning of Christianity.\n\nHowever great and zealous the fanatical efforts, during those early centuries, to obliterate every trace of the mental and intellectual labour of the Pagans, it was a failure; but the same spirit of the dark demon of bigotry and intolerance has perverted systematically and ever since, every bright page written in the pre-Christian periods.\n\nEven in her uncertain records, history has preserved enough of that which has survived to throw an impartial light upon the whole.\n\nLet, then, the reader tarry a little while with the writer, on the spot of observation selected.\n\nHe is asked to give all his attention to that millennium which divided the pre-Christian and the post -Christian periods, by the year O NE of the Nativity.\n\nThis event -- whether historically correct or not -- has nevertheless been made to serve as a first signal for the erection of manifold bulwarks against any possible return of, or even a glimpse into, the hated religions of the Past; hated and dreaded -- because throwing such a vivid light on the new and intentionally veiled interpretation of what is now known as the \"New Dispensation.\" However superhuman the efforts of the early Christian fathers to obliterate the Secret Doctrine from the very memory of man, they all failed.\n\nTruth can never be killed; hence the failure to sweep away entirely from the face of the earth every vestige of that ancient Wisdom, and to shackle and gag every witness who testified to it.\n\nLet one only think of the thousands, and perhaps millions, of MSS .\n\nburnt; of monuments, with their too indiscreet inscriptions and pictorial symbols, pulverised to dust; of the bands of early hermits and ascetics roaming about among the ruined cities of Upper and Lower Egypt, in desert and [[Vol.\n\n1, Page]] xli INTRODUCTORY.\n\nmountain, valleys and highlands, seeking for and eager to destroy every obelisk and pillar, scroll or parchment they could lay their hands on, if it only bore the symbol of the tau, or any other sign borrowed and appropriated by the new faith; and he will then see plainly how it is that so little has remained of the records of the Past.\n\nVerily, the fiendish spirits of fanaticism, of early and mediaeval Christianity and of Islam, have from the first loved to dwell in darkness and ignorance; and both have made \"-------------- the sun like blood, the earth a tomb, The tomb a hell, and hell itself a murkier gloom!\" Both creeds have won their proselytes at the point of the sword; both have built their churches on heaven-kissing hecatombs of human victims.\n\nOver the gateway of Century I.\n\nof our era, the ominous words \"the K ARMA OF I SRAEL,\" fatally glowed.\n\nOver the portals of our own, the future seer may discern other words, that will point to the Karma for cunningly made-up H ISTORY, for events purposely perverted, and for great characters slandered by posterity, mangled out of recognition, between the two cars of Jagannatha -- Bigotry and Materialism; one accepting too much, the other denying all.\n\nWise is he who holds to the golden mid-point, who believes in the eternal justice of things.\n\nSays Faigi Diwan, the \"witness to the wonderful speeches of a free-thinker who belongs to a thousand sects\": \"In the assembly of the day of resurrection, when past things shall be forgiven, the sins of the Ka'bah will be forgiven for the sake of the dust of Christian churches.\" To this, Professor Max Muller replies: \"The sins of Islam are as worthless as the dust of Christianity.\n\nOn the day of resurrection both Muhammadans and Christians will see the vanity of their religious doctrines.\n\nMen fight about religion on earth -- in heaven they shall find out that there is only one true religion -- the worship of God's S PIRIT.\"* In other words -- \" T HERE IS NO RELIGION (OR LAW) HIGHER THAN TRUTH\" -- \" SATYAT NASTI PARO DHARMAH \" -- the motto of the Maharajah of Benares, adopted by the Theosophical Society.\n\nAs already said in the Preface, the Secret Doctrine is not a version of \"Isis Unveiled\" -- as originally intended.\n\nIt is a volume explanatory of [[Footnote(s)]] ------------------------------------------------- * \"Lectures on the Science of Religion,\" by F.\n\nMax Muller, p.\n\n257.\n\n[[Vol.\n\n1, Page]] xlii INTRODUCTORY.\n\nit rather, and, though entirely independent of the earlier work, an indispensable corollary to it.\n\nMuch of what was in Isis could hardly be understood by theosophists in those days.\n\nThe Secret Doctrine will now throw light on many a problem left unsolved in the first work, especially on the opening pages, which have never been understood.\n\nConcerned simply with the philosophies within our historical times and the respective symbolism of the fallen nations, only a hurried glance could be thrown at the panorama of Occultism in the two volumes of Isis.\n\nIn the present work, detailed Cosmogony and the evolution of the four races that preceded our Fifth race Humanity are given, and now two large volumes explain that which was stated on the first page of I SIS U NVEILED alone, and in a few allusions scattered hither and thither throughout that work."


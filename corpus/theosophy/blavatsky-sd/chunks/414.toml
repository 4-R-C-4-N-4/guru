[content]
body = "That Third and holy Race consisted of men who, at their zenith, were described [[Footnote(s)]] ------------------------------------------------- * This is explained in the section which follows this series of Stanzas in the allegory from the Puranas concerning Kandu, the holy sage, and Pramlocha, the nymph alleged to have hypnotised him, (Vide § II, Commentary after St.I.), a suggestive allegory, scientifically, as the drops of perspiration, which she exuded, are the symbols of the spores of science ( Vide infra ).\n\n** This will be explained as we proceed.\n\nThis unwillingness to fashion men, or create, is symbolized in the Puranas by Daksha having to deal with his opponent Narada, the \"strife-making ascetic.\" *** Vide Verse 24.\n\n[[Vol.\n\n2, Page]] 172 THE SECRET DOCTRINE.\n\nas, \"towering giants of godly strength and beauty, and the depositories of all the mysteries of Heaven and Earth.\" Have they likewise fallen, if, then, incarnation was the Fall?\n\nOf this presently.\n\nThe only thing now to be noted of these is, that the chief gods and heroes of the Fourth and Fifth Races, as of later antiquity, are the deified images of these men of the Third.\n\nThe days of their physiological purity, and those of their so-called Fall, have equally survived in the hearts and memories of their descendants.\n\nHence, the dual nature shown in those gods, both virtue and sin being exalted to their highest degree, in the biographies composed by posterity.\n\nThey were the pre-Adamite and the divine Races, with which even theology, in whose sight they are all \"the accursed Cainite Races,\" now begins to busy itself.\n\nBut the action of \"spiritual progenitors\" of that Race has first to be disposed of.\n\nA very difficult and abstruse point has to be explained with regard to Stanzas 26 and 27.\n\nThese say: -- ------- 26.\n\nW HEN THE S WEAT-BORN PRODUCED THE E GG-BORN, THE T WO-FOLD ( androgyne Third Race *), THE M IGHTY, THE P OWERFUL WITH B ONES, THE L ORDS OF W ISDOM SAID: \" N OW SHALL WE CREATE\" ( a ).\n\nWhy \"now\" -- and not earlier?\n\nThis the following sloka explains.\n\n------- 27 .\n\n( Then ) THE T HIRD ( race ) BECAME THE VAHAN ( vehicle ) OF THE L ORDS OF W ISDOM.\n\nI T CREATED S ONS OF \" W ILL AND Y OGA,\" BY K RIYASAKTI ( b ), IT CREATED THEM, THE H OLY F ATHERS, A NCESTORS OF THE A RHATS.\n\n.\n\n.\n\n.\n\n( a ) How did they create, since the \"Lords of Wisdom\" are identical with the Hindu Devas, who refuse \"to create\"?\n\nClearly they are the [[Footnote(s)]] ------------------------------------------------- * The evolutionist Professor Schmidt alludes to \"the fact of the separation of sexes, as to the derivation of which from species once hermaphrodite all (the believers in creation naturally excepted) are assuredly of one accord.\" Such indeed is the incontestable evidence drawn from the presence of rudimentary organs.\n\n( Cf., his \" Doctrine of Descent and Darwinism, \" p.\n\n159.) Apart from such palpable traces of a primeval hermaphroditism, the fact may be noted that, as Laing writes, \"a study of embryology.\n\n.\n\n.\n\n.\n\nshows that in the human higher animal species the distinction of sex is not developed until a considerable progress has been made in the growth of the embryo.\" (\" A Modern Zoroastrian, \" p.106.) The Law of Retardation -- operative alike in the case of human races, animal species, etc., when a higher type has once been evolved -- still preserves hermaphroditism as the reproductive method of the majority of plants and many lower animals.\n\n[[Vol.\n\n2, Page]] 173 THE SONS OF KRIYASAKTI.\n\nKumaras of the Hindu Pantheon and Puranas, those elder sons of Brahma, \"Sanandana and the other sons of Vedhas, \" who, previously created by him \"without desire or passion, remained chaste, full of holy wisdom and undesirous of progeny?\"* The power, by which they first created, is just that which has since caused them to be degraded from their high status to the position of evil spirits, of Satan and his Host, created in their turn by the unclean fancy of exoteric creeds.\n\nIt was by Kriyasakti, that mysterious and divine power latent in the will of every man, and which, if not called to life, quickened and developed by Yogi-training, remains dormant in 999,999 men out of a million, and gets atrophied.\n\nThis power is explained in the \"Twelve Signs of the Zodiac,\"** as follows: -- ( b ) \" Kriyasakti -- the mysterious power of thought which enables it to produce external, perceptible, phenomenal results by its own inherent energy.\n\nThe ancients held that any idea will manifest itself externally, if one's attention (and Will) is deeply concentrated upon it; similarly, an intense volition will be followed by the desired result.\n\nA Yogi generally performs his wonders by means of Itchasakti (Will-power) and Kriyasakti.\" The Third Race had thus created the so-called S ONS OF W ILL AND Y OGA, or the \"ancestors\" (the spiritual forefathers) of all the subsequent and present Arhats, or Mahatmas, in a truly immaculate way.\n\nThey were indeed created, not begotten, as were their brethren of the Fourth Race, who were generated sexually after the separation of sexes, the Fall of Man.\n\nFor creation is but the result of will acting on phenomenal matter, the calling forth out of it the primordial divine Light and eternal Life.\n\nThey were the \"holy seed-grain\" of the future Saviours of Humanity.\n\nHere we have to make again a break, in order to explain certain difficult points, of which there are so many.\n\nIt is almost impossible to avoid such interruptions.\n\nFor explanations and a philosophical account of the nature of those beings, which are now viewed as the \"Evil\" and rebellious Spirits, the creators by Kriyasakti, the reader is referred to the chapters on \"The Fallen Angels\" and \"The Mystic Dragons,\" in Part II .\n\nof this Volume.\n\nThe order of the evolution of the human Races stands thus in the Fifth Book of the Commentaries, and was already given: -- The First men were Chhayas (1) ; the second, the \" Sweat-born \" (2) , the Third, \" Egg-born, \" and the holy Fathers born by the power of Kriyasakti (3); the Fourth were the children of the Padmapani (Chenresi) (4)."


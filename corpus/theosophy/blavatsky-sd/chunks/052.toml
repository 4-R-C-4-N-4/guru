body = "Latent, during Pralaya, and active, during Manvantara, the \"Primordial\" proceed from \"Father-Mother\" (Spirit-Hyle, or Ilus ); whereas the other manifested Quaternary and the Seven proceed from the Mother alone.\n\nIt is the latter who is the immaculate Virgin-Mother, who is overshadowed, not impregnated, by the Universal MYSTERY -- when she emerges from her state of Laya or undifferentiated condition.\n\nIn reality, they are, of course, all one; but their aspects on the various planes of being are different.\n\n(See Part II., \"Theogony of the Creative Gods.\") The first \"Primordial\" are the highest Beings on the Scale of Existence.\n\nThey are the Archangels of Christianity, those who refuse -- as Michael did in the latter system, and as did the eldest \"Mind-born sons\" of Brahma (Veddhas) -- to create or rather to multiply.\n\n------- STANZA IV.\n\n-- Continued.\n\n3.\n\nF ROM THE EFFULGENCY OF LIGHT -- THE RAY OF THE EVER-DARKNESS -- SPRUNG IN SPACE THE RE-AWAKENED ENERGIES ( Dhyan Chohans ): THE ONE FROM THE EGG, THE SIX AND THE FIVE ( a ); THEN THE THREE, THE ONE, [[Vol.\n\n1, Page]] 89 THE VEHICLE OF THE UNIVERSE.\n\nTHE FOUR, THE ONE, THE FIVE -- THE TWICE SEVEN, THE SUM TOTAL ( b ).\n\nAND THESE ARE: THE ESSENCES, THE FLAMES, THE ELEMENTS, THE BUILDERS, THE NUMBERS, THE ARUPA ( formless ) , THE RUPA ( with bodies ), AND THE FORCE OR DIVINE MAN -- THE SUM TOTAL.\n\nA ND FROM THE DIVINE MAN EMANATED THE FORMS, THE SPARKS, THE SACRED ANIMALS, AND THE MESSENGERS OF THE SACRED FATHERS ( the Pitris ) WITHIN THE HOLY FOUR.* ( a ) This relates to the sacred Science of the Numerals: so sacred, indeed, and so important in the study of Occultism that the subject can hardly be skimmed, even in such a large work as the present.\n\nIt is on the Hierarchies and correct numbers of these Beings invisible (to us) except upon very rare occasions, that the mystery of the whole Universe is built.\n\nThe Kumaras , for instance, are called the \"Four\" though in reality seven in number, because Sanaka, Sananda, Sanatana and Sanat-Kumara are the chief Vaidhatra (their patronymic name), as they spring from the \"four-fold mystery.\" To make the whole clearer we have to turn for our illustrations to tenets more familiar to some of our readers, namely, the Brahminical.\n\nAccording to Manu, Hiranyagarbha is Brahma the first male formed by the undiscernible Causeless CAUSE in a \"Golden Egg resplendent as the Sun,\" as states the Hindu Classical Dictionary.\n\n\"Hiranyagarbha\" means the golden, or rather the \"Effulgent Womb\" or Egg.\n\nThe meaning tallies awkwardly with the epithet of \"male.\" Surely the esoteric meaning of the sentence is clear enough.\n\nIn the Rig Veda it is said: -- \" T HAT, the one Lord of all beings .\n\n.\n\n.\n\n.\n\nthe one animating principle of gods and man,\" arose, in the beginning, in the Golden Womb, Hiranyagarbha -- which is the Mundane Egg or sphere of our Universe.\n\nThat Being is surely androgynous, and the allegory of Brahma separating into two and recreating in one of his halves (the female Vach) himself as Viraj, is a proof of it.\n\n\"The One from the Egg, the Six and the Five,\" give the number 1065, the value of the first-born (later on the male and female Brahma-Prajapati), who answers to the numbers 7, and 14, and 21 respectively.\n\nThe Prajapati are, like the Sephiroth, only seven, including the [[Footnote(s)]] ------------------------------------------------- * The 4, represented in the Occult numerals by the Tetraktis, the Sacred or Perfect Square, is a Sacred Number with the mystics of every nation and race.\n\nIt has one and the same significance in Brahmanism, Buddhism, the Kabala and in the Egyptian, Chaldean and other numerical systems.\n\n[[Vol.\n\n1, Page]] 90 THE SECRET DOCTRINE.\n\nsynthetic Sephira of the triad from which they spring.\n\nThus from Hiranyagarbha or Prajapati, the triune (primeval Vedic Trimurti, Agni, Vayu, and Surya), emanate the other seven, or again ten, if we separate the first three which exist in one, and one in three, all, moreover, being comprehended within that one \"supreme\" Parama, called Guhya or \" secret,\" and Sarvatma, the \"Super-Soul.\" \"The seven Lords of Being lie concealed in Sarvatma like thoughts in one brain.\" So are the Sephiroth.\n\nIt is either seven when counting from the upper Triad headed by Kether, or ten -- exoterically.\n\nIn the Mahabharata the Prajapati are 21 in number, or ten, six, and five (1065), thrice seven.* ( b ) \"The Three, the One, the Four, the One, the Five\" (in their totality -- twice seven) represent 31415 -- the numerical hierarchy of the Dhyan-Chohans of various orders, and of the inner or circumscribed world.** When placed on the boundary of the great circle of \"Pass not\" (see Stanza V.), called also the Dhyanipasa, the \"rope of the Angels,\" the \"rope\" that hedges off the phenomenal from the noumenal Kosmos, (not falling within the range of our present objective consciousness); this number, when not enlarged by permutation and expansion, is ever 31415 anagrammatically and Kabalistically, being both the number of the circle and the mystic Svastica, the twice seven once more; for whatever way the two sets of figures are counted, when added separately, one figure after another, whether crossways, from right or from left, they will always yield fourteen.\n\nMathematically they represent the well-known calculation, namely, that the ratio of the diameter to the circumference of a circle is as 1 to 3.1415, or the value of the (pi), as this ratio is called -- the symbol being always used in [[Footnote(s)]] ------------------------------------------------- * In the Kabala the same numbers are a value of Jehovah, viz., 1065, since the numerical values of the three letters which compose his name -- Jod, Vau and twice He -- are respectively 10 ( ), 6 ( ) and 5 ( ); or again thrice seven, 21."


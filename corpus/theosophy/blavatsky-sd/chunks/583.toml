body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n2 [[Vol.\n\n2, Page]] 506 THE SECRET DOCTRINE.\n\n§ XIX.\n\nIS PLEROMA SATAN'S LAIR?\n\nT HE subject is not yet exhausted, and has to be examined from still other aspects.\n\nWhether Milton's grandiose description of the three Days' Battle of the Angels of Light against those of Darkness justifies the suspicion that he must have heard of the corresponding Eastern tradition -- it is impossible to say.\n\nNevertheless, if not himself in connection with some Mystic, then it must have been through some one who had obtained access to the secret works of the Vatican.\n\nAmong these there is a tradition of the \"Beni Shamash\" -- the \"children of the Sun\" -- concerning the Eastern allegory, with far more minute details in its triple version, than one can get either from the Book of Enoch, or the far more recent Revelation of St.\n\nJohn about the \"Old Dragon\" and his various Slayers, as just shown.\n\nIt seems inexplicable to find, to this day, authors belonging to Mystical Societies who yet continue in their preconceived doubts as to the \"alleged\" antiquity of the \"Book of Enoch.\" Thus, while the author of the \"Sacred Mysteries among the Mayas and Quiches\" is inclined to see in Enoch an Initiate converted to Christianity (!\n\n!) ( vide p.\n\n16), the English compiler of Eliphas Levi's works -- \"The Mysteries of Magic\" -- is also of a like opinion.\n\nHe remarks that: \"Outside the erudition of Dr.\n\nKenealy, no modern scholarship attributes any more remote antiquity to the latter work (the 'Book of Enoch') than the fourth century B.C .\" ( Biograph.\n\nand Critical Essay, p.\n\nxxxviii.\n\n) .\n\nModern scholarship has been guilty of worse errors than this one.\n\nIt seems but yesterday that the greatest literary critics in Europe denied the very authenticity of that work, together with the Orphic Hymns, and even the Book of Hermes or Thot, until whole verses from the latter were discovered on Egyptian monuments and tombs of the earliest dynasties.\n\nThe opinion of Archbishop Laurence is quoted elsewhere.\n\nThe \"Old Dragon\" and Satan, now become singly and collectively the symbol of, and the theological term for, the \"Fallen Angel,\" is not so described either in the original Kabala (the Chaldean \"Book of Numbers\") or in the modern.\n\nFor the most learned, if not the greatest of modern Kabalists, namely Eliphas Levi, describes Satan in the following glowing terms: -- \"It is that Angel who was proud enough to believe himself God; brave enough to buy his independence at the price of eternal suffering and torture; beautiful enough to have adored [[Vol.\n\n2, Page]] 507 THE LIVING DEVILS.\n\nhimself in full divine light; strong enough to reign in darkness amidst agony, and to have built himself a throne on his inextinguishable pyre.\n\nIt is the Satan of the Republican and heretical Milton.\n\n.\n\n.\n\n.\n\n.\n\nthe prince of anarchy, served by a hierarchy of pure Spirits (!\n\n!\n\n) .\n\n.\n\n.\n\n.\n\n\"( Histoire de la Magie, 16-17) This description -- one which reconciles so cunningly theological dogma and the Kabalistic allegory, and even contrives to include a political compliment in its phraseology -- is, when read in the right spirit, quite correct.\n\nYes, indeed; it is this grandest of ideals, this ever-living symbol -- nay apotheosis -- of self-sacrifice for the intellectual independence of humanity; this ever active Energy protesting against Static Inertia -- the principle to which Self-assertion is a crime, and Thought and the Light of Knowledge odious.\n\nIt is -- as Eliphas says with unparalleled justice and irony -- \"this pretended hero of tenebrous eternities, who, slanderously charged with ugliness, is decorated with horns and claws, which would fit far better his implacable tormentor -- it is he who has been finally transformed into a serpent -- the red Dragon.\" But Eliphas Levi was yet too subservient to his Roman Catholic authorities; one may add, too jesuitical, to confess that this devil was mankind, and never had any existence on earth outside of that mankind.* In this, Christian theology, although following slavishly in the steps of Paganism, was only true to its own time-honoured policy.\n\nIt had to isolate itself, and to assert its authority.\n\nHence it could not do better than turn every pagan deity into a devil.\n\nEvery bright sun-god of antiquity -- a glorious deity by day, and its own opponent and adversary by night, named the Dragon of Wisdom, because it was supposed to contain the germs of night and day -- has now been turned into the antithetical shadow of God, and has become Satan on the sole and unsupported authority of despotic human dogma.\n\nAfter which all these producers of light and shadow, all the Sun and the Moon Gods, were cursed, and thus the one God chosen out of the many, and Satan, were both anthropomorphised.\n\nBut theology seems to have lost sight of the human capacity for discriminating and finally analysing all that is artificially forced upon its reverence.\n\nHistory shows in every race and even tribe, especially in the Semitic nations, the natural impulse to exalt its own tribal deity above all others to the hegemony [[Footnote(s)]] ------------------------------------------------- * What devil could be possessed of more cunning, craft and cruelty than the \"Whitechapel murderer\" \"Jack the Ripper\" of 1888, whose unparalleled blood-thirsty and cool wickedness led him to slaughter and mutilate in cold blood seven unfortunate and otherwise innocent women!\n\nOne has but to read the daily papers to find in those wife and child-beating, drunken brutes (husbands and fathers!), a small percentage of whom is daily brought before the courts, the complete personifications of the devils of Christian Hell!\n\n[[Vol.\n\n2, Page]] 508 THE SECRET DOCTRINE.\n\nof the gods; and proves that the God of the Israelites was such a tribal God, and no more, even though the Christian Church, following the lead of the \"chosen\" people, is pleased to enforce the worship of that one particular deity, and to anathematize all the others.\n\nWhether originally a conscious or an unconscious blunder, nevertheless, it was one.\n\nJehovah has ever been in antiquity only \"a god among other Gods, \" (lxxxii.\n\nPsalm).\n\nThe Lord appears to Abraham, and while saying, \"I am the Almighty God, \" yet adds, \"I will establish my covenant to be a God unto thee\" (Abraham), and unto his seed after him (Gen.\n\nxvii.\n\n7) -- not unto Aryan Europeans.\n\nBut then, there was the grandiose and ideal figure of Jesus of Nazareth to be set off against a dark background, to gain in radiance by the contrast; and a darker one the Church could hardly invent."


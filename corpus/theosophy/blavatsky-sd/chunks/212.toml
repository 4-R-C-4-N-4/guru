[content]
body = "Moreover, the three metaphysical Sephiroth or \" the periphrasis of Jehovah \" are not Jehovah; it is the latter himself with the additional titles of Adonai, Elohim, Sabbaoth, and the numerous names lavished on him, who is the periphrasis of the Shaddai, , the Omnipotent.\n\nThe name is a circumlocution, indeed, a too abundant figure of Jewish rhetoric, and has always been denounced by the Occultists.\n\nTo the Jewish Kabalists, and even the Christian Alchemists and Rosicrucians, Jehovah was a convenient screen , unified by the folding of its many flaps, and adopted as a substitute: one name of an individual Sephiroth being as good as another name, for those who had the secret.\n\nThe Tetragrammaton, the Ineffable, the sidereal \" Sum Total ,\" was invented for no other purpose than to mislead the profane and to symbolize life and generation.* The real secret and unpronounceable name -- \"the word that is no word\" -- has to be sought in the seven names of the first seven emanations, or the \"Sons of the Fire,\" [[Footnote(s)]] ------------------------------------------------- * Says the translator of Avicebron's \" Qabbalah \" (Mr.\n\nIsaac Myer, LL.B ., of Philadelphia) of this \"Sum Total\": \"The letter of Kether is (Yod), of Binah (Heh), together YaH, the feminine Name; the third letter, that of Hokhmah, is (Vau), making together, YHV of YHVH, the Tetragrammaton, and really the complete symbols of its efficaciousness.\n\nThe last (Heh) of this Ineffable Name being always applied to the Six Lower and the last , together the Seven remaining Sephiroth.\" .\n\n.\n\n.\n\nThus the Tetragrammaton is holy only in its abstract synthesis.\n\nAs a quaternary containing the lower Seven Sephiroth, it is phallic.\n\n[[Vol.\n\n1, Page]] 439 INCREDIBLE, BUT TRUE.\n\nin the secret Scriptures of all the great nations, and even in the Zohar , the Kabalistic lore of that smallest of all, the Jewish.\n\nThis word, composed of seven letters in each tongue, is found embodied in the architectural remains of every grand building in the world; from the Cyclopean remains on Easter Island (part of a continent buried under the seas nearer four million years ago* than 20,000) down to the earliest Egyptian pyramids.\n\nWe shall have to enter more fully upon this subject, and bring practical illustrations to prove the statements made in the text.\n\nFor the present it is sufficient to show, by a few instances, the truth of what was asserted at the beginning of this Monograph, namely, that no Cosmogony, the world over, with the sole exception of the Christian, has ever attributed to the One Highest cause, the UNIVERSAL Deific Principle, the immediate creation of our Earth, man, or anything connected with these.\n\nThis statement holds as good for the Hebrew or Chaldean Kabala as it does for Genesis , had the latter been ever thoroughly understood, and -- what is still more important -- correctly translated.** Everywhere there is either a LOGOS -- a \" Light shining [[Footnote(s)]] ------------------------------------------------- * The statement will, of course, be found preposterous and absurd, and simply laughed at.\n\nBut if one believes in the final submersion of Atlantis 850,000 years ago, as taught in \" Esoteric Buddhism \" (the gradual first sinking having begun during the Eocene age), one has to accept the statement for the so-called Lemuria, the continent of the Third Root Race, first nearly destroyed by combustion, and then submerged.\n\nThis is what the Commentary says: \"The first earth having been purified by the forty-nine fires, her people, born of Fire and Water, could not die .\n\n.\n\n.\n\netc.; the Second Earth (with its race) disappeared as vapour vanishes in the air .\n\n.\n\n.\n\nthe Third Earth had everything consumed on it after the separation , and went down into the lower Deep (the Ocean).\n\nThis was twice e ighty-two cyclic years ago.\" Now a cyclic year is what we call a sidereal year, and is founded on the precession of the equinoxes, or 25,868 years each, and this is equal, therefore, in all to 4,242,352 years.\n\nMore details will be found in the text of Book II.\n\nMeanwhile, this doctrine is embodied in the \"Kings of Edom.\" ** The same reserve is found in the Talmud and in every national system of religion whether monotheistic or exoterically polytheistical.\n\nFrom the superb religious poem by the Kabalist Rabbi Solomon Ben Gabirol in \"the Kether Malchuth,\" we select a few definitions given in the prayers of Kippur.\n\n.\n\n.\n\n.\n\n\"Thou art one, the beginning of all numbers, and the foundation of all edifices; Thou art One, and in the secret of Thy unity the wisest of men are lost, because they know it not.\n\nThou art one, and Thy Unity is never diminished, never extended, and cannot be changed.\n\nThou art one, but not as an element of numeration; for Thy Unity admits not of multiplication , change or form.\n\nThou art existent; but the understanding and vision of mortals cannot attain to thy existence, nor determine for thee the Where, the How, and the Why.\n\nThou art Existent, but in thyself alone, there being none other that can exist with thee.\n\nThou art Existent, before all time and without Place.\n\nThou art Existent, and thy existence is so profound and secret that none can penetrate and discover thy secrecy.\n\nThou art Living, but within no time that can be fixed or known; Thou art Living, but not by a spirit or a soul, for Thou art thyself , THE SOUL OF ALL SOULS,\" etc., etc.\n\nThere is [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 440 THE SECRET DOCTRINE.\n\nin D ARKNESS,\" truly -- or the Architect of the Worlds is esoterically a plural number.\n\nThe Latin Church, paradoxical as ever, while applying the epithet of Creator to Jehovah alone, adopts a whole Kyriel of names for the working FORCES of the latter , those names betraying the secret."


[content]
body = "It is Phtah, however, \"he who opens,\" the opener of life and Death,** who proceeds from the egg of the world to begin his dual work.\n\n( Book of Numbers.\n\n) According to the Greeks, the phantom form of the Chemis ( Chemi , ancient Egypt) which floats on the ethereal waves of the Empyrean Sphere, was called into being by Horus-Apollo, the Sun god, who caused it to evolve out of the Mundane egg.*** In the Scandinavian Cosmogony -- placed by Professor Max Muller, in point of time, as \"far anterior to the Vedas\" in the poem of Voluspa (the song of the prophetess), the Mundane egg is again discovered in the phantom-germ of the Universe, which is represented as lying in the Ginnungagap -- the cup of illusion ( Maya ) the boundless and void abyss.\n\nIn this world's matrix, formerly a region of night and desolation, Nebelheim (the mist-place, the nebular as it is called now, in the astral light) dropped a ray of cold light which overflowed this cup and froze in it.\n\nThen the Invisible blew a scorching wind which dissolved the frozen waters and cleared the mist.\n\nThese waters (chaos), called the streams of Elivagar , distilling in vivifying drops, fell down and created the earth and the giant Ymir , who only had \"the semblance of man\" (the Heavenly man), and the cow, Audhumla (the \"mother\" or astral light, Cosmic Soul) from whose udder flowed four streams of milk (the four cardinal points: the four heads of the four rivers of Eden, etc., etc.) and which \"four\" allegorically are symbolized by the cube in all its various and mystical meanings.\n\nThe Christians -- especially the Greek and Latin Churches -- have fully adopted the symbol, and see in it a commemoration of life eternal, [[Footnote(s)]] ------------------------------------------------- * His triadic goddesses are Sati and Anouki.\n\n** Phtah was originally the god of death, of destruction , like Siva.\n\nHe is a solar god only by virtue of the sun's fire killing as well as vivifying.\n\nHe was the national god of Memphis, the radiant and \"fair-faced God.\" (See Saqquarah Bronzes , Saitic Epoch.\n\n) *** The Brahmanda Purana contains the mystery about Brahma's golden egg fully; and this is why, perhaps, it is inaccessible to the Orientalists, who say that this Purana, like the Skanda, is \"no longer procurable in a collective body,\" but \"is represented by a variety of Khandas and Mahatmyas professing to be derived from it.\" The \"Brahmanda Purana\" is described as \"that which is declared in 12,200 verses, the magnificence of the egg of Brahma, and in which an account of the future Kalpas is contained as revealed by Brahma.\" Quite so, and much more, perchance.\n\n[[Vol.\n\n1, Page]] 368 THE SECRET DOCTRINE.\n\nof salvation and of resurrection.\n\nThis is found in and corroborated by the time-honoured custom of exchanging \"Easter Eggs.\" From the anguinum , the \"Egg\" of the \"pagan\" Druid, whose name alone made Rome tremble with fear, to the red Easter Egg of the Slavonian peasant, a cycle has passed.\n\nAnd yet, whether in civilized Europe, or among the abject savages of Central America, we find the same archaic, primitive thought; if we only search for it and do not disfigure -- in the haughtiness of our fancied mental and physical superiority -- the original idea of the symbol.\n\n-------------- [[This page continued in next section]]"


body = "This process must go on until the period which will bring the Sixth Root-Race on a parallel line with the spirituality of the Second, long extinct mankind.\n\nBut this will hardly be understood at present.\n\nWe must return to Dr.\n\nRichardson's hopeful though somewhat incorrect hypothesis about \"nervous ether.\" Under the misleading translation of the word as \"Space\" ( Akasa ), it has just been shown in the ancient Hindu system as the \"first born\" of the One, having but one quality, SOUND (which is septenary).\n\nIn esoteric language this \"One\" is the \"Father\" Deity, and \"Sound\" is synonymous with Logos (Verbum, or the Son ) .\n\nWhether consciously or otherwise, it must be the latter; and Dr.\n\nRichardson, while preaching an Occult doctrine -- chooses the lowest form of the septenary nature of that \"SOUND\" and speculates upon it, adding: -- \"The theory, I offer, is that the nervous Ether is an animal product.\n\nIn different classes of animals it may differ in physical quality so as to be adapted to the special wants of the animal, but essentially it plays one part in all animals, and is produced, in all, in the same way.\n\n.\n\n.\n\n.\" Herein lies the nucleus of error leading to all the resultant mistaken views.\n\nThis \"Nervous Ether\" is the lowest principle of the Primordial Essence which is Life.\n\nIt is animal vitality diffused in all nature and acting according to the conditions it finds for its activity.\n\nIt is not an \"animal product,\" but the living animal, the living flower or plant are its products.\n\nThe animal tissues only absorb it according to their more or less morbid or healthy state -- as do physical materials and structures ( in their primogenial State -- nota bene ) -- and henceforward, from the moment of the birth of the Entity, are regulated, strengthened, and fed by it.\n\nIt descends in a larger supply to vegetation in the Sushumna sun-ray which lights and feeds the moon, and it is through her beams that it pours its light upon, and penetrates man and animal, more during their sleep and rest, than when they are in full activity.\n\nTherefore Dr.\n\nRichardson errs again in stating that: -- \"The nervous ether is not, according to my idea of it, in itself active , nor an excitant of animal motion in the sense of a force; but it is essential as supplying the conditions by which the motion is rendered possible.\" (It is just the reverse.\n\n) .\n\n.\n\n.\n\n.\n\n\"It is the conductor of all vibrations of heat, of light, of sound, of electrical action, of mechanical [[Vol.\n\n1, Page]] 538 THE SECRET DOCTRINE.\n\nfriction.* It holds the nervous system throughout in perfect tension, during states of life ( true ) .\n\nBy exercise it is disposed of ( rather generated ) .\n\n.\n\n.\n\nand when demand for it is greater than the supply, its deficiency is indicated by nervous collapse or exhaustion.** It accumulates in the nervous centres during sleep, bringing them, if I may so speak, to their due tone, and therewith raising the muscles to awakening and renewed life.\n\n.\n\n.\n\n.\" Just so; this is quite correct, and as comprehensible.\n\nTherefore, \"The body fully renewed by it, presents capacity for motion, fulness of form, life.\n\nThe body bereft of it presents inertia, the configuration of shrunken death, the evidence of having lost something physical that was in it when it lived.\n\n\" Modern Science denies the existence of a \"vital principle.\" This extract is a clear proof of its grand mistake.\n\nBut this \"physical something,\" that we call life-fluid -- the Liquor Vitae of Paracelsus -- has not deserted the body , as Dr.\n\nRichardson thinks.\n\nIt has only changed its state from activity to passivity, and become latent owing to the too morbid state of the tissues, on which it has no more hold.\n\nOnce the rigor mortis absolute, the \" Liquor Vitae \" will re-awaken into action, and begin its work on the atoms chemically.\n\nBrahma-Vishnu -- the creator and the Preserver of Life -- will have transformed himself into Siva the Destroyer.\n\nLastly he writes on p.\n\n387: -- \"The nervous Ether may be poisoned; it may, I mean, have diffused through it, by simple gaseous diffusion, other gases or vapours derived from without; it may derive from within products of substances swallowed and ingested, or gases of decomposition produced during disease in the body itself.\" And the learned gentleman might have added on the same Occult principle: \"That the 'nervous Ether' of one person can be poisoned by the 'nervous Ether' of another person or his auric emanations.\n\nBut see what Paracelsus said of 'Nervous Ether'\": -- \"The Archaeus is of a magnetic nature, and attracts or repels other sympathetic or antipathetic forces belonging to the same plane.\n\nThe less power of resistance for astral influences a person possesses, the more will he be subject to such influences.\n\nThe vital force is not enclosed in man, but radiates (within) and around him like a luminous sphere (aura) and it may be made to act at a distance.\n\n.\n\n.\n\n.\n\nIt may poison the essence of life ( blood ) and cause diseases , or it may purify it after [[Footnote(s)]] ------------------------------------------------- * The conductor in the sense of Upadhi -- a material or physical basis; but, as the second principle of the universal Soul and Vital Force in Nature, it is intelligently guided by the fifth principle thereof.\n\n** And too great an exuberance of it in the nervous system leads as often to disease and death.\n\nIf it were the animal system which generated it , such would not be the case, surely.\n\nHence, the latter emergency shows its independence of the system, and connection with the Sun-Force, as Metcalfe and Professor Hunt explain it.\n\n[[Vol.\n\n1, Page]] 539 THE LIFE-PRINCIPLE.\n\nit has been made impure, and restore the health\" ( Paragranum; \" Life of Paracelsus ,\" by Dr.\n\nF.\n\nHartmann.) That the two, Archaeus and \"nervous Ether,\" are identical, is shown by the English Scientist, who says that the tension of it generally may be too high or too low; that it may be so \"owing to local changes in the nervous matter it invests.\" .\n\n.\n\n.\n\n\"Under sharp excitation it may vibrate as if in a storm and plunge every muscle under cerebral or spinal control into uncontrolled motion --unconscious convulsions.\" This is called nervous excitation, but no one, except Occultists, knows the reason of such nervous perturbation or explains the primary causes of it.\n\nThe \"principle of Life\" may kill when too exuberant , as also when there is too little of it.\n\nBut this principle on the manifested (or our) plane is but the effect and the result of the intelligent action of the \"Host\" -- collectively, Principle -- the manifesting L IFE and L IGHT."


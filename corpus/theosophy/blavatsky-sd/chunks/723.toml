[content]
body = "Even \"the ancient superstitious and credulous classics\" have no word of reference to it in clear and unmistakable terms, and the symbols themselves fail to yield a hint at the existence of such a system.\n\nSuch would be the verdict of all.\n\nBut when it becomes undeniably proven that the claim of the modern Asiatic nations to a Secret Science and an esoteric history of the world, is based on fact; that, though hitherto unknown to the masses and a veiled mystery even to the learned, (because they never had the key to a right understanding of the abundant hints thrown out by the ancient classics), it is still no fairy tale, but an actuality -- then the present work will become but the pioneer of many more such books.\n\nThe statement that hitherto even the keys discovered by some great scholars have proved too rusty for use, and that they were but the silent witnesses that there do exist mysteries behind the veil which are unreachable without a new key -- is borne out by too many proofs to be easily dismissed.\n\nAn instance may be given as an illustration out of the history of Freemasonry.\n\nIn his \"Franc-maconnerie Occulte,\" rightly or wrongly, Ragon, an illustrious and learned Belgian Mason, reproaches the English Masons with having materialized and dishonoured Masonry, once based upon the Ancient Mysteries, by adopting, owing to a mistaken notion of the origin of the craft, the name of Free Masonry and Free Masons.\n\nThe mistake is due, he says, to those who connect Masonry with the building of Solomon's Temple, deriving its origin from it.\n\nHe derides the idea, and says: .\n\n.\n\n\"The Franc Mason (which is not macon libre, or free masonry) knew well when adopting the title, that it was no question of building a wall, but that of being initiated into the ancient Mysteries veiled under the name of Francmaconnerie (Freemasonry); that his work was only to be the continuation or the renovation of the ancient mysteries, and that he was to become a mason after the manner of Apollo or Amphion.\n\nAnd do not we know that the ancient initiated poets, when speaking of the foundation [[Vol.\n\n2, Page]] 796 THE SECRET DOCTRINE.\n\nof a city, meant thereby the establishment of a doctrine?\n\nThus Neptune, the god of reasoning, and Apollo, the god of the hidden things, presented themselves as masons before Laomedon, Priam's father, to help him to build the city of Troy -- that is to say, to establish the Trojan religion.\" ( Maconnerie Orthodoxe, p.\n\n44.) Such veiled sentences with double meaning abound in ancient classical writers.\n\nTherefore, had an attempt been made to show that, e.g., Laomedon was the founder of a branch of archaic mysteries in which the earth-bound material soul (the fourth principle), was personified in Menelaus' faithless wife (the fair Helen), if Ragon had not come to corroborate what we asserted, we might be told that no classical author speaks of it, and that Homer shows Laomedon building a city, not an esoteric worship or M YSTERIES!\n\nAnd who are those left now, save a few Initiates, who understand the language and correct meaning of such symbolical terms?\n\nBut after having pointed to many a misconceived symbol bearing on our thesis, there still remains more than one difficulty to be overcome.\n\nMost important among several such obstacles is that of chronology.\n\nBut this could hardly be helped.\n\nWedged in between theological chronology and that of the geologists, backed by all the materialistic Anthropologists who assign dates to man and nature which fit in with their own theories alone -- what could the writer do except what is being done?\n\nNamely, since theology places the Deluge 2448 B.C ., and the World's Creation only 5890 years ago; and since the accurate researches by the methods of exact Science, have led the geologists and physicists to assign to the incrusted age of our Globe between 10 million and 1,000 million of years* (a trifling difference, verily!): and the Anthropologists to vary their divergence of opinion as to the appearance of man -- between 25,000 and 500,000 of years -- what can one who studies the Occult doctrine do, but come out and bravely present the esoteric calculations before the world?\n\nBut to do this, corroboration by even a few \"historical\" proofs was necessary, though all know the real value of the so-called \"historical evidence.\" For, whether man had appeared on earth 18,000 or 18,000,000 years ago, can make no difference to profane History, since it begins hardly a couple of thousand years before our era, and since, even then, it grapples hopelessly with the clash and din of contradictory and mutually-destroying opinions around it.\n\nNevertheless, in view of the respect the average reader has been brought up in for exact science, even that short Past would remain meaningless, unless the esoteric teachings were corroborated and supported on the spot -- [[Footnote(s)]] ------------------------------------------------- * Vide Sir W.\n\nThomson and Mr.\n\nHuxley.\n\n[[Vol.\n\n2, Page]] 797 THE PROLOGUE TO ESOTERIC TRUTH.\n\nwhenever possible -- by references to historical names of a so-called historical period.\n\nThis is the only guide that can be given to the beginner before he is permitted to start among the (to him) unfamiliar windings of that dark labyrinth called the pre-historic ages.\n\nThis necessity has been complied with.\n\nIt is only hoped that the desire to do so, which has led the writer to be constantly bringing ancient and modern evidence as a corroboration of the Archaic and quite unhistoric Past, will not bring on her the accusation of having sorely jumbled up without order or method the various and widely-separated periods of history and tradition.\n\nBut literary form and method had to be sacrificed to the greater clearness of the general exposition.\n\nTo accomplish the proposed task, the writer had to resort to the rather unusual means of dividing each volume or Book into three Parts; the first of which only is the consecutive, though very fragmentary, history of the Cosmogony and the Evolution of Man on this globe.\n\nBut these two volumes had to serve as a P ROLOGUE, and prepare the reader's mind for those which shall now follow.\n\nIn treating of Cosmogony and then of the Anthropogenesis of mankind, it was necessary to show that no religion, since the very earliest, has ever been entirely based on fiction, as none was the object of special revelation; and that it is dogma alone which has ever been killing primeval truth.\n\nFinally, that no human-born doctrine, no creed, however sanctified by custom and antiquity, can compare in sacredness with the religion of Nature.\n\nThe Key of Wisdom that unlocks the massive gates leading to the arcana of the innermost sanctuaries can be found hidden in her bosom only: and that bosom is in the countries pointed to by the great seer of the past century Emanuel Swedenborg."


[content]
body = "Henceforth all the pagan scriptures were made to yield the same meaning, and all were shown to be demoniacal, and it was and is claimed that truth and fact belong to, and commence only with, Christianity.\n\nEven the Orientalists and Mythologists, some of them no Christians at all but \"infidels,\" or men of science, entered unconsciously to themselves, and by the mere force of association of ideas and habit, into the theological groove.\n\nPurely Brahmanical considerations, based on greed of power and ambition, allowed the masses to remain in ignorance of great truths; and the same causes led the Initiates among the early Christians to remain silent, while those who had never known the truth disfigured the order of things, judging of the hierarchy of \"Angels\" by their exoteric form.\n\nThus as the Asuras had become the rebellious inferior gods fighting the higher ones in popular creeds, so the highest archangel, in truth the Agathodaemon, the eldest benevolent Logos, became with theology the \"Adversary\" or Satan.\n\nBut is this warranted by the correct interpretation of any old Scripture?\n\nThe answer is, most certainly not.\n\nAs the Mazdean Scriptures of the [[Footnote(s)]] ------------------------------------------------- * The same idea is found in the first four chapters of Genesis, with their \"Lord\" and \"God,\" which are the Elohim and the Androgynous Eloha .\n\n[[Vol.\n\n2, Page]] 61 WHAT THE GNOSTICS SAY.\n\nZend-Avesta, the Vendidad and others correct and expose the later cunning shuffling of the gods in the Hindu Pantheon, and restore through A HURA the Asuras to their legitimate place in theogony, so the recent discoveries of the Chaldean tablets vindicate the good name of the first divine Emanations.\n\nThis is easily proved.\n\nChristian Angelology is directly and solely derived from that of the Pharisees, who brought their tenets from Babylonia.\n\nThe Sadducees, the real guardians of the Laws of Moses, knew not of, and rejected, any angels, opposing even the immortality of the human Soul (not impersonal Spirit).\n\nIn the Bible the only \"Angels\" spoken of are the \"Sons of God\" mentioned in Genesis vi.\n\n(who are now regarded as the Nephilim, the Fallen Angels), and several angels in human form, the \"Messengers\" of the Jewish God, whose own rank needs a closer analysis than heretofore given.\n\n( Vide Supra, Stanza I., sub-sections 2, 3, et seq., where it is shown that the early Akkadians called Ea , Wisdom, that which was disfigured by the later Chaldees and Semites into Tismat, Tisalat and the Thallath of Berosus, the female Sea Dragon, now Satan.) Truly -- \"How art thou fallen (by the hand of man), O bright star and son of the morning\"!\n\nNow what do the Babylonian accounts of \"Creation,\" as found on the Assyrian fragments of tiles, tell us; those very accounts upon which the Pharisees built their angelology?\n\nBut compare Mr.\n\nG.\n\nSmith's \" Assyrian Discoveries, \" p.\n\n398, and his \" Chaldean Account of Genesis, \" p.\n\n107.\n\nThe \" Tablet with the story of the Seven Wicked Gods or Spirits, \" has the following account -- we print the important passages in italics: -- 1.\n\nIn the first days the evil Gods, 2.\n\nthe angels, who were in rebellion, who in the lower part of heaven 3 .\n\nhad been created, 4.\n\nthey caused their evil work 5.\n\ndevising with wicked heads .\n\n.\n\n.\n\n.\n\netc.\n\nThus we are shown, as plainly as can be, on a fragment which remained unbroken, so that there can be no dubious reading, that the \"rebellious angels\" had been created in the lower part of heaven, i.e., that they belonged and do belong to a material plane of evolution, although as it is not the plane of which we are made cognizant through our senses, it remains generally invisible to us, and is thus regarded as subjective.\n\nWere the Gnostics so wrong, after this, in affirming that this our visible world, and especially the Earth, had been created by lower angels, the inferior Elohim, of which, as they taught, the God of Israel was one.\n\nThese Gnostics were nearer in time to the records of the Archaic Secret Doctrine, and therefore ought to be allowed to have known better than non-initiated Christians, who took upon themselves, hundreds of years [[Vol.\n\n2, Page]] 62 THE SECRET DOCTRINE.\n\nlater, to remodel and correct what was said.\n\nBut let us see what the same Tablet says further on: -- 7.\n\nThere were seven of them (the wicked gods) .\n\n.\n\n.\n\n.\n\n(then follows the description of these, the fourth being a \"serpent,\" the phallic symbol of the fourth Race in human Evolution).\n\n15.\n\nThe seven of them, messengers of the God Anu, their king.\n\nNow Anu belongs to the Chaldean trinity, and is identical with Sin, the \"Moon,\" in one aspect.\n\nAnd the Moon in the Hebrew Kabala is the Argha of the seed of all material life, and is still more closely connected, kabalistically, with Jehovah, who is double-sexed as Anu is.\n\nThey are both represented in Esotericism and viewed from a dual aspect: male or spiritual, female or material, or Spirit and Matter, the two antagonistic principles.\n\nHence the \"Messengers of Anu,\" (who is Sin, the \"Moon,\") are shown, in verses 28 to 41, as being finally overpowered by the same Sin with the help of Bel (the Sun) and Ishtar (Venus).\n\nThis is regarded as a contradiction by the Assyriologists, but is simply metaphysics in the esoteric teaching.\n\nThere is more than one interpretation, for there are seven keys to the mystery of the Fall.\n\nMoreover there are two \"Falls\" in Theology: the rebellion of the Archangels and their \"Fall,\" and the \"Fall\" of Adam and Eve.\n\nThus the lower as well as the higher Hierarchies are charged with a supposed crime.\n\nThe word \"supposed\" is the true and correct term, for in both cases it is founded on misconception.\n\nBoth are considered in Occultism as Karmic effects, and both belong to the law of Evolution: intellectual and spiritual on the one hand, physical and psychic on the other.\n\nThe \"Fall\" is a universal allegory.\n\nIt sets forth at one end of the ladder of Evolution the \"rebellion,\" i.e., the action of differentiating intellection or consciousness on its various planes, seeking union with matter; and at the other, the lower end, the rebellion of matter against Spirit, or of action against spiritual inertia.\n\nAnd here lies the germ of an error which has had such disastrous effects on the intelligence of civilized societies for over 1,800 years."


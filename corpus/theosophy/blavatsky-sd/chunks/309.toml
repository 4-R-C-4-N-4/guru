[content]
body = "They say that what is called collectively Monads by Leibnitz -- roughly viewed, and leaving every subdivision out of calculation, for the present** -- may be separated into three distinct Hosts, which, counted from the highest planes, are, firstly, \"gods,\" or conscious, spiritual Egos; the intelligent architects, who work after the plan in the Divine Mind.\n\nThen come the Elementals, or Monads , who form collectively and unconsciously the grand Universal Mirrors of everything connected with their respective realms.\n\nLastly, the atoms, or material molecules, which are informed in their turn by their apperceptive monads, just as every cell in a human body is so informed.\n\n(See the closing pages of Book I.) There are shoals of such informed atoms which, in their turn, inform the molecules; an infinitude of monads, or Elementals proper, and countless spiritual Forces -- Monadless , for they are pure incorporealities,*** except under certain laws, when they assume a form -- not necessarily human.\n\nWhence the substance that clothes them -- the apparent organism they evolve around their centres?\n\nThe Formless (\"Arupa\") Radiations, existing in the harmony of Universal Will, and being what we term the collective or the aggregate of Cosmic Will on the plane of the subjective Universe, unite together an infinitude of monads -- each the mirror of its own Universe -- and thus individualize [[Footnote(s)]] ------------------------------------------------- * Leibnitz, like Aristotle, calls the created or emanated monads (the Elementals issued from Cosmic Spirits or Gods) -- Entelechies , [[ Entelecheia ]] -- and \"incorporeal automata.\n\n\" (§ 18, Monadologie.\n\n) ** These three \"rough divisions\" correspond to spirit , mind (or soul), and body , in the human constitution.\n\n*** Brother C.\n\nH.\n\nA.\n\nBjerregaard, in his lecture (already mentioned), warns his audience not to regard the Sephiroth too much as individualities , but to avoid at the same time seeing in them abstractions.\n\n\"We shall never arrive at the truth,\" he says, \"much less the power of associating with those celestials , until we return to the simplicity and fearlessness of the primitive ages, when men mixed freely with the gods, and the gods descended among men and guided them in truth and holiness\" (No.\n\n10, Path ) .\n\n.\n\n.\n\n.\n\n\"There are several designations for 'angels' in the Bible which clearly show that beings like the Elementals of the Kabala and the monads of Leibnitz, must be understood by that term rather than that which is commonly understood.\n\nThey are called 'morning stars,' 'flaming fires,' 'the mighty ones,' and St.\n\nPaul sees them in his cosmogonic vision as 'Principalities and Powers.' Such names as these preclude the idea of personality, and we find ourselves compelled to think of them as impersonal Existences .\n\n.\n\n.\n\nas an influence , a spiritual substance, or conscious Force.\n\n\" ( Path , No.\n\n11, p.\n\n322.) [[Vol.\n\n1, Page]] 633 THE WHEELS OF LIFE.\n\nfor the time being an independent mind, omniscient and universal; and by the same process of magnetic aggregation they create for themselves objective, visible bodies, out of the interstellar atoms.\n\nFor atoms and Monads, associated or dissociated, simple or complex, are, from the moment of the first differentiation, but the principles , corporeal, psychic and Spiritual, of the \"Gods,\" -- themselves the Radiations of primordial nature.\n\nThus, to the eye of the Seer, the higher Planetary Powers appear under two aspects: the subjective -- as influences , and the objective -- as mystic FORMS, which, under Karmic law, become a Presence , Spirit and Matter being One, as repeatedly stated.\n\nSpirit is matter on the seventh plane; matter is Spirit -- on the lowest point of its cyclic activity; and both -- are M AYA.\n\nAtoms are called \"Vibrations\" in Occultism; also \"Sound\" -- collectively.\n\nThis does not interfere with Mr.\n\nTyndall's scientific discovery.\n\nHe traced, on the lower rung of the ladder of monadic being, the whole course of the atmospheric vibrations -- and this constitutes the objective part of the process in nature.\n\nHe has traced and recorded the rapidity of their motion and transmission; the force of their impact; their setting up vibrations in the tympanum and their transmission of these to the stolithes, etc., etc., till the vibration of the auditory nerve commences -- and a new phenomenon now takes place: the subjective side of the process or the sensation of Sound.\n\nDoes he perceive or see it?\n\nNo; for his speciality is to discover the behaviour of matter.\n\nBut why should not a psychic see it, a spiritual seer, whose inner Eye is opened, and who can see through the veil of matter?\n\nThe waves and undulations of Science are all produced by atoms propelling their molecules into activity from within.\n\nAtoms fill the immensity of Space, and by their continuous vibration are that MOTION which keeps the wheels of Life perpetually going.\n\nIt is that inner work that produces the natural phenomena called the correlation of Forces.\n\nOnly, at the origin of every such \"force,\" there stands the conscious guiding noumenon thereof -- Angel or God, Spirit or Demon -- ruling powers, yet the same.\n\nAs described by Seers -- those who can see the motion of the interstellar shoals, and follow them in their evolution clairvoyantly -- they are dazzling, like specks of virgin snow in radiant sunlight.\n\nTheir velocity is swifter than thought, quicker than any mortal physical eye could follow, and, as well as can be judged from the tremendous rapidity of their course, the motion is circular.\n\n.\n\n.\n\n.\n\n.\n\nStanding on an open plain, on a mountain summit especially, and gazing into the vast vault above and the spacial infinitudes around, the whole atmosphere seems ablaze with them, the air soaked through with these dazzling coruscations.\n\nAt times, the intensity of their motion produces flashes [[Vol.\n\n1, Page]] 634 THE SECRET DOCTRINE.\n\nlike the Northern lights during the Aurora Borealis.\n\nThe sight is so marvellous, that, as the Seer gazes into this inner world, and feels the scintillating points shoot past him, he is filled with awe at the thought of other, still greater mysteries, that lie beyond, and within, this radiant ocean.\n\n.\n\n.\n\n.\n\n.\n\nHowever imperfect and incomplete this explanation on \"Gods, Monads and Atoms,\" it is hoped that some students and theosophists, at least, will feel that there may be indeed a close relation between materialistic Science, and Occultism, which is the complement and missing soul of the former.\n\n------- [[This page continued in next section]]"


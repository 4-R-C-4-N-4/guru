[content]
body = "As Hermes says, \"Knowledge differs much from sense; for sense is of things that surmount it, but Knowledge (gyi) is the end of sense\" -- i.e., of the illusion of our physical brain and its intellect; thus emphasizing the contrast between the laboriously acquired knowledge of the senses and mind (manas), and the intuitive omniscience of the Spiritual divine Soul -- Buddhi.\n\nWhatever may be the destiny of these actual writings in a remote future, we hope to have proven so far the following facts: (1) The Secret Doctrine teaches no Atheism, except in the Hindu sense of the word nastika, or the rejection of idols, including every anthropomorphic god.\n\nIn this sense every Occultist is a Nastika .\n\n(2) It admits a Logos or a collective \"Creator\" of the Universe; a Demi-urgos -- in the sense implied when one speaks of an \"Architect\" as the \"Creator\" of an edifice, whereas that Architect has never touched one stone of it, but, while furnishing the plan, left all the manual labour to the masons; in our case the plan was furnished by the Ideation of the Universe, and the constructive labour was left to the Hosts of intelligent Powers and Forces.\n\nBut that Demiurgos is no [[Vol.\n\n1, Page]] 280 THE SECRET DOCTRINE.\n\npersonal deity, -- i.e., an imperfect extra-cosmic god , -- but only the aggregate of the Dhyan-Chohans and the other forces.\n\nAs to the latter -- (3) They are dual in their character; being composed of ( a ) the irrational brute energy, inherent in matter, and ( b ) the intelligent soul or cosmic consciousness which directs and guides that energy, and which is the Dhyan-Chohanic thought reflecting the Ideation of the Universal mind.\n\nThis results in a perpetual series of physical manifestations and moral effects on Earth, during manvantaric periods, the whole being subservient to Karma.\n\nAs that process is not always perfect; and since, however many proofs it may exhibit of a guiding intelligence behind the veil, it still shows gaps and flaws, and even results very often in evident failures -- therefore, neither the collective Host (Demiurgos), nor any of the working powers individually, are proper subjects for divine honours or worship.\n\nAll are entitled to the grateful reverence of Humanity, however, and man ought to be ever striving to help the divine evolution of Ideas, by becoming to the best of his ability a co-worker with nature in the cyclic task.\n\nThe ever unknowable and incognizable Karana alone, the Causeless Cause of all causes, should have its shrine and altar on the holy and ever untrodden ground of our heart -- invisible, intangible, unmentioned, save through \"the still small voice\" of our spiritual consciousness.\n\nThose who worship before it, ought to do so in the silence and the sanctified solitude of their Souls*; making their spirit the sole mediator between them and the Universal Spirit, their good actions the only priests, and their sinful intentions the only visible and objective sacrificial victims to the Presence.\n\n( See Part II., \" On the Hidden Deity.\n\n\") (4) Matter is Eternal.\n\nIt is the Upadhi (the physical basis) for the One infinite Universal Mind to build thereon its ideations.\n\nTherefore, the Esotericists maintain that there is no inorganic or dead matter in nature, the distinction between the two made by Science being as unfounded as it is arbitrary and devoid of reason.\n\n[[Footnote(s) -------------------------------------------------]] * \"When thou prayest, thou shalt not be as the hypocrites are .\n\n.\n\n.\n\nbut enter into thine inner chamber and having shut thy door, pray to thy Father which is in secret .\" Matt.\n\nvi.\n\n).\n\nOur Father is within us \"in Secret,\" our 7th principle, in the \"inner chamber\" of our Soul perception.\n\n\"The Kingdom of Heaven\" and of God \" is within us \" says Jesus, not outside.\n\nWhy are Christians so absolutely blind to the self-evident meaning of the words of wisdom they delight in mechanically repeating?\n\n[[Vol.\n\n1, Page]] 281 MATTER IS THE SHADOW OF SPIRIT.\n\nWhatever Science may think, however -- and exact Science is a fickle dame, as we all know by experience -- Occultism knows and teaches differently, from time immemorial -- from Manu and Hermes down to Paracelsus and his successors.\n\nThus Hermes, the thrice great Trismegistus, says: \"Oh, my son, matter becomes; formerly it was; for matter is the vehicle of becoming.\"* Becoming is the mode of activity of the uncreate deity.\n\nHaving been endowed with the germs of becoming, matter (objective) is brought into birth, for the creative force fashions it according to the ideal forms.\n\nMatter not yet engendered had no form; it becomes when it is put into operation.\" ( The Definitions of Asclepios, p.\n\n134, \"Virgin of the World.\") \"Everything is the product of one universal creative effort.\n\n.\n\n.\n\n.\n\nThere is nothing dead, in Nature.\n\nEverything is organic and living, and therefore the whole world appears to be a living organism.\" (Paracelsus, \" Philosophia ad Athenienes ,\" F.\n\nHartmann's translations, p.\n\n44.) (5.) The Universe was evolved out of its ideal plan, upheld through Eternity in the unconsciousness of that which the Vedantins call Parabrahm.\n\nThis is practically identical with the conclusions of the highest Western Philosophy -- \"the innate, eternal, and self-existing Ideas\" of Plato, now reflected by Von Hartmann.\n\nThe \"unknowable\" of Herbert Spencer bears only a faint resemblance to that transcendental Reality believed in by Occultists, often appearing merely a personification of a \" force behind phenomena\" -- an infinite and eternal Energy [[Footnote(s) -------------------------------------------------]] * To this the late Mrs.\n\n(Dr.) Kingsford, the able translator and compiler of the Hermetic Fragments (see \" The Virgin of the World \") remarks in a foot-note; \"Dr.\n\nMenard observes that in Greek the same word signifies to be born and to become.\n\nThe idea here is that the material of the world is in its essence eternal, but that before creation or 'becoming' it is in a passive and motionless condition.\n\nThus it 'was' before being put into operation; now it 'becomes,' that is, it is mobile and progressive.\" And she adds the purely Vedantic doctrine of the Hermetic philosophy that \"Creation is thus the period of activity (Manvantara) of God, who, according to Hermetic thought (or which, according to the Vedantin) has two modes -- Activity or Existence, God evolved ( Deus explicitus ); and Passivity of Being (Pralaya) God involved ( Deus implicitus ) .\n\nBoth modes are perfect and complete, as are the waking and sleeping states of man.\n\nFichte, the German philosopher, distinguished Being (Seyn) as One, which we know only through existence (Dasein) as the Manifold.\n\nThis view is thoroughly Hermetic."


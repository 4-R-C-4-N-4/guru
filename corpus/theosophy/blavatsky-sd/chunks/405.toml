[content]
body = "The theory taught in the Secret Doctrine, and now expounded, is the only one, which can -- without falling into the absurdity of a \"miraculous\" man created out of the dust of the Earth, or the still greater fallacy of man evolving from a pinch of lime-salt, (the ex-protoplasmic moneron) -- account for his appearance on Earth.\n\nAnalogy is the guiding law in Nature, the only true Ariadne's thread that can lead us, through the inextricable paths of her domain, toward her primal and final mysteries.\n\nNature, as a creative potency, is infinite, and no generation of physical scientists can ever boast of having exhausted the list of her ways and methods, however uniform the laws upon which she proceeds.\n\nIf we can conceive of a ball of Fire-mist becoming gradually -- as it rolls through aeons of time in the interstellar spaces -- a planet, a self-luminous globe, to settle into a man-bearing world or Earth, thus having passed from a soft plastic body into a rock-bound globe; and if we see on it everything evolving from the non-nucleated jelly-speck that becomes the sarcode* of the moneron, then passes from its protistic state** into the form of an animal, to grow into a gigantic reptilian monster of the Mesozoic times; then dwindles again into the (comparatively) dwarfish crocodile, now confined solely to tropical [[Footnote(s)]] ------------------------------------------------- * Or what is more generally known as Protoplasm.\n\nThis substance received its name of \" Sarcode \" from Prof.\n\nDujardin Beaumetz far earlier.\n\n** The Monera are indeed Protista.\n\nThey are neither animals \"nor plants,\" writes Haeckel; \" .\n\n.\n\n.\n\nthe whole body of the Moneron represents nothing more than a single thoroughly homogeneous particle of albumen in a firmly adhesive condition.\" (\" Journal of Microscopical Science, \" Jan., 1869, p .\n\n28.) [[Vol.\n\n2, Page]] 154 THE SECRET DOCTRINE.\n\nregions, and the universally common lizard* -- how can man alone escape the general law?\n\n\"There were giants on earth in those days,\" says Genesis, repeating the statement of all the other Eastern Scriptures; and the Titans are founded on anthropological and physiological fact.\n\nAnd, as the hard-shelled crustacean was once upon a time a jelly-speck, \"a thoroughly homogeneous particle of albumen in a firmly adhesive condition,\" so was the outward covering of primitive man, his early \"coat of skin,\" plus an immortal spiritual monad, and a psychic temporary form and body within that shell.\n\nThe modern, hard, muscular man almost impervious to any climate, was, perhaps, some 25,000,000 years ago, just what the Haeckelian Moneron is, strictly \"an organism without organs,\" an entirely homogeneous substance with a structureless albumen body within, and a human form only outwardly.\n\nNo man of science has the right, in this century, to find the figures of the Brahmins preposterous in the question of Chronology; for their own calculations often exceed by far the claims made by esoteric science.\n\nThis may easily be shown.\n\nHelmholtz calculated that the cooling of our Earth from a temperature of 2,000 [[degrees]] to 200' Cent.\n\nmust have occupied a period of no less than 350,000,000 years.\n\nWestern science (including geology) seems generally to allow our globe an age of about 500,000,000 years altogether.\n\nSir W.\n\nThomson, however, limits the appearance of the earliest vegetable life to 100,000,000 years ago -- a statement respectfully contradicted by the archaic records.\n\nSpeculations, furthermore, vary daily in the domains of science.\n\nMeanwhile, some geologists are very much opposed to such limitation.\n\n\"Volger .\n\n.\n\n.\n\n.\n\ncalculates, that the time requisite for the deposit of the strata known to us must at least have amounted to 648 millions of years .\n\n.\n\n.\n\n.\n\n\" Both time and space are infinite and eternal.\n\n\"The Earth, as a material existence, is indeed infinite; the changes only which it has undergone can be determined by finite periods of time\" ( Burmeister ) .\n\n\"We must therefore assume that the starry heaven is not merely in space, what no astronomer doubts, but also in time, without beginning or end; that it never was created, and is imperishable.\" (See Czolbe ) .** Czolbe repeats exactly what the Occultists say.\n\nBut the Aryan Occultists, we may be told, knew nothing of these later speculations.\n\n\"They were even ignorant of the globular form of our earth.\" [[Footnote(s)]] ------------------------------------------------- * Behold the Iguanodon of the Mesozoic ages -- the monster 100 feet long -- now transformed into the small Iguana lizard of South America.\n\nPopular traditions about giants in days of old, and their mention in every mythology, including the Bible, may some day be shown to be founded on fact.\n\nIn nature, the logic of analogy alone ought to make us accept these traditions as scientific verities.\n\n** \" Force and Matter \"; by L.\n\nBuchner, edited by J.\n\nF.\n\nCollingwood, F.R.S.L ., p.\n\n61.\n\n[[Vol.\n\n2, Page]] 155 THE SOLAR SYSTEM IN THE PURANAS.\n\n(Coleman.) To this the Vishnu Purana contains a reply, which has forced certain Orientalists to open their eyes very widely.\n\n.\n\n.\n\n.\n\n\"The Sun is stationed, for all time, in the middle of the day, and over against midnight, in all the Dwipas (continents), Maitreya!\n\nBut the rising and the setting of the Sun being perpetually opposite to each other -- and in the same way, all the cardinal points, and so the cross-points, Maitreya; people speak of the rising of the Sun where they see it; and where the Sun disappears, there, to them, is his setting.\n\nOf the Sun, which is always in one and the same place, there is neither setting nor rising, for what is called rising and setting are only the seeing and the not seeing the Sun.\" ( Vishnu Purana, Book IL, ch.\n\nviii.\n\n) To this Fitzedward Hall remarks, \"The Heliocentricism taught in this passage is remarkable.\n\nIt is contradicted, however, a little further on.\" Contradicted purposely, because it was a secret temple-teaching.\n\nMartin Haug remarked the same teaching in another passage.\n\nIt is useless to calumniate the Aryans any longer.\n\nTo return to the Chronology of the geologists and anthropologists.\n\nWe are afraid Science has no reasonable grounds on which she could oppose the views of the Occultists in this direction.\n\nExcept that \"of man, the highest organic being of creation, not a trace was found in the primary strata; only in the uppermost, the so-called alluvial layer,\" is all that can be urged, so far."


[content]
body = "Thus, in the seventeenth chapter mentioned by Maspero, one finds (1) Osiris saying he is Toum (the creative force in nature, giving form to all Beings, spirits and men), self-generated and self-existent, issued from Noun , the celestial river, called Father-mother of the gods, the primordial deity, which is chaos or the Deep , impregnated by the unseen spirit.\n\n(2) He has found Shoo (solar force) on the staircase in the City of the Eight (the two cubes of good and Evil), and he has annihilated the evil principles in Noun (chaos) the children of Rebellion.\n\n(3) He is the Fire and Water, i.e.\n\n, Noun the primordial parent, and he created the gods out of his limbs -- 14 gods (twice seven) seven dark and seven light gods (the seven Spirits of the Presence of the Christians and the Seven dark Evil Spirits).\n\n(4) He is the Law of existence and Being (v.\n\n10), the Bennoo (or phoenix, the bird of resurrection in Eternity), in whom night follows the day, and day the night -- an allusion to the periodical cycles of cosmic resurrection and human re-incarnation; for what can this mean?\n\n\"The wayfarer who crosses millions of years, in the name of One, and the great green (primordial water or Chaos) the name of the other\" (v.\n\n17), one begetting millions of years in succession, the other engulfing them, to restore them back.\n\n(5) He speaks of the Seven Luminous ones who follow their Lord, who confers justice (Osiris in Amenti ) .\n\nAll this is now shown to have been the source and origin of Christian dogmas.\n\nThat which the Jews had from Egypt, through Moses and other initiates, was confused and distorted enough in later days; and that which the Church got from both, is still more misinterpreted.\n\nYet their system is now proven identical in this special department of symbology -- the key, namely, to the mysteries of astronomy as connected with those of generation and conception -- with those ideas of ancient religions, the theology of which has developed the phallic element.\n\nThe Jewish system of sacred measures applied to religious symbols is the same, [[Vol.\n\n1, Page]] 313 THE JEWS, AND THEIR SYSTEM.\n\nso far as geometrical and numerical combinations go, as those of Chaldea, Greece, and Egypt, having been adopted by the Jews during the centuries of their slavery and captivity with those nations.* What was that system?\n\nIt is the intimate conviction of the author of \"The Source of Measures\" that \"the Mosaic Books were intended, by a mode of art speech, to set forth a geometrical and numerical system of exact science, which should serve as an origin of measures.\" Piazzi Smyth believes likewise.\n\nThis system and these measures are found by some scholars to be identical with those used in the construction of the great pyramid -- but this is only partially so.\n\n\"The foundation of these measures was the Parker ratio,\" says Mr.\n\nR.\n\nSkinner, in \"The Source of Measures.\" The author of this very extraordinary work has found it out, he says, in the use of the integral ratio in numbers of diameter to circumference of a circle, discovered by John Parker, of New York.\n\nThis ratio is 6,561 for diameter, and 20,612 for circumference.\n\nFurthermore, that this geometrical ratio was the very ancient (and probably) the divine origin of what have now become through exoteric handling and practical application the British linear measures, \"the underlying unit of which, viz., the inch , was likewise the base of one of the royal Egyptian cubits and of the Roman foot.\n\nHe also found out that there was a modified form of the ratio, viz., 113-355 (explained in his work); and that while this last ratio pointed through its origin to the exact integral pi, or to 6,561 to 20,612, it also served as a base for astronomical calculations.\n\nThe author discovered that a system of exact science , geometrical , numerical , and astronomical , founded on these ratios and to be found in use in the construction of the Great Egyptian Pyramid, was in part the burden of this language as contained in, and concealed under, the verbiage of the Hebrew text of the Bible.\n\nThe inch and the two-foot rule of 24 inches interpreted for use through the elements of the circle ( see first pages of Book I.\n\n) and the ratios mentioned, were found to be at the basis or foundation of this natural and Egyptian and Hebrew system of science, while, moreover, it seems evident enough that the system itself was looked upon as of divine origin and of divine revela- [[Footnote(s)]] ------------------------------------------------- * As we said in Isis ( Vol.\n\nII.\n\np .\n\n438-9), \"To the present moment, in spite of all controversies and researches, History and Science remain as much as ever in the dark as to the origin of the Jews.\n\nThey may be as well the exiled Tchandalas of old India, the 'bricklayers' mentioned by Vina-Svata, Veda-Vyasa and Manu, as the Phoenicians of Herodotus, or the Hyk-Sos of Josephus, or descendants of Pali shepherds, or a mixture of all these.\n\nThe Bible names the Tyrians as a kindred people, and claims dominion over them.\n\n.\n\n.\n\n.\n\nYet whatever they may have been, they became a hybrid people, not long after Moses, as the Bible shows them freely intermarrying not alone with the Canaanites, but with every other nation or race they came in contact with.\" [[Vol.\n\n1, Page]] 314 THE SECRET DOCTRINE.\n\ntion.\n\n.\n\n.\n\n.\" But let us see what is said by the opponents of Prof.\n\nPiazzi Smyth's measurements of the Pyramid.\n\nMr.\n\nPetrie seems to deny them, and to have made short work altogether of Piazzi Smyth's calculations in their Biblical connection.\n\nSo does Mr.\n\nProctor, the champion \"Coincidentalist\" for many years past in every question of ancient arts and sciences.\n\nSpeaking of \"the multitude of relations independent of the Pyramid, which have turned up while the Pyramidalists have been endeavouring to connect the pyramid with the solar system .\n\n.\n\n.\n\n.\n\nthese coincidences,\" he says, \"are altogether more curious than any coincidence between the Pyramid and astronomical numbers: the former are as close and remarkable as they are real\" ( i.e.\n\n, those \"coincidences\" that would remain if even the pyramid had no existence); \"the latter which are only imaginary (?) have only been established by the process which schoolboys call 'fudging,' and now new measures have left the work to be done all over again\" ( Petrie ' s letter to the Academy , Dec.\n\n17, 1881.) To this Mr."


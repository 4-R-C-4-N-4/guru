body = "For, verse 1,152 of the \"Greater Holy Assembly\" (Kabala) says -- \"We have learned that there were ten (companions) who entered into the Sod, ('mysterious assembly or mystery'), and that seven only came forth\"*** ( i.e.\n\n, 10 for the unmanifested, 7 for the manifested Universe.) 1,158.\n\n\"And when Rabbi Shimeon revealed the Arcana there were found none present there save those (seven companions) .\n\n.\n\n.\n\n.\n\n1,159.\n\nAnd Rabbi Shimeon called them the seven eyes of Tetragrammaton, like as it is written, Zach.\n\niii., 9, 'These are the seven eyes (or principles) of Tetragrammaton,\" ' - - i.e.\n\n, the four-fold Heavenly man, or pure spirit, is resolved into Septenary man, pure matter and Spirit.\n\nThus the Tetrad is Microprosopus, and the latter is the male-female Chochmah-Binah, the 2d and 3d Sephiroth.\n\nThe Tetragrammaton is the very essence of number Seven, in its terrestrial significance.\n\nSeven stands between four and nine -- the basis and foundation (astrally) of our physical world and man, in the kingdom of Malkuth.\n\nFor Christians and believers, this reference to Zaccharias and [[Footnote(s)]] ------------------------------------------------- * [[Continued from previous page]] For, this \"Tree of Life\" is also the \"tree of knowledge of good and evil,\" whose chief mystery is that of human procreation.\n\nIt is a mistake to regard the Kabala as explaining the mysteries of Kosmos or Nature; it explains and unveils only a few allegories in the Bible, and is more esoteric than is the latter.\n\n* Simplified in the English Bible to: \"Is the Lord (!\n\n!) among us, or not?\" (See Exodus xvii.\n\n7.) ** See Kabala Denudata, by S.\n\nLiddell MacGregor Mathers, F.T.S ., p.\n\n121.\n\n*** Translators often render the word \"companion\" (angel, also adept) by \" Rabbi, \" as the Rishis are called gurus.\n\nThe \"Zohar\" is, if possible, more occult than the Books of Moses; to read the \"Book of Concealed Mystery\" one requires the keys furnished by the genuine \"Chaldean Book of Numbers,\" which is not extant.\n\n[[Vol.\n\n2, Page]] 627 THE NUMBER SEVEN IN CHEMISTRY.\n\nespecially to the Epistle of Peter (I P.\n\nii.\n\n2-5) ought to be conclusive.\n\nIn the old symbolism, man, chiefly the inner Spiritual man is called \"a stone.\" Christ is the corner-stone, and Peter refers to all men as \"lively\" (living) stones.\n\nTherefore a \"stone with seven eyes\" on it can only mean what we say, i.e., a man whose constitution or (\"principles,\") is septenary.\n\nTo demonstrate more clearly the seven in Nature, it may be added that not only does the number seven govern the periodicity of the phenomena of life, but that it is also found dominating the series of chemical elements, and equally paramount in the world of sound and in that of colour as revealed to us by the spectroscope.\n\nThis number is the factor, sine qua non, in the production of occult astral phenomena.\n\nThus, if the chemical elements are arranged in groups according to their atomic weights, they will be found to constitute a series of groups of seven; the first, second, etc., members of each group bearing a close analogy in all their properties to the corresponding members of the next group.\n\nThe following table, copied from Hellenbach's Magie der Zahlen, exhibits this law and fully warrants the conclusion he draws in the following words: \"We thus see that chemical variety, so far as we can grasp its inner nature, depends upon numerical relations, and we have further found in this variety a ruling law for which we can assign no cause; we find a law of periodicity governed by the number seven .\" The eighth column in this list is, as it were, the octave of the first, containing elements almost identical in chemical and other properties with those in the first; a phenomenon which accentuates the septenary law of periodicity.\n\nFor further details the reader is referred to Hellenbach's [[Vol.\n\n2, Page]] 628 THE SECRET DOCTRINE.\n\nwork, where it is also shown that this classification is confirmed by the spectroscopic peculiarities of the elements.\n\nIt is needless to refer in detail to the number of vibrations constituting the notes of the musical scale; they are strictly analogous to the scale of chemical elements, and also to the scale of colour as unfolded by the spectroscope, although in the latter case we deal with only one octave, while both in music and chemistry we find a series of seven octaves represented theoretically, of which six are fairly complete and in ordinary use in both sciences.\n\nThus, to quote Hellenbach: -- \"It has been established that, from the standpoint of phenomenal law, upon which all our knowledge rests, the vibrations of sound and light increase regularly, that they divide themselves into seven columns, and that the successive numbers in each column are closely allied; i.e.\n\n, that they exhibit a close relationship which not only is expressed in the figures themselves, but also is practically confirmed in chemistry as in music, in the latter of which the ear confirms the verdict of the figures.\n\n.\n\n.\n\n.\n\n.\n\n.\n\nThe fact that this periodicity and variety is governed by the number seven is undeniable, and it far surpasses the limits of mere chance, and must be assumed to have an adequate cause, which cause must be discovered.\" Verily, then, as Rabbi Abbas said: \"We are six lights which shine forth from a seventh ( light ); thou (Tetragrammaton) art the seventh light (the origin) of us all;\" (V.\n\n1,160) and -- \"For assuredly there is no stability in those six, save what they derive from the seventh.\n\nFor ALL THINGS DEPEND FROM THE SEVENTH.\" (V.\n\n1,161.\n\nKabala, \"The Greater Holy Assembly.\") The (ancient and modern) Western American Zuni Indians seem to have entertained similar views.\n\nTheir present-day customs, their traditions and records, all point to the fact that, from time immemorial, their institutions -- political, social and religious -- were (and still are) shaped according to the septenary principle.\n\nThus all their ancient towns and villages were built in clusters of six, around a seventh.\n\nIt is always a group of seven, or of thirteen, and always the six surround the seventh.\n\nAgain, their sacerdotal hierarchy is composed of six \"Priests of the House\" seemingly synthesized in the seventh, who is a woman, the \" P RIESTESS M OTHER.\" Compare this with the \"seven great officiating priests\" spoken of in Anugita, the name given to the \"seven senses,\" exoterically, and to the seven human principles, esoterically.\n\nWhence this identity of symbolism?"


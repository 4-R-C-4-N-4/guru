[content]
body = "Divine Kings descended and taught men sciences and arts, for man could live no longer in the first land (Adi-Varsha, the Eden of the first Races), which had turned into a white frozen corpse.\n\n\" The above is suggestive.\n\nWe will see what can be inferred from this brief statement.\n\nSome may incline to think that there is more in it than is apparent at first sight.\n\n------- [[Footnote(s)]] ------------------------------------------------- * The Commentary explains that the apes are the only species, among the animals, which has gradually and with every generation and variety tended more and more to return to the original type of its male forefather -- the dark gigantic Lemurian and Atlantean."


[content]
body = "As various writers have shown, and as brutally stated in Hargrave Jennings' Phallicism (p.\n\n67) \" We know from the Jewish records that the Ark contained a table of stone .\n\n.\n\n.\n\n.\n\nthat stone was phallic, and yet identical with the sacred name Jehovah .\n\n.\n\n.\n\nwhich written in unpointed Hebrew with four letters, is J-E-V-E or JHVH (the H being merely an aspirate and the same as E).\n\nThis process leaves us the two letters I and V (in another form U); then if we place the I in the U we have the 'Holy of Holies'; we also have the Lingha and Yoni and Argha of the Hindus, the Isvara and 'supreme Lord'; and here we have the whole secret of its mystic and arc-celestial import, confirmed in itself by being identical with the Linyoni (?) of the Ark of the Covenant.\" The Biblical Jews of to-day do not date from Moses but from David -- even admitting the identity of the old genuine with the later and remodelled Mosaic scrolls.\n\nBefore that time their nationality is lost in the mists of prehistoric darkness, the veil from which is now withdrawn as much as we have space to do so.\n\nIt is only to the days of the Babylonian captivity that the Old Testament may be referred by the most lenient criticism, as the approximately correct views that were current about the days of Moses.\n\nEven such fanatical Christians and worshippers of Jehovah as the Rev.\n\nMr.\n\nHorne, have to admit the numerous changes and alterations made by the later compilers of the \"Book of God,\" since it was found by Hilkiah ( See \" Introduction to the Old Testament, \" and also Bishop Colenso ' s \" Elohistic and Jehovistic writers \") ; and that \" the Pentateuch arose out of the primitive or older documents, by means of a SUPPLEMENTARY One.\n\n\" The Elohistic texts were re-written 500 years after the date of Moses; the Jehovistic 800, on the authority of the Bible chronology itself.\n\nHence, it is maintained that the deity, represented as the organ of generation in his pillar form, and as a symbol of the double-sexed organ in the numeral value of the letters of his name, or the Yodh (phallus), and He (the opening, or [[Vol.\n\n2, Page]] 474 THE SECRET DOCTRINE.\n\nthe Womb) according to Kabalistic authority -- is of a far later date than the Elohim symbols and is borrowed from the Pagan exoteric rites; and Jehovah is thus on a par with the Lingham and Yoni found on every road-side in India.\n\nJust as the IAO of the mysteries was distinct from Jehovah, so was the later Iao and Abraxas of some Gnostic sects identical with the god of the Hebrews, who was the same with the Egyptian Horus.\n\nThis is undeniably proven on \"heathen\" as on the Gnostic \"Christian\" gems.\n\nIn Matter's collection of such gems there is a \"Horus\" seated on the lotus, inscribed [[ ABRASAXIAO ]] (Abraxas Iao) -- an address exactly parallel to the so frequent [[ EIS ZETS SARAPI ]] ( Eis zets sarapi ) on the contemporary Heathen gems; and therefore only to be translated by \"Abraxas is the One Jehovah\" (King's Gnostics, p.\n\n327).\n\nBut who was Abraxas?\n\nAs the same author shows -- \"the numerical or Kabalistic value of the name Abraxas directly refer to the Persian title of the god 'Mithra,' Ruler of the year, worshipped from the earliest times under the appellation of Iao.\" Thus, the Sun, in one aspect, the moon or the Lunar genius, in another, that generative deity whom the Gnostics saluted as \"Thou that presidest over the Mysteries of the Father and the Son, who shinest in the night-time, holding the second rank, the first Lord of Death.\" It is only in his capacity of the genius of the moon, the latter being credited in the old cosmogony with being the parent of our Earth, that Jehovah could ever be regarded as the creator of our globe and its Heaven, namely, the Firmament.\n\nThe knowledge of all this will be no proof, however, to the average bigot.\n\nMissionaries will go on with the most virulent attacks on the religions of India, and Christians read with the same benighted smile of satisfaction as ever these preposterously unjust words of Coleridge, \"It is highly worthy of observation that the inspired writings received by Christians are distinguishable from all other books PRETENDING TO INSPIRATION, from the Scriptures of the Brahmins, and even from the Koran, in their strong and frequent recommendation of TRUTH (!\n\n!).\n\n.\n\n.\n\n.\""


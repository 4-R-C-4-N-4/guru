body = "The whole Kosmos in its objective form is Vaikhari-Vach , the light of the Logos is the Madhyama form, and the Logos itself the Pasyanti form, and Parabrahm the Para form or aspect of that Vach.\n\nIt is by the light of this explanation that we must try to understand certain statements made by various philosophers to the effect that the manifested Kosmos is the Verbum manifested as Kosmos\" (see Lecture on the Bhagavadgita, referred to above).\n\n------- STANZA VI.\n\n-- ( Continued.\n\n) 2.\n\nT HE S WIFT AND THE R ADIANT O NE PRODUCES THE SEVEN Layu** ( a ) CENTRES, AGAINST WHICH NONE WILL PREVAIL TO THE GREAT DAY \" B E WITH US\" -- AND SEATS THE UNIVERSE ON THESE ETERNAL FOUNDATIONS, SURROUNDING S IEN- T CHAN WITH THE E LEMENTARY G ERMS ( b ).\n\n( a.\n\n) The seven Layu centres are the seven Zero points, using the term Zero in the same sense that Chemists do, to indicate a point at which, in Esotericism, the scale of reckoning of differentiation begins.\n\nFrom the Centres -- beyond which Esoteric philosophy allows us to perceive the dim metaphysical outlines of the \"Seven Sons\" of Life and Light, the Seven Logoi of the Hermetic and all other philosophers -- begins [[Footnote(s)]] ------------------------------------------------- * Madhya is said of something whose commencement and end are unknown, and Para means infinite.\n\nThese expressions all relate to infinitude and to division of time.\n\n** From the Sanskrit Laya , the point of matter where every differentiation has ceased.\n\n[[Vol.\n\n1, Page]] 139 FROM NO-NUMBER TO NUMBER SEVEN.\n\nthe differentiation of the elements which enter into the constitution of our Solar System.\n\nIt has often been asked what was the exact definition of Fohat and his powers and functions, as he seems to exercise those of a Personal God as understood in the popular religions.\n\nThe answer has just been given in the comment on Stanza V.\n\nAs well said in the Bhagavadgita Lectures, \"The whole Kosmos must necessarily exist in the One Source of energy from which this light ( Fohat ) emanates.\" Whether we count the principles in Kosmos and man as seven or only as four, the forces of, and in, physical Nature are Seven; and it is stated by the same authority that \" Pragna , or the capacity of perception, exists in seven different aspects corresponding to the seven conditions of matter\" ( Personal and impersonal God ) .\n\nFor, \"just as a human being is composed of seven principles, differentiated matter in the Solar System exists in seven different conditions\" ( ibid ) .\n\nSo does Fohat.* He is One and Seven, and on the Cosmic plane is behind all such manifestations as light, heat, sound, adhesion, etc., etc., and is the \"spirit\" of E LECTRICITY, which is the L IFE of the Universe.\n\nAs an abstraction, we call it the O NE L IFE; as an objective and evident Reality, we speak of a septenary scale of manifestation, which begins at the upper rung with the One Unknowable C AUSALITY, and ends as Omnipresent Mind and Life immanent in every atom of Matter.\n\nThus, while science speaks of its evolution through brute matter, blind force, and senseless motion, the Occultists point to intelligent L AW and sentient L IFE, and add that Fohat is the guiding Spirit of all this.\n\nYet he is no personal god at all, but the emanation of those other Powers behind him whom the Christians call the \"Messengers\" of their God (who is in reality only the Elohim, or rather one of the Seven Creators called Elohim), and we, the \"Messenger of the primordial Sons of Life and Light.\" ( b.\n\n) The \"Elementary Germs\" with which he fills Sien-Tchan (the \"Universe\") from Tien-Sin (the \"Heaven of Mind,\" literally, or that which is absolute) are the Atoms of Science and the Monads of Leibnitz.\n\n[[Footnote(s)]] ------------------------------------------------- * \"Fohat\" has several meanings.\n\n(See Stanza V., Commentary et infra ) .\n\nHe is called the \"Builder of the Builders,\" the Force that he personifies having formed our Septenary chain.\n\n[[Vol.\n\n1, Page]] 140 THE SECRET DOCTRINE.\n\nSTANZA VI.\n\n-- Continued.\n\n3.\n\nO F THE SEVEN ( elements ) -- FIRST ONE MANIFESTED, SIX CONCEALED; TWO MANIFESTED -- FIVE CONCEALED; THREE MANIFESTED -- FOUR CONCEALED; FOUR PRODUCED -- THREE HIDDEN; FOUR AND ONE TSAN ( fraction ) REVEALED -- TWO AND ONE HALF CONCEALED; SIX TO BE MANIFESTED -- ONE LAID ASIDE ( a ).\n\nLASTLY, SEVEN SMALL WHEELS REVOLVING; ONE GIVING BIRTH TO THE OTHER ( b ).\n\n( a.\n\n) Although these Stanzas refer to the whole Universe after a Mahapralaya (universal destruction), yet this sentence, as any student of Occultism may see, refers also by analogy to the evolution and final formation of the primitive (though compound) Seven Elements on our Earth.\n\nOf these, four elements are now fully manifested, while the fifth -- Ether -- is only partially so, as we are hardly in the second half of the Fourth Round, and consequently the fifth Element will manifest fully only in the Fifth Round.\n\nThe Worlds, including our own, were of course, as germs, primarily evolved from the ONE Element in its second stage (\"Father-Mother,\" the differentiated World's Soul, not what is termed the \"Over-Soul\" by Emerson), whether we call it, with modern Science, Cosmic dust and Fire Mist, or with Occultism -- Akasa, Jivatma, divine Astral Light, or the \"Soul of the World.\" But this first stage of Evolution was in due course of time followed by the next.\n\nNo world, as no heavenly body, could be constructed on the objective plane, had not the Elements been sufficiently differentiated already from their primeval Ilus , resting in Laya.\n\nThe latter term is a synonym of Nirvana.\n\nIt is, in fact, the Nirvanic dissociation of all substances, merged after a life-cycle into the latency of their primary conditions.\n\nIt is the luminous but bodiless shadow of the matter that was , the realm of negativeness -- wherein lie latent during their period of rest the active Forces of the Universe.\n\nNow, speaking of Elements, it is made the standing reproach of the Ancients, that they \"supposed their Elements simple and undecomposable.\"* Once more this is an unwarrantable state- [[Footnote(s)]] ------------------------------------------------- * The shades of our pre-historical ancestors might return the compliment to modern physicists, now that new discoveries in chemistry have led Mr."


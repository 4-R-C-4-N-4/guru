body = "Every text relates to, and has to be rendered from, one of the following standpoints -- 1.\n\nThe Realistic plane of thought; 2.\n\nThe Idealistic; 3.\n\nThe purely Divine or Spiritual.\n\nThe other planes too far transcend the average consciousness, especially of the materialistic mind, to admit of their being even symbolized in terms of ordinary phraseology.\n\nThere is no purely mythical element in any of the ancient religious texts; but the mode of thought in which they were originally written has to be found out and closely adhered to during the process of interpretation.\n\nFor, it is either symbolical (archaic mode of thought), emblematical (a later though very ancient mode of thought), parabolical (allegory), hieroglyphical, or again logo-grammical -- the most difficult method of all, as every letter, as in the Chinese language, represents a whole word.\n\nThus, almost every proper name, whether in the Vedas, the \"Book of the Dead,\" or the Bible (to a degree), is composed of such logograms.\n\nNo one who is not initiated into the mystery of the occult religious logography can presume to know what a name in any ancient fragment means, before he has mastered the meaning of every letter that composes it.\n\nHow is it to be expected that the merely profane thinker, however great his erudition in orthodox symbolism, so to say -- i.e ., in that symbolism which can never get out of the old grooves of Solar-myth and sexual-worship -- shall penetrate into the arcana.\n\nbehind the veil.\n\nOne who deals with the husk or shell of the dead letter, and devotes himself to the kaleidoscopic transformation of barren word-symbols, can never expect to get beyond the vagaries of modern mythologists.\n\nThus, Vaivasvata, Xisuthrus, Deukalion, Noah, etc., etc.\n\n-- all the head-figures of the world-deluges, universal and partial, astronomical or geological -- all furnish in their very names the records of the causes and effects which led to the event, if one can but read them fully.\n\nAll such deluges are based on events that took place in nature, and stand as historical records, therefore, whether they were sidereal, geological, or even simply allegorical, of a moral event on other and higher planes of being.\n\nThis we believe has now been sufficiently demonstrated during the long explanation necessitated by the allegorical Stanzas.\n\n[[Vol.\n\n2, Page]] 336 THE SECRET DOCTRINE.\n\nTo speak of a race nine yatis, or 27 feet high, in a work claiming a more scientific character than \"Jack the Giant-Killer,\" is a somewhat unusual proceeding.\n\n\"Where are your proofs?\" the writer will be asked.\n\nIn History and tradition, is the answer.\n\nTraditions about a race of giants in days of old are universal; they exist in oral and written lore.\n\nIndia had her Danavas and Daityas; Ceylon had her Rakshasas; Greece, her Titans; Egypt, her colossal Heroes; Chaldea, her Izdubars (Nimrod); and the Jews their Emims of the land of Moab, with the famous giants, Anakim ( Numbers xiii.\n\n33).\n\nMoses speaks of Og, a king who was nine cubits high (15 ft.\n\n4 in.) and four wide (Deut.\n\niii.\n\n11), and Goliath was \"six cubits and a span in height\" (or 10 ft.\n\n7 in.).\n\nThe only difference found between the \"revealed Scripture\" and the evidence furnished to us by Herodotus, Diodorus Siculus, Homer, Pliny, Plutarch, Philostratus, etc., etc., is this: While the pagans mention only the skeletons of giants, dead untold ages before, relics that some of them had personally seen, the Bible interpreters unblushingly demand that geology and archaeology should believe, that several countries were inhabited by such giants in the day of Moses; giants before whom the Jews were as grasshoppers, and who still existed in the days of Joshua and David.\n\nUnfortunately their own chronology is in the way.\n\nEither the latter or the giants have to be given up.\n\n(But see Part III., Addenda, the closing chapter.) Of still standing witnesses to the submerged continents, and the colossal men that inhabited them, there are still a few.\n\nArchaeology claims several such on this globe, though beyond wondering \"what these may be\" -- it never made any serious attempt to solve the mystery.\n\nBesides the Easter Island statues mentioned already, to what epoch do the colossal statues, still erect and intact near Bamian, belong?\n\nArchaeology assigns them to the first centuries of Christianity (as usual), and errs in this as it does in many other speculations.\n\nA few words of description will show the readers what are the statues of both Easter Isle and Bamian.\n\nWe will first examine what is known of them to orthodox Science.\n\nIn \" The Countries of the World ,\" by Robert Brown, in Vol.\n\nIV ., page 43, it is stated that -- \"Teapi, Rapa-nui, or Easter Island, is an isolated spot almost 2,000 miles from the South American coast.\n\n.\n\n.\n\n.\n\nIn length it is about twelve miles, in breadth four .\n\n.\n\n.\n\nand there is an extinct crater 1,050 feet high in its centre.\n\nThe island abounds in craters, which have been extinct for so long that no tradition of their activity remains.\n\n.\n\n.\n\n.\n\n\" .\n\n.\n\n.\n\nBut who made the great stone images (p.\n\n44, etc.) which are now the chief attraction of the island to visitors?\n\nNo one knows \" -- says the reviewer.\n\n\"It is more than likely that they were here when the present inhabitants (a handful of Polynesian savages) arrived.\n\n.\n\n.\n\n.\n\nTheir workmanship is [[Vol.\n\n2, Page]] 337 THE MYSTERY OF EASTER ISLAND.\n\nof a high order .\n\n.\n\n.\n\n.\n\nand it is believed that the race who formed them were the frequenters of the natives of Peru and other portions of South America.\n\n.\n\n.\n\nEven at the date of Cook's visit, some of the statues, measuring 27 feet in height and eight across the shoulders were lying overthrown, while others still standing appeared much larger.\n\nOne of the latter was so lofty that the shade was sufficient to shelter a party of thirty persons from the heat of the sun.\n\nThe platforms on which these colossal images stood averaged from thirty to forty feet in length, twelve to sixteen broad.\n\n.\n\n.\n\n.\n\nall built of hewn stone in the Cyclopean style, very much like the walls of the Temple of Pachacamac, or the ruins of Tia-Huanuco in Peru \" (vol.\n\niii., pp.\n\n310, 311).\n\n\" T HERE IS NO REASON TO BELIEVE THAT ANY OF THE STATUES HAVE BEEN BUILT UP, BIT BY BIT, BY SCAFFOLDING ERECTED AROUND THEM\" -- adds the journal very suggestively -- without explaining how they could be built otherwise, unless made by giants of the same size as the statues themselves."


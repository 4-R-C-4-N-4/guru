[content]
body = "I believe in the ancients and therefore I love them.\"** (Quoted in \"Science of Religions\" by Max Muller.) The writer loves them too, and therefore believes in the ancients, and the modern heirs to their Wisdom.\n\nAnd believing in both, she now transmits that which she has received and learnt herself to all those who will accept it.\n\nAs to those who may reject her testimony, -- i.e.\n\n, the great majority -- she will bear them no malice, for they will be as right in their way in denying, as she is right in hers in affirming, since they look at TRUTH from two entirely different stand-points.\n\nAgreeably with the rules of critical scholarship, the Orientalist has to reject a priori whatever evidence he cannot fully verify for himself.\n\nAnd how can a Western scholar accept on hearsay that which he knows nothing about?\n\nIndeed, that which is given in these volumes is selected from oral, as much as from written teachings.\n\nThis first instalment of the esoteric doctrines is based upon Stanzas, which are the records of a people unknown to ethnology; it is claimed that they are written in a tongue absent from the nomenclature of languages and dialects with which philology is acquainted; they are said to emanate from a source (Occultism) repudiated by science; and, finally, they are offered through an agency, incessantly discredited before the world by all those who hate unwelcome truths, or have some special hobby of their own to defend.\n\nTherefore, the rejection of these teachings may be expected, and must be accepted beforehand.\n\nNo one styling himself a \"scholar,\" in whatever department of exact science, will be permitted to regard these teachings seriously.\n\nThey will be derided and rejected a priori in this century; but only in this one.\n\nFor in the twentieth century of our era scholars will begin to recognize that the Secret Doctrine has neither been invented nor exaggerated, but, on the contrary, simply outlined; and finally, that its teachings antedate the Vedas.*** Have not the latter been derided, rejected, and [[Footnote(s)]] ------------------------------------------------- * Lun Yu (§ I a) Schott.\n\n\"Chinesische Literatur,\" p.\n\n7.\n\n** \"Life of Confucius,\" p.\n\n96.\n\n*** This is no pretension to prophecy, but simply a statement based on the knowledge of facts.\n\nEvery century an attempt is being made to show the world that Occultism [[Footnote continued on next page]] [[Vol.\n\n1, Page]] xxxviii INTRODUCTORY.\n\ncalled \"a modern forgery\" even so recently as fifty years ago?\n\nWas not Sanskrit proclaimed at one time the progeny of, and a dialect derived from, the Greek, according to Lempriere and other scholars?\n\nAbout 1820, Prof.\n\nMax Muller tells us, the sacred books of the Brahmans, of the Magians, and of the Buddhists, \"were all but unknown, their very existence was doubted, and there was not a single scholar who could have translated a line of the Veda .\n\n.\n\n.\n\nof the Zend Avesta, or .\n\n.\n\n.\n\nof the Buddhist Tripitaka, and now the Vedas are proved to be the work of the highest antiquity whose 'preservation amounts almost to a marvel' (Lecture on the Vedas).\n\nThe same will be said of the Secret Archaic Doctrine, when proofs are given of its undeniable existence and records.\n\nBut it will take centuries before much more is given from it.\n\nSpeaking of the keys to the Zodiacal mysteries as being almost lost to the world, it was remarked by the writer in \"Isis Unveiled\" some ten years ago that: \"The said key must be turned seven times before the whole system is divulged.\n\nWe will give it but one turn, and thereby allow the profane one glimpse into the mystery.\n\nHappy he, who understands the whole!\" The same may be said of the whole Esoteric system.\n\nOne turn of the key, and no more, was given in \"Isis.\" Much more is explained in these volumes.\n\nIn those days the writer hardly knew the language in which the work was written, and the disclosure of many things, freely spoken about now, was forbidden.\n\nIn Century the Twentieth some disciple more informed, and far better fitted, may be sent by the Masters of Wisdom to give final and irrefutable proofs that there exists a Science called Gupta-Vidya; and that, like the once-mysterious sources of the Nile, the source of all religions and philosophies now known to the world has been for many ages forgotten and lost to men, but is at last found.\n\nSuch a work as this has to be introduced with no simple Preface, but with a volume rather; one that would give facts, not mere disquisitions, since the S ECRET D OCTRINE is not a treatise, or a series of vague theories, but contains all that can be given out to the world in this century.\n\nIt would be worse than useless to publish in these pages even those [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] is no vain superstition.\n\nOnce the door permitted to be kept a little ajar, it will be opened wider with every new century.\n\nThe times are ripe for a more serious knowledge than hitherto permitted, though still very limited, so far.\n\n[[Vol.\n\n1, Page]] xxxix INTRODUCTORY.\n\nportions of the esoteric teachings that have now escaped from confinement, unless the genuineness and authenticity -- at any rate, the probability -- of the existence of such teachings was first established.\n\nSuch statements as will now be made, have to be shown warranted by various authorities: those of ancient philosophers, classics and even certain learned Church Fathers, some of whom knew these doctrines because they had studied them, had seen and read works written upon them; and some of whom had even been personally initiated into the ancient Mysteries, during the performance of which the arcane doctrines were allegorically enacted.\n\nThe writer will have to give historical and trustworthy names, and to cite well-known authors, ancient and modern, of recognized ability, good judgment, and truthfulness, as also to name some of the famous proficients in the secret arts and science, along with the mysteries of the latter, as they are divulged, or, rather, partially presented before the public in their strange archaic form.\n\nHow is this to be done?\n\nWhat is the best way for achieving such an object?\n\nwas the ever-recurring question.\n\nTo make our plan clearer, an illustration may be attempted.\n\nWhen a tourist coming from a well-explored country, suddenly reaches the borderland of a terra incognita, hedged in, and shut out from view by a formidable barrier of impassable rocks, he may still refuse to acknowledge himself baffled in his exploratory plans.\n\nIngress beyond is forbidden.\n\nBut, if he cannot visit the mysterious region personally, he may still find a means of examining it from as short a distance as can be arrived at."


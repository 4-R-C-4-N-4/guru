body = "****** These Placentalia of the third sub-class are divided, it appears, into Villiplacentalia (placenta composed of many separate scattered tufts), the Zonoplacentalia (girdle-shaped placenta), and the discoplacentaIia (or discoid).\n\nHaeckel sees in the Marsupialia Didelphia , one of the connecting links genealogically between man and the Moneron!!\n\n[[Vol.\n\n2, Page]] 714 THE SECRET DOCTRINE.\n\n[[First Column continued from previous page]] Tertiary period.* Why?\n\nBecause man has to be shown younger than the higher mammals.\n\nBut Esoteric philosophy teaches us the reverse.\n\nAnd as science is quite unable to come to anything like an approximate conclusion as to the age of man, or even the geological periods, therefore, even accepted only as a hypothesis, the occult teaching is more logical and reasonable.\n\nNo man is yet allowed to have lived during this period: -- ***Tertiary -- Eocene.\n\nMiocene.\n\nPliocene.\n\nSays Mr.\n\nE.\n\nClodd, in Knowledge : -- \"Although the placental mammals and the order of Primates to which man is related, appear in Tertiary times and the climate, tropical in the Eocene age, warm in the Miocene and temperate in the Pliocene, was favourable to his presence, the proofs of his existence in Europe before the close of the Tertiary epoch .\n\n.\n\n.\n\n.\n\nare not generally accepted here.\" [[First Column continued on next page]] [[Second Column continued from previous page]] like the First, Second, and Third Root-Races of men.** But this would require more space than can be now allotted to the subject.\n\nTertiary age -- The Third race has now almost utterly disappeared, carried away by the fearful geological cataclysms of the Secondary age, leaving behind it but a few hybrid races.\n\nThe Fourth, born millions of years before**** the said cataclysm took place, perishes during the Miocene period,****** when the Fifth (our Aryan race) had one million years of independent existence.\n\n( See \" Esoteric Buddhism, \" pp.\n\n53-55 .\n\nFourth Ed.\n\n) How much older it is from its origin -- who knows?\n\nAs the \"Historical\" Period has begun, with the Indian Aryans, with their Vedas, for their multitudes,****** and far earlier in the Esoteric Records, it is useless to establish here any parallels.\n\n[[Second Column continued on next page]] [[Footnote(s)]] ------------------------------------------------- * Those who feel inclined to sneer at that doctrine of Esoteric Ethnology, which pre-supposes the existence of Man in the Secondary Age, will do well to note the fact that one of the most distinguished anthropologists of the day, M.\n\nde Quatrefages, seriously argues in that direction.\n\nHe writes: \"There is nothing impossible in the supposition that he (Man) may have appeared on the globe with the first representatives of the type to which he belongs in virtue of his organism.\n\n\" This statement approximates most closely to our fundamental assertion that man preceded the other mammalia.\n\nProfessor Lefevre admits that the \"labours of Boucher de Perthes, Lartet, Christy, Bourgeois, Desnoyers, Broca, de Mortillet, Hamy, Gaudry, Capellini, and a hundred others, have overcome all doubts and clearly established the progressive development of the human organism and industries from the Miocene epoch of the Tertiary age.\n\n\" (\"Philosophy,\" p.\n\n499, chapter on Organic Evolution.) Why does he reject the possibility of a Secondary-Age man?\n\nSimply because he is involved in the meshes of the Darwinian Anthropology!!\n\n\"The origin of man is bound up with that of the higher mammals;\" he appeared \"only with the last types of his class\"!!\n\nThis is not [[Footnote continued on next page]] [[Vol.\n\n2, Page]] 715 THE SUFFICIENCY OF THE \"ANIMALISTS.\" Geology has now divided the periods and placed man in the -- [[First Column continued from previous page]] Quaternary (Palaeolithic man.\n\nNeolithic man, and Historical Period.) [[Second Column continued from previous page]] If the Quaternary period is allowed 1,500,000 years, then only does our Fifth Race belong to it.\n\n[[End of Columns]] Yet, mirabile dictu!\n\n-- while the non-cannibal Paleolithic man, who must have certainly antedated cannibal Neolithic man by hundreds of thousands of years******* is shown to be a remarkable artist, neolithic [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] argument, but dogmatism.\n\nTheory can never excommunicate fact !\n\nMust everything give place to the mere working-hypotheses of Western Evolutionists?\n\nSurely not.\n\n** This inclusion of the First Race in the Secondary is necessarily only a provisional working-hypothesis -- the actual chronology of the First, Second, and Early Third Races being closely veiled by the Initiates.\n\nFor all that can be said on the subject, the First Root-Race may have been Pre-Secondary, as is, indeed, taught.\n\n( Vide supra.\n\n) *** The above parallels stand good only if Professor Croll's earlier calculations are adopted, namely, of 15,000,000 years since the beginning of the Eocene period (see Charles Gould's \"Mythical Monsters,\" p.\n\n84), not those in his \"Climate and Time,\" which allow only 2 1/2 million years', or at the utmost three million years' duration to the Tertiary age.\n\nThis, however, would make the whole duration of the incrusted age of the world only 131,600,000 years according to Professor Winchell, whereas in the Esoteric doctrine, sedimentation began in this Round approximately over 320 million years ago.\n\nYet his calculations do not clash much with ours with regard to the epochs of glacial periods in the Tertiary age, which is called in our Esoteric books the age of the \"Pigmies.\" With regard to the 320 millions of years assigned to sedimentation, it must be noted that even a greater time elapsed during the preparation of this globe for the Fourth Round previous to stratification.\n\n**** Though we apply the term \"truly human,\" only to the Fourth Atlantean Root-Race, yet the Third Race is almost human in its latest portion, since it is during its fifth sub-race that mankind separated sexually, and that the first man was born according to the now normal process.\n\nThis \"first man\" answers in the Bible ( Genesis ) to Enos or Henoch, son of Seth (ch.\n\niv.).\n\n***** Geology records the former existence of a universal ocean, sheets of marine sediments uniformly present everywhere testifying to it; but, it is not even the epoch referred to in the allegory of Vaivasvata Manu.\n\nThe latter is a Deva-Man (or Manu) saving in an ark (the female principle) the germs of humanity, and also the seven Rishis -- who stand here as the symbols for the seven human principles -- of which allegory we have spoken elsewhere."


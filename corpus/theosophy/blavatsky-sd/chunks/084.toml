body = "But the blame for it is to be attached as much to the vagueness and incompleteness of the Master's answer as to the question of the learner itself, which was equally vague and indefinite.\n\nIt was asked: \"What planets, of those known to ordinary science, besides Mercury, belong to our system of worlds?\" Now if by \"System of Worlds\" our terrestrial chain or \"string\" was intended in the mind of the querist, instead of the \"Solar System of Worlds,\" as it should have been, then of course the answer was likely to be misunderstood.\n\nFor the reply was: \"Mars, etc., and four other planets of which astronomy knows nothing.\n\nNeither A, B, nor YZ are known nor can they be seen through physical means however perfected.\" This is plain: (a) Astronomy as yet knows nothing in reality of the planets, neither the ancient ones, nor those discovered in modern times.\n\n(b) No companion planets from A to Z, i.e.\n\n, no upper globes of any chain in the Solar System, can be seen.* As to Mars, Mercury, and \"the four other planets,\" they bear [[Footnote(s)]] ------------------------------------------------- * With the exception of course of all the planets which come fourth in number, as our earth, the moon, etc., etc.\n\nCopies of all the letters ever received or sent, with the exception of a few private ones -- \" in which there was no teaching \" the Master says -- are with the writer.\n\nAs it was her duty, in the beginning, to answer and explain certain points not touched upon, it is more than likely that notwithstanding the many annotations on these copies, the writer, in her ignorance of English and her fear of saying too much, may have bungled the information given.\n\nShe takes the whole blame for it upon herself in any and every case.\n\nBut it is impossible for her to allow students to remain any longer under erroneous impressions, or to believe that the fault lies with the esoteric system.\n\n[[Vol.\n\n1, Page]] 164 THE SECRET DOCTRINE.\n\na relation to Earth of which no master or high Occultist will ever speak, much less explain the nature.* Let it now be distinctly stated, then, that the theory broached is impossible, with or without the additional evidence furnished by modern Astronomy.\n\nPhysical Science can supply corroborative, though still very uncertain, evidence, but only as regards heavenly bodies on the same plane of materiality as our objective Universe.\n\nMars and Mercury, Venus and Jupiter, like every hitherto discovered planet (or those still to be discovered), are all, per se , the representatives on our plane of such chains.\n\nAs distinctly stated in one of the numerous letters of Mr.\n\nSinnett's \"Teacher,\" \"there are other and innumerable Manvantaric chains of globes which bear intelligent Beings both in and outside our solar system.\" But neither Mars nor Mercury belong to our chain.\n\nThey are, along with the other planets, septenary Units in the great host of \"chains\" of our system, and all are as visible as their upper globes are invisible.\n\nIf it is still argued that certain expressions in the Teacher's letters were liable to mislead, the answer comes: -- Amen; so it was.\n\nThe author of \"Esoteric Buddhism\" understood it well when he wrote that such are \"the traditional modes of teaching .\n\n.\n\n.\n\nby provoking the perplexity\" .\n\n.\n\n.\n\nthey do , or do not relieve -- as the case may be.\n\nAt all events, if it is urged that this might have been explained earlier, and the true nature of the planets given out as they now are, the answer comes that: \"it was not found expedient to do so at the time, as it would have opened the way to a series of additional questions which could never be answered on account of their esoteric nature , and thus would only become embarrassing.\" It had been declared from the first and has been repeatedly asserted since that (1st) no Theosophist, not even as an accepted chela -- let alone lay students -- could expect to have the secret teachings explained to him thoroughly and completely , before he had irretrievably pledged himself to the Brotherhood and passed through at least one initiation , because no figures and numbers could be given to the public, for figures and numbers are the key to the esoteric system.\n\n(2.) That [[Footnote(s)]] ------------------------------------------------- * In this same letter the impossibility is distinctly stated: -- .\n\n.\n\n.\n\n\"Try to understand that you are putting me questions pertaining to the highest initiation; that I can give you (only) a general view, but that I dare not nor will I enter upon details .\n\n.\n\n.\" wrote one of the Teachers to the author of \"Esoteric Buddhism.\" [[Vol.\n\n1, Page]] 165 AN AUTHORITATIVE LETTER.\n\nwhat was revealed was merely the esoteric lining of that which is contained in almost all the exoteric Scriptures of the world-religions -- pre-eminently in the Brahmanas, and the Upanishads of the Vedas and even in the Puranas.\n\nIt was a small portion of what is divulged far more fully now in the present volumes; and even this is very incomplete and fragmentary.\n\nWhen the present work was commenced, the writer, feeling sure that the speculation about Mars and Mercury was a mistake, applied to the Teachers by letter for explanation and an authoritative version.\n\nBoth came in due time, and verbatim extracts from these are now given.\n\n\".\n\n.\n\n.\n\n.\n\n.\n\nIt is quite correct that Mars is in a state of obscuration at present , and Mercury just beginning to get out of it.\n\nYou might add that Venus is in her last Round.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\nIf neither Mercury nor Venus have satellites , it is because of the reasons .\n\n.\n\n.\n\n(vide footnote supra, where those reasons are given), and also because Mars has two satellites to which he has no right .\n\n.\n\n.\n\n.\n\n.\n\nPhobos , the supposed INNER satellite , is no satellite at all.\n\nAs remarked long ago by Laplace and now by Faye ( see COMPTES RENDUS, Tome XC .\n\n, p.\n\n569 ), Phobos keeps a too short periodic time , and therefore there ' must exist some defect in the mother idea of the theory ' as Faye justly observes .\n\n.\n\n.\n\n.\n\n.\n\nAgain , both ( Mars and Mercury ) are septenary chains , as independent of the Earth ' s sidereal lords and superiors as you are independent of the ' principles ' of Daumling ( Tom Thumb ) -- which were perhaps his six brothers , with or without night-caps.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n' Gratification of curiosity is the end of knowledge for some men,' was said by Bacon , who was as right in postulating this truism , as those who were familiar with it before him were right in hedging off WISDOM from Knowledge , and tracing limits to that which is to be given out at one time .\n\n.\n\n.\n\n.\n\nRemember : -- '.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\nknowledge dwells In heads replete with thoughts of other men, Wisdom in minds attentive to their own.\n\n.\n\n."


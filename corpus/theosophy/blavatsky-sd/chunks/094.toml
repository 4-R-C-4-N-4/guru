body = "He is sexless , and , like the animal and vegetable he develops monstrous bodies correspondential with his coarser surroundings.\n\n\" II.\n\nRound.\n\nHe ( Man ) is still gigantic and ethereal but growing firmer and more condensed in body , a more physical man.\n\nYet still less intelligent than spiritual (1), for mind is a slower and more difficult evolution than is the physical frame .\n\n.\n\n.\n\n\" III.\n\nRound.\n\nHe has now a perfectly concrete or compacted body , at first the form of a giant-ape , and now more intelligent , or rather cunning , than spiritual.\n\nFor , on the downward arc , he has now reached a point where his primordial spirituality is eclipsed and overshadowed by nascent mentality (2).\n\nIn the last half of the Third Round his gigantic stature decreases , and his body improves in texture , and he becomes a more rational being , though still more an ape than a [[Vol.\n\n1, Page]] 189 A MASTER'S LETTER.\n\nDeva .\n\n.\n\n.\n\n.\n\n( All this is almost exactly repeated in the third Root-Race of the Fourth Round.\n\n) \" IV.\n\nRound.\n\nIntellect has an enormous development in this Round.\n\nThe ( hitherto ) dumb races acquire our ( present ) human speech on this globe , on which , from the Fourth Race , language is perfected and knowledge increases.\n\nAt this half-way point of the Fourth Round ( as of the Fourth Root , or Atlantean , race ) humanity passes the axial point of the minor Manvantara cycle .\n\n.\n\n.\n\n.\n\nthe world teeming with the results of intellectual activity and spiritual decrease .\n\n.\n\n.\n\n.\" This is from the authentic letter; what follows are the later remarks and additional explanations traced by the same hand in the form of footnotes.\n\n(1.) \" .\n\n.\n\n.\n\nThe original letter contained general teaching -- a ' bird ' s eye view ' -- and particularized nothing .\n\n.\n\n.\n\n.\n\nTo speak of 'physical man' while limiting the statement to the early Rounds would be drifting back to the miraculous and instantaneous ' coats of skin.\n\n' .\n\n.\n\n.\n\nThe first ' Nature ,' the first ' body ,' the first ' mind ' on the first plane of perception , on the first Globe in the first Round , is what was meant.\n\nFor Karma and evolution have -- ' .\n\n.\n\n.\n\ncentred in our make such strange extremes!\n\nFrom different Natures* marvellously mixed .\n\n.\n\n.' (2.) \" Restore: he has now reached the point (by analogy , and as the Third Root Race in the Fourth Round ) where his (\" the angel \" -man ' s ) primordial spirituality is eclipsed and overshadowed by nascent human mentality , and you have the true version on your thumb-nail .\n\n.\n\n.\n\n.\" These are the words of the Teacher -- text, words and sentences in brackets, and explanatory footnotes.\n\nIt stands to reason that there must be an enormous difference in such terms as \"objectivity\" and \"subjectivity,\" \"materiality\" and \"spirituality,\" when the same terms are applied to different planes of being and perception.\n\nAll this must be taken in its relative sense.\n\nAnd therefore there is little to be wondered at, if, left to his own speculations, an author, however eager to learn, yet quite inexperienced in these abstruse teachings, has fallen [[Footnote(s)]] ------------------------------------------------- * The Natures of the seven hierarchies or classes of Pitris and Dhyan Chohans which compose our nature and Bodies are here meant.\n\n[[Vol.\n\n1, Page]] 190 THE SECRET DOCTRINE.\n\ninto an error.\n\nNeither was the difference between the \"Rounds\" and the \"Races\" sufficiently defined in the letters received, nor was there anything of the kind required before, as the ordinary Eastern disciple would have found out the difference in a moment.\n\nMoreover, to quote from a letter of the Master's (188-), \"the teachings were imparted under protest.\n\n.\n\n.\n\n.\n\nThey were, so to say, smuggled goods .\n\n.\n\n.\n\nand when I remained face to face with only one correspondent, the other, Mr.\n\n.\n\n.\n\n.\n\n., had so far tossed all the cards into confusion, that little remained to be said without trespassing upon law.\" Theosophists, \"whom it may concern,\" will understand what is meant.\n\nThe outcome of all this is that nothing had ever been said in the \"letters\" to warrant the assurance that the Occult doctrine has ever taught, or any Adept believed in, the preposterous modern theory of the descent of man from a common ancestor with the ape -- an anthropoid of the actual animal kind, unless metaphorically.\n\nTo this day the world is more full of \"ape-like men\" than the woods are of \"men-like apes.\" The ape is sacred in India because its origin is well known to the Initiates, though concealed under a thick veil of allegory.\n\nHanuman is the son of Pavana (Vayu, \"the god of the wind\") by Anjana, a monster called Kesari, though his genealogy varies.\n\nThe reader who bears this in mind will find in Book II.\n\npassim , the whole explanation of this ingenious allegory.\n\nThe \"Men\" of the Third Race (who separated) were \"Gods\" by their spirituality and purity, though senseless, and as yet destitute of mind, as men.\n\nThese \"Men\" of the Third Race -- the ancestors of the Atlanteans -- were just such ape-like, intellectually senseless giants as were those beings, who, during the Third Round, represented Humanity.\n\nMorally irresponsible, it was these third Race \"men\" who, through promiscuous connection with animal species lower than themselves, created that missing link which became ages later (in the tertiary period only) the remote ancestor of the real ape as we find it now in the pithecoid family.* [[Footnote(s)]] ------------------------------------------------- * And if this is found clashing with that other statement which shows the animal later than man, then the reader is asked to bear in mind that the placental mammal only is meant.\n\nIn those days there were animals of which zoology does not even dream in our own; and the modes of reproduction were not identical with the notions which modern physiology has upon the subject.\n\nIt is not altogether convenient to touch upon such questions in public, but there is no contradiction or impossibility in this whatever.\n\n[[Vol.\n\n1, Page]] 191 THE PRELIMINARY CREATION OF MAN.\n\nThus the earlier teachings, however unsatisfactory, vague and fragmentary, did not teach the evolution of \"man\" from the \"ape.\" Nor does the author of \"Esoteric Buddhism\" assert it anywhere in his work in so many words; but, owing to his inclination towards modern science, he uses language which might perhaps justify such an inference.\n\nThe man who preceded the Fourth, the Atlantean race, however much he may have looked physically like a \"gigantic ape\" -- \"the counterfeit of man who hath not the life of a man\" -- was still a thinking and already a speaking man."


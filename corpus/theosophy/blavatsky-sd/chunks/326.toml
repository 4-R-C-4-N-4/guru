body = "And places the apogee at ...\n\n...\n\n7d.\n\n14h.\n\n6m.\n\n54s.\n\nThe determination of the moon's place by the Brahmins thus differs only by nine minutes from ours, and that of the apogee by twenty-two minutes, and it is very evident that they could only have obtained this agreement with our best tables and this exactitude in the celestial positions by observation.\n\nIf then, observation fixed the end of this period, there is every reason to believe that it determined its commencement.\n\nBut then this motion, determined directly, and from nature, would of necessity be in close agreement with the true motions of the heavenly bodies.\n\nAnd in fact the Hindu motion during this long period of 4,883 years, does not differ by a minute from that of Cassini, and agrees equally with that of Maier.\n\nThus two peoples, the Hindus and the Europeans, placed at the two extremities of the world, and perhaps as distant by their institutions, have obtained precisely the same results as regards the moon's motions; and an agreement which would be inconceivable, if it were not based on the observation and mutual imitation of nature.\n\nWe must remark that the four tables of the Hindus are all copies of the same Astronomy.\n\nIt cannot be denied that the Siamese tables existed [[Vol.\n\n1, Page]] 667 THE ARYAN HINDUS VINDICATED.\n\nin 1687, when they were brought from India by M.\n\nde la Loubere.\n\nAt that time the tables of Cassini and Maier were not in existence, and thus the Hindus were already in possession of the exact motion contained in these tables, while we did not yet possess it.* It must, therefore, be admitted that the accuracy of this Hindu motion is the point of observation.\n\nIt is exact throughout this period of 4,383 years, because it was taken from the sky itself -- and if observation determined its close, it fixed its commencement also.\n\nIt is the longest period which has been observed and of which the recollection is preserved in the annals of Astronomy.\n\nIt has its origin in the epoch of the year 3102, B.C., and it is a demonstrative proof of the reality of that epoch.\n\nBailly is referred to at such length, as he is one of the few scientific men who have tried to do full justice to the Astronomy of the Aryans.\n\nFrom John Bentley down to Burgess' \"Surya-Siddhanta,\" not one astronomer has been fair enough to the most learned people of Antiquity.\n\nHowever distorted and misunderstood the Hindu Symbology, no Occultist can fail to do it justice once that he knows something of the Secret Sciences; nor will he turn away from their metaphysical and mystical [[Footnote(s)]] ------------------------------------------------- * The following is an answer to those men of science who might suspect that our Astronomy was carried to India and communicated to the Hindus by our Missionaries.\n\n1st.\n\nHindu astronomy has its own peculiar forms, characterized by their originality; if it had been our astronomy translated, great skill and knowledge would have been needed to disguise the theft.\n\n2nd.\n\nWhen adopting the mean movement of the moon, they would have adopted also the inclination of the ecliptic, the equation of the sun's centre, the length of the year; these elements differ completely from ours, and are remarkably accurate as applying to the epoch of 3102; while they would be exceedingly erroneous if they had been calculated for last century.\n\n3rd, finally, our missionaries could not have communicated to the Hindus in 1687 the tables of Cassini, which were not then in existence; they could have known only the mean motions of Tycho, Riccioli, Copernicus, Bouilland, Kepler, Longomontanus, and those of the tables of Alphonso.\n\nI will now give a tabular view of these mean motions for 4383 years and 94 days: -- Table.\n\n------------- Mean Motion.\n\n--- Difference from Hindu.\n\nAlphonso ..............9d 7h 2m 47s ...\n\n- 0h 42m 14s Copernicus ..........\n\n9d 6h 2m 13s ....\n\n- 1h 42m 48s Tycho ..................\n\n9d 7h 54m 40s ..\n\n+ 0h 9m 39s Kepler .................\n\n9d 6h 57m 35s ..\n\n- 0h 47m 26s Longomontanus ...\n\n9d 7h 2m 13s ....\n\n- 0h 42m 48s Bouilland .............\n\n9d 6h 48m 8s ....\n\n- 0h 58m 53s Riccioli ................\n\n9d 7h 53m 57s ..\n\n+ 0h 8m 56s Cassini ................\n\n9d 7h 44m 11s ...\n\n- 0h 0m 50s Indian ..................\n\n9d 7h 45m 1s None of these mean motions, except Cassini's, agrees with that of the Hindus, who therefore, did not borrow their mean motions, since their figures agree only with those of Cassini, whose tables were not in existence in 1687.\n\nThis mean motion of the moon belongs, therefore, to the Hindus, who could only have obtained it by observation.\" -- Bailly's \" Traite de l ' Astronomie Indienne et Orientale.\n\n\" [[Vol.\n\n1, Page]] 668 THE SECRET DOCTRINE.\n\ninterpretation of the Zodiac, even though the whole Pleiades of Royal Astronomical Societies rise in arms against their mathematical rendering of it.\n\nThe descent and re-ascent of the Monad or Soul cannot be disconnected from the Zodiacal signs, and it looks more natural, in the sense of the fitness of things, to believe in a mysterious sympathy between the metaphysical soul and the bright constellations, and in the influence of the latter on the former, than in the absurd notion that the creators of Heaven and Earth have placed in heaven the types of twelve vicious Jews.\n\nAnd if, as the author of The Gnostics asserts, the aim of all the Gnostic schools and the later Platonists \"was to accommodate the old faith to the influence of Buddhistic theosophy, the very essence of which was that the innumerable gods of the Hindu mythology were but names for the E NERGIES of the First Triad in its successive AVATARS or manifestations unto man ,\" whither can we turn to trace these theosophic ideas to their very root -- better than to old Indian wisdom?\n\nWe say it again: archaic Occultism would remain incomprehensible to all, if it were rendered otherwise than through the more familiar channels of Buddhism and Hinduism.\n\nFor the former is the emanation of the latter; and both are children of one mother -- ancient Lemuro - Atlantean Wisdom.\n\n------- [[This page continued in next section]]"


[content]
body = "This esotericism is the common property of all, and belongs neither to the Aryan 5th Race, nor to any of its numerous Sub-races.\n\nIt cannot be claimed by the Turanians, so-called, the Egyptians, Chinese, Chaldeans, nor any of the Seven divisions of the Fifth Root Race, but really belongs to the Third and Fourth Root Races, whose descendants we find in the Seed of the Fifth, the earliest Aryans.\n\nThe Circle was with every nation the symbol of the Unknown -- \"Boundless Space,\" the abstract garb of an ever present abstraction -- the Incognisable Deity.\n\nIt represents limitless Time in Eternity.\n\nThe Zeroana Akerne is also the \"Boundless Circle of the Unknown Time,\" from which Circle issues the radiant light -- the Universal S UN, or Ormazd** -- and the latter [[Footnote(s)]] ------------------------------------------------- * The numbers 3, 5, and 7 are prominent in speculative masonry, as shown in \"Isis.\" A mason writes: -- \"There are the 3, 5, and 7 steps to show a circular walk.\n\nThe three faces of 3, 3; 5, 3; and 7, 3; etc., etc.\n\nSometimes it comes in this form -- 753/2 = 376.5 and 7635/2 = 3817.5 and the ratio of 20612/6561 feet for cubit measure gives the Great Pyramid measures,\" etc., etc.\n\nThree, five and seven are mystical numbers, and the last and the first are as greatly honoured by Masons as by the Parsis -- the triangle being a symbol of Deity everywhere.\n\n(See the Masonic Cyclopedia , and \" Pythagorean Triangle ,\" Oliver.) As a matter of course, doctors of divinity (Cassel, for instance) show the Zohar explaining and supporting the Christian trinity (!).\n\nIt is the latter, however, that had its origin from the of the Heathen, in the Archaic Occultism and Symbology.\n\nThe three strides relate metaphysically to the descent of Spirit into matter, of the Logos falling as a ray into the Spirit, then into the Soul, and finally into the human physical form of man, in which it becomes L IFE.\n\n** Ormazd is the Logos, the \"First Born\" and the Sun.\n\n[[Vol.\n\n1, Page]] 114 THE SECRET DOCTRINE.\n\nis identical with Kronos, in his AEolian form, that of a Circle.\n\nFor the circle is Sar, and Saros, or cycle, and was the Babylonian god whose circular horizon was the visible symbol of the invisible, while the sun was the ONE Circle from which proceeded the Cosmic orbs, and of which he was considered the leader.\n\nZero-ana, is the Chakra or circle of Vishnu, the mysterious emblem which is, according to the definition of a mystic, \"a curve of such a nature that as to any, the least possible part thereof, if the curve be protracted either way it will proceed and finally re-enter upon itself, and form one and the same curve -- or that which we call the circle.\" No better definition could thus be given of the natural symbol and the evident nature of Deity, which having its circumference everywhere (the boundless) has, therefore, its central point also everywhere; in other words, is in every point of the Universe.\n\nThe invisible Deity is thus also the Dhyan Chohans, or the Rishis, the primitive seven, and the nine, without, and ten, including, their synthetical unit; from which IT steps into Man.\n\nReturning to the Commentary (4) of Stanza IV.\n\nthe reader will understand why, while the trans-Himalayan Chakra has inscribed within it | | (triangle, first line, cube second line, and a pentacle with a dot in the centre thus: , and some other variations), the Kabalistic circle of the Elohim reveals, when the letters of the word (Alhim or Elohim) are numerically read, the famous numerals 13514, or by anagram 31415 -- the astronomical (pi) number, or the hidden meaning of Dhyani-Buddhas, of the Gebers, the Geborim, the Kabeiri, and the Elohim, all signifying \"great men,\" \"Titans,\" \"Heavenly Men,\" and, on earth, \"the giants.\" The Seven was a Sacred Number with every nation; but none applied it to more physiologically materialistic uses than the Hebrews.\n\nWith these it was pre-eminently the generative number and 9 the male causative one, forming as shown by the Kabalists the or otz -- \"the Tree of the Garden of Eden,\"* the \"double hermaphrodite rod\" of the fourth race.\n\nWhereas with the Hindus and Aryans generally, the significance was manifold, and related almost entirely to purely metaphysical [[Footnote(s)]] ------------------------------------------------- * This was the symbol of the \"Holy of Holies,\" the 3 and the 4 of sexual separation.\n\nNearly every one of the 22 Hebrew letters are merely phallic symbols.\n\nOf the two letters -- as shown above -- one, the ayin, is a negative female letter, symbolically an eye; the other a male letter, tza , a fish -hook or a dart.\n\n[[Vol.\n\n1, Page]] 115 MANIFESTED SYMBOLS.\n\nand astronomical truths.* Their Rishis and gods, their Demons and Heroes, have historical and ethical meanings, and the Aryans never made their religion rest solely on physiological symbols, as the old Hebrews have done.\n\nThis is found in the exoteric Hindu Scriptures.\n\nThat these accounts are blinds is shown by their contradicting each other, a different construction being found in almost every Purana and epic poem.\n\nRead esoterically -- they will all yield the same meaning.\n\nThus one account enumerates Seven worlds, exclusive of the nether worlds, also seven in number; these fourteen upper and nether worlds have [[Footnote(s)]] ------------------------------------------------- * We are told by a Kabalist, who in a work not yet published contrasts the Kabala and Zohar with Aryan Esotericism, that \"The Hebrew clear, short, terse and exact modes far and beyond measure surpass the toddling word-talk of the Hindus -- just as by parallelisms the Psalmist says, 'My mouth speaks with my tongue, I know not thy numbers' (lxxi., 15).\n\n.\n\n.\n\n.\n\nThe Hindu Glyph shows by its insufficiency in the large admixture of adventitious sides the same borrowed plumage that the Greeks (the lying Greeks) had, and that Masonry has: which in the rough monosyllabic (and apparent) poverty of the Hebrew, shows the latter to have come down from a far more remote antiquity than any of these, and to have been the source (!?), or nearer the old original source than any of them.\" This is entirely erroneous."


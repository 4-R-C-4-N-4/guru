[content]
body = "To say with Schmidt: \"Forsooth are we to halt before the origin of language?\" is an avowal of dogmatism and of speedy defeat.\n\n(Cf.\n\nhis \" Doctrine of Descent and Darwinism, \" p.\n\n304.) We respect those men of science who, wise in their generation, say: \"Prehistoric Past being utterly beyond our powers of direct observation, we are too honest, too devoted to the truth -- or what we regard as truth -- to speculate upon the unknown, giving out our unproven theories along with facts absolutely established in modern Science.\" .\n\n.\n\n.\n\n.\n\n\"The borderland of (metaphysical) knowledge is best left to time, which is the best test as to truth\" ( A Modern Zoroastrian, p.\n\n136).\n\nThis is a wise and an honest sentence in the mouth of a materialist.\n\nBut when a Haeckel, after just saying that \" historical events of [[Vol.\n\n2, Page]] 663 PROOFS OF OUR \"NOBLE DESCENT.\" past time .\n\n.\n\n\" having \"occurred many millions of years ago,* .\n\n.\n\n.\n\nare for ever removed from direct observation,\" and that neither geology nor phylogeny** can or will \"rise to the position of a real exact science,\" then insists on the development of all organisms -- \"from the lowest vertebrate to the highest, from Amphioxus to man\" -- we ask for a weightier proof than he can give.\n\nMere \" empirical sources of knowledge,\" so extolled by the author of \" Anthropogeny \" - - when he has to be satisfied with the qualification for his own views -- are not competent to settle problems lying beyond their domain; nor is it the province of exact science to place any reliance on them.*** If \"empirical\" -- and Haeckel declares so himself repeatedly -- then they are no better, nor any more reliable, in the sight of exact research, when extended into the remote past, than our Occult teachings of the East, both having to be placed on quite the same level.\n\nNor are his phylogenetic and palingenetic speculations treated in any better way by the real scientists, than are our cyclic repetitions of the evolution of the Great in the minor races, and the original order of evolutions.\n\nFor the province of exact, real Science, materialistic though it be, is to carefully avoid anything like guess-work, speculation which cannot be verified; in short, all suppressio veri and all suggestio falsi.\n\nThe business of the man of exact Science is to observe, each in his chosen department, the phenomena of nature; to record, tabulate, compare and classify the facts, down to the smallest minutiae which are presented to the observation of the senses with the help of all the exquisite mechanism that modern invention supplies, not by the aid of metaphysical flights of fancy.\n\nAll that he has a legitimate right to do, is to correct by the assistance of physical instruments the [[Footnote(s)]] ------------------------------------------------- * It thus appears that in its anxiety to prove our noble descent from the catarrhine \"baboon,\" Haeckel's school has pushed the times of pre-historic man millions of years back.\n\n( See \" Pedigree of Man, \" p.\n\n273.) Occultists, render thanks to science for such corroboration of our claims!\n\n** This seems a poor compliment to pay Geology, which is not a speculative but as exact a science as astronomy -- save, perhaps its too risky chronological speculations.\n\nIt is mainly a \"Descriptive\" as opposed to an \"Abstract\" Science.\n\n*** Such newly-coined words as \" perigenesis of plastids ,\" \"plastidule Souls\" (!), and others less comely, invented by Haeckel, may be very learned and correct in so far as they may express very graphically the ideas in his own vivid fancy.\n\nAs a fact, however, they remain for his less imaginative colleagues painfully caenogenetic -- to use his own terminology; i.e.\n\n, for true Science they are spurious speculations so long as they are derived from \"empirical sources.\" Therefore, when he seeks to prove that \"the origin of man from other mammals, and most directly from the catarrhine ape, is a deductive law that follows necessarily from the inductive law of the theory of descent\" (\" Anthropogeny, \" p.\n\n392) -- his no less learned foes (du Bois-Reymond -- for one) have a right to see in this sentence a mere jugglery of words ; a \" testimonium paupertatis of natural science\" -- as he himself complains, calling them, in return, ignoramuses (see \"Pedigree of Man,\" Notes).\n\n[[Vol.\n\n2, Page]] 664 THE SECRET DOCTRINE.\n\ndefects or illusions of his own coarser vision, auditory powers, and other senses.\n\nHe has no right to trespass on the grounds of metaphysics and psychology.\n\nHis duty is to verify and to rectify all the facts that fall under his direct observation; to profit by the experiences and mistakes of the Past in endeavouring to trace the working of a certain concatenation of cause and effects, which, but only by its constant and unvarying repetition, may be called A L AW.\n\nThis it is which a man of science is expected to do, if he would become a teacher of men and remain true to his original programme of natural or physical sciences.\n\nAny side-way path from this royal road becomes speculation.\n\nInstead of keeping to this, what does many a so-called man of science do in these days?\n\nHe rushes into the domains of pure metaphysics, while deriding it.\n\nHe delights in rash conclusions and calls it \"a deductive law from the inductive law\" of a theory based upon and drawn out of the depths of his own consciousness: that consciousness being perverted by, and honeycombed with, one-sided materialism.\n\nHe attempts to explain the \"origin\" of things, which are yet embosomed only in his own conceptions.\n\nHe attacks spiritual beliefs and religious traditions millenniums old, and denounces everything, save his own hobbies, as superstition.\n\nHe suggests theories of the Universe, a Cosmogony developed by blind, mechanical forces of nature alone, far more miraculous and impossible than even one based upon the assumption of fiat lux out of nihil - - and tries to astonish the world by such a wild theory; which, being known to emanate from a scientific brain, is taken on blind faith as very scientific and the outcome of S CIENCE.\n\nAre those the opponents Occultism would dread?\n\nMost decidedly not.\n\nFor such theories are no better treated by real (not empirical) Science than our own.\n\nHaeckel, hurt in his vanity by du Bois-Reymond, never tires of complaining publicly of the latter's onslaught on his fantastic theory of descent.\n\nRhapsodizing on \"the exceedingly rich storehouse of empirical evidence,\" he calls those \"recognised physiologists\" who oppose every speculation of his drawn from the said \"storehouse\" -- ignorant men."


body = "242, 400); and that Menes and his Dynasty existed 7 50 years before the Fourth [[Footnote(s)]] ------------------------------------------------- * \"The Mythological Astronomy of the Ancients Demonstrated\" by a strangely intuitional symbologist and astronomer, a kind of a self-made adept of Norwich, who lived in the first quarter of this century.\n\n[[Vol.\n\n2, Page]] 432 THE SECRET DOCTRINE.\n\nDynasty (supposed to have built the Pyramids) had appeared (\" The Great Pyramid,\" Staniland Wake ).\n\nThus 4,100 years B.C.\n\nis the age assigned to Menes.\n\nNow Sir J.\n\nGardner Wilkinson's declaration that \"all the facts lead to the conclusion that the Egyptians had already made very great progress in the arts of civilization before the age of Menes, and perhaps before they immigrated into the valley of the Nile\" ( Rawlinson's \"Herodotus,\" vol.\n\nii.\n\np.\n\n345) is very suggestive, as destroying this hypothesis.\n\nIt points to great civilization in prehistoric times, and a still greater antiquity.\n\nThe Schesoo-Hor (\"the servants of Horus\") were the people who had settled in Egypt; and, as M.\n\nG.\n\nMaspero affirms, it is to this prehistoric race that \"belongs the honour .\n\n.\n\n.\n\nof having founded the principal cities of Egypt, and established the most important sanctuaries.\" This was before the great Pyramid epoch, and when Egypt had hardly arisen from the waters.\n\nYet \"they possessed the hieroglyphic form of writing special to the Egyptians, and must have been already considerably advanced in civilization.\" It was, says Lenormant, \"the country of the great prehistoric sanctuaries, seats of the sacerdotal dominion, which played the most important part in the origin of civilization.\" What is the date assigned to this people?\n\nWe hear of 4,000, at the utmost of 5,000 years B.C.\n\n(Maspero).\n\nNow it is claimed that it is by means of the cycle of 25,868 years (the Sidereal year) that the approximate year of the erection of the Great Pyramid can be ascertained.\n\n\"Assuming that the long narrow downward passage was directed towards the pole star of the pyramid builders, astronomers have shown that .\n\n.\n\n.\n\n.\n\nAlpha Draconis, the then pole-star, was in the required position about 3,350 B.C.\n\n, as well as in 2,170 B.C.\n\n(Proctor, quoted by Staniland Wake.) But we are also told that \"this relative position of Alpha Draconis and Alcyone being an extraordinary one .\n\n.\n\nit could not occur again for a whole sidereal year\" ( ibid ) .\n\nThis demonstrates that, since the Dendera Zodiac shows the passage of three sidereal years, the great Pyramid must have been built 78,000 years ago, or in any case that this possibility deserves to be accepted at least as readily as the later date of 3,350 B.C.\n\nNow on the Zodiac of a certain temple in far Northern India, as on the Dendera Zodiac, the same characteristics of the signs are found.\n\nThose who know well the Hindu symbols and constellations, will be able to find out by the description of the Egyptian, whether the indications of the chronological time are correct or not.\n\nOn the Dendera Zodiac as preserved by the modern Egyptian Coptic and Greek adepts, and explained a little differently by Mackey, the Lion stands upon the Hydra and his tail is almost straight, pointing downwards at an angle of forty or fifty degrees, this position agreeing with the original conformation of these constellations.\n\n\"But in many places we see the Lion ( Simha ),\" [[Vol.\n\n2, Page]] 433 THEORIES OF A SELF-MADE ADEPT.\n\nMackey adds, \"with his tail turned up over his back, and ending with a Serpent's head; thereby showing that the Lion had been 'inverted'; which, indeed, must have been the case with the whole Zodiac and every other Constellation, when the Pole had been inverted.\" Speaking of the Circular Zodiac, given also by Denon, he says: -- There, \"the Lion is standing on the Serpent, and his tail forming a curve downward, from which it is found that though six or seven hundred thousand years must have passed between the two positions, yet they had made but little difference between in the constellations of Leo and the Hydra; while Virgo is represented very differently in the two.\n\nIn the circular Zodiac, the Virgin is nursing her child; but it seems that they had not had that idea when the pole was first within the plane of the Ecliptic; for in this Zodiac, as given by Denon, we see three Virgins between the Lion and the Scales, the last of which holds in her hand an ear of wheat.\n\nIt is much to be lamented that there is in this Zodiac a breach of the figure in the latter part of Leo and the beginning of Virgo which has taken away one Decan out of each sign.\" Nevertheless, the meaning is plain, as the three Zodiacs belong to three different epochs: namely, to the last three family races of the fourth Sub-race of the Fifth Root-race, each of which must have lived approximately from 25 to 30,000 years.\n\nThe first of these (the \"Aryan-Asiatics\") witnessed the doom of the last of the populations of the \"giant Atlanteans\"* who perished some 850,000 years ago (the Ruta and Daitya Island-Continents) toward the close of the Miocene Age.** The fourth sub-race witnessed the destruction of the last remnant of the Atlanteans -- the Aryo-Atlanteans in the last island of Atlantis, namely, some 11,000 years ago.\n\nIn order to understand this the reader [[Footnote(s)]] ------------------------------------------------- * The term \"Atlantean\" must not mislead the reader to regard these as one race only, or even a nation.\n\nIt is as though one said \"Asiatics.\" Many, multityped, and various were the Atlanteans, who represented several humanities, and almost a countless number of races and nations, more varied indeed than would be the \"Europeans\" were this name to be given indiscriminately to the five existing parts of the world; which, at the rate colonization is proceeding, will be the case, perhaps, in less than two or three hundred years.\n\nThere were brown, red, yellow, white and black Atlanteans; giants and dwarfs (as some African tribes comparatively are, even now).\n\n** Says a teacher in \"Esoteric Buddhism,\" on p.\n\n64: \"In the Eocene age, even in its very first part, the great cycle of the fourth race men the (Lemuro) Atlanteans had already reached its highest point (of civilization), and the great continent, the father of nearly all the present continents, showed the first symptoms of sinking.\n\n.\n\n.\n\n.\" And on page 70, it is shown that Atlantis as a whole perished during the Miocene period."


[content]
body = "\"Ten is the Mother of the Soul, for Life and Light are therein united,\" says Hermes.\n\n\"For number one is born of the Spirit and the number ten from matter (chaos, feminine); the unity has made the ten, the ten the unity\" ( Book of the Keys ) .\n\nBy the means of the Temura, the anagrammatical method of the Kabala, and the knowledge of 1065 (21), a universal science may be obtained regarding Kosmos and its mysteries\" (Rabbi Yogel).\n\nThe Rabbis regard the numbers 10, 6, and 5 as the most sacred of all.\n\n** The reader may be told that an American Kabalist has now discovered the same number for the Elohim.\n\nIt came to the Jews from Chaldaea.\n\nSee \"Hebrew Metrology\" in the Masonic Review, July, 1885, McMillan Lodge, No.\n\n141.\n\n[[Vol.\n\n1, Page]] 91 THE IMMACULATE CONCEPTIONS.\n\nmathematical formulae to express it.\n\nThis set of figures must have the same meaning, since the 1 : 314,159, and then again 1 : 3 : 1,415,927 are worked out in the secret calculations to express the various cycles and ages of the \"first born,\" or 311,040,000,000,000 with fractions, and yield the same 13,415 by a process we are not concerned with at present.\n\nAnd it may be shown that Mr.\n\nRalston Skinner, author of The Source of Measures , reads the Hebrew word Alhim in the same number values, by omitting, as said, the ciphers and by permutation -- 13,514: since (a) is 1 : (l) is 3 (or 30); (h) is 5; (i) 1 for 10; and (m) is 4 (40), and anagrammatically -- 31,415 as explained by him.\n\nThus, while in the metaphysical world, the circle with the one central Point in it has no number, and is called Anupadaka (parentless and numberless) -- viz., it can fall under no calculation, -- in the manifested world the mundane Egg or Circle is circumscribed within the groups called the Line, the Triangle, the Pentacle, the second Line and the Cube (or 13514); and when the Point having generated a Line, thus becomes a diameter which stands for the androgynous Logos, then the figures become 31415, or a triangle, a line, a cube, the second line, and a pentacle.\n\n\"When the Son separates from the Mother he becomes the Father,\" the diameter standing for Nature, or the feminine principle.\n\nTherefore it is said: \"In the world of being, the one Point fructifies the Line -- the Virgin Matrix of Kosmos (the egg-shaped zero) -- and the immaculate Mother gives birth to the form that combines all forms.\" Prajapati is called the first procreating male, and \"his Mother's husband.\"* This gives the key-note to all the later divine sons from immaculate mothers.\n\nIt is greatly corroborated by the significant fact that Anna (the name of the Mother of the Virgin Mary) now represented by the Roman Catholic church as having given birth to her daughter in an immaculate way (\"Mary conceived without sin\"), is derived from the Chaldean Ana, heaven, or Astral Light, Anima Mundi; whence Anaitia, Devi-durga, the wife of Siva, is also called Annapurna, [[Footnote(s)]] ------------------------------------------------- * We find the same expression in Egypt.\n\nMout signifies, for one thing, \"Mother,\" and shows the character assigned to her in the triad of that country.\n\n\"She was no less the mother than the wife of Ammon, one of the principle titles of the god being \"the husband of his mother.\" The goddess Mout, or Mut, is addressed as \"our lady,\" the \"queen of Heaven\" and of \"the Earth,\" thus \"sharing these titles with the other mother goddesses, Isis, Hathor, etc.\" (Maspero).\n\n[[Vol.\n\n1, Page]] 92 THE SECRET DOCTRINE.\n\nand Kanya, the Virgin; \"Uma-Kanya\" being her esoteric name, and meaning the \"Virgin of light,\" Astral Light in one of its multitudinous aspects.\n\n( c ) The Devas, Pitris, Rishis; the Suras and the Asuras; the Daityas and Adityas; the Danavas and Gandharvas, etc., etc., have all their synonyms in our Secret Doctrine, as well as in the Kabala and the Hebrew Angelology; but it is useless to give their ancient names, as it would only create confusion.\n\nMany of these may be also found now, even in the Christian hierarchy of divine and celestial powers.\n\nAll those Thrones and Dominions, Virtues and Principalities, Cherubs, Seraphs and demons, the various denizens of the Sidereal World, are the modern copies of archaic prototypes.\n\nThe very symbolism in their names, when transliterated and arranged in Greek and Latin, are sufficient to show it, as will be proved in several cases further on.\n\nThe \"Sacred Animals\" are found in the Bible as well as in the Kabala, and they have their meaning (a very profound one, too) on the page of the origins of Life.\n\nIn the Sepher Jezirah it is stated that \"God engraved in the Holy Four the throne of his glory, the Ophanim (Wheels or the World-Spheres), the Seraphim,* the Sacred Animals, and the ministering angels, and from these three (the Air, Water, and Fire or Ether) he formed his habitation.\" Thus was the world made \"through three Seraphim -- Sepher, Saphar, and Sipur,\" or \"through Number, Numbers, and Numbered.\" With the astronomical key these \"Sacred Animals\" become the signs of the Zodiac.\n\n[[Footnote(s)]] ------------------------------------------------- * This is the literal translation from the IXth and Xth Sections: \"Ten numbers without what?\n\nOne: the spirit of the living God .\n\n.\n\n.\n\n.\n\nwho liveth in eternities!\n\nVoice and Spirit and Word, and this is the Holy Spirit.\n\nTwo: Spirit out of Spirit.\n\nHe designed and hewed therewith twenty-two letters of foundation, three Mothers and seven double and Twelve single, and one spirit out of them.\n\nThree: Water out of spirit; he designed and hewed with them the barren and the void, mud and earth.\n\nHe designed them as a flowerbed, hewed them as a wall, covered them as a paving.\n\nFour: Fire out of water."


body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n2 [[Vol.\n\n2, Page]] 437 MORE IN THE FORTHCOMING VOLUMES.\n\nCONCLUSION.\n\nSpace forbids us to say anything more, and this part of the \"Secret Doctrine\" has to be closed.\n\nThe forty-nine Stanzas and the few fragments from the Commentaries just given are all that can be published in these volumes.\n\nThese, with some still older records -- to which none but the highest Initiates have access -- and a whole library of comments, glossaries, and explanations, form the synopsis of Man's genesis.\n\nIt is from the Commentaries that we have hitherto quoted and tried to explain the hidden meaning of some of the allegories, thus showing the true views of esoteric antiquity upon geology, anthropology, and even ethnology.\n\nWe will endeavour in the Part which follows, to establish a still closer metaphysical connection between the earliest races and their Creators, the divine men from other worlds; accompanying the statements proffered with the most important demonstrations of the same in esoteric Astronomy and Symbolism.\n\nIn Volume III .\n\nof this work (the said volume and the IV th being almost ready) a brief history of all the great adepts known to the ancients and the moderns in their chronological order will be given, as also a bird's eye view of the Mysteries, their birth, growth, decay, and final death -- in Europe.\n\nThis could not find room in the present work.\n\nVolume IV .\n\nwill be almost entirely devoted to Occult teachings.\n\nThe duration of the periods that separate, in space and time, the Fourth from the Fifth Race -- in the historical* or even the legendary beginnings of the latter -- is too tremendous for us to offer, even to a Theosophist, any more detailed accounts of them.\n\nDuring the course of the post-diluvian ages -- marked at certain periodical epochs by the most terrible cataclysms -- too many races and nations were born, and have disappeared almost without leaving a trace, for any one to offer any description of the slightest value concerning them.\n\nWhether the Masters of Wisdom have a consecutive and full history of our race from its incipient stage down to the present times; whether they possess the uninterrupted record of man since he became the complete physical being, and became thereby the king of the animals and master on this earth -- is not for the writer to say.\n\nMost probably they have, [[Footnote(s)]] ------------------------------------------------- * The word \"historical\" is used, because, although historians have dwarfed almost absurdly the dates that separate certain events from our modern day, nevertheless, once that they are known and accepted, they belong to history.\n\nThus the Trojan War is an historical event; and though even less than 1,000 years B.C.\n\nis the date assigned to it, yet in truth it is nearer 6,000 than 5,000 years B.C .\n\n[[Vol.\n\n2, Page]] 438 THE SECRET DOCTRINE.\n\nand such is our own personal conviction.\n\nBut if so, this knowledge is only for the highest Initiates, who do not take their students into their confidence.\n\nThe writer can, therefore, give but what she has herself been taught, and no more.\n\nBut even this will appear to the profane reader rather as a weird, fantastic dream, than as a possible reality.\n\nThis is only natural and as it should be, since for years such was the impression made upon the humble writer of these pages herself.\n\nBorn and bred in European, matter-of-fact and presumably civilized countries, she assimilated the foregoing with the utmost difficulty.\n\nBut there are proofs of a certain character which become irrefutable and are undeniable in the long run, to every earnest and unprejudiced mind.\n\nFor a series of years such were offered to her, and now she has the full certitude that our present globe and its human races must have been born, grown and developed in this, and in no other way.\n\nBut this is the personal view of the writer; and her orthodoxy cannot be expected to have any more weight than any other \"doxy,\" in the eyes of those to whom every fresh theory is heterodox until otherwise proved.\n\nTherefore are we Occultists fully prepared for such questions as these: \"How does one know that the writer has not invented the whole scheme?\n\nAnd supposing she has not, how can one tell that the whole of the foregoing, as given in the Stanzas, is not the product of the imagination of the ancients?\n\nHow could they have preserved the records of such an immense, such an incredible antiquity?\" The answer that the history of this world since its formation and to its end \"is written in the stars,\" i.e., is recorded in the Zodiac and the Universal Symbolism whose keys are in the keeping of the Initiates, will hardly satisfy the doubters.\n\nThe antiquity of the Zodiac in Egypt is much doubted, and it is denied point-blank with regard to India.\n\n\"Your conclusions are often excellent, but your premises are always doubtful,\" the writer was once told by a profane friend.\n\nTo this, the answer came that it was one point, at least, gained on the scientific syllogisms.\n\nFor, with the exception of a few problems from the domain of purely physical science, both the premises and conclusions of the men of Science are as hypothetical as they are almost invariably erroneous.\n\nAnd if they do not so appear to the profane, the reason is simply this: the said profane is very little aware, taking as he does his scientific data on faith, that both premises and conclusions are generally the product of the same brains, which, however learned, are not infallible; a truism demonstrated daily by the shifting and re-shifting of scientific theories and speculations.\n\nHowever it may be, the records of the temples, Zodiacal and traditional, as well as the ideographic records of the East, as read by the [[Vol.\n\n2, Page]] 439 MODERN SCIENCE MISTRUSTED.\n\nadepts of the Sacred Science and Vidya, are not a whit more doubtful than the so-called ancient history of the European nations, now edited, corrected, and amplified by half a century of archaeological discoveries, and the very problematical readings of the Assyrian tiles, cuneiform fragments, and Egyptian hieroglyphics.\n\nSo are our data based upon the same readings, in addition to an almost inexhaustible number of Secret works of which Europe knows nothing -- plus the perfect knowledge by the Initiates of the symbolism of every word so recorded.\n\nSome of these records belong to an immense antiquity.\n\nEvery archaeologist and palaeontologist is acquainted with the ideographic productions of certain semi-savage tribes, who from time immemorial have aimed at rendering their thoughts symbolically.\n\nThis is the earliest mode of recording events and ideas.\n\nAnd how old this knowledge is in the human race may be inferred from some signs, evidently ideographic, found on hatchets of the Palaeolithic period."


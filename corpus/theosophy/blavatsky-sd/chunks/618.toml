[content]
body = "To study it on the exoteric lines one has to read Ragon's Cours Interpretatif des Initiations; on the esoteric -- the Hindu symbolism of numerals; as the combinations which were applied to it are numberless.\n\nIt is on the occult properties of the three equal lines or sides of the Triangle that Ragon based his studies and founded the famous masonic society of the Trinosophists (those who study three sciences; an improvement upon the ordinary three masonic degrees, given to those who study nothing except eating and drinking at the meetings of their lodges).\n\n\"The first line of the triangle offered to the apprentice for study,\" writes the founder, -- \"is the mineral kingdom, symbolized by Tubalc .\n\n.\n\n.\n\n(Tubal-cain).\n\nThe second side on which the ' companion ' has to meditate, is the vegetable kingdom, symbolized by Schibb (Schibboleth).\n\nIn this kingdom begins the generation of the bodies.\n\nThis is why the letter G is presented radiant before the eyes of the adept (?\n\n!).\n\nThe third side is left to the master mason, who has to complete his education by the study of the animal kingdom.\n\nIt is symbolized by Maoben (Sun of putrefaction)\" etc., etc.\n\nThe first solid figure is the Quaternary, symbol of immortality.\n\nIt is the pyramid: for the pyramid stands on a triangular, square, or polygonal base, and terminates with a point at the top, thus yielding the triad and the quaternary or the 3 and 4.\n\nIt is the Pythagoreans who taught the connection and relation between the gods and the numbers -- in a Science called arithmomancy.\n\nThe Soul is a number, they said, which moves of itself and contains the number 4; and spiritual and physical man is number 3, as the ternary represented for them not only the surface but also the principle of the formation of the physical body.\n\nThus animals were ternaries only, man alone being a septenary, when virtuous; a quinary when bad, for: -- Number 5 was composed of a binary and a ternary, which binary threw everything in the perfect form into disorder and confusion.\n\nThe [[Footnote(s)]] ------------------------------------------------- * The reason for it is simple, and was given in \" Isis Unveiled.\n\n\" In geometry, one line fails to represent a perfect body or figure, nor can two lines constitute a demonstratively perfect figure.\n\nThe triangle alone is the first perfect figure.\n\n[[Vol.\n\n2, Page]] 576 THE SECRET DOCTRINE.\n\nperfect man, they said, was a quaternary and a ternary, or four material and three immaterial elements; which three spirits or elements we likewise find in 5, when it represents the microcosm.\n\nThe latter is a compound of a binary directly relating to gross matter, and of three Spirits: \"since 5 is the ingenious union of two Greek accents placed over vowels which have or have not to be aspirated.\n\nThe first sign is called 'Strong Spirit' or superior Spirit, the spirit of God aspired ( spiratus ) and breathed by man.\n\nThe second sign the lower, is the Spirit of Love, representing the secondary Spirit; the third embraces the whole man.\n\nIt is the universal Quintessence, the vital fluid or Life.\" ( Ragon.\n\n) The more mystic meaning of 5 is given in an excellent article by Mr.\n\nSubba Row, in \"Five Years of Theosophy\" (pp.\n\n110, et seq.\n\n) -- \"The Twelve Signs of the Zodiac,\" in which he gives some rules that may help the inquirer to ferret out \"the deep significance of ancient Sanskrit nomenclature in the old Aryan myths and allegories.\" Meanwhile, let us see what has been hitherto stated about the constellation Capricornus in theosophical publications, and what is known of it generally.\n\nEvery one knows that is the tenth sign of the Zodiac into which the Sun enters at the winter solstice, about December 21st.\n\nBut very few are those who know -- even in India, unless they are initiated -- the real mystic connection which seems to exist, as we are told, between the names Makara and Kumara.\n\nThe first means some amphibious animal called flippantly 'crocodile,' as some Orientalists think, and the second is the title of the great patrons of Yogins (See \" Saiva Puranas, \") the Sons of, and even one with, Rudra (Siva); a Kumara himself.\n\nIt is through their connection with Man that the Kumaras are likewise connected with the Zodiac.\n\nLet us try to find out what the word Makara means.\n\nThe word Makara, says the author of \" The Twelve Signs of the Zodiac, \" \"contains within itself the clue to its correct interpretation.\n\nThe letter Ma is equivalent to No.\n\n5, and Kara means hand.\n\nNow in Sanskrit Thribhujam means a triangle, bhujam or Karam (both synonyms) being understood to mean a side.\n\nSo Makaram or Panchakaram means a Pentagon\" -- the five-pointed star or pentagon representing the five limbs of man.* Under the old system, we are told, Makara was the eighth instead of the tenth sign.** It is \"intended to represent the faces of the Universe, and indicates that the Universe is bounded by Pentagons, \" as the Sanskrit writers \"speak also of [[Footnote(s)]] ------------------------------------------------- * What is the meaning and the reason of this figure?\n\nBecause, Manas is the fifth principle, and because the pentagon is the symbol of Man -- not only of the five-limbed, but rather of the thinking, conscious MAN .\n\n** The reason for it becomes apparent when Egyptian symbology is studied.\n\nSee further on.\n\n[[Vol.\n\n2, Page]] 577 POSEION'S FIVE MINISTERS.\n\nAshtadisa or eight faces bounding Space,\" referring thus to the loka-palas, the eight points of the compass (the four cardinal and the four intermediate points) .\n\n.\n\n.\n\n\"From an objective point of view the Microcosm is represented by the human body.\n\nMakaram may be taken to represent simultaneously both the microcosm and the macrocosm, as external objects of perception.\" ( pp.\n\n113, 115) .\n\nBut the true esoteric sense of the word \"Makara,\" does not mean \"crocodile,\" in truth, at all, even when it is compared with the animal depicted on the Hindu Zodiac.\n\nFor it has the head and the fore-legs of an antelope and the body and tail of a fish.\n\nHence the tenth sign of the Zodiac has been taken variously to mean a shark, a dolphin, etc.; as it is the vahan of Varuna, the Ocean God, and is often called, for this reason, Jala-rupa or \"water-form.\" The dolphin was the vehicle of Poseidon-Neptune with the Greeks, and one with him, esoterically; and this \"dolphin\" is the \"sea-dragon\" as much as the Crocodile of the Sacred Nile is the vehicle of Horus, and Horus himself."


body = "(See also the 21st Fargard of the Vendidad on the celestial militia.) He is the golden-coloured Mercury, the [[ chrusophaes Hermes ]] whom the Hierophants forbade to name.\n\nHe is symbolised in Grecian mythology by one of the dogs (vigilance), which watch over the celestial flock (occult wisdom), or Hermes Anubis, or again Agathodaemon.\n\nHe is the Argus watching over the Earth, and which the latter mistakes for the Sun itself.\n\nIt is through the intercession of Mercury that the Emperor Julian prayed to the Occult Sun every night; for, as says Vossius: \"All the theologians agree to say that Mercury and the Sun are one .\n\n.\n\n.\n\n.\n\nHe was the most eloquent and the most wise of all the gods, which is not to be wondered at, since Mercury is in such close proximity to the Wisdom and the Word of God (the Sun) that he was confused with both.\" ( Idolatry, Vol.\n\nII., p.\n\n373.) Vossius utters here a greater occult truth than he suspected.\n\nThe Hermes-Sarameyas of the Greeks is closely related to the Hindu Saram and Sarameya, the divine watchman, \"who watches over the golden flock of stars and solar rays.\" In the clearer words of the Commentary: \" The Globe, propelled onward by the Spirit of the Earth and his six assistants, [[Footnote(s)]] ------------------------------------------------- * Copernicus wrote his theories on the \"Revolution of the Heavenly Bodies\" in the XVI th century, and the Zohar, even if compiled by Moses de Leon in the XIII th century, states that: \"In the book of Hammannunah, the Old, we learn .\n\n.\n\n.\n\nthat the earth turns upon itself in the form of a circle; that some are on top, the others below, .\n\n.\n\n.\n\n.\n\nthat there are some countries which are lightened, whilst others are in darkness; these have the day, when for the former it is night; and there are countries in which it is constantly day, or in which at least the night continues only some instants.\" ( Zohar iii., fol.\n\n10 a \"Qabbalah,\" p.\n\n139.) [[Vol.\n\n2, Page]] 29 THE CELESTIAL GOVERNORS OF HUMANITY.\n\ngets all its vital forces, life, and powers through the medium of the seven planetary Dhyanis from the Spirit of the Sun.\n\nThey are his messengers of Light and Life.\n\n\" \" Like each of the seven regions of the Earth, each of the seven* Firstborn (the primordial human groups) receives its light and life from its own especial Dhyani -- spiritually, and from the palace (house, the planet) of that Dhyani physically; so with the seven great Races to be born on it.\n\nThe first is born under the Sun; the second under Brihaspati (Jupiter); the third under Lohitanga (the \"fiery-bodied,\" Venus, or Sukra); the fourth, under Soma (the Moon, our Globe also, the Fourth Sphere being born under and from the Moon) and Sani, Saturn** the Krura-lochana (evil-eyed) and the Asita (the dark); the fifth, under Budha (Mercury).\" \" So also with man and every ' man ' in man (every principle).\n\nEach gets its specific quality from its primary (the planetary spirit), therefore every man is a septenate (or a combination of principles, each having its origin in a quality of that special Dhyani).\n\nEvery active power or force of the earth comes to her from one of the seven Lords.\n\nLight comes through Sukra (Venus) , who receives a triple supply, and gives one-third of it to the Earth.\n\nTherefore the two are called ' Twin-sisters, ' but the Spirit of the Earth is subservient to the ' Lord ' of Sukra.\n\nOur wise men represent the two Globes, one over, the other under the double Sign (the primeval Svastica bereft of its four arms, or the cross ).\"*** The \"double sign\" is, as every student of Occultism knows, the symbol of the male and the female principles in Nature, of the positive and the negative, for the Svastica or is all that and much more.\n\nAll antiquity, ever since the birth of Astronomy -- imparted to the Fourth Race by one of its divine kings of the Divine Dynasty -- and [[Footnote(s)]] ------------------------------------------------- * Science teaches that Venus receives from the sun twice as much light and heat as the earth.\n\nThus the planet, precursor of the dawn and the twilight, the most radiant of all the planets, said to give the earth one-third of the supply she receives, has two parts left for herself.\n\nThis has an occult as well as an astronomical meaning.\n\n** \"As it is above so it is below\" is the fundamental axiom of occult philosophy.\n\nAs the logos is seven-fold, i.e ., throughout Kosmos it appears as seven logoi under seven different forms, or, as taught by learned Brahmins, \"each of these is the central figure of one of the seven main branches of the ancient wisdom religion;\" and, as the seven principles which correspond to the seven distinct states of Pragna , or consciousness, are allied to seven states of matter and the seven forms of force, the division must be the same in all that concerns the earth.\n\n*** Venus is thus the Earth .\n\n[[Vol.\n\n2, Page]] 30 THE SECRET DOCTRINE.\n\nalso of Astrology, represented Venus in its astronomical tables as a Globe poised over a Cross, and the Earth, as a Globe under a Cross .\n\nThe esoteric meaning of this is: \"Earth fallen into generation, or into the production of its species through sexual union.\" But the later Western nations did not fail to give quite a different interpretation.\n\nThey explained this sign through their mystics -- guided by the light of the Latin Church -- as meaning that our Earth and all on it were redeemed by the Cross, while Venus (otherwise Lucifer or Satan) was trampling upon it.\n\nVenus is the most occult, powerful, and mysterious of all the planets; the one whose influence upon, and relation to the Earth is most prominent.\n\nIn exoteric Brahmanism, Venus or Sukra -- a male deity* -- is the son of Bhrigu, one of the Prajapati and a Vedic sage, and is Daitya-Guru, or the priest-instructor of the primeval giants.\n\nThe whole history of \"Sukra\" in the Puranas, refers to the Third and to the Fourth Races.\n\n\" It is through Sukra that the ' double ones ' ( the Hermaphrodites ) of the Third (Root-Race) descended from the first ' Sweat-born, '\" says the Commentary.\n\nTherefore it is represented under the symbol of (the circle and diameter) during the Third ( Race ) and of during the Fourth.\n\nThis needs explanation."


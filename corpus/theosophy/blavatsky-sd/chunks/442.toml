body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n2 [[Vol.\n\n2, Page]] 227 THE MOON-COLOURED RACE.\n\nSTANZA X.\n\nTHE HISTORY OF THE FOURTH RACE.\n\n------- §§ (38) The Birth of the Fourth, Atlantean Race.\n\n(39) The sub-races of the Fourth Humanity begin to divide and interblend; they form the first mixed races of various colours.\n\n(40) The superiority of the Atlantean over other races.\n\n(41) They fall into sin and beget children and monsters.\n\n(42) The first germs of Anthropomorphism and sexual religion.\n\nThey lose their \"third Eye.\" --------------------- 38.\n\nT HUS TWO BY TWO, ON THE SEVEN ZONES, THE T HIRD ( Race ) GAVE BIRTH TO THE F OURTH ( Race men ).\n\nT HE GODS BECAME NO-GODS ( Sura became a-Sura ) ( a ).\n\n------- 39.\n\nT HE F IRST ( Race ) O N EVERY ZONE WAS MOON-COLOURED ( yellow-white ); THE S ECOND, YELLOW, LIKE GOLD; THE T HIRD, RED; THE F OURTH, BROWN, WHICH BECAME BLACK WITH SIN.* T HE FIRST SEVEN ( human ) SHOOTS WERE ALL OF ONE COMPLEXION IN THE BEGINNING.\n\nT HE NEXT ( seven, the sub-races ) BEGAN MIXING THEIR COLOURS ( b ).\n\n( a ) To understand this verse 38, it must be read together with the three verses of Stanza IX .\n\nUp to this point of evolution man belongs more to metaphysical than physical nature.\n\nIt is only after the so-called F ALL , that the races began to develop rapidly into a purely human shape.\n\nAnd, in order that he may correctly comprehend the full meaning of the Fall, so mystic and transcendental is it in its real significance, the student must be told at once the details which preceded [[Footnote(s)]] ------------------------------------------------- * Strictly speaking, it is only from the time of the Atlantean, brown and yellow giant Races, that one ought to speak of MAN, since it was the Fourth race only which was the first completely human species, however much larger in size than we are now.\n\nIn \"Man\" (by two chelas), all that is said of the Atlanteans is quite correct.\n\nIt is chiefly that race which became \"black with sin\" that brought the divine names of the Asuras, the Rakshasas and the Daityas into disrepute, and passed them on to posterity as the names of fiends.\n\nFor, as said, the Suras (gods) or Devas having incarnated in the wise men of Atlantis, the names of Asuras and Rakshasas were given to the Atlanteans; which names, owing to their incessant conflicts with the last remnants of the Third Race and the \"Sons of Will and Yoga,\" have led to the later allegories about them in the Puranas.\n\n\"Asura was the generic appellation of all the Atlanteans who were the enemies of the spiritual heroes of the Aryans (gods).\" (\"Man,\" p.\n\n97.) [[Vol.\n\n2, Page]] 228 THE SECRET DOCTRINE.\n\nthis event; of which event modern theology has formed a pivot on which its most pernicious and absurd dogmas and beliefs are made to turn.\n\nThe archaic commentaries explain, as the reader must remember, that, of the Host of Dhyanis, whose turn it was to incarnate as the Egos of the immortal, but, on this plane, senseless monads -- that some \"obeyed\" (the law of evolution) immediately when the men of the Third Race became physiologically and physically ready, i.e ., when they had separated into sexes.\n\nThese were those early conscious Beings who, now adding conscious knowledge and will to their inherent Divine purity, created by Kriyasakti the semi-Divine man, who became the seed on earth for future adepts.\n\nThose, on the other hand, who, jealous of their intellectual freedom (unfettered as it then was by the bonds of matter), said: -- \"We can choose .\n\n.\n\n.\n\nwe have wisdom\" (See verse 24), and incarnated far later -- these had their first Karmic punishment prepared for them.\n\nThey got bodies (physiologically) inferior to their astral models, because their chhayas had belonged to progenitors of an inferior degree in the seven classes.\n\nAs to those \"Sons of Wisdom\" who had \"deferred\" their incarnation till the Fourth Race, which was already tainted (physiologically) with sin and impurity, they produced a terrible cause, the Karmic result of which weighs on them to this day.\n\nIt was produced in themselves, and they became the carriers of that seed of iniquity for aeons to come, because the bodies they had to inform had become defiled through their own procrastination.\n\n( See verses 32, 36.) This was the \"Fall of the angels,\" because of their rebellion against Karmic Law.\n\nThe \"fall of man \" was no fall, for he was irresponsible.\n\nBut \"Creation\" having been invented on the dualistic system as the \"prerogative of God alone,\" the legitimate attribute patented by theology in the name of an infinite deity of their own making, this power had to be regarded as \"Satanic,\" and as an usurpation of divine rights.\n\nThus, the foregoing, in the light of such narrow views, must naturally be considered as a terrible slander on man, \"created in the image of God,\" a still more dreadful blasphemy in the face of the dead-letter dogma.\n\n\"Your doctrine,\" the Occultists were already told, \"makes of man, created out of dust in the likeness of his God, a vehicle of the Devil, from the first.\" \"Why did you make of your god a devil -- both, moreover, created in your own image?\n\n\" is our reply.\n\nThe esoteric interpretation of the Bible, however, sufficiently refutes this slanderous invention of theology; the Secret Doctrine must some day become the just Karma of the Churches -- more anti-Christian than the representative assemblies of the most confirmed Materialists and Atheists.\n\nThe old doctrine about the true meaning of the \"Fallen Angels,\" in its anthropological and evolutionary sense, is contained in the Kabala, [[Vol.\n\n2, Page]] 229 THE MYSTERIES AMONG THE MAYAS.\n\nand explains the Bible.\n\nIt is found pre-eminent in Genesis when the latter is read in a spirit of research for truth, with no eye to dogma, and in no mood of preconception.\n\nThis is easily proven."


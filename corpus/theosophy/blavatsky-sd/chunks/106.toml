[content]
body = "The later Kabalists however, especially the Christian mystics, have played sad havoc with this magnificent symbol.* For the \" ten limbs\" of the Heavenly Man are the ten Sephiroth; but the first Heavenly Man is the unmanifested Spirit of the Universe, and ought never to be degraded into Microprosopus -- the lesser Face or Countenance, the prototype of man on the terrestrial plane.** Of this, however, later on.\n\nThe six-pointed Star refers to the six Forces or Powers of Nature, the six planes, principles, etc., etc., all synthesized by the seventh, or the central point in the Star.\n\nAll these, the upper and lower hierarchies included, emanate from the \"Heavenly or Celestial Virgin,\"*** the great mother in all religions, the Androgyne, the [[Footnote(s)]] ------------------------------------------------- * Indeed, the Microprosopus -- who is, philosophically speaking, quite distinct from the unmanifested eternal Logos \"one with the Father,\" -- has been finally brought, by centuries of incessant efforts, of sophistry and paradoxes, to be considered as one with Jehovah, or the ONE living God (!), whereas Jehovah is no better than Binah, a female Sephiroth.\n\nThis fact cannot be too frequently impressed upon the reader.\n\n** The Microprosopus is, as just said, the Logos manifested, and of such there are many.\n\n*** Sephira is the Crown, KETHER, in the abstract principle only, as a mathematical x (the unknown quantity).\n\nOn the plane of differentiated nature she is the female counterpart of Adam Kadmon -- the first Androgyne.\n\nThe Kabala teaches that the word \" Fiat Lux \" ( Genesis ch.\n\ni.) referred to the formation and evolution of the Sephiroth, and not to light as opposed to darkness.\n\nRabbi Simeon says: \"Oh com- [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 216 THE SECRET DOCTRINE.\n\nSephira-Adam-Kadmon.\n\nIn its Unity , primordial light is the seventh, or highest, principle, Daivi-prakriti , the light of the unmanifested Logos.\n\nBut in its differentiation it becomes Fohat , or the \"Seven Sons.\" The former is symbolised by the Central point in the double-Triangle; the latter by the hexagon itself, or the \"six limbs\" of the Microprosopus the Seventh being Malkuth, the \"Bride\" of the Christian Kabalists, or our Earth.\n\nHence the expressions: \" The first after the ' One ' is divine Fire; the second , Fire and AEther; the third is composed of Fire , AEther and Water; the fourth of Fire , AEther , Water , and Air.\n\n\" * The One is not concerned with Man-bearing globes , but with the inner invisible Spheres.\n\n\" The ' First-Born ' are the L IFE, the heart and pulse of the Universe; the Second are its M IND or Consciousness ,\" ** as said in the Commentary.\n\n( c ) The second Order of Celestial Beings, those of Fire and AEther (corresponding to Spirit and Soul, or the Atma-Buddhi) whose names are legion, are still formless, but more definitely \"substantial.\" They are the first differentiation in the Secondary Evolution or \"Creation\" -- a misleading word.\n\nAs the name shows, they are the prototypes of the incarnating Jivas or Monads, and are composed of the Fiery Spirit of Life.\n\nIt is through these that passes, like a pure solar beam, the ray which is furnished by them with its future vehicle, the Divine Soul, Buddhi.\n\nThese are directly concerned with the Hosts of the higher world of our system.\n\nFrom these twofold Units emanate the threefold.\n\nIn the cosmogony of Japan, when, out of the chaotic mass, an egglike nucleus appears, having within itself the germ and potency of all the universal as well as of all terrestrial life, it is the \"three-fold\" just named, which differentiates.\n\n\"The male aethereal\" ( Yo ) principle [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] panions, companions, man as an emanation was both man and woman, Adam Kadmon verily, and this is the sense of the words 'Let there be Light, and it was Light.' And this is the two-fold man.\" ( Auszuge aus dem Zohar , pp.\n\n13-15.) * See next footnote.\n\nThese elements of Fire, Air, etc., are not our compound elements.\n\n** This \"Consciousness\" has no relation to our consciousness.\n\nThe consciousness of the \"One manifested,\" if not absolute, is still unconditioned.\n\nMahat (the Universal Mind) is the first production of the Brahma-Creator, but also of the Pradhana (undifferentiated matter).\n\n[[Vol.\n\n1, Page]] 217 TEACHINGS CONTRASTED.\n\nascends and the female grosser or more material principle ( In ) is precipitated into the Universe of substance, when a separation occurs between the celestial and the terrestrial.\n\nFrom this the female, the mother, the first rudimentary objective being is born.\n\nIt is ethereal, without form or sex, and yet it is from this and the mother that the Seven Divine Spirits are born, from whom will emanate the seven creations , just as in the Codex Nazaraeus from Karabtanos and the Mother Spiritus the seven evilly disposed (material) spirits are born.\n\nIt would be too long to give here the Japanese names, but once translated they stand in this order: -- (1.) The \"Invisible Celibate,\" which is the creative logos of the noncreating \"father,\" or the creative potentiality of the latter made manifest.\n\n(2.) \"The Spirit (or the God) of the rayless depths\" (of Chaos); which becomes differentiated matter, or the world-stuff; also the mineral realm.\n\n(3.) \"The Spirit of the Vegetable Kingdom,\" of the \"Abundant Vegetation.\" (4.) This one is of dual nature, being at the same time \"The Spirit of the Earth\" and \"the Spirit of the Sands,\" the former containing the potentiality of the male element, the latter that of the female element, the two forming a combined nature.\n\nThese two were ONE; yet unconscious of being two.\n\nIn this duality were contained ( a ) the male, dark and muscular Being, Isu no gai no Kami; and ( b ) Eku gai no Kami , the female, fair and weaker or more delicate Being.\n\nThen, the: -- (5th and 6th.) Spirits who were androgynous or dual-sexed, and, finally: -- (7.) The Seventh Spirit, the last emanated from the \"mother,\" appears as the first divine human form distinctly male and female.\n\nIt was the seventh creation, as in the Puranas, wherein man is the seventh creation of Brahma."


[content]
body = "All of these steeples, turrets, domes, and Christian temples, are the reproductions of the primitive idea of the lithos, the upright phallus.\" (Vol.\n\nII., p.\n\n5.) Nevertheless, and however it may be, the fact that all these Hebrew Elohim, Sparks, and Cherubs are identical with the Devas, Rishis and the Fires and Flames, the Rudras and the forty-nine Agnis of the ancient Aryas, is sufficiently proven by and in the Kabala.\n\n[[Footnote(s)]] ------------------------------------------------- * Zohar iii.\n\n, 290 a , quoted in Isaac Myer's Qabbalah, p.\n\n387.\n\n-------"


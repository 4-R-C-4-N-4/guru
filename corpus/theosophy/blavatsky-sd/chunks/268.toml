[content]
body = "The precipitation has evidently not been effected at random , those molecules of the base being decomposed which happened to come in contact with a corresponding molecule of ammonia, for we have taken care that the liquids should be uniformly mixed, so that one molecule of the original salt would not be more exposed to decomposition [[Vol.\n\n1, Page]] 549 MONADS AND ATOMS.\n\nthan any other.\n\nIf, further, we consider the time which elapses before the appearance of a precipitate, we cannot avoid coming to the conclusion that the action which has been going on for the first few hours is of a selective character .\n\nThe problem is not why a precipitate is produced, but what determines or directs some atoms to fall down and others to remain in solution.\n\nOut of the multitude of atoms present, what power is it that directs each atom to choose the proper path?\n\nWe may picture to ourselves some directive force passing the atoms one by one in review, selecting one for precipitation and another for solution till all have been adjusted .\" The italics in the above passage are ours.\n\nWell may a man of science ask himself, \"What power is it that directs each atom,\" and what is it that its character should be selective?\n\nTheists would solve the question by answering \"God\"; and would solve nothing philosophically.\n\nOccultism answers on its own pantheistic grounds, and refers the reader to a subsequent section, \" Gods , Monads , and Atoms.\n\n\" The learned lecturer sees in it that which is his chief concern: the finger-posts and the traces of a path which may lead to the discovery, and the full and complete demonstration of an homogeneous element in nature.\n\nHe remarks: -- \"In order that such a selection can be effected there evidently must be some slight differences between which it is possible to select, and this difference almost certainly must be one of basicity, so slight as to be imperceptible by any test at present known, but susceptible of being nursed and encouraged to a point when the difference can be appreciated by ordinary tests.\" Occultism, which knows of the existence and presence in Nature of the One eternal element at the first differentiation of which the roots of the tree of life are periodically struck, needs no scientific proofs.\n\nIt says: -- Ancient Wisdom has solved the problem ages ago.\n\nAye; earnest, as well as mocking reader, Science is slowly but as surely approaching our domains of the Occult.\n\nIt is forced by its own discoveries to adopt nolens volens our phraseology and symbols.\n\nChemical Science is now compelled, by the very force of things, to accept even our illustration of the evolution of the gods and atoms, so suggestively and undeniably figured in the caduceus of Mercury, the God of Wisdom, and in the allegorical language of the Archaic Sages.\n\nSays a commentary in the esoteric doctrine: -- .\n\n.\n\n.\n\n.\n\nThe trunk of the A SVATTHA ( the tree of Life and Being , the ROD of the caduceus ) grows from and descends at every Beginning ( every new manvantara ) from the two dark wings of the Swan ( H ANSA) of Life.\n\nThe two Serpents , the ever - living and its illusion ( Spirit and matter ) whose two heads grow from the one head between the wings , descend along the trunk , interlaced in close embrace.\n\nThe two tails join on earth ( the manifested Universe ) into one , and this is the great illusion , O Lanoo!\n\n\" [[Vol.\n\n1, Page]] 550 THE SECRET DOCTRINE Every one knows what the caduceus is, already modified by the Greeks.\n\nThe original symbol -- with the triple head of the serpent -- became altered into a rod with a knob, and the two lower heads were separated, thus disfiguring somewhat the original meaning.\n\nYet it is as good an illustration as can be for our purpose, this laya rod entwined by two serpents.\n\nVerily the wonderful powers of the magic caduceus were sung by all the ancient poets, with a very good reason for those who understood the secret meaning.\n\nNow what says the learned President of the Chemical Society of Great Britain, in that same lecture, which has any reference to, or bearing upon, our above-mentioned doctrine.\n\nVery little; only this -- and nothing more: -- \"In the Birmingham address already referred to I asked my audience to picture the action of two forces on the original protyle --- one being time, accompanied by a lowering of temperature; the other, swinging to and fro like a mighty pendulum, having periodic cycles of ebb and swell, rest and activity, being intimately connected with the imponderable matter, essence, or source of energy we call electricity.\n\nNow, a simile like this effects its object if it fixes in the mind the particular fact it is intended to emphasize, but it must not be expected necessarily to run parallel with all the facts.\n\nBesides the lowering of temperature with the periodic ebb and flow of electricity, positive or negative, requisite to confer on the newly-born elements their particular atomicity, it is evident that a third factor must be taken into account.\n\nNature does not act on a flat plane; she demands space for her cosmogenic operations, and if we introduce space as the third factor, all appears clear.\n\nInstead of a pendulum, which, though to a certain extent a good illustration, is impossible as a fact, let us seek some more satisfactory way of representing what I conceive may have taken place.\n\nLet us suppose the zigzag diagram not drawn upon a plane, but projected in space of three dimensions.\n\nWhat figure can we best select to meet all the conditions involved?\n\nMany of the facts can be well explained by supposing the projection in space of Professor Emerson Reynolds' zigzag curve to be a spiral.\n\nThis figure is, however, inadmissible, inasmuch as the curve has to pass through a point neutral as to electricity and chemical energy twice in each cycle.\n\nWe must, therefore, adopt some other figure.\n\nA figure of eight (8), or lemniscate, will foreshorten into a zigzag just as well as a spiral, and it fulfils every condition of the problem.\" A lemniscate for the evolution downward, from Spirit into matter; [[Vol.\n\n1, Page]] 551 THE CADUCEUS OF LIFE.\n\nanother form of a spiral , perhaps, in its reinvolutionary path onward, from matter into Spirit, and the necessary gradual and final reabsorption into the laya state, that which Science calls in her own way \"the point neutral as to electricity\" etc., or the zero point.\n\nSuch are the Occult facts and statement.\n\nThey may be left with the greatest security and confidence to Science, to be justified some day.\n\nLet us hear some more, however, about this primordial genetic type of the symbolical caduceus.\n\n\"Such a figure will result from three very simple simultaneous motions.\n\nFirst, a simple oscillation backwards and forwards (suppose east and west); secondly, a simple oscillation at right angles to the former (suppose north and south) of half the periodic time -- i.e."


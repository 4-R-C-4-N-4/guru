[content]
body = "The minds of those who live at that time shall be awakened, and become as pellucid as crystal.\n\n\"The men who are thus changed by virtue of that peculiar time (the sixth race) shall be as the seeds of other human beings, and shall give birth to a race who shall follow the laws of the Krita age of purity\"; i.e ., it shall be the seventh race, the race of \"Buddhas,\" the \"Sons of God,\" born of immaculate parents.\n\n------- B .\n\nT HE G ODS OF L IGHT PROCEED FROM THE G ODS OF D ARKNESS.\n\nThus it is pretty well established that Christ, the Logos, or the God in Space and the Saviour on Earth, is but one of the echoes of the same antediluvian and sorely misunderstood Wisdom.\n\nThe history begins by the descent on Earth of the \"Gods\" who incarnate in mankind, and this is the F ALL.\n\nWhether Brahma hurled down on Earth in the allegory by Bhagavant, or Jupiter by Kronos, all are the symbols of the human races.\n\nOnce landed on, and having touched this planet of dense matter, no snow-white wings of the highest angel can remain immaculate, or the Avatar (or incarnation) be perfect, as every such Avatar is [[Footnote(s)]] ------------------------------------------------- * Saith Uriel (chap.\n\nxxvi.\n\nv.\n\n3), in the \"Book of Enoch\" \"all those who have received mercy shall for ever bless God the everlasting King, \" who will reign over them.\n\n[[Vol.\n\n2, Page]] 484 THE SECRET DOCTRINE.\n\nthe fall of a God into generation.\n\nNowhere is the metaphysical truth more clear, when explained esoterically, or more hidden from the average comprehension of those who instead of appreciating the sublimity of the idea can only degrade, than in the Upanishads, the esoteric glossaries of the Vedas.\n\nThe Rig-Veda, as Guignault characterized it, \"is the most sublime conception of the great highways of Humanity.\" The Vedas are, and will remain for ever, in the esotericism of the Vedanta and the Upanishads, \"the mirror of the eternal Wisdom.\" For over sixteen centuries the new masks, forced on the faces of the old gods, have screened them from public curiosity, but they have finally proved a misfit.\n\nYet the metaphorical F ALL, and as metaphorical atonement and crucifixion, led Western Humanity through roads knee-deep in blood.\n\nWorse than all, they led it to believe in the dogma of the evil spirit distinct from the spirit of all good, whereas the former lives in all matter and pre-eminently in man.\n\nFinally it created the God-slandering dogma of Hell and eternal perdition; it spread a thick film between the higher intuitions of man and divine verities; and, most pernicious result of all, it made people remain ignorant of the fact that there were no fiends, no dark demons in the Universe before man's own appearance on this, and probably on other earths.\n\nHenceforth the people were led to accept, as the problematical consolation for this world's sorrows, the thought of original sin.\n\nThe philosophy of that law in Nature, which implants in man as well as in every beast a passionate, inherent, and instinctive desire for freedom and self-guidance, pertains to psychology and cannot be touched on now.\n\nTo show the feeling in higher Intelligences, to analyse and give a natural reason for it, would necessitate, moreover, an endless philosophical explanation for which there is no room here.\n\nPerhaps, the best synthesis of this feeling is found in three lines of Milton's Paradise Lost.\n\nSays the \"Fallen One\": -- \"Here we may reign secure; and in my choice, To reign is worth ambition, though in hell!\n\nBetter to reign in hell than serve in heaven .\n\n.\n\n.\n\n.\" Better be man, the crown of terrestrial production and king over its opus operatum, than be lost among the will-less spiritual Hosts in Heaven.\n\nWe have said elsewhere that the dogma of the first Fall rested on a few verses in Revelation; these verses being now shown a plagiarism from Enoch by some scholars.\n\nThese grew into endless theories and speculations, which gradually acquired the importance of dogma and inspired tradition.\n\nEvery one wanted to explain the verse about the seven-headed dragon with his ten horns and seven crowns, whose tail [[Vol.\n\n2, Page]] 485 THE SONS OF ETERNITY.\n\n\"drew the third part of the stars of heaven, and did cast them to the earth,\" and whose place, with that of his angels, \"was found no more in heaven.\" What the seven heads of the Dragon (cycle) mean, and its five wicked kings also, may be learned in the Addenda which close Part III .\n\nof this Volume.\n\nFrom Newton to Bossuet speculations were incessantly evolved in Christian brains with regard to these obscure verses.\n\n.\n\n.\n\n.\n\n.\n\n\"The star that falls, is the heresiarch Theodosius\" .\n\n.\n\n.\n\n.\n\nexplains Bossuet.\n\n\"The clouds of smoke, are the heresies of the Montanists.\n\n.\n\n.\n\n.\n\n.\n\nThe third part of the stars, are the martyrs, and especially the doctors of divinity.\n\n.\n\n.\n\n.\n\n.\" Bossuet ought to have known, however, that the events described in Revelation were not original, and may, as shown, be found in other and pagan traditions.\n\nThere were no scholastics nor Montanists during Vedic times, nor yet far later in China.\n\nBut Christian theology had to be protected and saved.\n\nThis was only natural.\n\nBut why should truth be sacrificed in order to protect from destruction the lucubrations of Christian theologians?\n\nThe princeps aeris hujus, the \"prince of the air\" of St.\n\nPaul, is not the devil, but the effects of the astral light, as Eliphas Levi correctly explains.\n\nThe Devil is not \"the God of this period,\" as he says, for it is the deity of every age and period, since man appeared on earth, and matter, in its countless forms and states, had to fight for its evanescent existence against other disintegrating Forces.\n\nThe \"Dragon\" is simply the symbol of the cycle and of the \"Sons of Manvantaric Eternity,\" who had descended on earth during a certain epoch of its formative period.\n\nThe \"clouds of smoke\" are a geological phenomenon.\n\nThe \"third part of the stars of heaven\" cast down to the earth -- refers to the divine Monads, (the Spirits of the Stars in Astrology) that circumambulate our globe; i.e.\n\n, the human Egos destined to perform the whole cycle of incarnations."


[content]
body = ") He rejects the conclusions of Kant, Herbert Spencer, of du Bois-Reymond and Tyndall.\n\nThe latter expresses the opinion of all the great men of science, as of the greatest thinkers of this and the past ages, in saying that \"the passage from the physics of the brain to the corresponding facts of Consciousness is unthinkable.\n\nWere our minds and senses so .\n\n.\n\n.\n\nilluminated as to enable us to see and feel the very molecules of the brain; were we capable of following all their motions, all their groupings .\n\n.\n\n.\n\nelectric discharges .\n\n.\n\n.\n\nwe should be as far as ever from the solution of the problem .\n\n.\n\n.\n\nThe chasm between the two classes of Phenomena would still remain intellectually impassable.\n\n\" But the complex function of the nerve-cells of the great German EMPIRIC, or, in other words, his Consciousness, will not permit him to follow the conclusions of the greatest thinkers of our globe.\n\nHe is greater than they.\n\nHe asserts this, and protests against all.\n\n\"No one has the right [[Footnote(s)]] ------------------------------------------------- * In \" The Transmigration of the Life-Atoms, \" we say, to explain better a position which is but too often misunderstood: -- \"It is omnipresent .\n\n.\n\n.\n\n.\n\nthough (on this plane of manifestation) often in a dormant state -- as in stone.\n\nThe definition which states that when this indestructible force is disconnected with one set of atoms ( molecules ought to have been said) it becomes immediately attracted by others, does not imply that it entirely abandons the first set (because the atoms themselves would then disappear), but only that it transfers its vis viva , or life power -- the energy of motion, to another set.\n\nBut because it manifests itself in the next set as what is called Kinetic energy, it does not follow that the first set is deprived of it altogether; for it is still in it, as potential energy or life latent,\" etc., etc.\n\nNow what can Haeckel mean by his \"not identical atoms but their peculiar motion and mode of aggregation,\" if it is not the same Kinetic energy we have been explaining?\n\nHe must have read Paracelsus and studied \"Five Years of Theosophy,\" without properly digesting the teachings, before evolving such theories.\n\n[[Vol.\n\n2, Page]] 674 THE SECRET DOCTRINE.\n\nto hold that in the future we (Haeckel) shall not be able to pass beyond those limits of our knowledge that to day seem impassable\"; and he quotes from Darwin's introduction to the \"Descent of Man\" these words, which he modestly applies to his scientific opponents and himself: \"It is always those who know little, and not those who know much, that positively affirm that this or that problem will never be solved by Science.\" The world may rest satisfied.\n\nThat day is not far off when the \"thrice great\" Haeckel will have shown (to his own satisfaction) that the consciousness of Sir I.\n\nNewton was, physiologically speaking, but the reflex action (or minus consciousness) caused by the peri-genesis of the plastidules of our common ancestor and old friend, the Moneron Haeckelii.\n\nThe fact that the said \"Bathybius\" has been found out and exposed as a pretender simulating the organic substance it was not ; and since, among the children of men, Lot's wife alone (and even this, only after her disagreeable metamorphosis into a salt pillar) could claim the pinch of salt it is, as her forefather -- will not dismay him at all.\n\nHe will go on asserting, as coolly as he has always done, that it was no more than the peculiar mode and motion of the ghost of the long-vanished atoms of our \"Father Bathybius,\" which, transmitted across aeons of time into the cell-tissue of the grey matter of the brains of every great man, caused Sophocles and AEschylus, as well as Shakespeare, to write their tragedies, Newton, his \"Principia,\" Humboldt, his \"Cosmos,\" etc.\n\netc.\n\nIt prompted Haeckel to invent Graeco-Latin names three inches long, pretending to mean a good deal, and meaning -- nothing.\n\nOf course we are quite aware that the true, honest evolutionist agrees with us; and that he is the first to say that not only is the geological record imperfect, but that there are enormous gaps in the series of hitherto discovered fossils, which can never be filled.\n\nHe will tell us, moreover, that \"no evolutionist assumes that man is descended from any existing ape or any extinct ape either, \" but that man and apes originated probably aeons back, in some common root stock.\n\nStill, as de Quatrefages points out, he will claim as an evidence corroborating his (the evolutionist's) claim, even this wealth of absent proofs, saying that \"all living forms have not been preserved in the fossil series, the chances of preservation being few and far between,\" even primitive man \"burying or burning his dead\" (A.\n\nWilson).\n\nThis is just what we ourselves claim.\n\nIt is just as possible that future should have in store for us the discovery of the giant skeleton of an Atlantean, 30ft.\n\nhigh, as the fossil of a pithecoid \"missing link\": only the former is more probable.\n\n-------"


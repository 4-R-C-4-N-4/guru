[content]
body = "Notwithstanding the efforts made to the contrary, an unprejudiced mind will discover [[Footnote(s)]] ------------------------------------------------- * Their intellection, of course, being of quite a different nature to any we can conceive of on Earth.\n\n[[Vol.\n\n1, Page]] 479 DUAL NATURE OF THE SUN.\n\nunder Newton's \"agent, material or immaterial\" (of his third letter to Bentley), the agent which causes gravity , and, in his personal working God, one finds just as much of the metaphysical devas and genii , as in Kepler's angelus rector conducting each planet, and the species immateriata by which the celestial bodies were carried along in their courses, according to that astronomer.\n\nWe shall have, in Book II., to openly approach dangerous subjects.\n\nWe must bravely face Science and declare, in the teeth of materialistic learning, of Idealism, Hylo-Idealism, Positivism and all-denying modern Psychology, that the true Occultist believes in \"Lords of Light;\" that he believes in a Sun, which, far from being simply \"a lamp of day\" moving in accordance with physical law, and far from being merely one of those Suns, which according to Richter -- \".\n\n.\n\n.\n\n.\n\nare Sun-flowers of a higher light\" -- is, like milliards of other Suns, the dwelling or the vehicle of a god, and a host of gods.\n\nIn this question, of course, it is the Occultists who will be worsted.\n\nThey will be considered on the prima facie aspect of the dispute to be ignoramuses, and labelled with more than one of the usual epithets given to those whom the superficially judging public, itself ignorant of the great underlying truths in nature, accuses of believing in mediaeval superstitions.\n\nLet it be so.\n\nSubmitting beforehand to every criticism in order to go on with their task, they only claim the privilege of showing that the physicists are as much at loggerheads among themselves in their speculations, as the latter are with the teachings of Occultism.\n\nThe Sun is matter, and the Sun is Spirit.\n\nOur ancestors -- the \"heathen,\" -- along with their modern successors, the Parsis -- were, and are, wise enough in their generation to see in it the symbol of Divinity, and at the same time to sense within, concealed by the physical Symbol, the bright God of Spiritual and terrestrial Light.\n\nSuch belief is now regarded as a superstition only by rank materialism, which denies Deity, Spirit, Soul, and admits no intelligence outside the mind of man.\n\nBut if too much of wrong superstition bred by \"Churchianity\" -- as Lawrence Oliphant calls it -- \"renders a man a fool,\" too much scepticism makes him mad.\n\nWe prefer the charge of folly in believing too much, to that of a madness which denies everything, as do Materialism and Idealism.\n\nHence, the Occultists are fully prepared to receive their dues from Materialism, and to meet the adverse criticism which will be poured on this work, not for writing it, but for believing in that which it contains.\n\nTherefore the discoveries, hypotheses, and unavoidable objections which will be brought forward by the scientific critics must be anticipated and disposed of.\n\nIt has also to be shown how far the [[Vol.\n\n1, Page]] 480 THE SECRET DOCTRINE.\n\noccult teachings depart from real science, and whether the ancient or the modern theories are the most logically and philosophically correct.\n\nThe unity and mutual relations of all parts of Kosmos were known to the ancients, before they became evident to modern astronomers and philosophers.\n\nAnd if even the external and visible portions of the Universe and their mutual relations cannot be explained in any other terms than those used by the adherents of the mechanical theory of the Universe in physical science, it follows that no materialist, who denies that the Soul of Kosmos (which appertains to metaphysical philosophy) exists, has the right to trespass upon that metaphysical domain.\n\nThat physical science is trying to, and actually does, encroach upon it, is only one more proof that \"might is right,\" and no more.\n\nAnother good reason for these Addenda is this.\n\nSince only a certain portion of the Secret teachings can be given out in the present age, if they were published without any explanations or commentary, the doctrines would never be understood even by theosophists.\n\nTherefore they must be contrasted with the speculations of modern science.\n\nArchaic axioms must be placed side by side with modern hypotheses and comparison left to the sagacious reader.\n\nOn the question of the \"Seven Governors,\" as Hermes calls the \"Seven Builders,\" the Spirits which guide the operations of nature, the animated atoms of which are the shadows, in their world, of their Primaries in the astral realms -- this work will, of course, besides the men of Science, have every materialist against it.\n\nBut this opposition can, at most, be only temporary.\n\nPeople have laughed at everything and scouted every unpopular idea at first, and then ended by accepting it.\n\nMaterialism and scepticism are evils that must remain in the world as long as man has not quitted his present gross form to don the one he had during the first and second races of this Round.\n\nUnless scepticism and our present natural ignorance are equilibrated by intuition and a natural spirituality, every being afflicted with such feelings will see in himself no better than a bundle of flesh, bones, and muscles, with an empty garret inside him which serves the purpose of storing his sensations and feelings.\n\nSir Humphry Davy was a great scientist, as deeply versed in physics as any theorist of our day, yet he loathed materialism.\n\n\"I heard with disgust,\" he says, \"in the dissecting-rooms, the plan of the physiologist, of the gradual secretion of matter, and its becoming endued with irritability, ripening into sensibility, and acquiring such organs as were necessary, by its own inherent forces, and at last rising into intellectual existence.\" Nevertheless, physiologists are not the most to be blamed for speaking of that only which they can see and estimate on the evidence of their physical senses.\n\nAstronomers [[Vol.\n\n1, Page]] 481 THE SONS OF LIGHT.\n\nand physicists are, we consider, far more illogical in their materialistic views than even physiologists, and this has to be proved.\n\nMilton's -- .\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n\"Light Ethereal, first of things, quintessence pure,\" has become with the materialists only -- .\n\n.\n\n.\n\n.\n\n.\n\n.\n\nPrime cheerer, light, Of all material beings, first and best.\n\nFor the occultists it is both Spirit and Matter.\n\nBehind the \"mode of motion,\" now regarded as \"the property of matter\" and nothing more, they perceive the radiant noumenon.\n\nIt is the \"Spirit of Light,\" the first born of the Eternal pure Element, whose energy (or emanation) is stored in the Sun, the great Life-Giver of the physical world, as the hidden Concealed Spiritual Sun is the Light- and Life-Giver of the Spiritual and Psychic Realms."


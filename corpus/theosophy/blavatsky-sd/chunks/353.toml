[content]
body = "But it may be remarked, that if there is in the Hindu Pantheon a deity which resembles Jehovah, in, tempting by \"suggestion\" of thoughts and \"hardening\" of the hearts of those whom he would make his tools and victims, it is Narada.\n\nOnly with the latter it is no desire to obtain a pretext for \"plaguing,\" and thus showing that \" I am the Lord God.\" [[Footnote(s)]] ------------------------------------------------- * This is perhaps the reason why, in the Bhagavad Gita, we are told that Brahma had communicated to Narada in the beginning that all men whatsoever, even Mlechchhas, outcasts and barbarians, might know the true nature of Vasudeva and learn to have faith in that deity.\n\n[[Vol.\n\n2, Page]] 49 THE MIRROR OF FUTURITY.\n\nNor is it through any ambitious or selfish motive; but, verily, to serve and guide universal progress and evolution.\n\nNarada is one of the few prominent characters, save some gods, in the Puranas, who visits the so-called nether or infernal regions, Patala.\n\nWhether or not it was from his intercourse with the thousand-headed Sesha, the serpent who bears the seven Patalas and the entire world like a diadem upon his heads, and who is the great teacher of astronomy,* that Narada learned all that he knew, certain it is that he surpasses Garga's Guru in his knowledge of cyclic intricacies.\n\nIt is he who has charge of our progress and national weal or woe.\n\nIt is he who brings on wars and puts an end to them.\n\nIn the old Stanzas Pesh-Hun is credited with having calculated and recorded all the astronomical and cosmic cycles to come, and with having taught the Science to the first gazers at the starry vault.\n\nAnd it is Asuramaya, who is said to have based all his astronomical works upon those records, to have determined the duration of all the past geological and cosmical periods, and the length of the all the cycles to come, till the end of this life-cycle, or the end of the seventh Race.\n\nThere is a work among the Secret Books, called the \"Mirror of Futurity,\" wherein all the Kalpas within Kalpas and cycles within the bosom of Sesha, or infinite Time, are recorded.\n\nThis work is ascribed to Pesh-Hun Narada.\n\nThere is another old work which is attributed to various Atlanteans.\n\nIt is these two Records which furnish us with the figures of our cycles, and the possibility of calculating the date of cycles to come.\n\nThe chronological calculations which will presently be given are, however, those of the Brahmins as explained further on; but most of them are also those of the Secret Doctrine.\n\nThe chronology and computations of the Brahmin Initiates are based upon the Zodiacal records of India, and the works of the above-mentioned astronomer and magician -- Asuramaya.\n\nThe Atlantean zodiacal records cannot err, as they were compiled under the guidance of those who first taught astronomy, among other things, to mankind.\n\nBut here again we are deliberately and recklessly facing a new difficulty.\n\nWe shall be told that our statement is contradicted by science, in the person of a man regarded as a great authority (in the West) upon all subjects of Sanskrit literature -- Professor Albrecht Weber, of Berlin.\n\nThis, to our great regret, cannot be helped; and we are ready to maintain what is now stated.\n\nAsuramaya, to whom the epic tradition points as the earliest astronomer in Aryavarta, one to whom \"the [[Footnote(s)]] ------------------------------------------------- * Sesha, who is also Ananta, the infinite, and the \"Cycle of Eternity\" in esotericism, is credited with having given his astronomical knowledge to Garga, the oldest astronomer of India, who propitiated him, and forthwith knew all about the planets and how to read omens.\n\n[[Vol.\n\n2, Page]] 50 THE SECRET DOCTRINE.\n\nSun-god imparted the knowledge of the stars,\" in propria persona, as Dr.\n\nWeber himself states, is identified by him, in some very mysterious way, with the \"Ptolemaios\" of the Greeks.\n\nNo more valid reason is given for this identification than that \"this latter name (Ptolemaios), as we see from the inscription of Piyadasi, became the Indian 'Turamaya,' out of which the name 'Asuramaya' might very easily grow.\" No doubt it \" might, \" but the vital question is -- Are there any good proofs that it has thus grown?\n\nThe only evidence that is given for it is, that it must be so: \"since this Maya is distinctly assigned to Romaka-pura in the West.\"* The Maya is evident, since no Sanskritist among Europeans can tell where that locality of \"Romaka-pura\" was, except, indeed, that it was somewhere \"in the West.\" Anyhow, as no member of the Asiatic Society, or Western Orientalist, will ever listen to a Brahmanical teaching, it is useless to take the objections of European Orientalists into consideration.\n\n\"Romakapura\" was in \"the West,\" certainly, since it was part and parcel of the last continent of A TLANTIS.\n\nAnd it is equally certain that it is Atlantis, which is assigned in the Hindu Puranas as the birth-place of Asuramaya, \"as great a magician as he was an Astrologer and an Astronomer.\" Moreover, Prof.\n\nWeber refuses to assign any great antiquity to the Indian Zodiac, and feels inclined to think that the Hindus never knew of a Zodiac at all till \"they had borrowed one from the Greeks.\"** This statement clashes with the most ancient traditions of India, and must therefore be ignored.\n\n(Vide \" The Zodiac and its Antiquity \") .\n\nWe are the more justified in ignoring it, as the learned German Professor himself tells us in the introduction to his work ( History of Sanskrit Literature ) that \"in addition to the natural obstacles which impede investigation (in India), there still prevails a dense mist of prejudices and preconceived opinions hovering over the land, and enfolding it as with a veil.\" Caught in that veil, it is no wonder that Dr.\n\nWeber should himself have been led into involuntary errors.\n\nLet us hope that he knows better now.\n\nNow whether Asuramaya is to be considered a modern myth, a personage who flourished in the day of the Macedonian Greeks, or as that which he is claimed to be by the Occultists, in any case his calculations agree entirely with those of the Secret Records.\n\nFrom fragments of immensely old works attributed to the Atlantean astronomer, and found in Southern India, the calendar elsewhere men- [[Footnote(s)]] ------------------------------------------------- * See \" Lectures on the Indian Literature, \" p.\n\n253, by Prof.\n\nA.\n\nWeber; in Trubner's Asiatic Series.\n\n** Even the Maya Indians of Guatemala had their Zodiac from untold antiquity."


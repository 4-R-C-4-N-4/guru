[content]
body = "Yet the Fifth will not die, but survive for a while: overlapping the new Race for many hundred thousands of years to come, it will become transformed with it -- slower than its new successor -- still getting entirely altered in mentality, general physique, and stature.\n\nMankind will not grow again into giant bodies as in the case of the Lemurians and the Atlanteans; because while the evolution of the Fourth race led the latter down to the very bottom of materiality in its physical development, the present Race is on its ascending arc; and the Sixth will be rapidly growing out of its bonds of matter, and even of flesh.\n\nThus it is the mankind of the New world -- one by far the senior of our Old one, a fact men had also forgotten -- of Patala (the Antipodes, or the Nether World, as America is called in India), whose mission and Karma it is, to sow the seeds for a forthcoming, grander, and far more glorious Race than any of those we know of at present.\n\nThe Cycles of Matter will be succeeded by Cycles of Spirituality and a fully developed mind.\n\nOn the law of parallel history and races, the majority of the future mankind will be composed of glorious Adepts.\n\nHumanity is the child of cyclic Destiny, and not one of its Units can escape its unconscious mission, or get rid of the burden of its co-operative work with nature.\n\nThus will mankind, race after race, perform its appointed cycle-pilgrimage.\n\nClimates will, and have already begun, to change, each tropical year after the other dropping one sub-race, but only to beget another higher race on the ascending cycle; while a series of other less favoured groups -- the failures of nature -- will, like some individual men, vanish from the human family without even leaving a trace behind.\n\nSuch is the course of Nature under the sway of K ARMIC L AW: of the ever present and the ever-becoming Nature.\n\nFor, in the words of a Sage, known only to a few Occultists:-- \" T HE P RESENT IS THE C HILD OF THE P AST; THE F UTURE, THE BEGOTTEN OF THE P RESENT.\n\nA ND YET, O PRESENT MOMENT!\n\nK NOWEST THOU NOT THAT THOU HAST NO PARENT, NOR CANST THOU HAVE A CHILD; THAT THOU ART EVER BEGETTING BUT THYSELF?\n\nB EFORE THOU HAST EVEN BEGUN TO SAY ' I AM THE PROGENY OF THE DEPARTED MOMENT, THE CHILD OF THE PAST,' THOU HAST BECOME THAT PAST ITSELF.\n\nB EFORE THOU UTTEREST THE LAST SYLLABLE, BEHOLD!\n\nTHOU ART NO MORE THE P RESENT BUT VERILY THAT F UTURE.\n\nT HUS, ARE THE P AST, THE P RESENT, AND THE F UTURE, THE EVER-LIVING TRINITY IN ONE -- THE M AHAMAYA OF THE A BSOLUTE IS .\" -------"


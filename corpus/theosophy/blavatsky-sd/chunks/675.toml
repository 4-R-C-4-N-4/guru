[content]
body = "Newcomb requires only ten millions to attain a temperature of 212 [[degrees]] Fahr.** Croll estimates seventy million years for the diffusion of the heat, etc.*** Bischof calculates that 350 million years would be required for the earth to cool from a temperature of 2,000 [[degrees]] to 200 [[degrees]] Centigrade.\n\nRead, basing his estimate on observed rates of denudation, demands 500 million years since sedimentation began in Europe.**** Lyell ventured a rough guess of 240 million years; Darwin thought 300 million years demanded by the organic transformations which his theory contemplates, and Huxley is disposed to demand a 1,000 millions\" (!!).\n\nTo this Prof.\n\nWinchell observes that \"some biologists .\n\n.\n\n.\n\n.\n\nseem to close their eyes tight and leap at one bound into the abyss of millions of years, of which they have no more adequate estimate than of infinity.\"***** Then he proceeds to give what he takes to be more correct geological figures: a few will suffice.\n\nAccording to Sir W.\n\nThomson \"the whole incrusted age of the world is 80,000,000 years\"; and agreeably with Prof.\n\nHoughton's calculations of a minimum limit for the time since the elevation of [[Footnote(s)]] ------------------------------------------------- * Nat.\n\nPhilos.\n\nApp.\n\nD., Trans.\n\nRoyal Soc., Edin.\n\n** \"Popular Astronomy,\" p.\n\n509.\n\n*** \"Climate and Time,\" p.\n\n335.\n\n**** Read.\n\nAddress, \"Liverpool Geolog.\n\nSociety, 1876.\" ***** \"World-Life,\" p.\n\n180.\n\n[[Vol.\n\n2, Page]] 695 MATERIALISTS AT LOGGER-HEADS.\n\nEurope and Asia, three hypothetical ages for three possible and different modes of upheaval are given: varying from the modest figures of 640,730 years, through 4,170,000 years to the tremendous figures of 27,491,000 years!!\n\nThis is enough, as one can see, to cover our claims for the four continents and even the figures of the Brahmins.\n\nFurther calculations, the details of which the reader may find in Prof.\n\nWinchell's work,* bring Houghton to an approximation of the sedimentary age of the globe -- 11,700,000 years.\n\nThese figures are found too small by the author, who forthwith extends them to 37,000,000 years.\n\nAgain, according to Croll,** 2,500,000 years \"represents the time since the beginning of the Tertiary age\" in one work; and according to another modification of his view, 15,000,000 only have elapsed since the beginning of the Eocene period;*** which, being the first of the three Tertiary periods, leaves the student suspended between 2 1/2 and 15 millions.\n\nBut if one has to hold to the former moderate figures, then the whole incrusted age of the world would be 131,600,000 years.**** As the last glacial period extended from 240,000 to 80,000 years ago (Prof.\n\nCroll's view), therefore, man must have appeared on earth from 100 to 120,000 years ago.\n\nBut, as says Prof.\n\nWinchell, with reference to the antiquity of the Mediterranean race, \"it is generally believed to have made its appearance during the later decline of the continental glaciers.\" Yet, he adds, this \"does not concern, however, the antiquity of the Black and Brown races, since there are numerous evidences of their existence in more southern regions, in times remotely pre-glacial\" (p.\n\n379).\n\nAs a specimen of geological certainty and agreement, these figures also may be added.\n\nThree authorities -- Messrs.\n\nT.\n\nBelt, F.G.S .; J.\n\nCroll, F.R.S .; and Robert Hunt, F.R.S ., -- in estimating the time that has elapsed since the Glacial epoch, give absolutely different figures, namely: -- Mr.\n\nBelt ...\n\n20,000 years.\n\nMr.\n\nJ.\n\nCroll ...\n\n240,000 \" Mr.\n\nR.\n\nHunt ...\n\n80,000 \" [[Footnote(s)]] ------------------------------------------------- * \"World-Life,\" pp.\n\n367-8.\n\n** \"Climate and Time.\" *** Quoted in Mr.\n\nCh.\n\nGould's \"Mythical Monsters,\" p.\n\n84.\n\n**** According to Bischof, 1,004,177 years -- according to Chevandier's calculations 672,788 years -- were required for the so-called coal formation.\n\n\"The tertiary strata, about 1,000 feet in thickness, required for their development about 350,000 years.\" See \"Force and Matter,\" Buchner, J.\n\nF.\n\nCollingwood's edition.\n\n[[Vol.\n\n2, Page]] 696 THE SECRET DOCTRINE.\n\n(But see \"The Ice-Age Climate and Time,\" Popular Science Review, Vol.\n\nxiv., p.\n\n242.) No wonder if Mr.\n\nPengelly confesses that \"it is at present and perhaps always will be IMPOSSIBLE to reduce, even approximately, geological time into years or even into millenniums \" ( Vide supra, foot-note).\n\nA wise word of advice from the Occultists to the gentlemen geologists: they ought to imitate the cautious example of Masons.\n\nAs chronology, they say, cannot measure the era of the creation, therefore, their \"Antient and Primitive Rite\" uses 000,000,000 as the nearest approach to reality.\n\nThe same uncertainty, contradictions and disagreement reign on all other subjects.\n\nThe scientific authorities on the Descent of Man are again, for all practical purposes, a delusion and a snare.\n\nThere are many anti -Darwinists in the British Association, and \"Natural Selection\" begins to lose ground.\n\nThough at one time the saviour, which seemed to rescue the learned theorists from a final intellectual collapse into the abyss of fruitless hypothesis, it begins to be distrusted.\n\nEven Mr.\n\nHuxley is showing signs of truancy to \"Selection,\" and thinks \"natural selection not the sole factor\": -- \"We greatly suspect that she (Nature) does make considerable jumps in the way of variation now and then, and that these saltations give rise to some of the gaps which appear to exist in the series of known forms\" ( Review of Kolliker ' s Criticisms ) .\n\nAgain, in \"Fallacies of Darwinism,\" (p.\n\n160), C.\n\nR.\n\nBree, M.D ., argues in this wise in considering the fatal gaps in Mr.\n\nDarwin's theory: -- \"It must be again called to mind that the intermediate forms must have been vast in numbers.\n\n.\n\n.\n\n.\n\n.\n\nMr.\n\nSt.\n\nGeorge Mivart believes that change in evolution may occur more quickly than is generally believed ; but Mr.\n\nDarwin sticks manfully to his belief, and again tells us ' natura non facit saltum ' \" -- wherein the Occultists are at one with Mr.\n\nDarwin.\n\nEsoteric teaching fully corroborates the idea of nature's slowness and dignified progression.\n\n\"Planetary impulses\" are all periodical."


[content]
body = ".\" For clearer understanding on the part of the general reader, it must be stated that Occult Science recognises Seven Cosmical Elements -- four entirely physical, and the fifth (Ether) semi-material, as it will become visible in the air towards the end of our Fourth Round, to reign supreme over the others during the whole of the Fifth.\n\nThe remaining two are as yet absolutely beyond the range of human perception.\n\nThese latter will, however, appear as presentments during the 6th and 7th Races of this Round, and will become known in the 6th and 7th Rounds respectively.* These seven elements with their numberless Sub-Elements [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] from within outwardly, every atom being said to contain in itself creative energy of the divine breath.\n\nHence, whereas after an absolute pralaya, or when the pre-existing material consists but of ONE Element, and BREATH \"is everywhere,\" the latter acts from without inwardly: after a minor pralaya, everything having remained in statu quo -- in a refrigerated state, so to say, like the moon -- at the first flutter of manvantara, the planet or planets begin their resurrection to life from within outwardly.\n\n* It is curious to notice how, in the evolutionary cycles of ideas, ancient thought seems to be reflected in modern speculation.\n\nHad Mr.\n\nHerbert Spencer read and studied ancient Hindu philosophers when he wrote a certain passage in his \"First Principles\" (p.\n\n482), or is it an independent flash of inner perception that made him say half correctly, half incorrectly, \"motion as well as matter, being fixed in quantity (?), it would seem that the change in the distribution of Matter which Motion effects, coming to a limit in whichever direction it is carried (?), the indestructible Motion thereupon necessitates a reverse distribution.\n\nApparently, the universally co-existent forces of attraction and repulsion which, as we have seen, necessitate rhythm in all minor changes throughout the Universe, also necessitate rhythm in the totality of its changes -- produce now an immeasurable period during which the attracting forces predominating, cause universal concentration, and then an immeasurable period, during which the repulsive forces predominating, cause universal diffusion -- alternate eras of Evolution and dissolution.\" [[Vol.\n\n1, Page]] 13 PROEM.\n\nfar more numerous than those known to Science) are simply conditional modifications and aspects of the ONE and only Element.\n\nThis latter is not Ether,* not even A'kasa but the Source of these.\n\nThe Fifth Element, now advocated quite freely by Science, is not the Ether hypothesised by Sir Isaac Newton -- although he calls it by that name, having associated it in his mind probably with the AEther, \"Father-Mother\" of Antiquity.\n\nAs Newton intuitionally says, \"Nature is a perpetual circulatory worker, generating fluids out of solids, fixed things out of volatile, and volatile out of fixed, subtile out of gross, and gross out of subtile.\n\n.\n\n.\n\n.\n\n.\n\nThus, perhaps, may all things be originated from Ether,\" (Hypoth, 1675).\n\nThe reader has to bear in mind that the Stanzas given treat only of the Cosmogony of our own planetary System and what is visible around it, after a Solar Pralaya.\n\nThe secret teachings with regard to the Evolution of the Universal Kosmos cannot be given, since they could not be understood by the highest minds in this age, and there seem to be very few Initiates, even among the greatest, who are allowed to speculate upon this subject.\n\nMoreover the Teachers say openly that not even the highest Dhyani-Chohans have ever penetrated the mysteries beyond those boundaries that separate the milliards of Solar systems from the \"Central Sun,\" as it is called.\n\nTherefore, that which is given, relates only to our visible Kosmos, after a \"Night of Brahma.\" Before the reader proceeds to the consideration of the Stanzas from the Book of Dzyan which form the basis of the present work, it is absolutely necessary that he should be made acquainted with the few fundamental conceptions which underlie and pervade the entire system of thought to which his attention is invited.\n\nThese basic ideas are few in number, and on their clear apprehension depends the understanding of all that follows; therefore no apology is required for asking the reader to make himself familiar with them first, before entering on the perusal of the work itself.\n\n[[Footnote(s)]] ------------------------------------------------- * Whatever the views of physical Science upon the subject, Occult Science has been teaching for ages that A'kasa -- of which Ether is the grossest form -- the fifth universal Cosmic Principle (to which corresponds and from which proceeds human Manas) is, cosmically, a radiant, cool, diathermanous plastic matter, creative in its physical nature, correlative in its grossest aspects and portions, immutable in its higher principles.\n\nIn the former condition it is called the Sub-Root; and in conjunction with radiant heat, it recalls \"dead worlds to life.\" In its higher aspect it is the Soul of the World; in its lower -- the DESTROYER.\n\n[[Vol.\n\n1, Page]] 14 THE SECRET DOCTRINE.\n\nThe Secret Doctrine establishes three fundamental propositions: -- ( a ) An Omnipresent, Eternal, Boundless, and Immutable P RINCIPLE on which all speculation is impossible, since it transcends the power of human conception and could only be dwarfed by any human expression or similitude.\n\nIt is beyond the range and reach of thought -- in the words of Mandukya, \"unthinkable and unspeakable.\" To render these ideas clearer to the general reader, let him set out with the postulate that there is one absolute Reality which antecedes all manifested, conditioned, being.\n\nThis Infinite and Eternal Cause -- dimly formulated in the \"Unconscious\" and \"Unknowable\" of current European philosophy -- is the rootless root of \"all that was, is, or ever shall be.\" It is of course devoid of all attributes and is essentially without any relation to manifested, finite Being.\n\nIt is \"Be-ness\" rather than Being (in Sanskrit, Sat ), and is beyond all thought or speculation.\n\nThis \"Be-ness\" is symbolised in the Secret Doctrine under two aspects.\n\nOn the one hand, absolute abstract Space, representing bare subjectivity, the one thing which no human mind can either exclude from any conception, or conceive of by itself.\n\nOn the other, absolute Abstract Motion representing Unconditioned Consciousness.\n\nEven our Western thinkers have shown that Consciousness is inconceivable to us apart from change, and motion best symbolises change, its essential characteristic.\n\nThis latter aspect of the one Reality, is also symbolised by the term \"The Great Breath,\" a symbol sufficiently graphic to need no further elucidation.\n\nThus, then, the first fundamental axiom of the Secret Doctrine is this metaphysical O NE A BSOLUTE -- B E-NESS -- symbolised by finite intelligence as the theological Trinity.\n\nIt may, however, assist the student if a few further explanations are given here."


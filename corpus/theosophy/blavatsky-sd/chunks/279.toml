[content]
body = "and, while it rests in Devachan, is referred to as \"the Three Witnesses to Karma.\" Atma (our seventh principle) being identical with the universal Spirit, and man being one with it in his essence, what is then the Monad proper?\n\nIt is that homogeneous spark which radiates in millions of rays from the primeval \"Seven;\" -- of which seven further on.\n\nIt is the EMANATING spark from the UNCREATED Ray -- a mystery.\n\nIn the esoteric, and even exoteric Buddhism of the North, Adi Buddha ( Chogi dangpoi sangye ), the One unknown, without beginning or end, identical with Parabrahm and Ain-Soph, emits a bright ray from its darkness.\n\nThis is the Logos (the first), or Vajradhara, the Supreme Buddha (also called Dorjechang ) .\n\nAs the Lord of all Mysteries he cannot manifest, but sends into the world of manifestation his heart -- the \"diamond heart,\" Vajrasattva ( Dorjesempa ) .\n\nThis is the second logos of creation, from whom emanate the seven (in the exoteric blind the five) Dhyani Buddhas, called the Anupadaka, \"the parentless.\" These Buddhas are the primeval monads from the world of incorporeal being , the Arupa world, wherein the Intelligences (on that plane only) have neither shape nor name, in the exoteric system, but have their distinct seven names in esoteric philosophy.\n\nThese Dhyani Buddhas emanate, or create from themselves, by virtue of Dhyana, celestial Selves -- the super -human Bodhisattvas.\n\nThese incarnating at the beginning of every human cycle on earth as mortal men, become occasionally, owing to their personal merit, Bodhisattvas among the Sons of Humanity, after which they may re-appear as Manushi (human) Buddhas.\n\nThe Anupadaka (or Dhyani-Buddhas) are thus identical with the Brahminical Manasaputra , \"mind-born sons\" -- whether of Brahma or either of the other two Trimurtian Hypostases, hence identical also with the Rishis and Prajapatis.\n\nThus, a passage is found in Anugita , which, read esoterically, shows plainly, though under another imagery, the same idea and system.\n\nIt says: \"Whatever entities there are in this world, moveable or immoveable, they are the very first to be dissolved (at pralaya ); and next the developments produced from the elements (from which the visible Universe is fashioned); and, after these developments (evolved entities), all the elements.\n\nSuch is the upperward gradation among entities.\n\nGods, Men, Gandharvas, Pisachas, Asuras, Rakshasas, all have been created by Svabhava (Prakriti, or plastic nature), not by actions, nor by a cause\" -- i.e.\n\n, not by any physical cause.\n\n\"These Brahmanas (the Rishi Prajapati?), the creators of the world, are born here (on earth) again and again.\n\nWhatever is produced from [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] subtraction of the sheaths and that it is the ONLY witness , or synthesized unity.\n\nThe less spiritual and philosophical school, solely with an eye to a trinity made three witnesses out of \"one,\" thus connecting it more with earth than with heaven.\n\n[[Vol.\n\n1, Page]] 572 THE SECRET DOCTRINE.\n\nthem is dissolved in due time in those very five great elements (the five, or rather seven, Dhyani Buddhas, also called \"Elements\" of Mankind), like billows in the ocean.\n\nThese great elements are in every way beyond the elements that make up the world (the gross elements).\n\nAnd he who is released even from these five elements (the tanmatras)* goes to the highest goal.\" \"The Lord Prajapati (Brahma) created all this by the mind only,\" i.e.\n\n, by Dhyana , or abstract meditation and mystic powers like the Dhyani Buddhas ( vide supra ) .\n\nEvidently then, these \"Brahmanas\" are identical with the Bodhisattvas (the terrestrial) of the heavenly Dhyani Buddhas.\n\nBoth, as primordial, intelligent \"Elements,\" become the creators or the emanators of the monads destined to become human in that cycle; after which they evolve themselves, or, so to say, expand into their own selves as Bodhisattvas or Brahmanas, in heaven and earth, to become at last simple men --\"the creators of the world are born here , on earth again and again \" -- truly.\n\nIn the Northern Buddhist system, or the popular exoteric religion, it is taught that every Buddha, while preaching the good law on earth, manifests himself simultaneously in three worlds: in the formless, as Dhyani Buddha, in the World of forms, as a Bodhisattva, and in the world of desire, the lowest (or our world) as a man.\n\nEsoterically the teaching differs: The divine, purely Adi-Buddhic monad manifests as the universal Buddhi (the Maha-buddhi or Mahat in Hindu philosophies) the spiritual, omniscient and omnipotent root of divine intelligence, the highest anima mundi or the Logos .\n\nThis descends \"like a flame spreading from the eternal Fire, immoveable, without increase or decrease, ever the same to the end\" of the cycle of existence, and becomes universal life on the Mundane Plane.\n\nFrom this Plane of conscious Life shoot out, like seven fiery tongues, the Sons of Light (the logoi of Life); then the Dhyani-Buddhas of contemplation: the concrete forms of their formless Fathers -- the Seven Sons of Light, still themselves , to whom may be applied the Brahmanical mystic phrase: \"Thou art 'THAT' -- Brahm.\n\n\" It is from these Dhyani-Buddhas that emanate their chhayas (Shadows) the Bodhisattvas of the celestial realms, the prototypes of the super -terrestrial Bodhisattvas, and of the terrestrial Buddhas, and finally of men.\n\nThe \"Seven Sons of Light\" are also called \"Stars.\" The star under which a human Entity is born, says the Occult teaching, will remain for ever its star, throughout the whole cycle of its incarnations in one Manvantara.\n\nBut this is not his astrological star.\n\nThe latter is concerned and connected with the personality , the former with [[Footnote(s)]] ------------------------------------------------- * The Tanmatras are literally the type or rudiment of an element devoid of qualities; but esoterically, they are the primeval noumenoi of that which becomes in the progress of evolution a Cosmic element in the sense given to the term in antiquity, not in that of physics.\n\nThey are the logoi, the seven emanations or rays of the logos.\n\n[[Vol.\n\n1, Page]] 573 THE CREST-JEWEL OF WISDOM.\n\nthe INDIVIDUALITY."


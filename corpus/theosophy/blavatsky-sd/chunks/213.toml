[content]
body = "For if the said Forces had nought to do with \"Creation\" so-called, why call them Elohim (Alhim) in plural; \"divine workmen\" and Energies ([[' Energeia ]]), incandescent celestial stones (lapides igniti coelorum), and especially, \" supporters of the World\" ([[ Kosmokratores ]]), governors or RULERS of the World ( rectores mundi ), the \"Wheels\" of the World ( Rotae ), Ophanim, Flames and P OWERS, \"Sons of God\" ( B ' ne Alhim ), \"Vigilant COUNSELLORS,\" etc., etc.\n\nIt was often premised (and as unjustly as usual) that China, nearly as old a country as India, had no cosmogony.\n\n\"It was unknown to Confucius, and the Buddhists extended their Cosmogony without introducing a personal God,\"* it is complained.\n\nThe Yi-King , \"the very essence of ancient thought and the combined work of the most venerated sages, fails to show a distinct cosmogony.\" Nevertheless, there is one, and a very distinct one.\n\nOnly as Confucius did not admit of a future life** and the Chinese Buddhists reject the idea of One Creator, accepting one cause and its numberless effects, they are misunderstood by the believers in a personal God.\n\nThe \"great Extreme\" as the commencement \"of changes\" (transmigrations) is the shortest and perhaps the most suggestive of all Cosmogonies, for those who, like the Confucianists, love virtue for its own sake, and try to do good unselfishly without perpetually looking to reward and profit.\n\nThe \"great Extreme\" of Confucius produces \"two figures.\" These \"two\" produce in their turn \"the four images\"; these again \"the eight symbols.\" It is complained that though the Confucianists see in them \"Heaven, Earth and man in miniature,\" .\n\n.\n\n.\n\nwe can see in them anything we like.\n\nNo doubt, and so it is with regard to many symbols, especially in those of the latest religions.\n\nBut they who know something of Occult numerals, see in these \"figures\" the symbol, however rude, of a harmonious progressive Evolution of Kosmos and its beings, both the Heavenly and the Terrestrial.\n\nAnd any one who has studied the numerical evolution in the primeval cosmogony of Pythagoras (a contemporary of Confucius) can never fail to find in his Triad , Tetractis and [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] a distance between this Kabalistical Deity and the Biblical Jehovah, the spiteful and revengeful God of Abram, Isaac, and Jacob, who tempted the former and wrestled with the last.\n\nNo Vedantin but would repudiate such a Parabrahm.\n\n* Rev.\n\nJoseph Edkins \" On Cosmogony ,\" p .\n\n320.\n\nAnd very wisely they have acted.\n\n** If he rejected it, it was on the ground of what he calls the changes -- in other words, rebirths -- of man, and constant transformations.\n\nHe denied immortality to the personality of man -- as we do -- not to MAN.\n\n[[Vol.\n\n1, Page]] 441 THE SAME IDEA IN CONFUCIANISM.\n\nDecade emerging from the ONE and solitary Monad, the same idea.\n\nConfucius is laughed at by his Christian biographer for \"talking of divination\" before and after this passage, and is represented as saying: \"The eight symbols determine good and ill fortune, and these lead to great deeds.\n\nThere are no imitable images greater than heaven and earth.\n\nThere are no changes greater than the four seasons (meaning North, South, East and West, et seq.\n\n) .\n\nThere are no suspended images brighter than the sun and moon.\n\nIn preparing things for use , there is none greater than the sage.\n\nIn determining good and ill-luck there is nothing greater than the divining straws and the tortoise.\n\n\"* Therefore, the \"divining straws\" and the \"tortoise,\" the \"symbolic sets of lines,\" and the great sage who looks at them as they become one and two, and two become four, and four become eight, and the other sets \"three and six,\" are laughed to scorn, only because his wise symbols are misunderstood.\n\nSo the author and his colleagues will scoff no doubt at the Stanzas given in our text, for they represent precisely the same idea.\n\nThe old archaic map of Cosmogony is full of lines in the Confucian style, of concentric circles and dots.\n\nYet all these represent the most abstract and philosophical conceptions of the Cosmogony of our Universe.\n\nAt all events it may answer, perhaps, better to the requirements and the scientific purposes of our age, than the cosmogonical essays of St.\n\nAugustine and the \"Venerable Bede,\" though these were published over a millennium later than the Confucian.\n\nConfucius, one of the greatest sages of the ancient world, believed in ancient magic, and practised it himself \"if we take for granted the statements of Kin-yu \" .\n\n.\n\n.\n\n.\n\nand \"he praised it to the skies in Yi-kin ,\" we are told by his reverend critic.\n\nNevertheless, even in his age -- i.e.\n\n, 600 B.C., Confucius and his school taught the sphericity of the Earth and even the heliocentric system; while, at about thrice 600 years after the Chinese philosopher, the Popes of Rome threatened and even burnt \"heretics\" for asserting the same.\n\nHe is laughed at for speaking of the \"Sacred Tortoise.\" No unprejudiced person can see any great difference between a tortoise and a lamb as candidates for sacredness, as both are symbols and no more.\n\nThe Ox, the Eagle,** the Lion, and occasionally [[Footnote(s)]] ------------------------------------------------- * He may be laughed at by the Protestants; but the Roman Catholics have no right to mock him, without becoming guilty of blasphemy and sacrilege.\n\nFor it is over 200 years since Confucius was canonized as a Saint in China by the Roman Catholics, who have thereby obtained many converts among the ignorant Confucianists.\n\n** The animals regarded as sacred in the Bible are not few: the goat for one, the Azaz-el , or God of Victory.\n\nAs Aben Ezra says: \"If thou art capable of comprehending the mystery of Azazel, thou wilt learn the mystery of His (God's) name, for it has similar associates in Scriptures.\n\nI will tell thee by allusion one portion of the mystery; [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 442 THE SECRET DOCTRINE.\n\nthe Dove, are \"the sacred animals\" of the Western Bible, the first three being found grouped round the Evangelists; and the fourth (the human face) is a Seraph, i.e."


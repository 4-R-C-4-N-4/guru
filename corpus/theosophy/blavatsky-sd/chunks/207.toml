[content]
body = "It exists in a latent condition in the bosom of Parabrahmam at the time of Pralaya.\n\n.\n\n.\n\n.\" (During Manvantara) \"it has a consciousness and an individuality of its own .\n\n.\n\n.\n\n.\n\n.\" (It is a centre of energy, but) .\n\n.\n\n.\n\n.\n\n.\n\nsuch centres of energy are almost innumerable in the bosom of Parabrahmam .\n\n.\n\n.\n\n.\n\n.\" \"It must not be supposed, that even the logos is the Creator, or that it is but a single centre of energy .\n\n.\n\n.\n\n.\n\n.\n\n.\n\ntheir number is almost infinite.\" \"This Ego,\" he adds, \"is the first that appears in Kosmos, and is the end of all evolution.\n\nIt is the abstract Ego\" .\n\n.\n\n.\n\n.\n\n.\n\n\"this is the first manifestation (or aspect) of Parabrahmam.\" \"When once it starts into conscious being .\n\n.\n\n.\n\n.\n\n.\n\n.\n\nfrom its objective standpoint, Parabrahmam appears to it as Mulaprakriti.\n\n\" \"Please bear this in mind,\" observes the lecturer, \"for here is the root of the whole difficulty about Purusha and Prakriti felt by the various writers on Vedantic philosophy.\n\nThis Mulaprakriti is material to it (the Logos), as any material object is material to us.\n\nThis Mulaprakriti is no more Parabrahmam than the bundle of attributes of a pillar is the pillar itself; Parabrahmam is an unconditioned and absolute reality, and Mulaprakriti is a sort of veil thrown over it.\n\nParabrahmam by itself cannot be seen as it is.\n\nIt is seen by the Logos with a veil thrown over it, and that veil is the mighty expanse of Cosmic matter.\n\n.\n\n.\n\n.\" \"Parabrahmam, after having appeared on the one hand as the Ego, and on the other as Mulaprakriti, acts as the one energy through the Logos .\" And the lecturer explains what he means by this acting of something which is nothing , though it is the ALL, by a fine simile.\n\nHe compares the Logos to the sun through which light and heat radiate, but whose energy, light and heat, exist in some unknown condition in Space and are diffused in Space only as visible light and heat, the sun being only the agent thereof.\n\nThis is the first triadic hypostasis.\n\nThe quaternary is made up by the energizing light shed by the Logos.\n\nThe Hebrew Kabalists give it in a shape which esoterically is [[Vol.\n\n1, Page]] 429 THE ONE IS KNOWN BY THE MANY.\n\nidentical with the Vedantic.\n\nA IN- S OPH, they taught, could not be comprehended, could not be located, nor named, though the causeless cause of all.\n\nHence its name -- A IN- S OPH -- is a term of negation, \"the inscrutable, the incognizable, and the unnameable.\" They made of it, therefore, a boundless circle, a sphere, of which human intellect, with the utmost stretch, could only perceive the vault.\n\nIn the words of one who has unriddled much in the Kabalistical system, in one of its meanings thoroughly, in its numerical and geometrical esotericism: -- \"Close your eyes, and from your own consciousness of perception try and think outward to the extremest limits in every direction.\n\nYou will find that equal lines or rays of perception extend out evenly in all directions, so that the utmost effort of perception will terminate in the vault of a sphere.\n\nThe limitation of this sphere will, of necessity, be a great Circle , and the direct rays of thought in any and every direction must be right line radii of the circle.\n\nThis, then, must be, humanly speaking, the extremest all-embracing conception of the Ain-Soph manifest , which formulates itself as a geometrical figure , viz., of a circle, with its elements of curved circumference and right line diameter divided into radii.\n\nHence, a geometrical shape is the first recognisable means of connection between the Ain-Soph and the intelligence of man.\"* This great circle (which Eastern Esotericism reduces to the point within the Boundless Circle) is the Avalokiteswara, the Logos or Verbum of which Mr.\n\nSubba Row speaks.\n\nBut this circle or manifested God is as unknown to us, except through its manifested universe, as the ONE, though easier, or rather more possible to our highest conceptions.\n\nThis Logos which sleeps in the bosom of Parabrahmam during Pralaya, as our \" Ego is latent (in us) at the time of sushupti , sleep\"; which cannot cognize Parabrahmam otherwise than as Mulaprakriti -- the latter being a cosmic veil which is \"the mighty expanse of cosmic matter\" -- is thus only an organ in cosmic creation, through which radiate the energy and wisdom of Parabrahmam, unknown to the Logos , as it is to ourselves.\n\nMoreover, as the Logos is as unknown to us as Parabrahmam is unknown in reality to the Logos, both Eastern Esotericism and the Kabala -- in order to bring the Logos within the range of our conceptions -- have resolved the abstract synthesis into concrete images; viz., into the reflections or multiplied aspects of that Logos or Avalokiteswara, Brahma, Ormazd, Osiris, Adam-Kadmon, call it by any of these names -- which aspects or Manvantaric emanations are the Dhyan Chohans, the Elohim, the Devas, the Amshaspends, &c., &c.\n\nMetaphysicians explain the root and germ of the latter, according to Mr.\n\nSubba Row, as the first manifestation of Parabrahmam, \"the highest trinity that we [[Footnote(s)]] ------------------------------------------------- * From the Masonic Review for June, 1886.\n\n[[Vol.\n\n1, Page]] 430 THE SECRET DOCTRINE.\n\nare capable of understanding,\" which is Mulaprakriti (the veil), the Logos , and the conscious energy \"of the latter,\" or its power and light*; or -- \"matter, force and the Ego , or the one root of self, of which every other kind of self is but a manifestation or a reflection.\" It is then only in this \"light\" (of consciousness) of mental and physical perception, that practical Occultism can throw this into visibility by geometrical figures; which, when closely studied, will yield not only a scientific explanation of the real, objective, existence** of the \"Seven sons of the divine Sophia,\" which is this light of the Logos, but show by means of other yet undiscovered keys that, with regard to Humanity, these \"Seven Sons\" and their numberless emanations, centres of energy personified, are an absolute necessity.\n\nMake away with them, and the mystery of Being and Mankind will never be unriddled , not even closely approached."


[content]
body = "Whether Egyptian or Pelasgian, Aryan or Semitic, the genius loci , the local god, embraced in its unity all nature; but not especially the four elements any more than one of their creations, such as trees, rivers, mounts or stars.\n\nThe genius loci -- a very late after-thought of the last sub-races of the Fifth Root-race, when the primitive and grandiose meaning had become nearly lost -- was ever the representative in his accumulated titles of all his colleagues.\n\nIt was the god of fire , symbolised by thunder, as Jove or Agni; the god of water , symbolised by the fluvial bull or some sacred river or fountain, as Varuna, Neptune, etc.; the god of air , manifesting in the hurricane and tempest, as Vayu and Indra; and the god or spirit [[Vol.\n\n1, Page]] 463 THE COSMIC GODS.\n\nof the earth, who appeared in earthquakes, like Pluto, Yama, and so many others.\n\nThese were the Cosmic gods, ever synthesizing all in one, as found in every cosmogony or mythology.\n\nThus, the Greeks had their Dodonean Jupiter, who included in himself the four elements and the four cardinal points, and who was recognized, therefore, in old Rome under the pantheistic title of Jupiter Mundus ; and who now, in modern Rome, has become the Deus Mundus , the one mundane god, who is made to swallow all others in the latest theology -- by the arbitrary decision of his special ministers.\n\nAs gods of Fire, Air, Water, they were celestial gods; as gods of the lower region , they were infernal deities: the latter adjective applying simply to the Earth.\n\nThey were \"Spirits of the Earth\" under their respective names of Yama, Pluto, Osiris, the \"Lord of the lower kingdom, etc., etc.,\" and their tellurial character proves it sufficiently.* The ancients knew of no worse abode after death than the Kamaloka , the limbus on this Earth.\n\nIf it is argued that the Dodonean Jupiter was identified with Aidoneus, the king of the subterranean world, and Dis , or the Roman Pluto and the Dionysius Chthonios, the subterranean, wherein, according to Creuzer (I, vi., ch.\n\n1), oracles were rendered, then it will become the pleasure of the Occultists to prove that both Aidoneus and Dionysius are the bases of Adonai, or \"Jurbo Adonai,\" as Jehovah is called in Codex Nazaraeus.\n\n\"Thou shalt not worship the Sun, who is named Adonai, whose name is also Kadush and El-El\" ( Cod.\n\nNaz.\n\n, I, 47; see also Psalm lxxxix., 18), and also \"Lord Bacchus.\" Baal-Adonis of the Sods or Mysteries of the pre-Babylonian Jews became the Adonai by the Massorah, the later-vowelled Jehovah.\n\nHence the Roman Catholics are right.\n\nAll these Jupiters are of the same family; but Jehovah has to be included therein to make it complete.\n\nJupiter- Aerios or Pan , the Jupiter Ammon, and the Jupiter-Bel-Moloch, are all correlations and one with Yurbo-Adonai, because they are all one cosmic nature.\n\nIt is that nature and power which create the specific terrestrial symbol, and the physical and material fabric of the latter, which proves the Energy manifesting through it as extrinsic.\n\nFor primitive religion was something better than simple pre-occupation about physical phenomena, as remarked by Schilling; and principles, more elevated than we modern Sadducees know of, \"were hidden under the transparent veil of such merely natural divinities as thunder, [[Footnote(s)]] ------------------------------------------------- * The Gehenna of the Bible was a valley near Jerusalem, where the monotheistic Jews immolated their children to Moloch, if the prophet Jeremiah is to be believed on his word.\n\nThe Scandinavian Hel or Hela was a frigid region -- again Kamaloka -- and the Egyptian Amenti a place of purification.\n\n(See Isis Unveiled , Vol.\n\nII., p.\n\n11.) [[Vol.\n\n1, Page]] 464 THE SECRET DOCTRINE.\n\nthe winds, and rain.\" The ancients knew and could distinguish the corporeal from the spiritual elements, in the forces of nature.\n\nThe four-fold Jupiter, as the four-faced Brahma -- the aerial, the fulgurant, the terrestrial, and the marine god -- the lord and master of the four elements, may stand as a representative for the great Cosmic gods of every nation.\n\nWhile passing power over the fire to Hephaistos-Vulcan, over the sea, to Poseidon-Neptune, and over the Earth, to Pluto-Aidoneus -- the AERIAL Jove was all these; for AE THER, from the first, had pre-eminence over, and was the synthesis of, all the elements.\n\nTradition points to a grotto, a vast cave in the deserts of Central Asia, whereinto light pours through its four seemingly natural apertures or clefts placed crossways at the four cardinal points of the place.\n\nFrom noon till an hour before sunset that light streams in, of four different colours, as averred -- red, blue, orange-gold, and white -- owing to some either natural or artificially prepared conditions of vegetation and soil.\n\nThe light converges in the centre around a pillar of white marble with a globe upon it, which represents our earth.\n\nIt is named the \"grotto of Zaratushta.\" When included under the arts and sciences of the fourth race, the Atlanteans, the phenomenal manifestation of the four elements, justly attributed by the believers in Cosmic gods to the intelligent interference of the latter, assumed a scientific character.\n\nThe magic of the ancient priests consisted, in those days, in addressing their gods in their own language.\n\n\"The speech of the men of the earth cannot reach the Lords.\n\nEach must be addressed in the language of his respective element\" -- is a sentence which will be shown pregnant with meaning.\n\n\" The Book of Rules \" cited adds as an explanation of the nature of that Element -language: \"It is composed of sounds , not words; of sounds, numbers and figures.\n\nHe who knows how to blend the three, will call forth the response of the superintending Power\" (the regent-god of the specific element needed).\n\nThus this \"language\" is that of incantations or of M ANTRAS, as they are called in India, sound being the most potent and effectual magic agent , and the first of the keys which opens the door of communication between Mortals and the Immortals.\n\nHe who believes in the words and teachings of St.\n\nPaul, has no right to pick out from the latter those sentences only that he chooses to accept, to the rejection of others; and St.\n\nPaul teaches most undeniably the existence of cosmic gods and their presence among us."


body = "1, Page]] 563 A PREMATURE DISCOVERY.\n\nIf the question is asked why Mr.\n\nKeely was not allowed to pass a certain limit, the answer is easy; because that which he has unconsciously discovered, is the terrible sidereal Force, known to, and named by the Atlanteans MASH-MAK, and by the Aryan Rishis in their Ashtar Vidya by a name that we do not like to give.\n\nIt is the vril of Bulwer Lytton's \"Coming Race,\" and of the coming races of our mankind.\n\nThe name vril may be a fiction; the Force itself is a fact doubted as little in India as the existence itself of their Rishis, since it is mentioned in all the secret works.\n\nIt is this vibratory Force, which, when aimed at an army from an Agni Rath fixed on a flying vessel, a balloon, according to the instructions found in Ashtar Vidya , reduced to ashes 100,000 men and elephants, as easily as it would a dead rat.\n\nIt is allegorised in the Vishnu Purana , in the Ramayana and other works, in the fable about the sage Kapila whose glance made a mountain of ashes of King Sagara's 60,000 sons, and which is explained in the esoteric works, and referred to as the Kapilaksha -- \"Kapila's Eye.\" And is it this Satanic Force that our generations were to be allowed to add to their stock of Anarchist's baby-toys, known as melenite, dynamite clock-works, explosive oranges, \"flower baskets,\" and such other innocent names?\n\nIs it this destructive agency, which, once in the hands of some modern Attila, e.g.\n\n, a blood-thirsty anarchist, would reduce Europe in a few days to its primitive chaotic state with no man left alive to tell the tale -- is this force to become the common property of all men alike?\n\nWhat Mr.\n\nKeely has already done is grand and wonderful in the extreme; there is enough work before him in the demonstration of his new system to \"humble the pride of those scientists who are materialistic, by revealing those mysteries which lie behind the world of matter,\" without revealing it nolens volens to all.\n\nFor surely Psychists and Spiritualists -- of whom there are a good number in the European armies -- would be the first to experience personally the fruits of such mysteries revealed.\n\nThousands of them would find themselves (and perhaps with the populations of whole countries to keep them company) in blue Ether very soon, were such a Force to be even entirely discovered, let alone made publicly known.\n\nThe discovery in its completeness is by several thousand -- or shall we say hundred thousand?\n\n-- years too premature.\n\nIt will be at its appointed place and time only when the great roaring flood of starvation, misery, and underpaid labour ebbs back again -- as it will when happily at last the just demands of the many are attended to; when the proletariat exists but in name, and the pitiful cry for bread, that rings throughout the world unheeded, has died away.\n\nThis may be hastened by the spread of learning, [[Vol.\n\n1, Page]] 564 THE SECRET DOCTRINE.\n\nand by new openings for work and emigration, with better prospects than exist now, and on some new continent that may appear.\n\nThen only will \"Keely's Motor and Force,\" as originally contemplated by himself and friends, be in demand, because it will be more needed by the poor than by the wealthy.\n\nMeanwhile the force discovered by him will work through wires , and this, if he succeeds, will be quite sufficient in the present generation to make of him the greatest discoverer of this age.\n\nWhat Mr.\n\nKeely says of Sound and Colour is also correct from the Occult stand-point.\n\nHear him talk as though he were the nursling of the \"Gods-revealers,\" and had gazed all his life into the depths of Father-Mother AEther.\n\nIn comparing the tenuity of the atmosphere with that of the etheric flows, obtained by him from his invention for breaking up the molecules of air by vibration, Keely says that: -- .\n\n.\n\n.\n\n\"It is as platina to hydrogen gas.\n\nMolecular separation of air brings us to the first sub-division only; inter-molecular, to the second; atomic, to the third; inter-atomic, to the fourth; etheric, to the fifth; and inter-etheric, to the sixth sub-division, or positive association with luminiferous ether.* In my introductory argument I have contended that this is the vibratory envelope of all atoms.\n\nIn my definition of atom I do not confine myself to the sixth sub-division where this luminiferous ether is developed in its crude form as far as my researches prove.** I think this idea will be pronounced by the physicists of the present day, a wild freak of the imagination.\n\nPossibly, in time, a light may fall upon this theory that will bring its simplicity forward for scientific research.\n\nAt present I can only compare it to some planet in a dark space, where the light of the sun of science has not yet reached it.\n\n.\n\n.\" \"I assume that sound, like odour, is a real substance of unknown and wonderful tenuity, emanating from a body where it has been induced by percussion and throwing out absolute corpuscles of matter, inter-atomic particles, with velocity of 1,120 feet per second; in vacuo 20,000.\n\nThe substance which is thus disseminated is a part and parcel of the mass agitated, and, if kept under this agitation continuously, would, in the course of a certain cycle of time, become thoroughly absorbed by the atmosphere; or, more truly, would pass through the atmosphere to an elevated point of tenuity corresponding to the condition of sub-division that governs its liberation from its parent body.\" .\n\n.\n\n.\n\n\"The sounds from vibratory forks, set so as to produce etheric chords, while disseminating their tones (compound), permeate most thoroughly all substances that come under the range of their atomic bombardment.\n\nThe clapping of a bell in vacuo liberates these atoms with the same velocity and volume as one in the open air; and were the agitation of the bell kept up continuously for a few millions of centuries it would [[Footnote(s)]] ------------------------------------------------- * This also is the division, made by the Occultists, under other names.\n\n** Quite so, since there is the seventh beyond, which begins the same enumeration, from the first to the last, on another and higher plane.\n\n[[Vol.\n\n1, Page]] 565 THE SECRETS OF SOUND AND ODOUR.\n\nthoroughly return to its primitive element; and, if the chamber were hermetically sealed, and strong enough, the vacuous volume surrounding the bell would be brought to a pressure of many thousands of pounds to the square inch, by the tenuous substance evolved.\n\nIn my estimation, sound truly defined is the disturbance of atomic equilibrium, rupturing actual atomic corpuscles; and the substance thus liberated must certainly be a certain order of etheric flow."


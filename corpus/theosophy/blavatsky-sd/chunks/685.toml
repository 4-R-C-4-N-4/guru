body = "The \"Universal Deluge\" is the watery abyss of the Primordial Principle of Berosus.\n\n( See Stanzas from 2 to 8 in Part I.).\n\nHow, if Croll allowed fifteen million years to have elapsed since the Eocene period (which we state on the authority of a Geologist, Mr.\n\nCh.\n\nGould) only 60 millions are assigned by him \"since the beginning of the Cambrian period, in the Primordial Age \" -- passes comprehension.\n\nThe Secondary strata are twice the thickness of the Tertiary, and Geology thus shows the Secondary age alone to be of twice the length of the Tertiary.\n\nShall we then accept only 15 million years for both the Primary and the Primordial?\n\nNo wonder Darwin rejected the calculation.\n\n****** We hope that we have furnished all the Scientific data for it elsewhere.\n\n******* It is conceded by Geology to be \"beyond doubt that a considerable period must have supervened after the departure of Palaeolithic man and before the arrival of his Neolithic successor.\" (See James Geikie's \"Prehistoric Europe,\" and Ch.\n\nGould's \"Mythical Monsters,\" p.\n\n98).\n\n[[Vol.\n\n2, Page]] 716 THE SECRET DOCTRINE.\n\nman is made out almost an abject savage, his lake dwellings notwithstanding.* For see what a learned geologist, Mr.\n\nCharles Gould, tells the reader in his \"Mythical Monsters\": -- \"Palaeolithic men were unacquainted with pottery and the art of weaving, and apparently had no domesticated animals or system of cultivation; but the Neolithic lake-dwellers of Switzerland had looms, pottery, cereals, sheep, horses,\" etc., etc.\n\nYet, though \"Implements of horn, bone, and wood were in common use among both races .\n\n.\n\n.\n\nthose of the older are frequently distinguished by their being sculptured with great ability, or ornamented with life-like engravings of the various animals living at the period ; whereas there appears to have been a marked absence of any similar artistic ability** on the part of Neolithic man.\" Let us give the reasons for it.\n\n(1) The oldest fossil man, the primitive cave-men of the old Palaeolithic period, and of the Pre-glacial period (of whatever length, and however far back), is always the same genus man, and there are no fossil remains proving for him \"what the Hipparion and Anchitherium have proved for the genus horse -- that is, gradual progressive specialization from a simple ancestral type to more complex existing forms\" (\" Modern Science, \" p.\n\n181).\n\n(2) As to the so-called Palaeolithic hatchet .\n\n.\n\n.\n\n\"when placed side by side with the rudest forms of stone hatchets actually used by the Australian and other savages, it is difficult to detect any difference\" ( Ibid, p .\n\n112).\n\nThis goes to prove that there have been savages at all times ; and the inference would be that there might have been civilized people in those days as well, cultured nations contemporary with those rude savages.\n\nWe see such a thing in Egypt 7,000 years ago.\n\n[[Footnote(s)]] ------------------------------------------------- * Resembling in a manner the pile-villages of Northern Borneo.\n\n** \"The most clever sculptor of modern times would probably not succeed very much better, if his graver were a splinter of flint and stone and bone were the materials to be engraved\"!!\n\n(Prof.\n\nBoyd Dawkins' \"Cave-Hunting,\" p.\n\n344.) It is needless after such a concession to further insist on Huxley's, Schmidt's, Laing's, and others' statements to the effect that Palaeolithic man cannot be considered to lead us back in any way to a pithecoid human race; thus demolishing the fantasies of many superficial evolutionists.\n\nThe relic of artistic merit here re-appearing in the Chipped-Stone-Age men, is traceable to their Atlantean ancestry.\n\nNeolithic man was a fore-runner of the great Aryan invasion, and immigrated from quite another quarter -- Asia, and in a measure Northern Africa.\n\n(The tribes peopling the latter towards the North-West, were certainly of an Atlantean origin -- dating back hundreds of thousands of years before the Neolithic Period in Europe, -- but they had so diverged from the parent type as to present no longer any marked characteristic peculiar to it.) As to the contrast between Neolithic and Palaeolithic Man, it is a remarkable fact that, as Carl Vogt remarks, the former was a cannibal, the much earlier man of the Mammoth era not.\n\nHuman manners and customs do not seem to improve with time, then?\n\nNot in this instance at any rate.\n\n[[Vol.\n\n2, Page]] 717 ONE SALVATION FOR SCIENCE.\n\n(3) An obstacle which is the direct consequence of the two preceding: Man, if no older than the Palaeolithic period, could not possibly have had the actual time to get transformed from the \"missing link\" into what he is known to have been even during that remote geological time, i.e.\n\n, even a finer specimen than many of the now existing races.\n\nThe above lends itself naturally to the following syllogism: (1) The primitive man (known to Science) was, in some respects, even a finer man of his genus than he is now.\n\n(2) The earliest monkey known, the lemur, was less anthropoid than the modern pithecoid species.\n\n(3) Conclusion : even though a missing link were found, the balance of evidence would remain more in favour of the ape being a degenerated man made dumb by some fortuitous circumstances,* than tending to show that man descends from a pithecoid ancestor.\n\nThe theory cuts both ways.\n\nOn the other hand, if the existence of Atlantis is accepted, and the statement is believed that in the Eocene Age \"even in its very first part, the great cycle of the fourth race men, the Atlanteans had already reached its highest point .\n\n.\n\n.\n\n.\" (Esoteric Buddhism, p.\n\n64) then some of the present difficulties of science might be easily made to disappear.\n\nThe rude workmanship of the Palaeolithic tools proves nothing against the idea that, side by side with their makers, there lived nations highly civilized.\n\nWe are told that \"only a very small portion of the earth's surface has been explored, and of this a very small portion consists of ancient land surfaces or fresh water formations, where alone we can expect to meet with traces of the higher forms of animal life,\" .\n\n.\n\n.\n\nand that \"even these have been so imperfectly explored, that where we now meet with thousands and tens of thousands of undoubted human remains lying almost under our feet, it is only within the last thirty years that their existence has even been suspected\" (p.\n\n98).\n\nIt is very suggestive also that along with the rude haches of the lowest savage, explorers meet with specimens of workmanship of such artistic merit as could hardly be found, or expected, in a modern peasant belonging to any European country -- unless in exceptional cases."


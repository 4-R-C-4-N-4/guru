[content]
body = "Nor can one accept the said \"sevenfold classification\" as having \"a closer connection with the Brahminical Logos than with the Buddhist Logos,\" since both are identical, whether the one \"Logos\" is called Eswara or Avalokiteswara, Brahma or Padmapani.\n\nThese are, however, very small differences, more fanciful than real, in fact.\n\nBrahmanism and Buddhism, both viewed from their orthodox aspects, are as inimical and as irreconcilable as water and oil.\n\nEach of these great bodies, however, has a vulnerable place in its constitution.\n\nWhile even in their esoteric interpretation both can agree but to disagree, once that their respective vulnerable points are confronted, every disagreement must fall, for the two will find themselves on common ground.\n\nThe \"heel of Achilles\" of orthodox Brahmanism is the Adwaita philosophy, whose followers are called by the pious \"Buddhists in disguise\"; as that of orthodox Buddhism is Northern mysticism, as represented by the disciples of the philosophies of Aryasanga (the Yogacharya School) and Mahayana, who are twitted in their turn by their correligionists as \"Vedantins in disguise.\" The esoteric philosophy of both these can be but one if carefully analysed and compared, as Gautama Buddha and Sankaracharya are most closely connected, if one believes tradition and certain esoteric teachings.\n\nThus every difference between the two will be found one of form rather than of substance.\n\nA most mystic discourse, full of septenary symbology, may be found in the Anugita.* There the Brahmana narrates the bliss of having crossed beyond the regions of illusion, \"in which fancies are the gadflies and mosquitoes, in which grief and joy are cold and heat, in which delusion is the blinding darkness, avarice, the beasts of prey and reptiles, and desire and anger are the obstructors.\" .\n\n.\n\n.\n\n.\n\nThe sage describes the entrance into and exit from the forest (a symbol for man's life-time) and also that forest itself:** \"In that forest are seven large trees (the Senses, Mind and Understanding, or Manas and Buddhi included), seven fruits and seven guests; seven hermitages, seven (forms of) concentration, and seven (forms of) initiation.\n\nThis is the description of the forest.\n\nThat forest is filled with trees producing splendid flowers and fruits of five colours.\" [[Footnote(s)]] ------------------------------------------------- *\" The Sacred Books of the East,\" vol.\n\nviii.\n\nAnugita, p.\n\n284, et seq.\n\n** I propose to follow here the text and the editor's commentaries, who accepts Arjuna Misra and Nilakantha's dead-letter explanations.\n\nOur Orientalists never trouble to think that if a native commentator is a non-initiate, he could not explain correctly, and if an Initiate, would not.\n\n[[Vol.\n\n2, Page]] 638 THE SECRET DOCTRINE.\n\n\"The senses,\" says the commentator, \"are called trees, as being producers of the fruits .\n\n.\n\n.\n\n.\n\npleasures and pains; the guests are the powers of each sense personified -- they receive the fruits above described; the hermitages are the trees, in which the guests take shelter.\n\nThe seven forms of concentration are the exclusion from the self of the seven functions of the seven senses, etc., already referred to; the seven forms of initiation refer to the initiation into the higher life .\n\n.\n\n.\n\nby repudiating as not one's own the actions of each member out of the group of seven.\" (See Khandagya, p.\n\n219, and Com.) The explanation is harmless, if unsatisfactory.\n\nSays the Brahmana continuing his description: -- \"That forest is filled with trees producing flowers and fruits of four colours.\n\nThat forest is filled with trees producing flowers and fruits of three colours, and mixed.\n\nThat forest is filled with trees producing flowers and fruits of two colours, and of beautiful colours.\n\nThat forest is filled with trees producing flowers and fruits of one colour and fragrant.\n\nThat forest is filled (instead of seven) with two large trees producing numerous flowers and fruits of undistinguished colours ( mind and understanding -- the two higher senses, or theosophically, 'Manas-Buddhi').\n\nHere is one Fire (Self) here connected with the Brahman* and having a good mind (or true knowledge, according to Arjuna Misra).\n\nAnd there is fuel here, namely, the five senses (or human passions).\n\nThe Seven ( forms of ) emancipation from them are the Seven ( forms of ) initiation.\n\nThe qualities are the fruits.\n\n.\n\n.\n\n.\n\nThere, the great Sages receive hospitality.\n\nAnd when they have been worshipped and have disappeared, another forest shines forth, in which intelligence is the tree, and emancipation the fruit, and which possesses shade ( in the form of ) tranquillity, which depends on Knowledge, which has contentment for its water, and the K SHETRAGNA (the \" Supreme S ELF,\" says Krishna, in the Bhagavad Gita, p.\n\n102 et seq.\n\n) within for the Sun.\" Now, all the above is very plain, and no theosophist, even among the least learned, could fail to understand the allegory.\n\nAnd yet, we see great Orientalists making a perfect mess of it in their explanations.\n\nThe \"great sages\" who \"receive hospitality\" are explained as meaning the senses, \"which, having worked as unconnected with the self are finally absorbed into it.\" But one fails to understand, if the senses are \"unconnected\" with the \"Higher Self,\" in what manner can they be [[Footnote(s)]] ------------------------------------------------- * The English editor explains here, saying, \"I presume devoted to the Brahman.\" This would be a very poor devotion, indeed, in the accomplishment of the gradually emancipating process of Yoga.\n\nWe venture to say that the \"Fire\" or Self is the higher real S ELF \"connected with,\" that is to say one with Brahma, the One Deity.\n\nThe \"Self\" separates itself no longer from the universal Spirit.\n\n[[Vol.\n\n2, Page]] 639 THE ALLEGORY EXPLAINED.\n\n\"absorbed into it.\" One would think, on the contrary, that just because the personal senses gravitate and strive to be connected with the impersonal Self, that the latter, which is F IRE, burns the lower five and purifies thereby the higher two, \"mind and understanding\" or the higher aspects of Manas* and Buddhi.\n\nThis is quite apparent from the text.\n\nThe \"great sages\" disappear after having \"been worshipped.\" Worshipped by whom if they (the presumed senses) are \"unconnected with the self\"?\n\nBy M IND, of course; by Manas (in this case merged in the sixth sense ) which is not, and cannot be, the Brahman, the S ELF, or Kshetragna -- the soul's spiritual sun.\n\nInto the latter, in time, Manas itself must be absorbed."


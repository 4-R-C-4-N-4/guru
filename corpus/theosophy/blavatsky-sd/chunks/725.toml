body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n1 [[Vol.\n\n1, Page iii]] THE SECRET DOCTRINE: THE SYNTHESIS OF SCIENCE, RELIGION, AND PHILOSOPHY.\n\nby H.\n\nP.\n\nBLAVATSKY, Author of \"ISIS UNVEILED.\" \"There is no Religion higher than Truth.\" Vol.\n\nI.\n\n-- COSMOGENESIS.\n\nLondon: THE THEOSOPHICAL PUBLISHING COMPANY, LIMITED.\n\n7, Duke Street, Adelphi, W.C.\n\nWILLIAM Q.\n\nJUDGE, 117, Nassau Street, New York.\n\nTHE MANAGER OF THE THEOSOPHIST , Adyar, Madras.\n\n--- 1888.\n\n[[Vol.\n\n1, Page iv]] \"Entered according to Act of Congress in the year 1888, by H.\n\nP.\n\nBlavatsky, in the Office of the Librarian of Congress at Washington, D.\n\nC.\" [[Vol.\n\n1, Page v]] This Work I Dedicate to all True Theosophists, In every Country, And of every Race, For they called it forth, and for them it was recorded.\n\n[[Vol.\n\n1, Page vi -- blank]] [[Vol.\n\n1, Page vii]] PREFACE.\n\nT HE Author -- the writer, rather -- feels it necessary to apologise for the long delay which has occurred in the appearance of this work.\n\nIt has been occasioned by ill-health and the magnitude of the undertaking.\n\nEven the two volumes now issued do not complete the scheme, and these do not treat exhaustively of the subjects dealt with in them.\n\nA large quantity of material has already been prepared, dealing with the history of occultism as contained in the lives of the great Adepts of the Aryan Race, and showing the bearing of occult philosophy upon the conduct of life, as it is and as it ought to be.\n\nShould the present volumes meet with a favourable reception, no effort will be spared to carry out the scheme of the work in its entirety.\n\nThe third volume is entirely ready; the fourth almost so.\n\nThis scheme, it must be added, was not in contemplation when the preparation of the work was first announced.\n\nAs originally announced, it was intended that the \"Secret Doctrine\" should be an amended and enlarged version of \"Isis Unveiled.\" It was, however, soon found that the explanations which could be added to those already put before the world in the last-named and other works dealing with esoteric science, were such as to require a different method of treatment: and consequently the present volumes do not contain, in all, twenty pages extracted from \"Isis Unveiled.\" The author does not feel it necessary to ask the indulgence of her readers and critics for the many defects of literary style, and the imperfect English which may be found in these pages.\n\nShe is a foreigner, and her knowledge of the language was acquired late in life.\n\nThe English tongue is employed because it offers the most widely-diffused medium for conveying the truths which it had become her duty to place before the world.\n\nThese truths are in no sense put forward as a revelation ; nor does the author claim the position of a revealer of mystic lore, now made public for the first time in the world's history.\n\nFor what is contained in this work is to be found scattered throughout thousands of volumes embodying the scriptures of the great Asiatic and early European religions, hidden under glyph and symbol, and hitherto left unnoticed because of this veil.\n\nWhat is now attempted is to gather the oldest tenets together and to make of them one harmonious and unbroken whole.\n\nThe sole advantage which the writer has over her predecessors, is that she need not resort to personal speculations and theories.\n\nFor this work is a partial statement of what she herself has been taught by more advanced students, supplemented, in a few details only, by the results of her [[Vol.\n\n1, Page]] viii own study and observation.\n\nThe publication of many of the facts herein stated has been rendered necessary by the wild and fanciful speculations in which many Theosophists and students of mysticism have indulged, during the last few years, in their endeavour to, as they imagined, work out a complete system of thought from the few facts previously communicated to them.\n\nIt is needless to explain that this book is not the Secret Doctrine in its entirety, but a select number of fragments of its fundamental tenets, special attention being paid to some facts which have been seized upon by various writers, and distorted out of all resemblance to the truth.\n\nBut it is perhaps desirable to state unequivocally that the teachings, however fragmentary and incomplete, contained in these volumes, belong neither to the Hindu, the Zoroastrian, the Chaldean, nor the Egyptian religion,.neither to Buddhism, Islam, Judaism nor Christianity exclusively.\n\nThe Secret Doctrine is the essence of all these.\n\nSprung from it in their origins, the various religious schemes are now made to merge back into their original element, out of which every mystery and dogma has grown, developed, and become materialised.\n\nIt is more than probable that the book will be regarded by a large section of the public as a romance of the wildest kind; for who has ever even heard of the book of Dzyan?\n\nThe writer, therefore, is fully prepared to take all the responsibility for what is contained in this work, and even to face the charge of having invented the whole of it.\n\nThat it has many shortcomings she is fully aware; all that she claims for it is that, romantic as it may seem to many, its logical coherence and consistency entitle this new Genesis to rank, at any rate, on a level with the \"working hypotheses\" so freely accepted by modern science.\n\nFurther, it claims consideration, not by reason of any appeal to dogmatic authority, but because it closely adheres to Nature, and follows the laws of uniformity and analogy.\n\nThe aim of this work may be thus stated: to show that Nature is not \"a fortuitous concurrence of atoms,\" and to assign to man his rightful place in the scheme of the Universe; to rescue from degradation the archaic truths which are the basis of all religions; and to uncover, to some extent, the fundamental unity from which they all spring; finally, to show that the occult side of Nature has never been approached by the Science of modern civilization.\n\nIf this is in any degree accomplished, the writer is content.\n\nIt is written in the service of humanity, and by humanity and the future generations it must be judged.\n\nIts author recognises no inferior court of appeal.\n\nAbuse she is accustomed to; calumny she is daily acquainted with; at slander she smiles in silent contempt.\n\nDe minimis non curat lex.\n\nH.P.B.\n\nLondon, October, 1888.\n\n[[Vol.\n\n1, Page ix]] T ABLE OF CONTENTS.\n\n------- PAGE.\n\nINTRODUCTION ...\n\nxvii.\n\nThe Need of such a Book ...\n\nxix.\n\nThe Antiquity of Documents and MSS.\n\n...\n\nxxiii.\n\nWhat the Book is intended to do ...\n\nxxviii.\n\n------- VOLUME FIRST.\n\nCOSMOGENESIS.\n\nPROEM ...\n\n1 The Oldest MSS.\n\nin the world and its Symbolism ..."


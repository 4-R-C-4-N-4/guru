body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n1 [[Vol.\n\n1, Page]] 325 THE IMPARTIALITY OF SCIENTIFIC DENIALS.\n\n[[This page continued from previous section ]] § III.\n\nPRIMORDIAL SUBSTANCE AND DIVINE THOUGHT.\n\n\"As it would seem irrational to affirm that we already know all existing causes, permission must be given to assume, if need be, an entirely new agent.\n\n\"Assuming, what is not strictly accurate as yet, that the undulatory hypothesis accounts for all the facts, we are called on to decide whether the existence of an undulating Ether is thereby proved.\n\nWe cannot positively affirm [[Vol.\n\n1, Page]] 326 THE SECRET DOCTRINE.\n\nthat no other supposition will explain the facts.\n\nNewton's corpuscular hypothesis is admitted to have broken down on Interference; and there is, at the present day, no rival.\n\nStill, it is extremely desirable in all such hypotheses to find some collateral confirmation, some evidence aliunde , of THE SUPPOSED ETHER.\n\n.\n\n.\n\n.\n\n.\n\nSome Hypotheses consist of assumptions as to the minute structure and operations of bodies.\n\nFrom the nature of the case, these assumptions can never be proved by direct means.\n\nTheir only merit is their suitability to express the phenomena.\n\nThey are REPRESENTATIVE FICTIONS.\" -- (\" Logic ,\" by Alexander Bain , LL.D.\n\n, Part II.\n\n, p.\n\n133) Ether, this hypothetical Proteus, one of the \"representative Fictions \" of modern Science -- which, nevertheless, was so long accepted -- is one of the lower \"principles\" of what we call PRIMORDIAL SUBSTANCE (Akasa, in Sanskrit), one of the dreams of old, and which has now become again the dream of modern science.\n\nIt is the greatest, just as it is the boldest, of the surviving speculations of ancient philosophers.\n\nFor the Occultists, however, both ETHER and the Primordial Substance are a reality.\n\nTo put it plainly, ETHER is the Astral Light, and the Primordial Substance is A KASA, the Upadhi of DIVINE THOUGHT.\n\nIn modern language, the latter would be better named COSMIC IDEATION -- Spirit; the former, COSMIC SUBSTANCE, Matter.\n\nThese, the Alpha and the Omega of Being, are but the two facets of the one Absolute Existence.\n\nThe latter was never addressed, or even mentioned, by any name in antiquity, except allegorically.\n\nIn the oldest Aryan race, the Hindu, the worship of the intellectual classes never consisted (as with the Greeks) in a fervent adoration of marvellous form and art, which led later on to anthropomorphism.\n\nBut while the Greek philosopher adored form, and the Hindu sage alone \"perceived the true relation of earthly beauty and eternal truth\" -- the uneducated of every nation understood neither, at any time.\n\nThey do not understand it even now.\n\nThe evolution of the G OD-IDEA proceeds apace with man's own intellectual evolution.\n\nSo true it is that the noblest ideal to which the religious Spirit of one age can soar, will appear but a gross caricature to the philosophic mind in a succeeding epoch!\n\nThe philosophers themselves had to be initiated into perceptive mysteries , before they could grasp the correct idea of the ancients in relation to this most metaphysical subject.\n\nOtherwise -- outside such initiation -- for every thinker there will be a \"Thus far shalt thou go and no farther,\" mapped out by his intellectual capacity, as clearly and as unmistakeably as there is for the progress of any nation or race in its cycle by the law of Karma.\n\nOutside of initiation, the ideals of contemporary religious thought must always have their wings clipped and remain unable to soar higher; for idealistic as well as realistic thinkers, and even free-thinkers, are but the outcome and the natural product of their respective environments and periods.\n\nThe ideals of both are only [[Vol.\n\n1, Page]] 327 DIVINE THOUGHT, OR CINERITIOUS MATTER.\n\nthe necessary results of their temperaments, and the outcome of that phase of intellectual progress to which a nation, in its collectivity, has attained.\n\nHence, as already remarked, the highest flights of modern (Western) metaphysics have fallen far short of the truth.\n\nMuch of current Agnostic speculation on the existence of the \"First Cause\" is little better than veiled materialism -- the terminology alone being different.\n\nEven so great a thinker as Mr.\n\nHerbert Spencer speaks of the \"Unknowable\" occasionally in terms that demonstrate the lethal influence of materialistic thought, which, like the deadly Sirocco, has withered and blighted all current ontological speculation.* From the early ages of the Fourth Race, when Spirit alone was worshipped and the mystery was made manifest, down to the last palmy days of Grecian art at the dawn of Christianity -- the Hellenes alone had dared to raise publicly an altar to the U NKNOWN G OD.\n\nWhatever St.\n\nPaul may have had in his profound mind when declaring to the Athenians that this \"unknown,\" ignorantly worshipped by them, was the true God announced by himself -- that Deity was not \"Jehovah\" ( see \" The Holy of Holies \"), nor was he \"The Maker of the world and all things.\" For it is not the \"God of Israel\" but the \"Unknown\" of the ancient and modern Pantheist that \"dwelleth not in temples made with hands \" (Acts xviii., 23-4).\n\nDivine thought cannot be defined, or its meaning explained, except by the numberless manifestations of Cosmic Substance in which the former is sensed spiritually by those who can do so.\n\nTo say this, after having defined it as the Unknown Deity, abstract, impersonal, sexless, which must be placed at the root of every Cosmogony and its subsequent evolution, is equivalent to saying nothing at all.\n\nIt is like attempting a transcendental equation of conditions for the true values of a set, having in hand for deducing them only a number of unknown quantities.\n\nIts place is found in the old primitive Symbolic charts, in which, as shown in the text, it is represented by a boundless darkness, on the ground of which appears the first central point in white -- thus symbolising coeval and co-eternal S PIRIT- M ATTER making its appearance in the phenomenal world, before its first differentiation.\n\nWhen \"the one becomes two,\" it may then be [[Footnote(s)]] ------------------------------------------------- * For instance, when he terms the \"First Cause\" -- the U NKNOWABLE -- a \"power manifesting through phenomena,\" and \"an infinite eternal Energy \" (?) it is clear that he has grasped solely the physical aspect of the mystery of Being -- the Energies of Cosmic Substance only.\n\nThe co-eternal aspect of the O NE R EALITY -- Cosmic Ideation -- (as to its noumenon , it seems non-existent in the mind of the great thinker) is absolutely omitted from consideration."


body = "1, Page]] 181 A TRIPLE EVOLUTION IN NATURE.\n\nendow the \"senseless\" shells, created and informed by the Pitris, with \"mind\" in the latter part of the Third Root-Race.\n\nIn the same way the \"Monads\" or Egos of the men of the seventh Round of our Earth, after our own Globes A, B, C, D, et seq.\n\n, parting with their life-energy, will have informed and thereby called to life other laya-centres destined to live and act on a still higher plane of being -- in the same way will the Terrene \"Ancestors\" create those who will become their superiors.\n\nIt now becomes plain that there exists in Nature a triple evolutionary scheme, for the formation of the three periodical Upadhis ; or rather three separate schemes of evolution, which in our system are inextricably interwoven and interblended at every point.\n\nThese are the Monadic (or spiritual), the intellectual, and the physical evolutions.\n\nThese three are the finite aspects or the reflections on the field of Cosmic Illusion of ATMA, the seventh, the ONE REALITY.\n\n1.\n\nThe Monadic is, as the name implies, concerned with the growth and development into still higher phases of activity of the Monad in conjunction with: -- 2.\n\nThe Intellectual, represented by the Manasa-Dhyanis (the Solar Devas, or the Agnishwatta Pitris) the \"givers of intelligence and consciousness\"* to man and: -- 3.\n\nThe Physical, represented by the Chhayas of the lunar Pitris, round which Nature has concreted the present physical body.\n\nThis body serves as the vehicle for the \"growth\" (to use a misleading word) and the transformations through Manas and -- owing to the accumulation of experiences -- of the finite into the INFINITE, of the transient into the Eternal and Absolute.\n\nEach of these three systems has its own laws, and is ruled and guided by different sets of the highest Dhyanis or \"Logoi.\" Each is represented in the constitution of man, the Microcosm of the great Macrocosm; and it is the union of these three streams in him which makes him the complex being he now is.\n\n\"Nature,\" the physical evolutionary Power, could never evolve intelligence unaided -- she can only create \"senseless forms,\" as will be seen in our \" A NTHROPOGENESIS.\" The \"Lunar Monads\" cannot progress, for they have not yet had sufficient touch with the forms [[Footnote(s)]] ------------------------------------------------- * Vide C ONCLUSION in Part II.\n\nof this Book.\n\n[[Vol.\n\n1, Page]] 182 THE SECRET DOCTRINE.\n\ncreated by \"Nature\" to allow of their accumulating experiences through its means.\n\nIt is the Manasa-Dhyanis who fill up the gap, and they represent the evolutionary power of Intelligence and Mind, the link between \"Spirit\" and \"Matter\" -- in this Round.\n\nAlso it must be borne in mind that the Monads which enter upon the evolutionary cycle upon Globe A, in the first Round, are in very different stages of development.\n\nHence the matter becomes somewhat complicated.\n\n.\n\n.\n\n.\n\nLet us recapitulate.\n\nThe most developed Monads (the lunar) reach the human germ-stage in the first Round; become terrestrial, though very ethereal human beings towards the end of the Third Round, remaining on it (the globe) through the \"obscuration\" period as the seed for future mankind in the Fourth Round, and thus become the pioneers of Humanity at the beginning of this, the Fourth Round.\n\nOthers reach the Human stage only during later Rounds, i.e.\n\n, in the second, third, or first half of the Fourth Round.\n\nAnd finally the most retarded of all, i.e.\n\n, those still occupying animal forms after the middle turning-point of the Fourth Round -- will not become men at all during this Manwantara.\n\nThey will reach to the verge of humanity only at the close of the seventh Round to be, in their turn, ushered into a new chain after pralaya -- by older pioneers, the progenitors of humanity, or the Seed-Humanity ( Sishta ), viz., the men who will be at the head of all at the end of these Rounds.\n\nThe student hardly needs any further explanation on the part played by the fourth Globe and the fourth Round in the scheme of evolution.\n\nFrom the preceding diagrams, which are applicable, mutatis mutandis , to Rounds, Globes or Races, it will be seen that the fourth member of a series occupies a unique position.\n\nUnlike the others, the Fourth has no \"sister\" Globe on the same plane as itself, and it thus forms the fulcrum of the \"balance\" represented by the whole chain.\n\nIt is the sphere of final evolutionary adjustments, the world of Karmic scales, the Hall of Justice, where the balance is struck which determines the future course of the Monad during the remainder of its incarnations in the cycle.\n\nAnd therefore it is, that, after this central turning-point has been passed in the Great Cycle, -- i.e.\n\n, after the middle point of the Fourth Race in the Fourth Round on our Globe -- no more Monads can enter the human kingdom.\n\nThe door is closed for this Cycle and the balance struck.\n\nFor were it otherwise -- had there been a new soul [[Vol.\n\n1, Page]] 183 MAN, THE OLDEST SON OF THE EARTH.\n\ncreated for each of the countless milliards of human beings that have passed away, and had there been no reincarnation -- it would become difficult indeed to provide room for the disembodied \"Spirits;\" nor could the origin and cause of suffering ever be accounted for.\n\nIt is the ignorance of the occult tenets and the enforcement of false conceptions under the guise of religious education, which have created materialism and atheism as a protest against the asserted divine order of things.\n\nThe only exceptions to the rule just stated are the \"dumb races,\" whose Monads are already within the human stage, in virtue of the fact that these \"animals\" are later than, and even half descended from man, their last descendants being the anthropoid and other apes.\n\nThese \"human presentments\" are in truth only the distorted copies of the early humanity.\n\nBut this will receive full attention in the next Book.\n\nAs the Commentary, broadly rendered, says: -- 1 .\n\n\" Every form on earth , and every speck ( atom ) in Space strives in its efforts towards self-formation to follow the model placed for it in the ' HEAVENLY MAN.' .\n\n.\n\n.\n\nIts ( the atom ' s ) involution and evolution , its external and internal growth and development , have all one and the same object -- man; man , as the highest physical and ultimate form on this earth; the MONAD, in its absolute totality and awakened condition -- as the culmination of the divine incarnations on Earth.\n\n\" 2."


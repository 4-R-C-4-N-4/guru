body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n2 [[Vol.\n\n2, Page]] 563 THE SEVEN THUNDERS.\n\n§ XXIII.\n\nTHE UPANISHADS IN GNOSTIC LITERATURE.\n\nWe are reminded in King's \"Gnostics\" that the Greek language has but one word for vowel and voice; and this has led the uninitiated to many erroneous interpretations.\n\nOn the simple knowledge, however, of that well-known fact a comparison may be attempted, and a flood of light thrown upon several mystic meanings.\n\nThus the words, so often used in the Upanishads and the Puranas, \"Sound\" and \"Speech,\" may be collated with the Gnostic \"Vowels\" and the \"Voices\" of the Thunders and Angels in \"Revelation.\" The same will be found in Pistis Sophia, and other ancient Fragments and MSS.\n\nThis was remarked even by the matter-of-fact author of \"The Gnostics and their Remains.\" Through Hippolytus, an early Church Father, we learn what Marcus -- a Pythagorean rather than a Christian Gnostic, and a Kabalist most certainly -- had received in mystic revelation.\n\nIt is said that \"Marcus had it revealed unto him that 'the seven heavens'* .\n\n.\n\n.\n\n.\n\nsounded each one vowel, which, all combined together, formed a complete doxology\"; in clearer words: \"the Sound whereof being carried down (from these seven heavens) to earth, became the creator and parent of all things that be on earth.\" (See \"Hippolytus,\" vi., 48, and King's Gnostics, p.\n\n200.) Translated from the Occult phraseology into still plainer language this would read: \"The Sevenfold LOGOS having differentiated into seven Logoi, or creative potencies (vowels) these (the second logos, or \"Sound\") created all on Earth.\n\nAssuredly one who is acquainted with Gnostic literature can hardly help seeing in St.\n\nJohn's Apocalypse, a work of the same school of thought.\n\nFor we find John saying (chap.\n\nx.\n\n3, 4), \"Seven thunders uttered their voices .\n\n.\n\n.\n\nand I was about to write .\n\n.\n\n.\n\n(but) I heard a voice from heaven saying unto me, 'Seal up those things which the seven thunders uttered, and write them not.' \" The same injunction is given to Marcus, the same to all other semi and full Initiates.\n\nYet the sameness of equivalent expressions used, and of the underlying ideas, always betrays a portion of the mysteries.\n\nWe must always seek for more than one meaning in every mystery allegorically revealed, especially in those in which the number seven and its multiplication seven by seven, or forty-nine, appear.\n\nNow when the Rabbi Jesus is requested (in Pistis [[Footnote(s)]] ------------------------------------------------- *The \"Heavens\" are identical with \"Angels,\" as already stated.\n\n[[Vol.\n\n2, Page]] 564 THE SECRET DOCTRINE.\n\nSophia ) by his disciples to reveal to them, \"the mysteries of the Light of thy ( his ) Father\" ( i.e.\n\n, of the higher SELF enlightened by Initiation and Divine knowledge), Jesus answers: \"Do ye seek after these mysteries?\n\nNo mystery is more excellent than they which shall bring your souls unto the Light of Lights, unto the place of Truth and Goodness, unto the place where there is neither male nor female, neither form in that place but Light, everlasting, not to be uttered.\n\nNothing therefore is more excellent than the mysteries which ye seek after, saving only THE MYSTERY of the seven vowels and their FORTY AND NINE POWERS, and their numbers thereof; and no name is more excellent than all these vowels.\" \"The Seven Fathers and the Forty-nine Sons blaze in DARKNESS, but they are the LIFE and LIGHT and the continuation thereof through the Great Age\" -- says the Commentary speaking of the \"Fires.\" Now it becomes evident that, in every esoteric interpretation of exoteric beliefs expressed in allegorical forms, there was the same underlying idea -- the basic number seven, the compound of three and four, preceded by the divine THREE ( ) making the perfect number ten.\n\nAlso, these numbers applied equally to divisions of time, to cosmography metaphysical and physical, as well as to man and everything else in visible nature.\n\nThus these Seven vowels with their forty-nine powers are identical with the three and the Seven Fires of the Hindus and their forty-nine fires; identical with the numerical mysteries of the Persian Simorgh; identical with those of the Jewish Kabalists.\n\nThe latter, dwarfing the numbers (their mode of blinds ) , made the duration of each successive renewal (what we call in esoteric parlance Round ) of the seven renewals of the globe only of 7,000 years, instead of, as is more likely, 7,000,000,000, and assigned to the total duration of the universe 49,000 years only.\n\n(Compare § \"Chronology of the Brahmins.\") Now, the Secret Doctrine furnishes a key which reveals to us on indisputable grounds of comparative analogy that Garuda, the allegorical and monstrous half-man and half-bird, -- the Vahan or vehicle on which Vishnu (who is Kala, \"time\") is shown to ride -- is the origin of all other such allegories.\n\nHe is the Indian phoenix, the emblem of cyclic and periodical time, the \"man-lion\" Singha, of whose representations the so-called \"gnostic gems\" are so full.* \"Over the seven rays of the lion's crown, and corresponding to their points, stand, in many cases, the seven vowels of the Greek alphabet [Gk char], testifying to the Seven Heavens.\" This is the Solar lion and the emblem of the Solar cycle, as [[Footnote(s)]] ------------------------------------------------- *As confessed by King, the great authority on Gnostic antiquities, these gnostic gems are not the work of the Gnostics, but belong to pre-christian periods, and are the work of magicians (p.\n\n241).\n\n[[Vol.\n\n2, Page]] 565 WHEN TIME BE NO LONGER.\n\nGaruda* is that of the great cycle, the \"Maha-Kalpa\" co-eternal with Vishnu, and also, of course, the emblem of the Sun, and Solar cycle.\n\nThis is shown by the details of the allegory.\n\nAt his birth, Garuda is mistaken for Agni, the God of Fire, on account of his (Garuda's) \"dazzling splendour,\" and called thereupon Gaganeswara, \"lord of the sky.\" Again, his being represented as Osiris, and by many heads of allegorical monsters on the Abraxas (gnostic) gems, with the head and beak of an eagle or a hawk (solar birds), denotes Garuda's solar and cyclic character.\n\nHis Son is Jatabu, the cycle of 60,000 years.\n\nAs well remarked by C.\n\nW."


[content]
body = ".\" It was called into being, a ready and perfect vehicle for the incarnating denizens of higher spheres, who took forthwith their abodes in these forms born of Spiritual WILL and the natural divine power in man.\n\nIt was a child of pure Spirit, mentally unalloyed with any tincture of earthly element.\n\nIts physical frame alone was of time and of life, as it drew its intelligence direct from above.\n\nIt was the living tree of divine wisdom; and may therefore be likened to the Mundane Tree of the Norse Legend, which cannot wither and die until the last battle of life shall be fought, while its roots are gnawed all the time by the dragon Nidhogg; for even so, the first and holy Son of Kriyasakti had his body gnawed by the tooth of time, but the roots of his inner being remained for ever undecaying and strong, because they grew and expanded in heaven not on earth.\n\nHe was the first of the F IRST, and he was the seed of all the others.\n\nThere were other \"Sons of Kriyasakti\" produced by a second Spiritual effort, but the first one has remained to this day the Seed of divine Knowledge, the One and the Supreme among the terrestrial \"Sons of Wisdom.\" Of this subject we can say no more, except to add that in every age -- aye, even in our own -- there have been great intellects who have understood the problem correctly.\n\nHow comes our physical body to the state of perfection it is found in now?\n\nThrough millions of years of evolution, of course, yet never through, or from, animals, as taught by materialism.\n\nFor, as Carlyle says: -- \".\n\n.\n\n.\n\nThe essence of our being, the mystery in us that calls itself 'I,' -- what words have we for such things?\n\n-- it is a breath of Heaven, [[Vol.\n\n1, Page]] 212 THE SECRET DOCTRINE.\n\nthe highest Being reveals himself in man.\n\nThis body, these faculties, this life of ours, is it not all as a vesture for the UNNAMED?\" The breath of heaven, or rather the breath of life, called in the Bible Nephesh , is in every animal, in every animate speck as in every mineral atom.\n\nBut none of these has, like man, the consciousness of the nature of that highest Being,* as none has that divine harmony in its form which man possesses.\n\nIt is, as Novalis said, and no one since has said it better, as repeated by Carlyle: -- \"There is but one temple in the universe, and that is the body of man.\n\nNothing is holier than that high form .\n\n.\n\n.\n\n.\n\nWe touch heaven when we lay our hand on a human body!\" \"This sounds like a mere flourish of rhetoric,\" adds Carlyle, \"but it is not so.\n\nIf well meditated it will turn out to be a scientific fact; the expression .\n\n.\n\n.\n\nof the actual truth of the thing.\n\nWe are the miracle of miracles, -- the great inscrutable Mystery.\" [[Footnote(s)]] ------------------------------------------------- * There is no nation in the world in which the feeling of devotion or of religious mysticism is more developed and prominent than in the Hindu people.\n\nSee what Max Muller says of this idiosyncracy and national feature in his works.\n\nThis is direct inheritance from the primitive conscious men of the Third Race.\n\n---------------------"


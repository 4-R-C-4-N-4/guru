[content]
body = "They circumscribe the manifested world of matter within the R ING \"Pass-Not.\" This world is the symbol (objective) of the O NE divided into the many, on the planes of Illusion, of Adi (the \"First\") or of Eka (the \"One\"); and this One is the collective aggregate, or totality, of the principal Creators or Architects of this visible universe.\n\nIn Hebrew Occultism their name is both Achath, feminine, \"One,\" and Achod, \"One\" again, but masculine.\n\nThe monotheists have taken (and are still taking) advantage of the profound esotericism of the Kabala to apply the name by which the One Supreme Essence is known to ITS manifestation, the Sephiroth-Elohim, and call it Jehovah.\n\nBut this is [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] \"writers\" or scribes; the \"Dragons,\" symbols of wisdom, who guard the Trees of Knowledge; the \"golden\" apple Tree of the Hesperides; the \"Luxuriant Trees\" and vegetation of Mount Meru guarded by a Serpent.\n\nJuno giving to Jupiter, on her marriage with him, a Tree with golden fruit is another form of Eve offering Adam the apple from the Tree of Knowledge.\n\n[[Vol.\n\n1, Page]] 130 THE SECRET DOCTRINE.\n\nquite arbitrary and against all reason and logic, as the term Elohim is a plural noun, identical with the plural word Chiim, often compounded with the Elohim.* Moreover, in Occult metaphysics there are, properly speaking, two \" O NES\" -- the One on the unreachable plane of Absoluteness and Infinity, on which no speculation is possible, and the Second \"One\" on the plane of Emanations.\n\nThe former can neither emanate nor be divided, as it is eternal, absolute, and immutable.\n\nThe Second, being, so to speak, the reflection of the first One (for it is the Logos, or Iswara, in the Universe of Illusion), can do all this.** It emanates from itself -- as the upper Sephirothal Triad emanates the lower seven Sephiroth -- the seven Rays or Dhyan Chohans; in other words, the Homogeneous becomes the Heterogeneous, the \"Protyle\" differentiates into the Elements.\n\nBut these, unless they return into their primal Element, can never cross beyond the Laya, or zero-point.\n\nHence the allegory.\n\nThe Lipika separate the world (or plane) of pure spirit from that of Matter.\n\nThose who \"descend and ascend\" -- the incarnating Monads, and men striving towards purification and \"ascending,\" but still not having quite reached the goal -- may cross the \"circle of the Pass-Not,\" only on the day \"Be-With-Us\"; that day when man, freeing himself from the trammels of ignorance, and recog- [[Footnote(s)]] ------------------------------------------------- * The sentence in the Sepher Jezirah and elsewhere: \"Achath-Ruach-Elohim-Chiim\" denotes the Elohim as androgynous at best, the feminine element almost predominating, as it would read: \" O NE is She the Spirit of the Elohim of Life.\" As said above, Echath (or Achath) is feminine, and Echod (or Achod) masculine, both meaning O NE.\n\n** This metaphysical tenet can hardly be better described than Mr.\n\nSubba Row's in \"Bhagavadgita\" lectures: \"Mulaprakriti (the veil of Parabrahmam) acts as the one energy through the Logos (or 'Eswara').\n\nNow Parabrahmam, is the one essence from which starts into existence a centre of energy, which I shall for the present call the Logos.\n\n.\n\n.\n\n.\n\nIt is called the Verbum .\n\n.\n\n.\n\nby the Christians, and it is the divine Christos who is eternal in the bosom of his father.\n\nIt is called Avalokiteshwara by the Buddhists.\n\n.\n\n.\n\n.\n\nIn almost every doctrine, they have formulated the existence of a centre of spiritual energy which is unborn and eternal, and which exists in the bosom of Parabrahmam at the time of Pralaya, and starts as a centre of conscious energy at the time of Cosmic activity.\n\n.\n\n.\n\n.\" For, as the lecturer premised by saying, Parabraham is not this or that, it is not even consciousness, as it cannot be related to matter or anything conditioned.\n\nIt is not Ego nor is it Non-ego, not even Atma, but verily the one source of all manifestations and modes of existence.\n\n[[Vol.\n\n1, Page]] 131 THE SIDEREAL BOOK OF LIFE.\n\nnising fully the non-separateness of the Ego within his personality -- erroneously regarded as his own -- from the U NIVERSAL E GO (Anima Supra-Mundi), merges thereby into the One Essence to become not only one \"with us\" (the manifested universal lives which are \"ONE\" LIFE), but that very life itself.\n\nAstronomically, the \"Ring P ASS- N OT\" that the Lipika trace around the Triangle, the First One, the Cube, the Second One, and the Pentacle to circumscribe these figures, is thus shown to contain the symbol of 31415 again, or the coefficient constantly used in mathematical tables (the value of , pi), the geometrical figures standing here for numerical figures.\n\nAccording to the general philosophical teachings, this ring is beyond the region of what are called nebulae in astronomy.\n\nBut this is as erroneous a conception as that of the topography and the descriptions, given in Puranic and other exoteric Scriptures, about the 1008 worlds of the Devaloka worlds and firmaments.\n\nThere are worlds, of course, in the esoteric as well as in the profane scientific teachings, at such incalculable distances that the light of the nearest of them which has just reached our modern Chaldees, had left its luminary long before the day on which the words \"Let there be Light\" were pronounced; but these are no worlds on the Devaloka plane, but in our Kosmos.\n\nThe chemist goes to the laya or zero point of the plane of matter with which he deals, and then stops short.\n\nThe physicist or the astronomer counts by billions of miles beyond the nebulae, and then they also stop short; the semi-initiated Occultist will represent this laya-point to himself as existing on some plane which, if not physical, is still conceivable to the human intellect.\n\nBut the full Initiate knows that the ring \"Pass-Not\" is neither a locality nor can it be measured by distance, but that it exists in the absoluteness of infinity."


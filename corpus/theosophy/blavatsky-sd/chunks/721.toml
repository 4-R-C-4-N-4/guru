body = "The Basques are, of course, of a much later date than this, but their affinities, as here shown, go far to prove the original extraction of their remote ancestors.\n\nThe \"mysterious\" affinity between their tongue and that of the Dravidian races of India will be understood by those who have followed our outline of continental formations and shiftings.\n\n(4) Stones have been found in the Canary Islands bearing sculptured symbols similar to those found on the shore of Lake Superior.\n\nBerthollet was induced [[Footnote(s)]] ------------------------------------------------- * For further facts as to the isolation of the Basques in Europe and their ethnological relations, cf.\n\nJoly, \" Man before Metals, \" p.\n\n316.\n\nB.\n\nDavis is disposed to concede, from an examination of the skulls of the Guanches of the Canary Islands and modern Basques, that both belong to a race proper to those ancient islands, of which the Canaries are the remains!!\n\nThis is a step in advance indeed.\n\nDe Quatrefages and Hamy also both assign the Cro-Magnon men of South France and the Guanches to one type -- a proposition which involves a certain corollary which both these writers may not care to father.\n\n[[Vol.\n\n2, Page]] 791 FINAL AND IRREFUTABLE EVIDENCE.\n\nby such evidence to postulate the unity of race of the early men of Canary Islands and America (Cf.\n\nBenjamin, the \" Atlantic Islands, \" p .\n\n130.) The Guanches of the Canary Islands were lineal descendants of the Atlanteans.\n\nThis fact will account for the great stature evidenced by their old skeletons, as well as by those of their European congeners the Cro-Magnon Palaeolithic men.\n\n(5) Any experienced mariner has but to navigate the fathomless ocean along the Canary Islands to ask himself the question when or how that group of volcanic and rocky little islands has been formed, surrounded on every side by that vast watery space.\n\nSuch frequent questions led finally to the expedition of the famous Leopold von Buch, which took place in the first quarter of the present century.\n\nSome geologists maintained that the volcanic islands had been raised right from the bottom of the ocean, the depth of which in the immediate vicinity of the island varies from 6,000 to 18,000 feet.\n\nOthers were inclined to see in these groups, including Madeira, the Azores, and the islands of Cape de Verdes -- the remnants of a gigantic but submerged continent which had once united Africa with America.\n\nThe latter men of science supported their hypothesis by a mass of evidence in its favour, drawn from ancient \"myths.\" Hoary \"superstitions,\" such as the fairy-like Atlantis of Plato, the Garden of Hesperides, Atlas supporting the world on his shoulders, all of them mythoi connected with the peak of Teneriffe, did not go far with sceptical Science.\n\nThe identity of animal and vegetable species -- showing either a previous connection between America and the remaining groups of the islands -- (the hypothesis of their having been drifted from the New to the Old World by the waves was too absurd to stand long) -- found more serious consideration.\n\nBut it is only quite lately, and after Donnelly's book had been published several years, that the theory has greater chances than ever of becoming an accepted fact.\n\nFossils found on the Eastern Coast of South America have now been proved to belong to the Jurassic formations, and are nearly identical with the Jurassic fossils of Western Europe and Northern Africa.\n\nThe geological structure of both coasts is also almost identical ; the resemblance between the smaller marine animals dwelling in the more shallow waters of South America, the Western African, and the South European coasts, is also very great.\n\nAll such facts are bound to bring naturalists to the conclusion that there has been, in distant pre-historic ages, a continent which extended from the coast of Venezuela, across the Atlantic Ocean, to the Canarese Islands and North Africa, and from Newfoundland nearly to the coast of France.\n\n(6) The great resemblance between the Jurassic fossils of South [[Vol.\n\n2, Page]] 792 THE SECRET DOCTRINE.\n\nAmerica, North Africa, and Western Europe is a striking enough fact in itself, and admits of no explanation, unless the ocean is bridged with an Atlantis.\n\nBut why, also, is there so marked a similarity between the fauna (animal life) of the -- now -- isolated Atlantic islands?\n\nWhy did the specimens of Brazilian fauna dredged up by Sir C.\n\nWyville Thompson resemble those of Western Europe?\n\nWhy does a resemblance exist between many of the West African and West Indian animal groups?\n\nAgain: \"When the animals and plants of the Old and New World are compared, one cannot but be struck with their identity ; all, nearly all belong to the same genera, while many, even of the species, are common to both continents .\n\n.\n\n.\n\nindicating that they radiated from a common centre \" ( Atlantis ) , (\" Westminster Review, \" Jan., 1872).\n\nThe horse, according to Science, originated in America.\n\nAt least, a large proportion of the once \"missing links\" connecting it with inferior forms have been exhumed from American strata.\n\nHow did the horse penetrate into Europe and Asia, if no land communication bridged the oceanic interspaces?\n\nOr if it is asserted that the horse originated in the New World, how did such forms as the hipparion, etc., get into America in the first instance on the migration hypothesis?\n\nAgain \"Buffon had .\n\n.\n\n.\n\nremarked in the repetition of the African in the American fauna, how, for example, the lama is a juvenescent and feeble copy of the camel, and how the puma of the New represented the lion of the Old World\" ( Schmidt, \" Doctrine of Descent and Darwinism, \" p.\n\n223) .\n\n(7) The following quotation runs with No.\n\n(2), but its significance is such and the writer cited so authoritative, that it deserves a place to itself: -- \"With regard to the primitive dolichocephalae of America, I entertain a hypothesis still more bold, namely, that they are nearly related to the Guanches of the Canary Islands, and to the Atlantic populations of Africa, the Moors, Tuaricks, Copts, which Latham comprises under the name of Egyptian-Atlantidae.\n\nWe find one and the same form of skull in the Canary Islands, in front of the African coast, and in the Carib islands, on the opposite coast which faces Africa.\n\nThe colour of the skin on both sides of the Atlantic is represented in these populations as being of a reddish-brown.\" (Professor Retzius, \"Smithsonian Report,\" 1859, p.\n\n266.) If, then, Basques and Cro-Magnon Cave-Men are of the same race as the Canarese Guanches, it follows that the former are also allied to the aborigines of America.\n\nThis is the conclusion which the independent investigations of Retzius, Virchow, and de Quatrefages necessitate.\n\nThe Atlantean affinities of these three types become patent.\n\n(8) The sea-soundings undertaken by H.M.S ."


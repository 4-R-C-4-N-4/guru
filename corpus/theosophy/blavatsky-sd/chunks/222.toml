[content]
body = "But, in the esoteric teaching, they are the progenitors of the true spiritual SELF in the physical man -- the higher Prajapati, while the Pitris, or lower Prajapati, are no more than the fathers of the model, or type of his physical form, made \"in their image.\" Four (and occasionally five ) are mentioned freely in the exoteric texts, three Kumaras being secret.** (Compare what is said of \"The Fallen Angels\" in Book II.).\n\nThe Exoteric four are: Sanat-Kumara, Sananda, Sanaka, and Sanatana; and the esoteric three are: Sana, Kapila, and Sanat-sujata.\n\nSpecial attention is once more drawn to this class of Dhyan Chohans, for herein lies the mystery of generation and heredity hinted at in Book I.\n\n( See the four Orders of Angelic Beings; Comment on Stanza VII.\n\n) .\n\nBook II.\n\nexplains their position in the divine Hierarchy.\n\nMeanwhile, let us see what the exoteric texts say about them.\n\nThey do not say much; nothing to him who fails to read between the lines.\n\n\"We must have recourse, here, to other Puranas for the elucidation of this term,\" remarks Wilson, who does not suspect for one moment that he is in the presence of the \"Angels of Darkness,\" the mythical \"great enemy\" of his Church.\n\nTherefore, he contrives to elucidate no more than that these (divinities) DECLINING TO CREATE PROGENY*** (and thus rebelling against Brahma), remained, as the name [[Footnote(s)]] ------------------------------------------------- * They may indeed mark a \"special\" or extra creation , since it is they who, by incarnating themselves within the senseless human shells of the two first Root-races, and a great portion of the Third Root-race -- create, so to speak, a new race: that of thinking, self-conscious and divine men.\n\n** \"The four Kumaras (are) the mind-born Sons of Brahma.\n\nSome specify seven \" ( H.\n\nClass.\n\nDict.\n\n) .\n\nAll these seven Vaidhatra, the patronymic of the Kumaras, \"the Maker's Sons,\" are mentioned and described in Iswara Krishna's \"Sankhya Karika\" with the Commentary of Gaudapadacharya (Sankaracharya's Paraguru ) attached to it.\n\nIt discusses the nature of the Kumaras, though it refrains from mentioning by name all the seven Kumaras, but calls them instead \"the seven sons of Brahma,\" which they are, as they are created by Brahma in Rudra.\n\nThe list of names it gives us is: Sanaka, Sanandana, Sanatana, Kapila, Ribhu, and Panchasikha.\n\nBut these are again all aliases.\n\n*** So untrustworthy are some translations of the Orientalists that in the French Translation of Hari-Vamsa , it is said \"The seven Prajapati, Rudra, Skanda (his son) [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 458 THE SECRET DOCTRINE.\n\nof the first implies, ever boys, Kumaras: that is, ever pure and innocent, whence their creation is also called the \"Kumara.\" ( Book I.\n\nchap.\n\nv.\n\n, Vishnu Purana.\n\n) The Puranas, however, may afford a little more light.\n\n\"Being ever as he was born, he is here called a youth; and hence his name is well known as Sanat-Kumara\" ( Linga purana , prior section LXX.\n\n174.) In the Saiva Purana , the Kumaras are always described as Yogins.\n\nThe Kurma Purana, after enumerating them, says: \"These five, O Brahmans, were Yogins, who acquired entire exemption from passion.\" They are five , because two of the Kumaras fell .\n\nOf all the seven great divisions of Dhyan-Chohans, or Devas, there is none with which humanity is more concerned than with the Kumaras.\n\nImprudent are the Christian Theologians who have degraded them into fallen Angels, and now call them \"Satan\" and Demons; as among these heavenly denizens who refuse to create , the Archangel Michael -- the greatest patron Saint of Western and Eastern Churches, under his double name of St.\n\nMichael and his supposed copy on earth, St.\n\nGeorge conquering the D RAGON -- has to be allowed one of the most prominent places.\n\n(See Book II., \"The Sacred Dragons and their Slayers.\") The Kumaras, the \"mind-born Sons\" of Brahma-Rudra (or Siva) [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] and Sanat-Kumara proceeded to create beings.\" Whereas, as Wilson shows, the original is: \"These seven .\n\n.\n\n.\n\ncreated progeny; and so did Rudra, but Skanda and Sanat Kumara, restraining their power , abstained from creation.\" The \"four orders of beings\" are referred to sometimes as \"Ambhamsi,\" which Wilson renders: \"literally Waters,\" and believes it \"a mystic term.\" It is one, no doubt; but he evidently failed to catch the real esoteric meaning.\n\n\"Waters\" and \"water\" stand as the symbol for Akasa, the \"primordial Ocean of Space,\" on which Narayana, the self-born Spirit, moves: reclining on that which is its progeny ( See Manu ) .\n\n\"Water is the body of Nara; thus we have heard the name of water explained.\n\nSince Brahma rests on the water, therefore he is termed Narayana \" ( Linga , Vayu , and Markandeya Puranas ) \".\n\n.\n\n.\n\nPure, Purusha created the Waters pure .\n\n.\n\n.\" at the same time Water is the third principle in material Kosmos, and the third in the realm of the Spiritual: Spirit of Fire, Flame, Akasa, Ether, Water, Air, Earth, are the cosmic, sidereal, psychic, spiritual and mystic principles, pre-eminently occult , in every plane of being.\n\n\"Gods, Demons, Pitris and men,\" are the four orders of beings to whom the term Ambhamsi is applied (in the Vedas it is a synonym of gods): because they are all the product of WATERS (mystically), of the Akasic Ocean, and of the Third Principle in nature.\n\nPitris and men on earth are the transformations (rebirths) of gods and demons (Spirits) on a higher plane.\n\nWater is, in another sense, the feminine principle.\n\nVenus Aphrodite is the personified Sea, and the mother of the god of love, the generator of all the gods as much as the Christian Virgin Mary is Mare (the sea), the mother of the Western God of Love, Mercy and Charity."


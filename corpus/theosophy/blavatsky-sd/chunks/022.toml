[content]
body = "Moreover, the Secret Doctrine teaches: -- ( c ) The fundamental identity of all Souls with the Universal Over-Soul, the latter being itself an aspect of the Unknown Root; and the obligatory pilgrimage for every Soul -- a spark of the former -- through the Cycle of Incarnation (or \"Necessity\") in accordance with Cyclic and Karmic law, during the whole term.\n\nIn other words, no purely spiritual Buddhi (divine Soul) can have an independent (conscious) existence before the spark which issued from the pure Essence of the Universal Sixth principle, -- or the OVER-SOUL, -- has (a) passed through every elemental form of the phenomenal world of that Manvantara, and (b) acquired individuality, first by natural impulse, and then by self-induced and self-devised efforts (checked by its Karma), thus ascending through all the degrees of intelligence, from the lowest to the highest Manas, from mineral and plant, up to the holiest archangel (Dhyani-Buddha).\n\nThe pivotal doctrine of the Esoteric philosophy admits no privileges or special gifts in man, save those won by his own Ego through personal effort and merit throughout a long series of metempsychoses and reincarnations.\n\nThis is why the Hindus say that the Universe is Brahma and Brahmâ, for Brahma is in every atom of the universe, the six principles in Nature being all the outcome -- the variously differentiated aspects -- of the SEVENTH and ONE, the only reality in the Universe whether Cosmical or micro-cosmical; and also why the permutations (psychic, spiritual and physical), on the plane of manifestation and form, of the sixth (Brahmâ the vehicle of Brahma) are viewed by metaphysical [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] spirit, an awkward and incorrect expression has to be used, for lack of appropriate words in English.\n\nThe Vedantins call it Sutratma (Thread-Soul), but their explanation, too, differs somewhat from that of the occultists; to explain which difference, however, is left to the Vedantins themselves.\n\n[[Vol.\n\n1, Page]] 18 THE SECRET DOCTRINE.\n\nantiphrasis as illusive and Mayavic.\n\nFor although the root of every atom individually and of every form collectively, is that seventh principle or the one Reality, still, in its manifested phenomenal and temporary appearance, it is no better than an evanescent illusion of our senses.\n\n(See, for clearer definition, Addendum \"Gods, Monads and Atoms,\" and also \"Theophania,\" \"Bodhisatvas and Reincarnation,\" etc., etc.) In its absoluteness, the One Principle under its two aspects (of Parabrahmam and Mulaprakriti) is sexless, unconditioned and eternal.\n\nIts periodical (manvantaric) emanation -- or primal radiation -- is also One, androgynous and phenomenally finite.\n\nWhen the radiation radiates in its turn, all its radiations are also androgynous, to become male and female principles in their lower aspects.\n\nAfter Pralaya, whether the great or the minor Pralaya (the latter leaving the worlds in statu quo* ) , the first that re-awakes to active life is the plastic A'kasa, Father-Mother, the Spirit and Soul of Ether, or the plane on the surface of the Circle.\n\nSpace is called the \"Mother\" before its Cosmic activity, and Father-Mother at the first stage of re-awakening.\n\n(See Comments, Stanza II.) In the Kabala it is also Father-Mother-Son.\n\nBut whereas in the Eastern doctrine, these are the Seventh Principle of the manifested Universe, or its \"Atma-Buddhi-Manas\" (Spirit, Soul, Intelligence), the triad branching off and dividing into the seven cosmical and seven human principles, in the Western Kabala of the Christian mystics it is the Triad or Trinity, and with their occultists, the male-female Jehovah, Jah-Havah.\n\nIn this lies the whole difference between the esoteric and the Christian trinities.\n\nThe Mystics and the Philosophers, the Eastern and Western Pantheists, synthesize their pregenetic triad in the pure divine abstraction.\n\nThe orthodox, anthropomorphize it.\n\nHiranyagarbha, Hari, and Sankara -- the three hypostases of the manifesting \"Spirit of the Supreme Spirit\" (by which title Prithivi -- the Earth -- greets Vishnu in his first Avatar) -- are the purely metaphysical abstract qualities of formation, preservation, and destruction, and are the three divine Avasthas (lit.\n\nhypostases) of that which \"does [[Footnote(s)]] ------------------------------------------------- * It is not the physical organisms that remain in statu quo, least of all their psychical principles, during the great Cosmic or even Solar pralayas, but only their Akasic or astral \"photographs.\" But during the minor pralayas, once over-taken by the \"Night,\" the planets remain intact, though dead, as a huge animal, caught and embedded in the polar ice, remains the same for ages.\n\n[[Vol.\n\n1, Page]] 19 PROEM.\n\nnot perish with created things\" (or Achyuta, a name of Vishnu); whereas the orthodox Christian separates his personal creative Deity into the three personages of the Trinity, and admits of no higher Deity.\n\nThe latter, in Occultism, is the abstract Triangle; with the orthodox, the perfect Cube.\n\nThe creative god or the aggregate gods are regarded by the Eastern philosopher as Bhrantidarsanatah -- \" false apprehension,\" something \"conceived of, by reason of erroneous appearances, as a material form,\" and explained as arising from the illusive conception of the Egotistic personal and human Soul (lower fifth principle).\n\nIt is beautifully expressed in a new translation of Vishnu Purana.\n\n\"That Brahma in its totality has essentially the aspect of Prakriti, both evolved and unevolved (Mulaprakriti), and also the aspect of Spirit and the aspect of Time.\n\nSpirit, O twice born, is the leading aspect of the Supreme Brahma.* The next is a twofold aspect, -- Prakriti, both evolved and unevolved, and is the time last.\" Kronos is shown in the Orphic theogony as being also a generated god or agent.\n\nAt this stage of the re-awakening of the Universe, the sacred symbolism represents it as a perfect Circle with the (root) point in the Centre.\n\nThis sign was universal, therefore we find it in the Kabala also.\n\nThe Western Kabala, however, now in the hands of Christian mystics, ignores it altogether, though it is plainly shown in the Zohar.\n\nThese sectarians begin at the end, and show as the symbol of pregenetic Kosmos this sign , calling it \"the Union of the Rose and Cross,\" the great mystery of occult generation, from whence the name -- Rosicrucians (Rose Cross)!"


[content]
body = "And if Bath-Kol, in Jewish mysticism, is an articulate praeternatural voice from heaven, revealing to the \"chosen people\" the sacred traditions and laws, it is only because Vach was called, before Judaism, the \"Mother of the Vedas,\" who entered into the Rishis and inspired them by her revelations; just as Bath-Kol is said to have inspired the prophets of Israel and the Jewish High-Priests.\n\nAnd both exist to this day, in their respective sacred symbologies, because the ancients associated sound or Speech with the Ether of Space, of which Sound is the characteristic.\n\nHence Fire, Water and Air are the primordial Cosmic Trinity.\n\n\"I am thy Thought, thy God, more ancient than the moist principle, the light that radiates within Darkness (Chaos), and the shining Word of God (Sound) is the Son of the Deity.\" (\"Pymander,\" § 6.)* Thus we have to study well the \"Primary creation,\" before we can understand the Secondary.\n\nThe first Race had three rudimentary elements in it; and no fire as yet; because, with the Ancients, the evolution of man, and the growth and development of his spiritual and physical senses, were subordinate to the evolution of the elements on the Cosmic plane of this Earth.\n\nAll proceeds from Prabhavapyaya, the evolution of the creative and sentient principles in the gods, and even of the so-called creative deity himself.\n\nThis is found in the names and appellations given to Vishnu in exoteric scriptures.\n\nAs the Protologos (the Orphic), he is called Purvaja, \"pregenetic,\" and then the other names connect him in their descending order more and more with matter.\n\nThe following order on parallel lines may be found in the evolution of the Elements and the Senses; or in Cosmic terrestrial \"MAN\" or \"Spirit,\" and mortal physical man: -- 1.\n\nEther ...\n\nHearing ...\n\nSound.\n\n2.\n\nAir ...\n\nTouch ...\n\nSound and Touch.\n\n3.\n\nFire, or Light ...\n\nSight ...\n\nSound, Touch and Colour.\n\n4.\n\nWater ...\n\nTaste ...\n\nSound, Touch, Colour and Taste.\n\n5.\n\nEarth ...\n\nSmell ...\n\nSound, Touch, Colour, Taste and Smell.\n\nAs seen, each Element adds to its own characteristics, those of its [[Footnote(s)]] ------------------------------------------------- * The opponents of Hinduism may call the above Pantheism, Polytheism, or anything they may please.\n\nIf Science is not entirely blinded by prejudice, it will see in this account a profound knowledge of natural Sciences and Physics, as well as of Metaphysics and Psychology.\n\nBut to find this out, one has to study the personifications, and then convert them into chemical atoms.\n\nIt will then be found to satisfy both physical and even purely materialistic Science , as well as those who see in evolution the work of the \"Great Unknown Cause\" in its phenomenal and illusive aspects.\n\n[[Vol.\n\n2, Page]] 108 THE SECRET DOCTRINE.\n\npredecessor; as each Root-Race adds the characterizing sense of the preceding Race.\n\nThe same is true in the septenary creation of man, who evolves gradually in seven stages, and on the same principles, as will be shown further on.\n\nThus, while Gods or Dhyan Chohans (Devas) proceed from the First Cause -- which is not Parabrahm, for the latter is the ALL CAUSE, and cannot be referred to as the \" First Cause,\" -- which First Cause is called in the Brahmanical Books Jagad-Yoni, \"the womb of the world,\" mankind emanates from these active agents in Kosmos.\n\nBut men, during the first and the second races, were not physical beings, but merely rudiments of the future men: Bhutas, which proceeded from Bhutadi, \"origin,\" or the \"original place whence sprung the Elements.\" Hence they proceeded with all the rest from Prabhavapyaya, \"the place whence is the origination, and into which is the resolution of all things,\" as explained by the Commentator.\n\nWhence also our physical senses.\n\nWhence even the highest \"created\" deity itself, in our philosophy.\n\nAs one with the Universe, whether we call him Brahma, Iswara, or Purusha, he is a manifested deity, -- hence created, or limited and conditioned.\n\nThis is easily proven, even from the exoteric teachings.\n\nAfter being called the incognizable, eternal Brahma (neuter or abstract), the Punda-Rikaksha, \"supreme and imperishable glory,\" once that instead of Sadaika-Rupa, \"changeless\" or \"immutable\" Nature, he is addressed as Ekanaka-Rupa, \"both single and manifold,\" he, the cause, becomes merged with his own effects; and his names, if placed in esoteric order, show the following descending scale: -- 1.\n\nMahapurusha or Paramatman ...\n\nSupreme Spirit.\n\n2.\n\nAtman or Purvaja (Protologos) ...The living Spirit of Nature.\n\n3.\n\nIndriyatman, or Hrishikesa ..........Spiritual or intellectual soul (One with the senses).\n\n5.\n\nBhutatman ................................\n\n.\n\nThe living, or Life Soul.\n\n6.\n\nKshetrajna ..................................\n\nEmbodied soul, or the Universe of Spirit and Matter.\n\n7.\n\nBhrantidarsanatah .........................False perception -- Material Universe.\n\nThe last name means something perceived or conceived of, owing to false and erroneous apprehension, as a material form; but, in fact, only Maya, illusion, as all is in our physical universe.\n\nIt is in strict analogy with ITS attributes in both the spiritual and material worlds, that the evolution of the Dhyan Chohanic Essences takes place; the characteristics of the latter being reflected, in their turn, in Man, collectively, and in each of his principles; every one of which contains in itself, in the same progressive order, a portion of their various \" fires \" and elements."


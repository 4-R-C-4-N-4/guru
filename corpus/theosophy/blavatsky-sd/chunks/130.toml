[content]
body = "And there are still weightier reasons to believe that the priceless Bhashyas (Commentaries) on the esoteric doctrine of the Brahmins, by their greatest expounder, will remain for ages yet a dead letter to most of the Hindus, except the Smartava Brahmins.\n\nThis sect, founded by Sankaracharya, (which is still very powerful in Southern India) is now almost the only one to produce students who have preserved sufficient knowledge to comprehend the [[Footnote(s) -------------------------------------------------]] * Also called \"the Sons of Wisdom,\" and of the \"Fire-Mist\" and the \"Brothers of the Sun\" in the Chinese records.\n\nSi-dzang (Tibet) is mentioned in the MSS .\n\nof the sacred library of the province of Fo-Kien, as the great seat of Occult learning from time immemorial, ages before Buddha.\n\nThe Emperor Yu, the \"great\" (2,207 years B .\n\nC .), a pious mystic and great adept, is said to have obtained his knowledge from the \"great teachers of the Snowy Range\" in Si-dzang.\n\n[[Vol.\n\n1, Page]] 272 THE SECRET DOCTRINE.\n\ndead letter of the Bhashyas.\n\nThe reason of this is that they alone, I am informed, have occasionally real Initiates at their head in their mathams, as for instance, in the \"Sringa-giri,\" in the Western Ghats of Mysore.\n\nOn the other hand, there is no sect in that desperately exclusive caste of the Brahmins, more exclusive than is the Smartava; and the reticence of its followers to say what they may know of the Occult sciences and the esoteric doctrine, is only equalled by their pride and learning.\n\nTherefore the writer of the present statement must be prepared beforehand to meet with great opposition and even the denial of such statements as are brought forward in this work.\n\nNot that any claim to infallibility, or to perfect correctness in every detail of all that which is herein said, was ever put forward.\n\nFacts are there, and they can hardly be denied.\n\nBut, owing to the intrinsic difficulties of the subjects treated, and the almost insurmountable limitations of the English tongue (as of all other European languages) to express certain ideas, it is more than probable that the writer has failed to present the explanations in the best and in the clearest form; yet all that could be done was done under every adverse circumstance, and this is the utmost that can be expected of any writer.\n\nLet us recapitulate and show, by the vastness of the subjects expounded, how difficult, if not impossible, it is to do them full justice.\n\n(1.) The Secret Doctrine is the accumulated Wisdom of the Ages, and its cosmogony alone is the most stupendous and elaborate system: e.g., even in the exotericism of the Puranas.\n\nBut such is the mysterious power of Occult symbolism, that the facts which have actually occupied countless generations of initiated seers and prophets to marshal, to set down and explain, in the bewildering series of evolutionary progress, are all recorded on a few pages of geometrical signs and glyphs.\n\nThe flashing gaze of those seers has penetrated into the very kernel of matter, and recorded the soul of things there, where an ordinary profane, however learned, would have perceived but the external work of form.\n\nBut modern science believes not in the \"soul of things,\" and hence will reject the whole system of ancient cosmogony.\n\nIt is useless to say that the system in question is no fancy of one or several isolated individuals.\n\nThat it is the uninterrupted record covering thousands of generations of Seers whose respective experiences were made to test and to verify the [[Vol.\n\n1, Page]] 273 THE PITH AND MARROW OF OCCULTISM.\n\ntraditions passed orally by one early race to another, of the teachings of higher and exalted beings, who watched over the childhood of Humanity.\n\nThat for long ages, the \"Wise Men\" of the Fifth Race, of the stock saved and rescued from the last cataclysm and shifting of continents, had passed their lives in learning, not teaching.\n\nHow did they do so?\n\nIt is answered: by checking, testing, and verifying in every department of nature the traditions of old by the independent visions of great adepts; i.e., men who have developed and perfected their physical, mental, psychic, and spiritual organisations to the utmost possible degree.\n\nNo vision of one adept was accepted till it was checked and confirmed by the visions -- so obtained as to stand as independent evidence -- of other adepts, and by centuries of experiences.\n\n(2.) The fundamental Law in that system, the central point from which all emerged, around and toward which all gravitates, and upon which is hung the philosophy of the rest, is the One homogeneous divine SUBSTANCE-PRINCIPLE, the one radical cause.\n\n.\n\n.\n\n.\n\n\"Some few, whose lamps shone brighter, have been led From cause to cause to nature's secret head, And found that one first Principle must be.\n\n.\n\n.\n\n.\" It is called \"Substance-Principle,\" for it becomes \"substance\" on the plane of the manifested Universe, an illusion, while it remains a \"principle\" in the beginningless and endless abstract, visible and invisible SPACE.\n\nIt is the omnipresent Reality: impersonal, because it contains all and everything.\n\nIts impersonality is the fundamental conception of the System.\n\nIt is latent in every atom in the Universe, and is the Universe itself.\n\n(See in chapters on Symbolism, \"Primordial Substance, and Divine Thought.\") (3.) The Universe is the periodical manifestation of this unknown Absolute Essence.\n\nTo call it \"essence,\" however, is to sin against the very spirit of the philosophy.\n\nFor though the noun may be derived in this case from the verb esse, \"to be,\" yet IT cannot be identified with a being of any kind, that can be conceived by human intellect.\n\nIT is best described as neither Spirit nor matter, but both.\n\n\"Parabrahmam and Mulaprakriti\" are One, in reality, yet two in the Universal conception of the manifested, even in the conception of the One Logos, its first manifestation, to which, as the able lecturer in the \"Notes on the Bhagavadgita\" shows, IT appears from the objective standpoint of [[Vol.\n\n1, Page]] 274 THE SECRET DOCTRINE.\n\nthe One Logos as Mulaprakriti and not as Parabrahmam; as its veil and not the one REALITY hidden behind, which is unconditioned and absolute.\n\n(4.) The Universe is called, with everything in it, MAYA, because all is temporary therein, from the ephemeral life of a fire-fly to that of the Sun.\n\nCompared to the eternal immutability of the ONE, and the changelessness of that Principle, the Universe, with its evanescent ever-changing forms, must be necessarily, in the mind of a philosopher, no better than a will-o'-the-wisp.\n\nYet, the Universe is real enough to the conscious beings in it, which are as unreal as it is itself."


body = "would be either the phallus or the phallus and yoni, .\n\n.\n\n.\n\nor male and female.\n\nIndeed, the words translated by the generalizing terms male and female, in the 27th verse of the 1st chapter of Genesis are .\n\n.\n\n.\n\nsacr and n ' cabrah , or literally, phallus and yoni,**** while the representation of the phallic emblems would barely indicate the genital members of the human body, when their functions and the development of the seed-vesicles emanating from them was considered; then would come into indication a mode of measures of lunar time, and, through lunar, of solar time.\" .\n\n.\n\n.\n\nThis is the physiological or anthropological key to the Moon symbol.\n\nThe key that opens the mystery of theogony, or the evolution of the Manvantaric gods, is more complicated, and has nothing phallic in it.\n\nAll is mystical and divine there.\n\nBut the Jews, beyond connecting Jehovah directly with the Moon as a generative god, preferred to ignore the higher hierarchies, and have made of some of them (zodiacal constellations and planetary gods) their Patriarchs, thus euhemerizing the [[Footnote(s)]] ------------------------------------------------- * A caricatured and dwarfed Vedantin notion of Parabrahmam containing within itself the whole Universe as being that boundless Universe itself, and there existing nothing outside of itself.\n\n** Just as they are to this day in India, the bull of Siva and the cow representing several Sakti -- goddesses.\n\n*** Hence the worship of the moon by the Hebrews.\n\n**** \" Male and female , created he them.\" [[Vol.\n\n1, Page]] 391 THE TIME PERIODS.\n\npurely theosophical idea and dragging it down to the level of sinful humanity.\n\n( See section \" Holy of Holies \" in the \" Symbolism \" of Book II.\n\n) The MSS .\n\nfrom which the above is extracted explains very clearly to what hierarchy of gods Jehovah belonged, and who this Jewish G OD was; for it shows in clear language that which the writer has always insisted upon -- namely, that the God with which the Christians have burdened themselves was no better than the lunar symbol of the reproductive or generative faculty in nature.\n\nThey have ever ignored even the Hebrew secret god of the Kabalists, Ain-Soph, as grand as Parabrahmam in the earliest Kabalistic and mystical conceptions.\n\nBut it is not the Kabala of Rosenroth that can ever give the true original teachings of Simeon-Ben-Iochai, as metaphysical and philosophical as any.\n\nAnd how many are there among the students of the Kabala who knew anything of them except in their distorted Latin translations.\n\nLet us glance at the idea which led the ancient Jews to adopt a substitute for the ever U NKNOWABLE, and which has misled the Christians into mistaking the substitute for the reality.\n\n\"If to these organs (phallus and yoni) as symbols of creative cosmic agencies the idea of .\n\n.\n\n.\n\n.\n\ntime periods can be attached, then, indeed, in the construction of Temples as Dwellings of Deity, or of Jehovah, that post designated as the Holy of Holies, or the most High Place, should borrow its title from the recognized sacredness of the generative organs, considered as symbols of measures as well as of creative Cause.\" \"With the ancient wise, there was no name, and no idea, and no symbol, of a First Cause.* With the Hebrews, the indirect conception of such was couched in a term of negation of comprehension -- viz .\n\n, Ain-Soph , or the Without Bounds.\n\nBut the symbol of its first comprehensible manifestation , was the conception of a circle with its diameter line.\n\n.\n\n.\n\n.\n\n.\n\n(See the Proem of Book I., Part I.) to carry at once a geometric, phallic, and astronomic idea .\n\n.\n\n.\n\n.\n\nfor the one takes its birth from the nought or the Circle, without which it could not be, and from one, or primal one, spring the nine digits, and, geometrically, all plane shapes.\n\nSo in the Kabala this Circle, with its diameter line, is the picture of the ten Sephiroth or Emanations, composing the Adam Kadmon, the Archetypal Man, the creative origin of all things.\n\n.\n\n.\n\n.\n\n.\n\nThis idea of connecting the circle and its diameter line, that is, number ten, with the signification of the reproductive organs, and the Most Holy Place, was carried out constructively in the King's Chamber, or Holy of Holies, of the great Pyramid, in the Tabernacle of Moses, and in the Holy of Holies of the Temple of Solomon.\n\n.\n\n.\n\n.\n\n.\n\nIt is the picture of a double-womb , for in Hebrew the letter he is at the same time the number 5 and symbol of the womb, and twice 5 is 10, or the phallic number.\" This \"double womb\" also shows the duality of the idea carried from [[Footnote(s)]] ------------------------------------------------- * Because it was too sacred.\n\nIt is referred to as T HAT in the Vedas: it is the \"Eternal Cause,\" and cannot, therefore, be spoken of as a \"First Cause,\" a term implying the absence of any cause, at one time.\n\n[[Vol.\n\n1, Page]] 392 THE SECRET DOCTRINE.\n\nthe highest, spiritual, down to the lowest or terrestrial plane; and by the Jews limited to the latter.\n\nWith them, therefore the number 7 has acquired the most prominent place in their exoteric religion, a cult of external forms and empty rituals; as their Sabbath, for instance, the seventh day sacred to their deity, the moon, symbolical of the generative Jehovah.\n\nWhile with other nations the number seven was typical of theogonic evolution, of cycles, cosmic planes, and the Seven Forces and Occult Powers in Kosmos, as a boundless whole, whose first upper triangle was unreachable to the finite intellect of man -- while other nations, therefore, busied themselves, in their forcible limitation of Kosmos in Space and Time, only with its septenary manifested plane, the Jews centred this member solely in the moon, and based all their sacred calculations thereupon.\n\nHence we find the thoughtful author of the MSS .\n\njust quoted, remarking, in reference to the metrology of the Jews that: \"If 20,612 be multiplied by 4/3 the product will afford a base for the ascertainment of the mean revolution of the moon , and if this product be again multiplied by 4/3, this continued product will afford a base for finding the exact period of the mean solar year, .\n\n.\n\n.\n\nthis form .\n\n.\n\n.\n\nbecoming, for the finding of astronomical periods of time, of very great service.\" This double number (male and female) is symbolized also in some well-known idols: e.g ., \"Ardanari-Iswara, the Isis of the Hindus, Eridanus, or Ardan, or the Hebrew Jordan, or source of descent.\n\nShe is standing on a lotus-leaf flowing on the water."


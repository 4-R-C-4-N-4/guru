[content]
body = "It is already the outline of the two \"Supremes\" -- God and Satan.\n\nBut in the Stanzas no such idea exists.\n\nMost of the Western Christian Kabalists -- pre-eminently Eliphas Levi -- in their desire to reconcile the Occult Sciences with Church dogmas, did their best to make of the \"Astral Light\" only and preeminently the Pleroma of early Church Fathers, the abode of the Hosts of the Fallen Angels, of the \"Archons\" and \"Powers.\" But the Astral Light, while only the lower aspect of the Absolute, is yet dual.\n\nIt is the Anima Mundi , and ought never to be viewed otherwise, except for Kabalistic purposes.\n\nThe difference which exists between its \"light\" and its \"Living Fire\" ought to be ever present in the mind of the Seer and the \"Psychic.\" The higher aspect, without which only creatures of matter from that Astral Light can be produced, is this Living Fire, and it is the Seventh Principle.\n\nIt is said in \"Isis Unveiled,\" in a complete description of it: -- \"The Astral Light or Anima Mundi is dual and bisexual.\n\nThe (ideal) male part of it is purely divine and spiritual, it is the Wisdom , it is Spirit or Purusha; while the female portion (the Spiritus of the Nazarenes) is tainted, in one sense, with matter, is indeed matter, and therefore is evil already.\n\nIt is the life-principle of every living creature, and furnishes the astral soul, the fluidic perisprit , to men, animals, fowls of the air, and everything living.\n\nAnimals have only the latent germ of the highest immortal soul in them.\n\n.\n\n.\n\n.\n\n.\n\nThis latter will develop [[Footnote(s)]] ------------------------------------------------- * Codex Nazaraeus , i, 135 .\n\n** Ibid.\n\n*** See the Cosmogony of Pherecydes.\n\n[[Vol.\n\n1, Page]] 197 ILDA-BAOTH-JEHOVAH.\n\nonly after a series of countless evolutions; the doctrine of which evolution is contained in the Kabalistic axiom: 'A stone becomes a plant; a plant, a beast; a beast, a man; a man, a spirit; and the spirit, a god.'\" (Vol.\n\nI., p.\n\n301, note.) The seven principles of the Eastern Initiates had not been explained when \"Isis\" was written, but only the three Kabalistic Faces of the semi-exoteric Kabala.* But these contain the description of the mystic natures of the first group of Dhyan Chohans in the regimen ignis , the region and \"rule (or government) of fire,\" which group is divided into three classes, synthesized by the first, which makes four or the \"Tetraktis.\" ( See Comments on Stanza VII.\n\nBook I.\n\n) If one studies the Comments attentively he will find the same progression in the angelic natures, viz., from the passive down to the active , the last of these Beings being as near to the Ahamkara element (the region or plane wherein Egoship or the feeling of I-am-ness is beginning to be defined) as the first ones are near to the undifferentiated essence.\n\nThe former are Arupa, incorporeal; the latter, Rupa, corporeal.\n\nIn Volume II.\n\nof Isis ( p.\n\n183 et seq.\n\n) the philosophical systems of the Gnostics and the primitive Jewish Christians, the Nazarenes and the Ebionites, are fully considered.\n\nThey show the views held in those days -- outside the circle of Mosaic Jews -- about Jehovah.\n\nHe was identified by all the Gnostics with the evil, rather than with the good principle.\n\nFor them, he was Ilda-Baoth , \"the son of Darkness,\" whose mother, Sophia Achamoth, was the daughter of Sophia, the Divine Wisdom (the female Holy Ghost of the early Christians) -- Akasa;** while Sophia Achamoth personified the lower Astral Light or Ether.\n\nIlda-Baoth,*** or Jehovah, is simply one of the Elohim, the seven [[Footnote(s)]] ------------------------------------------------- * They are found, however, in the Chaldean Book of Numbers.\n\n** The astral light stands in the same relation to Akasa and Anima Mundi , as Satan stands to the Deity.\n\nThey are one and the same thing seen from two aspects: the spiritual and the psychic -- the super-ethereal or connecting link between matter and pure spirit, and the physical.\n\nSee for the difference between nous , the higher divine wisdom, and psyche , the lower and terrestrial ( St.\n\nJames iii.\n\nv.\n\n15-17).\n\nVide \"Demon est Deus inversus,\" Part II.\n\nof this volume.\n\n*** Ilda-Baoth is a compound name made up of Ilda , , \"a child,\" and Baoth; both from the egg, and Baoth , \"chaos,\" emptiness, void, or desolation; or the child born in the egg of Chaos, like Brahma.\n\n[[Vol.\n\n1, Page]] 198 THE SECRET DOCTRINE.\n\ncreative Spirits, and one of the lower Sephiroth.\n\nHe produces from himself seven other Gods, \"Stellar Spirits\" (or the lunar ancestors*), for they are all the same.** They are all in his own image (the \"Spirits of the Face\"), and the reflections one of the other, and have become darker and more material as they successively receded from their originator.\n\nThey also inhabit seven regions disposed like a ladder, as its rungs slope up and down the scale of spirit and matter.*** With Pagans and Christians, with Hindus and Chaldeans, with the Greek as with the Roman Catholics -- with a slight variation of the texts in their interpretations -- they all were the Genii of the seven planets, as of the seven planetary spheres of our septenary chain, of which Earth is the lowest.\n\n(See Isis , Vol.\n\nII.\n\np.\n\n186.) This connects the \"Stellar\" and \"Lunar\" Spirits with the higher planetary Angels and the Saptarishis (the seven Rishis of the Stars) of the Hindus -- as subordinate Angels (Messengers) to these \"Rishis,\" the emanations, on the descending scale, of the former.\n\nSuch, in the opinion of the philosophical Gnostics, were the God and the Archangels now worshipped by the Christians!\n\nThe \"Fallen Angels\" and the legend of the \"War in Heaven\" is thus purely pagan in its origin and comes from India via Persia and Chaldea.\n\nThe only reference to it in the Christian canon is found in Revelations xii., as quoted a few pages back."


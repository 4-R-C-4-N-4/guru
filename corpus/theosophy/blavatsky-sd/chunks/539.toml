[content]
body = "Hence Io, refusing to yield to Jupiter's passion, becomes \"horned.\" The cow was in every country the symbol of the passive generative power of nature, Isis, Vach, Venus -- the mother of the prolific god of love, Cupid, but, at the same time, that of the Logos whose symbol became with the Egyptians and the Indians -- the bull -- as testified to by Apis and the Hindu bulls in the most ancient temples.\n\nIn esoteric philosophy the cow is the symbol of creative nature, and the Bull (her calf) the spirit which vivifies her, or \"the Holy Spirit,\" as Mr.\n\nKenealy shows.\n\nHence the symbol of the horns.\n\nThese were sacred also with the Jews, who placed near the altar horns of Shittim wood, by seizing which a criminal ensured his safety.\n\n[[Vol.\n\n2, Page]] 419 WAS AESCHYLUS INITIATED?\n\nBut \"Argos\" is Arghya Varsha, the land of libation of the old Hierophants, whence the deliverer of Humanity will appear, a name which became ages later that of its neighbour, India -- the Arya-varta of old.\n\nThat the subject formed part of the Sabasian mysteries is made known by several ancient writers: by Cicero ( in Tuscul.\n\nQuaest.\n\nI, ii.\n\nNo.\n\n20) and by Clemens Alexandrinus ( Strom .\n\nI, ii., oper.\n\ntom .\n\n1 , p.\n\n467 -- Ed.\n\nPotter ' s ).\n\nThe latter writers are the only ones who attribute the fact that AEschylus was charged by the Athenians with sacrilege and condemned to be stoned to death, to its true cause.\n\nThey say that having been himself uninitiated, AEschylus had profaned the Mysteries by exposing them in his trilogies on a public stage.* But he would have incurred the same condemnation had he been initiated -- which must have been the case, as otherwise he must, like Socrates, have had a daimon to reveal to him the secret and sacred allegorical drama of initiation.\n\nAt all events, it is not the \"father of the Greek tragedy\" who invented the prophecy of Prometheus; for he only repeated in dramatic form that which was revealed by the priests during the MYSTERIA of the Sabasia.** The latter, however, is one of the oldest sacred festivals, whose origin is to this day unknown to history.\n\nMythologists connect it through Mithras (the Sun, called Sabasius on some old monuments) with Jupiter and Bacchus.\n\nBut it was never the property of the Greeks, but dates from days immemorial.\n\nThe translators of the drama wonder how AEschylus could become guilty of such \"discrepancy between the character of Zeus as portrayed in the 'Prometheus Bound' and that depicted in the remaining dramas.\" ( Mrs.\n\nA.\n\nSwanwick.\n\n) This is just because AEschylus, like Shakespeare, was and will ever remain the intellectual \"Sphinx\" of the ages.\n\nBetween Zeus, the abstract deity of Grecian thought, and the Olympic Zeus, there was an abyss.\n\nThe latter represented during the mysteries no higher a principle than the lower aspect of human physical intelligence -- Manas wedded to Kama ; Prometheus -- its divine aspect merging into and aspiring to Buddhi -- the divine Soul.\n\nZeus was the human soul and nothing more, whenever shown yielding to his lower passions, -- the jealous God, revengeful and cruel in its egotism or I -AM-NESS.\n\nHence, Zeus is represented as a serpent -- the intellectual tempter of man -- which, nevertheless, begets in the course of [[Footnote(s)]] ------------------------------------------------- * Herodotus and Pausanias supposed that the cause of the condemnation was that AEschylus, adopting the theogony of the Egyptians, made Diana, the daughter of Ceres, and not of Latona.\n\n(See AElian Var.\n\nHist.\n\nI, v.\n\nc .\n\nxviii., tom .\n\n1, p .\n\n433 Edition Gronov.\n\n) But AEschyIus was initiated.\n\n** Sabasia was a periodical festival with mysteries enacted in honour of some gods, a variant on the Mithraic Mysteries.\n\nThe whole evolution of the races was performed in them.\n\n[[Vol.\n\n2, Page]] 420 THE SECRET DOCTRINE.\n\ncyclic evolution the \"Man-Saviour,\" the solar Bacchus or \"Dionysos,\" more than a man.\n\nDionysos is one with Osiris, with Krishna, and with Buddha (the heavenly wise), and with the coming (tenth) Avatar, the glorified Spiritual Christos, who will deliver the suffering Christos (mankind, or Prometheus, on its trial).\n\nThis, say Brahminical and Buddhistic legends, echoed by the Zoroastrian and now by the Christian teachings (the latter only occasionally), will happen at the end of Kaliyuga.\n\nIt is only after the appearance of Kalki-Avatar, or Sosiosh, that man will be born from woman without sin.\n\nThen will Brahma, the Hindu deity; Ahura-Mazda (Ormazd), the Zoroastrian; Zeus, the Greco-Olympian Don Juan; Jehovah, the jealous, repenting, cruel, tribal God of the Israelites, and all their likes in the universal Pantheon of human fancy -- vanish and disappear in thin air.\n\nAnd along with these will vanish their shadows, the dark aspects of all those deities, ever represented as their \"twin brothers\" and creatures, in exoteric legend, their own reflection on earth -- in esoteric philosophy.\n\nThe Ahrimans and Typhons, the Samaels and Satans, must be all dethroned on that day, when every dark evil passion will be subdued.\n\nThere is one eternal Law in nature, one that always tends to adjust contraries and to produce final harmony.\n\nIt is owing to this law of spiritual development superseding the physical and purely intellectual, that mankind will become freed from its false gods, and find itself finally - - SELF - REDEEMED .\n\nIn its final revelation, the old myth of Prometheus -- his proto- and anti- types being found in every ancient theogony -- stands in each of them at the very origin of physical evil, because at the threshold of human physical life.\n\nK RONOS is \"Time,\" whose first law is that the order of the successive and harmonious phases in the process of evolution during cyclic development should be strictly preserved -- under the severe penalty of abnormal growth with all its ensuing results.\n\nIt was not in the programme of natural development that man -- higher animal though he may be -- should become at once -- intellectually, spiritually, and psychically -- the demi-god he is on earth, while his physical frame remains weaker and more helpless and ephemeral than that of almost any huge mammal.\n\nThe contrast is too grotesque and violent; the tabernacle much too unworthy of its indwelling god."


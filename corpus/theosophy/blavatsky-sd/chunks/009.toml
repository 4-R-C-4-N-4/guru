[content]
body = "Thus, though the Mother of Mercury (Budha, Thot-Hermes, etc.), was Maia, the mother of Buddha (Gautama), also Maya, and the mother of Jesus, likewise Maya (illusion, for Mary is Mare, the Sea, the great illusion symbolically) -- yet these three characters have no connection, nor can they have any, since Bopp, has \"laid down his code of phonetic laws.\" In their efforts to collect together the many skeins of unwritten history, it is a bold step for our Orientalists to take, to deny, a priori, everything that does not dovetail with their special conclusions.\n\nThus, while new discoveries are daily made of great arts and sciences having existed far back in the night of time, even the knowledge of writing is refused to some of the most ancient nations, and they are credited with barbarism instead of culture.\n\nYet the traces of an immense civilization, even in Central Asia, are still to be found.\n\nThis civilization is undeniably prehistoric.\n\nAnd how can there be civilization without a literature, in some form, without annals or chronicles?\n\nCommon sense alone ought to supplement the broken links in the history of departed nations.\n\nThe gigantic, unbroken wall of the mountains that hem in the whole table-land of Tibet, from the upper course of the river Khuan-Khe down to the Kara-Korum hills, witnessed a civilization during millenniums of years, and would have strange secrets to tell mankind.\n\nThe Eastern and Central portions of those regions -- the Nan-Schayn and the Altyne-taga -- were once upon a time covered with cities that could well vie with Babylon.\n\nA whole geological period has swept over the land, since those cities breathed their last, as the mounds of shifting sand, and the sterile and now dead soil of the immense central plains of the basin of Tarim testify.\n\nThe borderlands alone are superficially known to the traveller.\n\nWithin those table-lands of sand there is water, and fresh oases are found blooming there, wherein no European foot has ever yet ventured, or trodden the now treacherous soil.\n\nAmong these verdant oases there are some which are entirely inaccessible even to the native profane traveller.\n\nHurricanes may \"tear up the sands and sweep whole plains away,\" they are powerless to destroy that which is beyond their reach.\n\nBuilt deep in the bowels of the earth, the subterranean stores are secure; and as their entrances are concealed in such oases, there is little fear that any one should discover them, even should several armies invade the sandy wastes where -- [[Vol.\n\n1, Page]] xxxiii INTRODUCTORY.\n\n\"Not a pool, not a bush, not a house is seen, And the mountain-range forms a rugged screen Round the parch'd flats of the dry, dry desert.\n\n.\n\n.\n\n.\n\n.\" But there is no need to send the reader across the desert, when the same proofs of ancient civilization are found even in comparatively populated regions of the same country.\n\nThe oasis of Tchertchen, for instance, situated about 4,000 feet above the level of the river Tchertchen-D'arya, is surrounded with the ruins of archaic towns and cities in every direction.\n\nThere, some 3,000 human beings represent the relics of about a hundred extinct nations and races -- the very names of which are now unknown to our ethnologists.\n\nAn anthropologist would feel more than embarrassed to class, divide and subdivide them; the more so, as the respective descendants of all these antediluvian races and tribes know as little of their own forefathers themselves, as if they had fallen from the moon.\n\nWhen questioned about their origin, they reply that they know not whence their fathers had come, but had heard that their first (or earliest) men were ruled by the great genii of these deserts.\n\nThis may be put down to ignorance and superstition, yet in view of the teachings of the Secret Doctrine, the answer may be based upon primeval tradition.\n\nAlone, the tribe of Khoorassan claims to have come from what is now known as Afghanistan, long before the days of Alexander, and brings legendary lore to that effect as corroboration.\n\nThe Russian traveller, Colonel (now General) Prjevalsky, found quite close to the oasis of Tchertchen, the ruins of two enormous cities, the oldest of which was, according to local tradition, ruined 3,000 years ago by a hero and giant; and the other by the Mongolians in the tenth century of our era.\n\n\"The emplacement of the two cities is now covered, owing to shifting sands and the desert wind, with strange and heterogeneous relics; with broken china and kitchen utensils and human bones.\n\nThe natives often find copper and gold coins, melted silver, ingots, diamonds, and turquoises, and what is the most remarkable -- broken glass.\n\n.\n\n.\n\n.\n\n.\" \"Coffins of some undecaying wood, or material, also, within which beautifully preserved embalmed bodies are found.\n\n.\n\n.\n\n.\n\n.\n\nThe male mummies are all extremely tall powerfully built men with long waving hair.\n\n.\n\n.\n\n.\n\n.\n\nA vault was found with twelve dead men sitting in it.\n\nAnother time, in a separate coffin, a young girl was discovered by us.\n\nHer eyes were closed with golden discs, and the jaws held firm by a golden circlet running from under the chin across the top of the head.\n\nClad in a narrow [[Vol.\n\n1, Page]] xxxiv INTRODUCTORY.\n\nwoollen garment, her bosom was covered with golden stars, the feet being left naked.\" (From a lecture by N.\n\nM.\n\nPrjevalsky.) To this, the famous traveller adds that all along their way on the river Tchertchen they heard legends about twenty-three towns buried ages ago by the shifting sands of the deserts.\n\nThe same tradition exists on the Lob-nor and in the oasis of Kerya.\n\nThe traces of such civilization, and these and like traditions, give us the right to credit other legendary lore warranted by well educated and learned natives of India and Mongolia, when they speak of immense libraries reclaimed from the sand, together with various reliques of ancient MAGIC lore, which have all been safely stowed away.\n\nTo recapitulate.\n\nThe Secret Doctrine was the universally diffused religion of the ancient and prehistoric world.\n\nProofs of its diffusion, authentic records of its history, a complete chain of documents, showing its character and presence in every land, together with the teaching of all its great adepts, exist to this day in the secret crypts of libraries belonging to the Occult Fraternity."


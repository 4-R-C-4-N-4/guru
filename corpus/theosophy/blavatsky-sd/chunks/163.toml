[content]
body = "This \"First-Born,\" however, was only the aggregate of the Host of the \"Builders,\" the first constructive Forces, who are called in ancient Cosmogonies the Ancients (born of the Deep, or Chaos) and the \"First Point.\" He is the Tetragrammaton, so-called, at the head of the Seven lower Sephiroth.\n\nThis was the belief of the Chaldees.\n\n\"These Chaldeans,\" writes Philo, the Jew, speaking very flippantly of the first instructors of his ancestors, \"were of opinion that the Kosmos, among the things that exist (?) is a single point, either being itself God (Theos) or that in it is God, comprehending the soul of all things.\" (See his \" Migration of Abraham ,\" 32 .\n\n) Chaos-Theos-Kosmos are but the three aspects of their synthesis -- SPACE.\n\nOne can never hope to solve the mystery of this Tetraktis by holding to the dead-letter even of the old philosophies, as now extant.\n\nBut, even in these CHAOS-THEOS-KOSMOS = SPACE, are identified in all Eternity, as the One Unknown Space, the last word about which will, perhaps, never be known before our seventh Round.\n\nNevertheless, the allegories and metaphysical symbols about the primeval and perfect CUBE, are remarkable even in the exoteric Puranas.\n\nThere, also, Brahma is the Theos , evolving out of Chaos , or the great \"Deep,\" the waters, over which Spirit = SPACE, personified by ayana -- the Spirit moving over the face of the future boundless Kosmos -- is silently hovering, in the first hour of re-awakening.\n\nIt is also Vishnu, sleeping on Ananta-Sesha, the great Serpent of Eternity, of which Western theology, ignorant of the Kabala, the only key that opens the secrets of the Bible, has made -- the Devil.\n\nIt is the first triangle or the Pythagorean triad , the \"God of the three Aspects,\" before it is transformed through its perfect quadrature of the infinite Circle into the \"four-faced Brahma.\" \"Of him who is and yet is not, from the not-being, Eternal Cause, is born the Being-Purusha,\" says Manu, the legislator.\n\nIn Isis Unveiled , it is said that: -- \"In the Egyptian mythology, Kneph, the Eternal Unrevealed God, is represented by a snake emblem of Eternity encircling a water urn, with its head hovering over the waters, which it incubates with its breath.\n\nIn this case the serpent is the Agathodaemon, the good spirit: in its opposite aspect, it is the Kakodaemon -- the bad one.\n\nIn the Scandinavian Eddas , the honey dew, the fruit of the gods and of the creative busy Yggdrasill (bees), falls during the hours of night, when the atmosphere is impregnated with humidity; and in the Northern mythologies, as the passive principle of creation, it typifies the [[Vol.\n\n1, Page]] 345 THE BIRTH OF MIND.\n\ncreation of the universe out of water; this dew is the astral light in one of its combinations, and possesses creative as well as destructive properties.\n\nIn the Chaldean legend of Berosus, Oannes or Dagon, the man-fish, instructing the people, shows the infant world created out of water , and all beings originating from this prima materia.\n\nMoses teaches that only earth and water can bring a living soul: and we read in the Scriptures that herbs could not grow until the Eternal caused it to rain upon earth.\n\nIn the Mexican Popol-Vuh , man is created out of mud or clay ( terre glaise ), taken from under the water.\n\nBrahma creates the great Muni (or first man) seated on his lotus, only after having called into being spirits who thus enjoyed over mortals a priority of existence, and he creates him out of water , air and earth.\n\nAlchemists claim that the primordial or pre-Adamic earth, when reduced to its first substance, is in its second stage of transformation like clear water, the first being the alkahest proper.\n\nThis primordial substance is said to contain within itself the essence of all that goes to make up man; it has not only all the elements of his physical being, but even the \"breath of life\" itself in a latent state, ready to be awakened.\n\nThis it derives from the \"incubation\" of the \"Spirit of God\" upon the face of the waters -- CHAOS: in fact, this substance is chaos itself.\n\nFrom this it was that Paracelsus claimed to be able to make his \"homunculi;\" and this is why Thales, the great natural philosopher, maintained that water was the principle of all things in nature.* .\n\n.\n\n.\n\nJob says, in chap.\n\nxxvi.\n\n5, that \"dead things are formed from under the waters, and inhabitants thereof.\" In the original text, instead of \"dead things,\" it is written dead Rephaim (giants or mighty primitive men), from whom \"Evolution\" may one day trace our present race.\" \"In the primordial state of the creation,\" says Polier's Mythologie des Indous , \"the rudimental universe, submerged in water, reposed in the bosom of Vishnu.\n\nSprung from this chaos and darkness, Brahma, the architect of the world, poised on a lotus-leaf, floated (moved) upon the waters, unable to discern anything but water and darkness.\" Perceiving such a dismal state of things, Brahma soliloquises in consternation: \"Who am I?\n\nWhence came I?\" Then he hears a voice:** \"Direct your thoughts to Bhagavat.\" Brahma, rising from his natatory position, seats himself upon the lotus in an attitude of contemplation, and reflects upon the Eternal, who, pleased with this evidence of piety, disperses the primeval darkness and opens his understanding.\n\n\"After this Brahma issues from the universal egg (infinite chaos) as light , for his understanding is now opened, and he sets himself to work: he moves on the eternal waters, with the spirit of God within himself; and in his capacity of mover of the waters he is Vishnu, or Narayana.\n\n\" This is [[Footnote(s)]] ------------------------------------------------- * With the Greeks, the \"River-gods,\" all of them the Sons of the primeval ocean (Chaos in its masculine aspect), were the respective ancestors of the Hellenic races.\n\nFor them the O CEAN was the father of the Gods; and thus they had anticipated in this connection the theories of Thales, as rightly observed by Aristotle (Metaph.\n\nI., 3, 5).\n\n** The \"Spirit,\" or hidden voice of the Mantras , the active manifestation of the latent Force, or occult potency.\n\n[[Vol.\n\n1, Page]] 346 THE SECRET DOCTRINE."


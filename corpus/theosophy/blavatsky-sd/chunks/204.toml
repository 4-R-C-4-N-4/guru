body = "\"They have seized upon the three worlds, and appropriated the offerings which are our portion, taking care not to transgress the Precepts of the Veda.\n\nAlthough we , as well as they , are parts of thee.* .\n\n.\n\n.\n\n.\n\nengaged as they are in the paths prescribed by the holy writ .\n\n.\n\n.\n\n.\n\nit is impossible for us to destroy them.\n\nDo thou, whose wisdom is immeasurable ( Ameyatman ) instruct us in some device by which we may be able to exterminate the enemies of the gods!\" \"When the mighty Vishnu heard their request, he emitted from his body an illusory form ( Mayamoha , \"the deluder by illusion\") which he gave to the Gods and thus spake: \"This Mayamoha shall wholly beguile the Daityas , so that being led astray from the path of the Vedas, they may be put to death.\n\n.\n\n.\n\n.\n\nGo then and fear not.\n\nLet this delusive vision precede you.\n\nIt shall this day be of great service unto you, O Gods!\" \"After this, the great Delusion, Mayamoha , descending to earth, beheld the Daityas engaged in ascetic penances, and approaching them, in the semblance of a Digambara (naked mendicant) with his head shaven .\n\n.\n\n.\n\nhe thus addressed them, in gentle accents: \"Ho, lords of the Daitya race, wherefore is it that you practise these acts of penances?\" etc., etc.\n\n(Book II., xviii.).\n\nFinally the Daityas were seduced by the wily talk of Mahamoha , as Eve was seduced by the advice of the Serpent.\n\nThey became apostates to the Vedas.\n\nAs Dr.\n\nMuir translates the passage: -- \"The great Deceiver, practising illusion, next beguiled other Daityas, by means of many other sorts of heresy.\n\nIn a very short time, these Asuras (-Daityas) deluded by the Deceiver (who was Vishnu) abandoned the entire system founded on the ordinances of the triple Veda.\n\nSome reviled the Vedas, others the Gods, others the ceremonial of sacrifice, and others the Brahmans.\n\nThis, they exclaimed, is a doctrine which will not bear discussion.\n\nThe slaughter of animals in sacrifice is not conducive to religious merit.\n\nTo say that oblations of butter consumed in the fire produce any future reward, is the assertion of a child.\n\n.\n\n.\n\n.\n\nIf it be a fact that a beast slain in sacrifice is exalted to heaven, why does not the worshipper slaughter his own father?\n\n.\n\n.\n\n.\n\n.\n\nInfallible utterances do not, great Asuras, fall from the skies; it is only assertions founded on reasoning that are accepted by me and by other intelligent persons like yourselves!\n\nThus by numerous methods the Daityas were unsettled by the great Deceiver ( Reason ).\n\n.\n\n.\n\n.\n\nWhen [[Footnote(s)]] ------------------------------------------------- * \"There was a day when the Sons of God came before the Lord, and Satan came with his brothers , also before the Lord\" ( Job ii., Abyss., Ethiopic text).\n\n[[Vol.\n\n1, Page]] 423 THE DECEPTION, AN ALLEGORY.\n\nthey had entered on the path of error, the gods mustered all their energies and approached to battle.\n\nThen followed a combat between the gods and the Asuras; and the latter, who had abandoned the right road, were smitten by the former.\n\nIn previous times they had been defended by the armour of righteousness which they bore, but when that had been destroyed they, also, perished.\" ( Journal of the Royal Asiat.\n\nSociety , Vol.\n\nXIX ., p.\n\n302.) Whatever may be thought of Hindus, no enemy of theirs can regard them as fools.\n\nA people whose holy men and sages have left to the world the greatest and most sublime philosophies that ever emanated from the minds of men, must have known the difference between right and wrong.\n\nEven a savage can discern white from black, good from bad, and deceit from sincerity and truthfulness.\n\nThose who had narrated this event in the biography of their god, must have seen that in this case it was that God who was the arch-Deceiver, and the Daityas, who \"never transgressed the precepts of the Vedas,\" who had the sunny side in the transaction, and who were the true \"Gods.\" Thence there must have been, and there is a secret meaning hidden under this allegory.\n\nIn no class of Society, in no nation, are deceit and craft considered as Divine virtues -- except perhaps in the clerical classes of theologians and modern Jesuitism.\n\nThe Vishnu Purana,* like all other works of this kind, has passed at a later period into the hands of the temple-Brahmins, and the old MSS .\n\nhave, no doubt, been once more tampered with by sectarians.\n\nBut there was a time when the Puranas were esoteric works, and so they are still for the Initiates who can read them with the key that is in their possession.\n\nWhether the Brahmin Initiates will ever give out the full meaning of these allegories, is a question with which the writer is not concerned.\n\nThe present object is to show that, while honouring the creative Powers in their multiple forms, no philosopher could, or ever has, accepted the allegory for the true Spirit, except, perhaps, some philosophers belonging to the present \"superior and civilized\" Christian races.\n\nFor, as shown, Jehovah is not one whit the superior of Vishnu on the plane of ethics.\n\nThis is why the Occultists and even some Kabalists, whether they regard or not those creative Forces as living and conscious Entities -- and one does not see why they should not be so accepted -- will never confuse the C AUSE with the effect, and accept the Spirit of the Earth for Parabrahm or Ain-Soph.\n\nAt all events they know well the true nature of what was called Father-AEther by the Greeks, Jupiter-Titan, etc., etc.\n\nThey know that the soul of the A STRAL L IGHT is divine, and [[Footnote(s)]] ------------------------------------------------- * Wilson's opinion that the \"Vishnu Purana\" is a production of our era , and that in its present form it is not earlier than between the VIIIth and the XVIIth (!!) century, is absurd beyond noticing.\n\n[[Vol.\n\n1, Page]] 424 THE SECRET DOCTRINE.\n\nits body (the light-waves on the lower planes) infernal.\n\nThis Light is symbolized by the \"Magic Head\" in the Zohar , the double Face on the double Pyramid: the black pyramid rising against a pure white ground, with a white head and face within its black triangle; the white pyramid, inverted -- the reflection of the first in the dark waters, showing the black reflection of the white face .\n\n.\n\n.\n\n.\n\n.\n\nThis is the \"Astral Light,\" or D EMON EST D EUS I NVERSUS.\n\n-------------- [[This page continued in next section]]"


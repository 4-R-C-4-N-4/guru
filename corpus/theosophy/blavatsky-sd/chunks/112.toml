[content]
body = "These \"Father and Son\" were interchangeable in their functions and worked harmoniously together in their effects upon terrestrial nature and humanity; hence they were regarded as ONE, though TWO in personified Entities.\n\nThey were both males, and both had their distinct and also collaborative work in the causative generation of Humanity.\n\nSo much from the astronomical and cosmic standpoints viewed and expressed in symbolical language -- which became in our last races theological and dogmatic.\n\nBut behind this veil of Cosmic and Astrological symbols, there were the Occult mysteries of Anthropography and the primeval genesis of man.\n\nAnd in this, no knowledge of symbols -- or even the key to the post-diluvian symbolical language of the Jews -- will, or can help, save only with reference to that which was laid down in national scriptures for exoteric uses; the sum of which, however cleverly veiled, was only the smallest portion of the real primitive history of each people, often relating, moreover, -- as in the Hebrew Scriptures -- merely to the terrestrial human, not divine life of that nation.\n\nThat psychic and spiritual element belonged to MYSTERY and INITIATION.\n\nThere were things never recorded in scrolls, but, as in Central Asia, on rocks and in subterranean crypts.\n\nNevertheless, there was a time when the whole world was \"of one lip and of one knowledge,\" and Man knew more of his origin than he does now, and thus knew that the Sun and Moon, however large a part they do play in the constitution, growth and development of the human body, were not the direct causative agents of his appearance on Earth; [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] conjunctions that regulate conceptions, and every astrologer in India knows it.\n\nDuring the previous and the present races, at least at the beginning of this one, those who indulged in marital relations during certain lunar phases that made those relations sterile were regarded as sorcerers and sinners.\n\nBut even now those sins of old, based on the Occult knowledge and the abuse of it, would appear preferable to the crimes of to-day, which are perpetrated because of the complete ignorance of, and disbelief in all such occult influences.\n\n[[Vol.\n\n1, Page]] 230 THE SECRET DOCTRINE.\n\nthese agents being, in truth, the living and intelligent Powers which the Occultists call Dhyan Chohans.\n\nAs to this, a very learned admirer of the Jewish Esotericism tells us that \"the Kabala says expressly that Elohim is a ' general abstraction ' ; what we call in mathematics 'a constant co-efficient' or a 'general function' entering into all construction, not particular; that is, by the general ratio 1 to 31415, (the astro-Dhyanic and) Elohistic figures.\" To this the Eastern Occultist replies: Quite so, it is an abstraction to our physical senses.\n\nTo our spiritual perceptions, however, and to our inner spiritual eye, the Elohim or Dhyanis are no more an abstraction than our soul and spirit are to us.\n\nReject the one and you reject the other -- since that which is the surviving Entity in us is partly the direct emanation from, and partly those celestial Entities themselves.\n\nOne thing is sure; the Jews were perfectly acquainted with sorcery and various maleficent forces; but, with the exception of some of their great prophets and seers like Daniel and Ezekiel (Enoch belonging to a far distant race and not to any nation but to all, as a generic character), they knew little of, nor would they deal with, the real divine Occultism, their national character being averse to anything which had no direct bearing upon their own ethnical, tribal, and individual benefits -- witness their own prophets, and the curses thundered by them against the \"stiff-necked race.\" But even the Kabala plainly shows the direct relation between the Sephiroth, or Elohim, and men.\n\nTherefore, when it is proved to us that the Kabalistic identification of Jehovah with Binah, a female Sephiroth, has still another, a sub-occult meaning in it, then and then only the Occultist will be ready to pass the palm of perfection to the Kabalist.\n\nUntil then, it is asserted that, as Jehovah is in the abstract sense of a \"one living God,\" a single number, a metaphysical figment, and a reality only when put in his proper place as an emanation and a Sephiroth -- we have a right to maintain that the Zohar (as witnessed by the B OOK OF N UMBERS, at any rate), gave out originally, before the Christian Kabalists had disfigured it, and still gives out the same doctrine that we do; i.e.\n\n, it makes Man emanate, not from one Celestial M AN, but from a Septenary group of Celestial men or Angels, just as in \"Pymander, the Thought Divine.\" [[Vol.\n\n1, Page]] 231 THE DIFFERENTIATION OF THE \"ONE.\" STANZA VII.\n\n-- Continued.\n\n(3) W HEN THE ONE BECOMES TWO -- THE \"THREE-FOLD\" APPEARS ( a ).\n\nT HE THREE ARE ( linked into ) ONE; AND IT IS OUR THREAD, O L ANOO, THE HEART OF THE MAN-PLANT, CALLED S APTAPARNA ( b ).\n\n( a ) \"When the ONE becomes two, the three-fold appears\": to wit, when the One Eternal drops its reflection into the region of Manifestation, that reflection, \"the Ray,\" differentiates the \"Water of Space\"; or, in the words of the \"Book of the Dead\"; \"Chaos ceases, through the effulgence of the Ray of Primordial light dissipating total darkness by the help of the great magic power of the WORD of the (Central) Sun.\" Chaos becomes male-female, and Water, incubated through Light, and the \"three-fold being issues as its First-born.\" \"Osiris-Ptah (or RA) creates his own limbs (like Brahma) by creating the gods destined to personify his phases\" during the Cycle (xvii., 4).\n\nThe Egyptian Ra, issuing from the DEEP, is the Divine Universal Soul in its manifested aspect, and so is Narayana, the Purusha, \" concealed in Akasa and present in Ether.\n\n\" This is the metaphysical explanation, and refers to the very beginning of Evolution, or, as we should rather say, of Theogony.\n\nThe meaning of the Stanza when explained from another standpoint in its reference to the mystery of man and his origin, is still more difficult to comprehend."


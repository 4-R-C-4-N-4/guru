body = "2, Page]] 147 AGREEMENT OF DATES.\n\non Globe A in the First Round; ( b ) as the \" seed of life\" on Globe D in the Fourth Round; and ( c ) as the \"Seed of Man\" at the beginning of every Root-Race -- in our Fifth Race especially.\n\nThe very commencement of the latter witnesses, during the Dvapara Yuga,* the destruction of the accursed sorcerers; \"of that island (Plato speaking only of its last island) beyond the Pillars of Hercules, in the Atlantic Ocean, from which there was an easy transition to other islands in the neighbourhood of another large Continent \" (America).\n\nIt is this \"Atlantic\" land which was connected with the \" White Island, \" and this White Island was Ruta; but it was not the Atala and the \"White Devil \" of Colonel Wilford ( see \"Asiatic Researches,\" Vol.\n\nVIII., p.\n\n280), as already shown.\n\nIt may well be remarked here that the Dvapara Yuga lasts 864,000 years, according to the Sanskrit texts; and that, if the Kali Yuga began only about 5,000 years ago, that it is just 869,000 since that destruction took place.\n\nAgain, these figures are not very widely different from those given by the geologists, who place their \"glacial period\" 850,000 years ago.\n\nThen \"a woman was produced who came to Manu and declared herself his daughter, with whom he lived and begat the offspring of Manu .\" This refers to the physiological transformation of sexes during the Third Root-Race.\n\nAnd the allegory is too transparently clear to need much explanation.\n\nOf course, as already remarked, in the separation of sexes an androgyne being was supposed to divide his body into two halves (as in the case of Brahma and Vach, and even of Adam and Eve), and thus the female is, in a certain sense, his daughter, just as he will be her son, \"the flesh of his (and her) flesh and the bone of his (and her) bone.\" Let it be also well remembered that not one of our Orientalists have yet learned to discern in those \"contradictions and amazing nonsense,\" as some call the Puranas, that a reference to a Yuga may mean a Round, a Root-Race, and often a Sub-Race, as well as form a page torn out of pre-cosmic theogony.\n\nThis double and triple meaning is proved by various references to one and the same individual apparently, under an identical name, while it refers, in fact, to events divided by entire Kalpas.\n\nA good instance is that of Ila.\n\nShe is first represented as one thing and then as another.\n\nIn the exoteric legends it is said that Manu Vaivasvata, desiring to create sons, instituted a sacrifice to Mitra and Varuna; but, through a mistake of the officiating [[Footnote(s)]] ------------------------------------------------- * The Dvapara Yuga differs for each Race.\n\nAll races have their own cycles, which fact causes a great difference.\n\nFor instance, the Fourth Sub-Race of the Atlanteans was in its Kali-Yug, when destroyed, whereas the Fifth was in its Satya or Krita Yuga.\n\nThe Aryan Race is now in its Kali Yuga, and will continue to be in it for 427,000 years longer, while various \"family Races,\" called the Semitic, Hamitic, etc., are in their own special cycles.\n\nThe forthcoming 6th Sub Race -- which may begin very soon -- will be in its Satya (golden) age while we reap the fruit of our iniquity in our Kali Yuga.\n\n[[Vol.\n\n2, Page]] 148 THE SECRET DOCTRINE.\n\nBrahman, a daughter only was obtained -- Ila.\n\nThen, \"through the favour of the gods,\" her sex is changed and she becomes a man, Su-dyumna.\n\nThen she is again turned into a woman, and so on; the fable adding that Siva and his consort were pleased that \"she would be male one month and female another.\" This has a direct reference to the Third Root-Race, whose men were androgynes.\n\nBut some very learned Orientalists think ( see \" Hindu Classical Dictionary \") and have declared that \"Ila was primarily food, nourishment, or a libation of milk; thence a stream of praise, personified as the goddess of speech.\" The \"profane\" are not told, however, the reason why \"a libation of milk,\" or \"a stream of praise,\" should be male and female by turn: unless, indeed there is some \"internal evidence\" which the occultists fail to perceive.\n\nIn their most mystical meanings, the union of Swayambhuva Manu with Vach-Sata-Rupa, his own daughter (this being the first \"euhemerization\" of the dual principle of which Vaivasvata Manu and Ila are a secondary and a third form), stands in Cosmic symbolism as the Root-life, the germ from which spring all the Solar Systems, the worlds, angels and the gods.\n\nFor, as says Vishnu: -- \"From Manu all creation, gods, Asuras, man must be produced, By him the world must be created, that which moves and moveth not.\n\n.\n\n.\n\n.\n\n.\" But we may find worse opponents than even the Western Scientists and Orientalists.\n\nIf, on the question of figures, Brahmins may agree with our teaching, we are not so sure that some of them, orthodox conservatives, may not raise objections to the modes of procreation attributed to their Pitar Devatas.\n\nWe shall be called upon to produce the works from which we quote, while they will be invited by us to read their own Puranas a little more carefully and with an eye to the esoteric meaning.\n\nAnd then, we repeat again, they will find, under the veil of more or less transparent allegories, every statement made herein corroborated by their own works.\n\nOne or two instances have already been given as regards the appearance of the Second Race, which is called the \"Sweat-Born.\" This allegory is regarded as a fairy-tale, and yet it conceals a psycho-physiological phenomenon, and one of the greatest mysteries of Nature.\n\nBut in view of the chronological statements made herein, it is natural to ask: -- C OULD M EN E XIST 18,000,000 Y EARS A GO?\n\nTo this Occultism answers in the affirmative, notwithstanding all scientific objectors.\n\nMoreover, this duration covers only the Vaivasvata-Manu Man, i.e., the male and female entity already separated into [[Vol.\n\n2, Page]] 149 HOW OLD IS HUMANITY?\n\ndistinct sexes.\n\nThe two and a half Races that preceded that event may have lived 300,000,000 years ago for all that science can tell.\n\nFor the geological and physical difficulties in the way of the theory could not exist for the primeval, ethereal man of the Occult teachings."


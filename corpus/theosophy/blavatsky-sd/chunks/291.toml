body = "This is [[Footnote(s)]] ------------------------------------------------- * \" Five Years of Theosophy ,\" pp.\n\n249-50 .\n\nArt.\n\n\" Do the Adepts deny the Nebular Theory?\n\n\" [[Vol.\n\n1, Page]] 595 WHAT ARE THE NEBULAE?\n\nwhither the nebular theory has led Science.\n\nIn sober fact and truth this theory is twin sister to that of Ether, and both are the offsprings of necessity; one as indispensable to account for the transmission of light, as the other to explain the problem of the origin of the solar systems.\n\nThe question with them is, how the same homogeneous matter* could, obeying the laws of Newton, give birth to bodies -- sun, planets, and their satellites -- subject to conditions of identity of motion and formed of such heterogeneous elements.\n\nHas the nebular theory helped to solve the problem, even if applied solely to bodies considered as inanimate and material?\n\nWe say most decidedly not.\n\nWhat progress has it made since 1811, when Sir W.\n\nHerschell's paper, first presenting facts based on observation and showing the existence of nebular matter, made the \"Sons\" of the Royal Society \"shout for joy\"?\n\nSince then a still greater discovery has permitted, through spectrum analysis, the verification and corroboration of Sir W.\n\nHerschell's conjecture.\n\nLaplace demanded some kind of primitive \"world stuff \" to prove the idea of progressive world-evolution and growth.\n\nHere it is, as offered two millenniums ago.\n\nThe \"world stuff,\" now nebulae , was known from the highest antiquity.\n\nAnaxagoras taught that, having differentiated, the subsequent commixture of heterogeneous substances remained motionless and unorganized, until finally \"the Mind\" -- the collective body of Dhyan Chohans, we say -- began to work upon and communicated to it motion and order ( Aristotle ' s \" Physica ,\" viii , 1 .\n\n) The theory is now taken up in its first portion, that of any \"Mind\" interfering with it being rejected.\n\nSpectrum analysis reveals the existence of nebulae formed entirely of gases and luminous vapours.\n\nIs this the primitive nebular matter?\n\nThe spectra reveal, it is said, the physical conditions of the matter which emits cosmic light.\n\nThe spectra of the resolvable and the irresolvable nebulae are shown to be entirely different, the spectra of the latter showing their physical state to be that of glowing gas or vapour.\n\nThe bright lines of one nebula reveal the existence of hydrogen in it, and of other material substances known and unknown.\n\nThe same in the atmospheres of the Sun and stars.\n\nThis leads to the direct inference that a star is formed by the condensation of a nebula; hence that even the metals themselves on earth are [[Footnote(s)]] ------------------------------------------------- * Had astronomers held simply, in their present state of knowledge, to the hypothesis of Laplace, which was simply the formation of the planetary system, it might in time have resulted in something like an approximate truth.\n\nBut the two parts of the general problem, that of the formation of the universe, or the formation of the suns and stars from the primitive matter, and then the development of the planets around their sun, rest on quite different facts in nature and are even so viewed by Science itself.\n\nThey are at the opposite poles of being.\n\n[[Vol.\n\n1, Page]] 596 THE SECRET DOCTRINE.\n\nformed owing to the condensation of hydrogen or some other primitive matter, some ancestral cousin to \"helium,\" perhaps, or some yet unknown stuff?\n\nThis does not clash with the occult teachings.\n\nAnd this is the problem that chemistry is trying to solve; and it must succeed sooner or later in the task, accepting nolens volens , when it does, the esoteric teaching.\n\nBut when this does happen, it will kill the nebular theory as it now stands.\n\nMeanwhile Astronomy cannot accept in any way, if it is to be regarded as an exact science, the present theory of the filiation of stars -- even if occultism does so in its own way, as it explains this filiation differently -- because astronomy has not one single physical datum to show for it.\n\nAstronomy could anticipate Chemistry in proving the existence of the fact, if it could show a planetary nebula exhibiting a spectrum of three or four bright lines, gradually condensing and transforming into a star, with a spectrum all covered with a number of dark lines.\n\nBut \"the question of the variability of the nebula, even as to their form, is yet one of the mysteries of Astronomy.\n\nThe data of observation possessed so far are of too recent an origin, too uncertain to permit us to affirm anything .\n\n\" ( Cosmogonical Hypotheses of Wolf.\n\n) Since the discovery of the spectroscope, its magic power has revealed to its adepts only one single transformation of a star of this kind; and even that one showed directly the reverse of what is needed as proof in favour of the nebular theory; namely -- a star transforming itself into a planetary nebula.\n\nAs told in The Observatory ( Vol.\n\nI.\n\n, p.\n\n185), the temporary star which appeared in the constellation Cygnus, in November, 1876, discovered by J.\n\nF.\n\nJ.\n\nSchmidt, exhibited a spectrum broken by very brilliant lines.\n\nGradually, the continuous spectrum and most of the lines disappeared, leaving finally one single brilliant line, which appeared to coincide with the green line of the nebula.\n\nThough this metamorphosis is not irreconcileable with the hypothesis of the nebular origin of the stars, nevertheless this single solitary case rests on no observation whatever, least of all on direct observation.\n\nThe occurrence may have been due to several other causes.\n\nSince astronomers are inclined to think our planets are tending toward precipitation on the Sun, why should not that star have blazed out owing to a collision of such precipitated planets, or, as many suggest, the appulse of a comet?\n\nAnyhow, the only known instance of a star transformation since 1811 is not favourable to the nebular theory.\n\nMoreover, on the question of this theory, as in all others, astronomers disagree.\n\nIn our own age, it was Buffon, before Laplace ever thought of it, who, very much struck by the identity of motion in the planets, was the first to propose the hypothesis of the planets and their satellites originating in [[Vol.\n\n1, Page]] 597 THE META-ELEMENTS OF PHYSICAL SCIENCE.\n\nthe bosom of the Sun.\n\nForthwith, and for the purpose, he invented a special comet, supposed to have torn out, by a powerful oblique blow, the quantity of matter necessary to their formation.\n\nLaplace gave its dues to the \"comet\" in his \" Exposition du Systeme du Monde.\n\n\" (Note VII.) But the idea was seized and even improved upon by a conception of the alternate evolution from the Sun's central mass of planets apparently without weight or influence on the motion of the visible planets -- and as evidently without any more existence than the likeness of Moses in the moon.\n\nBut the modern theory is also a variation on the systems elaborated by Kant and Laplace."


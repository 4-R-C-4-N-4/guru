body = "In the Zohar we read as follows: -- \"As Moses was keeping a vigil on Mount Sinai, in company with the deity, who was concealed from his sight by a cloud, he felt a great fear overcome him, and suddenly asked: 'Lord, where art thou .\n\n.\n\n.\n\n.\n\nsleepest thou, O Lord?\n\n.\n\n.\n\n.' And the Spirit answered him: 'I never sleep: were I to fall asleep for a moment BEFORE MY TIME, all the creation would crumble into dissolution in one instant.' \" \" Before my time \" is very suggestive.\n\nIt shows the God of Moses to be only a temporary substitute, like Brahma the male, a substitute and an aspect of THAT which is immutable, and which therefore can take no part in the \"days,\" or in the \"nights,\" nor have any concern whatever with reaction or dissolution.\n\nWhile the Eastern Occultists have seven modes of interpretation, the Jews have only four -- namely, the real-mystical; the allegorical; the moral; and the literal or Pashut.\n\nThe latter is the key of the exoteric Churches and not worth discussion.\n\nRead in the first, or mystical key, here are several sentences which show the identity of the foundations of construction in every Scripture.\n\nIt is given in Mr.\n\nT.\n\nMyer's excellent book on the Kabalistic works he seems to have well studied.\n\nI quote verbatim.\n\n\" B ' raisheeth barah elohim ath hash ama yem v ' ath haa ' retz -- i.e.\n\n, 'In the beginning the God(s) created the heavens and the earth;\" (the meaning of which is:) the six Sephiroth of Construction,* over which B'raisheeth stands, all belong Below.\n\nIt created six (and) on these stand all Things.\n\nAnd those depend upon the seven forms of the Cranium up to the Dignity of all Dignities.\n\nAnd the second 'Earth' does not come into calculation, therefore it has been said: 'And from it (that Earth) which underwent the curse, came it forth.' .\n\n.\n\n.\n\n.\n\n'It (the Earth) was without form and void; and darkness was over the face of the Abyss, and the Spirit of elohim .\n\n.\n\n.\n\n.\n\nwas breathing ( me ' racha ' phath ) -- i.e.\n\n, hovering, brooding over, moving.\n\n.\n\n.\n\n.\n\n.\n\nThirteen depend on thirteen [[Footnote(s)]] ------------------------------------------------- * The \"Builders\" of the Stanzas.\n\n[[Vol.\n\n1, Page]] 375 ARCHAIC SYMBOLISM.\n\n(forms) of the most worthy Dignity.\n\nSix thousand years hang (are referred to) in the first six words.\n\nThe seventh (thousand, the millennium) above it (the cursed Earth) is that which is strong by Itself.\n\nAnd it was rendered entirely desolate during twelve hours (one .\n\n.\n\n.\n\n.\n\nDay) as is written.\n\n.\n\n.\n\n.\n\n.\n\nIn the thirteenth, It (the Deity) shall restore all .\n\n.\n\n.\n\n.\n\nand everything shall be renewed as before; and all those six shall continue .\n\n.\n\n.\n\n.\n\netc .\n\n\" ( Qabbalah , p.\n\n233, from Siphrah Dzeniuta , c.\n\ni., § 16, s .\n\n9.) The \"Sephiroth of Construction\" are the six Dhyan Chohans, or Manus, or Prajapati, synthesized by the seventh \"B'raisheeth (the First Emanation or Logos ), and who are called, therefore, the Builders of the Lower or physical Universe\" all belong Below.\n\nThese six whose essence is of the Seventh -- are the Upadhi , the base or fundamental stone on which the objective Universe is built, the noumenoi of all things.\n\nHence they are, at the same time, the Forces of nature, the Seven Angels of the Presence, the sixth and seventh principles in man; the spirito-psycho-physical spheres of the Septenary chain, the Root Races, etc., etc.\n\nThey all \"depend upon the Seven forms of the Cranium\" up to the highest.\n\nThe \" second Earth\" \"does not come into calculation\" because it is no Earth , but the Chaos or Abyss of Space in which rested the paradigmatic, or model universe in ideation of the OVER-SOUL brooding over it.\n\nThe term \"Curse\" is here very misleading, for it means simply doom or destiny , or that fatality which sent it forth into the objective state.\n\nThis is shown by that \"Earth\" under the \"Curse\" being described as \"without form and void,\" in whose abysmal depths the \"Breath\" of the Elohim (collective Logoi) produced or photographed the first divine I DEATION of the things to be.\n\nThis process is repeated after every Pralaya before the beginnings of a new Manvantara, or period of sentient individual being.\n\n\"Thirteen depend on thirteen forms,\" refers to the thirteen periods personified by the thirteen Manus, with Swayambhuva the fourteenth (13, instead of 14, being an additional veil ): those fourteen Manus who reign within the term of a Mahayuga, a \"Day\" of Brahma.\n\nThese (thirteen-fourteen) of the objective Universe depend on the thirteen (fourteen) paradigmatic , ideal forms.\n\nThe meaning of the \"Six thousand years \" which \"hang in the first six words,\" has again to be sought in the Indian Wisdom.\n\nThey refer to the primordial six (seven) \"Kings of Edom\" who typify the worlds (or spheres) of our chain during the first Round, as well as the primordial men of this Round.\n\nThey are the septenary pre - Adamic (or before the Third, Separated Race) first Root-race.\n\nAs they were shadows , and senseless (they had not eaten yet of the fruit of the Tree of Knowledge), they could not see the [[Vol.\n\n1, Page]] 376 THE SECRET DOCTRINE.\n\nParguphim , or \"Face could not see Face\" (primeval men were unconscious), \"therefore, the primordial (seven) Kings died,\" i.e.\n\n, were destroyed ( vide Sepherah Djenioutha ) .\n\nNow, who are they?\n\nThey are the Kings who are \"the Seven Rishis, certain (secondary) divinities, Sakra (Indra), Manu, and the Kings his Sons, who are created and perish at one period ,\" as said in Vishnu Purana (Book I.\n\nchap.\n\niii.).\n\nFor the seventh (\"thousand\") ( not the millennium of exoteric Christianity , but that of Anthropogenesis ) represents both the \"seventh period of creation,\" that of physical man (Vishnu Purana), and the seventh Principle -- both macrocosmic and microcosmic, -- as also the pralaya after the Seventh period, the \"Night\" which has the same duration as the \"Day\" of Brahma."


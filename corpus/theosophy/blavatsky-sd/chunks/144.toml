body = "the races, human and animal, are as fully treated here as the writer is able to treat them.\n\nThe proofs brought forward in corroboration of the old teachings are scattered widely throughout the old scriptures of ancient civilizations.\n\nThe Puranas, the Zendavesta, and the old classics are full of them; but no one has ever gone to the trouble of collecting and collating together those facts.\n\nThe reason for this is, that all such events were recorded symbolically; and that the best scholars, the most acute minds, among our Aryanists and Egyptologists, have been too often darkened by one or another preconception; still oftener, by one-sided views of the secret meaning.\n\nYet even a parable is a spoken symbol: a fiction or a fable, as some think; an allegorical representation, we say, of life-realities, events, and facts.\n\nAnd, as a moral was ever drawn from a parable, that moral being an actual truth and fact in human life, so an historical, real event was deduced -- by those versed in the hieratic sciences -- from certain emblems and symbols recorded in the ancient archives of the temples.\n\nThe religious and esoteric history of every nation was embedded in symbols; it was never expressed in so many words.\n\nAll the thoughts and emotions, all the learning and knowledge, revealed and acquired, of the early races, found their pictorial expression in allegory and parable.\n\nWhy?\n\nBecause the spoken word has a potency unknown to , unsuspected and disbelieved in , by the modern \"sages.\" Because sound and rhythm are closely related to the four Elements of the Ancients; and because such or another vibration in the air is sure to awaken corresponding powers, union with which produces good or bad results, as the case may be.\n\nNo student was ever allowed to recite historical, religious, or any real events in so many unmistakable words, lest the powers connected with the event should be once more attracted.\n\nSuch events were narrated only during the Initiation, and every student had to record them in corresponding symbols, drawn out of his own mind and examined later by his master, before they were finally accepted.\n\nThus was created in time the Chinese Alphabet, as, before that, the hieratic symbols were fixed upon in old Egypt.\n\nIn the Chinese language, the alphabet of which may be read in any language,* and which is only a little less ancient than the Egyptian alphabet of Thoth, every word has its corresponding symbol conveying the word needed in a pictorial form.\n\nThe language possesses many thousands of such symbol letters, or logograms, each meaning a whole word; for letters proper, or an alphabet, do not exist in the Chinese language any more than they did in the Egyptian till a far later period.\n\n[[Footnote(s)]] ------------------------------------------------- * Thus, a Japanese who does not understand one word of Chinese, meeting with a Chinaman who has never heard the language of the former, will communicate in writing with him, and they will understand each other perfectly -- because the writing is symbolical.\n\n[[Vol.\n\n1, Page]] 308 THE SECRET DOCTRINE.\n\nThe explanation of the chief symbols and emblems is now attempted, as Book II., which treats of Anthropogenesis, would be most difficult to understand without a preparatory acquaintance with the metaphysical symbols at least.\n\nNor would it be just to enter upon an esoteric reading of symbolism without giving due honour to one who has rendered it the greatest service in this century, by discovering the chief key to ancient Hebrew symbology, interwoven strongly with metrology, one of the keys to the once universal mystery language.\n\nMr.\n\nRalston Skinner, of Cincinnati, the author of \"The Hebrew-Egyptian Mystery and the Source of Measures\" has our thanks.\n\nA mystic and a Kabalist by nature, he has laboured for many years in this direction, and his efforts were certainly crowned with great success.\n\nIn his own words: -- \"The writer is quite certain that there was an ancient language which modernly and up to this time appears to have been lost, the vestiges of which, however, abundantly exist.\n\n.\n\n.\n\n.\n\nThe author discovered that this (integral ratio in numbers of diameter to circumference of a circle) geometrical ratio was the very ancient, and probably the divine origin of linear measures.\n\n.\n\n.\n\n.\n\nIt appears almost proven that the same system of geometry, numbers, ratio, and measures were known and made use of on the continent of North America, even prior to the knowledge of the same by the descending Semites.\n\n.\n\n.\n\n.\n\n.\" \"The peculiarity of this language was that it could be contained in another, concealed and not to be perceived, save through the help of special instruction; letters and syllabic signs possessing at the same time the powers or meaning of numbers, of geometrical shapes, pictures, or ideographs and symbols, the designed scope of which would be determinatively helped out by parables in the shape of narratives or parts of narratives; while also it could be set forth separately, independently, and variously, by pictures, in stone work, or in earth construction.\" \"To clear up an ambiguity as to the term language: Primarily the word means the expression of ideas by human speech; but, secondarily, it may mean the expression of ideas by any other instrumentality.\n\nThis old language is so composed in the Hebrew text, that by the use of the written characters, which will be the language first defined, a distinctly separated series of ideas may be intentionally communicated, other than those ideas expressed by the reading of the sound signs.\n\nThis secondary language sets forth, under a veil, series of ideas, copies in imagination of things sensible, which may be pictured, and of things which may be classed as real without being sensible; as, for instance, the number 9 may be taken as a reality, though it has no sensible existence, so also a revolution of the moon, as separate from the moon itself by which that revolution has been made, may be taken as giving rise to, or causing a real idea, though such a revolution has no substance.\n\nThis idea-language may consist of symbols restricted to arbitrary terms and signs, having a very limited range of conceptions, and quite valueless, or it may be a reading of nature in some of her manifestations of a value almost immeasurable, as regards human civilization.\n\nA picture of something natural may give rise to ideas of co-ordina- [[Vol.\n\n1, Page]] 309 MYSTERY LANGUAGE.\n\ntive subject-matter, radiating out in various and even opposing directions, like the spokes of a wheel, and producing natural realities in departments very foreign to the apparent tendency of the reading of the first or starting picture.\n\nNotion may give rise to connected notion, but if it does, then, however apparently incongruous, all resulting ideas must spring from the original picture and be harmonically connected, or related.\n\n.\n\n.\n\n.\n\nThus with a pictured idea radical enough, the imagination of the Cosmos itself even in its details of construction might result."


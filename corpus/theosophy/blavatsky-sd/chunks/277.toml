body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n1 [[Vol.\n\n1, Page]] 566 THE SECRET DOCTRINE.\n\n[[This page continued from previous section ]] XI.\n\nON THE ELEMENTS AND ATOMS.\n\nFROM THE STAND-POINT OF SCIENCE AND THAT OF OCCULTISM.\n\nW HEN the Occultist speaks of \"Elements,\" and of human Beings who lived during those geological ages, the duration of which it is found as impossible to determine, according to the opinion of one of the best [[Vol.\n\n1, Page]] 567 METAPHYSICAL CHEMISTRY.\n\nEnglish geologists*, as the nature of matter, it is because he knows what he is talking about.\n\nWhen he says \"Man\" and Elements, he neither means \"man\" in his present physiological and anthropological form, nor the elemental atoms, those hypothetical conceptions, the entitative abstractions of matter in its highly attenuated state, as existing at present in scientific minds; nor, again, the compound Elements of antiquity.\n\nIn Occultism the word Element means \"rudiment\" in every case.\n\nWhen we say \"Elementary Man,\" we mean either the proemial, incipient sketch of man, in its unfinished and undeveloped condition, hence in that form which now lies latent in physical man during his life-time, and takes shape only occasionally and under certain conditions; or that form which for a time survives the material body, and which is better known as an \"Elementary.\"** With regard to \"Element,\" when the term is used metaphysically, it means, in distinction to the mortal, the incipient divine man; and, in its physical usage, inchoate matter in its first undifferentiated condition, or in the laya state, which is the eternal and the normal condition of substance, differentiating only periodically, and is during that differentiation in an abnormal state -- in other words, a transitory illusion of the senses.\n\nAs to the \"elemental atoms,\" so called, the Occultists refer to them by that name with a meaning analogous to that which is given by the Hindu to Brahma when he calls him A NU, the \"Atom.\" Every elemental atom , in search of which more than one Chemist has followed the path indicated by the Alchemists, is, in their firm belief (when not knowledge ), a SOUL; not necessarily a disembodied soul, but a jiva , as the Hindus call it, a centre of POTENTIAL VITALITY, with latent intelligence in it, and, in the case of compound Souls -- an intelligent active EXISTENCE, from the highest to the lowest order, a form composed of more or less differentiations.\n\nIt requires a metaphysician -- and an Eastern metaphysician -- to understand our meaning.\n\nAll those atom-Souls are differentiations from the ONE, and in the same relation to it as the divine Soul -- the Buddhi -- to its informing and inseparable Spirit, or Atman.\n\nModern physics, while borrowing from the ancients their atomic theory, forgot one point, the most important of the doctrine; hence they got only the husks and will never be able to get at the kernel.\n\nThey left behind, in the adoption of physical atoms, the suggestive fact that [[Footnote(s)]] ------------------------------------------------- * In answer to a friend, that eminent geologist writes: .\n\n.\n\n.\n\n.\"I can only say, in reply to your letter, that it is at present, and perhaps always will be, IMPOSSIBLE to reduce, even approximately, geological time into years, or even into millenniums.\" (Signed William Pengelly, F.R.S.) ** Plato speaking of the irrational, turbulent Elements \"composed of fire, air, water, and earth,\" means Elementary Daemons.\n\n(See Timaeus.\n\n) [[Vol.\n\n1, Page]] 568 THE SECRET DOCTRINE.\n\nfrom Anaxagoras down to Epicurus, the Roman Lucretius, and finally even to Galileo, all those Philosophers believed more or less in ANIMATED atoms, not in invisible specks of so-called \"brute\" matter.\n\nRotatory motion was generated in their views, by larger (read, more divine and pure) atoms forcing downwards other atoms; the lighter ones being thrust simultaneously upward.\n\nThe esoteric meaning of this is the ever cyclic curve downward and upward of differentiated elements through intercyclic phases of existence, until each reaches again its starting point or birthplace.\n\nThe idea was metaphysical as well as physical; the hidden interpretation embracing \"gods\" or souls, in the shape of atoms, as the causes of all the effects produced on Earth by the secretions from the divine bodies.* No ancient philosopher, not even the Jewish Kabalists, ever dissociated Spirit from matter or vice versa.\n\nEverything originated in the ONE, and, proceeding from the one, must finally return to the One.\n\n\"Light becomes heat, and consolidates into fiery particles; which, from being ignited, become cold, hard particles, round and smooth.\n\nAnd this is called Soul , imprisoned in its robe of matter;\"** Atoms and Souls having been synonymous in the language of the Initiates.\n\nThe \"whirling Souls,\" Gilgoolem , a doctrine in which so many learned Jews have believed ( See Mackenzie ' s Royal Masonic Cyclopaedia ), had no other meaning esoterically.\n\nThe learned Jewish Initiates never meant by the \"Promised land\" Palestine alone, but the same Nirvana as the learned Buddhist and Brahmin do -- the bosom of the E TERNAL O NE, symbolized by that of Abraham, and by Palestine as its substitute on Earth.*** The passage of the S OUL- A TOM \"through the Seven Planetary Chambers\" had the same metaphysical and also physical meaning.\n\nIt had the latter when it was said to dissolve into Ether ( See Isis Unveiled , Vol.\n\nI., p.\n\n297.) Even Epicurus, the model Atheist and materialist, knew and believed so much in the ancient Wisdom, that he taught that the [[Footnote(s)]] ------------------------------------------------- * Plato uses the words \" secretions \" of turbulent Elements (Timaeus).\n\n** Valentinus' Esoteric Treatise on the Doctrine of Gilgul .\n\n*** Surely no educated Jew ever believed the literal sense of this allegory -- namely, that \"the bodies of Jews deposited in foreign lands contain within them a principle of Soul which cannot rest, until by a process called the \"whirling of the Soul\" the immortal particle reaches once more the sacred Soil of the \"Promised land.\" The meaning is evident to an occultist.\n\nThe process was supposed to be accomplished by a kind of metempsychosis, the psychic spark being conveyed through bird, beast, fish, and the most minute insect.\n\n( See Royal Masonic Cyclo.\n\nMackenzie.\n\n) The Allegory relates to the atoms of the body , which have each to pass through every form before all reach the final state, which is the first starting point of the departure of every atom -- its primitive laya State.\n\nBut the primitive meaning of Gilgoolem , or \"Revolution of Souls,\" was the idea of the re-incarnating Souls or Egos."


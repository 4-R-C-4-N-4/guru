[content]
body = "As Aditi is called Surarani (the matrix or \"mother\" of the sura gods), so Kunti, the mother of the Pandavas, is called in Mahabharata Pandavarani -- which term is already physiologized.\n\nBut Devaki, the antetype of the Roman Catholic Madonna, is a later anthropomorphized form of Aditi.\n\nThe latter is the goddess mother, the \"Deva-matri\" of Seven Sons (the six and the seven Adityas of early Vedic times); the mother of Krishna, Devaki, has six embryos conveyed into her womb by Jagaddhatri (the \"nurse of the world\"), the seventh (Krishna, the Logos,) being transferred to that Rohini.\n\nMary, the mother of Jesus, is the mother of seven children, of five sons and two daughters, (a later transformation of sex) in Matthew's Gospel ( xiii.\n\n55-56).\n\nNo one of the worshippers of the Roman Catholic Virgin would object to reciting in her honour the prayer addressed by the gods to Devaki.\n\nLet the reader judge.\n\n\"Thou art that Prakriti (essence), infinite and subtile, which bore Brahma in its womb.\n\nThou eternal being, comprising in thy substance the essence of all created things, wast identical with creation; thou wast the parent of the triform sacrifice, becoming the germ of all.\n\n.\n\n.\n\n.\n\nThou art sacrifice, whence all fruit proceeds; thou art the arani whose attrition engenders fire\" .\n\n.\n\n.\n\n.\n\n(\"Womb of Light,\" \"holy Vessel,\" are the epithets of the Virgin).\n\n\"As Aditi, thou art the parent of the gods.\n\n.\n\n.\n\n.\n\nThou art Jyotsna (the morning twilight).\" The Virgin [[Vol.\n\n2, Page]] 528 THE SECRET DOCTRINE.\n\nis often addressed as the \"morning Star\" and the \"star of Salvation\" -- the light whence day is begotten.\n\n\"Thou art Samnati (humility, a daughter of Daksha), the mother of Wisdom; thou art Niti, the parent of harmony ( Naya ) ; thou art modesty, the progenitrix of affection ( Prasraya or vinaya ); thou art desire, of whom love is born.\n\n.\n\n.\n\n.\n\nThou art the mother of knowledge ( Avabodha ); patience ( Dhriti ) , the parent of fortitude ( Dhairya ) .\n\n.\n\n.\n\n.\n\netc., etc.\" Thus arani is shown here as the Roman Catholic \"vase of election\" and no worse.\n\nAs to its primitive meaning, it was purely metaphysical.\n\nNo unclean thought traversed these conceptions in the ancient mind.\n\nEven in the Zohar -- far less metaphysical than any other symbolism -- the idea is an abstraction and nothing more.\n\nThus, when the Zohar (iii., 290) says: \"All that which exists, all that which has been formed by the ancient, whose name is holy, can only exist through a male and female principle,\" it means no more than this: \"The divine Spirit of Life is ever coalescing with matter.\" It is the W ILL of the Deity that acts; and the idea is purely Schopenhauerian.\n\n\"When Atteekah Kaddosha, the ancient and the concealed of the concealed, desired to form all things, it formed all things like male and female.\n\nThis wisdom cornprises ALL when it goeth forth.\" Hence Chochmah (male wisdom) and Binah (female consciousness or Intellect) are said to create all between the two -- the active and the passive principles.\n\nAs the eye of the expert jeweller discerns under the rough and uncouth oyster shell the pure immaculate pearl, enshrined within its bosom, his hand dealing with the former but to get at its contents, so the eye of the true philosopher reads between the lines of the Puranas the sublime Vedic truths, and corrects the form with the help of the Vedantic wisdom.\n\nOur Orientalists, however, never perceive the pearl under the thick coating of the shell, and -- act accordingly.\n\nFrom all that has been said in this section, one sees clearly that, between the Serpent of Eden and the Devil of Christianity, there is an abyss.\n\nAlone the sledge hammer of ancient philosophy can kill this dogma.\n\n-------"


body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n1 [[Vol.\n\n1, Page]] 610 THE SECRET DOCTRINE.\n\n[[This page continued from previous section ]] § XV.\n\nGODS, MONADS, AND ATOMS.\n\nS OME years ago we remarked* that \"the Esoteric Doctrine may well be called the 'thread-doctrine,' since, like Sutratman , in the Vedanta philosophy,** it passes through and strings together all the ancient philosophical religious systems, and reconciles and explains them all.\" We say now it does more.\n\nIt not only reconciles the various and apparently conflicting systems, but it checks the discoveries of modern exact science, and shows some of them to be necessarily correct, since they are found corroborated in the ancient records.\n\nAll this will, no doubt, be regarded as terribly impertinent and disrespectful, a veritable crime of lese - Science; nevertheless, it is a fact.\n\nScience is, undeniably, ultra-materialistic in our days; but it finds, in one sense, its justification.\n\nNature behaving in actu ever esoterically, and being, as the Kabalists say, in abscondito , can only be judged by the profane through her appearance, and that appearance is always deceitful on the physical plane.\n\nOn the other hand, the naturalists refuse to blend physics with metaphysics, the body with its informing soul and spirit, which they prefer ignoring.\n\nThis is a matter of choice with some, while the minority strive very sensibly to enlarge the domain of physical science by trespassing on the forbidden grounds of metaphysics, so distasteful to some materialists.\n\nThese scientists are wise in their generation.\n\nFor all their wonderful discoveries would go for nothing, and remain for ever headless bodies, unless they lift the veil of matter and strain their eyes to see beyond.\n\nNow that they have studied nature in the length, breadth, and thickness of her physical frame, it is time to remove the skeleton to the second plane and search within the unknown depths for the living and real entity, for its SUB- stance -- the noumenon of evanescent matter.\n\n[[Footnote(s)]] ------------------------------------------------- * \"The Septenary Principle,\" art.\n\nin \"Five Years of Theosophy,\" p.\n\n197.\n\n** The Atman or Spirit (the Spiritual S ELF) passing like a thread through the five subtle bodies (or principles, Koshas ) is called \"thread-soul,\" or Sutratman in Vedantic philosophy.\n\n[[Vol.\n\n1, Page]] 611 WHICH OF THE TWO IS BLIND?\n\nIt is only by acting on such lines that some of the truths, now called \"exploded superstitions,\" will be discovered to be facts and the relics of ancient knowledge and wisdom.\n\nOne of such \"degrading\" beliefs -- in the opinion of the all-denying sceptic -- is found in the idea that Kosmos, besides its objective planetary inhabitants, its humanities in other inhabited worlds, is full of invisible, intelligent Existences.\n\nThe so-called Arch-Angels, Angels and Spirits, of the West, copies of their prototypes, the Dhyan-Chohans, the Devas and Pitris, of the East, are no real Beings but fictions.\n\nOn this point Materialistic Science is inexorable.\n\nTo support its position, it upsets its own axiomatic law of uniformity in the laws of nature, that of continuity, and all the logical sequence of analogies in the evolution of being.\n\nThe masses of the profane are asked, and made, to believe that the accumulated testimony of History, which shows even the Atheists of old -- such as Epicurus and Democritus -- believing in gods , was false; and that philosophers like Socrates and Plato, asserting their existence, were mistaken enthusiasts and fools.\n\nIf we hold our opinions merely on historical grounds, on the authority of legions of the most eminent Sages, Neo-Platonists, Mystics of all the ages, from Pythagoras down to the eminent Scientists and Professors of the present century, who, if they reject \"gods,\" believe in \"spirits,\" shall we consider such authorities as weak-minded and foolish as any Roman Catholic peasant, who believes in and prays to his once human Saint, or the Archangel, St.\n\nMichael?\n\nBut is there no difference between the belief of the peasant and that of the Western heirs to the Rosicrucians and Alchemists of the Middle Ages?\n\nIs it the Van Helmonts, the Khunraths, the Paracelsuses and Agrippas, from Roger Bacon down to St.\n\nGermain, who were all blind enthusiasts, hysteriacs or cheats, or is it the handful of modern sceptics -- the \"leaders of thought\" -- who are struck with the cecity of negation?\n\nThe latter, we opine.\n\nIt would be a miracle indeed, quite an abnormal fact in the realm of probabilities and logic, were that handful of negators to be the sole custodians of truth , while the million-strong hosts of believers in gods, angels, and spirits -- in Europe and America alone -- namely, Greek and Latin Christians, Theosophists, Spiritualists, Mystics, etc., etc., should be no better than deluded fanatics and hallucinated mediums, and often no higher than the victims of deceivers and impostors!\n\nHowever varying in their external presentations and dogmas, beliefs in the Hosts of invisible Intelligences of various grades have all the same foundation.\n\nTruth and error are mixed in all.\n\nThe exact extent, depth, breadth, and length of the mysteries of Nature are to be found only in Eastern esoteric sciences.\n\nSo vast and so profound are these that hardly a few, a very few of the highest Initiates -- those whose very existence is known but to a small number of [[Vol.\n\n1, Page]] 612 THE SECRET DOCTRINE.\n\nAdepts -- are capable of assimilating the knowledge.\n\nYet it is all there, and one by one facts and processes in Nature's workshops are permitted to find their way into the exact Sciences, while mysterious help is given to rare individuals in unravelling its arcana.\n\nIt is at the close of great Cycles, in connection with racial development, that such events generally take place.\n\nWe are at the very close of the cycle of 5,000 years of the present Aryan Kaliyuga; and between this time and 1897 there will be a large rent made in the Veil of Nature, and materialistic science will receive a death-blow.\n\nWithout throwing any discredit upon time-honoured beliefs, in whatever direction, we are forced to draw a marked line between blind faith, evolved by theologies, and knowledge due to the independent researches of long generations of adepts; between, in short, faith and philosophy.\n\nThere have been -- in all ages -- undeniably learned and good men who, having been reared in sectarian beliefs, died in their crystallized convictions.\n\nFor Protestants, the garden of Eden is the primeval point of departure in the drama of Humanity, and the solemn tragedy on the summit of Calvary, the prelude to the hoped-for Millennium."


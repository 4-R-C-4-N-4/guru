body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n2 [[Vol.\n\n2, Page]] 277 THE GIANTS.\n\nA RE G IANTS A F ICTION?\n\nHere, again, we come into collision with Science.\n\nThe latter denies, so far, that man has ever been much larger than the average of the tall and powerful men one meets with occasionally now.\n\nDr.\n\nHenry Gregor denounces such traditions as resting upon ill-digested facts.\n\nInstances of mistaken judgments are brought forward.\n\nThus, in 1613, in a locality called from time immemorial the \"Field of Giants\" in the Lower Dauphine (France, four miles from St.\n\nRomans) enormous bones were found deeply buried in the sandy soil.\n\nThey were attributed to human remains, and even to Teutobochus, the Teuton chief slain by Marius.\n\nBut Cuvier's later research proved them to be the fossil remains of the Dinotherium giganteum of the family of tapirs, 18 feet long.\n\nAncient buildings are pointed to as an evidence that our earliest ancestors were not much larger than we are, the entrance doors being of no larger size then than they are now.\n\nThe tallest man of antiquity known to us was the Roman Emperor Maximus, we are told, whose height was only seven and a half feet.\n\nNevertheless, in our modern day we see every year men taller than this.\n\nThe Hungarian who exhibited himself in the London Pavilion was nearly 9 feet high.\n\nIn America a giant was shown 9 1/2 feet tall; the Montenegrin Danilo was 8 feet 7 inches.\n\nIn Russia and Germany one often sees men in the lower classes above 7 feet.\n\nAnd as the ape-theorists are told by Mr.\n\nDarwin that the species of animals which result from cross breeding \"always betray a tendency to revert to the original type, \" they ought to apply the same law to men.\n\nHad there been no giants as a rule in ancient days, there would be none now.\n\nAll this applies only to the historic period.\n\nAnd if the skeletons of the prehistoric ages have failed so far (which is positively denied) to prove undeniably in the opinion of science the claim here advanced, it is but a question of time.\n\nMoreover, as already stated, human stature is little changed since the last racial cycle.\n\nThe Giants of old are all buried under the Oceans, and hundreds of thousands of years of constant friction by water would reduce to dust and pulverize a brazen, far more a human skeleton.\n\nBut whence the testimony of well-known classical writers, of philosophers and men who, otherwise, never had the reputation for lying?\n\nLet us bear in mind, furthermore, that before the year 1847, when Boucher de Perthes forced it upon the attention of Science, almost nothing was known of fossil man, for archaeology complacently ignored his existence.\n\nOf Giants who were \"in the earth in those days\" of old, the Bible alone had spoken to the wise men of the West, the Zodiac being the solitary witness called upon to corroborate the statement in the persons of Atlas or Orion, whose mighty shoulders are said to support the world.\n\n[[Vol.\n\n2, Page]] 278 THE SECRET DOCTRINE.\n\nNevertheless, even the \"Giants\" have not been left without their witnesses, and one may as well examine both sides of the question.\n\nThe three Sciences -- Geological, Sidereal and Scriptural (the latter in its Universal character) -- may furnish us with the needed proofs.\n\nTo begin with geology; it has already confessed that the older the excavated skeletons, the larger, taller and the more powerful their structure.\n\nThis is already a certain proof in hand.\n\n\"All those bones\" writes Frederic de Rougemont -- who, though believing too piously in Noah's ark and the Bible, is none the less a Scientific witness -- \"all those skeletons found in the Departments of the Gard, in Austria, Liege, etc., etc.\n\n.\n\n.\n\nthose skulls which remind all of the negro type.\n\n.\n\n.\n\nand which by reason of that type might be mistaken for animals, have all belonged to men of very high stature \" .\n\n.\n\n.\n\n(\" Histoire de la Terre, \" p.\n\n154) The same is repeated by Lartet, an authority, who attributes a tall stature to those who were submerged in the deluge (not necessarily \"Noah's\") and a smaller stature to the races which lived subsequently.\n\nAs for the evidence furnished by ancient writers, we need not stop at that of Tertullian, who assures us that in his day a number of giants were found at Carthage -- for, before his testimony can be accepted, his own identity* and actual existence would have to be proven.\n\nBut we may turn to the scientific journals of 1858, which spoke of a sarcophagus of giants found that year on the site of that same city.\n\nAs to the ancient pagan writers -- we have the evidence of Philostratus, who speaks of a giant skeleton twenty-two cubits long, as well as of another of twelve cubits, seen by himself at Sigeus.\n\nThis skeleton may perhaps not have belonged, as believed by Protesilaus, to the giant killed by Apollo at the siege of Troy; nevertheless, it was that of a giant, as well as that other one discovered by Messecrates of Stire, at Lemnos -- \"horrible to behold,\" according to Philostratus ( Heroica, p.\n\n35) .\n\nIs it possible that prejudice would carry Science so far as to class all these men as either fools or liars?\n\nPliny speaks of a giant in whom he thought he recognised Orion, the son of Ephialtes ( Nat.\n\nHist., vol.\n\nVII, ch.\n\nxvi.\n\n) .\n\nPlutarch declares that Sertorius saw the tomb of Antaeus, the giant; and Pausanias vouches for the actual existence of the tombs of Asterius and of Geryon, or Hillus, son of Hercules -- all giants, Titans and mighty men.\n\nFinally the Abbe Pegues ( cited in de Mirville ' s Pneumatologie ) affirms in his curious work on \" The Volcanoes of Greece \" that \"in the neighbourhood of the volcanoes of the isle of Thera, giants with enormous skulls were found laid out under colossal stones, the erection of which must have necessi- [[Footnote(s)]] ------------------------------------------------- * There are critics who, finding no evidence about the existence of Tertullian save in the writings of Eusebius \"the veracious,\" are inclined to doubt it.\n\n[[Vol.\n\n2, Page]] 279 CHRISTENDOM IS IDOLATROUS."


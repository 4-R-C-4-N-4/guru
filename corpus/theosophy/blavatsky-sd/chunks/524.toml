[content]
body = "contains (esoterically) the withdrawal of the veil of ignorance that closed the perceptions of the Angelic Man, made in the image of the \"Boneless\" gods, and the opening of his consciousness to his real nature; thus showing the bright Angel (Lucifer) in the light of a giver of Immortality, and as the \"Enlightener\"; while the real Fall into generation and matter is to be sought in chapter iv.\n\nThere, Jehovah-Cain, the male part of Adam the dual man, having separated himself from Eve, creates in her \"Abel,\" the first natural woman, * and sheds the Virgin blood.\n\nNow Cain, being shown identical with Jehovah, on the authority of the correct reading of verse i.\n\n(chapter iv., Genesis), in the original Hebrew text; and the Rabbins teaching that \" Kin (Cain), the Evil, was the Son of Eve by Samael, the devil who took Adam's place\"; and the Talmud adding that \"the evil Spirit, Satan, and Samael, the angel of Death, are the same\" --( Babba Battra, 16a ) -- it becomes easy to see that Jehovah ( mankind, or \"Jah-hovah\") and Satan (therefore the tempting Serpent) are one and [[Footnote(s)]] ------------------------------------------------- * Dozens of the most erudite writers have sifted thoroughly the various meanings of the name J'hovah (with, and without the masoretic points), and shown their multifarious bearings.\n\nThe best of such works is the \"Source of Measures, the Hebrew Egyptian Mystery.\" ** In the above-mentioned work (p.\n\n233 App.), verse 26 of the 4th chap.\n\nof Genesis is correctly translated \"then men began to call themselves Jehovah, \" but less correctly explained, perhaps, as the last word ought to be written Jah ( male ) Hovah (female), to show that from that time the race of distinctly separate man and woman began.\n\n*** See for explanation the excellent pages of appendix vii.\n\nof the same work.\n\n[[Vol.\n\n2, Page]] 389 JEHOVAH OPHIOMORPHOS.\n\nthe same in every particular.\n\nThere is no Devil, no Evil, outside mankind to produce a Devil.\n\nEvil is a necessity in, and one of the supporters of the manifested universe.\n\nIt is a necessity for progress and evolution, as night is necessary for the production of Day, and Death for that of Life -- that man may live for ever.\n\nSatan represents metaphysically simply the reverse or the polar opposite of everything in nature.* He is the \"adversary,\" allegorically, the \"murderer,\" and the great Enemy of all , because there is nothing in the whole universe that has not two sides -- the reverses of the same medal.\n\nBut in that case, light, goodness, beauty, etc., may be called Satan with as much propriety as the Devil, since they are the adversaries of darkness, badness, and ugliness.\n\nAnd now the philosophy and the rationale of certain early Christian sects -- called heretical and viewed as the abomination of the times -- will become more comprehensible.\n\nWe may understand how it was that the sect of S ATANIANS came to be degraded, and were anathematized without any hope of vindication in a future day, since they kept their tenets secret.\n\nHow, on the same principle, the C AINITES came to be degraded, and even the (Judas) I SCARIOTES; the true character of the treacherous apostle having never been correctly presented before the tribunal of Humanity.\n\nAs a direct consequence, the tenets of the Gnostic sects also become clear.\n\nEach of these sects was founded by an Initiate, while their tenets were based on the correct knowledge of the symbolism of every nation.\n\nThus it becomes comprehensible why Ilda-Baoth was regarded by most of them as the god of Moses, and was held as a proud, ambitious, and impure spirit, who had abused his power by usurping the place of the highest God, though he was no better, and in some respects far worse than his brethren Elohim ; the latter representing the all-embracing, manifested deity only in their collectivity, since they were the fashioners of the first differentiations of the primary Cosmic substance for the creation of the phenomenal Universe.\n\nTherefore Jehovah was called by the Gnostics the Creator of, and one with Ophiomorphos, the Serpent, Satan, or EVIL .\n\n( See \" Isis Unveiled, \" II, 184).\n\nThey taught that Turbo and Adonai were \"names of Jao-Jehovah, who is an emanation of Ilda Baoth\" ( Codex Nazaraeus ) .\n\n( See Part II., \" The Fallen Angels.\n\n\") This amounted in their language to saying what the Rabbins expressed in a more veiled way, by stating that -- \"Cain had been generated by Samael or Satan.\" [[Footnote(s)]] ------------------------------------------------- * In Demonology, Satan is the leader of the opposition in Hell, the monarch of which was Beelzebub.\n\nHe belongs to the fifth kind or class of demons (of which there are nine according to mediaeval demonology), and he is at the head of witches and sorcerers.\n\nBut see in the text the true meaning of Baphomet, the goat-headed Satan, one with Azaziel, the scape goat of Israel.\n\nNature is the god PAN.\n\n[[Vol.\n\n2, Page]] 390 THE SECRET DOCTRINE.\n\nThe fallen Angels are made in every ancient system the prototypes of fallen men -- allegorically, and, those men themselves -- esoterically.\n\nThus the Elohim of the hour of creation became the \"Beni-Elohim,\" the sons of God, among whom is Satan -- in the Semitic traditions; war in heaven between Thraetaona and Azhi-dahaka, the destroying Serpent, ends on earth, according to Burnouf, in the battle of pious men against the power of Evil, \"of the Iranians with the Aryan Brahmins of India.\" And the conflict of the gods with the Asuras is repeated in the Great War -- the Mahabharata.\n\nIn the latest religion of all, Christianity, all the Combatants, gods and demons, adversaries in both the camps, are now transformed into Dragons and Satans, simply in order to connect EVIL personified with the Serpent of Genesis, and thus prove the new dogma.* ------- N OAH WAS A K ABIR, HENCE HE MUST HAVE BEEN A D EMON.\n\nIt matters little whether it is Isis, or Ceres -- the \"Kabiria\" -- or again the Kabiri, who have taught men agriculture; but it is very important to prevent fanatics from monopolising all the facts in history and legend, and from fathering their distortions of truth, history, and legend upon one man."


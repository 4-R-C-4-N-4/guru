[content]
body = "Fohat, then, is the personified electric vital power, the transcendental binding Unity of all Cosmic Energies, on the unseen as on the manifested planes, the action of which resembles -- on an immense scale -- that of a living Force created by WILL, in those phenomena where the seemingly subjective acts on the seemingly objective and propels it to action.\n\nFohat is not only the living Symbol and Container of that Force, but is looked upon by the Occultists as an Entity -- the forces he acts upon being cosmic, human and terrestrial, and exercising their influence on all those planes respectively.\n\nOn the earthly plane his influence is felt in the magnetic and active force generated by the strong desire of the magnetizer.\n\nOn the Cosmic, it is present in the constructive power that carries out, in the formation of things -- from the planetary system down to the glow-worm and simple daisy -- the plan in the mind of nature, or in the Divine Thought, with regard to the development and growth of that special thing.\n\nHe is, metaphysically, the objectivised thought of the gods; the \"Word made flesh,\" on a lower scale, and the messenger of Cosmic and human ideations: the active force in Universal Life.\n\nIn his secondary aspect, Fohat is the Solar Energy, the electric vital fluid,* and the preserving fourth [[Footnote(s)]] * In 1882 the President of the Theosophical Society, Col.\n\nOlcott, was taken to task for asserting in one of his lectures that Electricity is matter.\n\nSuch, nevertheless, is the teaching of the Occult Doctrine.\n\n\"Force,\" \"Energy,\" may be a better name for it, so long as European Science knows so little about its true nature; yet matter it is, as much as Ether is matter, since it is as atomic, though several removes from the latter.\n\nIt seems ridiculous to argue that because a thing is imponderable to Science, therefore it cannot be called matter.\n\nElectricity is \"immaterial\" in the sense that its molecules are not subject to perception and experiment; yet it may be -- and Occultism says it is -- atomic; therefore it is matter.\n\nBut even supposing it were unscientific to speak of it in such terms, once Electricity is called in Science a source of Energy, Energy simply, and a Force -- where is that Force or that Energy which can be thought of without thinking of matter?\n\nMaxwell, a mathematician and one of the greatest authorities upon Electricity and its phenomena, said, years ago, that Electricity was matter, not motion merely.\n\n\"If we accept the hypothesis that the elementary substances are composed of atoms we cannot avoid concluding that electricity also, positive as well as negative, is divided into definite elementary portions, which behave like atoms of electricity.\" (Helmholtz, Faraday Lecture, 1881).\n\nWe will go further than that, and assert that Electricity is not only Substance but that it is an emanation from an Entity, which is neither God nor Devil, but one of the numberless Entities that rule and guide our world according to the eternal Law of K ARMA.\n\n(See the Addendum to this Book.) [[Vol.\n\n1, Page]] 112 THE SECRET DOCTRINE.\n\nprinciple, the animal Soul of Nature, so to say, or -- Electricity.\n\nIn India, Fohat is connected with Vishnu and Surya in the early character of the (first) God; for Vishnu is not a high god in the Rig Veda.\n\nThe name Vishnu is from the root vish , \"to pervade,\" and Fohat is called the \"Pervader\" and the Manufacturer, because he shapes the atoms from crude material.* In the sacred texts of the Rig Veda, Vishnu, also, is \"a manifestation of the Solar Energy,\" and he is described as striding through the Seven regions of the Universe in three steps, the Vedic God having little in common with the Vishnu of later times.\n\nTherefore the two are identical in this particular feature, and one is the copy of the other.\n\nThe \"three and seven\" strides refer to the Seven spheres inhabited by man, of the esoteric Doctrine, as well as to the Seven regions of the Earth.\n\nNotwithstanding the frequent objections made by would-be Orientalists, the Seven Worlds or spheres of our planetary chain are distinctly referred to in the exoteric Hindu scriptures.\n\nBut how strangely all these numbers are connected with like numbers in other Cosmogonies and with their symbols, can be seen from comparisons and parallelisms made by students of old religions.\n\nThe \"three strides of Vishnu\" through the \"seven regions of the Universe,\" of the Rig Veda, have been variously explained by commentators as meaning \"fire, lightning and the Sun\" cosmically; and as having been taken in the Earth, the atmosphere, and the sky; also as the \"three steps\" of the dwarf (Vishnu's incarnation), though more philosophically -- and in the astronomical sense, very correctly -- they are explained by Aurnavabha as being the various positions of the sun, rising, noon, and setting.\n\nEsoteric philosophy alone explains it clearly, and the Zohar laid it down very philosophically and comprehensively.\n\nIt is said and plainly demonstrated therein that in the beginning the Elohim (Elhim) were called Echod, \"one,\" or the \"Deity is one in many,\" a very simple idea in a pantheistic conception (in its philosophical sense, of course).\n\nThen came the change, \"Jehovah is Elohim,\" thus unifying the multiplicity and taking the first step towards Monotheism.\n\nNow to the query, \"How is Jehovah Elohim?\" the answer is, \"By three Steps\" from below.\n\n[[Footnote(s)]] ------------------------------------------------- * It is well known that sand, when placed on a metal plate in vibration assumes a series of regular curved figures of various descriptions.\n\nCan Science give a complete explanation of this fact?\n\n[[Vol.\n\n1, Page]] 113 THE CORRELATION OF THE GODS.\n\nThe meaning is plain.* They are all symbols, and emblematic, mutually and correlatively, of Spirit, Soul and Body (MAN); of the circle transformed into Spirit, the Soul of the World, and its body (or Earth).\n\nStepping out of the Circle of Infinity, that no man comprehendeth, Ain-Soph (the Kabalistic synonym for Parabrahm, for the Zeroana Akerne, of the Mazdeans, or for any other \" U NKNOWABLE\") becomes \"One\" -- the E CHOD, the E KA, the A HU -- then he (or it) is transformed by evolution into the One in many, the Dhyani-Buddhas or the Elohim, or again the Amshaspends, his third Step being taken into generation of the flesh, or \"Man.\" And from man, or Jah-Hova, \"male female,\" the inner divine entity becomes, on the metaphysical plane, once more the Elohim.\n\nThe Kabalistic idea is identical with the Esotericism of the Archaic period."


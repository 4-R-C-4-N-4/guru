body = "2, Page]] 160 THE SECRET DOCTRINE.\n\nof liquid carbonic acid, instead of water.\n\nWith such an element, it becomes doubtful whether the Ganoids, or even the Primitive Trilobites themselves could live in the oceans of the primary age -- let alone in those of the Silurian, as shown by Blanchard.\n\nThe conditions that were necessary for the earliest race of mankind, however, require no elements, whether simple or compound.\n\nThat which was stated at the beginning is maintained.\n\nThe spiritual ethereal Entity which lived in Spaces unknown to Earth, before the first sidereal \"jelly-speck\" evolved in the ocean of crude Cosmic Matter, -- billions and trillions of years before our globular speck in infinity, called Earth, came into being and generated the Moneron in its drops, called Oceans -- needed no \"elements.\" The \"Manu with soft bones\" could well dispense with calcic phosphate, as he had no bones, save in a figurative sense.\n\nAnd while even the Monera, however homogeneous their organism, still required physical conditions of life that would help them toward further evolution, the being which became primitive Man and the \"Father of man,\" after evolving on planes of existence undreamt of by science, could well remain impervious to any state of atmospheric conditions around him.\n\nThe primitive ancestor, in Brasseur de Bourbourg's \" Popul-Vuh, \" who -- in the Mexican legends -- could act and live with equal ease under ground and water as upon the Earth, answers only to the Second and early Third Races in our texts.\n\nAnd if the three kingdoms of Nature were so different in pre -diluvian ages, why should not man have been composed of materials and combinations of atoms now entirely unknown to physical science?\n\nThe plants and animals now known, in almost numberless varieties and species, have all developed, according to scientific hypotheses, from primitive and far fewer organic forms.\n\nWhy should not the same have occurred in the case of man, the elements, and the rest?\n\n\"Universal Genesis starts from the one, breaks into three, then five, and finally culminates into seven, to return into four, three, and one.\" (Commentary.) For additional proofs consult Part II .\n\nof this Volume, \"The Septenary in Nature.\" -------"


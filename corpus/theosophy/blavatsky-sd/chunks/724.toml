[content]
body = "There lies the heart of nature, that shrine whence issued the early races of primeval Humanity, and which is the cradle of physical man.\n\nThus far have proceeded the rough outlines of the beliefs and tenets of the archaic, earliest Races contained in their hitherto secret Scriptural records.\n\nBut our explanations are by no means complete, nor do they pretend to give out the full text, or to have been read by the help of more than three or four keys out of the sevenfold bunch of esoteric interpretation, and even this has only been partially accomplished.\n\nThe work is too gigantic for any one person to undertake, far more to accomplish.\n\nOur main concern was simply to prepare the soil.\n\nThis, we trust we have done.\n\nThese two volumes only constitute the work of a pioneer who has forced his way into the well-nigh impenetrable jungle of the virgin forests of the Land of the Occult.\n\nA commencement has been made to fell and uproot the deadly upas trees of superstition, prejudice, and conceited ignorance, so that these two [[Vol.\n\n2, Page]] 798 THE SECRET DOCTRINE.\n\nvolumes should form for the student a fitting prelude for Volumes III .\n\nand IV .\n\nUntil the rubbish of the ages is cleared away from the minds of the Theosophists to whom these volumes are dedicated, it is impossible that the more practical teaching contained in the Third Volume should be understood.\n\nConsequently, it entirely depends upon the reception with which Volumes I.\n\nand II .\n\nwill meet at the hands of Theosophists and Mystics, whether these last two volumes will ever be published, though they are almost completed.\n\nSatyat Nasti paro dharmah.\n\nTHERE IS NO RELIGION HIGHER THAN TRUTH.\n\nEnd of Vol.\n\nII .\n\nContents of Volume 2 Contents of Volume 1 Homepage"


[content]
body = "The Veda is the real Theogony of the Aryan races, while that of Hesiod is a distorted caricature of the original image.\" This is a sweeping assertion, and perhaps rather unjust in its general application.\n\nBut why not try to account for it?\n\nOrientalists cannot do so, for they reject the chronology of the Secret Doctrine, and could hardly admit the fact that between the Rig-Vedic hymns and Hesiod's Theogony tens of thousands of years have elapsed.\n\nSo they fail to see that the Greek myths are no longer the primitive symbolical language of the Initiates, the disciples of the gods-Hierophants, the divine ancient \"sacrificers,\" and that disfigured by the distance, and encumbered by the exuberant growth of human profane fancy, they now stand like distorted images of stars in running waves.\n\nBut if Hesiod's Cosmogony and Theogony are to be viewed as caricatures of the original images, how much more so the myths in the Hebrew Genesis in the sight of those, for whom they are no more divine revelation or the word of God, than Hesiod's Theogony is for Mr.\n\nGladstone.\n\n\"The poetry it (the Rig Veda) contains appears to me, on the contrary,\" says Barth \"to be of a singularly refined character and [[Vol.\n\n2, Page]] 451 THE VEDAS WRITTEN BY INITIATES.\n\nartificially elaborated, full of allusions and reticences, of pretensions (?) to mysticism and theosophic insight, and the manner of its expression is such as reminds one more frequently of the phraseology in use among certain small groups of initiated, than the poetic language of a large community.\" (\" The Religions of India, \" p.\n\nxiii.) We will not stop to enquire of the critic what he can know of the phraseology in use among the \"initiated,\" or whether he belongs himself to such a group; for, in the latter case, he would hardly have used such language.\n\nBut the above shows the remarkable disagreement between scholars even with regard to the external character of the Rig Veda.\n\nWhat, then, can any of the modern Sanskritists know about its internal or esoteric meaning, beyond the correct inference of Barth, that this Scripture has been compiled by I NITIATES?\n\nThe whole of the present work is an endeavour to prove this truth.\n\nThe ancient adepts have solved the great problems of science, however unwilling modern materialism may be to admit the fact.\n\nThe mysteries of Life and Death were fathomed by the great master-minds of antiquity; and if they have preserved them in secresy and silence, it is because these problems formed part of the sacred mysteries; and, secondly, because they must have remained incomprehensible to the vast majority of men then, as they do now.\n\nIf such teachings are still regarded as chimeras by our opponents in philosophy, it may be a consolation to the Theosophists to learn, on good proofs, that the speculations of modern psychologists -- whether serious Idealists, like Mr.\n\nHerbert Spencer, or wool-gathering pseudo-Idealists -- are far more chimerical.\n\nIndeed, instead of resting on the firm foundation of facts in Nature, they are the unhealthy will-o'-the-wisps of materialistic imagination, of the brains that evolved them -- and no more.\n\nWhile they deny, we affirm; and our affirmation is corroborated by almost all the sages of antiquity.\n\nBelieving in Occultism and a host of invisible Potencies for good reasons, we say: Certus sum, scio quod credidi; to which our critics reply: Credat Judaeus Apella.\n\nNeither is converted by the other, nor does such result affect even our little planet.\n\nE pur se muove!\n\nNor is there any need of proselytizing.\n\nAs remarked by the wise Cicero, \"Time destroys the speculations of man, but it confirms the judgment of nature.\" Let us bide our time.\n\nMeanwhile, it is not in the human constitution to witness in silence the destruction of one's gods, whether they be true or false.\n\nAnd as theology and materialism have combined together to destroy the old gods of antiquity and seek to disfigure every old philosophical conception, it is but just that the lovers of old wisdom should defend their position, by proving that the whole arsenal of the two is, at best, formed of new weapons made out of very old material."


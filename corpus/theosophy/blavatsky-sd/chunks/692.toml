body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n2 [[Vol.\n\n2, Page]] 731 STILL GREATER DIFFICULTIES.\n\n§ V.\n\nORGANIC EVOLUTION AND CREATIVE CENTRES.\n\nI T is argued that the Universal Evolution, otherwise, the gradual development of species in all the kingdoms of nature, works by uniform laws.\n\nThis is admitted, and the law enforced far more strictly in Esoteric than in modern Science.\n\nBut we are told also, that it is equally a law that \"development works from the less to the more perfect, and from the simpler to the more complicated, by incessant changes, small in themselves, but constantly accumulating in the required direction.\" It is from the infinitesimally small that the comparatively gigantic species are produced.\n\nEsoteric Science agrees with it, but adds that this law applies only to what is known to it as the Primary Creation - - the evolution of worlds from primordial atoms, and the pre-primordial A TOM, at the first differentiation of the former; and that during the period of cyclic evolution in space and time, this law is limited and works only in the lower kingdoms.\n\nIt did so work during the first geological periods, from simple to complex, on the rough material surviving from the relics of the Third Round, which relics are projected into objectivity when terrestrial activity recommences.\n\nNo more than Science, does esoteric philosophy admit design or \" special creation.\" It rejects every claim to the \"miraculous,\" and accepts nothing outside the uniform and immutable laws of Nature.\n\nBut it teaches a cyclic law, a double stream of force (or spirit) and of matter, which, starting from the neutral centre of Being, develops in its cyclic progress and incessant transformations.\n\nThe primitive germ from which all vertebrate life has developed throughout the ages, being distinct from the primitive germ from which the vegetable and the animal life have evolved, there are side laws whose work is determined by the conditions in which the materials to be worked upon are found by them, and of which Science -- physiology and anthropology especially -- seems to be little aware.\n\nIts votaries speak of that \"primitive germ,\" and maintain that it is shown beyond any doubt that the \"design\" and the \" designer, \" if there be any, in the case of man, with the wonderful structure of his limbs, and his hand especially, \"must be placed very much farther back, and (the design) is, in fact, involved in the primitive germ,\" from which not only all vertebrate life, but, \"probably all life, animal and vegetable, have been slowly developed\" ( p .\n\n94 of \" Modern Science and Modern Thought \") .\n\n[[Vol.\n\n2, Page]] 732 THE SECRET DOCTRINE.\n\nThis is as true of the \"primitive germ\" as it is false that that \"germ\" is only \"very much farther back\" than man is; for it is at an immeasurable and inconceivable distance ( in time, though not in space) from the origin even of our Solar system.\n\nAs the Hindu philosophy very justly teaches, the \" Aniyamsam Aniyasam, \" can be known only through false notions.\n\nIt is the \"many\" that proceed from the ONE -- the living spiritual germs or centres of forces -- each in a septenary form, which first generate, and then give the PRIMARY IMPULSE to the law of evolution and gradual slow development.\n\nLimiting the teaching strictly to this, our earth, it may be shown that, as the ethereal forms of the first Men are first projected on seven zones by seven Dhyan-Chohanic centres of Force, so there are centres of creative power for every ROOT or parent species of the host of forms of vegetable and animal life.\n\nThis is, again, no \"special creation,\" nor is there any \"Design,\" except in the general \"ground-plan\" worked out by the universal law.\n\nBut there are certainly \"designers,\" though these are neither omnipotent nor omniscient in the absolute sense of the term.\n\nThey are simply Builders, or Masons, working under the impulse given them by the ever-to-be-unknown (on our plane) Master Mason -- the O NE L IFE and Law.\n\nBelonging to this sphere, they have no hand in, or possibility of working on any other, during the present Manvantara, at any rate.\n\nThat they work in cycles and on a strictly geometrical and mathematical scale of progression, is what the extinct animal species amply demonstrate; that they act by design in the details of minor lives (of side animal issues, etc.) is what natural history has sufficient evidence for.\n\nIn the creation of new species, departing sometimes very widely from the Parent stock, as in the great variety of the genus Felis -- like the lynx, the tiger, the cat, etc.\n\n-- it is the \"designers\" who direct the new evolution by adding to, or depriving the species of certain appendages, either needed or becoming useless in the new environments.\n\nThus, when we say that Nature provides for every animal and plant, whether large or small, we speak correctly.\n\nFor, it is those terrestrial spirits of Nature, who form the aggregated Nature; which, if it fails occasionally in its design, is neither to be considered blind, nor to be taxed with the failure; since, belonging to a differentiated sum of qualities and attributes, it is in virtue of that alone conditioned and imperfect.\n\nWere there no such thing as evolutionary cycles, an eternal spiral progress into matter with a proportionate obscuration of spirit -- though the two are one -- followed by an inverse ascent into spirit and the defeat of matter -- active and passive by turn -- how explain the discoveries of zoology and geology?\n\nHow is it that, on the dictum of authoritative science, one can trace the animal life from the mollusc up [[Vol.\n\n2, Page]] 733 THE \"TO BE OR NOT TO BE\" OF SCIENCE.\n\nto the great Sea Dragon, from the smallest land-worm up again to the gigantic animals of the Tertiary Period; and that the latter were once crossed is shown by the fact of all those species decreasing, dwindling down and being dwarfed.\n\nIf the seeming process of development working from the less to the more perfect, and from the simpler to the more complex, were a universal law indeed, instead of being a very imperfect generalization of a mere secondary nature in the great Cosmic process, and if there were no such cycles as those claimed, then the Mesozoic fauna and flora ought to change places with the latest Neolithic.\n\nIt is the Plesiosauri and the Ichthyosauri that we ought to find developing from the present sea and river reptiles, instead of giving place to their dwarfed modern analogies."


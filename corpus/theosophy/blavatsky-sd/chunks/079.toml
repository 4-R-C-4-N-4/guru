[content]
body = "At any rate, Occultism teaches that the so-called \"reverse rotation\" is a fact.\n\n* The Occultists, having most perfect faith in their own exact records, astronomical and mathematical, calculate the age of Humanity, and assert that the latter (as separate sexes) has existed in this Round just 18,618,727 years, as the Brahmanical teachings and even some Hindu calendars declare.\n\n[[Vol.\n\n1, Page]] 151 NATURE CAN NEVER CEASE.\n\nturned seven times,\" before one comes to understand it.\n\nOccult philosophy is the only science that can teach it.\n\nHow, then, can anyone hang the truth or the untruth of the Occultist's proposition that \"the Kosmos is eternal in its unconditioned collectivity, and finite but in its conditioned manifestations\" on this one-sided physical enunciation that \"it is a necessity of Nature to run down?\" --------------------- With these verses -- the 4th Sloka of Stanza VI.\n\n-- ends that portion of the Stanzas which relates to the Universal Cosmogony after the last Mahapralaya or Universal destruction, which, when it comes, sweeps out of Space every differentiated thing, Gods as atoms, like so many dry leaves.\n\nFrom this verse onwards, the Stanzas are concerned only with our Solar System in general, with the planetary chains therein, inferentially, and with the history of our globe (the 4th and its chain) especially.\n\nAll the Stanzas and verses which follow in this Book I.\n\nrefer only to the evolution of, and on, our Earth.\n\nWith regard to the latter, a strange tenet -- strange from the modern scientific stand-point only, of course -- is held, which ought to be made known.\n\nBut before entirely new and rather startling theories are presented to the reader, they must be prefaced by a few words of explanation.\n\nThis is absolutely necessary, as these theories clash not only with modern science, but contradict, on certain points, earlier statements made by other Theosophists, who claim to base their explanations and renderings of these teachings on the same authority as we do.* This may give rise to the idea that there is a decided contradiction between the expounders of the same doctrine; whereas the difference, in reality, arises from the incompleteness of the information given to earlier writers, who thus drew some erroneous conclusions and indulged in premature speculations, in their endeavour to present a complete system to the public.\n\nThus the reader, who is already a student of Theosophy, must not be surprised to find in these pages the rectification of certain statements made in various Theosophical works, and also the explanation of certain points which have remained obscure, because they were necessarily left incomplete.\n\nMany are the questions upon which even the author of \"Esoteric Buddhism\" (the best and [[Footnote(s)]] ------------------------------------------------- * \"Esoteric Buddhism\" and \"Man.\" [[Vol.\n\n1, Page]] 152 THE SECRET DOCTRINE.\n\nmost accurate of all such works) has not touched.\n\nOn the other hand, even he has introduced several mistaken notions which must now be presented in their true mystic light, as far as the present writer is capable of doing so.\n\nLet us then make a short break between the Slokas just explained and those which follow, for the Cosmic periods which separate them are of immense duration.\n\nThis will afford us ample time to take a bird's eye view of some points pertaining to the Secret Doctrine, which have been presented to the public under a more or less uncertain and sometimes mistaken light.\n\n------- [[This page continued in next section]]"


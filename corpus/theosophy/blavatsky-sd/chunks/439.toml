body = "a dynasty of Spirit -Kings, not of Manes, or \"ghosts,\" as some believe ( See \" Pneumatologie \"), but of actual living Devas (or demi-gods or Angels, again) who had assumed bodies to rule over them, and who, in their turn, instructed them in arts and sciences.\n\nOnly, as they were rupa or material Spirits, these Dhyanis were not always good.\n\nTheir King Thevetata was one of the latter, and it is under the evil influence of this King-Demon that .\n\n.\n\n.\n\n.\n\nthe Atlantis-race became a nation of wicked magicians.\n\n\"In consequence of this, war was declared, the story of which would be too long to narrate; its substance may be found in the disfigured allegories of the race of Cain, the giants, and that of Noah and his righteous family.\n\nThe conflict came to an end by the submersion of the Atlantis, which finds its imitation in the stories of the Babylonian and Mosaic flood.\n\nThe giants and magicians '.\n\n.\n\n.\n\nand all flesh died .\n\n.\n\n.\n\nand every man.' All except Xisuthrus and Noah, who are substantially identical with the great Father of the Thhnkithians in the Popol-Vuh, or the sacred book of the Guatemaleans, which also tells of his escaping in a large boat like the Hindu Noah -- Vaivasvata.\n\n\"If we believe the tradition at all, we have to credit the further story that, from the intermarrying of the progeny of the hierophants of the island and the descendants of the Atlantean Noah, sprang up a mixed race of righteous and wicked.\n\nOn the one side the world had its Enochs, Moseses, various Buddhas, its numerous 'Saviours,' and great hierophants; on the other hand, its ' natural magicians' who, through lack of the restraining power of proper spiritual enlightenment, .\n\n.\n\n.\n\nperverted their gifts to evil purposes.\n\n.\n\n.\n\n.\" We may supplement this by the testimony of some records and traditions.\n\nIn the \" Histoire des Vierges: Les Peuples et les Continents Disparus, \" the author says: -- \"One of the most ancient legends of India, preserved in the temples by oral and written tradition, relates that several hundred thousand years ago there existed in the Pacific Ocean an immense continent which was destroyed by geological upheaval, and the fragments of which must be sought in Madagascar, Ceylon, Sumatra, Java, Borneo, and the principal isles of Polynesia.\" \"The high plateaux of Hindustan and Asia, according to this hypothesis, would only have been represented in those distant epochs by great islands contiguous to the central continent .\n\n.\n\n.\n\n.\n\n.\n\nAccording to the Brahmans, this country had attained a high civilization, and the peninsula of Hindustan, enlarged by the displacement of the waters, at the time of the grand cataclysm, has but continued the chain of the primitive traditions born in this place.\n\nThese traditions give the name of Rutas to the peoples which inhabited this immense equinoctial continent, and from their speech was derived the Sanscrit .\n\n.\n\n.\n\n.\n\n.\n\nAnd the Indo-Hellenic tradition, preserved by the most intelligent population which emigrated from the plains of India, equally relates the existence of a continent and a people to which it gives the name of Atlantis and Atlantides, and which it locates in the Atlantic in the northern portion of the Tropics.\" \"Apart from this fact, the supposition of an ancient continent in those latitudes, the vestiges of which may be found in the volcanic islands and moun- [[Vol.\n\n2, Page]] 223 THE MAGICIANS OF ATLANTIS.\n\ntainous surface of the Azores, the Canaries and Cape de Verdes, is not devoid of geographical probability.\n\nThe Greeks, who, moreover, never dared to pass beyond the pillars of Hercules, on account of their dread of the mysterious ocean, appeared too late in antiquity for the stories preserved by Plato to be anything else than an echo of the Indian legend.\n\nMoreover, when we cast a look on a planisphere, at the sight of the islands and islets strewn from the Malayan Archipelago to Polynesia, from the straits of Sunda to Easter Island, it is impossible, upon the hypothesis of continents preceding those which we inhabit, not to place there the most important of all.\n\n\"A religious belief, common to Malacca and Polynesia, that is to say, to the two opposite extremes of the Oceanic world, affirms 'that all these islands once formed two immense countries, inhabited by yellow men and black men, always at war; and that the gods, wearied with their quarrels, having charged Ocean to pacify them, the latter swallowed up the two continents, and, since, it has been impossible to make him give up his captives.\n\nAlone, the mountain-peaks and high plateaux escaped the flood, by the power of the gods, who perceived too late the mistake they had committed.' \"Whatever there may be in these traditions, and whatever may have been the place where a civilization more ancient than that of Rome, of Greece, of Egypt, and of India was developed, it is certain that this civilization did exist, and it is highly important to science to recover its traces, however feeble and fugitive they may be\" ( pp .\n\n13-15) .\n\nThis last tradition corroborates the one given from the \"Records of the Secret Doctrine.\" The war mentioned between the yellow and the black men, relates to a struggle between the \"sons of God\" and the \"sons of giants,\" or the inhabitants and magicians of Atlantis.\n\nThe final conclusion of the author, who personally visited all the islands of Polynesia, and devoted years to the study of the religion, language, and traditions of nearly all the peoples, is as follows: \"As to the Polynesian continent which disappeared at the time of the final geological cataclysms, its existence rests on such proofs that to be logical we can doubt no longer.\n\n\"The three summits of this continent, the Sandwich Islands, New Zealand, Easter Island, are distant from each other from fifteen to eighteen hundred leagues, and the groups of intermediate islands, Viti, Samoa, Tonga, Foutouna, Ouvea, the Marquesas, Tahiti, Poumoutou, the Gambiers, are themselves distant from these extreme points from seven or eight hundred to one thousand leagues.\n\n\"All navigators agree in saying that the extreme and the central groups could never have communicated in view of their actual geographical position, and with the insufficient means they had at hand.\n\nIt is physically impossible to cross such distances in a pirogue .\n\n.\n\n.\n\nwithout a compass, and travel months without provisions.\n\n\"On the other hand, the aborigines of the Sandwich Islands, of Viti, of New Zealand, of the central groups, of Samoa, Tahiti, etc., had never known each other, had never heard of each other, before the arrival of the Europeans.\n\nAnd yet each of these people maintained that their island had at one time formed part of an [[Vol."


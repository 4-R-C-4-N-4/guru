[content]
body = "In conjunction with the hawk, the symbol of Osiris-Sun, the symbol is dual: it relates to both lives -- the mortal and the immortal.\n\nIn Kircher's OEdipus Egyptiacus (vol.\n\niii., p.\n\n124) one can see, on the papyrus engraved in it, an egg floating above the mummy.\n\nThis is the symbol of hope and the promise of a second birth for the Osirified dead; his Soul, after due purification in the Amenti, will gestate in this egg of immortality, to be reborn from it into a new life on earth.\n\nFor this Egg, in the esoteric Doctrine, is the Devachan , the abode of Bliss; the winged scarabeus being alike a symbol of it.\n\nThe \"winged globe\" is but another form of the egg, and has the same significance as the scarabeus, the Khopiroo (from the root Khoproo \"to become,\" \"to be reborn,\") which relates to the rebirth of man, as well as to his spiritual regeneration.\n\nIn the Theogony of Mochus, we find AEther first, and then the air, from which Ulom, the intelligible ([[ noetos ]]) deity (the visible Universe of Matter) is born out of the Mundane Egg.\n\n(Mover's Phoinizer , p.\n\n282.) In the Orphic Hymns, the Eros-Phanes evolves from the divine Egg, which the AEthereal Winds impregnate, wind being \"the Spirit of the unknown Darkness\" -- \"the spirit of God\" (as explains K.\n\nO.\n\nMuller, 236); the divine \"Idea,\" says Plato, \"who is said to move AEther.\" In the Hindu Katakopanishad , Purusha, the divine spirit, already stands before the original matter, \"from whose union springs the great soul of the world,\" Maha-Atma, Brahma, the Spirit of Life,* etc., etc.** Besides this there are many charming allegories on this subject scattered through the sacred books of the Brahmins.\n\nIn one place it is the female creator who is first a germ, then a drop of heavenly dew, a pearl, and then an egg.\n\nIn such cases -- of which there are too many to enumerate them separately -- the Egg gives birth to the four elements within the fifth, Ether, and is covered with seven coverings, which become later on the seven upper and the seven lower worlds.\n\nBreaking in two, the shell becomes the heaven, and the meat in the egg the earth, the white forming the terres- [[Footnote(s)]] ------------------------------------------------- * The latter appellations are all identical with Anima Mundi , or the \"Universal Soul,\" the astral light of the Kabalist and the Occultist, or the \"Egg of Darkness.\" ** Weber, \"Akad Vorles,\" pp.\n\n213, 214 et seq.\n\n[[Vol.\n\n1, Page]] 366 THE SECRET DOCTRINE.\n\ntrial waters.\n\nThen again, it is Vishnu who emerges from within the egg with a lotus in his hand.\n\nVinata, a daughter of Daksha and wife of Kasyapa (\"the Self-born sprung from Time,\" one of the seven \"creators\" of our world), brought forth an egg from which was born Garuda, the vehicle of Vishnu, the latter allegory having a relation to our Earth only, as Garuda is the Great Cycle.\n\nThe egg was sacred to Isis; the priests of Egypt never ate eggs on that account.* Diodorus Siculus states that Osiris was born from an Egg, like Brahma.\n\nFrom Leda's Egg Apollo and Latona were born, as also Castor and Pollux -- the bright Gemini.\n\nAnd though the Buddhists do not attribute the same origin to their Founder, yet, no more than the ancient Egyptians or the modern Brahmins, do they eat eggs, lest they should destroy the germ of life latent in them, and commit thereby Sin.\n\nThe Chinese believe that their first man was born from an egg, which Tien , a god, dropped down from heaven to earth into the waters.** This symbol is still regarded by some as representing the idea of the origin of life, which is a scientific truth, though the human ovum is invisible to the naked eye.\n\nTherefore we see respect shown to it from the remotest past, by the Greeks, Phoenicians, Romans, the Japanese, and the Siamese, the North and South American tribes, and even the savages of the remotest islands.\n\nWith the Egyptians, the concealed god was Ammon ( Mon ).\n\nAll their gods were dual: the scientific reality for the Sanctuary; its double, the fabulous and mythical Entity, for the masses.\n\nFor instance, as observed in \"Chaos, Theos, Kosmos,\" the older Horus was the Idea of the world remaining in the demiurgic mind \"born in Darkness before the creation of the world;\" the second Horus*** was the same Idea going forth from the Logos , becoming clothed with matter and assuming an actual existence.\n\n(Compare Mover ' s \" Phoinizer ,\" p.\n\n268.) The same with Khnoum and Ammon;**** both are represented ram-headed, and both often confused, though their functions are different.\n\nKhnoum is \"the modeller of men,\" fashioning men and things out of the Mundane Egg on a potter's wheel; [[Footnote(s)]] ------------------------------------------------- * Isis is almost always represented holding a lotus in one hand and in the other a circle and the Cross ( crux ansata ), the Egg being sacred to her.\n\n** The Chinese seem to have thus anticipated Sir William Thomson's theory that the first living germ had dropped to the Earth from some passing comet.\n\nQuery!\n\nwhy should this be called scientific and the Chinese idea a superstitious, foolish theory?\n\n*** Horus -- the \"older,\" or Haroiri , is an ancient aspect of the solar god, contemporary with Ra and Shoo; Haroiri is often mistaken for Hor (Horsusi), Son of Osiris and Isis.\n\nThe Egyptians very often represented the rising Sun under the form of Hor the older, rising from a full-blown lotus, the Universe, when the solar disc is always found on the hawk-head of that god.\n\nHaroiri is Khnoum.\n\n**** Ammon or Mon , the \"hidden,\" the Supreme Spirit.\n\n[[Vol.\n\n1, Page]] 367 THE SCANDINAVIAN LOGOS.\n\nAmmon-Ra, the generator, is the secondary aspect of the concealed deity.\n\nKhnoum was adored at Elephanta and Philoe,* Ammon at Thebes.\n\nBut it is Emepht, the One, Supreme Planetary principle, who blows the egg out of his mouth, and who is, therefore, Brahma.\n\nThe shadow of the deity, Kosmic and universal, of that which broods over and permeates the egg with its vivifying Spirit until the germ contained in it is ripe, was the mystery god whose name was unpronounceable."


body = "(2.) M ONISM, or the Single Substance Doctrine, is the more subtle form of negative psychology, which one of its advocates, Professor Bain, ably terms \"guarded [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 125 THE REAL MEANING OF THE TABERNACLE.\n\nIn the Egyptian temples, according to Clemens Alexandrinus, an immense curtain separated the tabernacle from the place for the congregation.\n\nThe Jews had the same.\n\nIn both, the curtain was drawn over five pillars (the Pentacle) symbolising our five senses and five Root-races esoterically, while the four colours of the curtain represented the four cardinal points and the four terrestrial elements.\n\nThe whole was an allegorical symbol.\n\nIt is through the four high Rulers over the four points and Elements that our five senses may become cognisant of the hidden truths of Nature; and not at all, as Clemens would have it, that it is the elements per se that furnished the Pagans with divine Knowledge or the knowledge of God.* While the Egyptian emblem was spiritual, that of the Jews was purely materialistic, and, indeed, honoured only the blind Elements and the imaginary \"Points.\" For what was the meaning of the square tabernacle raised by Moses in the wilderness, if it had not the same cosmical significance?\n\n\"Thou shalt make an hanging .\n\n.\n\n.\n\nof blue, purple, and scarlet\" and \"five pillars of shittim wood for the hanging .\n\n.\n\n.\n\nfour brazen rings in the four corners thereof .\n\n.\n\n.\n\nboards of fine wood for the four sides, North, South, West, and East .\n\n.\n\n.\n\nof the Tabernacle .\n\n.\n\n.\n\nwith Cherubims of cunning work.\" (Exodus, ch.\n\nxxvi., xxvii.) The Tabernacle and the square courtyard, Cherubim and all, were precisely the same as those in the Egyptian temples.\n\nThe square form of the Tabernacle meant just the same thing as it still means, to this day, in the exoteric worship of the Chinese and Tibetans -- the four cardinal points signifying that which the four sides of the pyramids, obelisks, and other such square erections mean.\n\nJosephus takes care to explain the whole thing.\n\nHe declares that the Tabernacle pillars are the same [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] Materialism.\" This doctrine, which commands a very wide assent, counting among its upholders such men as Lewis, Spencer, Ferrier, and others, while positing thought and mental phenomena generally as radically contrasted with matter, regards both as equal to the two sides, or aspects, of one and the same substance in some of its conditions.\n\nThought as thought, they say, is utterly contrasted with material phenomena, but it must be also regarded as only \"the subjective side of nervous motion\" whatever our learned men may mean by this.\n\n* Thus the sentence, \"Natura Elementorum obtinet revelationem Dei,\" (In Clemens's Stromata , R.\n\nIV ., para.\n\n6), is applicable to both or neither.\n\nConsult the Zends, vol II., p.\n\n228, and Plutarch De Iside , as compared by Layard, Academie des Inscriptions , 1854, Vol.\n\nXV.\n\n[[Vol.\n\n1, Page]] 126 THE SECRET DOCTRINE.\n\nas those raised at Tyre to the four Elements, which were placed on pedestals whose four angles faced the four cardinal points: adding that \"the angles of the pedestals had equally the four figures of the Zodiac\" on them, which represented the same orientation ( Antiquities I., VIII., ch.\n\nxxii.).\n\nThe idea may be traced in the Zoroastrian caves, in the rock-cut temples of India, as in all the sacred square buildings of antiquity that have survived to this day.\n\nThis is shown definitely by Layard, who finds the four cardinal points, and the four primitive elements, in the religion of every country, under the shape of square obelisks, the four sides of the pyramids, etc., etc.\n\nOf these elements and their points the four Maharajahs were the regents and the directors.\n\nIf the student would know more of them, he has but to compare the Vision of Ezekiel (chap.\n\ni.) with what is known of Chinese Buddhism (even in its exoteric teachings); and examine the outward shape of these \"Great Kings.\" In the opinion of the Rev.\n\nJoseph Edkins, they are \"the Devas who preside each over one of the four continents into which the Hindus divide the world.\"* Each leads an army of spiritual beings to protect mankind and Buddhism.\n\nWith the exception of favouritism towards Buddhism, the four celestial beings are precisely this.\n\nThey are the protectors of mankind and also the Agents of Karma on Earth, whereas the Lipika are concerned with Humanity's hereafter.\n\nAt the same time they are the four living creatures \"who have the likeness of a man\" of Ezekiel's visions, called by the translators of the Bible, \"Cherubim,\" \"Seraphim,\" etc.; and by the Occultists, \"the winged Globes,\" the \"Fiery Wheels,\" and in the Hindu Pantheon by a number of different names.\n\nAll these Gandharvas, the \"Sweet Songsters,\" the Asuras, Kinnaras, and Nagas, are the allegorical descriptions of the \"four Maharajahs.\" The Seraphim are the fiery Serpents of Heaven which we find in a passage describing Mount Meru as: \"the exalted mass of glory, the venerable haunt of gods and heavenly choristers .\n\n.\n\n.\n\n.\n\nnot to be reached by sinful men .\n\n.\n\n.\n\n.\n\nbecause guarded by Serpents.\" They are called the Avengers, and the \"Winged Wheels.\" Their mission and character being explained, let us see what the [[Footnote(s)]] ------------------------------------------------- *The Hindus happen to divide the world into seven continents, exoterically as esoterically; and their four cosmic Devas are eight, presiding over the eight points of the compass and not the Continents.\n\n(Compare \"Chinese Buddhism,\" p.\n\n216.) [[Vol.\n\n1, Page]] 127 THE DRAGONS OF SECRET WISDOM.\n\nChristian Bible-interpreters say of the Cherubim: -- \"The word signifies in Hebrew, fullness of knowledge; these angels are so called from their exquisite Knowledge, and were therefore used for the punishment of men who affected divine Knowledge.\" (Interpreted by Cruden in his Concordance, from Genesis iii., 24.) Very well; and vague as the information is, it shows that the Cherub placed at the gate of the garden of Eden after the \"Fall,\" suggested to the venerable Interpreters the idea of punishment connected with forbidden Science or divine Knowledge -- one that generally leads to another \"Fall,\" that of the gods, or \"God,\" in man's estimation.\n\nBut as the good old Cruden knew nought of Karma, he may be forgiven.\n\nYet the allegory is suggestive."


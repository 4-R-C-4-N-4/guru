body = "Shall we still doubt the fact of Arjuna going over to Patala (the Antipodes, America) and there marrying Ulupi, the daughter of the Naga (or rather Nargal ) King?\n\nBut to the Zuni priests.\n\nThese receive an annual tribute, to this day, of corn of seven colours.\n\nUndistinguished from other Indians during the whole year, on a certain day, they come out (the six priests and one priestess) arrayed in their [[Vol.\n\n2, Page]] 629 THE SEVEN PRIESTS OF THE ZUNIS.\n\npriestly robes, each of a colour sacred to the particular God whom the priest serves and personifies; each of them representing one of the seven regions, and each receiving corn of the colour corresponding to that region.\n\nThus, the white represents the East, because from the East comes the first Sun-light; the yellow, corresponds to the North, from the colour of the flames produced by the aurora borealis; the red, the South, as from that quarter comes the heat; the blue stands for the West, the colour of the Pacific Ocean, which lies to the West; black is the colour of the nether underground region -- darkness; corn with grains of all colours on one ear represents the colours of the upper region -- of the firmament, with its rosy and yellow clouds, shining stars, etc.\n\nThe \"speckled\" corn -- each grain containing all the colours -- is that of the \"Priestess-Mother\": woman containing in herself the seeds of all races past, present and future; Eve being the mother of all living.\n\nApart from these was the Sun -- the Great Deity -- whose priest was the spiritual head of the nation.\n\nThese facts were ascertained by Mr.\n\nF.\n\nHamilton Cushing, who, as many are aware, became an Indian Zuni, lived with them, was initiated into their religious mysteries, and has learned more about them than any other man now living.\n\nSeven is also the great magic number.\n\nIn the occult records the weapon mentioned in the Puranas and the Mahabharata -- the Agneyastra or \"fiery weapon\" bestowed by Aurva upon his chela Sagara -- is said to be built of seven elements.\n\nThis weapon -- supposed by some ingenious Orientalists to have been a \"rocket\" (!) -- is one of the many thorns in the side of our modern Sanskritists.\n\nWilson exercises his penetration over it, on several pages in his Specimens of the Hindu Theatre, and finally fails to explain it.\n\nHe can make nothing out of the Agneyastra.\n\n\"These weapons,\" he argues, \"are of a very unintelligible character.\n\nSome of them are wielded as missiles; but, in general, they appear to be mystical powers exercised by the individual -- such as those of paralysing an enemy, or locking his senses fast in sleep, or bringing down storm, and rain, and fire, from heaven.\n\n( Vide supra, pp.\n\n427 and 428.) .\n\n.\n\n.\n\n.\n\nThey assume celestial shapes, endowed with human faculties.\n\n.\n\n.\n\n.\n\n.\n\nThe Ramayana calls them the Sons of Krisaswa\" (p.\n\n297).\n\nThe Sastra-devatas, \"gods of the divine weapons,\" are no more Agneyastra, the weapon, than the gunners of modern artillery are the cannon they direct.\n\nBut this simple solution did not seem to strike the eminent Sanskritist.\n\nNevertheless, as he himself says of the armiform progeny of Krisaswa, \"the allegorical origin of the (Agneyastra) weapons is, undoubtedly, the more ancient.\"* It is the fiery javelin of Brahma.\n\n[[Footnote(s)]] ------------------------------------------------- * It is.\n\nBut Agneyastra are fiery \"missile weapons,\" not \"edged\" weapons, as there is some difference between Sastra and Astra in Sanskrit.\n\n[[Vol.\n\n2, Page]] 630 THE SECRET DOCTRINE.\n\nThe seven-fold Agneyastra, like the seven senses and the \"seven principles,\" symbolized by the seven priests, are of untold antiquity.\n\nHow old is the doctrine believed in by Theosophists, the following section will tell.\n\n------- [[Page continued in next section]]"


[content]
body = "i., p.\n\n302, is, first of all, shot down by the law of Evolution into the lowest form of matter -- the mineral.\n\nAfter a sevenfold gyration encased in the stone (or that which will become mineral and stone in the Fourth Round), it creeps out of it, say, as a lichen.\n\nPassing thence, through all the forms of vegetable matter, into what is termed animal matter, it has now reached the point in which it has become the germ, so to speak, of the [[Footnote(s)]] ------------------------------------------------- * The introductory chapters of Genesis were never meant to represent even a remote allegory of the creation of our Earth.\n\nThey embrace a metaphysical conception of some indefinite period in the eternity, when successive attempts were being made by the law of evolution at the formation of universes.\n\nThe idea is plainly stated in the Zohar: \"There were old worlds, which perished as soon as they came into existence, were formless, and were called Sparks.\n\nThus, the smith, when hammering the iron, lets the sparks fly in all directions.\n\nThe sparks are the primordial worlds, which could not continue because the Sacred Aged (Sephira) had not as yet assumed its form (of androgyne, or opposite sexes) of King and Queen (Sephira and Kadmon), and the Master was not yet at his work.\" See Zohar, \"Idra Suta,\" Book iii., p.\n\n292, b.\n\nThe Supreme consulting with the Architect of the world -- his Logos -- about creation.\n\n(\"Isis Unveiled,\" vol.\n\nii., p.\n\n421.) [[Vol.\n\n1, Page]] 247 SPIRIT ALONE IS HELPLESS ON EARTH.\n\nanimal, that will become the physical man.\n\nAll this, up to the Third Round, is formless, as matter, and senseless, as consciousness.\n\nFor the Monad or Jiva per se cannot be even called spirit: it is a ray, a breath of the A BSOLUTE, or the Absoluteness rather, and the Absolute Homogeneity, having no relations with the conditioned and relative finiteness, is unconscious on our plane.\n\nTherefore, besides the material which will be needed for its future human form, the monad requires ( a ) a spiritual model, or prototype, for that material to shape itself into; and ( b ) an intelligent consciousness to guide its evolution and progress, neither of which is possessed by the homogeneous monad, or by senseless though living matter.\n\nThe Adam of dust requires the Soul of Life to be breathed into him: the two middle principles, which are the sentient life of the irrational animal and the Human Soul, for the former is irrational without the latter.\n\nIt is only when, from a potential androgyne, man has become separated into male and female, that he will be endowed with this conscious, rational, individual Soul, ( Manas ) \"the principle, or the intelligence, of the Elohim,\" to receive which, he has to eat of the fruit of Knowledge from the Tree of Good and Evil.\n\nHow is he to obtain all this?\n\nThe Occult doctrine teaches that while the monad is cycling on downward into matter, these very Elohim -- or Pitris, the lower Dhyan-Chohans -- are evolving pari passu with it on a higher and more spiritual plane, descending also relatively into matter on their own plane of consciousness, when, after having reached a certain point, they will meet the incarnating senseless monad, encased in the lowest matter, and blending the two potencies, Spirit and Matter, the union will produce that terrestrial symbol of the \"Heavenly Man\" in space -- PERFECT MAN.\n\nIn the Sankhya philosophy, Purusha (spirit) is spoken of as something impotent unless he mounts on the shoulders of Prakriti (matter), which, left alone, is -- senseless.\n\nBut in the secret philosophy they are viewed as graduated.\n\nThough one and the same thing in their origin, Spirit and Matter, when once they are on the plane of differentiation, begin each of them their evolutionary progress in contrary directions -- Spirit falling gradually into matter, and the latter ascending to its original condition, that of a pure spiritual substance.\n\nBoth are inseparable, yet ever separated.\n\nIn polarity, on the physical plane, two like poles will always repel each other, while the negative and the positive are mutually attracted, so do Spirit and Matter stand to each other -- the two poles of the same homogeneous substance, the root-principle of the universe.\n\n[[Vol.\n\n1, Page]] 248 THE SECRET DOCTRINE.\n\nTherefore, when the hour strikes for Purusha to mount on Prakriti's shoulders for the formation of the Perfect Man -- rudimentary man of the first 2 1/2 Races being only the first , gradually evolving into the most perfect of mammals -- the Celestial \"Ancestors\" (Entities from preceding worlds, called in India the Sishta) step in on this our plane, as the Pitris had stepped in before them for the formation of the physical or animal-man, and incarnate in the latter.\n\nThus the two processes -- for the two creations: the animal and the divine man -- differ greatly.\n\nThe Pitris shoot out from their ethereal bodies, still more ethereal and shadowy similitudes of themselves, or what we should now call \"doubles,\" or \"astral forms,\" in their own likeness.* This furnishes the Monad with its first dwelling, and blind matter with a model around and upon which to build henceforth.\n\nBut Man is still incomplete.\n\nFrom Swayambhuva Manu (in Manu, Book I.), from whom descended the seven primitive Manus or Prajapati, each of whom gave birth to a primitive race of men, down to the Codex Nazareus, in which Karabtanos or Fetahil (blind concupiscent matter) begets on his Mother, \"Spiritus,\" seven figures, each of which stands as the progenitor of one of the primaeval seven races -- this doctrine has left its impress on every Archaic Scripture.\n\n\"Who forms Manu (the Man) and who forms his body?\n\nThe L IFE and the L IVES.\n\nSin** and the MOON.\" Here Manu stands for the spiritual, heavenly man, the real and non-dying E GO in us, which is the direct emanation of the \"One Life\" or the Absolute Deity.\n\nAs to our outward physical bodies, the house of the tabernacle of the Soul, the Doctrine teaches a strange lesson; so strange that unless thoroughly explained and as rightly comprehended, it is only the exact Science of the future that is destined to vindicate the theory fully.\n\nIt has been stated before now that Occultism does not accept anything inorganic in the Kosmos.\n\nThe expression employed by Science, \"inorganic substance,\" means simply that the latent life slumbering in the molecules of so-called \"inert matter\" is incognizable."


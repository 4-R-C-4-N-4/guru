[content]
body = "To give a Western student that classification is to try to make him suppose that he can account for the origin of consciousness, by accounting for the process by which a certain knowledge, through only one of the states of that consciousness, came to him; in other words, it is to make him account for something he knows on this plane, by something he knows nothing about on the other planes; i.e.\n\n, to lead him from the spiritual and the psychological, direct to the ontological.\n\nThis is why the primary, old, classification was adopted by the Theosophists, of which classifications there are many.\n\nTo busy oneself, after such a tremendous number of independent witnesses and proofs have been brought before the public, with an additional enumeration from theological sources, would be quite useless.\n\nThe seven capital sins and seven virtues of the Christian scheme are far less philosophical than even the Seven Liberal and the Seven Accursed Sciences -- or the Seven Arts of enchantment of the Gnostics.\n\nFor one of the latter is now before the public, pregnant with danger in the present as for the future.\n\nThe modern name for it is H YPNOTISM.\n\nIn the ignorance of the seven principles, and used by scientific and ignorant materialists, it will soon become S ATANISM in the full acceptation of the term.\n\n------"


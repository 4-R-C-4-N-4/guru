[content]
body = "continues the history, tracing the descent of life down to the appearance of Man; and thus closes the first Book of the Secret Doctrine.\n\nThe development of \"Man\" from his first appearance on this earth in this Round to the state in which we now find him will form the subject of Book II.\n\n--------------------- NOTE.\n\nThe Stanzas which form the thesis of every section are given throughout in their modern translated version, as it would be worse [[Vol.\n\n1, Page]] 23 PROEM.\n\nthan useless to make the subject still more difficult by introducing the archaic phraseology of the original, with its puzzling style and words.\n\nExtracts are given from the Chinese Thibetan and Sanskrit translations of the original Senzar Commentaries and Glosses on the Book of D ZYAN -- these being now rendered for the first time into a European language.\n\nIt is almost unnecessary to state that only portions of the seven Stanzas are here given.\n\nWere they published complete they would remain incomprehensible to all save the few higher occultists.\n\nNor is there any need to assure the reader that, no more than most of the profane, does the writer, or rather the humble recorder, understand those forbidden passages.\n\nTo facilitate the reading, and to avoid the too frequent reference to foot-notes, it was thought best to blend together texts and glosses, using the Sanskrit and Tibetan proper names whenever those cannot be avoided, in preference to giving the originals.\n\nThe more so as the said terms are all accepted synonyms, the former only being used between a Master and his chelas (or disciples).\n\nThus, were one to translate into English, using only the substantives and technical terms as employed in one of the Tibetan and Senzar versions, Verse I would read as follows: --- \"Tho-ag in Zhi-gyu slept seven Khorlo.\n\nZodmanas zhiba.\n\nAll Nyug bosom.\n\nKonch-hog not; Thyan-Kam not; Lha-Chohan not; Tenbrel Chugnyi not; Dharmakaya ceased; Tgenchang not become; Barnang and Ssa in Ngovonyidj; alone Tho-og Yinsin in night of Sun-chan and Yong-grub (Parinishpanna), &c., &c.,\" which would sound like pure Abracadabra.\n\nAs this work is written for the instruction of students of Occultism, and not for the benefit of philologists, we may well avoid such foreign terms wherever it is possible to do so.\n\nThe untranslateable terms alone, incomprehensible unless explained in their meanings, are left, but all such terms are rendered in their Sanskrit form.\n\nNeedless to remind the reader that these are, in almost every case, the late developments of the later language, and pertain to the Fifth Root-Race.\n\nSanskrit, as now known, was not spoken by the Atlanteans, and most of the philosophical terms used in the systems of the India of the post-Mahabharatan period are not found in the Vedas, nor are they to be met with in the original Stanzas, but only their equivalents.\n\nThe reader who is not a Theosophist, is once more invited to regard all that which follows as a fairy tale, if he likes; at best as one of the yet unproven speculations of [[Vol.\n\n1, Page]] 24 THE SECRET DOCTRINE.\n\ndreamers; and, at the worst, as an additional hypothesis to the many Scientific hypotheses past, present and future, some exploded, others still lingering.\n\nIt is not in any sense worse than are many of the so called Scientific theories; and it is in every case more philosophical and probable.\n\nIn view of the abundant comments and explanations required, the references to the footnotes are given in the usual way, while the sentences to be commented upon are marked with figures.\n\nAdditional matter will be found in the Chapters on Symbolism forming Part II., as well as in Part III., these being often more full of information than the text.\n\n---------------------"


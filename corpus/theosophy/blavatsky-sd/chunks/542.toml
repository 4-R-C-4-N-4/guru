body = "The \"flower of power\" is now the Lotus; what it may have been at that period, who can tell.\n\nThe writer proceeds, like the later Jeremiah, to bewail the fate of his people.\n\nThey had become bereft of their \"azure\" (celestial) kings, and \"they of the Deva hue,\" the moon-like complexion, and \"they of the refulgent (golden) face\" have gone \"to the land of bliss, the land of metal and fire\"; or -- agreeably with the rules of symbolism -- to the lands lying North and East, from whence \"the great waters have been swept away, sucked in by the earth and dissipated in the air.\" The wise races had perceived \"the black storm-dragons, called down by the dragons of wisdom\" -- and \"had fled, led on by the shining Protectors of the most Excellent Land\" -- the great ancient adepts, presumably; those the Hindus refer to as their Manus and Rishis.\n\nOne of them was Vaivasvata Manu.\n\nThey \"of the yellow hue\" are the forefathers of those whom Ethnology now classes as the Turanians, the Mongols, Chinese and other ancient nations; and the land they fled to was no other than Central Asia.\n\nThere entire new races were born; there they lived and died until the separation of the nations.\n\nBut this \"separation\" did not take place either in the localities assigned for it by modern science, nor in the way the Aryans are shown to have divided and separated by Mr.\n\nMax Muller and other Aryanists.\n\nNearly two-thirds of one million years have elapsed since that period.\n\nThe yellow-faced giants of the post-Atlantean day, had ample time, throughout this forced confinement to one part of the world, and with the same racial blood and without any fresh infusion or admixture in it, to branch off during a period of nearly 700,000 years into the most heterogeneous and diversified types.\n\nThe same is shown in Africa; nowhere does a more extraordinary variability of types exist, from black to almost white, from gigantic men to dwarfish races; and this only because of their forced isolation.\n\nThe Africans have never left their continent for several hundred thousands of years.\n\nIf to-morrow the continent of Europe were to disappear and other lands to re-emerge instead; and if the African tribes were to separate and scatter on the face of the earth, it is they who, in about a hundred thousand years hence, would form the bulk of the civilized nations.\n\nAnd it is the descendants of those of our highly cultured nations, who might have survived on some one island, without any means of crossing the new seas, that would fall back into a state of relative savagery.\n\nThus the reason given for dividing humanity into superior and inferior races falls to the ground and becomes a fallacy.\n\n[[Vol.\n\n2, Page]] 426 THE SECRET DOCTRINE.\n\nSuch are the statements made and facts given in the archaic records.\n\nCollating and comparing them with some modern theories of Evolution, minus natural selection ( Vide \"Physiological Selection\" by G.\n\nJ.\n\nRomanes, F.R.S.\n\n), these statements appear quite reasonable and logical.* Thus, while the Aryans are the descendants of the yellow Adams, the gigantic and highly civilized tlanto-Aryan race, the Semites -- and the Jews along with them -- are those of the red Adam; and both de Quatrefages and the writers of the Mosaic Genesis are right.\n\nFor, could chapter v.\n\nof the First Book of Moses be compared with the genealogies found in our Archaic Bible, the period from Adam unto Noah would be found noticed therein, of course under different names, the respective years of the Patriarchs being turned into periods, the whole being shown symbolical and allegorical.\n\nIn the MS .\n\nunder consideration many and frequent are the references to the great knowledge and civilization of the Atlantean nations, showing the polity of several of them and the nature of their arts and sciences.\n\nIf the Third Root-Race, the Lemuro-Atlanteans, are already spoken of as having been drowned \"with their high civilizations and gods\" ( \"Esoteric Buddhism,\" p.\n\n65), how much more may the same be said of the Atlanteans!\n\nIt is from the Fourth Race that the early Aryans got their knowledge of \"the bundle of wonderful things,\" the Sabha and Mayasabha, mentioned in the Mahabharata, the gift of Mayasur to the Pandavas.\n\nIt is from them that they learnt aeronautics, Viwan Vidya (the \"knowledge of flying in air-vehicles\"), and, therefore, their great arts of meteorography and meteorology.\n\nIt is from them, again, that the Aryans inherited their most valuable science of the hidden virtues of precious and other stones, of chemistry, or rather alchemy, of mineralogy, geology, physics and astronomy.\n\nSeveral times the writer has put to herself the question: \"Is the story of Exodus -- in its details at least -- as narrated in the Old Testament, original?\n\nOr is it, like the story of Moses himself and many others, simply another version of the legends told of the Atlanteans?\" For who, upon hearing the story told of the latter, will fail to perceive the great similarity of the fundamental features?\n\nThe anger of \"God\" at the obduracy of Pharaoh, his command to the \"chosen\" ones, to spoil the Egyptians, before departing, of their \"jewels of silver and jewels of gold\" (Exod.\n\nxi.); and finally the Egyptians and their Pharaoh drowned in the Red Sea (xiv.).\n\nFor here is a fragment of the earlier story from the Commentary: -- [[Footnote(s)]] ------------------------------------------------- * Vide the first pages of Part III ., S CIENCE AND THE S ECRET D OCTRINE C ONTRASTED.\n\n[[Vol.\n\n2, Page]] 427 THE DOOM OF ATLANTIS.\n\n.\n\n.\n\n.\n\n\"And the 'great King of the dazzling Face,' the chief of all the Yellow-faced, was sad, seeing the sins of the Black-faced.\n\n\"He sent his air-vehicles (Viwan) to all his brother-chiefs (chiefs of other nations and tribes) with pious men within, saying: 'Prepare.\n\nArise ye men of the good law, and cross the land while (yet) dry.' 'The Lords of the storm are approaching.\n\nTheir chariots are nearing the land.\n\nOne night and two days only shall the Lords of the Dark Face (the Sorcerers) live on this patient land.\n\nShe is doomed, and they have to descend with her.\n\nThe nether Lords of the Fires (the Gnomes and fire Elementals) are preparing their magic Agneyastra (fire-weapons worked by magic).\n\nBut the Lords of the Dark Eye (\"Evil Eye\") are stronger than they (the Elementals) and they are the slaves of the mighty ones.\n\nThey are versed in Ashtar (Vidya, the highest magical knowledge).* Come and use yours (i.e., your magic powers, in order to counteract those of the Sorcerers)."


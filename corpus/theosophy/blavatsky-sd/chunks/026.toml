body = "T HE ROOT REMAINS, THE LIGHT REMAINS, THE CURDS REMAIN, AND STILL O EAOHOO IS ONE.\n\n6.\n\nT HE ROOT OF LIFE WAS IN EVERY DROP OF THE OCEAN OF IMMORTALITY, AND THE OCEAN WAS RADIANT LIGHT, WHICH WAS FIRE, AND HEAT, AND MOTION.\n\nD ARKNESS VANISHED AND WAS NO MORE; IT DISAPPEARED IN ITS OWN ESSENCE, THE BODY OF FIRE AND WATER, OR FATHER AND MOTHER.\n\n7.\n\nB EHOLD, OH L ANOO!\n\nT HE RADIANT CHILD OF THE TWO, THE UNPARALLELED REFULGENT GLORY: B RIGHT S PACE S ON OF D ARK S PACE, WHICH EMERGES FROM THE DEPTHS OF THE GREAT DARK WATERS.\n\nI T IS O EAOHOO THE YOUNGER, THE * * * H E SHINES FORTH AS THE SON; HE IS THE BLAZING D IVINE D RAGON OF W ISDOM; THE O NE IS F OUR, AND F OUR TAKES TO ITSELF T HREE,** AND THE U NION PRODUCES THE S APTA, IN WHOM ARE THE SEVEN WHICH BECOME THE T RIDASA (OR THE HOSTS AND THE MULTITUDES).\n\nB EHOLD HIM LIFTING THE VEIL AND UNFURLING IT FROM EAST TO WEST.\n\nH E SHUTS OUT THE ABOVE, AND LEAVES THE BELOW TO BE SEEN AS THE GREAT ILLUSION.\n\nH E MARKS THE PLACES FOR THE SHINING ONES, AND TURNS THE UPPER INTO A SHORELESS SEA OF FIRE, AND THE ONE MANIFESTED INTO THE GREAT WATERS.\n\n8.\n\nW HERE WAS THE GERM AND WHERE WAS NOW DARKNESS?\n\nW HERE IS THE SPIRIT OF THE FLAME THAT BURNS IN THY LAMP, OH L ANOO?\n\nT HE GERM IS THAT, AND THAT IS LIGHT, THE WHITE BRILLIANT SON OF THE DARK HIDDEN FATHER.\n\n9.\n\nL IGHT IS COLD FLAME, AND FLAME IS FIRE, AND FIRE PRODUCES HEAT, WHICH YIELDS WATER: THE WATER OF LIFE IN THE GREAT MOTHER.\n\n10.\n\nF ATHER- M OTHER SPIN A WEB WHOSE UPPER END IS FASTENED TO SPIRIT -- THE LIGHT OF THE ONE DARKNESS -- AND THE LOWER ONE TO ITS SHADOWY END, MATTER; AND THIS WEB IS THE UNIVERSE SPUN OUT OF THE TWO SUBSTANCES MADE IN ONE, WHICH IS S VABHAVAT.\n\n[[Footnote(s)]] ------------------------------------------------- ** In the English translation from the Sanskrit the numbers are given in that language, Eka, Chatur, etc., etc.\n\nIt was thought best to give them in English.\n\n[[Vol.\n\n1, Page]] 30 THE SECRET DOCTRINE.\n\n11.\n\nI T EXPANDS WHEN THE BREATH OF FIRE IS UPON IT; IT CONTRACTS WHEN THE BREATH OF THE MOTHER TOUCHES IT.\n\nT HEN THE SONS DISSOCIATE AND SCATTER, TO RETURN INTO THEIR MOTHER'S BOSOM AT THE END OF THE GREAT DAY, AND RE-BECOME ONE WITH HER; WHEN IT IS COOLING IT BECOMES RADIANT, AND THE SONS EXPAND AND CONTRACT THROUGH THEIR OWN SELVES AND HEARTS; THEY EMBRACE INFINITUDE.\n\n12.\n\nT HEN S VABHAVAT SENDS F OHAT TO HARDEN THE ATOMS.\n\nE ACH IS A PART OF THE WEB.\n\nR EFLECTING THE \" S ELF- E XISTENT L ORD\" LIKE A MIRROR, EACH BECOMES IN TURN A WORLD.\n\n------- STANZA IV.\n\n1.\n\n.\n\n.\n\n.\n\nL ISTEN, YE S ONS OF THE E ARTH, TO YOUR INSTRUCTORS -- THE S ONS OF THE F IRE.\n\nL EARN, THERE IS NEITHER FIRST NOR LAST, FOR ALL IS ONE: NUMBER ISSUED FROM NO NUMBER.\n\n2.\n\nL EARN WHAT WE WHO DESCEND FROM THE P RIMORDIAL S EVEN, WE WHO ARE BORN FROM THE P RIMORDIAL F LAME, HAVE LEARNT FROM OUR FATHERS.\n\n.\n\n.\n\n.\n\n3.\n\nF ROM THE EFFULGENCY OF LIGHT -- THE RAY OF THE EVER-DARKNESS -- SPRUNG IN SPACE THE RE-AWAKENED ENERGIES; THE ONE FROM THE EGG, THE SIX, AND THE FIVE.\n\nT HEN THE THREE, THE ONE, THE FOUR, THE ONE, THE FIVE -- THE TWICE SEVEN THE SUM TOTAL.\n\nA ND THESE ARE THE ESSENCES, THE FLAMES, THE ELEMENTS, THE BUILDERS, THE NUMBERS, THE ARUPA, THE RUPA, AND THE FORCE OF D IVINE M AN -- THE SUM TOTAL.\n\nAND FROM THE DIVINE MAN EMANATED THE FORMS, THE SPARKS, THE SACRED ANIMALS, AND THE MESSENGERS OF THE SACRED FATHERS WITHIN THE HOLY FOUR.\n\n4.\n\nT HIS WAS THE ARMY OF THE VOICE -- THE DIVINE MOTHER OF THE SEVEN.\n\nT HE SPARKS OF THE SEVEN ARE SUBJECT TO, AND THE SERVANTS OF, THE FIRST, THE SECOND, THE THIRD, THE FOURTH, THE FIFTH, THE SIXTH, AND THE SEVENTH OF THE SEVEN.\n\nT HESE \"SPARKS\" ARE CALLED SPHERES, TRIANGLES, CUBES, LINES, AND MODELLERS; FOR THUS STANDS THE E TERNAL N IDANA -- THE O EAOHOO, WHICH IS: [[Vol.\n\n1, Page]] 31 THE SECRET DOCTRINE.\n\n5.\n\n\" D ARKNESS\" THE BOUNDLESS, OR THE NO-NUMBER, A DI- N IDANA S VABHAVAT: -- I.\n\nT HE A DI- S ANAT, THE NUMBER, FOR HE IS ONE.\n\nII.\n\nT HE VOICE OF THE L ORD S VABHAVAT, THE NUMBERS, FOR HE IS ONE AND NINE.\n\nIII.\n\nT HE \"FORMLESS SQUARE.\" A ND THESE THREE ENCLOSED WITHIN THE ARE THE SACRED FOUR; AND THE TEN ARE THE ARUPA UNIVERSE.\n\nT HEN COME THE \"SONS,\" THE SEVEN FIGHTERS, THE ONE, THE EIGHTH LEFT OUT, AND HIS BREATH WHICH IS THE LIGHT-MAKER.\n\n6.\n\nT HEN THE SECOND SEVEN, WHO ARE THE L IPIKA, PRODUCED BY THE THREE.\n\nT HE REJECTED SON IS ONE.\n\nT HE \" S ON-SUNS\" ARE COUNTLESS.\n\n------- STANZA V.\n\n1.\n\nT HE P RIMORDIAL S EVEN, THE F IRST S EVEN B REATHS OF THE D RAGON OF W ISDOM, PRODUCE IN THEIR TURN FROM THEIR H OLY C IRCUMGYRATING B REATHS THE F IERY W HIRLWIND.\n\n2."


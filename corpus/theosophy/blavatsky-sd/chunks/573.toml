[content]
body = "The earliest Zoroastrians did not believe in Evil or Darkness being co-eternal with Good or Light, and they give the same interpretation.\n\nAhriman is the manifested shadow of A HURA-MAZDA (Asura-mazda), himself issued from Zeruana Akerne \"boundless (circle of) Time\" or the Unknown Cause.\n\n\"Its glory,\" they say of the latter, \"is too exalted, its light too resplendent for either human intellect or mortal eye to grasp and see.\" Its primal emanation is eternal light, which, from having been previously concealed in D ARKNESS was called to manifest itself and thus was formed Ormazd, the \"King of Life.\" He is the \"first-born\" in BOUNDLESS TIME, but, like his own antitype (pre-existing Spiritual idea), has lived within darkness from all eternity.\n\nThe six Amshaspends (seven with himself, chief of all), the primitive Spiritual Angels and Men are collectively his Logos.\n\nThe Zoroastrian Amshaspends create the world in six days or periods also, and rest on the Seventh; whereas that Seventh is the first period or \"day,\" in esoteric philosophy, ( Primary creation in the Aryan cosmogony).\n\nIt is that intermediate AEon which is the Prologue to creation, and which stands on the borderland between the uncreated eternal Causation and the produced finite effects; a state of nascent activity and energy as the first aspect of the eternal immutable Quiescence.\n\nIn Genesis, on which no metaphysical energy has been spent, but only an extraordinary acuteness and ingenuity to veil the esoteric Truth, \"Creation\" begins at the third stage of manifestation.\n\n\"God\" or the Elohim are the \"Seven Regents\" of Pymander.\n\nThey are identical with all the other Creators.\n\nBut even in Genesis that period is hinted at by the abruptness of the picture, and the \"darkness\" that was on the face of the deep.\n\nThe Alahim are shown to \"create\" -- that is to say, to build or to produce the two or \"double heaven\" ( not Heaven and Earth); which means, in so many words, that they separated the upper manifested (angelic) heaven, or plane of consciousness, from the lower or terrestrial plane; the (to us) eternal and immutable AEons from those periods that are in space, time and duration; Heaven from Earth, the unknown from the KNOWN -- to the profane.\n\nSuch is the meaning of the sentence in Pymander, which says that: \" T HOUGHT, the divine, which is L IGHT and L IFE (Zeruana Akerne) produced through its W ORD, or first aspect,\" the other, operating T HOUGHT, which being the god of Spirit and Fire, constructed seven Regents enclosing within their circle the world of Senses, named \"fatal destiny.\" The latter refers to Karma; the \"seven circles\" are the seven planets and planes, as also the seven invisible Spirits, in the angelic spheres, whose visible symbols are the seven planets,* the [[Footnote(s)]] ------------------------------------------------- * Another proof, if any were needed, that the ancient Initiates knew of more than seven planets is to be found in the Vishnu Purana, Book II ., ch.\n\nxii., where, describing [[continued on following page]] [[Vol.\n\n2, Page]] 489 THE ONE PASSIVE DEITY.\n\nseven Rishis of the great Bear and other glyphs.\n\nAs said of the Adityas by Roth: \"they are neither sun, nor moon, nor stars, nor dawn, but the eternal sustainers of this luminous life which exists as it were behind all these phenomena.\" It is they -- the \"Seven Hosts\" -- who, having \"considered in their Father ( divine Thought) the plan of the operator,\" as says Pyrnander, desired to operate (or build the world with its creatures) likewise; for, having been born \"within the sphere of operation\" -- the manifesting Universe -- such is the Manvantaric L AW.\n\nAnd now comes the second portion of the passage, or rather of two passages merged into one to conceal the full meaning.\n\nThose who were born within the sphere of operation were \"the brothers who loved him well.\" The latter -- the \"him\" -- were the primordial angels: the Asuras, the Ahriman, the Elohim -- or \"Sons of God,\" of whom Satan was one -- all those spiritual beings who were called the \"Angels of Darkness,\" because that darkness is absolute light, a fact now neglected if not entirely forgotten in theology.\n\nNevertheless, the spirituality of those much abused \"Sons of Light\" which is Darkness, must be evidently as great in comparison with that of the Angels next in order, as the ethereality of the latter would be, when contrasted with the density of the human body.\n\nThe former are the \"First-born\"; therefore so near to the confines of pure quiescent Spirit as to be merely the \"PRIVATIONS\" -- in the Aristotelian sense -- the ferouers or the ideal types of those who followed.\n\nThey could not create material, corporeal things; and, therefore, were said in process of time to have refused to create, as commanded by \" God \" -- otherwise, TO HAVE REBELLED.\n\nPerchance, this is justified on that principle of the Scientific theory which teaches us about light and sound and the effect of two waves of equal length meeting.\n\n\"If the two sounds be of the same intensity, their coincidence produces a sound four times the intensity of either, while their interference produces absolute silence.\" Explaining some of the \"heresies\" of his day, Justin Martyr shows the identity of all the world religions at their starting points.\n\nThe first beginning opens invariably with the unknown and PASSIVE deity, from which emanates a certain active power or virtue, the Mystery that is sometimes called W ISDOM, sometimes the S ON, very often God, Angel, Lord, and L OGOS.* The latter is sometimes applied to the very first emanation, but in several systems it proceeds from the first androgyne or double ray produced at the beginning by the unseen.\n\nPhilo depicts this wisdom as male and female.\n\nBut though its first manifestation [[Footnote(s)]] ------------------------------------------------- [[Continued from preceding page]] the chariots attached to Dhruva (the pole star), Parasara speaks of \"the chariots of the NINE planets,\" which are attached by aerial cords.\n\n* Justin: \"Cum.\n\nTrypho,\" p.\n\n284.\n\n[[Vol.\n\n2, Page]] 490 THE SECRET DOCTRINE.\n\nhad a beginning, for it proceeded from Oulom* (Aion, time), the highest of the AEons when emitted from the Father, it had remained with him before all creations, for it is part of him.** Therefore, Philo Judaeus calls Adam Kadmon \"mind\" (the Ennoia of Bythos in the Gnostic system).\n\n\"The mind, let it be named Adam.*** As the old Magian books explain it, the whole event becomes clear."


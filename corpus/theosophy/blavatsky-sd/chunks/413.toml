[content]
body = "\" Such an admission must be regarded as fatal to the dogmatism of the physical Evolutionists, and as opening a wide margin to occult speculations.\n\nThe opponents of the Darwinian theory were, and still remain, polygenists.\n\nSuch \"intellectual giants\" as John Crawford and James Hunt discussed the problem and favoured polygenesis, and in their day there was a far stronger feeling in favour of than against this theory.\n\nIt is only in 1864 that Darwinians began to be wedded to the theory of unity, of which Messrs.\n\nHuxley and Lubbock became the first coryphai.\n\nAs regards that other question, of the priority of man to the animals in the order of evolution, the answer is as promptly given.\n\nIf man is really the Microcosm of the Macrocosm, then the teaching has nothing so very impossible in it, and is but logical.\n\nFor, man becomes that Macrocosm for the three lower kingdoms under him.\n\nArguing from a physical standpoint, all the lower kingdoms, save the mineral -- which is light itself, crystallised and immetallised -- from plants to the creatures which preceded the first mammalians, all have been consolidated in their physical structures by means of the \"cast-off dust\" of those minerals, and the refuse of the human matter, whether from living or dead [[Footnote(s)]] ------------------------------------------------- * A.\n\nLefevre, \"Philosophy,\" p.\n\n498.\n\n[[Vol.\n\n2, Page]] 170 THE SECRET DOCTRINE.\n\nbodies, on which they fed and which gave them their outer bodies.\n\nIn his turn, man grew more physical, by re-absorbing into his system that which he had given out, and which became transformed in the living animal crucibles through which it had passed, owing to Nature's alchemical transmutations.\n\nThere were animals in those days of which our modern naturalists have never dreamed; and the stronger became physical material man, the giants of those times, the more powerful were his emanations.\n\nOnce that Androgyne \"humanity\" separated into sexes, transformed by Nature into child-bearing engines, it ceased to procreate its like through drops of vital energy oozing out of the body.\n\nBut while man was still ignorant of his procreative powers on the human plane, (before his Fall, as a believer in Adam would say,) all this vital energy, scattered far and wide from him, was used by Nature for the production of the first mammal-animal forms.\n\nEvolution is an eternal cycle of becoming, we are taught; and nature never leaves an atom unused.\n\nMoreover, from the beginning of the Round, all in Nature tends to become Man.\n\nAll the impulses of the dual, centripetal and centrifugal Force are directed towards one point -- M AN.\n\nThe progress in the succession of beings, says Agassiz, \"consists in an increasing similarity of the living fauna, and, among the vertebrates, especially, in the increasing resemblance to man.\n\nMan is the end towards which all animal creation has tended from the first appearance of the first palaeozoic fishes.\"* Just so; but \"the palaeozoic fishes\" being at the lower curve of the arc of the evolution of forms, this Round began with astral man, the reflection of the Dhyan Chohans, called the \" Builders.\n\n\" Man is the alpha and the omega of objective creation.\n\nAs said in \" Isis Unveiled, \" \"all things had their origin in spirit -- evolution having originally begun from above and proceeding downwards, instead of the reverse, as taught in the Darwinian theory.\"** Therefore, the tendency spoken of by the eminent naturalist above quoted, is one inherent in every atom.\n\nOnly, were one to apply it to both sides of the evolution, the observations made would greatly interfere with the modern theory, which has now almost become (Darwinian) law.\n\nBut in citing the passage from Agassiz' work with approval, it must not be understood that the occultists are making any concession to the theory, which derives man from the animal kingdom.\n\nThe fact that in this Round he preceded the mammalia is obviously not impugned by the consideration that the latter (mammalia) follow in the wake of man.\n\n------- [[Footnote(s)]] ------------------------------------------------- * \" Principles of Zoology, \" p.\n\n206.\n\n** Vol.\n\nI, p.\n\n154.\n\n[[Vol.\n\n2, Page]] 171 A SUGGESTIVE EXPLANATION.\n\n25.\n\nH OW DID THE M ANASA, THE S ONS OF W ISDOM ACT?\n\nT HEY REJECTED THE S ELF-BORN, ( the boneless ) .\n\nT HEY ARE NOT READY.\n\nT HEY SPURNED THE ( First ) S WEAT- B ORN.* T HEY ARE NOT QUITE READY.\n\nT HEY WOULD NOT ENTER THE ( First ) EGG-BORN.** To a Theist or a Christian this verse would suggest a rather theological idea: that of the Fall of the Angels through Pride.\n\nIn the Secret Doctrine, however, the reasons for the refusal to incarnate in half-ready physical bodies seem to be more connected with physiological than metaphysical reasons.\n\nNot all the organisms were sufficiently ready.\n\nThe incarnating powers chose the ripest fruits and spurned the rest.*** By a curious coincidence, when selecting a familiar name for the continent on which the first androgynes, the Third Root-Race, separated, the writer chose, on geographical considerations, that of \"Lemuria,\" invented by Mr.\n\nP.\n\nL.\n\nSclater.\n\nIt is only later, that reading Haeckel's \"Pedigree of Man,\" it was found that the German \"Animalist\" had chosen the name for his late continent.\n\nHe traces, properly enough, the centre of human evolution to \"Lemuria,\" but with a slight scientific variation.\n\nSpeaking of it as that \"cradle of mankind,\" he pictures the gradual transformation of the anthropoid mammal into the primeval savage!!\n\nVogt, again, holds that in America Man sprang from a branch of the platyrrhine apes, independently of the origination of the African and Asian root-stocks from the old world catarrhinians.\n\nAnthropologists are, as usual, at loggerheads on this question, as on many others.\n\nWe shall examine this claim in the light of esoteric philosophy in Stanza VIII .\n\nMeanwhile, let us give a few moments of attention to the various consecutive modes of procreation according to the laws of Evolution.\n\nLet us begin by the mode of reproduction of the later sub-races of the Third human race, by those who found themselves endowed with the sacred fire from the spark of higher and then independent Beings, who were the psychic and spiritual parents of Man, as the lower Pitar Devata (the Pitris ) were the progenitors of his physical body."


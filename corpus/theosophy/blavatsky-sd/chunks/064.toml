body = "Our learned brother and correspondent judges apparently the Hindu religious systems by their Shastras and Puranas, probably the latter, and in their modern translation moreover, which is disfigured out of all recognition, by the Orientalists.\n\nIt is to their philosophical systems that one has to turn, to their esoteric teaching, if he would make a point of comparison.\n\nNo doubt the symbology of the Pentateuch and even of the New Testament, comes from the same source.\n\nBut surely the Pyramid of Cheops, whose measurements are all found repeated by Professor Piazzi Smythe in Solomon's alleged and mythical temple, is not of a later date than the Mosaic books?\n\nHence, if there is any such great identity as claimed, it must be due to servile copying on the part of the Jews, not on that of the Egyptians.\n\nThe Jewish glyphs -- and even their language, the Hebrew -- are not original.\n\nThey are borrowed from the Egyptians, from whom Moses got his Wisdom; from the Coptic, the probable kinsman, if not parent, of the old Phoenician and from the Hyksos, their (alleged) ancestors, as Josephus shows in his \" Against Apion ,\" I.\n\n, 25.\n\nAye; but who are the Hyksos shepherds?\n\nAnd who the Egyptians?\n\nHistory knows nothing of the question, and speculates and theorizes out of the depths of the respective consciousnesses of her historians.\n\n( See Isis Unveiled , vol.\n\nII., p.\n\n430-438.) \"Khamism, or old Coptic,\" says Bunsen, \"is from Western Asia, and contains some germ of the Semitic, thus bearing witness to the primitive cognate unity of the Aryan and Semitic races\"; and he places the great events in Egypt 9,000 years B.C .\n\nThe fact is that in archaic Esotericism and Aryan thought we find a grand philosophy, whereas in the Hebrew records we find only the most surprising ingenuity in inventing apotheoses for phallic worship and sexual theogony.\n\n[[Vol.\n\n1, Page]] 116 THE SECRET DOCTRINE.\n\nnothing to do with the classification of the septenary chain and belong to the purely aethereal, invisible worlds.\n\nThese will be noticed elsewhere.\n\nSuffice for the present to show that they are purposely referred to as though they belonged to the chain.\n\n\"Another enumeration calls the Seven worlds -- earth, sky, heaven, middle region, place of birth, mansion of the blest, and abode of truth; placing the 'Sons of Brahma' in the sixth division, and stating the fifth, or Jana Loka, to be that where animals destroyed in the general conflagration are born again.\" (see Hindu Classical Dictionary.\n\n) Some real esoteric teaching is given in the \"Symbolism.\" He who is prepared for it will understand the hidden meaning.\n\n------- STANZA V.\n\n-- Continued.\n\n3.\n\nH E IS THEIR GUIDING SPIRIT AND LEADER.\n\nW HEN HE COMMENCES WORK, HE SEPARATES THE SPARKS OF THE LOWER KINGDOM ( mineral atoms ) THAT FLOAT AND THRILL WITH JOY IN THEIR RADIANT DWELLINGS ( gaseous clouds ) , AND FORMS THEREWITH THE GERMS OF WHEELS.\n\nH E PLACES THEM IN THE SIX DIRECTIONS OF SPACE AND ONE IN THE MIDDLE -- THE CENTRAL WHEEL ( a ).\n\n( a ) \"Wheels,\" as already explained, are the centres of force, around which primordial Cosmic matter expands, and, passing through all the six stages of consolidation, becomes spheroidal and ends by being transformed into globes or spheres.\n\nIt is one of the fundamental dogmas of Esoteric Cosmogony, that during the Kalpas (or aeons) of life, MOTION, which, during the periods of Rest \"pulsates and thrills through every slumbering atom\"* (Commentary on Dzyan), assumes an evergrowing [[Footnote(s)]] ------------------------------------------------- *It may be asked, as also the writer has not failed to ask, \"Who is there to ascertain the difference in that motion, since all nature is reduced to its primal essence, and there can be no one -- not even one of the Dhyani-Chohans, who are all in Nirvana -- to see it?\" The answer to this is: \"Everything in Nature has to be judged by analogy.\n\nThough the highest Deities (Archangels or Dhyani-Buddhas) are unable to penetrate the mysteries too far beyond our planetary system and the visible Kosmos, yet there were great seers and prophets in olden times who were enabled to perceive the mystery of Breath and Motion retrospectively, when the systems of worlds were at rest and plunged in their periodic sleep.\" [[Vol.\n\n1, Page]] 117 THE ANTIQUITY OF PHYSICAL SCIENCES.\n\ntendency, from the first awakening of Kosmos to a new \"Day,\" to circular movement.\n\nThe \"Deity becomes a WHIRLWIND.\" They are also called Rotae -- the moving wheels of the celestial orbs participating in the world's creation -- when the meaning refers to the animating principle of the stars and planets; for in the Kabala, they are represented by the Ophanim, the Angels of the Spheres and stars, of which they are the informing Souls.\n\n(See Kabala Denudata , \" De Anima ,\" p.\n\n113.) This law of vortical movement in primordial matter, is one of the oldest conceptions of Greek philosophy, whose first historical Sages were nearly all Initiates of the Mysteries.\n\nThe Greeks had it from the Egyptians, and the latter from the Chaldeans, who had been the pupils of Brahmins of the esoteric school.\n\nLeucippus, and Democritus of Abdera -- the pupil of the Magi -- taught that this gyratory movement of the atoms and spheres existed from eternity.* Hicetas, Heraclides, Ecphantus, Pythagoras, and all his pupils, taught the rotation of the earth; and Aryabhata of India, Aristarchus, Seleucus, and Archimedes calculated its revolution as scientifically as the astronomers do now; while the theory of the Elemental Vortices was known to Anaxagoras, and maintained by him 500 years B.C., or nearly 2,000 before it was taken up by Galileo, Descartes, Swedenborg, and finally, with slight modifications, by Sir W.\n\nThomson.\n\n(See his \" Vortical Atoms.\n\n\") All such knowledge, if justice be only done to it, is an echo of the archaic doctrine, an attempt to explain which is now being made.\n\nHow men of the last few centuries have come to the same ideas and conclusions that were taught as axiomatic truths in the secrecy of the Adyta dozens of [[Footnote(s)]] ------------------------------------------------- *\"The doctrine of the rotation of the earth about an axis is taught by the Pythagorean Hicetas, probably as early as 500 B.C ."


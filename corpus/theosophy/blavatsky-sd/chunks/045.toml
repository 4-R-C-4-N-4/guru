[content]
body = "because, firstly, he is that which the Greek philosophers called the Logos, the Verbum of the Thought Divine; and secondly, because in Esoteric philosophy this first manifestation, being the synthesis or the aggregate of Universal Wisdom, Oeaohoo, \"the Son of the Son,\" contains in himself the Seven Creative Hosts (The Sephiroth), and is thus the essence of manifested Wisdom.\n\n\"He who bathes in the light of Oeaohoo will never be deceived by the veil of Maya.\" Kwan-Shai-Yin is identical with, and an equivalent of the Sanskrit Avalokiteshwara , and as such he is an androgynous deity, like the Tetragrammaton and all the Logoi* of antiquity.\n\nIt is only by some sects in China that he is anthropomorphized and represented with female attributes,** when, under his female aspect, he becomes Kwan-Yin, the goddess of mercy, called the \"Divine Voice.\"*** The latter is the patron deity of Thibet and of the island of Puto in China, where both deities have a number of monasteries.**** (See Part II.\n\nKwan-Shai-Yin and Kwan-yin.) [[Footnote(s)]] ------------------------------------------------- * Hence all the higher gods of antiquity are all \"Sons of the Mother\" before they become those of the \"Father.\" The Logoi, like Jupiter or Zeus, Son of Kronos-Saturn, \"Infinite Time\" (or Kala), in their origin were represented as male-female.\n\nZeus is said to be the \"beautiful Virgin,\" and Venus is made bearded.\n\nApollo is originally bisexual, so is Brahma-Vach in Manu and the Puranas.\n\nOsiris is interchangeable with Isis, and Horus is of both sexes.\n\nFinally St.\n\nJohn's vision in Revelation, that of the Logos, who is now connected with Jesus -- is hermaphrodite, for he is described as having female breasts.\n\nSo is the Tetragrammaton = Jehovah.\n\nBut there are two Avalokiteshwaras in Esotericism; the first and the second Logos.\n\n** No religious symbol can escape profanation and even derision in our days of politics and Science.\n\nIn Southern India the writer has seen a converted native making pujah with offerings before a statue of Jesus clad in woman's clothes and with a ring in his nose.\n\nWhen asking the meaning of the masquerade we were answered that it was Jesu-Maria blended in one, and that it was done by the permission of the Padri, as the zealous convert had no money to purchase two statues or \"idols\" as they, very properly, were called by a witness -- another but a non-converted Hindu.\n\nBlasphemous this will appear to a dogmatic Christian, but the Theosophist and the Occultist must award the palm of logic to the converted Hindu.\n\nThe esoteric Christos in the gnosis is, of course, sexless, but in exoteric theology he is male and female.\n\n*** The Gnostic Sophia, \"Wisdom\" who is \"the Mother\" of the Ogdoad (Aditi, in a certain sense, with her eight sons), is the Holy Ghost and the Creator of all, as in the ancient systems.\n\nThe \"father\" is a far later invention.\n\nThe earliest manifested Logos was female everywhere -- the mother of the seven planetary powers.\n\n**** See \"Chinese Buddhism,\" by the Rev.\n\nJ.\n\nC.\n\nEdkins, who always gives correct facts, although his conclusions are very frequently erroneous.\n\n[[Vol.\n\n1, Page]] 73 THE DRAGON AND THE LOGOI.\n\n( b ) \"The \"Dragon of Wisdom\" is the One, the \"Eka\" (Sanskrit) or Saka.\n\nIt is curious that Jehovah's name in Hebrew should also be One, Echod.\n\n\"His name is Echod\": say the Rabbins.\n\nThe philologists ought to decide which of the two is derived from the other -- linguistically and symbolically: surely, not the Sanskrit?\n\nThe \"One\" and the Dragon are expressions used by the ancients in connection with their respective Logoi.\n\nJehovah -- esoterically (as Elohim) -- is also the Serpent or Dragon that tempted Eve, and the \"Dragon\" is an old glyph for \"Astral Light\" (Primordial Principle), \"which is the Wisdom of Chaos.\" Archaic philosophy, recognizing neither Good nor Evil as a fundamental or independent power, but starting from the Absolute ALL (Universal Perfection eternally), traced both through the course of natural evolution to pure Light condensing gradually into form, hence becoming Matter or Evil.\n\nIt was left with the early and ignorant Christian fathers to degrade the philosophical and highly scientific idea of this emblem (the Dragon) into the absurd superstition called the \"Devil.\" They took it from the later Zoroastrians, who saw devils or the Evil in the Hindu Devas , and the word Evil thus became by a double transmutation D'Evil in every tongue (Diabolos, Diable, Diavolo, Teufel).\n\nBut the Pagans have always shown a philosophical discrimination in their symbols.\n\nThe primitive symbol of the serpent symbolised divine Wisdom and Perfection, and had always stood for psychical Regeneration and Immortality.\n\nHence -- Hermes, calling the serpent the most spiritual of all beings; Moses, initiated in the wisdom of Hermes, following suit in Genesis; the Gnostic's Serpent with the seven vowels over its head, being the emblem of the seven hierarchies of the Septenary or Planetary Creators.\n\nHence, also, the Hindu serpent Sesha or Ananta, \"the Infinite,\" a name of Vishnu, whose first Vahan or vehicle on the primordial waters is this serpent.* Yet they all made a difference between the good and the bad Serpent (the Astral Light of [[Footnote(s)]] ------------------------------------------------- * Like the logoi and the Hierarchies of Powers, however, the \"Serpents\" have to be distinguished one from the other.\n\nSesha or Ananta, \"the couch of Vishnu,\" is an allegorical abstraction, symbolizing infinite Time in Space, which contains the germ and throws off periodically the efflorescence of this germ, the manifested Universe; whereas, the gnostic Ophis contained the same triple symbolism in its seven vowels as the One, Three and Seven-syllabled Oeaohoo of the Archaic doctrine; i.e.\n\n, the One Unmanifested Logos, the Second manifested, the triangle concreting into the Quaternary or Tetragrammaton, and the rays of the latter on the material plane.\n\n[[Vol.\n\n1, Page]] 74 THE SECRET DOCTRINE.\n\nthe Kabalists) -- between the former, the embodiment of divine Wisdom in the region of the Spiritual, and the latter, Evil, on the plane of matter.* Jesus accepted the serpent as a synonym of Wisdom, and this formed part of his teaching: \"Be ye wise as serpents,\" he says."


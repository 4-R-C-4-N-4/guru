body = "The incommunicable axiom is kabalistically contained therein, and this is what is called the magic arcanum by the masters.' \" ( \"Isis Unveiled.\" ) Again: -- The (Tau), and the astronomical cross of Egypt are conspicuous in several apertures of the remains of Palenque.\n\nIn one of the basso-relievos of the Palace of Palenque, on the west side, sculptured as a hieroglyphic right under the seated figure, is a Tau.\n\nThe standing figure, which leans over the first one, is in the act of covering its head with the left hand with the veil of initiation; while it extends its right with the index and middle finger pointing to heaven.\n\nThe position is precisely that of a Christian bishop giving his blessing, or the one in which Jesus is often represented while at the Last Supper.\n\n.\n\n.\n\n.\n\nThe Egyptian Hierophant had a square head-dress which he had to wear always during his functions.\n\n.\n\n.\n\n.\n\nThe perfect Tau , formed of the perpendicular (descending male ray), and a horizontal line (matter, female principle), and the mundane circle was an attribute of Isis, and it is but at death that the Egyptian cross was laid on the breast of the mummy.\" These square hats are worn unto this day by the Armenian priests.\n\nThe claim that the cross is purely a Christian symbol introduced after our era, is strange indeed, when we find Ezekiel stamping the foreheads of the men of Judah, who feared the Lord ( Ezekiel ix.\n\n4), with the signum Thau, as it is translated in the Vulgate.\n\nIn the ancient Hebrew this sign was formed thus , but in the original Egyptian hieroglyphics as a perfect Christian cross ( Tat, the emblem of stability).\n\nIn the Revelation, also, the \"Alpha and Omega\" (spirit and matter), the first and the last, stamps the name of his Father in the foreheads of the elect, (p .\n\n323, Vol.\n\nII.\n\n) Moses, in Exodus xii .\n\n22, orders his people to mark their door-posts and lintels with blood, lest the \"Lord God\" should make a mistake and smite some of his chosen people, instead of the doomed Egyptians.\n\nAnd this mark is a tau!\n\nThe identical Egyptian handled cross, with the half of which talisman Horus raised the dead, as is shown on a sculptured ruin at Philoe.\n\nEnough was said in the text about the Swastica and the Tau.\n\nVerily may the Cross be traced back into the very depths of the unfathomable Archaic Ages!\n\nIts Mystery deepens rather than clears, as we find it on the statues of Easter Island -- in old Egypt, in Central Asia, engraved on rocks as Tau and Swastica, in pre-Christian Scandinavia, [[Vol.\n\n2, Page]] 558 THE SECRET DOCTRINE.\n\neverywhere!\n\nThe author of the \"Hebrew Egyptian Mystery\" stands perplexed before the endless shadow it throws back into antiquity, and is unable to trace it to any particular nation or man.\n\nHe shows the Targums handed down by the Hebrews, obscured by translation.\n\nIn Joshua (viii.\n\n29) read in Arabic, and in the Targum of Jonathan, it is said: \"The king of Ai he crucified upon a tree.\" The Septuagint rendering is of suspension from a double word (Wordsworth on Joshua.) .\n\n.\n\n.\n\nThe strangest expression of this kind is in Numbers xxv.\n\n4, where, by Onkalos (?) it is read: \"Crucify them before the Lord (Jehovah) against the Sun.\" \"The word here , to nail to, is rendered properly (Fuerst) by the Vulgate to crucify.\n\nThe very construction of this sentence is mystic.\" So it is, but the spirit of it has been ever misunderstood.\n\n\"To crucify before (not against) the sun\" is a phrase used of initiation.\n\nIt comes from Egypt, and primarily from India.\n\nThe enigma can be unriddled only by searching for its key in the Mysteries of Initiation.\n\nThe initiated adept, who had successfully passed through all the trials, was attached, not nailed, but simply tied on a couch in the form of a tau (in Egypt) of a Svastika without the four additional prolongations (thus: , not ) plunged in a deep sleep (the \"Sleep of Siloam\" it is called to this day among the Initiates in Asia Minor, in Syria, and even higher Egypt).\n\nHe was allowed to remain in this state for three days and three nights, during which time his Spiritual Ego was said to confabulate with the \"gods,\" descend into Hades, Amenti, or Patala, (according to the country), and do works of charity to the invisible beings, whether souls of men or Elemental Spirits; his body remaining all the time in a temple crypt or subterranean cave.\n\nIn Egypt it was placed in the Sarcophagus in the King's Chamber of the Pyramid of Cheops, and carried during the night of the approaching third day to the entrance of a gallery, where at a certain hour the beams of the rising Sun struck full on the face of the entranced candidate, who awoke to be initiated by Osiris, and Thoth the God of Wisdom.\n\nLet the reader who doubts the statement consult the Hebrew originals before he denies.\n\nLet him turn to some most suggestive Egyptian bas reliefs.\n\nOne especially from the temple of Philoe, represents a scene of initiation.\n\nTwo Gods-Hierophants, one with the head of a hawk (the Sun), the other ibis -headed (Mercury, Thoth, the god of Wisdom and secret learning, the assessor of Osiris-Sun), are standing over the body of a candidate just initiated.\n\nThey are in the act of pouring on his head a double stream of water (the water of life and new birth ) , which stream is interlaced in the shape of a cross and full of small ansated crosses.\n\nThis is allegorical of the awakening of the candidate [[Vol.\n\n2, Page]] 559 ITS EARLY SIGNIFICANCE.\n\n(now an Initiate), when the beams of the morning sun (Osiris) strike the crown of his head ( his entranced body being placed on its wooden tau so as to receive the rays ) .\n\nThen appeared the Hierophants-Initiators, and the sacramental words were pronounced, ostensibly, to the Sun-Osiris, addressed in reality to the Spirit Sun within, enlightening the newly-born man.\n\nLet the reader meditate on the connection of the Sun with the Cross in both its generative and spiritually regenerative capacities -- from the highest antiquity.\n\nLet him examine the tomb of Bait-Oxly, in the reign of Ramses II ., where he will find the crosses in every shape and position.\n\nSo again, on the throne of that sovereign, and finally on a fragment from the Hall of the ancestors of Totmes III ., preserved in the National Library of Paris, which represents the adoration of Bakhan-Aleare."


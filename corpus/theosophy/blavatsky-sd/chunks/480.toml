[content]
body = "Apart from the work already cited -- the Shan Hai King, compiled by King Chia from engravings on nine urns made 2,255 B.C ., by the Emperor Yu, they may be found in another work, called the \"Bamboo Books,\" and in a third one, the \"Rh Ya\" -- \"initiated according to tradition by Chow Kung, uncle of Wu Wang, the first Emperor of the Chow Dynasty, B.C ., 1,122\": -- says Mr.\n\nCh.\n\nGould in his \" Mythical Monsters.\n\n\" The Bamboo Books contain the ancient annals of China, found A.D .\n\n279 at the opening of the grave of King Seang of Wai, who died B.C .\n\n295.\n\nBoth these works mention men with two faces on one head -- one in front and one behind ( p .\n\n27).\n\nNow that which the students of Occultism ought to know is that THE \"THIRD EYE\" IS INDISSOLUBLY CONNECTED WITH K ARMA.\n\nThe tenet is so mysterious that very few have heard of it.\n\nThe \"eye of Siva\" did not become entirely atrophied before the close of the Fourth Race.\n\nWhen spirituality and all the divine powers and attributes of the deva-man of the Third had been made the hand-maidens of the newly-awakened physiological and psychic passions of the physical man, instead of the reverse, the eye lost its powers.\n\nBut such was the law of Evolution, and it was, in strict accuracy, no FALL.\n\nThe sin was not in using those newly-developed powers, but in misusing them; in making of the tabernacle, designed to contain a god, the fane of every spiritual iniquity.\n\nAnd if we say \"sin\" it is merely that everyone should understand our meaning; as the term Karma* would be the right one to use in this case; while the reader who would feel perplexed at the use of the term \"spiritual\" instead of \"physical\" iniquity, is reminded of the fact that there can be no physical iniquity.\n\nThe body is simply the irresponsible organ, the tool of the psychic, if not of the \"Spiritual man.\" While in the case of the Atlanteans, it was precisely the Spiritual being which sinned, the Spirit element being still the \"Master\" principle in man, in those days.\n\nThus it is in those days that the heaviest Karma of the Fifth Race was generated by our Monads.\n\nAs this sentence may again be found puzzling, it is better that it should be explained for the benefit of those who are ignorant of the theosophical teachings.\n\nQuestions with regard to Karma and re-births are constantly offered, and a great confusion seems to exist upon this subject.\n\nThose who are born and bred in the Christian faith, and have been trained in the idea [[Footnote(s)]] ------------------------------------------------- * Karma is a word of many meanings, and has a special term for almost every one of its aspects.\n\nIt means, as a synonym of sin, the performance of some action for the attainment of an object of worldly , hence selfish, desire, which cannot fail to be hurtful to somebody else.\n\nKarman is action, the Cause; and Karma again is \"the law of ethical causation\"; the effect of an act produced egotistically, when the great law of harmony depends on altruism.\n\n[[Vol.\n\n2, Page]] 303 THE NUMBER OF MONADS IS LIMITED.\n\nthat a new soul is created by God for every newly-born infant, are among the most perplexed.\n\nThey ask whether in such case the number of incarnating Monads on earth is limited; to which they are answered in the affirmative.\n\nFor, however countless, in our conceptions, the number of the incarnating monads -- even if we take into account the fact that ever since the Second Race, when their respective seven groups were furnished with bodies, several births and deaths may be allowed for every second of time in the aeons already passed -- still, there must be a limit.\n\nIt was stated that Karma-Nemesis, whose bond-maid is Nature, adjusted everything in the most harmonious manner; and that, therefore, the fresh pouring-in, or arrival of new Monads, had ceased as soon as Humanity had reached its full physical development.\n\nNo fresh Monads have incarnated since the middle-point of the Atlanteans.\n\nHence, remembering that, save in the case of young children, and of individuals whose lives were violently cut off by some accident, no Spiritual Entity can re-incarnate before a period of many centuries has elapsed, such gaps alone must show that the number of Monads is necessarily finite and limited.\n\nMoreover, a reasonable time must be given to other animals for their evolutionary progress.\n\nHence the assertion that many of us are now working off the effects of the evil Karmic causes produced by us in Atlantean bodies.\n\nThe Law of K ARMA is inextricably interwoven with that of Re-incarnation.\n\nIt is only the knowledge of the constant re-births of one and the same individuality throughout the life-cycle; the assurance that the same M ONADS -- among whom are many Dhyan-Chohans, or the \"Gods\" themselves -- have to pass through the \"Circle of Necessity,\" rewarded or punished by such rebirth for the suffering endured or crimes committed in the former life; that those very Monads, which entered the empty, senseless shells, or astral figures of the First Race emanated by the Pitris, are the same who are now amongst us -- nay, ourselves, perchance; it is only this doctrine, we say, that can explain to us the mysterious problem of Good and Evil, and reconcile man to the terrible and apparent injustice of life.\n\nNothing but such certainty can quiet our revolted sense of justice.\n\nFor, when one unacquainted with the noble doctrine looks around him, and observes the inequalities of birth and fortune, of intellect and capacities; when one sees honour paid fools and profligates, on whom fortune has heaped her favours by mere privilege of birth, and their nearest neighbour, with all his intellect and noble virtues ---far more deserving in every way --perishing of want and for lack of sympathy; when one sees all this and has to turn away, helpless to relieve the undeserved suffering, one's ears ringing and heart aching with the cries of [[Vol.\n\n2, Page]] 304 THE SECRET DOCTRINE.\n\npain around him -- that blessed knowledge of Karma alone prevents him from cursing life and men, as well as their supposed Creator.* Of all the terrible blasphemies and accusations virtually thrown on their God by the Monotheists, none is greater or more unpardonable than that (almost always) false humility which makes the presumably \"pious\" Christian assert, in connection with every evil and undeserved blow, that \"such is the will of God.\" Dolts and hypocrites!"


[content]
body = "They did hate Baal or Bacchus worship publicly, but left its worst features to be followed secretly; and it is with the Talmudic Jews that the grand symbols of nature were the most profaned.\n\nWith them, as now shown by the discovery of the key to the correct Bible reading -- Geometry, the fifth divine Science (\"fifth\" -- because it is the fifth key in the series of the Seven Keys to the Universal esoteric language and symbology) was desecrated, and by them applied to conceal the most terrestrial and grossly sexual mysteries, wherein both Deity and religion were degraded.\n\nWe are told that it is just the same with our Brahma-prajapati, with Osiris and all other creative gods.\n\nQuite so, when their rites are judged exoterically and externally; the reverse when their inner meaning is unveiled, as we see.\n\nThe Hindu Lingham is identical with \"Jacob's Pillar \" -- most undeniably.\n\nBut the difference, as said, seems to consist in that the esoteric significance of the Lingham was too truly sacred and metaphysical to be revealed to the profane and the vulgar; hence its superficial appearance was left to the speculations of the mob.\n\nNor would the Aryan Hierophant and Brahmin, in their proud exclusiveness and the satisfaction of their knowledge, go to the trouble of concealing its primeval nakedness under cunningly devised fables; whereas the Rabbi, having interpreted the symbol to suit his own tendencies, had to veil the crude significance; and this served a double purpose -- that of keeping his secret to himself and of exalting himself [[Footnote(s)]] ------------------------------------------------- * Strictly speaking, the Jews are an artificial Aryan race, born in India, and belonging to the Caucasian division.\n\nNo one who is familiar with the Armenians and the Parsis can fail to recognize in the three the same Aryan, Caucasian type.\n\nFrom the seven primitive types of the Fifth Race there now remain on Earth but three.\n\nAs Prof.\n\nW.\n\nH.\n\nFlower aptly said in 1885, \"I cannot resist the conclusion so often arrived at by various anthropologists -- that the primitive man, whatever he may have been, has in the course of ages diverged into three extreme types, represented by the Caucasian of Europe, the Mongolian of Asia, and the Ethiopian of Africa, and that all existing individuals of the species can be ranged around these types.\n\n.\n\n.\n\n.\n\n\" (The President's address at the Anthrop.\n\nInst.\n\nof Great Britain, etc.) Considering that our Race has reached its Fifth Sub-race, how can it be otherwise?\n\n[[Vol.\n\n2, Page]] 472 THE SECRET DOCTRINE.\n\nin his supposed monotheism over the heathen, whom his Law commanded him to hate.* A commandment now gladly accepted by the Christian too, in spite of another and later commandment -- \"love each other.\" Both India and Egypt had and have their sacred lotuses, symbolic of the same \"Holy of Holies\" -- the Lotus growing in the water, a double feminine symbol -- the bearer of its own seed and root of all.\n\nViraj and Horus are both male symbols, emanating from androgyne Nature, one from Brahma and his female counterpart Vach, the other, from Osiris and Isis -- never from the One infinite God.\n\nIn the Judaeo-Christian systems it is different.\n\nWhereas the lotus, containing Brahma, the Universe, is shown growing out of Vishnu's navel , the Central point in the Waters of Infinite Space, and whereas Horus springs from the lotus of the Celestial Nile -- all these abstract pantheistic ideas are dwarfed and made terrestrially concrete in the Bible: one is almost inclined to say that in the esoteric they are grosser and still more anthropomorphic, than in their exoteric rendering.\n\nTake as an example the same symbol, even in its Christian application; the lilies in the hand of the Archangel Gabriel ( Luke i.\n\n28).\n\nIn Hinduism -- the \"Holy of Holies\" is a universal abstraction, whose dramatis personae are Infinite Spirit and Nature; in Christian Judaism, it is a personal God , outside of that Nature, and the human Womb -- Eve, Sarah, etc., etc.; hence, an anthropomorphic phallic god, and his image -- man.\n\nThus it is maintained, that with regard to the contents of the Bible, one of two hypotheses has to be admitted.\n\nEither behind the symbolic substitute -- Jehovah -- there was the unknown, incognizable Diety, the Kabalistic Ain-Soph; or, the Jews have been from the beginning, no better than the dead-letter Lingham -** worshippers of the India of to-day.\n\nWe say it was the former; and that, therefore, the secret or esoteric worship of the Jews was the same Pantheism that the Vedantin philosophers are reproached with to-day; Jehovah was a substitute for purposes of an exoteric national faith, and had no importance or reality in the eyes of the erudite priests and philosophers -- the Sadducees, the [[Footnote(s)]] ------------------------------------------------- * Whenever such analogies between the Gentiles and the Jews, and later the Christians, were pointed out, it was the invariable custom of the latter to say that it was the work of the Devil who forced the Pagans to imitate the Jews for the purpose of throwing a slur on the religion of the one, true living God.\n\nTo this Faber says very justly \"Some have imagined that the Gentiles were servile copyists of the Israelites, and that each point of similitude was borrowed from the Mosaical Institutes.\n\nBut this theory will by no means solve the problem: both because we find the very same resemblance in the ceremonies of nations far different from Palestine, as we do in the rites of those who are in its immediate vicinity, and because it seems incredible that all should have borrowed from one which was universally disliked and despised.\" ( Pagan Idol.\n\nI., 104.) ** Their consecrated pillars (unhewn stones) erected by Abraham and Jacob were LINGHI.\n\n[[Vol.\n\n2, Page]] 473 THE ELOHISTIC AND JEHOVISTIC TEXTS.\n\nmost refined as the most learned of all the Israelite sects, who stand as a living proof with their contemptuous rejection of every belief, save the L AW.\n\nFor how could those who invented the stupendous scheme now known as the Bible, or their successors who knew, as all Kabalists do, that it was so invented for a popular blind -- how could they, we ask, feel reverence for such a phallic symbol and a NUMBER, as Jehovah is shown most undeniably to be in the Kabalistic works?\n\nHow could anyone worthy of the name of a philosopher, and knowing the real secret meaning of their \"pillar of Jacob,\" their Bethel, oil-anointed phalli, and their \"Brazen Serpent, \" worship such a gross symbol, and minister unto it, seeing in it their \"Covenant\" -- the Lord Himself!\n\nLet the reader turn to Gemara Sanhedrin and judge."


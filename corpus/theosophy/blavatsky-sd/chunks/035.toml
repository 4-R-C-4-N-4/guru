body = "is explained in Vishnu Purana as: \"that which is the unevolved cause, is emphatically called by the most eminent sages Pradhana, original base, which is subtile Prakriti, viz., that which is eternal, and which at once is (or comprehends) what is and what is not, or is mere process.\" \"Prakriti,\" however, is an incorrect word, and Alaya would explain it better; for Prakriti is not the \"uncognizable Brahma.\"* It is a mistake of those who know nothing of the Universality of the Occult doctrines from the very cradle of the human races, and especially so of those scholars who reject the very idea of a \"primordial revelation,\" to teach that the Anima Mundi, the One Life or \"Universal Soul,\" was made known only by Anaxagoras, or during his age.\n\nThis philosopher brought the teaching forward simply to oppose the too materialistic conceptions on Cosmogony of Democritus, based on his exoteric theory of blindly driven atoms.\n\nAnaxagoras of Clazomene was not its inventor but only its propagator, as also was Plato.\n\nThat which he called Mundane Intelligence, the nous ([[ nous ]]), the principle that according to his views is absolutely separated and free from matter and acts on design,** was called Motion, the ONE LIFE, or Jivatma , ages before the year 500 B.C.\n\nin India.\n\nOnly the Aryan philosophers never endowed the principle, which with them is infinite, with the finite \"attribute\" of \"thinking.\" This leads the reader naturally to the \"Supreme Spirit\" of Hegel and the German Transcendentalists as a contrast that it may be useful to point out.\n\nThe schools of Schelling and Fichte have diverged widely from the primitive archaic conception of an ABSOLUTE principle, and have mirrored only an aspect of the basic idea of the Vedanta.\n\nEven the \"Absoluter Geist\" shadowed forth by von Hartman in his pessimistic philosophy of the Unconscious, while it is, perhaps, the closest approximation made by European speculation to the Hindu Adwaitee Doctrines, similarly falls far short of the reality.\n\n[[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] A.D.\n\nThere was another Aryasanga, who lived during the first centuries of our era and the Hungarian scholar most probably confuses the two.\n\n* \"The indiscreet cause which is uniform, and both cause and effect, and which those who are acquainted with first principles call Pradhana and Prakriti, is the incognizable Brahma who was before all\" (Vayu Purana); i.e.\n\n, Brahma does not put forth evolution itself or create, but only exhibits various aspects of itself, one of which is Prakriti, an aspect of Pradhana.\n\n** Finite Self-consciousness, I mean.\n\nFor how can the absolute attain it otherwise than as simply an aspect , the highest of which known to us is human consciousness?\n\n[[Vol.\n\n1, Page]] 51 CAN THE FINITE CONCEIVE THE INFINITE?\n\nAccording to Hegel, the \"Unconscious\" would never have undertaken the vast and laborious task of evolving the Universe, except in the hope of attaining clear Self-consciousness.\n\nIn this connection it is to be borne in mind that in designating Spirit, which the European Pantheists use as equivalent to Parabrahm, as unconscious, they do not attach to that expression of \"Spirit\" -- one employed in the absence of a better to symbolise a profound mystery -- the connotation it usually bears.\n\nThe \"Absolute Consciousness,\" they tell us, \"behind\" phenomena, which is only termed unconsciousness in the absence of any element of personality, transcends human conception.\n\nMan, unable to form one concept except in terms of empirical phenomena, is powerless from the very constitution of his being to raise the veil that shrouds the majesty of the Absolute.\n\nOnly the liberated Spirit is able to faintly realise the nature of the source whence it sprung and whither it must eventually return.\n\n.\n\n.\n\n.\n\nAs the highest Dhyan Chohan, however, can but bow in ignorance before the awful mystery of Absolute Being; and since, even in that culmination of conscious existence -- \"the merging of the individual in the universal consciousness\" -- to use a phrase of Fichte's -- the Finite cannot conceive the Infinite, nor can it apply to it its own standard of mental experiences, how can it be said that the \"Unconscious\" and the Absolute can have even an instinctive impulse or hope of attaining clear self-consciousness?* A Vedantin would never admit this Hegelian idea; and the Occultist would say that it applies perfectly to the awakened MAHAT, the Universal Mind already projected into the phenomenal world as the first aspect of the changeless ABSOLUTE, but never to the latter.\n\n\"Spirit and Matter, or Purusha and Prakriti are but the two primeval aspects of the One and Secondless,\" we are taught.\n\nThe matter-moving Nous, the animating Soul, immanent in every atom, manifested in man, latent in the stone, has different degrees of power; and this pantheistic idea of a general Spirit-Soul pervading all Nature is the oldest of all the philosophical notions.\n\nNor was the Archaeus a discovery of Paracelsus nor of his pupil Van Helmont; for it is again the same Archaeus or \"Father-Ether,\" -- the manifested basis [[Footnote(s)]] ------------------------------------------------- * See Schwegler's \"Handbook of the History of Philosophy\" in Sterling's translation, p.\n\n28.\n\n[[Vol.\n\n1, Page]] 52 THE SECRET DOCTRINE.\n\nand source of the innumerable phenomena of life -- localised.\n\nThe whole series of the numberless speculations of this kind are but variations on this theme, the key-note of which was struck in this primeval Revelation.\n\n(See Part II., \"Primordial Substance.\") ( b ) The term Anupadaka, \"parentless,\" or without progenitors, is a mystical designation having several meanings in the philosophy.\n\nBy this name celestial beings, the Dhyan-Chohans or Dhyani-Buddhas, are generally meant.\n\nBut as these correspond mystically to the human Buddhas and Bodhisattwas, known as the \"Manushi (or human) Buddhas,\" the latter are also designated \"Anupadaka,\" once that their whole personality is merged in their compound sixth and seventh principles -- or Atma-Buddhi, and that they have become the \"diamond-souled\" (Vajra-sattvas),* the full Mahatmas.\n\nThe \"Concealed Lord\" (Sangbai Dag-po), \"the one merged with the absolute,\" can have no parents since he is Self-existent, and one with the Universal Spirit (Svayambhu),** the Svabhavat in the highest aspect."


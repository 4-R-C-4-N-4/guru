[content]
body = "The latter is either \"awake\" or \"asleep.\" The Svabhavikas, or philosophers of the oldest school of Buddhism (which still exists in Nepaul), speculate only upon the active condition of this \"Essence,\" which they call Svabhavat, and deem it foolish to theorise upon the abstract and \"unknowable\" power in its passive condition.\n\nHence they are called atheists by both Christian theologians and modern scientists, for neither of the [[Footnote(s)]] ------------------------------------------------- * Nominalists, arguing with Berkeley that \"it is impossible .\n\n.\n\n.\n\nto form the abstract idea of motion distinct from the body moving\" (\" Prin.\n\nof Human Knowledge, \" Introd ., par.\n\n10), may put the question, \"What is that body, the producer of that motion?\n\nIs it a substance?\n\nThen you are believers in a Personal God?\" etc., etc.\n\nThis will be answered farther on, in the Addendum to this Book; meanwhile, we claim our rights of Conceptionalists as against Roscelini's materialistic views of Realism and Nominalism.\n\n\"Has science,\" says one of its ablest advocates, Edward Clodd, \"revealed anything that weakens or opposes itself to the ancient words in which the Essence of all religion, past, present, and to come, is given; to do justly, to love mercy, to walk humbly before thy God?\" Provided we connote by the word God, not the crude anthropomorphism which is still the backbone of our current theology, but the symbolic conception of that which is Life and Motion of the Universe , to know which in physical order is to know time past, present, and to come, in the existence of successions of phenomena; to know which, in the moral, is to know what has been, is, and will be, within human consciousness.\n\n( See \" Science and the Emotions.\n\n\" A Discourse delivered at South Place Chapel, Finsbury, London, Dec.\n\n27 th, 1885.) [[Vol.\n\n1, Page]] 4 THE SECRET DOCTRINE.\n\ntwo are able to understand the profound logic of their philosophy.\n\nThe former will allow of no other God than the personified secondary powers which have worked out the visible universe, and which became with them the anthropomorphic God of the Christians -- the male Jehovah, roaring amid thunder and lightning.\n\nIn its turn, rationalistic science greets the Buddhists and the Svabhavikas as the \"positivists\" of the archaic ages.\n\nIf we take a one-sided view of the philosophy of the latter, our materialists may be right in their own way.\n\nThe Buddhists maintained that there is no Creator, but an infinitude of creative powers, which collectively form the one eternal substance, the essence of which is inscrutable -- hence not a subject for speculation for any true philosopher.\n\nSocrates invariably refused to argue upon the mystery of universal being, yet no one would ever have thought of charging him with atheism, except those who were bent upon his destruction.\n\nUpon inaugurating an active period, says the Secret Doctrine, an expansion of this Divine essence from without inwardly and from within outwardly, occurs in obedience to eternal and immutable law, and the phenomenal or visible universe is the ultimate result of the long chain of cosmical forces thus progressively set in motion.\n\nIn like manner, when the passive condition is resumed, a contraction of the Divine essence takes place, and the previous work of creation is gradually and progressively undone.\n\nThe visible universe becomes disintegrated, its material dispersed; and 'darkness' solitary and alone, broods once more over the face of the 'deep.' To use a Metaphor from the Secret Books, which will convey the idea still more clearly, an out-breathing of the 'unknown essence' produces the world; and an inhalation causes it to disappear.\n\nThis process has been going on from all eternity, and our present universe is but one of an infinite series, which had no beginning and will have no end.\" -- ( See \" Isis Unveiled \" ; also \" The Days and Nights of Brahma \" in Part II.\n\n) This passage will be explained, as far as it is possible, in the present work.\n\nThough, as it now stands, it contains nothing new to the Orientalist, its esoteric interpretation may contain a good deal which has hitherto remained entirely unknown to the Western student.\n\nThe first illustration being a plain disc the second one in the Archaic symbol shows , a disc with a point in it -- the first differentiation in the periodical manifestations of the ever-eternal nature, sexless and infinite \"Aditi in THAT\" (Rig Veda), the point in the disc, or potential Space within abstract Space.\n\nIn its third stage the point is transformed into a diameter, thus It now symbolises a divine immaculate Mother-Nature within the all-embracing absolute Infinitude.\n\n[[Vol.\n\n1, Page]] 5 PROEM.\n\nWhen the diameter line is crossed by a vertical one , it becomes the mundane cross.\n\nHumanity has reached its third root-race; it is the sign for the origin of human life to begin.\n\nWhen the circumference disappears and leaves only the it is a sign that the fall of man into matter is accomplished, and the FOURTH race begins.\n\nThe Cross within a circle symbolises pure Pantheism; when the Cross was left uninscribed, it became phallic.\n\nIt had the same and yet other meanings as a TAU inscribed within a circle or as a \"Thor's hammer,\" the Jaina cross, so-called, or simply Svastica within a circle By the third symbol -- the circle divided in two by the horizontal line of the diameter -- the first manifestation of creative (still passive, because feminine) Nature was meant.\n\nThe first shadowy perception of man connected with procreation is feminine, because man knows his mother more than his father.\n\nHence female deities were more sacred than the male.\n\nNature is therefore feminine, and, to a degree, objective and tangible, and the spirit Principle which fructifies it is concealed.\n\nBy adding to the circle with the horizontal line in it, a perpendicular line, the tau was formed -- -- -- the oldest form of the letter.\n\nIt was the glyph of the third root-race to the day of its symbolical Fall -- i.e.\n\n, when the separation of sexes by natural evolution took place -- when the figure became , the circle, or sexless life modified or separated -- a double glyph or symbol.\n\nWith the races of our Fifth Race it became in symbology the sacr', and in Hebrew n'cabvah, of the first-formed races;* then it changed into the Egyptian (emblem of life), and still later into the sign of Venus, Then comes the Svastica (Thor's hammer, or the \"Hermetic Cross\" now), entirely separated from its Circle, thus becoming purely phallic."


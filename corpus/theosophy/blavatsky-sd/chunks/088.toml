[content]
body = "Thus the Monads of Class 2 reach the incipient human stage only in the Second Round, and so on up to the middle of the Fourth Round.\n\nBut at this point -- and on this Fourth Round in which the human stage will be fully developed -- the \"Door\" into the human kingdom closes; and henceforward the number of \"human\" Monads, i.e.\n\n, Monads in the human stage of development, is complete.\n\nFor the Monads which had not reached the human stage by this point will, owing to the evolution of humanity itself, find themselves so far behind that they will reach the human stage only at the close of the seventh and last Round.\n\nThey will, therefore, not be men on this chain, but will form the humanity of a future Manvantara and be rewarded by becoming \"Men\" on a higher chain altogether, thus receiving their Karmic compensation.\n\nTo this there is but one solitary exception , for very good reasons, of which we shall speak farther on.\n\nBut this accounts for the difference in the races.\n\nIt thus becomes apparent how perfect is the analogy between the processes of Nature in the Kosmos and in the individual man.\n\nThe latter lives through his life-cycle, and dies.\n\nHis \"higher principles,\" corresponding in the development of a planetary chain to the cycling Monads, pass into Devachan, which corresponds to the \"Nirvana\" and states of rest intervening between two chains.\n\nThe Man's lower \"principles\" are disintegrated in time and are used by Nature again for the formation of new human principles, and the same process takes place in the disintegration and formation of Worlds.\n\nAnalogy is thus the surest guide to the comprehension of the Occult teachings.\n\nThis is one of the \"seven mysteries of the Moon,\" and it is now revealed.\n\nThe seven \"mysteries\" are called by the Japanese Yamaboosis , the mystics of the Lao-Tze sect and the ascetic monks of Kioto, the Dzenodoo -- the \"seven jewels.\" Only the Japanese and the Chinese [[Vol.\n\n1, Page]] 174 THE SECRET DOCTRINE.\n\nBuddhist ascetics and Initiates are, if possible, even more reticent in giving out their \"Knowledge\" than are the Hindus.\n\nBut the reader must not be allowed to lose sight of the Monads, and must be enlightened as to their nature, as far as permitted, without trespassing upon the highest mysteries, of which the writer does not in any way pretend to know the last or final word.\n\nThe Monadic Host may be roughly divided into three great classes: -- 1.\n\nThe most developed Monads (the Lunar Gods or \"Spirits,\" called, in India, the Pitris), whose function it is to pass in the first Round through the whole triple cycle of the mineral, vegetable, and animal kingdoms in their most ethereal, filmy, and rudimentary forms, in order to clothe themselves in, and assimilate, the nature of the newly formed chain.\n\nThey are those who first reach the human form (if there can be any form in the realm of the almost subjective) on Globe A in the first Round.\n\nIt is they, therefore, who lead and represent the human element during the second and third Rounds, and finally evolve their shadows at the beginning of the Fourth Round for the second class, or those who come behind them.\n\n2.\n\nThose Monads that are the first to reach the human stage during the three and a half Rounds, and to become men.* [[Footnote(s)]] ------------------------------------------------- * We are forced to use here the misleading word \"Men,\" and this is a clear proof of how little any European language is adapted to express these subtle distinctions.\n\nIt stands to reason that these \"Men\" did not resemble the men of to-day, either in form or nature.\n\nWhy then, it may be asked, call them \"Men\" at all?\n\nBecause there is no other term in any Western language which approximately conveys the idea intended.\n\nThe word \"Men\" at least indicates that these beings were \"MANUS,\" thinking entities, however they differed in form and intellection from ourselves.\n\nBut in reality they were, in respect of spirituality and intellection, rather \"gods\" than \"Men.\" The same difficulty of language is met with in describing the \"stages\" through which the Monad passes.\n\nMetaphysically speaking, it is of course an absurdity to talk of the \"development\" of a Monad, or to say that it becomes \"Man.\" But any attempt to preserve metaphysical accuracy of language in the use of such a tongue as the English would necessitate at least three extra volumes of this work, and would entail an amount of verbal repetition which would be wearisome in the extreme.\n\nIt stands to reason that a MONAD cannot either progress or develop, or even be affected by the changes of states it passes through.\n\nIt is not of this world or plane , and may be compared only to an indestructible star of divine light and fire, thrown down on to our [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 175 THE CLASSIFICATION OF THE MONADS.\n\n3.\n\nThe laggards; the Monads which are retarded, and which will not reach, by reason of Karmic impediments, the human stage at all during this cycle or Round, save one exception which will be spoken of elsewhere as already promised.\n\nNow the evolution of the external form or body round the astral is produced by the terrestrial forces, just as in the case of the lower kingdoms; but the evolution of the internal or real MAN is purely spiritual.\n\nIt is now no more a passage of the impersonal Monad through many and various forms of matter -- endowed at best with instinct and consciousness on quite a different plane -- as in the case of external evolution, but a journey of the \"pilgrim-soul\" through various states of not only matter but Self-consciousness and self-perception, or of perception from apperception.\n\n(See \" Gods , Monads and Atoms.\n\n\") The M ONAD emerges from its state of spiritual and intellectual unconsciousness; and, skipping the first two planes -- too near the ABSOLUTE to permit of any correlation with anything on a lower plane -- it gets direct into the plane of Mentality.\n\nBut there is no plane in the whole universe with a wider margin, or a wider field of action in its almost endless gradations of perceptive and apperceptive qualities, than this plane, which has in its turn an appropriate smaller plane for every \"form,\" from the \"mineral\" monad up to the time when that monad blossoms forth by evolution into the DIVINE MONAD.\n\nBut all the time it is still one and the same Monad, differing only in its incarnations, throughout its ever succeeding cycles of partial or total obscuration of spirit, or the partial or total obscuration of matter -- two polar antitheses -- as it ascends into the realms of mental spirituality, or descends into the depths of materiality."


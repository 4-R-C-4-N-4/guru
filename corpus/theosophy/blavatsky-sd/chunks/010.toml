[content]
body = "This statement is rendered more credible by a consideration of the following facts: the tradition of the thousands of ancient parchments saved when the Alexandrian library was destroyed; the thousands of Sanskrit works which disappeared in India in the reign of Akbar; the universal tradition in China and Japan that the true old texts with the commentaries, which alone make them comprehensible -- amounting to many thousands of volumes -- have long passed out of the reach of profane hands; the disappearance of the vast sacred and occult literature of Babylon; the loss of those keys which alone could solve the thousand riddles of the Egyptian hieroglyphic records; the tradition in India that the real secret commentaries which alone make the Veda intelligible, though no longer visible to profane eyes, still remain for the initiate, hidden in secret caves and crypts; and an identical belief among the Buddhists, with regard to their secret books.\n\nThe Occultists assert that all these exist, safe from Western spoliating hands, to re-appear in some more enlightened age, for which in the words of the late Swami Dayanand Sarasvati, \"the Mlechchhas (outcasts, savages, those beyond the pale of Aryan civilization) will have to wait.\" For it is not the fault of the initiates that these documents are now \"lost\" to the profane; nor was their policy dictated by selfishness, or [[Vol.\n\n1, Page]] xxxv INTRODUCTORY.\n\nany desire to monopolise the life-giving sacred lore.\n\nThere were portions of the Secret Science that for incalculable ages had to remain concealed from the profane gaze.\n\nBut this was because to impart to the unprepared multitude secrets of such tremendous importance, was equivalent to giving a child a lighted candle in a powder magazine.\n\nThe answer to a question which has frequently arisen in the minds of students, when meeting with statements such as this, may be outlined here.\n\n\"We can understand,\" they say, \"the necessity for concealing from the herd such secrets as the Vril, or the rock-destroying force, discovered by J.\n\nW.\n\nKeely, of Philadelphia, but we cannot understand how any danger could arise from the revelation of such a purely philosophic doctrine, as, e.g ., the evolution of the planetary chains.\" The danger was this: Doctrines such as the planetary chain, or the seven races, at once give a clue to the seven-fold nature of man, for each principle is correlated to a plane, a planet, and a race; and the human principles are, on every plane, correlated to seven-fold occult forces -- those of the higher planes being of tremendous power.\n\nSo that any septenary division at once gives a clue to tremendous occult powers, the abuse of which would cause incalculable evil to humanity.\n\nA clue, which is, perhaps, no clue to the present generation -- especially the Westerns -- protected as they are by their very blindness and ignorant materialistic disbelief in the occult; but a clue which would, nevertheless, have been very real in the early centuries of the Christian era, to people fully convinced of the reality of occultism, and entering a cycle of degradation, which made them rife for abuse of occult powers and sorcery of the worst description.\n\nThe documents were concealed, it is true, but the knowledge itself and its actual existence had never been made a secret of by the Hierophants of the Temple, wherein M YSTERIES have ever been made a discipline and stimulus to virtue.\n\nThis is very old news, and was repeatedly made known by the great adepts, from Pythagoras and Plato down to the Neoplatonists.\n\nIt was the new religion of the Nazarenes that wrought a change for the worse -- in the policy of centuries.\n\nMoreover, there is a well-known fact, a very curious one, corroborated to the writer by a reverend gentleman attached for years to a Russian Embassy -- namely, that there are several documents in the St.\n\nPeters- [[Vol.\n\n1, Page]] xxxvi INTRODUCTORY.\n\nburg Imperial Libraries to show that, even so late as during the days when Freemasonry, and Secret Societies of Mystics flourished unimpeded in Russia, i.e.\n\n, at the end of the last and the beginning of the present century, more than one Russian Mystic travelled to Tibet via the Ural mountains in search of knowledge and initiation in the unknown crypts of Central Asia.\n\nAnd more than one returned years later, with a rich store of such information as could never have been given him anywhere in Europe.\n\nSeveral cases could be cited, and well-known names brought forward, but for the fact that such publicity might annoy the surviving relatives of the said late Initiates.\n\nLet any one look over the Annals and History of Freemasonry in the archives of the Russian metropolis, and he will assure himself of the fact stated.\n\nThis is a corroboration of that which has been stated many times before, and, unfortunately, too indiscreetly.\n\nInstead of benefiting humanity, the virulent charges of deliberate invention and imposture with a purpose thrown at those who asserted but a truthful, if even a little known fact, have only generated bad Karma for the slanderers.\n\nBut now the mischief is done, and truth should no longer be denied, whatever the consequences.\n\nIs it a new religion, we are asked?\n\nBy no means; it is not a religion, nor is its philosophy new ; for, as already stated, it is as old as thinking man.\n\nIts tenets are not now published for the first time, but have been cautiously given out to, and taught by, more than one European Initiate -- especially by the late Ragon.\n\nMore than one great scholar has stated that there never was a religious founder, whether Aryan, Semitic or Turanian, who had invented a new religion, or revealed a new truth.\n\nThese founders were all transmitters, not original teachers.\n\nThey were the authors of new forms and interpretations, while the truths upon which the latter were based were as old as mankind.\n\nSelecting one or more of those grand verities -- actualities visible only to the eye of the real Sage and Seer -- out of the many orally revealed to man in the beginning, preserved and perpetuated in the adyta of the temples through initiation, during the M YSTERIES and by personal transmission -- they revealed these truths to the masses.\n\nThus every nation received in its turn some of the said truths, under the veil of its own local and special symbolism; which, as time went on, developed into a more or less philosophical cultus, a Pantheon in mythical disguise.\n\nTherefore is Confucius, a very ancient [[Vol.\n\n1, Page]] xxxvii INTRODUCTORY.\n\nlegislator in historical chronology, though a very modern Sage in the World's History, shown by Dr.\n\nLegge* -- who calls him \"emphatically a transmitter, not a maker\" -- as saying: \"I only hand on: I cannot create new things."


[content]
body = "It is, moreover, unquestionable that in the case of human incarnations the law of Karma, racial or individual, overrides the subordinate tendencies of \"Heredity,\" its servant.\n\nThe meaning of the last sentence in the above-quoted Commentary on Stanza 27, namely, that the Fourth Race were the children of Padmapani, may find its explanation in a certain letter from the Inspirer of \" Esoteric Buddhism \" quoted on p.\n\n68.\n\n\"The majority of mankind belongs to the seventh sub-race of the Fourth Root-Race -- the above-mentioned Chinamen and their off-shoots and branchlets.\n\n(Malayans, Mongolians, Tibetans, Hungarians, Finns, and even the Esquimaux are all remnants of this last offshoot.)\" Padmapani, or Avalokiteswara in Sanskrit, is, in Tibetan, Chenresi.\n\nNow, Avalokiteswara is the great Logos in its higher aspect and in the divine regions.\n\nBut in the manifested planes, he is, like Daksha, the progenitor (in a spiritual sense) of men.\n\nPadmapani-Avalokiteswara is called esoterically Bhodhisatva (or Dhyan Chohan) Chenresi Vanchug, \"the powerful and all-seeing.\" He is considered now as the greatest protector of Asia in general, and of Tibet in particular.\n\nIn order to guide the Tibetans and Lamas in holiness, and preserve the great Arhats in the world, this heavenly Being is credited with manifesting himself from age to age in human form.\n\nA popular legend has it that whenever faith begins to die out in the world, Padmapani Chenresi, the \"lotus-bearer,\" emits a brilliant ray of light, and forthwith incarnates himself in one of the two great Lamas -- the Dalai and Teschu Lamas; finally, it is believed that he will incarnate as \"the most perfect Buddha\" in Tibet, instead of in India, where his predecessors, the great Rishis and Manus had appeared in the beginning of our Race, but now appear no longer.\n\nEven the exoteric appearance of Dhyani Chenresi is suggestive of the esoteric teaching.\n\nHe is evidently, like Daksha, the synthesis of all the preceding Races and the progenitor of all the human Races after the Third, the first complete one, and thus is represented as the culmination of the four primeval races in his eleven-faced form.\n\nIt is a column built in four rows, each series having three faces or heads of different complexions: the three faces for each race being typical of its three fundamental physiological transformations.\n\nThe first is white (moon-coloured); the second is yellow; the third, red-brown; the fourth, in which are only two faces -- the third face being left a blank -- (a reference to the untimely end of the Atlanteans) is brown-black.\n\nPadmapani (Daksha) is seated on the column, and forms the apex.\n\nIn this reference [[Vol.\n\n2, Page]] 179 THE BIRTH-DAYS OF THE DHYANIS.\n\ncompare Stanza 39.\n\nThe Dhyan Chohan is represented with four arms, another allusion to the four races.\n\nFor while two are folded, the third hand holds a lotus ( Padmapani, \"the lotus-bearer\"), this flower symbolizing generation, and the fourth holds a serpent, emblem of the Wisdom in his power.\n\nOn his neck is a rosary, and on his head the sign of water -- matter, deluge -- while on his brow rests the third eye (Siva's eye, that of spiritual insight).\n\nHis name is \"Protector\" (of Tibet), \"Saviour of Humanity.\" On other occasions when he has only two arms, he is Chenresi, the Dhyani and Bhodisatva, Chakna-padmakarpo, \"he who holds a lotus.\" His other name is Chantong, \"he of the 1,000 eyes,\" when he is endowed with a thousand arms and hands, on the palm of each of which is represented an eye of Wisdom, these arms radiating from his body like a forest of rays.\n\nAnother of his names is Lokapati and Lokanatha (Sanskrit) \"Lord of the World\"; and Jigtengonpo (Tibetan), \"Protector and Saviour against evil\" of any kind.\n\nPadmapani, however, is the \"lotus-bearer\" symbolically only for the profane; esoterically, it means the supporter of the Kalpas, the last of which, the present Maha-Kalpa (the Varaha), is called Padma, and represents one half of the life of Brahma.\n\nThough a minor Kalpa, it is called Maha, \"great,\" because it comprises the age in which Brahma sprang from a lotus.\n\nTheoretically, the Kalpas are infinite, but practically they are divided and sub-divided in Space and Time, each division -- down to the smallest -- having its own Dhyani as patron or regent.\n\nPadmapani (Avalokiteshwara) becomes, in China, in his female aspect, Kwan-yin, \"who assumes any form, at pleasure, in order to save mankind.\" The knowledge of the astrological aspect of the constellations on the respective \"birth-days\" of these Dhyanis -- Amitabha (the O-mi-to Fo, of China), included: e.g.\n\n, on the 19th day of the second month, on the 17th day of the eleventh month, and on the 7th day of the third month, etc., etc.\n\n-- gives the Occultist the greatest facilities for performing what are called \"magic\" feats.\n\nThe future of an individual is seen, with all its coming events marshalled in order, in a magic mirror placed under the ray of certain constellations.\n\nBut -- beware of the reverse of the medal, S ORCERY."


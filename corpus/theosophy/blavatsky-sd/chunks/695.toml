body = "those \" periods \" and then adds: ( b ) \"Spring, professor of the Faculty of Medicine at Liege, found in a grotto near Namur, in the mountain of Chauvaux, numerous human bones ' of a race quite distinct from ours.\n\n' \" Skulls exhumed in Austria offered a great analogy with those of African negro races, according to Littre, while others, discovered on the shores of the Danube and the Rhine, resembled the skulls of the Caribs and those of the ancient inhabitants of Peru and Chili.\n\nStill, the Deluge, whether Biblical or Atlantean, was denied.\n\nBut further geological discoveries having made Gaudry write conclusively: \"Our forefathers were positively contemporaneous with the rhinoceros tichorrhinus, the hippopotamus major \"; and add that the soil called diluvial in geology \"was formed partially at least after man's apparition on earth\" -- Littre pronounced himself finally.\n\nHe then showed the necessity, before \"the resurrection of so many old witnesses,\" of rehandling all the origins, all the durations, and added that there was AN AGE hitherto unknown to study \"either at the dawn of the actual epoch or, as I believe, at the beginning of the epoch which preceded it.\n\n\" The types of the skulls found in Europe are of two kinds, as is well known: the orthognathous and the prognathous, or the Caucasian and the negro types; such as are now found only in the African and the lower savage tribes.\n\nProfessor Heer -- who argues that the facts of Botany necessitate the hypothesis of an Atlantis -- has shown that the plants of the Neolithic lake-villagers are mainly of African origin.\n\nHow did the latter come to be in Europe if there was no former point of union between Africa and Europe?\n\nHow many thousand years ago did the seventeen men live whose skeletons were exhumed in the Department of the Haute Garonne, in a squatting posture near the remains of a coal fire, with some amulets and broken crockery around them, and in company with the bear spelaeus, the Elephas primigenius, the aurochs (regarded by Cuvier as a distinct species), the Megaceros hibernicus -- all antediluvian mammals?\n\nCertainly at a most distant epoch, but not one which carries us further back than the Quaternary.\n\nA much greater antiquity for Man has yet to be proved.\n\nDr.\n\nJames Hunt, the late President of the Anthropological Society, makes it 9,000,000 years.\n\nThis man of science, at any rate, makes some approach to our esoteric computation, if we leave the first two semi-human, ethereal races, and the early Third Race out of the computation.\n\nThe question, however, arises -- who were these Palaeolithic men of the European quaternary epoch?\n\nWere they aboriginal, or the outcome of some immigration dating back into the unknown past?\n\nThe latter is the only tenable hypothesis, as all scientists agree in eliminating Europe from the category of possible \"cradles of mankind.\" Whence, then, radiated the various successive streams of \"primitive\" men?\n\n[[Vol.\n\n2, Page]] 740 THE SECRET DOCTRINE.\n\nThe earliest Palaeolithic men in Europe -- about whose origin Ethnology is silent, and whose very characteristics are but imperfectly known, though expatiated on as \"ape-like\" by imaginative writers such as Mr.\n\nGrant Allen -- were of pure Atlantean and \"Africo\"-Atlantean stocks.* (It must be borne in mind that by this time the Atlantis continent itself was a dream of the past.) Europe in the quaternary epoch was very different from the Europe of to-day, being then only in process of formation.\n\nIt was united to N.\n\nAfrica -- or rather what is now N.\n\nAfrica -- by a neck of land running across the present Straits of Gibraltar -- N.\n\nAfrica thus constituting a species of extension of Spain, while a broad sea washed the great basin of the Sahara.\n\nOf the great Atlantis, the main bulk of which sank in the Miocene, there remained only Ruta and Daitya and a stray island or so.\n\nThe Atlantean connections of the forefathers** of the Palaeolithic cave-men are evidenced by the upturning of fossil skulls (in Europe) reverting closely to the West Indian Carib and ancient Peruvian type -- a mystery indeed to all those who refuse to sanction the \"hypothesis\" of a former Atlantic continent to bridge the ocean (Cf.\n\n\"Scientific and geological proofs of the reality of several submerged continents\").\n\nWhat are we also to make of the fact that while de Quatrefages points to that \" magnificent race, \" the TALL Cro-Magnon cave-men and the Guanches of the Canary Islands as representatives of one type -- Virchow also allies the Basques with the latter in a similar way?\n\nProfessor Retzius independently proves the relationship of the aboriginal American dolichocephalous tribes and these same Guanches.\n\nThe several links in the chain of evidence are securely joined together.\n\nLegions of similar facts could be adduced.\n\nAs to the African tribes -- themselves diverging offshoots of Atlanteans modified by climate and conditions -- they crossed into Europe over the peninsula which made the Mediterranean an inland sea.\n\nFine races were many of these European cave-men; the Cro-Magnon, for instance.\n\nBut, as was to be expected, progress is almost non-existent through the whole of the vast period allotted [[Footnote(s)]] ------------------------------------------------- * \"Whence they (the old cave-men) came, we cannot tell \" (Grant Allen).\n\n\" The palaeolithic hunters of the Somme Valley did not originate in that inhospitable climate, but moved into Europe from some more genial region -- (Dr.\n\nSouthall \" Epoch of the Mammoth \" p.\n\n315).\n\n** The pure Atlantean stocks -- of which the tall quaternary cave-men were, in part, the direct descendants -- immigrated into Europe long prior to the Glacial Period; in fact as far back as the Pliocene and Miocene times in the Tertiary.\n\nThe worked Miocene flints of Thenay, and the traces of Pliocene man discovered by Professor Capellini in Italy, are witnesses to the fact.\n\nThese colonists were portions of the once glorious race, whose cycle from the Eocene downwards had been running down the scale.\n\n[[Vol.\n\n2, Page]] 741 A TARDY ADMISSION.\n\nby Science to the Chipped Stone-Age.* The cyclic impulse downwards weighs heavily on the stocks thus transplanted -- the incubus of the Atlantean Karma is upon them.\n\nFinally, Palaeolithic man makes room for his successor -- and disappears almost entirely from the scene.\n\nProfessor Lefevre asks in this connection: -- \"Has the Polished succeeded the Chipped Stone-Age by an imperceptible transition, or was it due to an invasion of brachycephalous Celts?"


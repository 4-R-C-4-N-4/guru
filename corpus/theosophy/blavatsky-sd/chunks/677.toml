body = "2, Page]] 699 THE ADEPT-ASTRONOMER.\n\nScience knows as little as of the men from other planets.\n\nWith the exception of Flammarion and a few mystics among astronomers, even the habitableness of other planets is mostly denied.\n\nYet such great adept astronomers were the Scientists of the earliest races of the Aryan stock, that they seem to have known far more about the races of Mars and Venus than the modern Anthropologist knows of those of the early stages of the Earth.\n\nLet us leave modern Science aside for a moment and turn to ancient knowledge.\n\nAs we are assured by Archaic Scientists that all such geological cataclysms -- from the upheaval of oceans, deluges, and shifting of continents, down to the present year's cyclones, hurricanes, earthquakes, volcanic eruptions, tidal waves, and even the extraordinary weather and seeming shifting of seasons which perplexes all European and American meteorologists -- are due to, and depend on the moon and planets; aye, that even modest and neglected constellations have the greatest influence on the meteorological and cosmical changes, over, and within our earth, let us give one moment's attention to our sidereal despots and rulers of our globe and men.\n\nModern Science denies any such influence; archaic Science affirms it.\n\nWe may see what both say with regard to this question.\n\n------- B .\n\nO N C HAINS OF P LANETS AND THEIR P LURALITY.\n\nDid the Ancients know of worlds besides their own?\n\nWhat are the data of the Occultists in affirming that every globe is a septenary chain of worlds -- of which only one member is visible -- and that these are, were, or will be, \"man-bearing,\" just as every visible star or planet is?\n\nWhat do they mean by \"a moral and physical influence\" of the sidereal worlds on our globes?\n\nSuch are the questions often put to us, and they have to be considered from every aspect.\n\nTo the first of the two queries the answer is: -- We believe it because the first law in nature is uniformity in diversity, and the second -- analogy.\n\n\"As above, so below.\" That time is gone by for ever, when, although our pious ancestors believed that our earth was in the centre of the universe, the church and her arrogant servants could insist that we should regard as a blasphemy the supposition that any other planet could be inhabited.\n\nAdam and Eve, the Serpent, and the Original Sin followed by atonement through blood, have been too long in the way, and thus was universal truth sacrificed to the insane conceit of us little men.\n\n[[Vol.\n\n2, Page]] 700 THE SECRET DOCTRINE.\n\nNow what are the proofs thereof?\n\nExcept inferential evidence and logical reasoning, there are none for the profane.\n\nTo the Occultists, who believe in the knowledge acquired by countless generations of Seers and Initiates, the data offered in the Secret Books are all-sufficient.\n\nThe general public needs other proofs, however.\n\nThere are some Kabalists and even some Eastern Occultists, who, failing to find uniform evidence upon this point in all the mystic works of the nations, hesitate to accept the teaching.\n\nEven such \"uniform evidence\" will be forthcoming presently.\n\nMeanwhile, we may approach the subject from its general aspect, and see whether belief in it is so very absurd, as some scientists along with other Nicodemuses would have it.\n\nUnconsciously, perhaps, in thinking of a plurality of inhabited \" Worlds ,\" we imagine them to be like the globe we inhabit and peopled by beings more or less resembling ourselves.\n\nAnd in so doing we are only following a natural instinct.\n\nIndeed, so long as the enquiry is confined to the life-history of this globe we can speculate on this question with some profit, and ask ourselves what were the \" Worlds \" spoken of in all the ancient scriptures of Humanity, with some hope of at least asking an intelligible question.\n\nBut how do we know ( a ) what kind of Beings inhabit the globes in general; and ( b ) whether those who rule planets superior to our own, do not exercise the same influence on our earth consciously, that we may exercise unconsciously -- say on the small planets (planetoids or asteroids) in the long run, by our cutting the Earth to pieces, opening canals, and thereby entirely changing our climates.\n\nOf course, like Caesar's wife, the planetoids cannot be affected by our suspicion.\n\nThey are too far, etc., etc.\n\nBelieving in esoteric astronomy, however, we are not so sure of that.\n\nBut when, extending our speculations beyond our planetary chain, we try to cross the limits of the solar system, then indeed we act as do presumptuous fools.\n\nFor -- while accepting the old Hermetic axiom: \"As above, so below\" -- we may well believe that as Nature on Earth displays the most careful economy, utilizing every vile and waste thing in her marvellous transformations, and withal never repeating herself -- we may justly conclude that there is no other globe in all her infinite systems so closely resembling this earth that the ordinary powers should be able to imagine and reproduce its semblance and containment.* [[Footnote(s)]] ------------------------------------------------- * We are taught that the highest Dhyan Chohans, or Planetary Spirits (beyond the cognizance of the law of analogy), are in ignorance of what lies beyond the visible planetary systems, since their essence cannot assimilate itself to that of worlds beyond our solar system.\n\nWhen they reach a higher stage of evolution these other universes will be open to them; meanwhile they have complete knowledge of all the worlds within and beneath the limits of our solar system.\n\n[[Vol.\n\n2, Page]] 701 STATES OF CONSCIOUSNESS.\n\nAnd indeed we find in the romances as in all the so-called scientific fictions and spiritistic revelations from moon, stars, and planets, merely fresh combinations or modifications of the men and things, the passions and forms of life with which we are familiar, when even on the other planets of our own system nature and life are entirely different from ours.\n\nSwedenborg was pre-eminent in inculcating such an erroneous belief.\n\nBut even more.\n\nThe ordinary man has no experience of any state of consciousness other than that to which the physical senses link him.\n\nMen dream; they sleep the profound sleep which is too deep for dreams to impress the physical brain; and in these states there must still be consciousness.\n\nHow, then, while these mysteries remain unexplored, can we hope to speculate with profit on the nature of globes which, in the economy of nature, must needs belong to states of consciousness other and quite different from any which man experiences here?\n\nAnd this is true to the letter.\n\nFor even great adepts (those initiated of course), trained seers though they are, can claim thorough acquaintance with the nature and appearance of planets and their inhabitants belonging to our solar system only."


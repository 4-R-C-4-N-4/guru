[content]
body = "B.] -- according to his organic capacities.\n\n( e ) It is the guiding Force in the Cosmic and terrestrial elements.\n\nIt resides in the Fire provoked out of its latent into active being; for the whole of the seven subdivisions of the * * * principle reside in the terrestrial Fire.\n\nIt whirls in the breeze, blows with the hurricane, and sets the air in motion, which element participates in one of its principles also.\n\nProceeding cyclically, it regulates the motion [[Footnote(s) -------------------------------------------------]] * In \"Vishnu\" and other Puranas.\n\n** See the Hermetic \"Nature,\" \"Going down cyclically into matter when she meets 'heavenly man.' \" [[Vol.\n\n1, Page]] 292 THE SECRET DOCTRINE.\n\nof the water, attracts and repels the waves* according to fixed laws of which its seventh principle is the informing soul.\n\n( f ) Its four higher principles contain the germ that develops into the Cosmic Gods; its three lower ones breed the lives of the Elements ( Elementals ) .\n\n( g ) In our Solar world, the One Existence is Heaven and the Earth, the Root and the flower, the Action and the Thought.\n\nIt is in the Sun, and is as present in the glow-worm.\n\nNot an atom can escape it.\n\nTherefore, the ancient Sages have wisely called it the manifested God in Nature .\n\n.\n\n.\n\n.\" It may be interesting, in this connection, to remind the reader of what Mr.\n\nSubba Row said of the Forces -- mystically defined.\n\nSee \" Five Years of Theosophy \" and \"The Twelve Signs of the Zodiac.\" Thus he says: \"Kanya (the sixth sign of the Zodiac, or Virgo ) means a Virgin, and represents Sakti or Mahamaya.\n\nThe sign .\n\n.\n\n.\n\nis the 6th Rasi or division, and indicates that there are six primary forces in Nature (synthesized by the Seventh)\" .\n\n.\n\n.\n\nThese Sakti stand as follows: - (1.) P ARASAKTI.\n\nLiterally the great or Supreme Force or power.\n\nIt means and includes the powers of light and heat.\n\n(2.) J NANASAKTI.\n\n.\n\n.\n\n.\n\nThe power of intellect, of real Wisdom or Knowledge.\n\nIt has two aspects: The following are some of its manifestations when placed under the influence or control of material conditions.\n\n(a) The power of the mind in interpreting our sensations.\n\n(b) Its power in recalling past ideas (memory) and raising future expectation.\n\n(c) Its power as exhibited in what are called by modern psychologists \"the laws of association,\" which enables it to form persisting connections between various groups of sensations and possibilities of sensations, and thus generate the notion or idea of an external object.\n\n(d) Its power in connecting our ideas together by the mysterious link of memory, and thus generating the notion of self or individuality; some of its manifestations when liberated from the bonds of matter are -- ( a ) Clairvoyance, ( b ) Psychometry.\n\n(3.) I TCHASAKTI -- the power of the Will.\n\nIts most ordinary manifesta- [[Footnote(s) -------------------------------------------------]] * The writers of the above knew perfectly well the physical cause of the tides, of the waves, etc.\n\nIt is the informing Spirit of the whole Cosmic solar body that is meant here, and which is referred to whenever such expressions are used from the mystic point of view.\n\n[[Vol.\n\n1, Page]] 293 THE SEVEN POWERS.\n\ntion is the generation of certain nerve currents which set in motion such muscles as are required for the accomplishment of the desired object.\n\n(4.) K RIYASAKTI.\n\nThe mysterious power of thought which enables it to produce external, perceptible, phenomenal results by its own inherent energy.\n\nThe ancients held that any idea will manifest itself externally if one ' s attention is deeply concentrated upon it.\n\nSimilarly an intense volition will be followed by the desired result.\n\nA Yogi generally performs his wonders by means of Itchasakti and Kriyasakti.\n\n(5.) K UNDALINI S AKTI.\n\nThe power or Force which moves in a curved path.\n\nIt is the Universal life-Principle manifesting everywhere in nature.\n\nThis force includes the two great forces of attraction and repulsion.\n\nElectricity and magnetism are but manifestations of it.\n\nThis is the power which brings about that \"continuous adjustment of internal relations to external relations \" which is the essence of life according to Herbert Spencer, and that \" continuous adjustment of external relations to internal relations \" which is the basis of transmigration of souls, punar janman (re-birth) in the doctrines of the ancient Hindu philosophers.\n\nA Yogi must thoroughly subjugate this power before he can attain Moksham.\n\n.\n\n.\n\n.\n\n(6.) M ANTRIKA-SAKTI.\n\nThe force or power of letters, speech or music.\n\nThe Mantra Shastra has for its subject-matter this force in all its manifestations.........\n\nThe influence of melody is one of its ordinary manifestations.\n\nThe power of the ineffable name is the crown of this Sakti.\n\nModern Science has but partly investigated the first, second and fifth of the forces above named, but is altogether in the dark as regards the remaining powers.\n\nThe six forces are in their unity represented by the \" Daiviprakriti \" (the Seventh, the light of the L OGOS).\n\nThe above is quoted to show the real Hindu ideas on the same.\n\nIt is all esoteric, though not covering the tenth part of what might be said.\n\nFor one, the six names of the Six Forces mentioned are those of the six Hierarchies of Dhyan Chohans synthesized by their Primary, the seventh, who personify the Fifth Principle of Cosmic Nature, or of the \"Mother\" in its Mystical Sense.\n\nThe enumeration alone of the yogi Powers would require ten volumes.\n\nEach of these Forces has a living Conscious Entity at its head, of which entity it is an emanation.\n\n[[Vol.\n\n1, Page]] 294 THE SECRET DOCTRINE.\n\nBut let us compare with the commentary just cited the words of Hermes, the \"thrice great\":-- \"The creation of Life by the Sun is as continuous as his light; nothing arrests or limits it.\n\nAround him, like an army of Satellites, are innumerable choirs of genii.\n\nThese dwell in the neighbourhood of the Immortals, and thence watch over human things.\n\nThey fulfil the will of the gods (Karma) by means of storms, tempests, transitions of fire and earthquakes; likewise by famines and wars, for the punishment of impiety.* .\n\n.\n\n.\n\nIt is the sun who preserves and nourishes all creatures; and even as the Ideal World which environs the sensible world fills this last with the plenitude and universal variety of forms, so also the Sun, enfolding all in his light, accomplishes everywhere the birth and development of creatures.\" .\n\n.\n\n.\n\n\" Under his orders is the choir of Genii, or rather the choirs, for there are many and diverse, and their number corresponds to that of the stars.\n\nEvery star has its genii, good and evil by nature, or rather by their operation, for operation is the essence of the genii."


body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n1 [[Vol.\n\n1, Page]] 579 ANTIQUITY OUR GREAT MASTER.\n\nXII.\n\nANCIENT THOUGHT IN MODERN DRESS.\n\nM ODERN S CIENCE IS ANCIENT THOUGHT DISTORTED, and no more.\n\nWe have seen, however, WHAT INTUITIONAL SCIENTISTS THINK, and are busy about; and now the reader may be given a few more proofs of the fact that more than one F.R.S.\n\nis unconsciously approaching the derided Secret Sciences.\n\nWith regard to cosmogony and primeval matter, modern speculations are undeniably ancient thought, improved by contradictory theories of recent origin.\n\nBut the whole foundation belongs to Grecian and Indian Archaic astronomy and physics, in those days always called philosophy.\n\nIn all the Aryan and Greek speculations, one meets with the conception of an all-pervading, unorganized, and homogeneous matter, or Chaos , re-named by modern scientists \"Nebular condition of the world-stuff.\" What Anaxagoras called \"Chaos\" in his Homoiomeria is now called \"primitive fluid\" by Sir W.\n\nThomson.\n\nThe Hindu and Greek Atomists -- Kanada, Leucippus, Democritus, Epicurus, Lucretius, etc., etc., are now reflected as in a clear mirror, in the supporters of the atomic theory of our modern days, beginning with Leibnitz's Monads , and ending with the \"Vortical Atoms\" of Sir W.\n\nThomson.* True, the corpuscular theory of old is rejected, and the undulatory theory has taken its place.\n\nBut the question is, whether the latter is so firmly established as not to be liable to be dethroned as was its predecessor?\n\nLight from its metaphysical aspect was fully treated of in \" Isis Unveiled \": -- \"Light is the first begotten, and the first emanation of the Supreme, and Light is Life, says the Evangelist and the Kabalist.\n\nBoth are electricity -- the life principle, the anima mundi , pervading the universe, the electric vivifier of all things.\n\nLight is the great Protean magician, and under the divine will of the architect,** or rather the architects , the \"Builders\" (called One collectively), its multifarious, omnipotent waves gave birth to every form as well as to every living being.\n\nFrom its swelling electric bosom, spring matter and spirit.\n\nWithin its beams lie the beginnings of all physical and chemical action, and of all cosmic and spiritual phenomena; it vitalizes and disorganizes; it gives life and produces death, and from its primordial point gradually emerged into existence the myriads of worlds, visible and invisible celestial bodies.\n\nIt was at the ray of this First mother, one in three, that \"God,\" according to [[Footnote(s)]] ------------------------------------------------- * The Elemental Vortices inaugurated by the Mind have not been improved by their modern transformation.\n\n** I have been often taken to task for using expressions in Isis denoting belief in a personal and anthropomorphic God.\n\nThis is not my idea.\n\nKabalistically speaking, the \"Architect\" is the generic name for the Sephiroth , the Builders of the Universe, as the \"Universal Mind\" represents the collectivity of the Dhyan Chohanic Minds.\n\n[[Vol.\n\n1, Page]] 580 THE SECRET DOCTRINE.\n\nPlato, lighted a fire which we now call the sun,\"* and which is not the cause of either light or heat, but merely the focus, or, as we might say, the lens, by which the rays of the primordial light become materialised, are concentrate upon our Solar System, and produce all the correlations of forces.\" This is the Ether , as just explained in the views of Metcalfe, repeated by Dr.\n\nRichardson, save the submission of the former to some details of the modern undulatory theory.\n\nWe do not say that we deny the theory, but assert only that it needs completion and re-arrangement.\n\nBut the Occultists are by no means the only heretics in this respect; for Mr.\n\nRobert Hunt, F.R.S., remarks, in his Researches on Light in its Chemical Relations , that: -- .\n\n.\n\n.\n\n.\n\n\"the undulatory theory does not account for the results of his experiments.\n\nSir David Brewster, in his Treatise on Optics , showing 'that the colours of vegetable life arise .\n\n.\n\n.\n\n.\n\nfrom a specific attraction which the particles of these bodies exercise over the differently-coloured rays of light,' and that 'it is by the light of the sun that the coloured juices of plants are elaborated, that the colours of bodies are changed, etc.\n\n.\n\n.\n\n.\n\n.' remarks that it is not easy to allow 'that such effects can be produced by the mere vibration of an ethereal medium.' And he is forced , he says, 'by this class of facts, to reason as if light was material (?).' Professor Josiah P.\n\nCooke, of Harvard University, says that he 'cannot agree .\n\n.\n\n.\n\n.\n\nwith those who regard the wave-theory of light as an established principle of science.'** Herschell's doctrine, that the intensity of light, in effect of each undulation, 'is inversely as the square of the distance from the luminous body,' if correct, damages a good deal, if it does not kill the undulatory theory.\n\nThat he is right, was proved repeatedly by experiments with photometers; and though it begins to be much doubted, the undulatory theory is still alive.\" (\" Isis Unveiled .\") To this remark of Sir W.\n\nBrewster -- \"forced to reason as if light was material\" -- there is a good deal to reply.\n\nLight, in one sense, is certainly as material as electricity itself is.\n\nAnd if electricity is not material, if it is only \"a mode of motion,\" how is it that it can be stored up in Faure's accumulators?\n\nHelmholtz says that electricity must be as atomic as matter; and Mr.\n\nW.\n\nCrookes, F.R.S., supported the view in his address to the Chemical Section of the British Association, of which he was President (at Birmingham, 1886).\n\nThis is what Helmholtz says ( in his Faraday Lectures , 1881): -- \"If we accept the hypothesis that the elementary substances are composed of atoms, we cannot avoid concluding that electricity also, positive as well as negative, is divided into definite elementary portions, which behave like atoms of electricity.\" Here we have to repeat that which was already said in Section IX: there is but one science that can henceforth direct modern research into the one path which will lead to the discovery of the whole, hitherto [[Footnote(s)]] ------------------------------------------------- * \"Timaeus.\" ** Modern Chemistry.\n\n[[Vol.\n\n1, Page]] 581 A CHASE AFTER THE PRIMAL MATTER.\n\noccult, truth, and it is the youngest of all -- chemistry , as it now stands reformed.\n\nThere is no other, not excluding astronomy, that can so unerringly guide scientific intuition, as chemistry can."


[content]
body = "It is the vertebrata in which it is the most prominent and objective, and in man it is [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] and ethereal without; the second, psycho-spiritual mentally, and ethero-physical bodily; the third, still bereft of intellect in its beginning, is astro-physical in its body, and lives an inner life, in which the psycho-spiritual element is in no way interfered with as yet by the hardly nascent physiological senses.\n\nIts two front eyes look before them without seeing either past or future.\n\nBut the \"third eye\" \" embraces ETERNITY.\n\n\" * But in a very different manner to that pictured by Haeckel as an \" evolution by natural selection in the struggle for existence \" (\" Pedigree of Man.\n\n\" \" Sense Organs, \" p.\n\n335).\n\nThe mere \"thermal sensibility of the skin,\" to hypothetical light-waves, is absurdly incompetent to account for the beautiful combination of adaptations present in the eye.\n\nIt has, moreover, been previously shown that \"natural Selection\" is a pure myth when credited with the origination of variations ( vide infra, Part III., on Darwinian mechanical causation ); as the \"survival of the fittest\" can only take place after useful variations have sprung up, together with improved organisms.\n\nWhence came the \"useful variations,\" which developed the eye?\n\nOnly from \"blind forces .\n\n.\n\n.\n\nwithout aim, without design?\" The argument is puerile.\n\nThe true solution of the mystery is to be found in the impersonal Divine Wisdom, in its I DEATION -- reflected through matter.\n\n** Palaeontology has ascertained that in the animals of the Cenozoic age -- the Saurians especially, such as the antediluvian Labyrinthodon, whose fossil skull exhibits a perforation otherwise inexplicable -- the third, or odd eye must have been much developed.\n\nSeveral naturalists, among others E.\n\nKorscheldt, feel convinced that whereas, notwithstanding the opaque skin covering it, such an eye in the reptiles of the present period can only distinguish light from darkness (as the human eyes do when bound with a handkerchief, or even tightly closed), in the now extinct animals that eye functioned and was a real organ of vision.\n\n[[Vol.\n\n2, Page]] 300 THE SECRET DOCTRINE.\n\nmost carefully hidden and inaccessible, except to the anatomist.\n\nNo less light is thrown thereby on the future physical, spiritual, and intellectual state of mankind, in periods corresponding on parallel lines with other past periods, and always on the lines of ascending and descending cyclic evolution and development.\n\nThus, a few centuries before the Kali yuga -- the black age which began nearly 5,000 years ago -- it was said (paraphrased into comprehensible sentences): \" We (the Fifth Root-Race) in our first half (of duration) onward (on the now ASCENDING arc of the cycle) are on the mid point of (or between) the First and the Second Races -- falling downward ( i.e., the races were then on the descending arc of the cycle).\n\n.\n\n.\n\n.\n\n.\n\nCalculate for thyself, Lanoo, and see.\n\n\" (Commentary xx.).\n\nCalculating as advised, we find that during that transitional period -- namely, in the second half of the First Spiritual ethero-astral race -- nascent mankind was devoid of the intellectual brain element.\n\nAs it was on its descending line, and as we are parallel to it, on the ascending, we are, EVOLUTION OF ROOT RACES IN THE FOURTH ROUND therefore devoid of the Spiritual element, which is now replaced by the intellectual.\n\nFor, remember well, as we are in the manasa period of our cycle of races, or in the Fifth, we have, therefore, crossed the meridian point of the perfect adjustment of Spirit and Matter -- or that equilibrium between brain intellect and Spiritual perception.\n\nOne important point has, however, to be borne in mind.\n\n[[Vol.\n\n2, Page]] 301 THE ODD EYE IS NOW A GLAND.\n\nWe are only in the Fourth Round, and it is in the Fifth that the full development of Manas, as a direct ray from the Universal MAHAT -- a ray unimpeded by matter -- will be finally reached.\n\nNevertheless, as every sub-race and nation have their cycles and stages of developmental evolution repeated on a smaller scale, it must be the more so in the case of a Root-Race.\n\nOur race then has, as a Root-race, crossed the equatorial line and is cycling onward on the Spiritual side; but some of our sub-races still find themselves on the shadowy descending arc of their respective national cycles; while others again -- the oldest -- having crossed their crucial point, which alone decides whether a race, a nation, or a tribe will live or perish, are at the apex of spiritual development as sub-races.\n\nIt becomes comprehensible now why the \"odd eye\" has been gradually transformed into a simple gland, after the physical Fall of those we have agreed to call the \"Lemurians.\" It is a curious fact that it is especially in human beings that the cerebral hemispheres and the lateral ventricles have been developed, and that the optic thalami, corpora quadrigemina, and corpora striata are the principal parts which are developed in the mammalian brain.\n\nMoreover it is asserted that the intellect of any man may to some extent be gauged by the development of the central convolutions and the fore part of the cerebral hemispheres.\n\nIt would seem a natural corollary that if the development and increased size of the pineal gland may be considered to be an index of the astral capacities and spiritual proclivities of any man, there will be a corresponding development of that part of the cranium, or an increase in the size of the pineal gland at the expense of the hinder part of the cerebral hemispheres.\n\nIt is a curious speculation which would receive a confirmation in this case.\n\nWe should see, below and behind, the cerebellum which has been held to be the seat of all the animal proclivities of a human being, and which is allowed by science to be the great centre for all the physiologically co-ordinated movements of the body, such as walking, eating, etc., etc.; in front, the fore-part of the brain -- the cerebral hemispheres -- the part especially connected with the development of the intellectual powers in man; and in the middle, dominating them both, and especially the animal functions, the developed pineal gland, in connection with the more highly evolved, or spiritual man.\n\nIt must be remembered that these are only physical correspondences; just as the ordinary human brain is the registering organ of memory, but not memory itself.\n\nThis is, then, the organ which gave rise to so many legends and traditions, among others to that of man with one head but two faces.\n\nThese may be found in several Chinese works, besides being referred to in the [[Vol.\n\n2, Page]] 302 THE SECRET DOCTRINE.\n\nChaldean fragments."


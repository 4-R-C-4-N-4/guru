body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n2 [[Vol.\n\n2, Page]] 630 THE SECRET DOCTRINE.\n\n[[Page continued from previouis section ]] F.\n\nT HE S EVEN S OULS OF THE E GYPTOLOGISTS.\n\nIf one turns to those wells of information, \" The Natural Genesis \" and the Lectures of Mr.\n\nGerald Massey, the proofs of the antiquity of the doctrine under analysis become positively overwhelming.\n\nThat the belief of the author differs from ours can hardly invalidate the facts.\n\nHe views the symbol from a purely natural standpoint, one perhaps a trifle too materialistic, because too much that of an ardent Evolutionist and follower of the modern Darwinian dogmas.\n\nThus he shows that \"the student of Bohme's books finds much in them concerning these Seven Fountain Spirits and primary powers, treated as seven properties of nature in the alchemistic and astrological phase of the mediaeval mysteries;\"* and adds -- \"The followers of Bohme look on such matter as divine revelation of his inspired Seership.\n\nThey know nothing of the natural genesis, the history and persistence of the Wisdom** of the past (or of the broken links), and are unable to recognise the physical features of the ancient Seven Spirits beneath their modern metaphysical or alchemist mask.\n\nA second connecting link between the Theosophy of Bohme and the physical origins of Egyptian thought, is extant in the fragments of Hermes Trismegistus.*** No matter whether these teachings are called Illuminatist, Buddhist, Kabalist, Gnostic, Masonic, or Christian, the elemental types can only be truly known in their beginnings.**** When the prophets or visionary showmen of cloudland come to us claiming original inspiration, and utter something new, we judge of its value by what it is in itself.\n\nBut if we find they bring us the ancient matter which they cannot account for, and we can, it is natural that we should judge it by the primary significations rather than the latest pretensions.***** It is useless for us to read our [[Footnote(s)]] ------------------------------------------------- * The Natural Genesis, Vol.\n\nI..\n\npp, 318-319.\n\n** Yet there are some, who may know something of these, even outside the author's lines, wide as they undeniably are.\n\n*** This connecting link, like others, was pointed out by the present writer nine years before the appearance of the work from which the above is quoted, namely in Isis Unveiled, a work full of such guiding links between ancient, mediaeval, and modern thought, but, unfortunately, too loosely edited.\n\n**** Ay; but how can the learned writer prove that these \"beginnings\" were precisely in Egypt, and nowhere else; and only 50,000 years ago?\n\n***** Precisely: and this is just what the Theosophists do.\n\nThey have never claimed,\" (original inspiration,\" not even as mediums, but have always pointed, and do now point to the \"primary signification\" of the symbols, which they trace to other [[Continued on next page]] [[Vol.\n\n2, Page]] 631 THE SIDEREAL SEVEN.\n\nlater thought into the earliest types of expression, and then say the ancients meant that.* Subtilized interpretations which have become doctrines and dogmas in theosophy have now to be tested by their genesis in physical phenomena, in order that we may explode their false pretensions to supernatural origin or supernatural knowledge.* But the able author of the \"Book of the Beginnings\" and of \" The Natural Genesis \" does -- very fortunately, for us -- quite the reverse.\n\nHe demonstrates most triumphantly our Esoteric (Buddhist) teachings, by showing them identical with those of Egypt.\n\nLet the reader judge from his learned lecture on \"The Seven Souls of Man.\"** Says the author: -- \"The first form of the mystical S EVEN was seen to be figured in heaven by the Seven large stars of the great Bear, the constellation assigned by the Egyptians to the Mother of Time, and of the Seven Elemental Powers.\" Just so, for the Hindus place in the great Bear their seven primitive Rishis and call this constellation the abode of the Saptarishi, Riksha and Chitra-Sikhandinas.\n\nBut whether it is only an astronomical myth or a primordial mystery, having a deeper meaning than it bears on its surface, is what their adepts claim to know.\n\nWe are also told that \"the Egyptians divided the face of the sky by night into seven parts.\n\nThe primary Heaven was seven-fold.\" So it was with the Aryans.\n\nOne has but read the Puranas about the beginnings of Brahma, and his \"Egg\" to see it.\n\nHave the Aryans taken the idea from the Egyptians?\n\n-- \"The earliest forces,\" proceeds the lecturer, \"recognized in nature were reckoned as seven in number.\n\nThese became seven elementals, devils (?) or later, divinities.\n\nSeven properties were assigned to nature, as [[Footnote(s)]] ------------------------------------------------- [[Continued from previous page]] countries, older even than Egypt; significations, moreover, which emanate from a hierarchy (or hierarchies, if preferred) of living wise men , mortals, notwithstanding that Wisdom, who reject every approach to supernaturalism.\n\n* But where is the proof that the ancients did not mean precisely that which the theosophists claim?\n\nRecords exist for what they say, just as other records exist for what Mr.\n\nG.\n\nMassey says.\n\nHis interpretations are very correct, but equally one-sided.\n\nSurely nature has more than one physical aspect; for astronomy, astrology, and so on, are all on the physical, not the spiritual plane.\n\n** It is to be feared that Mr.\n\nMassey has not succeeded.\n\nWe have our followers as he has his followers, and materialistic Science steps in and takes little account of both his and our speculations!\n\nThe fact that this learned Egyptologist does not recognise in the doctrine of the \"Seven Souls,\" as he terms our principles, or \"metaphysical concepts,\" but \"the primitive biology or physiology of the Soul,\" does not invalidate our argument.\n\nThe lecturer touches on only two keys, those that unlock the astronomical and the physiological mysteries of esotericism, and leaves out the other five.\n\nOtherwise he would have promptly understood that what he calls the physiological divisions of the living Soul of man, are regarded by theosophists as also psychological and spiritual.\n\n[[Vol.\n\n2, Page]] 632 THE SECRET DOCTRINE.\n\nmatter, cohesion, fluxion, coagulation, accumulation, station, and division and seven elements or souls to man.\n\n\" All this was taught in the esoteric doctrine, but it was interpreted and its mysteries unlocked, as already stated, with seven, not two, or at the utmost, three keys; hence the causes and their effects worked in invisible or mystic as well as psychic nature, and were made referable to metaphysics and psychology as much as to physiology.\n\n\"The principle of sevening \" -- as the author says -- \"was introduced, and the number seven supplied a sacred type that could be used for manifold purposes \" ; and it was so used."


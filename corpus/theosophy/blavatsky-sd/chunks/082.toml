[content]
body = "From the foregoing table it will be seen that the third principle in the Buddhist classification is not separately mentioned in the Vedantic division, as it is merely the vehicle of Prana.\n\nIt will also be seen that the Fourth principle is included in the third Kosa (Sheath), as the same principle is but the vehicle of will-power, which is but an energy of the mind.\n\nIt must also be noticed that the Vignanamaya Kosa is considered to be distinct from the Manomaya Kosa, as a division is made after death between the lower part of the mind, as it were, which has a closer affinity with the fourth principle than with the sixth; and its higher part, which attaches itself to the latter, and which is, in fact, the basis for the higher spiritual individuality of man.\n\nWe may also here point out to our readers that the classification mentioned in the last column is, for all practical purposes, connected with Raja Yoga, the best and simplest.\n\nThough there are seven principles in man, there are but three distinct Upadhis (bases), in each of which his Atma may work independently of the rest.\n\nThese three Upadhis can be separated by an Adept without killing himself.\n\nHe cannot separate the seven principles from each other without destroying his constitution.\" The student will now be better prepared to see that between the three Upadhis of the Raja Yoga and its Atma, and our three Upadhis, Atma, and the additional three divisions, there is in reality but very little difference.\n\nMoreover, as every adept in cis-Himalayan or trans-Himalayan India, of the Patanjali, the Aryasanga or the Mahayana schools, has to become a Raja Yogi, he must, therefore, accept the Taraka Raja classification in principle and theory whatever classification he resorts to for practical and occult purposes.\n\nThus, it matters very little whether one speaks of the three Upadhis with their three aspects and Atma, the eternal and immortal synthesis, or calls them the \"seven principles.\" For the benefit of those who may not have read, or, if they have, may not have clearly understood, in Theosophical writings, the doctrine of the septenary chains of worlds in the Solar Kosmos, the teaching is briefly thus: -- 1.\n\nEverything in the metaphysical as in the physical Universe is septenary.\n\nHence every sidereal body, every planet, whether visible [[Vol.\n\n1, Page]] 159 THE TRANSMIGRATIONS OF THE EGO.\n\nor invisible, is credited with six companion globes.\n\n(See Diagram No.\n\n3, after verse 6 of this commentary.) The evolution of life proceeds on these seven globes or bodies from the 1st to the 7th in Seven R OUNDS or Seven Cycles.\n\n2.\n\nThese globes are formed by a process which the Occultists call the \"rebirth of planetary chains (or rings).\" When the seventh and last Round of one of such rings has been entered upon, the highest or first globe \"A,\" followed by all the others down to the last, instead of entering upon a certain time of rest -- or \"obscuration,\" as in their previous Rounds -- begins to die out.\n\nThe \"planetary\" dissolution ( pralaya ) is at hand, and its hour has struck; each globe has to transfer its life and energy to another planet.\n\n(See diagram No.\n\n2 infra , \"The Moon and the Earth.\") 3.\n\nOur Earth, as the visible representative of its invisible superior fellow globes, its \"lords\" or \"principles\" (see diagram No.\n\n1), has to live, as have the others, through seven Rounds.\n\nDuring the first three, it forms and consolidates; during the fourth it settles and hardens; during the last three it gradually returns to its first ethereal form: it is spiritualised, so to say.\n\n4.\n\nIts Humanity develops fully only in the Fourth -- our present Round.\n\nUp to this fourth Life-Cycle, it is referred to as \"humanity\" only for lack of a more appropriate term.\n\nLike the grub which becomes chrysalis and butterfly, Man, or rather that which becomes man, passes through all the forms and kingdoms during the first Round and through all the human shapes during the two following Rounds.\n\nArrived on our Earth at the commencement of the Fourth in the present series of life-cycles and races, MAN is the first form that appears thereon, being preceded only by the mineral and vegetable kingdoms -- even the latter having to develop and continue its further evolution through man.\n\nThis will be explained in Book II.\n\nDuring the three Rounds to come, Humanity, like the globe on which it lives, will be ever tending to reassume its primeval form, that of a Dhyan Chohanic Host.\n\nMan tends to become a God and then -- G OD, like every other atom in the Universe.\n\n\"Beginning so early as with the 2nd round, Evolution proceeds already on quite a different plan.\n\nIt is only during the 1st round that (heavenly) man becomes a human being on globe A (rebecomes) a mineral, a plant, an animal, on globe B and C, etc.\n\nThe process changes [[Vol.\n\n1, Page]] 160 THE SECRET DOCTRINE.\n\nentirely from the second round -- but you have learned prudence .\n\n.\n\n.\n\nand I advise you to say nothing before the time for saying it has come.\n\n.\n\n.\" (Extract from the Teacher's letters on various topics.) 5.\n\nEvery life-cycle on Globe D (our Earth)* is composed of seven root-races.\n\nThey commence with the Ethereal and end with the spiritual on the double line of physical and moral evolution -- from the beginning of the terrestrial round to its close.\n\n(One is a \"planetary round\" from Globe A to Globe G, the seventh; the other, the \"globe round,\" or the terrestrial ) .\n\nThis is very well described in \"Esoteric Buddhism\" and needs no further elucidation for the time being.\n\n6.\n\nThe first root-race, i.e.\n\n, the first \"men\" on earth (irrespective of form) were the progeny of the \"celestial men,\" called rightly in Indian philosophy the \"Lunar Ancestors\" or the Pitris, of which there are seven classes or Hierarchies.\n\nAs all this will be sufficiently explained in the following sections and in Book II., no more need be said of it here.\n\nBut the two works already mentioned, both of which treat of subjects from the occult doctrine, need particular notice.\n\n\"Esoteric Buddhism\" is too well known in Theosophical circles, and even to the outside world, for it to be necessary to enter at length upon its merits here.\n\nIt is an excellent book, and has done still more excellent work.\n\nBut this does not alter the fact that it contains some mistaken notions, and that it has led many Theosophists and lay-readers to form an erroneous conception of the Secret Eastern Doctrines.\n\nMoreover it seems, perhaps, a little too materialistic."


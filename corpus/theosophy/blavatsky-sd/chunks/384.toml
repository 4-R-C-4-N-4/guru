[content]
body = "First comes En-Soph, the \"Concealed of the Concealed,\" then the Point, Sephira and the later Sephiroth; then the Atzilatic World, a World of Emanations that gives birth to three other worlds -- called the Throne, the abode of pure Spirits; the second, the World of Formation, or Jetzira, the habitat of the Angels who sent forth the Third, or World of Action, the Asiatic World, which is the Earth or our World; and yet it is said of it that this world, also called Kliphoth, containing the (six other) Spheres, [[diagram]], and matter, is the residence of the \"Prince of Darkness.\" This is as clearly stated as can be; for Metatron, the Angel of the second or Briatic World, means Messenger [greek char], Angel, called the great Teacher; and under him are the Angels of the third World, Jetzira, whose ten and seven classes are the Sephiroth,* of whom it is said that \"they inhabit and vivify this world as Essential Entities and Intelligences, whose correlatives and contraries inhabit the third or Asiatic World.\n\n\" These \"Contraries\" are called \"the Shells, \" [[daigam]], or demons,** who inhabit the seven habitations called Sheba Hachaloth, which are simply the seven zones of our globe.\n\nTheir prince is called in the Kabala Samael, the Angel of Death, who is also the seducing serpent Satan; but that Satan is also Lucifer, the bright angel of Light, the Light and Life-bringer, the \"Soul\" alienated from the Holy Ones, the other angels, and for a period, anticipating the time when they would have descended on Earth to incarnate in their turn.\n\n\"The Souls (Monads) are pre-existent in the world of Emanations,\" ( Book of Wisdom viii., 20); and the Zohar teaches that in the \"Soul\" \"is the real man, i.e., the Ego and the conscious I AM: ' Manas.\n\n' \" \"They descend from the pure air to be chained to bodies, \" says Josephus repeating the belief of the Essenes ( De Bello Judaeo, 11, 12) .\n\n\"The air is full of Souls,\" states Philo, \" they descend to be tied to mortal bodies, being desirous to live in them.\n\n\" ( De Gignat, 222 c.; De Somniis, p.\n\n455)***; because through, and in, the human form they will become progressive beings, whereas the nature of the angel is purely intransitive, therefore man has in him the potency of transcending the faculties of the Angels.\n\nHence the Initiates in India say that it is the Brahmin, the twice-born, who rules the gods or devas; and Paul repeated it in [[Footnote(s)]] ------------------------------------------------- * See Vol.\n\n1.\n\nPart III., \" Gods, Monads and Atoms.\n\n\" It is symbolised in the Pythagorean Triangle, the 10 dots within, and the seven points of the Triangle and the Cube.\n\n** Whence the Kabalistic name of Shells given to the astral form, the body called Kama Rupa, left behind by the higher angels in the shape of the higher Manas, when the latter leaves for Devachan, forsaking its residue.\n\n*** Which shows that the Essenes believed in re-birth and many reincarnations on Earth, as Jesus himself did, a fact we can prove from the New Testament itself.\n\n[[Vol.\n\n2, Page]] 112 THE SECRET DOCTRINE.\n\nI Corinthians vi., 3: \"Know ye not that we (the Initiates) shall judge angels\"?\n\nFinally, it is shown in every ancient scripture and Cosmogony that man evolved primarily as a luminous incorporeal form, over which, like the molten brass round the clay model of the sculptor, the physical frame of his body was built by, through, and from, the lower forms and types of animal terrestrial life.\n\n\"The Soul and the Form when descending on Earth put on an earthly garment,\" says the Zohar.\n\nHis protoplastic body was not formed of that matter of which our mortal frames are fashioned.\n\n\"When Adam dwelt in the garden of Eden, he was clothed in the celestial garment, which is the garment of heavenly light.\n\n.\n\n.\n\n.\n\nlight of that light which was used in the garden of Eden ,\" ( Zohar II 229 B ) .\n\n\"Man (the heavenly Adam) was created by the ten Sephiroth of the Jetziric world, and by the common power they (the seven angels of a still lower world) engendered the earthly Adam .\n\n.\n\n.\n\n.\n\nFirst Samael fell, and then deceiving (?) man, caused his fall also.\" ( b ) The sentence: \"They were the shadows of the shadows of the Lords,\" i.e.\n\n, the progenitors created man out of their own astral bodies, explains an universal belief.\n\nThe Devas are credited in the East with having no shadows of their own.\n\n\"The devas cast no shadows,\" and this is the sure sign of a good holy Spirit.\n\nWhy had they \"no fire or water of their own\"?* Because: -- ( c ) That which Hydrogen is to the elements and gases on the objective plane, its noumenon is in the world of mental or subjective phenomena; since its trinitarian latent nature is mirrored in its three [[Footnote(s)]] ------------------------------------------------- * It is corroborated, however, as we have shown, by the esotericism of Genesis.\n\nNot only are the animals created therein after the \"Adam of Dust,\" but vegetation is shown in the Earth before \"the heavens and the Earth were created.\" \"Every plant of the field before it (the day that the heavens and the Earth were made, v.\n\n4) was in the Earth\" (v.\n\n5).\n\nNow, unless the Occult interpretation is accepted, which shows that in this 4th Round the Globe was covered with vegetation, and the first ( astral ) humanity was produced before almost anything could grow and develop thereon, what can the dead letter mean?\n\nSimply that the grass was in the earth of the Globe before that Globe was created?\n\nAnd yet the meaning of verse 6, which says that \"there went up a mist from the Earth\" and watered the whole face of the Earth before it rained, and caused the trees, etc., to grow, is plain enough.\n\nIt shows also in what geological period it occurred, and further what is meant by \"Heaven and Earth.\" It meant the firmament and dry incrustated land, separated and ridden of its vapours and exhalations.\n\nMoreover, the student must bear in mind that, as Adam Kadmon, \"the male and female being\" of Genesis, ch.\n\nI., is no physical human being but the host of the Elohim, among which was Jehovah himself -- so the animals mentioned in that chapter as \"created\" before man in the dead letter text, were no animals, but the Zodiacal signs and other sidereal bodies.\n\n[[Vol."


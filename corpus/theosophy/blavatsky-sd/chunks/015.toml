body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n1 [[Vol.\n\n1, Page 1]] PROEM ------- PAGES FROM A PRE-HISTORIC PERIOD.\n\nA N Archaic Manuscript -- a collection of palm leaves made impermeable to water, fire, and air, by some specific unknown process -- is before the writer's eye.\n\nOn the first page is an immaculate white disk within a dull black ground.\n\nOn the following page, the same disk, but with a central point.\n\nThe first, the student knows to represent Kosmos in Eternity, before the re-awakening of still slumbering Energy, the emanation of the Word in later systems.\n\nThe point in the hitherto immaculate Disk, Space and Eternity in Pralaya, denotes the dawn of differentiation.\n\nIt is the Point in the Mundane Egg (see Part II., \"The Mundane Egg\"), the germ within the latter which will become the Universe, the ALL, the boundless, periodical Kosmos, this germ being latent and active, periodically and by turns.\n\nThe one circle is divine Unity, from which all proceeds, whither all returns.\n\nIts circumference -- a forcibly limited symbol, in view of the limitation of the human mind -- indicates the abstract, ever incognisable PRESENCE, and its plane, the Universal Soul, although the two are one.\n\nOnly the face of the Disk being white and the ground all around black, shows clearly that its plane is the only knowledge, dim and hazy though it still is, that is attainable by man.\n\nIt is on this plane that the Manvantaric manifestations begin; for it is in this SOUL that slumbers, during the Pralaya, the Divine Thought,* wherein lies concealed the plan of every future Cosmogony and Theogony.\n\n[[Footnote(s)]] ------------------------------------------------- * It is hardly necessary to remind the reader once more that the term \"Divine Thought,\" like that of \"Universal Mind,\" must not be regarded as even vaguely shadowing forth an intellectual process akin to that exhibited by man.\n\nThe \"Unconscious,\" according to von Hartmann, arrived at the vast creative, or rather Evolutionary Plan, \"by a clairvoyant wisdom superior to all consciousness,\" which in the Vedantic language would mean absolute Wisdom.\n\nOnly those who realise how far Intuition soars above the tardy processes of ratiocinative thought can form the faintest conception of [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 2 THE SECRET DOCTRINE.\n\nIt is the ONE LIFE, eternal, invisible, yet Omnipresent, without beginning or end, yet periodical in its regular manifestations, between which periods reigns the dark mystery of non-Being; unconscious, yet absolute Consciousness; unrealisable, yet the one self-existing reality; truly, \"a chaos to the sense, a Kosmos to the reason.\" Its one absolute attribute, which is ITSELF, eternal, ceaseless Motion, is called in esoteric parlance the \"Great Breath,\"* which is the perpetual motion of the universe, in the sense of limitless, ever-present SPACE.\n\nThat which is motionless cannot be Divine.\n\nBut then there is nothing in fact and reality absolutely motionless within the universal soul.\n\nAlmost five centuries B.C.\n\nLeucippus, the instructor of Democritus, maintained that Space was filled eternally with atoms actuated by a ceaseless motion, the latter generating in due course of time, when those atoms aggregated, rotatory motion, through mutual collisions producing lateral movements.\n\nEpicurus and Lucretius taught the same, only adding to the lateral motion of the atoms the idea of affinity -- an occult teaching.\n\nFrom the beginning of man's inheritance, from the first appearance of the architects of the globe he lives in, the unrevealed Deity was recognised and considered under its only philosophical aspect -- universal motion, the thrill of the creative Breath in Nature.\n\nOccultism sums up the \"One Existence\" thus: \"Deity is an arcane, living (or moving) FIRE, and the eternal witnesses to this unseen Presence are Light, Heat, Moisture,\" -- this trinity including, and being the cause of, every [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] that absolute Wisdom which transcends the ideas of Time and Space.\n\nMind, as we know it, is resolvable into states of consciousness, of varying duration, intensity, complexity, etc.\n\n-- all, in the ultimate, resting on sensation, which is again Maya.\n\nSensation, again, necessarily postulates limitation.\n\nThe personal God of orthodox Theism perceives, thinks, and is affected by emotion; he repents and feels \"fierce anger.\" But the notion of such mental states clearly involves the unthinkable postulate of the externality of the exciting stimuli, to say nothing of the impossibility of ascribing changelessness to a Being whose emotions fluctuate with events in the worlds he presides over.\n\nThe conceptions of a Personal God as changeless and infinite are thus unpsychological and, what is worse, unphilosophical.\n\n* Plato proves himself an Initiate, when saying in Cratylus that [[ theos ]] is derived from the verb [[ theein ]], \"to move,\" \"to run,\" as the first astronomers who observed the motions of the heavenly bodies called the planets [[ theoi ]], the gods.\n\n(See Book II., \"Symbolism of the Cross and Circle.\") Later, the word produced another term, [[ aletheia ]] -- \"the breath of God.\" [[Vol.\n\n1, Page]] 3 PROEM.\n\nphenomenon in Nature.* Intra-Cosmic motion is eternal and ceaseless; cosmic motion (the visible, or that which is subject to perception) is finite and periodical.\n\nAs an eternal abstraction it is the EVER-PRESENT; as a manifestation, it is finite both in the coming direction and the opposite, the two being the alpha and omega of successive reconstructions.\n\nKosmos -- the NOUMENON -- has nought to do with the causal relations of the phenomenal World.\n\nIt is only with reference to the intra-cosmic soul, the ideal Kosmos in the immutable Divine Thought, that we may say: \"It never had a beginning nor will it have an end.\" With regard to its body or Cosmic organization, though it cannot be said that it had a first, or will ever have a last construction, yet at each new Manvantara, its organization may be regarded as the first and the last of its kind, as it evolutes every time on a higher plane .\n\n.\n\n.\n\n.\n\nA few years ago only, it was stated that: -- \"The esoteric doctrine teaches, like Buddhism and Brahminism, and even the Kabala, that the one infinite and unknown Essence exists from all eternity, and in regular and harmonious successions is either passive or active.\n\nIn the poetical phraseology of Manu these conditions are called the \"Days\" and the \"Nights\" of Brahma."


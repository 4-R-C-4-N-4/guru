body = "1, Page]] 645 ANCIENT AND MODERN PROPHECIES.\n\nand tribe, like their Eastern brethren of the Fifth Race, their Golden and their Iron ages, their period of comparative irresponsibility, or the Satya age of purity, while now, several of them have reached their Iron Age, the Kali-Yuga , an age B LACK WITH H ORRORS.\n\n.\n\n.\n\n.\n\n.\n\nIt is true, on the other hand, that the exoteric cycles of every nation have been correctly made to be derived from, and depend on, sidereal motions.\n\nThe latter are inseparably blended with the destinies of nations and men.\n\nBut in their purely physical sense, Europe knows of no other cycles than the astronomical, and makes its computations accordingly.\n\nNor will it hear of any other than imaginary circles or circuits in the starry heavens that gird them -- \"With centric and eccentric scribbled o'er Cycle and epicycle, orb in orb .\n\n.\n\n.\" But with the pagans, with whom, as Coleridge has it -- \".\n\n.\n\n.\n\n.\n\n.\n\nTime, cyclical time, was their abstraction of the Deity .\n\n.\" that \"Deity\" manifesting co-ordinately with, and only through Karma, and being that KARMA-NEMESIS itself, the cycles meant something more than a mere succession of events, or a periodical space of time of more or less prolonged duration.\n\nFor they were generally marked with recurrences of a more varied and intellectual character than are exhibited in the periodical return of seasons or of certain constellations.\n\nModern wisdom is satisfied with astronomical computations and prophecies based on unerring mathematical laws.\n\nAncient Wisdom added to the cold shell of astronomy the vivifying elements of its soul and spirit -- ASTROLOGY.\n\nAnd, as the sidereal motions do regulate and determine other events on Earth -- besides potatoes and the periodical disease of that useful vegetable -- (a statement which, not being amenable to scientific explanation, is merely derided, while accepted) -- those events have to be allowed to find themselves predetermined by even simple astronomical computations.\n\nBelievers in astrology will understand our meaning, sceptics will laugh at the belief and mock the idea.\n\nThus they shut their eyes, ostrich-like, to their own fate.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.* [[Footnote(s)]] ------------------------------------------------- * Not all, however, for there are men of Science awakening to truth.\n\nThis is what we read: \"Whatever way we turn our eyes we encounter a mystery .\n\n.\n\n.\n\n.\n\nall in Nature for us is the unknown .\n\n.\n\n.\n\nYet they are numerous, those superficial minds for whom nothing can be produced by natural forces outside of facts observed long ago, consecrated in books and grouped more or less skilfully with the help of theories whose ephemeral duration ought, by this time, to have demonstrated their insufficiency, .\n\n.\n\n.\n\n.\n\nI do not pretend to contest the possibility of invisible Beings , of a nature different from ours and susceptible of moving matter to action.\n\nProfound philosophers have admitted it in all epochs as a consequence of the great law of continuity which rules the Universe.\n\nThat intellectual life, which we see starting in some way from non-being ( neant ) and gradually reaching man, can it stop abruptly at man to reappear only in the infinite, in the sovereign regulator of the world?\n\nThis is little probable.\" Therefore .\n\n.\n\n\"I [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 646 THE SECRET DOCTRINE.\n\nThis because their little historical period, so called, allows them no margin for comparison.\n\nSidereal heaven is before them; and though their spiritual vision is still unopened and the atmospheric dust of terrestrial origin seals their sight and chains it to the limits of physical systems, still they do not fail to perceive the movements and note the behaviour of meteors and comets.\n\nThey record the periodical advents of those wanderers and \"flaming messengers,\" and prophesy, in consequence, earthquakes, meteoric showers, the apparition of certain stars, comets, etc., etc.\n\nAre they soothsayers for all that?\n\nNo, they are learned astronomers.\n\nWhy, then, should occultists and astrologers, as learned, be disbelieved, when they prophesy the return of some cyclic event on the same mathematical principle?\n\nWhy should the claim that they know it be ridiculed?\n\nTheir forefathers and predecessors, having recorded the recurrence of such events in their time and day, throughout a period embracing hundreds of thousands of years, the conjunction of the same constellations must necessarily produce, if not quite the same, at any rate, similar effects.\n\nAre the prophecies derided, because of the claim of the hundreds of thousands of years of observation, and the millions of years of the human races?\n\nIn its turn modern Science is laughed at for its far more modest geological and anthropological figures, by those who hold to Biblical chronology.\n\nThus Karma adjusts even human laughter at the mutual expense of sects, learned societies, and individuals.\n\nYet in the prognostication of such future events, at any rate, all foretold on the authority of cyclic recurrences, there is no psychic phenomenon involved.\n\nIt is neither prevision , nor prophecy; no more than is the signalling of a comet or star, several years before its appearance.\n\nIt is simply knowledge and mathematically correct computations which enable the W ISE M EN OF THE E AST to foretell, for instance, that England is on the eve of such or another catastrophe; France, nearing such a point of her cycle, and Europe in general threatened with, or rather, on the eve of, a cataclysm, which her own cycle of racial Karma has led her to.\n\nThe reliability of the information depends, of course, on the acceptation or rejection of the claim for a tremendous period of historical observation.\n\nEastern Initiates maintain that they have preserved records of the racial development and of events of universal import ever since the beginning of the Fourth Race -- that which preceded being traditional.\n\nMoreover, those who believe in Seership and Occult [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] no more deny the existence of Spirits than I deny soul while trying to explain certain facts without their hypothesis .\n\n.\n\n.\" \"The Non-Defined Forces,\" Historical and Experimental Researches, p.\n\n3.\n\nThe above is written by A.\n\nde Rochas, a well-known man of science in France, his work being one of the signs of the time.\n\n(Paris: Masson, Boulevard St.\n\nGermain, 1887.) [[Vol.\n\n1, Page]] 647 ASTROLOGY A SCIENCE.\n\npowers will have no difficulty in crediting the general character, at least, of the information given, even if traditional, once the latter is checked and corrected by the corroboration of clairvoyance and esoteric knowledge.\n\nBut in the present case no such metaphysical belief is claimed as our chief dependence, but a proof is given on what, to every Occultist, is quite scientific evidence -- the records preserved through the Zodiac for incalculable ages."


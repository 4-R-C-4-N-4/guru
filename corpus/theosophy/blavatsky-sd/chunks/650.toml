[content]
body = "It has worshipped \"great sages\" and given hospitality to terrestrial wisdom: but once that \"another forest shone forth\" upon it, it is Intelligence (Buddhi, the 7th sense, but 6th principle) which is transformed into the tree -- that tree whose fruit is emancipation -- which finally destroys the very roots of the Aswattha tree, the symbol of life and of its illusive joys and pleasures.\n\nAnd therefore, those who attain to that state of emancipation have, in the words of the above-cited sage, \"no fear afterwards.\" In this state \"the end cannot be perceived because it extends on all sides.\" \"There always dwell seven females there,\" he goes on to say, carrying out the imagery.\n\nThese females, who, according to Arjuna Misra, are the Mahat, Ahamkara and five Tanmatras, have always their faces turned downwards, as they are obstacles in the way of spiritual ascension.\n\n\" .\n\n.\n\n.\n\n.\n\nIn that same (Brahman, the 'Self') the Seven perfect Sages, together with their chiefs, abide and again emerge from the same.\n\nGlory, brilliance and greatness, enlightenment, victory, perfection and power -- these seven rays follow after this same Sun (Kshetragna, the Higher Self).\n\n.\n\n.\n\n.\n\nThose whose wishes are reduced (unselfish).\n\n.\n\n.\n\n.\n\nwhose sins (passions) are burnt up by restraint, merging the Self in the Self,t**devote themselves to Brahman.\n\nThose people who understand the forest of Knowledge (Brahman, or S ELF) praise tranquillity.\n\nAnd aspiring to that forest, they are (re-) born so as not to lose courage.\n\n[[Footnote(s)]] ------------------------------------------------- * As Mahat (universal intelligence) is first born, or manifests, as Vishnu, and then, when it falls into matter and develops self-consciousness, it becomes Egoism, Selfishness, so Manas is of a dual nature.\n\nIt is respectively under the sun and moon, for as Sankaracharya says \"The moon is the mind, and the sun the understanding.\" The sun and moon are the deities of our planetary Macrocosmos, and therefore Sankara adds that \"the mind and the understanding are the respective deities of the (human) organs\" ( vide Brihadaranyaka, pp.\n\n521, et seq .) This is perhaps why Arjuna Misra says that the moon and the Fire (the self, the sun) constitute the universe.\n\n** \"The body in the Soul,\" as Arjuna Misra is credited with saying, or rather the \"Soul in the Spirit,\" and on a still higher plane of development: \"the S ELF or Atman in the Universal Self.\" [[Vol.\n\n2, Page]] 640 THE SECRET DOCTRINE.\n\nSuch indeed, is this holy forest .\n\n.\n\n.\n\n.\n\nand understanding it, they (the Sages) act accordingly, being directed by the K SHETRAGNA.\n\n.\n\n.\n\n.\n\n\" No translator among the Western Orientalists has yet perceived in the foregoing allegory anything higher than mysteries connected with sacrificial ritualism, penance, or ascetic ceremonies, and Hatha Yoga.\n\nBut he who understands symbolical imagery, and hears the voice of S ELF WITHIN S ELF, will see in this something far higher than mere ritualism, however often he may err in minor details of the philosophy.\n\nAnd here, we must be allowed a last remark.\n\nNo true theosophist, from the most ignorant up to the most learned, ought to claim infallibility for anything he may say or write upon occult matters.\n\nThe chief point is to admit that, in many a way, in the classification of either cosmic or human principles, in addition to mistakes in the order of evolution, and especially on metaphysical questions, those of us who pretend to teach others more ignorant than ourselves -- are all liable to err.\n\nThus mistakes have been made in \"Isis Unveiled,\" in \"Esoteric Buddhism,\" in \"Man,\" in \"Magic: White and Black,\" etc., etc.; and more than one mistake is likely to be found in the present work.\n\nThis cannot be helped.\n\nFor a large or even a small work on such abstruse subjects to be entirely exempt from error and blunder, it would have to be written from its first to its last page by a great adept, if not by an Avatar.\n\nThen only should we say, \"This is verily a work without sin or blemish in it!\" But, so long as the artist is imperfect, how can his work be perfect?\n\n\"Endless is the search for truth!\" Let us love it and aspire to it for its own sake, and not for the glory or benefit a minute portion of its revelation may confer on us.\n\nFor who of us can presume to have the whole truth at his fingers' ends, even upon one minor teaching of Occultism?\n\nOur chief point in the present subject, however, was to show that the Septenary doctrine, or division of the constitution of man, was a very ancient one, and was not invented by us.\n\nThis has been successfully done, for we are supported in this, consciously and unconsciously, by a number of ancient, mediaeval, and modern writers.\n\nWhat the former said, was well said; what the latter repeated, was generally distorted.\n\nAn instance: Read the \"Pythagorean Fragments,\" and compare the Septenary man as given by the Rev.\n\nG.\n\nOliver, the learned mason, in his \"Pythagorean Triangle\" (ch.\n\non \" Science of Numbers, \" p.\n\n179).\n\nHe speaks as follows: -- \"The Theosophic Philosophy counted SEVEN properties (or principles), in Man, viz.: -- (1.) The divine golden Man; (2.) The inward holy body from fire and light, like pure silver; [[Vol.\n\n2, Page]] 641 HYPNOTISM IS -- SATANISM.\n\n(3.) The elemental man; (4.) The mercurial paradisiacal man; (5.) The martial Soul-like man; (6.) The passionate man of desires; (7.) The Solar man; a witness to and inspector of the wonders of the Universe.\n\nThey had also seven fountain Spirits, or Powers of Nature.\" Compare this jumbled account and distribution of Western theosophic philosophy with the latest theosophic explanations by the Eastern School of Theosophy, and then decide which is the more correct.\n\nVerily: -- \"Wisdom hath builded her house, She hath hewn out her seven pillars.\n\n\" -- ( Prov.\n\nix, 1 .\n\n) As to the charge that our School has not adopted the Seven-fold classification of the Brahmins, but has confused it, it is quite unjust.\n\nTo begin with, the \"School\" is one thing, its exponents ( to Europeans ) quite another.\n\nThe latter have first to learn the A B C of practical Eastern Occultism, before they can be made to understand correctly the tremendously abstruse classification based on the seven distinct states of Pragna (consciousness); and, above all, to realize thoroughly what Pragna is, in the Eastern metaphysics."


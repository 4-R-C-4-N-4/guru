[content]
body = "Agnostic speculative thinkers have to choose between the version given by the Secret Doctrine of the East, and the hopelessly materialistic Darwinian and Biblical accounts of the origin of man; between no soul and no spiritual evolution, and the Occult doctrine which repudiates \"Special creation\" and the \"Evolutionist\" Anthropogenesis equally.\n\nAgain, to take up the question of \"Spontaneous generation\"; life -- as science shows -- has not always reigned on this terrestrial plane.\n\n[[Footnote(s)]] ------------------------------------------------- * It must be noted that, though the astral and physical planes of matter ran parallel with one another even in the earliest geological ages, yet they were not in the same phases of manifestation in which they are now.\n\nThe Earth did not reach its present grade of density till 18,000,000 years ago.\n\nSince then both the physical and astral planes have become grosser.\n\n[[Vol.\n\n2, Page]] 158 THE SECRET DOCTRINE.\n\nThere was a time when even the Haeckelian Moneron -- that simple globule of Protoplasm -- had not yet appeared at the bottom of the seas.\n\nWhence came the Impulse which caused the molecules of Carbon, Nitrogen, Oxygen, etc., to group themselves into the Urschleim of Oken, that organic \"slime,\" now christened protoplasm.\n\nWhat were the prototypes of the Monera?\n\nThey, at least, could not have fallen in meteorites from other globes already formed, Sir W.\n\nThomson's wild theory to this effect, notwithstanding.\n\nAnd if they have so fallen; if our Earth got its supply of life-germs from other planets; who, or what, had carried them into those planets?\n\nHere, again, unless the Occult teaching is accepted, we are compelled once more to face a miracle; to accept the theory of a personal, anthropomorphic Creator, the attributes and definitions of whom, as formulated by the Monotheists, clash as much with philosophy and logic, as they degrade the ideal of an infinite Universal deity, before whose incomprehensible awful grandeur the highest human intellect feels dwarfed.\n\nLet not the modern philosopher, while arbitrarily placing himself on the highest pinnacle of human intellectuality hitherto evolved, show himself spiritually and intuitionally so far below the conceptions of even the ancient Greeks, themselves on a far lower level, in these respects, than the philosophers of Eastern Aryan antiquity.\n\nHylozoism, when philosophically understood, is the highest aspect of Pantheism.\n\nIt is the only possible escape from idiotic atheism based on lethal materiality, and the still more idiotic anthropomorphic conceptions of the monotheists; between which two it stands on its own entirely neutral ground.\n\nHylozoism demands absolute Divine Thought, which would pervade the numberless active, creating Forces, or \"Creators\"; which entities are moved by, and have their being in, from, and through that Divine Thought; the latter, nevertheless, having no more personal concern in them or their creations, than the Sun has in the sun-flower and its seeds, or in vegetation in general.\n\nSuch active \"Creators\" are known to exist and are believed in, because perceived and sensed by the inner man in the Occultist.\n\nThus the latter says that an ABSOLUTE Deity, having to be unconditioned and unrelated, cannot be thought of at the same time as an active, creating, one living god, without immediate degradation of the ideal.* A Deity that manifests in Space and Time - - these two being simply the forms of THAT which is the Absolute ALL -- can be but a fractional part of the [[Footnote(s)]] ------------------------------------------------- * The conception and definition of the Absolute by Cardinal Cusa may satisfy only the Western mind, prisoned, so unconsciously to itself, and entirely degenerated by long centuries of scholastic and theological sophistry.\n\nBut this \"Recent philosophy of the Absolute,\" traced by Sir W.\n\nHamilton to Cusa, would never satisfy the more acutely metaphysical mind of the Hindu Vedantin.\n\n[[Vol.\n\n2, Page]] 159 OCEANS OF CARBONIC ACID?\n\nwhole.\n\nAnd since that \"all\" cannot be divided in its absoluteness, therefore that sensed creator (we say Creators ) can be at best but the mere aspect thereof.\n\nTo use the same metaphor -- inadequate to express the full idea, yet well adapted to the case in hand -- these creators are like the numerous rays of the solar orb, which remains unconscious of, and unconcerned in, the work; while its mediating agents, the rays, become the instrumental media every spring -- the Manvantaric dawn of the Earth -- in fructifying and awakening the dormant vitality inherent in Nature and its differentiated matter.\n\nThis was so well understood in antiquity, that even the moderately religious Aristotle remarked that such work of direct creation would be quite unbecoming to God -- [[ aprepes toi theo ]].\n\nPlato and other philosophers taught the same: deity cannot set its own hand to creation, -- [[ autournein hapanta ]].\n\nThis Cudworth calls \"Hylozoism.\" As old Zeno is credited by Laertius with having said, \"Nature is a habit moved from itself, according to seminal principles; perfecting and containing those several things which in determinate times are produced from it, and acting agreeably to that from which it was secreted.\"* Let us return to our subject, pausing to think over it.\n\nIndeed, if there was vegetable life during those periods that could feed on the then deleterious elements; and if there was even animal life whose aquatic organization could be developed, notwithstanding the supposed scarcity of Oxygen, why could there not be human life also, in its incipient physical form, i.e ., in a race of beings adapted for that geological period and its surroundings?\n\nBesides, science confesses that it knows nothing of the real length of \"geological periods.\" But the chief question before us is, whether it is quite certain that, from the time of that which is called the \"Azoic\" age, there ever was such an atmosphere as that hypothesised by the Naturalists.\n\nNot all the physicists agree with this idea.\n\nWere the writer anxious to corroborate the teachings of the Secret Doctrine by exact science, it would be easy to show, on the admission of more than one physicist, that the atmosphere has changed little, if at all, since the first condensation of the oceans -- i.e., since the Laurentian period, the Pyrolithic age.\n\nSuch, at any rate, is the opinion of Blanchard, S.\n\nMeunier, and even of Bischof -- as the experiments of the latter scientist with basalts have shown.\n\nFor were we to take the word of the majority of scientists as to the quantity of deadly gases, and of elements entirely saturated with carbon and nitrogen, in which the vegetable and animal kingdoms are shown to have lived, thriven, and developed, then one would have to come to the curious conclusion that there were, in those days, oceans [[Footnote(s)]] ------------------------------------------------- *Cudworth's \" Intellectual System, \" I.\n\np.\n\n328.\n\n[[Vol."


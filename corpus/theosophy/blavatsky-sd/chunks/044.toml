body = "The \"fire,\" \"heat,\" and \"motion\" here spoken of, are, of course, not the fire, heat, and motion of physical science, but the underlying abstractions, the noumena, or the soul, of the essence of these material manifestations -- the \"things in themselves,\" which, as modern science confesses, entirely elude the instru- [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] lated by Kashinath Trimbak Telang, M.A.; edited by Max Muller.) Whatever meaning various schools may give the term, Sattva is the name given among Occult students of the Aryasanga School to the dual Monad or Atma-buddhi, and Atma-buddhi on this plane corresponds to Parabrahm and Mulaprakriti on the higher plane.\n\n* Amrita is \"immortality.\" ** See Commentary No.\n\n1 to this Stanza.\n\n[[Vol.\n\n1, Page]] 70 THE SECRET DOCTRINE.\n\nments of the laboratory, and which even the mind cannot grasp, although it can equally little avoid the conclusion that these underlying essences of things must exist.\n\nFire and Water, or Father* and Mother, may be taken here to mean the divine Ray and Chaos.\n\n\"Chaos, from this union with Spirit obtaining sense, shone with pleasure, and thus was produced the Protogonos (the first-born light),\" says a fragment of Hermas.\n\nDamascius calls it Dis in \"Theogony\" -- \"The disposer of all things.\" (See Cory's \" Ancient Fragments ,\" p.\n\n314.) According to the Rosicrucian tenets, as handled and explained by the profane for once correctly, if only partially, so \"Light and Darkness are identical in themselves, being only divisible in the human mind\"; and according to Robert Fludd, \"Darkness adopted illumination in order to make itself visible\" ( On Rosenkranz ) .\n\nAccording to the tenets of Eastern Occultism, D ARKNESS is the one true actuality, the basis and the root of light, without which the latter could never manifest itself, nor even exist.\n\nLight is matter, and D ARKNESS pure Spirit.\n\nDarkness, in its radical, metaphysical basis, is subjective and absolute light; while the latter in all its seeming effulgence and glory, is merely a mass of shadows, as it can never be eternal, and is simply an illusion, or Maya.\n\nEven in the mind-baffling and science-harassing Genesis, light is created out of darkness \"and darkness was upon the face of the deep\" (ch.\n\ni.\n\nv.\n\n2.) -- and not vice versa.\n\n\"In him (in darkness) was life; and the life was the light of men \" (John i.\n\n4).\n\nA day may come when the eyes of men will be opened; and then they may comprehend better than they do now, that verse in the Gospel of John that says \"And the light shineth in darkness; and the darkness comprehendeth it not.\" They will see then that the word \"darkness\" does not apply to man's spiritual eyesight, but indeed to \"Darkness,\" the absolute, that comprehendeth not (cannot cognize) transient light, however transcendent to human eyes.\n\nDemon est Deus inversus.\n\nThe devil is now called Darkness by the Church, whereas, in the Bible he is called the \"Son of God\" (see Job), the bright star of the early morning, Lucifer (see Isaiah).\n\nThere is a whole philosophy of dogmatic craft in the reason why the first Archangel, who sprang from the depths of Chaos, was called Lux (Lucifer), the \"Luminous Son of the Morning,\" or man- [[Footnote(s)]] ------------------------------------------------- * See \"Kwan-Shai-Yin.\" The real name from the text cannot be given.\n\n[[Vol.\n\n1, Page]] 71 LIGHT EMERGES FROM DARKNESS.\n\nvantaric Dawn.\n\nHe was transformed by the Church into Lucifer or Satan, because he is higher and older than Jehovah, and had to be sacrificed to the new dogma.\n\n(See Book II.) --------- STANZA III.\n\n-- Continued.\n\n7.\n\nB EHOLD, OH L ANOO!** THE RADIANT C HILD OF THE TWO, THE UNPARALLELED REFULGENT G LORY, B RIGHT S PACE, S ON OF D ARK S PACE, WHO EMERGES FROM THE DEPTHS OF THE GREAT D ARK W ATERS.\n\nI T IS O EAOHOO, THE Y OUNGER, THE * * * ( whom thou knowest now as Kwan-Shai-Yin.\n\n-- Comment ) ( a ) .\n\nH E SHINES FORTH AS THE S UN.\n\nH E IS THE BLAZING D IVINE D RAGON OF W ISDOM.\n\nT HE E KA IS C HATUR ( four ) , AND C HATUR TAKES TO ITSELF THREE, AND THE UNION PRODUCES THE S APTA ( seven ) IN WHOM ARE THE SEVEN WHICH BECOME THE T RIDASA*** ( the thrice ten ) THE HOSTS AND THE MULTITUDES ( b ).\n\nB EHOLD HIM LIFTING THE V EIL, AND UNFURLING IT FROM E AST TO W EST.\n\nH E SHUTS OUT THE ABOVE AND LEAVES THE BELOW TO BE SEEN AS THE GREAT I LLUSION.\n\nH E MARKS THE PLACES FOR THE SHINING ONES ( stars ) AND TURNS THE UPPER ( space ) INTO A SHORELESS S EA OF F IRE, AND THE O NE MANIFESTED ( element ) INTO THE G REAT W ATERS ( c ).\n\n\"Bright Space, son of dark Space,\" corresponds to the Ray dropped at the first thrill of the new \"Dawn\" into the great Cosmic depths, from which it re-emerges differentiated as Oeaohoo the younger, (the \" new LIFE\"), to become, to the end of the life-cycle, the germ of all things.\n\nHe is \"the Incorporeal man who contains in himself the divine Idea,\" -- the generator of Light and Life, to use an expression of Philo Judaeus.\n\nHe is called the \"Blazing Dragon of Wisdom,\" [[Footnote(s)]] ------------------------------------------------- ** Lanoo is a student, a chela who studies practical Esotericism.\n\n*** \"Tri-dasa,\" or three times ten (30), alludes to the Vedic deities, in round numbers, or more accurately 33 -- a sacred number.\n\nThey are the 12 Adityas, the 8 Vasus, the 11 Rudras, and 2 Aswins -- the twin sons of the Sun and the Sky.\n\nThis is the root-number of the Hindu Pantheon, which enumerates 33 crores or over three hundred millions of gods and goddesses.\n\n[[Vol.\n\n1, Page]] 72 THE SECRET DOCTRINE."


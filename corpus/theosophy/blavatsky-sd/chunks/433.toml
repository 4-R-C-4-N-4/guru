[content]
body = "These \"originals\" -- called to this day in China \"the Dragons of Wisdom\" -- were the first disciples of the Dhyanis, who were their instructors; in short, the primitive adepts of the Third Race, and later, of the Fourth and Fifth Races.\n\nThe name became universal, and no sane man before the Christian era would ever have confounded the man and the symbol.\n\nThe symbol of Chnouphis, or the soul of the world, writes Champollion, \"is among others that of an enormous serpent standing on human legs; this reptile, the emblem of the good genius, is a veritable Agathodaemon.\n\nIt is often represented bearded.\n\n.\n\n.\n\n.\n\n.\n\nThat sacred animal, identical with the serpent of the Ophites, is found engraved on numerous Gnostic or Basilidean stones .\n\n.\n\n.\n\n.\n\nThe serpent has various heads, but is constantly inscribed with the letters [[ CHNOUBIS ]].\"** Agathodaemon was endowed \"with the knowledge of good and evil,\" i.e.\n\n, with divine Wisdom, as without the former the latter is impossible.*** Repeating Iamblichus, Champollion shows him to be \"the deity called [[ Eichton]] (or the fire of the celestial gods -- the great **** Thot- [[Footnote(s)]] ------------------------------------------------- * This is about as just as though -- a few millenniums hence -- a fanatic of some future new creed, who was bent on glorifying his religion at the expense of ancient Christianity, were to say: \"Everywhere the quadruped lamb was adored.\n\nThe nun placed it, calling it the Agnus, on her bosom; the priest laid it on the altar.\n\nIt figured in every paschal meal, and was glorified loudly in every temple.\n\nAnd yet the Christians dreaded it and hated it, for they slew and devoured it.\n\n.\n\n.\n\n.\" Heathens, at any rate, do not eat their sacred symbols.\n\nWe know of no serpent, or reptile-eaters except in Christian civilized countries, where they begin with frogs and eels, and must end with real snakes, as they have begun with lamb and ended with horse-flesh.\n\n** \" Pantheon, \" 3.\n\n*** The solar Chnouphis, or Agathodaemon, is the Christos of the Gnostics, as every scholar knows.\n\nHe is intimately connected with the seven sons of Sophia (Wisdom), the seven sons of Aditi (universal Wisdom), her eighth being Marttanda, the Sun, which seven are the seven planetary regents or genii.\n\nTherefore Chnouphis was the spiritual Sun of Enlightenment, of Wisdom, hence the patron of all the Egyptian Initiates, as Bel-Merodach (or Bel-Belitanus) became later with the Chaldeans.\n\n**** Hermes, or rather Thot, was a generic name.\n\nAbul Teda shows in \" Historia Anti-Islamitica \" five Hermes, and the names of Hermes, Nebo, Thot were given respectively in various countries to great Initiates.\n\nThus Nebo, the son of Merodach and Zarpanitu (whom Herodotus calls Zeus-Belos), gave his name to all the great prophets, seers and Initiates.\n\nThey were all \"serpents of Wisdom,\" as connected with the Sun astronomically, and with Wisdom spiritually.\n\n[[Vol.\n\n2, Page]] 211 TWO SCHOOLS OF MAGIC.\n\nHermes), to whom Hermes Trismegistus attributes the invention of magic.\"* The \" invention of magic!\n\n\" A strange term to use, as though the unveiling of the eternal and actual mysteries of nature could be invented !\n\nAs well attribute, millenniums hence, the invention instead of the discovery of radiant matter to Prof.\n\nCrookes.\n\nHermes was not the inventor, or even the discoverer, for, as said in the foot-note, Thot-Hermes is a generic name, as is Enoch (Enoichion, the \"inner, spiritual eye\") , Nebo, the prophet and seer, etc.\n\nIt is not the proper name of any one living man, but a generic title of many adepts.\n\nTheir connection in symbolic allegories with the serpent is due to their enlightenment by the solar and planetary gods during the earliest intellectual Race, the Third.\n\nThey are all the representative patrons of the Secret Wisdom.\n\nAsclepios is the son of the Sun-god Apollo -- and he is Mercury; Nebo is the son of Bel-Merodach; Vaivasvata Manu, the great Rishi, is the son of Vivisvat -- the Sun or Surya, etc., etc.\n\nAnd while, astronomically, the Nagas along with the Rishis, the Gandharvas, Apsarasas, Gramanis (or Yakshas, minor gods) Yatudhanas and Devas, are the Sun's attendants throughout the twelve solar months; in theogony, and also in anthropological evolution, they are gods and men -- when incarnated in the nether world.\n\nLet the reader be reminded, in this connection, of the fact that Apollonius met in Kashmir Buddhist Nagas - - which are neither serpents zoologically, nor yet the Nagas ethnologically, but \"wise men.\" The Bible, from Genesis to Revelations, is but a series of historical records of the great struggle between white and black Magic, between the Adepts of the right path, the Prophets, and those of the left, the Levites, the clergy of the brutal masses.\n\nEven the students of Occultism, though some of them have more archaic MSS .\n\nand direct teaching to rely upon, find it difficult to draw a line of demarcation between the Sodales of the Right Path and those of the Left.\n\nThe great schism that arose between the sons of the Fourth Race, as soon as the first Temples and Halls of Initiation had been erected under the guidance of \"the Sons of God,\" is allegorized in the Sons of Jacob.\n\nThat there were two schools of Magic, and that the orthodox Levites did not belong to the holy one, is shown in the words pronounced by the dying Jacob.\n\nAnd here it may be well to quote a few sentences from \" Isis Unveiled.\n\n\" The dying Jacob thus describes his sons: \"Dan,\" he says, \"shall be a serpent by the way, an adder in the path, that biteth the horse-heels, so that his rider shall fall backwards ( i.e., he will teach candidates black magic) .\n\n.\n\n.\n\n.\n\nI have waited for thy salvation, O Lord!\" Of Simeon and Levi the patriarch remarks that they\" .\n\n.\n\n.\n\nare brethren; instru- [[Footnote(s)]] ------------------------------------------------- * \" Pantheon, \" text 15.\n\n[[Vol.\n\n2, Page]] 212 THE SECRET DOCTRINE.\n\nments of cruelty are in their habitations.\n\nO my soul, come not thou into their secret ; unto their assembly."


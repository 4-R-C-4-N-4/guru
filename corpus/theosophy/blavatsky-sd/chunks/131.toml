[content]
body = "(5.) Everything in the Universe, throughout all its kingdoms, is CONSCIOUS: i.e., endowed with a consciousness of its own kind and on its own plane of perception.\n\nWe men must remember that because we do not perceive any signs -- which we can recognise -- of consciousness, say, in stones, we have no right to say that no consciousness exists there.\n\nThere is no such thing as either \"dead\" or \"blind\" matter, as there is no \"Blind\" or \"Unconscious\" Law.\n\nThese find no place among the conceptions of Occult philosophy.\n\nThe latter never stops at surface appearances, and for it the noumenal essences have more reality than their objective counterparts; it resembles therein the mediaeval Nominalists, for whom it was the Universals that were the realities and the particulars which existed only in name and human fancy.\n\n(6.) The Universe is worked and guided from within outwards.\n\nAs above so it is below, as in heaven so on earth; and man -- the microcosm and miniature copy of the macrocosm -- is the living witness to this Universal Law, and to the mode of its action.\n\nWe see that every external motion, act, gesture, whether voluntary or mechanical, organic or mental, is produced and preceded by internal feeling or emotion, will or volition, and thought or mind.\n\nAs no outward motion or change, when normal, in man's external body can take place unless provoked by an inward impulse, given through one of the three functions named, so with the external or manifested Universe.\n\nThe whole Kosmos is guided, controlled, and animated by almost endless series of Hierarchies of sentient Beings, each having a mission to perform, and who -- whether we give to them one name or another, and call them Dhyan-Chohans or Angels -- are \"messengers\" in the sense only that they are the agents of Karmic and Cosmic Laws.\n\nThey vary infinitely in their [[Vol.\n\n1, Page]] 275 THE NATURE OF THE CELESTIAL MEN.\n\nrespective degrees of consciousness and intelligence; and to call them all pure Spirits without any of the earthly alloy \"which time is wont to prey upon\" is only to indulge in poetical fancy.\n\nFor each of these Beings either was, or prepares to become, a man, if not in the present, then in a past or a coming cycle (Manvantara).\n\nThey are perfected, when not incipient, men; and differ morally from the terrestrial human beings on their higher (less material) spheres, only in that they are devoid of the feeling of personality and of the human emotional nature -- two purely earthly characteristics.\n\nThe former, or the \"perfected,\" have become free from those feelings, because ( a ) they have no longer fleshly bodies -- an ever-numbing weight on the Soul; and ( b ) the pure spiritual element being left untrammelled and more free, they are less influenced by maya than man can ever be, unless he is an adept who keeps his two personalities -- the spiritual and the physical -- entirely separated.\n\nThe incipient monads, having never had terrestrial bodies yet, can have no sense of personality or EGO-ism.\n\nThat which is meant by \"personality,\" being a limitation and a relation, or, as defined by Coleridge, \"individuality existing in itself but with a nature as a ground,\" the term cannot of course be applied to non-human entities; but, as a fact insisted upon by generations of Seers, none of these Beings, high or low, have either individuality or personality as separate Entities, i.e., they have no individuality in the sense in which a man says, \" I am myself and no one else;\" in other words, they are conscious of no such distinct separateness as men and things have on earth.\n\nIndividuality is the characteristic of their respective hierarchies, not of their units; and these characteristics vary only with the degree of the plane to which those hierarchies belong: the nearer to the region of Homogeneity and the One Divine, the purer and the less accentuated that individuality in the Hierarchy.\n\nThey are finite, in all respects, with the exception of their higher principles -- the immortal sparks reflecting the universal divine flame -- individualized and separated only on the spheres of Illusion by a differentiation as illusive as the rest.\n\nThey are \"Living Ones,\" because they are the streams projected on the Kosmic screen of illusion from the ABSOLUTE LIFE; beings in whom life cannot become extinct, before the fire of ignorance is extinct in those who sense these \"Lives.\" Having sprung into being under the quickening influence of the uncreated beam, the reflection of the great Central Sun that [[Vol.\n\n1, Page]] 276 THE SECRET DOCTRINE.\n\nradiates on the shores of the river of Life, it is the inner principle in them which belongs to the waters of immortality, while its differentiated clothing is as perishable as man's body.\n\nTherefore Young was right in saying that \"Angels are men of a superior kind\" and no more.\n\nThey are neither \"ministering\" nor \"protecting\" angels; nor are they \"Harbingers of the Most High\" still less the \"Messengers of wrath\" of any God such as man's fancy has created.\n\nTo appeal to their protection is as foolish as to believe that their sympathy may be secured by any kind of propitiation; for they are, as much as man himself is, the slaves and creatures of immutable Karmic and Kosmic law.\n\nThe reason for it is evident.\n\nHaving no elements of personality in their essence they can have no personal qualities, such as attributed by men, in their exoteric religions, to their anthropomorphic God -- a jealous and exclusive God who rejoices and feels wrathful, is pleased with sacrifice, and is more despotic in his vanity than any finite foolish man.\n\nMan, as shown in Book II., being a compound of the essences of all those celestial Hierarchies may succeed in making himself, as such, superior, in one sense, to any hierarchy or class, or even combination of them.\n\n\"Man can neither propitiate nor command the Devas, \" it is said.\n\nBut, by paralyzing his lower personality, and arriving thereby at the full knowledge of the non-separateness of his higher SELF from the One absolute SELF, man can, even during his terrestrial life, become as \"One of Us.\" Thus it is, by eating of the fruit of knowledge which dispels ignorance, that man becomes like one of the Elohim or the Dhyanis; and once on their plane the Spirit of Solidarity and perfect Harmony, which reigns in every Hierarchy, must extend over him and protect him in every particular.\n\nThe chief difficulty which prevents men of science from believing in divine as well as in nature Spirits is their materialism.\n\nThe main impediment before the Spiritualist which hinders him from believing in the same, while preserving a blind belief in the \"Spirits\" of the Departed, is the general ignorance of all, except some Occultists and Kabalists, about the true essence and nature of matter."


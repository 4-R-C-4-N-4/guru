[content]
body = "It is sufficient to glance at the works of Broca, Gratiolet, of Owen, Pruner-Bey, and finally, at the last great work of de Quatrefages, \" Introduction a l ' Etude des Races humaines, Questions generales, \" to discover the fallacy of the Evolutionists.\n\nWe may say more: the exaggerations concerning such similarity of structure between man and the anthropomorphous ape have become so glaring and absurd of late, that even Mr.\n\nHuxley found himself forced to protest against the too sanguine expectations.\n\nIt was that great anatomist personally who called the \"smaller fry\" to order, by declaring in one of his articles that the differences in the structure of the human body and that of the highest anthropomorphous pithecoid, were not only far from being trifling and unimportant, but were, on the contrary, very great and suggestive: \"each of the bones of the gorilla has its own specific impress on it that distinguishes it from a similar human bone.\" Among the existing creatures there is not one single intermediate form that could fill the gap between man and the ape.\n\nTo ignore that gap, he added, \"was as uncalled-for as it was absurd.\n\n\" ** [[Footnote(s)]] ------------------------------------------------- * Professor Owen believes that these muscles -- the attollens, retrahens, and attrahens aurem -- were actively functioning in men of the Stone Age.\n\nThis may or may not be the case.\n\nThe question falls under the ordinary \"occult\" explanation, and involves no postulate of an \"animal progenitor\" to solve it.\n\n** Quoted in the Review of the \" Introduction a l ' Etude des Races Humaines, \" by de Quatrefages.\n\nWe have not Mr.\n\nHuxley's work at hand to quote from.\n\nOr to cite another good authority: -- \"We find one of the most man-like apes (gibbon), in the [[Footnote continued on next page]] [[Vol.\n\n2, Page]] 682 THE SECRET DOCTRINE.\n\nFinally, the absurdity of such an unnatural descent of man is so palpable in the face of all the proofs and evidence of the skull of the pithecoid as compared to that of man, that even de Quatrefages resorted unconsciously to our esoteric theory by saying that it is rather the apes that can claim descent from man than vice versa.\n\nAs proven by Gratiolet, with regard to the cavities of the brain of the anthropoids, in which species that organ develops in an inverse ratio to what would be the case were the corresponding organs in man really the product of the development of the said organs in the apes -- the size of the human skull and its brain, as well as the cavities, increase with the individual development of man.\n\nHis intellect develops and increases with age, while his facial bones and jaws diminish and straighten, thus being more and more spiritualized: whereas with the ape it is the reverse.\n\nIn its youth the anthropoid is far more intelligent and good-natured, while with age it becomes duller; and, as its skull recedes and seems to diminish as it grows, its facial bones and jaws develop, the brain being finally crushed, and thrown entirely back, to make with every day more room for the animal type.\n\nThe organ of thought -- the brain -- recedes and diminishes, entirely conquered and replaced by that of the wild beast -- the jaw apparatus.\n\nThus, as wittily remarked in the French work, a gorilla would have a perfect right to address an Evolutionist, claiming its right of descent from himself.\n\nIt would say to him, \"We, anthropoid apes, form a retrogressive departure from the human type, and therefore our development and evolution are expressed by a transition from a human-like to an animal-like structure of organism; but in what way could you, men, descend from us -- how can you form a continuation of our genus?\n\nFor, to make this possible, your organization would have to differ still more than ours does from the human structure, it would have to approach still closer to that of the beast than ours does; and in such a case justice demands that you should give up to us your place in nature.\n\nYou are lower than we are, once that you insist on tracing your genealogy from our kind; for the structure of our organization and its development are such that we are unable to generate forms of a higher organization than our own.\" This is where the Occult Sciences agree entirely with de Quatre- [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] tertiary period, and this species is still in the same low grade, and side by side with it at the end of the Ice-period, man is found in the same high grade as to-day, the ape not having approximated more nearly to the man, and modern man not having become further removed from the ape than the first (fossil) man .\n\n.\n\n.\n\nthese facts contradict a theory of constant progressive development.\" (Pfaff.) When, according to Vogt, the the average Australian brain = 99.35 cub.\n\ninches; that of the gorilla 30.51 cub.\n\nin., and that of the chimpanzee only 25.45, the giant gap to be bridged by the advocate of \"Natural\" Selection becomes apparent.\n\n[[Vol.\n\n2, Page]] 683 THE DARWINISTS AND THEIR OPPONENTS.\n\nfages.\n\nOwing to the very type of his development man cannot descend from either an ape or an ancestor common to both, but shows his origin from a type far superior to himself.\n\nAnd this type is the \"Heavenly man\" -- the Dhyan Chohans, or the Pitris so-called, as shown in the first Part of this volume.\n\nOn the other hand, the pithecoids, the orang-outang, the gorilla, and the chimpanzee can , and, as the Occult Sciences teach, do, descend from the animalized Fourth human Root-Race, being the product of man and an extinct species of mammal -- whose remote ancestors were themselves the product of Lemurian bestiality -- which lived in the Miocene age.\n\nThe ancestry of this semi-human monster is explained in the Stanzas as originating in the sin of the \"Mind-less\" races of the middle Third Race period.\n\nWhen it is borne in mind that all forms which now people the earth, are so many variations on basic types originally thrown off by the M AN of the Third and Fourth Round, such an evolutionist argument as that insisting on the \"unity of structural plan\" characterising all vertebrates, loses its edge.\n\nThe basic types referred to were very few in number in comparison with the multitude of organisms to which they ultimately gave rise; but a general unity of type has, nevertheless, been preserved throughout the ages.\n\nThe economy of Nature does not sanction the co-existence of several utterly opposed \"ground plans\" of organic evolution on one planet.\n\nOnce, however, that the general drift of the occult explanation is formulated, inference as to detail may well be left to the intuitive reader.\n\nSimilarly with the important question of the \"rudimentary\" organs discovered by anatomists in the human organism."


[content]
body = "True sexual union: - - (Cf.\n\nlater Third Root-Race.\n\n) We now come to an important point with regard to the double evolution of the human race.\n\nThe Sons of Wisdom, or the spiritual Dhyanis, had become \"intellectual\" through their contact with matter, because they had already reached, during previous cycles of incarnation, that degree of intellect which enabled them to become independent and self-conscious entities, on this plane of matter.\n\nThey were reborn only by reason of Karmic effects.\n\nThey entered those who were \"ready,\" and became the Arhats, or sages, alluded to above.\n\nThis needs explanation.\n\nIt does not mean that Monads entered forms in which other Monads already were.\n\nThey were \"Essences,\" \"Intelligences,\" and conscious spirits ; entities seeking to become still more conscious by uniting with more developed matter.\n\nTheir essence was too pure to be distinct from the universal essence; but their \"Egos,\" or Manas (since they are called Manasaputra, born of \"Mahat,\" or Brahma) had to pass through earthly human experiences to become all-wise, and be able to start on the returning ascending cycle.\n\nThe Monads are not discrete principles, limited or conditioned, but rays from that one universal absolute Principle.\n\nThe entrance into a dark room through the same aperture of one ray of sunlight following another will not constitute two rays, but one ray intensified.\n\nIt is not in the course of natural law that man should become a perfect septenary being, before the seventh race in the seventh Round.\n\nYet he has all these principles latent in him from his birth.\n\nNor is it part of the evolutionary law that the Fifth principle ( Manas ), should receive its complete development before the Fifth Round.\n\nAll such prematurely developed intellects (on the spiritual plane) in our Race are abnormal ; they are those whom we call the \"Fifth-Rounders.\" Even in the coming seventh Race, at the close of this Fourth Round, while our four lower principles will be fully developed, that of Manas will be only proportionately so.\n\nThis limitation, however, refers solely to the spiritual development.\n\nThe intellectual, on the physical plane, was reached during the Fourth Root-Race.\n\nThus, those who were \"half ready,\" who received \"but a spark,\" constitute the average humanity which has to acquire its intellectuality during the present Manvantaric evolution, [[Vol.\n\n2, Page]] 168 THE SECRET DOCTRINE.\n\nafter which they will be ready in the next for the full reception of the \"Sons of Wisdom.\" While those which \"were not ready\" at all, the latest Monads, which had hardly evolved from their last transitional and lower animal forms at the close of the Third Round, remained the \"narrow-brained\" of the Stanza.\n\nThis explains the otherwise unaccountable degrees of intellectuality among the various races of men -- the savage Bushman and the European -- even now.\n\nThose tribes of savages, whose reasoning powers are very little above the level of the animals, are not the unjustly disinherited, or the unfavoured, as some may think -- nothing of the kind.\n\nThey are simply those latest arrivals among the human Monads, which were not ready: which have to evolve during the present Round, as on the three remaining globes (hence on four different planes of being) so as to arrive at the level of the average class when they reach the Fifth Round.\n\nOne remark may prove useful, as food for thought to the student in this connection.\n\nThe MONADS of the lowest specimens of humanity (the \"narrow-brained\"* savage South-Sea Islander, the African, the Australian) had no Karma to work out when first born as men, as their more favoured brethren in intelligence had.\n\nThe former are spinning out Karma only now; the latter are burdened with past, present, and future Karma.\n\nIn this respect the poor savage is more fortunate than the greatest genius of civilised countries.\n\nLet us pause before giving any more such strange teachings.\n\nLet us try and find out how far any ancient Scriptures, and even Science, permit the possibility of, or even distinctly corroborate, such wild notions as are found in our Anthropogenesis.\n\nRecapitulating that which has been said we find: -- That the Secret Doctrine claims for man, (1) a polygenetic origin.\n\n(2) A variety of modes of procreation before humanity fell into the ordinary method of generation.\n\n(3) That the evolution of animals -- of the mammalians at any rate -- follows that of man instead of preceding it.\n\nAnd this is diametrically opposed to the now generally accepted theories of evolution and the descent of man from an animal ancestor.\n\n[[Footnote(s)]] ------------------------------------------------- * The term here means neither the dolicho-cephalic nor the brachyo-cephalic, nor yet skulls of a smaller volume, but simply brains devoid of intellect generally.\n\nThe theory which would judge of the intellectual capacity of a man according to his cranial capacity, seems absurdly illogical to one who has studied the subject.\n\nThe skulls of the stone period, as well as those of African Races (Bushmen included) show that the first are above rather than below the average of the brain capacity of the modern man, and the skulls of the last are on the whole (as in the case of Papuans and Polynesians generally) larger by one cubic inch than that of the average Frenchman.\n\nAgain, the cranial capacity of the Parisian of to-day represents an average of 1437 cubic centimetres compared to 1523 of the Auvergnat.\n\n[[Vol.\n\n2, Page]] 169 MONOGENISM OR POLYGENISM.\n\nLet us, by giving to Caesar what is Caesar's, examine, first of all, the chances for the polygenetic theory among the men of science.\n\nNow the majority of the Darwinian evolutionists incline to a polygenetic explanation of the origin of Races.\n\nOn this particular question, however, scientists are, as in many other cases, at sixes and sevens; they agree to disagree.\n\n\"Does man descend from one single couple or from several groups -- monogenism or polygenism?\n\nAs far as one can venture to pronounce on what in the absence of witnesses (?) will never be known (?), the second hypothesis is far the most probable.\"* Abel Hovelacque, in his \"Science of Language,\" comes to a similar conclusion, arguing from the evidence available to a linguistic enquirer.\n\nIn an address delivered before the British Association, Professor W.\n\nH.\n\nFlower remarked on this question: -- \"The view which appears best to accord with what is now known of the characters and distribution of the races of man .\n\n.\n\n.\n\n.\n\nis a modification of the monogenistic hypothesis (!).\n\nWithout entering into the difficult question of the method of man's first appearance upon the world, we must assume for it a vast antiquity, at all events as measured by any historical standard.\n\nIf we had any approach to a complete palaeontological record, the history of Man could be re-constructed, but nothing of the kind is forthcoming."


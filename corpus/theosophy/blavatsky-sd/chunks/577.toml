[content]
body = "Bear in mind, that almost every ancient King and priest was an initiate; that from toward the close of the Fourth Race there had been a feud between the Initiates of the Right and those of the Left Path; finally, that the garden of Eden is referred to by other personages than the Jews of the Adamic race, since even Pharaoh is compared to the fairest tree of Eden by this same Ezekiel, who shows \"all the trees of Eden, the choicest and best of Lebanon, .\n\n.\n\n.\n\ncomforted in the nether parts of the earth .\n\n.\n\n.\n\n,\" for \"they also went down into hell with him\" (Pharaoh)* unto the nether parts, which are in fact the bottom of the ocean, whose floor gaped wide to devour the lands of the Atlanteans and themselves.\n\nIf one bears all this in mind and compares the various accounts, then one will find out that the whole of chapters xxviii.\n\nand xxxi.\n\nof Ezekiel relate neither to Babylon, Assyria, nor yet Egypt, since none of these have been so destroyed, but simply fell into ruins on the surface, not beneath the earth -- but indeed to Atlantis and most of its nations.\n\nAnd he will see that the \"garden of Eden\" of the Initiates was no myth, but a locality now submerged.\n\nLight will dawn upon him, and he will appreciate such sentences as these at their true esoteric value: \"Thou hast been in Eden; .\n\n.\n\n.\n\nthou wast upon the holy mountain of God\" -- for every nation had and many still have holy mountains: some, Himalayan Peaks, others, Parnassus, and Sinai.\n\nThey were all places of initiation and the abodes of the chiefs of the communities of ancient and even modern adepts.\n\nAnd again: \"Behold, the Assyrian (why not Atlantean, Initiate?) was a cedar in Lebanon; .\n\n.\n\n.\n\nhis height was exalted above all the trees ; .\n\n.\n\n.\n\n.\n\nthe cedars in the garden of God could not hide him, .\n\n.\n\n.\n\nso that all the trees of Eden .\n\n.\n\n.\n\n.\n\nenvied him\" (Ezekiel xxxi.\n\n3-9).\n\nThroughout all Asia Minor, the Initiates were called the \"trees of Righteousness,\" and the cedars of Lebanon, as also were some kings of Israel.\n\nSo were the great adepts in India, but only the adepts of the [[Footnote(s)]] ------------------------------------------------- * The only Pharaoh whom the Bible shows going down into the Red Sea was the king who pursued the Israelites, and who remained unnamed, for very good reasons, perhaps.\n\nThe story was surely made up from the Atlantean legend.\n\n[[Vol.\n\n2, Page]] 495 VARIOUS NAMES FOR INITIATES.\n\nleft hand.\n\nWhen Vishnu Purana narrates that \"the world was overrun with trees,\" while the Prachetasas -- who \"passed 10,000 years of austerity in the vast ocean\" -- were absorbed in their devotions, the allegory relates to the Atlanteans and the adepts of the early Fifth Race -- the Aryans.\n\nOther \" trees (adept Sorcerers) spread, and overshadowed the unprotected earth; and the people perished .\n\n.\n\n.\n\nunable to labour for ten thousand years.\" Then the sages, the Rishis of the Aryan race, called Prachetasas, are shown \"coming forth from the deep, \" * and destroying by the wind and flame issuing from their mouths, the iniquitous \"trees\" and the whole vegetable kingdom; until Soma (the moon), the sovereign of the vegetable world, pacifies them by making alliance with the adepts of the Right Path, to whom he offers as bride Marisha, \"the offspring of the trees.\"** This means that which is given in the Stanzas and Commentaries, and what is also given in Part II .\n\nof Vol.\n\nI., \"The Sacred Island.\" It hints at the great struggle between the \"Sons of God\" and the Sons of the Dark Wisdom -- our forefathers; or the Atlantean and the Aryan Adepts.\n\nThe whole History of that period is allegorized in the Ramayana, which is the mystic narrative in epic form of the struggle between Rama -- the first king of the divine dynasty of the early Aryans -- and Ravana, the symbolical personation of the Atlantean (Lanka) race.\n\nThe former were the incarnations of the Solar Gods; the latter, of the lunar Devas.\n\nThis was the great battle between Good and Evil, between white and black magic, for the supremacy of the divine forces, or of the lower terrestrial or cosmic powers.\n\nIf the student would understand better the last statement, let him turn to the Anugita episode of the Mahabharata, chapter v., where the Brahmana tells his wife, \"I have perceived by means of the Self the seat abiding in the Self -- (the seat) where dwells the Brahman free from the pairs of opposites and the moon, together with the fire (or the sun), upholding (all) beings (as), the mover of the intellectual principle.\" The moon is the deity of the mind (Manas) but only on the lower plane.\n\n\"Manas is dual -- lunar in the lower, solar in its upper portion,\" says a commentary.\n\nThat is to say, it is attracted in its higher aspect towards Buddhi, and in its [[Footnote(s)]] ------------------------------------------------- * Vishnu Purana, Book I., ch.\n\nxv.\n\n** This is pure allegory.\n\nThe waters are a symbol of wisdom and of occult learning.\n\nHermes represented the sacred Science under the symbol of fire ; the Northern Initiates, under that of water.\n\nThe latter is the production of Nara , the \"Spirit of God,\" or rather Paramatman , the \"Supreme Soul,\" says Kulluka Bhatta, Narayana, meaning \"he who abides in the deep\" or plunged in the Waters of Wisdom -- \"water being the body of Nara\" ( Vayu ).\n\nHence arises the statement that for 10,000 years they remained in austerity \"in the vast Ocean\"; and are shown emerging from it.\n\nEa, the God of Wisdom, is the \"Sublime Fish,\" and Dagon or Oannes is the Chaldean man-fish, who emerges from the waters to teach wisdom.\n\n[[Vol.\n\n2, Page]] 496 THE SECRET DOCTRINE.\n\nlower descends into, and listens to the voice of its animal soul full of selfish and sensual desires; and herein is contained the mystery of an adept's as of a profane man's life, as also that of the post-mortem separation of the divine from the animal man.\n\nThe Ramayana -- every line of which has to be read esoterically -- discloses in magnificent symbolism and allegory the tribulations of both man and soul.\n\n\"Within the body, in the midst of all these life-winds (?"


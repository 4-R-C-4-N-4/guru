[content]
body = "Let us admit for a moment an absolutely homogeneous state of the Universe, and our conception of force falls down to nought.\" [[Footnote(s)]] ------------------------------------------------- * On the plane of manifestation and illusionary matter it may be so; not that it is nothing more, for it is vastly more.\n\n** Neutral, or zero.\n\n[[Vol.\n\n1, Page]] 518 THE SECRET DOCTRINE.\n\n\"Therefore it becomes evident that the force, which materialism considers as the cause of the diversity that surrounds us, is in sober reality only an effect, a result of that diversity.\n\nFrom such point of view force is not the cause of motion, but a result, while the cause of that force, or forces, is not the substance or matter, but motion itself.\n\nMatter thus must be laid aside and with it the basic principle of materialism, which has become unnecessary, as force brought down to a state of motion can give no idea of the substance.\n\nIf force is the result of motion, then it becomes incomprehensible why that motion should become witness to matter and not to Spirit or a Spiritual essence.\n\nTrue, our reason cannot conceive of a motion minus something moving (and our reason is right); but the nature or esse of that something moving remains to Science entirely unknown; and the Spiritualist, in such case, has as much right to attribute it to a \"Spirit,\" as a Materialist to creative and all-potential matter.\n\nA Materialist has no special privileges in this instance, nor can he claim any.\n\nThe law of the conservation of energy, as thus seen, is shown to be illegitimate in its pretensions and claims in this case.\n\nThe \"great dogma\" -- no force without matter and no matter without force -- falls to the ground, and loses entirely the solemn significance with which materialism has tried to invest it.\n\nThe conception of force still gives no idea of matter and compels us in no way to see in it \"the origin of all origins.\" (\" Scientific Letters ,\" Professor Butlerof.\n\n) We are assured that real science is not materialistic; and our own conviction tells us that it cannot be so, when its learning is real.\n\nThere is a good reason for it, well defined by some physicists and chemists themselves.\n\nNatural sciences cannot go hand in hand with materialism.\n\nTo be at the height of their calling, men of science have to reject the very possibility of materialistic doctrines having aught to do with the atomic theory; and we find that Lange, Butlerof, Du Bois Reymond, -- the latter probably unconsciously -- and several others, have proved it.\n\nAnd it is, furthermore, demonstrated by the fact, that Kanada in India, and Leucippus, Democritus, and after them Epicurus -- the earliest atomists in Europe -- while propagating their doctrine of definite proportions, believed in Gods or supersensuous entities, at the same time.\n\nTheir ideas upon matter thus differed from those now prevalent.\n\nWe must be allowed to make our statement clearer in a short synopsis of the ancient and modern views of philosophy upon atoms, and thus prove that the atomic theory kills Materialism.\n\nFrom the standpoint of Materialism, which reduces the beginnings of all to matter , the Universe consists, in its fullness, of atoms and vacuity.\n\nEven leaving aside the axiom -- now absolutely demonstrated by telescope and microscope -- taught by the ancients, that nature abhors [[Vol.\n\n1, Page]] 519 THE VICIOUS CIRCLE.\n\nvacuum, what is an atom?\n\n\"It is, we are answered by Science,\" writes Professor Butlerof, \"the limited division of substance, the indivisible particle of matter.\n\nTo admit the divisibility of the atom, amounts to an admission of an infinite divisibility of substance, which is equivalent to reducing substance to nihil , a nothingness.\n\nOwing to a feeling of self-preservation alone, materialism cannot admit infinite divisibility; otherwise, it would have to bid farewell for ever to its basic principle and thus sign its own death-warrant.\" Buchner, for instance, like a true dogmatist in materialism, declares that \"to accept infinite divisibility is absurd, and amounts to doubting the very existence of matter.\" The Atom is indivisible then, saith Materialism?\n\nVery well.\n\n\"See now what a curious contradiction this fundamental principle of the materialists is leading them into,\" writes Butlerof.\n\n\"The atom is indivisible , and at the same time we know it to be elastic.\n\nAn attempt to deprive it of elasticity is unthinkable; it would amount to an absurdity.\n\nAbsolutely non - elastic atoms could never exhibit a single one of those numerous phenomena that are attributed to their correlations.\n\nWithout any elasticity, the atoms could not manifest their energy, and the substance of the materialists would remain weeded of every force.\n\nTherefore, if the Universe is composed of atoms, then those atoms must be elastic.\n\nIt is here that we meet with an insuperable obstacle.\n\nFor, what are the conditions requisite for the manifestation of elasticity?\n\nAn elastic ball, when striking against an obstacle, is flattened and contracts, which it would be impossible for it to do, were not that ball to consist of particles, the relative position of which experiences at the time of the blow a temporary change.\n\nThis may be said of elasticity in general; no elasticity is possible without change with respect to the position of the compound particles of an elastic body.\n\nThis means that the elastic body is changeful and consists of particles, or, in other words, that elasticity can pertain only to those bodies that are divisible.\n\nAnd the atom is elastic.\" This is sufficient to show how absurd are the simultaneous admissions of the non-divisibility and elasticity of the atom.\n\nThe atom is elastic, ergo , the atom is divisible, and must consist of particles, or of sub -atoms.\n\nAnd these sub -atoms?\n\nThey are either non-elastic, and in such case they represent no dynamic importance, or, they are elastic also; and in that case, they, too, are subject to divisibility.\n\nAnd thus ad infinitum.\n\nBut infinite divisibility of atoms resolves matter into simple centres of force, i.e.\n\n, precludes the possibility of conceiving matter as an objective substance.\n\nThis vicious circle is fatal to materialism.\n\nIt finds itself caught in its own nets, and no issue is possible for it out of the dilemma.\n\nIf it says that the atom is indivisible, then it will have mechanics asking it the awkward question: \"How does the Universe move in this case, and how do its forces correlate?\n\nA world built on absolutely non -elastic atoms, is like an engine without steam, it is doomed to eternal inertia.\"* [[Footnote(s)]] ------------------------------------------------- * \"Scientific Letters,\" Butlerof.\n\n[[Vol.\n\n1, Page]] 520 THE SECRET DOCTRINE.\n\nAccept the explanations and teachings of Occultism, and, the blind inertia of physical Science being replaced by the intelligent active Powers behind the veil of matter, motion and inertia become subservient to those Powers.\n\nIt is on the doctrine of the illusive nature of matter, and the infinite divisibility of the atom, that the whole science of Occultism is built."


[content]
body = "Adam Kadmon or Tetragrammaton is the Logos in the Kabala; therefore this triad answers in the latter to the highest triangle of Kether, Chochmah and Binah, the last a female potency and at the same time the male Jehovah, as partaking of the nature of Chochmah, or the male Wisdom.\n\n** The Secret Doctrine teaches that the Sun is a central Star and not a planet.\n\nYet the Ancients knew of and worshipped seven great gods, excluding the Sun and Earth.\n\nWhich was that \"Mystery God\" they set apart?\n\nOf course not Uranus, discovered only by Herschel in 1781.\n\nBut could it not be known by another name?\n\nSays the [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 100 THE SECRET DOCTRINE.\n\nso to say, the Adityas are, in their primitive most ancient meanings, the eight, and the twelve great gods of the Hindu Pantheon.\n\n\"The Seven allow the mortals to see their dwellings, but show themselves only to the Arhats,\" says an old proverb, \"their dwellings\" standing here for planets.\n\nThe ancient Commentary gives an allegory and explains it: -- \" Eight houses were built by Mother.\n\nEight houses for her Eight Divine sons; four large and four small ones.\n\nEight brilliant suns, according to their age and merits.\n\nBal-ilu ( Martanda ) was not satisfied, though his house was the largest.\n\nHe began ( to work ) as the huge elephants do.\n\nHe breathed ( drew in ) into his stomach the vital airs of his brothers.\n\nHe sought to devour them.\n\nThe larger four were far away; far, on the margin of their kingdom.* They were not robbed ( affected ) , and laughed.\n\nDo your worst, Sir, you cannot reach us, they said.\n\nBut the smaller wept.\n\nThey complained to the Mother.\n\nShe exiled Bal-i-lu to the centre of her Kingdom, from whence he could not move.\n\n( Since then ) he ( only ) watches and threatens.\n\nHe pursues them, turning slowly around himself, they turning swiftly from him, and he following from afar the direction in which his brothers move on the path that encircles their houses.** From that day he feeds on the sweat of the Mother ' s body.\n\nHe fills himself with her breath and refuse.\n\nTherefore, she rejected him.\n\n\" Thus the \"rejected Son\" being our Sun, evidently, as shown above, the \"Sun-Sons\" refer not only to our planets but to the heavenly bodies in general.\n\nHimself only a reflection of the Central Spiritual Sun, Surya is the prototype of all those bodies that evolved after him.\n\nIn the Vedas he is called Loka-Chakshuh, \"the Eye of the World\" (our [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] author of \"Maconnerie Occulte\": -- \"Occult Sciences having discovered through astronomical calculations that the number of the planets must be seven, the ancients were led to introduce the Sun into the scale of the celestial harmonies, and make him occupy the vacant place.\n\nThus, every time they perceived an influence that pertained to none of the six planets known, they attributed it to the Sun.\n\nThe error only seems important, but was not so in practical results, if the ancient astrologers replaced Uranus by the Sun, which is a central Star relatively motionless, turning only on its axis and regulating time and measure; and which cannot be turned aside from its true functions.\" .\n\n.\n\n.\n\n.\n\n.\n\n.\n\nThe nomenclature of the days of the week is thus faulty.\n\n\"The Sun-Day ought to be Uranus-day (Urani dies, Urandi),\" adds the learned writer, Ragon.\n\n* Planetary System.\n\n** \"The Sun rotates on his axis always in the same direction in which the planets revolve in their respective orbits,\" astronomy teaches us.\n\n[[Vol.\n\n1, Page]] 101 FIRE, THE GREAT SYMBOL OF DEITY.\n\nplanetary world), and he is one of the three chief deities.\n\nHe is called indifferently the Son of Dyaus and of Aditi, because no distinction is made with reference to, or scope allowed for, the esoteric meaning.\n\nThus he is depicted as drawn by seven horses, and by one horse with seven heads; the former referring to his seven planets, the latter to their one common origin from the One Cosmic Element.\n\nThis \"One Element\" is called figuratively \" F IRE.\" The Vedas (Aitareya-Brahmana of Haug also; p.\n\ni) teach \"that the fire verily is all the deities.\" (Narada in Anugita).\n\nThe meaning of the allegory is plain, for we have both the Dzyan Commentary and modern science to explain it, though the two differ in more than one particular.\n\nThe Occult Doctrine rejects the hypothesis born out of the Nebular Theory, that the (seven) great planets have evolved from the Sun's central mass, not of this our visible Sun, at any rate.\n\nThe first condensation of Cosmic matter of course took place about a central nucleus, its parent Sun; but our sun, it is taught, merely detached itself earlier than all the others, as the rotating mass contracted, and is their elder, bigger brother therefore, not their father.\n\nThe eight Adityas, \"the gods,\" are all formed from the eternal substance (Cometary matter* -- the Mother) or the \"World-Stuff \" which is both the fifth and the sixth COSMIC Principle, the Upadhi or basis of the Universal Soul, just as in man, the Microcosm, Manas** is the Upadhi of Buddhi.*** ( d ) There is a whole poem on the pregenetic battles fought by the growing planets before the final formation of Kosmos, thus accounting for the seemingly disturbed position of the systems of several planets, the plane of the satellites of some (of Neptune and Uranus, for instance, of which the ancients knew nothing, it is said) being tilted over, thus giving them an appearance of retrograde motion.\n\nThese planets are called the warriors, the Architects, and are accepted by the [[Footnote(s)]] ------------------------------------------------- * This Essence of Cometary matter, Occult Science teaches, is totally different from any of the chemical or physical characteristics with which modern science is acquainted.\n\nIt is homogeneous in its primitive form beyond the Solar Systems, and differentiates entirely once it crosses the boundaries of our Earth's region, vitiated by the atmospheres of the planets and the already compound matter of the interplanetary stuff, heterogeneous only in our manifested world.\n\n** Manas -- the Mind-Principle, or the human Soul.\n\n*** Buddhi -- the divine Soul.\n\n[[Vol.\n\n1, Page]] 102 THE SECRET DOCTRINE.\n\nRoman Church as the leaders of the heavenly Hosts, thus showing the same traditions."


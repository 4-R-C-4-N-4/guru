body = "But, as the Stanza has it: \" the inner man (the conscious Entity) was not.\n\n\" This \"Conscious Entity\" Occultism says, comes from, nay, in many cases is, the very entire essence and esse of the high Intelligences condemned, by the undeviating law of Karmic evolution, to reincarnate in this manvantara.\n\n[[Footnote(s)]] ------------------------------------------------- * No one of these orders is distinct from the Pitris or Progenitors, as says Manu (iii.\n\n284).\n\n\"The wise call our fathers Vasus; our paternal grandfathers, Rudras; our paternal great grandfathers, Adityas; agreeably to a text of the Vedas,\" or \"this is an everlasting Vedic text\" in another translation.\n\n** As now discovered by the late G.\n\nSmith in the Babylonian cylinder literature, it was the same in Chaldean theogony.\n\nIshtar, \"eldest of Heaven and of Earth.\" Below him the Igaga or Angels of Heaven, and the Anunnaki, or angels of Earth.\n\nBelow these again various classes of Spirits and \"Genii\" called Sadu, Vadukku, Ekimu, Gallu -- of which some were good, some evil.\n\n(See \" Babylonian Mythology.\n\n\") [[Vol.\n\n2, Page]] 249 SCIENTIFIC ANTHROPOLOGY IN THE PURANAS.\n\n( b ) This verse (thirty-ninth) relates exclusively to the racial divisions.\n\nStrictly speaking, esoteric philosophy teaches a modified polygenesis.\n\nFor, while it assigns to humanity a oneness of origin, in so far that its forefathers or \"Creators\" were all divine beings -- though of different classes or degrees of perfection in their hierarchy -- men were nevertheless born on seven different centres of the continent of that period.\n\nThough all of one common origin, yet for reasons given their potentialities and mental capabilities, outward or physical forms, and future characteristics, were very different.* As to their complexions, there is a suggestive allegory told in Linga Purana.\n\nThe Kumdra -- the Rudra gods, so called ( see further ), are described as incarnations of Siva, the destroyer (of outward forms ), named also Vamadeva.\n\nThe latter, as a Kumara, the \"Eternal Celibate,\" the chaste Virgin youth, springs from Brahma in each great Manvantara, and \"again becomes four\"; a reference to the four great divisions of the human races, as regards complexion and type -- and three chief variations of these.\n\nThus in the 29th Kalpa -- in this case a reference to the transformation and evolution of the human form which Siva ever destroys and remodels periodically, down to the manvantaric great turning point about the middle of the Fourth (Atlantean) Race -- in the 29th Kalpa, Siva, as Swetalohita, the root Kumara, becomes, from moon-coloured, white ; in his next transformation -- he is red (and in this the exoteric version differs from the Esoteric teaching); in the third -- yellow ; in the fourth -- black.\n\nEsotericism now classes these seven variations, with their four great divisions, into only three distinct primeval races -- as it does not take into consideration the First Race, which had neither type nor colour, and hardly an objective, though colossal form.\n\nThe evolution of these races, their formation and development, went pari passu and on parallel lines with the evolution, formation, and development of three geological strata, from which the human complexion was as much derived as it was determined by the climates of those zones.\n\nIt names three great divisions, namely, the RED-YELLOW, the BLACK, and the BROWN-WHITE.** The Aryan races, for instance, now varying from dark brown, almost black, red-brown-yellow, down to the whitest creamy colour, are yet all of one and the same stock -- the Fifth Root-Race -- and spring [[Footnote(s)]] ------------------------------------------------- * Some superior, others inferior, to suit the Karma of the various reincarnating Monads which could not be all of the same degree of purity in their last births in other worlds.\n\nThis accounts for the difference of races, the inferiority of the savage, and other human varieties.\n\n** \"There are,\" says Topinard (English edition of \"Anthropology,\" with preface by Professor Broca), \"THREE fundamental elements of colour in the human organism -- namely, the red , the yellow, and the black, which, mixed in variable quantities with the white of the tissues, give rise to those numerous shades seen in the human family.\" Here is science unintentionally supporting Occultism again.\n\n[[Vol.\n\n2, Page]] 250 THE SECRET DOCTRINE.\n\nfrom one single progenitor, called in Hindu exotericism by the generic name of Vaivasvata Manu: the latter, remember, being that generic personage, the Sage, who is said to have lived over 18,000,000 years ago, and also 850,000 years ago -- at the time of the sinking of the last remnants of the great continent of Atlantis* ( See the Root and Seed Manus further on), and who is said to live even now in his mankind.\n\n( Vide at the end of this Stanza, \" T HE P RIMEVAL M ANUS OF H UMANITY.\") The light yellow is the colour of the first SOLID human race, which appeared after the middle of the Third Root Race ( after its fall into generation -- as just explained), bringing on the final changes.\n\nFor, it is only at that period that the last transformation took place, which brought forth man as he is now, only on a magnified scale.\n\nThis Race gave birth to the Fourth Race; \"Siva\" gradually transforming that portion of Humanity which became \"black with sin\" into red-yellow (the red Indians and the Mongolians being the descendants of these) and finally into Brown-white races -- which now, together with the yellow Races, form the great bulk of Humanity.\n\nThe allegory in Linga Purana is curious, as showing the great ethnological knowledge of the ancients.\n\nWhen reading of \"the last transformation,\" let the reader consider at this juncture, if that took place 18,000,000 years ago, how many millions more it must have required to reach that final stage?\n\nAnd if man, in his gradual consolidation, developed pari passu with the earth, how many millions of years must have elapsed during the First, Second, and the first half of the Third Race?\n\nFor the Earth was in a comparatively ethereal condition before it reached its last consolidated state; the archaic teachings, moreover, telling us that, during the middle period of the Lemuro-Atlantean Race, three and a half Races after the Genesis of man, the Earth, man, and everything on the Globe was of a still grosser and more material nature, while such things as corals and some shells were still in a semi-gelatinous, astral state."


[content]
body = "\" From the second Round , Earth - - hitherto a foetus in the matrix of Space -- began its real existence: it had developed individual sentient life , its second principle.\n\nThe second corresponds to the sixth ( principle ) ; the second is life continuous , the other , temporary.\n\n\" The Third Round developed the third Principle -- W ATER; while the Fourth transformed the gaseous fluids and plastic form of our globe into the hard, crusted, grossly material sphere we are living on.\n\n\"Bhumi\" has reached her fourth principle.\n\nTo this it may be objected that the law of analogy, so much insisted upon, is broken.\n\nNot at all.\n\nEarth will reach her true ultimate form -- (inversely in this to man) -- her body shell -- only toward the end of the manvantara after the Seventh Round.\n\nEugenius Philalethes was right when he assured his readers on his word of honour that no one had yet seen the Earth ( i.e.\n\n, M ATTER in its essential form).\n\nOur globe is, so far, in its Kamarupic state -- the astral body of desires of Ahamkara , dark Egotism, the progeny of Mahat, on the lower plane.\n\n.\n\n.\n\n.\n\nIt is not molecularly constituted matter -- least of all the human body ( sthulasarira ) -- that is the grossest of all our \"principles,\" but verily the middle principle, the real animal centre; whereas our body is but its shell, the irresponsible factor and medium through which the beast in us acts all its life.\n\nEvery intellectual theosophist will understand my real meaning.\n\nThus the idea that the human tabernacle is built by countless lives , just in the same way as the rocky crust of our Earth was, has nothing repulsive in it for the true mystic.\n\nNor can Science oppose the occult teaching, for it is not because the microscope will ever fail to detect the ultimate living atom or life, that it can reject the doctrine.\n\n( c ) Science teaches us that the living as well as the dead organism of both man and animal are swarming with bacteria of a hundred various [[Vol.\n\n1, Page]] 261 THE OCCULT CHEMISTRY.\n\nkinds; that from without we are threatened with the invasion of microbes with every breath we draw, and from within by leucomaines, aerobes, anaerobes, and what not.\n\nBut Science never yet went so far as to assert with the occult doctrine that our bodies, as well as those of animals, plants, and stones, are themselves altogether built up of such beings; which, except larger species, no microscope can detect.\n\nSo far, as regards the purely animal and material portion of man, Science is on its way to discoveries that will go far towards corroborating this theory.\n\nChemistry and physiology are the two great magicians of the future, who are destined to open the eyes of mankind to the great physical truths.\n\nWith every day, the identity between the animal and physical man, between the plant and man, and even between the reptile and its nest, the rock, and man -- is more and more clearly shown.\n\nThe physical and chemical constituents of all being found to be identical, chemical science may well say that there is no difference between the matter which composes the ox and that which forms man.\n\nBut the Occult doctrine is far more explicit.\n\nIt says: --- Not only the chemical compounds are the same, but the same infinitesimal invisible lives compose the atoms of the bodies of the mountain and the daisy, of man and the ant, of the elephant, and of the tree which shelters him from the sun.\n\nEach particle -- whether you call it organic or inorganic -- is a life.\n\nEvery atom and molecule in the Universe is both life - giving and death-giving to that form, inasmuch as it builds by aggregation universes and the ephemeral vehicles ready to receive the transmigrating soul, and as eternally destroys and changes the forms and expels those souls from their temporary abodes.\n\nIt creates and kills; it is self-generating and self-destroying; it brings into being, and annihilates, that mystery of mysteries -- the living body of man, animal, or plant, every second in time and space; and it generates equally life and death, beauty and ugliness, good and bad, and even the agreeable and disagreeable, the beneficent and maleficent sensations.\n\nIt is that mysterious L IFE, represented collectively by countless myriads of lives, that follows in its own sporadic way, the hitherto incomprehensible law of Atavism; that copies family resemblances as well as those it finds impressed in the aura of the generators of every future human being, a mystery, in short, that will receive fuller attention elsewhere.\n\nFor the present, one instance may be cited in illustration.\n\nModern science begins to find out that ptomaine (the alkaloid poison generated by decaying matter and corpses -- a life also) extracted [[Vol.\n\n1, Page]] 262 THE SECRET DOCTRINE.\n\nwith the help of volatile ether, yields a smell as strong and equal to that of the freshest orange-blossoms; but that free from oxygen, these alkaloids yield either a most sickening, disgusting smell, or the most agreeable aroma which recalls that of the most delicately scented flowers.\n\nAnd it is suspected that such blossoms owe their agreeable smell to the poisonous ptomaine; the venomous essence of certain mushrooms (fungi) being nearly identical with the venom of the cobra of India, the most deadly of serpents.* Thus, having discovered the effects, Science has to find their PRIMARY CAUSES; and this it can never do without the help of the old sciences, of alchemy, occult botany and physics.\n\nWe are taught that every physiological change, in addition to pathological phenomena; diseases -- nay, life itself -- or rather the objective phenomena of life, produced by certain conditions and changes in the tissues of the body which allow and force life to act in that body; that all this is due to those unseen CREATORS and DESTROYERS that are called in such a loose and general way, microbes.** Such [[Footnote(s)]] ------------------------------------------------- *The French savants Arnaud, Gautier, and Villiers, have found in the saliva of living men the same venomous alkaloid as in that of the toad, the salamander, the cobra, and the trigonocephalus of Portugal.\n\nIt is proven that venom of the deadliest kind, whether called ptomaine, or leucomaine, or alkaloid, is generated by living men, animals, and plants.\n\nThe same savant, Gautier, discovered an alkaloid in the fresh meat of an ox and in its brains, and a venom which he calls Xanthocreatinine similar to the substance extracted from the poisonous saliva of reptiles.\n\nIt is the muscular tissues, as being the most active organ in the animal economy, that are suspected of being the generators or factors of venoms, having the same importance as carbonic acid and urea in the functions of life, which venoms are the ultimate products of inner combustion."


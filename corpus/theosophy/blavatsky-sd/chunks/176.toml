body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n1 [[Vol.\n\n1, Page]] 368 THE SECRET DOCTRINE.\n\n[[This page continued from previous section ]] § VII.\n\nTHE DAYS AND NIGHTS OF BRAHMA.\n\nT HIS is the name given to the Periods called M ANVANTARA ( Manuantara , or between the Manus) and P RALAYA (Dissolution); one referring to the active periods of the Universe, the other to its times of relative and complete rest -- according to whether they occur at the end of a \"Day,\" or an \"Age\" (a life) of Brahma.\n\nThese periods, which follow each other in regular succession, are also called Kalpas , small and great, the minor and the Maha Kalpa; though, properly speaking, the Maha Kalpa is never a \"day,\" but a whole life or age of Brahma, for it is said in the Brahma Vaivarta: \"Chronologers compute a Kalpa by the Life of Brahma; minor Kalpas, as Samvarta and the rest, are numerous.\" In sober truth they are infinite; as they have never had a commencement, i.e.\n\n, there never was a first Kalpa, nor will there ever be a last one, in Eternity.\n\nOne Parardha -- in the ordinary acceptation of this measure of time -- or half of the existence of Brahma (in the present Maha Kalpa ) has already expired; the last Kalpa was the Padma, or that of the Golden Lotos; the present one being Varaha* (the \"boar\" incarnation, or Avatar ) .\n\n[[Footnote(s)]] ------------------------------------------------- * There is a curious piece of information in the Buddhist esoteric traditions.\n\nThe exoteric or allegorical biography of Gautama Buddha shows this great Sage dying of an indigestion of pork and rice , a very prosaic end, indeed, having little of the solemn element in it.\n\nThis is explained as an allegorical reference to his having been born in the \"Boar,\" or Varaha-Kalpa when Brahma assumed the form of that animal to raise the Earth out of the \"Waters of Space.\" And as the Brahmins descend direct from Brahma and are, so to speak, identified with him; and as they are at the same time the mortal enemies of Buddha and Buddhism, we have the curious allegorical hint and combination.\n\nBrahminism (of the Boar, or Varaha Kalpa ) has slaughtered the religion of Buddha in India, swept it away from its face; therefore Buddha, identified with his philosophy, is said to have died from the effects of eating of the flesh of a wild hog.\n\n[[Footnote continued on next page]] [[Vol.\n\n1, Page]] 369 HUMAN GODS AND DIVINE MEN.\n\nBy the scholar who studies the Hindu religion from the Puranas, one thing is to be especially noted.\n\nHe must not take literally, and in one sense only, the statements therein found; since those which especially concern the Manvantaras or Kalpas have to be understood in their several references.\n\nSo, for instance, these periods relate in the same language to both the great and the small periods, to Maha Kalpas and to minor Cycles.\n\nThe Matsya , or Fish Avatar, happened before the Varaha or Boar Avatar; the allegories, therefore, must relate to both the Padma and the present manvantara, and also to the minor cycles which took place since the reappearance of our Chain of Worlds and Earth.\n\nAnd, as the Matsya Avatar of Vishnu and Vaivasvata's Deluge are correctly connected with an event that happened on our Earth during this Round, it is evident that while it may relate to pre-cosmic events (in the sense of our Kosmos or Solar system) it has reference in our case to a distant geological period.\n\nNot even Esoteric philosophy can claim to know, except by analogical inference, that which took place before the reappearance of our Solar System and previous to the last Maha Pralaya.\n\nBut it teaches distinctly that after the first geological disturbance in the Earth's axis which ended in the sweeping down to the bottom of the Seas of the whole second Continent, with its primeval races -- of which successive \"Earths\" or Continents Atlantis was the fourth -- there came another disturbance by the axis resuming as rapidly its previous degree of inclination; when the Earth was indeed raised once more out of the Waters, and -- as above so it is below; and vice versa.\n\nThere were \"gods\" on Earth in those days -- gods, and not men, as we know them now, says the tradition.\n\nAs will be shown in Book II., the computation of periods in exoteric Hinduism refers to both the great cosmic and the small terrestrial events and cataclysms, and the same may be shown for names.\n\nFor instance Yudishthira -- the first King of the Sacea , who opens the Kali Yuga era, which has to last 432,000 years -- \"an actual King and man who lived 3,102 years B.C.,\" applies also, name and all, to the great Deluge at the time of the first sinking of Atlantis.\n\nHe is the \"Yudishthira* born on the mountain of the hundred peaks at the extremity of [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] The idea alone of one who established the most rigorous vegetarianism and respect for animal life -- even to refusing to eat eggs as vehicles of a latent future life -- dying of a meat indigestion, is absurdly contradictory and has puzzled more than one Orientalist.\n\nBut this explanation, unveiling the allegory, explains all the rest.\n\nThe Varaha , however, is no simple boar, and seems to have meant at first some antediluvian lacustrine animal \"delighting to sport in water.\" ( Vayu Purana.\n\n) * According to Colonel Wilford, the conclusion of the \"Great War\" was B.C.\n\n1370.\n\n( See A.\n\nR.\n\n, Vol.\n\n9, p .\n\n116); according to Bentley, 575 B.C.!!\n\nWe may hope, perhaps, that before the end of this century, the Mahabharatean epics will be found and proclaimed identical with the wars of the great Napoleon.\n\n[[Vol.\n\n1, Page]] 370 THE SECRET DOCTRINE.\n\nthe world beyond which nobody can go \" and \"immediately after the flood.\" ( See Royal Asiat.\n\nSoc.\n\n, Vol.\n\n9, p .\n\n364.) We know of no \"Flood\" 3,102 years B.C.\n\n-- not even that of Noah, for, agreeably with Judaeo-Christian chronology, it took place 2,349 years B.C.\n\nThis relates to an esoteric division of time and a mystery explained elsewhere, and may therefore be left aside for the present.\n\nSuffice to remark at this juncture that all the efforts of imagination of the Wilfords, Bentleys, and other would-be OEdipuses of esoteric Hindu Chronology have sadly failed."


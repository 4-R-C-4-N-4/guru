[content]
body = "Rawlinson is so very confident in his works of an Aryan or Vedic influence on the early mythology of Babylon.\n\nNor is it to be much wondered at that the alleged ten tribes of Israel disappeared during the captivity period, without leaving a trace behind them, when we are informed that the Jews had de facto but two tribes -- those of J udah and of Levi.\n\nThe Levies, moreover, were not a tribe at all, but a priestly caste.\n\nThe descendants have only followed their progenitors, the various patriarchs, into thin, sidereal air.\n\nThere were Brahms and A-brahms, in days of old, truly, and before the first Jew had been born.\n\nEvery nation held its first god and gods to be androgynous; nor could it be otherwise, since they regarded their distant primeval progenitors, their dual-sexed ancestors, as divine Beings and Gods, just as do the Chinese to this day.\n\nAnd they were divine in one sense, as also were their first human progeny, the \"mind-born\" primitive humanity, which were most assuredly bi-sexuals as all the more ancient symbols and traditions show.\n\nUnder the emblematical devices and peculiar phraseology of the priesthood of old, lie latent hints of sciences as yet undiscovered during the present cycle.\n\nWell acquainted as may be a scholar with the hieratic writing and hieroglyphical system of the Egyptians, he must first of all learn to sift their records.\n\nHe has to assure himself, compasses and rule in hand, that the picture writing he is examining fits, to a line, certain fixed geometrical figures which are the hidden keys to such records, before he ventures on an interpretation.\" \"But there are myths which speak for themselves.\n\nIn this class we may include the double-sexed first creators of every Cosmogony.\n\nThe Greek Zeus-Zen (AEther), and Chthonia (the chaotic earth) and Metis (water), his wives; Osiris and Isis-Latona -- the former god also representing AEther, the first emanation of the Supreme Deity, Amun, the primeval source of Light; the goddess Earth and Water again; Mithras, the rock-born god, the symbol of the male mundane fire, or the personified primordial light, and Mithra, the fire goddess, at once his mother and his wife; the pure element of fire (the active, or male principle) regarded as light and heat, in conjunction with Earth and Water, or Matter, the female or passive element of cosmical generation\" -- all these are records of the primeval divine Hermaphrodite."


body = "\"I am the fish and seat of the great Horus of Kem-our,\" says the mummy-form God with the crocodile's head ( ch.\n\nlxxxviii., 2 , \" Book of the Dead \") .\n\nWith the Peratae Gnostics it is Chozzar (Neptune), who converts into a sphere the dodecagonal pyramid, \"and paints its gate with many colours.\" He has FIVE androgyne ministers -- he is Makara, the Leviathan.\n\nThe rising Sun being considered the Soul of the Gods sent to manifest itself to men every day, and the crocodile rising out of the water at the first sunbeam, that animal came finally to personify a Solar-fire devotee in India, as it personified that fire, or the highest soul with the Egyptians.\n\nIn the Puranas, the number of the Kumaras changes according to the exigencies of the allegory.\n\nFor occult purposes their number is given in one place as seven, then as four, then as five.\n\nIn the Kurma Purana it is said of them: \"These five ( Kumara ) , O Brahman, were Yogins who acquired entire exemption from passion.\" Their very name shows their connection with the said constellation -- the Makara, and with some other Puranic characters connected with the Zodiacal signs.\n\nThis is done in order to veil what was one of the most suggestive glyphs of the primitive Temples.\n\nThey are mixed up astronomically, physiologically, and mystically, in general, with a number of Puranic personages and events.\n\nHardly hinted at in the \" Vishnu, \" they figure in various dramas and events throughout all the other Puranas and sacred literature; so that the Orientalists, having to pick up the threads of connection hither and thither, have ended by proclaiming the Kumaras \"due chiefly to the fancy of the Puranic writers.\" But -- Ma, -- we are told by the author of the \"Twelve Signs of the Zodiac\" -- is Five; kara, a hand with its five fingers, as also a five-sided sign or [[Vol.\n\n2, Page]] 578 THE SECRET DOCTRINE.\n\na pentagon.\n\nThe Kumara (in this case an anagram for occult purposes) are five in esotericism, as Yogis -- because the last two names have ever been kept secret; they are the fifth order of Brahmadevas, and the fivefold Chohans, having the soul of the five elements in them, Water and Ether predominating, and therefore their symbols were both aquatic and fiery .\n\n\"Wisdom lies concealed under the couch of him who rests on the golden lotos ( padma ) floating on the water.\" In India it is Vishnu (one of whose avatars was Budha, as claimed in days of old).\n\nThe Prachetasas, the worshippers of Narayana (who, like Poseidon moved or dwelt over not under the waters), plunged into the depths of the ocean for their devotions and remained therein 10,000 years; and the Prachetasas are ten exoterically, but five , esoterically.\n\n\"Prachetas\" is in Sanskrit, the name of Varuna, the water god, Nereus, an aspect of the same as Neptune, the Prachetasas being thus identical with the \" five ministers\" of [[ CHOZZAR ]] (Poseidon) of the Peratae Gnostics.\n\nThese are respectively called [[ AOT, AOAI, OTO, OTOB ]], \"the fifth, a triple name (making Seven) being lost\"* -- i.e.\n\n, kept secret.\n\nThis much for the \"aquatic\" symbol; the \"fiery\" connecting them with the fiery symbol -- spiritually.\n\nFor purposes of identity, let us remember that as the mother of the Prachetasas was Savarna, the daughter of the Ocean, so was Amphitrite the mother of Neptune's mystic \"ministers.\" Now the reader is reminded that these \"five ministers\" are symbolized both in the Dolphin, who had overcome the chaste Amphitrite's unwillingness to wed Poseidon, and in Triton their son.\n\nThe latter, whose body above the waist is that of a man and below a dolphin, a fish, is, again, most mysteriously connected with Oannes, the Babylonian Dag , and further also with the (fish) Avatar of Vishnu, Matsya, both teaching mortals Wisdom.\n\nThe Dolphin, as every mythologist knows, was placed for his service by Poseidon among the constellations, and became with the Greeks, Capricornus, the goat, whose hind part is that of a dolphin, thus shown identical with Makara, whose head is also that of an antelope and the body and tail those of a fish.\n\nThis is why the sign of the Makara was borne on the banner of Kama deva, the Hindu god of love, identified, in Atharva Veda, with Agni (the fire-god), the son of Lakshmi, as correctly given by Harivansa.\n\nFor Lakshmi and Venus are one, and Amphitrite is the early form of Venus.\n\nNow Kama (the Makara-ketu ) is \"Aja\" (the unborn), and \"Atma-bhu\" (the self-existent), and Aja is the L OGOS in the Rig-Veda, as he is shown therein to be the first manifestation of the O NE: \"Desire first arose in I T, which was the primal [[Footnote(s)]] ------------------------------------------------- * So is Brahma's fifth head, said to be lost, burnt to ashes by Siva's \"central eye\"; Siva being also panchanana \"five faced.\" Thus the number is preserved and secresy maintained on the true esoteric meaning.\n\n[[Vol.\n\n2, Page]] 579 THE PUZZLES OF SYMBOLISM.\n\ngerm of mind,\" that \"which connects entity with non-entity\" (or Manas, the fifth, with Atma, the seventh, esoterically) say the Sages.\n\nThis is the first stage.\n\nThe second, on the following plane of manifestation, shows Brahma (whom we select as a representative for all the other first gods of the nations) as causing to issue from his body his mind-born sons, \"Sanandana and others,\" who, in the fifth \"creation,\" and again in the ninth (for purposes of blind) become the Kumara.\n\nLet us close by reminding the reader that goats were sacrificed to Amphitrite and the Nereids on the sea-shore, as goats are sacrificed to this day to Durga Kali, who is only the black side of Lakshmi (Venus), the white side of Sakti; and by suggesting what connection these animals may have with Capricornus, in which appear twenty-eight stars in the form of a goat, which goat was transformed by the Greeks into Amalthaea -- Jupiter's foster-mother.\n\nPan, the god of Nature, had goat's feet, and changed himself into a goat at the approach of Typhon."


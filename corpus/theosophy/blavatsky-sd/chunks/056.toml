body = "The larger lumps coalesce and receive new spawn -- in fiery dots, triangles and cubes, which ripen, and at the appointed time some of the lumps detach themselves and assume spheroidal form, a process which they effect only when not interfered with by the others.\n\nAfter which, law No.\n\n* * * comes into operation.\n\nMotion ( the Breath ) becomes the whirlwind and sets them into rotation.\n\n\" *** [[Footnote(s)]] ------------------------------------------------- * It is the knowledge of this law that permits and helps the Arhat to perform his Siddhis, or various phenomena, such as disintegration of matter, the transport of objects from one place to another.\n\n** These are ancient Commentaries attached with modern Glossaries to the Stanzas, as the Commentaries in their symbolical language are usually as difficult to understand as the Stanzas themselves.\n\n*** In a polemical scientific work, \" The Modern Genesis ,\" the author, the Rev.\n\nW.\n\nB.\n\nSlaughter, criticising the position assumed by the astronomers, asks: -- \"It is to be regretted that the advocates of this (nebular) theory have not entered more largely into the discussion of it (the beginning of rotation).\n\nNo one condescends to give us the rationale of it.\n\nHow does the process of cooling and contracting the mass impart to it a rotatory motion?\" The question is amply treated in the Addendum.\n\nIt is not materialistic science that can ever solve it.\n\n\"Motion is eternal in the unmanifested, and periodical in the manifest,\" says an Occult teaching.\n\nIt is \"when heat caused [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 98 THE SECRET DOCTRINE.\n\nSTANZA IV.\n\n-- Continued.\n\n5.\n\n.\n\n.\n\n.\n\n.\n\n.\n\nWHICH IS: ---- \" D ARKNESS,\" THE B OUNDLESS OR THE N O- N UMBER, A DI- N IDANA S VABHAVAT: THE ( for x , unknown quantity ) : I.\n\nT HE A DI- S ANAT, THE N UMBER, FOR HE IS O NE ( a ).\n\nII.\n\nT HE V OICE OF THE W ORD, S VABHAVAT, THE N UMBERS, FOR HE IS O NE AND N INE.* III.\n\nT HE \" F ORMLESS S QUARE.\" ( Arupa.\n\n) ( b ) .\n\nA ND THESE THREE ENCLOSED WITHIN THE ( boundless circle ), ARE THE SACRED FOUR, AND THE TEN ARE THE A RUPA ( subjective , formless ) U NIVERSE ( c ); THEN COME THE \" S ONS,\" THE SEVEN F IGHTERS, THE O NE, THE EIGHTH LEFT OUT, AND HIS B REATH WHICH IS THE L IGHT- M AKER ( Bhaskara ) ( d ).\n\n( a ) \"Adi-Sanat,\" translated literally is the First or \"primeval\" ancient, which name identifies the Kabalistic \"Ancient of Days\" and the \"Holy Aged\" (Sephira and Adam Kadmon) with Brahma the Creator, called also Sanat among his other names and titles.\n\nSvabhavat is the mystic Essence, the plastic root of physical Nature -- \"Numbers\" when manifested; the Number, in its Unity of Substance, on the highest plane.\n\nThe name is of Buddhist use and a Synonym for the four-fold Anima Mundi, the Kabalistic \"Archetypal World,\" from whence proceed the \"Creative, Formative, and the [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] by the descent of FLAME into primordial matter causes its particles to move, which motion becomes Whirlwind.\" A drop of liquid assumes a spheroidal form owing to its atoms moving around themselves in their ultimate, unresolvable, and noumenal essence; unresolvable for physical science, at any rate.\n\n* Which makes ten, or the perfect number applied to the \"Creator,\" the name given to the totality of the Creators blended by the Monotheists into One, as the \"Elohim,\" Adam Kadmon or Sephira -- the Crown -- are the androgyne synthesis of the 10 Sephiroth, who stand for the symbol of the manifested Universe in the popularised Kabala.\n\nThe esoteric Kabalists, however, following the Eastern Occultists, divide the upper Sephirothal triangle from the rest (or Sephira, Chochmah and Binah), which leaves seven Sephiroth.\n\nAs for Svabhavat, the Orientalists explain the term as meaning the Universal plastic matter diffused through Space, with, perhaps, half an eye to the Ether of Science.\n\nBut the Occultists identify it with \"FATHER-MOTHER\" on the mystic plane.\n\n(Vide supra.) [[Vol.\n\n1, Page]] 99 THE OGDOAD AND HEPTAD.\n\nMaterial Worlds\"; the Scintillae or Sparks, -- the various other worlds contained in the last three.\n\nThe Worlds are all subject to Rulers or Regents -- Rishis and Pitris with the Hindus, Angels with the Jews and Christians, Gods, with the Ancients in general.\n\n( b ) This means that the \"Boundless Circle\" (Zero) becomes a figure or number, only when one of the nine figures precedes it, and thus manifests its value and potency, the Word or Logos in union with VOICE and Spirit* (the expression and source of Consciousness) standing for the nine figures and thus forming, with the Cypher, the Decade which contains in itself all the Universe.\n\nThe triad forms within the circle the Tetraktis or Sacred Four, the Square within the Circle being the most potent of all the magical figures.\n\n( c ) The \"One Rejected\" is the Sun of our system.\n\nThe exoteric version may be found in the oldest Sanskrit Scriptures.\n\nIn the Rig Veda, Aditi, \"The Boundless\" or infinite Space, translated by Mr.\n\nMax Muller, \"the visible infinite, visible by the naked eye (!!); the endless expanse beyond the Earth, beyond the clouds, beyond the sky,\" is the equivalent of \"Mother-Space\" coeval with \"Darkness.\" She is very properly called \"The Mother of the Gods,\" D EVA- M ATRI, as it is from her Cosmic matrix that all the heavenly bodies of our system were born -- Sun and Planets.\n\nThus she is described, allegorically, in this wise: \"Eight Sons were born from the body of Aditi; she approached the gods with seven, but cast away the eighth, Martanda,\" our sun.\n\nThe seven sons called the Aditya are, cosmically or astronomically, the seven planets; and the Sun being excluded from their number shows plainly that the Hindus may have known, and in fact knew of a seventh planet, without calling it Uranus.** But esoterically and theologically, [[Footnote(s)]] ------------------------------------------------- * \"In union with the Spirit and the Voice,\" referring to the Abstract Thought and concrete Voice, or the manifestation thereof, the effect of the Cause."


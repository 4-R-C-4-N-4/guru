body = "Others moving in parabolic curves generally escape destruction, owing to their velocity.\n\nSome very critical readers will perhaps imagine that this teaching, as to the cometary stage passed through by all heavenly bodies, is in contradiction with the statements just made as to the moon being the mother of the earth.\n\nThey will perhaps fancy that intuition is needed to harmonize the two.\n\nBut no intuition is in truth required.\n\nWhat does Science know of Comets, their genesis, growth, and ultimate behaviour?\n\nNothing -- absolutely nothing!\n\nAnd what is there so impossible that a laya centre -- a lump of cosmic protoplasm, homogeneous and latent, when suddenly animated or fired up -- should rush from its bed in Space and whirl throughout the abysmal depths in order to strengthen its homogeneous organism by an accumulation and addition of differentiated elements?\n\nAnd why should not such a comet settle in life, live, and become an inhabited globe!\n\n\"The abodes of Fohat are many,\" it is said.\n\n\"He places his four fiery (electro-positive) Sons in the \"Four circles\"; these Circles are the Equator, the Ecliptic, and the two parallels of declination, or the tropics -- to preside over the climates of which are placed the Four mystical Entities.\n\nThen again: \"Other seven (sons) are commissioned to preside over the seven hot, and seven cold lokas (the hells of the orthodox Brahmins) at the two ends of the Egg of Matter (our Earth and its poles).\n\nThe seven lokas are also called the \"Rings,\" elsewhere, and the \"Circles.\" The ancients made the polar circles seven instead of two, as Europeans do; for Mount Meru, which is the North Pole, is said to have seven gold and seven silver steps leading to it.\n\nThe strange statement made in one of the Stanzas: \"The Songs of Fohat and his Sons were radiant as the noon-tide Sun and the Moon combined;\" and that the four Sons on the middle four-fold [[Vol.\n\n1, Page]] 205 SEEING SOUND, HEARING COLOURS.\n\nCircle \" saw their father's songs and heard his Solar-selenic radiance;\" is explained in the Commentary in these words: \"The agitation of the Fohatic Forces at the two cold ends (North and South Poles) of the Earth which resulted in a multicoloured radiance at night, have in them several of the properties of Akasa (Ether) colour and sound as well.\" .\n\n.\n\n.\n\n.\n\n.\n\n.\n\n\"Sound is the characteristic of Akasa (Ether): it generates air, the property of which is Touch; which (by friction) becomes productive of Colour and Light.\" .\n\n.\n\n.\n\n.\n\n.\n\n.\n\n(Vishnu Purana.) Perhaps the above will be regarded as archaic nonsense, but it will be better comprehended, if the reader remembers the Aurora Borealis and Australis, both of which take place at the very centres of terrestrial electric and magnetic forces.\n\nThe two poles are said to be the store-houses, the receptacles and liberators, at the same time, of Cosmic and terrestrial Vitality (Electricity); from the surplus of which the Earth, had it not been for these two natural \"safety-valves,\" would have been rent to pieces long ago.\n\nAt the same time it is now a theory that has lately become an axiom, that the phenomenon of polar lights is accompanied by, and productive of, strong sounds, like whistling, hissing, and cracking.\n\n(But see Professor Trumholdt's works on the Aurora Borealis, and his correspondence regarding this moot question.) ------- STANZA VI.\n\n-- Continued.\n\n7.\n\nM AKE THY CALCULATIONS, O L ANOO, IF THOU WOULDST LEARN THE CORRECT AGE OF THY SMALL WHEEL ( chain ) .\n\nI TS FOURTH SPOKE IS OUR MOTHER ( Earth ) ( a ) .\n\nR EACH THE FOURTH \"FRUIT\" OF THE FOURTH PATH OF KNOWLEDGE THAT LEADS TO N IRVANA, AND THOU SHALT COMPREHEND, FOR THOU SHALT SEE ( b ) .\n\n( a ) The \"small wheel\" is our chain of spheres, and the fourth spoke is our Earth, the fourth in the chain.\n\nIt is one of those on which the \"hot (positive) breath of the Sun\" has a direct effect.* [[Footnote(s)]] ------------------------------------------------- * The seven fundamental transformations of the globes or heavenly spheres, or rather of their constituent particles of matter, is described as follows: (1) The homogeneous; (2) the aeriform and radiant (gaseous); (3) Curd-like (nebulous); (4) Atomic , Ethereal [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 206 THE SECRET DOCTRINE.\n\nTo calculate its age, however, as the pupil is asked to do in the Stanza, is rather difficult, since we are not given the figures of the Great Kalpa, and are not allowed to publish those of our small Yugas, except as to the approximate duration of these.\n\n\"The older wheels rotated for one Eternity and one half of an Eternity,\" it says.\n\nWe know that by \"Eternity\" the seventh part of 311,040,000,000,000 years, or an age of Brahma is meant.\n\nBut what of that?\n\nWe also know that, to begin with, if we take for our basis the above figures, we have first of all to eliminate from the 100 years of Brahma (or 311,040,000,000,000 years) two years taken up by the Sandhyas (twilights), which leaves 98, as we have to bring it to the mystical combination 14 x 7.\n\nBut we have no knowledge at what time precisely the evolution and formation of our little earth began.\n\nTherefore it is impossible to calculate its age, unless the time of its birth is given -- which the TEACHERS refuse to do, so far.\n\nAt the close of this Book and in Book II., however, some chronological hints will be given.\n\nWe must remember, moreover, that the law of Analogy holds good for the worlds, as it does for man; and that as \"The ONE (Deity) becomes Two (Deva or Angel) and Two becomes Three (or man),\" etc., etc., so we are taught that the Curds (world-stuff) become wanderers, (Comets), these become stars, and the stars (the centres of vortices) our sun and planets -- to put it briefly.* ( b ) There are four grades of initiation mentioned in exoteric works, which are known respectively in Sanskrit as \"Srotapanna,\" \"Sagardagan,\" \"Anagamin,\" and \"Arhan\" -- the four paths to Nirvana, in this, our fourth Round, bearing the same appellations.\n\nThe Arhan, though he can see the Past, the Present, and the Future, is not yet the highest Initiate; for the Adept himself, the initiated candidate, becomes chela (pupil) to a higher Initiate."


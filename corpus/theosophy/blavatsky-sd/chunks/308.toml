body = "His \"reduced universes,\" of which \"there are as many as there are Monads\" -- is the chaotic representation of our Septenary System with its divisions and sub-divisions.\n\nAs to the relation his Monads bear to our Dhyan-Chohans, Cosmic Spirits, Devas and Elementals, we may reproduce briefly the opinion of a learned and thoughtful theosophist, Mr.\n\nH.\n\nA.\n\nBjerregaard, on the subject.\n\nIn an excellent paper \"On the Elementals, the Elementary Spirits, and the relationship between them and Human Beings,\" read by him before the \"Aryan Theosophical Society of New York\" (see P ATH, Nos.\n\n10 and 11, of Jan.\n\nand Feb.\n\n1887), Mr.\n\nBjerregaard formulates distinctly his opinion.\n\n.\n\n.\n\n.\n\n.\n\n\"To Spinoza, substance is dead and inactive, but to Leibnitz's penetrating mind everything is living activity and active energy.\n\nIn holding this view, he comes infinitely nearer the Orient than any other thinker of his day , or after him.\n\nHis discovery that an active energy forms the essence of Substance is a principle that places him in direct relationship to the Seers of the East.\n\n\" And the lecturer proceeds to show that to Leibnitz atoms and elements are centres of force , or rather \"spiritual beings whose very nature is to act,\" for the elementary particles are not acting mechanically, but from an internal principle.\n\nThey are incorporeal spiritual units (\"substantial,\" however, but not immaterial in our sense) inaccessible to all changes from without, and indestructible by any external force.\n\nLeibnitz's monads, adds the lecturer, \"differ from atoms in the following particulars, which are very important for us to remember, otherwise we shall not be able to see the difference between elementals and mere matter.\" .\n\n.\n\n.\n\n.\n\n\"Atoms are not distinguished from each other, they are qualitatively alike; but one monad differs from every other monad qualitatively; and every one is a peculiar world to itself.\n\nNot so with atoms; they are absolutely alike quantitatively and qualitatively, and possess no individuality of their own.** Again, the atoms (molecules, [[Footnote(s)]] ------------------------------------------------- * \"Leibnitz's Dynamism,\" says Professor Lachelier, \"would offer but little difficulty if, with him, the Monad had remained a simple atom of blind force.\n\nBut .\n\n.\n\n.\n\n.\" One perfectly understands the perplexity of modern materialism!\n\n** Leibnitz was an absolute Idealist in maintaining that \"material atoms are contrary to reason\" ( Systeme nouveau , Erdmann, p.\n\n126.\n\ncol.\n\n2).\n\nFor him matter was a simple representation of the monad, whether human or atomic.\n\nMonads, he thought (as we do), are everywhere.\n\nThus the human soul is a monad, and every cell in the human body has its monad, as every cell in animal, vegetable, and even in the (so-called) inorganic bodies.\n\nHis atoms are the molecules of modern Science, and his monads those simple [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 631 MAYA AND MAHAMAYA.\n\nrather) of materialistic philosophy can be considered as extended and divisible, while the monads are mere mathematical points and indivisible.\n\nFinally, and this is a point where these monads of Leibnitz closely resemble the elementals of mystic philosophy -- these monads are representative Beings.\n\nEvery monad reflects every other.\n\nEvery monad is a living mirror of the Universe within its own sphere.\n\nAnd mark this, for upon it depends the power possessed by these monads, and upon this depends the work they can do for us; in mirroring the world, the monads are not mere passive reflective agents, but spontaneously self - active ; they produce the images spontaneously, as the soul does a dream.\n\nIn every monad, therefore, the adept may read everything, even the future.\n\nEvery monad or Elemental is a looking-glass that can speak.\n\n.\n\n.\" It is at this point that Leibnitz's philosophy breaks down.\n\nThere is no provision made, nor any distinction established, between the \"Elemental\" monad and that of a high Planetary Spirit, or even the human monad or Soul.\n\nHe even goes so far as to sometimes doubt whether \"God has ever made anything but Monads or substances without extension.\" ( Examen des Principes du P.\n\nMalebranche.\n\n) He draws a distinction between Monads and Atoms,* because, as he repeatedly states, \"bodies with all their qualities are only phenomenal, like the rainbow.\n\n.\n\n.\n\n.\n\nCorpora omnia cum omnibus qualitatibus suis non sunt aliud quam phenomena bene fundata , ut Iris \" (Letter to Father Desbosses, Correspondence , letter xviii.) -- but soon after he finds a provision for this in a substantial correspondence, a certain metaphysical bond between the monads -- vinculum substantiale.\n\nEsoteric philosophy, teaching an objective Idealism -- though it regards the objective Universe and all in it as Maya , temporary illusion -- draws a practical distinction between collective illusion, Mahamaya , from the purely metaphysical stand-point, and the objective relations in it between various conscious Egos so long as this illusion lasts.\n\nThe adept, therefore, may read the future in an Elemental Monad, but he has to draw for this object a great number of them, as each monad represents only a portion of the Kingdom it belongs to.\n\n\"It is not in the object, but in the modification of the cognition of the object that the Monads are limited.\n\nThey all go confusedly to the infinite, to the all, but they are all limited and distinguished by the [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] atoms that materialistic Science takes on faith, though it will never succeed in interviewing them -- except in imagination.\n\nBut Leibnitz is rather contradictory in his views about Monads.\n\nHe speaks of his Metaphysical Points and Formal Atoms , at one time as realities , occupying space; at another as pure Spiritual ideas; then again endows them with objectivity and aggregates and positions in their co-relations.\n\n* The atoms of Leibnitz have, in truth, nothing but the name in common with the atoms of the Greek Materialists, or even the molecules of modern Science.\n\nHe calls them formal atoms, and compares them to the substantial forms of Aristotle.\n\n(See Systeme Nouveau , § 3.) [[Vol.\n\n1, Page]] 632 THE SECRET DOCTRINE.\n\ndegrees of distinct perceptions.\" (§ 60, Monadologie .)* And as Leibnitz explains, \"All the portions of the Universe are distinctly represented in the Monads, but some are reflected in one monad , some in another; \" but a number of monads could represent simultaneously the thoughts of the two millions of inhabitants of Paris.\n\nBut what say the Occult Sciences to this, and what do they add?"


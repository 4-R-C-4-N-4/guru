body = "\"* Now in the original, the words \"their secret\" really are \"their S OD.\"** And Sod was the name for the great mysteries of Baal, Adonis and Bacchus, who were all sun-gods and had serpents for symbols.\n\nThe Kabalists explain the allegory of the fiery serpents by saying that this was the name given to the tribe of Levi, to all the Levites, in short, and that Moses was the chief of the Sodales.\n\n*** It is to the mysteries that the original meaning of the \"Dragon-Slayers\" has to be traced, and the question is fully treated of hereafter.\n\nMeanwhile it follows that, if Moses was the chief of the Mysteries, he was the Hierophant thereof, and further, if, at the same time, we find the prophets thundering against the \"abominations\" of the people of Israel, that there were two schools.\n\n\"Fiery serpents\" was, then, simply the epithet given to the Levites of the priestly caste, after they had departed from the good law, the traditional teachings of Moses: and to all those who followed Black Magic.\n\nIsaiah, when referring to the \"rebellious children\" who will have to carry their riches into the land whence come \"the viper and fiery flying serpent \" ( xxx.\n\n6), or Chaldea and Egypt, whose Initiates had already greatly degenerated in his day (700 B.C .), meant the sorcerers of those lands.**** But these must be carefully distinguished from the \"Fiery Dragons of Wisdom\" and the \"Sons of the Fire Mist.\" In the \" Great Book of the Mysteries \" we are told that: \"Seven Lords created Seven men; three Lords (Dhyan Chohans or Pitris) were holy and good, four less heavenly and full of passion.\n\n.\n\n.\n\n.\n\nThe chhayas (phantoms) of the Fathers were as they.\" This accounts for the differences in human nature, which is divided into seven gradations of good and evil.\n\nThere were seven tabernacles ready to be inhabited by Monads under seven different Karmic conditions.\n\nThe Commentaries explain on this basis the easy spread of evil, as soon as the human Forms had become real men.\n\nSome ancient [[Footnote(s)]] ------------------------------------------------- * \" Genesis, \" ch.\n\nxlix.\n\n** Dunlap, in his introduction to \" Sod, the Mysteries of Adonis, \" explains the word \"Sod\" as arcanum , religious mystery, on the authority of Schindler's \" Penteglott.\n\n\" \"The secret of the Lord is with them that fear him,\" says Psalm xxv., 14.\n\nThis is a mistranslation of the Christians, for it ought to read \" Sod Ihoh (the mysteries of Ihoh) are for those who fear him \" ( Dunlap, \" Mysteries of Adonis, \" xi).\n\n\"Al (El) is terrible in the great Sod of the Kadeshim (the priests, the holy, the Initiated ) , Psalm lxxxix, 7\" ( ibid .) .\n\nThe Kadeshim were very far from holy.\n\n( Vide Part II ., \" The Holy of Holies.\n\n\") *** \"The members of the priest-Colleges were called Sodales, \" says Freund's \"Latin Lexicon\" (iv.\n\n448).\n\n\"Sodalities were constituted in the Idaean Mysteries of the M IGHTY M OTHER,\" writes Cicero in de Senectute.\n\n(\" Mysteries of Adonis.\n\n\") **** The priests of Baal who jumped over the fires.\n\nBut this was a Hebrew term and a local one.\n\n\"Saraph\" -- \"fiery or flaming venom.\" [[Vol.\n\n2, Page]] 213 THE SEVENTH SON OF THE SEVENTH SON.\n\nphilosophers ignored the seven in their genetical accounts and gave only four.\n\nThus the Mexican local Genesis has \"four good men\" described as the four real ancestors of the human race, \"who were neither begotten by the gods nor born of woman\"; but whose creation was a wonder wrought by the creative Powers, and who were made only after \"three attempts at manufacturing men had failed.\n\n\" The Egyptians had in their theology only \"four sons of God,\" whereas in Pymander seven are given -- thus avoiding any mention of the evil nature of man; though when Seth from a god sank into Set-Typhon, he began to be called \"the seventh son.\" Whence probably arose the belief that \"the seventh son of the seventh son\" is always a natural-born magician, though, at first, only a sorcerer was meant.\n\nA PAP, the serpent symbolizing evil, is slain by Aker, Set's serpent;* therefore Set-Typhon could not be that evil.\n\nIn the \" Book of the Dead \" it is commanded ( v .\n\n13) that chapter clxiii.\n\nshould be read \"in the presence of a serpent on two legs,\" which means a high Initiate, a Hierophant, for the discus and ram's horns** that adorn his \"serpent's\" head in the hieroglyphics of the title of the said chapter denote this.\n\nOver the \"serpent\" are represented the two mystic eyes of Ammon,*** the hidden \"mystery god.\" This passage corroborates our assertion, and shows what the word \"serpent\" meant in antiquity.\n\nBut as to the Nagals and Nargals, whence came the similarity of names between the Indian Nagas and the American Nagals?\n\n\"The Nargal was the Chaldean and Assyrian chief of the Magi (Rab-Mag), and the Nagal was the chief sorcerer of the Mexican Indians.\n\nBoth derive their names from Nergal-Serezer, the Assyrian god, and the Hindu Nagas.\n\nBoth have the same faculties and the power to have an attendant daemon , with whom they identify themselves completely.\n\nThe Chaldean and Assyrian Nargal kept his daemon, in the shape of some animal considered sacred, inside the temple; the Indian Nagal keeps his wherever he can -- in the neighbouring lake, or wood, or in the house in the shape of some household animal.\"**** Such similarity cannot be attributed to coincidence.\n\nA new world is discovered, and we find that, for our forefathers of the Fourth Race, [[Footnote(s)]] ------------------------------------------------- * \" Book of the Dead \" xxxix.\n\n** The same ram's horns are found on the heads of Moses which were on some old medals seen by the writer in Palestine, one of which is in her possession.\n\nThe horns, made to form part of the shining aureole on the statue of Moses in Rome (Michael Angelo), are vertical instead of being bent down to the ears, but the emblem is the same; hence the Brazen Serpent.\n\n*** But see Harris's \" Magic Papyrus \" No.\n\nv.; and the ram-headed Ammon manufacturing men on a potter's wheel.\n\n**** Brasseur de Bourbourg: \" Mexique, \" pp.\n\n135 and 574.\n\n[[Vol.\n\n2, Page]] 214 THE SECRET DOCTRINE."


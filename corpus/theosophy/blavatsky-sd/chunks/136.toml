[content]
body = "\"Glory to the unchangeable, holy, eternal Supreme Vishnu, of one universal nature, the mighty over all; to him who is Hiranyagarbha, Hari, and Sankara (Brahma, Vishnu, and Siva), the creator, the preserver, and the destroyer of the world; to Vasudeva, the liberator (of his worshippers); to him whose essence is both single and manifold; who is both subtile and corporeal, indiscreet and discreet; to Vishnu the cause of final emancipation, the cause of the creation, existence, the [[Vol.\n\n1, Page]] 287 ALONE THE ETERNAL IS REST.\n\nend of the world; who is the root of the world, and who consists of the world.\n\n\" ( Vish.\n\nPurana, Book L.\n\n) This is a grand invocation, full of philosophical meaning underlying it; but, for the profane masses, as suggestive as is the first of an anthropomorphic Being.\n\nWe must respect the feeling that dictated both; but we cannot help finding it in full disharmony with its inner meaning, even with that which is found in the same Hermetic treatise where it is said: \"Reality is not upon the earth, my son, and it cannot be thereon.\n\n.\n\n.\n\n.\n\nNothing on earth is real, there are only appearances.\n\n.\n\n.\n\nHe (man) is not real, my son, as man.\n\nThe real consists solely in itself and remains what it is.\n\n.\n\n.\n\nMan is transient, therefore he is not real, he is but appearance, and appearance is the supreme illusion.\n\nTatios: Then the celestial bodies themselves are not real, my father, since they also vary?\n\nTrismegistos: That which is subject to birth and to change is not real.\n\n.\n\n.\n\n.\n\n.\n\nThere is in them a certain falsity, seeing that they too are variable.......\n\nTatios: And what then is the primordial Reality?\n\nTrismeg.: That which is one and alone, 0 Tatios; That which is not made of matter, nor in any body.\n\nWhich has neither colour nor form, which changes not nor is transmitted but which always is.\" This is quite consistent with the Vedantic teaching.\n\nThe leading thought is Occult; and many are the passages in the Hermetic Fragments that belong bodily to the Secret Doctrine.\n\nThe latter teaches that the whole universe is ruled by intelligent and semi-intelligent Forces and Powers, as stated from the very beginning.\n\nChristian Theology admits and even enforces belief in such, but makes an arbitrary division and refers to them as \"Angels\" and \"Devils.\" Science denies the existence of such, and ridicules the very idea.\n\nSpiritualists believe in the Spirits of the Dead, and, outside these, deny entirely any other kind or class of invisible beings.\n\nThe Occultists and Kabalists are thus the only rational expounders of the ancient traditions, which have now culminated in dogmatic faith on the one hand, and dogmatic denials on the other.\n\nFor, both belief and unbelief embrace but one small corner each of the infinite horizons of spiritual and physical manifestations; and thus both are right from [[Vol.\n\n1, Page]] 288 THE SECRET DOCTRINE.\n\ntheir respective standpoints, and both are wrong in believing that they can circumscribe the whole within their own special and narrow barriers; for -- they can never do so.\n\nIn this respect Science, Theology, and even Spiritualism show little more wisdom than the ostrich does, when it hides its head in the sand at its feet, feeling sure that there can be thus nothing beyond its own point of observation and the limited area occupied by its foolish head.\n\nAs the only works now extant upon the subject under consideration within reach of the profane of the Western \"civilized\" races are the above-mentioned Hermetic Books, or rather Hermetic Fragments, we may contrast them in the present case with the teachings of Esoteric philosophy.\n\nTo quote for this purpose from any other would be useless, since the public knows nothing of the Chaldean works which are translated into Arabic and preserved by some Sufi initiates.\n\nTherefore the \"Definitions of Asclepios,\" as lately compiled and glossed by Mrs.\n\nA.\n\nKingsford, F.T.S., some of which sayings are in remarkable agreement with the Esoteric Eastern doctrine, have to be resorted to for comparison.\n\nThough not a few passages show a strong impression of some later Christian hand, yet on the whole the characteristics of the genii* and gods are those of eastern teachings, while concerning other things there are passages which differ widely in our doctrines.\n\nThe following are a few:-- [[Footnote(s) -------------------------------------------------]] * The Hermetic philosophers called Theoi, gods, Genii and Daimones (in the original texts), those Entities whom we call Devas (gods), Dhyan Chohans, Chitkala (Kwan-yin, the Buddhists call them), and by other names.\n\nThe Daimones are -- in the Socratic sense, and even in the Oriental and Latin theological sense -- the guardian spirits of the human race; \"those who dwell in the neighbourhood of the immortals, and thence watch over human affairs,\" as Hermes has it.\n\nIn Esoteric parlance, they are called Chitkala, some of which are those who have furnished man with his fourth and fifth Principles from their own essence; and others the Pitris so-called.\n\nThis will be explained when we come to the production of the complete man.\n\nThe root of the name is Chiti, \"that by which the effects and consequences of actions and kinds of knowledge are selected for the use of the soul,\" or conscience the inner Voice in man.\n\nWith the Yogis, the Chiti is a synonym of Mahat, the first and divine intellect; but in Esoteric philosophy Mahat is the root of Chiti, its germ; and Chiti is a quality of Manas in conjunction with Buddhi, a quality that attracts to itself by spiritual affinity a Chitkala when it develops sufficiently in man.\n\nThis is why it is said that Chiti is a voice acquiring mystic life and becoming Kwan-Yin.\n\n[[Vol.\n\n1, Page]] 289 A FEW OCCULT APHORISMS.\n\nE XTRACTS FROM A PRIVATE COMMENTARY,* hitherto secret:-- (xvii.) \" The Initial Existence in the first twilight of the Maha-Manwantara ( after the M AHA- P RALAYA that follows every age of Brahma ) is a CONSCIOUS SPIRITUAL QUALITY.\n\nIn the manifested WORLDS ( solar systems ) it is, in its OBJECTIVE SUBJECTIVITY, like the film from a Divine Breath to the gaze of the entranced seer.\n\nIt spreads as it issues from L AYA ** throughout infinity as a colourless spiritual fluid.\n\nIt is on the SEVENTH PLANE, and in its SEVENTH STATE in our planetary world.*** (xviii.) \" It is Substance to OUR spiritual sight."


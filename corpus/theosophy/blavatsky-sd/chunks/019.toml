[content]
body = "But this view does not prevent him from believing in its existence so long as it lasts, to wit, for one Mahamanvantara; nor from applying Akasa, the radiation of Mulaprakriti,* to practical purposes, connected as the World-Soul is with all natural phenomena, known or unknown to science.\n\nThe oldest religions of the world -- exoterically, for the esoteric root or foundation is one -- are the Indian, the Mazdean, and the Egyptian.\n\nThen comes the Chaldean, the outcome of these -- entirely lost to the world now, except in its disfigured Sabeanism as at present rendered by the archaeologists; then, passing over a number of religions that will be mentioned later, comes the Jewish, esoterically, as in the Kabala, following in the line of Babylonian Magism; exoterically, as in Genesis and the Pentateuch, a collection of allegorical legends.\n\nRead by the light of the Zohar, the initial four chapters of Genesis are the fragment [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] known Causeless Cause,\" is the oldest dogma in Occultism, millenniums earlier than the Pater-AEther of the Greeks and Latins.\n\nSo are the \"Force and Matter, as Potencies of Space, inseparable, and the Unknown revealers of the Unknown.\" They are all found in Aryan philosophy personified by Visvakarman, Indra, Vishnu, etc., etc.\n\nStill they are expressed very philosophically, and under many unusual aspects, in the work referred to.\n\n* In contradistinction to the manifested universe of matter, the term Mulaprakriti (from Mula , \"the root,\" and prakriti , \"nature\"), or the unmanifested primordial matter -- called by Western alchemists Adam's Earth -- is applied by the Vedantins to Parabrahmam.\n\nMatter is dual in religious metaphysics, and septenary in esoteric teachings, like everything else in the universe.\n\nAs Mulaprakriti, it is undifferentiated and eternal; as Vyakta, it becomes differentiated and conditioned, according to Svetasvatara Upanishad , I .\n\n8, and Devi Bhagavata Purana.\n\nThe author of the Four Lectures on the Bhagavad Gita, says, in speaking of Mulaprakriti: \"From its (the Logos') objective standpoint, Parabrahmam appears to it as Mulaprakriti .\n\n.\n\n.\n\n.\n\nOf course this Mulaprakriti is material to it, as any material object is material to us.\n\n.\n\n.\n\n.\n\nParabrahmam is an unconditioned and absolute reality, and Mulaprakriti is a sort of veil thrown over it.\" ( Theosophist , Vol.\n\nVIII., p.\n\n304.) [[Vol.\n\n1, Page]] 11 PROEM.\n\nof a highly philosophical page in the World's Cosmogony.\n\n( See Book III., Gupta Vidya and the Zohar.\n\n) Left in their symbolical disguise, they are a nursery tale, an ugly thorn in the side of science and logic, an evident effect of Karma.\n\nTo have let them serve as a prologue to Christianity was a cruel revenge on the part of the Rabbis, who knew better what their Pentateuch meant.\n\nIt was a silent protest against their spoliation, and the Jews have certainly now the better of their traditional persecutors.\n\nThe above-named exoteric creeds will be explained in the light of the Universal doctrine as we proceed with it.\n\nThe Occult Catechism contains the following questions and answers: \" What is it that ever is?\n\n\" \" Space, the eternal Anupadaka.\n\n\" * \" What is it that ever was?\n\n\" \" The Germ in the Root.\n\n\" \" What is it that is ever coming and going?\n\n\" \" The Great Breath.\n\n\" \" Then, there are three Eternals?\n\n\" \" No, the three are one.\n\nThat which ever is is one, that which ever was is one, that which is ever being and becoming is also one: and this is Space.\n\n\" \" Explain, oh Lanoo (disciple).\n\n\" -- \" The One is an unbroken Circle ( ring ) with no circumference, for it is nowhere and everywhere; the One is the boundless plane of the Circle, manifesting a diameter only during the manvantaric periods; the One is the indivisible point found nowhere, perceived everywhere during those periods; it is the Vertical and the Horizontal, the Father and the Mother, the summit and base of the Father, the two extremities of the Mother, reaching in reality nowhere, for the One is the Ring as also the rings that are within that Ring.\n\nLight in darkness and darkness in light: the ' Breath which is eternal.\n\n' It proceeds from without inwardly, when it is everywhere, and from within outwardly, when it is nowhere -- ( i.e., maya,** one of the centres*** ) .\n\nIt expands and [[Footnote(s)]] ------------------------------------------------- * Meaning \"parentless\" -- see farther on.\n\n** Esoteric philosophy, regarding as Maya (or the illusion of ignorance) every finite thing, must necessarily view in the same light every intra-Cosmic planet and body, as being something organised, hence finite.\n\nThe expression, therefore, \"it proceeds from without inwardly, etc.\" refers in the first portion of the sentence to the dawn of the Mahamanvantaric period, or the great re-evolution after one of the complete periodical dissolutions of every compound form in Nature (from planet to molecule) into its ultimate essence or element; and in its second portion, to the partial or local manvantara, which may be a solar or even a planetary one.\n\n*** By \"centre,\" a centre of energy or a Cosmic focus is meant; when the so-called \"Creation,\" or formation of a planet, is accomplished by that force which is designated by the Occultists LIFE and by Science \"energy,\" then the process takes place [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 12 THE SECRET DOCTRINE.\n\ncontracts ( exhalation and inhalation ) .\n\nWhen it expands the mother diffuses and scatters; when it contracts, the mother draws back and ingathers.\n\nThis produces the periods of Evolution and Dissolution, Manwantara and Pralaya.\n\nThe Germ is invisible and fiery; the Root ( the plane of the circle ) is cool; but during Evolution and Manwantara her garment is cold and radiant.\n\nHot Breath is the Father who devours the progeny of the many-faced Element ( heterogeneous ) ; and leaves the single-faced ones ( homogeneous ) .\n\nCool Breath is the Mother, who conceives, forms, brings forth, and receives them back into her bosom, to reform them at the Dawn ( of the Day of Brahma, or Manvantara ) .\n\n.\n\n.\n\n."


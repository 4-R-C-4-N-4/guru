[content]
body = "Assuredly the former, the one which to this date remains recorded in the traditions of all the peoples, from the remotest antiquity; the one that finally swept away the last peninsulas of Atlantis, beginning with Ruta and Daitya and ending with the (comparatively) small island mentioned by Plato.\n\nThis is shown by the agreement of certain details in all the legends.\n\nIt was the last of its gigantic character.\n\nThe little deluge, the traces of which Baron Bunsen found in Central Asia, and which he places at about 10,000 years B.C.\n\n, had nothing to do with either the semi-universal Deluge, or Noah's flood -- the latter being a purely mythical rendering of old traditions -- nor even with the submersion of the last Atlantean island; at least, only a moral connection.\n\nOur Fifth Race (the non-initiated portions), hearing of many deluges, confused them, and now know of but one.\n\nThis one altered the whole aspect of the globe in its interchange and shifting of land and sea.\n\nWe may compare the traditions of the Peruvians: -- \"The Incas, seven in number, have repeopled the Earth after the deluge,\" they say (Coste I, IV., p.\n\n19); Humboldt mentions the Mexican version of the same legend, but confuses somewhat the details of the still-preserved legend concerning the American Noah.\n\nNevertheless, the eminent Naturalist mentions twice seven companions and the divine bird which preceded the boat of the Aztecs, and thus makes fifteen elect instead of the seven and the fourteen.\n\nThis was written probably under some involuntary reminiscence of Moses, who is said to have mentioned fifteen grandsons of Noah, who escaped with their grandsire.\n\nThen again Xisuthrus, the Chaldean Noah, is saved and translated alive to heaven -- like Enoch -- with the seven gods, the Kabirim, or the seven divine Titans; again the Chinese Yao has seven figures which sail with him and which he will animate when he lands, and use for \"human seed.\" Osiris, when he enters the ark, or solar boat, takes seven Rays with him, etc., etc.\n\nSanchoniathon makes the Aletae or Titans (the Kabirim) contemporary [[Footnote(s)]] ------------------------------------------------- * \" Smithsonian Contributions to Knowledge, \" xviii .; \" American Journal of Science, \" III., xi., 456; and Croll's \"Climate and Time.\n\n\" Lemuria was not submerged by a flood, but was destroyed by volcanic action, and afterwards sank.\n\n[[Vol.\n\n2, Page]] 142 THE SECRET DOCTRINE.\n\nwith Agruerus, the great Phoenician god (whom Faber sought to identify with Noah*); further, it is suspected that the name of \"Titan\" is derived from Tit-Ain -- \"the fountains of the chaotic abyss\"** (Tit-Theus, or Tityus is \"the divine deluge \"); and thus the Titans, who are seven, are shown to be connected with the Flood and the seven Rishis saved by Vaivasvata Manu.*** They are the sons of Kronos (Time) and Rhea (the Earth); and as Agruerus, Saturn and Sydyk are one and the same personage, and as the seven Kabiri are said to be the sons of Sydyk or Kronos-Saturn, the Kabiri and Titans are identical.\n\nFor once the pious Faber was right in his conclusions when he wrote: \"I have no doubt of the seven Titans and Kabiri being the same as the seven Rishis of the Hindu mythology (?) , who are said to have escaped in a boat along with Manu, the head (?) of the family.\" But he is less fortunate in his speculations when he adds \"The Hindoos, in their wild legends have variously perverted the history of the Noachidae (?\n\n!), yet it is remarkable that they seem to have religiously adhered to the number seven.\"**** Hence Captain (Col.) Wilford very judiciously observes: that \"Perhaps the seven Manus, the seven Brahmadicas and the seven Rishis are the same, and make only seven individual persons.***** The seven Brahmadicas were Prajapatis, or lords 'of the prajas or creatures.' From them mankind was born, and they are probably the same with the seven Manus.\n\n.\n\n.\n\n.\n\nThese seven grand ancestors of the human race were created for the purpose of replenishing the Earth with inhabitants.\" ( Asiatic Researches, Vol.\n\nV.\n\np.\n\n246); and Faber adds that: \"the mutual resemblance of the Kabirs, the Titans, the Rishis, and the Noetic family, is too striking to be the effect of mere accident.\"****** Faber was led into this mistake, and subsequently built his entire theory concerning the Kabiri, on the fact that the name of the scriptural [[Footnote(s)]] ------------------------------------------------- * Agruerus is Kronos, or Saturn, and the prototype of the Israelitish Jehovah.\n\nAs connected with Argha, the Moon or Ark of salvation, Noah is mythologically one with Saturn.\n\nBut then this cannot relate to the terrestrial flood.\n\n( But see Faber's \"Kabiri,\" Vol.\n\nI, pp.\n\n35, 43, and 45.) ** See ibid., Vol.\n\nII., p.\n\n240.\n\n*** Sanchoniathon says that the Titans were the sons of Kronos, and seven in number; and he calls them fire-worshippers, Aletae (sons of Agni?), and diluvians.\n\nAl-ait is the god of fire.\n\n**** Of which seven, let us remark, the Aryans, and not the Semites, were the originators, while the Jews got that number from the Chaldeans.\n\n***** Seven individual sons of God, or Pitars and Pitris; also in this case the sons of Kronos or Saturn ( Kala \"time\") and Arkites, like the Kabiri and Titans, as their name -- \" lunar ancestors\" -- shows, the Moon being the Ark, or Argha, on the watery abyss of space.\n\n****** See \" Kabiri, \" Vol.\n\nI., p.\n\n131.\n\n[[Vol.\n\n2, Page]] 143 THE ARKITE SYMBOLS.\n\nJaphet is on the list of the Titans contained in a verse of the Orphic hymns.\n\nAccording to Orpheus the names of the seven \"Arkite\" Titans (whom Faber refuses to identify with the impious Titans, their descendants) were Koeus, Kroeus, Phorcys, Kronos, Oceanus, Hyperion, and Iapetus: -- [[ Koion te, Kroion te melan, Phorkun te krataion, Kai Kronon, Okeanon d, 'Huperioa te Iapeponet.\n\n]] -- ( Orph.\n\napud Proclum.\n\nIn Tim.\n\nlib.\n\nv.\n\np.\n\n295.\n\nBut why could not the Babylonian Ezra have adopted the name of Iapetos for one of Noah's sons?"


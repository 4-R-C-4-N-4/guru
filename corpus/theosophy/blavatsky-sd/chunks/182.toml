body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n1 [[Vol.\n\n1, Page]] 379 LOTUS AND LILY.\n\n§ VIII.\n\nTHE LOTUS, AS A UNIVERSAL SYMBOL.\n\nT HERE are no ancient symbols, without a deep and philosophical meaning attached to them; their importance and significance increasing with their antiquity.\n\nSuch is the L OTUS.\n\nIt is the flower sacred to nature and her Gods, and represents the abstract and the Concrete Universes, standing as the emblem of the productive powers of both spiritual and physical nature.\n\nIt was held sacred from the remotest antiquity by the Aryan Hindus, the Egyptians, and the Buddhists after them; revered in China and Japan, and adopted as a Christian emblem by the Greek and Latin Churches, who made of it a messenger as the Christians do now, who replace it with the water lily.* It had, and still has, its mystic meaning which is identical with every nation on the earth.\n\nWe refer the reader to Sir William Jones.** With the Hindus, the lotus is the emblem of the productive power of nature, through the agency of fire and water (spirit and matter).\n\n\"Eternal!\" says a verse in the Bhagavad Gita, \"I see Brahm the creator enthroned in thee above the lotus!\"; and Sir W.\n\nJones shows, as noted in the Stanzas, that the seeds of the lotus contain, even before they germinate, perfectly-formed leaves, the miniature shapes of what one day, as perfected plants, they will become.\n\nThe lotus, in India, is the symbol of prolific earth, and what is more, of Mount Meru.\n\nThe four angels or genii of the four quarters of Heaven (the Maharajahs, see Stanzas ) stand each on a lotus.\n\nThe lotus is the two-fold type of the Divine and human hermaphrodite, being of dual sex, so to say.\n\nThe spirit of Fire (or Heat), which stirs up, fructifies, and develops into concrete form everything (from its ideal prototype), which is born of WATER or primordial Earth, evolved Brahma -- with the Hindus.\n\nThe lotus flower, represented as growing out of Vishnu's navel -- that God resting on the waters of space and his Serpent of Infinity -- is the most graphic allegory ever made: the Universe evolving from the central Sun, the POINT, the ever-concealed germ.\n\nLakshmi, who is the [[Footnote(s)]] ------------------------------------------------- * In the Christian religion Gabriel, the Archangel, holding in his hand a spray of water lilies, appears to the Virgin Mary in every picture of the Annunciation.\n\nThis spray typifying fire and water, or the idea of creation and generation, symbolizes precisely the same idea as the lotus in the hand of the Bodhisat who announces to Maha-Maya, Gautama's mother, the birth of the world's Saviour, Buddha.\n\nThus also, Osiris and Horus were represented by the Egyptians constantly in association with the lotus-flower, the two being Sun-gods or Fire (the Holy Ghost being still typified by \"tongues of fire\"), (Acts).\n\n** See Sir William Jones' \"Dissertations Relating to Asia.\" [[Vol.\n\n1, Page]] 380 THE SECRET DOCTRINE.\n\nfemale aspect of Vishnu,* and who is also called Padma , the lotus, is likewise shown floating at \"Creation,\" on a lotus flower, and during the \"churning of the ocean\" of space, springing from the \"sea of milk,\" like Venus from the froth.\n\n\".\n\n.\n\n.\n\nThen seated on a lotus Beauty's bright goddess, peerless Sri, arose Out of the waves .\n\n.\n\n.\n\n\" sings an English Orientalist and poet (Sir Monier Williams).\n\nThe underlying idea in this symbol is very beautiful, and it shows, furthermore, its identical parentage in all the religious systems.\n\nWhether in the lotus or water-lily shape it signifies one and the same philosophical idea -- namely, the emanation of the objective from the subjective, divine Ideation passing from the abstract into the concrete or visible form.\n\nFor, as soon as D ARKNESS -- or rather that which is \"darkness\" for ignorance -- has disappeared in its own realm of eternal Light, leaving behind itself only its divine manifested Ideation, the creative Logoi have their understanding opened, and they see in the ideal world (hitherto concealed in the divine thought) the archetypal forms of all, and proceed to copy and build or fashion upon these models forms evanescent and transcendent.\n\nAt this stage of action, the Demiurge** is not yet the Architect.\n\nBorn in the twilight of action, he has yet to first perceive the plan, to realise the ideal forms which lie buried in the bosom of Eternal Ideation, as the future lotus-leaves, the immaculate petals, are concealed within the seed of that plant.\n\n.\n\n.\n\n.\n\n.\n\nIn chapter lxxxi.\n\nof the Ritual ( Book of the Dead ), called \"Transformation into the Lotus,\" a head emerging from this flower, the god exclaims: \"I am the pure lotus, emerging from the Luminous one.\n\n.\n\n.\n\n.\n\n.\n\nI carry the messages of Horus.\n\nI am the pure lotus which comes from the Solar Fields.\n\n.\n\n.\n\n.\n\n.\" The lotus-idea may be traced even in the Elohistic chapter, the 1st of Genesis , as stated in Isis.\n\n[[Footnote(s)]] ------------------------------------------------- * Lakshmi is Venus -- Aphrodite, and, like the latter, she sprang from the froth of the ocean with a lotus in her hand.\n\nIn the Ramayana she is called Padma.\n\n** In Esoteric philosophy the Demiurge or Logos , regarded as the C REATOR, is simply an abstract term, an idea, like \"army.\" As the latter is the all-embracing term for a body of active forces or working units -- soldiers -- so is the Demiurge the qualitative compound of a multitude of Creators or Builders.\n\nBurnouf, the great Orientalist, has seized the idea perfectly when saying that Brahma does not create the earth, any more than the rest of the universe.\n\n\"Having evolved himself from the soul of the world, once separated from the first cause, he evaporates with, and emanates all nature out of himself.\n\nHe does not stand above it, but is mixed up with it; Brahma and the universe form one Being, each particle of which is in its essence Brahma himself, who proceeded out of himself.\" [[Vol.\n\n1, Page]] 381 THE EXOTERIC AND THE ESOTERIC.\n\nIt is in this idea that we must look for the origin and explanation of the verse in the Jewish cosmogony, which reads: \"And God said, Let the earth bring forth .\n\n.\n\n.\n\n.\n\nthe fruit-tree yielding fruit after his kind, whose seed is in itself.\" In all the primitive religions, the \"Son of the Father\" is the creative God -- i.e."


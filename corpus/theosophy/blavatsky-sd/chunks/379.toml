body = "He who knows the doctrines of Esoteric Budhism, (or Wisdom), though so imperfectly sketched hitherto, will see clearly the allegory contained in the above.\n\nIts more philosophical meaning will be better understood if the reader thinks carefully over the myth of Prometheus.\n\nIt is examined [[Vol.\n\n2, Page]] 101 THE DIVINE BABE, AGNI.\n\nfurther on in the light of the Hindu Pramantha.\n\nDegraded into a purely physiological symbol by some Orientalists, and taken in connection with terrestrial fire only, their interpretation is an insult to every religion, including Christianity, whose greatest mystery is thus dragged down to matter.\n\nThe \"friction\" of divine Pramantha and Arani could suggest itself under this image only to the brutal conceptions of the German materialists -- than whom there are none worse.\n\nIt is true that the Divine babe, Agni with the Sanskrit-speaking Race, who became Ignis with the Latins, is born from the conjunction of Pramantha and Arani (Svastica) during the sacrificial ceremony.\n\nBut what of that?\n\nTwashtri (Viswakarman) is the \"divine artist and carpenter \" * and is also the Father of the gods and of creative fire in the Vedas.\n\nSo ancient is the symbol and so sacred, that there is hardly an excavation made on the sites of old cities without its being found.\n\nA number of such terra cotta discs, called fusaiolos, were found by Dr.\n\nSchliemann under the ruins of ancient Troy.\n\nBoth these forms and were excavated in great abundance, their presence being one more proof that the ancient Trojans and their ancestors were pure Aryans.\n\n( c ) Chhaya, as already explained, is the astral image.\n\nIt bears this meaning in Sanskrit works.\n\nThus Sanjna (Spiritual Consciousness), the wife of Surya, the Sun, is shown retiring into the jungle to lead an ascetic life, and leaving behind to her husband her Chhaya, shadow or image.\n\n[[Footnote(s)]] ------------------------------------------------- * The \"Father of the Sacred Fire,\" writes Prof.\n\nJolly, \"is Twashtri .\n\n.\n\n.\n\nhis mother was Maya.\n\nHe himself was styled Akta (anointed, [[ christos ]]), after the priest had poured upon his head the spirituous (?) S OMA, and on his body butter purified by sacrifice\"; (\" Man before Metals, \" p.\n\n190).\n\nThe source of his information is not given by the French Darwinist.\n\nBut the lines are quoted to show that light begins to dawn even upon the materialists.\n\nAdalbert Kuhn, in his \" Die Herabkunft des Feuers, \" identifies the two signs and with Arani , and designates them under this name.\n\nHe adds: \"This process of kindling fire naturally led men to the idea of sexual reproduction,\" etc.\n\nWhy could not a more dignified idea, and one more occult, have led man to invent that symbol, in so far as it is connected, in one of its aspects, with human reproduction?\n\nBut its chief symbolism refers to Cosmogony.\n\n\" Agni , in the condition of Akta, or anointed, is suggestive of Christ,\" remarks Prof.\n\nJolly.\n\n\" Maya, Mary, his mother; Twastri , St.\n\nJoseph, the carpenter of the Bible.\" In the Rig Veda, Viswakarman is the highest and oldest of the Gods and their \"Father.\" He is the \"carpenter or builder,\" because God is called even by the monotheists, \"the Architect of the Universe.\" Still, the original idea is purely metaphysical, and had no connection with the later Phallicism.\n\n[[Vol.\n\n2, Page]] 102 THE SECRET DOCTRINE.\n\n16.\n\nH OW ARE THE ( real ) MANUSHYAS BORN?\n\nT HE MANUS WITH MINDS, HOW ARE THEY MADE?\n\n( a ) T HE FATHERS ( Barhishad (?)) CALL TO THEIR HELP THEIR OWN FIRE ( the Kavyavahana, electric fire ) , WHICH IS THE FIRE WHICH BURNS IN EARTH.\n\nT HE SPIRIT OF THE EARTH CALLED TO HIS HELP THE SOLAR FIRE ( Suchi, the spirit in the Sun ) .\n\nT HESE THREE ( the Pitris and the two fires ) PRODUCED IN THEIR JOINT EFFORTS A GOOD RUPA.\n\nI T ( the form ) COULD STAND, WALK, RUN, RECLINE AND FLY.\n\nY ET IT WAS STILL BUT A CHHAYA, A SHADOW WITH NO SENSE ( b ) .\n\n.\n\n.\n\n.\n\n.\n\n.\n\n( a ) Here an explanation again becomes necessary in the light, and with the help of the exoteric added to the esoteric scriptures.\n\nThe \" Manushyas \" (men) and the Manus are here equivalent to the Chaldean \"Adam\" -- this term not meaning at all the first man, as with the Jews, or one solitary individual, but mankind collectively, as with the Chaldeans and Assyrians.\n\nIt is the four orders or classes of Dhyan Chohans out of the seven, says the Commentary, \"who were the progenitors of the concealed man , \" i.e ., the subtle inner man.\n\nThe \"Lha\" of the Moon, the lunar spirits, were, as already stated, only the ancestors of his form, i.e., of the model according to which Nature began her external work upon him.\n\nThus primitive man was, when he appeared, only a senseless Bhuta* or a \"Phantom.\" This \"creation\" was a failure, the reason of which will be explained in the Commentary on Sloka 20.\n\n( b ) This attempt was again a failure.\n\nIt allegorizes the vanity of physical nature's unaided attempts to construct even a perfect animal -- let alone man.\n\nFor the \"Fathers,\" the lower Angels, are all Nature-Spirits and the higher Elementals also possess an intelligence of their own; but this is not enough to construct a THINKING man.\n\n\" Living Fire\" was needed, that fire which gives the human mind its self-perception and self-consciousness, or Manas ; and the progeny of Parvaka and Suchi are the animal electric and solar fires, which create animals, and could thus furnish but a physical living constitution to that first astral model of man.\n\nThe first creators, then, were the Pygmalions of primeval man: they failed to animate the statue - - intellectually.\n\nThis Stanza we shall see is very suggestive.\n\nIt explains the mystery of, and fills the gap between, the informing principle in man -- the [[Footnote(s)]] ------------------------------------------------- * It is not clear why \" Bhutas \" should be rendered by the Orientalists as meaning \"evil Spirits\" in the Puranas.\n\nIn the Vishnu Purana, Book I, ch."


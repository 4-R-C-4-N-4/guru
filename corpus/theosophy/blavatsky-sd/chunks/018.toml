[content]
body = "The orthodox Brahmins, those who rise the most against the Pantheists and Adwaitees, calling them Atheists, are forced, if Manu has any authority in this matter, to accept the death of Brahma, the creator, at the expiration of every \"Age\" of this (creative) deity (100 Divine years -- a period which in our years requires fifteen figures to express it).\n\nYet, no philosopher among them will view this \"death\" in any other sense than as a temporary disappearance from the manifested plane of existence, or as a periodical rest.\n\nThe Occultists are, therefore, at one with the Adwaita Vedantin philosophers as to the above tenet.\n\nThey show the impossibility of accepting on philosophical grounds the idea of the absolute ALL creating or even evolving the \"Golden Egg,\" into which it is said to enter in order to transform itself into Brahma -- the Creator, who expands himself later into gods and all the visible Universe.\n\nThey say that Absolute Unity cannot pass to infinity; for infinity presupposes the limitless extension of something, and the duration of that \"something\"; and the One All is like Space -- which is its only mental and physical representation on this Earth, or our plane of existence -- neither an object of, nor a subject to, perception.\n\nIf one could suppose the Eternal Infinite All, the Omnipresent Unity, instead of being in Eternity, becoming through periodical manifestation a manifold Universe or a multiple personality, that Unity would cease to be one.\n\nLocke's idea that \"pure Space is capable of neither resistance nor Motion\" -- is incorrect.\n\nSpace is neither a \"limitless void,\" nor a \"conditioned fulness,\" but both: being, on the plane of absolute abstraction, the ever-incognisable Deity, which is void only to finite minds,* and on that of mayavic perception, the Plenum, the absolute Container of all that is, whether manifested or unmanifested: it is, therefore, that ABSOLUTE ALL.\n\nThere is no difference between the Christian Apostle's \"In Him we live and move and have our being,\" and the Hindu Rishi's \"The Universe lives in, proceeds from, and will [[Footnote(s)]] ------------------------------------------------- * The very names of the two chief deities, Brahma and Vishnu, ought to have long ago suggested their esoteric meanings.\n\nFor the root of one, Brahmam, or Brahm, is derived by some from the word Brih, \"to grow\" or \"to expand\" (see Calcutta Review, vol.\n\nlxvi., p.\n\n14); and of the other, Vishnu, from the root Vis, \"to pervade,\" to enter in the nature of the essence; Brahma-Vishnu being this infinite SPACE, of which the gods, the Rishis, the Manus, and all in this universe are simply the potencies, Vibhutayah.\n\n[[Vol.\n\n1, Page]] 9 PROEM.\n\nreturn to, Brahma (Brahma)\": for Brahma (neuter), the unmanifested, is that Universe in abscondito, and Brahma, the manifested, is the Logos, made male-female* in the symbolical orthodox dogmas.\n\nThe God of the Apostle-Initiate and of the Rishi being both the Unseen and the Visible SPACE.\n\nSpace is called in the esoteric symbolism \"the Seven-Skinned Eternal Mother-Father.\" It is composed from its undifferentiated to its differentiated surface of seven layers.\n\n\"What is that which was, is, and will be, whether there is a Universe or not; whether there be gods or none?\" asks the esoteric Senzar Catechism.\n\nAnd the answer made is -- SPACE.\n\nIt is not the One Unknown ever-present God in Nature, or Nature in abscondito, that is rejected, but the God of human dogma and his humanized \"Word.\" In his infinite conceit and inherent pride and vanity, man shaped it himself with his sacrilegious hand out of the material he found in his own small brain-fabric, and forced it upon mankind as a direct revelation from the one unrevealed SPACE.** The Occultist [[Footnote(s)]] ------------------------------------------------- * See Manu's account of Brahma separating his body into male and female, the latter the female Vach, in whom he creates Viraj, and compare this with the esotericism of Chapters II., III., and IV.\n\nof Genesis.\n\n** Occultism is indeed in the air at the close of this our century.\n\nAmong many other works recently published, we would recommend one especially to students of theoretical Occultism who would not venture beyond the realm of our special human plane.\n\nIt is called \"New Aspects of Life and Religion,\" by Henry Pratt, M.D.\n\nIt is full of esoteric dogmas and philosophy, the latter rather limited, in the concluding chapters, by what seems to be a spirit of conditioned positivism.\n\nNevertheless, what is said of Space as \"the Unknown First Cause,\" merits quotation.\n\n\"This unknown something, thus recognised as, and identified with, the primary embodiment of Simple Unity, is invisible and impalpable\" -- ( abstract space, granted); \"and because invisible and impalpable, therefore incognisable.\n\nAnd this incognisability has led to the error of supposing it to be a simple void, a mere receptive capacity.\n\nBut, even viewed as an absolute void, space must be admitted to be either Self-existent, infinite, and eternal, or to have had a first cause outside, behind, and beyond itself.\n\n\"And yet could such a cause be found and defined, this would only lead to the transferring thereto of the attributes otherwise accruing to space, and thus merely throw the difficulty of origination a step farther back, without gaining additional light as to primary causation.\" (p.\n\n5.) This is precisely what has been done by the believers in an anthropomorphic Creator, an extracosmic, instead of an intracosmic God.\n\nMany -- most of Mr.\n\nPratt's subjects, we may say -- are old Kabalistic ideas and theories which he presents in quite a new garb: \"New Aspects\" of the Occult in Nature, indeed.\n\nSpace, however, viewed as a \"Substantial Unity\" -- the \"living Source of Life\" -- is as the \"Un- [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 10 THE SECRET DOCTRINE.\n\naccepts revelation as coming from divine yet still finite Beings, the manifested lives, never from the Unmanifestable ONE LIFE; from those entities, called Primordial Man, Dhyani-Buddhas, or Dhyan-Chohans, the \"Rishi-Prajapati\" of the Hindus, the Elohim or \"Sons of God,\" the Planetary Spirits of all nations, who have become Gods for men.\n\nHe also regards the Adi-Sakti -- the direct emanation of Mulaprakriti, the eternal Root of THAT, and the female aspect of the Creative Cause Brahma, in her A'kasic form of the Universal Soul -- as philosophically a Maya, and cause of human Maya."


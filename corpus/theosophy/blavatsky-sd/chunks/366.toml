body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n2 [[Vol.\n\n2, Page]] 75 THE SECRET OF THE FALL OF THE ANGELS.\n\nSTANZA III.\n\nATTEMPTS TO CREATE MAN.\n\n§§ (11) The Descent of the Demiurge.\n\n(12) The lunar gods ordered to create.\n\n(13) The higher gods refuse.\n\n11.\n\nT HE L ORD OF THE L ORDS CAME.\n\nF ROM HER BODY HE SEPARATED THE WATERS, AND THAT WAS HEAVEN ABOVE, THE FIRST HEAVEN ( the atmosphere, or the air, the firmament ) ( a ) .\n\n( a ) Here tradition falls again into the Universal.\n\nAs in the earliest version, repeated in the Puranas, so in the latest, the Mosaic account.\n\nIn the first it is said: \"He the Lord\" (the god who has the form of Brahma) \"when the world had become one ocean ( Harivamsa I.\n\n36) concluding that within the waters lay the earth, and desirous to raise it up,\" to separate it, \"created himself in another form.\n\nAs in the preceding Kalpa (Manvantara) he had assumed the shape of a tortoise, so in this one he took the shape of a boar, etc.\n\netc.\" In the Elohistic \"creation\" ( Genesis, verses 6, 7, 8, and 9) \"God\" creates a firmament in the midst of the waters .\n\n.\n\n.\n\n.\n\n.\n\nand says \"let dry land appear.\" And now comes the traditional peg whereunto is hung the esoteric portion of the Kabalistic interpretation.\n\n11..\n\nT HE GREAT CHOHANS ( Lords ) , CALLED THE L ORDS OF THE M OON, OF THE AIRY B ODIES ( a ).\n\n\"BRING FORTH MEN, ( they were told ) , MEN OF YOUR NATURE.\n\nG IVE THEM ( i.e., the Jivas or Monads ) THEIR FORMS WITHIN.\n\nS HE ( Mother Earth or Nature ) WILL BUILD COVERINGS WITHOUT ( external bodies ).\n\n( For ) MALES-FEMALES WILL THEY BE.\n\nL ORDS OF THE FLAME, ALSO.\" ( a ) Who are the Lords of the Moon?\n\nIn India they are called Pitris or \"lunar ancestors,\" but in the Hebrew scrolls it is Jehovah himself who is the \"Lord of the Moon,\" collectively as the Host, and also as one of the Elohim.\n\nThe astronomy of the Hebrews and their observance of times was regulated by the moon.\n\nA Kabalist, having shown that \"Daniel .\n\n.\n\n.\n\ntold off God's providence by set times,\" and that the \"Revelation\" of John \"speaks of a carefully measured cubical city descending out of the heavens,\" etc., adds -- [[Vol.\n\n2, Page]] 76 THE SECRET DOCTRINE.\n\n\"But the vitalizing power of heaven lay chiefly with the moon .\n\n.\n\n.\n\n.\n\nIt was the Hebrew (Jehovah), and St.\n\nPaul enjoins: 'Let no man judge you for your observance of the seventh day, and the day of the new moon, which are a shadow of things to come; but the body (or substance) is of Christ\" or Jehovah, that function of this power that \"made the barren woman .\n\n.\n\n.\n\na mother .\n\n.\n\n.\n\nfor they are the gift of Jehovah\" .\n\n.\n\n.\n\nwhich is a key to the objection which her husband made to the Shunamite, as to her going to the man of God -- \"for it is neither the seventh day nor the day of the new moon.\n\n.\n\n.\n\n.\n\n(2 Kings , iv., 23.) The living spiritual powers of the constellations had mighty wars, marked by the movements and positions of the stars and planets, and especially as the result of the conjunction of the moon, earth, and sun.\n\nBentley comments on the Hindu \"War between the gods and the giants,\" as marked by the eclipse of the Sun at the ascending node of the Moon, 945 B.C .\n\n(!\n\n!), at which time was born* or produced from the sea, S RI (Sarai, S-r-i, the wife of the Hebrew A-bram**).\n\nSri is also Venus-Aphrodite the Western emblem \"of the luni-solar year or the moon (as Sri is the wife of the moon; vide foot-note), the goddess of increase*** .\n\n.\n\n.\n\n\" Therefore .\n\n.\n\n.\n\n\"the grand monument and landmark of the exact period of the lunar year and month, by which this cycle (of 19 tropical years and 235 revolutions of the moon) could be calculated, was Mount Sinai -- the Lord Jehovah coming down thereon.\n\n.\n\n.\n\n.\n\nPaul speaks (then) as a mystagogue, when he says concerning the freed woman and bond woman of Abraham: 'For this Hagar (the bond-woman) is Mount Sinai in Arabia.' How could a woman be a mountain?\n\nand such a mountain!\n\nYet .\n\n.\n\n.\n\nshe was.\n\n.\n\n.\n\n.\n\nHer name was Hagar, Hebrew , whose numbers re-read 235, or in exact measure, the very number of lunar months to equal nineteen tropical years to complete this cycle.\n\n.\n\n.\n\n.\n\nMount Sinai being, in the esoteric language of the wisdom, the monument of the exact time of the lunar [[Footnote(s)]] ------------------------------------------------- * According to the wonderful chronology of Bentley, who wrote in days when Biblical chronology was still undisputed; and also according to that of those modern Orientalists who dwarf the Hindu dates as far as they can.\n\n** Now Sri is the daughter of Bhrigu, one of the Prajapatis and Rishis, the chief of the Bhrigus, \"the Consumers,\" the aerial class of gods.\n\nShe is Lakshmi, the wife of Vishnu, and she is \"the bride of Siva\" (Gauri), and she is Sarasvati, \"the watery,\" the wife of Brahma, because the three gods and goddesses are one, under three aspects.\n\nRead the explanation by Parasara, in Vishnu Purana in Bk.\n\nI., ch.\n\nviii.\n\n(Vol.\n\nI., Wilson's trans., p.\n\n119), and you will understand.\n\n\"The Lord of Sri\" is the moon, he says, and \"Sri is the wife of Narayana, the God of Gods\"; Sri or Lakshmi (Venus) is Indrani, as she is Sarasvati, for in the words of Parasara: \"Hari (or Iswara, \"the Lord\") is all that is called male in the Universe; Lakshmi is all that is termed female.\n\nThere is nothing else than they.\" Hence she is \"female,\" and \"God\" is male Nature.\n\n*** Sri is goddess of, and herself \"Fortune and Prosperity.\" [[Vol.\n\n2, Page]] 77 THE VARIOUS CLASSES OF CREATORS.\n\nyears and months, by which this spiritual vitalizing cycle could be computed -- and which mountain, indeed, was called (see Fuerst), \"the Mountain of the Moon (Sin)."


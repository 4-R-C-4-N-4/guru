body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n2 [[Vol.\n\n2, Page 447]] BOOK II., PART II.\n\nTHE ARCHAIC SYMBOLISM OF THE WORLD-RELIGIONS.\n\n--------- \"The narratives of the Doctrine are its cloak.\n\nThe simple look only at the garment -- that is, upon the narrative of the Doctrine; more they know not.\n\nThe instructed, however, see not merely the cloak, but what the cloak covers.\n\n(The Z OHAR , iii., 152; Franck, 119.) \" T HE M YSTERIES OF THE F AITH (are) NOT TO BE DIVULGED TO ALL.\n\n.\n\n.\n\n.\n\n.\n\nIt is requisite to hide in a mystery the wisdom spoken.\" ( Clem.\n\nAlex., \"Strom.\" 12.) [[Vol.\n\n2, Page 448]] CONTENTS.\n\n-------- § E SOTERIC T ENETS C ORROBORATED IN EVERY S CRIPTURE ...\n\n449 ------ XVI.\n\nA DAM- A DAMI ...\n\n452 ------ XVII.\n\nT HE \" H OLY OF H OLIES\" -- I TS D EGRADATION ...\n\n459 ------ XVIII.\n\nO N THE M YTH OF THE \" F ALLEN A NGEL,\" IN ITS V ARIOUS P HASES ...\n\n475 The Evil Spirit: Who and What?\n\n...\n\n475 The Gods of Light proceed from the Gods of Darkness ...\n\n483 The Many Meanings of the \"War in Heaven\" ...\n\n492 ------- XIX.\n\nI S P LEROMA S ATAN'S L AIR?\n\n...\n\n506 ------- XX.\n\nP ROMETHEUS, THE T ITAN ...\n\n519 His Origin in Ancient India ...\n\n519 ------- XXI.\n\nENOICHION ...\n\n529 ------ XXII.\n\nT HE S YMBOLISM OF THE M YSTERY- N AMES I AO AND J EHOVAH, WITH THEIR R ELATION TO THE C ROSS AND C IRCLE ...\n\n536 Cross and Circle ...\n\n545 The Fall of the Cross into Matter ...\n\n553 ------ XXIII.\n\nT HE U PANISHADS IN G NOSTIC L ITERATURE ...\n\n563 ------ XXIV.\n\nT HE C ROSS AND THE P YTHAGOREAN D ECADE ...\n\n573 ------- XXV.\n\nT HE M YSTERIES OF THE H EBDOMAD ...\n\n590 Saptaparna ...\n\n590 The Tetraktis in relation to the Heptagon ...\n\n598 The Septenary Element in the Vedas.\n\nIt corroborates the Occult Teaching concerning the Seven Globes and the Seven Races ...\n\n605 The Septenary in the Exoteric Works ...\n\n611 Seven in Astronomy, Science and Magic ...\n\n618 The Seven Souls of the Egyptologists ...\n\n630 [[Vol.\n\n2, Page 449]] BOOK II.\n\n-- PART II.\n\n-------- ESOTERIC TENETS CORROBORATED IN EVERY SCRIPTURE.\n\nI N view of the strangeness of the teachings, and of many a doctrine which from the modern scientific stand-point must seem absurd, some necessary and additional explanations have to be made.\n\nThe theories contained in the Second Part of the Stanzas are even more difficult to assimilate than those which are embodied in Vol.\n\n1, on Cosmogony.\n\nTheology, therefore, has to be questioned here, as Science will be in the Addenda (Part III .).\n\nSince our doctrines differ so widely from the current ideas of both Materialism and Theology, the Occultists must be ever prepared to repel the attacks of either or of both.\n\nThe reader can never be too often reminded that, as the abundant quotations from various old Scriptures prove, these teachings are as old as the world; and that the present work is a simple attempt to render, in modern language and in a phraseology with which the scientific and educated student is familiar, archaic Genesis and History as taught in certain Asiatic centres of esoteric learning.\n\nThey must be accepted or rejected on their own merits, fully or partially; but not before they have been carefully compared with the corresponding theological dogmas and the modern scientific theories and speculations.\n\nOne feels a serious doubt whether, with all its intellectual acuteness, our age is destined to discover in each western nation even one solitary uninitiated scholar or philosopher capable of fully comprehending the spirit of archaic philosophy.\n\nNor can one be expected to do so, before the real meaning of these terms, the Alpha and the Omega of Eastern esotericism, the words Sat and Asat, -- so freely used in the Rig-Veda, and elsewhere -- is thoroughly assimilated.\n\nWithout this key to the Aryan Wisdom, the Cosmogony of the Rishis and the Arhats is in danger of remaining a dead letter to the average Orientalist.\n\nAsat is not merely the negation of Sat, nor is it the \"not yet existing\"; for Sat is in itself neither the \"existent,\" nor \"being.\" S AT is the immutable, the ever present, changeless and eternal root, from and through which all proceeds.\n\nBut it is far more than the potential force in the seed, which propels onward the process of development, or what is now called evolution.\n\nIt is the ever becoming, though the never manifesting.* Sat [[Footnote(s)]] ------------------------------------------------- * The Hegelian doctrine, which identifies Absolute Being or \"Be-ness\" with \"non-Being,\" and represents the Universe as an eternal becoming, is identical with the Vedanta philosophy.\n\n[[Vol.\n\n2, Page]] 450 THE SECRET DOCTRINE.\n\nis born from Asat , and A SAT is begotten by Sat: the perpetual motion in a circle, truly; yet a circle that can be squared only at the supreme Initiation, at the threshold of Paranirvana.\n\nBarth started a reflection on the Rig-Veda which was meant for a stern criticism, an unusual, therefore, as was thought, an original view of this archaic volume.\n\nIt so happened, however, that, while criticising, that scholar revealed a truth, without being himself aware of its full importance.\n\nHe premises by saying that \"neither in the language nor in the thought of the Rig-Veda\" has he \"been able to discover that quality of primitive natural simplicity, which so many are fain to see in it.\" Barth had Max Muller in his mind's eye when writing this.\n\nFor the famous Oxford professor has throughout characterised the hymns of the Rig Veda, as the unsophisticated expression of the religious feeling of a pastoral innocent people.\n\n\"In the Vedic hymns the ideas and myths appear in their simplest and freshest form;\" -- the Sanskrit scholar thinks.\n\nBarth is of a different opinion, however.\n\nSo divided and personal are the opinions of Sanskritists as to the importance and intrinsic value of the Rig Veda, that those opinions become entirely biassed whichever way they incline.\n\nThus Mr.\n\nMax Muller declares that: \"Nowhere is the wide distance which separates the ancient poems of India from the most ancient literature of Greece more clearly felt, than when we compare the growing myths of the Veda with the full grown and decayed myths on which the poetry of Homer is founded."


[content]
body = "Wilson saw at a glance the suggestive connection between Mahat and the Phoenician Mot, or Mut , who was female with the Egyptians -- the Goddess Mout, the \"Mother\" -- \"which, like Mahat,\" he says, \"was the first product of the mixture (?) of Spirit and matter, and the first rudiment of Creation\": \"Ex connexione autem ejus spiritus prodidit Mot .\n\n.\n\n.\n\n.\n\n.\n\nFrom whose seed were created all living things\" -- repeats Brucker (I., 240) -- giving it a still more materialistic and anthropomorphic colouring.\n\nNevertheless, the esoteric sense of the doctrine is seen through every exoteric sentence on the very face of the old Sanscrit texts that treat of primordial Creation.\n\n\"The Supreme Soul, the all permeant (Sarvaga) Substance of the World, having entered ( been drawn ) into matter (prakriti) and Spirit (purusha), agitated the mutable and the immutable principles the season of Creation (manvantara) having arrived.\"* .\n\n.\n\n.\n\n[[Footnote(s)]] ------------------------------------------------- * The nous of the Greeks, which is (spiritual or divine) mind, or mens , \"Mahat,\" operates upon matter in the same way; it \"enters into\" and agitates it: \"Spiritus intus alit, totamque infusa per artus, Mens agitat molem, et magno se corpore miscet.\" In the Phoenician Cosmogony, \"Spirit mixing with its own principles gives rise to [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 452 THE SECRET DOCTRINE.\n\nEsoteric doctrine teaches that the Dhyan Chohans are the collective aggregate of divine Intelligence or primordial mind , and that the first Manus -- the seven \"mind-born\" Spiritual Intelligences -- are identical with the former.\n\nHence the \"Kwan-shi-yin\" -- \"the golden Dragon in whom are the seven,\" of Stanza III.\n\n-- is the primordial Logos, or Brahma, the first manifested creative Power; and the Dhyani-Energies are the Manus, or Manu-Swayambhuva collectively.\n\nThe direct connection, moreover, between the \"Manus\" and \"Mahat\" is easy to see.\n\nManu is from the root man , \"to think\"; and thinking proceeds from the mind.\n\nIt is, in Cosmogony, the pre-nebular period.\n\n(II.) \"The second Creation,\" \"Bhuta,\" was of the rudimental principles (Tanmatras), thence termed the elemental creation ( Bhuta-sarga ) .* It is the period of the first breath of the differentiation of the pre-Cosmic Elements or matter.\n\nBhutadi means literally \"the origin of the Elements,\" and precedes Bhuta-sarga -- the \"creation\" or differentiation of those Elements in primordial \"Akasa\" (Chaos or Vacuity).** In the \"Vishnu Purana\" it is said to proceed along, and belong to, the triple aspect of Ahankara , translated Egotism, but meaning rather that untranslateable term the \" I -AM-NESS,\" that which first issues from \"Mahat,\" or divine mind; the first shadowy outline of Self-hood, for \"pure\" Ahankara becomes \"passionate\" and finally \"rudimental\" [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] creation\" also; ( Brucker , I., 240); the Orphic triad shows an identical doctrine: for there Phanes (or Eros), Chaos , containing crude undifferentiated Cosmic matter, and Chronos (time), are the three co-operating principles, emanating from the Unknowable and concealed point , which produce the work of \"Creation.\" And they are the Hindu Purusha (phanes), Pradhana (chaos), and Kala (Chronos) or time.\n\nThe good Professor Wilson does not like the idea, as no Christian clergyman, however liberal, would.\n\nHe remarks that \"as presently explained,.\n\nthe mixture (of the Supreme Spirit or Soul) is not mechanical; it is an influence or effect exerted upon intermediate agents which produce effects.\" The sentence in Vishnu Purana: \"As fragrance affects the mind from its proximity merely, and not from any immediate operation upon mind itself , so the Supreme influenced the elements of creation,\" the reverend and erudite Sanscritist correctly explains .\n\n.\n\n.\n\n: \"As perfumes do not delight the mind by actual contact, but by the impression they make upon the sense of smelling, which communicates it to the mind,\" adding: \"The entrance of the Supreme into spirit, as well as matter, is less intelligible than the view elsewhere taken of it, as the infusion of spirit, identified with the supreme, into Prakriti or matter alone.\" He prefers the verse in Padma Purana: \"He who is called the male (spirit) of Prakriti .\n\n.\n\n.\n\nthat same divine Vishnu entered into Prakriti.\" This \"view\" is certainly more akin to the plastic character of certain verses in the Bible concerning the Patriarchs, such as Lot ( Gen.\n\nxix.\n\n, 34-38) and even Adam ( iv ., v.\n\n1), and others of a still more anthropomorphic nature.\n\nBut it is just that which led Humanity to Phallicism , Christian religion being honeycombed with it, from the first chapter of Genesis down to the Revelation.\n\n* All these sentences are quoted from \"Vishnu Purana,\" Book I., ch.\n\nv.\n\n** Vishnu is both Bhutesa, \"Lord of the Elements, and all things,\" and Viswarupa , \"Universal Substance or Soul.\" [[Vol.\n\n1, Page]] 453 THE SEVEN CREATIONS.\n\n(initial); it is \"the origin of conscious as of all unconscious being,\" though the Esoteric school rejects the idea of anything being \"unconscious\" -- save on this (our) plane of illusion and ignorance.\n\nAt this stage of the Second Creation, the second hierarchy of the Manus appear, the Dhyan Chohans or Devas, who are the origin of Form (rupa): the Chitrasikhandina (bright-crested) or the Riksha -- those Rishis who have become the informing souls of the seven stars (of the Great Bear).* In astronomical and Cosmogonical language this Creation relates to the first stage of Cosmic-life, the Fire-Mist Period after its Chaotic stage,** when atoms issue from Laya.\n\n(III.) The third (the Indriya ) was the modified form of Ahankara , the conception of \"I,\" (from \" Aham ,\" \"I\") termed the organic Creation, or creation of the senses ( Aindriyaka ) ."


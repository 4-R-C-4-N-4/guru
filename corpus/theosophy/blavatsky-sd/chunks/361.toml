[content]
body = "Water is the symbol of the female element everywhere; mater , from which the letter M, is derived pictorially from [[diagram]] a water hieroglyph.\n\nIt is the universal matrix or the \"Great Deep.\" Venus, the great Mother-Virgin, issues forth from the Sea-wave, and Cupid or Eros is her son.\n\nBut Venus is the later mythological variant of Gaia (or Gaea ) , the Earth, which, in its higher aspect is Nature ( Prakriti ) , and metaphysically Aditi, and even Mulaprakriti, the root of Prakriti or its noumenon.\n\nHence Cupid or Love in his primitive sense is Eros, the Divine Will, or Desire of manifesting itself through visible creation.\n\nThence Fohat, the prototype of Eros, becomes on Earth the great power \"Life-electricity,\" or the Spirit of \"Life-giving.\" Let us remember the Greek Theogony and enter into the spirit of its philosophy.\n\nWe are taught by the Greeks (See \" Iliad \" IV., 201, 246) that all things, gods included, owe their being to the Ocean and his wife Tethys, the latter being Gaea, the Earth or Nature.\n\nBut who is Ocean?\n\nOcean is the immeasurable SPACE (Spirit in Chaos), which is the Deity ( see Book I.); and Tethys is not the Earth, but primordial matter in the process of formation.\n\nIn our case it is no longer Aditi-Gaea who begets Ouranos or Varuna, the chief Aditya among the seven planetary gods, but Prakriti, materialised and localised.\n\nThe Moon, masculine in its theogonic character, is, [[Footnote(s)]] ------------------------------------------------- * The goddess who gave birth to these primordial monsters, in the account of Berosus, was Thallath, in Greek Thalassa, \"the Sea.\" ** See, for comparison, the account of creation by Berosus ( Alexander Polyhistor ) and the hideous beings born from the two-fold principle (Earth and Water) in the Abyss of primordial creation: Neras (Centaurs, men with the limbs of horses and human bodies), and Kimnaras (men with the heads of horses) created by Brahma in the commencement of the Kalpa.\n\n*** See Commentary following Sloka 18.\n\n[[Vol.\n\n2, Page]] 66 THE SECRET DOCTRINE.\n\nin its cosmic aspect only, the female generative principle, as the Sun is the male emblem thereof.\n\nWater is the progeny of the Moon, an androgyne deity with every nation.\n\nEvolution proceeds on the laws of analogy in Kosmos as in the formation of the smallest globe.\n\nThus the above, applying to the modus operandi at the time when the Universe was appearing, applies also in the case of our Earth's formation.\n\nThis Stanza opens by speaking of thirty crores, 30,000,000, of years.\n\nWe may be asked -- What could the ancients know of the duration of geological periods, when no modern scientist or mathematician is able to calculate their duration with anything like approximate accuracy?\n\nWhether they had or had not better means (and it is maintained that they had them in their Zodiacs), still the chronology of the ancient Brahmins shall now be given as faithfully as possible.\n\n------- T HE C HRONOLOGY OF THE B RAHMINS.\n\nNo greater riddle exists in science, no problem is more hopelessly insoluble, than the question: How old -- even approximately -- are the Sun and Moon, the Earth and Man?\n\nWhat does modern science know of the duration of the ages of the World, or even of the length of geological periods?\n\nNothing; absolutely nothing.\n\nIf one turns to science for chronological information, one is told by those who are straightforward and truthful, as for instance Mr.\n\nPengelly, the eminent geologist, \"We do not know.\"* One will learn that, so far, no trustworthy numerical estimate of the ages of the world and man could be made, and that both geology and anthropology are at sea.\n\nYet when a student of esoteric philosophy presumes to bring forward the teachings of Occult Science, he is at once sat upon.\n\nWhy should this be so, since, when reduced to their own physical methods, the greatest scientists have failed to arrive even at an approximate agreement?\n\nIt is true that science can hardly be blamed for it.\n\nIndeed, in the Cimmerian darkness of the prehistoric ages, the explorers are lost in a labyrinth, whose great corridors are doorless, allowing no visible exit into the Archaic past.\n\nLost in the maze of their own conflicting speculations, rejecting, as they have always done, the evidence of Eastern tradition, without any clue, or one single certain milestone to guide them, what can geologists or anthropologists do but pick up the slender [[Footnote(s)]] ------------------------------------------------- * For a similar admission see Prof.\n\nLefevre's Philosophy, p.\n\n481.\n\n[[Vol.\n\n2, Page]] 67 THE RACE THAT NEVER DIES.\n\nthread of Ariadne where they first perceive it, and then proceed at perfect random?\n\nTherefore we are first told that the farthest date to which documentary record extends is now generally regarded by Anthropology as but \"the earliest distinctly visible point of the pre-historic period .\n\n\" ( Encyclopaedia Britannica.\n\n) At the same time it is confessed that \"beyond that period stretches back a vast indefinite series of prehistoric ages.\" ( Ibid.\n\n) It is with those specified \"Ages\" that we shall begin.\n\nThey are \"prehistoric\" to the naked eye of matter only.\n\nTo the spiritual eagle eye of the seer and the prophet of every race, Ariadne's thread stretches beyond that \"historic period\" without break or flaw, surely and steadily, into the very night of time; and the hand which holds it is too mighty to drop it, or even let it break.\n\nRecords exist, although they may be rejected as fanciful by the profane; though many of them are tacitly accepted by philosophers and men of great learning, and meet with an unvarying refusal only from the official and collective body of orthodox science.\n\nAnd since the latter refuses to give us even an approximate idea of the duration of the geological ages -- save in a few conflicting and contradictory hypotheses -- let us see what Aryan philosophy can teach us.\n\nSuch computations as are given in Manu and the Puranas -- save trifling and most evidently intentional exaggerations -- are, as already stated, almost identical with those taught in esoteric philosophy.\n\nThis may be seen by comparing the two in any Hindu calendar of recognised orthodoxy.\n\nThe best and most complete of all such calendars, at present, as vouched for by the learned Brahmins of Southern India, is the already mentioned Tamil calendar called the \"Tirukkanda Panchanga,\" compiled, as we are told, from, and in full accordance with, secret fragments of Asuramaya's data."


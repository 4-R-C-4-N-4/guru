[content]
body = "What we object to is the literal acceptation of Biblical chronology, as it is absurd, and in accord with neither geological data nor reason.\n\nMoreover, if Noah was an Atlantean, then he was a Titan, a giant, as Faber shows; and if a giant, then why is he not shown as such in Genesis?* Bailly's mistake was to reject the submersion of Atlantis, and to call the Atlanteans simply a Northern and post diluvian nation, which, however, as he says, certainly \"flourished before the foundation of the Hindu, the Egyptian, and the Phoenician empires.\" In this, had [[Footnote(s)]] ------------------------------------------------- * This is shown by Faber, again a pious Christian, who says that \"the Noetic family also .\n\n.\n\n.\n\nbore the appellations of Atlanteans and Titans, and the great patriarch himself was called by way of eminence Atlas and Titan.\n\n\" ( Vol.\n\nII.\n\np.\n\n285).\n\nAnd if so, then, according to the Bible, Noah must have been the progeny of the Sons of God, the fallen angels, agreeably to the same authority, and of the \"daughters of men who were fair,\" ( See Genesis, chap.\n\nvi.) And why not, since his father Lamech slew a man, and was, with all his sons and daughters (who perished in the Deluge), as bad as the rest of mankind?\n\n[[Vol.\n\n2, Page]] 266 THE SECRET DOCTRINE.\n\nhe only known of the existence of what we have agreed to call Lemuria, he would have again been right.\n\nFor the Atlanteans were post diluvian to the Lemurians, and Lemuria was not submerged as Atlantis was, but was sunk under the waves, owing to earthquakes and subterranean fires, as Great Britain and Europe will be one day.\n\nIt is the ignorance of our men of science, who will accept neither the tradition that several continents have already sunk, nor the periodical law which acts throughout the Manvantaric cycle -- it is this ignorance that is the chief cause of all the confusion.\n\nNor is Bailly wrong again in assuring us that the Hindus, Egyptians, and Phoenicians came after the Atlanteans, for the latter belonged to the Fourth, while the Aryans and their Semitic Branch are of the Fifth Race.\n\nPlato, while repeating the story as narrated to Solon by the priests of Egypt, intentionally confuses (as every Initiate would) the two continents, and assigns to the small island which sunk last all the events pertaining to the two enormous continents, the prehistoric and traditional.\n\nTherefore, he describes the first couple, from whom the whole island was peopled, as being formed of the Earth.\n\nIn saying so, he means neither Adam and Eve, nor yet his own Hellenic forefathers.\n\nHis language is simply allegorical, and by alluding to \"Earth,\" he means \"matter,\" as the Atlanteans were really the first purely human and terrestrial race -- those that preceded it being more divine and ethereal than human and solid.\n\nYet Plato must have known, as would any other initiated adept, about the history of the Third Race after its \"Fall,\" though as one pledged to silence and secrecy he never showed his knowledge in so many words.\n\nNevertheless, it may become easier now, after acquainting oneself with even the approximate chronology of the Eastern nations -- all of which was based upon, and followed the early Aryan calculations -- to realize the immense periods of time that must have elapsed since the separation of the sexes, without mentioning the First or even the Second Root-Races.\n\nAs these must remain beyond the comprehension of minds trained in Western thought, it is found useless to speak in detail of the First and Second, and even of the Third Race in its earliest stage.* One has to begin with the latter, when it reached its full human period, lest the uninitiated reader should find himself hopelessly bewildered.\n\n[[Footnote(s)]] ------------------------------------------------- * In that wonderful volume of Donnelly's \"Atlantis, the Antediluvian World,\" the author, speaking of the Aryan colonies from Atlantis, and of the arts and sciences the legacy of our Fourth Race -- bravely announces that \"the roots of the institutions of to-day reach back to the Miocene age.\" This is an enormous allowance for a modern scholar to make; but civilization dates still further back than the Miocene Atlanteans.\n\n\"Secondary-period\" man will be discovered, and with him his long forgotten civilization.\n\n[[Vol.\n\n2, Page]] 267 THE NATURAL \"FALL.\" The THIRD RACE FELL -- and created no longer: it begot its progeny.\n\nBeing still mindless at the period of separation it begot, moreover, anomalous offspring, until its physiological nature had adjusted its instincts in the right direction.\n\nLike the \"lords the gods\" of the Bible ' the \"Sons of Wisdom,\" the Dhyan-Chohans, had warned them to leave alone the fruit forbidden by Nature: but the warning proved of no value.\n\nMen realized the unfitness -- we must not say sin -- of what they had done, only when too late: after the angelic monads from higher spheres had incarnated in, and endowed them with understanding.\n\nTo that day they had remained simply physical, like the animals generated from them.\n\nFor what is the distinction?\n\nThe doctrine teaches that the only difference between animate and inanimate objects on earth, between an animal and a human frame, is that in some the various \"fires\" are latent, and in others they are active.\n\nThe vital fires are in all things and not an atom is devoid of them.\n\nBut no animal has the three higher principles awakened in him; they are simply potential, latent, and thus non-existing.\n\nAnd so would the animal frames of men be to this day, had they been left as they came out from the bodies of their Progenitors, whose shadows they were, to grow, unfolded only by the powers and forces immanent in matter.\n\nBut as said in P YMANDER: -- \"This is a Mystery that to this day was sealed and hidden.\n\nNature* being mingled with Man** brought forth a wondrous miracle; the harmonious commingling of the essence of the Seven (Pitris, governors) and her own; the Fire and the Spirit and Nature (the noumenon of matter); which (commingling) forthwith brought forth seven men of opposite sexes (negative and positive) according to the essences of the seven governors.\" ( Divine Pymander, Chap.\n\nI., Sect.\n\n16.) Thus saith Hermes, the thrice great Initiate,*** \"the Power of the [[Footnote(s)]] ------------------------------------------------- * Nature is the natural body, the shadow of the Progenitors; and -- ** MAN is the \"Heavenly man,\" as already stated.\n\n*** The \"Pymander\" of our museums and libraries is an abridgement of one of the Books of Thoth, by a Platonist of Alexandria.\n\nIn the Third Century it was remodelled after old Hebrew and Phoenician MSS ."


body = "As Evil and punishment are the agents of Karma, in an absolutely just retributive sense, so Evil was the servant of the good (Hibbert Lect.\n\n1887, pp.\n\n101-115).\n\nThe reading of the Chaldeo-Assyrian tiles has now demonstrated it beyond a shadow of doubt.\n\nWe find the same idea in the Zohar.\n\nSatan was a Son, and an Angel of God.\n\nWith all the Semitic nations, the Spirit of the Earth was as much the Creator in his own realm as the Spirit of the Heavens.\n\nThey were twin brothers and interchangeable in their functions, when not two in one.\n\nNothing of that which we find in Genesis is absent from the Chaldeo-Assyrian religious beliefs, even in the little that has hitherto been deciphered.\n\nThe great \"Face of the Deep\" of Genesis is traced in the Tohu-bohu, \"Deep,\" \"Primeval Space,\" or Chaos of the Babylonians.\n\nWisdom (the Great Unseen God) -- called in Genesis chap.\n\ni.\n\nthe \"Spirit of God\" -- lived, for the older Babylonians as for the Akkadians, in the Sea of Space.\n\nToward the days described by Berosus, this sea became the visible waters on the face of the Earth -- the crystalline abode of the great mother, the mother of Ea and all the gods, which became, still later, the great Dragon Tiamat, the Sea Serpent.\n\nIts last stage of development was the great struggle of Bel with the Dragon -- the Devil!\n\nWhence the Christian idea that God cursed the Devil?\n\nThe God of the Jews, whomsoever he was, forbids cursing Satan.\n\nPhilo Judaeus and Josephus both state that the Law (the Pentateuch and the Talmud) undeviatingly forbid one to curse the adversary, as also the gods of the gentiles.\n\n\"Thou shalt not revile the gods,\" quoth the god of Moses (Exodus xxii.\n\n28), for it is God who \"hath divided (them) unto all nations\" (Deut.\n\niv.\n\n19); and those who speak evil of [[Vol.\n\n2, Page]] 478 THE SECRET DOCTRINE.\n\n\"Dignities\" (gods) are called \" filthy dreamers\" by Jude (8).\n\nFor even Michael the Archangel durst not bring against him (the devil) a railing accusation, but said: \"The Lord rebuke thee\" ( ibid 9).\n\nFinally the same is repeated in the Talmud.* \"Satan appeared one day to a man who used to curse him daily, and said to him: 'Why dost thou this?' Consider that God himself would not curse me, but merely said: 'The Lord rebuke thee, Satan.' \"** This bit of Talmudic information shows plainly two things: ( a ) that St.\n\nMichael is called \"God\" in the Talmud, and somebody else \"the Lord\"; and ( b ) that Satan is a God, of whom even the \"Lord\" is in fear.\n\nAll we read in the Zohar and other Kabalistic works on Satan shows plainly that this \"personage\" is simply the personification of the abstract evil, which is the weapon of Karmic law and K ARMA.\n\nIt is our human nature and man himself, as it is said that \"Satan is always near and inextricably interwoven with man.\" It is only a question of that Power being latent or active in us.\n\nIt is a well-known fact -- to learned Symbologists at all events -- that in every great religion of antiquity, it is the Logos Demiurge (the second logos), or the first emanation from the mind (Mahat), who is made to strike, so to say, the key-note of that which may be called the correlation of individuality and personality in the subsequent scheme of evolution.\n\nThe Logos it is, who is shown in the mystic symbolism of cosmogony, theogony, and anthropogony, playing two parts in the drama of Creation and Being, i.e ., that of the purely human personality and the divine impersonality of the so-called Avatars, or divine incarnations, and of the universal Spirit, called Christos by the Gnostics, and the Farvarshi (or Ferouer) of Ahura Mazda in the Mazdean philosophy.\n\nOn the lower rungs of theogony the celestial Beings of lower Hierarchies had each a Farvarshi, or a celestial \"Double.\" It is the same, only a still more mystic, reassertion of the Kabalistic axiom, \"Deus est Demon inversus\"; the word \"demon,\" however, as in the case of Socrates, and in the spirit of the meaning given to it by the whole of antiquity, standing for the guardian Spirit, an \"Angel,\" not a devil of Satanic descent, as theology will have it.\n\nThe Roman Catholic Church shows its usual logic and consistency by accepting, as the ferouer of Christ, St.\n\nMichael, who was \"his Angel Guardian,\" as proved by St.\n\nThomas,*** while he calls the prototypes of Michael and his synonyms, such as Mercury, for example, devils [[Footnote(s)]] ------------------------------------------------- * Vide Isis Unveiled, Vol.\n\nII ., 487, et seq.\n\n** Treat.\n\nKiddusheem, 81.\n\nBut see the Qabbala by Mr.\n\nI.\n\nMyer, pp.\n\n92, 94, and the Zohar, quoted in his Volume.\n\n*** In the work of Marangone \"Delle grandezze del Archangelo Sancto Mikaele,\" the author exclaims: \"O Star, the greatest of those that follow the Sun who is Christ!\n\n.\n\n.\n\n.\n\n[[continued on following page]] [[Vol.\n\n2, Page]] 479 GOD AND DEVIL, BOTH METATRONS.\n\nThe Church accepts positively the tenet that Christ has his Ferouer as any other god or mortal has.\n\nWrites de Mirville: \"Here we have the two heroes of the Old Testament, the Verbum (?), or the second Jehovah, and his face ('Presence,' as the Protestants translate) forming both but one, and yet being two, a mystery which seemed to us unsolvable before we had studied the doctrine of the Mazdean ferouers, and learnt that the ferouer was the spiritual potency, at once image, face, and the guardian of the Soul which finally assimilates the ferouer.\" ( Memoires a l'Academie, Vol.\n\nv., p.\n\n516.) This is almost correct.\n\nAmong other absurdities, the Kabalists maintain that the word metatron being divided into [[ meta , thronon ]], means near the throne.\n\nIt means quite the reverse, as meta means \"beyond\" and not \"near.\" This is of great importance in our argument.\n\nSt.\n\nMichael, then, the quis ut Deus, is the translator, so to speak, of the invisible world into the visible and the objective."


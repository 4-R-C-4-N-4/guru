[content]
body = "Granting that the Turanian races were typified by the dwarfs (Dwergar), and that a dark, round-headed, and dwarfish race was driven northward by the fair-faced Scandinavians, or AEsir, the gods being like unto men, there still exists neither in history nor any other scientific work any anthropological proof whatever of the existence in time or space of a race of giants.\n\nYet that such exist, relatively and de facto side by side with dwarfs, Schweinfurth can testify.\n\nThe Nyam-Nyam of Africa are regular dwarfs, while their next neighbours (several tribes of comparatively fair-complexioned Africans) are giants when confronted with the Nyam-Nyams, and very tall even among Europeans, for their women are all above 6 1/2 feet high.\n\n( Vide Schweinfurth's latest works.) In Cornwall and in ancient Britain the traditions of these giants are, on the other hand, excessively common; they are said to live even down to the time of King Arthur.\n\nAll this shows that giants lived to a later date amongst the Celtic than among the Teutonic peoples.\n\nIf we turn to the New World, we have traditions of a race of giants at Tarija on the eastern slopes of the Andes and in Ecuador, who combated gods and men.\n\nThese old beliefs, which term certain localities \" Los campos de los gigantes \" -- \"the fields of giants,\" are always concomitant with the existence of pliocene mammalia and the occurrence of pliocene raised beaches.\n\n\"All the giants are not under Mount Ossa,\" and it would be poor anthropology indeed that would restrict the traditions of giants to Greek and Bible mythologies.\n\nSlavonian countries, Russia especially, teem with legends about the bogaterey (mighty giants) [[Vol.\n\n2, Page]] 755 RACES OF GIANTS.\n\nof old; and their folklore, most of which has served for the foundation of national histories, their oldest songs, and their most archaic traditions, speak of the giants of old.\n\nThus we may safely reject the modern theory that would make of the Titans mere symbols standing for cosmic forces.\n\nThey were real living men, whether twenty or only twelve feet high.\n\nEven the Homeric heroes, who, of course, belonged to a far more recent period in the history of the races, appear to have wielded weapons of a size and weight beyond the strength of the strongest men of modern times.\n\n\"Not twice ten men the mighty bulk could raise, Such men as live in these degenerate days.\" If the fossil footprints from Carson, Indiana, U.S.A.\n\n, are human, they indicate gigantic men.\n\nOf their genuineness there can remain no doubt.\n\nIt is to be deplored that the modem and scientific evidence for gigantic men should rest on footprints alone.\n\nOver and over again, the skeletons of hypothetical giants have been identified with those of elephants and mastodons.\n\nBut all such blunders before the days of geology, and even the traveller's tales of Sir John Mandeville, who says that he saw giants 56 feet high, in India, only show that belief in the existence of giants has never, at any time, died out of the thoughts of men.\n\nThat which is known and accepted is, that several races of gigantic men have existed and left distinct traces.\n\nIn the journal of the Anthropological Institute (Vol.\n\n1871, art.\n\nby Dr.\n\nC.\n\nCarter Blake) such a race is shown as having existed at Palmyra and possibly in Midian, exhibiting cranial forms quite different from those of the Jews.\n\nIt is not improbable that another such race existed in Samaria, and that the mysterious people who built the stone circles in Galilee, hewed neolithic flints in the Jordan valley and preserved an ancient Semitic language quite distinct from the square Hebrew character -- was of a very large stature.\n\nThe English translations of the Bible can never be relied upon, even in their modern revised forms.\n\nThey tell us of the Nephilim translating the word by \"giants,\" and further adding that they were \"hairy\" men, probably the large and powerful prototypes of the later satyrs so eloquently described by the patristic fancy; some of the Church Fathers assuring their admirers and followers that they had themselves seen these \"Satyrs\" -- some alive, others pickled and preserved.\n\nThe word \"giants\" being once adopted as a synonym of Nephilim, the commentators have since identified them with the sons of Anak.\n\nThe filibusters who seized on the Promised Land, found a pre-existing population far exceeding their own in stature, and called it a race of giants.\n\nBut the races of really gigantic men had disappeared ages before the birth of Moses.\n\nThis tall people existed in Canaan, and [[Vol.\n\n2, Page]] 756 THE SECRET DOCTRINE.\n\neven in Bashan, and may have had representatives in the Nabatheans of Midian.\n\nThey were of far greater stature than the undersized Jews.\n\nFour thousand years ago their cranial conformation and large stature separated them from the children of Heber.\n\nForty thousand years ago their ancestors may have been of still more gigantic size, and four hundred thousand years earlier they must have been in proportion to men in our days as the Brobdingnagians were to the Lilliputians.\n\nThe Atlanteans of the middle period were called the Great Dragons, and the first symbol of their tribal deities, when the \"gods\" and the Divine Dynasties had forsaken them, was that of a giant Serpent.\n\nThe mystery veiling the origin and the religion of the Druids, is as great as that of their supposed fanes is to the modern Symbologist, but not to the initiated Occultists.\n\nTheir priests were the descendants of the last Atlanteans, and what is known of them is sufficient to allow the inference that they were eastern priests akin to the Chaldeans and Indians, though little more.\n\nIt may be inferred that they symbolized their deity as the Hindus do their Vishnu, as the Egyptians did their Mystery God, and as the builders of the Ohio Great-Serpent mound worshipped theirs -- namely under the form of the \"mighty Serpent,\" the emblem of the eternal deity T IME (the Hindu Kala).\n\nPliny called them the \"Magi of the Gauls and Britons.\" But they were more than that.\n\nThe author of \" Indian Antiquities \" finds much affinity between the Druids and the Brahmins of India.\n\nDr.\n\nBorlase points to a close analogy between them and the Magi of Persia*; others will see an identity between them and the Orphic priesthood of Thrace: simply because they were connected, in their esoteric teachings, with the universal Wisdom Religion, and thus presented affinities with the exoteric worship of all."


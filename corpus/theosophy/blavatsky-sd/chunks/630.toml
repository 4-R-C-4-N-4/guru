[content]
body = "For: -- \"The quaternary of the intellectual world (the world of Mahat ) is T'Agathon, Nous, Psyche, Hyle; while that of the sensible world (of matter), which is properly what Pythagoras meant by the word Kosmos -- is Fire, Air, Water, and Earth.\n\nThe four elements are called by the name of rizomata, the roots or principles of all mixed bodies, \" i.e., the lower Tetraktis is the root of illusion of the world of matter; and this is the tetragrammaton of the Jews, and the \"mysterious deity,\" over which the modern Kabalists make such a fuss!\n\n\"Thus number four forms the arithmetical mean between the monad and the heptad, as this contains all powers, both of the productive and produced numbers; for this of all numbers under ten, is made of a certain number; the duad doubled makes a tetrad, and the tetrad doubled or unfolded makes the hebdomad (the septenary).\n\nTwo multiplied into itself produces four; and retorted into itself makes the first cube.\n\nThis first cube is a fertile number, the ground of multitude and variety, constituted of two and four (depending on the monad, the seventh ) .\n\nThus the two principles of temporal things, the pyramis and [[Vol.\n\n2, Page]] 600 THE SECRET DOCTRINE.\n\ncube, form and matter, flow from one fountain, the tetragon (on earth) the monad (in heaven) .\n\n.\n\n.\n\n.\n\n\" (See Reuchlin, \" Cabala \" 1 , ii.).\n\nHere Reuchlin, the great authority on the Kabala, shows the cube to be matter, whereas the pyramid or the triad is \"form.\" With the Hermesians the number four becomes the symbol of truth only when amplified into a cube, which, unfolded, makes seven, as symbolizing the male and female elements and the element of L IFE.* Some students have been puzzled to account for the vertical line, which is male, becoming ( vide infra ) in the cross a four-partitioned line -- four being a female number, while the horizontal (the line of matter) becomes three-divisioned.\n\nBut this is easy of explanation.\n\nSince the middle face of the cube unfolded is common to both the vertical and the horizontal bar, or double-line, it becomes neutral ground so to say, and belongs to neither.\n\nThe spirit line remains triadic, and the matter line two-fold -- two being an even and therefore a female number also.\n\nMoreover, according to Theon, the Pythagoreans who gave the name of Harmony to the Tetraktis, \"because it is a diatessaron in sesquitertia\" -- were of opinion that \"the division of the canon of the monochord was made by the tetraktis in the duad, triad, and tetrad; for it comprehends a sesquitertia, a sesquialtera, a double, a triple, and a quadruple proportion, the section of which is 27.\" \"In the ancient musical notation, the tetrachord consisted of three degrees or intervals, and four terms of sounds called by the Greeks diatessaron, and by us a fourth.\" Moreover, the quaternary though an even, therefore a female (\"infernal\") number, varied according to its form.\n\nThis is shown by Stanley (in Pythag.\n\np.\n\n61).\n\nThe 4 was called by the [[Footnote(s)]] ------------------------------------------------- * In the \" Hebrew Egyptian Mystery, the Source of Measures, \" the Author shows (on p.\n\n50) that the figure of the cube unfolded in connection with the circle .\n\n.\n\n.\n\n.\n\n\"becomes .\n\n.\n\na cross proper, or of the tau form, and the attachment of the circle to this last gives the ansated cross of the Egyptians .\n\n.\n\n.\n\n.\n\nwhile there are but 6 faces to a cube, the representation of the cross as the cube unfolded, as to the cross-bars, displays one face of the cube as common to two bars, counted as belonging to either .\n\n.\n\n.\n\n( i.e.\n\n, once counted horizontally, and once vertically) .\n\n.\n\n.\n\n4 for the upright and 3 for the cross bar making seven in all,\" -- 4 for the upright, and 3 for the -- adding -- \"Here we have the famous 4, and 3, and 7.\" Esoteric philosophy explains that four is the symbol of the Universe in its potential state, or chaotic matter, and that it requires Spirit to permeate it actively, i.e.\n\n, the primordial abstract triangle has to quit its one dimensional quality and spread across that matter, thus forming a manifested basis on the three dimensional space, in order that the Universe should manifest intelligibly.\n\nThis is achieved by the cube unfolded.\n\nHence the ansated cross as the symbol of man, generation and life.\n\nIn Egypt ank signified soul, life and blood.\n\nIt is the ensouled, living man, the Septenary.\n\n[[Vol.\n\n2, Page]] 601 THE MUSIC OF THE SPHERES.\n\nPythagoreans the Key-Keeper of Nature; but in union with the 3, which made it seven, it became the most perfect and harmonious number -- nature herself.\n\nThe four was \"the Masculine of Feminine Form,\" when forming the Cross; and Seven is \"the Master of the Moon,\" for this planet is forced to alter her appearance every seven days.\n\nIt is on number seven that Pythagoras composed his doctrine on the Harmony and Music of the Spheres, calling \"a tone\" the distance of the Moon from the Earth; from the Moon to Mercury half a tone, from thence to Venus the same; from Venus to the Sun l 1/2 tones; from the Sun to Mars a tone; from thence to Jupiter 1/2 a tone; from Jupiter to Saturn 1/2 a tone; and thence to the Zodiac a tone; thus making seven tones -- the diapason harmony.\n\nAll the melody of nature is in those seven tones, and therefore is called \"the Voice of Nature.\" Plutarch explains ( de Plac.\n\nPhil., p.\n\n878) that the Achaean Greeks regarded the tetrad as the root and principle of all things, since it was the number of the elements which gave birth to all visible and invisible created things.\n\nWith the brothers of the Rosy Cross, the figure of the Cross, or Cube unfolded, formed the subject of a disquisition in one of the theosophic degrees of Peuret, and was treated according to the fundamental principles of light and darkness, or good and evil.\n\n\"The intelligible world proceeds out of the divine mind (or unit) after this manner."


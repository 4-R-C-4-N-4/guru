body = "Upon the walls of our most private apartments, where we think the eye of intrusion is altogether shut out, and our retirement can never be profaned, there exist the vestiges of all our acts, silhouettes of whatever we have done.\"** Drs.\n\nJevons and Babbage believe that every thought, displacing the particles of the brain and setting them in motion, scatters them throughout the Universe, and they think that \"each particle of the existing matter must be a register of all that has happened.\" (Principles of Science, Vol.\n\nII.\n\np.\n\n455.) Thus the ancient doctrine has begun to acquire rights of citizenship in the speculations of the scientific world.\n\nThe forty \"Assessors\" who stand in the region of Amenti as the accusers of the Soul before Osiris , belong to the same class of deities as the Lipika, and might stand paralleled, were not the Egyptian gods so [[Footnote(s)]] ------------------------------------------------- *These are the four \"Immortals\" which are mentioned in Atharva Veda as the \"Watchers\" or Guardians of the four quarters of the sky (see ch.\n\nlxxvi., 1-4, et seq.\n\n) .\n\n* * \"Conflict between Religion and Science.\" -- Draper, pp.\n\n132 and 133.\n\n[[Vol.\n\n1, Page]] 105 THE DIVINE RECORDERS.\n\nlittle understood in their esoteric meaning.\n\nThe Hindu Chitra-Gupta who reads out the account of every Soul's life from his register, called Agra-Sandhani; the \"Assessors\" who read theirs from the heart of the defunct, which becomes an open book before (whether) Yama, Minos, Osiris, or Karma -- are all so many copies of, and variants from the Lipika, and their Astral Records.\n\nNevertheless, the Lipi-ka are not deities connected with Death, but with Life Eternal.\n\nConnected as the Lipika are with the destiny of every man and the birth of every child, whose life is already traced in the Astral Light not fatalistically, but only because the future, like the PAST, is ever alive in the PRESENT -- they may also be said to exercise an influence on the Science of Horoscopy.\n\nWe must admit the truth of the latter whether we will or not.\n\nFor, as observed by one of the modern adepts of Astrology, \"Now that photography has revealed to us the chemical influence of the Sidereal system, by fixing on the sensitized plate of the apparatus milliards of stars and planets that had hitherto baffled the efforts of the most powerful telescopes to discover them, it becomes easier to understand how our solar system can, at the birth of a child, influence his brain -- virgin of any impression -- in a definite manner and according to the presence on the zenith of such or another zodiacal constellation.\"* [[Footnote(s)]] ------------------------------------------------- ** Les Mysteres de l'Horoscope, p.\n\nXI.\n\n---------------------"


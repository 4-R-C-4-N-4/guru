body = "1, Page]] 43 MOTIONS, THE \"GREAT BREATH.\" sense, for it must give room to still further absolute perfection, according to a higher standard of excellence in the following period of activity -- just as a perfect flower must cease to be a perfect flower and die, in order to grow into a perfect fruit, -- if a somewhat Irish mode of expression may be permitted.\n\nThe Secret Doctrine teaches the progressive development of everything, worlds as well as atoms; and this stupendous development has neither conceivable beginning nor imaginable end.\n\nOur \"Universe\" is only one of an infinite number of Universes, all of them \"Sons of Necessity,\" because links in the great Cosmic chain of Universes, each one standing in the relation of an effect as regards its predecessor, and being a cause as regards its successor.\n\nThe appearance and disappearance of the Universe are pictured as an outbreathing and inbreathing of \"the Great Breath,\" which is eternal, and which, being Motion, is one of the three aspects of the Absolute -- Abstract Space and Duration being the other two.\n\nWhen the \"Great Breath\" is projected, it is called the Divine Breath, and is regarded as the breathing of the Unknowable Deity -- the One Existence -- which breathes out a thought, as it were, which becomes the Kosmos.\n\n(See \"Isis Unveiled.\") So also is it when the Divine Breath is inspired again the Universe disappears into the bosom of \"the Great Mother,\" who then sleeps \"wrapped in her invisible robes.\" ( c ) By \"that which is and yet is not\" is meant the Great Breath itself, which we can only speak of as absolute existence, but cannot picture to our imagination as any form of existence that we can distinguish from Non-existence.\n\nThe three periods -- the Present, the Past, and the Future -- are in the esoteric philosophy a compound time; for the three are a composite number only in relation to the phenomenal plane, but in the realm of noumena have no abstract validity.\n\nAs said in the Scriptures: \"The Past time is the Present time, as also the Future, which, though it has not come into existence, still is\"; according to a precept in the Prasanga Madhyamika teaching, whose dogmas have been known ever since it broke away from the purely esoteric schools.* Our ideas, in short, on duration and time are all derived from our [[Footnote(s)]] ------------------------------------------------- * See Dzungarian \"Mani Kumbum,\" the \"Book of the 10,000 Precepts.\" Also consult Wassilief's \"Der Buddhismus,\" pp.\n\n327 and 357, etc.\n\n[[Vol.\n\n1, Page]] 44 THE SECRET DOCTRINE.\n\nsensations according to the laws of Association.\n\nInextricably bound up with the relativity of human knowledge, they nevertheless can have no existence except in the experience of the individual ego, and perish when its evolutionary march dispels the Maya of phenomenal existence.\n\nWhat is Time, for instance, but the panoramic succession of our states of consciousness?\n\nIn the words of a Master, \"I feel irritated at having to use these three clumsy words -- Past, Present, and Future -- miserable concepts of the objective phases of the subjective whole, they are about as ill-adapted for the purpose as an axe for fine carving.\" One has to acquire Paramartha lest one should become too easy a prey to Samvriti -- is a philosophical axiom.* ------- STANZA I.\n\n-- Continued .\n\n7.\n\nT HE CAUSES OF EXISTENCE HAD BEEN DONE AWAY WITH ( a ); THE VISIBLE THAT WAS, AND THE INVISIBLE THAT IS, RESTED IN ETERNAL NON-BEING, THE ONE BEING ( b ).\n\n( a ) \"The Causes of Existence\" mean not only the physical causes known to science, but the metaphysical causes, the chief of which is the desire to exist, an outcome of Nidana and Maya.\n\nThis desire for a sentient life shows itself in everything, from an atom to a sun, and is a reflection of the Divine Thought propelled into objective existence, into a law that the Universe should exist.\n\nAccording to esoteric teaching, the real cause of that supposed desire, and of all existence, remains for ever hidden, and its first emanations are the most complete abstractions mind can conceive.\n\nThese abstractions must of necessity be postulated as the cause of the material Universe which presents itself to the senses and intellect; and they underlie the secondary and subordinate powers of Nature, which, anthropomorphized, have been worshipped as God and gods by the common herd of every age.\n\nIt is impossible to conceive anything without a cause; the attempt to do so makes the mind a blank.\n\n[[Footnote(s)]] ------------------------------------------------- * In clearer words: \"One has to acquire true Self-Consciousness in order to understand Samvriti, or the 'origin of delusion.'\" Paramartha is the synonym of the Sanskrit term Svasam-vedana, or \"the reflection which analyses itself.\" There is a difference in the interpretation of the meaning of \" Paramartha \" between the Yogacharyas and the Madhyamikas, neither of whom, however, explain the real and true esoteric sense of the expression.\n\nSee further, sloka No.\n\n9.\n\n[[Vol.\n\n1, Page]] 45 BEING AND NON-BEING.\n\nThis is virtually the condition to which the mind must come at last when we try to trace back the chain of causes and effects, but both science and religion jump to this condition of blankness much more quickly than is necessary; for they ignore the metaphysical abstractions which are the only conceivable cause of physical concretions.\n\nThese abstractions become more and more concrete as they approach our plane of existence, until finally they phenomenalise in the form of the material Universe, by a process of conversion of metaphysics into physics, analogous to that by which steam can be condensed into water, and the water frozen into ice.\n\n( b ) The idea of Eternal Non-Being, which is the One Being, will appear a paradox to anyone who does not remember that we limit our ideas of being to our present consciousness of existence; making it a specific, instead of a generic term.\n\nAn unborn infant, could it think in our acceptation of that term, would necessarily limit its conception of being, in a similar manner, to the intrauterine life which alone it knows; and were it to endeavour to express to its consciousness the idea of life after birth (death to it), it would, in the absence of data to go upon, and of faculties to comprehend such data, probably express that life as \"Non-Being which is Real Being.\" In our case the One Being is the noumenon of all the noumena which we know must underlie phenomena, and give them whatever shadow of reality they possess, but which we have not the senses or the intellect to cognize at present."


[content]
body = "Without doubt, this one-sided mode of dealing with the problem is due largely to the pernicious Western practice of subordinating consciousness, or regarding it as a \"by-product\" of molecular motion.\n\n[[Vol.\n\n1, Page]] 328 THE SECRET DOCTRINE.\n\nreferred to as Spirit and matter.\n\nTo \"Spirit\" is referable every manifestation of consciousness, reflective or direct, and of unconscious purposiveness (to adopt a modern expression used in Western philosophy , so-called) as evidenced in the Vital Principle, and Nature's submission to the majestic sequence of immutable law.\n\n\"Matter\" must be regarded as objectivity in its purest abstraction -- the self-existing basis whose septenary manvantaric differentiations constitute the objective reality underlying the phenomena of each phase of conscious existence.\n\nDuring the period of Universal Pralaya, Cosmic Ideation is nonexistent; and the variously differentiated states of Cosmic Substance are resolved back again into the primary state of abstract potential objectivity.\n\nManvantaric impulse commences with the re-awakening of Cosmic Ideation (the \"Universal Mind\") concurrently with, and parallel to the primary emergence of Cosmic Substance -- the latter being the manvantaric vehicle of the former -- from its undifferentiated pralayic state.\n\nThen, absolute wisdom mirrors itself in its Ideation; which, by a transcendental process, superior to and incomprehensible by human Consciousness, results in Cosmic Energy ( Fohat ) .\n\nThrilling through the bosom of inert Substance, Fohat impels it to activity, and guides its primary differentiations on all the Seven planes of Cosmic Consciousness.\n\nThere are thus Seven Protyles (as they are now called), while Aryan antiquity called them the Seven Prakriti, or Natures, serving, severally, as the relatively homogeneous basis, which in the course of the increasing heterogeneity (in the evolution of the Universe) differentiate into the marvellous complexity presented by phenomena on the planes of perception.\n\nThe term \"relatively\" is used designedly, because the very existence of such a process, resulting in the primary segregations of undifferentiated Cosmic Substance into its septenary bases of evolution, compels us to regard the protyle* of each plane as only a mediate phase assumed by Substance in its passage from abstract, into full objectivity.\n\nCosmic Ideation is said to be non-existent during Pralayic periods, for the simple reason that there is no one, and nothing, to perceive its effects.\n\nThere can be no manifestation of Consciousness, semi-consciousness, or even \"unconscious purposiveness,\" except through the [[Footnote(s)]] ------------------------------------------------- * The term Protyle is due to Mr.\n\nCrookes, the eminent chemist, who has given that name to pre-Matter , if one may so call primordial and purely homogeneous substances, suspected, if not actually yet found, by Science in the ultimate composition of the atom.\n\nBut the incipient segregation of primordial matter into atoms and molecules takes its rise subsequent to the evolution of the Seven Protyles.\n\nIt is the last of these -- having recently detected the possibility of its existence on our plane -- that Mr.\n\nCrookes is in search of.\n\n[[Vol.\n\n1, Page]] 329 THE UNIVERSAL ILLUSION.\n\nvehicle of matter; that is to say, on this our plane, wherein human consciousness in its normal state cannot soar beyond what is known as transcendental metaphysics, it is only through some molecular aggregation or fabric that Spirit wells up in a stream of individual or sub-conscious subjectivity.\n\nAnd as Matter existing apart from perception is a mere abstraction, both of these aspects of the A BSOLUTE -- Cosmic Substance and Cosmic Ideation -- are mutually inter-dependent.\n\nIn strict accuracy -- to avoid confusion and misconception -- the term \"Matter\" ought to be applied to the aggregate of objects of possible perception, and \"Substance\" to noumena; for inasmuch as the phenomena of our plane are the creation of the perceiving Ego -- the modifications of its own subjectivity -- all the \"states of matter representing the aggregate of perceived objects\" can have but a relative and purely phenomenal existence for the children of our plane.\n\nAs the modern Idealists would say, the co-operation of Subject and Object results in the Sense-object or phenomenon.\n\nBut this does not necessarily lead to the conclusion that it is the same on all other planes; that the co-operation of the two on the planes of their septenary differentiation results in a septenary aggregate of phenomena which are likewise non-existent per se , though concrete realities for the Entities of whose experience they form a part, in the same manner as the rocks and rivers around us are real from the stand-point of a physicist, though unreal illusions of sense from that of the metaphysician.\n\nIt would be an error to say, or even conceive such a thing.\n\nFrom the stand-point of the highest metaphysics, the whole Universe, gods included, is an illusion; but the illusion of him who is in himself an illusion differs on every plane of consciousness; and we have no more right to dogmatise about the possible nature of the perceptive faculties of an Ego on, say, the sixth plane, than we have to identify our perceptions with, or make them a standard for, those of an ant, in its mode of consciousness.\n\nThe pure object apart from consciousness* is unknown to us, while living on the plane of our three-dimensional World; as we know only the mental states it excites in the perceiving Ego.\n\nAnd, so long as the contrast of Subject and Object endures -- to wit, as long as we enjoy our five senses and no more, and do not know how to divorce our all-perceiving Ego (the Higher Self) from the thraldom of these senses -- so long will it be impossible for the personal Ego to break through the barrier which separates it from a [[Footnote(s)]] ------------------------------------------------- * Cosmic Ideation focussed in a principle or upadhi (basis) results as the consciousness of the individual Ego.\n\nIts manifestation varies with the degree of upadhi , e.g.\n\n, through that known as Manas it wells up as Mind-Consciousness; through the more finely differentiated fabric (sixth state of matter) of the Buddhi resting on the experience of Manas as its basis -- as a stream of spiritual INTUITION.\n\n[[Vol.\n\n1, Page]] 330 THE SECRET DOCTRINE.\n\nknowledge of things in themselves ( or Substance ) .\n\nThat Ego, progressing in an arc of ascending subjectivity, must exhaust the experience of every plane.\n\nBut not till the Unit is merged in the ALL, whether on this or any other plane, and Subject and Object alike vanish in the absolute negation of the Nirvanic State (negation, again, only from our plane ), is scaled that peak of Omniscience -- the Knowledge of things-in-themselves; and the solution of the yet more awful riddle approached, before which even the highest Dhyan Chohan must bow in silence and ignorance -- the unspeakable mystery of that which is called by the Vedantins, the P ARABRAHMAM."


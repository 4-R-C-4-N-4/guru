[content]
body = "Therefore the Sloka says, \"Happy are those who are born, even from the (latent) condition of gods, as men, in Bharata-varsha; as that is the way to .\n\n.\n\n.\n\nfinal liberation.\" In Jambu-dwipa, Bharata is considered the best of its divisions, because IT IS THE LAND OF WORKS.\n\nIn it alone \"it is that the succession of four Yugas (ages), the Krita, the Treta, the Dwapara, and Kali take place\"; when, therefore, Parasara, asked by Maitreya \"to give him the descriptions of the Earth,\" returns again to the enumeration of the same Dwipas with the same seas, etc., as those he had described in the Swayambhuva Manvantara -- it is simply a blind, yet, to him who reads between the lines, the Four great Races and the Fifth are there, ay, with their sub-divisions, islands, and continents, some of which were called by the names of celestial lokas, and by those of other globes.\n\nHence the confusion.\n\nAll these are called by the Orientalists \"mythical\" and \"fabulous\" islands and lands.* Very true, some are not of this earth, but they still exist.\n\nThe \"White Island\" and Atala, at all events, are no myths, since the latter was the name contemptuously applied by the earliest pioneers of the Fifth Race to the land of Sin -- Atlantis, in general, not to Plato's island alone; and since the former was ( a ) the Sveta-dwipa of theogony, and ( b ) Saka-dwipa, or Atlantis (its earliest portions) in its beginnings.\n\nThis was when it yet had its \"seven holy rivers that washed away all sin,\" and its \"seven districts, wherein there was no dereliction of virtue, no contention, no deviation from virtue,\" as it was then inhabited by the caste of the Magas -- that caste which even the Brahmins acknowledged as not inferior to their own -- and which was [[Footnote(s)]] ------------------------------------------------- * In a lecture, Professor Pengelly, F.R.S ., quoting Professor Oliver, makes him say \"that the present Atlantic islands' Flora affords no substantial evidence of a former direct communication with the mainland of the New World,\" but himself adds that, at the same time, \"at some period of the Tertiary epoch, N.\n\nE.\n\nAsia was united to N.\n\nW.\n\nAmerica, perhaps by the line where the Aleutian chain of islands now extends.\" Thus Occult Science alone can reconcile the contradictions and hesitations of modern Science.\n\nMoreover, surely the argument for the existence of Atlantis does not rest on Botany alone.\n\n[[Vol.\n\n2, Page]] 323 THE MAGIS IN THE DAYS OF KRISHNA.\n\nthe nursery of the first Zaratushta.\n\nThe Brahmins are shown consulting with Gauramukha, on Narada's advice, who told them to invite the Magas as priests of the Sun in the temple built by Samba (the reputed) son of Krishna, who in reality had none.\n\nIn this the Puranas are historical -- allegory notwithstanding -- and Occultism is stating facts.\n\nThe whole story is told in Bhavishya Purana.\n\nIt is stated that, having been cured by Surya (the Sun) of leprosy, Samba, having built a temple dedicated to the Sun, was looking for pious Brahmins to perform the appointed rites in it, and receive donations made to the God.\n\nBut Narada (this virgin ascetic whom one finds in every age in the Puranas) advised him not to do so, as Manu forbade the Brahmins to receive emoluments for the performance of religious rites.\n\nHe therefore referred Samba to Gauramukha (white face), the Purohita or family priest of Hgrasena, King of Mathura, who would tell him whom he could best employ.\n\nThe priest directed Samba to invite the Magas, the worshippers of Surya, to discharge the duty.\n\nIgnorant of the place they lived in, it is Surya, the Sun himself, who directs Samba to Sakadwipa beyond the salt water.\n\nThen Samba performs the journey, using Garuda (Vishnu's and Krishna's vehicle, the great Bird) who lands him among the Magas, etc.\n\nNow Krishna, who lived 5,000 years ago, and Narada, who is found reborn in every cycle (or race), besides Garuda -- the symbol esoterically of the great cycle -- show the allegory; yet the Magas are the Magi of Chaldea, and their class and worship were born on the earlier Atlantis, in Saka-dwipa, the Sinless.\n\nAll the Orientalists are agreed that the Magas of Saka-dwipa are the forefathers of the fire-worshipping Parsis.\n\nOur quarrel with them rests, as usual, on their dwarfing hundreds of thousands to a few centuries this time: they carry the event -- Narada and Samba notwithstanding -- to the days of the flight of the Parsis to Gujerat, which is simply absurd, as that was in the VIII th cent.\n\nof our era.\n\nThough the Magas in the Bhavishya Purana are credited with still living in Saka-dwipa in the day of Krishna's Son, yet the last of it -- Plato's \"Atlantis\" -- had perished 6000 years before.\n\nThey were Mag \"late of\" Saka-Dwipa, and lived in those days in Chaldea.\n\nThis is an intentional confusion, again.\n\nThe earliest pioneers of the Fourth Race were not Atlanteans, nor yet the human Asuras and the Rakshasas which they became later.\n\nIn those days large portions of the future continent of Atlantis were yet part and parcel of the Ocean floors.\n\n\"Lemuria,\" as we have called the continent of the Third Race, was then a gigantic land.* It covered [[Footnote(s)]] ------------------------------------------------- * As shown in the Introduction, it stands to reason that neither the name of Lemuria nor even Atlantis are the real archaic names of the lost continents, but have been adopted by us for the sake of clearness.\n\nAtlantis was the name given to those [[Footnote continued on next page]] [[Vol.\n\n2, Page]] 324 THE SECRET DOCTRINE.\n\nthe whole area of space from the foot of the Himalayas, which separated it from the inland sea rolling its waves over what is now Tibet, Mongolia, and the great desert of Schamo (Gobi); from Chittagong, westward to Hardwar, and eastward to Assam."


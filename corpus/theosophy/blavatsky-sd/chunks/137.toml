body = "It cannot be called so by men in their WAKING STATE; therefore they have named it in their ignorance ' God-Spirit.\n\n' (xix.) \" It exists everywhere and forms the first U PADHI ( foundation ) on which our World ( solar system ) is built.\n\nOutside the latter it is to be found in its pristine purity only between ( the solar systems or ) the Stars of the Universe, the worlds already formed or forming; those in LAYA resting meanwhile in its bosom.\n\nAs its substance is of a different kind from that known on earth, the inhabitants of the latter, seeing THROUGH IT, believe in their illusion and ignorance that it is empty space.\n\nThere is not one finger ' s breath (ANGULA) of void Space in the whole Boundless ( Universe ).........\n\n(xx .\n\n) \" Matter or Substance is septenary within our World, as it is so beyond it.\n\nMoreover, each of its states or principles is graduated into seven degrees of density.\n\nS URYA ( the Sun ) , in its visible reflection, exhibits the first, or lowest state of the seventh, the highest state of the Universal PRESENCE , the pure of the pure, the first manifested Breath of the ever Unmanifested SAT ( Be-ness ) .\n\nAll the Central physical or objective Suns are in their substance the lowest state of the first Principle of the BREATH .\n\nNor are any of these any more than the REFLECTIONS of their PRIMARIES which are concealed from the gaze of all but the Dhyan Chohans, whose Corporeal substance belongs to the fifth division of the seventh Principle of the Mother substance, and is, [[Footnote(s) -------------------------------------------------]] * This (teaching) does not refer to Prakriti-Purusha beyond the boundaries of our small universe.\n\n** The ultimate quiescent state: the Nirvana condition of the seventh Principle.\n\n*** The teaching is all given from our plane of consciousness.\n\n[[Vol.\n\n1, Page]] 290 THE SECRET DOCTRINE.\n\ntherefore, four degrees higher than the solar reflected substance.\n\nAs there are seven Dhatu ( principal substances in the human body ) so there are seven Forces in Man and in all Nature.\n\n(xxi.) \" The real substance of the concealed ( Sun ) is a nucleus of Mother substance.\n\n* It is the heart and the matrix of all the living and existing Forces in our solar universe.\n\nIt is the Kernel from which proceed to spread on their cyclic journeys all the Powers that set in action the atoms in their functional duties, and the focus within which they again meet in their SEVENTH ESSENCE every eleventh year.\n\nHe who tells thee he has seen the sun, laugh at him** as if he had said that the sun moves really onward on his diurnal path .\n\n.\n\n.\n\n.\n\n(xxiii).\n\n\" It is on account of his septenary nature that the Sun is spoken of by the ancients as one who is driven by seven horses equal to the metres of the Vedas; or, again, that, though he is identified with the SEVEN \" Gaina \" ( classes of being ) in his orb, he is distinct from them, *** as he is, indeed; as also that he has SEVEN RAYS, as indeed he has .\n\n.\n\n.\n\n.\n\n(xxv.) \" The Seven Beings in the Sun are the Seven Holy Ones, Self-born from the inherent power in the matrix of Mother substance.\n\nIt is they who send the Seven Principal Forces, called rays, which at the beginning of Pralaya will centre into seven new Suns for the next Manvantara.\n\nThe energy from which they spring into conscious existence in every Sun, is what some people call Vishnu ( see foot-note below ) , which is the Breath of the ABSOLUTENESS.\n\nWe call it the One manifested life -- itself a reflection of the Absolute .........\n\n(xxvi.) \" The latter must never be mentioned in words or speech LEST IT SHOULD TAKE AWAY SOME OF OUR SPIRITUAL ENERGIES THAT ASPIRE towards ITS state, gravitating ever onward unto IT spiritually, as the whole physical universe gravitates towards ITS manifested centre -- cosmically.\n\n(xxvii.) \" The former -- the Initial existence -- which may be called while in [[Footnote(s) -------------------------------------------------]] * Or the \"dream of Science,\" the primeval really homogeneous matter, which no mortal can make objective in this Race or Round either.\n\n** \"Vishnu in the form of the Solar active energy, neither ever rises nor sets, and is at once, the sevenfold Sun and distinct from it,\" says Vishnu Purana (Book II., Chap.\n\n1 1).\n\n*** \"In the same manner as a man approaches a mirror placed upon a stand, beholds in it his own image, so the energy or reflection of Vishnu (the Sun) is never disjoined but remains in the Sun as in a mirror that is there stationed\" (\" Vishnu Purana \") .\n\n[[Vol.\n\n1, Page]] 291 OCCULT APHORISMS.\n\nthis state of being the O NE L IFE, is, as explained, a F ILM for creative or formative Purposes.\n\nIt manifests in seven states, which, with their septenary sub-divisions, are the F ORTY-NINE Fires* mentioned in sacred books .\n\n.\n\n.\n\n.\n\n.\n\n.\n\n(xxix.) \" The first is the .\n\n.\n\n.\n\n.\n\n' Mother ' ( prima MATERIA).\n\nSeparating itself into its primary seven states, it proceeds down cyclically; when** having consolidated itself in its LAST principle as GROSS MATTER, it revolves around itself and informs, with the seventh emanation of the last, the first and the lowest element ( the Serpent biting its own tail ) .\n\nIn a hierarchy, or order of being, the seventh emanation of her last principle is: -- ( a ) In the mineral, the spark that lies latent in it, and is called to its evanescent being by the P OSITIVE awakening the N EGATIVE ( and so forth ) .\n\n.\n\n.\n\n.\n\n( b ) In the plant it is that vital and intelligent Force which informs the seed and develops it into the blade of grass, or the root and sapling.\n\nIt is the germ which becomes the U PADHI of the seven principles of the thing it resides in, shooting them out as the latter grows and develops.\n\n( c ) In every animal it does the same.\n\nIt is its life principle and vital power; its instinct and qualities; its characteristics and special idiosyncrasies .\n\n.\n\n.\n\n.\n\n( d ) To man, it gives all that it bestows on all the rest of the manifested units in nature; but develops, furthermore, the reflection of all its F ORTY-NINE F IRES in him.\n\nEach of his seven principles is an heir in full to, and a partaker of, the seven principles of the \" great Mother.\n\n\" The breath of her first principle is his spirit ( Atma ) .\n\nHer second principle is B UDDHI ( soul ).\n\nWe call it, erroneously, the seventh.\n\nThe third furnishes him with ( a ) the brain stuff on the physical plane, and ( b ) with the MIND that moves it [which is the human soul.\n\n-- H.\n\nP."


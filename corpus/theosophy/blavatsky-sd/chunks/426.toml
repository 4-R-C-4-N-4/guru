[content]
body = "To return, however, once more to the history of the Third Race, the \"Sweat-Born,\" the \"Egg-bearing,\" and the \"Androgyne.\" Almost sexless, in its early beginnings, it became bisexual or androgynous; very gradually of course.\n\nThe passage from the former to the latter transformation required numberless generations, during which the simple cell that issued from the earliest parent (the two in one), first developed into a bisexual being; and then the cell, becoming a regular egg, gave forth a unisexual creature.\n\nThe Third-Race-mankind is the most mysterious of all the hitherto developed five Races.\n\nThe mystery of the \"How\" of the generation of the distinct sexes must, of course, be very obscure here, as it is the business of an embryologist and a specialist, the present work giving only faint outlines of the process.\n\nBut it is evident that the units of the Third Race humanity began to separate in their pre-natal shells, or eggs,* and to issue out of them as distinct male and female babes, ages after the appearance of its early progenitors.\n\nAnd, as time rolled on its geological periods, the newly born sub-races began to lose their natal capacities.\n\nToward the end of the fourth sub-race, the babe lost its faculty of walking as soon as liberated from its shell, and by the end of the fifth, mankind was born under the same conditions and by the same identical process as our historical generations.\n\nThis required, of course, millions of years.\n\nThe [[Footnote(s)]] ------------------------------------------------- * The \"fables\" and \"myths\" about Leda and Jupiter, and such like, could never have sprung up in people's fancy, had not the allegory rested on a fact in nature.\n\nEvolution, gradually transforming man into a mammal, did in his case only what it did in that of other animals.\n\nBut this does not prevent man from having always stood at the head of the animal world and other organic species, and from having preceded the former.\n\n[[Vol.\n\n2, Page]] 198 THE SECRET DOCTRINE.\n\nreader has been made acquainted with the approximate figures, at least of the exoteric calculations, in Stanza II .\n\nWe are approaching the turning-point of the evolution of the Races.\n\nLet us see what occult philosophy says on the origin of language.\n\n------- 36.\n\nT HE F OURTH R ACE DEVELOPED S PEECH.\n\nThe Commentaries explain that the first Race -- the ethereal or astral Sons of Yoga, also called \"Self-born\" -- was, in our sense, speechless, as it was devoid of mind on our plane.\n\nThe Second Race had a \"Sound-language,\" to wit, chant-like sounds composed of vowels alone.\n\nThe Third Race developed in the beginning a kind of language which was only a slight improvement on the various sounds in Nature, on the cry of gigantic insects and of the first animals, which, however, were hardly nascent in the day of the \"Sweat-born\" (the early Third Race).\n\nIn its second half, when the \"Sweat-born\" gave birth to the \"Egg-born,\" (the middle Third Race); and when these, instead of \"hatching out\" (may the reader pardon the rather ridiculous expression when applied to human beings in our age) as androgynous beings, began to evolve into separate males and females; and when the same law of evolution led them to reproduce their kind sexually, an act which forced the creative gods, compelled by Karmic law, to incarnate in mindless men; then only was speech developed.\n\nBut even then it was still no better than a tentative effort.\n\nThe whole human race was at that time of \"one language and of one lip.\" This did not prevent the last two Sub-Races of the Third Race* from building cities, and sowing far and wide the first seeds of civilization under the guidance of their divine instructors,** and their own already awakened minds.\n\nLet the reader also bear in mind that, as each of the seven races is divided into four ages -- the Golden, Silver, Bronze, and Iron Age -- so is every smallest division of such races.*** Speech then developed, according to occult teaching, in the following order: -- I.\n\nMonosyllabic speech; that of the first approximately fully developed human beings at the close of the Third Root-race, the \"golden-coloured,\" yellow-complexioned men, after their separation into sexes, and the full [[Footnote(s)]] ------------------------------------------------- * To avoid confusion, let the reader remember that the term Root-Race applies to one of the seven great Races, sub-Race to one of its great Branches, and Family-Race to one of the sub-divisions, which include nations and large tribes.\n\n** In the Section on the Divine Dynasties, the nature of these \"Instructors\" is explained.\n\n*** Vide Section attached to the \"Divisions into Yugas.\" [[Vol.\n\n2, Page]] 199 PRIMEVAL LANGUAGE.\n\nawakening of their minds.\n\nBefore that, they communicated through what would now be called \"thought-transference,\" though, with the exception of the Race called the \"Sons of Will and Yoga\" -- the first in whom the \"Sons of Wisdom\" had incarnated -- thought was but very little developed in nascent physical man, and never soared above a low terrestrial level.\n\nTheir physical bodies belonging to the Earth, their Monads remained on a higher plane altogether.\n\nLanguage could not be well developed before the full acquisition and development of their reasoning faculties.\n\nThis monosyllabic speech was the vowel parent, so to speak, of the monosyllabic languages mixed with hard consonants, still in use amongst the yellow races which are known to the anthropologist.* II .\n\nThese linguistic characteristics developed into the agglutinative languages.\n\nThe latter were spoken by some Atlantean races, while other parent stocks of the Fourth Race preserved the mother-language.\n\nAnd as languages have their cyclic evolution, their childhood, purity, growth, fall into matter, admixture with other languages, maturity, decay and finally death,** so the primitive speech of the most civilized Atlantean races -- that language, which is referred to as \"Rakshasi Bhasa,\" in old Sanskrit works -- decayed and almost died out.\n\nWhile the \"cream\" of the Fourth Race gravitated more and more toward the apex of physical and intellectual evolution, thus leaving as an heirloom to the nascent Fifth (the Aryan) Race the inflectional, highly developed languages, the agglutinative decayed and remained as a fragmentary fossil idiom, scattered now, and nearly limited to the aboriginal tribes of America.\n\n[[Footnote(s)]] ------------------------------------------------- * The present yellow races are the descendants, however, of the early branches of the Fourth Race.\n\nOf the third, the only pure and direct descendants are, as said above, a portion of the fallen and degenerated Australians, whose far distant ancestors belonged to a division of the seventh Sub-race of the Third.\n\nThe rest are of mixed Lemuro-Atlantean descent.\n\nThey have since then entirely changed in stature and intellectual capacities."


body = "orbit,\" and as the Secret Doctrine attributes it to the same source, but with the addition of another factor, the shifting of the Earth's axis -- a proof of which may be found in the Book of Enoch,* if the veiled language of the Puranas is not understood -- all this should tend to show that the ancients knew something of the \"modern discoveries\" of Science.\n\nEnoch, when speaking of \"the great inclination of the Earth,\" which \"is in travail,\" is quite significant and clear.\n\nIs not this evident?\n\nNuah is Noah, floating on the waters in his ark; the latter being the emblem of the Argha, or Moon, the feminine principle; Noah is the \"spirit\" falling into matter.\n\nWe find him, as soon as he descends upon the Earth, planting a vineyard, drinking of the wine, and getting drunk on it, i.e., the pure spirit becomes intoxicated as soon as it is finally imprisoned in matter.\n\nThe seventh chapter of Genesis is only another version of the First.\n\nThus, while the latter reads: \"and darkness was upon the face of the deep.\n\nAnd the spirit of God moved upon the face of the waters,\" in ch.\n\n7 it is said \" .\n\n.\n\n.\n\nand the waters prevailed .\n\n.\n\n.\n\nand the ark went (with Noah, the spirit) upon the face of the waters.\" Thus Noah, if identical with the Chaldean Nuah, is the spirit vivifying matter, which latter is Chaos, represented by the D EEP, or the Waters of the Flood.\n\nIn the Babylonian legend (the pre-cosmical blended with the terrestrial event) it is Ishtar (Astaroth or Venus, the lunar goddess) who is shut up in the ark and sends out \"a dove in search of dry land.\" (\" Isis Unveiled \" Vol.\n\nII, pp.\n\n423 and 424) .\n\nGeorge Smith notes in the \" Tablets ,\" first the creation of the moon, and then that of the sun: \"Its beauty and perfection are extolled, and the regularity of its orbit, which led to its being considered the type of a judge and the regulator of the world.\" If this story related simply to a cosmogonical cataclysm -- even were this latter universal -- why should the goddess Ishtar or Astoreth, the Moon, speak of the creation of the sun after the deluge?\n\nThe waters might have reached as high as the mountain of Nizir (Chaldean version), or Jebel Djudi (the deluge mountains of the Arabian legend), or yet Ararat (of the Biblical narrative), and even the Himalaya (of the Hindu tradition), and yet not reach the sun: the Bible itself stopped short of such a miracle!\n\nIt is evident that the deluge of the people who first recorded it had another meaning, less problematical and far more philosophical than that of an universal deluge, of which there are no geological traces whatever.\n\nAs all such Cataclysms are periodical and cyclical, and as Manu Vaivasvata figures as a generic character, under various circumstances and events ( vide infra: \"The Seven Manus of Humanity \"), there seems to be no [[Footnote(s)]] ------------------------------------------------- * Chap.\n\nlxiv., Sect.\n\nxi.\n\n[[Vol.\n\n2, Page]] 146 THE SECRET DOCTRINE.\n\nserious objection to the supposition that the first \"great flood\" had an allegorical, as well as a cosmic meaning, and that it happened at the end of the Satya Yuga, the \"age of Truth,\" when the Second Root Race, \"The Manu with bones,\" made its primeval appearance as \"the Sweat-Born.\"* The Second Flood -- the so-called \"universal\" -- which affected the Fourth Root Race (now conveniently regarded by theology as \"the accursed race of giants,\" the C AINITES, and \"the sons of Ham\") is that flood which was first perceived by geology.\n\nIf one carefully compares the accounts in the various legends of the Chaldees and other exoteric works of the nations, it will be found that all of them agree with the orthodox narratives given in the Brahmanical books.\n\nAnd it may be perceived that while, in the first account, \"there is no God or mortal yet on Earth,\" when Manu Vaivasvata lands on the Himavan; in the second, the Seven Rishis are allowed to keep him company: thus showing that whereas some accounts refer to the sidereal and cosmic F LOOD before the so-called creation, the others treat, one of the Great Flood of Matter on Earth, and the other of a real watery deluge.\n\nIn the Satapatha Brahmana, Manu finds that \"the Flood had swept away all living creatures, and he alone was left\" -- i.e., the seed of life alone remained from the previous dissolution of the Universe, or Mahapralaya, after a \"Day of Brahma\"; and the Mahabharata refers simply to the geological cataclysm which swept away nearly all the Fourth Race to make room for the Fifth.\n\nTherefore is Vaivasvata Manu shown under three distinct attributes in our esoteric Cosmogony:** ( a ) as the \"Root-Manu\" [[Footnote(s)]] ------------------------------------------------- * All such expressions are explained in the \" Anthropogenesis \" of this Book, and elsewhere.\n\n** One has to remember that, in the Hindu philosophy, every differentiated unit is such only through the cycles of Maya, being one in its essence with the Supreme or One Spirit.\n\nHence arises the seeming confusion and contradiction in the various Puranas, and at times in the same Purana, about the same individual.\n\nVishnu -- as the many-formed Brahma, and as Brahma (neuter) -- is one, and yet he is said to be all the 28 Vyasas ( Vishnu Purana ) .\n\n\"In every Dvapara (third) age, Vishnu, in the person of Vyasa, divides the Veda, which is one, into four and many portions.\n\nTwenty-eight times have the Vedas been arranged by the great Rishis in the Vaivasvata Manvantara, in the Dvapara Yuga .\n\n.\n\n.\n\nand, consequently, twenty-eight Vyasas have passed away .\n\n.\n\n.\n\nthey who were all in the form of Veda-Vyasas, who were the Vyasas of their respective eras.\n\n.\n\n.\n\n.\n\n\" ( Book III., Ch .\n\nIII.) \"This world is Brahma in Brahma, from Brahma .\n\n.\n\n.\n\nnothing further to be known.\" Then, again .\n\n.\n\n.\n\n\"There were in the First Manvantara seven celebrated sons of Vasishta, who in the Third Manvantara, were sons of Brahma ( i.e ., Rishis), the illustrious progeny of Urja.\" This is plain: the Humanity of the First Manvantara is that of the seventh and of all the intermediate ones.\n\nThe mankind of the First Root-Race is the mankind of the second, third, fourth, fifth , etc.\n\nTo the last it forms a cyclic and constant reincarnation of the Monads belonging to the Dhyan Chohans of our Planetary chain.\n\n[[Vol."


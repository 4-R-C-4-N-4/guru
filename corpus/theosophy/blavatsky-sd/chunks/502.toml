body = "all this allies them to Cyclopean monuments, of which it can be said with good reason, repeating after de La Vega that 'the demons seem to have worked on them more than men.' \"* For once we agree with our friends and foes, the Roman Catholics, and ask whether such prodigies of statics and equilibrium, applied to masses weighing millions of pounds, can be the work of Palaeolithic savages, of cave-men, taller than the average man in our century, yet ordinary mortals as we are?\n\nIt is no use for our purpose to refer to the various traditions attached to the rocking-stones.\n\nStill, it may be as well to remind the English reader of Giraldus Cambrensis, who speaks of such a stone on the Isle of Mona, which returned to its place, every effort made to keep it elsewhere notwithstanding.\n\nAt the time of the conquest of Ireland by Henry II ., a Count Hugo Cestrensis, desiring to convince himself of the reality of the fact, tied the Mona stone to a far bigger one and had them thrown into the sea.\n\nOn the following morning it was found in its accustomed place.\n\n.\n\n.\n\nThe learned William of Salisbury warrants the fact by testifying to its presence in the wall of a church where he had seen it in 1554.\n\n.\n\n.\n\nAnd this reminds one of what Pliny said of the stone left by the Argonauts at Cyzicum, which the Cyzicans had placed in the Prytanea \"whence it ran away several times, which forced them to lead it\" ( Nat.\n\nHist., XXXVI., p.\n\n592) .\n\n.\n\n.\n\nHere we have immense stones stated by all antiquity to be \"living, moving, speaking and self-perambulating.\" They were also capable, it seems, of making people run away, since they have been called routers (\"to put to flight,\" to rout) and Des Mousseaux shows them all to be prophetic stones and [[Footnote(s)]] ------------------------------------------------- * \"It is difficult,\" writes Creuzer, \"not to suspect in the structures of Tiryns and Mycenae planetary forces supposed to be moved by celestial powers, analogous to the famous Dactyles.\" ( Pelasges et Cyclopes ) .\n\nTo this day Science is ignorant on the subject of the Cyclopes.\n\nThey are supposed to have built all the so-called \"Cyclopean\" works whose erection necessitated several regiments of Giants, and -- they were only seventy-seven in all (about one hundred, Creuzer thinks).\n\nThey are called \"Builders,\" and Occultism calls them the INITIATORS, who, initiating some Pelasgians, thus laid the foundation stone of true MASONRY.\n\nHerodotus associates the Cyclops with Perseus \"the son of an Assyrian demon\" (I.\n\nVI.\n\np.\n\n54).\n\nRaoul Rochette found that Palaemonius, the Cyclops, to whom a sanctuary was raised, \"was the Tyrian Hercules.\" Anyhow, he was the builder of the sacred columns of Gadir, covered with mysterious characters to which Apollonius of Tyana was the only one in his age to possess the key; and with figures which may still be found on the walls of Ellora, the gigantic ruins of the temple of Viswakarma, \"the builder and artificer of the Gods.\" [[Vol.\n\n2, Page]] 346 THE SECRET DOCTRINE.\n\ncalled mad stones ( see his, \" Dieu et les Dieux, \" p.\n\n587).\n\n\"The rocking-stone is accepted in Science.\n\nWhy did it rock, why was it made to do so?\n\nOne must be blind not to see that this motion was one more means of divination, and that they were called for this very reason 'the stones of truth.' \" ( de Mirville, \" Fetichisme \") * This is history, the Past of prehistoric times, warranting the same in later ages.\n\nThe Dracontia, sacred to the moon and the serpent, were the more ancient \"Rocks of Destiny\" of older nations, whose motion, or rocking, was a code perfectly clear to the initiated priests, who alone had the key to this ancient reading.\n\nVormius and Olaius Magnus show that it was according to the orders of the oracle, \"whose voice spoke through the immense rocks raised by the colossal powers of ancient giants,\" that the kings of Scandinavia were elected.\n\n\"In India and Persia,\" says Pliny, \"it is she (the Persian Oitzoe) whom the magi had to consult for the election of their sovereigns\" ( Nat.\n\nHist., lxxxvii., chap.\n\nLIV.\n\n); and he describes ( in chap.\n\nXXXVIII., 1.\n\nii.\n\n) a rock overshadowing Harpasa, in Asia, and placed in such a manner that \"a single finger [[Footnote(s)]] ------------------------------------------------- * Messrs.\n\nRichardson and Barth are said to have been amazed at finding in the Desert of Sahara the same trilithic and raised stones they had seen in Asia, Circassia, Etruria, and in all the North of Europe.\n\nMr.\n\nRivett-Carnac, B.C.S.\n\n, of Allahabad, the distinguished Archaeologist, shows the same amazement in finding the description given by Sir J.\n\nSimpson of the cuplike markings on stones and rocks in England, Scotland, and other Western countries -- \"offering an extraordinary resemblance\" to \"the marks on the trap Boulders which encircle the Barrows near Nagpur\" (the city of Snakes).\n\nThe eminent scholar saw in this \"another and very extraordinary addition to the mass of evidence.\n\n.\n\n.\n\nthat a branch of the nomadic tribes, who swept at an early date over Europe, penetrated into India also.\" We say Lemuria, Atlantis and her giants, and the earliest races of the Fifth Root-Race had all a hand in these betyles, lithoi, and \"magic\" stones in general.\n\nThe cup marks noticed by Sir J.\n\nSimpson, and the \"holes scooped out on the face\" of rocks and monuments found by Mr.\n\nRivett-Carnac \"of different sizes varying from six inches to an inch-and-a-half in diameter, and in depth from one to one-and-a-half inch .\n\n.\n\n.\n\n.\n\n.\n\n.\n\ngenerally arranged in perpendicular lines presenting many permutations in the number and size and arrangement of the cups\" -- are simply written RECORDS of the oldest races.\n\nWhosoever examines with attention the drawings made of such marks in the \" Archaeological Notes on Ancient Sculpturing on Rocks in Kumaon, India, etc., \" will find in it the most primitive style of marking or recording; something of the sort having been adopted by the American inventors of the Morse code of telegraphic writing, which reminds us of the Ahgam writing, a combination of long and short strokes, as Mr.\n\nRivett-Carnac describes it \"cut on sandstone.\" Sweden, Norway, and Scandinavia are full of such written records, the Runic characters having followed the cup-marks and long and short strokes."


[content]
body = "The first race of men were, then, simply the images, the astral doubles, of their Fathers, who were the pioneers, or the most progressed Entities from a preceding though lower sphere, the shell of which is now our Moon.\n\nBut even this shell is all-potential, for, having generated the Earth, it is the phantom of the Moon which, attracted by magnetic affinity, sought to form its first inhabitants, the pre-human monsters, ( vide supra, Stanza II.).\n\nTo assure himself of this, the student has again to turn to the Chaldean Fragments, and read what Berosus says.\n\nBerosus obtained his information, he tells us, from Ea , the male-female deity of Wisdom.\n\nWhile the gods were generated in its androgynous bosom (Svabhavat, Mother-space) its (the Wisdom's) reflections became on Earth the woman Omoroka, who is the Chaldean Thavatth, or the Greek Thalassa, the Deep or the Sea, which esoterically and even exoterically is the Moon.\n\nIt was the Moon (Omoroka) who presided over the monstrous creation of nondescript beings which were slain by the Dyanis.\n\n( Vide Hibbert Lectures, p.\n\n370 et seq.\n\n; also in Part II.\n\n\"Adam-Adami.\") Evolutionary law compelled the lunar \"Fathers\" to pass, in their monadic condition, through all the forms of life and being on this globe; but at the end of the Third Round, they were already human in their divine nature, and were thus called upon to become the creators of the forms destined to fashion the tabernacles of the less progressed Monads, whose turn it was to incarnate.\n\nThese \"Forms\" are called \"Sons of Yoga,\" because Yoga (union with Brahma exoterically) is the supreme condition of the passive infinite deity, since it contains all the divine energies and is the essence of Brahma, who is said (as Brahma) to create everything through Yoga power.\n\nBrahma, Vishnu and Siva are the most powerful energies of God, Brahma, the Neuter, says a [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] tion?\" it is answered: \"Study first the ABC of Occult Alchemy.\" In their anxiety, however, to identify Pymander, \"the mouth of Mystery,\" with St.\n\nJohn the Baptist prophetically, they thus identified also the 7 Kabeiri and the Assyrian Bulls with the Cherubs of the Jews and the Apostles.\n\nHaving, moreover, to draw a line of demarcation between the four and the three -- the latter being the Fallen Angels ; and furthermore to avoid connecting these with the \"Seven Spirits of the Face,\" the Archangels, they unceremoniously threw out all they did not choose to recognise.\n\nHence the perversion in the order of the Elements, in order to make them dovetail with the order of the Gospels, and to identify the Angel-Man with Christ.\n\nWith the Chaldees, the Egyptians, from whom Moses adopted the Chroub (Cherubs in their animal form), and the Ophites; with all these, the Angels, the Planets, and the Elements, were symbolized mystically and alchemically by the Lion (Mikael); the Bull (Uriel); the Dragon (Raphael); the Eagle (Gabriel); the Bear (Thot-Sabaoth); the Dog (Erataoth); the Mule (Uriel or Thartharaoth).\n\nAll these have a qualificative meaning.\n\n[[Vol.\n\n2, Page]] 116 THE SECRET DOCTRINE.\n\nPuranic text.\n\nYoga here is the same as Dhyana, which word is again synonymous with Yoga in the Tibetan text, where the \"Sons of Yoga\" are called \"Sons of Dhyana,\" or of that abstract meditation through which the Dhyani-Buddhas create their celestial sons, the Dhyani-Bodhisattvas.\n\nAll the creatures in the world have each a superior above.\n\n\"This superior, whose inner pleasure it is to emanate into them, cannot impart efflux until they have adored\" -- i.e.\n\n, meditated as during Yoga.\n\n(Sepher M ' bo Ska-arim, translated by Isaac Myer, Qabbalah, pp.\n\n109-111.) ------- 19.\n\nT HE SECOND RACE ( was ) THE PRODUCT BY BUDDING AND EXPANSION; THE A-SEXUAL ( form ) FROM THE SEXLESS ( shadow ) .\n\nT HUS WAS, O L ANOO, THE SECOND RACE PRODUCED ( a ).\n\n( a ) What will be most contested by scientific authorities is this a-sexual Race, the Second, the fathers of the \"Sweat-born\" so-called, and perhaps still more the Third Race, the \"Egg-born\" androgynes.\n\nThese two modes of procreation are the most difficult to comprehend, especially for the Western mind.\n\nIt is evident that no explanation can be attempted for those who are not students of Occult metaphysics.\n\nEuropean language has no words to express things which Nature repeats no more at this stage of evolution, things which therefore can have no meaning for the materialist.\n\nBut there are analogies.\n\nIt is not denied that in the beginning of physical evolution there must have been processes in Nature, spontaneous generation, for instance, now extinct, which are repeated in other forms.\n\nThus we are told that microscopic research shows no permanence of any particular mode of reproducing life.\n\nFor \"it shows that the same organism may run through various metamorphoses in the course of its life-cycle, during some of which it may be sexual, and in others a-sexual ; i.e., it may reproduce itself alternately by the co-operation of two beings of opposite sex, and also by fissure or budding from one being only, which is of no sex.\"* \"Budding\" is the very word used in the Stanza.\n\nHow could these Chhayas reproduce themselves otherwise; viz., procreate the Second Race, since they were ethereal, a-sexual, and even devoid, as yet, of the vehicle of desire, or Kama Rupa, which evolved only in the Third Race?\n\nThey evolved the Second Race unconsciously, as do some plants.\n\nOr, perhaps, as the Amoeba, only on a more ethereal, impressive, and larger scale.\n\nIf, indeed, the cell-theory applies equally to Botany and Zoology, and extends to Morphology, as well as to the Physiology of organisms, [[Footnote(s)]] ------------------------------------------------- * See Laing's \" Modern Science and Modern Thought, \" p.\n\n90.\n\n[[Vol.\n\n2, Page]] 117 THE OUTGROWTH OF RACES.\n\nand if the microscopic cells are looked upon by physical science as independent living beings -- just as Occultism regards the \"fiery lives\"* -- there is no difficulty in the conception of the primitive process of procreation.\n\nConsider the first stages of the development of a germ-cell."


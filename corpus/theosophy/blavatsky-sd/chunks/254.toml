[content]
body = "It teaches that before evolution began, Prakriti (Nature) was in a condition of laya or absolute homogeneity, as \"matter exists in two conditions, the sukshma , or latent and undifferentiated, and the sthula or differentiated condition.\" Then it became anu , atomic.\n\nIt teaches of Sudda - satwa -- \"a substance not subject to the qualities of matter, from which it is quite different,\" and adds that out of that substance the bodies of the inhabitants of Vaikuntaloka (the heaven of Vishnu), the gods, are formed.\n\nThat every particle or atom of Prakriti contains Jiva (divine life), and is the sarira (body) of that Jiva which it contains, while every Jiva is in its turn the sarira of the supreme spirit, as \"Parabrahm pervades every Jiva, as well as every particle of matter.\" Dualistic and anthropomorphic as may be the philosophy of the Visishtadwaita, when compared with that of the Adwaita -- the non-dualists, -- it is yet supremely higher in logic and philosophy than the cosmogony accepted by either Christianity, or its great opponent, modern Science.\n\nThe followers of one of the greatest minds that ever appeared on Earth, the Adwaita Vedantins are called Atheists , because they regard all save Parabrahm, the secondless , or Absolute Reality -- as an illusion.\n\nYet the wisest Initiates came from their ranks, as also the greatest Yogis.\n\nThe Upanishads show that they most assuredly knew not only what is the causal substance in the effects of friction , and that their forefathers were acquainted with the conversion of heat into mechanical force , but that they were acquainted with the noumena of every spiritual as well as of every cosmic phenomenon.\n\nTruly the young Brahmin who graduates in the universities and colleges of India with the highest honours; who starts in life as an M.A .\n\nand an LL.B.\n\n, with a tail initialed from Alpha to Omega after his name, and a contempt for his national gods proportioned to the honours received in his education in physical sciences; truly he has but to read in the light of the latter, and with an eye to the correlation of [[Vol.\n\n1, Page]] 523 SUGGESTIVE ALLEGORIES.\n\nphysical Forces, certain passages in his Puranas, if he would learn how much more his ancestors knew than he will ever know -- unless he becomes an occultist.\n\nLet him turn to the allegory of Pururavas and the celestial Gandharva , * who furnished the former with a vessel full of heavenly fire.\n\nThe primeval mode of obtaining fire by friction has its scientific explanation in the Vedas, and is pregnant with meaning for him who reads between the lines.\n\nThe Tretagni (sacred triad of fires) obtained by the attrition of sticks made of the wood of the Aswattha tree (the Bo-tree, of Wisdom and Knowledge) -- sticks \"as many finger-breaths long as there are syllables in the gayatri\" must have a secret meaning, or else the writers of the Vedas and Puranas were no sacred writers but mystificators.\n\nThat it has such a meaning, the Hindu Occultists are a proof, and they alone are able to enlighten Science, as to why and how, \"the fire, that was primevally one , was made threefold ( treta ) in our present Manvantara, by the Son of Ila (Vach), the primeval woman after the Deluge, the wife and daughter of Vaivasvata Manu.\n\nThe allegory is suggestive, in whatever Purana it may be read and studied.\n\n[[Footnote(s)]] ------------------------------------------------- * The Gandharva of the Veda is the deity who knows and reveals the secrets of heaven and divine truths to mortals.\n\nCosmically -- the Gandharvas are the aggregate powers of the solar-fire, and constitute its Forces; psychically -- the intelligence residing in the Sushumna , Solar ray, the highest of the seven rays; mystically -- the occult force in the Soma (the moon, or lunar plant) and the drink made of it; physically -- the phenomenal, and spiritually -- the noumenal causes of Sound and the \"Voice of Nature.\" Hence, they are called the 6,333 \"heavenly Singers\" and musicians of Indra's loka who personify (even in number) the various and manifold sounds in Nature, both above and below.\n\nIn the latter allegories they are said to have mystic power over women, and to be fond of them.\n\nThe esoteric meaning is plain.\n\nThey are one of the forms, if not the prototypes, of Enoch's angels, the Sons of God, who saw that the daughters of men were fair (Gen.\n\nvi.) who married them, and taught the daughters of the Earth the secrets of Heaven.\n\n-------------- [[This page continued in next section]]"


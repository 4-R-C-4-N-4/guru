body = "The Holy is the seventh of all,\" etc.\n\n(p.\n\n415).\n\nThis, besides showing a strange identity with the cosmogony of the Puranas ( e.g ., Vishnu Purana 1st Book), corroborates with regard to number seven, all our teachings as briefly given in \"Esoteric Buddhism.\" The Hindus have an endless series of allegories to express this idea.\n\nIn the primordial Chaos, before it became developed into the Seven Oceans (Sapta Samudra) -- emblematical of the seven gunas (conditioned qualities) composed of trigunas (Satwa, Rajas and Tamas, see Puranas) -- lie latent both Amrita (immortality) and Visha (poison, death, evil).\n\nThis allegory is found in the \"Churning of the Ocean\" by the gods.\n\nAmrita is beyond any guna, for it is UNCONDITIONED per se; yet when fallen into the phenomenal creation it got mixed up with E VIL, Chaos , with latent theos in it, and before Kosmos was evolved.\n\nHence, one finds Vishnu -- standing here for eternal Law -- periodically calling forth Kosmos into activity -- \"churning out of the primitive Ocean (boundless Chaos) the Amrita of Eternity, reserved only for the gods and devas; and he has to employ in the task Nagas and Asuras -- demons in exoteric Hinduism.\n\nThe whole allegory is highly philosophical, and we find it repeated in every philosophical System.\n\nPlato, having fully embraced the ideas of Pythagoras -- who had brought them from India -- compiled and published them in a form more intelligible than the mysterious numerals of the Greek Sage.\n\nThus the Kosmos is \"the Son\" with Plato, having for his father and mother the Divine Thought and Matter.* \"The Egyptians,\" says Dunlap,** \"distinguish between an older and younger Horus; the former the brother of Osiris, the latter the son of Osiris and Isis.\" The first is the Idea of the world remaining in the Demiurgic Mind, \"born in darkness before the creation of the world.\" The second Horus is this \"Idea\" going forth from the Logos , becoming clothed with matter, and assuming an actual existence.*** \"The Mundane God, eternal, boundless, young and old, of winding form,\"**** say the Chaldean oracles.\n\nThis \"winding form\" is a figure to express the vibratory motion of the Astral Light, with which the ancient priests were perfectly well acquainted, though its name was invented by the Martinists.\n\nNow Cosmolatry has the finger of scorn pointed at its superstitions by modern Science, which ought, however, as advised by a French [[Footnote(s)]] ------------------------------------------------- * Plutarch, \"Isis and Osiris,\" I., vi.\n\n** \"Spirit History of Man,\" p.\n\n88.\n\n*** Mover's \"Phoinizer,\" 268.\n\n**** Cory, \"Fragments,\" 240.\n\n[[Vol.\n\n1, Page]] 349 THE MANY ARE ONE.\n\nsavant, before laughing at it \"to remodel entirely its own system of cosmo-pneumatological education.\" Satis eloquentiae , sapientiae parvum.\n\nCosmolatry like Pantheism may be made to yield in its ultimate expression the words applied to Vishnu .\n\n.\n\n.\n\n.\n\n\"He is only the ideal Cause of the Potencies to be created in the work of creation; and from him proceed the potencies to be created, after they have become the real cause.\n\nSave that one ideal cause , there is no other to which the world can be referred.\n\n.\n\n.\n\n.\n\nThrough the potency of that cause , every created thing comes by its proper nature.\" ( Original Sanskrit Texts , Part iv.\n\n, pp.\n\n32, 33.) -------------- [[This page continued in next section]]"


body = "It is easy to trace the legend in Berosus, who says that Thalatth (the Omoroca, or Lady of Urka) was the beginning of creation.\n\nShe was also Melita, the queen of the Moon.\n\n.\n\n.\n\n.\n\nThe two twin births of Genesis, that of Cain and Abel, and of Esau and Jacob, shadow the same idea.\n\nThe name 'Hebel' is the same as Eve, and its characteristic seems to be feminine,\" continues the author.\n\n\"Unto thee shall be his desire,\" said the Lord God to Cain, \"and thou shalt rule over him.\" The same language had been uttered to Eve: \"Thy desire shall be to thy husband, and he shall rule over thee.\" .\n\n.\n\n.\n\nThus the pristine bi-sexual unity of the human Third Root-Race is an axiom in the Secret Doctrine.\n\nIts virgin individuals were raised to \"Gods,\" because that Race represented their \"divine Dynasty.\" The moderns are satisfied with worshipping the male heroes of the Fourth Race, who created gods after their own sexual image, whereas the gods of primeval mankind were \"male and female.\" As stated in Book I, the humanities developed coordinately, and on parallel lines with the four Elements, every new Race being physiologically adapted to meet the additional element.\n\nOur Fifth Race is rapidly approaching the Fifth Element -- call it interstellar ether, if you will -- which has more to do, however, with psychology than with physics.\n\nWe men have learned to live in every climate, whether frigid or tropical, but the first two Races had nought to do with climate, nor were they subservient to any temperature or change therein.\n\nAnd thus, we are taught, men lived down to the close of the Third Root-Race, when eternal spring reigned over the whole globe, such as is now enjoyed by the inhabitants of Jupiter; a \"world,\" says M.\n\nFlammarion, \"which is not subject like our own to the vicissitudes of seasons nor to abrupt alternations of temperature, but which is enriched with all the treasures of eternal spring.\" ( \"Pluralite des Mondes, \" p.\n\n69.) Those astronomers who maintain that Jupiter is in a molten condition, in our sense of the term, are invited to settle their dispute with this learned French [[Vol.\n\n2, Page]] 136 THE SECRET DOCTRINE.\n\nAstronomer.* It must, however, be always borne in mind that the \"eternal spring\" referred to is only a condition cognised as such by the Jovians.\n\nIt is not \"spring\" as we know it.\n\nIn this reservation is to be found the reconciliation between the two theories here cited.\n\nBoth embrace partial truths.\n\nIt is thus a universal tradition that mankind has evolved gradually into its present shape from an almost transparent condition of texture, and neither by miracle nor by sexual intercourse.\n\nMoreover, this is in full accord with the ancient philosophies; from those of Egypt and India with their Divine Dynasties down to that of Plato.\n\nAnd all these universal beliefs must be classed with the \"presentiments\" and \"obstinate conceptions,\" some of them ineradicable, in popular faiths.\n\nSuch beliefs, as remarked by Louis Figuier, are \"frequently the outcome of the wisdom and observation of an infinite number of generations of men.\" For, \" a tradition which has an uniform and universal existence, [[Footnote(s)]] ------------------------------------------------- * An hypothesis evolved in 1881 by Mr.\n\nMattieu Williams seems to have impressed Astronomers but little.\n\nSays the author of \" The Fuel of the Sun ,\" in Knowledge, Dec.\n\n23, 1881: \"Applying now the researches of Dr.\n\nAndrews to the conditions of Solar existence .\n\n.\n\n.\n\nI conclude that the Sun has no nucleus, either solid, liquid, or gaseous, but is composed of dissociated matter in the critical state, surrounded, first, by a flaming envelope, due to the recombination of the dissociated matter, and outside of this, by another envelope of vapours due to this combination.\" This is a novel theory to be added to other hypotheses, all scientific and orthodox.\n\nThe meaning of the \" critical state\" is explained by Mr.\n\nM.\n\nWilliams in the same journal (Dec.\n\n9, 1881), in an article on \"Solids, Liquids, and Gases.\" Speaking of an experiment by Dr.\n\nAndrews on carbonic acid, the scientist says that \"when 88 [[degrees]] is reached, the boundary between liquid and gas vanished; liquid and gas have blended into one mysterious intermediate fluid; an indefinite fluctuating something is there filling the whole of the tube -- an etherealised liquid or a visible gas.\n\nHold a red-hot poker between your eye and the light; you will see an upflowing wave of movement of what appears like liquid air.\n\nThe appearance of the hybrid fluid in the tube resembles this, but is sensibly denser, and evidently stands between the liquid and gaseous states of matter, as pitch or treacle stands between solid and liquid.\" The temperature at which this occurs has been named by Dr.\n\nAndrews the \" critical temperature \"; here the gaseous and the liquid states are \" continuous, \" and it is probable that all other substances capable of existing in both states have their own particular critical temperatures.\n\nSpeculating further upon this \"critical\" state, Mr.\n\nMattieu Williams emits some quite occult theories about Jupiter and other planets.\n\nHe says: \" Our notions of solids, liquids, and gases are derived from our experiences of the state of matter here upon this Earth.\n\nCould we be removed to another planet, they would be curiously changed.\n\nOn Mercury water would rank as one of the condensible gases; on Mars, as a fusible solid; but what on Jupiter?\" \"Recent observations justify us in regarding this as a miniature sun, with an external envelope of cloudy matter, apparently of partially-condensed water, but red-hot, or probably still hotter within.\n\nHis vaporous atmosphere is evidently of enormous depth, and the force of gravitation being on his visible outer surface two-and-a-half [[Footnote continued on next page]] [[Vol.\n\n2, Page]] 137 EGYPTIAN BELIEF.\n\nhas all the weight of scientific testimony.\n\n\" * And there is more than one such tradition in the Puranic allegories, as has been shown.\n\nMoreover, the doctrine that the first Race of mankind was formed out of the chhayas (astral images) of the Pitris, is fully corroborated in the Zohar.\n\n\"In the Tzalam (shadow image) of Elohim (the Pitris), was made Adam (man).\n\n(Cremona, Ed.\n\niii., 76 a ; Brody, Ed.\n\niii., 159 a ; \"Qabbalah,\" Isaac Myer, p.\n\n420.) It has been repeatedly urged as an objection that, however high the degree of metaphysical thought in ancient India, yet the old Egyptians had nothing but crass idolatry and zoolatry to boast of; Hermes, as alleged, being the work of mystic Greeks who lived in Egypt."


body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n2 [[Vol.\n\n2, Page]] 452 THE SECRET DOCTRINE.\n\n§ XVI.\n\nADAM-ADAMI.\n\nN AMES such as Adam-Adami, used by Mr.\n\nChwolsohn in his \"Nabathean Agriculture\"* and derided by M.\n\nRenan, may prove little to the profane.\n\nTo the Occultist, however, once that the term is found in a work of such immense antiquity as the above cited, it proves a good deal: for instance that Adami was a manifold symbol, originating with the Aryan people, as the root word shows, and having been taken from them by the Semites and the Turanians -- as many other things were.\n\n\"Adam-Adami\" is a generic compound name as old as languages are.\n\nThe Secret Doctrine teaches that Ad -i was the name given to the first speaking race of mankind -- in this Round -- by the Aryans.\n\nHence the Adonim and Adonai (the ancient plural form of the word Adon ) , which the Jews applied to their Jehovah and angels, who were simply the first spiritual and ethereal sons of the earth; and the god Adonis, who in his many variations stood for the \"First Lord.\" Adam is the Sanskrit Ada-Nath, also meaning first Lord, as Ad -Iswara, or any Ad (the first) followed by any adjective or substantive.\n\nThe reason for this is that such truths were a common inheritance.\n\nIt was a revelation received by the first mankind before that time which, in Biblical phraseology, is called \"the period of one lip and word,\" or speech; knowledge expanded by man's own intuition later on, but still later hidden from profanation under an adequate symbology.\n\nThe author of the \"Qabbalah, (according to), the philosophical writings of Ibn Gebirol,\" shows the Israelite using \" Ad onai,\" (Lord) instead of Eh ' yeh ( I am ) and YHVH , and adds that, while Ad onai is rendered \"Lord\" in the Bible, \"the lowest designation, or the Deity in Nature, the more general term Elohim, is translated God.\" (p.\n\n175.) A curious work was translated in 1860 or thereabout, by the Orientalist Chwolsohn, and presented to ever-incredulous and flippant Europe under the innocent title of Nabathean Agriculture.\n\nIn the opinion of the translator that archaic volume is \" a complete initiation into the mysteries of the pre-Adamite nations, on the authority of undeniably authentic documents.\n\n\" It is \"an invaluable compendium, the full epitome of the Doctrines held, of the arts and sciences, not only of the Chaldeans, but also of the Assyrians and Canaanites of the prehistoric ages.\" These [[Footnote(s)]] ------------------------------------------------- * Vide infra.\n\n[[Vol.\n\n2, Page]] 453 \"NABATHEAN AGRICULTURE.\" \" Nabatheans \" -- as some critics thought -- were simply the Sabeans, or Chaldean star-worshippers.\n\nThe work is a retranslation from the Arabic, into which language it was at first translated from the Chaldean.\n\nMasoudi, the Arabic Historian, speaks of those Nabatheans, and explains their origin in this wise: \"After the Deluge (?) the nations established themselves in various countries.\n\nAmong these were the Nabatheans, who founded the city of Babylon, and were those descendants of Ham who settled in the same province under the leadership of Nimrod, the son of Cush, who was the son of Ham, and great-grandson of Noah.\n\n.\n\n.\n\n.\n\n.\n\nThis took place at the time when Nimrod received the governorship of Babylonia as the delegate of Dzahhak named Biurasp.\" The translator, Chwolsohn, finds that the assertions of this historian are in perfect accord with those of Moses in Genesis; while more irreverent critics might express the opinion that for this very reason their truth should be suspected.\n\nIt is useless to argue this point, which is of no value in the present question.\n\nThe weather-beaten, long-since-buried problem, and the difficulty of accounting, on any logical ground, for the phenomenal derivation of millions of people of various races, of many civilized nations and tribes, from three couples (Noah's sons) in 346 years* after the Deluge, may be left to the Karma of the author of Genesis, whether he is called Moses or Ezra.\n\nThat which is interesting in the work noticed is its contents, the doctrines enunciated in it, which are again, if read esoterically, almost all of them identical with the Secret Teachings.\n\nQuatremere suggested that this book might have been simply a copy made under Nebuchadnezzar II ., from some Hamitic treatise, \"infinitely more ancient,\" while the author maintains, on \"internal and external evidence,\" that its Chaldean original was written out from the oral discourses and teachings of a wealthy Babylonian landowner, named Qu-tamy, who had used for those lectures still more ancient materials.\n\nThe first Arabic translation is placed by Chwolsohn so far back as the XIII .\n\ncent.\n\nB .\n\nC .\n\nOn the first page of this \"revelation,\" the author, or amanuensis, Qu-tamy, declares that \"the doctrines propounded therein, were originally told by Saturn to the Moon, who communicated them to her idol, which idol revealed them to her devotee, the writer -- the adept Scribe of that work -- Qu-tamy.\n\nThe details given by the God for the benefit and instruction of mortals, show periods of incalculable duration and a series of numberless kingdoms and Dynasties that preceded the appearance on Earth of [[Footnote(s)]] ------------------------------------------------- * See Genesis and the authorised Chronology.\n\nIn Chapt.\n\nix.\n\n\"Noah leaveth the Ark\" \" B .\n\nC .\n\n2348.\" Chapter x.\n\n\"Nimrod the first Monarch,\" stands over \" B .\n\nC .\n\n1998.\" [[Vol.\n\n2, Page]] 454 THE SECRET DOCTRINE.\n\nAdami (the \"red-earth\").\n\nThese periods have aroused, as might have been expected, the defenders of the chronology of the Biblical dead-letter meaning almost to fury.\n\nDe Rougemont was the first to make a levee -in-arms against the translator.\n\nHe reproaches him* with \" sacrificing Moses to an anonymous author.\" Berosus, he urges, \"however great were his chronological errors, was at least in perfect accord with the prophet with regard to the first men, since he speaks of Alorus-Adam, of Xisuthrus-Noah, and of Belus-Nimrod, \" etc."


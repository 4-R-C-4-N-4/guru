[content]
body = "The Kabiri, who are the Titans, are also called Manes and their mother Mania, according to Arnobius.\n\n( Adversum Gentes, lib.\n\nIII., p.\n\n124.) The Hindus can therefore claim with far more reason that the Manes mean their Manus, and that Mania is the female Manu.\n\n(See Ramayana .) Mania is Ila or Ida, the wife and daughter of Vaivasvata Manu, from whom \"he begat the race of Manus.\" Like Rhea, the mother of the Titans, she is the Earth (Sayana making her the goddess of the Earth), and she is but the second edition and repetition of Vach.\n\nBoth Ida and Vach are turned into males and females; Ida becoming Sudyumna, and Vach, \"the female Viraj,\" turning into a woman in order to punish the Gandharvas; one version referring to cosmic and divine theogony, the other to the later period.\n\nThe Manes and Mania of Arnobius are names of Indian origin, appropriated by the Greeks and Latins and disfigured by them.\n\nThus it is no accident, but the result of one archaic doctrine common to all, of which the Israelites, through Ezra, the author of the modernised Mosaic books, were the latest adapters.\n\nSo unceremonious were they with other people's property, that Berosus ( Antiquitates Libyae, I, fol.\n\n8), shows that Titea -- of whom Diodorus makes the mother of the Titans or Diluvians ( See Bibl.\n\nlib.\n\nIII.\n\np.\n\n170) -- was the wife of Noah.\n\nFor this Faber calls him the \" pseudo-Berosus, \" yet accepts the information in order to register one proof more that the pagans have borrowed all their gods from the Jews, by transforming patriarchal material.\n\nAccording to our humble opinion, this is one of the best proofs possible of exactly the reverse.\n\nIt shows as clearly as facts can show, that it is the Biblical pseudo -personages which are all borrowed from pagan myths, if myths they must be.\n\nIt shows, at any rate, that Berosus was well aware of the source of Genesis, and that it bore the same cosmic astronomical character as the allegories of Isis-Osiris, and the Ark, and other older \"Arkite\" symbols.\n\nFor, Berosus says that \"Titea magna\" was afterwards called Aretia,* and worshipped with the Earth; and this [[Footnote(s)]] ------------------------------------------------- *Aretia is the female form of Artes (Egyptian Mars).\n\nThence the Chaldean (and now Hebrew) word ( Aretz ) \"Earth.\" The author of \"Beitrage zur Kenntniss\" (Art.\n\nunder \"Artes\" Mars ) quotes: \"Addit Cedrenus ( Salem I.\n\n, 3): Stella Martis ab [[Footnote continued on next page]] [[Vol.\n\n2, Page]] 144 THE SECRET DOCTRINE.\n\nidentifies \"Titea,\" Noah's consort, with Rhea, the mother of the Titans, and with Ida - - both being goddesses who preside over the Earth, and the mothers of the Manus and Manes (or Tit-an-Kabiri).\n\nAnd \"Titea-Aretia\" was worshipped as Horchia, says the same Berosus, and this is a title of Vesta, goddess of the Earth.\n\n\" Sicanus deificavit Aretiam, et nominavit eam lingua Janigena Horchiam.\n\n\" ( Ibid.\n\nlib.\n\nV.\n\nfol.\n\n64.) Scarce an ancient poet of historic or prehistoric days who failed to mention the sinking of the two continents -- often called isles -- in one form or another.\n\nHence the destruction, besides Atlantis, of the Phlegyae.\n\n(See Pausanias and Nonus, who both tell how: \"From its deep-rooted base the Phlegyan isle Stern Neptune shook, and plunged beneath the waves Its impious inhabitants.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\" -- Dionysius lib xviii.\n\np.\n\n319).\n\nFaber felt convinced that the \"insulae Phlegyae\" were Atlantis.\n\nBut all such allegories are more or less distorted echoes of the Hindu tradition about that great Cataclysm, which befell the Fourth, really human, though gigantic, Race, the one which preceded the Aryan.\n\nYet, as just said, like all other legends, that of \"the Deluge has more than one meaning.\n\nIt refers in Theogony, to pre-cosmic transformations, to spiritual correlations -- however absurd the term may sound to a scientific ear -- and also to subsequent Cosmogony; to the great FLOOD of WATERS (matter) in CHAOS, awakened and fructified by those Spirit-Rays which were swamped by, and perished in, the mysterious differentiation -- a pre-cosmic mystery, the Prologue to the drama of Being.\n\nAnu, Bel, and Noah preceded Adam Kadmon, Adam the Red, and Noah; just as Brahma, Vishnu, and Siva preceded Vaivasvata and the rest.\" (See \" Isis Unveiled., \" Vol .\n\nII., pp.\n\n420 et seq., where one or two of the seven meanings are hinted at.) All this goes to show that the semi -universal deluge known to geology (first glacial period) must have occurred just at the time allotted to it by the Secret Doctrine: namely, 200,000 years (in round numbers) after the commencement of our FIFTH RACE, or about the time assigned by Messrs.\n\nCroll and Stockwell for the first glacial period: i.e.\n\n, about 850,000 years ago.\n\nThus, as the latter disturbance is attributed by geologists and astronomers to \"an extreme eccentricity of the Earth's [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] Egyptiis vocatur Ertosi (plantare, generare).\n\nSignificat autem hoc omnis generis procreationem et vivificationem, omnisque substantiae et materiae naturam et vim ordinantem atque procreantem.\n\n\" It is Earth as \"source of being\"; or, as explained by the author of \"The Source of Measures,\" Arts is the same in Hebrew and Egyptian, and both combine the primeval idea of Earth as source; precisely as in the Hebrew itself, under another form, Adam and Madim, (Mars) are the same, and combine the idea of Earth with Adam under the form of H-Adam-H.\n\n[[Vol.\n\n2, Page]] 145 THE JEWISH NOAH AND THE CHALDEAN NUAH."


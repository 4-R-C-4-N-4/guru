[content]
body = "\"Does it not shine on the head of the great Serpent of Vishnu, on the thousand headed Sesha-Ananta, in the depths of Patala, the Hindu Naraka or Hell\"?\n\nIt does: but what is Ananta?\n\nAs Sesha, it is the almost endless Manvantaric cycle of time, and becomes infinite Time itself, when called Ananta, the great seven-headed Serpent, on which rests Vishnu, the eternal Deity, during Pralayic inactivity.\n\nWhat has Satan to do with this highly metaphysical symbol?\n\nThe Svastica is the most philosophically scientific of all symbols, as also the most comprehensible.\n\nIt is the summary in a few lines of the whole work of creation, or evolution, as one should rather say, from Cosmo-theogony down to Anthro- [[Vol.\n\n2, Page]] 99 THE HAMMER OF THOR.\n\npogony, from the indivisible unknown Parabrahm to the humble moneron of materialistic science, whose genesis is as unknown to that science as is that of the All-Deity itself.\n\nThe Svastica is found heading the religious symbols of every old nation.\n\nIt is the \"Worker's Hammer\" in the Chaldean Book of Numbers, the \"Hammer\" just referred to in the \" Book of Concealed Mystery \" ( Ch.\n\nI., §§ 1 , 2, 3, 4, etc.), \"which striketh sparks from the flint\" (Space), those sparks becoming worlds.\n\nIt is \"Thor's Hammer,\" the magic weapon forged by the dwarfs against the Giants, or the pre-cosmic Titanic forces of Nature, which rebel and, while alive in the region of matter, will not be subdued by the Gods, the Agents of Universal Harmony, but have first to be destroyed.\n\nThis is why the world is formed out of the relics of the murdered Ymir.\n\nThe Svastica is the Miolnir, the \"storm-hammer\"; and therefore it is said that when the Ases, the holy gods, after having been purified by fire (the fire of passions and suffering in their life-incarnations), become fit to dwell in Ida in eternal peace, then Miolnir will become useless.\n\nThis will be when the bonds of Hel (the goddess-queen of the region of the Dead) will bind them no longer, for the kingdom of evil will have passed away.\n\n\"Surtur's flames had not destroyed them, nor yet had the raging waters\" of the several deluges.\n\n.\n\n.\n\n.\n\n.\n\n\"Then came the sons of Thor.\n\nThey brought Miolnir with them, no longer as a weapon of war, but as the hammer with which to consecrate the new heaven and the new Earth.\n\n.\n\n.\n\n.\n\n.\n\n\"* Verily many are its meanings!\n\nIn the Macrocosmic work, the \" H AMMER OF C REATION,\" with its four arms bent at right angles, refers to the continual motion and revolution of the invisible Kosmos of Forces.\n\nIn that of the manifested Kosmos and our Earth, it points to the rotation in the cycles of Time of the world's axes and their equatorial belts; the two lines forming the Svastica meaning Spirit and Matter, the four hooks suggesting the motion in the revolving cycles.\n\nApplied to the Microcosm, Man, it shows him to be a link between heaven and Earth: the right hand being raised at the end of a horizontal arm, the left pointing to the Earth.\n\nIn the Smaragdine Tablet of Hermes, the uplifted right hand is inscribed with the word \" Solve, \" the left with the word \" Coagula.\n\n\" It is at one and the same time an Alchemical, Cosmogonical, Anthropological, and Magical sign, with seven keys to its inner meaning.\n\nIt is not too much to say that the compound symbolism of this universal and most suggestive of signs contains the key to the seven great mysteries of Kosmos.\n\nBorn in the mystical conceptions of the early Aryans, and by them placed at the very threshold of eternity, on the head of the serpent Ananta, it found [[Footnote(s)]] ------------------------------------------------- * See \" Asgard and the Gods \": \"The renewal of the World.\n\n\" [[Vol.\n\n2, Page]] 100 THE SECRET DOCTRINE.\n\nits spiritual death in the scholastic interpretations of mediaeval Anthropomorphists.\n\nIt is the Alpha and the Omega of universal creative Force, evolving from pure Spirit and ending in gross Matter.\n\nIt is also the key to the cycle of Science, divine and human; and he who comprehends its full meaning is for ever liberated from the toils of Mahamaya, the great Illusion and Deceiver.\n\nThe light that shines from under the divine hammer, now degraded into the mallet or gavel of the Grand Masters of Masonic Lodges, is sufficient to dissipate the darkness of any human schemes or fictions.\n\nHow prophetic are the songs of the three Norse Goddesses, to whom the ravens of Odin whisper of the past and the future, as they flutter around in their abode of crystal beneath the flowing river.\n\nThe songs are all written down in the \" Scrolls of Wisdom,\" of which many are lost but some still remain: and they repeat in poetical allegory the teachings of the archaic ages.\n\nTo summarise from Dr.\n\nWagner's \"Asgard and the Gods,\" the \"renewal of the world,\" which is a prophecy about the seventh Race of our Round told in the past tense.\n\nThe Miolnir had done its duty in this Round, and: -- \".\n\n.\n\n.\n\n.\n\non the field of Ida, the field of resurrection (for the Fifth Round), the sons of the highest gods assembled, and in them their fathers rose again (the Egos of all their past incarnations).\n\nThey talked of the Past and the Present, and remembered the wisdom and prophecies of their ancestor which had all been fulfilled.\n\nNear them, but unseen of them, was the strong, the mighty One, who rules all things.\n\n.\n\n.\n\n.\n\nand ordains the eternal laws that govern the world.\n\nThey all knew he was there, they felt his presence and his power, but were ignorant of his name.\n\nAt his command the new Earth rose out of the Waters of Space.\n\nTo the South above the Field of Ida, he made another heaven called Audlang, and further off, a third, Widblain.\n\nOver Gimil's cave, a wondrous palace was erected, covered with gold and shining bright in the sun.\" These are the three gradually ascending planets of our \"Chain.\" There the Gods were enthroned, as they used to be .\n\n.\n\n.\n\n.\n\nFrom Gimil's heights (the seventh planet or globe, the highest and the purest), they looked down upon the happy descendants of LIF and LIFTHRASIR (the coming Adam and Eve of purified humanity ) , and signed to them to CLIMB up higher, to rise in knowledge and wisdom, step by step, from one \"heaven to another,\" until they were at last fit to be united to the Gods in the house of All-Father (p.\n\n305)."


body = "The question will be fully dealt with in the second part of this Book; meanwhile a few facts may be given here.\n\nSays the author of the \" Sacred Mysteries among the Mayas and Quiches, 11,500 years ago \" *** *:-- [[Footnote(s)]] ------------------------------------------------- *\" Beyond\" the Great Range, means, in our case, India, as being the Trans-Himalayan region for the Cis-Himalayan region.\n\n** The term Pitris is used by us in these Slokas to facilitate their comprehension, but it is not so used in the original Stanzas, where they have distinct appellations of their own, besides being called \"Fathers\" and \"Progenitors.\" *** It is erroneous to take literally the worship of the human Bodhisattvas, or Manjusri.\n\nIt is true that, exoterically, the Mahayana school teaches adoration of these without distinction, and that Huien-Tsang speaks of some disciples of Buddha as being worshipped.\n\nBut esoterically it is not the disciple or the learned Manjusri personally that received honours, but the divine Bodhisattvas and Dhyani Buddhas that animated ( Amilakha , as the Mongolians say) the human forms.\n\n**** The author of this work is Augustus Le Plongeon.\n\nHe and his wife are well known in the United States for their untiring labours in Central America.\n\nIt is they who discovered the sepulchre of the royal Kan Coh, at Cichen-Itza.\n\nThe author [[Footnote continued on next page]] [[Vol.\n\n2, Page]] 35 THE \"SEVEN\" MYSTERY.\n\n\"Seven seems to have been the sacred number par excellence among all civilised nations of antiquity.\n\nWhy?\n\nEach separate people has given a different explanation, according to the peculiar tenets of their ( exoteric ) religion.\n\nThat it was the number of numbers for those initiated into the sacred mysteries, there can be no doubt.\n\nPythagoras .\n\n.\n\n.\n\ncalls it the 'Vehicle of Life' containing body and soul, since it is formed of a Quaternary, that is Wisdom and intellect, and of a Trinity or action and matter.\n\nThe Emperor Julian, ' In matrem, etc.,' expresses himself thus: 'Were I to touch upon the initiation into our Sacred Mysteries, which the Chaldees Bacchized, respecting the seven-rayed god, lighting up the soul through him, I should say things unknown to the rabble, very unknown, but well known to the blessed Theurgists.' \" (p.\n\n141).\n\nAnd who, acquainted with the Puranas, the Book of the Dead, the Zendavesta, the Assyrian tiles, and finally the Bible, and who has observed the constant occurrence of the number seven, in these records of people living from the remotest times unconnected and so far apart, can regard as a coincidence the following fact, given by the same explorer of ancient Mysteries?\n\nSpeaking of the prevalence of seven as a mystic number, among the inhabitants of the \"Western continent\" (of America), he adds that it is not less remarkable.\n\nFor: -- \"It frequently occurs in the Popul-vuh .\n\n.\n\n.\n\nwe find it besides in the seven families said by Sahagun and Clavigero to have accompanied the mystical personage named Votan, the reputed founder of the great city of Nachan, identified by some with Palenque.\n\nIn the seven caves* from which the ancestors of the Nahuatl are reported to have emerged.\n\nIn the seven cities of Cibola, described by Coronado and Niza.\n\n.\n\n.\n\n.\n\nIn the seven Antilles; in the seven heroes who, we are told, escaped the Deluge .\n\n.\n\n.\n\n.\" \"Heroes,\" moreover, whose number is found the same in every \"Deluge\" story -- from the seven Rishis who were saved with Vaivasvata Manu, down to Noah's ark, into which beasts, fowls, and living creatures were taken by \"Sevens.\" Thus we see the figures 1, 3, 5, 7, as perfect, because thoroughly mystic, numbers playing a prominent part in every Cosmogony and evolution of living Beings.\n\nIn China, 1, 3, 5, 7, are called \"celestial numbers\" in the canonical \" Book of Changes.\n\n\" ( Yi King , or transformation, as in \"Evolution\").\n\nThe explanation of it becomes evident when one examines the ancient [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] seems to believe and to seek to prove that the esoteric learning of the Aryans and the Egyptians was derived from the Mayas.\n\nBut, although certainly coeval with Plato's Atlantis, the Mayas belonged to the Fifth Continent, which was preceded by Atlantis and Lemuria.\n\n* These seven caves, seven cities, etc., etc., stand in every case for the seven centres, or zones, upon which the seven primitive groups of the first Root-race were born.\n\n[[Vol.\n\n2, Page]] 36 THE SECRET DOCTRINE.\n\nSymbols: all these are based upon and start from the figures given from the Archaic Manuscript in the proem of Book I.\n\n, the symbol of evolution and fall into generation or matter, is reflected in the old Mexican sculptures or paintings, as it is in the Kabalistic Sephiroth, and the Egyptian Tau.\n\nExamine the Mexican MSS ( Add.\n\nMSS.\n\nBrit.\n\nMus.\n\n9789)*; you will find in it a tree whose trunk is covered with ten fruits ready to be plucked by a male and female, one on each side of it, while from the top of the trunk two branches shoot horizontally to the right and left, thus forming a perfect (tau), the ends of the two branches, moreover, each bearing a triple bunch, with a bird -- the bird of immortality, Atman or the divine Spirit -- sitting between the two, and thus making the seventh.\n\nThis represents the same idea as the Sephirothal Tree, ten in all, yet, when separated from its upper triad, leaving Seven .\n\nThese are the celestial fruits, the ten or 10, born out of the two invisible male and female seeds, making up the 12, or the Dodecahedron of the Universe.\n\nThe mystic system contains the , the central point; the 3 or ; the five, , and the seven or , or again ; the triangle in the square and the synthesizing point in the interlaced double triangles.\n\nThis for the world of the archetypes.\n\nThe phenomenal world receives its culmination and the reflex of all in M AN.\n\nTherefore he is the mystic square -- in his metaphysical aspect -- the Tetraktis; and becomes the Cube on the creative plain.\n\nHis symbol is the cube unfolded** and 6 becoming 7, or the three crossways (the female) and four vertically; and this is man, the culmination of the deity on Earth, whose body is the cross of flesh, on, through, and in which he is ever crucifying and putting to death the divine Logos or his H IGHER S ELF."


body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n2 [[Vol.\n\n2, Page 643]] BOOK II.\n\n-- PART III.\n\nADDENDA.\n\nSCIENCE AND THE SECRET DOCTRINE CONTRASTED.\n\n\"The knowledge of this nether world -- Say, friend, what is it, false or true?\n\nThe false, what mortal cares to know?\n\nThe true, what mortal ever knew?\" [[Vol.\n\n2, Page 644]] CONTENTS.\n\n------- §§ PAGE I.\n\nARCHAIC OR MODERN ANTHROPOLOGY?\n\n...\n\n645 ------- II.\n\nT HE A NCESTORS M ANKIND IS O FFERED BY S CIENCE ...\n\n656 Plastidular Souls, and Conscious Nerve-Cells ...\n\n670 ------- III.\n\nT HE F OSSIL R ELICS OF M AN AND THE A NTHROPOID A PE ...\n\n675 Western Evolutionism: the comparative Anatomy of Man and Ape ...\n\n680 Darwinism and the Antiquity of Man: the Anthropoids and their Ancestry ...\n\n685 ------- IV.\n\nO N THE D URATION OF G EOLOGICAL P ERIODS, R ACE C YCLES, AND THE A NTIQUITY OF M AN ...\n\n690 Modern Scientific Speculations thereon ...\n\n694 On Chains of Planets and their Plurality ...\n\n699 Esoteric Geological Chronology ...\n\n709 ------- V.\n\nO RGANIC E VOLUTION -- C REATIVE C ENTRES ...\n\n731 The Origin and Evolution of the Mammalia ...\n\n734 The European Palaeolithic Races ...\n\n738 ------- VI.\n\nG IANTS, C IVILIZATIONS, AND S UBMERGED C ONTINENTS TRACED IN H ISTORY ...\n\n742 ------- VII.\n\nS CIENTIFIC AND G EOLOGICAL P ROOFS OF THE E XISTENCE OF SEVERAL S UBMERGED C ONTINENTS ...\n\n778 [[Vol.\n\n2, Page]] 645 THE NEW MASTERS OF PROTESTANTISM.\n\nADDENDA TO BOOK II.\n\n§ I.\n\nARCHAIC, OR MODERN ANTHROPOLOGY?\n\nW HENEVER the question of the origin of man is offered seriously to an unbiassed, honest, and earnest man of science, the answer comes invariably: -- \" W E DO NOT KNOW.\" De Quatrefages, in his agnostic attitude, is one of such anthropologists.\n\nThis does not imply that the rest of the men of science are neither fair-minded nor honest, as in such case our remark would be questionably discreet.\n\nBut, it is estimated that 75 per cent.\n\nof European Scientists are Evolutionists.\n\nAre these representatives of modern thought all guilty of flagrant misrepresentation of the facts?\n\nNo one says this -- but there are a few very exceptional cases.\n\nHowever, the Scientists in their anti-clerical enthusiasm and despair of any alternative theory to Darwinism, except that of \"special creation,\" are unconsciously insincere in \"forcing\" a hypothesis the elasticity of which is inadequate, and which resents the severe strain to which it is now subjected.\n\nInsincerity on the same subject is, however, patent in ecclesiastical circles.\n\nBishop Temple has come forward as a thorough-going supporter of Darwinism in his \"Religion and Science.\" This clerical writer goes so far as to regard Matter -- after receiving its \"primal impress\" -- as the unaided evolver of all cosmic phenomena.\n\nThis view only differs from that of Haeckel, in postulating a hypothetical deity at \"the back of beyont,\" a deity which stands entirely aloof from the interplay of forces.\n\nSuch a metaphysical entity is no more the Theological God than that of Kant.\n\nBishop Temple's truce with Materialistic Science is, in our opinion, impolitic -- apart from the fact that it involves a total rejection of the Biblical cosmogony.\n\nIn the presence of this display of flunkeyism before the materialism of our \"learned\" age, we Occultists can but smile.\n\nBut how about loyalty to the Masters such theological truants profess to serve, Christ, and Christendom at large?\n\nHowever, we have no desire, for the present, to throw down the gauntlet to the clergy, our business being now with materialistic Science alone.\n\nThe latter answers to our question, in the person of its best representatives \"We do not know;\" -- yet the majority of these act as though Omniscience was their heirloom, and they knew all things.\n\nFor, indeed, this negative reply has not prevented the majority of Scientists from speculating on that question, each seeking to have his [[Vol.\n\n2, Page]] 646 THE SECRET DOCTRINE.\n\nown special theory accepted to the exclusion of all others.\n\nThus, from Maillet in 1748 down to Haeckel in 1870, theories on the origin of the human Race have differed as much as the personalities of their inventors themselves.\n\nBuffon, Bory de St.\n\nVincent, Lamarck, E.\n\nG.\n\nSt.\n\nHilaire, Gaudry, Naudin, Wallace, Darwin, Owen, Haeckel, Filippi, Vogt, Huxley, Agassiz, etc., etc., each evolved a more or less scientific hypothesis of genesis.\n\nDe Quatrefages arranges them in two principal groups -- one holding to a rapid, and the other to a very gradual transmutation ; the former, favouring a new type (man) produced by a being entirely different; the latter teaching the evolution of man by progressive differentiation.\n\nStrangely enough, it is from the most scientific of these authorities that the most unscientific of all the theories upon the subject of the origin of man has hitherto emanated.\n\nThis is so evident, that the hour is rapidly approaching when the current teaching about the descent of man from an Ape-like mammal will be regarded with less respect than the formation of Adam out of clay, and of Eve out of Adam's rib.\n\nFor -- \"It is evident, especially after the most fundamental principles of Darwinism, that an organized being cannot be a descendant of another whose development is in an inverse order to his own.\n\n.\n\n.\n\n.\n\nConsequently, in accordance with these principles man cannot be considered as the descendant of any simian type whatever.\n\n\"* Lucae's argument versus the Ape-theory, based on the different flexures of the bones constituting the axis of the skull in the cases of Man and the Anthropoids, is fairly discussed by Schmidt (\" Doctrine of Descent and Darwinism, \" p.\n\n290).\n\nHe admits that \" the ape as he grows becomes more bestial ; man .\n\n.\n\n.\n\nmore human, \" and seems, indeed, to hesitate a moment before he passes on: e.g ., \"This flexure of the cranial axis may, therefore, still be emphasized as a human character, in contradistinction to the apes; the peculiar characteristic of an order can scarcely be elicited from it; and especially as to the doctrine of descent, this circumstance seems in no way decisive.\" The writer evidently is not a little disquieted at the argument."


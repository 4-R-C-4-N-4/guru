[content]
body = "\"These three were the Prakrita creation, the (discrete) developments of indiscrete nature preceded by the indiscrete principle.\" \"Preceded by,\" ought to be replaced here with \"beginning by,\" Buddhi; for the latter is neither a discrete nor an indiscrete quantity , but partakes of the nature of both, in man as in Kosmos: a unit -- a human MONAD on the plane of illusion -- when once freed from the three forms of Ahankara and liberated from its terrestrial manas, Buddhi becomes truly a continued quantity, both in duration and extension, because eternal and immortal.\n\nEarlier it is stated, that the third Creation \"abounding with the quality of goodness, is termed Urdhvasrotas \"; and a page or two further the Urdhvasrotas creation is referred to as \"the sixth creation .\n\n.\n\n.\n\nthat of the divinities\" (p.\n\n75).\n\nThis shows plainly that earlier as well as later manvantaras have been purposely confused, to prevent the pro- [[Footnote(s)]] ------------------------------------------------- * See concerning their post-types , the Treatise written by Trithemius (Agrippa's master, 16th cent.).\n\n\"Concerning the seven secondaries, or Spiritual Intelligences, who, after God, actuate the Universe;\" giving out, besides secret cycles and several prophecies, certain facts and beliefs about the Genii, or the Elohim, which preside over and guide the septenary stages of the World's Course.\n\n** From the first, the Orientalists have found themselves beset by great difficulties with regard to any possible order in the Puranic Creations.\n\nBrahma is very often confused with Brahm, by Wilson, for which he is criticised by his successors.\n\nThe \" Original Sanscrit Texts \" are preferred by Mr.\n\nFitzedward Hall for the translation of Vishnu Purana and texts, to those used by Wilson.\n\n\"Had Professor Wilson enjoyed the advantages which are now at the command of the student of Indian philosophy, unquestionably he would have expressed himself differently,\" as said by the editor of his works.\n\nThis reminds one of the answer given by one of Thomas Taylor's admirers to those scholars who criticised his translations of Plato.\n\n\"Thomas Taylor may have had less knowledge of the Greek than his critics have, but he understood Plato far better than they do,\" he said.\n\nOur present Orientalists disfigure the mystic sense of the Sanskrit texts far more than Wilson ever did, though the latter is undeniably guilty of very gross errors.\n\n[[Vol.\n\n1, Page]] 454 THE SECRET DOCTRINE.\n\nfane from perceiving the truth.\n\nThis is called \"incongruity\" and \"contradictions\" by the Orientalists.* This \"creation\" of the immortals, the \" Deva-Sarga ,\" is the last of the first series, and has a universal reference; namely, to Evolutions in general, not specifically to our Manvantara ; but the latter begins with the same over and over again, showing that it refers to several distinct Kalpas.\n\nFor it is said \"at the close of the past ( Padma ) Kalpa the divine Brahma awoke from his night of sleep and beheld the universe void.\" Then Brahma is shown going once more over the \"seven creations\" in the secondary stage of evolution, repeating the first three on the objective plane.\n\n(IV.) The Mukhya , the Primary as it begins the series of four.\n\nNeither the word \"inanimate\" bodies nor yet immovable things, as translated by Wilson, gives a correct idea of the Sanskrit terms used.\n\nEsoteric philosophy is not the only one to reject the idea of any atom being inorganic , for it is found also in orthodox Hinduism.\n\nMoreover, Wilson himself says ( in his collected Works , vol.\n\niii.\n\n, p.\n\n381): \"All the Hindu systems consider vegetable bodies as endowed with life .\n\n.\n\n.\n\n\" Charachara , or the synonymous sthavara and jangama , is, therefore, inaccurately rendered by \"animate and inanimate,\" \"sentient beings,\" and \"unconscious,\" or \"conscious and unconscious beings,\" etc., etc.\n\n\"Locomotive and fixed\" would be better, since trees are considered to possess souls.\" Mukhya is the \"creation\" or organic evolution of the vegetable kingdom.\n\nIn this secondary Period, the three degrees of Elemental or Rudimental Kingdoms are evolved in this world, corresponding inversely in order to the three Prakritic creations during the Primary period of Brahma's activity.\n\nAs in that period, in the words of \"Vishnu Purana\": \"The first creation was that of Mahat (Intellect), the second, of Tanmatras (rudimental principles), and the third, that of the senses (Aindriyaka)\"; in this one, the order of the Elemental Forces stands thus: (1) The nascent centres of Force (intellectual and physical); (2) the rudimental principles -- nerve force , so to say; and (3) nascent apperception , which is the Mahat of the lower kingdoms, especially developed in the third order of Elementals; these are succeeded by the [[Footnote(s)]] ------------------------------------------------- * \"The three Creations beginning with Intelligence are elemental, but the six creations which proceed from the series of which Intellect is the first are the work of Brahma\" ( Vayu-Purana ).\n\nHere \"creations\" mean everywhere stages of Evolution.\n\nMahat , \"Intellect\" or mind (which corresponds with Manas, the former being on the Cosmic, and the latter on the human plane) stands here, too, lower than Buddhi or Supra-divine Intelligence.\n\nTherefore, when we read in Linga Purana that \"the first Creation was that of Mahat, Intellect being the first in manifestation,\" we must refer that (specified) creation to the first evolution of our system or even our Earth, none of the preceding ones being discussed in the Puranas , but only occasionally hinted at.\n\n[[Vol.\n\n1, Page]] 455 CREATIONS CONTINUED.\n\nobjective kingdom of minerals, in which latter that apperception is entirely latent, to re-develop only in the plants).\n\nThe mukhya \"Creation,\" then, is the middle point between the three lower and the three higher kingdoms, which represent the seven esoteric kingdoms of Kosmos, as of Earth.\n\n(V.) The Tiryaksrotas (or Tairyagyonya) creation,* that of the \"( sacred ) animals,\" corresponding only on Earth, to the dumb animal creation.\n\nThat which is meant by \"animals,\" in primary Creation, is the germ of awakening consciousness or of apperception , that which is faintly traceable in some sensitive plants on Earth and more distinctly in the protistic monera.** On our globe, during the first round, animal \"creation\" precedes that of man, while the former (or mammal) evolves from the latter in our fourth round -- on the physical plane: in Round I.\n\nthe animal atoms are drawn into a cohesion of human physical form; while in Round IV.\n\nthe reverse occurs according to magnetic conditions developed during life."


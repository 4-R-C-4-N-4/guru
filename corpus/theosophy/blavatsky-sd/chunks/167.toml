[content]
body = "In his \"Revelation,\" speaking of divine mysteries expressed by means of letters and numbers, Marcus narrates how the \"Supreme Tetrad came down unto me (him) from the region which cannot be seen nor named, in a female form , because the world would have been unable to bear her appearing under a male figure ,\" and revealed to him \"the generation of the universe, untold before to either gods or men.\" This first sentence already contains a double meaning.\n\nWhy should a female figure be more easily borne or listened to by the world than a male figure?\n\nOn the very face of it this appears nonsensical.\n\nWithal it is quite simple and clear to one who is acquainted with the mystery-language.\n\nEsoteric Philosophy , or the Secret Wisdom, was symbolized by a female form, while a male figure stood for the Unveiled mystery.\n\nHence, the world not being ready to receive, could not bear it, and the Revelation of Marcus had to be given allegorically.\n\nThen he writes: \"When first the Inconceivable, the Beingless and Sexless (the Kabalistic Ain-Soph) began to be in labour ( i.e.\n\n, when the hour of manifesting Itself had struck) and desired that Its Ineffable should be born (the first L OGOS, or AEon, or Aion), and its invisible should be clothed with form, its mouth opened and uttered the word like unto itself.\n\nThis word (logos) manifested itself in the form of the Invisible One.\n\nThe uttering of the (ineffable) name (through the word) came to pass in this manner.\n\nHe (the Supreme Logos) uttered the first word of his name, which is a syllable of four letters.\n\nThen the second syllable was added, also of four letters.\n\nThen the third, composed of ten letters; and after this the fourth, which contains twelve letters.\n\nThe whole name consists thus of thirty letters and of four syllables.\n\nEach letter has its own accent and way of writing, but neither understands nor ever beholds that form of the whole Name, -- no; not even the power of the letter that stands next to Itself (to the Beingless and the Inconceivable.)* All these sounds when united are the collective Beingless, [[Footnote(s)]] ------------------------------------------------- * Iswara, or the Logos, cannot see Parabrahmam, but only Mulaprakriti, says the lecturer, in the Four Lectures on Bhagavatgita.\n\n(See Theosophist , Feb., 1887.) [[Vol.\n\n1, Page]] 352 THE SECRET DOCTRINE.\n\nunbegotten AEon, and these are the Angels that are ever beholding the face of the Father* (the Logos, the \"second God,\" who stands next God, \"the Inconceivable,\" according to Philo).\n\nThis is as plain as ancient esoteric secrecy would make it.\n\nIt is as Kabalistic, but less veiled than the Zohar in which the mystic names or attributes are also four syllabled, twelve, forty-two, and even seventy-two syllabled words!\n\nThe Tetrad shows to Marcus the TRUTH in the shape of a naked woman, and letters every limb of that figure, calling her head [[omega]], her neck [[psi]], shoulders and hands [[gamma]], and [[chi]], etc., etc.\n\nIn this Sephira is easily recognised, the Crown ( Kether ) or head being numbered one ; the brain or Chochmah, 2; the heart, or Intelligence (Binah), 3; and the other seven Sephiroth representing the limbs of the body.\n\nThe Sephirothal Tree is the Universe, and Adam Kadmon represents it in the West as Brahma represents it in India.\n\nThroughout, the 10 Sephiroth are represented as divided into the three higher, or the spiritual Triad , and the lower Septenary.\n\nThe true Esoteric meaning of the sacred number seven is cleverly veiled in the Zohar; yet was betrayed by the double way of writing \"in the beginning\" or Be-resheeth , and Be-raishath, the latter the \"Higher, or Upper Wisdom.\" As shown by Mr.\n\nMacgregor Mathers in his Kabbalah (p.\n\n47), and in the Qabbalah of Mr.\n\nT.\n\nMyer (p.\n\n233), both of these Kabalists being supported by the best ancient authorities, these words have a dual and secret meaning.\n\nBraisheeth bara Elohim means that the six , over which stands the seventh Sephiroth, belong to the lower material class, or, as the author says: \"Seven .\n\n.\n\n.\n\n.\n\nare applied to the Lower Creation, and three to the spiritual man, the Heavenly Prototypic or first Adam.\" When the Theosophists and Occultists say that God is no B EING, for I T is nothing, No-Thing , they are more reverential and religiously respectful to the Deity than those who call God a H E, and thus make of Him a gigantic M ALE.\n\nHe who studies the Kabala will soon find the same idea in the ultimate thought of its authors, the earlier and great Hebrew Initiates, who got this secret Wisdom at Babylonia from the Chaldean Hierophants, while Moses got his in Egypt.\n\nThe Zohar cannot well be judged by its after translations in Latin and other tongues, as all those ideas were, of course, softened and made to fit in with the views and policy of its Christian arrangers; but in truth its ideas are identical with those of all other religious systems.\n\nThe various Cosmogonies show that the Archaic Universal Soul was held by every nation as the \"Mind\" of the Demiurgic Creator; and that it [[Footnote(s)]] ------------------------------------------------- * The \"Seven Angels of the Face,\" with the Christians.\n\n[[Vol.\n\n1, Page]] 353 THE EGYPTIAN VERSION.\n\nwas called the \"Mother,\" Sophia with the Gnostics (or the female Wisdom), the Sephira with the Jews, Saraswati or Vach, with the Hindus, the Holy Ghost being a female Principle.\n\nHence, born from it, the Kurios or Logos was, with the Greeks, the \"God, mind\" ( nous ) .\n\n\"Now Koros ( Kurios ) signifies the pure and unmixed nature of intellect -- wisdom,\" says Plato in \"Cratylus\"; and Kurios is Mercury, the Divine Wisdom, and \"mercury is the Sol\" (Sun) (\" Arnobius \" vi., xii.), from whom Thot-Hermes received this divine Wisdom.\n\nWhile, then, the Logoi of all countries and religions are correlative (in their sexual aspects) with the female Soul of the World or the \"Great Deep;\" the deity, from which these two in one have their being, is ever concealed and called the \"Hidden One,\" connected only indirectly with Creation,* as it can act only through the Dual Force emanating from the Eternal Essence."


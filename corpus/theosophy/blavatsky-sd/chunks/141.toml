[content]
body = ") Some fifteen years ago, the writer was the first to repeat, after the Kabalists, the wise Commandments in the Esoteric Catechism.\n\n\"Close thy mouth, lest thou shouldst speak of this (the mystery), and thy heart, lest thou shouldst think aloud; and if thy heart has escaped thee, bring it back to its place, for such is the object of our alliance.\" ( Sepher Jezireh, Book of Creation.\n\n) And again: -- \"This is a secret which gives death: close thy mouth lest thou shouldst reveal it to the vulgar; compress thy brain lest something should escape from it and fall outside.\" (Rules of Initiation.) A few years later, a corner of the Veil of Isis had to be lifted; and now another and a larger rent is made.\n\n.\n\n.\n\n.\n\nBut old and time-honoured errors -- such as become with every day more glaring and self-evident -- stand arrayed in battle-order now, as they did then.\n\nMarshalled by blind conservatism, conceit and prejudice, they are constantly on the watch, ready to strangle every truth, which, awakening from its age-long sleep, happens to knock for admission.\n\nSuch has been the case ever since man became an animal.\n\nThat this proves in every case moral death to the revealers, who bring to light any of these old, old truths, is as certain as that it gives LIFE and REGENERATION to those who are fit to profit even by the little that is now revealed to them.\n\n---------------------"


body = "Adam is spoken of in [[Footnote(s)]] ------------------------------------------------- * It is on that step that one arrives on the plane of the level or floor and open entrance to the King's chamber, the Egyptian \"Holy of Holies.\" ** The candidate for initiation always personified the god of the temple he belonged to, as the High Priest personified the god at all times; just as the Pope now personates Peter and even Jesus Christ upon entering the inner altar -- the Christian \"Holy of Holies.\" [[Vol.\n\n2, Page]] 467 THE ETYMOLOGY OF \"SACRAMENT.\" Maimonides ( More Nevochim, \"The Guide of the Perplexed\" -- truly!) in two aspects; as a man, like all others born of a man and a woman, and -- as the prophet of the Moon; the reason of which is now made apparent, and has to be explained.\n\nAdam, as the supposed great \"Progenitor of the human race,\" is, as Adam Kadmon, made in the image of God -- a priapic image, therefore.\n\nThe Hebrew words sacr and n ' cabvah are, literally translated, lingham (phallus) and yoni , notwithstanding their translation in th e Bible ( Genesis i.\n\nv .\n\n27.) \"male and female.\" As said there \"God creates ' Man in his own image' .\n\n.\n\n.\n\n.\n\n.\n\nin the image of God created he him, male and female created he them,\" the androgyne Adam-Kadmon.\n\nNow this Kabalistic name is not that of a living man, nor even of a human or divine Being, but of the two sexes or organs of procreation, called in Hebrew with that usual sincerity of language pre-eminently Biblical, sacr and n ' cabvah *; these two being, therefore , the image under which the \"Lord God\" appeared usually to his chosen people.\n\nThat this is so, is now undeniably proven by almost all the symbologists and Hebrew scholars as well as by the Kabala.\n\nTherefore Adam is in one sense Jehovah.\n\nThis makes plain another general tradition in the East mentioned in Gregorie ' s \" Notes and Observations upon several passages in Scripture \" (1684.\n\nVol.\n\n1 pp.\n\n120-21) and quoted b y Hargrave Jennings in his Phallicism: \"That Adam was commanded by God that his dead body should be kept above ground till committed t o the middle of the earth by a priest of the most High God.\" Therefor e, \"Noah daily prayed in the ark before the BODY OF A DAM,\" or before the Phallus in the ark, or Holy of Holies, again.\n\nHe who is a Kabalist and accustomed to the incessant permutation of Biblical names, once they are interpreted numerically and symbolically, will understand what is meant.\n\nJehovah, from the two words of which his name is composed, \"makes up the original idea of male-female as birth-originator, for the was the membrum virile and Houak was Eve .\" So .\n\n.\n\n.\n\n\"the perfect one, as originator of measures, takes also the form of birth origin, as hermaphrodite one; hence the phallic use of form.\" (\" Source of Measures, \" 159).\n\nBesides the same author shows and demonstrates numerically and geometrically that ( a ) Arets, earth, Adam, man, and H ' Adam are cognate with each other, and are personified in the Bible under one form, as the Egyptian and Hebrew Mars, god of the generation; and ( b ) that Jehovah, or Jah, is [[Footnote(s)]] ------------------------------------------------- *Jehovah says to Moses \"the Summation of my name is Sacr, the carrier of the germ\" -- phallus.\n\n\"It is the vehicle of the annunciation, and the sacr has passed down through ages to the sacr - factum of the Roman priest, and the sacr - fice, and sacra ment of the English speaking race.\" ( Source of Measures, p .\n\n236) Thence marriage is a sacrament in the Greek and Roman Churches.\n\n[[Vol.\n\n2, Page]] 468 THE SECRET DOCTRINE.\n\nNoah, or Jehovah is Noah in Hebrew would be , or literally in English, Inch.\n\n\" The above affords, then, a key to the said traditions.\n\nNoah, a divine permutation, the supposed saviour of Humanity, who carries in his ark or argha (the moon), the germs of all living things, worships before the \"body of Adam,\" which body is the image of, and a Creator itself.\n\nHence Adam is called the \"Prophet of the Moon,\" the Argha or \"Holy of Holies\" of the (Yodh).\n\nThis also shows the origin of the Jewish popular belief that the face of Moses is in the moon -- i.e., the spots in the Moon.\n\nFor Moses and Jehovah are once more permutations, as has been shown Kabalistically.\n\nSays the author of the \"Source of Measures\" ( p .\n\n271): \"There is one fact in regard to Moses and his works too important to be omitted.\n\nWhen he is instructed by the Lord as to his mission, the power name assumed by the Deity is, I am that I am, the Hebrew words being: -- a variety reading of .\n\nNow, Moses is , and equals 345.\n\nAdd the values of the new form of the name Jehovah, 21 + 501 + 21 = 543, or, by a reverse reading, 345; thus showing Moses to be a form of Jehovah in this combination.\n\n21 ÷ 2 = 10.5, or, reversed, 501, so that the asher or the that in I am that I am is simply a guide to a use of 21 or 7 x 3; 501 [[squared]] = 251 +, a very valuable pyramid number, etc., etc.\n\nFor a clearer explanation for the benefit of non-Kabalists we put it thus: \"I am that I am\" is in Hebrew: -- Add the numbers of these separate words and you have: -- (which relates to the process of descending in fire on the mount to make man, etc., etc.), and which is explained to be but a check and use of the numbers of the mountains; for: -- on one side we have 10 + 5 + 6 = 21, down the middle 501, and on the other side 6 + 5 + 10 = 21.\" (From the same author.) ( Vide § XXII ., \" The Symbolism of the Mystery Name IAO .\n\n\") The \"Holy of Holies,\" both Kabalistic and Rabbinical, are thus shown as an international symbol, and common property.\n\nNeither has originated with the Hebrews; but owing to the too realistic handling of the half-initiated Levites, the symbol has with them acquired a significance which it hardly has with any other people to this day, [[Vol.\n\n2, Page]] 469 THE OLD AND THE NEW JEHOVAH.\n\nand which it was originally never meant to have by the true Kabalist."


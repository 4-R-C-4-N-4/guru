[content]
body = "There is a curious work by Blanchard, on the Origin of Life, wherein he shows some strange contradictions and confusions in the theories of his colleagues, and which we recommend to the reader's attention.\n\n* Eliphas Levi shows it very truly \"a force in Nature,\" by means of which \"a single man who can master it .\n\n.\n\n.\n\nmight throw the world into confusion and transform its face\"; for it is the \"great Arcanum of transcendent Magic.\" Quoting the words of the great Western Kabalist in their translated form (see The Mysteries of Magic , by A.\n\nE.\n\nWaite), we may explain them perhaps the better by the occasional addition of a word or two to show the difference between Western and Eastern explanations of the same subject.\n\nThe Author says of the great Magic Agent -- \"This ambient and all-penetrating fluid, this ray detached from the (Central or 'Spiritual') Sun's splendour .\n\n.\n\n.\n\nfixed by the weight of the atmosphere (?!) and the power of central attraction .\n\n.\n\n.\n\nthe Astral Light, this electromagnetic ether, this vital and luminous caloric, is represented on ancient monuments by the girdle of Isis which twines round two poles and in ancient theogonies by the serpent devouring its own tail, emblem of prudence and of Saturn\" -- emblem of infinity, immortality, and Kronos -- \"Time\" -- not the god Saturn or the planet.\n\n\"It is the winged dragon of Medea, the double serpent of the caduceus, and the tempter of Genesis; but it is also the brazen snake of Moses encircling the Tau lastly, it is the devil of exoteric dogmatism, and is really the blind force (it is not blind, and Levi knew it), which souls must conquer in order to detach themselves from the chains of Earth; 'for if they should not,' they will be absorbed by the same power which first produced them and will return to the central and eternal fire.\" This great archaeus is now discovered by, and only for one man -- Mr.\n\nJ.\n\nW.\n\nKeeley, of [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 254 THE SECRET DOCTRINE.\n\nNitrogen, \"the breath of the Supporters of the Heavenly Dome,\" as the Mohammedan mystics call it; WATER, that primordial fluid which was required, according to Moses, to make a living soul with.\n\nAnd this may account for the flagrant discrepancies and unscientific statements found in Genesis.\n\nSeparate the first from the second chapter; read the former as a scripture of the Elohists, and the latter as that of the far younger Jehovists; still one finds, if one reads between the lines, the same order in which things created appear -- namely, Fire (light), Air, Water, and MAN (or the Earth).\n\nFor the sentence: \"In the beginning God created Heaven and Earth\" is a mistranslation; it is not \"Heaven and Earth,\" but the duplex or dual Heaven, the upper and the lower Heavens, or the separation of primordial substance that was light in its upper and dark in its lower portions -- or the manifested Universe -- in its duality of the invisible (to the senses) and the visible to our perceptions.\n\nGod divided the light from the Darkness (v.\n\n4); and then made the firmament, air (5), \"a firmament in the midst of the waters, and let it divide the waters from the waters,\" (6), i.e.\n\n, \"the waters which were under the firmament (our manifested visible Universe) from the waters above the firmament,\" or the (to us) invisible planes of being.\n\nIn the second chapter (the Jehovistic), plants and herbs are created before water, just as in the first, light is produced before the Sun.\n\n\"God made the Earth and the Heavens and every plant of the field before it was in the Earth and every herb of the field before it grew; for the Elohim ('gods') had not caused it to rain upon the earth, etc.\" (v.\n\n5) -- an absurdity unless the esoteric explanation is accepted.\n\nThe plants were created before they were in the earth -- for there was no earth then such as it is now; and the herb of the field was in existence before it grew as it does now in the fourth Round.\n\nDiscussing and explaining the nature of the invisible Elements and the \"primordial fire\" mentioned above, Eliphas Levi calls it invariably the \"Astral Light.\" It is the \"grand Agent Magique\" with him; undeniably it is so, but -- only so far as Black Magic is concerned, and [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] Philadelphia.\n\nFor others, however, it is discovered, yet must remain almost useless.\n\n\"So far shalt thou go.\n\n.\n\n.\n\n.\" All the above is as practical as it is correct, save one error, which we will explain in the text further on.\n\nEliphas Levi commits a great blunder in always identifying the Astral Light with what we call Akasa.\n\nWhat it really is will be given in Part II.\n\nof Vol.\n\nII.\n\n[[Vol.\n\n1, Page]] 255 BUT WHY SLANDER THE INDIAN HIEROPHANTS?\n\non the lowest planes of what we call Ether, the noumenon of which is Akasa; and even this would be held incorrect by orthodox Occultists.\n\nThe \"Astral Light\" is simply the older \" sidereal Light\" of Paracelsus; and to say that \"everything which exists has been evolved from it, and it preserves and reproduces all forms,\" as he writes, is to enunciate truth only in the second proposition.\n\nThe first is erroneous; for if all that exists was evolved through (or via ) it, it is not the astral light.\n\nThe latter is not the container of all things but only the reflector, at best, of this all.\n\nEliphas Levi writes: -- \"The great Magic agent is the fourth emanation of the life principle (we say -- it is the first in the inner, and the second in the outer (our) Universe), of which the Sun is the third form .\n\n.\n\n.\n\nfor the day-star (the sun) is only the reflection and material shadow of the Central Sun of truth, which illuminates the intellectual (invisible) world of Spirit and which itself is but a gleam borrowed from the A BSOLUTE.\" So far he is right enough.\n\nBut when the great authority of the Western Kabalists adds that nevertheless, \"it is not the immortal Spirit as the Indian Hierophants have imagined\" -- we answer that he slanders the said Hierophants, as they have said nothing of the kind; while even the Puranic exoteric writings flatly contradict the assertion."


[content]
body = "Therefore, such being the case, all those who sought to give a name to the incognizable Principle have simply degraded it.\n\nEven to speak of Cosmic Ideation -- save in its phenomenal aspect -- is like trying to bottle up primordial Chaos, or to put a printed label on E TERNITY.\n\nWhat, then, is the \"primordial Substance,\" that mysterious object of which Alchemy was ever talking, and which became the subject of philosophical speculation in every age?\n\nWhat can it be finally, even in its phenomenal pre-differentiation?\n\nEven that is ALL in manifested Nature and -- nothing to our senses.\n\nIt is mentioned under various names in every Cosmogony, referred to in every philosophy, and shown to be, to this day, the ever grasp-eluding P ROTEUS in Nature.\n\nWe touch and do not feel it; we look at it without seeing it; we breathe it and do not perceive it; we hear and smell it without the smallest cognition that it is there; for it is in every molecule of that which in our illusion and ignorance we regard as Matter in any of its states, or conceive as a feeling, a thought, an emotion.\n\n.\n\n.\n\n.\n\nIn short, it is the \" upadhi ,\" or vehicle, of every possible phenomenon, whether physical, mental, or psychic.\n\nIn the opening sentences of Genesis , as in the Chaldean Cosmogony; in the Puranas of India, and in the Book of the Dead of Egypt, it opens everywhere the cycle of manifestation.\n\nIt is termed \"Chaos,\" and the face of the waters, incubated by the Spirit proceeding from the Unknown, under whatever name.\n\n( See \" Chaos , Theos , Kosmos.\n\n\") The authors of the sacred Scriptures in India go deeper into the origin of things evolved than Thales or Job, for they say: -- \"From I NTELLIGENCE (called M AHAT in the Puranas) associated with I GNORANCE (Iswar, as a personal deity) attended by its projective power , in which the quality of dulness ( tamas , insensibility) predominates, proceeds Ether -- from ether, air; from air, heat; from heat, water; and from water, earth \"with everything on it.\" \"From THIS, from this same SELF, was the Ether produced,\" says the Veda.\n\n( Taittiriya Upanishad II .\n\n1).\n\nIt becomes thus evident that it is not this Ether -- sprung at the fourth [[Vol.\n\n1, Page]] 331 ETHER, AS ITS NOUMENON.\n\nremove from an Emanation of Intelligence \"associated with Ignorance\" -- which is the high principle, the deific Entity worshipped by the Greeks and Latins under the name of \" Pater omnipotens AEther ,\" and \" Magnus AEther \" in its collective aggregates.\n\nThe septenary gradation, and the innumerable subdivisions and differences, made by the ancients between the powers of Ether collectively, from its outward fringe of effects, with which our Science is so familiar, up to the \"Imponderable Substance,\" once admitted as the \"Ether of Space,\" now about to be rejected, has been ever a vexing riddle for every branch of knowledge.\n\nThe mythologists and symbologists of our day, confused by this incomprehensible glorification, on the one hand, and degradation on the other, of the same deified entity and in the same religious systems, are often driven to the most ludicrous mistakes.\n\nThe Church, firm as a rock in each and all of her early errors of interpretation, has made of Ether the abode of her Satanic legions.* The whole hierarchy of the \"Fallen\" angels is there; the Cosmocratores -- or the \"world bearers,\" (according to Bossuet); Mundi Tenentes -- the \"world holders,\" as Tertullian calls them; and Mundi Domini \"world dominations,\" or rather dominators , the Curbati , or \"Curved,\" etc., who thus make of the stars and celestial orbs in their course -- Devils!\n\nThe difference made between the seven states of Ether (itself one of the Seven Cosmic principles), while the AEther of the Ancients is universal Fire , may be seen in the injunctions by Zoroaster and Psellus, respectively.\n\nThe former said: \"Consult it only when it is without form or figure,\" absque forma et figura , which means without flames or burning coals.\n\n\"When it has a form -- heed it not ,\" teaches Psellus; \"but when it is formless, obey it, for it is then sacred fire , and all it will reveal thee, shall be true.\"** This proves that Ether, itself an aspect of Akasa, has in its turn several aspects or \"principles.\" All the ancient nations deified AEther in its imponderable aspect and potency.\n\nVirgil calls Jupiter, Pater omnipotens AEther , \"the great AEther.\"*** The Hindus have also placed it among their deities; under the name of Akasa (the synthesis of AEther).\n\nAnd the author of the Homoiomerian [[Footnote(s)]] ------------------------------------------------- * For it is thus that the Church has interpreted verse 12 in the VI.\n\nChapter to the Ephesians.\n\n\"For we wrestle not against flesh and blood, but against principalities, against powers, against the rulers of the darkness of this world.\" Further on St.\n\nPaul mentions the spiritual malices (\"wickedness\" in English texts) SPREAD IN THE AIR -- \" Spiritualia nequitiae coelestibus ,\" the Latin texts giving various names to these \"malices,\" the innocent \"Elementals.\" But the Church is right this time, though wrong in calling them all devils.\n\nThe ASTRAL LIGHT or lower Ether is full of conscious and semi-conscious and unconscious entities; only the church has less power over them than over invisible microbes or mosquitoes.\n\n** Effatum XVI .\n\n\"Oracles of Zoroaster.\" *** Georgica.\n\nBook II.\n\n[[Vol.\n\n1, Page]] 332 THE SECRET DOCTRINE.\n\nSystem of philosophy, Anaxagoras of Clazomenae, firmly believed that the spiritual prototypes of all things, as well as their elements, were to be found in the boundless Ether where they were generated, whence they evolved, and whither they returned -- an Occult teaching.\n\nIt thus becomes clear that it is from Ether in its highest synthetic aspect, once anthropomorphised, that sprung the first idea of a personal creative deity.\n\nWith the philosophical Hindus the elements are Tamas , i.e.\n\n, \"unenlightened by intellect , which they obscure.\" We have now to exhaust the question of the mystical meaning of \"Primordial Chaos\" and of the Root-Principle, and show how they were connected in the ancient philosophies with Akasa, wrongly translated AEther, and also with Maya (illusion) -- of which Ishwara is the male aspect."


[content]
body = "Esoteric explanation may, however, bring some order into this confusion, in which Jehovah becomes Saturn, and Michael and his army, Satan and the rebellious angels, owing to the indiscreet endeavours of the too faithful zealots to see in every pagan god a devil.\n\nThe true meaning is far more philosophical, and the legend of the first \"Fall\" (of the angels) assumes a scientific colouring when correctly understood.\n\nKronos stands for endless (hence immovable) Duration, without beginning, without an end, beyond divided Time and beyond Space.\n\nThose \"Angels,\" genii, or Devas, who were born to act in space and time , i.e.\n\n, to break through the seven circles of the superspiritual planes into the phenomenal, or circumscribed, super-terrestrial regions, are said allegorically to have rebelled against Kronos and fought the (then) one living and highest God.\n\nIn his turn, when Kronos is represented as mutilating Uranus, his father, the meaning of this mutilation is very simple: Absolute Time is made to become the finite and the conditioned; a portion is robbed from the whole, thus showing that Saturn, the father of the gods, has been transformed from Eternal Duration into a limited Period.\n\nChronos cuts down with his scythe even the longest and (to us) seemingly endless cycles, yet, for all that, limited in Eternity, and puts down with the same scythe the mightiest rebels.\n\nAye, not one will escape the scythe of Time!\n\nPraise the god or gods, or flout, one or both, and that scythe will not be made to tremble one millionth of a second in its ascending or descending course.\n\nThe Titans of Hesiod's Theogony were copied in Greece from the Suras and Asuras of India.\n\nThese Hesiodic Titans, the Uranides , numbered once upon a time as only six, have been recently discovered to be seven -- the seventh being called Phoreg -- in an old fragment relating to the Greek myth.\n\nThus their identity with the Seven rectors is fully demonstrated.\n\nThe origin of the \"War in Heaven\" and the F ALL has, in our mind, to be traced unavoidably to India, and perhaps far earlier than the Puranic accounts thereof.\n\nFor T ARAMAYA was in a later age, and there are three accounts, each of a distinct war, to be traced in almost every Cosmogony.\n\n[[Vol.\n\n1, Page]] 419 THE WAR OF THE GODS.\n\nThe first war happened in the night of time, between the gods the (A)- suras , and lasted for the period of one \"divine year.\"* On this occasion the deities were defeated by the Daityas, under the leadership of Hrada.\n\nAfter that, owing to a device of Vishnu, to whom the conquered gods applied for help, the latter defeated the Asuras.\n\nIn the Vishnu Purana no interval is found between the two wars.\n\nIn the Esoteric Doctrine, one war takes place before the building of the Solar system; another, on earth, at the \"creation\" of man; and a third \"war\" is mentioned as taking place at the close of the 4th Race, between its adepts and those of the 5th Race, i.e.\n\n, between the Initiates of the \"Sacred Island\" and the Sorcerers of Atlantis.\n\nWe shall notice the first contest, as recounted by Parasara, while trying to separate the two accounts, purposely blended together.\n\nIt is there stated that as the Daityas and Asuras were engaged in the duties of their respective orders ( Varna ) and followed the paths prescribed by holy writ, practising also religious penance (a queer employment for demons if they are identical with our devils , as it is claimed) -- it was impossible for the gods to destroy them.\n\nThe prayers addressed by the gods to Vishnu are curious as showing the ideas involved in an anthropomorphic deity.\n\nHaving, after their defeat, \"fled to the Northern shore of the Milky Ocean (Atlantic Ocean),** the discomfited gods address many supplications \"to the first [[Footnote(s)]] ------------------------------------------------- * One \"Day of Brahma\" lasting 4,320,000,000 years -- multiply this by 365!\n\nThe Asuras here (no-gods, but demons) are still Suras , gods higher in hierarchy than such secondary gods as are not even mentioned in the Vedas.\n\nThe duration of the war shows its significance, and that they are only the personified Cosmic powers.\n\nIt is evidently for sectarian purposes and out of odium theologicum that the illusive form assumed by Vishnu Mayamoha , was attributed in later rearrangements of old texts to Buddha and the Daityas, in the Vishnu Purana , unless it was a fancy of Wilson himself.\n\nHe also fancied he found an allusion to Buddhism in Bhagavatgita, whereas, as proved by K.\n\nT.\n\nTelang, he had only confused the Buddhists and the older Charvaka materialists.\n\nThe version exists nowhere in other Puranas if the inference does, as Professor Wilson claims, in the \"Vishnu Purana\"; the translation of which, especially of Book iii., ch.\n\nxviii., where the reverend Orientalist arbitrarily introduces Buddha, and shows him teaching Buddhism to Daityas -- led to another \"great war\" between himself and Col.\n\nVans Kennedy.\n\nThe latter charged him publicly with wilfully distorting Puranic texts.\n\n\"I affirm,\" wrote the Colonel at Bombay, in 1840, \"that the Puranas do not contain what Professor Wilson has stated is contained in them .\n\n.\n\n.\n\nuntil such passages are produced I may be allowed to repeat my former conclusions, that Professor Wilson's opinion, that the Puranas as now extant are compilations made between the eighth and seventeenth centuries ( A.D .!) rests solely on gratuitous assumptions and unfounded assertions , and that his reasoning in support of it is either futile, fallacious, contradictory, or improbable.\" (See Vishnu Purana , trans.\n\nby Wilson, edit.\n\nby Fitzedward Hall, Vol.\n\nV., Appendix.) ** This statement belongs to the third War, since the terrestrial continents, seas and rivers are mentioned in connection with it.\n\n[[Vol.\n\n1, Page]] 420 THE SECRET DOCTRINE.\n\nof beings, the divine Vishnu,\" and among others this one: \"Glory to thee, who art one with the Saints, whose perfect nature is ever blessed.\n\n.\n\n.\n\n.\n\nGlory to thee, who art one with the Serpent-race , double-tongued , impetuous , cruel , insatiate of enjoyment and abounding with wealth.\n\n.\n\n.\n\n.\n\nGlory to thee, .\n\n.\n\n.\n\n.\n\nO Lord, who hast neither colour nor extension , nor size ( ghana ), nor any predicable qualities , and whose essence ( rupa ), purest of the pure is appreciable only by holy Paramarshi (greatest of sages or Rishis)."


[content]
body = "The animal \"Eves\" were their foremothers, and the human \"Adams\" their forefathers; hence the Kabalistic allegory of Lilith or Lilatu, Adam's first wife, whom the Talmud describes as a charming woman, with long wavy hair, i.e.- - a female hairy animal of a character now unknown, still a female animal, who in the Kabalistic and Talmudic allegories is called the female reflection of Samael, Samael-Lilith, or man-animal united, a being called Hayo Bischat, the Beast or Evil Beast ( Zohar ) .\n\nIt is from this unnatural union that the present apes descended.\n\nThe latter are truly \"speechless men,\" and will become speaking animals (or men of a lower order) in the Fifth Round, while the adepts of a certain school hope that some of the Egos of the apes of a higher intelligence will reappear at the close of the Sixth Root-race.\n\nWhat their form will be is of secondary consideration.\n\nThe form means nothing.\n\nSpecies and genera of the flora, fauna, and the highest animal, its crown -- man, change and vary according to the environments and climatic variations, not only with every Round, but every Root-Race likewise, as well as after every geological [[Vol.\n\n2, Page]] 263 MILLIONS OF YEARS HENCE.\n\ncataclysm that puts an end to, or produces a turning point in the latter.\n\nIn the Sixth Root-Race the fossils of the Orang, the Gorilla and the Chimpanzee will be those of extinct quadrumanous mammals; and new forms -- though fewer and ever wider apart as ages pass on and the close of the Manvantara approaches -- will develop from the \"cast off\" types of the human races as they revert once again to astral, out of the mire of physical, life.\n\nThere were none before man, and they will be extinct before the Seventh Race develops.\n\nKarma will lead on the monads of the unprogressed men of our race and lodge them in the newly evolved human frames of the thus physiologically regenerated baboon.\n\n(But see Part III., Addenda .) This will take place, of course, millions of years hence.\n\nBut the picture of this cyclic precession of all that lives and breathes now on earth, of each species in its turn, is a true one, and needs no \"special creation\" or miraculous formation of man, beast, and plant ex nihilo.\n\nThis is how Occult Science explains the absence of any link between ape and man, and shows the former evolving from the latter.\n\n------- [[This page continued in next section]]"


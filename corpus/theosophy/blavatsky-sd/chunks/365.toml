[content]
body = "They are never erring, perpetually recurring numbers, unveiling, to him who studies the secrets of Nature, a truly divine System, an intelligent plan in Cosmogony, which results in natural cosmic divisions of times, seasons, invisible influences, astronomical phenomena, with their action and reaction on terrestrial and even moral nature; on [[Footnote(s)]] ------------------------------------------------- * Wilson's \"Translation of Vishnu Purana,\" Vol.\n\nI., pp.\n\n50, 51.\n\n[[Vol.\n\n2, Page]] 74 THE SECRET DOCTRINE.\n\nbirth, death, and growth, on health and disease.\n\nAll these natural events are based and depend upon cyclical processes in the Kosmos itself, producing periodic agencies which, acting from without, affect the Earth and all that lives and breathes on it, from one end to the other of any Manvantara.\n\nCauses and effects are esoteric, exoteric, and endexoteric, so to say.\n\nIn Isis Unveiled we wrote that which we now repeat: -- \" We are at the bottom of a cycle and evidently in a transitory state.\n\nPlato divides the intellectual progress of the universe during every cycle into fertile and barren periods.\n\nIn the sublunary regions, the spheres of the various elements remain eternally in perfect harmony with the divine nature, he says; 'but their parts,' owing to a too close proximity to earth, and their commingling with the earthly (which is matter, and therefore the realm of evil), 'are sometimes according, and sometimes contrary to (divine) nature.' When those circulations -- which Eliphas Levi calls ' currents of the astral light' -- in the universal ether which contains in itself every element, take place in harmony with the divine spirit, our earth and everything pertaining to it enjoys a fertile period.\n\nThe occult powers of plants, animals, and minerals magically sympathize with the ' superior natures,' and the divine soul of man is in perfect intelligence with these 'inferior' ones.\n\nBut during the barren periods, the latter lose their magic sympathy, and the spiritual sight of the majority of mankind is so blinded as to lose every notion of the superior powers of its own divine spirit.\n\nWe are in a barren period: the eighteenth century, during which the malignant fever of scepticism broke out so irrepressibly, has entailed unbelief as an hereditary disease upon the nineteenth.\n\nThe divine intellect is veiled in man; his animal brain alone philosophizes.\n\n\" And philosophizing alone, how can it understand the \" S OUL D OCTRINE\"?\n\nIn order not to break the thread of the narrative we shall give some striking proofs of these cyclic laws in Part II., proceeding meanwhile with our explanations of geological and racial cycles.\n\n-------"


[content]
body = "Thus proceed the cycles of the septenary evolution, in Septennial nature; the Spiritual or divine; the psychic or semi-divine; the intellectual, the passional, the instinctual, or cognitional; the semi-corporeal and the purely material or physical natures.\n\nAll these evolve and progress cyclically, passing from one into another, in a double, centrifugal and centripetal way, one in their ultimate essence, seven in their aspects.\n\nThe lowest, of course, is the one depending upon and subservient to [[Footnote(s)]] ------------------------------------------------- * See the \"Sacred Mysteries among the Mayas and the Quiches, 11,500 years ago,\" by Auguste le Plongeon, who shows the identity between the Egyptian rites and beliefs and those of the people he describes.\n\nThe ancient hieratic alphabets of the Maya and the Egyptians are almost identical.\n\n[[Vol.\n\n1, Page]] 268 THE SECRET DOCTRINE.\n\nour five physical senses.* Thus far, for individual, human, sentient, animal and vegetable life, each the microcosm of its higher macrocosm.\n\nThe same for the Universe, which manifests periodically, for purposes of the collective progress of the countless lives , the outbreathings of the One Life; in order that through the Ever - Becoming , every cosmic atom in this infinite Universe, passing from the formless and the intangible, through the mixed natures of the semi-terrestrial, down to matter in full generation, and then back again, reascending at each new period higher and nearer the final goal; that each atom, we say, may reach through individual merits and efforts that plane where it re-becomes the one unconditioned A LL.\n\nBut between the Alpha and the Omega there is the weary \"Road\" hedged in by thorns, that \"goes down first, then -- Winds up hill all the way Yes, to the very end .\n\n.\n\n.\n\n.\n\n.\" Starting upon the long journey immaculate; descending more and more into sinful matter, and having connected himself with every atom in manifested Space -- the Pilgrim , having struggled through and suffered in every form of life and being, is only at the bottom of the valley of matter, and half through his cycle, when he has identified himself with collective Humanity.\n\nThis, he has made in his own image.\n\nIn order to progress upwards and homewards, the \"God\" has now to ascend the weary uphill path of the Golgotha of Life.\n\nIt is the martyrdom of self-conscious existence.\n\nLike Visvakarman he has to sacrifice himself to himself in order to redeem all creatures, to resurrect from the many into the One Life.\n\nThen he ascends into heaven indeed; where, plunged into the incomprehensible absolute Being and Bliss of Paranirvana, he reigns unconditionally, and whence he will re-descend again at the next \"coming,\" which one portion of humanity expects in its dead-letter sense as the second advent , and the other as the last \"Kalki Avatar.\" [[Footnote(s)]] ------------------------------------------------- * Which are in truth seven as shown later, on the authority of the oldest Upanishads.\n\n---------------------"


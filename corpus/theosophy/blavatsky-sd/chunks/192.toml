[content]
body = "The ancients taught the, so to speak, auto -generation of the Gods: the one divine essence, unmanifested , perpetually begetting a second-self, manifested , which second-self, androgynous in its nature, gives birth in an immaculate way to everything macro- and micro-cosmical in this universe.\n\nThis was shown in the Circle and the Diameter, or the Sacred 10, a few pages back.\n\nBut our Orientalists, their extreme desire to discover one homogeneous element in nature notwithstanding, will not see it; cramped in their researches by such ignorance, they -- the Aryanists and Egyptologists -- are constantly led astray from truth in their speculations.\n\nThus, de Rouge is unable to understand, in the text which he translates, the meaning of Ammon-Ra saying to King Amenophes (supposed to be Memnon), \"Thou art my Son, I have begotten thee\"; and as he [[Footnote(s)]] ------------------------------------------------- * The earth flees for her life in the allegory, before Prithu, who pursues her.\n\nShe assumes the shape of a cow, and, trembling with terror, runs away and hides even in the regions of Brahma.\n\nTherefore, it is not our Earth.\n\nAgain, in every Purana, the calf changes name.\n\nIn one it is Manu Swayambhuva, in another Indra, in a third the Himavat (Himalayas) itself, while Meru was the milker.\n\nThis is a deeper allegory than one thinks.\n\n[[Vol.\n\n1, Page]] 399 THE DIGNITY OF SAIS.\n\nfinds the same idea in many a text and under various forms, this very Christian Orientalist is finally compelled to exclaim that \"for this idea to have entered the mind of a hierogrammatist, there must have been in their religion a more or less defined doctrine, indicating as a possible fact that might come to pass , a divine and immaculate incarnation under a human form.\n\n\" Precisely.\n\nBut why throw the explanation on an impossible prophecy, when the whole secret is explained by the later religion copying the earlier?\n\nThat doctrine was universal, and it was not the mind of any one hierogrammatist that evolved it; for the Indian avatars are a proof to the contrary.\n\nAfter which, having come \"to realize clearer\"* what \"the Divine Father and Son\" were with the Egyptians, de Rouge still fails to account for, and perceive what were the functions attributed to the feminine principle in that primordial generation.\n\nHe does not find it in the goddess Neith, of Sais.\n\nYet he quotes the sentence of the Commander to Cambyses when introducing that king into the Saitic temple: \"I made known to his Majesty the dignity of Sais, which is the abode of Neith, the great (female) producer, genitrix of the Sun , who is the first-born , and who is not begotten , but only brought forth ,\" and hence is the fruit of an immaculate mother.\n\nHow much more grandiose, philosophical and poetical is the real distinction -- for whoever is able to understand and appreciate it -- made between the immaculate virgin of the ancient Pagans and the modern Papal conception.\n\nWith the former, the ever-youthful mother nature, the antitype of her prototypes, the sun and moon, generates and brings forth her \"mind-born\" son, the Universe.\n\nThe Sun and Moon, as male-female deities, fructify the earth, the microcosmical mother, and the latter conceives and brings forth, in her turn.\n\nWith the Christians, \"the first-born\" ( primogenitus ) is indeed generated, i.e.\n\n, begotten, \" genitum , non factum ,\" and positively conceived and brought forth -- \" Virgo pariet ,\" explains the Latin Church.\n\nThus, she drags down the noble spiritual ideal of the Virgin Mary to the earth, and, making her \"of the earth earthy,\" degrades that ideal to the lowest of the anthropomorphic goddesses of the rabble.\n\nTruly, Neith, Isis, Diana, etc., etc., were each of them \"a demiurgical goddess, at once visible and invisible, having her place in Heaven, and helping to the generation of species \" -- the moon, in short.\n\nHer occult aspects and powers are numberless, and, in one of them, the moon becomes with [[Footnote(s)]] ------------------------------------------------- * His clear realization of it is, that the Egyptians prophesied Jehovah (!) and his incarnated Redeemer (the good serpent), etc., etc.; even to identifying Typhon with the wicked dragon of the garden of Eden, and this passes as serious and sober science.\n\n[[Vol.\n\n1, Page]] 400 THE SECRET DOCTRINE.\n\nthe Egyptians Hathor, another aspect of Isis,* and both of these goddesses are shown suckling Horus.\n\nBehold in the Egyptian Hall of the British Museum, Hathor worshipped by Pharaoh Thotmes, who stands between her and the Lord of Heavens.\n\nThe monolith was taken from Karnac; and the same goddess has the following legend inscribed on her throne: \" T HE D IVINE M OTHER AND L ADY, OR Q UEEN OF H EAVEN\"; also \"the M ORNING S TAR,\" and the \" L IGHT OF THE S EA\" ( Stella matutina and Lux maris ) .\n\nAll the lunar goddesses had a dual aspect -- one divine , the other infernal.\n\nAll were the virgin mothers of an immaculately born Son -- the S UN.\n\nRaoul Rochetti shows the moon-goddess of the Athenians -- Pallas, or Cybele, Minerva, or again Diana -- holding her child-son on the lap, invoked in her festivals as [[ Monogenes Theou ]], \"the one Mother of God,\" sitting on a lion, and surrounded by twelve personages; in whom the Occultist recognises the twelve great gods, and the pious Christian Orientalist the apostles, or rather the Grecian pagan prophecy thereof.\n\nThey are both right, for the immaculate goddess of the Latin Church is a faithful copy of the older pagan goddesses; the number (twelve) of the apostles is that of the twelve tribes, and the latter are a personification of the twelve great gods, and of the twelve signs of the Zodiac.\n\nEvery detail almost in the Christian dogma is borrowed from the heathens."


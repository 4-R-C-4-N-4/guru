[content]
body = "If the student of Esoteric philosophy thinks deeply over the subject he is sure to find out all the suggestiveness of the term Ambhamsi, in its manifold relations to the Virgin in Heaven, to the Celestial Virgin of the Alchemists, and even to the \"Waters of Grace\" of the modern Baptist.\n\n[[Vol.\n\n1, Page]] 459 THE PATRON-GUIDE OF ISRAEL.\n\nthe howling and terrific destroyer of human passions and physical senses , which are ever in the way of the development of the higher spiritual perceptions and the growth of the inner eternal man -- mystically,* are the progeny of Siva, the Mahayogi , the great patron of all the Yogis and mystics of India.\n\nThey themselves, being the \"Virgin-Ascetics,\" refuse to create the material being MAN.\n\nWell may they be suspected of a direct connection with the Christian Archangel Michael, the \"Virgin Combatant\" of the Dragon Apophis , whose victim is every soul united too loosely to its immortal Spirit, the Angel who, as shown by the Gnostics, refused to create just as the Kumaras did.\n\n( See Book II.\n\n, \" The Mystic Dragons and their Slayers.\n\n\") .\n\n.\n\n.\n\nDoes not that patron-Angel of the Jews preside over Saturn (Siva or Rudra), and the Sabbath, the day of Saturn?\n\nIs he not shown of the same essence with his father (Saturn), and called the \"Son of Time,\" Kronos , or Kala (time), a form of Brahma (Vishnu and Siva)?\" And is not \"Old Time\" of the Greeks, with its scythe and sand-glass, identical with the \"Ancient of Days\" of the Kabalists, the latter \"Ancient\" being one with the Hindu \"Ancient of Days,\" Brahma (in his triune form), whose name is also \"Sanat,\" the Ancient?\n\nEvery Kumara bears the prefix of Sanat and Sana; and Sanaischara is Saturn, the planet (Sani and Sarra), the King Saturn whose Secretary in Egypt was Thot-Hermes the first.\n\nThey are thus identified both with the planet and the god (Siva), who are, in their turn, shown the prototypes of Saturn, who is the same as Bel, Baal, Siva, and Jehovah Sabbaoth, The angel of whose face is MIKAEL ( \"who is as God\").\n\nHe is the patron, and guardian Angel of the Jews, as Daniel tells us (v.\n\n21); and, before the Kumaras were degraded, by those who were ignorant of their very name, into demons and fallen angels, the Greek Ophites, the occultly inclined predecessors and precursors of the Roman Catholic Church after its secession and separation from the primitive Greek Church, had identified Michael with their Ophiomorphos , the rebellious and opposing spirit.\n\nThis means nothing more than the reverse aspect (symbolically) of Ophis -- divine Wisdom or Christos.\n\nIn the Talmud , Mikael (Michael) is \"Prince of Water \" and the chief of the seven Spirits, for the same reason that his prototype (among many others) Sanat-Sujata, [[Footnote(s)]] ------------------------------------------------- * Siva-Rudra is the Destroyer, as Vishnu is the preserver; and both are the regenerators of spiritual as well as of physical nature.\n\nTo live as a plant, the seed must die.\n\nTo live as a conscious entity in the Eternity, the passions and senses of man must first DIE before his body does.\n\n\"To live is to die and to die is to live,\" has been too little understood in the West.\n\nSiva, the destroyer , is the creator and the Saviour of Spiritual man, as he is the good gardener of nature.\n\nHe weeds out the plants, human and cosmic, and kills the passions of the physical, to call to life the perceptions of the spiritual, man.\n\n[[Vol.\n\n1, Page]] 460 THE SECRET DOCTRINE.\n\n-- the chief of the Kumaras -- is called Ambhamsi, \"Waters,\" -- according to the commentary on Vishnu Purana.\n\nWhy?\n\nBecause the \"Waters\" is another name of the \"Great Deep,\" the primordial Waters of space or Chaos , and also means \"Mother,\" Amba , meaning Aditi and Akasa, the Celestial Virgin-Mother of the visible universe.\n\nFurthermore, the \"Waters of the flood\" are also called \"the G REAT D RAGON,\" or Ophis, Ophio-Morphos.\n\nThe Rudras will be noticed in their Septenary character of \"Fire-Spirits\" in the \"Symbolism\" attached to the Stanzas in Book II.\n\nThere we shall also consider the Cross (3 + 4) under its primeval and later forms, and shall use for purposes of comparison the Pythagorean numbers side by side with Hebrew Metrology.\n\nThe immense importance of the number seven will thus become evident, as the root number of nature.\n\nWe shall examine it from the standpoints of the Vedas and the Chaldean Scriptures, as it existed in Egypt thousands of years B.C ., and as treated in the Gnostic records; we shall show how its importance as a basic number has gained recognition in physical Science; and we shall endeavour to prove that the importance attached to the number seven throughout all antiquity was due to no fanciful imaginings of uneducated priests, but to a profound knowledge of natural law.\n\n-------------- [[This page continued in next section]]"


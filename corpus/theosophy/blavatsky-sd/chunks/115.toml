body = "But there is still as little cause to regard them as devils, and this is precisely what the Roman Catholics maintain against all reason and logic.\n\n( b ) The concluding sentence of this sloka shows how archaic is the belief and the doctrine that man is seven-fold in his constitution.\n\nThe thread of being which animates man and passes through all his personalities, or rebirths on this Earth (an allusion to Sutratma), the thread on which moreover all his \"Spirits\" are strung -- is spun from the essence of the \"threefold,\" the \"fourfold\" and the \"fivefold\"; which contain all the preceding.\n\nPanchasikha , agreeably to Bhagavata Purana (V.\n\nXX.\n\n25-28), is one of the seven Kumaras who go to Sveta-Dvipa to worship Vishnu.\n\nWe shall see further on, what connection there is between the \"celibate\" and chaste sons of Brahma, who refuse \"to multiply,\" and terrestrial mortals.\n\nMeanwhile it is evident that \"the Man-Plant,\" Saptaparna, thus refers to the seven principles, and man is compared to the seven-leaved plant of this name* so sacred among Buddhists.\n\nFor further details as to Saptaparna and the importance of the number seven in occultism, as well as in symbology, the reader is referred to Part II., Book II., on Symbolism: Sections on \" Saptaparna ,\" \"The Septenary in the Vedas,\" etc.\n\netc.\n\n[[Footnote(s)]] ------------------------------------------------- * The Egyptian allegory in the \"Book of the Dead\" already mentioned, the hymn that relates to the reward \"of the Soul,\" is as suggestive of our Septenary Doctrine as it is poetical.\n\nThe deceased is allotted a piece of land in the field of Aanroo, wherein the Manes, the deified shades of the dead, glean, as the harvest they have sown by their actions in life, the corn seven cubits high, which grows in a territory divided into 14 and 7 portions.\n\nThis corn is the food on which they live and prosper, or that will kill them, in Amenti, the realm of which the Aanroo field is a domain.\n\nFor, as said in the hymn, (see chap.\n\nxxxii.\n\n9) the deceased is either destroyed therein, or becomes pure spirit for the Eternity, in consequence of the \"Seven times seventy-seven lives\" passed or to be passed on Earth.\n\nThe idea of the corn reaped as the \"fruit of our actions\" is very graphic.\n\n[[Vol.\n\n1, Page]] 237 THE IMMORTAL ROOT.\n\nSTANZA VII.\n\n-- Continued.\n\n4.\n\nI T IS THE ROOT THAT NEVER DIES, THE THREE-TONGUED FLAME OF THE FOUR WICKS* ( a ) .\n\n.\n\n.\n\nT HE WICKS ARE THE SPARKS, THAT DRAW FROM THE THREE-TONGUED FLAME ( their upper triad ) SHOT OUT BY THE SEVEN, THEIR FLAME; THE BEAMS AND SPARKS OF ONE MOON REFLECTED IN THE RUNNING WAVES OF ALL THE RIVERS OF THE EARTH (\" Bhumi ,\" or \" Prithivi \")** ( b ) .\n\n( a ) The \"Three-tongued flame\" that never dies is the immortal spiritual triad -- the Atma-Buddhi and Manas -- the fruition of the latter assimilated by the first two after every terrestrial life.\n\nThe \"four wicks\" that go out and are extinguished, are the four lower principles, including the body.\n\n\"I am the three-wicked Flame and my wicks are immortal,\" says the defunct.\n\n\"I enter into the domain of Sekhem (the God whose arm sows the seed of action produced by the disembodied soul) and I enter the region of the Flames who have destroyed their adversaries,\" i.e.\n\n, got rid of the sin-creating \"four wicks.\" (See chap.\n\ni., vii., \"Book of the Dead,\" and the \"Mysteries of Ro-stan.\") ( b ) Just as milliards of bright sparks dance on the waters of an ocean above which one and the same moon is shining, so our evanescent personalities -- the illusive envelopes of the immortal MONAD-EGO -- twinkle and dance on the waves of Maya.\n\nThey last and appear, as the thousands of sparks produced by the moon-beams, only so long as the Queen of the Night radiates her lustre on the running waters of life: the period of a Manvantara; and then they disappear, the beams -- symbols of our eternal Spiritual Egos -- alone surviving, re-merged in, and being, as they were before, one with the Mother-Source.\n\n[[Footnote(s)]] ------------------------------------------------- * The three-tongued flame of the four wicks corresponds to the four unities and the three Binaries of the Sephirothal tree (see Commentary on Stanza VI.).\n\n** Useless to repeat again that the terms given here are Sanskrit translations; for the original terms, unknown and unheard of in Europe, would only puzzle the reader more, and serve no useful purpose."


body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n2 [[Vol.\n\n2, Page]] 605 THE VEDIC TEACHINGS.\n\n[[Page continued from previous section ]] C.\n\nT HE S EPTENARY E LEMENT IN THE V EDAS.\n\nI T CORROBORATES THE O CCULT T EACHING CONCERNING THE S EVEN G LOBES AND THE S EVEN R ACES.\n\nWe have to go to the very source of historical information, if we would bring our best evidence to testify to the facts enunciated.\n\nFor, though entirely allegorical, the Rig-Vedic hymns are none the less suggestive.\n\nThe seven rays of Surya (the Sun) are made therein parallel to the Seven Worlds (of every planetary chain), to the seven rivers of heaven and earth, the former being the seven creative Hosts, and the latter the Seven men, or primitive human groups.\n\nThe Seven ancient Rishis -- the progenitors of all that lives and breathes on earth -- are the seven friends of Agni, his seven \"horses,\" or seven \" H EADS.\" The human race has sprung from fire and water, it is allegorically stated; fashioned by the F ATHERS, or the ancestor-sacrificers, from Agni; for Agni, the Aswins, the Adityas ( Rig-Veda III., 54, 16, II., 29 , 3, 4), are all synonymous with that \"sacrificer,\" or the fathers, variously called Pitar ( Pitris, fathers) , Angirases ** ( Ibid, 1 , 31, 17, 139, et seq.\n\n) , the Sadhyas, \"divine sacrificers,\" the most occult of all.\n\nThey are all called deva putra rishayah or \"the Sons of God\" ( X., 62 ; 1, 4).\n\nThe \"sacrificers,\" moreover, are collectively the ONE sacrificer, the father of the gods, Visvakarman, who performed the great Sarva-Medha ceremony, and ended by sacrificing himself.\n\n(See Rig-Vedic Hymns.) [[Footnote(s)]] ------------------------------------------------- [[Continued fn from previous page]] \"who like [[ Aisa ]] gives to all their portion of good and evil, \" and is therefore Karma ( Vide Liddell).\n\nBy this abbreviation, however, the subject to Destiny or Karma is meant, the S ELF or Ego, and that which is reborn.\n\nNor is [[ Antimimon Pneumatos ]] our conscience, but our Buddhi; nor is it again the \" counterfeit of Spirit\" but \"modelled after,\" or a counterpart of the Spirit -- which Buddhi is, as the vehicle of Atma ( Vide Ar.\n\nTheism, 17; and Liddell's definitions).\n\n* C.\n\nW.\n\nKing's Gnostics, p.\n\n38.\n\n** Prof.\n\nRoth (in Peter's Lexicon) defines the Angirases as an intermediate race of higher beings between gods and men; while Prof.\n\nWeber, according to his invariable custom of modernising and anthropomorphising the divine, sees in them the original priests of the religion which was common to the Aryan Hindus and Persians.\n\nRoth is right.\n\n\"Angirases\" was one of the names of the Dhyanis, or Devas instructors (\"guru-deva\"), of the late Third, the Fourth, and even of the Fifth Race Initiates.\n\n[[Vol.\n\n2, Page]] 606 THE SECRET DOCTRINE.\n\nIn these Hymns the \"Heavenly Man\" is called purusha, \"the Man,\" ( X.\n\n90, 1) from whom Viraj was born ( X.\n\n90, 5); and from Viraj, the (mortal) man.\n\nIt is Varuna (now drawn from his sublime position to be the chief of the lords-Dhyanis or Devas) who regulates all natural phenomena, who \"makes a path for the Sun, for him to follow.\" The seven rivers of the sky (the descending creative gods) and the seven rivers of the earth (the seven primitive mankinds) are under his control, as will be seen.\n\nFor he who breaks Varuna's laws (Vratani, \"courses of natural action,\" active laws) is punished by Indra ( X .\n\n113, 5), the Vedic powerful god, whose Vrata (law or power) is greater than the Vratani of any other god.\n\nThus, the Rig Veda, the oldest of all the known ancient records, may be shown to corroborate the occult teachings in almost every respect.\n\nIts hymns -- the records written by the earliest Initiates of the Fifth (our race) concerning the primordial teachings -- speak of the Seven Races (two still to come) allegorising them by the \"seven streams\" (1, 35, 8); and of the Five Races (\" panca krishtayah \") which have already inhabited this world ( ibid ) on the five regions \" panca pradicah \" ( IX, 86, 29), as also of the three continents that were.* It is those scholars only who will master the secret meaning of the Purushasukta (in which the intuition of the modern Orientalist has chosen to see \"one of the very latest hymns of the Rig-Veda\"), who may hope to understand how harmonious are its teachings and how corroborative of the Esoteric doctrines.\n\nOne must study in all the abstruseness of their metaphysical meaning the relations in it between the (Heavenly) man \"Purusha,\" S ACRIFICED for the production of the Universe and all in it ( See Visvakarman ) , and the terrestrial mortal man ( Hymn X.\n\n20, 1, 16), before one realizes the hidden philosophy of this verse: -- \"15.\n\nHe (\"Man,\" purusha, or Visvakarman) had seven enclosing logs of fuel, and thrice seven layers of fuel; when the gods performed the sacrifice, they bound the Man as victim\" .\n\n.\n\n.\n\n.\n\nThis relates to the three Septenary primeval Races, and shows the antiquity of the Vedas, who knew of no other, probably in this earliest oral teachings; and also [[Footnote(s)]] ------------------------------------------------- * Three submerged, or otherwise destroyed, continents -- the first \"continent\" of the First Race prevailing to the last and existing to this day -- are described in the occult Doctrine, the Hyperborean, the Lemurian (adopting the name now known in Science), and the Atlantean .\n\nMost of Asia issued from under the waters after the destruction of Atlantis; Africa came still later, while Europe is the fifth and the latest -- portions of the two Americas being far older.\n\nBut of these, more anon.\n\nThe Initiates who recorded the Vedas -- or the Rishis of our Fifth Race -- wrote at a time when Atlantis had already gone down.\n\nAtlantis is the fourth continent that appeared , but the third that disappeared.\n\n[[Vol."


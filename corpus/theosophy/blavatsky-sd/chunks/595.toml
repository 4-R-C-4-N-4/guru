body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n2 [[Vol.\n\n2, Page]] 529 WHO INVENTED WRITING?\n\n§ XXI.\n\nENOICHION-HENOCH.\n\nT HE history of the evolution of the Satanic myth would not be complete if we omitted to notice the character of the mysterious and Cosmopolitan Enoch, variously called Enos, Hanoch, and finally Enoichion by the Greeks.\n\nIt is from his Book that the first notions of the Fallen Angels were taken by the early Christian writers.\n\nThe \"Book of Enoch\" is declared apocryphal.\n\nBut what is an Apocrypha?\n\nThe very etymology of the term shows that it is simply a secret book , i.e.\n\n, one that belonged to the catalogue of temple libraries under the guardianship of the Hierophants and initiated priests, and was never meant for the profane.\n\nApocrypha comes from the verb Crypto, [[krupto]], \"to hide.\" For ages the Enoichion (the Book of the S EER) was preserved in the \"city of letters\" and secret works -- the ancient Kirjath-Sepher, later on, Debir (see Joshua xv ., 15).\n\nSome of the writers interested in the subject -- especially Masons -- have tried to identify Enoch with Thoth of Memphis, the Greek Hermes, and even with the Latin Mercury.\n\nAs individuals, all these are distinct one from the other; professionally -- if one may use this word, now so limited in its sense -- they belong one and all to the same category of sacred writers, of Initiators and Recorders of Occult and ancient Wisdom.\n\nThose who in the Kuran (see Surat XIX.\n\n) are generically termed the Edris, or the \"Learned\" (the Initiated), bore in Egypt the name of \"Thoth,\" the inventor of arts, sciences, writing or letters, of music and astronomy.\n\nAmong the Jews the Edris became \"Enoch,\" who, according to Bar-Hebraeus, \"was the first inventor of writing,\" books, arts, and sciences, the first who reduced to a system the progress of the planets.\n\nIn Greece he was called Orpheus, and thus changed his name with every nation.\n\nThe number Seven being attached to, and connected with, each of those primitive Initiators,* as well as the number 365, of the days in the year, astronomically, it identifies the mission, character, and the sacred office of all those men, but certainly not their personalities.\n\nEnoch is the seventh Patriarch; Orpheus is the possessor of the phorminx, the 7-stringed lyre, which is the seven-fold mystery of initiation.\n\nThoth, with the seven-rayed Solar Discus on his head, travels in the Solar boat, the 365 degrees, jumping out every fourth (leap) year for one day.\n\nFinally, Thoth-Lunus is the septenary [[Footnote(s)]] ------------------------------------------------- * Khanoch, or Hanoch, or Enoch means the \"Initiator\" and \"teacher,\" as well as the \"Son of Man,\" Enos ( vide Genesis iv., 26), esoterically.\n\n[[Vol.\n\n2, Page]] 530 THE SECRET DOCTRINE.\n\ngod of the seven days, or the week.\n\nEsoterically and spiritually, Enoichion means the \"Seer of the Open Eye.\" The story about Enoch, told by Josephus, namely, that he had concealed under the pillars of Mercury or Seth his precious rolls or books, is the same as that told of Hermes, \"the father of Wisdom,\" who concealed his books of Wisdom under a pillar, and then, finding the two pillars of stone, found the science written thereon.\n\nYet Josephus, notwithstanding his constant efforts in the direction of Israel's unmerited glorification, and though he does attribute that science (of Wisdom) to the Jewish Enoch -- writes history.\n\nHe shows those pillars as still existing during his own time.\n\nHe tells us that they were built by Seth; and so they may have been, only neither by the Patriarch of that name, the fabled son of Adam, nor by the Egyptian god of Wisdom -- Teth, Set, Thoth, Tat, Sat (the later Sat-an ) , or Hermes, who are all one, -- but by the \"sons of the Serpent-god,\" or \"Sons of the Dragon,\" the name under which the Hierophants of Egypt and Babylon were known before the Deluge, as were their forefathers, the Atlanteans.\n\nWhat Josephus tells us, therefore, must be allegorically true, with the exception of the application made of it.\n\nAccording to his version the two famous pillars were entirely covered with hieroglyphics, which, after the discovery, were copied and reproduced in the most secret corners of the inner temples of Egypt, and have thus become the source of its Wisdom and exceptional learning.\n\nThese two \"pillars,\" however, are the prototypes of the two \"tables of stones\" hewn by Moses at the command of the \"Lord.\" Hence, in saying that all the great adepts and mystics of antiquity -- like Orpheus, Hesiod, Pythagoras and Plato -- got the elements of their theology from those hieroglyphics, he is right in one sense, and wrong in another; for he errs in accuracy.\n\nThe Secret Doctrine teaches us that the arts, sciences, theology, and especially the philosophy of every nation which preceded the last universally known, but not universal Deluge, had been recorded ideographically from the primitive oral records of the Fourth Race, and that these were the inheritance of the latter from the early Third Root-Race before the allegorical Fall.\n\nHence, also, the Egyptian pillars, the tablets, and even the \"white Oriental porphyry stone\" of the Masonic legend -- which Enoch, fearing that the real and precious secrets would be lost, concealed before the Deluge in the bowels of the Earth -- were simply the more or less symbolical and allegorical copies from the primitive Records.\n\nThe \"Book of Enoch\" is one of such copies and is a Chaldean, now very incomplete compendium.\n\nAs already said, Enoichion means in Greek the \"inner eye,\" or the Seer; in Hebrew, and with the help of Masoretic points it means the initiator and instructor, .\n\nIt is a generic title; besides which his legend is [[Vol.\n\n2, Page]] 531 THE ADEPT DIES BUT TO LIVE.\n\nthat of several other prophets, Jewish and heathen, with changes of made-up details, the root-form being the same.\n\nElijah is also taken up into Heaven alive ; and the astrologer, at the court of Isdubar, the Chaldean Hea -bani, is likewise raised to heaven by the god Hea, who was his patron, as Jehovah was of Elijah (whose name means in Hebrew \"God-Jah,\" Jehovah, ), and again of Elihu, which has the same meaning."


[content]
body = "But the students of Esoteric philosophy understand too well the secret meaning of the stanza: \"Brahma has essentially the aspect of prakriti, both evolved and unevolved .\n\n.\n\n.\n\n.\n\nSpirit, O twice-born, (Initiate) is the leading aspect of Brahma.\n\nThe next is a two-fold aspect -- of Prakriti and Purusha, both evolved and unevolved; and time is the last!\n\nAnu is one of the names of Brahma (as distinct from Brahma neuter), and it means \"atom\": Aniyamsam aniyasam, \"the most atomic of the atomic,\" the \"immutable and imperishable (achyuta) Purushottama.\" Surely, then, the elements now known to us -- be their number whatever it may -- as they are understood and defined at present, are not, [[Footnote(s)]] ------------------------------------------------- * Unfortunately, as these pages are being written the \" archebiosis of terrestrial existence\" has turned, under a somewhat stricter chemical analysis, into a simple precipitate of sulphate of lime -- hence from the scientific standpoint not even an organic substance!!!\n\nSic transit gloria mundi!\n\n[[Vol.\n\n1, Page]] 543 THE QUINTESSENCE OF KOSMOS.\n\nnor can they be, the primordial elements.\n\nThose were formed from \" the curds of the cold radiant mother \" and \"the fire - seed of the hot Father\" who \" are one ,\" or, to express it in the plainer language of modern science, those elements had their genesis in the depths of the primordial fire-mist -- the masses of incandescent vapour of the irresolvable nebulae; for as Professor Newcomb shows (in his \" Popular Astronomy ,\" on page 444), resolvable nebulae are not a class of proper nebulae.\n\nMore than half of those which were at first mistaken for nebulae -- he thinks -- are what he calls \"starry clusters.\" The elements now known, have arrived at their state of permanency in this 4th Round and 5th Race.\n\nThey have a short period of rest before they are propelled once more on their upward spiritual evolution; when the \"living fire of Orcus\" will dissociate the most irresolvable and scatter them into the primordial ONE -- again.\n\nMeanwhile the Occultist goes further, as has been shown in the Commentaries on the Seven Stanzas.\n\nHence he can hardly hope for any help or recognition from science, which will reject both his \"aniyamsam aniyasam\" (the absolutely spiritual atom) and his Manasaputras -- \"mind-born men.\" By resolving the \"single material element\" into one absolute irresolvable element -- Spirit, or \"Root-matter,\" thus placing it at once outside the reach and province of physical philosophy -- he has, of course but little in common with the orthodox men of science.\n\nHe maintains that Spirit and Matter are two FACETS of the unknowable UNITY, their apparently contrasted aspects depending, ( a ) on the various degrees of differentiation of the latter, and ( b ) on the grades of consciousness attained by man himself.\n\nThis is, however, metaphysics, and has little to do with physics -- however great in its own terrestrial limitation that physical philosophy may now be.\n\nNevertheless, once that Science admits, if not the actual existence, at any rate, the possibility of the existence, of a Universe with its numberless forms, conditions, and aspects built out of a \"single Substance,\"* it has [[Footnote(s)]] ------------------------------------------------- * In his \"World-Life\" -- page 48 -- in the appended foot notes, Professor Winchell says: -- \"It is generally admitted that at excessively high temperatures matter exists in a state of dissociation -- that is, no chemical combination can exist;\" and would appeal, to prove the unity of matter, to the spectrum, which in every case of homogeneity will show a bright line, whereas in the case of several molecular arrangements existing -- in the nebulae say, or a star -- \"the spectrum should consist of two or three bright lines!\" This would be no proof either way to the physicist-Occultist, who maintains that beyond a certain limit of visible matter, no spectrum, no telescope and no microscope are of any use.\n\nThe unity of matter, of that which is real cosmic matter to the Alchemist, or \"Adam's Earth\" as the Kabalists call it, can hardly be proved or disproved, by either the French savant Dumas, who suggests \"the composite nature of the \"elements\" on certain relations of atomic weights,\" or even by Mr.\n\nCrookes's \"radiant matter,\" though his experiments may seem [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 544 THE SECRET DOCTRINE.\n\nto go further.\n\nUnless it also admits the possibility of One Element, or the ONE LIFE of the Occultists.\n\nIt will have to hang up that \"single substance,\" especially if limited to only the solar nebulae, like the coffin of Mahomet, in mid air, though minus the attractive magnet that sustains that coffin.\n\nFortunately for the speculative physicists, if unable to state with any degree of precision what the nebular theory does imply, we have, thanks to Professor Winchell, and several disagreeing astronomers, been able to learn what it does not imply .\n\n* ( Vide Supra.\n\n) Unfortunately, this is far from clearing even the most simple of the problems that have vexed, and still do vex, the men of learning in their research after truth.\n\nWe have to proceed with our inquiries, starting with the earliest hypotheses of modern science, if we would discover where and why it sins.\n\nPerchance it may be found that Stallo is right, after all.\n\nThat the blunders, contradictions, and fallacies made by the most eminent men of learning are simply due to their abnormal attitude.\n\nThey are, and want to remain materialistic quand meme , and yet \"the general principles of the atomo-mechanical theory -- the basis of modern physics -- are substantially identical with the cardinal doctrines of ontological metaphysics.\" Thus, \"the fundamental errors of ontology become apparent in proportion to the advance of physical Science.\" (Int.\n\np.\n\nVI., \"Concepts of Modern Physics.\") Science is honeycombed with metaphysical conceptions, but the Scientists will not admit the charge and fight desperately to put atomo-mechanical masks on purely incorporeal and spiritual laws in nature, on our plane -- refusing to admit their substantiality even on other planes, the bare existence of which they reject a priori.\n\nIt is easy to show, however, how Scientists, wedded to their materialistic views, have endeavoured, ever since the day of Newton, to put false masks on fact and truth.\n\nBut their task is becoming with every year more difficult; and with every year also, Chemistry, above all the other sciences, approaches nearer and nearer the realm of the Occult in nature."


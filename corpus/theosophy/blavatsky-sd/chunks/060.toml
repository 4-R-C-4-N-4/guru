body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n1 [[Vol.\n\n1, Page]] 106 THE SECRET DOCTRINE.\n\nSTANZA V.\n\n1.\n\nT HE P RIMORDIAL S EVEN, THE FIRST SEVEN B REATHS OF THE D RAGON OF W ISDOM, PRODUCE IN THEIR TURN FROM THEIR HOLY CIRCUMGYRATING B REATHS THE F IERY W HIRLWIND ( a ).\n\nCOMMENTARY.\n\n( a ) This is, perhaps, the most difficult of all the Stanzas to explain.\n\nIts language is comprehensible only to him who is thoroughly versed in Eastern allegory and its purposely obscure phraseology.\n\nThe question will surely be asked, \"Do the Occultists believe in all these 'Builders,' 'Lipika,' and 'Sons of Light' as Entities, or are they merely imageries?\" To this the answer is given as plainly: \"After due allowance for the imagery of personified Powers, we must admit the existence of these Entities, if we would not reject the existence of spiritual humanity within physical mankind.\n\nFor the hosts of these Sons of Light and 'Mind-born Sons' of the first manifested Ray of the U NKNOWN A LL, are the very root of spiritual man.\" Unless we want to believe the unphilosophical dogma of a specially created soul for every human birth -- a fresh supply of these pouring in daily, since \"Adam\" -- we have to admit the occult teachings.\n\nThis will be explained in its place.\n\nLet us see, now, what may be the occult meaning of this Stanza.\n\nThe Doctrine teaches that, in order to become a divine, fully conscious god, -- aye, even the highest -- the Spiritual primeval I NTELLIGENCES must pass through the human stage.\n\nAnd when we say human, this does not apply merely to our terrestrial humanity, but to the mortals that inhabit any world, i.e.\n\n, to those Intelligences that have reached the appropriate equilibrium between matter and spirit, as we have now, since the middle point of the Fourth Root Race of the Fourth Round was passed.\n\nEach Entity must have won for itself the right of becoming divine, through self-experience.\n\nHegel, the great German thinker, must have known or sensed intuitionally this truth when saying, as he did, that the Unconscious evolved the Universe only \"in the hope of attaining clear self-consciousness,\" of becoming, in other words, MAN; for this is also the secret meaning of the usual Puranic phrase about [[Vol.\n\n1, Page]] 107 NO MAN -- NO GOD.\n\nBrahma being constantly \"moved by the desire to create.\" This explains also the hidden Kabalistic meaning of the saying: \"The Breath becomes a stone; the stone, a plant; the plant, an animal; the animal, a man; the man, a spirit; and the spirit, a god.\" The Mind-born Sons, the Rishis, the Builders, etc., were all men -- of whatever forms and shapes -- in other worlds and the preceding Manvantaras.\n\nThis subject, being so very mystical, is therefore the most difficult to explain in all its details and bearings; since the whole mystery of evolutionary creation is contained in it.\n\nA sentence or two in it vividly recalls to mind similar ones in the Kabala and the phraseology of the King Psalmist (civ.), as both, when speaking of God, show him making the wind his messenger and his \"ministers a flaming fire.\" But in the Esoteric doctrine it is used figuratively.\n\nThe \"fiery Wind\" is the incandescent Cosmic dust which only follows magnetically, as the iron filings follow the magnet, the directing thought of the \"Creative Forces.\" Yet, this cosmic dust is something more; for every atom in the Universe has the potentiality of self-consciousness in it, and is, like the Monads of Leibnitz, a Universe in itself, and for itself.\n\nIt is an atom and an angel.\n\nIn this connection it should be noted that one of the luminaries of the modern Evolutionist School, Mr.\n\nA.\n\nR.\n\nWallace, when discussing the inadequacy of \"natural selection\" as the sole factor in the development of physical man, practically concedes the whole point here discussed.\n\nHe holds that the evolution of man was directed and furthered by superior Intelligences, whose agency is a necessary factor in the scheme of Nature.\n\nBut once the operation of these Intelligences is admitted in one place, it is only a logical deduction to extend it still further.\n\nNo hard and fast line can be drawn.\n\n------- STANZA V.\n\n-- Continued.\n\n2.\n\nT HEY MAKE OF HIM THE MESSENGER OF THEIR WILL ( a ).\n\nT HE D ZYU BECOMES F OHAT; THE S WIFT S ON OF THE D IVINE S ONS, WHOSE SONS ARE THE L IPIKA,* RUNS CIRCULAR ERRANDS.\n\nH E IS THE STEED, AND [[Footnote(s)]] ------------------------------------------------- * The difference between the \"Builders,\" the Planetary Spirits, and the Lipika must not be lost sight of.\n\n(See Nos.\n\n5 and 6 of this Commentary.) [[Vol.\n\n1, Page]] 108 THE SECRET DOCTRINE.\n\nTHE T HOUGHT IS THE RIDER ( i.e.\n\n, he is under the influence of their guiding thought ) .\n\nH E PASSES LIKE LIGHTNING THROUGH THE FIERY CLOUDS ( cosmic mists ) ( b ); TAKES THREE, AND FIVE, AND SEVEN STRIDES THROUGH THE SEVEN REGIONS ABOVE AND THE SEVEN BELOW ( the world to be ) .\n\nH E LIFTS HIS VOICE, AND CALLS THE INNUMERABLE SPARKS ( atoms ) AND JOINS THEM TOGETHER ( c ).\n\n( a ) This shows the \"Primordial Seven\" using for their Vahan (vehicle, or the manifested subject which becomes the symbol of the Power directing it), Fohat, called in consequence, the \"Messenger of their will\" -- the fiery whirlwind.\n\n\"Dzyu becomes Fohat\" -- the expression itself shows it.\n\nDzyu is the one real (magical) knowledge, or Occult Wisdom; which, dealing with eternal truths and primal causes, becomes almost omnipotence when applied in the right direction.\n\nIts antithesis is Dzyu-mi, that which deals with illusions and false appearances only, as in our exoteric modern sciences.\n\nIn this case, Dzyu is the expression of the collective Wisdom of the Dhyani-Buddhas.\n\n( b ) As the reader is supposed not to be acquainted with the Dhyani-Buddhas, it is as well to say at once that, according to the Orientalists , there are five Dhyanis who are the \"celestial\" Buddhas, of whom the human Buddhas are the manifestations in the world of form and matter.\n\nEsoterically, however, the Dhyani-Buddhas are seven, of whom five only have hitherto manifested,* and two are to come in the sixth and seventh Root-races."


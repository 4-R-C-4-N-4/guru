body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n1 [[Vol.\n\n1, Page]] 191 THE PRELIMINARY CREATION OF MAN.\n\n[[This page continued from previous section ]] STANZA VI.\n\n-- Continued.\n\n5.\n\nA T THE FOURTH ( Round , or revolution of life and being around \" the seven smaller wheels \") ( a ), THE SONS ARE TOLD TO CREATE THEIR IMAGES.\n\nO NE THIRD REFUSES.\n\nT WO ( thirds ) OBEY .\n\nThe full meaning of this sloka can be fully comprehended only after reading the detailed additional explanations in the \"Anthropogenesis\" and its commentaries, in Book II.\n\nBetween this Sloka and the last, Sloka 4 in this same Stanza, extend long ages; and there now gleams the dawn and sunrise of another aeon.\n\nThe drama enacted on our planet is at the beginning of its fourth act, but for a clearer comprehension of the whole play the reader will have to turn back before he can proceed onward.\n\nFor this verse belongs to the general Cosmogony given in the archaic volumes, whereas Book II.\n\nwill give a detailed account of the \"Creation\" or rather the formation, of the first human beings, followed by the second humanity, and then by the third; or, as they are called, \"the first, second, and the third Root-Races.\" As the solid Earth began by being a ball of liquid fire, of fiery dust and its protoplasmic phantom, so did man.\n\n[[Vol.\n\n1, Page]] 192 THE SECRET DOCTRINE.\n\n( a ) That which is meant by the qualification the \"Fourth\" is explained as the \"fourth Round\" only on the authority of the Commentaries.\n\nIt can equally mean fourth \"Eternity\" as \"Fourth Round,\" or even the fourth (our) Globe.\n\nFor, as will repeatedly be shown, it is the fourth Sphere on the fourth or lowest plane of material life.\n\nAnd it so happens that we are in the Fourth Round, at the middle point of which the perfect equilibrium between Spirit and Matter had to take place.* Says the Commentary explaining the verse: -- \" The holy youths ( the gods ) refused to multiply and create species after their likeness , after their kind.\n\nThey are not fit forms ( rupas ) for us.\n\nThey have to grow.\n\nThey refuse to enter the chhayas ( shadows or images ) of their inferiors.\n\nThus had selfish feeling prevailed from the beginning , even among the gods , and they fell under the eye of the Karmic Lipikas.\n\n\" They had to suffer for it in later births.\n\nHow the punishment reached the gods will be seen in the second volume.\n\n------- STANZA VI.\n\n-- Continued.\n\n6.\n\nT HE CURSE IS PRONOUNCED ( a ): THEY WILL BE BORN IN THE FOURTH ( Race ), SUFFER AND CAUSE SUFFERING ( b ).\n\nT HIS IS THE FIRST WAR ( c ).\n\n( a ) It is a universal tradition that, before the physiological \"Fall,\" propagation of one's kind, whether human or animal, took place through the WILL of the Creators, or of their progeny.\n\nIt was the Fall of Spirit into generation, not the Fall of mortal man.\n\nIt has already been stated that, to become a Self-Conscious Spirit, the latter must pass through every cycle of being, culminating in its highest point on earth in Man.\n\n[[Footnote(s)]] ------------------------------------------------- * It was, as we shall see, at this period -- during the highest point of civilization and knowledge, as also of human intellectuality, of the fourth, Atlantean Race -- that, owing to the final crisis of physiologico-spiritual adjustment of the races, humanity branched off into its two diametrically opposite paths: the RIGHT- and the LEFT-hand paths of knowledge or of Vidya.\n\n\" Thus were the germs of the White and the Black Magic sown in those days.\n\nThe seeds lay latent for some time , to sprout only during the early period of the Fifth ( our Race ) .\n\n\" ( Commentary.\n\n) [[Vol.\n\n1, Page]] 193 THE FIRST CAUSE OF SIN.\n\nSpirit per se is an unconscious negative ABSTRACTION.\n\nIts purity is inherent, not acquired by merit; hence, as already shown, to become the highest Dhyan Chohan it is necessary for each Ego to attain to full self-consciousness as a human, i.e.\n\n, conscious Being, which is synthesized for us in Man.\n\nThe Jewish Kabalists arguing that no Spirit could belong to the divine hierarchy unless Ruach (Spirit) was united to Nephesh (living Soul), only repeat the Eastern Esoteric teaching.\n\n\"A Dhyani has to be an Atma-Buddhi; once the Buddhi-Manas breaks loose from its immortal Atma of which it (Buddhi) is the vehicle, Atman passes into NON-BEING, which is absolute Being.\" This means that the purely Nirvanic state is a passage of Spirit back to the ideal abstraction of Be-ness which has no relation to the plane on which our Universe is accomplishing its cycle.\n\n( b ) \"The curse is pronounced\" does not mean, in this instance, that any personal Being, god, or superior Spirit, pronounced it, but simply that the cause which could but create bad results had been generated, and that the effects of a Karmic cause could lead the \"Beings\" that counteracted the laws of Nature, and thus impeded her legitimate progress, only to bad incarnations, hence to suffering.\n\n( c ) \"There were many wars\" refers to several struggles of adjustment, spiritual, cosmical, and astronomical, but chiefly to the mystery of the evolution of man as he is now.\n\nPowers -- pure Essences -- \"that were told to create\" is a sentence that relates to a mystery explained, as already said, elsewhere.\n\nIt is not only one of the most hidden secrets of Nature -- that of generation, over whose solution the Embryologists have vainly put their heads together -- but likewise a divine function that involves that other religious, or rather dogmatic, mystery, the \"Fall\" of the Angels, as it is called.\n\nSatan and his rebellious host would thus prove, when the meaning of the allegory is explained, to have refused to create physical man, only to become the direct Saviours and the Creators of \" divine Man.\" The symbolical teaching is more than mystical and religious, it is purely scientific, as will be seen later on.\n\nFor, instead of remaining a mere blind, functioning medium, impelled and guided by fathomless LAW, the \"rebellious\" Angel claimed and enforced his right of independent judgment and will, his [[Vol.\n\n1, Page]] 194 THE SECRET DOCTRINE.\n\nright of free-agency and responsibility, since man and angel are alike under Karmic Law.* \"And there was war in Heaven.\n\n.\n\n.\n\n.\n\nMichael and his angels fought against the Dragon; and the Dragon fought and his angels, and prevailed not; neither was their place found any more in Heaven."


[content]
body = "Numbers 3 and 4 are respectively male and female, Spirit and Matter, and their union is the emblem of life eternal in spirit on its ascending arc, and in matter as the ever resurrecting element -- by procreation and reproduction.\n\nThe spiritual male line is vertical ; the differentiated matter-line is horizontal; the two forming the cross or .\n\nThe former (the 3), is invisible; the latter (the 4), is on the plane of objective perception.\n\nThis is why all the matter of the Universe, when analyzed by science to its ultimates, can be reduced to four elements only -- carbon, oxygen, nitrogen, and hydrogen: and why the three primaries, the noumenoi of the four, or graduated Spirit or Force, have remained a terra incognita and mere speculations, names, to exact Science.\n\nHer servants must believe in and study first the primary causes, before they can hope to fathom the nature and acquaint themselves with the potentialities of the effects.\n\nThus, while the men of Western learning had, and still have, the four, or matter to toy with, the Eastern Occultists and their disciples, the great alchemists the world over, have the whole septenate to study from.** As those Alche- [[Footnote(s)]] ------------------------------------------------- * The \"Potency of the Pythagorean Triangles\" (Ragon).\n\n** There are learned Brahmins who have protested against our septenary division.\n\nThey are right from their own standpoint, as we are right from ours.\n\nLeaving the [[footnote continued on next page]] [[Vol.\n\n2, Page]] 593 SPIRITUAL AND PHYSICAL CORRESPONDENCES.\n\nmists have it: -- \"When the Three and the Four kiss each other, the Quaternary joins its middle nature with that of the Triangle,\" (or Triad, i.e.\n\n, the face of one of its plane surfaces becoming the middle face of the other), \"and becomes a cube; then only does it (the cube unfolded) become the vehicle and the number of L IFE, the Father-Mother S EVEN.\" The following diagram will perhaps assist the student to grasp these parallelisms.\n\nNow we are taught that all these earliest forms of organic life also appear in septenary groups of numbers.\n\nFrom minerals or \"soft [[Footnote(s)]] ------------------------------------------------- [[Continued from previous page]] three aspects, or adjunct principles out of calculation, they accept only four Upadhis (bases) including the Ego -- the reflected image of the Logos in the \"Karana Sarira\" -- and even \"strictly speaking .\n\n.\n\n.\n\n.\n\nonly three Upadhis.\" For purely theoretical metaphysical philosophy, or purposes of meditation, these three may be sufficient, as shown by the Taraka Yoga system; but for practical occult teaching our septenary division is the best and easiest.\n\nIt is, however, a matter of school and choice.\n\n[[Vol.\n\n2, Page]] 594 THE SECRET DOCTRINE.\n\nstones that hardened\" (Stanza) followed by the \"hard plants that softened,\" which are the product of the mineral, for \"it is from the bosom of the stone that vegetation is born\" ( Commentary, Book IX., F.\n\n19); and then to man -- all the primitive models in every kingdom of nature begin by being ethereal, transparent, films.\n\nThis, of course, takes place only in the first beginning of life.\n\nWith the next period they consolidate, and at the seventh begin to branch off into species, all except men, the first of the mammalian animals* in the Fourth Round.\n\nVirgil, versed as every ancient poet was, more or less, in esoteric philosophy, sang evolution in the following strains: -- Principio coelum ac terras, camposque liquentes Lucentemque globum lunae, Titaniaque astra* S PIRITUS intus alit; totamque infusa per artus M ENS agitat molem, et magno se corpore miscet Inde Hominum pecudumque genus, etc.** (AEneid VI .\n\n) \"First came three, or the triangle.\" This expression has a profound meaning in Occultism, and the fact is corroborated in mineralogy, botany, and even in geology, as was demonstrated in the section on \"Ancient Chronology,\" by the compound number seven, the three and the four being in it.\n\nSalt in solution proves it.\n\nFor when its molecules, clustering together, begin to deposit themselves as a solid, the first shape they assume is that of triangles, of small pyramids and cones.\n\nIt is the figure of fire , whence the word \" pyramids \" ; while the second geometrical figure in manifested Nature is a square or a cube, 4 and 6; for, \"the particles of earth being cubical, those of fire are pyramidal\" truly -- (Enfield).\n\nThe pyramidal shape is that assumed by the pines -- the most primitive tree after the fern period.\n\nThus the two opposites in cosmic nature -- fire and water, heat and cold -- begin their metrographical manifestations, one by a trimetric, the other by a hexagonal system.\n\nFor the stellate crystals of snow, viewed under a microscope, are all and each of them a double or a treble six-pointed star, with a central nucleus, like a miniature star within the larger one.\n\nSays Mr.\n\n[[Footnote(s)]] ------------------------------------------------- * Protista are not animals.\n\nThe reader is asked to bear in mind that when we speak of \"animals,\" the mammalians alone are meant.\n\nCrustacea, fishes, and reptiles are contemporary with, and most have preceded physical man in this Round.\n\nAll were bisexual, however, before the age of mammalia in the closing portion of the secondary or Mesozoic ages, yet nearer to the Palaeozoic than the Cenozoic ages.\n\nSmaller marsupial mammalia are contemporary with the huge reptilian monsters of the Secondary.\n\n** \"First Divine Spirit within sustains the Heavens, the earth and watery plains, the moon's orb and shining stars and the Eternal Mind diffused through all the parts of nature, actuates the whole stupendous frame and mingles with the vast body of the universe.\n\nThence proceed the race of men and beasts, the vital principles of the flying kind and the monsters which the Ocean breeds under its smooth crystal plane.\" \"All proceeds from Ether and from its seven natures\" -- said the alchemists.\n\nScience knows these only in their superficial effects.\n\n[[Vol.\n\n2, Page]] 595 NOAH, AN ASPECT OF THE CREATOR.\n\nDarwin, in his \"Descent of Man,\" p.\n\n164.\n\nshowing that the inhabitants of the sea-shore are greatly affected by the tides: -- \"The most ancient progenitors in the Kingdom of the Vertebrata .\n\n.\n\n.\n\napparently consisted of a group of marine animals.\n\n.\n\n.\n\n.\n\nAnimals living either about the mean high-water mark, or about the mean low-water mark, pass through a complete cycle of tidal changes in a fortnight.\n\n.\n\n.\n\n."


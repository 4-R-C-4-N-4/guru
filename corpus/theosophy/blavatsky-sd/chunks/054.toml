body = "He designed and hewed therewith the throne of glory and the wheels, and the seraphim and the holy animals and the ministering angels, and of the three He founded his dwelling, as it is said, He makes his angels spirits and his servants fiery flames!\" Which words \"founded his dwelling\" show clearly that in the Kabala, as in India, the Deity was considered as the Universe, and was not, in his origin, the extra-cosmic God he is now.\n\n[[Vol.\n\n1, Page]] 93 THE POTENCY OF SPEECH AND SOUND.\n\nSTANZA IV.\n\n-- Continued.\n\n4.\n\nT HIS WAS THE A RMY OF THE V OICE -- THE D IVINE S EPTENARY.\n\nT HE SPARKS OF THE SEVEN ARE SUBJECT TO, AND THE SERVANTS OF, THE FIRST, SECOND, THIRD, FOURTH, FIFTH, SIXTH, AND THE SEVENTH OF THE SEVEN ( a ).\n\nTHESE (\" sparks \") ARE CALLED SPHERES, TRIANGLES, CUBES, LINES, AND MODELLERS; FOR THUS STANDS THE E TERNAL N IDANA -- THE O I- H A- H OU ( the Permutation of Oeaohoo ) ( b ) .* ( a ) This Sloka gives again a brief analysis of the Hierarchies of the Dhyan Chohans, called Devas (gods) in India, or the conscious intelligent powers in Nature.\n\nTo this Hierarchy correspond the actual types into which humanity may be divided; for humanity, as a whole, is in reality a materialized though as yet imperfect expression thereof.\n\nThe \"army of the Voice\" is a term closely connected with the mystery of Sound and Speech, as an effect and corollary of the cause -- Divine Thought.\n\nAs beautifully expressed by P.\n\nChristian, the learned author of \"The History of Magic\" and of \"L'Homme Rouge des Tuileries,\" the word spoken by, as well as the name of, every individual largely determine his future fate.\n\nWhy?\n\nBecause -- -- \"When our Soul (mind) creates or evokes a thought, the representative sign of that thought is self-engraved upon the astral fluid, which is the receptacle and, so to say, the mirror of all the manifestations of being.\n\n\"The sign expresses the thing: the thing is the (hidden or occult) virtue of the sign.\n\n\"To pronounce a word is to evoke a thought, and make it present: the magnetic potency of the human speech is the commencement of every manifestation in the Occult World.\n\nTo utter a Name is not only to define a Being (an Entity), but to place it under and condemn it through the emission of the Word (Verbum), to the influence of one or more Occult potencies.\n\nThings are, for every one of us, that which it (the Word) makes them while naming them.\n\nThe Word (Verbum) or the speech of every man is, quite unconsciously to himself, a BLESSING or a CURSE; this is why our present ignorance about the properties or attributes of the IDEA as well as about the attributes and properties of MATTER, is often fatal to us.\n\n[[Footnote(s)]] ------------------------------------------------- * The literal signification of the word is, among the Eastern Occultists of the North, a circular wind, whirlwind; but in this instance, it is a term to denote the ceaseless and eternal Cosmic Motion; or rather the Force that moves it, which Force is tacitly accepted as the Deity but never named.\n\nIt is the eternal Karana , the ever-acting Cause.\n\n[[Vol.\n\n1, Page]] 94 THE SECRET DOCTRINE.\n\n\"Yes, names (and words) are either BENEFICENT or MALEFICENT; they are, in a certain sense, either venomous or health-giving, according to the hidden influences attached by Supreme Wisdom to their elements, that is to say, to the LETTERS which compose them, and the NUMBERS correlative to these letters.\" This is strictly true as an esoteric teaching accepted by all the Eastern Schools of Occultism.\n\nIn the Sanskrit, as also in the Hebrew and all other alphabets, every letter has its occult meaning and its rationale; it is a cause and an effect of a preceding cause and a combination of these very often produces the most magical effect.\n\nThe vowels, especially, contain the most occult and formidable potencies.\n\nThe Mantras (esoterically, magical rather than religious) are chanted by the Brahmins and so are the Vedas and other Scriptures.\n\nThe \"Army of the Voice,\" is the prototype of the \"Host of the Logos,\" or the \"WORD\" of the Sepher Jezirah, called in the Secret Doctrine \"the One Number issued from No-Number\" -- the One Eternal Principle.\n\nThe esoteric theogony begins with the One, manifested, therefore not eternal in its presence and being, if eternal in its essence; the number of the numbers and numbered -- the latter proceeding from the Voice, the feminine Vach, Satarupa \"of the hundred forms,\" or Nature.\n\nIt is from this number 10, or creative nature, the Mother (the occult cypher, or \"nought,\" ever procreating and multiplying in union with the Unit \"I,\" one, or the Spirit of Life), that the whole Universe proceeded.\n\nIn the Anugita a conversation is given (ch.\n\nvi., 15) between a Brahmana and his wife, on the origin of Speech and its occult properties.* The wife asks how Speech came into existence, and which was prior to the other, Speech or Mind.\n\nThe Brahmana tells her that the Apana ( inspirational breath ) becoming lord, changes that intelligence, which does not understand Speech or Words, into the state of Apana, and thus opens the mind.\n\nThereupon he tells her a story, a dialogue between Speech and Mind.\n\n\"Both went to the Self of Being ( i.e.\n\n, to the individual Higher Self, as Nilakantha thinks, to Prajapati, according to the commentator Arjuna Misra), and asked him to destroy their doubts and decide which of them preceded and was superior to the [[Footnote(s)]] ------------------------------------------------- * Anugita forms part of the Asvamedha Parvan of the \"Mahabharata.\" The translator of the Bhagavatgita, edited by Max Muller, regards it as a continuation of the Bhagavatgita.\n\nIts original is one of the oldest Upanishads.\n\n[[Vol.\n\n1, Page]] 95 SPEECH AND MIND.\n\nother.\n\nTo this the lord said: 'Mind is Superior.' But Speech answered the Self of Being, by saying: 'I verily yield (you) your desires,' meaning that by speech he acquired what he desired.\n\nThereupon again, the Self told her that there are two minds, the 'movable' and the 'immovable.' 'The immovable is with me,' he said, 'the movable is in your dominion' ( i.e.\n\nof Speech) on the plane of matter.\n\nTo that you are superior."


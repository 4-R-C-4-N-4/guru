[content]
body = "Of the Primary, when Earth is in possession of the three Elemental Kingdoms, we cannot speak for several reasons, one of which is, that, unless one is a great seer, or naturally intuitional, he will be unable to realise that which can never be expressed in any existing terms.\n\n** Hippocrates said that number seven \"By its occult virtues tended to the accomplishment of all things, to be the dispenser of life and fountain of all its changes.\" The life of man he divided into seven ages (Shakespeare), for \"As the moon changes her phases every seven days, this number influences all sublunary beings,\" and even the Earth, as we know.\n\nWith the child, it is the teeth that appear in the seventh month and he sheds them at seven years; at twice seven puberty begins, at three times seven all our mental and vital powers are developed, at four times seven he is in his full strength, at five times seven his passions are most developed, etc., etc.\n\nThus for the Earth.\n\nIt is now in its middle age, yet very little wiser for it.\n\nThe Tetragrammaton, the four-lettered sacred name of the Deity, can be resolved on Earth only by becoming Septenary through the manifest triangle proceeding from the concealed Tetraktis .\n\nTherefore, the number seven has to be adopted on this plane.\n\nAs written in the Kabala \"The greater Holy Assembly\" v.\n\n1161: -- \"For assuredly there is no stability in those six, save (what they derive) from the seventh.\n\nFor all things depend from the SEVENTH.\" [[Vol.\n\n2, Page]] 313 THE ESOTERIC MEANING OF \"FISH.\" Third Root-Race appeared as an entirely new race physiologically.\n\nIt is this \"destruction\" which is called allegorically the great \"Vaivasvata Manu Deluge,\" when the account shows Vaivasvata Manu (or \"Humanity\") remaining alone on Earth in the Ark of Salvation towed by Vishnu in the shape of a monstrous fish, and the Seven Rishis \"with him.\" The allegory is very plain: -- In the Symbolism of every nation, the \"Deluge\" stands for Chaotic unsettled matter -- Chaos itself: and the Water for the feminine principle -- the \"Great Deep.\" As the Greek Lexicon of Parkhurst gives it -- \" Arche (ark) answers to the Hebrew rasit, or Wisdom .\n\n.\n\n.\n\n.\n\nand (at the same time) to the emblem of the female generative power, the Arg or Arca, in which the germ of nature (and of mankind) floats or broods on the great Abyss of the waters, during the interval which takes place after every mundane (or racial) cycle.\" Ark is also the mystic name of the divine spirit of life which broods over chaos.\n\nNow Vishnu is the divine Spirit, as an abstract principle, and also as the Preserver and Generator, or Giver of life -- the third person of the Trimurti (composed of Brahma, the Creator, Siva, the Destroyer, and Vishnu, the Preserver).\n\nVishnu is shown in the allegory as guiding, under the form of a fish, the Ark of Vaivasvata Manu clean across the waters of the Flood.\n\nThere is no use in expatiating upon the esoteric meaning of the word fish.\n\n( See Payne Knight, Inman, Gerald Massey, etc.\n\n) Its theological meanings is phallic, but the metaphysical, divine .\n\nJesus is called the \"Fish,\" and so were Vishnu and Bacchus: [[ Ies ]], the \"Saviour\" of mankind, being but the monogram of the god Bacchus called [[ Ichthus ]], the fish.* As to the Seven Rishis in the Ark, they symbolised the seven principles, which became complete in man only after he had separated, and become a human, and no longer a divine creature.\n\n( See for further details, \" The Seventh Manu.\n\n\") Nor have we many details about the submersion of the continent inhabited by the Second Root Race.\n\nBut the history of the Third, \"Lemuria,\" is given, as is that of Atlantis, the others being only alluded to.\n\nLemuria is said to have perished about 700,000 years before the commencement of what is now called the Tertiary age (the Eocene),** and it is during this Deluge also -- an actual geological deluge this time -- that Vaivasvata Manu is again shown as saving mankind (allegorically it is mankind, or a portion of it, the Fourth Race, which is saved); so also he saves the Fifth Race during the destruction of the last Atlanteans, the [[Footnote(s)]] ------------------------------------------------- * Says St.\n\nAugustin of Jesus, \"For he is a fish that lives in the midst of waters.\" Christians called themselves little fishes -- pisciculi -- in their sacred mysteries.\n\n\"So many fishes bred in the water, and saved by one great fish, \" says Tertullian of the Christians and Christ and the Church.\n\n** \" Esoteric Buddhism, \" p.\n\n55 .\n\n[[Vol.\n\n2, Page]] 314 THE SECRET DOCTRINE.\n\nremnants that perished 850,000 years ago,* after which there was no great submersion until the day of Plato's Atlantis, or Poseidonis, known to the Egyptians only because it happened in such relatively recent times.\n\nIt is the submersion of the great Atlantis which is the most interesting.\n\nIt is of this cataclysm that the old records ( See the \" Book of Enoch \") say that \"the ends of the Earth got loose;\" and upon which the legends and allegories of Vaivasvata, Xisuthrus, Noah, Deukalion and all the tutti quanti of the Elect saved, have been built.\n\nTradition, taking into no account the difference between sidereal and geological phenomena, calls both indifferently \"deluges.\" Yet there is a great difference.\n\nThe cataclysm which destroyed the huge continent of which Australia is the largest relic, was due to a series of subterranean convulsions and the breaking asunder of the ocean floors.\n\nThat which put an end to its successor -- the fourth continent -- was brought on by successive disturbances in the axial rotation.\n\nIt began during the earliest tertiary periods, and, continuing for long ages, carried away successively the last vestige of Atlantis, with the exception, perhaps, of Ceylon and a small portion of what is now Africa.\n\nIt changed the face of the globe, and no memory of its flourishing continents and isles, of its civilizations and sciences, remained in the annals of history, save in the Sacred records of the East.\n\nHence, Modern Science denies Atlantis and its existence.\n\nIt even denies any violent shiftings of the Earth's axis, and would attribute the reason for the change of climates to other causes.\n\nBut this question is still an open one.\n\nIf Dr."


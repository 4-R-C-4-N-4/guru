body = "Isis is also mystic Nature and also Earth; and her cow's horns identify her with Vach.\n\nThe latter, after having been recognised in her highest form as para , becomes at the lower or material end of creation -- Vaikhari.\n\nHence she is mystic, though physical, Nature, with all her magic ways and properties.\n\nAgain, as goddess of Speech and of Sound, and a permutation of Aditi -- she is Chaos , in one sense.\n\nAt any rate, she is the \"Mother of the gods,\" and it is from Brahma (Iswara, or the Logos) and Vach, as from Adam Kadmon and Sephira, that the real manifested theogony has to start.\n\nBeyond, all is darkness and abstract speculation.\n\nWith the Dhyan Chohans, or the gods, the Seers, the Prophets and the adepts in general are on firm ground.\n\nWhether as Aditi, or the divine Sophia of the Greek Gnostics, she is the mother of the seven sons: the \"Angels of the Face,\" of the \"Deep,\" or the \"Great Green One\" of the \"Book of the Dead.\" Says the Book of Dzyan (Knowledge through meditation) -- \" The great mother lay with , and the |, and the , the second | and the * in her bosom , ready to bring them forth , the valiant sons of the || (or 4,320,000, the Cycle ) whose two elders are the and the ( Point ) .\n\n\" At the beginning of every cycle of 4,320,000, the Seven (or, as some nations had it, eight) great gods, descended to establish the new order of things and give the impetus to the new cycle.\n\nThat eighth god was the unifying Circle or L OGOS, separated and made distinct from its host, in exoteric dogma, just as the three divine hypostases of the ancient Greeks are now considered in the Churches as three distinct personae.\n\n\"The M IGHTY O NES perform their great works, and leave behind them everlasting monuments to commemorate their visit, every time they penetrate within our mayavic veil (atmosphere),\" says a [[Footnote(s)]] ------------------------------------------------- * 31415, or [[pi]].\n\nThe synthesis, or the Host unified in the Logos and the Point called in Roman Catholicism the \"Angel of the Face,\" and in Hebrew \"who is (like unto, or the same) as God\" -- the manifested representation.\n\n[[Vol.\n\n1, Page]] 435 ANTIQUITY OF THE PYRAMIDS.\n\nCommentary.* Thus we are taught that the great Pyramids were built under their direct supervision, \"when Dhruva (the then Pole-star) was at his lowest culmination, and the Krittika (Pleiades) looked over his head (were on the same meridian but above) to watch the work of the giants.\" Thus, as the first Pyramids were built at the beginning of a Sidereal year, under Dhruva (Alpha Polaris), it must have been over 31,000 years (31,105) ago.\n\nBunsen was right in admitting for Egypt an antiquity of over 21,000 years, but this concession hardly exhausts truth and fact in this question.\n\n\"The stories told by Egyptian priests and others of time-keeping in Egypt, are now beginning to look less like lies in the sight of all who have escaped from biblical bondage,\" writes the author of \" The Natural Genesis.\n\n\" \"Inscriptions have lately been found at Sakkarah, making mention of two Sothiac cycles .\n\n.\n\n.\n\nregistered at that time, now some 6,000 years ago.\n\nThus when Herodotus was in Egypt, the Egyptians had -- as now known -- observed at least five different Sothiac cycles of 1,461 years.\n\nThe priests informed the Greek inquirer that time had been reckoned by them for so long that the sun had twice risen where it then set, and twice set where it then arose.\n\nThis .\n\n.\n\n.\n\ncan only be realized as a fact in nature by means of two cycles of Precession, or a period of 51,736 years,\" (vol.\n\nii, p.\n\n318.\n\nBut see in our Book II., \" C HRONOLOGY OF THE B RAHMINS.\") Mor Isaac ( See Kircher's OEdipus , vol.\n\nii.\n\n, p.\n\n425) shows the ancient Syrians defining their world of the \"Rulers\" and \"active gods\" in the same way as the Chaldeans.\n\nThe lowest world was the S UBLUNARY -- our own -- watched by the \"Angels\" of the first or lower order; the one that came next in rank, was Mercury, ruled by the \" A RCHANGELS\"; then came Venus, whose gods were the P RINCIPALITIES; the fourth was that of the S UN, the domain and region of the highest and mightiest gods of our system, the solar gods of all nations; the fifth was Mars, ruled by the \" V IRTUES\"; the sixth -- that of Bel or Jupiter -- was governed by the D OMINIONS; the seventh -- the world of Saturn -- by the T HRONES.\n\nThese are the worlds of form.\n\nAbove come the four higher ones, making seven again, since the three highest are \"unmentionable and unpronounceable.\" The eighth, composed of 1,122 stars, is the domain of the Cherubs; the ninth, belonging to the walking and numberless stars on account of their distance, has the seraphs; as to the tenth -- Kircher, quoting Mor Isaac, says that it is composed \"of invisible stars that could be taken, they said, for clouds -- so massed are they in the zone that we call Via Straminis , the [[Footnote(s)]] ------------------------------------------------- * Appearing at the beginning of Cycles, as also of every sidereal year (of 25,868 years) therefore the Kabeiri or Kabarim received their name in Chaldea, as it means the measures of Heaven from Kob -- measure of, and Urim -- heavens.\n\n[[Vol.\n\n1, Page]] 436 THE SECRET DOCTRINE.\n\nMilky Way\"; and he hastens to explain that \"these are the stars of Lucifer, engulfed with him in his terrible shipwreck.\" That which comes after and beyond the tenth world (our Quaternary, or the Arupa world), the Syrians could not tell.\n\n\"All they knew was that it is there that begins the vast and incomprehensible ocean of the infinite, the abode of the true divinity without boundary or end.\" Champollion shows the same belief among the Egyptians.\n\nHermes having spoken of the Father-Mother and Son, whose spirit (collectively the DIVINE FIAT) shapes the Universe, says: -- \" Seven Agents (mediums) were also formed, to contain the material (or manifested) worlds, within their respective circles and the action of these agents was named DESTINY.\" He further enumerates seven and ten and twelve orders, which would take too long to detail here."


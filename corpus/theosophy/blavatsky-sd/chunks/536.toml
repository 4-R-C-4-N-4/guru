body = "Zeus, it is said, proposed to annihilate these puny ephemerals, and to plant upon the earth a new race in their stead.\" We see the Lords of Being doing likewise, and exterminating the first product of nature and the sea, in the Stanzas (V, et seq .).\n\n.\n\n.\n\n.\n\nPrometheus represents himself as having frustrated this design, and as being consequently subjected, for the sake of mortals, to the most agonising pain, inflicted by the remorseless cruelty of Zeus.\n\nWe have, thus, the Titan, the symbol of finite reason and free will (of intellectual humanity, or the higher aspect of Manas ), depicted as the sublime philanthropist, while Zeus, the supreme deity of Hellas, is portrayed as the cruel and obdurate despot, a character peculiarly revolting to Athenian sentiment.\" The reason for it is explained further on.\n\nThe \"Supreme Deity\" bears, in every ancient Pantheon -- including that of the Jews -- a dual character, composed of light and shadow.\n\n* The animal world, having simple instinct to guide it, has its seasons of procreation, and the sexes become neutralized during the rest of the year.\n\nTherefore, the free animal knows sickness but once in its life -- before it dies.\n\n** Introduction to \" Prometheus Bound, \" p.\n\n152.\n\n[[Vol.\n\n2, Page]] 413 THE TRAVESTY OF PROMETHEUS.\n\ninstead of \"an untainted mind, heaven's first gift\" (AEschylus), there was created the eternal vulture of the ever unsatisfied desire, of regret and despair coupled with \"the dreamlike feebleness that fetters the blind race of mortals\" ( p .\n\n556), unto the day when Prometheus is released by his heaven-appointed deliverer, Herakles.\n\nNow Christians -- Roman Catholics especially -- have tried to prophetically connect this drama with the coming of Christ.\n\nNo greater mistake could be made.\n\nThe true theosophist, the pursuer of divine wisdom and worshipper of ABSOLUTE perfection -- the unknown deity which is neither Zeus nor Jehovah -- will demur to such an idea.\n\nPointing to antiquity he will prove that there never was an original sin, but only an abuse of physical intelligence -- the psychic being guided by the animal, and both putting out the light of the spiritual.\n\nHe will say, \"All ye who can read between the lines, study ancient wisdom in the old dramas -- the Indian and the Greek; read carefully the one just mentioned, one enacted on the theatres of Athens 2,400 years ago, namely 'Prometheus Bound' \" The myth belongs to neither Hesiod nor AEschylus; but, as Bunsen says, it \"is older than the Hellenes themselves,\" for it belongs, in truth, to the dawn of human consciousness.\n\nThe Crucified Titan is the personified symbol of the collective Logos, the \"Host,\" and of the \"Lords of Wisdom\" or the HEAVENLY MAN, who incarnated in Humanity.\n\nMoreover, as his name Pro -me- theus , meaning \"he who sees before him\" or futurity, shows* -- in the arts he devised and taught to humanity, psychological insight was not the least.\n\nFor as he complains to the daughters of Oceanos: -- \"Of prophecies the various modes I fixed, And among dreams did first discriminate The truthful vision .\n\n.\n\n.\n\nand mortals guided To a mysterious art.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\nAll arts to mortals from Prometheus came.\n\n.\n\n.\" [[Footnote(s)]] ------------------------------------------------- * From [[ pro metis ]] pro metis , \"forethought.\" \"Professor Kuhn,\" we are told in the above-named volumes of \"The Dramas of AEschylus,\" \"considers the name of the Titan to be derived from the Sanskrit word Pramantha, the instrument used for kindling fire.\n\nThe root mand or manth , implies rotatory motion, and the word manthami (used to denote the process of fire kindling) acquired the secondary sense of snatching away; hence we find another word of the same stock, pramatha , signifying theft.\" This is very ingenious, but perhaps not altogether correct; besides, there is a very prosaic element in it.\n\nNo doubt in physical nature, the higher forms may develop from the lower ones, but it is hardly so in the world of thought.\n\nAnd as we are told that the word manthami passed into the Greek language and became the word manthano, to learn; that is to say, to appropriate knowledge; whence prometheia, fore-knowledge, fore-thought; we may find, in searching, a more poetical origin for the \"fire-bringer\" than that displayed in its Sanskrit origin.\n\nThe Svastica, the sacred sign and the instrument for kindling sacred fire, may explain it better.\n\n\"Prometheus, the fire-bringer, is the Pramantha personified,\" goes on the author; \"he finds his prototype in the Aryan [[Footnote continued on next page]] [[Vol.\n\n2, Page]] 414 THE SECRET DOCTRINE.\n\nLeaving for a few pages the main subject, let us pause and see what may be the hidden meaning of this, the most ancient as it is the most suggestive of traditional allegories.\n\nAs it relates directly to the early races, this will be no real digression.\n\nThe subject of AEschylus' drama (the trilogy is lost) is known to all cultured readers.\n\nThe demi-god robs the gods (the Elohim) of their secret -- the mystery of the creative fire.\n\nFor this sacrilegious attempt he is struck down by KRONOS* and delivered unto Zeus, the FATHER and creator of a mankind which he would wish to have blind intellectually, and animal-like; a personal deity, which will not see MAN \"like one of us.\" Hence Prometheus, \"the fire and light-giver,\" is chained on Mount Caucasus and condemned to suffer torture.\n\nBut the triform Fates (Karma), whose decrees, as the Titan says, even Zeus: -- \"E'en he the fore-ordained cannot escape.\n\n.\n\n.\n\n\" -- ordain that those sufferings will last only to that day when a son of Zeus -- \"Ay, a son bearing stronger than his sire\" (787) .\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n\"One of thine (Io's) own descendants it must be.\n\n.\"(791) -- is born.\n\nThis \"Son\" will deliver Prometheus (the suffering Humanity) from his own fatal gift.\n\nHis name is, \"He who has to come.\n\n.\n\n.\n\n.\n\n\" On the authority, then, of these few lines, which, like any other allegorical sentence, may be twisted into almost any meaning; namely, on the words pronounced by Prometheus and addressed to Io, the daughter of Inachos, persecuted by Zeus -- a whole prophecy is constructed by some Catholic writers."


[content]
body = "Having evolved from Cosmic Space, and before the final formation of the primaries and the annulation of the planetary nebula, the Sun, we are taught, drew into the depths of its mass all the Cosmic vitality he could, threatening to engulf his weaker \"brothers\" before the law of attraction and repulsion was finally adjusted; after which he began feeding on \"The Mother's refuse and sweat\"; in other words, on those portions of Ether (the \"breath of the Universal Soul\") of the existence and constitution of which science is as yet absolutely ignorant.\n\nA theory of this kind having been propounded by Sir William Grove (see \" Correlation of the Physical Forces ,\" 1843, p.\n\n81; and \" Address to the British Association , 1866\"), who theorized that the systems \"are gradually changing by atmospheric additions or subtractions, or by accretions and diminutions arising from nebular substances\" .\n\n.\n\n.\n\nand again that \"the Sun may condense gaseous matter as it travels in Space and so heat may be produced\" -- the archaic teaching seems scientific enough, even in this age.* Mr.\n\nW.\n\nMattieu Williams suggested that the diffused matter or Ether which is the recipient of the heat radiations of the Universe is thereby drawn into the depths of the solar mass.\n\nExpelling thence the previously condensed and thermally exhausted Ether, it becomes compressed and gives up its heat, to be in turn itself driven out in a rarified and cooled state, to absorb a fresh supply of heat, which he supposes to be in this way taken up by the Ether, and again concentrated and redistributed by the Suns of the Universe.** This is about as close an approximation to the Occult teachings as Science ever imagined; for Occultism explains it by \"the dead breath\" given back by Martanda and his feeding on the \"sweat and refuse\" of \"Mother Space.\" What could affect Neptune,*** Saturn and Jupiter, [[Footnote(s)]] ------------------------------------------------- * Very similar ideas in Mr.\n\nW.\n\nMattieu Williams' \" The Fuel of the Sun ;\" in Dr.\n\nC.\n\nWilliam Siemens' \" On the Conservation of Solar Energy \" (Nature, XXV ., p.\n\n440-444, March 9, 1882); and also in Dr.\n\nP.\n\nMartin Duncan's \" Address of the President of the Geological Society ,\" London, May, 1877.\n\n** See \" Comparative Geology ,\" by Alexander Winchell, LL.D ., p.\n\n56.\n\n*** When we speak of Neptune it is not as an Occultist but as a European.\n\nThe true Eastern Occultist will maintain that, whereas there are many yet undiscovered planets in our system, Neptune does not belong to it, his apparent connection with our sun and the influence of the latter upon Neptune notwithstanding.\n\nThis connection is mayavic , imaginary, they say.\n\n[[Vol.\n\n1, Page]] 103 THE STELLAR \"SONS OF LIGHT.\" but little, would have killed such comparatively small \"Houses\" as Mercury, Venus and Mars.\n\nAs Uranus was not known before the end of the eighteenth century, the name of the fourth planet mentioned in the allegory must remain to us, so far, a mystery.\n\nThe \"Breath\" of all the \"seven\" is said to be Bhaskara (light-making), because they (the planets) were all comets and suns in their origin.\n\nThey evolve into Manvantaric life from primaeval Chaos (now the noumenon of irresolvable nebulae) by aggregation and accumulation of the primary differentiations of the eternal matter, according to the beautiful expression in the Commentary, \"Thus the Sons of Light clothed themselves in the fabric of Darkness.\" They are called allegorically \"the Heavenly Snails,\" on account of their (to us) formless INTELLIGENCES inhabiting unseen their starry and planetary homes, and, so to speak, carrying them as the snails do along with themselves in their revolution.\n\nThe doctrine of a common origin for all the heavenly bodies and planets, was, as we see, inculcated by the Archaic astronomers, before Kepler, Newton, Leibnitz, Kant, Herschel and Laplace.\n\nHeat (the Breath), attraction and repulsion -- the three great factors of Motion -- are the conditions under which all the members of all this primitive family are born, developed, and die, to be reborn after a \"Night of Brahma,\" during which eternal matter relapses periodically into its primary undifferentiated state.\n\nThe most attenuated gases can give no idea of its nature to the modern physicist.\n\nCentres of Forces at first, the invisible sparks of primordial atoms differentiate into molecules, and become Suns -- passing gradually into objectivity gaseous, radiant, cosmic, the one \"Whirlwind\" (or motion) finally giving the impulse to the form, and the initial motion, regulated and sustained by the never-resting Breaths -- the Dhyan Chohans.\n\n------- STANZA IV.\n\n-- Continued.\n\n6.\n\n.\n\n.\n\n.\n\n.\n\nT HEN THE S ECOND S EVEN, WHO ARE THE L IPIKA, PRODUCED BY THE THREE ( Word, Voice, and Spirit ) .\n\nT HE REJECTED S ON IS O NE, THE \" S ON- S UNS\" ARE COUNTLESS.\n\nThe Lipi-ka , from the word lipi , \"writing,\" means literally the [[Vol.\n\n1, Page]] 104 THE SECRET DOCTRINE.\n\n\"Scribes.\"* Mystically, these Divine Beings are connected with Karma, the Law of Retribution, for they are the Recorders or Annalists who impress on the (to us) invisible tablets of the Astral Light, \"the great picture-gallery of eternity\" -- a faithful record of every act, and even thought, of man, of all that was, is, or ever will be, in the phenomenal Universe.\n\nAs said in \" Isis ,\" this divine and unseen canvas is the B OOK OF L IFE.\n\nAs it is the Lipika who project into objectivity from the passive Universal Mind the ideal plan of the universe, upon which the \"Builders\" reconstruct the Kosmos after every Pralaya, it is they who stand parallel to the Seven Angels of the Presence, whom the Christians recognise in the Seven \"Planetary Spirits\" or the \"Spirits of the Stars;\" for thus it is they who are the direct amanuenses of the Eternal Ideation -- or, as called by Plato, the \"Divine Thought.\" The Eternal Record is no fantastic dream, for we meet with the same records in the world of gross matter.\n\n\"A shadow never falls upon a wall without leaving thereupon a permanent trace which might be made visible by resorting to proper processes,\" says Dr.\n\nDraper.\n\n.\n\n.\n\n.\n\n\"The portraits of our friends or landscape-views may be hidden on the sensitive surface from the eye, but they are ready to make their appearance as soon as proper developers are resorted to.\n\nA spectre is concealed on a silver or a glassy surface, until, by our necromancy, we make it come forth into the visible world."


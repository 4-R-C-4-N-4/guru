[content]
body = "exoteric, of course, yet in its main idea as identical as possible with the Egyptian cosmogony, which shows in its opening sentences Athtor,* or Mother Night (which represents illimitable darkness), as the primeval element which covered the infinite abyss, animated by water and the universal spirit of the Eternal, dwelling alone in Chaos.\n\nSimilarly in the Jewish Scriptures, the history of the creation opens with the spirit of God and his creative emanation -- another Deity.** The Zohar teaches that it is the primordial elements -- the trinity of Fire, Air and Water -- the four cardinal points, and all the Forces of Nature, which form collectively the V OICE of the W ILL Memrab , or the \"Word,\" the Logos of the Absolute Silent ALL.\n\n\"The indivisible point, limitless and unknowable\" spreads itself over the endless space, and thus forms a veil (the Mulaprakriti of Parabraham) which conceals this Absolute point.\n\n( Vide infra ) .\n\nIn the cosmogonies of all the nations it is the \"Architects\" synthesized by Demiurgos (in the Bible the \"Elohim\"), who fashion Kosmos out of Chaos, and who are the collective Theos , \"male-female,\" Spirit and matter.\n\n\"By a series ( yom ) of foundations ( hasoth ) the Alhim caused earth and heaven to be\" (Gen.\n\nii., 4).\n\nIn the Bible it is first Alhim , then Jahva-Alhim, and finally Jehovah --after the separation of the sexes in chapter iv.\n\nof Genesis.\n\nIt is noticeable that nowhere, except in the later, the last Cosmogonies of our Fifth race, is the ineffable and unutterable N AME*** -- the symbol of the Unknown Deity, which was used only in the M YSTERIES -- used in connection with the \"Creation\" of the Universe.\n\nIt is the \"Movers,\" the \"Runners,\" the theoi (from [[ theein ]], \"to run\"), who do the work of formation, the \"Messengers\" of the manvantaric law, who have now become in Christianity the \"messengers\" (malachim); and it seems the same in Hinduism or early Brahmanism.\n\nFor it is not Brahma who creates in the Rig Veda , but the Prajapati, the \"Lords of Being,\" who are the Rishis; the word Rishi (according to Professor Mahadeo Kunte) being connected with the word to move, to lead on, applied to them in their terrestrial character, when, as Patriarchs, they lead their hosts on the Seven Rivers.\n\nMoreover, the very word \"God\" in the singular, embracing all the gods -- or theos from theoi -- came to the \"superior\" civilized nations from a strange source, one entirely and as pre-eminently phallic as the [[Footnote(s)]] ------------------------------------------------- * Orthography of the \"Archaic Dictionary.\" ** We do not mean the current or accepted Bible, but the real Jewish one, now explained kabalistically.\n\n*** It is \"unutterable\" for the simple reason that it is non-existent.\n\nIt never was a name , nor any word at all, but an Idea that could not be expressed.\n\nA substitute was created for it in the century preceding our era.\n\n[[Vol.\n\n1, Page]] 347 THE MYSTIC ELEMENTS.\n\nsincere, open-spoken lingham of India.\n\nThe attempt to derive God from the Anglo-Saxon synonym \"good\" is an abandoned idea, for in no other language, in all of which the term varies more or less, from the Persian Khoda down to the Latin Deus , has an instance been found of a name of God being derived from the attribute of Goodness.\n\nTo the Latin races it comes from the Aryan Dyaus (the Day); to the Slavonian, from the Greek Bacchus ( Bagh-bog ); and to the Saxon races directly from the Hebrew Yodh or Jod.\n\nThe latter is , the number-letter 10, male and female, and Jod the phallic hook: -- hence the Saxon Godh , the Germanic Gott , and the English God.\n\nThis symbolic term may be said to represent the Creator of physical \"Humanity,\" on the terrestrial plane; but surely it had nothing to do with the formation or \"Creation\" of Spirit, gods, or Kosmos!\n\nChaos-Theos-Kosmos, the triple deity, is all in all.\n\nTherefore, it is said to be male and female, good and evil, positive and negative: the whole series of contrasted qualities.\n\nWhen latent (in pralaya) it is incognizable and becomes the unknowable Deity.\n\nIt can be known only in its active functions; hence as matter-Force and living Spirit , the correlations and outcome, or the expression, on the visible plane, of the ultimate and ever-to-be unknown UNITY.\n\nIn its turn this triple unit is the producer of the four primary \"Elements,\"* which are known in our visible terrestrial nature as the seven (so far the five ) Elements, each divisible into forty-nine (or seven times seven) sub-elements, with about seventy of which Chemistry is acquainted.\n\nEvery Cosmical Element such as Fire, Air, Water, Earth, partaking of the qualities and defects of their Primaries, are in their nature Good and Evil, Force (or Spirit) and Matter, etc., etc.; and each, therefore, is at one and the same time Life and Death, Health and Disease, Action and Reaction.\n\n( See Section XIV.\n\n, \" The Four Elements.\n\n\") They are ever and constantly forming matter under the never-ceasing impulse of the O NE Element (the incognizable ), represented in the world of phenomena by 'AEther, or \"the immortal gods who give birth and life to all.\" In \"the Philosophical writings of Solomon Ben Yehudah Ibn Gebirol\" (translated in Mr.\n\nIsaac Myer's Kabbalah , just published) it is said on the structure of the Universe, \"R.\n\nYehudah began, it is written: -- 'Elohim said: Let there be a firmament in the midst of the waters.' Come, see, at the time that the Holy.\n\n.\n\n.\n\n.\n\ncreated the World, He [[Footnote(s)]] ------------------------------------------------- * The Cosmic Tabernacle of Moses, erected by him in the Desert, was square , representing the four cardinal points and the four Elements, as Josephus tells his readers ( Antiq.\n\n1 , viii ch.\n\n, xxii.\n\n) It is the idea taken from the pyramids in Egypt and in Tyre, where the pyramids became pillars, the Genii, or Angels have their abodes in the four respective points (See § xiv.; \" The Four Elements.\n\n\") [[Vol.\n\n1, Page]] 348 THE SECRET DOCTRINE.\n\ncreated 7 heavens above, 7 earths below, 7 seas, 7 days, 7 rivers, 7 weeks, 7 years, 7 times, and 7,000 years that the world has been."


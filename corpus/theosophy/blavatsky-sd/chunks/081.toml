[content]
body = "When a planetary chain is in its last Round, its Globe 1 or A, before finally dying out , sends all its energy and \"principles\" into a neutral centre of latent force, a \"laya centre,\" and thereby informs a new nucleus of undifferentiated substance or matter, i.e.\n\n, calls it into activity or gives it life.\n\nSuppose such a process to have taken place in the lunar \"planetary\" chain; suppose again, for argument's sake (though Mr.\n\nDarwin's theory quoted below has lately been upset, even if the fact has not yet been ascertained by mathematical calculation) that the moon is far older than the Earth.\n\nImagine the six fellow-globes of the moon -- aeons before the first globe of our seven was evolved -- just in the same position in relation to each other as the fellow-globes of our chain occupy in regard to our Earth now.\n\n(See in \"Esoteric Buddhism,\" \"The Constitution of Man,\" and the \"Planetary Chain.\") And now it will be easy to imagine further Globe A of the lunar chain informing Globe A of the terrestrial chain, and -- dying; Globe B of the former sending after that its energy into Globe B of the new chain; then Globe C of the lunar, creating its progeny sphere C of the terrene chain; then the Moon (our Satellite*) pouring forth into [[Footnote(s)]] ------------------------------------------------- * She is the satellite, undeniably, but this does not invalidate the theory that she has given to the Earth all but her corpse.\n\nFor Darwin's theory to hold good, besides the hypothesis just upset (vide last footnote), other still more incongruous speculations had to be invented.\n\nThe Moon, it is said, has cooled nearly six times as rapidly as the Earth (Winchell's \"World-Life\"): \"The Moon, if the earth is 14,000,000 years old since its incrustation, is only eleven and two thirds millions of years old since that stage .\n\n.\n\n.\" etc.\n\nAnd if our Moon is but a splash from our Earth, why can no similar inference be established for the Moons of other planets?\n\nThe Astronomers \"do not know.\" Why should Venus and Mercury have no satellites, and by what, when they exist, were they formed?\n\nBecause, we say, science has only one key -- the key of matter -- to open the mysteries of nature withal, while occult philosophy has seven keys and explains that which science fails to see.\n\nMercury and Venus have no satellites but they had \"parents\" just as the earth had.\n\nBoth are far older than the Earth and, before the latter reaches her seventh Round, her mother Moon will have dissolved [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 156 THE SECRET DOCTRINE.\n\nthe lowest globe of our planetary ring -- Globe D, our Earth -- all its life, energy and powers; and, having transferred them to a new centre becoming virtually a dead planet , in which rotation has almost ceased since the birth of our globe.\n\nThe Moon is now the cold residual quantity, the shadow dragged after the new body, into which her living powers and \"principles\" are transfused.\n\nShe now is doomed for long ages to be ever pursuing the Earth, to be attracted by and to attract her progeny.\n\nCon stantly vampirised by her child, she revenges herself on it by soaking it through and through with the nefarious, invisible, and poisoned influence which emanates from the occult side of her nature.\n\nFor she is a dead , yet a living body.\n\nThe particles of her decaying corpse are full of active and destructive life, although the body which they had formed is soulless and lifeless.\n\nTherefore its emanations are at the same time beneficent and maleficent -- this circumstance finding its parallel on earth in the fact that the grass and plants are nowhere more juicy and thriving than on the graves; while at the same time it is the graveyard or corpse-emanations, which kill.\n\nAnd like all ghouls or vampires, the moon is the friend of the sorcerers and the foe of the unwary.\n\nFrom the archaic aeons and the later times of the witches of Thessaly, down to some of the present tantrikas of Bengal, her nature and properties were known to every Occultist, but have remained a closed book for physicists.\n\nSuch is the moon from the astronomical, geological, and physical standpoints.\n\nAs to her metaphysical and psychic nature it must remain an occult secret in this work, as it was in the volume on \"Esoteric Buddhism,\" notwithstanding the rather sanguine statement made therein on p.\n\n113 (5th edition) that \"there is not much mystery left now in the riddle of the eighth sphere.\" These are topics, indeed, \"on which the adepts are very reserved in their communications to uninitiated pupils,\" and since they have, moreover, never sanctioned or permitted any published speculations upon them, the less said the better.\n\nYet without treading upon the forbidden ground of the \"eighth sphere,\" it may be useful to state some additional facts with regard to ex-monads of the lunar chain -- the \"lunar ancestors\" -- as they play a [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] into thin air, as the \"Moons\" of the other planets have, or have not, as the case may be, since there are planets which have several moons -- a mystery again which no OEdipus of astronomy has solved.\n\n[[Vol.\n\n1, Page]] 157 OPINIONS DIFFER AND YET AGREE.\n\nleading part in the coming Anthropogenesis.\n\nThis brings us directly to the septenary constitution of man; and as some discussion has arisen of late about the best classification to be adopted for the division of the microcosmic entity, two systems are now appended with a view to facilitate comparison.\n\nThe subjoined short article is from the pen of Mr.\n\nT.\n\nSubba Row, a learned Vedantin scholar.\n\nHe prefers the Brahmanical division of the Raja Yoga, and from a metaphysical point of view he is quite right.\n\nBut, as it is a question of simple choice and expediency, we hold in this work to the \"time-honoured\" classification of the trans-Himalayan \"Arhat Esoteric School.\" The following table and its explanatory text are reprinted from the \"Theosophist\" of Madras, and they are also contained in \"Five Years of Theosophy\": -- SEPTENARY DIVISION IN DIFFERENT INDIAN SYSTEMS.\n\n\"We give below in a tabular form the classifications adopted by the Buddhist and Vedantic teachers of the principles of man: -- [[Footnote(s) to table]] * Kosa (kosha) is \"Sheath\" literally, the sheath of every principle.\n\n† \"Life.\" ‡ The astral body or Linga Sarira.\n\n§ Sthula-Upadhi, or basis of the principle.\n\n|| Buddhi.\n\n[[Vol.\n\n1, Page]] 158 THE SECRET DOCTRINE."


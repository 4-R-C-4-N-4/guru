body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n1 [[Vol.\n\n1, Page xvii]] INTRODUCTORY.\n\n------- \"Gently to hear, kindly to judge.\" -- S HAKESPEARE.\n\nS INCE the appearance of Theosophical literature in England, it has become customary to call its teachings \"Esoteric Buddhism.\" And, having become a habit -- as an old proverb based on daily experience has it -- \"Error runs down an inclined plane, while Truth has to laboriously climb its way up hill.\" Old truisms are often the wisest.\n\nThe human mind can hardly remain entirely free from bias, and decisive opinions are often formed before a thorough examination of a subject from all its aspects has been made.\n\nThis is said with reference to the prevailing double mistake ( a ) of limiting Theosophy to Buddhism: and ( b ) of confounding the tenets of the religious philosophy preached by Gautama, the Buddha, with the doctrines broadly outlined in \"Esoteric Buddhism.\" Any thing more erroneous than this could be hardly imagined.\n\nIt has enabled our enemies to find an effective weapon against theosophy; because, as an eminent Pali scholar very pointedly expressed it, there was in the volume named \"neither esotericism nor Buddhism.\" The esoteric truths, presented in Mr.\n\nSinnett's work, had ceased to be esoteric from the moment they were made public; nor did it contain the religion of Buddha, but simply a few tenets from a hitherto hidden teaching which are now supplemented by many more, enlarged and explained in the present volumes.\n\nBut even the latter, though giving out many fundamental tenets from the S ECRET D OCTRINE of the East, raise but a small corner of the dark veil.\n\nFor no one, not even the greatest living adept, would be permitted to, or could -- even if he would -- give out promiscuously, to a mocking, unbelieving world, that which has been so effectually concealed from it for long aeons and ages.\n\n\"Esoteric Buddhism\" was an excellent work with a very unfortunate [[Vol.\n\n1, Page]] xviii INTRODUCTORY.\n\ntitle, though it meant no more than does the title of this work, the \" S ECRET D OCTRINE.\" It proved unfortunate, because people are always in the habit of judging things by their appearance, rather than their meaning; and because the error has now become so universal, that even most of the Fellows of the Theosophical Society have fallen victims to the same misconception.\n\nFrom the first, however, protests were raised by Brahmins and others against the title; and, in justice to myself, I must add that \"Esoteric Buddhism\" was presented to me as a completed volume, and that I was entirely unaware of the manner in which the author intended to spell the word \"Budh-ism.\" This has to be laid directly at the door of those who, having been the first to bring the subject under public notice, neglected to point out the difference between \"Buddhism\" -- the religious system of ethics preached by the Lord Gautama, and named after his title of Buddha, \"the Enlightened\" -- and Budha, \"Wisdom,\" or knowledge ( Vidya ), the faculty of cognizing, from the Sanskrit root \"Budh,\" to know.\n\nWe theosophists of India are ourselves the real culprits, although, at the time, we did our best to correct the mistake.\n\n(See Theosophist, June, 1883.) To avoid this deplorable misnomer was easy; the spelling of the word had only to be altered, and by common consent both pronounced and written \"Budhism,\" instead of \"Buddhism.\" Nor is the latter term correctly spelt and pronounced, as it ought to be called, in English, Buddhaism, and its votaries \"Buddhaists.\" This explanation is absolutely necessary at the beginning of a work like this one.\n\nThe \"Wisdom Religion\" is the inheritance of all the nations, the world over, though the statement was made in \"Esoteric Buddhism\" ( Preface to the original Edition) that \"two years ago ( i.e.\n\n1883), neither I nor any other European living , knew the alphabet of the Science, here for the first time put into a scientific shape,\" etc.\n\nThis error must have crept in through inadvertence.\n\nFor the present writer knew all that which is \"divulged\" in \"Esoteric Buddhism\" -- and much more -- many years before it became her duty (in 1880) to impart a small portion of the Secret Doctrine to two European gentlemen, one of whom was the author of \"Esoteric Buddhism\"; and surely the present writer has the undoubted, though to her, rather equivocal, privilege of being a European, by birth and education.\n\nMoreover, a considerable part of the philosophy [[Vol.\n\n1, Page]] xix INTRODUCTORY.\n\nexpounded by Mr.\n\nSinnett was taught in America, even before Isis Unveiled was published, to two Europeans and to my colleague, Colonel H.\n\nS.\n\nOlcott.\n\nOf the three teachers the latter gentleman has had, the first was a Hungarian Initiate, the second an Egyptian, the third a Hindu.\n\nAs permitted, Colonel Olcott has given out some of this teaching in various ways; if the other two have not, it has been simply because they were not allowed: their time for public work having not yet come.\n\nBut for others it has, and the appearance of Mr.\n\nSinnett's several interesting books is a visible proof of the fact.\n\nIt is above everything important to keep in mind that no theosophical book acquires the least additional value from pretended authority.\n\nIn etymology Adi , and Adhi Budha, the one (or the First) and \"Supreme Wisdom\" is a term used by Aryasanga in his Secret treatises, and now by all the mystic Northern Buddhists.\n\nIt is a Sanskrit term, and an appellation given by the earliest Aryans to the Unknown deity; the word \"Brahma\" not being found in the Vedas and the early works.\n\nIt means the absolute Wisdom, and \"Adi-bhuta\" is translated \"the primeval uncreated cause of all\" by Fitzedward Hall.\n\nAEons of untold duration must have elapsed, before the epithet of Buddha was so humanized, so to speak, as to allow of the term being applied to mortals and finally appropriated to one whose unparalleled virtues and knowledge caused him to receive the title of the \"Buddha of Wisdom unmoved.\" Bodha means the innate possession of divine intellect or \"understanding\"; \"Buddha,\" the acquirement of it by personal efforts and merit; while Buddhi is the faculty of cognizing the channel through which divine knowledge reaches the \"Ego,\" the discernment of good and evil, \"divine conscience\" also; and \"Spiritual Soul,\" which is the vehicle of Atma."


body = "and its fourth commentary to find that the 3, 4 -- (7), and the thrice seven, or 1065, the number of Jehovah, is the number of the 21 Prajapati mentioned in the Mahabharata, or the three Sephrim (words in cipher or figures).\n\nAnd this comparison between the Creative Powers of Archaic philosophy and the anthropomorphic Creator of exoteric Judaism (since their esotericism shows its identity with the Secret Doctrine) will lead the student to perceive and discover that, in truth, Jehovah is but a lunar and [[Footnote(s)]] ------------------------------------------------- * In the \" Book Al-Chazari \" by Jehuda-ha-Levi, translated by Dr.\n\nD.\n\nCassell.\n\n[[Vol.\n\n2, Page]] 41 THE EMANATIONS OF AIN-SOPH.\n\n\"generation\" god.\n\n(See Book I, Part 2 , \" Deus Lunus.\n\n\") It is a fact well known to every conscientious student of the Kabala, that the deeper he dives into it, the more he feels convinced that unless the Kabala -- or what is left of it -- is read by the light of the Eastern esoteric philosophy, its study leads only to the discovery that, on the lines traced by exoteric Judaism and Christianity, the monotheism of both is nothing more exalted than ancient Astrolatry, now vindicated by modern Astronomy.\n\nThe Kabalists never cease to repeat that primal intelligence can never be understood.\n\nIt cannot be comprehended, nor can it be located, therefore it has to remain nameless and negative.\n\nHence the Ain-Soph -- the \"UNKNOWABLE\" and the \"UNNAMEABLE\" -- which, as it could not be made manifest, was conceived to emanate manifesting Powers.\n\nIt is then with its emanations alone that human intellect has to, and can deal.\n\nChristian theology, having rejected the doctrine of emanations and replaced them with direct, conscious creations of angels and the rest out of nothing, now finds itself hopelessly stranded between Supernaturalism, or miracle, and materialism.\n\nAn extra -cosmic god is fatal to philosophy, an intra -cosmic Deity -- i.e.\n\nSpirit and matter inseparable from each other -- is a philosophical necessity.\n\nSeparate them and that which is left is a gross superstition under a mask of emotionalism.\n\nBut why \"geometrize,\" as Plato has it, why represent these emanations under the form of an immense arithmetical table?\n\nThe question is well answered by the author just cited.\n\nHis remarks are quoted in Part II., § \" The Theogony of the Creative Gods.\n\n\" \"Mental perception,\" he says, \"to become physical perception, must have the Cosmic principle of light : and by this, our mental circle must become visible through light; or, for its complete manifestation, the Circle must be that of physical visibility, or Light itself.\n\nSuch conceptions, thus formulated, became the groundwork of the philosophy of the divine manifesting in the Universe.\" This is philosophy.\n\nIt is otherwise when we find the Rabbi in Al-Chazari saying that \"under s'ph-r is to be understood calculation and weighing of created bodies.\n\nFor the calculation, by means of which a body must be constructed in harmony or symmetry, by which it must be in construction rightly arranged and made to correspond to the object in design, consists at last in number, extension, mass, weight; co-ordinate relation of movements, then harmony of music, must consist altogether by number, that is (S'ph-r).\n\n.\n\n.\n\nBy Sippor (s'phor) is to be understood the words of Alhim whereunto joins or adapts itself the design of the frame or form of construction; for example, it was said 'Let Light be.' The work became as the WORDS were spoken, that is, as the numbers of the work came forth.\n\n.\n\n.\n\n.\n\n.\" This is materialising the Spiritual without scruple.\n\nBut the Kabala [[Vol.\n\n2, Page]] 42 THE SECRET DOCTRINE.\n\nwas not always so well adapted to anthropo-monotheistic conceptions.\n\nCompare this with any of the six schools of India.\n\nFor instance, in Kapila's \"Sankhya\" Philosophy, unless, allegorically speaking, Purusha mounts on the shoulders of Prakriti, the latter remains irrational, while the former remains inactive without her.\n\nTherefore Nature (in man) must become a compound of Spirit and Matter before he becomes what he is; and the Spirit latent in Matter must be awakened to life and consciousness gradually.\n\nThe Monad has to pass through its mineral, vegetable and animal forms, before the Light of the Logos is awakened in the animal man.\n\nTherefore, till then, the latter cannot be referred to as \"MAN,\" but has to be regarded as a Monad imprisoned in ever changing forms.\n\nEvolution, not creation, by means of WORDS is recognized in the philosophies of the East, even in their exoteric records.\n\nEx oriente lux .\n\nEven the name of the first man in the Mosaic Bible had its origin in India, Professor Max Muller's negation notwithstanding.\n\nThe Jews got their Adam from Chaldea; and Adam-Adami is a compound word and therefore a manifold symbol, and proves the occult dogmas.\n\nThis is no place for philological disquisitions.\n\nBut the reader may be reminded that the words Ad and Adi mean in Sanskrit \"the first\"; in Aramaean, \"One\" ( Ad-ad, \"the only one\"); in Assyrian, \"father\" whence Ak-Ad or \"father-creator.\"* And once the statement is found correct it becomes rather difficult to confine Adam to the Mosaic Bible alone, and to see therein simply a Jewish name.\n\nVide Part II.\n\nof this Volume, § \"Adam-Adami.\" There is frequent confusion in the attributes and genealogies of the gods in their theogonies, as given to the world by the half-initiated writers, Brahmanical and Biblical, the Alpha and the Omega of the records of that symbolical science.\n\nYet there could be no such confusion made by the earliest nations, the descendants and pupils of the divine instructors: for both the attributes and the genealogies were inseparably linked with cosmogonical symbols, the \"gods\" being the life and animating \"soul-principle\" of the various regions of the Universe.\n\nNowhere and by no people was speculation allowed to range beyond those manifested gods.\n\nThe boundless and infinite UNITY remained with every nation a virgin forbidden soil, untrodden by man's thought, [[Footnote(s)]] ------------------------------------------------- * The appellation Ak-ad (or Akkadians) is of the same class as Ad-m, Ha-va (Eve), AEd-en (Eden); Ak-Ad meaning \"Son of Ad \" (like the sons of Ad in Ancient Arabia).\n\nAd-ad, the \"Only One\" and the First, was the Ad-on or \"Lord\" of Syria and consort of Ad-ar-gat or Aster't, the Syrian goddess.\n\nAnd Gan-AEden (Eden) or Gandunia was Babylonia and Mesopotamia."


body = "de Quatrefages, there is proof that since the post-tertiary period and even before that time -- since many Races were already scattered during that age on the face of the Earth -- man has not altered one iota in his physical structure.\n\nAnd if, surrounded for ages by a fauna that altered from one period or cycle to another, which died out, which was reborn in other forms -- so that now there does not exist one single animal on Earth, large or small, contemporary with the man of that period -- if, then, every animal has been transformed save man himself, this fact goes to prove not only his antiquity, but that he is a distinct Kingdom.\n\nWhy should he alone have escaped transformation?\n\nBecause, says de Quatrefages, the weapon used by him, in his struggle with nature and the ever-changing geological conditions and elements, was \"his psychic force, not his physical strength or body ,\" as in the case of animals.\n\nGive man only that dose of intelligence and reason with which other mammalia are endowed, and with his present bodily organization he will show himself the most helpless of creatures of Earth.\n\nAnd as everything goes to prove that the human organism with all its characteristics, peculiarities and idiosyncrasies existed already on our Globe in those far distant geological periods when there was not yet one single specimen of the now-existing forms of mammalia , what is the unavoidable conclusion?\n\nWhy this: Since all the human races are of one and the same species, it follows that this species is the most ancient of all the now-living mammalia.\n\nTherefore it is the most stable and persevering of all, and was already as fully developed as it is now when all the other mammalia now known had not made even their first approach to appearance on this Earth.\n\nSuch is the opinion of the great French Naturalist, who gives thereby a terrible blow to Darwinism.\n\n[[Vol.\n\n2, Page]] 57 THE \"DOUBLE DRAGON.\" 7.\n\nD ISPLEASED THEY WERE.\n\nO UR FLESH IS NOT THERE ( they said ) .\n\nT HIS IS NO FIT RUPA FOR OUR BROTHERS OF THE FIFTH.\n\nN O DWELLINGS FOR THE LIVES.* P URE WATERS, NOT TURBID, THEY MUST DRINK ( a ).\n\nL ET US DRY THEM ( the waters ) .\n\n( a ) Says the Catechism (Commentaries): -- \" It is from the material Worlds that descend they, who fashion physical man at the new Manvantaras.\n\nThey are inferior Lha ( Spirits ) , possessed of a dual body (an astral within an ethereal form).\n\nThey are the fashioners and creators of our body of illusion .\" .\n\n.\n\n.\n\n.\n\n\" Into the forms projected by the Lha (Pitris) the two letters** (the Monad, called also 'the Double Dragon') descend from the spheres of expectation.*** But they are like a roof with no walls, nor pillars to rest upon .\" .\n\n.\n\n.\n\n.\n\n\" Man needs four flames and three fires to become one on Earth, and he requires the essence of the forty-nine fires**** to be perfect.\n\nIt is those who have deserted the Superior Spheres, the Gods of Will,***** who complete the Manu of illusion.\n\nFor the ' Double Dragon ' has no hold upon the mere form.\n\nIt is like the breeze where there is no tree or branch to receive and harbour it.\n\nIt cannot affect the form where there is no agent of transmission (Manas, \"Mind\") and the form knows it not.\n\n\" \" In the highest worlds, the three are one,****** on Earth ( at first ) the one becomes two.\n\nThey are like the two ( side ) lines of a triangle that has lost its bottom line -- which is the third fire.\n\n\" (Catechism Book III ., sec.\n\n9.) Now this requires some explanation before proceeding any further.\n\nTo do so especially for the benefit of our Aryan Hindu brethren -- [[Footnote(s)]] ------------------------------------------------- * The Monads of the presentments of men of the Third Round, the huge Ape-like forms.\n\n** In the esoteric system the seven principles in man are represented by seven letters.\n\nThe first two are more sacred than the four letters of the Tetragrammaton.\n\n*** The intermediate spheres, wherein the Monads, which have not reached Nirvana, are said to slumber in unconscious inactivity between the Manvantaras.\n\n**** Explained elsewhere.\n\nThe \"Three Fires,\" Pavaka, Pavamana, and Suchi, who had forty-five sons, who, with their three fathers and their Father Agni, constitute the 49 fires.\n\nPavamana (fire produced by friction) is the parent of the fire of the Asuras; Suchi (Solar fire) is the parent of the fire of the gods; and Pavaka (electric fire) is the father of the fire of the Pitris (See Vayu Purana ).\n\nBut this is an explanation on the material and the terrestrial plane.\n\nThe flames are evanescent and only periodical; the fires -- eternal in their triple unity.\n\nThey correspond to the four lower, and the three higher human principles.\n\n***** The Suras, who become later the A-Suras.\n\n****** Atma, Buddhi and Manas.\n\nIn Devachan the higher element of the Manas is needed to make it a state of perception and consciousness for the disembodied Monad .\n\n[[Vol.\n\n2, Page]] 58 THE SECRET DOCTRINE.\n\nwhose esoteric interpretations may differ from our own -- we shall have to explain to them the foregoing by certain passages in their own exoteric books, namely, the Puranas.\n\nIn the allegories of the latter, Brahma, who is collectively the creative Force of the Universe, is said to be \"at the beginning of the Yugas (cycles) .\n\n.\n\n.\n\n.\n\nPossessed of the desire and of the power to create, and, impelled by the potencies of what is to be created, again and again does he, at the outset of a Kalpa, put forth a similar creation,\" (see Vishnu Purana, Book I.\n\nch.\n\nV., closing Sloka.\n\nAlso \" Manava Dharma Shastra \" I.\n\n30.) It is now proposed to examine the exoteric account in the Vishnu Purana, and see how much it may agree or disagree with our occult version.\n\n------- C REATION OF D IVINE B EINGS IN THE E XOTERIC A CCOUNTS.\n\nIn the Vishnu Purana -- which is certainly the earliest of all the scriptures of that name -- we find, as in all the others, Brahma assuming as the male God, for purposes of creation, \" four bodies invested by three qualities.\n\n\" * It is said: \"In this manner, Maitreya, Jyotsna (dawn), Ratri (night) , Ahan (day), and Sandhya (evening twilight) are the four bodies of Brahma\" .\n\n.\n\n(p.\n\n81, Vol.\n\nI., Wilson's translation)."


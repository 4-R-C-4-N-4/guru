body = "The Secret Doctrine by H.\n\nP.\n\nBlavatsky -- Vol.\n\n1 [[Vol.\n\n1, Page]] 460 [[This page continued from previous section ]] § XIV.\n\nTHE FOUR ELEMENTS.\n\nM ETAPHYSICALLY and esoterically there is but One E LEMENT in nature, and at the root of it is the Deity; and the so-called seven elements, of which five have already manifested and asserted their existence, are the garment, the veil , of that deity; direct from the essence whereof comes M AN, whether physically, psychically, mentally or spiritually considered.\n\nFour elements only are generally spoken of in later antiquity, five admitted only in philosophy.\n\nFor the body of ether is not fully manifested yet, and its noumenon is still \"the Omnipotent Father -- AEther, the synthesis of the rest.\" But what are these \" E LEMENTS\" whose compound bodies have now been discovered by Chemistry and Physics to contain numberless sub-elements, even the sixty or seventy of which no longer embrace the whole number suspected.\n\n(Vide Addenda , §§ XI.\n\nand XII ., quotations from Mr.\n\nCrookes' Lectures.) Let us follow their evolution from the historical beginnings, at any rate.\n\nThe four Elements were fully characterized by Plato when he said that they were that \"which composes and decomposes the compound bodies.\n\n\" [[Vol.\n\n1, Page]] 461 ON THE ELEMENTS.\n\nHence Cosmolatry was never, even in its worst aspect, the fetishism which adores or worships the passive external form and matter of any object, but looked ever to the noumenon therein.\n\nFire, Air, Water, Earth, were but the visible garb, the symbols of the informing, invisible Souls or Spirits -- the Cosmic gods to whom worship was offered by the ignorant, and simple, respectful recognition by the wiser.\n\nIn their turn the phenomenal subdivisions of the noumenal Elements were informed by the Elementals, so called, the \"Nature Spirits\" of lower grades.\n\nIn the Theogony of Mochus, we find Ether first, and then the air; the two principles from which Ulom the intelligible ([[ noetos ]]) God (the visible universe of matter) is born.* In the Orphic hymns, the Eros-Phanes evolves from the Spiritual Egg, which the AEthereal winds impregnate, Wind being \"the Spirit of God,\" who is said to move in AEther, \"brooding over the chaos\" -- the Divine \"Idea.\" In the Hindu Katakopanisad , Purusha, the Divine Spirit, already stands before the original matter, from whose union springs the great Soul of the World, \"Maha = Atma, Brahm, the Spirit of Life;\"** these latter appellations being again identical with the Universal Soul, or Anima Mundi , the Astral Light of the Theurgists and Kabalists, being its last and lowest division.\" The [[ stoicheia ]] (Elements) of Plato and Aristotle, were thus the incorporeal principles attached to the four great divisions of our Cosmic World, and it is with justice that Creuzer defines those primitive beliefs .\n\n.\n\n.\n\nas a species of magism , a psychic paganism , and a deification of potencies ; a spiritualization which placed the believers in a close community with these potencies,\" (Book IX, p.\n\n850).\n\nSo close, indeed, that the hierarchies of those potencies or Forces have been classified on a graduated scale of seven from the ponderable to the imponderable.\n\nThey are Septenary, -- not as an artificial aid to facilitate their comprehension -- but in their real Cosmic gradation, from their chemical (or physical) to their purely spiritual composition.\n\nGods -- with the ignorant masses -- gods independent and supreme; daemons with the fanatics, who, intellectual as they often may be, are unable to understand the Spirit of the philosophical sentence, in pluribus unum.\n\nWith the hermetic philosopher they are FORCES relatively \" blind ,\" or \" intelligent ,\" according to which of the principles in them he deals with.\n\nIt required long millenniums before they found themselves, in our cultured age, finally degraded into simple chemical elements.\n\nAt any rate, good Christians, and especially the Biblical Protestants, [[Footnote(s)]] ------------------------------------------------- * Movers: \"Phoinizer,\" 282.\n\n** Weber: \"Akad.\n\nVorles,\" 213, 214, etc.\n\n[[Vol.\n\n1, Page]] 462 THE SECRET DOCTRINE.\n\nought to show more reverence for the four Elements, if they would show any for Moses.\n\nFor the Bible manifests the consideration and mystic significance in which they were held by the Hebrew Lawgiver, on every page of the Pentateuch.\n\nThe tent which contained the Holy of Holies \" was a Cosmic Symbol, sacred, in one of its meanings, to the Elements, the four cardinal points, and E THER.\n\nJosephus shows it built in white, the colour of Ether.\n\nAnd this explains also why, in the Egyptian and the Hebrew temples -- according to Clemens Alexandrinus -- a gigantic curtain, supported by five pillars, separated the sanctum sanctorum (now represented by the altar in Christian churches) wherein the priests alone were permitted to enter, from the part accessible to the profane.\n\nBy its four colours the curtain symbolized the four principal Elements, and signified the knowledge of the divine that the five senses of men can enable man to acquire with the help of the four Elements.\n\n(See Stromata I., v.\n\n§ 6).\n\nIn Cory's Ancient Fragments , one of the \"Chaldean Oracles\" expresses ideas about the elements and Ether in language singularly like that of the Unseen Universe , written by two eminent scientists of our day.\n\nIt states that \"from ether have come all things, and to it all will return; that the images of all things are indelibly impressed upon it; and that it is the store-house of the germs or of the remains of all visible forms, and even ideas.\n\nIt appears as if this case strangely corroborates our assertion that whatever discoveries may be made in our days will be found to have been anticipated by many thousand years by our 'simple-minded ancestors.' \" -- ( Isis Unveiled.\n\n) Whence came the four elements and the malachim of the Hebrews?\n\nThey have been made to merge, by a theological sleight-of-hand on the part of the Rabbins and the later Fathers of the Church into Jehovah, but their origin is identical with that of the Cosmic gods of all other nations.\n\nTheir symbols, whether born on the shores of the Oxus, on the burning sands of Upper Egypt, or in the wild forests, weird and glacial, which cover the slopes and peaks of the sacred snowy mountains of Thessaly, or again, in the pampas of America, their symbols, we repeat, when traced to their source, are ever one and the same."


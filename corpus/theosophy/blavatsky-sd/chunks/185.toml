body = ", 10.)* Besides which the Hebrew sacred name of God applied to this letter M is Meborach , the \"Holy\" or the \"Blessed,\" and the name for the water of the Flood is M ' bul.\n\nA reminder of the \" three Maries\" at the Crucifixion and their connection with Mar , the Sea, or Water , may close this example.\n\nThis is why in Judaism and Christianity the Messiah is always connected with Water, Baptism, the Fishes (the sign of the Zodiac called Meenam in Sanskrit), and even with the Matsya (fish) Avatar, and the Lotus -- the symbol of the womb, or the water-lily, which is the same.\n\nIn the relics of ancient Egypt, the greater the antiquity of the votive symbols and emblems of the objects exhumed, the oftener are the lotus flowers and the water found in connection with the Solar Gods.\n\nThe god Khnoom -- the moist power -- water, as Thales taught it, being the principle of all things, sits on a throne enshrined in a lotus (Saitic epoch, Serapeum ) .\n\nThe god Bes stands on a lotus, ready to devour his progeny.\n\n( Ibid , Abydos.) Thot, the god of mystery and Wisdom, the sacred Scribe of Amenti, wearing the Solar disc as head gear, sits with a bull's head (the sacred bull of Mendes being a form of Thot) and a human body, on a full blown lotus.\n\n( IVth Dynasty.\n\n) Finally it is the goddess Hiquet , under her shape of a frog, who rests on the lotus, thus showing her connection with water.\n\nAnd it is this frog-symbol, undeniably the most ancient of their Egyptian deities, from whose unpoetical shape the Egyptologists have been vainly trying to unravel her mystery and functions.\n\nIts adoption in the Church by the early Christians shows that they knew it better than our modern Orientalists.\n\nThe \"frog or toad goddess\" was one of the chief cosmic deities connected with creation, on account of her amphibious nature, and chiefly because of her apparent resurrection, after long ages of solitary life enshrined in old walls, in rocks, etc.\n\nShe not only participated in the organization of the world, together with Khnoom , but was also connected with the [[Footnote(s)]] ------------------------------------------------- * Even to the seven daughters of the Midian priest, who, coming to draw the water , had Moses water their flock, for which service the Midian gives to Moses Zipporah ( sippara = the shining wave) as wife ( Exod.\n\nii.\n\n) All this has the same secret meaning.\n\n[[Vol.\n\n1, Page]] 386 THE SECRET DOCTRINE.\n\ndogma of resurrection.\n\n* There must have been some very profound and sacred meaning attached to this symbol, since, notwithstanding the risk of being charged with a disgusting form of zoolatry, the early Egyptian Christians adopted it in their Churches.\n\nA frog or toad enshrined in a lotus flower, or simply without the latter emblem, was the form chosen for the Church lamps , on which were engraved the words \"I am the resurrection\" \"[[ ego eimi anastasis ]].\"** These frog goddesses are also found on all the mummies.\n\n------------- [[This page continued in next section]] [[Footnote(s)]] ------------------------------------------------- * With the Egyptians it was the resurrection in rebirth after 3,000 years of purification, either in Devachan or \"the fields of bliss.\" ** Such \"frog-goddesses\" may be seen at Bulaq, in the Cairo Museum.\n\nFor the statement about the Church lamps and inscriptions it is the learned ex-director of the Bulaq Museum, Mr.\n\nGaston Maspero, who must be held responsible.\n\n( See his \" Guide du Visiteur au Musee de Bulaq ,\" p.\n\n146.) Next Chapter Contents"


body = "He made Adam, the a-sexual, spring suddenly from the clay, as it is called in the Bible, the Blastema of Science.\n\n\"It is from this larval form of mankind that the evolutive force effected the completion of species.\n\nFor the accomplishment of this great phenomenon, Adam had to pass through a phase of immobility and unconsciousness, very analogous to the nymphal state of animals undergoing metamorphosis,\" explains Naudin.\n\nFor the eminent botanist, Adam was not one man, however, but mankind, \"which remained concealed within a temporary organism .\n\n.\n\n.\n\n.\n\ndistinct from all others and never contracting alliance with any of these.\" He shows the differentiation of sexes accomplished by \"a process of germination similar to that of Medusae and Ascidians.\" Mankind, thus constituted physiologically, \"would retain a sufficient evolutive force for the rapid production of the various great human races.\" De Quatrefages criticises this position in the \" Human Species.\n\n\" It is unscientific, he says, or, properly speaking, Naudin's ideas \"do not form a scientific theory,\" inasmuch as primordial Blastema is connected [[Vol.\n\n2, Page]] 120 THE SECRET DOCTRINE.\n\nin his theory with the First Cause, which is credited with having made potentially in the Blastema all past, present, and future beings, and thus of having in reality created these beings en masse ; moreover, Naudin does not even consider the secondary Causes, or their action in this evolution of the organic world.\n\nScience, which is only occupied with Secondary Causes, has thus \"nothing to say to the theory of Naudin\" ( p .\n\n125).\n\nNor will it have any more to say to the occult teachings, which are to some extent approached by Naudin.\n\nFor if we but see in his \"primordial Blastema\" the Dhyan-Chohanic essence, the Chhaya or double of the Pitris, which contains within itself the potentiality of all forms, we are quite in accord.\n\nBut there are two real and vital differences between our teachings.\n\nM.\n\nNaudin declares that evolution has progressed by sudden leaps and bounds, instead of extending slowly over millions of years; and his primordial Blastema is endowed only with blind instincts -- a kind of unconscious First Cause in the manifested Kosmos -- which is an absurdity.\n\nWhereas it is our Dhyan Chohanic essence -- the causality of the primal cause which creates physical man -- which is the living, active and potential matter, pregnant per se with that animal consciousness of a superior kind, such as is found in the ant and the beaver, which produces the long series of physiological differentiations.\n\nApart from this his \"ancient and general process of creation \" from proto-organisms is as occult as any theory of Paracelsus or Khunrath could be.\n\nMoreover, the Kabalistic works are full of the proof of this.\n\nThe Zohar, for instance, says that every type in the visible has its prototype in the invisible Universe.\n\n\"All that which is in the lower (our) world is found in the upper.\n\nThe Lower and the Upper act and react upon each other.\" ( Zohar, fol.\n\n186.) Vide infra, Part II., \" Esoteric Tenets corroborated in every Scripture.\n\n\" ------- 20.\n\nT HEIR F ATHERS WERE THE SELF-BORN.\n\nT HE SELF-BORN, THE C HHAYA FROM THE BRILLIANT BODIES OF THE L ORDS, THE F ATHERS, THE S ONS OF T WILIGHT ( a ).\n\n( a ) The \"shadows,\" or Chhayas, are called the sons of the \"self-born,\" as the latter name is applied to all the gods and Beings born through the WILL, whether of Deity or Adept.\n\nThe Homunculi of Paracelsus would, perhaps, be also given this name, though the latter process is on a far more material plane.\n\nThe name \"Sons of Twilight\" shows that the \"Self-born\" progenitors of our doctrine are identical with the Pitris [[Vol.\n\n2, Page]] 121 LEDA, CASTOR AND POLLUX.\n\nof the Brahmanical system, as the title is a reference to their mode of birth, these Pitris being stated to have issued from Brahma's \"body of twilight.\" ( See the Puranas.\n\n) ------- 21.\n\nW HEN THE RACE BECAME OLD, THE OLD WATERS MIXED WITH THE FRESHER WATERS ( a ); WHEN THE DROPS BECAME TURBID, THEY VANISHED AND DISAPPEARED, IN THE NEW STREAM, IN THE HOT STREAM OF LIFE.\n\nT HE OUTER OF THE FIRST BECAME THE INNER OF THE SECOND.\n\n( b ).\n\nT HE OLD WING BECAME THE SHADOW, AND THE SHADOW OF THE WING ( c ) .\n\n( a ) The old (primitive) Race merged in the second race, and became one with it.\n\n( b ) This is the mysterious process of transformation and evolution of mankind.\n\nThe material of the first forms -- shadowy, ethereal, and negative -- was drawn or absorbed into, and thus became the complement of the forms of the Second Race.\n\nThe Commentary explains this by saying that, as the First Race was simply composed of the astral shadows of the creative progenitors, having of course neither astral nor physical bodies of their own -- this Race never died.\n\nIts \"men\" melted gradually away, becoming absorbed in the bodies of their own \"sweat-born\" progeny, more solid than their own.\n\nThe old form vanished and was absorbed by, disappeared in, the new form, more human and physical.\n\nThere was no death in those days of a period more blissful than the Golden Age; but the first, or parent material was used for the formation of the new being, to form the body and even the inner or lower principles or bodies of the progeny.\n\n( c ) When the shadow retires, i.e.\n\nwhen the astral body becomes covered with more solid flesh, man develops a physical body.\n\nThe \"wing,\" or the ethereal form that produced its shadow and image, became the shadow of the astral body and its own progeny.\n\nThe expression is queer but original.\n\nAs there may be no occasion to refer to this mystery later, it is as well to point out at once the dual meaning contained in the Greek myth bearing upon this particular phase of evolution.\n\nIt is found in the several variants of the allegory of Leda and her two sons Castor and Pollux, which variants have each a special meaning.\n\nThus in Book XI .\n\nof the Odyssey, Leda is spoken of as the spouse of Tyndarus, who gave birth by her husband \"to two sons of valiant heart\" -- Castor [[Vol.\n\n2, Page]] 122 THE SECRET DOCTRINE.\n\nand Pollux.\n\nJupiter endows them with a marvellous gift and privilege.\n\nThey are semi-immortal; they live and die, each in turn, and every alternate day; [[ eteremeroi *]]."


[content]
body = "They know that almost all the planetary worlds are inhabited, but can have access to -- even in spirit -- only those of our system; and they are also aware how difficult it is, even for them, to put themselves into full rapport even with the planes of consciousness within our system, but differing from the states of consciousness possible on this globe; i.e.\n\n, on the three planes of the chain of spheres beyond our earth.\n\nSuch knowledge and intercourse are possible to them because they have learned how to penetrate to planes of consciousness which are closed to the perceptions of ordinary men; but were they to communicate their knowledge, the world would be no wiser, because it lacks that experience of other forms of perception which alone could enable them to grasp what was told them.\n\nStill the fact remains that most of the planets, as the stars beyond our system, are inhabited, a fact which has been admitted by the men of science themselves.\n\nLaplace and Herschell believed it, though they wisely abstained from imprudent speculation; and the same conclusion has been worked out and supported with an array of scientific considerations by C.\n\nFlammarion, the well-known French Astronomer.\n\nThe arguments he brings forward are strictly scientific, and such as to appeal even to a materialistic mind, which would remain unmoved by such thoughts as those of Sir David Brewster, the famous physicist, who writes: -- \"Those 'barren spirits' or 'base souls,' as the poet calls them, who might be led to believe that the Earth is the only inhabited body in the universe, would have no difficulty in conceiving the earth also to [[Vol.\n\n2, Page]] 702 THE SECRET DOCTRINE.\n\nhave been destitute of inhabitants.\n\nWhat is more, if such minds were acquainted with the deductions of geology, they would admit that it was uninhabited for myriads of years; and here we come to the impossible conclusion that during these myriads of years there was not a single intelligent creature in the vast domains of the Universal King, and that before the protozoic formations there existed neither plant nor animal in all the infinity of space\"!* Flammarion shows, in addition, that all the conditions of life -- even as we know it -- are present on some at least of the planets, and points to the fact that these conditions must be much more favourable on them than they are on our Earth.\n\nThus scientific reasoning, as well as observed facts, concur with the statements of the seer and the innate voice in man's own heart in declaring that life -- intelligent, conscious life -- must exist on other worlds than ours.\n\nBut this is the limit beyond which the ordinary faculties of man cannot carry him.\n\nMany are the romances and tales, some purely fanciful, others bristling with scientific knowledge, which have attempted to imagine and describe life on other globes.\n\nBut one and all, they give but some distorted copy of the drama of life around us.\n\nIt is either, with Voltaire, the men of our own race under a microscope, or, with de Bergerac, a graceful play of fancy and satire; but we always find that at bottom the new world is but the one we ourselves live in.\n\nSo strong is this tendency that even great natural, though non-initiated seers, when untrained, fall a victim to it; witness Swedenborg, who goes so far as to dress the inhabitants of Mercury, whom he meets with in the spirit-world, in clothes such as are worn in Europe.\n\nCommenting on this tendency, Flammarion in his work \" Sur la Pluralite des Mondes habites, \" says: -- \"It seems as if in the eyes of those authors who have written on this subject, the Earth were the type of the Universe, and the Man of Earth, the type of the inhabitants of the heavens.\n\nIt is, on the contrary, much more probable, that, since the nature of other planets is essentially varied, and the surroundings and conditions of existence essentially different, while the forces which preside over the creation of beings and the substances which enter into their mutual constitution are essentially distinct, it would follow that our mode of existence cannot be regarded as in any way applicable to other globes.\n\n[[Footnote(s)]] ------------------------------------------------- * Since no single atom in the entire Kosmos is without life and consciousness, how much more then its mighty globes?\n\n-- though they remain sealed books to us men who can hardly enter even into the consciousness of the forms of life nearest us?\n\nWe do not know ourselves, then how can we, if we have never been trained to it and initiated, fancy that we can penetrate the consciousness of the smallest of the animals around us?\n\n[[Vol.\n\n2, Page]] 703 WORLDS MENTIONED IN THE BIBLE.\n\nThose who have written on this subject have allowed themselves to be dominated by terrestrial ideas, and fell therefore into error.\" (\" Pluralite des Mondes, \" p.\n\n439.) But Flammarion himself falls into the very error which he here condemns, for he tacitly takes the conditions of life on earth as the standard by which to determine the degree to which other planets are adapted for habitation by \"other Humanities.\" Let us, however, leave these profitless and empty speculations, which, though they seem to fill our hearts with a glow of enthusiasm and to enlarge our mental and spiritual grasp, do but in reality cause a factitious stimulation, and blind us more and more to our ignorance not only of the world we inhabit, but even of the infinitude contained within ourselves.\n\nWhen, therefore, we find in the Bibles of Humanity \"other worlds\" spoken of, we may safely conclude that they not only refer to other states of our planetary chain and Earth, but also to other inhabited globes -- stars and planets; withal, that the latter were never speculated upon.\n\nThe whole of antiquity believed in the Universality of life.\n\nBut no really initiated seer of any civilized nation has ever taught that life on other stars could be judged by the standard of terrestrial life.\n\nThat which is generally meant by \"earths\" and worlds, relates ( a ) to the \"rebirths\" of our globe after each manvantara and a long period of \"obscuration\"; and ( b ) to the periodical and entire changes of the Earth's surface, when Continents disappear, to make room for Oceans, and Oceans and Seas are violently displaced and sent rolling to the poles, to cede their emplacements to new Continents.\n\nWe may begin with the Bible -- the youngest of the World-Scriptures.\n\nIn Ecclesiastes, chap.\n\ni., we read these words of the King-Initiate: -- \" One generation passeth away and another generation cometh, but the earth abideth for ever, \" and again, \"The thing that hath been, it is that which shall be; and that which is done, is that which shall be done, and there is no new thing under the sun.\" Under these words it is not easy to see the reference to the successive cataclysms by which the Races of mankind are swept away, or, going further back, to the various transitions of the globe during the process of its formation."


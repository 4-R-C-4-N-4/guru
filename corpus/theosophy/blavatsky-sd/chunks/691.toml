[content]
body = "And yet what do we find: -- \"It is significant,\" says Sir W.\n\nDawson, F.R.S.\n\n, \"that Professor Huxley in his lectures in New York, while resting his case as to the lower animals, mainly on the supposed genealogy of the horse, which has often been shown to amount to no certain evidence, avoided altogether the discussion of the origin of men from the apes, now obviously complicated with so many difficulties that both Wallace and Mivart are staggered by them.\n\nProfessor Thomas in his recent lectures ('Nature,' 1876), admits that there is no lower man known than the Australian, and that there is no known link of connection with the monkeys; and that Haeckel has to admit that the penultimate link in his phylogeny, the ape-like man, is absolutely unknown (' History of Creation.\n\n') .\n\n.\n\n.\n\n.\n\nThe so-called ' tallies ' found with the bones of Palaeocosmic men in European caves, and illustrated in the admirable works of Christy and Lartet, show that the rudiments even of writings were already in possession of the oldest race of men known to archaeology or geology.\" (See Wilson's \" Prehistoric Man, \" op.\n\ncit., vol.\n\nii., p.\n\n54.\n\n\" Origin of the World, \" p.\n\n393.) Again in Dr.\n\nC.\n\nR.\n\nBree's \" Fallacies of Darwinism, \" on page 160, we read: -- \"Mr.\n\nDarwin justly says that the difference physically and, more especially mentally, between the lowest form of man and the highest anthropomorphous ape, is enormous.\n\nTherefore, the time -- which in Darwinian evolution must be almost inconceivably slow -- must have been enormous also during man's development from the monkey.* The chance, therefore, of some of these variations being found in the different gravels or fresh-water formations above the tertiaries, must be very great.\n\nAnd yet not one single variation, not one single specimen of a being between a monkey and a man has ever been found.\n\nNeither in the gravel, nor the drift-clay, nor the fresh-water beds, nor in the tertiaries below them has there ever been discovered the remains of any member of the missing families between the monkey and the man, as assumed to have existed by Mr.\n\nDarwin.\n\nHave they gone down with the depression of the earth's surface and are they now covered with the sea?\n\nIf so, it is beyond all probability that they should not, also be found in those beds of contemporary geological strata which have not gone down to the bottom of the sea; still more improbable that some portions should not be dredged from the ocean bed like the remains of the mammoth and the rhinoceros which are also found in fresh-water beds and gravels and drift!\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\nthe celebrated Neanderthal skull, about which so much has been said, belongs confessedly to this remote epoch (bronze and stone ages), and yet presents, although it may have been the skull of an idiot, immense differences from the highest known anthropomorphous ape.\" [[Footnote(s)]] ------------------------------------------------- * And how much more \"enormous\" if we reverse the subjects and say during the monkey's development from the Third Race Man.\n\n[[Vol.\n\n2, Page]] 730 THE SECRET DOCTRINE.\n\nOur globe being convulsed each time that it reawakens for a new period of activity, like a field which has to be ploughed and furrowed before fresh seed for its new crop is thrown into it -- it does seem quite hopeless that fossils belonging to its previous Rounds should be found in the beds of either its oldest or its latest geological strata.\n\nEvery new Manvantara brings along with it the renovation of forms, types and species; every type of the preceding organic forms -- vegetable, animal and human -- changes and is perfected in the next, even to the mineral, which has received in this Round its final opacity and hardness; its softer portions having formed the present vegetation; the astral relics of previous vegetation and fauna having been utilized in the formation of the lower animals, and determining the structure of the primeval Root-Types of the highest mammalia.\n\nAnd, finally, the form of the gigantic Ape-Man of the former Round has been reproduced in this one by human bestiality and transfigured into the parent form in the modern Anthropoid.\n\nThis doctrine, even imperfectly delineated as it is under our inefficient pen, is assuredly more logical, more consistent with facts, and far more probable than many \"scientific\" theories; that, for instance, of the first organic germ descending on a meteor to our Earth -- like Ain Soph on his Vehicle, Adam Kadmon.\n\nOnly, the latter descent is allegorical, as every one knows, and the Kabalists have never offered this figure of speech for acceptance in its dead-letter garb.\n\nBut the germ on the meteor theory, as coming from such high scientific quarters, is an eligible candidate for axiomatic truth and law, a theory people are in honour bound to accept, if they would be on a right level with modern Science.\n\nWhat the next theory necessitated by the materialistic premises will be -- no one can tell.\n\nMeanwhile, the present theories, as any one can see, clash together far more discordantly among themselves than even those of the Occultists outside the sacred precincts of learning.\n\nFor what is there, next in order, now that exact Science has made even of the Life-principle an empty word, a meaningless term; and now insists that life is an effect due to the molecular action of the primordial protoplasm!\n\nThe new doctrine of the Darwinists may be defined and summarized in a few words, in which Mr.\n\nHerbert Spencer has defined \"special creation\" .\n\n.\n\n.\n\n\"it is worthless.\n\nWorthless, by its derivation; worthless, in its intrinsic incoherence; worthless, as absolutely without evidence; worthless, as not supplying an intellectual need; worthless, as not satisfying a moral want.\n\nWe must, therefore, consider it as counting for nothing in opposition to any other hypothesis respecting the origin of organic beings.\n\n\" ( Principles of Biology, Vol.\n\nI., p.\n\n345.)"


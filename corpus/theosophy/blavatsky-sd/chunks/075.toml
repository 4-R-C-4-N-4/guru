[content]
body = "Crookes, F.R.S ., to admit that Science is yet a thousand leagues from the knowledge of the compound nature of the simplest molecule.\n\nFrom him we learn that such a thing as a really simple [[Footnote continued on next page]] [[Vol.\n\n1, Page]] 141 WERE THE ANCIENTS IGNORANT OF THE PHYSICAL SCIENCES?\n\nment; as, at any rate, their initiated philosophers can hardly come under such an imputation, since it is they who have invented allegories and religious myths from the beginning.\n\nHad they been ignorant of the Heterogeneity of their Elements they would have had no personifications of Fire, Air, Water, Earth, and AEther; their Cosmic gods and goddesses would never have been blessed with such posterity, with so many sons and daughters, elements born from and within each respective Element .\n\nAlchemy and occult phenomena would have been a delusion and a snare, even in theory, had the Ancients been ignorant of the potentialities and correlative functions and attributes of every element that enters into the composition of Air, Water, Earth, and even Fire -- the latter a terra incognita to this day to modern Science, which is obliged to call it Motion, evolution of light and heat, state of ignition, -- defining it by its outward aspects in short, and remaining ignorant of its nature.\n\nBut that which [[Footnote(s)]] ------------------------------------------------- [[Footnote continued from previous page]] molecule entirely homogeneous is terra incognita in chemistry.\n\n\"Where are we to draw the line?\" he asks; \"is there no way out of this perplexity?\n\nMust we either make the elementary examinations so stiff that only 60 or 70 candidates can pass, or must we open the examination doors so wide that the number of admissions is limited only by the number of applicants?\" And then the learned gentleman gives striking instances.\n\nHe says: \"Take the case of yttrium.\n\nIt has its definite atomic weight, it behaved in every respect as a simple body, an element, to which we might indeed add, but from which we could not take away.\n\nYet this yttrium, this supposed homogeneous whole, on being submitted to a certain method of fractionation, is resolved into portions not absolutely identical among themselves, and exhibiting a gradation of properties.\n\nOr take the case of didymium.\n\nHere was a body betraying all the recognised characters of an element.\n\nIt had been separated with much difficulty from other bodies which approximated closely to it in their properties, and during this crucial process it had undergone very severe treatment and very close scrutiny.\n\nBut then came another chemist, who, treating this assumed homogeneous body by a peculiar process of fractionation, resolved it into the two bodies praseodymium and neodymium, between which certain distinctions are perceptible.\n\nFurther, we even now have no certainty that neodymium and praseodymium are simple bodies.\n\nOn the contrary, they likewise exhibit symptoms of splitting up.\n\nNow, if one supposed element on proper treatment is thus found to comprise dissimilar molecules, we are surely warranted in asking whether similar results might not be obtained in other elements, perhaps in all elements, if treated in the right way.\n\nWe may even ask where the process of sorting-out is to stop -- a process which of course pre-supposes variations between the individual molecules of each species.\n\nAnd in these successive separations we naturally find bodies approaching more and more closely to each other.\" (Presidential address before the Royal Society of Chemists, March, 1888.) [[Vol.\n\n1, Page]] 142 THE SECRET DOCTRINE.\n\nmodern Science seems to fail to perceive is that, differentiated as may have been those simple chemical atoms -- which archaic philosophy called \"the creators of their respective Parents,\" fathers, brothers, husbands of their mothers, and those mothers the daughters of their own sons, like Aditi and Daksha, for example -- differentiated as these elements were in the beginning, still, they were not the compound bodies known to science, as they are now.\n\nNeither Water, Air, Earth (synonym for solids generally) existed in their present form, representing the three states of matter alone recognised by Science; for all these are the productions already recombined by the atmospheres of globes completely formed -- even to fire -- so that in the first periods of the earth's formation they were something quite sui generis.\n\nNow that the conditions and laws ruling our solar system are fully developed; and that the atmosphere of our earth, as of every other globe, has become, so to say, a crucible of its own, Occult Science teaches that there is a perpetual exchange taking place in space of molecules, or of atoms rather, correlating, and thus changing their combining equivalents on every planet.\n\nSome men of Science, and those among the greatest physicists and chemists, begin to suspect this fact, which has been known for ages to the Occultists.\n\nThe spectroscope only shows the probable similarity (on external evidence) of terrestrial and sidereal substance; it is unable to go any farther, or to show whether atoms gravitate towards one another in the same way and under the same conditions as they are supposed to do on our planet, physically and chemically.\n\nThe scale of temperature, from the highest degree to the lowest that can be conceived of, may be imagined to be one and the same in and for the whole Universe; nevertheless, its properties, other than those of dissociation and reassociation, differ on every planet; and thus atoms enter into new forms of existence, undreamt of, and incognizable to, physical Science.\n\nAs already expressed in \"Five Years of Theosophy,\" the essence of Cometary matter, for instance, \"is totally different from any of the chemical or physical characteristics with which the greatest chemists and physicists of the earth are acquainted\" (p.\n\n242).\n\nAnd even that matter, during rapid passage through our atmosphere, undergoes a certain change in its nature.\n\nThus not alone the elements of our planets, but even those of all its sisters in the Solar System, differ as widely from each other in their combinations, as from the Cosmic elements beyond our [[Vol.\n\n1, Page]] 143 THE SLEEP OF THE ETERNAL MOTHER.\n\nSolar limits.* Therefore, they cannot be taken as a standard for comparison with the same in other worlds.** Enshrined in their virgin, pristine state within the bosom of the Eternal Mother, every atom born beyond the threshold of her realm is doomed to incessant differentiation.\n\n\"The Mother sleeps, yet is ever breathing.\" And every breath sends out into the plane of manifestation her Protean products, which, carried on by the wave of the efflux, are scattered by Fohat, and driven toward and beyond this or another planetary atmosphere.\n\nOnce caught by the latter, the atom is lost; its pristine purity is gone for ever, unless Fate dissociates it by leading it to \"a current of EFFLUX\" (an occult term meaning quite a different process from that which the ordinary term implies); when it may be carried once more to the borderland where it had perished, and taking its flight, not into Space above but into Space within , it will be brought under a state of differential equilibrium and happily re-absorbed."


[content]
body = "\"I desired to suffer with Him\" And when I was thirty years old and a half, God sent me a bodily sickness, in which I lay three days and three nights; and on the fourth night I took all my rites of Holy Church, and weened not to have lived till day.\n\nAnd after this I languored forth two days and two nights, and on the third night I weened oftentimes to have passed; and so weened they that were with me.\n\nAnd being in youth as yet, I thought it great sorrow to die;—but for nothing that was in earth that meliked to live for, nor for no pain that I had fear of: for I trusted in God of His mercy.\n\nBut it was to have lived that I might have loved God better, and longer time, that I might have the more knowing and loving of God in bliss of Heaven.\n\nFor methought all the time that I had lived here so little and so short in regard of that endless bliss,—I thought [it was as] nothing.\n\nWherefore I thought: Good Lord, may my living no longer be to Thy worship!\n\nAnd I understood by my reason and by my feeling of my pains that I should die; and I assented fully with all the will of my heart to be at God's will.\n\nThus I dured till day, and by then my body was dead from the middle downwards, as to my feeling.\n\nThen was I minded to be set upright, backward leaning, with help,—for to have more freedom of my heart to be at God's will, and thinking on God while my life would last.\n\nMy Curate was sent for to be at my ending, and by that time when he came I had set my eyes, and might not speak.\n\nHe set the Cross before my face and said: I have brought thee the Image of thy Maker and Saviour: look thereupon and comfort thee therewith .\n\nMethought I was well [as it was], for my eyes were set uprightward unto Heaven, where I trusted to come by the mercy of God; but nevertheless I assented to set my eyes on the face of the Crucifix, if I might; and so I did.\n\nFor methought I might longer dure to look even-forth than right up.\n\nAfter this my sight began to fail, and it was all dark about me in the chamber, as if it had been night, save in the Image of the Cross whereon I beheld a common light; and I wist not how.\n\nAll that was away from the Cross was of horror to me, as if it had been greatly occupied by the fiends.\n\nAfter this the upper part of my body began to die, so far forth that scarcely I had any feeling;—with shortness of breath.\n\nAnd then I weened in sooth to have passed.\n\nAnd in this [moment] suddenly all my pain was taken from me, and I was as whole (and specially in the upper part of my body) as ever I was afore.\n\nI marvelled at this sudden change; for methought it was a privy working of God, and not of nature.\n\nAnd yet by the feeling of this ease I trusted never the more to live; nor was the feeling of this ease any full ease unto me: for methought I had liefer have been delivered from this world.\n\nThen came suddenly to my mind that I should desire the second wound of our Lord's gracious gift: that my body might be fulfilled with mind and feeling of His blessed Passion.\n\nFor I would that His pains were my pains, with compassion and afterward longing to God."


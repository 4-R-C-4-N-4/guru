[content]
body = "\"All that is speedful for us to learn and to know, full courteously will our Lord shew us\" Our Lord God shewed two manner of secret things. One is this great Secret [Counsel] with all the privy points that belong thereto: and these secret things He willeth we should know [as being , but as] hid until the time that He will clearly shew them to us. The other are the secret things that He willeth to make open and known to us; for He would have us understand that it is His will that we should know them. They are secrets to us not only for that He willeth that they be secrets to us, but they are secrets to us for our blindness and our ignorance; and thereof He hath great ruth, and therefore He will Himself make them more open to us, whereby we may know Him and love Him and cleave to Him. For all that is speedful for us to learn and to know, full courteously will our Lord shew us: and [of] that is this [Shewing], with all the preaching and teaching of Holy Church. God shewed full great pleasance that He hath in all men and women that mightily and meekly and with all their will take the preaching and teaching of Holy Church. For it is His Holy Church: He is the Ground, He is the Substance, He is the Teaching, He is the Teacher, He is the End, He is the Meed for which every kind soul travaileth. And this [of the Shewing] is [made] known, and shall be known to every soul to which the Holy Ghost declareth it. And I hope truly that all those that seek this, He shall speed: for they seek God. All this that I have now told, and more that I shall tell after, is comforting against sin. For in the Third Shewing when I saw that God doeth all that is done, I saw no sin: and then I saw that all is well. But when God shewed me for sin, then said He: All shall be well ."


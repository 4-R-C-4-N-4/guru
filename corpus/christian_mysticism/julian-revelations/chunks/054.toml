[content]
body = "\" I am the Ground of thy beseeching.\n\n\" \"Also to prayer belongeth thanking\" After this our Lord shewed concerning Prayer.\n\nIn which Shewing I see two conditions in our Lord's signifying: one is rightfulness, another is sure trust.\n\nBut yet oftentimes our trust is not full: for we are not sure that God heareth us, as we think because of our unworthiness, and because we feel right nought, (for we are as barren and dry oftentimes after our prayers as we were afore); and this, in our feeling our folly, is cause of our weakness.\n\nFor thus have I felt in myself.\n\nAnd all this brought our Lord suddenly to my mind, and shewed these words, and said: I am Ground of thy beseeching: first it is my will that thou have it; and after, I make thee to will it; and after, I make thee to beseech it and thou beseechest it.\n\nHow should it then be that thou shouldst not have thy beseeching?\n\nAnd thus in the first reason, with the three that follow, our good Lord sheweth a mighty comfort, as it may be seen in the same words.\n\nAnd in the first reason,—where He saith: And thou beseechest it , there He sheweth [His] full great pleasance, and endless meed that He will give us for our beseeching.\n\nAnd in the second reason, where He saith: How should it then be?\n\netc., this was said for an impossible [thing].\n\nFor it is most impossible that we should beseech mercy and grace, and not have it.\n\nFor everything that our good Lord maketh us to beseech, Himself hath ordained it to us from without beginning.\n\nHere may we see that our beseeching is not cause of God's goodness; and that shewed He soothfastly in all these sweet words when He saith: I am [the] Ground .—And our good Lord willeth that this be known of His lovers in earth; and the more that we know [it] the more should we beseech, if it be wisely taken; and so is our Lord's meaning.\n\nBeseeching is a true, gracious, lasting will of the soul, oned and fastened into the will of our Lord by the sweet inward work of the Holy Ghost.\n\nOur Lord Himself, He is the first receiver of our prayer, as to my sight, and taketh it full thankfully and highly enjoying; and He sendeth it up above and setteth it in the Treasure, where it shall never perish.\n\nIt is there afore God with all His Holy continually received, ever speeding [the help of] our needs; and when we shall receive our bliss it shall be given us for a degree of joy, with endless worshipful thanking from Him.\n\nFull glad and merry is our Lord of our prayer; and He looketh thereafter and He willeth to have it because with His grace He maketh us like to Himself in condition as we are in kind: and so is His blissful will.\n\nTherefore He saith thus: Pray inwardly, though thee thinketh it savour thee not: for it is profitable, though thou feel not, though thou see nought; yea, though thou think thou canst not.\n\nFor in dryness and in barrenness, in sickness and in feebleness, then is thy prayer well-pleasant to me, though thee thinketh it savour thee nought but little.\n\nAnd so is all thy believing prayer in my sight.\n\nFor the meed and the endless thanks that He will give us, therefor He is covetous to have us pray continually in His sight."


[content]
body = "For which love He said full sweetly these words: If I might suffer more, I would suffer more.\n\nHe said not, If it were needful to suffer more: for though it were not needful, if He might suffer more, He would.\n\nThis deed, and this work about our salvation, was ordained as well as God might ordain it.\n\nAnd here I saw a Full Bliss in Christ: for His bliss should not have been full, if it might any better have been done."


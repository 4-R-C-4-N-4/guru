[content]
body = "Desire we of our Lord God to dread Him reverently, to love Him meekly, to trust in Him mightily; for when we dread Him reverently and love Him meekly our trust is never in vain.\n\nFor the more that we trust, and the more mightily, the more we please and worship our Lord that we trust in.\n\nAnd if we fail in this reverent dread and meek love (as God forbid we should!), our trust shall soon be misruled for the time.\n\nAnd therefore it needeth us much to pray our Lord of grace that we may have this reverent dread and meek love, of His gift, in heart and in work.\n\nFor without this, no man may please God."


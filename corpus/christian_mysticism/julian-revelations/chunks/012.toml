[content]
body = "\"In all this I was greatly stirred in charity to my fellow-Christians that they might see and know the same that I saw\" And as long as I saw this sight of the plenteous bleeding of the Head I might never cease from these words: Benedicite Domine! In which Shewing I understood six things:—The first is, the tokens of the blessed Passion and the plenteous shedding of His precious blood. The second is, the Maiden that is His dearworthy Mother. The third is, the blissful Godhead that ever was, is, and ever shall be: Almighty, All-Wisdom, All-Love. The fourth is, all-thing that He hath made.—For well I wot that heaven and earth and all that is made is great and large, fair and good; but the cause why it shewed so little to my sight was for that I saw it in the presence of Him that is the Maker of all things: for to a soul that seeth the Maker of all, all that is made seemeth full little.—The fifth is: He that made all things for love, by the same love keepeth them, and shall keep them without end. The sixth is, that God is all that is good, as to my sight, and the goodness that each thing hath, it is He. And all these our Lord shewed me in the first Sight, with time and space to behold it. And the bodily sight stinted, but the spiritual sight dwelled in mine understanding, and I abode with reverent dread, joying in that I saw. And I desired, as I durst, to see more, if it were His will, or else [to see for] longer time the same. In all this I was greatly stirred in charity to mine even-Christians, that they might see and know the same that I saw: for I would it were comfort to them. For all this Sight was shewed [with] general [regard]. Then said I to them that were about me: It is to-day Doomsday with me . And this I said for that I thought to have died. (For that day that a man dieth, he is judged as shall be without end, as to mine understanding.) This I said for that I would they might love God the better, for to make them to have in mind that this life is short, as they might see in example. For in all this time I weened to have died; and that was marvel to me, and troublous partly: for methought this Vision was shewed for them that should live. And that which I say of me, I say in the person of all mine even-Christians: for I am taught in the Spiritual Shewing of our Lord God that He meaneth so. And therefore I pray you all for God's sake, and counsel you for your own profit, that ye leave the beholding of a poor creature that it was shewed to, and mightily, wisely, and meekly behold God that of His courteous love and endless goodness would shew it generally, in comfort of us all. For it is God's will that ye take it with great joy and pleasance, as if Jesus had shewed it to you all."


[content]
body = "\"All thing that is done, it is well done: for our Lord God doeth all.\" \"Sin is no deed\" And after this I saw God in a Point, that is to say, in mine understanding,—by which sight I saw that He is in all things.\n\nI beheld and considered, seeing and knowing in sight, with a soft dread, and thought: What is sin?\n\nFor I saw truly that God doeth all-thing, be it never so little.\n\nAnd I saw truly that nothing is done by hap nor by adventure, but all things by the foreseeing wisdom of God: if it be hap or adventure in the sight of man, our blindness and our unforesight is the cause.\n\nFor the things that are in the foreseeing wisdom of God from without beginning, (which rightfully and worshipfully and continually He leadeth to the best end,) as they come about fall to us suddenly, ourselves unwitting; and thus by our blindness and our unforesight we say: these be haps and adventures.\n\nBut to our Lord God they be not so.\n\nWherefore me behoveth needs to grant that all-thing that is done, it is well-done: for our Lord God doeth all.\n\nFor in this time the working of creatures was not shewed, but [the working] of our Lord God in the creature: for He is in the Mid-point of all thing, and all He doeth.\n\nAnd I was certain He doeth no sin.\n\nAnd here I saw verily that sin is no deed: for in all this was not sin shewed.\n\nAnd I would no longer marvel in this, but beheld our Lord, what He would shew.\n\nAnd thus, as much as it might be for the time, the rightfulness of God's working was shewed to the soul.\n\nRightfulness hath two fair properties: it is right and it is full.\n\nAnd so are all the works of our Lord God: thereto needeth neither the working of mercy nor grace: for they be all rightful: wherein faileth nought.\n\nBut in another time He gave a Shewing for the beholding of sin nakedly, as I shall tell: where He useth working of mercy and grace.\n\nAnd this vision was shewed, to mine understanding, for that our Lord would have the soul turned truly unto the beholding of Him, and generally of all His works.\n\nFor they are full good; and all His doings are easy and sweet, and to great ease bringing the soul that is turned from the beholding of the blind Deeming of man unto the fair sweet Deeming of our Lord God.\n\nFor a man beholdeth some deeds well done and some deeds evil, but our Lord beholdeth them not so: for as all that hath being in nature is of Godly making, so is all that is done, in property of God's doing.\n\nFor it is easy to understand that the best deed is well done: and so well as the best deed is done—the highest—so well is the least deed done; and all thing in its property and in the order that our Lord hath ordained it to from without beginning.\n\nFor there is no doer but He.\n\nI saw full surely that he changeth never His purpose in no manner of thing, nor never shall, without end.\n\nFor there was no thing unknown to Him in His rightful ordinance from without beginning.\n\nAnd therefore all-thing was set in order ere anything was made, as it should stand without end; and no manner of thing shall fail of that point.\n\nFor He made all things in fulness of goodness, and therefore the blessed Trinity is ever full pleased in all His works.\n\nAnd all this shewed He full blissfully, signifying thus: See!\n\nI am God: see!\n\nI am in all thing: see!\n\nI do all thing: see!"


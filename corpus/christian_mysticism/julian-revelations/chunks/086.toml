[content]
body = "For only by our Reason we may not profit, but if we have evenly therewith Mind and Love: nor only in our Nature-Ground that we have in God we may not be saved but if we have, coming of the same Ground, Mercy and Grace.\n\nFor of these three working all together we receive all our Goodness.\n\nOf the which the first [gifts] are goods of Nature: for in our First making God gave us as full goods as we might receive in our spirit alone, —and also greater goods; but His foreseeing purpose in His endless wisdom willed that we should be double."


[content]
body = "In Heaven \"the token of sin is turned to worship.\"— Examples thereof Also God shewed that sin shall be no shame to man, but worship. For right as to every sin is answering a pain by truth, right so for every sin, to the same soul is given a bliss by love: right as diverse sins are punished with diverse pains according as they be grievous, right so shall they be rewarded with diverse joys in Heaven according as they have been painful and sorrowful to the soul in earth. For the soul that shall come to Heaven is precious to God, and the place so worshipful that the goodness of God suffereth never that soul to sin that shall come there without that the which sin shall be rewarded; and it is made known without end, and blissfully restored by overpassing worship. For in this Sight mine understanding was lifted up into Heaven, and then God brought merrily to my mind David, and others in the Old Law without number; and in the New Law He brought to my mind first Mary Magdalene, Peter and Paul, and those of Inde; and Saint John of Beverley ; and others also without number: how they are known in the Church in earth with their sins, and it is to them no shame, but all is turned for them to worship. And therefore our courteous Lord sheweth [it thus] for them here in part like as it is there in fulness: for there the token of sin is turned to worship. And Saint John of Beverley, our Lord shewed him full highly, in comfort to us for homeliness; and brought to my mind how he is a dear neighbour, and of our knowing. And God called him Saint John of Beverley plainly as we do, and that with a most glad sweet cheer, shewing that he is a full high saint in Heaven in His sight, and a blissful. And with this he made mention that in his youth and in his tender age he was a dearworthy servant to God, greatly God loving and dreading, and yet God suffered him to fall, mercifully keeping him that he perished not, nor lost no time. And afterward God raised him to manifold more grace, and by the contrition and meekness that he had in his living, God hath given him in Heaven manifold joys, overpassing that [which] he should have had if he had not fallen. And that this is sooth, God sheweth in earth with plenteous miracles doing about his body continually. And all this was to make us glad and merry in love."


[content]
body = "And in this sight I marvelled greatly and beheld our Faith, marvelling thus: Our Faith is grounded in God's word, and it belongeth to our Faith that we believe that God's word shall be saved in all things; and one point of our Faith is that many creatures shall be condemned: as angels that fell out of Heaven for pride, which be now fiends; and man in earth that dieth out of the Faith of Holy Church: that is to say, they that be heathen men; and also man that hath received Christendom and liveth unchristian life and so dieth out of charity: all these shall be condemned to hell without end, as Holy Church teacheth me to believe.\n\nAnd all this [so] standing, methought it was impossible that all manner of things should be well, as our Lord shewed in the same time.\n\nAnd as to this I had no other answer in Shewing of our Lord God but this: That which is impossible to thee is not impossible to me: I shall save my word in all things and I shall make all things well.\n\nThus I was taught, by the grace of God, that I should steadfastly hold me in the Faith as I had aforehand understood, [and] therewith that I should firmly believe that all things shall be well, as our Lord shewed in the same time.\n\nFor this is the Great Deed that our Lord shall do, in which Deed He shall save His word and He shall make all well that is not well.\n\nHow it shall be done there is no creature beneath Christ that knoweth it, nor shall know it till it is done; according to the understanding that I took of our Lord's meaning in this time."


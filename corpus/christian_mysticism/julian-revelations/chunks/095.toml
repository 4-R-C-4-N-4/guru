[content]
body = "So willeth He that we do, as a meek child saying thus: My kind Mother, my Gracious Mother, my dearworthy Mother, have mercy on me: I have made myself foul and unlike to Thee, and I nor may nor can amend it but with thine help and grace .\n\nAnd if we feel us not then eased forthwith, be we sure that He useth the condition of a wise mother.\n\nFor if He see that it be more profit to us to mourn and to weep, He suffereth it, with ruth and pity, unto the best time, for love.\n\nAnd He willeth then that we use the property of a child, that evermore of nature trusteth to the love of the mother in weal and in woe.\n\nAnd He willeth that we take us mightily to the Faith of Holy Church and find there our dearworthy Mother, in solace of true Understanding, with all the blessed Common.\n\nFor one single person may oftentimes be broken, as it seemeth to himself, but the whole Body of Holy Church was never broken, nor never shall be, without end.\n\nAnd therefore a sure thing it is, a good and a gracious, to will meekly and mightily to be fastened and oned to our Mother, Holy Church, that is, Christ Jesus.\n\nFor the food of mercy that is His dearworthy blood and precious water is plenteous to make us fair and clean; the blessed wounds of our Saviour be open and enjoy to heal us; the sweet, gracious hands of our Mother be ready and diligently about us.\n\nFor He in all this working useth the office of a kind nurse that hath nought else to do but to give heed about the salvation of her child.\n\nIt is His office to save us: it is His worship to do [for] us, and it is His will [that] we know it: for He willeth that we love Him sweetly and trust in Him meekly and mightily.\n\nAnd this shewed He in these gracious words: I keep thee full surely ."


[content]
body = "\"As long as we be meddling with any part of sin we shall never see clearly the Blissful Countenance of our Lord\" But now behoveth me to tell in what manner I saw sin deadly in the creatures which shall not die for sin, but live in the joy of God without end.\n\nI saw that two contrary things should never be together in one place.\n\nThe most contrary that are, is the highest bliss and the deepest pain.\n\nThe highest bliss that is, is to have Him in clarity of endless life, Him verily seeing, Him sweetly feeling, all-perfectly having in fulness of joy.\n\nAnd thus was the Blissful Cheer of our Lord shewed in Pity: in which Shewing I saw that sin is most contrary,—so far forth that as long as we be meddling with any part of sin, we shall never see clearly the Blissful Cheer of our Lord.\n\nAnd the more horrible and grievous that our sins be, the deeper are we for that time from this blissful sight.\n\nAnd therefore it seemeth to us oftentimes as we were in peril of death, in a part of hell, for the sorrow and pain that the sin is to us.\n\nAnd thus we are dead for the time from the very sight of our blissful life.\n\nBut in all this I saw soothfastly that we be not dead in the sight of God, nor He passeth never from us.\n\nBut He shall never have His full bliss in us till we have our full bliss in Him, verily seeing His fair Blissful Cheer.\n\nFor we are ordained thereto in nature, and get thereto by grace.\n\nThus I saw how sin is deadly for a short time in the blessed creatures of endless life.\n\nAnd ever the more clearly that the soul seeth this Blissful Cheer by grace of loving, the more it longeth to see it in fulness.\n\nFor notwithstanding that our Lord God dwelleth in us and is here with us, and albeit He claspeth us and encloseth us for tender love that He may never leave us, and is more near to us than tongue can tell or heart can think, yet may we never stint of moaning nor of weeping nor of longing till when we see Him clearly in His Blissful Countenance.\n\nFor in that precious blissful sight there may no woe abide, nor any weal fail.\n\nAnd in this I saw matter of mirth and matter of moaning: matter of mirth: for our Lord, our Maker, is so near to us, and in us, and we in Him, by sureness of keeping through His great goodness; matter of moaning: for our ghostly eye is so blind and we be so borne down by weight of our mortal flesh and darkness of sin, that we may not see our Lord God clearly in His fair Blissful Cheer.\n\nNo; and because of this dimness scarsely we can believe and trust His great love and our sureness of keeping.\n\nAnd therefore it is that I say we may never stint of moaning nor of weeping.\n\nThis \"weeping\" meaneth not all in pouring out of tears by our bodily eye, but also hath more ghostly understanding.\n\nFor the kindly desire of our soul is so great and so unmeasurable, that if there were given us for our solace and for our comfort all the noble things that ever God made in heaven and in earth, and we saw not the fair Blissful Cheer of Himself, yet we should not stint of moaning nor ghostly weeping, that is to say, of painful longing, till when we [should] see verily the fair Blissful Cheer of our Maker."


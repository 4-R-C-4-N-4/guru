[content]
body = "I lift never mine hands off my works, nor ever shall, without end: see!\n\nI lead all thing to the end I ordained it to from without beginning, by the same Might, Wisdom and Love whereby I made it.\n\nHow should any thing be amiss?\n\nThus mightily, wisely, and lovingly was the soul examined in this Vision.\n\nThen saw I soothly that me behoved, of need, to assent, with great reverence enjoying in God.\n\nTHE FOURTH REVELATION"


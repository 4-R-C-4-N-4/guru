[content]
body = "\"God is endless, sovereign Truth,—Wisdom,—Love, not-made; and man's Soul is a creature in God which hath the same properties made\" God shewed in all the Revelations, oftentimes, that man worketh evermore His will and His worship lastingly without any stinting. And what this work is, was shewed in the First, and that in a marvellous example: for it was shewed in the working of the soul of our blissful Lady, Saint Mary: [that is, the working of] Truth and Wisdom. And how [it is done] I hope by the grace of the Holy Ghost I shall tell, as I saw. Truth seeth God, and Wisdom beholdeth God, and of these two cometh the third: that is, a holy marvellous delight in God; which is Love. Where Truth and Wisdom are verily, there is Love verily, coming of them both. And all of God's making: for He is endless sovereign Truth, endless sovereign Wisdom, endless sovereign Love, unmade; and man's Soul is a creature in God which hath the same properties made , and evermore it doeth that it was made for: it seeth God, it beholdeth God, and it loveth God. Whereof God enjoyeth in the creature; and the creature in God, endlessly marvelling. In which marvelling he seeth his God, his Lord, his Maker so high, so great, and so good, in comparison with him that is made, that scarcely the creature seemeth ought to the self. But the clarity and the clearness of Truth and Wisdom maketh him to see and to bear witness that he is made for Love: in which God endlessly keepeth him."


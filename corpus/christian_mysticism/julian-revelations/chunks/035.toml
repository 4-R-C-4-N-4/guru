[content]
body = "\"It is I, it is I\" And after this our Lord shewed Himself more glorified, as to my sight, than I saw Him before [in the Shewing] wherein I was learned that our soul shall never have rest till it cometh to Him, knowing that He is fulness of joy, homely and courteous, blissful and very life. Our Lord Jesus oftentimes said: I it am, I it am: I it am that is highest, I it am that thou lovest, I it am that thou enjoyest, I it am that thou servest, I it am that thou longest for, I it am that thou desirest, I it am that thou meanest, I it am that is all. I it am that Holy Church preacheth and teacheth thee, I it am that shewed me here to thee. The number of the words passeth my wit and all my understanding and all my powers. And they are the highest, as to my sight: for therein is comprehended—I cannot tell,—but the joy that I saw in the Shewing of them passeth all that heart may wish for and soul may desire. Therefore the words be not declared here; but every man after the grace that God giveth him in understanding and loving, receive them in our Lord's meaning. THE THIRTEENTH REVELATION"


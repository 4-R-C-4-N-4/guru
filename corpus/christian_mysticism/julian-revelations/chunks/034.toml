[content]
body = "\"I wot well that thou wouldst see my blessed Mother....\" \"Wilt thou see in her how thou art loved?\" And with this same cheer of mirth and joy our good Lord looked down on the right side and brought to my mind where our Lady stood in the time of His Passion; and said: Wilt thou see her? And in this sweet word [it was] as if He had said: I wot well that thou wouldst see my blessed Mother: for, after myself, she is the highest joy that I might shew thee, and most pleasance and worship to me; and most she is desired to be seen of my blessed creatures. And for the high, marvellous, singular love that He hath to this sweet Maiden, His blessed Mother, our Lady Saint Mary, He shewed her highly rejoicing, as by the meaning of these sweet words; as if He said: Wilt thou see how I love her, that thou mightest joy with me in the love that I have in her and she in me? And also (unto more understanding this sweet word) our Lord speaketh to all mankind that shall be saved, as it were all to one person, as if He said: Wilt thou see in her how thou art loved? For thy love I made her so high, so noble and so worthy; and this pleaseth me, and so will I that it doeth thee. For after Himself she is the most blissful sight. But hereof am I not learned to long to see her bodily presence while I am here, but the virtues of her blessed soul: her truth, her wisdom, her charity; whereby I may learn to know myself and reverently dread my God. And when our good Lord had shewed this and said this word: Wilt thou see her? I answered and said: Yea, good Lord, I thank Thee; yea, good Lord, if it be Thy will. Oftentimes I prayed this, and I weened to have seen her in bodily presence, but I saw her not so. And Jesus in that word shewed me ghostly sight of her: right as I had seen her afore little and simple, so He shewed her then high and noble and glorious, and pleasing to Him above all creatures. And He willeth that it be known; that [so] all those that please them in Him should please them in her, and in the pleasance that He hath in her and she in Him. And, to more understanding, He shewed this example: As if a man love a creature singularly, above all creatures, he willeth to make all creatures to love and to have pleasance in that creature that he loveth so greatly. And in this word that Jesus said: Wilt thou see her? methought it was the most pleasing word that He might have given me of her, with that ghostly Shewing that He gave me of her. For our Lord shewed me nothing in special but our Lady Saint Mary; and her He shewed three times. The first was as she was with Child; the second was as she was in her sorrows under the Cross; the third is as she is now in pleasing, worship, and joy. THE TWELFTH REVELATION"


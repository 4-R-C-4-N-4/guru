[content]
body = "And if we were in all the pain that heart can think and tongue may tell, if we might in that time see His fair Blissful Cheer, all this pain should not aggrieve us.\n\nThus is that Blissful Sight [the] end of all manner of pain to the loving soul, and the fulfilling of all manner of joy and bliss.\n\nAnd that shewed He in the high, marvellous words where He said: I it am that is highest; I it am that is lowest; I it am that is all .\n\nIt belongeth to us to have three manner of knowings: the first is that we know our Lord God; the second is that we know our self: what we are by Him, in Nature and Grace; the third is that we know meekly what our self is anent our sin and feebleness.\n\nAnd for these three was all the Shewing made, as to mine understanding."


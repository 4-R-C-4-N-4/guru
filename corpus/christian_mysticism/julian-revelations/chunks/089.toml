[content]
body = "\"All our life is in three: 'Nature, Mercy, Grace.' The high Might of the Trinity is our Father, and the deep Wisdom of the Trinity is our Mother, and the great Love of the Trinity is our Lord\" God, the blessed Trinity, which is everlasting Being, right as He is endless from without beginning, right so it was in His purpose endless, to make Mankind.\n\nWhich fair Kind first was prepared to His own Son, the Second Person.\n\nAnd when He would, by full accord of all the Trinity, He made us all at once; and in our making He knit us and oned us to Himself: by which oneing we are kept as clear and as noble as we were made.\n\nBy the virtue of the same precious oneing, we love our Maker and seek Him, praise Him and thank Him, and endlessly enjoy Him.\n\nAnd this is the work which is wrought continually in every soul that shall be saved: which is the Godly Will aforesaid.\n\nAnd thus in our making, God, Almighty, is our Nature's Father; and God, All-Wisdom, is our Nature's Mother; with the Love and the Goodness of the Holy Ghost: which is all one God, one Lord.\n\nAnd in the knitting and the oneing He is our Very, True Spouse, and we His loved Wife, His Fair Maiden: with which Wife He is never displeased.\n\nFor He saith: I love thee and thou lovest me, and our love shall never be disparted in two.\n\nI beheld the working of all the blessed Trinity: in which beholding I saw and understood these three properties: the property of the Fatherhood, the property of the Motherhood, and the property of the Lordhood, in one God.\n\nIn our Father Almighty we have our keeping and our bliss as anent our natural Substance, which is to us by our making, without beginning.\n\nAnd in the Second Person in skill and wisdom we have our keeping as anent our Sense-soul: our restoring and our saving; for He is our Mother, Brother, and Saviour.\n\nAnd in our good Lord, the Holy Ghost, we have our rewarding and our meed-giving for our living and our travail, and endless overpassing of all that we desire, in His marvellous courtesy, of His high plenteous grace.\n\nFor all our life is in three : in the first we have our Being, in the second we have our Increasing, and in the third we have our Fulfilling: the first is Nature, the second is Mercy, and the third is Grace.\n\nFor the first, I understood that the high Might of the Trinity is our Father, and the deep Wisdom of the Trinity is our Mother, and the great Love of the Trinity is our Lord: and all this have we in Nature and in the making of our Substance.\n\nAnd furthermore I saw that the Second Person, which is our Mother as anent the Substance, that same dearworthy Person is become our Mother as anent the Sense-soul.\n\nFor we are double by God's making: that is to say, Substantial and Sensual.\n\nOur Substance is the higher part, which we have in our Father, God Almighty; and the Second Person of the Trinity is our Mother in Nature, in making of our Substance: in whom we are grounded and rooted.\n\nAnd He is our Mother in Mercy, in taking of our Sense-part.\n\nAnd thus our Mother is to us in diverse manners working: in whom our parts are kept undisparted.\n\nFor in our Mother Christ we profit and increase, and in Mercy He reformeth us and restoreth, and, by the virtue of His Passion and His Death and Uprising, oneth us to our Substance."


[content]
body = "\"Faith is nought else but a right understanding, with true belief and sure trust, of our Being: that we are in God, and God is in us: Whom we see not\" And because of this great, endless love that God hath to all Mankind, He maketh no disparting in love between the blessed Soul of Christ and the least soul that shall be saved. For it is full easy to believe and to trust that the dwelling of the blessed Soul of Christ is full high in the glorious Godhead, and verily, as I understand in our Lord's signifying, where the blessed Soul of Christ is, there is the Substance of all the souls that shall be saved by Christ. Highly ought we to rejoice that God dwelleth in our soul, and much more highly ought we to rejoice that our soul dwelleth in God. Our soul is made to be God's dwelling-place; and the dwelling-place of the soul is God, Which is unmade . And high understanding it is, inwardly to see and know that God, which is our Maker, dwelleth in our soul; and an higher understanding it is, inwardly to see and to know that our soul, that is made, dwelleth in God's Substance: of which Substance, God, we are that we are. And I saw no difference between God and our Substance: but as it were all God; and yet mine understanding took that our Substance is in God: that is to say, that God is God, and our Substance is a creature in God. For the Almighty Truth of the Trinity is our Father: for He made us and keepeth us in Him; and the deep Wisdom of the Trinity is our Mother, in Whom we are all enclosed; the high Goodness of the Trinity is our Lord, and in Him we are enclosed, and He in us. We are enclosed in the Father, and we are enclosed in the Son, and we are enclosed in the Holy Ghost. And the Father is enclosed in us, and the Son is enclosed in us, and the Holy Ghost is enclosed in us: Almightiness, All-Wisdom, All-Goodness: one God, one Lord. And our faith is a Virtue that cometh of our Nature-Substance into our Sense-soul by the Holy Ghost; in which all our virtues come to us: for without that, no man may receive virtue. For it is nought else but a right understanding, with true belief, and sure trust, of our Being: that we are in God, and God in us, Whom we see not. And this virtue, with all other that God hath ordained to us coming therein, worketh in us great things. For Christ's merciful working is in us, and we graciously accord to Him through the gifts and the virtues of the Holy Ghost. This working maketh that we are Christ's children, and Christian in living."


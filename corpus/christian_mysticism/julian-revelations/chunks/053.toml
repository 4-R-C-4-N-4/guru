[content]
body = "For He willeth that we be like Him in wholeness of endless love to ourself and to our even-Christians: no more than His love is broken to us for our sin, no more willeth He that our love be broken to ourself and to our even-Christians: but [that we] endlessly hate the sin and endlessly love the soul, as God loveth it.\n\nThen shall we hate sin like as God hateth it, and love the soul as God loveth it.\n\nAnd this word that He said is an endless comfort: I keep thee securely .\n\nTHE FOURTEENTH REVELATION."


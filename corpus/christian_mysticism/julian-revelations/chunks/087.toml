[content]
body = "\"In Christ our two natures are united\" And anent our Substance He made us noble, and so rich that evermore we work His will and His worship.\n\n(Where I say \"we,\" it meaneth Man that shall be saved.) For soothly I saw that we are that which He loveth, and do that which Him pleaseth, lastingly without any stinting: and [that by virtue] of the great riches and of the high noble virtues by measure come to our soul what time it is knit to our body: in which knitting we are made Sensual.\n\nAnd thus in our Substance we are full, and in our Sense-soul we fail: which failing God will restore and fulfil by working of Mercy and Grace plenteously flowing into us out of His own Nature-Goodness.\n\nAnd thus His Nature-Goodness maketh that Mercy and Grace work in us, and the Nature-goodness that we have of Him enableth us to receive the working of Mercy and Grace.\n\nI saw that our nature is in God whole: in which [whole nature of Manhood] He maketh diversities flowing out of Him to work His will: whom Nature keepeth, and Mercy and Grace restoreth and fulfilleth.\n\nAnd of these none shall perish: for our nature that is the higher part is knit to God, in the making; and God is knit to our nature that is the lower part, in our flesh-taking: and thus in Christ our two natures are oned.\n\nFor the Trinity is comprehended in Christ, in whom our higher part is grounded and rooted; and our lower part the Second Person hath taken: which nature first to Him was made-ready.\n\nFor I saw full surely that all the works that God hath done, or ever shall, were fully known to Him and aforeseen from without beginning.\n\nAnd for Love He made Mankind, and for the same Love would be Man.\n\nThe next Good that we receive is our Faith, in which our profiting beginneth.\n\nAnd it cometh [out] of the high riches of our nature-Substance into our Sensual soul, and it is grounded in us through the Nature-Goodness of God, by the working of Mercy and Grace.\n\nAnd thereof come all other goods by which we are led and saved.\n\nFor the Commandments of God come therein: in which we ought to have two manners of understanding: [the one is that we ought to understand and know] which are His biddings, to love and to keep them; the other is that we ought to know His forbiddings, to hate and to refuse them.\n\nFor in these two is all our working comprehended.\n\nAlso in our faith come the Seven Sacraments, each following other in order as God hath ordained them to us: and all manner of virtues.\n\nFor the same virtues that we have received of our Substance, given to us in Nature by the Goodness of God,—the same virtues by the working of Mercy are given to us in Grace through the Holy Ghost, renewed : which virtues and gifts are treasured to us in Jesus Christ.\n\nFor in that same time that God knitted Himself to our body in the Virgin's womb, He took our Sensual soul: in which taking He, us all having enclosed in Him, oned it to our Substance: in which oneing He was perfect Man.\n\nFor Christ having knit in Him each man that shall be saved, is perfect Man.\n\nThus our Lady is our Mother in whom we are all enclosed and of her born, in Christ: (for she that is Mother of our Saviour is Mother of all that shall be saved in our Saviour;) and our Saviour is our Very Mother in whom we be endlessly borne, and never shall come out of Him."


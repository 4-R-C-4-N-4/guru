[content]
body = "\"Charity\" The light is Charity, and the measuring of this light is done to us profitably by the wisdom of God. For neither is the light so large that we may see our blissful Day, nor is it shut from us; but it is such a light in which we may live meedfully, with travail deserving the endless worship of God. And this was seen in the Sixth Shewing where He said: I thank thee of thy service and of thy travail . Thus Charity keepeth us in Faith and Hope, and Hope leadeth us in Charity. And in the end all shall be Charity. I had three manners of understanding of this light, Charity. The first is Charity unmade; the second is Charity made; the third is Charity given. Charity unmade is God; Charity made is our soul in God; Charity given is virtue. And that is a precious gift of working in which we love God, for Himself; and ourselves, in God; and that which God loveth, for God."


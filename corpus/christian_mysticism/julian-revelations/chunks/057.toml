[content]
body = "And if we see that He doeth, and we pray not, we do not our debt, and so may it not be: that is to say, so is it not [the thing that is] in His beholding.\n\nBut to see that He doeth it, and to pray forthwithal,—so is he worshipped and we sped.\n\nAll-thing that our Lord hath ordained to do, it is His will that we pray therefor, either in special or in general.\n\nAnd the joy and the bliss that it is to Him, and the thanks and the worship that we shall have therefor, it passeth the understanding of creatures, as to my sight.\n\nFor prayer is a right understanding of that fulness of joy that is to come, with well-longing and sure trust.\n\nFailing of our bliss that we be kindly ordained to, maketh us to long; true understanding and love, with sweet mind in our Saviour, graciously maketh us to trust.\n\nAnd in these two workings our Lord beholdeth us continually : for it is our due part, and His Goodness may no less assign to us.\n\nThus it belongeth to us to do our diligence; and when we have done it, then shall us yet think that [it] is nought,—and sooth it is.\n\nBut if we do as we can, and ask, in truth, for mercy and grace, all that faileth us we shall find in Him.\n\nAnd thus signifieth He where He saith: I am Ground of thy beseeching .\n\nAnd thus in this blessed word, with the Shewing, I saw a full overcoming against all our weakness and all our doubtful dreads."


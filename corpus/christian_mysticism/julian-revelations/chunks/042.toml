[content]
body = "\"There be deeds evil done in our sight, and so great harms taken, that it seemeth to us that it were impossible that ever it should come to good end.\" \"That Great Deed ordained ...\n\nby which our Lord God shall make all things well\" One time our good Lord said: All thing shall be well ; and another time he said: Thou shalt see thyself that all manner [of] thing shall be well ; and in these two [sayings] the soul took sundry understandings.\n\nOne was that He willeth we know that not only He taketh heed to noble things and to great, but also to little and to small, to low and to simple, to one and to other.\n\nAnd so meaneth He in that He saith: All manner of things shall be well .\n\nFor He willeth we know that the least thing shall not be forgotten.\n\nAnother understanding is this, that there be deeds evil done in our sight, and so great harms taken, that it seemeth to us that it were impossible that ever it should come to good end.\n\nAnd upon this we look, sorrowing and mourning therefor, so that we cannot resign us unto the blissful beholding of God as we should do.\n\nAnd the cause of this is that the use of our reason is now so blind, so low, and so simple, that we cannot know that high marvellous Wisdom, the Might and the Goodness of the blissful Trinity.\n\nAnd thus signifieth He when He saith: Thou shalt see thyself if all manner of things shall be well .\n\nAs if He said: Take now heed faithfully and trustingly, and at the last end thou shalt verily see it in fulness of joy .\n\nAnd thus in these same five words aforesaid: I may make all things well , etc., I understand a mighty comfort of all the works of our Lord God that are yet to come.\n\nThere is a Deed the which the blessed Trinity shall do in the last Day, as to my sight, and when the Deed shall be, and how it shall be done, is unknown of all creatures that are beneath Christ, and shall be till when it is done.\n\n[\"The Goodness and the Love of our Lord God will that we wit [know] that it shall be; And the Might and the Wisdom of him by the same Love will hill [conceal] it, and hide it from us what it shall be, and how it shall be done.\"] And the cause why He willeth that we know [this Deed shall be], is for that He would have us the more eased in our soul and [the more] set at peace in love —leaving the beholding of all troublous things that might keep us back from true enjoying of Him.\n\nThis is that Great Deed ordained of our Lord God from without beginning, treasured and hid in His blessed breast, only known to Himself: by which He shall make all things well.\n\nFor like as the blissful Trinity made all things of nought, right so the same blessed Trinity shall make well all that is not well."


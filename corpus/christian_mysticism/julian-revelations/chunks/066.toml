[content]
body = "\"Where our Lord appeareth, peace is taken, and wrath hath no place.\" \"Immediately is the soul made at one with God when it is truly set at peace in itself\" For this was an high marvel to the soul which was continually shewed in all the Revelations, and was with great diligence beholden, that our Lord God, anent Himself may not forgive, for He may not be wroth: it were impossible.\n\nFor this was shewed: that our life is all grounded and rooted in love, and without love we may not live; and therefore to the soul that of His special grace seeth so far into the high, marvellous Goodness of God, and seeth that we are endlessly oned to Him in love, it is the most impossible that may be, that God should be wroth.\n\nFor wrath and friendship be two contraries.\n\nFor He that wasteth and destroyeth our wrath and maketh us meek and mild,—it behoveth needs to be that He [Himself] be ever one in love, meek and mild: which is contrary to wrath.\n\nFor I saw full surely that where our Lord appeareth, peace is taken and wrath hath no place.\n\nFor I saw no manner of wrath in God, neither for short time nor for long;—for in sooth, as to my sight, if God might be wroth for an instant, we should never have life nor place nor being.\n\nFor as verily as we have our being of the endless Might of God and of the endless Wisdom and of the endless Goodness, so verily we have our keeping in the endless Might of God, in the endless Wisdom, and in the endless Goodness.\n\nFor though we feel in ourselves, [frail] wretches, debates and strifes, yet are we all-mannerful enclosed in the mildness of God and in His meekness, in His benignity and in His graciousness.\n\nFor I saw full surely that all our endless friendship, our place, our life and our being, is in God.\n\nFor that same endless Goodness that keepeth us when we sin, that we perish not, the same endless Goodness continually treateth in us a peace against our wrath and our contrarious falling, and maketh us to see our need with a true dread, and mightily to seek unto God to have forgiveness, with a gracious desire of our salvation.\n\nAnd though we, by the wrath and the contrariness that is in us, be now in tribulation, distress, and woe, as falleth to our blindness and frailty, yet are we securely safe by the merciful keeping of God, that we perish not.\n\nBut we are not blissfully safe, in having of our endless joy, till we be all in peace and in love: that is to say, full pleased with God and with all His works, and with all His judgments, and loving and peaceable with our self and with our even-Christians and with all that God loveth, as love beseemeth.\n\nAnd this doeth God's Goodness in us.\n\nThus saw I that God is our very Peace, and He is our sure Keeper when we are ourselves in unpeace, and He continually worketh to bring us into endless peace.\n\nAnd thus when we, by the working of mercy and grace, be made meek and mild, we are fully safe; suddenly is the soul oned to God when it is truly peaced in itself: for in Him is found no wrath.\n\nAnd thus I saw when we are all in peace and in love, we find no contrariness, nor no manner of letting through that contrariness which is now in us; [nay], our Lord of His Goodness maketh it to us full profitable."


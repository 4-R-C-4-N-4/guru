[content]
body = "And these two parts were in Christ, the higher and the lower: which is but one Soul; the higher part was one in peace with God, in full joy and bliss; the lower part, which is sense-nature, suffered for the salvation of mankind.\n\nAnd these two parts [in Christ] were seen and felt in the Eighth Shewing, in which my body was fulfilled with feeling and mind of Christ's Passion and His death, and furthermore with this was a subtile feeling and privy inward sight of the High Part which I was shewed in the same time when I could not, [even] for the friendly proffer [made to me], look up into Heaven: and that was because of that mighty beholding [that I had] of the Inward Life.\n\nWhich Inward Life is that High Substance, that precious Soul, [of Christ], which is endlessly rejoicing in the Godhead."


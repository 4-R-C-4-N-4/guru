[content]
body = "And He that made man for love, by the same love He would restore man to the same bliss, and overpassing; and like as we were like-made to the Trinity in our first making, our Maker would that we should be like Jesus Christ, Our Saviour, in heaven without end, by the virtue of our again-making.\n\nThen atwix these two, He would for love and worship of man make Himself as like to man in this deadly life, in our foulness and our wretchedness, as man might be without guilt.\n\nThis is that which is meant where it is said afore: it was the image and likeness of our foul black deeds' shame wherein our fair, bright, blessed Lord God was hid.\n\nBut full certainly I dare say, and we ought to trow it, that so fair a man was never none but He, till what time His fair colour was changed with travail and sorrow and Passion and dying.\n\nOf this it is spoken in the Eighth Revelation, where it treateth more of the same likeness.\n\nAnd where it speaketh of the Vernacle of Rome, it meaneth by [reason of] diverse changing of colour and countenance, sometime more comfortably and life-like, sometime more ruefully and death-like, as it may be seen in the Eighth Revelation.\n\nAnd this [dim] vision was a learning, to mine understanding, that the continual seeking of the soul pleaseth God full greatly: for it may do no more than seek, suffer and trust.\n\nAnd this is wrought in the soul that hath it, by the Holy Ghost; and the clearness of finding, it is of His special grace, when it is His will.\n\nThe seeking, with faith, hope, and charity, pleaseth our Lord, and the finding pleaseth the soul and fulfilleth it with joy.\n\nAnd thus was I learned, to mine understanding, that seeking is as good as beholding, for the time that He will suffer the soul to be in travail.\n\nIt is God's will that we seek Him , to the beholding of Him, for by that He shall shew us Himself of His special grace when He will.\n\nAnd how a soul shall have Him in its beholding, He shall teach Himself: and that is most worship to Him and profit to thyself, and [the soul thus] most receiveth of meekness and virtues with the grace and leading of the Holy Ghost.\n\nFor a soul that only fasteneth it[self] on to God with very trust, either by seeking or in beholding, it is the most worship that it may do to Him, as to my sight.\n\nThese are two workings that may be seen in this Vision: the one is seeking, the other is beholding.\n\nThe seeking is common,—that every soul may have with His grace,—and ought to have that discretion and teaching of the Holy Church.\n\nIt is God's will that we have three things in our seeking:—The first is that we seek earnestly and diligently, without sloth, and, as it may be through His grace, without unreasonable heaviness and vain sorrow.\n\nThe second is, that we abide Him steadfastly for His love, without murmuring and striving against Him, to our life's end: for it shall last but awhile.\n\nThe third is that we trust in Him mightily of full assured faith.\n\nFor it is His will that we know that He shall appear suddenly and blissfully to all that love Him.\n\nFor His working is privy, and He willeth to be perceived; and His appearing shall be swiftly sudden; and He willeth to be trusted.\n\nFor He is full gracious and homely: Blessed may He be!\n\nTHE THIRD REVELATION"


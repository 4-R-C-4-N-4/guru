[content]
body = "\"My sin shall not hinder His Goodness working....\n\nA deed shall be done—as we come to Heaven—and it may be known here in part;—though it be truly taken for the general Man, yet it excludeth not the special.\n\nFor what our good Lord will do by His poor creatures, it is now unknown to me\" Our Lord God shewed that a deed shall be done, and Himself shall do it, and I shall do nothing but sin, and my sin shall not hinder His Goodness working.\n\nAnd I saw that the beholding of this is a heavenly joy in a fearing soul which evermore kindly by grace desireth God's will.\n\nThis deed shall be begun here, and it shall be worshipful to God and plenteously profitable to His lovers in earth; and ever as we come to Heaven we shall see it in marvellous joy, and it shall last thus in working unto the last Day; and the worship and the bliss of it shall last in Heaven afore God and all His Holy [ones] for ever.\n\nThus was this deed seen and understood in our Lord's signifying: and the cause why He shewed it is to make us rejoice in Him and in all His works.\n\nWhen I saw His Shewing continued, I understood that it was shewed for a great thing that was for to come, which thing God shewed that He Himself should do it: which deed hath these properties aforesaid.\n\nAnd this shewed He well blissfully, signifying that I should take it myself faithfully and trustingly.\n\nBut what this deed should be was kept secret from me.\n\nAnd in this I saw that He willeth not that we dread to know the things that He sheweth: He sheweth them because He would have us know them; by which knowing He would have us love Him and have pleasure and endlessly enjoy in Him.\n\nFor the great love that He hath to us He sheweth us all that is worshipful and profitable for the time.\n\nAnd the things that He will now have privy, yet of His great goodness He sheweth them close : in which shewing He willeth that we believe and understand that we shall see the same verily in His endless bliss.\n\nThen ought we to rejoice in Him for all that He sheweth and all that He hideth; and if we steadily and meekly do thus, we shall find therein great ease; and endless thanks we shall have of Him therefor.\n\nAnd this is the understanding of this word:—That it shall be done for me, meaneth that it shall be done for the general Man: that is to say, all that shall be saved.\n\nIt shall be worshipful and marvellous and plenteous, and God Himself shall do it; and this shall be the highest joy that may be, to behold the deed that God Himself shall do, and man shall do right nought but sin.\n\nThen signifieth our Lord God thus, as if He said: Behold and see!\n\nHere hast thou matter of meekness, here hast thou matter of love, here hast thou matter to make nought of thyself, here hast thou matter to enjoy in me;—and, for my love, enjoy [thou] in me: for of all things, therewith mightest thou please me most .\n\nAnd as long as we are in this life, what time that we by our folly turn us to the beholding of the reproved, tenderly our Lord God toucheth us and blissfully calleth us, saying in our soul: Let be all thy love, my dearworthy child: turn thee to me—I am enough to thee—and enjoy in thy Saviour and in thy salvation ."


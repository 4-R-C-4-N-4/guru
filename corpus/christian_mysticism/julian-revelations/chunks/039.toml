[content]
body = "\"Two parts of Truth: the part that is open: our Saviour and our salvation;—and the part that is hid and shut up from us: all beside our salvation\" He gave me understanding of two parts [of truth]. The one part is our Saviour and our salvation. This blessed part is open and clear and fair and light, and plenteous,—for all mankind that is of good will, and shall be, is comprehended in this part. Hereto are we bounden of God, and drawn and counselled and taught inwardly by the Holy Ghost and outwardly by Holy Church in the same grace. In this willeth our Lord that we be occupied, joying in Him; for He enjoyeth in us. The more plenteously that we take of this, with reverence and meekness, the more thanks we earn of Him and the more speed to ourselves, thus—may we say—enjoying our part of our Lord. The other [part] is hid and shut up from us: that is to say, all that is beside our salvation. For it is our Lord's privy counsel, and it belongeth to the royal lordship of God to have His privy counsel in peace, and it belongeth to His servant, for obedience and reverence, not to learn wholly His counsel. Our Lord hath pity and compassion on us for that some creatures make themselves so busy therein; and I am sure if we knew how much we should please Him and ease ourselves by leaving it, we would. The saints that be in Heaven, they will to know nothing but that which our Lord willeth to shew them: and also their charity and their desire is ruled after the will of our Lord: and thus ought we to will, like to them. Then shall we nothing will nor desire but the will of our Lord, as they do: for we are all one in God's seeing. And here was I learned that we shall trust and rejoice only in our Saviour, blessed Jesus, for all thing."


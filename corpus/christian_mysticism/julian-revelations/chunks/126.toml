[content]
body = "\"Lord, blessed mayest Thou be, for it is thus: it is well\" And in this sight I marvelled highly. For notwithstanding our simple living and our blindness here, yet endlessly our courteous Lord beholdeth us in this working, rejoicing; and of all things, we may please Him best wisely and truly to believe, and to enjoy with Him and in Him. For as verily as we shall be in the bliss of God without end, Him praising and thanking, so verily we have been in the foresight of God, loved and known in His endless purpose from without beginning. In which unbegun love He made us; and in the same love He keepeth us and never suffereth us to be hurt [in manner] by which our bliss might be lost. And therefore when the Doom is given and we be all brought up above, then shall we clearly see in God the secret things which be now hid to us. Then shall none of us be stirred to say in any wise: Lord, if it had been thus, then it had been full well ; but we shall say all with one voice: Lord, blessed mayst thou be, for it is thus: it is well; and now see we verily that all-thing is done as it was then ordained before that anything was made."


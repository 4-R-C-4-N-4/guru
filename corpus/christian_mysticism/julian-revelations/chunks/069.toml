[content]
body = "\"He is the Head, and we be His members.\" \"Therefore our Father nor may nor will more blame assign to us than to His own Son, precious and worthy Christ\" And then our Courteous Lord answered in shewing full mistily a wonderful example of a Lord that hath a Servant: and He gave me sight to my understanding of both.\n\nWhich sight was shewed doubly in the Lord and doubly in the Servant: the one part was shewed spiritually in bodily likeness, and the other part was shewed more spiritually, without bodily likeness.\n\nFor the first [sight], thus, I saw two persons in bodily likeness: that is to say, a Lord and a Servant; and therewith God gave me spiritual understanding.\n\nThe Lord sitteth stately in rest and in peace; the Servant standeth by afore his Lord reverently, ready to do his Lord's will.\n\nThe Lord looketh upon his Servant full lovingly and sweetly, and meekly he sendeth him to a certain place to do his will.\n\nThe Servant not only he goeth, but suddenly he starteth, and runneth in great haste, for love to do his Lord's will.\n\nAnd anon he falleth into a slade, and taketh full great hurt.\n\nAnd then he groaneth and moaneth and waileth and struggleth, but he neither may rise nor help himself by no manner of way.\n\nAnd of all this the most mischief that I saw him in, was failing of comfort: for he could not turn his face to look upon his loving Lord, which was to him full near,—in Whom is full comfort;—but as a man that was feeble and unwise for the time, he turned his mind to his feeling and endured in woe.\n\nIn which woe he suffered seven great pains.\n\nThe first was the sore bruising that he took in his falling, which was to him feelable pain; the second was the heaviness of his body; the third was feebleness following from these two; the fourth, that he was blinded in his reason and stunned in his mind, so far forth that almost he had forgotten his own love; the fifth was that he might not rise; the sixth was most marvellous to me, and that was that he lay all alone: I looked all about and beheld, and far nor near, high nor low, I saw to him no help; the seventh was that the place which he lay on was a long, hard, and grievous [place].\n\nI marvelled how this Servant might meekly suffer there all this woe, and I beheld with carefulness to learn if I could perceive in him any fault, or if the Lord should assign to him any blame.\n\nAnd in sooth there was none seen: for only his goodwill and his great desire was cause of his falling; and he was unlothful, and as good inwardly as when he stood afore his Lord, ready to do his will.\n\nAnd right thus continually his loving Lord full tenderly beholdeth him.\n\nBut now with a double manner of Regard: one outward, full meekly and mildly, with great ruth and pity,—and this was of the first [sight], another inward, more spiritually,—and this was shewed with a leading of mine understanding into the Lord, [in the] which I saw Him highly rejoicing for the worshipful restoring that He will and shall bring His Servant to by His plenteous grace; and this was of that other shewing.\n\nAnd now [was] my understanding led again into the first [sight]; both keeping in mind."


[content]
body = "And that this is our Lord's working in us, I am sure the soul that hath understanding therein by grace shall see it and feel it.\n\nAnd though it be so that this deed be truly taken for the general Man, yet it excludeth not the special.\n\nFor what our good Lord will do by His poor creatures, it is now unknown to me.\n\nBut this deed and that other aforesaid, they are not both one but two sundry.\n\nThis deed shall be done sooner (and that [time] shall be as we come to Heaven), and to whom our Lord giveth it, it may be known here in part.\n\nBut that Great Deed aforesaid shall neither be known in Heaven nor earth till it is done.\n\nAnd moreover He gave special understanding and teaching of working of miracles, as thus:— It is known that I have done miracles here afore, many and diverse, high and marvellous, worshipful and great.\n\nAnd so as I have done, I do now continually, and shall do in coming of time .\n\nIt is known that afore miracles come sorrow and anguish and tribulation ; and that is for that we should know our own feebleness and our mischiefs that we are fallen in by sin, to meeken us and make us to dread God and cry for help and grace.\n\nMiracles come after that, and they come of the high Might, Wisdom, and Goodness of God, shewing His virtue and the joys of Heaven so far at it may be in this passing life: and that to strengthen our faith and to increase our hope, in charity.\n\nWherefore it pleaseth Him to be known and worshipped in miracles.\n\nThen signifieth He thus: He willeth that we be not borne over low for sorrow and tempests that fall to us: for it hath ever so been afore miracle-coming."


[content]
body = "For the most fulness of joy that we shall have, as to my sight, is the marvellous courtesy and homeliness of our Father, that is our Maker, in our Lord Jesus Christ that is our Brother and our Saviour.\n\nBut this marvellous homeliness may no man fully see in this time of life, save he have it of special shewing of our Lord, or of great plenty of grace inwardly given of the Holy Ghost.\n\nBut faith and belief with charity deserveth the meed: and so it is had, by grace; for in faith, with hope and charity, our life is grounded.\n\nThe Shewing, made to whom that God will, plainly teacheth the same, opened and declared, with many privy points belonging to our Faith which be worshipful to know.\n\nAnd when the Shewing which is given in a time is passed and hid, then the faith keepeth [it] by grace of the Holy Ghost unto our life's end.\n\nAnd thus through the Shewing it is not other than of faith, nor less nor more; as it may be seen in our Lord's teaching in the same matter, by that time that it shall come to the end."


[content]
body = "\"The Kind, loving, Mother\" But now behoveth to say a little more of this forthspreading, as I understand in the meaning of our Lord: how that we be brought again by the Motherhood of Mercy and Grace into our Nature's place, where that we were made by the Motherhood of Nature-Love: which kindly-love, it never leaveth us.\n\nOur Kind Mother, our Gracious Mother, for that He would all wholly become our Mother in all things, He took the Ground of His Works full low and full mildly in the Maiden's womb.\n\n(And that He shewed in the First [Shewing] where He brought that meek Maid afore the eye of mine understanding in the simple stature as she was when she conceived.) That is to say: our high God is sovereign Wisdom of all: in this low place He arrayed and dight Him full ready in our poor flesh, Himself to do the service and the office of Motherhood in all things.\n\nThe Mother's service is nearest, readiest, and surest: [nearest, for it is most of nature; readiest, for it is most of love; and surest] for it is most of truth.\n\nThis office none might, nor could, nor ever should do to the full, but He alone.\n\nWe know that all our mothers' bearing is [bearing of] us to pain and to dying: and what is this but that our Very Mother, Jesus, He—All-Love—beareth us to joy and to endless living?—blessed may He be!\n\nThus He sustaineth us within Himself in love; and travailed, unto the full time that He would suffer the sharpest throes and the most grievous pains that ever were or ever shall be; and died at the last.\n\nAnd when He had finished, and so borne us to bliss, yet might not all this make full content to His marvellous love; and that sheweth He in these high overpassing words of love: If I might suffer more, I would suffer more .\n\nHe might no more die, but He would not stint of working: wherefore then it behoveth Him to feed us; for the dearworthy love of Motherhood hath made Him debtor to us.\n\nThe mother may give her child suck of her milk, but our precious Mother, Jesus, He may feed us with Himself, and doeth it, full courteously and full tenderly, with the Blessed Sacrament that is precious food of my life; and with all the sweet Sacraments He sustaineth us full mercifully and graciously.\n\nAnd so meant He in this blessed word where that He said: It is I that Holy Church preacheth thee and teacheth thee.\n\nThat is to say: All the health and life of Sacraments, all the virtue and grace of my Word, all the Goodness that is ordained in Holy Church for thee, it is I .\n\nThe Mother may lay the child tenderly to her breast, but our tender Mother, Jesus, He may homely lead us into His blessed breast, by His sweet open side, and shew therein part of the Godhead and the joys of Heaven, with spiritual sureness of endless bliss.\n\nAnd that shewed He in the Tenth [Shewing], giving the same understanding in this sweet word where He saith: Lo!\n\nhow I loved thee ; looking unto [the Wound in] His side, rejoicing.\n\nThis fair lovely word Mother , it is so sweet and so close in Nature of itself that it may not verily be said of none but of Him ; and to her that is very Mother of Him and of all."


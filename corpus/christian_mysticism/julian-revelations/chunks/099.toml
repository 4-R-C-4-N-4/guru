[content]
body = "\" Thou shalt come up above.\n\n\" \"A very fair creature, a little Child—nimble and lively, whiter than lily\" Afore this time I had great longing and desire of God's gift to be delivered of this world and of this life.\n\nFor oftentimes I beheld the woe that is here, and the weal and the bliss that is being there: (and if there had been no pain in this life but the absence of our Lord, methought it was some-time more than I might bear;) and this made me to mourn, and eagerly to long.\n\nAnd also from mine own wretchedness, sloth, and weakness, me liked not to live and to travail, as me fell to do.\n\nAnd to all this our courteous Lord answered for comfort and patience, and said these words: Suddenly thou shalt be taken from all thy pain, from all thy sickness, from all thy distress and from all thy woe.\n\nAnd thou shalt come up above and thou shalt have me to thy meed, and thou shalt be fulfilled of love and of bliss.\n\nAnd thou shalt never have no manner of pain, no manner of misliking, no wanting of will; but ever joy and bliss without end.\n\nWhat should it then aggrieve thee to suffer awhile, seeing that it is my will and my worship?\n\nAnd in this word: Suddenly thou shalt be taken ,—I saw that God rewardeth man for the patience that he hath in abiding God's will, and for his time, and [for] that man lengtheneth his patience over the time of his living.\n\nFor not-knowing of his time of passing, that is a great profit: for if a man knew his time, he should not have patience over that time; but, as God willeth, while the soul is in the body it seemeth to itself that it is ever at the point to be taken.\n\nFor all this life and this languor that we have here is but a point, and when we are taken suddenly out of pain into bliss then pain shall be nought.\n\nAnd in this time I saw a body lying on the earth, which body shewed heavy and horrible, without shape and form, as it were a swollen quag of stinking mire.\n\nAnd suddenly out of this body sprang a full fair creature, a little Child, fully shapen and formed, nimble and lively, whiter than lily; which swiftly glided up into heaven.\n\nAnd the swollenness of the body betokeneth great wretchedness of our deadly flesh, and the littleness of the Child betokeneth the cleanness of purity in the soul.\n\nAnd methought: With this body abideth no fairness of this Child, and on this Child dwelleth no foulness of this body .\n\nIt is more blissful that man be taken from pain, than that pain be taken from man; for if pain be taken from us it may come again: therefore it is a sovereign comfort and blissful beholding in a loving soul that we shall be taken from pain.\n\nFor in this behest I saw a marvellous compassion that our Lord hath in us for our woe, and a courteous promising of clear deliverance.\n\nFor He willeth that we be comforted in the overpassing; and that He shewed in these words: And thou shalt come up above, and thou shalt have me to thy meed, and thou shalt be fulfilled of joy and bliss ."


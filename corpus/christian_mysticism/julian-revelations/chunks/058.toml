[content]
body = "\"Prayer uniteth the soul to God\" Prayer oneth the soul to God.\n\nFor though the soul be ever like to God in kind and substance, restored by grace, it is often unlike in condition, by sin on man's part.\n\nThen is prayer a witness that the soul willeth as God willeth; and it comforteth the conscience and enableth man to grace.\n\nAnd thus He teacheth us to pray, and mightily to trust that we shall have it.\n\nFor He beholdeth us in love and would make us partners of His good deed, and therefore He stirreth us to pray for that which it pleaseth him to do.\n\nFor which prayer and good will, that we have of His gift, He will reward us and give us endless meed.\n\nAnd this was shewed in this word: And thou beseechest it .\n\nIn this word God shewed so great pleasance and so great content, as though He were much beholden to us for every good deed that we do (and yet it is He that doeth it) because that we beseech Him mightily to do all things that seem to Him good: as if He said: What might then please me more than to beseech me, mightily, wisely, and earnestly, to do that thing that I shall do?\n\nAnd thus the soul by prayer accordeth to God.\n\nBut when our courteous Lord of His grace sheweth Himself to our soul, we have that [which] we desire.\n\nAnd then we see not, for the time, what we should more pray, but all our intent with all our might is set wholly to the beholding of Him.\n\nAnd this is an high unperceivable prayer, as to my sight: for all the cause wherefor we pray it, is oned into the sight and beholding of Him to whom we pray; marvellously enjoying with reverent dread, and with so great sweetness and delight in Him that we can pray right nought but as He stirreth us, for the time.\n\nAnd well I wot, the more the soul seeth of God, the more it desireth Him by His grace.\n\nBut when we see Him not so, then feel we need and cause to pray, because of failing, for enabling of our self, to Jesus.\n\nFor when the soul is tempested, troubled, and left to itself by unrest, then it is time to pray, for to make itself pliable and obedient to God.\n\n(But the soul by no manner of prayer maketh God pliant to it: for He is ever alike in love.) And this I saw: that what time we see needs wherefor we pray, then our good Lord followeth us , helping our desire; and when we of His special grace plainly behold Him, seeing none other needs, then we follow Him and He draweth us unto Him by love.\n\nFor I saw and felt that His marvellous and plentiful Goodness fulfilleth all our powers; and therewith I saw that His continuant working in all manner of things is done so goodly, so wisely, and so mightily, that it overpasseth all our imagining, and all that we can ween and think; and then we can do no more but behold Him, enjoying, with an high, mighty desire to be all oned unto Him,—centred to His dwelling,—and enjoy in His loving and delight in His goodness.\n\nAnd then shall we, with His sweet grace, in our own meek continuant prayer come unto Him now in this life by many privy touchings of sweet spiritual sights and feeling, measured to us as our simpleness may bear it.\n\nAnd this is wrought, and shall be, by the grace of the Holy Ghost, so long till we shall die in longing, for love."


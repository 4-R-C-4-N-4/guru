[content]
body = "And though longing and pity are two sundry properties, as to my sight, in this standeth the point of the Spiritual Thirst: which is desire in Him as long as we be in need , drawing us up to His bliss.\n\nAnd all this was seen in the Shewing of Compassion: for that shall cease on Doomsday.\n\nThus He hath ruth and compassion on us, and He hath longing to have us; but His wisdom and His love suffereth not the end to come till the best time."


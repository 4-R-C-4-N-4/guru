[content]
body = "\"As verily as sin is unclean, so verily is it unkind\"—a disease or monstrous thing against nature.\n\n\"He shall heal us full fair.\" Here may we see that we have verily of Nature to hate sin, and we have verily of Grace to hate sin.\n\nFor Nature is all good and fair in itself, and Grace was sent out to save Nature and destroy sin, and bring again fair nature to the blessed point from whence it came: that is God; with more nobleness and worship by the virtuous working of Grace.\n\nFor it shall be seen afore God by all His Holy in joy without end that Nature hath been assayed in the fire of tribulation and therein hath been found no flaw, no fault.\n\nThus are Nature and Grace of one accord: for Grace is God, as Nature is God: He is two in manner of working and one in love; and neither of these worketh without other: they be not disparted.\n\nAnd when we by Mercy of God and with His help accord us to Nature and Grace, we shall see verily that sin is in sooth viler and more painful than hell, without likeness: for it is contrary to our fair nature.\n\nFor as verily as sin is unclean, so verily is it unnatural, and thus an horrible thing to see for the loved soul that would be all fair and shining in the sight of God, as Nature and Grace teacheth.\n\nYet be we not adread of this, save inasmuch as dread may speed us: but meekly make we our moan to our dearworthy Mother, and He shall besprinkle us in His precious blood and make our soul full soft and full mild, and heal us full fair by process of time, right as it is most worship to Him and joy to us without end.\n\nAnd of this sweet fair working He shall never cease nor stint till all His dearworthy children be born and forthbrought.\n\n(And that shewed He where He shewed [me] understanding of the ghostly Thirst, that is the love-longing that shall last till Doomsday.) Thus in [our] Very Mother, Jesus, our life is grounded, in the foreseeing Wisdom of Himself from without beginning, with the high Might of the Father, the high sovereign Goodness of the Holy Ghost.\n\nAnd in the taking of our nature He quickened us; in His blessed dying upon the Cross He bare us to endless life; and from that time, and now, and evermore unto Doomsday, He feedeth us and furthereth us: even as that high sovereign Kindness of Motherhood, and as Kindly need of Childhood asketh.\n\nFair and sweet is our Heavenly Mother in the sight of our souls; precious and lovely are the Gracious Children in the sight of our Heavenly Mother, with mildness and meekness, and all the fair virtues that belong to children in Nature.\n\nFor of nature the Child despaireth not of the Mother's love, of nature the Child presumeth not of itself, of nature the Child loveth the Mother and each one of the other [children].\n\nThese are the fair virtues, with all other that be like, wherewith our Heavenly Mother is served and pleased.\n\nAnd I understood none higher stature in this life than Childhood, in feebleness and failing of might and of wit, unto the time that our Gracious Mother hath brought us up to our Father's Bliss.\n\nAnd then shall it verily be known to us His meaning in those sweet words where He saith: All shall be well: and thou shalt see, thyself, that all manner of things shall be well .\n\nAnd then shall the Bliss of our Mother, in Christ, be new to begin in the Joys of our God: which new beginning shall last without end, new beginning."


[content]
body = "\"All heavenly things and all earthly things that belong to Heaven are comprehended in these two judgments\" God deemeth us [looking] upon our Nature-Substance, which is ever kept one in Him, whole and safe without end: and this doom is [because] of His rightfulness [in the which it is made and kept]. And man judgeth [looking] upon our changeable Sense-soul, which seemeth now one [thing], now other,—according as it taketh of the [higher or lower] parts,—and [is that which] showeth outward. And this wisdom [of man's judgment] is mingled [because of the diverse things it beholdeth]. For sometimes it is good and easy, and sometimes it is hard and grievous. And in as much as it is good and easy it belongeth to the rightfulness; and in as much as it is hard and grievous [by reason of the sin beheld, which sheweth in our Sense-soul,] our good Lord Jesus reformeth it by [the working in our Sense-soul of] mercy and grace through the virtue of His blessed Passion, and so bringeth it to the rightfulness. And though these two [judgments] be thus accorded and oned, yet both shall be known in Heaven without end. The first doom, which is of God's rightfulness, is [because] of His high endless life [in our Substance]; and this is that fair sweet doom that was shewed in all the fair Revelation, in which I saw Him assign to us no manner of blame. But though this was sweet and delectable, yet in the beholding only of this, I could not be fully eased: and that was because of the doom of Holy Church, which I had afore understood and which was continually in my sight. And therefore by this doom methought I understood that sinners are worthy sometime of blame and wrath; but these two could I not see in God; and therefore my desire was more than I can or may tell. For the higher doom was shewed by God Himself in that same time, and therefore me behoved needs to take it; and the lower doom was learned me afore in Holy Church, and therefore I might in no way leave the lower doom. Then was this my desire: that I might see in God in what manner that which the doom of Holy Church teacheth is true in His sight, and how it belongeth to me verily to know it; whereby the two dooms might both be saved, so as it were worshipful to God and right way to me. And to all this I had none other answer but a marvellous example of a lord and of a servant, as I shall tell after: and that full mistily shewed. And yet I stand desiring, and will unto my end, that I might by grace know these two dooms as it belongeth to me. For all heavenly, and all earthly things that belong to Heaven, are comprehended in these two dooms. And the more understanding, by the gracious leading of the Holy Ghost, that we have of these two dooms, the more we shall see and know our failings. And ever the more that we see them, the more, of nature, by grace, we shall long to be fulfilled of endless joy and bliss. For we are made thereto, and our Nature-Substance is now blissful in God, and hath been since it was made, and shall be without end."


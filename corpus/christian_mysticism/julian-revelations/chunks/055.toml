[content]
body = "God accepteth the goodwill and the travail of His servant, howsoever we feel: wherefore it pleaseth Him that we work both in our prayers and in good living, by His help and His grace, reasonably with discretion keeping our powers [turned] to Him, till when that we have Him that we seek, in fulness of joy: that is, Jesus.\n\nAnd that shewed He in the Fifteenth [Revelation], farther on, in this word: Thou shalt have me to thy meed .\n\nAnd also to prayer belongeth thanking.\n\nThanking is a true inward knowing, with great reverence and lovely dread turning ourselves with all our mights unto the working that our good Lord stirreth us to, enjoying and thanking inwardly.\n\nAnd sometimes, for plenteousness it breaketh out with voice, and saith: Good Lord, I thank Thee!\n\nBlessed mayst Thou be!\n\nAnd sometime when the heart is dry and feeleth not, or else by temptation of our enemy,—then it is driven by reason and by grace to cry upon our Lord with voice, rehearing His blessed Passion and His great Goodness; and the virtue of our Lord's word turneth into the soul and quickeneth the heart and entereth it by His grace into true working, and maketh it pray right blissfully.\n\nAnd truly to enjoy our Lord, it is a full blissful thanking in His sight."


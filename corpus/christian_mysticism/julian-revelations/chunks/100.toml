[content]
body = "It is God's will that we set the point of our thought in this blissful beholding as often as we may,—and as long time keep us therein with His grace; for this is a blessed contemplation to the soul that is led of God, and full greatly to His worship, for the time that it lasteth.\n\nAnd [when] we fall again to our heaviness, and spiritual blindness, and feeling of pains spiritual and bodily, by our frailty, it is God's will that we know that He hath not forgotten us.\n\nAnd so signifieth He in these words: And thou shalt never more have pain; no manner of sickness, no manner of misliking, no wanting of will; but ever joy and bliss without end.\n\nWhat should it then aggrieve thee to suffer awhile, seeing it is my will and my worship?\n\nIt is God's will that we take His behests and His comfortings as largely and as mightily as we may take them, and also He willeth that we take our abiding and our troubles as lightly as we may take them, and set them at nought.\n\nFor the more lightly we take them, and the less price we set on them, for love, the less pain we shall have in the feeling of them, and the more thanks and meed we shall have for them."


[content]
body = "\"Christ is our Way\"—\"Mankind shall be restored from double death\" And thus Christ is our Way, us surely leading in His laws, and Christ in His body mightily beareth us up into heaven.\n\nFor I saw that Christ, us all having in Him that shall be saved by Him, worshipfully presenteth His Father in heaven with us; which present full thankfully His Father receiveth, and courteously giveth it to His Son, Jesus Christ: which gift and working is joy to the Father, and bliss to the Son, and pleasing to the Holy Ghost.\n\nAnd of all things that belong to us [to do], it is most pleasing to our Lord that we enjoy in this joy which is in the blessed Trinity [in virtue] of our salvation.\n\n(And this was seen in the Ninth Shewing, where it speaketh more of this matter.) And notwithstanding all our feeling of woe or weal, God willeth that we should understand and hold by faith that we are more verily in heaven than in earth.\n\nOur Faith cometh of the natural Love of our soul, and of the clear light of our Reason, and of the steadfast Mind which we have from God in our first making.\n\nAnd what time that our soul is inspired into our body, in which we are made sensual, so soon mercy and grace begin to work, having of us care and keeping with pity and love: in which working the Holy Ghost formeth, in our Faith, Hope that we shall come again up above to our Substance, into the Virtue of Christ, increased and fulfilled through the Holy Ghost.\n\nThus I understood that the sense-soul is grounded in Nature, in Mercy, and in Grace: which Ground enableth us to receive gifts that lead us to endless life.\n\nFor I saw full assuredly that our Substance is in God, and also I saw that in our sense-soul God is: for in the self-[same] point that our Soul is made sensual, in the self-[same] point is the City of God ordained to Him from without beginning; into which seat He cometh, and never shall remove [from] it.\n\nFor God is never out of the soul: in which He dwelleth blissfully without end.\n\nAnd this was seen in the Sixteenth Shewing where it saith: The place that Jesus taketh in our soul, He shall never remove [from] it .\n\nAnd all the gifts that God may give to creatures, He hath given to His Son Jesus for us: which gifts He, dwelling in us, hath enclosed in Him unto the time that we be waxen and grown,—our soul with our body and our body with our soul, either of them taking help of other,—till we be brought up unto stature, as nature worketh.\n\nAnd then, in the ground of nature, with working of mercy, the Holy Ghost graciously inspireth into us gifts leading to endless life.\n\nAnd thus was my understanding led of God to see in Him and to understand, to perceive and to know, that our soul is made-trinity , like to the unmade blissful Trinity, known and loved from without beginning, and in the making oned to the Maker, as it is aforesaid.\n\nThis sight was full sweet and marvellous to behold, peaceable, restful, sure, and delectable.\n\nAnd because of the worshipful oneing that was thus made by God betwixt the soul and body, it behoveth needs to be that mankind shall be restored from double death: which restoring might never be until the time that the Second Person in the Trinity had taken the lower part of man's nature; to Whom the highest [part] was oned in the First-making."


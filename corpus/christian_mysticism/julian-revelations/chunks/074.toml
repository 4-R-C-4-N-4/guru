[content]
body = "Thus was He, the Servant, afore His coming into earth standing ready afore the Father in purpose, till what time He would send Him to do that worshipful deed by which mankind was brought again into heaven;—that is to say, notwithstanding that He is God, even with the Father as anent the Godhead.\n\nBut in His foreseeing purpose that He would be Man, to save man in fulfilling of His Father's will, so He stood afore His Father as a Servant, willingly taking upon Him all our charge.\n\nAnd then He started full readily at the Father's will, and anon He fell full low, into the Maiden's womb, having no regard to Himself nor to His hard pains.\n\nThe white kirtle is the flesh; the singleness is that there was right nought atwix the Godhead and Manhood; the straitness is poverty; the eld is of Adam's wearing; the defacing, of sweat of Adam's travail; the shortness sheweth the Servant's labour.\n\nAnd thus I saw the Son saying in His meaning : Lo!\n\nmy dear Father, I stand before Thee in Adam's kirtle, all ready to start and to run: I would be in the earth to do Thy worship when it is Thy will to send me.\n\nHow long shall I desire?\n\nFull soothfastly wist the Son when it would be the Father's will and how long He should desire: that is to say, [He wist it] anent the Godhead: for He is the Wisdom of the Father; wherefore this question was shewed with understanding of the Manhood of Christ.\n\nFor all mankind that shall be saved by the sweet Incarnation and blissful Passion of Christ, all is the Manhood of Christ: for He is the Head and we be His members.\n\nTo which members the day and the time is unknown when every passing woe and sorrow shall have an end, and the everlasting joy and bliss shall be fulfilled; which day and time for to see, all the Company of Heaven longeth.\n\nAnd all that shall be under heaven that shall come thither, their way is by longing and desire.\n\nWhich desire and longing was shewed in the Servant's standing afore the Lord,—or else thus in the Son's standing afore the Father in Adam's kirtle.\n\nFor the longing and desire of all Mankind that shall be saved appeared in Jesus: for Jesus is All that shall be saved, and All that shall be saved is Jesus.\n\nAnd all of the Charity of God; with obedience, meekness, and patience, and virtues that belong to us.\n\nAlso in this marvellous example I have teaching with me as it were the beginning of an A.B.C., whereby I have some understanding of our Lord's meaning.\n\nFor the secret things of the Revelation be hid therein;—notwithstanding that all the Shewings are full of secret things.\n\nThe sitting of the Father betokeneth His Godhead: that is to say, by shewing of rest and peace: for in the Godhead may be no travail.\n\nAnd that He shewed Himself as Lord , betokeneth His [governance] to our manhood.\n\nThe standing of the Servant betokeneth travail; on one side , and on the left , betokeneth that he was not all worthy to stand even-right afore the Lord; his starting was the Godhead, and the running was the Manhood: for the Godhead started from the Father into the Maiden's womb, falling into the taking of our Kind.\n\nAnd in this falling he took great sore: the sore that He took was our flesh, in which He had also swiftly feeling of deadly pains."


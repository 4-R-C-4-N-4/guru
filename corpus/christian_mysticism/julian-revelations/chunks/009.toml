[content]
body = "And therefore we may with grace and His help stand in spiritual beholding, with everlasting marvel of this high, overpassing, inestimable Love that Almighty God hath to us of His Goodness.\n\nAnd therefore we may ask of our Lover with reverence all that we will.\n\nFor our natural Will is to have God, and the Good Will of God is to have us; and we may never cease from willing nor from longing till we have Him in fullness of joy: and then may we no more desire.\n\nFor He willeth that we be occupied in knowing and loving till the time that we shall be fulfilled in Heaven; and therefore was this lesson of Love shewed, with all that followeth, as ye shall see.\n\nFor the strength and the Ground of all was shewed in the First Sight.\n\nFor of all things the beholding and the loving of the Maker maketh the soul to seem less in his own sight, and most filleth him with reverent dread and true meekness; with plenty of charity to his even-Christians."


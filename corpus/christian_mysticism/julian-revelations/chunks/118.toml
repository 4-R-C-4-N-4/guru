[content]
body = "Flee we to our Lord and we shall be comforted, touch we Him and we shall be made clean, cleave we to Him and we shall be sure, and safe from all manner of peril.\n\nFor our courteous Lord willeth that we should be as homely with Him as heart may think or soul may desire.\n\nBut [let us] beware that we take not so recklessly this homeliness as to leave courtesy.\n\nFor our Lord Himself is sovereign homeliness, and as homely as He is, so courteous He is: for He is very courteous.\n\nAnd the blessed creatures that shall be in heaven with Him without end, He will have them like to Himself in all things.\n\nAnd to be like our Lord perfectly, it is our very salvation and our full bliss.\n\nAnd if we wot not how we shall do all this, desire we of our Lord and He shall teach us: for it is His own good-pleasure and His worship; blessed may He be!"


[content]
body = "Then thought-me: I knew but little what pain it was that I asked ; and, as a wretch, repented me, thinking: If I had wist what it had been, loth me had been to have prayed it .\n\nFor methought it passed bodily death, my pains.\n\nI thought: Is any pain like this?\n\nAnd I was answered in my reason: Hell is another pain: for there is despair.\n\nBut of all pains that lead to salvation this is the most pain, to see thy Love suffer.\n\nHow might any pain be more to me than to see Him that is all my life, all my bliss, and all my joy, suffer?\n\nHere felt I soothfastly that I loved Christ so much above myself that there was no pain that might be suffered like to that sorrow that I had to [see] Him in pain."


[content]
body = "And therefore mightily He joyeth in his falling for the high raising and fulness of bliss that Mankind is come to, overpassing that we should have had if he had not fallen.—And thus to see this overpassing nobleness was mine understanding led into God in the same time that I saw the Servant fall.\n\nAnd thus we have, now, matter of mourning: for our sin is cause of Christ's pains; and we have, lastingly, matter of joy: for endless love made Him to suffer.\n\nAnd therefore the creature that seeth and feeleth the working of love by grace, hateth nought but sin: for of all things, to my sight, love and hate are [the] hardest and most unmeasureable contraries.\n\nAnd notwithstanding all this, I saw and understood in our Lord's meaning that we may not in this life keep us from sin as wholly in full cleanness as we shall be in Heaven.\n\nBut we may well by grace keep us from the sins which would lead us to endless pains, as Holy Church teacheth us; and eschew venial [ones] reasonably up to our might.\n\nAnd if we by our blindness and our wretchedness any time fall, we should readily rise, knowing the sweet touching of grace, and with all our will amend us upon the teaching of Holy Church, according as the sin is grievous, and go forthwith to God in love; and neither, on the one side, fall over low, inclining to despair, nor, on the other side, be over-reckless, as if we made no matter of it ; but nakedly acknowledge our feebleness, finding that we may not stand a twinkling of an eye but by Keeping of grace, and reverently cleave to God, on Him only trusting.\n\nFor after one wise is the Beholding by God, and after another wise is the Beholding by man.\n\nFor it belongeth to man meekly to accuse himself, and it belongeth to the proper Goodness of our Lord God courteously to excuse man.\n\nAnd these be two parts that were shewed in the double Manner of Regard with which the Lord beheld the falling of His loved Servant.\n\nThe one was shewed outward, very meekly and mildly, with great ruth and pity; and that of endless Love.\n\nAnd right thus willeth our Lord that we accuse our self, earnestly and truly seeing and knowing our falling and all the harms that come thereof; seeing and learning that we can never restore it; and therewith that we earnestly and truly see and know His everlasting love that He hath to us, and His plenteous mercy.\n\nAnd thus graciously to see and know both together is the meek accusing that our Lord asketh of us, and Himself worketh it where it is.\n\nAnd this is the lower part of man's life, and it was shewed in the [Lord's] outward manner of Regard.\n\nIn which shewing I saw two parts: the one is the rueful falling of man, the other is the worshipful Satisfaction that our Lord hath made for man.\n\nThe other manner of Regard was shewed inward : and that was more highly and all [fully] one .\n\nFor the life and the virtue that we have in the lower part is of the higher, and it cometh down to us [from out] of the Natural love of the [high] Self, by [the working of] grace.\n\nAtwix [the life of] the one and [the life of] the other there is right nought: for it is all one love."


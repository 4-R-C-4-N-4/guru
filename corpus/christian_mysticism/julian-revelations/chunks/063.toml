[content]
body = "For I saw in the same Shewing that much privity is hid, which may never be known until the time that God of His goodness hath made us worthy to see it; and therewith I am well-content, abiding our Lord's will in this high marvel.\n\nAnd now I yield me to my Mother, Holy Church, as a simple child oweth."


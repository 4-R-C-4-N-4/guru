[content]
body = "\"I was taught that I should see mine own sin, and not other men's sin except it may be for comfort and help of my fellow-Christians\" ( lxxvi. ) Also I had of this [Revelation] more understanding. In that He shewed me that I should sin, I took it nakedly to mine own singular person, for I was none otherwise shewed at that time. But by the high, gracious comfort of our Lord that followed after, I saw that His meaning was for the general Man: that is to say, All-Man; which is sinful and shall be unto the last day. Of which Man I am a member, as I hope, by the mercy of God. For the blessed comfort that I saw, it is large enough for us all. And here was I learned that I should see mine own sin, and not other men's sins but if it may be for comfort and help of mine even-Christians. And also in this same Shewing where I saw that I should sin, there was I learned to be in dread for unsureness of myself. For I wot not how I shall fall, nor I know not the measure nor the greatness of sin; for that would I have wist, with dread, and thereto I had none answer. Also our courteous Lord in the same time He shewed full surely and mightily the endlessness and the unchangeability of His love; and, afterward, that by His great goodness and His grace inwardly keeping, the love of Him and our soul shall never be disparted in two, without end. And thus in this dread I have matter of meekness that saveth me from presumption, and in the blessed Shewing of Love I have matter of true comfort and of joy that saveth me from despair. All this homely Shewing of our courteous Lord, it is a lovely lesson and a sweet, gracious teaching of Himself in comforting of our soul. For He willeth that we [should] know by the sweetness and homely loving of Him, that all that we see or feel, within or without, that is contrary to this is of the enemy and not of God. And thus;—If we be stirred to be the more reckless of our living or of the keeping of our hearts because that we have knowing of this plenteous love, then need we greatly to beware. For this stirring, if it come, is untrue; and greatly we ought to hate it, for it all hath no likeness of God's will. And when that we be fallen, by frailty or blindness, then our courteous Lord toucheth us and stirreth us and calleth us; and then willeth He that we see our wretchedness and meekly be aware of it. But He willeth not that we abide thus, nor He willeth not that we busy us greatly about our accusing, nor He willeth not that we be wretched over our self; but He willeth that we hastily turn ourselves unto Him. For He standeth all aloof and abideth us sorrowfully and mournfully till when we come, and hath haste to have us to Him. For we are His joy and His delight, and He is our salve and our life. When I say He standeth all alone, I leave the speaking of the blessed Company of heaven, and speak of His office and His working here on earth,—upon the condition of the Shewing."


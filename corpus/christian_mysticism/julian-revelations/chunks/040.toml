[content]
body = "\"The Spiritual Thirst (which was in Him from without beginning) is desire in Him as long as we be in need, drawing us up to His Bliss\" And thus our good Lord answered to all the questions and doubts that I might make, saying full comfortably: I may make all thing well, I can make all thing well, I will make all thing well, and I shall make all thing well; and thou shalt see thyself that all manner of thing shall be well.\n\nIn that He saith, I may , I understand [it] for the Father; and in that He saith, I can , I understand [it] for the Son; and where He saith, I will , I understand [it] for the Holy Ghost; and where He saith, I shall , I understand [it] for the unity of the blessed Trinity: three Persons and one Truth; and where He saith, Thou shalt see thyself , I understand the oneing of all mankind that shall be saved unto the blessed Trinity.\n\nAnd in these five words God willeth we be enclosed in rest and in peace.\n\nThus shall the Spiritual Thirst of Christ have an end.\n\nFor this is the Spiritual Thirst of Christ: the love-longing that lasteth, and ever shall, till we see that sight on Doomsday.\n\nFor we that shall be saved and shall be Christ's joy and His bliss, some be yet here and some be to come, and so shall some be, unto that day.\n\nTherefore this is His thirst and love-longing, to have us altogether whole in Him, to His bliss,—as to my sight.\n\nFor we be not now as fully whole in Him as we shall be then.\n\nFor we know in our Faith, and also it was shewed in all [the Revelations] that Christ Jesus is both God and man.\n\nAnd anent the Godhead, He is Himself highest bliss, and was, from without beginning, and shall be, without end: which endless bliss may never be heightened nor lowered in itself.\n\nFor this was plenteously seen in every Shewing, and specially in the Twelfth, where He saith: I am that [which] is highest .\n\nAnd anent Christ's Manhood, it is known in our Faith, and also [it was] shewed, that He, with the virtue of Godhead, for love, to bring us to His bliss suffered pains and passions, and died.\n\nAnd these be the works of Christ's Manhood wherein He rejoiceth; and that shewed He in the Ninth Revelation, where He saith: It is a joy and bliss and endless pleasing to me that ever I suffered Passion for thee.\n\nAnd this is the bliss of Christ's works , and thus he signifieth where He saith in that same Shewing: we be His bliss, we be His meed, we be His worship, we be His crown.\n\nFor anent that Christ is our Head, He is glorified and impassible; and anent His Body in which all His members are knit, He is not yet fully glorified nor all impassible.\n\nTherefore the same desire and thirst that He had upon the Cross (which desire, longing, and thirst, as to my sight, was in Him from without beginning) the same hath He yet, and shall [have] unto the time that the last soul that shall be saved is come up to His bliss.\n\nFor as verily as there is a property in God of ruth and pity, so verily there is a property in God of thirst and longing.\n\n(And of the virtue of this longing in Christ, we have to long again to Him: without which no soul cometh to Heaven.) And this property of longing and thirst cometh of the endless Goodness of God, even as the property of pity cometh of His endless Goodness."


[content]
body = "\"We shall see verily the cause of all things that He hath done; and evermore we shall see the cause of all things that He hath permitted\" I saw that God can do all that we need. And these three that I shall speak of we need: love, longing, pity. Pity in love keepeth us in the time of our need; and longing in the same love draweth us up into Heaven. For the Thirst of God is to have the general Man unto Him: in which thirst He hath drawn His Holy that be now in bliss; and getting His lively members, ever He draweth and drinketh, and yet He thirsteth and longeth. I saw three manners of longing in God, and all to one end; of which we have the same in us, and by the same virtue and for the same end. The first is, that He longeth to teach us to know Him and love Him evermore, as it is convenient and speedful to us. The second is, that He longeth to have us up to His Bliss, as souls are when they are taken out of pain into Heaven. The third is to fulfill us in bliss; and that shall be on the Last Day, fulfilled ever to last. For I saw, as it is known in our Faith, that the pain and the sorrow shall be ended to all that shall be saved. And not only we shall receive the same bliss that souls afore have had in heaven, but also we shall receive a new [bliss], which plenteously shall be flowing out of God into us and shall fulfill us; and these be the goods which He hath ordained to give us from without beginning. These goods are treasured and hid in Himself; for unto that time [no] Creature is mighty nor worthy to receive them. In this [fulfilling] we shall see verily the cause of all things that He hath done; and evermore we shall see the cause of all things that He hath suffered. And the bliss and the fulfilling shall be so deep and so high that, for wonder and marvel, all creatures shall have to God so great reverent dread, overpassing that which hath been seen and felt before, that the pillars of heaven shall tremble and quake. But this manner of trembling and dread shall have no pain; but it belongeth to the worthy might of God thus to be beholden by His creatures, in great dread trembling and quaking for meekness of joy, marvelling at the greatness of God the Maker and at the littleness of all that is made. For the beholding of this maketh the creature marvellously meek and mild. Wherefore God willeth—and also it belongeth to us, both in nature and grace—that we wit and know of this, desiring this sight and this working; for it leadeth us in right way, and keepeth us in true life, and oneth us to God. And as good as God is, so great He is; and as much as it belongeth to His goodness to be loved, so much it belongeth to His greatness to be dreaded. For this reverent dread is the fair courtesy that is in Heaven afore God's face. And as much as He shall then be known and loved overpassing that He is now, in so much He shall be dreaded overpassing that He is now. Wherefore it behoveth needs to be that all Heaven and earth shall tremble and quake when the pillars shall tremble and quake."


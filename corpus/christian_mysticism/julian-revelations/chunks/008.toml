[content]
body = "\"The Goodness of God is the highest prayer, and it cometh down to the lowest part of our need\" This Shewing was made to learn our soul wisely to cleave to the Goodness of God.\n\nAnd in that time the custom of our praying was brought to mind: how we use for lack of understanding and knowing of Love, to take many means [whereby to beseech Him].\n\nThen saw I truly that it is more worship to God, and more very delight, that we faithfully pray to Himself of His Goodness and cleave thereunto by His Grace, with true understanding, and steadfast by love, than if we took all the means that heart can think.\n\nFor if we took all these means, it is too little, and not full worship to God: but in His Goodness is all the whole, and there faileth right nought.\n\nFor this, as I shall tell, came to my mind in the same time: We pray to God for [the sake of] His holy flesh and His precious blood, His holy Passion, His dearworthy death and wounds: and all the blessed kindness, the endless life that we have of all this, is His Goodness.\n\nAnd we pray Him for [the sake of] His sweet Mother's love that Him bare; and all the help we have of her is of His Goodness.\n\nAnd we pray by His holy Cross that he died on, and all the virtue and the help that we have of the Cross, it is of His Goodness.\n\nAnd on the same wise, all the help that we have of special saints and all the blessed Company of Heaven, the dearworthy love and endless friendship that we have of them, it is of His Goodness.\n\nFor God of His Goodness hath ordained means to help us, full fair and many: of which the chief and principal mean is the blessed nature that He took of the Maid, with all the means that go afore and come after which belong to our redemption and to endless salvation.\n\nWherefore it pleaseth Him that we seek Him and worship through means, understanding that He is the Goodness of all.\n\nFor the Goodness of God is the highest prayer, and it cometh down to the lowest part of our need.\n\nIt quickeneth our soul and bringeth it on life, and maketh it for to waxen in grace and virtue.\n\nIt is nearest in nature; and readiest in grace: for it is the same grace that the soul seeketh, and ever shall seek till we know verily that He hath us all in Himself enclosed.\n\nFor He hath no despite of that He hath made, nor hath He any disdain to serve us at the simplest office that to our body belongeth in nature, for love of the soul that He hath made to His own likeness.\n\nFor as the body is clad in the cloth, and the flesh in the skin, and the bones in the flesh, and the heart in the whole, so are we, soul and body, clad in the Goodness of God, and enclosed.\n\nYea, and more homely: for all these may waste and wear away, but the Goodness of God is ever whole; and more near to us, without any likeness; for truly our Lover desireth that our soul cleave to Him with all its might, and that we be ever-more cleaving to His Goodness.\n\nFor of all things that heart may think, this pleaseth most God, and soonest speedeth [the soul].\n\nFor our soul is so specially loved of Him that is highest, that it overpasseth the knowing of all creatures: that is to say, there is no creature that is made that may [fully] know how much and how sweetly and how tenderly our Maker loveth us."


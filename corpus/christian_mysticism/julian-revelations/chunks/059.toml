[content]
body = "And then shall we all come into our Lord, our Self clearly knowing, and God fully having; and we shall endlessly be all had in God: Him verily seeing and fully feeling, Him spiritually hearing, and Him delectably in-breathing, and [of] Him sweetly drinking.\n\nAnd then shall we see God face to face, homely and fully.\n\nThe creature that is made shall see and endlessly behold God which is the Maker.\n\nFor thus may no man see God and live after, that is to say, in this deadly life.\n\nBut when He of His special grace will shew Himself here, He strengtheneth the creature above its self, and He measureth the Shewing, after His own will, as it is profitable for the time.\n\nANENT CERTAIN POINTS IN THE FOREGOING FOURTEEN REVELATIONS"


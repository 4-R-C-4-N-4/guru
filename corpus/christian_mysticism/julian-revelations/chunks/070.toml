[content]
body = "Then saith this courteous Lord in his meaning: Lo, lo, my loved Servant, what harm and distress he hath taken in my service for my love,—yea, and for his goodwill.\n\nIs it not fitting that I award him [for] his affright and his dread, his hurt and his maim and all his woe?\n\nAnd not only this, but falleth it not to me to give a gift that [shall] be better to him, and more worshipful, than his own wholeness should have been?—or else methinketh I should do him no grace.\n\nAnd in this an inward spiritual Shewing of the Lord's meaning descended into my soul: in which I saw that it behoveth needs to be, by virtue of His great [Goodness] and His own worship, that His dearworthy Servant, which He loved so much, should be verily and blissfully rewarded, above that he should have been if he had not fallen.\n\nYea, and so far forth, that his falling and his woe, that he hath taken thereby, shall be turned into high and overpassing worship and endless bliss.\n\nAnd at this point the shewing of the example vanished, and our good Lord led forth mine understanding in sight and in shewing of the Revelation to the end.\n\nBut notwithstanding all this forth-leading, the marvelling over the example went never from me: for methought it was given me for an answer to my desire, and yet could I not take therein full understanding to mine ease at that time.\n\nFor in the Servant that was shewed for Adam, as I shall tell, I saw many diverse properties that might in no manner of way be assigned to single Adam.\n\nAnd thus in that time I stood for much part in unknowing: for the full understanding of this marvellous example was not given me in that time.\n\nIn which mighty example three properties of the Revelation be yet greatly hid; and notwithstanding this [further forthleading], I saw and understood that every Shewing is full of secret things [left hid].\n\nAnd therefore me behoveth now to tell three properties in which I am somewhat eased.\n\nThe first is the beginning of teaching that I understood therein, in the same time; the second is the inward teaching that I have understood therein afterward; the third, all the whole Revelation from the beginning to the end (that is to say of this Book) which our Lord God of His goodness bringeth oftentimes freely to the sight of mine understanding.\n\nAnd these three are so oned, as to my understanding, that I cannot, nor may, dispart them.\n\nAnd by these three, as one, I have teaching whereby I ought to believe and trust in our Lord God, that of the same goodness of which He shewed it, and for the same end, right so, of the same goodness and for the same end He shall declare it to us when it is His will.\n\nFor, twenty years after the time of the Shewing, save three months, I had teaching inwardly, as I shall tell: It belongeth to thee to take heed to all the properties and conditions that were shewed in the example, though thou think that they be misty and indifferent to thy sight ."


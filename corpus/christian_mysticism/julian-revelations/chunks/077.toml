[content]
body = "\"We have now matter of mourning: for our sin is cause of Christ's pains; and we have, lastingly, matter of joy: for endless love made Him to suffer\" And thus I saw that God rejoiceth that He is our Father, and God rejoiceth that He is our Mother, and God rejoiceth that He is our Very Spouse and our soul is His loved Wife.\n\nAnd Christ rejoiceth that He is our Brother, and Jesus rejoiceth that He is our Saviour.\n\nThese are five high joys, as I understand, in which He willeth that we enjoy; Him praising, Him thanking, Him loving, Him endlessly blessing.\n\nAll that shall be saved, we have in us, for the time of this life, a marvellous mingling both of weal and woe: we have in us our Lord Jesus uprisen, we have in us the wretchedness and the mischief of Adam's falling, dying.\n\nBy Christ we are steadfastly kept, and by His grace touching us we are raised into sure trust of salvation.\n\nAnd by Adam's falling we are so broken, in our feeling, in diverse manners by sins and by sundry pains, in which we are made dark, that scarsely we can take any comfort.\n\nBut in our intent we abide in God, and faithfully trust to have mercy and grace; and this is His own working in us.\n\nAnd of His goodness He openeth the eye of our understanding, by which we have sight, sometime more and sometime less, according as God giveth ability to receive.\n\nAnd now we are raised into the one, and now we are suffered to fall into the other.\n\nAnd thus is this medley so marvellous in us that scarsely we know of our self or of our even-Christian in what way we stand, for the marvellousness of this sundry feeling.\n\nBut that same Holy Assent, that we assent to God when we feel Him, truly setting our will to be with Him, with all our heart, and with all our soul, and with all our might.\n\nAnd then we hate and despise our evil stirrings and all that might be occasion of sin, spiritual and bodily.\n\nAnd yet nevertheless when this sweetness is hid, we fall again into blindness, and so into woe and tribulation in diverse manners.\n\nBut then is this our comfort, that we know in our faith that by virtue of Christ which is our Keeper, we assent never thereto, but we groan there-against, and dure on, in pain and woe, praying, unto that time that He sheweth Him again to us.\n\nAnd thus we stand in this medley all the days of our life.\n\nBut He willeth that we trust that He is lastingly with as.\n\nAnd that in three manner.—He is with us in Heaven, very Man, in His own Person, us updrawing; and that was shewed in [the Shewing of] the Spiritual Thirst.\n\nAnd He is with us in earth, us leading; and that was shewed in the Third [Shewing], where I saw God in a Point.\n\nAnd He is with us in our soul, endlessly dwelling, us ruling and keeping; and that was shewed in the Sixteenth [Shewing], as I shall tell.\n\nAnd thus in the Servant was shewed the scathe and blindness of Adam's falling; and in the Servant was shewed the wisdom and goodness of God's Son.\n\nAnd in the Lord was shewed the ruth and pity of Adam's woe, and in the Lord was shewed the high nobility and the endless worship that Mankind is come to by the virtue of the Passion and death of His dearworthy Son."


[content]
body = "And in this endless Love man's Soul is kept whole, as the matter of the Revelations signifieth and sheweth: in which endless Love we be led and kept of God and never shall be lost.\n\nFor He willeth we be aware that our Soul is a life, which life of His Goodness and His Grace shall last in Heaven without end, Him loving, Him thanking, Him praising.\n\nAnd right the same that we shall be without end, the same we were treasured in God and hid, known and loved from without beginning.\n\nWherefore He would have us understand that the noblest thing that ever He made is mankind: and the fullest Substance and the highest Virtue is the blessed Soul of Christ.\n\nAnd furthermore He would have us understand that His dear worthy Soul [of Manhood] was preciously knit to Him in the making [by Him of Manhood's Substantial Nature] which knot is so subtle and so mighty that (it) —[man's soul]—is oned into God: in which oneing it is made endlessly holy.\n\nFurthermore He would have us know that all the souls that shall be saved in Heaven without end, are knit and oned in this oneing and made holy in this holiness."


[content]
body = "\"The Glad Giver\" \"All the Trinity wrought in the Passion of Jesus Christ\" And in these three words: It is a joy, a bliss, an endless satisfying to me , were shewed three heavens, as thus: For the joy, I understood the pleasure of the Father; and for the bliss, the worship of the Son; and for the endless satisfying, the Holy Ghost.\n\nThe Father is pleased, the Son is worshipped, the Holy Ghost is satisfied.\n\nAnd here saw I, for the Third Beholding in His blissful Passion: that is to say, the Joy and the Bliss that make Him to be well-satisfied in it.\n\nFor our Courteous Lord shewed His Passion to me in five manners: of which the first is the bleeding of the head; the second is, discolouring of His face; the third is, the plenteous bleeding of the body, in seeming [as] from the scourging; the fourth is, the deep dying:—these four are aforetold for the pains of the Passion.\n\nAnd the fifth is [this] that was shewed for the joy and the bliss of the Passion.\n\nFor it is God's will that we have true enjoying with Him in our salvation, and therein He willeth [that] we be mightily comforted and strengthened; and thus willeth He that merrily with His grace our soul be occupied.\n\nFor we are His bliss: for in us He enjoyeth without end; and so shall we in Him, with His grace.\n\nAnd all that He hath done for us, and doeth, and ever shall, was never cost nor charge to Him, nor might be, but only that [which] He did in our manhood, beginning at the sweet Incarnation and lasting to the Blessed Uprise on Easter-morrow: so long dured the cost and the charge about our redemption in deed : of [the] which deed He enjoyeth endlessly, as it is aforesaid.\n\nJesus willeth that we take heed to the bliss that is in the blessed Trinity [because] of our salvation and that we desire to have as much spiritual enjoying, with His grace, (as it is aforesaid): that is to say, that the enjoying of our salvation be [as] like to the joy that Christ hath of our salvation as it may be while we are here.\n\nAll the Trinity wrought in the Passion of Christ, ministering abundance of virtues and plenty of grace to us by Him: but only the Maiden's Son suffered: whereof all the blessed Trinity endlessly enjoyeth.\n\nAll this was shewed in these words: Art thou well pleased?\n\n—and by that other word that Christ said: If thou art pleased, then am I pleased; —as if He said: It is joy and satisfying enough to me, and I ask nought else of thee for my travail but that I might well please thee .\n\nAnd in this He brought to mind the property of a glad giver.\n\nA glad giver taketh but little heed of the thing that he giveth, but all his desire and all his intent is to please him and solace him to whom he giveth it.\n\nAnd if the receiver take the gift highly and thankfully, then the courteous giver setteth at nought all his cost and all his travail, for joy and delight that he hath pleased and solaced him that he loveth.\n\nPlenteously and fully was this shewed.\n\nThink also wisely of the greatness of this word \" ever .\" For in it was shewed an high knowing of love that He hath in our salvation, with manifold joys that follow of the Passion of Christ.\n\nOne is that He rejoiceth that He hath done it in deed, and He shall no more suffer; another, that He bought us from endless pains of hell."


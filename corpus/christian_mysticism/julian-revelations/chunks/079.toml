[content]
body = "Which one blessed love hath now, in us, double working: for in the lower part are pains and passions, mercies and forgiveness, and such other that are profitable; but in the higher part are none of these, but all one high love and marvellous joy: in which joy all pains are highly restored.\n\nAnd in this [time] our Lord showed not only our Excusing [from blame, in His beholding of our higher part], but the worshipful nobility that He shall bring us to [by the working of grace in our lower part], turning all our blame [that is therein, from our falling] into endless worship [when we be oned to the high Self above]."


body = "The Sixteenth is that the Blissful Trinity, our Maker, in Christ Jesus our Saviour endlessly dwelleth in our soul, worshipfully ruling and protecting all things, us mightily and wisely saving and keeping, for love; and we shall not be overcome of our Enemy."


[content]
body = "\"If I look singularly to myself, I am right nought\" Because of the Shewing I am not good but if I love God the better: and in as much as ye love God the better, it is more to you than to me. I say not this to them that be wise, for they wot it well; but I say it to you that be simple, for ease and comfort: for we are all one in comfort. For truly it was not shewed me that God loved me better than the least soul that is in grace; for I am certain that there be many that never had Shewing nor sight but of the common teaching of Holy Church, that love God better than I. For if I look singularly to myself, I am right nought; but in [the] general [Body] I am, I hope, in oneness of charity with all mine even-Christians. For in this oneness standeth the life of all mankind that shall be saved. For God is all that is good, as to my sight, and God hath made all that is made, and God loveth all that He hath made: and he that loveth generally all his even-Christians for God, he loveth all that is. For in mankind that shall be saved is comprehended all: that is to say, all that is made and the Maker of all. For in man is God, and God is in all. And I hope by the grace of God he that beholdeth it thus shall be truly taught and mightily comforted, if he needeth comfort. I speak of them that shall be saved, for in this time God shewed me none other. But in all things I believe as Holy Church believeth, preacheth, and teacheth. For the Faith of Holy Church, the which I had aforehand understood and, as I hope, by the grace of God earnestly kept in use and custom, stood continually in my sight: [I] willing and meaning never to receive anything that might be contrary thereunto. And with this intent I beheld the Shewing with all my diligence: for in all this blessed Shewing I beheld it as one in God's meaning. All this was shewed by three [ways]: that is to say, by bodily sight, and by word formed in mine understanding, and by spiritual sight. But the spiritual sight I cannot nor may not shew it as openly nor as fully as I would. But I trust in our Lord God Almighty that He shall of His goodness, and for your love, make you to take it more spiritually and more sweetly than I can or may tell it. THE SECOND REVELATION"


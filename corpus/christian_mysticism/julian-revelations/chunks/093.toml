[content]
body = "To the property of Motherhood belongeth natural love, wisdom, and knowing; and it is good: for though it be so that our bodily forthbringing be but little, low, and simple in regard of our spiritual forthbringing, yet it is He that doeth it in the creatures by whom that it is done.\n\nThe Kindly, loving Mother that witteth and knoweth the need of her child, she keepeth it full tenderly, as the nature and condition of Motherhood will.\n\nAnd as it waxeth in age, she changeth her working, but not her love.\n\nAnd when it is waxen of more age, she suffereth that it be beaten in breaking down of vices, to make the child receive virtues and graces.\n\nThis working, with all that be fair and good, our Lord doeth it in them by whom it is done: thus He is our Mother in Nature by the working of Grace in the lower part for love of the higher part.\n\nAnd He willeth that we know this: for He will have all our love fastened to Him.\n\nAnd in this I saw that all our duty that we owe, by God's bidding, to Fatherhood and Motherhood, for [reason of] God's Fatherhood and Motherhood is fulfilled in true loving of God; which blessed love Christ worketh in us.\n\nAnd this was shewed in all [the Revelations] and especially in the high plenteous words where He saith: It is I that thou lovest ."


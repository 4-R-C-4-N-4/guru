[content]
body = "For that contrariness is cause of our tribulations and all our woe, and our Lord Jesus taketh them and sendeth them up to Heaven, and there are they made more sweet and delectable than heart may think or tongue may tell.\n\nAnd when we come thither we shall find them ready, all turned into very fair and endless worships.\n\nThus is God our steadfast Ground: and He shall be our full bliss and make us unchangeable, as He is, when we are there."


[content]
body = "And thus Mercy and Pity dwelleth with mankind unto the time we come up into Heaven.\n\nBut man is blinded in this life and therefore we may not see our Father, God, as He is.\n\nAnd what time that He of His goodness willeth to shew Himself to man, He sheweth Himself homely, as man.\n\nNotwithstanding, I reason, in verity we ought to know and believe that the Father is not man.\n\nBut his sitting on the earth barren and desert, is to signify this:—He made man's soul to be His own City and His dwelling-place: which is most pleasing to Him of all His works.\n\nAnd what time that man was fallen into sorrow and pain, he was not all seemly to serve in that noble office; and therefore our Lord Father would prepare Himself no other place, but would sit upon the earth abiding mankind, which is mingled with earth, till what time by His grace His dearworthy Son had brought again His City into the noble fairness with His hard travail.\n\nThe blueness of the clothing betokeneth His steadfastness; the brownness of his fair face, with the seemly blackness of the eyes, was most accordant to shew His holy soberness.\n\nThe length and breadth of his garments, which were fair, flaming about, betokeneth that He hath, beclosed in Him, all Heavens, and all Joy and Bliss: and this was shewed in a touch [of time], where I have said: Mine understanding was led into the Lord ; in which [inward shewing] I saw Him highly rejoice for the worshipful restoring that He will and shall bring His servant to by His plenteous grace.\n\nAnd yet I marvelled, beholding the Lord and the Servant aforesaid.\n\nI saw the Lord sit stately, and the Servant standing reverently afore his Lord.\n\nIn which Servant there is double understanding, one without , another within.\n\nOutwardly :—he was clad simply, as a labourer which were got ready for his toil; and he stood full near the Lord—not evenly in front of him, but in part to one side, on the left.\n\nHis clothing was a white kirtle, single, old, and all defaced, dyed with sweat of his body, strait-fitting to him, and short—as it were an handful beneath the knee; [thread]bare, seeming as it should soon be worn out, ready to be ragged and rent.\n\nAnd of this I marvelled greatly, thinking: this is now an unseemly clothing for the Servant that is so greatly loved to stand in afore so worshipful a Lord.\n\nAnd inwardly in him was shewed a ground of love: which love that he had to the Lord was even-like to the love that the Lord had to him.\n\nThe wisdom of the Servant saw inwardly that there was one thing to do which should be to the worship of the Lord.\n\nAnd the Servant, for love, having no regard to himself nor to nothing that might befall him, hastily he started and ran at the sending of his Lord, to do that thing which was his will and his worship.\n\nFor it seemed by his outward clothing as he had been a continuant labourer of long time, and by the inward sight that I had both of the Lord and the Servant it seemed that he was a new [one], that is to say, new beginning to travail: which Servant was never sent out afore.\n\nThere was a treasure in the earth which the Lord loved.\n\nI marvelled and thought what it might be, and I was answered in mine understanding: It is a food which is delectable and pleasant to the Lord ."


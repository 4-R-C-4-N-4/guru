[content]
body = "\"There is no dread that fully pleaseth God in us but reverent dread\" For I understand [that there be] four manner of dreads.\n\nOne is the dread of an affright that cometh to a man suddenly by frailty.\n\nThis dread doeth good, for it helpeth to purge man, as doeth bodily sickness or such other pain as is not sin.\n\nFor all such pains help man if they be patiently taken.\n\nThe second is dread of pain, whereby man is stirred and wakened from sleep of sin.\n\nHe is not able for the time to perceive the soft comfort of the Holy Ghost, till he have understanding of this dread of pain, of bodily death, of spiritual enemies; and this dread stirreth us to seek comfort and mercy of God, and thus this dread helpeth us, and enableth us to have contrition by the blissful touching of the Holy Ghost.\n\nThe third is doubtful dread.\n\nDoubtful dread in as much as it draweth to despair, God will have it turned in us into love by the knowing of love: that is to say, that the bitterness of doubt be turned into the sweetness of natural love by grace.\n\nFor it may never please our Lord that His servants doubt in His Goodness.\n\nThe fourth is reverent dread: for there is no dread that fully pleaseth God in us but reverent dread.\n\nAnd that is full soft, for the more it is had, the less it is felt for sweetness of love.\n\nLove and Dread are brethren, and they are rooted in us by the Goodness of our Maker, and they shall never be taken from us without end.\n\nWe have of nature to love and we have of grace to love: and we have of nature to dread and we have of grace to dread.\n\nIt belongeth to the Lordship and to the Fatherhood to be dreaded, as it belongeth to the Goodness to be loved: and it belongeth to us that are His servants and His children to dread Him for Lordship and Fatherhood, as it belongeth to us to love Him for Goodness.\n\nAnd though this reverent-dread and love be not parted asunder, yet they are not both one, but they are two in property and in working, and neither of them may be had without other.\n\nTherefore I am sure, he that loveth, he dreadeth, though that he feel it but a little.\n\nAll dreads other than reverent dread that are proffered to us, though they come under the colour of holiness yet are not so true, and hereby may they be known asunder.—That dread that maketh us hastily to flee from all that is not good and fall into our Lord's breast, as the Child into the Mother's bosom, with all our intent and with all our mind, knowing our feebleness and our great need, knowing His everlasting goodness and His blissful love, only seeking to Him for salvation, cleaving to [Him] with sure trust: that dread that bringeth us into this working, it is natural, gracious, good and true.\n\nAnd all that is contrary to this, either it is wrong, or it is mingled with wrong.\n\nThen is this the remedy, to know them both and refuse the wrong.\n\nFor the natural property of dread which we have in this life by the gracious working of the Holy Ghost, the same shall be in heaven afore God, gentle, courteous, and full delectable.\n\nAnd thus we shall in love be homely and near to God, and we shall in dread be gentle and courteous to God: and both alike equal."


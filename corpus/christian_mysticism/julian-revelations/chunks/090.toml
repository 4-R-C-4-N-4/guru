[content]
body = "Thus worketh our Mother in Mercy to all His children which are to Him yielding and obedient.\n\nAnd Grace worketh with Mercy, and specially in two properties, as it was shewed: which working belongeth to the Third Person, the Holy Ghost.\n\nHe worketh rewarding and giving .\n\nRewarding is a large giving-of-truth that the Lord doeth to him that hath travailed; and giving is a courteous working which He doeth freely of Grace, fulfilling and overpassing all that is deserved of creatures.\n\nThus in our Father, God Almighty, we have our being; and in our Mother of Mercy we have our reforming and restoring: in whom our Parts are oned and all made perfect Man; and by [reward]-yielding and giving in Grace of the Holy Ghost, we are fulfilled.\n\nAnd our Substance is [in] our Father, God Almighty, and our Substance is [in] our Mother, God, All-wisdom; and our Substance is in our Lord the Holy Ghost, God All-goodness.\n\nFor our Substance is whole in each Person of the Trinity, which is one God.\n\nAnd our Sense-soul is only in the Second Person Christ Jesus; in whom is the Father and the Holy Ghost: and in Him and by Him we are mightily taken out of Hell, and out of the wretchedness in Earth worshipfully brought up into Heaven and blissfully oned to our Substance: increased in riches and in nobleness by all the virtues of Christ, and by the grace and working of the Holy Ghost."


[content]
body = "The persons that were with me looked on me, and wet my temples, and my heart began to comfort.\n\nAnd anon a light smoke came in the door, with a great heat and a foul stench.\n\nI said: Benedicite Domine!\n\nit is all on fire that is here!\n\nAnd I weened it had been a bodily fire that should have burnt us all to death.\n\nI asked them that were with me if they felt any stench.\n\nThey said, Nay: they felt none.\n\nI said: Blessed be God!\n\nFor then wist I well it was the Fiend that was come to tempest me.\n\nAnd anon I took to that [which] our Lord had shewed me on the same day, with all the Faith of Holy Church (for I beheld it is both one), and fled thereto as to my comfort.\n\nAnd anon all vanished away, and I was brought to great rest and peace, without sickness of body or dread of conscience.\n\nTHE SIXTEENTH REVELATION"


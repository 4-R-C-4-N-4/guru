[content]
body = "\"In every soul that shall be saved is a Godly Will that never assented to sin, nor ever shall.\" \"Ere that He made us He loved us, and when we were made we loved Him\" And I saw that He willeth that we understand He taketh not harder the falling of any creature that shall be saved than He took the falling of Adam, which, we know, was endlessly loved and securely kept in the time of all his need, and now is blissfully restored in high overpassing joy.\n\nFor our Lord is so good, so gentle, and so courteous, that He may never assign default [in those] in whom He shall ever be blessed and praised.\n\nAnd in this that I have now told was my desire in part answered, and my great difficulty some deal eased, by the lovely, gracious Shewing of our good Lord.\n\nIn which Shewing I saw and understood full surely that in every soul that shall be saved is a Godly Will that never assented to sin, nor ever shall: which Will is so good that it may never will evil, but evermore continually it willeth good; and worketh good in the sight of God.\n\nTherefore our Lord willeth that we know this in the Faith and the belief; and especially that we have all this blessed Will whole and safe in our Lord Jesus Christ.\n\nFor that same Kind that Heaven shall be filled with behoveth needs, of God's rightfulness, so to have been knit and oned to Him, that therein was kept a Substance which might never, nor should, be parted from Him; and that through His own Good Will in His endless foreseeing purpose.\n\nBut notwithstanding this rightful knitting and this endless oneing, yet the redemption and the again-buying of mankind is needful and speedful in everything, as it is done for the same intent and to the same end that Holy Church in our Faith us teacheth.\n\nFor I saw that God began never to love mankind: for right the same that mankind shall be in endless bliss, fulfilling the joy of God as anent His works, right so the same, mankind hath been in the foresight of God: known and loved from without beginning in his rightful intent.\n\nBy the endless assent of the full accord of all the Trinity, the Mid-Person willed to be Ground and Head of this fair Kind: out of Whom we be all come, in Whom we be all enclosed, into Whom we shall all wend, in Him finding our full Heaven in everlasting joy, by the foreseeing purpose of all the blessed Trinity from without beginning.\n\nFor ere that He made us He loved us, and when we were made we loved Him.\n\nAnd this is a Love that is made , [to our Kindly Substance], [by virtue] of the Kindly Substantial Goodness of the Holy Ghost; Mighty, in Reason, [by virtue] of the Might of the Father; and Wise, in Mind, [by virtue] of the Wisdom of the Son.\n\nAnd thus is Man's Soul made by God and in the same point knit to God.\n\nAnd thus I understand that man's Soul is made of nought: that is to say, it is made, but of nought that is made.\n\nAnd thus:—When God should make man's body He took the clay of earth, which is a matter mingled and gathered of all bodily things; and thereof He made man's body.\n\nBut to the making of man's Soul He would take right nought, but made it.\n\nAnd thus is the Nature-made rightfully oned to the Maker, which is Substantial Nature not-made: that is, God.\n\nAnd therefore it is that there may nor shall be right nought atwix God and man's Soul."


[content]
body = "That he stood adread before the Lord and not even-right, betokeneth that His clothing was not seemly to stand in even-right afore the Lord, nor that might not, nor should not, be His office while He was a labourer; nor also He might not sit in rest and peace with the Lord till He had won His peace rightfully with His hard travail; and that he stood by the left side [betokeneth] that the Father left His own Son, willingly, in the Manhood to suffer all man's pains, without sparing of Him.\n\nBy that his kirtle was in point to be ragged and rent , is understood the blows, the scourgings, the thorns and the nails, the drawing and the dragging, His tender flesh rending.\n\n(As I saw in some part [before] how the flesh was rent from the skull, falling in pieces until the time when the bleeding ceased, and then it began to dry again, cleaving to the bone.) And by the struggling and writhing, groaning and moaning, is understood that He might never rise almightily from the time that He was fallen into the Maiden's womb, till his body was slain and dead, He yielding the soul into the Father's hands with all Mankind for whom He was sent.\n\nAnd at this point He began first to shew His might: for He went into Hell, and when He was there He raised up the great Root out of the deep deepness which rightfully was knit to Him in high Heaven.\n\nThe body was in the grave till Easter-morrow, and from that time He lay nevermore.\n\nFor then was rightfully ended the struggling and the writhing, the groaning and the moaning.\n\nAnd our foul deadly flesh that God's Son took on Him, which was Adam's old kirtle, strait, [worn]-bare, and short, was then by our Saviour made fair, new, white and bright and of endless cleanness; loose and long ; fairer and richer than was then the clothing which [before] I saw on the Father: for that clothing was blue, but Christ's clothing is [coloured] now of a fair seemly medlour, which is so marvellous that I can it not describe: for it is all of very worships.\n\nNow sitteth not the Son on earth in wilderness, but He sitteth in His noblest Seat, which He made in Heaven most to His pleasing.\n\nNow standeth not the Son afore the Father as a Servant afore the Lord dreadingly, meanly clad, in part naked; but He standeth afore the Father even-right, richly clad in blissful largeness, with a Crown upon His head of precious richness.\n\nFor it was shewed that we be His Crown : which Crown is the Joy of the Father, the Worship of the Son, the Satisfying of the Holy Ghost, and endless marvellous Bliss to all that be in Heaven.\n\nNow standeth not the Son afore the Father on the left side, as a labourer, but He sitteth on His Father's right hand, in endless rest and peace.\n\n(But it is not meant that the Son sitteth on the right hand, side by side, as one man sitteth by another in this life,—for there is no such sitting, as to my sight, in the Trinity,—but He sitteth on His Father's right hand,—that is to say: in the highest nobleness of the Father's joys.) Now is the Spouse, God's Son, in peace with His loved Wife, which is the Fair Maiden of endless Joy."


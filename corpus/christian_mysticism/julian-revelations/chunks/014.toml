[content]
body = "\"God willeth to be seen and to be sought: to be abided and to be trusted\" And after this I saw with bodily sight in the face of the crucifix that hung before me, on the which I gazed continually, a part of His Passion: despite, spitting and sullying, and buffetting, and many languoring pains, more than I can tell, and often changing of colour.\n\nAnd one time I saw half the face, beginning at the ear, over-gone with dry blood till it covered to the mid-face.\n\nAnd after that the other half [was] covered on the same wise, the whiles in this [first] part [it vanished] even as it came.\n\nThis saw I bodily, troublously and darkly; and I desired more bodily sight, to have seen more clearly.\n\nAnd I was answered in my reason: If God will shew thee more, He shall be thy light: thee needeth none but Him.\n\nFor I saw Him sought.\n\nFor we are now so blind and unwise that we never seek God till He of His goodness shew Himself to us.\n\nAnd when we aught see of Him graciously, then are we stirred by the same grace to seek with great desire to see Him more blissfully.\n\nAnd thus I saw Him, and sought Him; and I had Him, I wanted Him.\n\nAnd this is, and should be, our common working in this [life], as to my sight.\n\nOne time mine understanding was led down into the sea-ground, and there I saw hills and dales green, seeming as it were moss-be-grown, with wrack and gravel.\n\nThen I understood thus: that if a man or woman were under the broad water, if he might have sight of God so as God is with a man continually, he should be safe in body and soul, and take no harm: and overpassing, he should have more solace and comfort than all this world can tell.\n\nFor He willeth we should believe that we see Him continually though that to us it seemeth but little [of sight]; and in this belief He maketh us evermore to gain grace.\n\nFor He will be seen and He will be sought: He will be abided and he will be trusted.\n\nThis Second Shewing was so low and so little and so simple, that my spirits were in great travail in the beholding,—mourning, full of dread, and longing: for I was some time in doubt whether it was a Shewing.\n\nAnd then diverse times our good Lord gave me more sight, whereby I understood truly that it was a Shewing.\n\nIt was a figure and likeness of our foul deeds' shame that our fair, bright, blessed Lord bare for our sins: it made me to think of the Holy Vernacle at Rome, which He hath portrayed with His own blessed face when He was in His hard Passion, with steadfast will going to His death, and often changing of colour.\n\nOf the brownness and blackness, the ruefulness and wastedness of this Image many marvel how it might be, since that He portrayed it with His blessed Face who is the fairness of heaven, flower of earth, and the fruit of the Maiden's womb.\n\nThen how might this Image be so darkening in colour and so far from fair?—I desire to tell like as I have understood by the grace of God:— We know in our Faith, and believe by the teaching and preaching of Holy Church, that the blessed Trinity made Mankind to His image and to His likeness.\n\nIn the same manner-wise we know that when man fell so deep and so wretchedly by sin, there was none other help to restore man but through Him that made man."


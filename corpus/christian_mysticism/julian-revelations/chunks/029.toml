[content]
body = "\"The Love that made Him to suffer passeth so far all His Pains as Heaven is above Earth\" Then said our good Lord Jesus Christ: Art thou well pleased that I suffered for thee?\n\nI said: Yea, good Lord, I thank Thee; Yea, good Lord, blessed mayst Thou be.\n\nThen said Jesus, our kind Lord: If thou art pleased, I am pleased: it is a joy, a bliss, an endless satisfying to me that ever suffered I Passion for thee; and if I might suffer more, I would suffer more.\n\nIn this feeling my understanding was lifted up into Heaven, and there I saw three heavens: of which sight I marvelled greatly.\n\nAnd though I see three heavens—and all in the blessed manhood of Christ—none is more, none is less, none is higher, none is lower, but [they are] even-like in bliss.\n\nFor the First Heaven, Christ shewed me His Father; in no bodily likeness, but in His property and in His working.\n\nThat is to say, I saw in Christ that the Father is.\n\nThe working of the Father is this, that He giveth meed to His Son Jesus Christ.\n\nThis gift and this meed is so blissful to Jesus that His Father might have given Him no meed that might have pleased Him better.\n\nThe first heaven, that is the pleasing of the Father, shewed to me as one heaven; and it was full blissful: for He is full pleased with all the deeds that Jesus hath done about our salvation.\n\nWherefore we be not only His by His buying, but also by the courteous gift of His Father we be His bliss, we be His meed, we be His worship, we be His crown.\n\n(And this was a singular marvel and a full delectable beholding, that we be His crown!) This that I say is so great bliss to Jesus that He setteth at nought all His travail, and His hard Passion, and His cruel and shameful death.\n\nAnd in these words: If that I might suffer more, I would suffer more ,—I saw in truth that as often as He might die, so often He would , and love should never let Him have rest till He had done it.\n\nAnd I beheld with great diligence for to learn how often He would die if He might.\n\nAnd verily the number passed mine understanding and my wits so far that my reason might not, nor could, comprehend it.\n\nAnd when He had thus oft died, or should, yet He would set it at nought, for love: for all seemeth Him but little in regard of His love.\n\nFor though the sweet manhood of Christ might suffer but once, the goodness in Him may never cease of proffer: every day He is ready to the same, if it might be.\n\nFor if He said He would for my love make new Heavens and new Earth, it were but little in comparison; for this might be done every day if He would, without any travail.\n\nBut to die for my love so often that the number passeth creature's reason, it is the highest proffer that our Lord God might make to man's soul, as to my sight.\n\nThen meaneth He thus: How should it not be that I should not do for thy love all that I might of deeds which grieve me not, sith I would, for thy love, die so often, having no regard to my hard pains?\n\nAnd here saw I, for the Second Beholding in this blessed Passion the love that made Him to suffer passeth as far all His pains as Heaven is above Earth.\n\nFor the pains was a noble, worshipful deed done in a time by the working of love: but Love was without beginning, is, and shall be without ending."


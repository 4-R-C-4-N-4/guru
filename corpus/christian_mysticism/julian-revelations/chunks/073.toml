[content]
body = "For I saw the Lord sit as a man, and I saw neither meat nor drink wherewith to serve him.\n\nThis was one marvel.\n\nAnother marvel was that this majestic Lord had no servant but one, and him he sent out.\n\nI beheld, thinking what manner of labour it might be that the Servant should do.\n\nAnd then I understood that he should do the greatest labour and hardest travail: that is, he should be a gardener, delve and dyke, toil and sweat, and turn the earth upside-down, and seek the deepness, and water the plants in time.\n\nAnd in this he should continue his travail and make sweet floods to run, and noble and plenteous fruits to spring, which he should bring afore the Lord to serve him therewith to his desire.\n\nAnd he should never turn again till he had prepared this food all ready as he knew that it pleased the Lord.\n\nAnd then he should take this food, with the drink in the food, and bear it full worshipfully afore the Lord.\n\nAnd all this time the Lord should sit in the same place, abiding his Servant whom he sent out.\n\nAnd yet I marvelled from whence the Servant came.\n\nFor I saw in the Lord that HE hath within Himself endless life, and all manner of goodness, save that treasure that was in the earth.\n\nAnd [also] that [treasure] was grounded in the Lord in marvellous deepness of endless love, but it was not all to His worship till the Servant had thus nobly prepared it, and brought it before Him in himself present.\n\nAnd without the Lord was nothing but wilderness.\n\nAnd I understood not all what this example meant, and therefore I marvelled whence the Servant came.\n\nIn the Servant is comprehended the Second Person in the Trinity; and in the Servant is comprehended Adam: that is to say, All-Man.\n\nAnd therefore when I say the Son , it meaneth the Godhead which is even with the Father; and when I say the Servant , it meaneth Christ's Manhood, which is rightful Adam.\n\nBy the nearness of the Servant is understood the Son, and by the standing on the left side is understood Adam.\n\nThe Lord is the Father, God; the Servant is the Son, Christ Jesus; the Holy Ghost is Even Love which is in them both.\n\nWhen Adam fell, God's Son fell: because of the rightful oneing which had been made in heaven, God's Son might not [be disparted] from Adam.\n\n(For by Adam I understand All-Man.) Adam fell from life to death, into the deep of this wretched world, and after that into hell: God's Son fell with Adam, into the deep of the Maiden's womb, who was the fairest daughter of Adam; and for this end: to excuse Adam from blame in heaven and in earth; and mightily He fetched him out of hell.\n\nBy the wisdom and goodness that was in the Servant is understood God's Son; by the poor clothing as a labourer standing near the left side, is understood the Manhood and Adam, with all the scathe and feebleness that followeth.\n\nFor in all this our good Lord shewed His own Son and Adam but one Man.\n\nThe virtue and the goodness that we have is of Jesus Christ, the feebleness and the blindness that we have is of Adam: which two were shewed in the Servant.\n\nAnd thus hath our good Lord Jesus taken upon Him all our blame, and therefore our Father nor may nor will more blame assign to us than to His own Son, dearworthy Christ."


[content]
body = "The men of the 2nd He , the multitude from which the other classes are continually recruited: the People.\n\nThe four great symbols are placed upon the table at random, and Man rules them and must arrange them; in the twenty-first arcana we shall find these symbols arranged in a cross.\n\nWe already know that the first card of the Tarot is completed by the twenty-first (21 + 1 = 22), and we see why, if this first card represents Microcosm , the last would represent Macrocosm , and the eleventh card, which serves as the universal link to all the complements of the Tarot, represents the Vital reflex Current , which serves as a link between the worlds.\n\nBut we must not anticipate, so we will return to our first arcanum.\n\nThis symbol is the first of the whole Tarot, and it bears the Unity as its characteristic number.\n\nThe Unity-principle, the origin of which is impenetrable to human conceptions, is placed at the beginning of all things.\n\nWe cannot seize the origin of this primal cause, which we are content to assert according to the absolute law of analogies so well expressed by Eliphas Levi-- \"Je crois à l'inconnu que Dieu personnifie , Prouvé par l'être même et par l'immensité, Ideál SURHUMAIN de la philosophie, Parfaite Intelligence et Suprême Bonté.\" If we cannot follow this Unknown in its principle, it is at least easy to us to follow it in its consequences, and therefore our study will be only the development of the Unity-principle in creation, related according to the Cosmogony of ancient initiation.\n\nGod , Man , and the Universe are, then, the three meanings of our first card, and we will now say a few words upon the application of these data to all the other cards of the pack.\n\nEXTENSION OF THE THREE GREAT PRINCIPLES THROUGH THE TAROT.\n\nThe three meanings of the first card respectively represent-- The Creator or Yod .\n\nThe Receiver or He .\n\nThe Transformer or Vau .\n\nLastly, the transition to the second He , which is not under consideration at present.\n\nBut the first card of the Tarot, taken as a whole , represents the Creator or Yod , the second card taken as a whole will therefore represent the Receiver or He , and the third the Transformer or Vau .\n\nEach of them will also show the four aspects of Yod-he-vau-he in the idea which it expresses.\n\nBut what is true of the ternary, is also true of the Septenary, so that the first Septenary, taken as a whole, will represent the CREATOR.\n\nThe second septenary will represent the RECEIVER.\n\nThe third the TRANSFORMER.\n\nLastly, the ternary of transition will.\n\nrepresent the return of effects to causes, and of consequences to the principle.\n\nLet us condense this all by saying-- 1st septenary represents God.\n\n2nd septenary ---- Man.\n\n3rd septenary ---- the Universe.\n\nMoreover, each of these elements is contained in the two others in all points of their manifestations.\n\nGENERAL RECAPITULATION.\n\nWe have now to recapitulate all the acceptations of the first card in a general figure.\n\nAs each card in the Tarot will have the same recapitulation, we think it may be useful to explain the scheme followed in this arrangement.\n\nAt the head of the figure will be found the Hebrew number and letter of the card.\n\nBelow it, the name usually given to the card in the Tarot.\n\nTo the right of the figure are the significations in the Three Worlds: Divine, Human, and Natural.\n\nBelow these three significations is found the absolute key to each card, according to the figure of the revolutions of the word Yod-he-vau-he ."


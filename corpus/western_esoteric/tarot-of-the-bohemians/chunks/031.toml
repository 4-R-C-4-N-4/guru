[content]
body = "But the labours of Court de Gébelin , and above all of Fabre d'Olivet , are the most remarkable in this respect.\n\nIn his Langue Hébraïque Restituée , this learned Initiate established the existence of primitive hieroglyphic signs from which the Hebrew letters are derived.\n\nAll these writers, starting from very different points, agree in their conclusions, and this gives us a strong argument in favour of the truth of their inquiries.\n\nBut it matters very little to us whether these 16 primitive signs are the direct origin, either of the Hebrew, Sanscrit, Chinese, or Greek letters.\n\nThe identity of source tends strongly to identity of results, and any one of these derivative alphabets will answer our purpose.\n\nThe Hebrew alphabet, composed of 22 letters, seems preferable to us, on account of the concordance between the number of its letters and that of the Arcana in our Tarot.\n\nWe shall therefore adopt, as the starting-point of our study, the Hebrew alphabet of 22 letters, derived from the 16 primitive hieroglyphic signs.\n\nThis conclusion is scarcely reached, when fresh light shines upon us from all sides.\n\nGuillaume Postel reveals to us the connection between the Hebrew letters and the Tarot; Van Helmont fils , Claude de Saint-Martin , Fabre d'Olivet , all confirm our opinion; lastly, Eliphas Levi also throws the weight of his marvellous learning into the question.\n\nBut we are more surprised to find that the Sepher Yetzirah , an old book of the Kabbalah, which contains a study upon the formation of the Hebrew alphabet, arrives at a division of the letters which exactly corresponds with the astrological data contained in an old manuscript in the Vatican, upon which Christian based his horoscopic works.\n\nOne single and identical conclusion arises from all these different points of view: the value of the Hebrew letter as a symbol.\n\nIn it we possess a real symbol, of which we can ascertain not only the meanings, but also the origin.\n\nWe could then make a Tarot exclusively composed of Hebrew letters and of numbers, but this is not our object; we are seeking to discover in the symbolism of the Hebrew characters the symbolism of the Tarot, and we shall thus realize our intention of ascertaining deductively the value of the figures of the Tarot and the reason they have been chosen.\n\nTHE HEBREW LETTERS AS THE BASIS OF THE SYMBOLICAL TAROT.\n\nWe shall now study the Hebrew letters one by one, in determining successively-- 1st.\n\nThe hieroglyphic value of each one of them according to its origin (Fabre d'Olivet, Barrois), 2nd.\n\nIts symbolic value derived from this hieroglyphic (Fabre d'Olivet, Eliphas Levi, Christian); 3rd.\n\nIts astronomical value (Christian and the Sepher Yetzirah .).\n\nOnce acquainted with these data, it will be easy for us to deduce from them the application of the letters to the symbols of the Tarot.\n\nBut before we enter upon this study, it is necessary to say a few words upon the Hebrew alphabet in general and its constitution.\n\nThe alphabet of the Hebrews is composed of 22 letters; these letters, however, are not placed by chance, one after the other.\n\nEach of them corresponds with a number according to its rank, with a hieroglyphic according to its form, with a symbol according to its affinities with the other letters.\n\nAs we have already said, all the letters are derived from one amongst them, the yod .\n\nThe yod has generated them in the following manner (see Sepher Yetzirah )-- 1st.\n\nThree mothers: The A (Aleph) א The M (The Mem) מ The Sh (The Shin) ש 2nd."


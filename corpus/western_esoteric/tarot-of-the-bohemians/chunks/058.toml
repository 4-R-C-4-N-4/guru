[content]
body = "THE DEVIL.\n\nTHE DEVIL.\n\n15.\n\nס 15th Hebrew letter (Samech).\n\nORIGIN OF THE SYMBOLISM OF THE FIFTEENTH CARD OF THE TAROT.\n\nThe Samech expresses the same hieroglyphic sign as the Zain (7th arcanum), that is to say, an arrow; a weapon of any kind; but to this idea is here added that of the arrow making a circular movement, of any circle defining and delimiting a circumscription.\n\nThis idea of an impassable circle has given birth to that of Destiny, of Fatality, circumscribing the limits of the circle in which the human will can act freely; so that the Serpent forming a circle of his own body, biting his own tail, has always been the symbol of this Fatality, of this Destiny, encircling the world in its embrace.\n\nIt is the image of the year (the ring), and of the fatal and settled revolutions of time.\n\nAs a letter, the Samech is the link (Zain) reinforced and turned back upon itself.\n\nAs a simple letter, it corresponds with the zodiacal sign of Sagittarius.\n\nFIFTEENTH CARD OF THE TAROT.\n\nThe Devil .\n\nIn every cosmogony the Devil represents the mysterious astral force, the origin of which is revealed to us by the hieroglyphic of Samech.\n\nBut a little attentive consideration of the symbol will show us that it contains several of the details which we have already seen in other figures of the Tarot, but under a different aspect.\n\nIf we place the Juggler by the side of the Devil we shall see that the arms of the two personages are using the same gesture, but in an inverse sense.\n\nThe Juggler points his right hand towards the Universe, his left hand towards God; on the other hand the Devil raises his right band into the air, whilst his left points to the earth.\n\nInstead of the magic initiating wand of the Juggler, the Demon holds the lighted torch, the symbol of black magic and of Destruction.\n\nBy the side of the Devil, and balanced by him, are two personages reproducing the same symbolism that we find in the two women of the Lovers (6), and in the two supports of the gibbet of the Hanged Man (12).\n\nThe universal vivifying force represented by the 3rd arcanum, has here become the universal destroying force.\n\nThe sceptre of Venus-Urania has become the Demon's torch, the Angel's wings have changed into the hideous pinions of the God of Evil.\n\nThe 3rd arcanum symbolizes the Holy Spirit, or the Providence of Fabre d'Olivet.\n\nThe 15th arcanum symbolizes the False Spirit, or the Destiny of Fabre d'Olivet.\n\n15+3 = 18/2 = 9.\n\nThe 9th arcanum, which fills the centre between the two figures, symbolizes Prudence, or the Human Will of Fabre d'Olivet.\n\nThe Devil has materialized upon his head the universal fluid which surrounded the head of the Juggler; this is indicated by the two six-pointed horns which adorn him.\n\nHe stands upon a cube placed upon a sphere, to indicate the domination of Matter (the cube) over the Spirit (the Sphere).\n\nThe fifteenth card of the Tarot derives its signification from its own symbolism-- 1.\n\nDESTINY (chance).\n\n2.\n\nFATALITY, the result of the fall of Adam-Eve.\n\n3.\n\nThe astral fluid, which individualizes.\n\nNARASH, the Dragon of the Threshold.\n\n15.\n\nס The Devil ."


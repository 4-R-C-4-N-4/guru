[content]
body = "THE FIRST CARD OF THE TAROT.\n\nORIGIN OF THE SIGNIFICATION OF ALL THE OTHERS.\n\nWe see from our preceding work that if we know the exact meaning of the first card of the Tarot we can, from that, discover the signification of all the others.\n\nWe cannot approach this subject without great hesitation.\n\nThe hope of ascertaining the truth is, in fact, troubled by the possibility of making a mistake which might have very serious results.\n\nThe work which we have already accomplished will, however, enable us to decipher the meaning of the symbolism of the first card of the Tarot almost mathematically, but the general meaning only; whilst we know that each card must have not one, but three meanings.\n\nWe must discover three sufficiently general principles to be applied to every order of human knowledge; for this should be the object of the Tarot.\n\nIn this case we will, as usual, resort to those eminent authors who have treated these questions from different points of view, and the agreement between their teachings will give us new light to illuminate our path.\n\nThe Pole HŒNÉ WRONSKI, who died of hunger in the suburbs of Paris, was perhaps one of the most powerful intellects produced by the 19th century.\n\nHe asserted that he had discovered the formula of the absolute, and his works are unquestionably a summary of one of the most elevated syntheses that we have ever seen.\n\nWe need not discuss the doctrines of Wronski, but will only say a few words upon the three primitive elements which enter into his law of creation.\n\nWronski places at the origin of all creation three elements, which he designates by the names-- Of Neuter Element (E.\n\nN.) Of Element of Being (E.\n\nB.) Of Element of Wisdom (E.\n\nW.) The Neuter Element represents the Absolute, Reality resulting from the total neutralization of the two other elements by each other.\n\nThe Element of Wisdom represents the CREATIVE FACULTY with its especial characteristics, autogeny and spontaneity.\n\nThe Element of Being represents the PERMANENT FACULTY with its characteristics, autothesis and inertia.\n\nPrinciple of the Creation or Element of Wisdom.\n\nPrinciple of Preservation or Element of Being.\n\nPrinciple of Neutralization or Neuter Element.\n\nThese are the three terms upon which Wronski establishes the foundations of Reality, and, consequently, of all the systems of creation.\n\nWe must remember these conclusions.\n\nFABRE D'OLIVET, in his researches upon the first principles which direct everything, determines the existence of three elements, which he names Providence, Destiny, and Human Will.\n\nProvidence is the principle of ABSOLUTE LIBERTY, of the creation of beings and things.\n\nDestiny is the principle of ABSOLUTE NECESSITY, of the preservation of beings and of things.\n\nLastly, the Human Will is a neuter principle intermediate between the two: the principle of mobility and CHANGE, in all their forms.\n\nNow it is not necessary to be very learned to perceive the absolute agreement which exists between the two authors; the one, Wronski, reached his conclusions by mathematics, the other, d'Olivet, attained his by profound study of antiquity and its mysteries.\n\nThe words used may vary, but the idea is fundamentally the same.\n\nWronski's Element of Wisdom (E.\n\nW.), the principle of the creation , is the same thing as the Providence of d'Olivet, who thus places it as the principle of the creation.\n\nWronski's Element of Being (E.\n\nB.), the principle of the permanent faculty , exactly represents what d'Olivet calls Destiny, and which he concludes to be the principle of preservation.\n\nLastly, d'Olivet's human Will corresponds in all points with Wronski's Neuter Element.\n\nHere then are two very different systems, which lead to the same signification."


[content]
body = "He first descends through the spiritual decade (Sceptre and Cup) (see the figure), traversing numbers of increasing complexity: King, 1, 4, 7, then 10 By this 10, the multiple unity, limit of materialization, which unites the two portions of the decade Sceptre-Cup, he resumes in an inverse sense, as though by a reascending are, the road which will lead him back to plate X., remounting the 4, 7, 10, and King of Cups and Swords, the substantial duad.\n\nThis is only one-third of the voyage which the living atom must accomplish in the real world; and, in this first excursion through matter, he has still retained the spiritual character which he received from Yod (י), the characteristic of plate X.; he must now lose this character for that of the following E (ה).\n\nTo this end, he passes from plate X., which he has just re-entered, to plate XI.\n\n(ה), the Hermit , the veiled Lamp , to pass in the same way as he has already done through the dual series of the Sceptre-Cup, through the Queens, the 2, 5, and 8, passing by the 10 of Cups, and remounting by it through the second series, Sword-Pentacles, to the arcanum XI., the starting-point of this second excursion.\n\nFinally, from this last arcanum he passes to number XII.\n\n(י), the Sacrifice , descends the neuter series of the Knight , 3, 6, 9 of Sceptres and Cups, crosses the 10 of Swords and the 10 of Pentacles, and remounts by the dual Swords and Pentacles to the intelligible world.\n\nHis journey across the material world is completed; he has travelled over the Zodiac; he will now die; the arcanum XIII.\n\nis ready for him, and will give him access to the spiritual world, to the Redemption.\n\nWe will now explain some other features of this distribution.\n\nIt divides the external circle of the Equator into 3 arcs, subdivided into 4 portions; in all 12 divisions of different characters.\n\nThese are the 12 signs of the Zodiac.\n\nThe first is naturally ranked with the first card of the minor arcana in the spiritual sector, i.\n\ne.\n\nthe King of Sceptres (Spades); the second corresponds with the King of Cups, and so on to the twelfth.\n\nOne observation will suffice to justify the connection between the zodiac and our cards.\n\nWe must note the 12 divisions of the circle into the triple repetition of the 4 letters of the Sacred Name; an operation legitimized by the remark already made, that these 4 colours correspond with these letters (see Fig.\n\n2 , in the intermediate circle, where the signs of the Zodiac are written).\n\nWe at once recognize the 4 trigons of the Zodiac, corresponding with the elements which the 4 colours also represent, and these trigons are characterized as well as designated.\n\nThe fiery trigon ( , , ), corresponding with the Sceptre and the letters יוי, is swayed by the spiritual element.\n\nThe earthy trigon ( , , ), corresponding to the Cup and to the letters ההה namely, two E's of the name of 3 letters, and the final E of the name of 4 letters--an essentially feminine character, substantial, but of superior order.\n\nThe airy trigon ( , , ), corresponding to the Sword and the letters והה swayed by the masculine element of the second order."


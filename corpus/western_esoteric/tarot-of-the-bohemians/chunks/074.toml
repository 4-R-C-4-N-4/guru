[content]
body = "Osiris , the author of being, the source of all life, is Goodness.\n\n\"The Egyptian god is called Amen when he is regarded as the hidden force which brings all things to the light; he is Ptah when he accomplishes all things with skill and truth; lastly, when he is the good and beneficent god, he is named Osiris .\"--JAMBLIQUE Indeterminable Principle RA Divine Trinity : + AMEN - PTAH ∞ OSIRIS HINDU THEOGONY.\n\nIndeterminable Principle PARABRAHM: + BRAHMA Creator - VISHNU Preserver ∞ SIVA Transformer Here is an analysis of this conception applied to Cosmogony.-- PRIMITIVE, HINDU COSMOGONY, ACCORDING TO THE RIG-VEDA.\n\nThere was neither being nor no-being, nor ether, nor the roof of the heavens; nothing enveloping nor enveloped.\n\nThere was neither death nor immortality; nothing separated the darkness of night from the light of day.\n\nBut That One, the HE, breathed alone with HER, whose life was sustained in his breast.\n\nOf all those who have existed since that time, no other then existed.\n\nThe darkness covered them like an ocean, which cannot be lightened.\n\nThis universe was indistinct, like the fluids mingled with the waters; but this mass, which was covered by a crust, was at last organized by the power of contemplation.\n\nThe first wish was formed in its intelligence, and it became the original productive seed.\n\nThis productive seed became Providence or sensitive souls ; and Matter or Elements , SHE who was supported in his breast was the inferior part, and HE who observes was the superior part.\n\nWho can know exactly, and who in this world can assert, from whom or how this creation took place?\n\nThe gods are posterior to this creation of the world.\n\nKABBALISTIC THEOGONY.\n\nIndeterminable Principle EN SOPH The Absolute Divine Trinity : + CHOCMAH Absolute Wisdom - BINAH Absolute Intelligence ∞ KETHER Absolute Equilibrist Power We might carry these comparisons much further; but it is useless to prolong our studies unreasonably.\n\nThe curious reader can refer to the works on the ancient theogonies, and see the universal harmony that exists in the primitive principles of all religions.\n\nIt will be sufficient if we determine the universality of the three first principles, which we name, like the Christians, in order to be clearly understood-- + GOD THE FATHER - GOD THE SON ∞ GOD THE HOLY SPIRIT These principles once defined, we shall see them in action throughout creation.\n\nThe first principle had manifested its existence to itself in the second principle named by Christians: the Son.\n\nLastly, these two principles had embodied themselves in the third, which gave them substance.\n\nThis is why we have named the Holy Spirit the body of God.\n\nNow the same law of creation acting in the affinities of the first principle with the second, will manifest itself in the action of the first ternary upon itself, to give birth to the following Trinity:-- God the Father , the principle of Will , is entirely self-reflected in the rough ADAM, the principle of Power ; God the Son , the principle of Intelligence , is self-reflected in the gentle EVE, the principle of Authority .\n\nLastly, God as a whole, or God the Holy Spirit, clothed these two mystical unities in a body, and made a reality of them in the balanced creation of Adam-Eve, or of HUMANITY.\n\nHumanity , the image of Love , also contains in itself a rough, astringent principle (see Jacob Boëhm ), and a gentle, insinuating principle (Jacob Boëhm).\n\nThe first of these principles, symbolized by Adam, is the origin of brute Force, of Power in all its manifestations."


body = "4--Passage from one series to another.\n\nWe can then represent the series in this way-- And what is true for each of the terms of a ternary is also true for the ternary taken as a whole , and this leads us to new considerations.\n\nFor the first ternary would be positive, corresponding to Yod , the active, the creator.\n\nThe second ternary would be negative, and would correspond to the first He , i.\n\ne.\n\nthat all the terms of this ternary would be reflections of the terms of the first, just as the second card was the reflex of the first.\n\nThis gives us-- We can thus determine the meaning of the arcana 4, 5, 6, 7 in the three worlds, since we know the meaning of the arcana 1, 2, 3, 4.\n\nWe need only refer to the study of the Tarot by numbers, to find the symbols, which correspond respectively to Yod , to He , to Vau , and to the second He .\n\nBut if the second ternary is the reflex of the first, the same rule applies to the septenaries.\n\nAll the cards of the second septenary will therefore be the symbolical reflection of those of the first.\n\nAll the cards of the third septenary are representatives of the third term, or of transformation.\n\nWe have then-- The 1 st septenary , Which represents the active Creation .\n\nThe Divine Osiris-Brahma, or the Father.\n\nThe 2 nd septenary , Which represents Preservation .\n\nThe Astral, Isis, Vishnu, the Son.\n\nThe 3rd septenary , Which represents Transformation , Physics, Horus, Siva, the Holy Spirit.\n\nThe three first arcana will therefore give the sense of all the others according to the following figure: FIGURE SHOWING THE SENSE OF EACH OF THE 22 MAJOR ARCANA yod positive or creative series 1.\n\n4.\n\n7.\n\n10.\n\n13.\n\n16.\n\n19.\n\n1st he negative or preservative series 2.\n\n5.\n\n8.\n\n11.\n\n14.\n\n17.\n\n20.\n\nvau neuter or transforming series equilibrium 3.\n\n6.\n\n9.\n\n12.\n\n15.\n\n18.\n\n21.\n\n2nd he transitional series 4 = + positive (1) = negative ---- + ---- - ---- + ---- - ---- ∞ yod positive or creative series he negative or preservative series vau neuter or transforming series equilibrium 2nd he transitional series This figure is very important, for it enables us to see at once the symbolical value of any card in the Tarot, by working in the following way-- TO DISCOVER À PRIORI THE SYMBOLICAL VALUE OF ANY CARD IN THE TAROT.\n\nWe must see-- (1 st ) Which Hebrew letter is written to the left in the horizontal column, which contains the card under consideration.\n\n(2 nd ) Which Hebrew letter is written at the foot of the vertical column , containing the card.\n\n(3 rd ) Which sign (+ or -) governs the secondary vertical column, containing the card in question.\n\nEXAMPLE: I wish to determine the sense of the 5th arcanum.\n\nI look to the left and find the Hebrew letter he .\n\nThis shows that the 5th arcanum is the he of what?\n\nIn order to know, I look at the vertical column and find yod .\n\nThe 5th arcanum is the he of yod , but that is not enough, so I look at the secondary column which contains the sign (-) negative.\n\nI thus obtain a definite description of the 5th arcanum.\n\nThe fifth card of the Tarot is-- The He of Yod considered negatively .\n\nThis is a synthetic formula comprehensible to those only who are used to manipulating the sense of the word Yod-he-vau-he .\n\nIt is therefore necessary to give further explanations.\n\nHe represents the reflex ."


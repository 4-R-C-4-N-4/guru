body = "THE TAROT.\n\nCHAPTER I.\n\nINTRODUCTION TO THE STUDY OF THE TAROT.\n\nApproaching End of Materialism--Synthesis--The Occult Science--The Secret Societies--The Cultus-- The People , Organ of the Transmission of Esoterism--The Gypsies--The Sacred Word of Freemasonry--Our Work.\n\n\"Therefore you must open the book and carefully weigh the statements made in it.\n\nThen you will know that the drug within is of very different value from the promise of the box, that is to say, that the subjects treated in it are not so frivolous as the title may imply.\"--RABBLAIS.\n\nWE are on the eve of a complete transformation of our scientific methods.\n\nMaterialism has given us all that we can expect from it, and inquirers, disappointed as a rule, hope for great things from the future, whilst they are unwilling to spend more time in pursuing the path adopted in modern times.\n\nAnalysis has been carried, in every branch of knowledge, as far as possible, and has only deepened the moats which divide the sciences.\n\nSynthesis becomes necessary; but how can we realize it?\n\nIf we would condescend to waive for one moment our belief in the indefinite progress and fatal superiority of later generations over the ancients, we should at once perceive that the colossal civilizations of antiquity possessed Science, Universities, and Schools.\n\nIndia and Egypt are still strewn with valuable remains, which reveal to archæologists the existence of this ancient science.\n\nWe are now in a position to affirm that the dominant character of this teaching was synthesis, which condenses in a few very simple laws the whole of the acquired knowledge.\n\nBut the use of synthesis had been almost entirely lost, through several causes, which it is important to enumerate.\n\nAmongst the ancients, knowledge was only transmitted to men whose worth had been proved by a series of tests.\n\nThis transmittal took place in the temples, under the name of mysteries , and the adept assumed the title of priest or Initiate .\n\nThis science was therefore secret or occult, and thus originated the name of occult science , given by our contemporaries to the ancient synthesis.\n\nAnother reason for the limited diffusion of the higher branches of knowledge, was the length and difficulty of the journeys involved before the most important centres of initiation could be reached.\n\nHowever, when the Initiates found that a time was approaching when these doctrines might be lost to humanity, they made strenuous efforts to save the law of synthesis from oblivion.\n\nThree great methods were used for this purpose-- 1.\n\nSecret societies,, a direct continuation of the mysteries ; 2.\n\nThe cultus, a symbolic translation of the higher doctrines, for the use of the people; 3.\n\nLastly, the people itself became the unconscious depository of the doctrine.\n\nLet us now see what use each of these groups made of the treasure confided to it.\n\nTHE SECRET SOCIETIES.\n\nThe school of Alexandria was the principal source from which the secret societies of the West arose.\n\nThe majority of the Initiates had taken refuge in the East, and quite recently (in 1884) the West discovered the existence in India, and above all in Thibet, of an occult fraternity, which possessed, practically, the ancient synthesis in its integrity.\n\nThe Theosophite Society was founded with the object of uniting Western initiation with Oriental initiation.\n\nBut we are less interested in the existence of this doctrine in the East, than in the history of the development of the initiative societies in the West.\n\nThe Gnostic sects, the Arabs, Alchemists, Templars, Rosicrucians, and lastly the Freemasons, form the Western chain in the transmission of occult science.\n\nA rapid glance over the doctrines of these associations is sufficient to."


body = "SAINT MARTIN (Louis Claude de).-- Tableau naturel des Rapports qui existent entre Dieu, l'Homme et l'Univers , 2 vols., 8vo., Edinburgh, 1782 298 SEPHER YETZIRAH, the (translation by Papus), Paris, 1888, 8vo.\n\n(Carré).\n\nSCHOPENHAUER.--First principles.\n\nSCHURÉ.--Editor of the Revue des Deux Mondes .\n\nHas just published a fine study upon esoterism, Les grande Initiés (Perrin, editor).\n\nSIMON.-- La Cité Chinoise , 18mo., 1884.\n\nSIVRY (Ch.\n\nde) 300 SINNET.-- Esoteric Buddhism , 1884, 18mo.\n\nTRITHEMUS (1462-1516).--A remarkably learned man, the master of Cornelius Agrippa.\n\nVAILLANT (J.\n\nA.).-- Les Rômes, histoire vraie des vrais Bohemiens , Paris, 1850, 8vo.\n\n298 VIRGIL.--The Æneid 7 VEDAS, the.\n\nVAN HELMONT (Mercure).-- Principia Philosophique antiquissimæ et recentissimæ , Amsterdam, 1690.\n\nMercury Van Helmont is reputed to have initiated Leibnitz.\n\nWEBER (Louis Zénon).--Author of important philosophical works published in the Initiation 178 WIRTH (Oswald).--The Astronomical Tarot (in the course of work).\n\nSee Index.\n\nWRONSKI (Hoené).-- Le Messianism ou Réforme Absolue du Savoir Humain , Paris, 1825, 3 vols., small folio.\n\nSee the complementary list of his numerous works in Occultism Contemporain by Papus .\n\nWOLSKA (A.\n\nde).\n\nYVES D'ALVEYDRE (Saint).-- La Mission des Juifs , Paris, 1884, large 8vo.\n\nof more than 1000 pp.\n\nAlcan Levy, publisher.\n\n(Fundamental work.)"


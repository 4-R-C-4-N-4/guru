body = "CHAPTER VII.\n\nCONNECTION BETWEEN THE MAJOR AND MINOR ARCANA.\n\nGENERAL AFFINITIES.\n\nKEY OF THE TAROT.\n\nDomination of the 1st Septenary--Affinities of the 2nd Septenary in the Tarot, Card by Card--Ditto of the 3rd Septenary--General Affinities--Affinities of Yod , He , Vau , and of the 2nd He .\n\nGeneral figure giving the Key to the Tarot.\n\nCONNECTION BETWEEN THE MAJOR AND MINOR ARCANA..\n\nTHE Pentacles on one side, the Ternary of transition on the other, establish the connection between the major and minor arcana.\n\nThis connection is found in the general affinities of the four letters of the tetragrammaton.\n\nThe 1st septenary, which corresponds to yod , governs all the correspondents of yod in the minor series, that is to say-- The 4 Kings.\n\nThe 4 Aces.\n\nThe 4 Fours, The 4 Sevens.\n\nEach element of the septenary governs different terms, thus-- 1 st Septenary .\n\nThe arcana 1 and 4 govern King -1.4.7 of Sceptres.\n\n---- 2 and 5 ---- ---- of Cups.\n\n---- 3 and 6 ---- ---- of Swords.\n\nThe arcanum 7 ---- ---- of Pentacles.\n\nMoreover-- The 1st arcanum especially governs the positive terms of the series, i.\n\ne.-- Arcanum The King of Yod or of Sceptres (+).\n\n1 (+) The King of Vau or of Swords (-).\n\nThe 4th arcanum especially governs the negative terms of the series-- Arcanum The King of He ...\n\nCups 4 (-) The King of the 2nd He + Pentacles (-).\n\nBy applying the same law to the other arcana we find-- Arcanum Ace of Yod (+) Sceptres.\n\n(+) 2 Ace of Vau (-) Swords.\n\nArcanum Ace of He (+) Cups.\n\n(-) 5 Ace of He (-) Pentacles Arcanum 3 4 of Sceptres (+).\n\n(+) 4 of Swords (-) Arcanum 6 4 Of Cups (+).\n\n(-) 4 of Pentacles (-).\n\nArcanum 7 All the transitional terms.\n\n(∞) 7 (∞).\n\nSECOND SEPTENARY.--The second septenary, corresponding, to He , governs all the correspondents of the first He , in the minor series, that is to say-- The 4 Queens.\n\nThe 4 Twos.\n\nThe 4 Fives.\n\nThe 4 Eights.\n\nEach element of the second septenary has the following dominations-- Arcanum 7 (+) Queen of Sceptres, (+) Queen of Swords, (-) Arcanum 10 (-) Queen of Cups, (+) Queen of Pentacles, (-) Arcanum 8 (+) Two of Sceptres, (+) Two of Swords, (-) Arcanum 11 (-) Two of Cups, (+) Two of Pentacles, (-) Arcanum 9 (+) Five of Sceptres, (+) Five of Swords, (-) Arcanum 12 (-) Five of Cups, (+) Five of Pentacles, (-) Arcana 13 (∞) All the 8, (∞) THIRD SEPTENARY.--The third septenary corresponds to Vau , and rules over-- The 4 Knights.\n\nThe 4 Threes.\n\nThe 4 Sixes.\n\nThe 4 Nines."


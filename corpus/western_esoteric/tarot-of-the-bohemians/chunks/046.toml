[content]
body = "The 4 balances the 5 and the 6.\n\nThe 5 ---------- the 4 and the 6.\n\nThe 6 ---------- the 4 and the 5.\n\nIts signification proceeds from this:-- In the Divine .\n\nThe Equilibrium between Will and Intelligence-- BEAUTY (characteristic of the Holy Spirit).\n\nIn the Human .\n\nThe Equilibrium between Power and Authority-- LOVE (characteristic of Humanity).\n\nCHARITY.\n\nIn Nature .\n\nThe Equilibrium between the Universal soul and the Universal life-- THE UNIVERSAL ATTRACTION.\n\nUniversal Love.\n\n6.\n\nו The Lovers.\n\nAFFINITIES SIGNIFICATIONS Primitive Hieroglyphic: The eye, The ear Kabbalah: TIPHERETH Astronomy: The Bull Month: April Hebrew Letter: Vau (simple) Equilibrium of Will and Intelligence BEAUTY __________ Equilibrium of Power and Authority LOVE CHARITY OBSERVATIONS Equilibrium of the Universal Soul and the Universal Life THE UNIVERSAL ATTRACTION or UNIVERSAL LOVE 1ST SEPTENARY.\n\nCONSTITUTION OF GOD."


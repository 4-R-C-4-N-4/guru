body = "2 vols., 4to., (Bib.\n\nNat., A.\n\n969).\n\nKORAN, the.\n\nLEVI (Eliphas, pseudonym of the Abbé Constant).-- Dogme et Rituel de la Haute Magie , Paris, 2 vols., 8vo.; Histoire de la Magie , 8vo., Paris; La Clef des grands Mystères , 8vo., Paris (Fundamental works) 299 LENAIN.-- La Science Kabbalistique , 8vo.\n\n(A good summary.) LACURIA (P.\n\nF.\n\nG.).-- Harmonies de l'Être exprimées par les nombres , Paris, 1847, 8vo., 2 vols.\n\n(Fundamental work.) LFJAY (Julien).--Editor of the Initiation .\n\nHas made an application of occult synthesis to Sociology.\n\nLACOUR.-- Les Œloïm ou dieux de Moise , Paris, 1325, 8vo., 2 vols.\n\nLOUIS LUCAS.-- La Chimie Nouvelle , 1854, 8vo.; La Médecine Nouvelle , 1863, 2 vols., 8vo.; Le Roman Alchimique , 1853, 8vo.\n\n(Fundamental works) 226 MONTIÉRE (George).--Chief Editor of the Revue l'Initiation .\n\nMOSES.-- Le Sepher Bereschit (Genesis).\n\nMERLIN.-- Origine des cartes a jouer, recherches nouvelles sur les naïbis, les tarots et sur les autres espèces de cartes , Paris, 4to., 1869.\n\nMANOEL DE GRANDFORT.\n\nMORSIER (Emilie de).\n\nNUS (Engène).--Philosopher, the author of several works upon Spiritualism.\n\nLes Grands Mystères , Paris, librarie des Sciences, psychologiques, 8vo.\n\nOLCOTT (Colonel).--President of the Theosophite Society of Adyar, which now includes more than 175 branches in different parts of the world.\n\nPAPUS.-- Traité Elémentaire de Science Occulte , Paris, 1887, 18mo.\n\n(4th edit.).\n\nPARACELSUS.--Works by.\n\nPOSTEL (Guillaume).-- La Clef des Choses Cachées (Latin), 12mo.\n\n297 POLTI and GARY.-- La Théorie des Tempéraments , 1889, 18mo.\n\n(Carré, publisher.) PÉLADAN (Joséphin).-- La décadence Latine , Ethopœia, in 7 vols.\n\n(Edinger, Paris) 299 POIREL, E.--Occultist, editor of the Tarot de Wirth , and of several other reproductions deduced from occult science 300 RABELAIS (epigraph) 3 RAGON.-- Orthodoxie Maçonnique , followed by Maçonnerie Occulte and the Initiation Hermitique .\n\n----- Maçonnerie Occulte, with a Treatise on the Planets , 8vo.\n\n----- La Messe et ses Mystères , 18mo., Paris, 1863.\n\nROCA (Abbé).-- Le Monde Nouveau , 1889, 8vo., Paris.\n\nROUXEL.--The author of important works upon Magnetism , published in the Initiation ."


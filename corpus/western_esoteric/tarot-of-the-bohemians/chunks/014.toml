body = "CHAPTER V.\n\nTHE KEY TO THE MINOR ARCANA.\n\nFormation of the Tarot--Study of a Colour--The Four Figures--The Ten Numbers--Affinity between the Figures and the Numbers--Study of the Four Colours--General Study of the Minor Arcana.\n\nTHE KEY TO THE MINOR ARCANA.\n\nTHE Tarot is composed of 78 cards, divided as follows-- 56 cards called the minor arcana.\n\n22 cards called the major arcana.\n\nThe 56 minor arcana are formed of 4 series of 14 cards each.\n\nThe 22 major arcana are formed of 21 numbered cards, and of one un-numbered.\n\nIn order to study the Tarot with success, we must then arrange the following packets-- 4 packets of 14 cards each.\n\n14 + 14 + 14 + 14 = 56 1 packet of 21 cards = 21 1 packet of 1 card = 1 Total .\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n78 We shall presently return to the origin of this marvellous conception of the human mind, but for the present we must confine ourselves to the dissection of the machine, and to displaying its mysterious arrangement.\n\nStarting from a fixed and immovable principle, the constitution of the sacred tetragrammaton, Yod-he-vau-he , the Tarot develops the most divers combinations, without one departure from its basis.\n\nWe shall now unveil this wonderful construction, which confirms in its application the universal law of analogies.\n\nThe explanations which follow may appear dry to some persons; but they must remember that we are now giving them an almost infallible key to the ancient or occult science; and they will understand that they must open the door of the sacred arch for themselves.\n\nSTUDY OF A COLOUR.\n\nLet us now take one of the packets of fourteen cards and analyze its construction.\n\nThis packet, taken as a whole, corresponds to one of the colours of our pack of cards.\n\nThe 4 packets respectively represent the wands or sceptres , corresponding to our clubs; the cups or goblets , corresponding to our hearts; the swords , corresponding to our spades; and money or Pentacles , corresponding to our diamonds.\n\nWe shall now study one of these packets, for instance that of Sceptres .\n\nThe packet consists of 4 figures: the king, queen, knight, and knave, and of ten cards which simply bear numbers.\n\nThe ace, two, three, four, five, six, seven, eight, nine, and ten.\n\nTHE FOUR FIGURES.\n\nWe must first consider the four figures-- The king represents the active, the man, or male.\n\nThe queen represents the passive, the woman, or female.\n\nThe knight represents the neuter, the adolescent.\n\nLastly, the knave represents the 4th term of this sequence, which may be figured in this way-- King Queen Knave Knight This sequence is only an application of the general law Yod-he-vau-he , which we already know, and the analogy is easily established-- King or Yod Queen or 1 st He Knave or 2 nd He Knight or Vau The knave therefore corresponds with the second He , i.\n\ne.\n\nit is only a term of transition; but transition between what?\n\nBetween the four figures and the ten numbers following.\n\nTHE TEN NUMBERS.\n\nLet us now study these numbers.\n\nWe are acquainted with the Law of numbers, or law of the sequences, which we have already stated in these terms-- 1 -- 2.\n\n3 4 -- 5.\n\n6 7 -- etc.\n\nThe ten cards cannot escape from this law, and we can at once arrange them in series."


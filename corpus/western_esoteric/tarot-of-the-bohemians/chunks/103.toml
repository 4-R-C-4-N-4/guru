[content]
body = "The watery trigon ( , , ), corresponding to the Pentacle and to the letters ההה, comprising, this time, the final E of the name of 4 letters twice repeated, and the E of the name of 3 letters--the dominant character, the inferior feminine.\n\nBut we must leave the minor arcana to the investigations of the reader--they would lead us too far--and return to some further notice of the great arcana.\n\nLet us first notice how the three chief sectors preserve and reproduce their innate characters in all their divisions.\n\nWe find, in the first, that of the letter Yod (י), the Spirit, the numbers of the unity, I., IV., VII., X.\n\n(repeated in the minor arcana); as figure , the Kings; as colour , the Sceptre; in the Zodiac , the lines of the ascension of the sun above the Equator from the spring to the solstice.\n\nIn the second sector (ה) the substantial principle is the feminine numbers II., V., VIII., XI.\n\n(repeated in the minor arcana); as figure , the Queens; as colour , the Cup; in the Zodiac , the four signs of the descent of the sun towards the Equator; the season of harvests and vintages, fecundity in all its forms.\n\nFIG.\n\n2 In the third sector (ו), the Son, the Element, are the sacred numbers which participate in the two preceding orders, III., VI., IX.; as figure , the Knight; as colour , the Pentacle of the practical world, and the Sword also, which close the preceding sector; in the Zodiac , the signs through which the sun passes in the southern hemisphere; our winter, the season for the consumption of the produce of the earth, of renovation for the cycle which follows: Christmas is in the centre; the new birth in the winter of death; the time when the Son was born into an inferior world to reanimate it.\n\nThe divine Name יהוה is not only written in the series of concentric circles, it is also found upon the lines belonging to those circles, either in descending or in remounting.\n\nThe first sector gives it without transposition, as we see in Fig.\n\n2 .\n\nIn the second sector the divine Name is preceded by the feminine letter E, the Mother, and finally pauses at it: E, IEVE, IE.\n\n(See the figure .) In the third, it commences by the letter of the Son and ends by that of the Father, to which he returns: VE, IEVE, I.\n\nWe shall now inquire from the symbols of the cards the different ways of pronouncing the divine Name, and also the various manifestations in the Kosmos of each of these four letters .\n\nLet us question even the spirit of these symbols, instead of their number, colour, or form, which have chiefly occupied us at present.\n\nBy first following the regular order of our arrangement we shall find-- In the divine world: the arcana I., II., III., IV., the divine Tetractys, comprising: (1) the Absolute Being ; (2) the Consciousness of the Absolute; (3) Love or the power of fecundity; (4) the realization of the virtualities of the Absolute .\n\nIn the world of laws: arcanum V., the laws of the relation of the Created with the Uncreate (the Initiator , Fear also ).\n\nVI.\n\n( Liberty , Beauty ); knowledge of good and evil; knowledge of the Law.\n\nVII.\n\n(Glory); rule of the Spirit over Matter, the fertile power of the Law; and VIII.\n\n( absolute Justice , Victory ), realization of the Law.\n\nIn the physical world: arcana IX.\n\n( the veiled Lamp ), the light extinguished in the darkness of the substance, the spirit imprisoned in the material world, Yesod .\n\nX."


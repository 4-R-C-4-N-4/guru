[content]
body = "Divine hierarchies Arcanum XX.\n\n11th hour Nirvana!\n\nArcanum XXII.\n\n12th hour Need we add how much effort and time (years, lives, often centuries) are required for each of these hours , how few there are who pass even the first steps?\n\nAnd what can we expect from their knowledge?\n\nThe hope of indefinite progress towards the realization of our most radiant hopes, the desire to attain at least those first realizations, so that we may derive from them the assurance of the others; confidence in the instruction of those whom we recognize for masters already far advanced; lastly, the certainty that in these fruitful doctrines we shall find the salvation of our suffering societies, as well as the most longed-for individual happiness.\n\nAnd these desires, this confidence, are felt after the first preliminary studies.\n\nTo succeed, we need undertake but one work at first, that which the Sphinx depicts to us: moral and intellectual preparations.\n\nBut only the man who seriously undertakes them can know what immense and persevering efforts they exact!\n\nMay this rough glimpse of them inspire the reader with the desire and the courage to devote himself to them with all the ardour of Hope!\n\nF.\n\nCH.\n\nBARLET."


[content]
body = "If, on the contrary, he be worthy of the higher regions, this baptism of fire renders him one of the Magi; the sources of terrestrial life are at his disposition; he becomes a Therapeut.\n\nHaving reached this point, he will then learn to know the celestial spheres progressively as he knows the terrestrial one, and to dominate them; three hours are consecrated to this exploration-- ARCANUM XVII.: The Star of the Magi .\n\nEighth hour of Apollonius: \" The astral virtues of the elements, of seed of every kind .\" This is the region of the principles of the solar system: in it life becomes clear; its distribution from the solar centre to all the planets, and their reciprocal influences, are understood in all their details, in what the occultists name the Correspondences .\n\nThe Initiate is then master of Astrology in every branch of the science, in the widest meaning, of its acceptation.\n\nARCANUM XVIII.: The Twilight .\n\nNinth hour of Apollonius: \" Nothing is finished here .\" The Initiate now extends his perceptions beyond our solar system, \"beyond the Zodiac\"; he is in sight of the Infinite; he touches the limits of the intelligible world; the divine light commences to show itself, the object of new terror and danger.\n\nARCANUM XIX.: The Resplendent Light .\n\nTenth hour of Apollonius: \" The gates of heaven are open, and man is born again, docile in the lethargic sleep .\" The Idea appears to the regenerate soul of the Initiate, or, in the language of the Occultist, the spiritual sun will rise for him; he will by a new regeneration enter the Divine World , in which man dies no more.\n\nTwo steps remain before the highest human destinies can be accomplished-- ARCANUM XX.: The Awakening of the Dead .\n\nEleventh hour of Apollonius: \" The Angels, the Cherubim, and the Seraphim fly with rustling wings; there is joy in heaven, the earth rises, and the Sun, which issues from Adam .\" This is the hierarchy of the Divine world, which appears upon new earths and new heavens.\n\nThe Initiate will not pass through death again; henceforth he will live eternally.\n\nARCANUM XXII.: The Crown of the Magi .\n\nTwelfth hour of Apollonius: \" The cohorts of fire rest .\" Nirvana!\n\nComplete return to α.\n\nLet us recapitulate these twelve hours of the initiation.\n\n0.--Preliminary studies and tests.\n\nArcanum X.\n\n1st hour I.--Transcendent study of the Visible World .\n\nInferior Manifestations: 1.\n\nPreliminary study of Force.\n\n( Magnetism ) Arcanum XI.\n\n2nd hour 2.\n\nApplication to the inert world.\n\n( Alchemy ) Arcanum XII.\n\n3rd hour 3.\n\nApplication to the animate elementary world.\n\n( Necromancy ) Arcanum XIII.\n\n4th hour ( Magic ) (DEATH) Transitory phase: 1.\n\nView of the superior forces.\n\nArcanum XIV.\n\n5th hour 2.\n\nEntrance into the ultra-terrestrial world.\n\n( Ecstasy ) Arcanum XV.\n\n6th hour THE DRAGON OF THE THRESHOLD!\n\n(TYPHON) Higher regions: 1.\n\nApplication of the higher forces to the terrestrial life.\n\n( Therapeutics ) Arcanum XVI.\n\n7th hour 2.\n\nThe forces in the solar system.\n\n( Astrology ) Arcanum XVII.\n\n8th hour 3.\n\nThe forces of the whole Universe.\n\nArcanum XVIII.\n\n9th hour II.--Study of the Intelligible World .\n\nOn the borders of the Infinite.\n\nArcanum XIX.\n\n10th hour III.--Study of the Divine World."


[content]
body = "Each element of this septenary thus rules over-- Arcanum 13 (+) Knight of Sceptres, (+) Knight of Swords, (-) Arcanum 16 (-) Knight of Cups, (+) Knight of Pentacles, (-) Arcanum 14 (+) Three of Sceptres, (+) Three of Swords, (-) Arcanum 17 (-) Three of Cups, (+) Three of Pentacles, (-) Arcanum 15 (+) Six of Sceptres, (+) Six of Swords, (-) Arcanum 18 (-) Six of Cups, (+) Six of Pentacles, (-) Arcanum 19 (∞) All the nines, (∞) TERNARY OF TRANSITION.--The ternary of transition rules over-- The 4 Knaves.\n\nThe 4 Tens.\n\nEach of its elements thus rules over-- Arcanum 19 (∞) (+) Knave of Sceptres, (+) Knave of Swords, (-) Arcanum 20 (∞) (+) Knave of Cups, (+) Knave of Pentacles, (-) Arcanum 21 (∞) All the 10, (∞) Value of the signs +, -,and ∞.\n\nThe signs which follow each card in the preceding lists define the exact value of the card.\n\nOne example will suffice to make this clearly understood.\n\nEach term can be taken in two principal acceptations: in the positive (+) or in the negative (-).\n\nThe same rule applies to the sub-divisions of these terms.\n\nFor instance, the correspondents of the first septenary are 1 and 4.\n\n1 is the positive (+) 4 is the negative (-) 1 governs two minor arcana: the King of Sceptres and the King of Swords.\n\nThe King of Sceptres is positive.\n\nThe King of Swords is negative.\n\nThe definite value of these terms would therefore be--1st King of Sceptres.\n\nPositive (+) of the positive (+); or King of Sceptres + + 2nd King of Swords.\n\nNegative (-) of the Positive (+); or more simply King of Swords + -- The same rule applies to the other terms in combining the sign which follows the major arcanum with that which follows the term under consideration .\n\nThe value of each of the 78 cards of the Tarot is thus defined.\n\nGENERAL AFFINITIES.\n\nAFFINITIES TO Yod .\n\nPositive .\n\nNegative .\n\nMajor Arcana Arcanum 1 Arcanum 4 ---- 7 ---- 10 ---- 13 ---- 16 Minor Arcana King of Sceptres King of Cups Ace Ace ---- 4 4 ---- 7 7 ---- King of Swords King of Pentacles Ace Ace ---- 4 4 ---- 7 7 ---- AFFINITIES TO THE 1ST He .\n\nPositive .\n\nNegative .\n\nMajor Arcana Arcanum 2 Arcanum 5 ---- 8 ---- 11 ---- 14 ---- 17 Minor Arcana Queen of Sceptres Queen of Cups Two ---- Two ---- Five ---- Five ---- Eight ---- Eight ---- Queen of Swords Queen of Pentacles Two ---- Two ---- Five ---- Five ---- Eight ---- Eight ---- AFFINITIES TO Vau .\n\nPositive .\n\nNegative .\n\nMajor Arcana Arcanum 3 Arcanum 6 ---- 9 ---- 12 ---- 15 ---- 18 Minor Arcana Knight of Sceptres Knight of Cups Three ---- Three ---- Six ---- Six ---- Nine ---- Nine ---- Knight of Swords Knight of Pentacles Three ---- Three ---- Six ---- Six ---- Nine ---- Nine ---- AFFINITIES TO THE 2ND He .\n\nPositive .\n\nNegative .\n\nArcanum 19 Arcanum 20 Knave of Sceptres Knave of Cups ---- of Swords ---- of Pentacles Equilibrium ."


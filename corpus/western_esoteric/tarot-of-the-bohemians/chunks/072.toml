[content]
body = "An indeterminable and unnamable principle, of which we are content to assert the existence only-- 2.\n\nThis synthetic principle, when analyzed , is found to consist of a Trinity thus constituted-- Neuter ∞ SYNTHETIC PRINCIPLE Negative - NEGATIVE PRINCIPLE 2 Positive + POSITIVE PRINCIPLE 1 If we would use a common but very suggestive image, we should say-- The constitution of God is thus defined by the Tarot-- The Spirit of God, or God the Father .\n\nThe Soul of God, or God the Son .\n\nThe Body of God, or God the Holy Spirit .\n\n* * * We must now prove that the conclusions which we have reached through the Tarot agree in all points with those of every author who has treated the question on a higher level and with all the superior theogonies of antiquity.\n\n1.\n\nTHE PRINCIPAL AUTHORS WHO HAVE STUDIED THIS QUESTION.\n\nWe have chosen from amongst the authors who have studied this question of first principles, two writers who, starting from different points of view, support the conclusions of the Tarot: Lacuria and Wronski.\n\nF.\n\nG.\n\nLacuria .\n\nThis eminent writer, in his book on the Harmonies of the Being expressed by Numbers , starts in his deductions from the three words used by St.\n\nJohn: Vita, Verbum, Lux .\n\nHe analyzes each of these words, establishes the connection that exists between it and the Christian Trinity, and defines each of the elements in this trinity-- \"Here is the Trinity: the Father, who is life or immensity; the Son, who is word or form.\n\nand distinction or variety; the Holy Spirit, who is light and love, or unity.\n\nAnd these three persons are only one God.\n\nTheir unity is not only in the external fact of their existence, but in the essence of things, for they are inseparable in the thought of man ; no one can imagine one without the others.\" (p.\n\n43).\n\n\"In the commencement was the BEING, the being is not undetermined, but it is distinct from the NON-BEING; it sees that it is the being, and these two points of view, participating in the unity of the substance which they affect, produce by their Union THE CONSCIENCE, which is also light or harmony\" (vol.\n\nii.\n\np.\n\n333).\n\n+ THE BEING The Father The Life - THE NON-BEING The Son The Word ∞ THE CONSCIENCE The Holy Spirit The Light First principles of Lacuria.\n\n_______________ Henri Wronski .\n\nThis author interests us doubly, for his conclusions not only agree with the data given by the Tarot, but they also throw great light upon them.\n\nLet us therefore listen to him ( Apodictique , p.\n\n5)-- \"Thus the reality of the absolute, REALITY in itself or reality in general, is unquestionably the first determination of the very essence of the absolute, and consequently the first principle of reason.\n\nWithout it as an indispensable condition, as we have just admitted it to be, every assertion made by reason would be valueless.\n\nAnd it is upon this fundamental principle of reason, upon this indestructible and in every way indispensable condition, that we shall now establish absolute philosophy itself with the same infallibility.\n\n\"In the first place this reality of the absolute, which we now recognize so profoundly, produces or creates itself; for, as we have already irrevocably concluded, the absolute, this indispensable term of reason, is that which is BY ITSELF."


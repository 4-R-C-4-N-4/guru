[content]
body = "We must also point out some features of the theory, which are necessary for the comprehension of our principal subject; the reader must only remember that this explanation is entirely due to the author of this article, and he must not impute any of its errors to Theosophy itself.\n\n* * * Our positive sciences give the last formula of the visible world in the following words-- There is no matter without force: no force without matter .\n\nAn indisputable but incomplete formula, unless the following commentary be added to it-- 1.\n\nThe combination of what we call Force and Matter present, itself in various proportions, from that which is called materialized Force (rocks, minerals, simple chemical bodies), to subtilized Matter or Matter-Force (a grain of pollen, spermatozoid, the electric atom).\n\nMatter and Force , although we cannot isolate them, therefore present themselves as the extreme and opposing mathematical limits (or contrary signs) of a series of which we see only a few medium terms, abstract but indubitable.\n\n2.\n\nThe terms of this series, that is to say, the substances of nature, are never stable; Force , which is characterized by infinite mobility, sways essentially inert matter from one pole to the other, as though it were drawn by a continual current, while it retorts by a counter-current, which leads it back to its inert condition.\n\nFor instance, an atom of phosphorus borrowed by a vegetable from the mineral phosphates, becomes the element of a human cerebral cellule (subtilized matter), then through disintegration falls back into the inert mineral kingdom.\n\n3.\n\nThe movement resulting from this unstable equilibrium is not disorganized; it presents a series of chained harmonies which we call Laws , and which are synthetized in our eyes in the supreme law of Evolution .\n\nOne conclusion is forced upon us: This harmonious synthesis of phenomena is the eminent manifestation of what we call a will .\n\nTherefore, according to positive science, the visible world is the expression of a will which manifests itself by the unstable but progressive equilibrium of Force and Matter.\n\nIt is represented by this quaternary-- I.\n\nWILL (simple origin).\n\nIII.\n\nFORCE (Elements of this polarized Will).\n\nII.\n\nMATTER.\n\nIV.\n\nTHE VISIBLE WORLD (The result of their unstable, dynamic equilibrium).\n\nThe positive method will not allow us to pause there, we must analyze the Will in its turn.\n\nWe will abridge this analysis here, for the reader will easily master it with the aid of the treatises on psychology; it leads through the two opposing terms of affirmation and negation to a new superior, apparently simple cause, the Idea , which analysis again decomposes into consciousness and unconsciousness , gradually remounting to its furthest limit, the absolute term, the One , both conscious and unconscious, affirmative and negative, force and matter, nameless, incomprehensible to man.\n\nLet us designate this supreme term by Α, and the material atom by Ω, we shall then have, according to our analysis, the following series of hierarchized quaternaries as a representation of the Universe + (1) Α --- Divine World (3) Consciousness (2) Unconsciousness (The Transcendent) (4) IDEA Intelligible World (6) Affirmation (5) Negation (Logic) (7) WILL (9) Force (8) Matter Visible World (10) Kosmos (Positive, Science) Ω The extreme terms, α and ω, Spirit and Matter, equally incomprehensible to human intelligence in their infinite grandeur and infinite littleness, are not only linked together by invariable intermediate chains, but they also make an incessantly descending movement from one to the other, in which the Spirit becomes Matter by the successive disintegrations which express the Idea, the Will, and Kosmos.\n\nThis constitutes the creation ."


[content]
body = "The Vau The Median letter, the link , which unites the active to the passive.\n\nThe Affinity between the Ego and the Non-Ego = 6.\n\nThese three letters express the Trinitarian law of the Absolute.\n\nThe 2nd He The second He marks the passage from one world to another.\n\nThe Transition.\n\nThis second He represents the complete Being, comprising in one Absolute Unity the three letters which compose it: Ego, Non-Ego, Affinity.\n\nIt indicates the passage from the noumenal to the phenomenal or reciprocal; it serves as means of ascension from one scale to another.\n\nREPRESENTATION OF THE SACRED WORD.\n\nThe word Yod-he-vau-he can be represented in various ways, which are all useful.\n\nThe circle can be drawn in this way-- yod י 1st he ה 1st he ה vau ו But since the second He, the sign of transition, becomes the active entity in the following scale, i.\n\ne.\n\nsince this He only represents a yod in germ, the sacred word can be represented, with the second he under the first yod , thus-- yod 1 st he vau 2 nd he Lastly, a third method of representing the word consists in enveloping the Trinity, Yod-he-vau , with the tonalisating letter, or second He, thus-- Now we will leave these data, to which we must return later on, and speak of the occult or Pythagorean conception of numbers."


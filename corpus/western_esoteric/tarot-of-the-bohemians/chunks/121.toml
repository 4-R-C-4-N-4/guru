body = "FIFTH LESSON.\n\nFORTUNE-TELLING BY THE TAROT.\n\nI.--RAPID PROCESS: What must we do if we wish to draw out the horoscope of any matter?\n\n1.\n\nYou should take the minor arcana and separate the suit of cards that refers to the kind of consultation you require.\n\nIf it is some business you are about to undertake , you must take the Sceptres or Diamonds.\n\nIf it is a love affair , take the Cups or Hearts.\n\nFor a law-suit , or any struggle, take Swords or Spades.\n\nIn a money matter , the Pentacles or Clubs.\n\n2.\n\nShuffle the cards selected, then ask the Inquirer to cut them.\n\n3.\n\nTake the four first cards from the top of the pack, and without looking at them place them in a cross in the following way, from left to right, as shown by the numbers.\n\n4 1 3 2 4.\n\nThen take your major arcana (which should always be separated from the minor arcana), shuffle them, and let them be cut for you.\n\n5.\n\nYou then ask the Inquirer to draw out seven cards from the major.\n\narcana by chance, and to give them to you without looking at them.\n\n6.\n\nShuffle these seven cards, and when the Inquirer has cut them, take the three top cards, and without looking at them arrange them in a triangle, in the following order-- I.\n\nII.\n\nIII.\n\nYou thus obtain the following figure-- 7.\n\nTake up the cards so that you can see them and read the oracles, noticing that the card placed at number 1 indicates the commencement .\n\nThe card placed at number 2 indicates the apogee , at number 3 the obstacles , lastly, at number 4 the fall .\n\nThe major arcanum placed at I.\n\nindicates the influences that have weighed in the affair during the Past .\n\nThe major arcanum in II.\n\nindicates the influence exerted over the Present .\n\nThe arcanum at number III.\n\nshows the influence which will affect and determine the Future .\n\nThese cards can be very rapidly deciphered when the habit is once acquired.\n\nBut one important point should be noted, that when the rapid process is used for fortune-telling, the figures do not exclusively represent persons of especial complexion.\n\nThe King represents a man, without any other distinction, the Queen a woman, the Knight a young man, and the Knave a child.\n\nII.--A MORE ELABORATE PROCESS: 1.\n\nShuffle all the minor arcana together and let them be cut for you.\n\n2.\n\nTake the twelve first cards from the pack, and place them in a circle thus-- 10 11 9 12 8 1 7 2 6 3 5 4 3.\n\nShuffle the major arcana, and let them be cut by the Inquirer, who will then choose seven cards .\n\n4.\n\nTake the four first of these cards from the pack, and arrange them opposite the cards placed at numbers 1, 10, 7, 4, thus-- II.\n\nI.\n\nIII.\n\nIV.\n\n5.\n\nThen place the three others in a triangle in the centre of the figure, thus-- V.\n\nVI.\n\nVII.\n\nYou thus obtain the following general figure, which we have already given.\n\nPlace the Inquirer in the centre of the figure, unless it has been drawn amongst the other cards.\n\nIf the Inquirer has been drawn you must place it in the centre, and replace it by another major arcanum chosen by the person whose fate is being studied.\n\nThe 12 minor arcana indicate the different phases through which the individual life will pass, or the evolution of the event during the four great periods: Commencement , indicated by the major arcanum I., which displays its character; Apogee (arc."


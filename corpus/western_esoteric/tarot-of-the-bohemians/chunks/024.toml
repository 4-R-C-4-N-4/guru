body = "PART II.\n\nSYMBOLISM IN THE TAROT.\n\nAPPLICATION OF THE GENERAL KEY TO SYMBOLISM.\n\nCHAPTER VIII.\n\nINTRODUCTION TO THE STUDY OF SYMBOLISM.\n\nThe Symbols--The Primitive Terms--Key of Symbolism--Definition of the Sense of one of the Symbols--The General Law of Symbolism.\n\nINTRODUCTION TO THE STUDY OF SYMBOLISM IN THE TAROT.\n\nOUR study of the Tarot and its numerical arrangement has given us the general key , which should be applied to all the further developments of which our subject may be susceptible.\n\nThe symbols should therefore exactly follow the evolution of the numbers, and this we shall find them do.\n\nHowever, as we shall now study each of the cards of the Tarot in turn, and as the reader's attention may be a little diverted by all these details, we have determined to commence by a short introduction to the study of the symbolism of the Tarot, an introduction in which we shall say a few words upon the grouping of the symbols.\n\nThis point explained, we can pass on to further details, which we shall terminate by a synthetic recapitulation.\n\nWe thus hope to obtain the greatest possible light upon these difficult subjects.\n\nThe analysis of the word Yod-he-vau-he has given us the general law upon which the whole Tarot is constructed.\n\nThis law is thus represented-- 1 yod 2 he 2nd he 4 vau 3 We must therefore first define the four primitive terms in our symbols, which form the law exactly applicable to the whole symbolism.\n\nAnd, in fact, we find these four terms in our four first cards; the general sense of these terms being-- 1--Creator or Divine.\n\n2--Preserver or Astral.\n\n3--Transformer or Physical and Diffuser.\n\n4--Generator or Transitional becoming Creator.\n\nThis law corresponds in all points with our sacred word, thus-- Creator or Divine 1 yod Preserver or Astral 2 he 2nd he 4 Transition or Generation vau 3 Transformer or Physical We shall see that this law applies exactly to each of the cards which possess three meanings.\n\nA superlative or Divine meaning.\n\nA comparative or Magic-Astral meaning.\n\nA positive or Physical meaning, responding, to a transition.\n\nGENERAL STUDY OF THE FOUR FIRST CARDS.\n\nKey to the Symbolism of the Tarot .\n\nThe four first cards of the major arcana form, symbolically as well as numerically, a complete sequence, which corresponds with the sacred word Yod-he-vau-he .\n\nFor the first card expresses the active absolute , and corresponds with Yod .\n\nThe second card denotes the reflex of the first, the passive absolute ; it corresponds with the first He .\n\nThe third indicates the median term, the convertible transforming term, corresponding to Vau .\n\nLastly, the fourth card is a term of transition between the preceding series and the one that follows it.\n\nThe symbolic series of the Tarot is therefore completely represented by the four first cards, exactly as the numerical sequence is represented by the four first numbers.\n\nThis fact produces a very important consideration, namely, that all the symbols of the Tarot are but transformations of the three first , and that the latter will supply us with the general law of symbolism, a law which will enable us to determine mathematically the sense of each card that follows.\n\nBut we can go still further.\n\nSince the second card is the reflex of the first, and is formed by the first considered negatively , and since the third card results from the two others, it suffices to be perfectly acquainted with the first card of the Tarot to determine mathematically the sense of all the others .\n\nSome details upon this subject are necessary.\n\nThe general law of the four first cards is as follows-- 1--Positive.\n\nCreator.\n\n2--Negative.\n\nReflex of the first.\n\nPreserver.\n\n3--Neuter, enveloping the two others.\n\nTransformer."


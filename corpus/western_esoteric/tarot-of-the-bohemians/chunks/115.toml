[content]
body = "SECOND LESSON.\n\nMINOR ARCANA.\n\nSIGNIFICATION FROM THE DIVINING POINT OF VIEW.\n\nTHE Tarot pack is composed of 78 cards or plates; 22 of them bear symbolical names (the Juggler, Sun, Moon, Hanged Man, etc.), and they should be separated from the 56 others, which are divided into four great series: Sceptres, Cups, Swords, and Pentacles.\n\nThese four series each contain 14 cards (King, Queen, Knight, Knave, Ace, 2, 3, 4, 5, 6, 7, 8, 9 and 10), corresponding with the four series of common playing cards (clubs, hearts, spades, diamonds), but called Sceptres, Cups, Swords, Pentacles.\n\nThese are the Minor Arcana .\n\nThe 22 symbolical cards are the Major Arcana or Great Arcana.\n\n1.\n\nMINOR ARCANA, formed of four sequences of 14 cards each, or 56 cards in all.\n\n2.\n\nMAJOR ARCANA, formed of 22 cards.\n\nThese are the two great divisions which must first be remembered.\n\nWe have already said that the minor arcana were divided into four sequences: Sceptres, Cups, Swords, Pentacles.\n\nEach of these series represents one of the four great principles, as follows-- The Sceptres represent Enterprise and Glory .\n\nThe Cups --- Love and Happiness .\n\nThe Swords --- Hatred and Misfortune .\n\nThe Pentacles --- Money and Interest .\n\nENTERPRISE, LOVE, HATRED, FORTUNE, are the four great principles which must be remembered.\n\nIf you now take one of these packets of 14 cards, you will see that it is formed of four figures, and of 10 other cards, which bear numbers formed by the symbols.\n\nWe will first look at the 4 figures-- The King represents Man .\n\nThe Queen --- Woman .\n\nThe Knight --- A Young Man .\n\nThe Knave --- A Child .\n\nThe Man represents the creator, the one who undertakes the enterprises ; the woman characterizes love ; the young man, conflict, struggle, rivalry, hatred ; the child symbolizes the absolute neuter, the second He, which varies according to circumstances, money , which addresses itself to all, and applies itself to all, universal transition .\n\nMan, Woman, Young Man, Child, are therefore the same symbols applied to the family as the four great principles applied to humanity, and to know them in one case is to know them in the other.\n\nTo sum up all this, we may say that the first element represents the positive , the second the negative , the third the opposition between the two; finally, the last the absolute neuter ; and these elements are symbolized by the four figures of each of the minor arcana.\n\nBut even as the cards are divided into two colours, red and black, so humanity is divided into dark and fair .\n\nThe eight figures of the Sceptres and Swords therefore represent dark people , the eight figures of the Cups and Pentacles, fair people .\n\nThe figures of the Sceptres and Cups are good ; of the Swords and Pentacles, bad .\n\nWe shall presently repeat this in connection with each colour, and will now recapitulate the meanings of the four figures of the Sceptres.\n\nKing of Sceptres.\n\nDark man; good; a friend.\n\nQueen of Sceptres: Dark woman; good.\n\nKnight of Sceptres: Dark young man; good.\n\nKnave of Sceptres: Dark child or messenger; good.\n\nBesides our four figures we have to consider the 10 cards bearing numbers.\n\nHow can we discover the meaning of these 10 cards, and above all how can we recall it?\n\nWe have nothing new to learn, but need only apply all that we already know."


[content]
body = "Thus this innate generation, this autogeny of the reality of the absolute, this creation by itself, is manifestly a second determination of the very essence of the absolute ; and the condition by which alone this determination can take place constitutes quite as manifestly, and in all its primitive purity, the faculty which is designated by the name of Wisdom (λόγος, das Wissen ).\n\n\"We therefore discover WISDOM as the second essential attribute of the absolute; this primordial faculty which is the condition of all creation , or rather which is the creative faculty itself in its loftiest puissance, as we have now discerned it, is, if we may thus express it, the instrument of autogeny , that is to say, the faculty of the creation by itself.\n\nAnd consequently we discover in Wisdom , shown in this highest creative power, the second principle of reason, quite as infallible as the absolute itself, from which we have now deduced it.\n\n\"Moreover, in the reality of the absolute, the necessary result of its wisdom or of its innate creation is PERMANENT STABILITY, because, precisely through being what it is by itself, the absolute could not be other than itself.\n\nWe can therefore understand that this permanent stability in the reality of.\n\nthe absolute, which is properly its autothesis, constitutes a third determination of the very essence of the absolute, and we shall easily recognize that this stability, this permanent unchangeableness, this innate unalterability , is only that condition of the reality which we name Being (ὤν, das Seyn ).\n\n\"Thus, we discover as the third essential attribute of the absolute, the Being , the condition of stability in reality, and therefore of its force or innate unalterability , which in the absolute constitutes its autothesis itself.\n\nAnd consequently we find in the Being , considered almost in its autothetic origin, the third principle of reason, as infallible as the absolute itself, from which we have deduced it.\n\n\"We therefore already possess the three first principles of reason, which, as we have just seen, are the three first determinations of the very essence of the absolute.\n\nMoreover, if we notice on the one hand that Wisdom and the Being , taking them in all their generality, are opposed to each other, just as autogeny and autothesis--of which they form the conditions--are opposed, or spontaneity and inertia, which form their characters; and if on the other hand we notice that Wisdom and the Being , these antagonistic conditions, are neutralized in all REALITY in general, this reality--according to the deductions which we have given--being the fundamental principle of reason, its primitive basis, we shall understand that the three principles which we have discovered in the determinations of the essence itself of the absolute, are really the three primitive principles of the supreme Wisdom, or of Philosophy.\" + WISDOM Autogeny Principle of Motion + THE BEING Autothesis Principle of Stability ∞ REALITY Principle of Existence FIRST PRINCIPLES OF WRONSKI.\n\n2.\n\nTHEOGONIES OF DIFFERENT RELIGIONS.\n\nWe have now shown the identity of the three first principles of the Tarot with the philosophical discoveries of some modern authors.\n\nWe need only revert to the study of the first arcanum to see the conclusions which Fabre d'Olivet and Claude de Saint-Martin have come to upon the same subject; and we will now say a few words upon the identity of the deductions of the Tarot with the religious ideas of various nations.\n\nEGYPTIAN THEOGONY.\n\nOsiris is an emanation of the Great Being; he reveals himself in three persons-- Amen , who brings forth the hidden forms of things, is Power.\n\nPtah the demi-urgus , the eternal workman, embodying the primitive ideas, is Wisdom."


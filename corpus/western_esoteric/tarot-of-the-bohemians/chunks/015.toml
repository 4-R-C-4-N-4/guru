[content]
body = "The first series will be formed of the ace, or 1, representing the active , of the 2 personating the passive , of the 3 for the neuter , and lastly of the 4, which represents the transition from one series to another.\n\n1, 2, 3, 4 therefore correspond also with the Yod-he-vau-he , and are thins formulated-- Ace or Yod Two or 1st He 2nd He Four Vau or Three The other series follow the same rule exactly, the second He of the preceding series becoming the Yod of the following, series: thus 4, the fourth term of the first series, becomes the first term of the second series; 7, the fourth term of the second, becomes the first term of the third, as follows-- We see that the same law, Yod-he-vau-he , can be applied to these series.\n\nSince this law is also applicable to the four figures, we can make a comparison based on the following proposition-- Two terms (the numbers and the figures) equal to a same third (the law Yod-he-vau-he ) are equal between themselves.\n\nTHE SEQUENCE IN ONE COLOR King Queen Knave Knight 1 4 7 2 4 5 7 8 10 3 6 9 If we now group all the numbers of the sequence according to the letter of the tetragrammaton, to which they are analogous, we shall find-- Representing Yod 1--4--7 Representing the 1 st He 2--5--8 Representing the Vau 3--6--9 Representing the 2 nd He 10 (1.\n\n4.\n\n7) Yod (2.\n\n5.\n\n8) 1st He 2nd He (10) Vau (3.\n\n6.\n\n9) The figure 10 therefore acts for the numbers , as the knave acts for the figures, that is to say, it serves as a transition .\n\nBetween what?\n\nBetween one colour and another.\n\nAFFINITY BETWEEN THE FIGURES AND THE NUMBERS.\n\nWe have already studied both the figures and the numbers separately, let us now see what connection exists between the figures and the numbers.\n\nIf we group the similar terms according to the identical Law which rules them, we shall find them as follows-- The King is the Yod of 1.\n\n4.\n\n7 The Queen --- He of 2.\n\n5.\n\n8 The Knight --- Vau of 3.\n\n6.\n\n9 The Knave--- 2 nd He of 10 The sequence of the figures is reproduced three times in the series of numbers, that is to say, that each series of numbers represents a conception of the figures in each of the three Kabbalistic worlds.\n\nThe series 1, 2, 3, 4 represents the emanation of the sequence king, queen, knight, knave in the divine world.\n\nThe series 4, 5, 6, 7 represents this evolution in the human world.\n\nThe series 7, 8, 9, 10 represents this evolution in the material world.\n\nEach colour is a complete whole, formed after the manner of beings.\n\nOf a material body: (Knight---7.8.9) Of a vital force: (Queen---4.5.6) Of an intellect: (King---1.2.3) Of reproductive organs: (Knave---10) Each of these parts can subdivide itself into three others, as the numbers indicate."


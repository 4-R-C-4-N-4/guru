body = "Creative Decan .\n\nYod .\n\nTWO.\n\n2nd Decan or Passive Decan of the Month.\n\nForming or Preserving Decan .\n\nHe .\n\nTHREE.\n\n3rd Decan or Equilibrist Decan .\n\nVau .\n\nFOUR.\n\nTransition between the third Decan of the actual series, to the first Decan of the following series, which it forms.\n\nThe thirty-six decani are therefore represented in the Tarot in the following series-- Ace of Sceptres 1st Decan King 2 --- 2nd --- of the Ram 3 --- 3rd --- 4 --- 1st Decan Queen 5 --- 2nd --- of the Bull 6 --- 3rd --- 7 --- 1st Decan Knight 8 --- 2nd --- of the Twins 9 --- 3rd --- Knave 10 Transition Epagomene Ace of Cups 1st Decan King 2 --- 2nd --- of Cancer 3 --- 3rd --- 4 --- 1st Decan Queen 5 --- 2nd --- of the Lion 6 --- 3rd --- 7 --- 1st Decan Knight 8 --- 2nd --- of the Virgin 9 --- 3rd --- Knave 10 Transition Epagomene Ace of Swords 1st Decan King 2 --- 2nd --- of the Balance 3 --- 3rd --- 4 --- 1st Decan Queen 5 --- 2nd --- of the Scorpion 6 --- 3rd --- 7 --- 1st Decan Knight 8 --- 2nd --- of Sagittarius 9 --- 3rd --- Knave 10 Transition Epagomene Ace of Pentacles 1st Decan King 2 --- 2nd --- of Capricornus 3 --- 3rd --- 4 --- 1st Decan Queen 5 --- 2nd --- of Aquarius 6 --- 3rd --- 7 --- 1st Decan Knight 8 --- 2nd --- of the Fishes 9 --- 3rd --- Knave 10 Transition Epagomene Each decan, governing ten degrees of the zodiacal circle, corresponds to a certain number of days in the month.\n\nConsequently each card in the minor arcana, corresponding to a decan, represents a certain fraction of the year-- Ace of Sceptres 21st to 30th of March.\n\n2 --- 31st of March to 9th of April.\n\n3 --- 10th to 19th of April, etc.\n\nWe need only consult the figure at the end of this study of the astronomical Tarot to see which days correspond to each decan.\n\nThis is the basis of the astrological Tarot, and by its cards a horoscope can be drawn out; but since this application lies beyond the purely scientific field to which we have limited ourselves, we must not dwell upon it here.\n\nIn short, our minor arcana are fully represented in the astronomical Tarot, and they exactly determine the limits in which move the planets, that we have still to consider.\n\nThe Planets .\n\nThe major arcana are represented in this application of the Tarot by the septenary of the planets acting upon the three worlds (3 x 7 = 21).\n\nEach zodiacal sign and each decan is governed by a planet, and the connection between the planets and these different signs is indicated upon the tableau which follows.\n\nThis tableau enables us to comprehend all the work that Christian and Ely Star accomplished upon Astrology.\n\nMoreover it indicates the astronomical correspondence of every card in the Tarot.\n\nHere is an explanation of its construction-- Here the four figures of the twenty-first card of the Tarot represent the four seasons of the year and the four colours of the Tarot."


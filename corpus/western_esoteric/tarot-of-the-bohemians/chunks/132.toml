body = "ALPHABETIC TABLE OF THE AUTHORS AND PRINCIPAL WORKS QUOTED.\n\nAGRIPPA.-- La Philosophic Occulte , La Haye, 1727.\n\n2 vols.\n\n8vo.\n\n(Bib.\n\nNat., Z.\n\n1983, A.\n\n) APOCALYPSE 7 AMARAVELLA.--A theosophic writer known by his fine works in Le Lotus , and in the Revue Philosophique .\n\nAPOLLONIUS OF TYANA.--A great initiate and thaumaturge, contemporary with Christ 265 , sqq .\n\nARNOULD (Arthur).--President of the Theosophite Society Hermes, the French branch of the Theosophite Society of Adyar (Madras).\n\nABBEMA (Louise).\n\nADAM (Mme.\n\nJuliette).\n\nADHÉMAR, D' (Countess Gaston).\n\nBARROIS.-- Dactylologie ou Langage Primitif , Paris, 1850, 4to.\n\n(Bib.\n\nNat., X.\n\n4,679.) ------ Eléments Cartovingiens , Paris, 1854, 4to.\n\n(Bib.\n\nNat., Z.) BLAVATSKY (ff.\n\nP.)-- Isis Unveiled , New York, 1884 300 BOITEAU.-- Les Cartes à jouer et la Cartomancie , Paris, 1854, 4to.\n\nBOEHME (Jacob).-- Les Trois Principes , translated by Claude de Saint-Martin.\n\nBERTRAND (le F .'.).--Venerable de la.\n\nL .'.\n\nLa Renaissance , a conference in defence of occult symbolism in the F.'.\n\nM.'.\n\nBARLET (Ch.).--Editor of the Initiation .\n\nThe author of the most learned works that France possesses upon Occult Science 16 , 299 COURT DE GÉBÉLIN.-- Le Monde Primitif , 9 vols., 4to., 1773-1783.\n\nCAILLIÉ (René).--Lieu et la Création, Paris (Carré), 3 vols., 8vo., 1886.\n\nCHATTO.-- Facts and Speculations upon the Origin and History of Playing Cards in Europe , London, 1848, 8vo.\n\nDOE (Jean).-- Monas Hieroglyphica (in Theatrum Chemimun ), 1660.\n\nELY STAR ( Les Mystères de l'Horoscope , 18mo., Dentu, 1884 300 ETTEILA.--Works by.\n\nFRANCK (A.)-- La Kabbalah , Paris, Hachette, 1889, 8vo.\n\nFABRE D'OLIVET.-- Les Vers dorés de Pythagore , Paris, 8vo., 1816; La Langue Hébraïque restituée , 1825, 4to., Paris.\n\n(Fundamental works of one of the greatest contemporary masters of occult science.) GUAITA (Stanilas de).-- Au seuil du Mystère , Paris, 1886, 8vo., 2nd enlarged edition, 1889 294 GARY (See Polti).\n\nGOYARD (Dr.).--Former President of the Vegetarian Society, author of several works upon occultism.\n\nGOUDEAU (Emile).\n\nHARTMANN.--Works by.\n\nHERMES TRISMEGISTUS 9 HOLMES (Augusta).\n\nHOMER.-- The Odyssey 7 HESIOD.-- Op.\n\net Dies p.\n\n104 KIRCHER (the R.\n\nF.\n\nJesuit)-- Œdipus Ægyptiacus , 3 vols., fol., Rome, 1622.\n\nKABBALA DENUDATA.--Frankfort, 1764.."


[content]
body = "The curious had better consult his work on the subject-- COLLECTION SUR LES HAUTES SCIENCES, or a theoretical and practical treatise upon the wisdom magic of the ancients, absolutely complete in twelve books, which contain all that Etteila has written upon the Hermetic philosophy, the art of fortune-telling by cards .\n\n.\n\n.\n\nand particularly the sublime Book of Thoth .\n\n2 vols.\n\n8vo., bound, 1780."


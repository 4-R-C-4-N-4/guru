[content]
body = "The first E, the celestial Mother (arcana II.), is found in the arcana VI., X., XIV.\n\nand XVIII., that is to say, Beauty, Form, the Angel of Temperance, which balances the movements of life, and the aurora of the divine Sun; Diana the Moon.\n\nThe V, the Son, is characterized upon the various planes by the arcana III., VII., XI., XV.\n\nand XIX.; Love, the fertile power; the Ruler over Matter, Force; then Typhon, the mysterious Baphomet of the Templars, which collects the superior forces to spread them over the Earth; and lastly, the central Sun.\n\nIn a word, the Christ of the Gospel, the Spirit of Love, the Master of the Elements, the Word made flesh to spiritualize the flesh; the divine reflex of the Universal Sun.\n\nLastly, the second E; the terrestrial Mother is seen in the arcana IV., VIII., XII., XVI.\n\nand XX.\n\nThe realization of the divine virtualities, and also Mercy, absolute Justice, Sacrifice, the overwhelmed and suffering Spirit, and finally Resurrection; the head of the Serpent crushed beneath the woman's heel, by the force of abnegation and resigned faith.\n\nWe need only follow these various arcana upon the sphere, to see once more that the Yod has 3 superior arcana (northern hemisphere), and 2 inferior; That the V (ו) has only 2 superior and 1 medium (upon the Equator); And that the E has 4 superior, 2 inferior, and 2 medium.\n\nLet us close these remarks, already too lengthy, by a simple observation upon the general effect of our arrangement.\n\nThe three worlds, Divine, Intelligible, and Physical, are found not only in the three zones of the sphere, but they are again reproduced in the whole arrangement; the Divine is in the centre, through the Foolish Man of the Tarot, and the cross of four colours; this we have already pointed out.\n\nThe Intelligible and its developments are provided by the sphere ( Fig.\n\n1 ), or the circular distribution of the 21 great arcana ( Fig.\n\n2 ).\n\nThe physical is seen in the external plane of the Equator ( Fig.\n\n1 ), with the distribution of the 56 minor arcana, representing the Zodiac and the various degrees of the multiplicity of Force through substance to the extreme pole, the negative unity 10.\n\nMoreover, the whole ( Fig.\n\n1 ) reproduces the form of the planet Saturn, with its ring, a form which in itself, according to the theories of our positive sciences, is the clearest manifestation, the demonstration of the great laws of the formation of the Universe; namely, the concentration of the substance in a radiant state around a point of attraction, producing with a progressive condensation a rotatory movement, particularly accentuated at the Equator, and giving birth to the stars, planets, and satellites, thus descending from the ethereal nébuleuse to the atom, to the solid ultimate; from living nothingness to inert nothingness, from the unit to an infinite multiplicity.\n\nThus the Tarot, the secular fruit of the genius of our ancestors, can represent not only the creation in its actual state, but its history even in details, and its future.\n\nwith that of the human creature, even to their principles; yet avoiding, by the combination of its analogical symbols, borrowed from natural life, the rock upon which all philosophy breaks--namely, the definition of words, the clear, full expression of the Word in the sublunar world."


[content]
body = "(Love, the fertile Power, the Being, ו); and in order that this Trinity may be repeated in the whole septenary of our distribution we will make it the root of 3 great divisions, representing the 3 terms of the Trinity, which will divide the surface of our sphere by 3 meridians.\n\nWe can then continue the distribution of our cards upon this surface in the following way.\n\nThe head of each partial Trinity will be in division 1; each second term will be in division 2; each third term in division 3.\n\nConsequently our IV.\n\ncard (the Emperor, ה) will be in the L; the V.\n\ncard (the Pope, ו) will be in II.; the VI.\n\ncard (Liberty, ה) will be in III., and this second sequence will form a new zone upon the sphere.\n\nA third, a little inferior, will be formed by cards VII., VIII.\n\nand IX., cards XI., X.\n\nand XII.\n\nwill occupy the Equator, and the 9 cards from XIII.\n\nto XXI.\n\nwill be distributed like the 9 first, in 3 bands placed upon the lower hemisphere as shown in Fig.\n\n1 .\n\nNow our 22 great arcana are placed; let us pause and look at their significations.\n\nAbove the Equator we see an ever-increasing expansion of the North Pole, represented by the 3 upper triangles, then by the 6 trapezes which follow, each larger than the one before.\n\nHere are the three planes of the Creation: The Divine, metaphysic (I., II., III.), the Intelligible, moral (IV., V., VI.), and the physical, that of the generative attributes or elements (VII., VIII., and M).\n\nThe creation is realized upon the equatorial line (X., XI., XII.), in which the first term, with the preceding cards, represents the 10 sephiroth of the Kabbalah.\n\nBelow the Equator, in the world of material realization, which is quitted by Death (XIII.), this expansion is retracted and synthetized by an inverse and symmetrical movement of the above.\n\nThe arcana which follow represent Initiation carried to its extreme limits, the path by which the creature (X.) returns from its multiplicity to the unity of the spirit, goes back to the point--the southern pole--a new reflex of the Absolute, towards which it reascends by the vertical axis of the sphere.\n\nThe Neophyte, after his preparation (positive science, magnetism and alchemy, X., XI., XII.), travels through the sublunar world (XIII., XIV., XV.), then through the solar system (XVI., XVII.\n\nand XVIII.), and escapes by the sun in the abyss of the Infinite (XIX., XX., XXI.).\n\nWe may now end this short explanation of the practical distribution of our 22 arcana upon a plane (the reader will do well to imitate it upon a table with a pack of Tarot cards).\n\nThe student should imagine that our sphere is seen from a considerable distance, vertical upon its axis; for instance, at the distance of the earth from the sun, the upper hemisphere only will appear, the other being seen but transparently ; and it will look like a circle, with the Equator for its circumference.\n\nThe limits of the 3 superposed zones appear like 3 concentric circles; the meridional planes, seen by their dividing lines, only look like 3 equally divided radii, making of the 3 sectors 3 equal axes."


body = "PART III.\n\nAPPLICATIONS OF THE TAROT.\n\nCHAPTER XV.\n\nGENERAL KEY TO THE APPLICATIONS OF THE TAROT.\n\nThe Principle and the Forms--The Twenty--first Card of the Tarot is a Figure--principle--The Tarot--The Year--The Month--The Day--The Human Life.\n\nGENERAL KEY TO THE APPLICATIONS OF THE TAROT.\n\nWE have already stated that the twenty-first card gives the key to the construction of the Tarot.\n\nThe utility of this arcanum does not end here; we shall now see that it is the key to every application of the Tarot.\n\nSome explanation may be necessary as to the manner in which a symbolical figure can be applied to conceptions of very different orders, without undergoing the least transformation.\n\nLet us take one very simple example, chosen in the realm of experimental science, by applying the analogical method to its study.\n\nLet us represent the well-known phenomenon of the decomposition of the white light by the prism.\n\nWe place the prism, indicated by a triangular figure, in the centre; the white light, represented by parallel lines, enters it on one side: from the other the colours issue.\n\n[paragraph continues] They are represented by the refracted and more or less oblique lines.\n\nThe words Prism , White Light , and Colours , indicate all the phases of the phenomenon.\n\nIf, however, we reflect that after all it is only a general force (the white light) which undergoes various changes, according to the quantity of matter with which it comes in contact (the different thicknesses of the prism), we shall easily grasp another aspect of the figure.\n\nIn fact the work of Louis Lucas, unconsciously continued by contemporary scientific men, proves by evidence the unity of force in action throughout Nature.\n\nThe different physical forces, heat, light, or electricity, are only representations of this unique force differently modified, according to the quantity of matter with which it comes in contact.\n\nThus the white light in contact with the large amount of matter at the base of the prism becomes violet in the same way the unique force coming in contact with much matter becomes heat, or placed in contact with little matter becomes light or electricity.\n\nWe can therefore represent this new phenomenon without changing the form of our figure in any way; only the words need vary-- Here the different quantities of matter are represented by the different thicknesses of the prism, the unique force corresponding with the white light by the parallel lines, the various physical forms responding, to the various colours by the refracted lines.\n\nIf any one should consider that these two examples belong to the realm of physics, and are therefore insufficient to generalize a phenomenon to this point, we can answer by another instance quoted from physiology.\n\nPhysiology teaches us that all the organs in man act under the influence of the blood.\n\nThus the latter, acting upon the salivary glands, produces the saliva, acting upon the stomach the gastric juice is secreted, upon the liver in certain cases it produces bile, etc., etc.\n\nIn short, this physiological phenomenon reduces itself to one unique agent (the blood), acting upon the different organs (the salivary glands, stomach, liver), and producing secretions of equally different natures (saliva, gastric juices, bile).\n\nCan we not therefore represent the different organs by the different thickness of the prism, the different transformations of the unique force by the refracted rays, and the unique force itself by the parallel lines?\n\nThe correspondence is exact on all points, and the same figure can be used once more-- Thus the figure has never changed: only the words applied to its different parts have varied.\n\nThe basis of all occult science and of the analogical method resembles this example: one fixed and invariable figure, which is always the same (Ex.: the figure), to which various orders of phenomena can be successively applied."


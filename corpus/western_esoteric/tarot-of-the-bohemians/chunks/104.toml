[content]
body = "( Wheel of Fortune ), which raises the fallen spirit to lead it back, with the nature which it has spiritualized, to all its power, by Strength (arcana XI.), and by Sacrifice (arcana XII.).\n\nThe phases of spiritualization then follow.\n\nXIII.: First phase: ( Death ) to the physical world.\n\nXIV.\n\n( the two Urns ) combination of the movements of life.\n\nXV.\n\n(Typhon).\n\nMagic.\n\nXVI.\n\n( the Lightning-struck Tower ); the interplanetary force.\n\nSecond phase: XVII.\n\n(the flaming Star ), the internal light.\n\nXVIII.\n\n(the Twilight ), the aurora of the divine sun.\n\nXIX.\n\n(the Sun ), central; and XX.\n\n(the Judgment ), after which the supreme realization is obtained, the Crown of the Magi .\n\nWe have said that the divine Name is again enunciated in following the three sectors.\n\nIn the first are the arcana I., IV., VII., X.\n\nThe absolute, the realization of its virtualities, the dominion of Spirit over Matter, and the animating principle of beings.\n\nThen, in return, XIII., XVI., XIX.\n\nand I.\n\nDeath (Inertia), the astral light, the central sun, and the Unspeakable himself.\n\nThis is the account, by the principles, of the differentiation and integration of the Absolute.\n\nIn the second sector, the one which corresponds to the consciousness of the Absolute or faith, we have the series, V., VIII., XI., XIV.: the Hierophant, or religion; Justice, Force, and the combination of the movements of life; the image of the Saints; the Mystics of all religions, who by absolute Faith and Justice, receptive, feminine virtues, acquire, without seeking for it, the power of working prodigies.\n\nLastly, in the third Sector, that of Love or power of fecundity, we have the series: IX., Wisdom and Prudence; XII., the Sacrifice; XV., self-abandonment to the astral forces; and XVIII., the attainment of the Infinite.\n\nThe essence of this series of efforts, both active and passive, constitutes Initiation, the Redemption.\n\nLet us once more seek for the divine Name, through the three divisions at once.\n\nWe shall find, for instance, the arcana L, II., III., VI., which demonstrate the divine Trinity, manifesting itself by Beauty and Liberty in the Intellectual world: it is the passage of the Father (י) to the Son (ו).\n\nOr again, I., VI., IX., X.: The descent of the Father (י) into the physical world (X.) by the Son (VI.) and by Yesod (IX.); the Word made flesh.\n\nThis is the Redemption, the series which in the Sepher Yetzirah represents the C o lumn of the Sephiroth (Kether-Tiphereth-Yesod and Malchut).\n\nBut we must limit these examples, which the reader will easily multiply for himself.\n\nLet us only add a few more words upon our second problem: the different manifestations of each of the three persons of the divine Trinity.\n\nThe Yod is found in the arcana I., V., IX., XII.\n\nand XIII.; in Keter, in the Hierophant, in the Wise Old Man; then it presides over death , which will bring the world from the depths of gloomy Inertia to the resplendent crown of the Magi, by the internal light.\n\nIt will be noticed, at the same time, that the Yod is the only one of the four letters which, by its various positions, forms a complete spiral round the sphere, from the north to the south poles; a symbol which may appear very remarkable to any one acquainted with the mysteries of the life of a planet."


[content]
body = "The second, symbolized by Eye, is the origin of feminine Grace, of Authority.\n\nWe have seen that Power and Authority find their equilibrium in Love.\n\nEach man, a reflected molecule of humanity made in its image, contains in himself an Adam, the source of the Will--that is the Brain; an Eve, source of the intelligence--the heart; and he should balance the heart by the brain, and the brain by the heart, to become a centre of divine love.\n\nIt is the same with man and woman, represented by Adam and Eve (הוה Eve, the life).\n\nBut just as the Father and the Son have become realities in the Holy Spirit, as Adam and Eve are embodied in Humanity, so the third ternary will take rise in the reciprocal action of the other two.\n\nNATURA NATURANS, or creating, will take her birth under the action and the reciprocal reaction of God the Father and of Adam, the two active and passive creative principles.\n\nThus also appears the Universal creative Fluid , balancing and realizing in itself both will and power.\n\nFrom this again will be born NATURA NATURATA, or preserving, realizing the union of God the Son and of Eve, at the same time that the Universal preserving Fluid , or Universal Life , will appear, balancing and realizing the Intelligence and Authority which define its innate qualities.\n\nLastly, the Holy Spirit and Humanity, the divine and the human bodies, unite and manifest themselves eternally in the LIVING UNIVERSE, the source of Universal Attraction .\n\nFor even as the Holy Spirit was the body of God, the Son his soul, and the Father his Spirit, even as Humanity was the body of Adam, Eve his life or soul, and Adam his Spirit; so also-- The Universe is the body of God; Humanity is the soul of God; God Himself is the Spirit of God .\n\nFrom this we recognize the truth of the opinion of the Pantheists, who declared that God was the Universe; but we also see their error, when they refuse to acknowledge in him any innate consciousness.\n\nFor as the consciousness of man is independent of the millions of cells which compose his body, so the consciousness of God is independent of the molecules of the Universe and of man which form its body and its soul.\n\nWe might partly destroy the [paragraph continues] Universe without in any way diminishing the Divine Personality, even as the four limbs can be cut off a man without his losing the consciousness of the integrity of his personality.\n\nThis is why the conclusions of Schopenhauer and Hartmann are partly erroneous.\n\nBefore leaving this study, we must once more express our admiration for this wonderful book, this symbolical Tarot, which thus defines God-- God is the Absolute, the essence of which is impenetrable, formed of the Universe as body, of Humanity as soul, and of himself as Spirit.\n\nTHEOGONY .\n\nANDROGONY.\n\nEach man contains in himself an Adam , source of the Will, i.e.\n\nthe Brain; an Eve , source of the Intelligence, i.e.\n\nthe Heart, and he should balance the heart by the brain, and the brain by the heart, if he would become a centre of divine love.\n\nIn Humanity, the passive Realistic principle of God Himself, the Father and the Divine Son, are represented by Man.\n\nMan accomplishing the functions of God the creator is the FATHER; the woman accomplishing the work of God the preserver is the MOTHER; lastly, HUMAN LOVE realizes the whole Divinity in Humanity.\n\nThe human family is therefore the representation of the Divinity upon earth.\n\nThe Tarot also teaches us this fact by its minor arcana (king or father, queen or mother, knight or young man, knave or child); and it was so thoroughly understood by ancient science, that the whole social organization was based upon the family , instead of upon the individual , as it is in modern times."


body = "PART I.\n\nGENERAL KEY TO THE TAROT, GIVING THE ABSOLUTE KEY TO OCCULT SCIENCE.\n\nCHAPTER II.\n\nיהוה THE SACRED WORD YOD-HE-VAU-HE.\n\nThe Kabbalah and the Sacred Word--The Yod--The He--The Vau--The second He--Synthesis of the Sacred Word.\n\nACCORDING to the ancient oral tradition of the Hebrews, or Kabbalah , a sacred word exists, which gives to the mortal who can discover the correct way of pronouncing it, the key to all the sciences, divine and human.\n\nThis word, which the Israelites never uttered, and which the High Priest pronounced once a year, amidst the shouts of the laity, is found at the head of every initiative ritual, it radiates from the centre of the flaming triangle at the [paragraph continues] 33rd degree of the Freemasonry of Scotland, it is displayed above the gateways of our old cathedrals, is formed of four Hebrew letters, and reads thus, Yod-he-vau-he , יהוה.\n\nIt is used in the Sepher Bereschit , or Genesis of Moses, to designate the divinity, and its grammatical construction recalls even by its formation the attributes which men have always delighted to ascribe to God.\n\nNow we shall see that the powers attributed to this word are real up to a certain point, for with its aid the symbolical gate of the arch, which contains the explanation of the whole doctrine of ancient science, is easily opened.\n\nIt is therefore necessary to enter into some detail respecting it.\n\nThe word is formed of four letters, Yod (י), he (ה), vau (ו), he (ה).\n\nThis last letter he is repeated twice.\n\nA number is attributed to each letter of the Hebrew alphabet.\n\nWe must look at those which relate to the letters we are now considering.\n\nי Yod = 10 ה he = 5 ו vau = 6 The total numerical value of the word יהוה is therefore 10 + 5 + 6 + 5 = 26.\n\nLet us now study each letter separately.\n\nTHE YOD.\n\nThe Yod , shaped like a comma or a dot, represents the principle or origin of all things.\n\nThe other letters of the Hebrew alphabet are all produced by different combinations of the letter Yod .\n\nThe synthetic study of nature had led the ancients to conclude that one law only existed, and ruled all natural productions.\n\nThis law, the basis of analogy, placed the Unity-principle at the origin of all things, and regarded them as the reflections at various degrees of this Unity-principle.\n\nThus the Yod , which alone forms all the other letters, and therefore all the words and all the phrases of the alphabet, was justly used as the image and representation of this Unity-principle , of which the profane had no knowledge.\n\nThus the law which presided over the creation of the Hebrew language is the same law that presided over the creation of the Universe, and to know the one is to know the other, unreservedly.\n\nThe Sepher Yetzirah , one of the most ancient books of the Kabbalah, proves this fact.\n\nBefore proceeding any further, let us illustrate the definition which we have just given of the Yod by an example.\n\nThe first letter of the Hebrew alphabet, the aleph (א), is composed of four yods placed opposite to each other; the other letters are all formed on the same basis.\n\nThe numerical value of the yod leads to other considerations.\n\nThe Unity-principle, according to the doctrine of the Kabbalists, is also the Unity-end of beings and of things, so that eternity, from this point of view, is only an eternal present."


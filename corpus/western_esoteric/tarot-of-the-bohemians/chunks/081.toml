[content]
body = "The twenty-first card of the Tarot is a figure-principle of the same nature as the prism which we have just studied, and a few examples of the various methods in which it can be applied will fully enlighten us upon this point.\n\nWe have seen that the four figures in the corners of the twenty-first card represent the four animals of the Evangelist.\n\nIn the centre stands a woman, the image of Humanity, and between the two symbols is a crown of elliptic form.\n\nThis shows us that there will always be four fixed principles in every application of this card (since the symbols placed at the four corners of the square do not move), and a certain number of mobile principles represented by the wheel, rota , which occupies the centre of the symbols.\n\nThis figure can never change, since it is a figure-principle : the words alone that may be applied to it can vary.\n\nThus we have seen the four following symbols-- become We see that none of the symbols have changed, but the words only.\n\nThe same rule applies to every application of the Tarot.\n\nThus if we take astronomy, the four figures will be the four seasons, the crown is the zodiac, and the nude figure (Eve) the animating system of the zodiac, the planets; thus-- This shows us the progress of the sun , as it gives birth to the year .\n\nIf we wish to know that of the moon as it produces the month, the four seasons would become the four lunar phases, the zodiac would be the twenty-eight houses of the moon, and the centre the sun, which animates the moon; thus-- If we wish for the horoscope of a single day we find it in the following figure-- Here the earth occupies the position of the moon in the month and of the sun in the year.\n\nIf these astronomical data weary us, we can study the figure will assume a circle of the Human Life , and the figure will assume new aspect.\n\nA profound symbol, which indicates that the Human Will creates the fatality in which man moves, under the influence of the providential cycle of the four ages of the human life.\n\nIf we know that Providence (the outer circle): acts upon the Future , Fatality (the intermediate circle) upon the Past , and the Human Will (centre circle) upon the Present , we shall see the basis of the divining Tarot .\n\nWe think that these examples are sufficiently clear to enable us to proceed, and we shall now study some applications of the Tarot, leaving to the student the work of discovering a larger number."


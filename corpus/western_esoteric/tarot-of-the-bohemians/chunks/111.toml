[content]
body = "Librarian of the Arsenal.\n\nHas published an occult manuscript upon the Tarot, blending with it his personal reflections upon astrology in-- L'Homme Rouge des Tuileries (1854).\n\nELIPHAS LEVI.\n\nAmongst contemporary Masters of Occultism, he had the greatest knowledge of the Tarot.\n\nHis work Dogme et Rituel de la Haute Magie (1861, 2 vols., 8vo.) is based upon the keys of the Tarot.\n\nEliphas Levi had a most romantic life, and died in 1870, leaving a son (I believe).\n\nSTANISLAS DE GUAITA.\n\nContemporary Kabbalistic scholar.\n\nHe made several applications of the Tarot to the Kabbalah.\n\nWe have given one extract of them already.\n\nConsult also, Au Seuil du Mystère (1886), and Le Serpent de la Genèse .\n\nJOSÉPHIN PÉLADAN.\n\nA clever novelist and eminent Kabbalist.\n\nHe often wrote upon the Tarot in his works (1885-1889).\n\n\"THE PLATONIST\" (1888).\n\nReview of American Occultism.\n\nIt contained a poor study upon the application of the Tarot to horoscopy.\n\nThis essay has been reproduced in the Theosophical Publications .\n\nSmall pamphlets called \"Siftings,\" No.\n\n14 (London 1888) (7, Duke Street).\n\nF.\n\nCH.\n\nBARLET.\n\nOne of the most learned and most highly-esteemed authorities amongst French Occultists.\n\nThe summary of one of his works on the Tarot Initiatique (1889) is quoted in extenso, page 253.\n\nOSWALD WIRTH has studied the astronomical Tarot (see Chapter XVI.), and has carefully reproduced the twenty-two symbolical figures, according to the most recent information obtainable upon Symbolism (1889).\n\nE.\n\nPOIREL.\n\nOccultist.\n\nEditor of the Tarot d'Oswald Wirth (1889).\n\nELY STAR.\n\nAn author known by his interesting work upon Astrology, the Mystères de l'Horoscope (Dentu, 1888).\n\nIt contains a chapter upon the Tarot.\n\nH.\n\nP.\n\nBLAVATSKY.\n\nThis author, rendered eminent by her works upon Theosophy, mentions the Tarot in her books ( Isis Unveiled and the Secret Doctrine ), but very superficially and without any synthetic basis.\n\nCH.\n\nDE SIVRY.\n\nA very talented occultist, chiefly known by his works upon music.\n\nTo his kindness we owe the summary of a Tarot Bohémien entitled-- Extract from the sacred book of the Opâchti tribe, the primitive family, which adored Otchâvâtri representing the only God Otchawatra.\n\nThis tribe lived at the foot of the Himalaya.\n\nThis book describes the symbolism of the twenty-two arcana, according to the Gypsies, with interesting details upon esoterism.\n\nMATHERS, an English author, has recently published a short account of the Tarot, which contains nothing very original: it is rather a summary of the principal authors who have studied the question.\n\nIt is chiefly written as an aid to fortune-telling by cards.\n\nThis closes the list of authors whose books we have heard of, and who have alluded to the Tarot or used its keys .\n\nWe may have omitted some of them, if so we must beg them to excuse us."


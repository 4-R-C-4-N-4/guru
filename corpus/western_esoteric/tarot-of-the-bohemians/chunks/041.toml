[content]
body = "THE EMPEROR.\n\nTHE EMPEROR.\n\n4.\n\nד 4th Hebrew letter (Daleth).\n\nORIGIN OF THE SYMBOLISM OF THE FOURTH CARD OF THE TAROT.\n\nThe hieroglyphic meaning of Daleth is the womb.\n\nIt suggests the idea of an object giving plentiful nourishment, the source of future growth.\n\nThe child is the living link, which in its neutrality reunites the opposition of the sexes; the Daleth therefore denotes abundance springing from division.\n\nLike the 1, it is a sign of active creation; but this creation is the result of previous actions easily determinable, whilst the origin of the Unity is inaccessible to human conceptions.\n\nThe Daleth expresses a creation made by a created being.\n\naccording to divine laws.\n\nThe Daleth should be the image of the active vivifying principle of the Universe, Jupiter, the reflex of the Primal cause.\n\nTHE FOURTH CARD OF THE TAROT.\n\nThe Emperor .\n\nThis symbol should express in the active form all that the preceding card expressed in the passive .\n\nA man seated in profile.\n\nThe man indicates the active; his position, however, shows that this activity is engendered by a superior term.\n\nThe 1st arcanum, the Juggler, the active absolute , was represented standing , looking to the front; the 4th arcanum, active relative , is seated in profile.\n\nThis man holds in his right hand the sceptre, the symbol of generation or of Venus ♀.\n\nThe sceptre is held in the right hand , to indicate the active influence, which the vivifying principle exercises in nature, by opposition to the formative principle (arc.\n\n3).\n\nThe man is bearded and wears a helmet with twelve points (six on each side).\n\nHe is seated upon a cubic stone, which bears the figure of an eagle.\n\nThe helmet indicates the rule of the Divine Will in the Universe, and its universal action in the creation of Life (eagle).\n\nThe position upon the cubic stone indicates realization in all the worlds.\n\n(1st) Realization of the Divine Word by the creation.\n\n(2nd) Realization of the ideas of the Being shared by the quadruple work of the spirit-- Affirmation,--Negation, Discussion, Solution.\n\n(3rd) Realization of the actions conceived by the Will.\n\nThe man's legs are crossed, his body forms a triangle .\n\nDomination of the Spirit over Matter.\n\nConsidered more attentively, the figure reproduces the symbol of Jupiter 2 +, represented by the fourth card of the Tarot.\n\nThe fourth card of the Tarot corresponds to the second He , and therefore bears two, very distinct aspects.\n\nIt first expresses a term of transition uniting the first series (active and passive forces, the link between the two forces) to the following series; the passage from one world to the other.\n\nBut it also represents this term of transition, itself becoming the first term in the following series.\n\nAs the following series taken as a whole is negative relatively to the first, the fourth symbol represents the active influence of the first series 1, 2, 3, in the second series 4, 5, 6.\n\nThe 4 therefore expresses the reflections of the first card in all its details.\n\nIt acts towards the first series exactly as the second card acted towards the first.\n\nThis interprets its meaning-- In the Divine .\n\nReflex of God the Father-- THE WILL In the Human .\n\nReflex of Adam-- THE POWER.\n\nIn the Natural .\n\nReflex of Natura naturans-- THE UNIVERSAL CREATIVE FLUID.\n\nThe soul of the Universe.\n\n4.\n\nד The Emperor ."


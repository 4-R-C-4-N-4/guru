[content]
body = "But our conclusions do not stop here.\n\nIf we study these three primitive principles more attentively we shall find in the first: Providence or the Element of Wisdom, represented in philosophy by the word God .\n\nDestiny or Being shows us its identity with the immutable laws which govern the Universe .\n\nLastly, it does not require much study to prove to its that the human Will responds to Man.\n\nGOD, MAN, AND THE UNIVERSE.\n\nThis is the basis of all the esoteric philosophy of the ancients, and not only Wronski and Fabre d'Olivet agree in their conclusions respecting this mysterious ternary; occult science itself proclaims its identity with these principles by the mouth of all its disciples.\n\nHermes Trismegistus , the Holy Kabbalah , Neo-Platonicism , and the Alchemists through Pythagoras and all the Greek philosophers assert the division of the Great All into THREE ENTITIES OR WORLDS.\n\nIn less remote ages Guillaume Postel gives the key of the Tarot without explaining it, and the basis of this key is formed by this mysterious entity-- DEUS, HOMO, ROTA.\n\nTrithemie and his pupil Cornelius Agrippa also give us this fecund and sublime trinity in all their analogical figures.\n\nThe Jesuit Kircher describes this division into three worlds as the basis of the Egyptian mysteries.\n\nLastly, Claude de Saint-Martin has written a book entirely based upon the keys of the Tarot, and it is entitled-- Tableau Naturel des rapports qui unissent DIEU, L'HOMME, ET L'UNIVERS.\n\nLet us question India upon the law of the absolute, she replies-- Trimurti : BRAHMA, SIVA, VISHNU.\n\nLet us ask China for the great secret of her philosophy, and she will give us the Tri-grams of Fo-Hi .\n\nAddress ourselves to one of the ancient initiated Egyptians, he will tell us-- OSIRIS, ISIS, HORUS.\n\nThe founder of Greek Cosmogony , the disciple of the science of Egypt, Hesiod , also transmits this law to us, and they all confirm Louis Lucas when he states: \"I feel that hidden beneath this mystical formula of the Trinity is one of the most important scientific laws that man has ever discovered.\" God, Man, and the Universe, these are the most general principles that we can attain, and they constitute the three meanings of the first card of the Tarot.\n\nIt remains for us to ascertain first, whether these meanings respond to the primitive hieroglyphic, and then to determine bow far they extend through the whole Tarot."


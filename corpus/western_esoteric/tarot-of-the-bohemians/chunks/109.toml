[content]
body = "Lastly, in יהוה (IEVE), as in אדמ-הוה (Adam-Eve), Vau (ו) represents the fecundity of this union, and the last He (ה) symbolizes natura naturata (issued from natura naturans , increased by the mixed principle).\n\nThese four letters, יהוה (IEVE), symbolize the quaternary of Mercavah , the six letters of Adam-Eve, אדמ-הוה, the senary of Bereschith .\n\n(Fragment of the Serpent of Genesis published in the Lotus of March 1888, p.\n\n327, and 328 note .)"


body = "Ut us, however, return to our deduction, and by summing up the results obtained, we shall find-- Representations of the Yod : The King The 1 or Ace The 4 The 7 Representations of the He : The Queen The 2 The 5 The 8 Representations of the Vau : The Knight The 3 The 6 The 9 Representations of the 2 nd He : The Knave The 10 FIGURATION OF ONE COLOR Head --Spirituality Divine World Chest --Vitality Human World Body --Materiality Material World Transition from one being to another Transition from another one world to STUDY OF THE FOUR COLOURS.\n\nSupplied with these data, let us continue our study, and apply the same principle to the other cards.\n\nThe laws which we have defined for the constitution of one colour, apply in the same way to the other three colours.\n\nBut when we consider the four colours of the Tarot, new deductions will be called forth.\n\nWe must remember that these four colours are: the Sceptre, the Cup, the Sword, and the Money or Pentacles.\n\nThe Sceptre represents the Male or the Active.\n\nThe Cup is the image of the Passive or Feminine.\n\nThe Sword represents the union of the two by its crucial form.\n\nLastly, the Pentacles represent the second He.\n\nThe authors who have philosophically studied the Tarot are all unanimous in asserting the analogy that exists between the tetragrammaton and the four colours.\n\nGuillaume Postel, and above all Eliphas Levi, have developed these studies with great results, and they show us the four letters of the tetragrammaton applied in the symbolism of every cultus.\n\nWe must pause one moment to notice the analogy, between these letters and the symbols of the Christian religion.\n\nThe Yod or Sceptre of the Tarot is represented by the episcopal crosier.\n\nThe 1 st He or Cup is represented by the Chalice.\n\nThe Vau or Sword by the Cross, bearing the same form.\n\nThe 2 nd He or Pentacles by the Host, the transition from the natural to the Supernatural world.\n\nThe series which we have studied in one colour is defined equally strictly in the four colours regarded as a whole, thus-- Sceptre or Yod Cup or He 2nd He or Money Vau or Sword A COMPREHENSIVE GLANCE OVER TIRE MINOR ARCANA.\n\nIf we look back a little, we can easily judge the road we have traversed.\n\nThe four colours considered in globo have shown us the application of the law Yod-he-vau-he .\n\nBut the same law is reproduced in each of the colours taken separately.\n\nThe four figures represent Yod-he-vau-he ; The four series of numbers also.\n\nLet us then arrange all the cards according to their affinities, and we shall obtain the following results-- The 4 Kings = Yod The 4 Aces The 4 Fours The 4 Sevens The 4 Queens = He The 4 Twos The 4 Fives The 4 Eights The 4 Cavaliers = Vau The 4 Threes The 4 Sixes The 4 Nines The 4 Knaves = He The 4 Tens If we wished to represent this arrangement by a synthetic diagram, we should place the sacred name in the centre of a circle divided into four parts, which respectively correspond with each of the letters Yod-he-vau-he .\n\nIn each of the quarters, the cards that are analogous to the letters of the tetragrammaton will radiate from the centre.\n\nSee the diagram on page opposite.\n\nThe figures have the same connection with the colours as the numbers have with the figures."


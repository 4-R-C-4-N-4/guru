[content]
body = "But since, as our sciences prove to us, the Kosmos itself is in a state of evolutive movement, and since according to their teachings this movement clearly inclines towards a progressive synthesis, which spiritualizes the living being by entering more and more into its composition, the preceding scheme expresses but one half of the Universe, the one which descends.\n\nWe must now add to it a second half, which restores the atom, ω, to its opposing principle α, through the progressive synthesis of individual lives.\n\nThis is Progress , the sequence of Creation.\n\nThus the Universe appears to us like a circular current, in which the flow is necessarily inverse in the two opposing arcs: from the positive pole a to the negative pole w the current descends--this is Involution , the descent of the Spirit into Matter; from the negative pole ω to the positive pole α the current re-ascends--this is Evolution , the spiritualization of Matter.\n\nWe shall describe it presently.\n\n* * * Let us then infer for man-- The evidence of our sciences shows him to be upon the ascending arc, already far from the negative pole, since he is at the head of the three kingdoms of the terrestrial world.\n\nHe thus belongs to the visible world of the Universe; the imposing monument of science is a proof of the position which he also occupies in the intellectual world ; but at the same time his errors, his doubts, the enormous deficiencies in his knowledge, and his passions, sufficiently prove that he is no longer master in this sphere, as he is in the inferior world.\n\nAs to the divine world , he conceives it, presses towards it; but if be attain it, it will be by faith rather than by science.\n\nMan is then a being who in his re-ascension has reached the middle region, and even the centre of that region; his place is in the centre of the ascending are, between the superior and the inferior beings of creation, ruling the one, ruled by the others, midway between the Angel and the Beast.\n\nA situation inevitably painful through the equality of the two opposing forces, which retard his ascension; he has come to a dead stop, which must be overcome by a special effort.\n\nAt the present time Initiation is the instrument which facilitates the development of the human butterfly.\n\nWe shall soon understand of what it consists.\n\n* * * The Ancients, with the usual force of their synthetic genius, have symbolized the whole of Involution and Evolution by a sequence of twenty-two figures, full of hidden significations, which the occultists name the Twenty-two Great Arcana .\n\nTaking the ten first as a description of Involution, we find in the others the successive phases of Initiation, such as they are depicted in the twelve hours (or sentences) which form the Nuctemeron attributed to Apollonius of Tyana.\n\nThese we shall now enumerate.\n\nTo be perfectly clear we must first return to Evolution for one moment.\n\nIn fact its analysis is not completed by the ten terms which have led us to the Kosmos, the dynamic equilibrium of Force and Matter.\n\nThis Kosmos can be analyzed in its turn as two principles which, according to all the sciences, are conflicting in every movement of matter: the Active and Passive (male and female of organizations, acid and basis of chemistry, the opposing poles of electricity, &c.).\n\nCompletely inert matter is only found in their absolute equilibrium in the unsiezable pole exactly opposed to the α--the ω of the Universe.\n\nThe occultists have represented this 4th tetractys, of which the Kosmos is the first term (the tetractys of the inferior world, infera, hell ), by the 11th, 12th, and 13th arcana, the Kosmos being its first term.\n\nThe arcanum which bears the generally dreaded number 13 requires further notice."


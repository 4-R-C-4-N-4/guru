body = "CHAPTER XIV.\n\nGENERAL SUMMARY OF THE SYMBOLICAL TAROT.\n\nTHEOGONY--ANDROGONY--COSMOGONY.\n\nInvolution and Evolution.\n\nTheogony --The Absolute according to Wronski, Lacuria, and the Tarot--Theogony of divers Religions identical with that of the Tarot-Summary.\n\nAndrogony -- Cosmogony .\n\nFigure containing the Symbolism of all the Major Arcana, enabling the Signification of each Card to be defined immediately.\n\nGENERAL SUMMARY OF THE SYMBOLISM OF THE MAJOR ARCANA.\n\nTHEOGONY--ANDROGONY--COSMOGONY.\n\nHaving completed our study of the twenty-two major arcana, considered separately, we will now review as clearly as possible the knowledge which may be gathered from the preceding explanations.\n\nWoe have already established from the study of the first card, that three primary principles are considered throughout their evolution: the Universe, Man, and God.\n\nWe need only recall grosso modo the sense of each card of the Tarot to prove the existence of a well-established progression, which starts from God the Holy Ghost to end in Matter , while passing through a number of varying modalities.\n\nAnother gradation leads from Matter to God, the primitive origin of all things.\n\nThis double current of the progressive Materialization of the Divine, or INVOLUTION, and of the Progressive Divinization of the Material, or EVOLUTION, has been too well studied by our eminent friend CH.\n\nBARLET, for us intentionally to vary from him in any way; we shall therefore quote his interesting work in extenso , and thus enable the reader to see that our conclusions are absolutely identical, although we have been led to them by very different paths.\n\nBut our present object is to review as clearly as possible the meanings of the major arcana of the Tarot, regarded from a synthetic point of view.\n\nFrom the preceding, chapters it will be seen that this study is really a COSMOGONY, or study of the creation of the Universe, crowned by an ANDROGONY, or study of the creation of Man, and even by an essay on THEOGONY, or study of the innate creation of God.\n\nTHEOGONY.\n\nThe Tarot places at the origin of all things the Absolute undetermined, undeterminable, the ONE, both knowing and unknowing, affirmative and negative, force and matter., unnamable, incomprehensible to man.\n\nThe Unity manifests itself to itself by three terms, the highest and most general terms which the human comprehension can grasp; terms which form the basis of all theogonies, and which designate the same principles under a multitude of varying names.\n\n1.\n\nThe first of these terms symbolizes Absolute activity in all its acceptations, the origin of all movement, of all masculine creative force.\n\nGOD THE FATHER: OSIRIS--BRAHMA--JUPITER.\n\n2.\n\nThe second of these terms symbolizes Absolute passivity in all its acceptations, the origin of all repose, of all feminine preserving force.\n\nIt is the humid principle of nature, even as the first is the igneous principle.\n\nGOD THE SON: ISIS--VISHNU--JUNO.\n\nThe third of these terms is the most important to us.\n\nSynthetically it blends the two preceding terms in one UNITY; all study should be commenced by it, for no being is conceivable unless it be considered synthetically, and the third term is the origin of all synthesis.\n\nIt is Absolute Union in all its acceptations, the origin of all reality, of all equilibrium, of all equilibrist transforming force.\n\nIt is the mercurial principle in nature balancing the two first.\n\nGOD THE HOLY GHOST: HORUS--SIVA--VULCAN."


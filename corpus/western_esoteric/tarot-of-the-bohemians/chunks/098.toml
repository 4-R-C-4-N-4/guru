[content]
body = "THE DIVINE NAME IN THE TAROT.\n\nBy Ca.\n\nBARLET.\n\nThe totality of the symbols which form the Tarot is distributed through a series of 78 plates or cards, instead of being presented in a single figure; the reason for this is, that the signification of this totality is very multiple; for it is at the same time theologic, cosmologic, psychologic, and divining, and this variety is the result of the different combinations which can be produced by the arrangement and comparison of these 78 cards.\n\nThis variety is not one of the lesser beauties of this unique masterpiece, in the sense that it adds movement and consequently life to the usual immobility of every written representation, without counting the diversity of its appliances, which include numbers, words, form, and colour.\n\nThe Tarot can therefore be made to speak when one of its innumerable combinations has been found; that is to say, when the student knows how to arrange the whole or part of his cards upon the table, in the order necessary to discover the answer which he seeks.\n\nWe ask him: What is the Creation from man's point of view, that is to say, what is the life of the Great All, and how can or should man participate in it?\n\nThe whole Tarot, with its 22 great arcana and 56 minor arcana, will answer us, as we shall show by quoting only a few of the profound interpretations which it provides.\n\nTo obtain this information we must remember that the three first cards which express the Trinity form at the same time the key to the 22 great arcana, which, when the 0 is abstracted, are only seven repetitions of this Trinity.\n\nWe must also notice that the card M, the fourth term of the divine tetractys, is both the realization of the Trinity restored to the unity, and the first term of the following Trinity.\n\nThe four first cards thus represent the divine name of 4 letters, IEVE (יהוה) so that if we repeat the Trinity seven times, to obtain the sequence of the 21 great arcana, the numbers will correspond to the four letters as follows-- Numbers 1.\n\n2.\n\n3 -- 4.\n\n5.\n\n6.\n\n-- 7.\n\n8.\n\n9 -- etc.\n\nLetters י ה ו ה י ה ו ה י -- etc.\n\nI E V -- E I E V E I -- etc.\n\nWe will assume that these letters are thus attached to the corresponding arcana, and this remark will be the first key to the arrangement which we are looking for.\n\n' To find a second key, we must redeal our cards in a.\n\ngiven space; at first only their place in the plane will appear; then it will be clearly defined.\n\nWe know that the Kosmos is conceived as the final expansion of the mathematical point, that is to say, of the Absolute, which before this expansion included all force or potentiality in its nothingness.\n\nLet us draw this sphere (see Fig.\n\n1 ).\n\nThe centre of it will be represented by one of the cards, 0, the Foolish Man or Crocodile , which is the pivot of the whole pack, at the same time that it participates in all the other cards, for they include all the properties of our universe.\n\nFrom some point of the sphere, a point which becomes our north pole, the movement will start, by which the creation will appear on its surface.\n\nFIG.\n\n1 Around this point upon the sphere, the reflex of the centre, we will place the cards of our 3 first arcana: I.\n\n(the Mage, the Spirit, י); II.\n\n(Knowledge, Substance, ה); III."


[content]
body = "Arcana 21-22 Ten of Sceptres ---- of Swords ---- of Cups ---- of Pentacles GENERAL FIGURE OF THE CONSTRUCTION OF THE TAROT, SHOWING ALL THE AFFINITIES.\n\nThe absolute law.\n\nYod He Vau He is in the centre of the figure.\n\nEach of the letters of the tetragrammaton governs one quarter of the circle which contains its affinities.\n\nThe different colours indicate the especial dominion of each arcanum.\n\nGRAND GENERAL FIGURE OF THE TAROT.-- Arrangement of Series ."


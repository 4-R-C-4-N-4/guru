[content]
body = "CHAPTER XXI.\n\nAPPLICATION OF THE TAROT TO GAMES.\n\nThe Royal Game of Human Life played by the Egyptians.\n\nThe Unity of Games in the Tarot.\n\nTHE ROYAL GAME OF HUMAN LIFE, ACCORDING TO THE EGYPTIANS.\n\n1.\n\nWhen the players have chosen their Magian , they also choose from amongst the non-players a man and a woman, whom they name Osiris and Isis .\n\n2.\n\nWhen commencing a game, the Magian having taken the central place, the players settle the amount of the principal fine together (we will suppose it to be one halfpenny), and a basket is placed on the table to receive the money.\n\n3.\n\nWhen all the players axe seated, the Magian takes the Book of Thoth, i.\n\ne.\n\nthe pack of Tarot cards, and shuffles them, carefully placing their heads alternate ways, but without looking at them, lets them be cut by some player on his left, and then deals the cards to his right, giving as many as he likes, up to seven, to each player and to himself 4.\n\nEach player should notice that the top of the card (when the Magian deals it) is facing his chest; it is therefore in that sense, and according to the order in which the cards are dealt, that the players should read the oracles traced upon it, which they refer to whomever they choose amongst the persons in the house.\n\n5.\n\nWhen one of the players reads an oracle he assumes the character of an interpreter , and if the person to whom he refers the oracle will not give him a present, be must pay half the fine.\n\n6.\n\nWhen a person has received three veracious oracles upon the past, the present, or according to probabilities the future, and he refuses to reward the interpreter, the players will hold a council, and judge by a majority of voices whether his refusal is justified or not.\n\nIn the latter case, the Magian must pronounce the word PAMENES, which warns all the household that there is one person present who does not join in the royal game of the Human Life, and then Osiris and Isis are obliged to pay for him, for when they accepted these titles, they undertook to diffuse peace and abundance over the heroes who are playing.\n\n7.\n\nWhen one of the spectators asks to buy the hand of one of the players, the Magian fixes its price, which is divided into three parts: the first third is paid into the fine-box; the second to the Magian; and the third to the player, who however can avoid parting with his cards by paying the two first thirds of the price fixed by the Magian.\n\n8.\n\nWhen one of the spectators has acquired the hand of one of the players, he takes with it all the player's chances of fines and presents.\n\n9.\n\nWhen one of the players cannot read the oracles, he places his seven cards on one side and pays one-fourth of the fine.\n\n10.\n\nIf the player, although able to read the oracle, cannot find any one to whom he can refer it, he must lay his cards upon the table, face upwards, and read the meaning that he sees in them, without paying anything.\n\nIf, on the other hand, he interprets them badly, according to the judgment of the other players, the Magian condemns him to pay half the fine.\n\n11.\n\nWhen the interpreter has pronounced the oracle, aloud or privately, and has received a present, he can have his seven cards re-shuffled by the Magian, who will return them to him to cut; and finally, if the same cards produce three presents from the same or other persons to whom the oracles have been uttered, all the players, except the Magian, give the interpreter three times the value of the fine.\n\nThis is the civic crown.\n\n12."


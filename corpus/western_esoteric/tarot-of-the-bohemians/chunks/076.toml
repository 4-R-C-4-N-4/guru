[content]
body = "That the social organization of China has been maintained for so many centuries, is solely due to the principle of basing everything upon the family.\n\nThe characteristics of the human Ternary are: Adam, Necessity, the image and reflection of Will and Power; Eve, Liberty, the image and reflection of Intelligence and Authority; and Adam and Eve, Charity, the image and reflection of Love and Beauty given by the constituent terms.\n\nREALIZATION and JUSTICE, balanced by PRUDENCE, indicate the moral constitution of Man, whilst the POSITIVE ASTRAL LIGHT (or OD), the NEGATIVE ASTRAL LIGHT (or OB), and the EQUILIBRATE ASTRAL FLUID (or AOUR), demonstrate the origin of his physical constitution.\n\nMagic Power , Courage , and Hope manifest the moral qualities of man, whilst Force potential in its manifestation, reflected Life , and Force balancing the two preceding qualities, indicate the influence of the Universe in him.\n\nThus, the law which governs all these manifestations of God in the series of his creations is Emanation .\n\nFrom the unique but fathomless centre emanates, in the first place, a Trinity of absolute principles which serves as a model for all the posterior emanations of the Being principle itself.\n\nEach element of this Trinity manifests itself in two great principles, of which it is the source: from the first principle, or the Father, emanate successively Adam and Nature creating, naturans , according, to Spinoza; from the second principle, or the Son, emanate Eve and Nature naturata , or recipient; lastly, the third principle, or the Holy Spirit, serves as a model to the similar constitution of Adam-Eve, or Humanity and the Universe.\n\nIn this way also the Ternary , emanated from the mysterious Unity, soon constitutes a Septenary formed by the various emanations of these three Principles, like the seven colours of the scale of light formed by the combination of three simple colours , themselves emanated from one single light ; or like the seven notes of the musical scale, formed by the fundamental trinity of sounds.\n\nThe Septenary formed of \"two Ternaries in the midst of which the Unity upholds itself,\" is therefore the expression of a being completely constituted.\n\nThis is now confirmed by the recent data given by Hindu Theosophy upon the seven principles of Man , and upon the seven principles of the Universe .\n\nWe could apply the Tarot to the explanation of these data; but we feel sure that it will soon be done, and we consider it useless to lengthen our work too much.\n\nWe will therefore conclude our study upon man by pointing out his constitution as given by the Tarot, which teaches that his body comes from the Universe, his soul from the Astral plane, whilst his Spirit is a direct emanation from God.\n\nANDROGONY .\n\nCOSMOGONY.\n\nAs we descend the ladder of the emanations of the Absolute Being, the principles become more material and less metaphysical.\n\nThe Tarot teaches us that the Universe results from the participation of the Human in the creative actions of the Divine, a profound mystery, which can throw much light upon the theological theories of the Fall.\n\nJacob Boëhm, the sublime visionary shoe maker, and Claude de Saint-Martin, his admirer and disciple, give upon this subject some explanations which may be easily understood with the Tarot, and to which we refer curious inquirers.\n\nGod manifests himself in the Universe by his third trinitarian manifestation: Natura naturans , realized in the UNIVERSAL TRANSFORMING PRINCIPLE, Natura naturata , in INVOLUTION; and lastly in the mysterious cyclic force which we have analyzed, in reference to the 15th arcanum, and which we name the FATAL FORCE OF DESTINY."


[content]
body = "This is the God adored by materialist science, and we see that unconsciously its homage is offered to the Divinity itself under its most material form, even whilst it foolishly boasts of Atheism.\n\nDEATH, CORPOREAL LIFE, and the DESTINY which rules their mutual connection, constitute the preserving principles of the Universe; lastly, PLASTIC FORCE, INDIVIDUAL LIFE, and the ASTRAL LIGHT IN CIRCULATION, show us the means of Transformation and of Realization used by the Cosmos.\n\nBut these are abstract principles; if we wish to see them in action we must consider the following ternary.\n\nThe Universal Transforming Principle marks its existence by the DESTRUCTION of beings and of things; but the Opposing Principle , Involution , at once IMMORTALIZES Destruction by the influx of new divine currents into CHAOS.\n\nAdam materialized his nature by the FALL of his spirit into matter, the source of Death ; but the Corporeal Life , the source of HOPE, arises and provides the means of redeeming the fault, by suffering in the MATERIAL BODY.\n\nLastly MATTER itself appears, the final term of involution, after which recommences the grand Evolution towards the primitive centre.\n\nIt is unnecessary to say that we only wished to give a rapid sketch of the evidence of the Tarot upon Theogony, Androgony, and Cosmogony, without entering into detail.\n\nIn fact these are very serious questions, which require whole volumes to themselves, and we had not the least intention of discussing them in a few pages.\n\nCOSMOGONY .\n\nLet us now recapitulate a little, so that we may definitely end the involution of the three grand principles: From GOD THE FATHER have emanated successively-- Adam Will Natura Naturans Power Then their form The Universal Creative Fluid .\n\nAdam realized in the Father has produced Realization and the Astral Light ; whilst the Will was realized in Necessity , Supreme Power is shown in Magic Power , and the universal creative Fluid in Force Potential in its Manifestation .\n\nNatura naturans realized in the Universal Transforming Principle has produced Death , and the Universal Plastic Force , with their forms, Destruction , the Fall of Adam , and the visible world.\n\nThese are all the principles that have successively emanated from the Father , and which represent him.\n\nWe have reproduced them in a tableau-- The two following figures arranged upon the same plan as this one, give the emanations of the two other principles of the first ternary.\n\nIn our Introduction to the study of symbolism we have given a numbered figure which enables us to determine immediately the meaning of any card in the Tarot.\n\nIf we now apply all that we have said upon the symbolism of each of our cards to this subject, we can condense the whole symbolism of the major arcana in one figure .\n\nThe new tableau thus formed will give us the sense of all our principles, whatever their number may be, and this is how we obtain this meaning-- USE OF THE TABLEAU.\n\n1.\n\nSeek in the horizontal column, to the left of the principle under consideration, the sense written there.\n\n2.\n\nHaving ascertained this meaning, return to your principle and search in the vertical column at the bottom the great principle (God, Man, or the Universe) which is written there.\n\n3.\n\nCombine the meaning first obtained with the name placed in the vertical column, adding to it the word (itself or manifest) written in the vertical column which contains the principle of which you are seeking the meaning.\n\nAn example will explain this better.\n\nLet us ascertain the meaning of the MOTHER-- The first term of the 8th arcanum.\n\n1.\n\nI look in the horizontal column containing the word MOTHER and I find at the end, to the left, the following meaning -- Active preserving Principle .\n\nThe Mother is the Active preserving Principle.\n\nOf what?\n\n2."


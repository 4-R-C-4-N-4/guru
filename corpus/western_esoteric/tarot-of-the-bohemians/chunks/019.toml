[content]
body = "FIRST SEPTENARY.--The application of one law to very different terms has led us so far; we must not abandon this system, but persevere and say-- If in one ternary exist an active term = yod , a passive term = he , and a neuter term = vau , resulting from the two first, why should not the same result be found in several ternaries taken together?\n\nThe first ternary is active and corresponds to yod ; the second ternary is passive and corresponds to he ; the reaction of one ternary upon another gives birth to a third ternary or vau .\n\nLet us make a figure representing this-- The 7 therefore forms the element of transition between one septenary and another.\n\nIf we define the analogy between this first septenary and the Yod-he-vau-he , we shall find-- (1--4) י yod (2--5) ה he 2nd ה he (7) vau ו (3--6) A deduction may be made in passing, from which a great deal of information may be derived, if it be carefully studied: the 4 being only the 1, considered negatively , the 5 is only the 2 considered negatively, whilst the 6 is the negative of 3.\n\nIt is always the same number under different aspects .\n\nWe have therefore defined a first septenary, formed of two opposing ternaries.\n\nWe have seen that this septenary also reproduces Yod-he-vau-he .\n\nSECOND SEPTENARY.--The law that applies to the first ternaries is also true for the others, and following the same method we obtain a second septenary, thus formed-- The two ternaries, positive and negative, will balance each other to give birth to a second septenary and to its term of transition 13.\n\nThus-- General figure-- But if the two ternaries respectively act as positive and negative, why should not the two septenaries do the same?\n\nThe first septenary, taken as a whole, will therefore be positive , relatively to the second septenary, which will be negative .\n\nThe first septenary corresponds to yod , the second to he .\n\nTHIRD SEPTENARY.\n\nThe third septenary is thus formed-- (13--16) yod (14--17) he he (19) vau (15--18) If the first septenary is positive and the second negative, the third will be neuter, and will correspond with vau .\n\nWe should have therefore, definitely-- 1st, A POSITIVE SEPTENARY = Yod .\n\n2nd, A NEGATIVE SEPTENARY = He .\n\n3rd, A NEUTER SEPTENARY = Vau .\n\nYet each septenary contains one term which belongs to the preceding septenary, and one which belongs to the following septenary.\n\nThus the 7 is the 7th term of the first septenary and the 1st term of the second.\n\n13 is the last term of the second septenary and the 1st of the third, etc.\n\nThe result is that three terms remain to be classed.\n\nThese are-- 19 ---- 20 ---- 21 These three terms form the last ternary, the ternary of transition between the major arcana and the minor arcana , a ternary which corresponds to the second he , and which may be thus represented-- (19) yod (20) he 2nd he (0) vau (21) The last numbered card, which ought correctly to bear the number 22 (or its Hebrew correspondent), closes the Tarot by a marvellous figure, which represents its constitution to those who can understand it.\n\nWe will return to it presently.\n\nTherefore, in the major arcana, the great law is thus definitely represented.\n\n(See next page.) The first septenary corresponds to the Divine World, to God."


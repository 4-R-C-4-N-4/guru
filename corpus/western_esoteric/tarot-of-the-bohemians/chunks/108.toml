[content]
body = "EXAMPLE OF THE APPLICATION OF THE TAROT TO THE KABBALAH.\n\nTHE HIEROGRAM OF ADAM, BY STANISLAS DE GUAITA.\n\nIn asserting that the hierogram of Adam conceals the most profound arcana of the living Universe, we shall not astonish those who have made a serious study of the Sepher Bereschit .\n\nBy comparing the admirable translation of Fabre d'Olivet with the pentacular revelations of the Book of Thoth , it is not impossible to strike out the supreme light of truth.\n\nHere are a few data which will aid us to reach it.\n\nAdam אדמ is written in Hebrew, Aleph , Daleth , Mem .\n\nא (1st key of the Tarot: The Juggler).\n\nGod and man; the Principle and the end; the Equilibrant Unity.\n\nד (4th key of the Tarot: The Emperor).\n\nThe Power and the Kingdom; the verbal Quaternary; the Multiplication of the cube.\n\nמ (13th key of the Tarot: Death).\n\nDestruction and Restoration; Night and Day, moral and physical; Eternity and the Ephemeral; feminine Passivity; at once the gulf of the Past, the matrix of the Future.\n\nThe ternary analysis of the fathomless principle that Yod manifests in its inaccessible and synthetic unity, Adam is, in fact, very analogous to the hierogram Aum , which is so famous in the sanctuaries of India.\n\nIn אדמ, Aleph corresponds to the Father, the source of the Trinity; Daleth to the Son (whom the Kabbalah also names the King); and Mem to the Holy Spirit, whose ethereal body, devouring yet fertilizing transitory forms, causes life (inexhaustible and unalterable in its essence) to blossom upon the changing hot-bed of Growth .\n\nI have said that אדמ is the cyclic analysis of the principle, of which י (Yod) is the inaccessible synthesis.\n\nA simple calculation of the numerical Kabbalah confirms my assertion.\n\nLet us translate the letters into numbers (Tarotic method).\n\nא 1 ד 4 מ 13.\n\n1 + 4 + 13 = 18.\n\nIn 18, 1 +8= 9.\n\nIn Kabbalistic absolute numericals the analytical number of Adam is then 9.\n\nNow we obtain 10 by adding, to 9 the specific unity which leads the cycle back to its starting-point, and closes analysis in synthesis, and 10 is the number which corresponds to the letter Yod: this we were anxious to prove.\n\nThe hierogrammatic vocable אדמ (Adam) then represents the ninth evolution of the cycle, which emanated from י (Yod), and which closes in 10 by returning to its starting-point.\n\nPrinciple and end of all, the eternal Yod, revealed in its expanded form tertriune .\n\nLet us go further still.\n\nWe have then the right (noting, however, that Adam differs from Yod, or from Wodh, as the totality of the sub-multiples differ from the Unity),--we have the right to say, pursuing our analogies, If Adam be equal to 1, Adam-ah = I-ah ; and Adam Eve = I-eve .\n\nHe (ה) represents Universal Life, natura naturans ; יה then represents Yod united to Life, and אדמה (Adamah), Adam united to Life.\n\nThis is the union of the Spirit and of the Universal Soul at two different degrees (always remembering the distinction noticed above)."


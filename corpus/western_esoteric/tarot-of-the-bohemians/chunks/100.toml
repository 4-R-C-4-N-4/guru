[content]
body = "This representation, which geometricians name projection upon the plane of the Equator, gives the second figure (the 4 circles of the centre only); to it, for the sake of clearness in the symbols, has been added an equilateral triangle inscribed in the inner circle, with the points posed upon the 3 meridians.\n\nThe Roman figures inscribed in the circles represent the numbers of the cards placed m we have said, and, consequently, also indicate their place upon the table.\n\nThe arcana of the lower hemisphere are indicated upon the figure in dotted letters, in the same circles as the preceding; since the lower zones, seen only transparently, might be confused with the upper, through their mutual symmetry.\n\nHere, in its great features, is already an answer to our questions: the Spirit descends by three trinities from the Absolute into Matter (upper hemisphere).\n\nIt is realized by the trinity X.\n\n(Malchut), XI.\n\nand XII.\n\n(the Equator), and it returns to the Absolute by a trinity of growing synthesis, which constitutes human progress (lower hemisphere).\n\nWe will presently explain some of the philosophic interpretations which this distribution furnishes; let us first complete it by our 55 minor arcana.\n\nThey especially represent our solar world.\n\nSince we are now in the world of realization, 4 is its number, its fundamental basis; it is the Trinity realized; the divine name of 4 letters IEVE (יהוה).\n\nOur cards will be divided into 4 sections: the 4 colours of the pack, spades, hearts, clubs, and diamonds, with their hieroglyphic and far more significant names: the Sceptres , Cups , Swords , and Pentacles .\n\nEverything is dual in this world, where the equilibrium is unstable, unable to find any rest, except in the return to the Trinity, from which it proceeds.\n\nThus these 4 fundamental divisions will divide into 2 duads: the one spiritual, the other material, each composed of a masculine and feminine principle, namely-- Spiritual duad, the Sceptre (spades, a full triangle, masculine); the Cup (heart, an open triangle, feminine); religious attributes; Material duad: the Sword (club, a lobed triangle,), and the Pentacle (diamond, double triangle); the attributes of the warrior and of the artisan.\n\nFour other divisions correspond to these 4 colours, those of the figures which also form 4 duads, namely-- King and Queen; Knight or Warrior, and Knave.\n\nAs to the numbers which follow these figures, they lead us to another consideration, which is also essential to the distribution of our cards-- If 4 is the fundamental number of these minor arcana, the symbols of our world, we must not forget that it is also connected with the Trinity, from which it emanates; that it realizes it, and returns to it.\n\nWe must then also find the ternary element in it: after the colours and the figures, which have provided the basis of our word, the numbers, which are, as it were, the essence of it, will reflect the sephiroth in it, and by them the act of creation.\n\nThey pause, in fact, at 10, including 3 trinities besides the tenth, Malchut, which unites them.\n\nOur distribution must also take the two numbers 3 and 4 into account, by combining them so as to utilize all the elements which we have just enumerated.\n\nThis is how we can do this (follow Fig.\n\n1 upon the plane of the Equator, represented as a ring."


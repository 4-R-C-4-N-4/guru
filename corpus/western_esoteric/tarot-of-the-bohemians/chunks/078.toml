body = "In order to know, I seek in the vertical column containing the word Mother , and at the bottom I find Man or Humanity.\n\nThe Mother is the Active preserving Principle of Humanity .\n\n3.\n\nI add to the word Humanity the word placed in the small vertical column which contains the word Mother.\n\nThis word is Himself if relating to man, or itself if we take the sense of Humanity.\n\nWe should say-- The Mother is the Active preserving Principle of Man himself or of Humanity itself .\n\nThis example clearly indicates how this tableau should be used.\n\nTABLEAU Recapitulating the Symbolism of all the Major Arcana, enabling the definition of any one of these Arcana to be immediately determined.\n\n( See its use on page 219 .) CREATIVE PRINCIPLE (י) Active י 1 God the Father 4 Will 7 The Father 10 Necessity 13 Universal transforming principle 16 Destruction 19 The Elements CREATIVE PRINCIPLE Passive ה Adam Power Realization Magic Power Death The Fall of Adam Nutrition CREATIVE PRINCIPLE Equilibrist ו Natura naturata Universal Creative Fluid Astral Light Force potential in its manifestation Universal Plastic Force The Visible World The Mineral Kingdom PRESERVING PRINCIPLE (ה) Active י 2 God the Son 5 Intelligence 8 The Mother 11 Liberty 14 Involution 17 Immortality 20 Innate Motion PRESERVING PRINCIPLE Passive (ה) Eve Authority Justice Courage (TO DARE) Corporeal Life Hope Respiration PRESERVING PRINCIPLE Equilibrist ו Natura naturata Universal Life Elementary Existence Reflected and transitory Life Individual Life The Physical Forces The Vegetable Kingdom PRESERVING PRINCIPLE (ה) Active י 3 God the Holy Sprit 6 Beauty 9 Love 12 Charity 15 Fate 18 Chaos 0 The Motion of Relative Duration PRESERVING PRINCIPLE Passive (ה) Adam-Eve, Humanity Love Prudence (be silent) Hope (WISDOM) Destiny The Material Body Innervation PRESERVING PRINCIPLE Equilibrist ו Kosmos Universal Attraction Astral Fluid (AOUR) Equilibrist Force Nahash Astral Light in circulation Matter The Animal Kingdom Himself (י) Manifested Himself (ה) Manifested Itself (ו) Manifested Return (ה) to the Unity + - + - + - GOD (21) MAN HUMANITY (21) UNIVERSE (21) Tableau indicating the revolutions yod-he-vau-he in numbers ( positive arcana ): ( yod = 1, he = 2, vau = 3, 2 nd he = 4).\n\n(Key to the preceding Tableau.) 1 2 3 4 I.\n\n1 1 of 1 in VII.\n\n1 2 of 1 in XIII.\n\n2 3 of 1 in XIX.\n\n3 4 of 1 in 4 2 3 4 1 3 4 1 2 4 1 2 3 II.\n\n2 1 of 2 in VIII.\n\n1 2 of 2 in XIV.\n\n2 3 of 2 in XX.\n\n3 4 of 2 in 4 2 3 4 1 3 4 1 2 4 1 2 3 III.\n\n3 1 of 3 in IX.\n\n1 2 of 3 in XV.\n\n2 3 of 3 in XXI.\n\n3 4 of 3 in 4 2 3 4 1 3 4 1 2 4 1 2 3 IV.\n\n4 1 of 4 in X.\n\n1 2 of 4 in XVI.\n\n2 3 of 4 in XXII."


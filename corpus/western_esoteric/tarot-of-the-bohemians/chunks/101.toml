[content]
body = "outside the sphere)-- We will first separate some of the cards: the Knave of each of the 4 colours (ה), which, as the realization of the Trinity, King (י), Queen (ה), Knight (ו), serves as the transition from the quaternary to the ternary; and the 10 of each colour, the unity of complete realization, the multiple unity 1 and 0--Malchut.\n\nThe Knaves, by their participation in the quaternary and ternary, and their return to the Unity by the Trinity, have a universality which connects them with the unnumbered card 0 of the great arcana; we will therefore place them round this card, as a cross, in the centre of our equatorial circle.\n\nIn this way the centre will express: By the card 0, the original unity, the source and aim of creation; by its triangle, the primitive Trinity; by its 4 colours, the quaternary in which it is realized; by the character of the 4 Knaves, the return of this quaternary to the ternary; in short, the whole creation assembled in one point, in potentiality, which is the characteristic of the Spirit.\n\nOn the other hand the four 10 will be placed at the extremities of the cross formed by the Knaves, outside all our circles, as the expression of the Unity multiple, in its last term of differentiation.\n\nAs to the other cards, they include first 3 kinds of figures, which correspond with the 3 terms of the Trinity; it is quite simple to distribute them in the 3 parts of our external equatorial plane, corresponding with the 3 divisions of the sphere-- The Kings opposite to division I (י); The Queens opposite to division E (ה); The Knights opposite to division V (ו); [paragraph continues] and, since there are 4 colours for each of them, 4 subdivisions are naturally produced in each of our 3 principal divisions; these 4 subdivisions, corresponding to the Sceptre (י), the Cup (ה), the Sword (ו), and the Pentacle (ה), also repeat the Divine name of 4 letters (IEVE) (יהוה), and form the passage from the ternary to the quaternary.\n\nNow only the numbers remain to be placed; and we have only to make them correspond with the terms of the Trinity-- .\n\n281 The four 1 behind the Kings; The four 2 behind the Queens; The four 3 behind the Knights.\n\nThen, in a still more external circle-- The four 4 outside the Kings and the 1; The four 5 outside the Queens and the 2; The four 6 outside the Knights and the 3.\n\nFinally, an outlying circle will include the four 7, 8 and 9 in the same order.\n\nAs to the four 10, they are placed quite outside, as we have already said.\n\nWe thus obtain the distribution represented by the figures 1 and 2 .\n\nLet us now consider their signification.\n\nThe living atom descended upon the sphere has reached the point represented by arcanum X., the wheel of Ezekiel, which raises man and lowers the elemental .\n\nFrom this, the atom falls, so to speak, through the material world, which he has just entered."


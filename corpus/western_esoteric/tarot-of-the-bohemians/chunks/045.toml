[content]
body = "THE LOVERS.\n\nTHE LOVERS.\n\n6.\n\nו The 6th Hebrew letter (Vau).\n\nORIGIN OF THE SYMBOLISM OF THE SIXTH CARD OF THE TAROT.\n\nThe hieroglyphic sign for the Vau is the eye, all that relates to light and brilliancy.\n\nThe eye establishes the link between the external world and ourselves; by it light and form are revealed to us.\n\nThe dominant idea expressed by this letter will therefore be that of a connection, of a link between antagonists .\n\nWe have already dwelt at some length upon the Vau, but we think it may be useful to quote Fabre d'Olivet's observations upon this letter in extenso -- \"This sign is the image of the deepest and most inconceivable mystery, the image of the knot which reunites, or of the point which separates, the nothing from the being.\n\nIt is the universal convertible sign, which forms the passage from one nature to the other; communicating on one side with the sign of light and of spiritual sense וֹ (a pointed Vau), which is but a higher form of itself; on the other hand linking itself in its degeneration with Ayin (ע), the sign of darkness and of the material senses, which again is but a lower form of itself.\" The Vau is the second simple letter; astronomically it represents the second sign of the zodiac, the Bull.\n\nTHE SIXTH CARD OF THE TAROT.\n\nThe Lovers .\n\nThis symbol represents reunion, antagonism, with all their consequences.\n\nA beardless youth (our Juggler of the 1st arcanum), but without a hat, is standing motionless in the angle where two roads meet.\n\nHis arms form a diagonal cross upon his breast.\n\nThe repetition of the 1st arcanum under another form.\n\nHere the man is not one of the Initiates.\n\nHe does not know how to direct the magnetic currents of the Astral Light; he is therefore plunged in the antagonism of the different ideas which he cannot master.\n\nTwo women, one on his right, the other on his left, each with one hand upon his shoulder, point to the two roads.\n\nThe woman on the right has a circle of gold upon her head, the one on the left is dishevelled and crowned with vine leaves.\n\nThe two arms of the Juggler, expressing the positive and negative, the two columns of the temple of Isis, expressing necessity and liberty, are here personified by the two women, who represent Vice and Virtue.\n\nThe future of the young man depends upon the road which he chooses, whether he becomes one of the Initiates, the Mage of the 1st arcanum (the spiritual ו), or the rash thunder-stricken personage of the 16th arcanum (the ע).\n\nThe spirit of Justice floats above this group in a radiant halo; he bends his bow and aims the arrow of Punishment at the personification of Vice.\n\nA profound symbol indicating that if man chooses the path of Virtue he will not be left unaided, but that Providence will ally itself to his will and assist him to overcome vice.\n\nIn short, this hieroglyphic expresses the struggle between the passions and conscience, the antagonism of ideas.\n\nBut this antagonism is also the most powerful natural producer that exists in the world, when it resolves itself into LOVE, which attracts the opponents and unites them for ever.\n\nThis sixth card of the Tarot must be regarded under two aspects, which tend to the same signification.\n\n1.\n\nAs 3 of the 4, that is to say, as representing the 4th arcanum, or the reflection of 1 considered in its relation to union.\n\n2.\n\nAs balancing 4 and 5; this is shown in the triangle formed by the second ternary-- Each card balances the two others."


[content]
body = "Third hour of Apollonius: \" The serpents, the dogs, and fire .\" The first manifestation of force applied externally to inert matter for affecting transmutations; this is Alchemy.\n\nThe Neophyte having attained this step in practice must be ready morally to make a complete sacrifice of his personality; in the language of the alchemists, he must have destroyed his fixed nature by fire so as to, volatilize it.\n\nARCANUM XIII.: Death .\n\nFourth hour of Apollonius: \" The Neophyte wanders in the sepulchres, and it will injure him; he will experience horror and fear of visions; he should devote himself to magic and to géotie .\" This is Necromancy, the application of Force to the domination of inferior living beings: Elemental , or organisms ready to synthetize themselves, and Elementary , remains of the dead, on the way to disorganization.\n\nMorally, the Neophyte should die to ordinary life, to enter the spiritual life; the celestial man will he born from the corpse of the terrestrial man.\n\nThe foundations of the Universe are now reached; the Neophyte touches the extremity of the terrestrial aura, the sublunar atmosphere which surrounds every planet, like the reservoir of the elements of its life; he has now reached a terrible moment, when he must lose the earth to launch out into the ocean of space; a formidable crisis, to which two periods are consecrated.\n\nThe first is transitory.\n\nARCANUM XIV.: The two Urns (the terrestrial and celestial fluids).\n\nFifth hour of Apollonius: \" The waters above the heavens .\" Here the Neophyte learns the flow of the astral currents in the planetary aura, just as in the second hour he acquired a preliminary knowledge of Force, before exposing himself to it in the following hour.\n\nARCANUM XV.: Typhon (the electric whirlwind).\n\nSixth hour of Apollonius: \" Here one must remain quiet, immovable through fear .\" Unprotected the Neophyte exposes himself to the double and formidable fluid-current of celestial space, by which the ignorant or imprudent is carried away without mercy, but which raises the strong man who has purified himself.\n\nSilence, prudence, courage!\n\nAccording to your deserts you will be enraptured like St.\n\nPaul, or you will expose yourself either to madness, to the spiritualization of evil, or to sorcery.\n\nThis is the Sabbat or the Ecstasy!\n\nThe reader cannot pay too much attention to this solemn monument of practical occultism, so well described in Lytton's novel Zanoni under the name of the Dragon of the Threshold ; it is the formidable danger which necessitates so many secrets.\n\nThis threshold is reached by many artificial paths: the hachich, narcotics, hypnotics of every kind, the practices of spiritual mediums; but woe to him who attempts to pass it before he has triumphed in the long and laborious preliminary preparation!\n\nHis fate is foretold in the next arcanum.\n\nARCANUM XVI.: The Lightning-struck Tower .\n\nSeventh hour of Apollonius: \" Fire comforts every living creature, and if some priest, himself a pure man, purloin and use, it, if he blend it with holy oil, consecrate it, and then anoint some ailing limb, with it, the malady will be cured .\" The irresistible current has touched the man who exposed himself to its vortex on the terrestrial heights; if he The impure be is threatened with disorganization more or less complete, according to his intellectual or moral unworthiness, and his energy (incoherent mysticism, folly, death, or complete disintegration, represented by the genius of evil, the Devil)!"


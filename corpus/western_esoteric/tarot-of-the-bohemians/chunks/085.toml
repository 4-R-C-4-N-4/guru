[content]
body = "The Tarot is a deduction of the sideral book of Henoch , who is Henochia; it is modelled from the astral wheel of Athor , which is As-taroth , resembling the Indian ot-tara , the polar bear or arc-tura of the north; it is the major force ( tarie ) upon which is based the solidity ( ferrale ) of the world and the sideral firmament of the earth ; consequently, like the polar bear, called the chariot of the sun, the chariot of David and of ARTHUR, it is the Greek luck ( tuché ), the Chinese destiny ( tiko ), the Egyptian chance ( tiki ), the fate ( tika ) of the Romanies; and the stars, as they incessantly revolve round the polar bear, reveal to the earth ostentation and misery, light and shade, heat and cold; whilst from them flow the good and evil, the love and hatred, which form the happiness ( ev-tuchié ) and the misfortune ( dis-tuchié ) of men.\n\n* * * In truth Sephora is one of the harmonies in that triad s.\n\nf.\n\nr., which united form the light ( Sapher ), the number ( Sipher ), and the word ( Sephora ) of the Hebrews, from the Sphere of the Universe.\n\nFrom this sphere, of which the light is the truth , the zodiac the book which contains it, the stars the numbers and letters which explain it, the Anaks have drawn their Tara , the Gypsies their Tarot , the Phoenicians their As-tharot , the Egyptians their Athor , and the Hebrews their Thora .\n\nBut we cannot end this study upon the astronomical Tarot without some allusion to the work of Oswald Wirth upon this subject.\n\nIn some respects his conclusions differ from our own; but we are anxious on that account to copy his essay upon it, in order that each reader may judge between us for himself.\n\nESSAY UPON THE ASTRONOMICAL TAROT BY OSWALD WIRTH.\n\nAccording to Christian the twenty-two major arcana of the Tarot represent the hieroglyphic paintings which are found in the spaces between the columns of a gallery, which the neophyte was obliged to cross in the Egyptian initiations.\n\nThere were twelve columns to the North and the same number to the South, that is, eleven symbolical pictures on each side.\n\nThese pictures were explained to the candidate for initiation in regular order, and they contained the rules and principles for the Initiate.\n\nThe arcana corresponding to the twenty-two letters of the Hebrew alphabet must have been arranged upon the, walls of the secret crypts in the temples of Osiris in the following order.\n\n(See p.\n\n243 .) This opinion is confirmed by the correspondence which exists between the arcana when they are thus arranged.\n\nIt is at once evident that the arcana 2, 3, 4 and 5 form a complete group; this group corresponds to another formed by the arcana 21, 20, 19 and 18.\n\nNow in the interpretation of the symbols each arcanum should be studied in its relations with the neighbouring arcana, and particularly with those which are pendant to it in the grouping that we have pointed out."


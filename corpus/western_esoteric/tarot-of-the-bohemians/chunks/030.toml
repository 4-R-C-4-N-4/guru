[content]
body = "The Tarot of Watillaux , or pack of the princess Tarot, reproduces the minor arcana very correctly.\n\nIt is worth consideration on this account.\n\nThe Italian Tarot, that of Besançon and of Marseilles , are unquestionably the best which we now possess, particularly the latter, which fairly reproduces the Primitive symbolical Tarot .\n\nFOREIGN PACKS OF TAROTS.\n\nBesides the Italian we must quote the German Tarot, in which the symbols of the minor arcana are different .\n\nFor The Cups are represented by The Hearts The Pentacles ---- The Bells The Swords ---- The Leaves The Sceptres ---- The Acorns However, this Tarot is a very bad one.\n\nTHE TAROT OF OSWALD WIRTH.\n\nIt became necessary to have a Tarot pack in which the symbolism was definitely established.\n\nThis work, suggested by Eliphas Levi, who defined the principles on which it was to be based, has been accomplished by Mr.\n\nOswald Wirth.\n\nThis clever occultist, aided by the advice of Stanislas de Guaita, has designed the series of the twenty-two major arcana.\n\nThese drawings reproduce the Tarot of Marseilles, with the symbolical modifications suggested by the researches of Eliphas Levi upon this important question.\n\nOwing to the kindness of M.\n\nPoirel, who assisted the work by printing these designs, we now possess a marvellous symbolic document in the Tarot of Oswald Wirth .\n\nIt is therefore wise, as we have already said, for those who wish to study the Tarot very thoroughly, to procure the Tarot de Marseilles , and that of Oswald Wirth .\n\nWe shall use them both presently in our explanation of the symbolical meaning of each card, But before passing to the study of these symbols, card by card, we must see if there are no means of positively defining the symbolism of the Tarot.\n\nHOW CAN WE HOPE TO DEFINE THE SYMBOLISM OF THE TAROT CONCLUSIVELY?\n\nWe have already and sufficiently explained that the Tarot represents the ancient or occult science in every possible development.\n\nIf we then wish to find a solid basis for the study of the symbols represented in the 22 major arcana, we may put the Tarot on one side for an instant, and devote ourselves to this ancient science.\n\nIt alone can enable us to attain our end, not in finding the explanation of the symbols, but in leading us to create them one by one, by deducing them from fixed and general principles.\n\nWe shall thus commence work of quite a new character, whilst avoiding, so far as possible, falling into those errors which arise from the effort to explain the symbols of the Tarot by themselves, instead of seeking for their solution at their original source.\n\nThe first step in the search for these particular symbols leads us to discuss the grave problem of the origin of symbolism itself.\n\nWe cannot enter upon, much less solve, this question by ourselves; we shall therefore quote the opinions of several writers upon this subject.\n\nTruth, having Unity for its criterion, the agreement of various conclusions in one point will he a valuable guide for us.\n\nClaude de Saint-Martin , the unknown philosopher, states in his book, the Livre des Rapports , that the primitive alphabet is composed of sixteen signs.\n\nHe received these data, so far as we can judge, from intuitive revelation, joined to the teaching of the Illuminism, of which he was one of the members.\n\nLacour , in his book on the Elohim or Gods of Moses, has inductively determined the existence of a primitive alphabet, also composed of sixteen signs.\n\nAnother author, Barrois , pursuing inquiries of quite a different nature, also reaches the conclusion of the existence of sixteen primitive signs in his system of Dactylology."


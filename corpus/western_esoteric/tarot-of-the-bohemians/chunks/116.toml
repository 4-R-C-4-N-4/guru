[content]
body = "We divide our 10 cards into four packets: three packets of 3 cards each, and one packet formed of a single card, the 10th.\n\nWhen this is done we say-- The first packet of 3 cards, formed of the ace, 2, and 3, will have the same meaning as the Man , enterprise, commencement, the creation of some undertaking (enterprise, love, hatred, or money).\n\nThe second packet, composed of the 4, 5, and 6, represents Woman , and all the ideas of negation, of reflection, associated with her; that is to say, the opposite of man, antagonism, opposition in any matter.\n\nThe third packet signifies the equilibrium which results from the action of the two opposites upon each other, represented by the Young Man .\n\nLastly, the Child , the absolute neuter, will be represented by the 10th card.\n\nEach of the 3 cards in these packets have the same meaning.\n\nThe first card of these 3 packets will indicate the commencement; the second, opposition, antagonism; the third, equilibrium, which gives us the following general sequence in our 10 cards.\n\nKEY TO THE DIVINING TAROT.\n\n1.\n\nCommencement of Commencement .\n\n2.\n\nOpposition 3.\n\nEquilibrium 4.\n\nCommencement of Opposition .\n\n5.\n\nOpposition 6.\n\nEquilibrium 7.\n\nCommencement of Equilibrium .\n\n8.\n\nOpposition 9.\n\nEquilibrium 10.\n\nUndetermined: The card which follows will explain it.\n\nThus the three words, Commencement, Opposition, Equilibrium, the synonyms of Thesis , Antithesis , Synthesis , or of Brahma , Siva , Vishnu , etc., suffice for the explanation of all the minor arcana of the Tarot.\n\nWe need only add the words love, hatred, enterprise or fortune to each of the series, and we can define the meaning of every card without wearying the memory.\n\nThis we will now do.\n\nSIGNIFICATION OF THE FOUR SERIES OF THE MINOR ARCANA IN THE DIVINING TAROT.\n\nSCEPTRES.\n\nCreation .\n\nEnterprise .\n\nAgriculture .\n\nKING.\n\nThe King of Sceptres symbolizes a dark man, a friend.\n\nHe generally represents a married man, the father of a family.\n\nQUEEN.\n\nA dark woman, a friend.\n\nRepresents a serious woman, a very good counsellor, often the mother of a family.\n\nKNIGHT.\n\nA dark young man, a friend.\n\nKNAVE.\n\nA dark child, a friend.\n\nAlso represents a message from a near relation.\n\nACE OF SCEPTRES.\n\nCommencement of an Enterprise .\n\nTWO.\n\nOpposition to the commencement of the Enterprise .\n\nThe Enterprise is commenced when an unexpected obstacle suddenly prevents its execution.\n\nTHREE.\n\nRealization of the commencement of the Enterprise .\n\nThe basis of the work is now definitely established, and the undertaking can be fearlessly continued.\n\nFOUR.\n\nObstacles to the Enterprise .\n\nNothing can be accomplished without obstacles.\n\nWe therefore now find them appearing, and must prepare ourselves to overcome them.\n\nFIVE.\n\nOpposition to the obstacles.\n\nVictory after surmounting them .\n\nSix.\n\nRealization of the opposition .\n\nAt last the obstacles succeed.\n\nFailure of the Enterprise in the midst of its execution.\n\nSEVEN.\n\nCertain success to the Enterprise .\n\nEIGHT.\n\nOpposition to its success .\n\nThe Enterprise will only partially succeed.\n\nNINE.\n\nRealization of success .\n\nSuccess is continued.\n\nTEN.\n\nUncertainty in the management of the Enterprise.\n\nCUPS.\n\nPreservation .\n\nLove .\n\nInstruction .\n\nKnowing the meaning of one series, we know à priori the significations of the three others.\n\nWe shall however give them in order to facilitate the work.\n\nKING OF CUPS.\n\nA fair man, a friend .\n\nThis card also represents a barrister, judge, or ecclesiastic."


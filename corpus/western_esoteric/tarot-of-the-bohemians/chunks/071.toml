[content]
body = "* * * It is necessary to give a few explanations before we proceed further, in order that the deductions which follow may be intelligible to our readers.\n\nWe have said that no being is conceivable unless it be considered synthetically: we must now explain this sentence.\n\nLet us take Man for our example, and follow the advice of Claude de Saint-Martin: \"We must explain nature by man, and not man by nature.\" Man, regarded synthetically, is composed of an acting, animated body .\n\nIf we would think of the being man as a body only, without reference to its animation or to its faculty of acting, its reality immediately disappears, it is no longer a man; we are considering but a phantom created by our spirit, a phantom which we can analyze , study in all its subdivisions, but which, since it conveys no synthetic idea, does not really exist.\n\nIf in the same way we wish to imagine by itself the principle which animates this body, which makes it live, the reality at once disappears.\n\nIt is impossible for us to separate the life from the idea of the body, to conceive what this thing may be which is called the human Life, if we wish to see in it a kind of metaphysical being.\n\nIt is on this point that materialistic savants find the most power in their arguments against exclusively idealist thinkers.\n\nThe difficulty increases considerably if it be a question of the principle which causes this body to act--of the Will, of the Soul.\n\nAnalysis here, as elsewhere, can be brought into use, but we cannot possibly conceive what the soul can be like unclothed in a form , that is to say, in a principle that differs from itself.\n\nWe picture to ourselves a small sphere, a winged head, in fact anything, according to individual fancy, but never the soul considered individually.\n\nOn the other hand, the moment we say A MAN, these three terms, thus synthetised , assume consistence and become the expression of a reality , and a being, formed of a body, a life and a will, defines itself quite clearly.\n\nThis synthetic action, the source of all existence and of all reality, is the innate property of the third term in our Trinity of principles.\n\nThis is why the study of all realities should be commenced by this third term.\n\nHenri Wronski has always adopted this method; he names this principle the Neuter Element , and places it at the commencement of all his studies.\n\n* * * Consequently, the Trinity, composed of the three terms which we have specified, should be considered under two aspects.\n\n1.\n\nWe should first look at the synthesis of this trinity, the cause of its reality.\n\nThe third term (God the Holy Spirit) contains these conditions in itself.\n\n2.\n\nWe should then analyze this synthesis by dividing it into its three constituent terms, and by determining the existence of the two opposite terms, active and passive, positive and negative.\n\nWe must not forget that during this analysis we destroy the reality of the being thus divided into fractions.\n\nEvery reality, of whatever kind it mar be, is therefore composed of three terms , and these three terms are contained in one sole whole .\n\nThis truth is quite as applicable to physics as to metaphysics; the works of Louis Lucas upon physics and chemistry, and of Wronski in mathematics, are an irresistible argument against those who think that a philosophical principle is a foolish idea , without any practical import.\n\nThe third term of our theogonic series, or God the Holy Ghost, therefore represents the whole body of God, who can be analyzed in this way-- GOD THE HOLY SPIRIT Synthesis 3 GOD THE SON Antithesis 2 GOD THE FATHER Thesis 1 To sum up all that we have studied so far, we will say that we have discovered, first of all-- 1."


[content]
body = "It symbolizes a Bachelor.\n\nQUEEN OF CUPS.\n\nA fair woman, a friend .\n\nThe woman loved.\n\nThe Mistress.\n\nKNIGHT OF CUPS.\n\nA young fair man, a friend .\n\nThe young man loved.\n\nThe Lover.\n\nKNAVE OF CUPS.\n\nA fair child .\n\nA messenger.\n\nBirth .\n\nACE OF CUPS.\n\nCommencement of a love affair .\n\nTwo.\n\nOpposition to this commencement .\n\nUnimportant obstacles raised by one of the lovers.\n\nTHREE.\n\nRealization of this commencement .\n\nThe love is mutual.\n\nFOUR.\n\nSerious obstacles to the love .\n\nThey arise from other persons, not from the lovers.\n\nFIVE.\n\nOpposition to the obstacles .\n\nVictory over the obstacles after a struggle.\n\nSix.\n\nThe obstacles triumph .\n\nLove destroyed in the midst of happiness.\n\nWidowhood.\n\nSEVEN.\n\nSuccess assured to the lovers .\n\nEIGHT.\n\nPartial failure of love .\n\nLove only partially succeeds.\n\nNINE.\n\nMotherhood.\n\nTEN.\n\nUncertainty in the management of the love affair.\n\nSWORDS.\n\nTransformation .\n\nHatred .\n\nWar .\n\nKING OF SWORDS.\n\nA dark, bad man .\n\nHe is a soldier, a powerful enemy, who must be distrusted.\n\nQUEEN OF SWORDS.\n\nA dark wicked woman .\n\nThe card also indicates her actions, gossip and calumnies .\n\nKNIGHT.\n\nA young, dark man, an enemy .\n\nHe is also a spy .\n\nKNAVE.\n\nA child, an enemy .\n\nBad news .\n\nDelay .\n\nThe figures generally indicate opposition raised outside the house.\n\nACE OF SWORDS.\n\nCommencement of enmity .\n\nTwo.\n\nOpposition to this commencement .\n\nThe enmity does not last.\n\nTHREE.\n\nRealization of the enmity.\n\nHatred .\n\nFOUR.\n\nOpposition to the hatred.\n\nSuccess against the enemy .\n\nFIVE.\n\nOpposition to this opposition .\n\nThe enemy triumphs at the moment one fancies the victory is secured.\n\nSIX.\n\nEquilibrium of the opposition .\n\nThe enemy is rendered powerless at last.\n\nSEVEN.\n\nSuccess assured to the enemy .\n\nEIGHT.\n\nPartial opposition to this success .\n\nThe enemy only partially triumphs.\n\nNINE.\n\nCertain duration of the hatred .\n\nTEN.\n\nUncertainty in the enmity.\n\nPENTACLES.\n\nDevelopment .\n\nMoney .\n\nTrade .\n\nKING OF PENTACLES.\n\nA fair man , inimical or indifferent.\n\nQUEEN OF PENTACLES.\n\nA fair woman , indifferent, or inimical.\n\nKNIGHT.\n\nA young, fair man .\n\nA stranger.\n\nAn arrival .\n\nKNAVE.\n\nA fair child .\n\nA messenger.\n\nA letter .\n\nThe figures of the Pentacles are inverse to those of the Sceptres and Cups, and indicate all that comes from outside, from the country or abroad.\n\nACE OF PENTACLES.\n\nCommencement of fortune .\n\nInheritance.\n\nGifts.\n\nEconomy, etc., etc.\n\nTwo.\n\nOpposition to this commencement .\n\nDifficulty in well establishing the first landmarks of good fortune.\n\nTHREE.\n\nRealization of this commencement of fortune .\n\nA small sum.\n\nFOUR.\n\nOpposition of fortune.\n\nLoss of money .\n\nFIVE.\n\nOpposition to this opposition.\n\nA success coming which will balance the low .\n\nSix.\n\nRealization of the opposition.\n\nRuin .\n\nSEVEN.\n\nSuccess assured.\n\nA large fortune .\n\nEIGHT.\n\nPartial success .\n\nGreat loss of money at the moment apparently of definitely securing the fortune.\n\nNINE.\n\nEquilibrium of Equilibrium.\n\nA durable fortune .\n\nTEN.\n\nUncertainty in the fortune .\n\nGreat success and great reverses.\n\nAs a whole, we see the same series always repeating themselves.\n\nIt therefore requires little time to thoroughly learn the meaning of the minor arcana, even without much memory.\n\nWe advise those readers who fear they may forget them, to simply write the meaning on the cards themselves."


[content]
body = "THE JUDGEMENT. THE JUDGEMENT. 20. ר 20th Hebrew letter (Resh). ORIGIN OF THE SYMBOLISM OF THE TWENTIETH CARD OF THE TAROT. The hieroglyphic meaning of the Resh is the head of man , and it is therefore associated with the idea of all that possesses in itself an original, determined movement. It is the sign of motion itself, good or bad, and expresses the renewal of things with regard to their innate power of Motion. The Resh is a double letter, and responds astronomically to Saturn. TWENTIETH CARD OF THE TAROT. The Judgment . An angel with fiery wings, surrounded by a radiant halo, sounds the trumpet of the last judgment. The instrument is decorated with a cross. A tomb opens in the earth, and a man, woman, and child issue from it; their hands are joined in sign of adoration. How can the reawakening of nature under the influence of the Word be better expressed? We must admire the way in which the symbol answers to the corresponding Hebrew hieroglyphic. 1. Return to the divine World. The Spirit finally regains possession of itself-- ORIGINAL DETERMINED MOTION. 2. Life renews itself by its own motion-- VEGETABLE LIFE. RESPIRATION. 3. The material world progresses one degree in its ascension towards God-- THE VEGETABLE WORLD. 20. ר The Judgment . AFFINITIES SIGNIFICATIONS Hieroglyphic Primitive: The Head of Man Astronomy: Saturn Day: Saturday Hebrew letter: Resh (double) ORIGINAL AND DETERMINED MOTION __________ RESPIRATION Vegetable Life OBSERVATIONS THE VEGETABLE KINGDOM"


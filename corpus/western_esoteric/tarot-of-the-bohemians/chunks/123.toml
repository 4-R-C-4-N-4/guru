[content]
body = "SIXTH LESSON.\n\nEtteila's original and unpublished Method of Fortune-telling by the Tarot (from one of his rarest works).\n\nWE have explained a method which is original in a great measure, but as we have no intention of monopolizing the art of Cartomancy, we will now say a few words upon the system used by Etteila, the great master in this portion of occultism.\n\nEtteila, whose real name was Aliette, was a hairdresser's apprentice who lived at the time of the French Revolution.\n\nHaving accidentally found a pack of Tarot cards, he was interested by its eccentricity and began to study it.\n\nAfter thirty years he believed that he had discovered the secret of this Egyptian book.\n\nUnfortunately Etteila did not possess any synthetic knowledge, and this ignorance led him to the most erroneous conclusions, whilst many of his intuitive solutions are really marvellous.\n\nThere is too much inclination to calumniate this ardent worker; but we must recognize the real truths contained in his works without laying too much stress upon the ignorant simplicity which disfigures them.\n\nHowever this may be, Etteila devoted all his powers to fortune-telling, and if his contemporaries maybe believed, he succeeded wonderfully in his aim.\n\nHe therefore became the great authority for all fortune-tellers by cards.\n\nWe will describe his system in some detail, instead of alluding to those used by his female successors, who as a rule misrepresented without understanding his explanations.\n\n* * * Four deals are required before the Tarot can be clearly read according to this method: we will now enumerate them one by one.\n\nFIRST DEAL: Shuffle all the cards of the Tarot, without making any distinction between the major and minor arcana.\n\nThen let them be cut, and divide your pack into three heaps, each containing 26 cards.\n\n26 26 26 Take the central heap and place it on your right-- 26 26 26 on one side to the right.\n\nYou have still two packets of 26 cards.\n\nTake them, shuffle the cards, cut them, and divide them into three heaps, each containing 17 cards-- 17 17 17 1 One card will remain, but you need not trouble about it.\n\nYou then take the central packet and put it on your right hand by the side of the one of 26 cards already there-- 17 * 17 17 26 on one side.\n\n1 You then take the 35 cards which are not on one side, shuffle and cut them, then divide them into three heaps of 11 cards each-- 11 11 11 2 Two cards remain, but these axe of no consequence; take the central packet as before and place it on your right by the side of those already there-- 11 * 11 11 17 26 2 This ended, you collect the 21 cards that you have not placed on one side, and you are then ready to explain the oracle.\n\n* * * For this purpose you first take the packet of 26 cards from your right and lay it upon the table card by card, going from right to left-- 26................................................1 Then take the packet of 17 cards, which you place beneath the others, then the 11 cards, which you also spread out beneath the other two.\n\nYou then obtain the following arrangement.\n\nSoul 26................................................1 Mind 17...................................1 Body 11.......................1 Waste packet 24 You then explain the meaning of the cards, remembering that the lowest line, of 11 refers to the body , the centre one to the mind , and lastly, the upper line of 26 cards to the soul of the Inquirer.\n\nFrom this system of arrangement Etteila deduced his subtle arguments upon the creation of the Universe, the Kabbalah, and the Philosopher's Stone.\n\nBut we need not linger over it."


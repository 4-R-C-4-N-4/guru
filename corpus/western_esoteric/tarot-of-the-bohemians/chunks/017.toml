[content]
body = "The sequence of the figures is reproduced in the three worlds by the numbers; the same thing takes place in the sequence of colours: Sceptre, Cup, Sword, Pentacles are reproduced in the figures.\n\nThe Sceptre is the Yod of the 4 Kings.\n\nThe Cup is the He of the 4 Queens.\n\nThe Sword is the Vau of the 4 Knights.\n\nThe Pentacles is the He of the 4 Knaves.\n\nAnd just as each colour has a complete whole, formed of a body, of a soul, and of a mind or vital force, so the four colours form a complete whole thus composed:-- The material body of the minor arcana: The 4 Knights The 4 Sevens The 4 Eights The 4 Nines GENERAL FIGURE OF THE MINOR ARCANA.--Disposition of Series.\n\nThe vital body of the minor arcana: The 4 Queens The 4 Fours The 4 Fives The 4 Sixes The intellectual body: The 4 Kings The 4 Aces The 4 Twos The 4 Threes Reproductive organs: The 4 Knaves The 4 Tens We can only point out the very instructive affinities shown in these figures; they can be carried to a great length.\n\nWe give these indications in order to demonstrate the management of analogy , the method of the occult science, to which we have so frequently alluded in our preceding works.\n\nWe need only compare this last diagram, which represents the four colours, with the first, which depicted one only, to see at once that the law upon which these two diagrams are constructed is the same, only that the applications of it are varied.\n\nIt is the same law by which the cells that form the human being group themselves to constitute organs , the organs group themselves to form members , and the grouping of the latter produces the individual .\n\nWe have drawn the following conclusion from all that we have already stated-- The Pentacles , responding to the second He , indicates a transition.\n\nBetween what?\n\nBetween the minor and major arcana ."


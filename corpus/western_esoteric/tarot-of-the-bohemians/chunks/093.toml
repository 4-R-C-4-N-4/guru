[content]
body = "It is called DEATH and RESURRECTION, and it represents absolute Inertia, only found in Death; but here Involution stops and Evolution commences, for the equilibrium of the two principles, active and passive, is never prolonged.\n\nThis would seem to contradict the preceding remark, that the description of Initiation, that is to say, of the re-ascension, opens with the 10th arcanum, and not with the 14th.\n\nThis however is not so, because in Involution the being should retrace in an inverse sense, to complete the synthesis, every stage by which the α has been disintegrated in the course of its Involution.\n\nMan is the actual result of a work of this kind anterior to his present state, but of this work which has raised him from the ω to the stage of Will he is quite unconscious; at first he was subjected to it under the fatal pressure of pure Force only, then of instinct, desires, and passions; his previous evolution is therefore unknown to him, and yet how can he master any of these worlds without knowing them all?\n\nHis first work in Initiation must therefore be to re-descend to his first steps in Evolution, to become acquainted with all the degrees, all the forces, and all the beings that he has passed through, to penetrate the roots of life to death itself, and to learn to dominate them all.\n\nWe shall see presently that this is not a figurative assertion; the Neophyte cannot attain any reliable voluntary exercise of the transcendental faculties without first obtaining the mastery, over the forces which would produce illusion, which would threaten his life itself; without reaching Inertia and conquering it.\n\nLike the Christ, the model of regenerate man, he must expire upon the cross and rise again the third day; that is to say, after descending, the three last steps represented by the 11th, 12th, and 13th arcana, into the depths of hell, there to discover Death and to overcome him.\n\nThis fully understood, we will describe the twelve hours or phases of Initiation .\n\n* * * The 10th arcanum, the first hour of the series, corresponds with the stage which man has reached at the present time.\n\nThe symbol of this arcanum is the Sphinx , which guarded the entrance to the Egyptian world; the Neophyte descended between its paws into the tunnel which led to the sanctuary, through a series of tests, the image and noviciate of the descent which we have just mentioned.\n\nThis is then the hour of preparation; it separates the common life from the transcendental life; in it the student learns the work that he must undertake, and prepares himself for it.\n\nLet us see in what way.\n\nThe human head of the Sphinx, the centre of the intelligence, says to the Neophyte: \"First acquire the Knowledge which shows the goal, and lights the way to it.\" This is the theoretic instruction mentioned above.\n\nIts bull's thighs, the image of the rough, persevering labour of the agriculturist, say to him: \"Be strong and patient in thy work.\" Its lion's paws say to him: \"Thou must brave all, and defend thyself against every inferior force.\" Its eagle's wings say to him: \"Thou must will to raise thyself towards the transcendent regions, which thy soul already approaches.\" The riddle attributed to the Greek Sphinx, and the answer required for it, are an equally expressive image of man , and his aim."


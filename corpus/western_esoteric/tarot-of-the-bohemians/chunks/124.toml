[content]
body = "We will rather pass on to complete this study of fortune-telling by the Tarot.\n\nSECOND DEAL: Reshuffle all your cards (78) and let them be cut for you.\n\nTake the 17 first cards and arrange them thus-- 17.........................1 Look quickly at the 18th card (it will be under your hand when you have placed the 17 first) and the 78th, which will be found beneath the pack.\n\nThe meaning of these two cards will tell you whether any fluidic sympathetic communication is established between the Inquirer and yourself.\n\nYou can then read the oracles spoken by the line of cards, commencing as usual on the right.\n\nWhen your line is read, you pass the 17th card to your right and the 1st to your left, then move the 16th and the 2nd, etc., and so on until the cards have all changed places except the one in the centre.\n\nThis card falls on one side.\n\nTHIRD DEAL: Take up all your cards, let them be shuffled and cut for you, then arrange them as shown in the following figure, according to the order of the numbers.\n\nYou thus obtain Etteila's great figure, which gives the key to the Past, Present, and Future of the person about whose fate you are inquiring.\n\nTo use this method successfully you must follow this figure very carefully.\n\nThe best plan is to draw it with all its numbers upon a table or a large sheet of cardboard, and then to arrange the cards according to the order of the numbers.\n\nFor reading the results of this figure you must take up the cards two by two, the 1st with the 34th, the 2nd with the 35th, etc., for the Past.\n\nThe 23rd with the 45th, the 24th with the 46th .\n\n.\n\n.\n\n.\n\n.\n\nthe 33rd with the 55th, for the Present.\n\nThe 12th with the 66th, the 13th with the 65th .\n\n.\n\n.\n\n.\n\n.\n\nthe 22nd with the 56th, for the Future.\n\nOne careful survey of the tableau will render it easily understood.\n\nFOURTH DEAL: The fourth deal is only subsidiary.\n\nBy it answers can be obtained to any questions asked.\n\nShuffle all the cards, let them be cut, and then deal out the first seven of the pack thus-- 7.........................1 then read the answer.\n\nThe above system of fortune-telling is based upon Etteila's original method.\n\nWe have summed up in these few pages, an--on some points--obscure pamphlet by this author-- The Book of Thoth .\n\nIt contains a portrait of Etteila and is very rare, like the other works of this author.\n\nWe must add that his method has never been seriously elucidated by any of his numerous disciples; and we believe ourselves to be one of the first to explain it upon simple principles."


body = "CHAPTER IX.\n\nHISTORY OF THE SYMBOLISM OF THE TAROT.\n\nINQUIRY INTO ITS ORIGIN.\n\nThe Tarot is an Egyptian Book--Its Transformations--Mantegna's Pack--Venetian Tarot--Florentine Tarot--Bolognese--Hindu Tarot--Chinese Tarot--Modern Tarots--Etteila--Marseilles--Besançon--Watillaux--Oswald Wirth--Italian and German Tarots--Constitution of the Symbolism of the Tarot--The 16 primitive Hieroglyphic Signs--The 22 Hebrew Letters.\n\nORIGIN OF THE SYMBOLISM OF THE TAROT.\n\nAs we have already stated, each card of the Tarot represents a symbol, a number, and an idea.\n\nWe have endeavoured to avoid empiricism as far as possible in the course of these explanations; and therefore we first studied the numbers, for they are the most settled element, and give the most unvarying results in their combinations.\n\nRelying firmly upon the basis which we have thus constructed, we can now study the symbols with absolute assurance.\n\nWe hope that for this purpose you have procured the Tarot of Marseilles, the most correct in its symbolism, or else the twenty-two keys designed by Oswald Wirth; perhaps--and this is really almost indispensable--you have both of them.\n\nYou need, then, only deal the cards upon the table, to see at once that the personages depicted upon them all wear dresses of the Renaissance period.\n\nAnd yet, is this pack of cards of ancient origin?\n\nIt does not appear so.\n\nLook at your figures more attentively and you will soon perceive Egyptian symbols [the triple cross (No.\n\n5), ibis (No.\n\n17)] combined with these Renaissance costumes.\n\nThey at once prove that the Tarot of Marseilles is really the exact representation of the primitive Egyptian Tarot, slightly altered to the epoch denoted by the costumes.\n\nOnly the gypsies possess the primitive pack intact.\n\nThe studies of those learned men who have investigated the Tarot have confirmed this fact by the strongest evidence.\n\nAnd the works of Chatto, Boiteau and above all of Merlin, show us that history corroborates our assertion.\n\nMerlin conducted his researches very scientifically, and succeeded in discovering the original of our Tarot of Marseilles in an Italian Tarot at Venice, the father of all the later packs.\n\nHe believes also that he has discovered the origin of this Venetian Tarot in the philosophical pack of Mantegna .\n\nBut he cannot determine the origin of this pack, because the one that Merlin believed to be the source of the Tarot is on the contrary a reproduction , made by one of the Initiates.\n\nThe Ars Magna of Raymond Lulle was produced in the same way; it is drawn entirely from the Tarot.\n\nWe have given for reference the pack of Mantegna , known in the trade as the cards of Baldini , as well as the packs of the Italian Tarots, from which most of ours are derived.\n\nThe tableau which indicates the connection between the Tarot packs and that of Mantegna, ought to be reversed, and on the contrary show the cards of Mantegna derived from the Tarot, as we have stated.\n\nHere are the figures of the Tarots.\n\n(See page 84 .) MANTEGNA'S PACK.\n\n1 The beggar.\n\n11 Calliope.\n\n21 Grammar.\n\n31 Astronomy.\n\n41 Moon.\n\n2 The knave.\n\n12 Urania.\n\n22 Logic.\n\n32 Chronology.\n\n42 Mercury.\n\n3 The artisan.\n\n13 Terpsichore.\n\n23 Rhetoric.\n\n33 Cosmology.\n\n43 Venus.\n\n4 The merchant.\n\n14 Erato.\n\n24 Geometry.\n\n31 Temperance.\n\n44 Sun.\n\n5 The Nobleman.\n\n15 Polyhymnia.\n\n25 Arithmetic.\n\n35 Prudence.\n\n45 Mars."


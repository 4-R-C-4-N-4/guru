body = "THE POPE.\n\nTHE POPE.\n\n5.\n\nה 5th Hebrew letter (He).\n\nORIGIN OF THE SYMBOLISM OF THE FIFTH CARD OF THE TAROT.\n\nThe hieroglyphic meaning of He is aspiration, breath.\n\nIt is by aspiration that life is incessantly maintained and created.\n\nHence springs the idea of all that animates attributed to He.\n\nBut life specializes the being, by rendering it different from any other; hence the idea of the being itself attributed to this letter.\n\nHowever, the action of life does not stop here.\n\nIt is also the mediating principle, which attaches the material body to the divine spirit, in the same way that man unites God and Nature; life is to the man ( aleph ) what man is to the universe, pre-eminently the mediate principle.\n\n[paragraph continues] Here we find the origin of the ideas of bond , of the reunion of opposing principles, of religion, attributed to He.\n\nThis letter is simple; astronomically it corresponds with the igneous sign of the Ram, which it explains.\n\nTHE FIFTH CARD OF THE TAROT.\n\nThe Pope .\n\nThis symbol expresses the following ideas-- (1st) Idea of Life, of animation, (2nd) Idea of Being, (3rd) Idea of Reunion.\n\nThe Initiate of the mysteries of Isis is seated between the two columns of the sanctuary.\n\nHe leans upon a triple cross, and makes the sign of Esoterism with his left hand.\n\nThe triple Cross represents the triple Lingam of Indian theogony; that is to say, the penetration of the creative power throughout the Divine, the Intellectual, and the Physical Worlds, which causes all the manifestations of universal life to appear (first idea).\n\nThe two columns symbolize: on the right, the Law; on the left, the Liberty to obey and to disobey, the essence of Being, (second idea).\n\nThe Initiate wears a tiara.\n\nTwo crowned men kneel at his feet, one clothed in red, the other in black.\n\nHere we find the active form of the symbolism expressed in passive form by the second card.\n\nThe same idea of Esoterism, of secret Instruction, reappears; but the Tuition is now practical and oral , it no longer requires a book (third idea), As we see, this card is the complement of the second; the same rule applies to all the cards, when the total of their number makes 7.\n\nThus-- 3 The Empress is completed by 4+ 3 = 7 7 = 28 = 10 = 1 4 The Emperor 2 The High Priestess is completed by 2 + 5 = 7 5 The Pope 1 The Juggler is completed by 1 + 6 = 7.\n\n6 The Lovers The fifth card of the Tarot corresponds with the letter he of the sacred word.\n\nIt is the direct reflection of the 4th arcanum, and the indirect reflection of the 2nd arcanum.\n\nIt therefore signifies-- In the Divine .\n\nReflex of the Will-- INTELLIGENCE (characteristic of God the Son).\n\nIn the Human .\n\nReflex of the Power-- AUTHORITY (characteristic of the Woman).\n\nReligion.\n\nFaith.\n\nIn Nature .\n\nReflex of the Soul of the World, or of the Universal creative fluid-- THE UNIVERSAL LIFE (characteristic of Natura naturata ).\n\n5.\n\nה The Pope .\n\nAFFINITIES SIGNIFICATIONS Primitive Hieroglyphic: Breath Kabbalah: PECHAD Astronomy: The Ram Month: March Hebrew letter: He (simple) Reflex of the Will INTELLIGENCE __________ Reflex of Power AUTHORITY RELIGION--FAITH OBSERVATIONS Reflex of the soul of the world THE UNIVERSAL LIFE Universal life is the negative part of the vivifying universal fluid."


[content]
body = "The ancients used a dot in the centre of a circle as the symbol of this idea, the representation of the Unity-principle ( the dot ) in the centre of eternity ( the circle , a line without beginning or end).\n\nAccording to these demonstrations, the Unity is regarded as the whole , of which all created beings are only the constituent parts ; just as the Unity-man is formed of an agglomeration of molecules, which compose his being.\n\nThe Kabbalah, therefore, places at the origin of all things the absolute assertion of the being by itself of the Ego-Unity, which is represented by the yod symbolically, and by the number 10.\n\nThis number 10, representing the All-principle 1, with the Zero-nothing 0, well supplies the requisite conditions.\n\nTHE HE.\n\nBut the Ego cannot be realized except through its opposition to the Non-Ego.\n\nThe assertion of the Ego is scarcely established, when we must instantly realize a reaction of the Ego, Absolute, upon itself, from which the conception of its existence will be drawn, by a kind of division of the Unity.\n\nThis is the origin of duality , of opposition, of the Binary , the image of femininity, even as the Unity is the image of the masculine.\n\nTen, divided by itself, in opposition to itself, then equals 10/2 = 5, five, the exact number of the letter He , the second letter of the great sacred name.\n\nThe He therefore represents the passive in relation to the Yod, which symbolizes the active; the Non-Ego in relation to the Ego, the woman relatively to the man ; the substance relatively to the essence ; life in its relation to the soul , &c., &c.\n\nTHE VAU.\n\nBut the opposition of the Ego and the Non-Ego immediately gives rise to another factor; this is the Affinity existing between this Ego and this Non-Ego.\n\nNow the Vau , the sixth letter of the Hebrew alphabet, produced by 10 (yod) + 5 (he) = 15 = 6 (or 1 + 5), signifies link or analogy.\n\nIt is the link which, uniting antagonisms in the whole of nature, constitutes the third word of this mysterious Trinity.\n\nEgo--Non-Ego.\n\nAffinity of the Ego with the Non-Ego.\n\nTHE 2nd HE.\n\nNothing can exist beyond this Trinity, considered as a law.\n\nThe Trinity is the synthetic and absolute formula to which all the sciences converge; and this formula, forgotten with regard to its scientific value, has been transmitted to us integrally, by all the religious of the world, the unconscious depositaries of the SCIENCE WISDOM of primitive civilizations.\n\nThus the great sacred name is formed of three letters only.\n\nThe fourth term of the name is formed by the repetition of the second letter, the He .\n\nThis repetition indicates the passage of the Trinitarian law into a new application; that is, to speak correctly, a transition from the metaphysical to the physical world, or generally, of any world whatever to the world that immediately follows it.\n\nThe knowledge of the property of the second He is the key to the whole divine name, in every application of which it is susceptible.\n\nWe shall presently see the proof of this statement .\n\nSUMMARY UPON THE WORD YOD-HE-VAU-HE.\n\nNow that we have separately studied each of the letters that compose the sacred name, we will apply the law of synthesis to them, and sum up the results obtained.\n\nThe word Yod-he-vau-he is formed of four letters, signifying: The Yod The active principle pre-eminent.\n\nThe Ego = 10.\n\nThe He The passive principle pre-eminent.\n\nThe Non-Ego = 5."


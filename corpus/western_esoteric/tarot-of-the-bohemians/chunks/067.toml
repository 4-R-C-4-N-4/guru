[content]
body = "THE FOOL. THE MATE. 21. סה 21st Hebrew letter (Shin). ORIGIN OF THE SYMBOLISM OF THE UNNUMBERED CARD OF THE TAROT. The Shin expresses the same hieroglyphic meaning as the Zain (7th arcanum) and the Samech (15th): this is an arrow, an object directed to an aim. But the movement which was direct in the Zain (ז) and which became circular in the Samech (ס), here takes the form of a vibration from one pole to the other, with an unstable point of equilibrium in the centre. The Shin is therefore the sign of relative duration and of the movement relating to it, whilst the [paragraph continues] Samech expresses cyclic movement, and therefore absolute duration. Shin is one of the three mother letters. TWENTY-FIRST (UNNUMBERED) CARD OF THE TAROT. The Foolish Man . A careless-looking man, wearing a fool's cap, with torn clothes and a bundle upon his shoulder, goes quietly on his way, paying no attention to a dog which bites his leg. He does not look where he is going, so walks towards a precipice, where a crocodile is waiting to devour him. This is an image of the state to which unresisted passion will reduce a man. It is the symbol of the Flesh and of its gratification. From a moral point of view the following verses of Eliphas Levi well explain this symbol-- \"Souffrir c'est travailler, c'est accomplir sa tâche, Malheur au paresseux qui dort sur le chemin; La douleur, comme un chien, mord les talons du lâche, Qui, d'un seul jour perdu, surcharge un lendemain.\" 1. More rapid return to the Divine World. Personality asserts itself-- THE MOTION OF RELATIVE DURATION. 2. The intellect roughly appears under the influence of evolution-- INNERVATION. INSTINCT. 3. The matter of the world attains the maximum of its material progression-- THE ANIMAL KINGDOM. 21. סה The Foolish Man . AFFINITIES SIGNIFICATIONS Hieroglyphic Primitive: The Arrow Hebrew letter: The Shin (one of the 3 mothers) THE MOTION of Relative Duration __________ INNERVATION Instinct OBSERVATIONS THE ANIMAL KINGDOM"


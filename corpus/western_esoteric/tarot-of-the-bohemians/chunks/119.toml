[content]
body = "THIRD LESSON. MAJOR ARCANA. SIGNIFICATION FROM THE DIVINING POINT OF VIEW. WE now know the signification of the minor arcana, and need only study the major arcana. As we have already stated, the major arcana consist of 22 symbolical cards, which we have not yet examined as a means of predicting the future. Their meaning is very easy to remember, if any one will take the trouble to consider them carefully one by one, as their signification is described. One general rule will also aid the memory in this matter, that is, that the seven first cards chiefly refer to the intellectual side of man, the seven next to his moral side, and the seven last to the various events of his material life. We will now give the signification of these 22 cards of our Tarot-- 1. The Juggler signifies MALE INQUIRER. 2. The High Priestess --- FEMALE INQUIRER. 3. The Empress --- ACTION. INITIATIVE. 4. The Emperor --- WILL 5. T he Pope --- INSPIRATION. 6. The Lovers --- LOVE. 7. The Chariot --- TRIUMPH. PROVIDENTIAL PROTECTION. 8. Justice --- JUSTICE. 9. The Hermit --- PRUDENCE. 10. The Wheel of Fortune --- FORTUNE. DESTINY. 11. Strength --- STRENGTH. FORTITUDE. 12. The Hanged Man --- TRIALS. SACRIFICE. 13. Death --- DEATH. 14. Temperance --- TEMPERANCE. ECONOMY. 15. The Devil --- IMMENSE FORCE. ILLNESS. 16. The Lightning-struck Tower --- RUIN. DECEPTION. 17. The Stars --- HOPE. 18. The Moon --- HIDDEN ENEMIES. DANGER. 19. The Sun --- MATERIAL HAPPINESS. LUCKY MARRIAGE. 20. The Judgment --- CHANGE OF POSITION. 21. The Foolish Man --- INCONSIDERATE ACTIONS. MADNESS. 22. The Universe --- ASSURED SUCCESS."


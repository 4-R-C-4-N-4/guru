body = "GENERAL KEY TO MINOR ARCANA CHAPTER VI.\n\nTHE KEY TO THE MAJOR ARCANA.\n\nThe Major Arcana--1st Ternary--2nd Ternary--1st Septenary--2nd Septenary--The Three Septenaries and the Ternary of Transition.\n\nTHE MAJOR ARCANA.\n\nTHE fundamental difference which exists between the minor and major arcana, is that in the latter the figures and numbers are united, whilst in the former they are distinct.\n\nThere are 22 major arcana, but one of them bears a 0, so that, in reality, there are only 21 great or major arcana.\n\nMost of the authors who have studied the Tarot have devoted all their attention to these 22 cards, without noticing the others, which, however, contain the real key to the system.\n\nBut we will leave these digressions and commence the application of the law Yod-he-vau-he to this portion of the Tarot.\n\nA little reflection will suggest to us that there should be some sequences in the major arcana as well as in the minor arcana.\n\nBut how are we to define the limits of these series?\n\nEach card of the minor arcana bears a symbol which easily connects it with the whole scheme (Sceptre, Cup, Sword, or Pentacles); it is different in this case.\n\nEach card bears a different symbol .\n\nTherefore it is not symbolism that can guide us here, at all events for the moment.\n\nBesides the symbol, each card expresses an idea.\n\nThis idea is already a better guide, for it is easier to classify than the symbol; but this guide does not yet offer all the security that we could desire, for it may be read differently by various persons.\n\nAgain, the idea proceeds from the action of the symbol upon the other term expressed by the card, the number .\n\nThe number is certainly the most reliable element, the easiest to follow in its evolutions; it is, therefore, the number that will guide us; and through it we shall discover the two other terms.\n\nLet us now recall our explanation of the numbers, and we shall easily define the series of the major arcana.\n\nHowever, from the commencement we must make one great reservation.\n\nThe series which we are about to enumerate are the most usual , but they are not the only ones .\n\nThis said, we will now study the four first major arcana.\n\nThe numbers 1, 2, 3, 4 at once indicate the classification to be adopted and the nature of the terms.\n\n1 corresponds to Yod , and is active.\n\n2 ---- to He ---- passive.\n\n3 ---- to Vau ---- neuter.\n\n4 ---- to the 2nd He , and indicates transition.\n\nThis 4th arcanum corresponds to the Knave and to the 10 of the minor arcana, and becomes Yod in the next or following series.\n\nIf we wish to make a figure of the first ternary 1, 2, 3, we should do it in this way-- The active term 1 is at the head of the triangle, the two other terms are at the other angles.\n\nThis ternary can also be represented in its affinities with Yod-he-vau-he -- 1 yod 2 he 2nd he 4 vau 3 SECOND TERNARY.--We have stated that the 4 becomes the Yod or active term in the following sequence.\n\nThis is realized in the figure below-- 4 yod 5 he 2nd he 7 vau 6 The 4 representing the Yod, therefore, acts with regard to 5 and 6, as the 1 acted with regard to 2 and 3, and we obtain another ternary.\n\nThe 7 acts here as the 4 acted previously, and the same rule applies to all the series in the arcana."


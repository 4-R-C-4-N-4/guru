body = "CHAPTER XX.\n\nTHE DIVINING TAROT IN SEVEN LESSONS.\n\nIntroduction : To our Lady Readers--Astronomy--and Astrology--Intuition--Fortune-telling by the Tarot in Seven Lessons.\n\n1 st Lesson : Simplification of the Rules of Fortune-telling by the Tarot.\n\n2 nd Lesson : Minor Arcana-Significations--A good Memory unnecessary for their retention--Key to the Divining Tarot--Sceptres--Cups--Swords--Pentacles.\n\n3 rd Lesson : Major Arcana--Significations from a Divining Point of View.\n\n4 th Lesson : Basis of the Application of this Knowledge--Arrangement of the Cards.\n\n5 th Lesson : Reading the Tarot--Rapid Process--Elaborate Process.\n\n6 th Lesson : Etteila's original and unpublished Method of reading the Tarot (from one of his rarest works): 1st deal--2nd deal--3rd deal--4th deal.\n\n7 th Lesson .\n\nConclusion--Bibliography.\n\nTHE DIVINING TAROT.\n\nINTRODUCTION.\n\nTo our Lady Readers--Astronomy and Astrology-Intuition--Fortune-telling by the Tarot in Seven Lessons .\n\nTHE first part of our study of the Tarot, full of numbers, of Hebrew letters, and abstract deductions, is not calculated to attract the attention of ladies.\n\nBut if women enjoy mystery and idealism, prefer and excuse the flights of a vivid imagination, men exact precision and method in studies of this kind, and I have therefore built this arsenal of technical arguments for them, confining imagination in the narrow limits of deduction; so that, if she has sometimes escaped and scattered the brilliant gems of illusion over the course of my work, the escape was only made with great trouble, and in spite of my efforts to retain her.\n\nIt is, however, traditional that the future can be read through the Tarot, and our feminine readers will never forgive me if I ignore their natural curiosity on this point.\n\nI have therefore decided to approach this delicate question, and I hope that the pleasure gained by the fair inquirers will balance the scepticism of sterner intellects.\n\nIt is true that I can quote the opinion of all the writers of antiquity, who assert that the Egyptians used the Tarot as a means of predicting the future, and that the Jews also employed it to confirm their prophecies.\n\nBut in my opinion an important distinction should be made on this subject.\n\nUnquestionably the Egyptians predicted the future through the Tarot; but they used its astronomical applications only.\n\nNothing was left to chance.\n\nThus, knowing that most of the important events which take place upon the earth are determined by the magnetic currents produced by the position of the earth at the moment that the event takes place, these learned men first defined the relations existing between the position of the stars in the heavens, and the circumstances they created upon the earth.\n\nSince the stars accomplish fixed revolutions, that is to say, that they return to the same position at the end of a certain number of years, which are mathematically determinable, the Egyptians thought that the same events would be also reproduced at fixed intervals.\n\nIt would therefore suffice to know the movements of the stars, to predict the coming events.\n\nThis is why astronomy was only the commencement of astrology .\n\nAs the Tarot reproduced the movements of the stars upon a table, we can easily guess bow the ancients proceeded when they read prophecy by its aid.\n\nThey drew up the Horoscope of the coming year, according to the position which the stars would occupy during its course, and could then at once predict two-thirds of the events likely to occur.\n\nFabre d'Olivet in his works shows that one-third of the events are Determined , another third depend upon the Human Will , and the last third is subject to Providence ."


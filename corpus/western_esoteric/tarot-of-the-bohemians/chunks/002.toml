body = "ANDROGONY: Key to the 2nd Septenary 133 7th Card--The Chariot (Zain) 135 8th Card--Justice (Cheth) 138 9th Card--The Hermit (Teth) 142 10th Card--The Wheel of Fortune (Yod) 145 11th Card--Strength (Kaph) 148 12th Card--The Hanged Man (Lamed) 151 Summary--Constitution of Man 155 XII.--3RD SEPTENARY.\n\nCOSMOGONY: Key to the 3rd Septenary 156 13th Card--Death (Mem) 158 14th Card--Temperance (Nun) 161 15th Card--The Devil (Samech) 164 16th Card--The Lightning-struck Tower (Zain) 168 17th Card--The Star (Phe) 171 18th Card--The Moon (Tzaddi) 174 Summary--Constitution of the Universe 177 XIII.--GENERAL TRANSITION 178 19th Card--The Sun (Qoph) 179 20th Card--The Judgment (Resh) 182 21st Card--The Foolish Man (Shin) 185 22nd Card--The Universe (Tau) 188 Summary 192 XIV.--GENERAL SUMMARY OF THE SYMBOLICAL TAROT: Involution and Evolution 193 Theogony .--The Absolute according to Wronski, Lacuria, and the Tarot--Theogony of Divers Religions identical with that of the Tarot--Summary 194 Androgony : Figure with Summary 210 Cosmogony : Figure with Summary 214 Figure containing the Symbolism of all the Major Arcana, enabling the Signification of each Card to be easily defined 220 -221 PART III.\n\nAPPLICATIONS OF THE TAROT.\n\nXV.--GENERAL KEY TO THE APPLICATIONS OF THE TAROT: The Principle and the Forms--The 21st Card of the Tarot is a Figure--Principle--The Tarot--The Year--The Month--The Day--The Human Life 225 XVI.--THE ASTRONOMIC TAROT: Egyptian Astronomy--The Four Seasons--The Twelve Months--The Thirty-six Decans--The Planets--Absolute Analogy with the Tarot--Figure containing the Application of the Tarot to Astronomy--Key to the Astrological Works of Christian--Oswald Wirth's Astronomical Tarot 233 XVII.--THE INITIATIVE TAROT: Ch.\n\nBarlet's Essay on this Subject--Involution and Evolution--The Hours of Apollonius of Tyana--The Phases of Initiation represented by the Tarot 253 Barlet's Work upon the COSMOGONIC TAROT 253 XVIII.--THE KABBALISTIC TAROT: Deductions by Etteila upon the Book of Thoth --Example of the Application of the Tarot to the Kabbalah, the Hierogram of Adam by Stanislas de Gualta 291 XIX.--THE AUTHORS WHO HAVE INTERESTED THEMSELVES IN THE TAROT: Raymond Lulle--Cardan--Postel--The Rosicrucians--Court de Gébelin--Etteila--Claude de Saint-Martin--J.\n\nA.\n\nVaillaint--Christian--Eliphas Levi--St.\n\nde Guaita--Joséphin Péladan-- The Platonist --Theosophical Publications--F.\n\nCh.\n\nBarlet--O.\n\nWirth--Poirel--Ely Star--H.\n\nP.\n\nBlavatsky--Ch.\n\nde Sivry--Mathers 297 XX.--THE DIVINING TAROT IN SEVEN LESSONS."


body = "CHAPTER XIX.\n\nLIST OF THE AUTHORS WHO HAVE INTERESTED THEMSELVES IN THE TAROT.\n\nRaymond Lulle--Cardan--Postel--The Rosicrucians--Court de Gébelin--Etteila--Claude de Saint--Martin--J.\n\nA.--Vaillant--Christian--Eliphas Levi--Stanislas de Guaita--Joséphin Péladan--The Platonist--Theosophical Publications--F.\n\nCh.\n\nBarlet--Oswald Wirth--Poirel--Ely Star--H.\n\nP.\n\nBlavatsky--Ch.\n\nde Sivry--Mathers.\n\nSOME ACCOUNT OF THE AUTHORS WHO HAVE SPECIALLY INTERESTED THEMSELVES IN THE TAROT.\n\nRAYMOND LULLE (1235-1315), an eminently learned man, the founder of a system of philosophy, but chiefly of logic, entirely based upon the application of the Tarot; this is the Ars Magna .\n\nCARDAN (JÉRÔME).\n\nBorn in Paris in 1501, died in 1576.\n\nProfessor of Mathematics and Medicine at Milan and Boulogne.\n\nTravelled through Scotland, England, and France, working miraculous cures.\n\nHis treatise On Subtility (1550) is entirely based on the keys of the Tarot.\n\nPOSTEL (GUILLAUME).\n\nBorn at Dolerie (diocese of Avranches) in 1510.\n\nSent to the East by Francis I., he brought back some valuable manuscripts, and was appointed Professor of Mathematics and Oriental Languages in the College of France.\n\nDied in the Convent of Saint-Martin des Champs in 1581.\n\nOne of the greatest Initiates of the sixteenth century.\n\nHe discovered the key to the Tarot, but did not disclose the secret, in spite of the promise given in the title to his work, The Key to the Hidden Mysteries (1580).\n\nA list of his works will be found in the index.\n\nTHE MYSTERIOUS FRATERNITY OF THE ROSICRUCIANS (1604).\n\nLa Fama Fraternitatis Rosæ Crucis (1613) shows the Initiate that the Rosicrucians possessed the Tarot, which is described thus-- They possess a book from which they can learn everything that is in the books already written and to be written .\n\nWe must not forget that the Rosicrucians are the Initiators of Leibnitz , and the founders of actual Freemasonry through Asmhole .\n\nCOURT DE GÉBELIN.\n\nBorn at Nîmes in 1725, died at Paris in 1784.\n\nAn illustrious scholar, who discovered the Egyptian origin of the Tarot.\n\nConsult his Primitive World (1773-1783).\n\nETTEILA (1783).\n\nWe have given a summary of his work upon Fortune-telling with the Tarot, and upon the application of this work to the Kabbalah.\n\nCLAUDE DR SAINT-MARTIN.\n\nThe unknown philosopher.\n\nBorn in 1743 at Amboise, died in 1803.\n\nThe disciple of Martinez Pasqualis and Jacob Bœhm, the founder of the So-called Martinist order.\n\nHis book, the Tableau Naturel des Rapports qui existent entre Dieu, l'Homme et l'Univers , is based upon the Tarot.\n\nJ.\n\nA.\n\nVAILLANT.\n\nLived many years with the Gypsies, and received a great many of their traditions orally: these are contained in his works-- [paragraph continues] Les Rômes, Histoire vraie des vrais Bohémiens (towards 1853).\n\nLa Bible des Bohémiens (1860).\n\nClef Magique de la-Fiction et du Fait (1863).\n\nCHRISTIAN."


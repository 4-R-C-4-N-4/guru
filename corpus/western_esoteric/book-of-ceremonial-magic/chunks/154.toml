[content]
body = "But if the experience be to find the beloved person, place the image under the door which he or she must pass.\n\nIn either case a powder must be made and cast upon the person, or given them with their meat or drink.\n\nThe solemnities of the hours, matters and instruments must be faithfully observed, and the Spirits conjured by name, saying also: I conjure and constrain you, ye Devils, who have the power to disturb the hearts of men and women!\n\nBy Him Who hath created you from nothing and by this image, I conjure you this night into my presence, that I may have the power to compel whomsoever I will to love me, whether male or female .\n\nWhen the characters and images have been prepared, say over them: I conjure you, O ANAËL, DONQUEL, THELIEL , Princes of love, and all your ministers, who have power to fill with fervour the hearts of men and women, and to kindle the fire of love!\n\nI conjure.\n\nyou by Him Who is seated upon the Cherubim and guardeth the abysses, by Him Who maketh the world to tremble, Whom all creatures obey!\n\nGrant that these characters and figures may possess this virtue, that such man or woman may love.\n\nme, may desire me and thirst for my love, and that it shall be impossible for him or her to love any person save me .\n\nPlace the image in a vessel for one night, operate on the day and in the hour appropriate thereto, and you shall behold a wonder.\n\nThe compiler of the Grimorium Verum , who seems to have selected almost invariably the most bizarre processes, instructs his pupils HOW TO CAUSE THE APPEARANCE OF THREE LADIES OR THREE GENTLEMEN IN ONE'S ROOM AFTER SUPPER § 1.\n\nPreparation Abstain for three days from the hidden offices, and then shall your spirit be fortified.\n\nOn the fourth day, you shall cleanse and prepare your chamber as soon as it is morning, immediately after dressing, the whole fasting.\n\nBut see you do it in such a way that it will not be liable to disarrangement during the remainder of the day.\n\nNote that there must be no hangings, nor anything set crosswise, no tapestries, no hanging clothes, hats, bird-cages, bed curtains, &c.\n\nAbove all, let the appointments be clean in every respect.\n\n§ 2.\n\nCeremony After supper pass in secret to your chamber, made ready as above; kindle a good fire; place a white cloth on the table, round which set three chairs, and before each chair, upon the table, let there be a wheaten roll and a glass full of fresh clear water.\n\nLastly, draw up a chair and settee to the side of the bed and retire to rest, uttering the following CONJURATION Besticitum consolatio, veni ad me vertat Creon, Creon, Creon, cantor laudem omnipotentis et non commentur.\n\nStat superior carta bient laudem omviestra principiem da montem et inimicos meos ô prostantis vobis et mihi dantes que passium fieri sincisibus .\n\nThe three persons, having arrived, will rest themselves near the fire, drinking, eating and finally thanking him or her who has entertained them; for if it be a young lady who performs this ceremony, three gentlemen will come; but if it be a man, three young ladies will appear.\n\nThe said three persons will draw lots among each other to know which of them shall remain with you."


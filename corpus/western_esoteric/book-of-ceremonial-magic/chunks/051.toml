[content]
body = "§ 4.\n\nThe Almadel I shall explain in the first place that this scheme of invocation derives its title from the conventional talisman on which the process depends.\n\nIt is made of white wax, and is inscribed as hereinafter appears.\n\nClick to view This figure is used for the four chief angels whose government extends over the four altitudes of the world, namely, East, West, North and South.\n\nIt serves also for their ministers and inferiors.\n\nAs, however, a different colour is attributed to the choir of each quarter, and as this colour must dye the white wax, it follows that those who would traffic with the entire hierarchy must compose four Almadels .\n\nTheir labour, moreover, will not end here, for each talisman must have four candles made from the same wax and set apart thereto.\n\nFinally, there must be provided a seal of gold or silver, on which must be engraved the names HELION, HELLUJON, ADONAI.\n\nIt serves for all the choirs.\n\nThe candles are provided with waxen feet, and the Almadel rests thereon, being a four-square figure measuring six inches every way.\n\nThe colour for the Eastern choir is lily white; the others are red, green, and apparently a darkling green which approaches black, but only the first choir is allocated to its distinct quarter of the heaven.\n\nThe names of the Intelligences are as follows:-- FIRST ALTITUDE: Alimiel, Gabriel, Borachiel, Lebes, Hellison .\n\nThey make all things fruitful in creation.\n\nSECOND ALTITUDE: Alphariza, Genon, Geron, Armon, Gereinon .\n\nThey have power over goods and riches, and can make any man rich or poor.\n\nThey also cause decrease and barrenness.\n\nTHIRD ALTITUDE: Eliphamasai, Gelomiros, Gedobonai, Saranana, Elomnia .\n\nTheir offices are not stated.\n\nFOURTH ALTITUDE: Barchiel, Gediel, Gebiel, Deliel, Captiel .\n\nIn this case also the offices are not stated.\n\nWhen an Angel of the First Altitude responds to invocation, he carries a banner emblazoned with a white cross, his body is clothed about with a luminous cloud, and he is crowned with roses.\n\nHe is fair of face, and at his departure leaves a sweet perfume.\n\nAn Angel of the Second Altitude has the form of a young child in rose-coloured satin, with a crown of red gillyflowers on his head.\n\nHis face looks towards heaven, and shines with the light of the sun.\n\nThe perfume which he leaves endures for a long time.\n\nAn Angel of the Third Altitude appears in the form of a child or little woman in green and silver colours, wearing a crown of bay leaves beset with white flowers.\n\nThis apparition also leaves sweet perfume.\n\nAn Angel of the Fourth Altitude appears in the form of a boy or little man, in black or olive garments, crowned with ivy berries.\n\nHis perfume differs from the rest, but is not less sweet: all the manifestations are beautiful, and, as it is said that they must not be called for anything against God and His laws, it is only the too certain company in which the Almadel appears that renders its operations doubtful--I mean, in respect of their intention.\n\nInvocation takes place on a Sunday in the day and hour of the sun.\n\nThe candles are placed in the candlesticks; the Almadel rests--as we have seen--on the projecting feet of the candles, but so that there is a clear space beneath it.\n\nThere is a hole in each corner, and when the intelligence is about to manifest, an earthen vessel is placed under the talisman containing hot ashes and three grains of mastic in powder."


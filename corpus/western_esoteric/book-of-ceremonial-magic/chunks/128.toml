[content]
body = "From the purpose for which it is intended, and from the silence of the Grimoire, it may be inferred that the preparation of the goatskin is exceedingly simple and does not involve the removal of the hair.\n\nWhen the night of action has arrived, the operator shall gather up his rod, goatskin, the stone called Ematille , and shall further provide himself with two vervain crowns, two candlesticks and two candles of virgin wax, made by a virgin girl and duly blessed.\n\nLet him take also a new steel and two new flints, with sufficient tinder to kindle a fire, likewise half a bottle of brandy, some blessed incense and camphor, and four nails from the coffin of a dead child.\n\nAll these must be carried to the place chosen for the great work, where everything hereinafter laid down must be scrupulously performed and the dread Kabalistic circle must be described in an accurate manner.\n\nLastly, it must be carefully borne in mind that there should be either one or three taking part in the ceremony, the Karcist included, who is the person appointed to address the spirit, holding the Destroying Rod in his hand.\n\nThe evoking process may be given in the actual words of the Grimoire.\n\nCONCERNING A TRUE REPRESENTATION OF THE GRAND KABALISTIC CIRCLE You must begin by forming a circle with strips of kid's skin, fastened to the ground by means of your four nails.\n\nThen with the stone called Ematille you must trace the triangle within the circle, beginning at the eastern point.\n\nA large A, a small E , a small A , and a small J , must be drawn in like manner, as also the sacred name of Jesus between two crosses.\n\nBy this means the spirits will have no power to harm you from behind The Karcist and his assistants may then fearlessly proceed to Click to view THE GRAND KABALISTIC CIRCLE their places within the triangle, and, regardless of any noises, may set the two candlesticks and the two vervain crowns on the right and left sides of the triangle within the circle.\n\nThis being done, the two candles may be lighted, taking care that there is a new brazier in front of the Karcist, piled with newly consecrated charcoal.\n\nThis must be kindled by the Karcist casting a small quantity of the brandy therein and a part of the camphor, the rest being reserved to feed the fire periodically, in proportion to the length of the business.\n\nHaving punctually performed all that is mentioned above, the chief operator may repeat the following prayer:-- I Present Thee, O great ADONAY , this incense as the purest I can obtain; in like manner, I present Thee this charcoal prepared from the most ethereal of woods.\n\nI offer them, O grand and omnipotent ADONAY, ELOIM, ARIEL and JEHOVAM , With my whole soul and my whole heart.\n\nVouchsafe, O great ADONAY , to receive them as an acceptable holocaust.\n\nAmen .\n\nClick to view THE GREAT CIRCLE OF WHITE MAGIC You should also be careful, says the Grimoire, to have no alloyed metal about your person, except a gold or silver coin wrapped in paper, which you must fling to the spirit when he appears outside the circle, so as to prevent him from harming you.\n\nWhile he is picking up the coin, begin promptly the following prayer, fortifying yourself with courage, energy and prudence.\n\nBe, also, especially careful that the Karcist is the sole speaker; the assistants must preserve a determined silence, even if they are questioned or menaced by the spirit."


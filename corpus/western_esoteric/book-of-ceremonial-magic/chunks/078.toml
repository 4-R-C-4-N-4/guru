[content]
body = "Despite the threatened vengeance of the heir of Oromasis, the mystery was adapted by the later editors of the Red Dragon and reappears as the Grand Cabala , without which no other can succeed.\n\nIn this, its last transformation, it becomes a recipe for evoking the devil which seems to breathe the true spirit of Goëtic genius.\n\nIts success, as I must premise, will depend upon a recollected and devotional spirit in the operator, together with a clean conscience; otherwise, in place of commanding the evil spirit, the latter will command him.\n\nThis understood, the process itself is simple.\n\nYou have merely to secure a black hen which has never been crossed by the male bird and to do this in such a manner that it shall not cackle; it is best therefore to seize it in its sleep, clutching it by the neck, but not more than is necessary to prevent it from crying.\n\nYou must repair to the highroad, walk till you come to a cross-way and there, on the stroke of midnight, describe a circle with a cypress rod, place yourself in the midst thereof and tear the bird in twain, pronouncing three times the words, Euphas, Metahîm, frugativi et appellavi .\n\nNext turn to the East, kneel down, recite a prayer and conclude it with the Grand Appellation, when the Unclean Spirit will appear to you in a scarlet surcoat, a yellow vest and breeches of pale green.\n\nHis head will resemble that of a dog, but his ears will be those of an ass, with two horns above them; he will have the legs and hoofs of a calf.\n\nHe will ask for your orders, which you will give as you please, and as he cannot do otherwise than obey, you may become rich on the spot and thus the happiest of men.\n\nSuch at least is the judgment of the Grimoire.\n\nWhether the victim of the process is to be torn in pieces alive does not explicitly Click to view THE APPARITION OF THE GRAND CABALA appear, but may be inferred from the initial precaution.\n\nThis being the case, I have so modified the procedure that, in case it should be tried by a fool in these more civilised days, he will have only his pains for the trouble--by the hypothesis of the ceremonial art.\n\nThis is therefore a word to the fool.\n\nClick to view DEVIL STRUGGLING WITH ST.\n\nPETER.\n\nHyde Register, British Museum, Eleventh Century .\n\nClick to view PLATE VI: THE SABBATIC GOAT"


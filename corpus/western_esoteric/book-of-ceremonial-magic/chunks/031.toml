[content]
body = "Click to view THE CHARACTER OF HAGITH The government of Venereal concerns is entrusted to HAGITH, and the person possessing his character is adorned with all beauty.\n\nHe converts copper into gold in a moment and gold instantaneously into copper; he also gives faithful serving spirits.\n\nClick to view THE CHARACTER OF OPHIEL OPHIEL is the ruler of those things which are attributed to Mercury; he gives familiar spirits, teaches all arts, and enables the possessor of his character to change quicksilver immediately into the Philosopher's Stone.\n\nClick to view THE CHARACTER OF PHUL Lunary concerns are under the government of PHUL, who truly transmutes all metals into silver, heals dropsy and provides Spirits of the Water, who serve men in a corporal and visible form; he also prolongs life to three hundred years.\n\nLegions of inferior spirits are commanded by each of the Governors, who also have Kings, Princes, Presidents, Dukes and Ministers ruling under them.\n\nCeremonial Magic usually administers the hierarchies upon a colossal scale.\n\nThe invocation of the Governors is simple.\n\nIt is performed in the day and hour of the planet which is in correspondence with the Olympic Intelligence by means of the following:-- PRAYER O Eternal and Omnipotent God, Who hast ordained the whole creation for Thy praise and Thy glory, as also for the salvation of man, I beseech Thee to send Thy Spirit N., of the Solar Race, that he may instruct me concerning those things about which I design to ask him [or--that he may bring me medicine against the dropsy, &c.].\n\nNevertheless, not my will, but Thine be dome, through Jesus Christ, Thine only begotten Son, Who is our Lord.\n\nAmen.\n\nUnless the Spirit, in the words of Robert Turner, be \"familiarly addicted\" to the operator, he should not be detained above one hour, and should in either case be \"licensed to depart\" as follows:-- THE DISCHARGE Forasmuch as thou camest in peace and quietness, having also answered unto my Petitions, I give thanks unto God, in Whose Name thou camest.\n\nNow mayst thou depart in peace unto thine own order; but return unto me again, when I shall call thee by thy -name, or by thine order, or by thine office, which is granted from the Creator.\n\nAmen.\n\n[Then add:] Be not rash with thy mouth, and let not thine heart be hasty to utter anything before God: for God is in heaven, and thou art upon earth; therefore let thy words be few.\n\nFor a dream cometh through the multitude of business, and a fool's voice is known by multitude of words.\n\n--Eccles.\n\nv.\n\n3, 4."


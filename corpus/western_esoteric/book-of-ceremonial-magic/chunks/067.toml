[content]
body = "Éliphas Lévi says that it pretends to confer the Powder of Projection, the great Mystery of the Sages, but it gives really the Powder of Consecution--as to the significance of which a vague image can alone be invoked.\n\nIt may, in any case, be added that it cannot well be either, seeing that the composition is a liquid.\n\nFor the rest, it is simply a stupid recipe, and as no unlawful application is suggested, it is not diabolical at all, unless toxicology, as such, is Satanic, simply because it does not deal in anodynes.\n\nThere is, of course, no question that the Grand Grimoire is a book of Black Magic, and it is contrary to the nature of things that a book of Black Magic should be otherwise than diabolical.\n\nThe most objectionable works are not those which openly announce that they are evil, but those which teach evil under the pretence of excellence.\n\nThe noticeable point, as regards the Grand Grimoire , the other works of its class and the White Rituals, is that the diabolism of the confessedly diabolical is often so exceedingly thin, while the angelical element in processes assumed to be angelical borders so often and so perilously on the Satanic side.\n\nThe first part of the Grand Grimoire , like the Grimorium Verum , is simply a process for the evocation of evil spirits to obtain the enforced surrender of hidden treasure.\n\nIn the second part the magician is certainly expected to give himself, body and soul, to the demon who serves him meanwhile, and there can be no hesitation in admitting that this creates a sharp distinction, not only between the Grand Grimoire and all the Composite Rituals, but also between the Grand Grimoire and the other Liturgies of Black Magic.\n\nIt is only a palliation to say that the compact is worded as a subterfuge, and in reality gives nothing to the demon, who here, as so frequently in folklore, is bamboozled, receiving the shadow in place of the substance."


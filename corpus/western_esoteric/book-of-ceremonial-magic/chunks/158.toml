[content]
body = "You shall reply: I am watering my plant .\n\nHe will then say: Give me that bottle; I will water it myself .\n\nYou will answer by refusing, and he will again ask you, but you will persist in declining, until he shall stretch forth his hand and shew you the same figure which you have traced upon the head suspended from the tips of his fingers.\n\nIn this case you may be assured that it is really the spirit of the head, because another might take you unawares, which would bring you evil, and further, your operation would be unfruitful.\n\nWhen you have given him your phial, he will water the head and depart.\n\nOn the morrow, which is the ninth day, you shall return and will find your beans ripe.\n\nTake them, place one in your mouth, and then look at yourself in a glass.\n\nIf you cannot see yourself, it is good.\n\nDo the same with the rest, or they may be tested in the mouth of a child.\n\nAll those which do not answer must be interred with the head.\n\nThe advantage of occasional invisibility in the pursuits of illicit affection seems to have fascinated the compiler of the Little Albert, and he refers to the adultery of Gyges with evident relish in prefacing his process for Invisibility by means of a Ring This important operation must be performed on a Wednesday in spring-time, under the auspices of Mercury, when it is known to be conjoined with other favourable planets, such as the Moon, Jupiter, Venus or the Sun.\n\nTaking good mercury, fixed and well purified, compose a large ring thereof, so that the same will pass easily over the middle finger of the hand.\n\nLet the collet be enriched by a small stone which is found in the pewit's nest, and about the ring let the following words be enchased: Jesus passing ✠ through the midst of them ✠ disappeared .\n\n✠ Next, having placed the ring on a palette-shaped plate of fixed mercury, compose the perfume of mercury, and thrice expose the ring to the odour thereof; wrap it in a small piece of taffeta corresponding to the colour of the planet, carry it to the pewit's nest from which the stone was obtained, let it remain there for nine days, and when removed, fumigate it precisely as before.\n\nThen preserve it most carefully in a small box, made also of fixed mercury, and use it when required.\n\nThe method of use is to place the ring upon the finger with the stone outwards; it will so fascinate the spectators by its virtue.\n\nthat one may be present without being beheld.\n\nWhen the wearer no longer desires to be invisible, he has merely to turn the ring, so that the stone shall be inward, and close the hand over it.\n\nBut Éliphas Lévi affirms that the only authors who have written seriously concerning the ring of Gyges or its equivalents are Porphyry, Iamblichus and Peter of Apono; that their discourse is allegorical and that they are referring to the Great Magical Arcanum.\n\nHowever this may be, the Little Albert supplies an alternative process which it pretends to derive from these authorities and also from Cornelius Agrippa, sometimes termed the master of Peter of Apono in defiance of chronology and the centuries.\n\nThe first requisite is a tuft of hair taken from the head of a hyena, and from the upper part thereof.\n\nThese hairs must be plaited into a ring, which must be carried, like the other, to a pewit's nest and deposited therein, also for the space of nine days.\n\nThe perfumes of mercury must be used in like manner.\n\nThe person who wears this ring will be invisible and he will reappear by removing it from his finger."


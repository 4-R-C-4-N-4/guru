[content]
body = "CHAPTER VIII Miscellaneous and Minor Processes § 1.\n\nConcerning Works of Hatred and Destruction THE following process appears in several manuscript copies of the Key of Solomon , but has been omitted by the English editor of that work, as others are also omitted, presumably as a Goëtic interpolation.\n\nBut we have seen that a Goëtic process in a book like the Key of Solomon is not necessarily an interpolation, while as regards this particular instance it is very nearly evident that it is an integral portion of that dubious collection.\n\nIn the second chapter of the first book we are told that the days and hours of Mars are suitable for overthrowing enemies, while the hours of Saturn and Mars, and also the days on which the Moon is in conjunction with those planets, are excellent for experiments of hatred, enmity, quarrel and discord.\n\nIn the first chapter of the second book it is said:--As for operations of destruction and desolation, we should put them into execution on the day of Saturn at the first hour, or rather at the eighth or fifteenth of the day, and from the first until the eighth hour of the night.\n\n.\n\n.\n\n.\n\nFrom these statements it seems fair to infer that there must have been a section containing directions as to the performance of such works.\n\nIn this case, the Key of Solomon is neither better nor worse than any other Grimoire of Black Magic--as indeed we have reason to know by its admitted sections.\n\nThe apologists of the Clavicle--if there are any apart from its English editor--will probably cite in defence of it a passage which occurs in Book i.\n\nc.\n\n8, in which the author proffers his secrets on the express condition that they shall not be used to ruin and destroy one's neighbour.\n\nBut when every allowance has been made for this stipulation, we shall do well to remember that similar warnings are not wanting in purely Goëtic rituals.\n\nThere is further another test by which the authenticity of the following process may be largely determined, and that is the manner of its wording, which corresponds closely with the prevailing manner of the Clavicle.\n\nIt is a loose and general wording, covering several classes of experiment, and-if any one is sufficiently ridiculous or sufficiently ultra-serious to desire that the question be tested-it may be compared with Book I.\n\nc.\n\nxv., xvi., xvii., in which the same characteristics will be found.\n\nThe process itself is as follows:--Experiments upon enemies may be performed in several ways, but, whether with waxen images or some other instrument, the particulars of each must be diligently and faithfully observed.\n\nShould the day and hour fail thee, proceed as already laid down, and prepare the image or instrument proper to this effect in the order and manner thereof.\n\nFumigate with the Proper perfumes, and if writing be required on the image, let it be done with the needle or stylet of the art, as aforesaid.\n\nNext recite the following words once over the said image:--VSOR, DILAPIDATORE, TENTATORE, SOIGNATORE, DEVORATORE, CONCITORE, ET SEDUCTORE.\n\nO all ye ministers and companions, I direct, conjure, constrain and command you to fulfil this behest willingly, namely, straightway to consecrate this image, which is to be done in the name of .\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\n.\n\nthat as the face of the one is contrary to the other, so the same may never more look one upon another .\n\nDeposit the image in some place perfumed with evil odours, especially those of Mars, such as sulphur and assafoetida .\n\nLet it remain there for one night, having duly asperged it, observing the proper hour and time."


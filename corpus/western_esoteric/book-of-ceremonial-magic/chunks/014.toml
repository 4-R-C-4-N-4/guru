[content]
body = "I should imagine that the Lords of its Convention are to be feared in a certain manner, like the Red and the Black Death.\n\nBut the versicles and aspirations and formulæ which must be strong enough at any moment to undo all the gates of hell and to cast down all its citadels have been taught us almost at our mothers' knees.\n\nI should think that the Noctem quietam et finem perfectum concedat nobis Dominus omnipotens would be sufficient to disperse cohorts and not only the isolated negotium perambulans in tenebris .\n\nThe Pater noster , moreover, is worth all the Golden Verses of Pythagoras, all the Commentary of Hierocles, and every oracle of Zoroaster, including the forged citations.\n\nAnd, in fine, I do not think that there is any power of the abyss, or any thrice-great Magus, or any sorcerer in final Impenitence who has charm, talisman, or conjuration which could look in the face without perishing that one loving supplication: [paragraph continues] Custodi nos, Domine, ut pupillam oculi; sub umbra alarum tuarum, protege nos .\n\nIt is improbable that there is any hidden science in respect of Magic, whether Black or White, but it should be noticed that the occult sciences with which I am concerned here are reducible under this especial head, as it is the greater which includes the lesser.\n\nIts processes lie on the surface, and the so-called sanctuaries of occultism may extend the codices but are unlikely to increase the efficacy.\n\nIn respect of Black Magic, so far as there is a textual excuse for separating it from that uterine sister which was reared on the same milk, I have indicated that there is nothing to suggest one touch of sublimity in diabolism.\n\nIn its, so to speak, pure state, but absit verbum --I should rather have said undiluted--it is the simple ambition and attempt to compel demons, and observe here that it is Satanism to deal, ex hypothesi , with the abyss, for whatever purpose.\n\nIn its worst state it is the Grimoires and the little books of wicked and ultra-foolish secrets.\n\nThe difference between the Grimorium Verum and the Key of Solomon is that the one deals openly with the devil and his emissaries, and the other with spirits that are obviously of the same category but are saluted by more kindly names.\n\nIf it were possible to formulate the motive of Black Magic in the terms of an imputed transcendence, it is the hunger and thirst of the soul seeking to satisfy its craving in the ashpits of uncleanness, greed, hatred and malice.\n\nIt is exactly comparable to the life of that Chourineur in The Mysteries of Paris who lived upon diseased offal and grew to be satisfied therewith.\n\nBut this unfortunate could not help himself exactly, while the soul of the black magician has usually sought evil for its own sake.\n\nI recur therefore for a moment to that door of the soul which, as I have said, opens on God, and it is that which by a necessary but somewhat arbitrary distinction must be called the door to the heights.\n\nIn their proper understanding, the deeps are holy as the heights, and of course in any true philosophical sense there is neither height nor deep, for these are not journeys made in space and time.\n\nHowever, that symbolic door is the golden way of satisfaction; but it is not of magic, of divination, of clairvoyance, of the communication with spirits, of what order soever; it does not offer the fabled power over Nature of which the Magus is said to be in search and to which lying rituals have from all time pretended that he can attain."


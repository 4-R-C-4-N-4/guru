[content]
body = "Fit the knife with a handle of white wood cut at a single stroke with a new sword or knife, and on this handle engrave the following characters:-- Click to view Fumigate as before, and with this knife do all things needful to the Art, the circle excepted.\n\nBut if such a knife be too difficult to manufacture, procure one of the same form ready made; steep it in the blood and juice as above; fit thereto the same handle bearing the same characters, and upon the blade, proceeding from point to handle, write with a male goose-quill the words: AHARARAT, TÔ.\n\nPerfume as before, sprinkle with exorcised water, and place in the silken wrapper already mentioned.\n\nThat with the black handle, destined to describe the circle and intimidate the spirits, and for performing other similar things, must be made in every respect like the first, except as regards the day and hour, which should be those of Saturn.\n\nThe steel should be extinguished in the blood of a cat and the juice of hemlock, while the handle should be of sheep's horn.\n\nThe Click to view PLATE VII: INSTRUMENTS OF BLACK MAGIC poniard or stiletto and the lancet should be made after the same manner on the day and in the hour of Mercury, and the steel extinguished in the blood of a mole and the juice of the herb Mercury.\n\nThey should be fitted with horn handles, shaped with a new sword in the day and hour of Mercury, and should bear these characters upon the said handles.-- Click to view Fumigate as before, and use in their proper place as required.\n\nThe Grimorium Verum , which makes for simplicity, reduces the steel instruments to three--namely, knife, graver and lancet.\n\nThe two first should be made on the day and in the hour of Jupiter, with the waxing Moon in the ascendant, which is at issue with the previous authority.\n\nWhen finished, the following Prayer or Conjuration must, in each case, be recited over them.\n\nThe knife should be large enough to sever the neck of a kid at one blow; it should be fitted with a haft of wood, made on the same day and in the same hour, and graven with magical characters.\n\nThe instrument should then be sprinkled, fumigated and preserved for use as required.\n\nCONJURATION I conjure thee, form of the instrument, N., by God the Father Almighty; by the virtue of Heaven and by all the stars Which rule; by the virtue of the four elements; by that of all stones, all plants and all animals whatsoever; by the virtue of hailstorms and winds; to receive such virtue herein that we may obtain by thee the perfect issue of all our desires, which also we seek to perform without evil, without deception, by God, the Creator of the Sun and the Angels.\n\nAmen .\n\nRecite the Seven [Penitential] Psalms, and add these words: DALMALEY, LAMECK, CADAT, PANCIA, VELOUS, MERROE, LAMIDECK, CALDULECH, ANERETON, MITRATON, most pure Angels, be ye guardians of these instruments, which are needful for many things .\n\nThe lancet, which is mentioned but not described in the Book of True Black Magic , should, according to the Grimorium Verum , be made in the day and hour of Mercury, the Moon waxing, and should be conjured after the same manner as the knife and graver.\n\nIf assistants accompany the operator, each must be provided with his knife, and the like rule obtains concerning the Sword of the Art, which should be polished on the day of Mercury, from the first to the third hour of the night."


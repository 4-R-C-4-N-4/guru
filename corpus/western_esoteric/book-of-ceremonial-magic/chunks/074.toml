[content]
body = "§ 6.\n\nThe Black Pullet The Black Pullet , the Druid of Menapienne, Red Magic, or the Cream of the Occult Sciences , with derivatives from the first of these works, such as the Queen of the Hairy Flies , the Green Butterfly , &c., form a class by themselves, and, with one exception, they are quite unserious publications, which can scarcely be called spurious, as they are almost without pretence.\n\nThey belong to the late end of the eighteenth century.\n\nDr.\n\nEncausse, the head of the French Martinists, suggests that they were all fabricated at Rome and infers--as seen previously--that we owe them to the industry of priests, which seems to follow somewhat loosely from the evidence, is characteristic of himself and his school, and is indeed of much the same value as the statement in Isis Unveiled , that the habitual practice of Black Magic at the Vatican could be \"easily proved.\" The Black Pullet is far the most curious of its class and there is indeed sufficient individuality in its narrative to lift it much above the paltry impostures with which it connects.\n\nIts chief occult interest centres in the series of talismanic rings which it incorporates with the text, itself a species of magical romance.\n\nIt makes no claim to antiquity, except that it embodies its wisdom, and it does not appeal to Solomon.\n\nIn a book of Black Magic, as it certainly is, though the Goëtic intention is disguised, such modesty makes for virtue.\n\nMany of the Talismans seem to be original devices; at least they connect with nothing in occult symbolism known to the present writer.\n\nAt the same time they are constructed in accordance with the rules laid down by the Fourth Book attributed to Cornelius Agrippa as regards infernal signatures.\n\nThe Black Pullet reappeared during its own period at various dates, with slight alterations--once as the Treasure of the Old Man of the Pyramids , when it was followed by a sequel or companion under the title of the Black Screech Owl .\n\nIt has been reprinted within recent years at Paris in an edition intended for bibliophiles but bearing no indications of bibliographical research.\n\nThough modest in the claims which have been specified, the title of the original edition is portentous enough, namely, \"The Black Pullet, or the Hen with the Golden Eggs, comprising the Science of Magical Talismans and Rings, the Art of Necromancy and of the Kabalah, for the Conjuration of Ærial and Infernal Spirits, of Sylphs, Undines and Gnomes, serviceable for the acquisition of the Secret Sciences, for the Discovery of Treasures, for obtaining power to command all beings and to unmask all Sciences and Bewitchments.\n\nThe whole following the Doctrines of Socrates, Pythagoras, Zoroaster, Son of the Grand Aromasis, and other philosophers whose works in MS.\n\nescaped the conflagration of the Library of Ptolemy.\n\nTranslated from the Language of the Magi and that of the Hieroglyphs by the Doctors Mizzaboula-Jabamîa, Danhuzerus, Nehmahmiah, Judahim, and Eliaeb.\n\nRendered into French by A.\n\nJ.\n\nS.\n\nD.\n\nR.\n\nL.\n\nG.\n\nF.\" The place of publication is Egypt, which probably stands for Rome, and the date is 740, meaning 1740, which, however, is untrue, as we shall see.\n\nIt may be said at once that there is no pretence in the text to fulfil the magnificent assurances of the title.\n\nThe preface entreats that the Black Pullet may not be confounded with the collections of reveries and errors which so many have sought to accredit by announcing supernatural effects."


[content]
body = "§ 6.\n\nConcerning Divination by the Word of Uriel As there are many practices passing under the name of White Magic which are doubtful in character on the surface, while they are more than doubtful within, so there are experiences described in the Grimoires, or in the treasuries of secrets which accompany them, having nothing in their nature which can be termed especially repulsive; they belong, however, to the Grimoires; their connections in occult literature are those of Black Magic, and they deserve a place here.\n\nMoreover, a process which in one Ritual will be merely curious or diverting, hypnotic or clairvoyant, may in another bear all the outward marks of diabolism.\n\nThe mode of divination termed the.\n\nWord or Speech of Uriel--signifying answers or oracles obtained from that spirit ceremonially invoked--appears in the Grimorium Verum as an experiment in lucidity induced by means of Hydromancy, but in the Verus Jesuitarum Libellus the Conjuration of Uriel appears as an infernal conjuration, and it is a process of Black Magic undisguised.\n\nThe experiment in the Grimorium Verum is worded as follows:-- THE INVOCATION OF URIEL To succeed in this operation, it is needful that whosoever makes the experiment shall do in all things as hereinafter enjoined.\n\nLet him choose a small chamber or cabinet which has not been frequented by impure women for at least nine days.\n\nLet such Place be well cleansed and consecrated by aspersions and fumigations.\n\nIn the middle of the said chamber let there be a table covered with a white cloth; set as follows thereon--to wit, a new glass phial filled with spring water, drawn shortly before the operation; three small tapers of virgin wax mixed with human fat; a sheet of virgin parchment six inches square; a raven's quill cut ready for writing; a china ink-well filled with fresh ink; a small pan furnished with the materials for a fire.\n\nLet there be also a young boy of nine or ten years, cleanly and modestly dressed and of good behaviour, who must be placed near the table.\n\nOne of the three tapers should be fixed upon a great new needle at a distance of six inches behind the phial , and the two others, erected after the same manner, should stand on the right and left at the same distance.\n\nWhile arranging these matters, recite the following words:-- Gabamiah, Adonay, Agla , O Lord God of Powers, do Thou assist us!\n\nThe virgin parchment should be on the right and the pen with the ink on the left side of the phial.\n\nThe windows and door must be closed before beginning the operation.\n\nThe fire should then be stirred, the tapers lighted, and the boy placed on his knees so that he can look into the phial; observe that he should be bareheaded and his hands joined."


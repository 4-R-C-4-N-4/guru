[content]
body = "O most sweet Lord Jesus Christ, Son of the great living God, Thou hast Performed most mighty miracles by the sole power of Thy most precious Name, and hast enriched the poor most abundantly, so that by force thereof the demons flee away, the blind see, the deaf hear, the lame walk erect, the dumb speak, the lepers are cleansed, the sick cured, the dead raised up; for wheresoever the most sweet Name of Jesus is pronounced, the ear is ravished and the mouth is filled with Pleasant savour; at that one utterance, I repeat, the demons take flight, every knee is bent, all temptations, even the worst, are scattered, all infirmities are healed, all disputes and conflicts between the world, the flesh and the devil are ended, and the soul is filled with every heavenly delight; for whosoever invoketh or shall invoke this Holy Name of God is and shall be saved--even by this Holy Name, pronounced by the angel even before His conception in the womb of the Holy Virgin.\n\nFRIDAY O sacred Name, Name which strengthens the heart of man, Name of life, of salvation, of joy, precious Name, resplendent, glorious, agreeable Name, which fortifies the sinner, Name which saves, conserves, leads and rules all.\n\nMay it Please Thee, therefore, most Precious Jesus, by the Power of this same (Name of) Jesus, to drive away the demon from me; enlighten me, O Lord, for I am blind; remove my deafness; set me upright, who am tame; give me speech, who am dumb; cleanse my leprosy; restore me to health, who am sick; raise me up, for I am dead; give me life once more, and enrich me in all my Parts, within and without, so that, furnished and fortified by Thy Holy Name, I may abide always in Thee, Praising and honouring Thee, because all is due to Thee, and Thou only art worthy to be glorified, the Lord and Eternal Son of God, in Whom all things rejoice, and by Whom all are governed.\n\nPraise, honour and glory, be given Thee for ever and ever, Amen.\n\nMay Jesus be always in my heart and in my breast, Amen.\n\nMay our Lord Jesus Christ be ever within me, may He establish me for ever, may He be around me and preserve me; may He be before me and lead me; may He be behind me and guard me; may He be above me and bless me; may He be within me and give me life; may He be near me and rule me; may He be beneath me and fortify me; may He be always with me and deliver me from all the Pains of eternal death, Who liveth and reigneth for ever and ever, Amen.\n\nSATURDAY Jesus, Son of Mary, salvation of the world, may the Lord look favourably upon me, with mildness and propitiation; may He give me a holy and willing spirit, to respect and honour Him only, Who is the Liberator of the World.\n\nOn Him could .no one lay hand, for His hour was not yet come-He Who is, Who was, Who shall remain, God and man, the beginning and the end.\n\nMay this Prayer which I offer unto Him deliver me eternally from my enemies, Amen.\n\nJesus of Nazareth, King of the Jews, honourable title, Son of the Virgin Mary, have pity upon me, a poor sinner, and lead me, according to Thy loving-kindness, in the way of eternal salvation, Amen.\n\nNow Jesus, knowing what things must come to pass concerning Him, came forward and said unto them: Whom seek ye?\n\nThey answered Him: Jesus of Nazareth."


[content]
body = "The Black Pullet disclaims all connection with Black Magic and is duly to be identified therewith, firstly by its characters and secondly by their pretended power over evil spirits; though it should be observed that the infernal beings mentioned in the title are not on the surface devils but Salamanders--that is to say, elementary Spirits of Fire.\n\nBut while it thus transcends Black Magic--if it is requisite to make the distinction--it is not superior to plagiarism and hence incorporates many pages of the Comte de Gabalis .\n\nFor the evocation of the genii who served the Old Man of the Pyramid it suffices to say: THOMATOS, BENESSER, FLIANTER.\n\nYou are then liable to be encompassed by thirty-three several intelligences.\n\nTo obtain their consideration say: LITAN, IZER, OSNAS, and they will bow down before you, individually remarking: NANTHER.\n\nThe words SOUTRAM, UBARSINENS will cause them to transport you through the air wheresoever you are inclined.\n\nUpon the utterance of the one word RABIAM they will return you to your own abode.\n\nIt is necessary, however, to be fortified by the talismans and rings of the master, but they can be obtained by a cheap process.\n\nIn the cabinet of the Old Man of the Pyramid they were formed of the precious metals and were resplendent with gems, but they are held to answer all practical purposes if the rings are composed of bronzed steel and the talismans of satin, in strict accordance with the description which here follows."


[content]
body = "Write in his circle: Enter not , GULAND!\n\nEnter not , GULAND!\n\nEnter not , GULAND!\n\nCONJURATION I conjure thee, O GULAND, in the name of Satan, in the name of Beelzebub, in the name of Astaroth, and in the name of all other spirits, to make haste and appear before me.\n\nCome, then, in the name of Satan and in the names of all other demons.\n\nCome to me, I.\n\ncommand thee, in the Name of the Most Holy [paragraph continues] Trinity.\n\nCome without inflicting any harm upon me, without injury to my body or soul, without maltreating my books or anything which I use.\n\nI command thee to appear without delay, or, that failing, to send me forthwith another Spirit having the same Power as thou hast, who shall accomplish my commands and be submitted to my will, wanting which, he whom thou shalt send me, if indeed thou comest not thyself, shall in no wise depart, nor until he hath in all things fulfilled my desire .\n\nFor Sunday, to Surgat This experience is performed at night from eleven to one Click to view o'clock.\n\nHe will demand a hair of your head, but give him one of a fox, and see that he takes it.\n\nHis office is to discover and transport all treasures and perform anything that you may will.\n\nWrite in his circle: TETRAGRAMMATON, TETRAGRAMMATON, TETRAGRAMMATON.\n\nISMAEL, ADONAY, IHUA.\n\nAnd in a second circle: Come , SURGAT!\n\nCome , SURGAT!\n\nCome , SURGAT!\n\nCONJURATION I conjure thee, O SURGAT, by all the names which are written in this book, to present thyself here before me, promptly and without delay, being ready to obey me in all things, or, failing this, to despatch me a Spirit with a stone which shall make me invisible to every one whensoever I carry it!\n\nAnd I conjure thee to be submitted in thine own person, or in the person of him or of those whom thou shall send me, to do and accomplish my will and all that I shall command, without harm to me or to any one, so soon as I make known my intent .\n\nVery Powerful Conjuration for all days and hours of the Day or Night, being for Treasures hidden by men or Spirits, that the same may be possessed and transported I command you, O all ye demons dwelling in these Parts, or in what Part of the world soever ye may be, by whatsoever Power may have been given you by God and our holy Angels over this place, by the Powerful Principality of the infernal abysses, as also by all your brethren, both general and special demons, whether dwelling in the East, West, South or North, or in any side of the earth, and, in like manner, by the power of God the Father, by the wisdom of God the Son, by the virtue of the Holy Ghost, by the authority I derive from our Saviour Jesus Christ, the only Son of the Almighty and the Creator, Who made us and all creatures from nothing, Who also ordains that you do hereby abdicate all Power to guard, habit and abide in this Place; by Whom further I constrain and command you, nolens volens , without guile or deception, to declare me your names and to leave me in peaceable possession and rule over this Place, of whatsoever legion you be and of whatsoever part of the world; by order of the Most Holy Trinity and by the merits of the Most Holy and Blessed Virgin, as also of all the saints, I unbind you all, spirits who abide in this place, and I drive you to the deepest infernal abysses."


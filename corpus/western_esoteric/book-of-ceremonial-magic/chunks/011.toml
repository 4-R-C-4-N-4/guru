[content]
body = "Blessed and Holy are those who receive the experience of God in the dilucid contemplation, but sanctity and benediction and all in all is that state wherein contemplation is ineffably unified, by a super-eminent leap over of love, with that which is its object; and in that love and in that joining together there is no passage longer from subject to object.\n\nBut this is the Godhead.\n\nThese considerations have got so far beyond even The Cloud of Unknowing , that it seems almost a fall into matter to speak, as I had intended, of Molinos and his Spiritual Guide , which is in no sense really comparable to the older work.\n\nIt is a more ascetic treatise, and by its asceticism is a little hindered; it is a less catholic treatise, and it suffers here and there from the particular sense.\n\nYet it bears the same testimony of a full and complete intention--much too complete and too full to carry anything of the concerted air--to maintain the veils of doctrine, to speak the high and orthodox language of the official Church; but again it is like a moving, yet all remote, echo from a world which has almost passed out of knowledge.\n\nWhat is there left to the soul that it should say of the Holy Humanity, of the Precious Blood, of the five wounds, of the dolorous death and passion?\n\nIt is not that all this has been swallowed up in the glories of resurrection, but that those who have entered \"where God keeps His Throne and communicates Himself with incredible intensity\"--and those who have obeyed the last precept \"to be lost in God\"--have entered into a new order; the ships that carried them have dropped out of sight with the tide, with the breeze, in the sunshine.\n\nNow, the secret of this is--not that Dionysius and Ruysbroeck, with all their cohæredes et sodales , had become unitarians, but that the term of the Christian dispensation, to each of them personally, had been fulfilled in each.\n\nChrist had been born and lived, had taught and suffered and died, had risen and ascended and reigned in them.\n\nSo that Divine life, in fine, carried them to its last stage.\n\nIt was not Dionysius or Ruysbroeck, the author of The Cloud of Unknowing, or the soul of the poor imprisoned Jesuit Molinos, but the Christ nature within each and all of these, within ten thousand times ten thousand of their peers, in all ages and nations and faiths and climes, which entered into the incredible intensity; and that which is termed the act or state of being lost in God is that which I have elsewhere described in a perfection of all similitudes--which is of my adaptation but not of my making--when Christ delivers up the Kingdom of each soul to His Father, and God is all in all.\n\nThis is the state which is beyond the state when it is said that \"they shall see His face.\" Hereof is the mystic tradition in Christian Time; it has been perpetuated in an unbroken line from the beginnings of the new dispensation until this now.\n\nIt is of course in itself the most secret, exotic and incomprehensible of all languages, though at the same time it is the most open, universal and simple.\n\nThe understanding of it is a question of experience, and the experience is attained in sanctity, though--as I have said, but also elsewhere--the intellectual light concerning it belongs rather to the dedication out of which sanctity may at length issue than to the state of saintship itself."


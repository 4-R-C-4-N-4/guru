[content]
body = "EXPLANATION OF FULL-PAGE PLATES PLATE I FRONTISPIECE--The witch has shot a peasant in the foot with a magic hazel wand.\n\nThe victim takes off his shoe when he feels his foot beginning to swell.\n\nIf the peasant yields to the witch the spell will be lifted.\n\n(Ulrich Molitor was a medieval demographer.) PLATE II Page 37 The Angels of the Seven Planets, their Sigils, the Signs and Houses of the Planets, the names of the Seven Heavens, according to the Magical Elements of Peter de Abano, with the names of the Olympic Spirits of the Planets according to the Arbatel of Magic , and the Infernal Sigils of the Evil Planetary Spirits according to the Red Dragon .\n\nThe name of Michael, the Angel of the Lord's Day, appears over his Sigil, together with the Astrological Symbol of Sol, the Zodiacal Sign of Leo, which is the House of the Sun, and the name of the Fourth Heaven, Machen.\n\nThe name of Gabriel, the Angel of Monday, appears over his Sigil, together with the Astrological Symbol of Luna, the Zodiacal Sign of Cancer, which is the House of the Moon, and the name of the First Heaven, Shamain.\n\nThe name of Samael, the Angel of Tuesday, appears over his Sigil, together with the Astrological Symbol of Mars, the Zodiacal Signs of Aries and Scorpio, which are the Houses of the Planet, and the name of the Fifth Heaven, Machon.\n\nThe name of Raphael, the Angel of Wednesday, appears over his Sigil, together with the Astrological Symbol of Mercury, the Zodiacal Signs of Gemini and Virgo, which are the Houses of the Planet, and the name of the Second Heaven, Raquie.\n\nThe name of Sachiel, the Angel of Thursday, appears over his Sigil, together with the Astrological Symbol of Jupiter, the Zodiacal Signs of Sagittarius and Pisces, which are the Houses of the Planet, and the name of the Sixth Heaven, Zebul.\n\nThe name of Anael, the Angel of Friday, appears over his Sigil, together with the Astrological Symbol of Venus, the Zodiacal Signs of Taurus and Libra, which are the Houses of the Planet, and the name of the Third Heaven, Sagun.\n\nThe name of Cassiel, the Angel of Saturday, appears over his Sigil, together with the Astrological Symbol of Saturn, and the Zodiacal Signs of Capricornus and Aquarius, which are the Houses of the Planet.\n\nPLATE III Page 49 Mystic Figures of the Enchiridion.\n\nFigure I., the mystic symbol of the Tau, converted into a monogram which has been supposed to signify the word Taro or Tora.\n\nFigure II., the triple Tau.\n\nFigure III., an arbitrary figure supposed to represent the fortieth part of the stature of Jesus Christ.\n\nFigure IV., the Labarum of Constantine, with the usual inscription, \"In this sign thou shalt conquer,\" and the emblems of the Passion of Christ.\n\nFigure V., a double door, connected by a bar, and inscribed with the first seven letters of the Latin alphabet.\n\nFigure VI., a composite symbol of unknown meaning.\n\nThe second circle contains twenty-two letters, which recall the Keys of the Tarot.\n\nFigure VII.\n\nrepresents the dimensions of the wound produced by the lance of the Centurion in the side of Jesus Christ.\n\nFigure VIII., a two-edged sword, for which various simple meanings may be conjectured.\n\nIts inscription has been adopted by alchemists.\n\nPLATE IV Page 54 Mystic Figures of the Enchiridion.\n\nFigure I., the reversed form of a well-known occult symbol.\n\nThe Hebrew words signify Jehovah Elohim, Agla, Elohim Tsabaoth ."


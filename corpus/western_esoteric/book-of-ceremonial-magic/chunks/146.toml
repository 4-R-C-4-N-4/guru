[content]
body = "I adjure thee by the Father, by the Son and by the Holy Ghost, even by the Holy Trinity, by that God Whom thou canst not resist, under Whose empire I will compel thee; I conjure thee by God the Father, by God the Son., by God the Holy Ghost., by the Mother of Jesus Christ, Holy Mother and Perpetual Virgin, by her sacred heart, by hey blessed milk, which the Son of the Father sucked, by her most holy body and soul, by all the parts and members of this Virgin, by all the sufferings , afflictions, labours, agonies which she endured during the whole course of her life, by all the sighs she uttered, by all the holy tears which she shed whilst her dear Son wept before the time of His dolorous passion and on the tree of the Cross, by all the sacred holy things which are offered and done, and also by all others, as in heaven so on earth, in honour of our Saviour Jesus Christ, and of the Blessed Mary, His Mother, by whatsoever is celestial, by the Church Militant, in honour of the Virgin and of all the Saints.\n\nIn like manner, I conjure thee by the Holy Trinity, by all other mysteries, by the sign of the Cross, by the most precious blood and water which flowed from the side of Jesus Christ, by the sweat which issued from His whole body, when He said in the Garden of Olives; My Father, if it be possible, let this chalice Pass from me.\n\nI conjure thee by His death and Passion, by His burial and glorious resurrection, by His ascension, by the coming of the Holy Ghost.\n\nI adjure thee, furthermore, by the crown of thorns which was set upon His head, by the blood which flowed from His feet and hands, by the nails with which He was nailed to the tree of the Cross, by the holy tears which He shed, by all which He suffered willingly through great love of us: by the lungs, the heart, the hair, the inward Parts, and all the members of our Saviour Jesus Christ.\n\nI conjure thee by the judgment of the living and the dead, by the Gospel words of our Saviour Jesus Christ, by His preachings, by His sayings, by His miracles, by the child in swaddling-clothes, by the crying child, borne by the mother in her most pure and virginal womb; by the glorious intercession of the Virgin Mother of our Saviour Jesus Christ; by all which is of God and of His Most Holy Mother, as in heaven so on earth.\n\nI conjure thee by the holy Angels and Archangels, by all the blessed orders of Spirits, by the holy patriarchs and Prophets, by all the holy martyrs and confessors, by all the holy virgins and innocent widows, by all the saints of God, both men and women.\n\nI conjure thee by the head of St.\n\nJohn the Baptist, by the milk of St.\n\nCatherine, and by all the Saints ."


[content]
body = "At the end of nine days, and at the hour of concealment, bring it forth, open it, and you will discover a small animal in the form of a serpent, which will at once spring up.\n\nSay then: I accept the pact.\n\nTouch not the creature with your hand, but transfer it into a new box, purchased expressly, without bargaining; for the food of the monster give husks of wheat only, and those daily.\n\nWhen you are in want of gold or silver, place as much as you need in the box; retire to rest with the box at your bedside; sleep, if you wish, for the space of three or four hours; then rise, and you will find double the amount of money which you have entrusted to the serpent.\n\nWhat you originally placed in the box must, however, be left therein; and it becomes therefore a sort of transcendental savings-bank which doubles its capital daily.\n\nShould the reptile be of ordinary appearance, you must not try for more than one hundred francs at a time; but if your planet give you the ascendant in things supernatural, the serpent will have a human face, and you may deposit a thousand francs.\n\nIn either case, should the operator part with his possession, two conditions must be observed: the recipient must be a consenting party to the gift, and a figure, to be drawn on virgin parchment, but omitted by the Grimoire, must be placed in the box.\n\nif, however, you prefer to destroy it, let the serpent be provided, not with his usual bran, but with some of the flour used for consecration in the first Mass of a priest, after eating which he will die.\n\nOn the whole, it will be simpler to retain the enchanted animal, more especially as the vague responsibilities of the pact are not apparently transferred in the one or annulled in the other case.\n\nNo jest is intended, says the dry author of the Grimorium Verum , but the process of the Gold-Finding Hen is on the whole simpler, as it is also more cleanly."


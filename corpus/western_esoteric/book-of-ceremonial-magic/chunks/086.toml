body = "CHAPTER II The Initial Rites and Ceremonies § 1.\n\nConcerning the Virtues of the Planets THE Key of Solomon the King is the only ordinary Magical Ritual which regulates the operations of Magical Art in accordance with a formal attribution of certain hours in the day and night to the rule and influence of certain planets, while the Book of True Black Magic is the only Goëtic Grimoire which follows the Clavicle closely in this as in other respects.\n\nThe directions given are, however, exceedingly confused.\n\nThe common attribution of the seven days to the seven planets obtains in both cases, and is set out in the Grimoire as follows: -- Solday = Saturn = ♄ = Saturday.\n\nZedex = Jupiter = ♃ = Thursday.\n\nMadime = Mars = ♂ = Tuesday.\n\nZemen = Sol = ☉ = Sunday.\n\nHogos = Venus = ♀ = Friday.\n\nCocao = Mercury = ☿ = Wednesday.\n\nZeveac = Moon = ☽ = Monday.\n\nBut as there is inequality in the length of the days, says the Grimoire--that is to say, the comparative duration of day and night varies in accordance with the times of sunrise and sunset--so also the hours of the planets are unequal.\n\nWhen the day is, say, fifteen hours in length, to ascertain how many minutes compose an hour of the planet, multiply the fifteen hours by five; the result is seventy-five, and as many minutes will form the hour of the planet of that day.\n\nThe corresponding hours of the night are nine; these multiplied by five produce forty-five, and as many minutes will form the hour of the planet of the night.\n\nThe same method may be followed through all seasons of the year.\n\nBut in any given day of twenty-four hours the number of minutes is 1440, as against 1530 in the above computation, and the method is therefore absurd.\n\nThe attribution accepted by all writers on Natural Magic, and corresponding with the angelical succession in Peter de Abano, will be found in the following:-- TABLE OF PLANETARY HOURS COMPUTED FROM MIDNIGHT TO MIDNIGHT HOURS OF THE DAY Sunday Monday Tuesday Wednesday Thursday Friday Saturday 1.\n\nSun Moon Mars Merc.\n\nJup.\n\nVenus Sat.\n\n2.\n\nVenus Sat.\n\nSun Moon Mars Merc.\n\nJup.\n\n3.\n\nMerc.\n\nJup.\n\nVenus Sat.\n\nSun Moon Mars 4.\n\nMoon Mars Merc.\n\nJup.\n\nVenus Sat.\n\nSun 5.\n\nSat.\n\nSun Moon Mars Merc.\n\nJup.\n\nVenus 6.\n\nJup Venus Sat Sun Moon Mars Merc.\n\n7.\n\nMars Merc.\n\nJup.\n\nVenus Sat.\n\nSun Moon 8.\n\nSun Moon Mars Merc.\n\nJup.\n\nVenus Sat.\n\n9.\n\nVenus Sat Sun Moon Mars Merc.\n\nJup.\n\n10.\n\nMerc.\n\nJup.\n\nVenus Sat.\n\nSun Moon Mars 11.\n\nMoon Mars Merc.\n\nJup.\n\nVenus Sat.\n\nSun 12.\n\nSat.\n\nSun Moon Mars Merc.\n\nJup.\n\nVenus HOURS OF THE NIGHT 1.\n\nJup.\n\nVenus Sat.\n\nSun Moon Mars Merc.\n\n2.\n\nMars Merc.\n\nJup.\n\nVenus Sat.\n\nSun Moon 3.\n\nSun Moon Mars Merc.\n\nJup Venus Sat.\n\n4.\n\nVenus Sat.\n\nSun Moon Mars Merc.\n\nJup.\n\n5.\n\nMerc.\n\nJup.\n\nVenus Sat.\n\nSun Moon Mars 6.\n\nMoon Mars Merc.\n\nJup.\n\nVenus Sat.\n\nSun 7.\n\nSat.\n\nSun Moon Mars Merc.\n\nJup.\n\nVenus 8.\n\nJup.\n\nVenus Sat.\n\nSun Moon Mars Merc.\n\n9.\n\nMars Merc.\n\nJup.\n\nVenus Sat.\n\nSun Moon 10.\n\nSun Moon Mars Merc.\n\nJup Venus Sat.\n\n11.\n\nVenus Sat.\n\nSun Moon Mars Merc.\n\nJup.\n\n12.\n\nMerc.\n\nJup.\n\nVenus Sat."


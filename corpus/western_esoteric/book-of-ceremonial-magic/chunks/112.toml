[content]
body = "Click to view THE SEAL OF FORAS XXXI. FORAS, a great president, who appears in the form of a strong man and teaches the virtues of all herbs and precious stones, as well as logic and ethics; he makes men invisible, imparts wit, wisdom and eloquence, discovers treasures and restores things lost. Click to view THE SEAL OF ASMODAY XXXII. ASMODAY, a strong and powerful king, appears with three heads, the first like a bull, the second like a man and the third like a ram. He has a serpent's tail, the webbed feet of a goose and he vomits fire. He rides an infernal dragon, carries lance and pennon and is the chief of the power of Amaymon . He must be invoked bareheaded, for otherwise he will deceive. He gives the ring of virtues, teaches arithmetic, geomancy and all handicrafts, answers all questions, makes men invisible, indicates the places of concealed treasures and guards them, if within the dominion of Amaymon . XXXII. GAAP, a great president and prince, appears when the sun is in the southern signs, coming in a human shape and preceded by four powerful kings. He teaches philosophy Click to view THE SEAL OF GAAP and the liberal sciences, excites love and hatred, makes men insensible, gives instruction in the consecration of those things which belong to the divination of Amaymon, his king, delivers familiars out of the custody of other Magicians, gives true answers as to past, present and future, transports and returns men speedily from place to place at the will of the exorcist. He was of the Order of the Powers. Click to view THE SEAL OF FURFUR XXXIV. FURFUR, a great earl, appears in the form of a hart, with a fiery tail, and will not open his mouth till compelled within the triangle. He then assumes the form of an angel, speaking with a hoarse voice. He causes love between man and wife, raises thunder, lightning and great winds, gives true answers about secret and divine things. Click to view THE SEAL OF MARCHOSIAS XXXV. MARCHOSIAS, a mighty marquis, appears in the form of a wolf with the wings of a griffin, a serpent's tail and fire issuing from. his mouth. At the command of the operator he assumes a human form. He is strong in battle, gives true answers to all questions and is extremely faithful to the exorcist. He belongs to the Order of Dominations. XXXVI. SOLAS or STOLAS, a powerful prince, appears in the likeness of a raven and then as a man. He teaches the art of astronomy and the virtues of herbs and stones. Click to view THE SEAL OF SOLAS Click to view THE SEAL OF PHŒNIX XXXVII. PHŒNIX, a great marquis, appears like the bird of that name, singing dulcet notes in a child's voice. When he assumes human shape at the will of the Magician, he speaks marvellously of all sciences, proves an excellent poet and fulfils orders admirably. He hopes to return to the Seventh Thrones in 1200 years. Click to view THE SEAL OF HALPAS XXXVIII. HALPAS, a great earl, appears in the form of a stockdove, speaking with a hoarse voice. He burns towns, visits the wicked with the sword and can send men to fields of war or to other places."


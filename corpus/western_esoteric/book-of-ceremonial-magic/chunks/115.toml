[content]
body = "Click to view THE SEAL OF ALLOCEN Click to view THE SEAL OF CAIM LII. ALLOCEN, a strong duke, appears in the form of a soldier, mounted on a great horse, his face like that of a lion, exceedingly red, his eyes flaming fire, his speech hoarse and loud. He teaches astronomy and the liberal sciences, and gives a good familiar. LIII. CAIM, a great president, appears in the form of a thrush, but afterwards in that of a man bearing a sharp sword and seeming--as it is said fantastically--to answer in burning ashes. He is a keen disputant; he imparts to men the understanding of birds' songs, the lowing of cattle, the barking of dogs and the voice of waters. He gives true answers concerning things to come and was once of the Order of Angels. LIV. MURMUR, a great duke and earl, appears in the form of a soldier, riding on a griffin and having a duke's crown on his head. He is preceded by two ministers sounding trumpets. He teaches philosophy perfectly; he constrains the souls of the dead to appear and to answer questions. He was partly of the Order of Thrones and partly of Angels. Click to view THE SEAL OF MURMUR Click to view THE SEAL OF OROBAS LV. OROBAS, a great prince, appears first like a horse but, when commanded, in human form. He discovers past, present and future; he gives good dignities and advancements, with the favour of friends and foes; he will reply concerning the creation of the world and Divinity; he is very faithful to the exorcist and defends him from temptation by any spirit. Click to view THE SEAL OF GOMORY Click to view THE SEAL OF OSE LVI. GOMORY, a powerful duke, appears like a beautiful woman, wearing a ducal crown. He discovers past, present and future, as also the whereabouts of hidden treasures; he procures the love of women and especially of girls. LVII. OSE, a great president, appears at first like a leopard and then in human shape. He gives skill in all liberal sciences and true answers concerning divine and secret things. He can change men into any shape that the exorcist may desire, and he that is changed will not know it. Click to view THE SEAL OF AMY LVIII. AMY, a great president, comes first as a great flaming fire and then as a man. He gives perfect knowledge of astrology and the liberal sciences, with good familiars, and can betray treasures that are kept by spirits. Click to view THE SEAL OF ORIAS LIX. ORIAS, a great marquis, appears in the form of a lion bestriding a strong horse; he has a serpent's tail and holds two enormous, hissing snakes in his right hand. He teaches the virtues of the planets and the mansions thereof; he transforms men, gives dignities, prelacies and confirmations, with the favour of friends and foes."


[content]
body = "Click to view THE SEAL OF BUER Click to view THE SEAL OF GUSION X. BUER, a great president, who appears when the sun is in Sagittarius and teaches philosophy, logic, the virtues of herbs, &c. He heals all diseases and gives good familiars. XI. GUSION, a mighty duke, who appears like a cynocephalus, discerns the past, present and future, answers all questions, reconciles enemies and gives honour and dignities. Click to view THE SEAL OF SYTRY Click to view THE SEAL OF BELETH XII. SYTRY, a great prince, who appears with a leopard's head and the wings of a griffin, but assumes a beautiful human form at the Magician's command. He procures love between the two sexes, and causes women to shew themselves naked. XIII. BELETH, a terrible and mighty king, riding on a pale horse, preceded by all manner of musicians. He is very furious when first summoned, and must be commanded into a triangle or circle with the hazel wand of the Magician pointed to the South-East. He must be received courteously and with homage, but a silver ring must be worn on the middle finger of the left hand, which must he held against the face. He procures love between man and woman and is of the Order of the Powers. Click to view THE SEAL OF LERAJIE Click to view THE SEAL OF ELIGOR XIV. LERAJIE, a powerful marquis, coming in the likeness of an archer, clad in green and bearing bow and quiver. He occasions battles and causes arrow-wounds to putrefy. XV. ELIGOR, a great duke, appearing as a goodly knight carrying a lance, pennon and sceptre. He discovers hidden things, causes war, marshals armies, kindles love and lust. Click to view THE SEAL OF ZEPAR Click to view THE SEAL OF BOTIS XVI. ZEPAR, a great duke, who appears in red apparel and armed like a soldier. He inflames women with love for men and can transform them into other shapes till they have been enjoyed by their lovers. XVII. BOTIS, a great president and earl, who appears like a horrid viper, but, when commanded, assumes a human shape, with large teeth and horns. He bears a sharp sword in his hand, discerns past, present and future reconciles friends and foes. Click to view THE SEAL OF BATHIN XVIII. BATHIN, a mighty duke, who appears like a strong man with a serpent's tail, riding on a pale horse. He knows the virtues of herbs and precious stones, and can transport men swiftly from one country to another. Click to view THE SEAL OF SALEOS XIX SALEOS, a great duke, who appears like a brave soldier, riding on a crocodile and wearing a duke's crown. He promotes love between the sexes. Click to view THE SEAL OF PURSON XX. PURSON, a great king, who appears like a lion-headed man, carrying a viper in his hand and riding on a bear, preceded by many trumpeters. He conceals and discovers treasure, discerns past, present and future, gives true answers respecting things human and divine, and provides good familiars."


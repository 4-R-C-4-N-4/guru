[content]
body = "We glorify Thee, O blessed and glorious Trinity I May the Name of the Lord be blessed, now and henceforth for ever I Amen.\n\nIn the Name of the Father, of the Son and of the Holy Ghost, Jesus of Nazareth, King of the Jews.\n\nMay Christ conquer ✠ , reign ✠ , command ✠ , and defend me from all evil.\n\nAmen ."


[content]
body = "CONJURATION OF THE KING OF THE EAST I conjure and invoke thee, O powerful King of the East, MAGOA , by my holy labour, by all the names of Divinity, by the same of the All-Powerful: I command thee to obey, and to come to me, or that failing, forthwith and immediately to send unto me MASSAYEL, ARIEL, SATIEL, ARDUEL, ACORIB , to respond concerning all that I would know and to fulfill all that I shall command.\n\nElse thou shalt come verily in thine own Person, to satisfy my will; which refusing, I shall compel thee by all the virtue and power of God .\n\nThe Grand Pentacle or Circle of Solomon will answer for the above and following Conjurations, which can be said on all days and at all hours.\n\nIf it be desired to speak only with one spirit, one only need be named, at the choice of the reader.\n\nCONJURATION OF THE KING OF THE SOUTH O EGYM , great King of the South, I conjure and invoke thee by the most high and holy Names of God, do thou here manifest, clothed with all thy Power; come before this circle, or at least send me forthwith Fadal, Nastrache , to make answer unto me, and to execute all my wishes.\n\nIf thou failest, I shall force thee by God Himself .\n\nCONJURATION OF THE KING OF THE WEST O BAYMON , most potent King, who reignest in the Western quarter, I call and I invoke thee in the name of the Deity!\n\nI command thee by virtue of the Most High, to send me immediately before this circle the Spirit Passiel Rosus , with all other Spirits who are subject unto thee, that the same may answer in everything, even as I shall require them.\n\nIf thou failest, I will torment thee with the sword of fire divine; I will multiply thy sufferings and will burn thee .\n\nCONJURATION OF THE KING OF THE NORTH O thou, AMAYMON , King and Emperor of the Northern Parts, I call, invoke, exorcise and conjure thee, by the virtue and power of the Creator, and by the virtue of virtues, to send me presently, and without delay, Madael, Laaval, Bamlahe, Belem and Ramath , with all other Spirits of thine obedience, in comely and human form I In whatsoever Place thou now art, come hither and render that honour which thou owest to the true living God, Who is thy Creator.\n\nIn the name of the Father, of the Son and of the Holy Ghost, come therefore, and be obedient, in front of this circle, without Peril to my body or soul.\n\nAppear in comely human form, with no terror encompassing thee, I conjure thee, make haste, come straightway, and at once.\n\nBy all the Divine names-- SECHIEL, BARACHIEL --if thou dost not obey promptly, BALANDIER, suspensus, iracundus, Origratiumgu, Partus, Olemdemis, and Bautratis , N.\n\nI exorcise thee, do invoke and do impose most high commandment upon thee, by the omnipotence of the living God, and of the true God; by the virtue of the holy God, and by the power of Him Who spake and all things were made, even by His holy commandment the heaven and earth were made, with all that is in them!"


[content]
body = "§ 3.\n\nThe Pauline Art If the intimation of the last section be accepted as a working hypothesis in respect of the Lemegeton , and if its third and fourth books be therefore set apart as accretions, there is possibly some colourable pretence for placing The Pauline Art among composite Rituals.\n\nIt is very difficult to speak certainly, as what is offered in the work is the Ritual for the Invocation of the Angels of Day and Night, the Angels of the Twelve Signs and those of the Zodiacal degrees, who are termed Angels of Men.\n\nThere is, however, no distinct account either of their offices or qualities, except in the case of the last, as to whom it appears that their intervention can be sought only for purposes which are in consonance with the laws of God and the good of mankind generally.\n\nIt is an and document largely consisting of name catalogues, but as for this reason it is possible to present it shortly, and as it counts for something in the literature, I shall give it in the following form.\n\nHOURS OF THE DAY The Ruler of the First Hour is SAMAEL, who has 444 serving spirits under eight leaders, namely: Arniniel, Charpon, Daresiel, Monasiel, Brumiel, Nestoriel, Charmeas, Meresijn .\n\nThe Ruler of the Second Hour is ANAEL, who has under his control ten chief and one hundred lesser lords.\n\nThese in their turn command serving spirits.\n\nThe chiefs include Monarchas , Archiel and Chardiel ; the subalterns include Orphiel, Carsiol, Elmoym, Quosiel, Ermosiel, Graniel .\n\nThe Ruler of the Third Hour is VEGUANIEL, under whom are twenty chief officers, two hundred lesser officers and a cloud of serving spirits.\n\nThe chief officers include Murriel, Leosiel, Drelmeth, Sardiniel ; among the lesser officers are Parmiel, Comadiel, Glmarij, Hantiel, Serviel, Furiel .\n\nThe Ruler of the Fourth Hour is VACHMIEL, who has ten chief and one hundred inferior officers, having many serving spirits.\n\nThe chiefs include Ammiel, Larmiel, Marfiel, Ormijel, Sardiel , and the inferiors Emarfiel, Permiel, Quoriel, Sturbiel, Daniel .\n\nThe Ruler of the Fifth Hour is SAZQUIEL, having ten chief and one hundred lesser officers, each with attendants.\n\nThe chiefs include Damiel, Armarele, Maroch, Serapiel, Fustiel , and the inferiors Jamersil, Futiniel, Ramisiel, Amisiel, Pubrisiel .\n\nThe Ruler of the Sixth Hour is SAMIL, who has ten chief and one hundred lesser officers, with a vast concourse of serving spirits.\n\nAmong the chiefs are Araebel, Charuch, Medussusiel, Nathaniel, Perniel , and among the subordinates Jamiel, Joustriel, Sameon, Farsiel, Zamion .\n\nThe Ruler of the Seventh Hour is BARGINIEL, having also ten officers and one hundred subalterns, among whom are Abrasiel, Farmos, Nosteri, Mamiel, Sagiel , for the chief, and Harmiel, Nastoro, Varmaj, Tusmas, Crociel , as inferior examples.\n\nThe Ruler of the Eighth Hour is OSGAEBIAL, who has many chief and subordinate officers and a great cloud of serving spirits."


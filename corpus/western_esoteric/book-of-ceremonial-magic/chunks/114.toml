[content]
body = "HAGENTI, a great president, appears in the shape of a gigantic bull with the wings of a griffin, but will duly put on human form.\n\nHe gives wisdom, transmutes all metals into gold and turns wine into water.\n\nClick to view THE SEAL OF PROCEL XLIX.\n\nPROCEL, appears in the form of an angel, and is a great and strong duke.\n\nHe speaks mystically of hidden things, teaches geometry and the liberal sciences, and at the command of the operator will make a great commotion, like that of running waters; he also warms waters and tempers baths.\n\nHe was of the Order of the Powers before his fall.\n\nClick to view THE SEAL OF FURCAS Click to view THE SEAL OF BALAM L.\n\nFURCAS, a great duke, appears in the form of a cruel old man, with long beard and hoary hair.\n\nHe is seated on a pale horse and has a sharp spear in his hand.\n\nHe teaches philosophy, rhetoric, astronomy, logic, chiromancy and pyromancy--perfectly in all their parts.\n\nLI.\n\nBALAM, a terrible and powerful king, appears with three heads, the first like that of a bull, the second like that of a man and the third like a ram's.\n\nWith the tail of a serpent and eyes flaming fire, he rides upon a furious bear, carrying a goshawk on his wrist and speaking with a hoarse voice.\n\nHe gives true answers as to past, present and future, makes men go invisible, and imparts wit."


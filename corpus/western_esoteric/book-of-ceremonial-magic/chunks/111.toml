[content]
body = "Click to view THE SEAL OF MORAX XXI. MORAX, a great earl and president, who appears like a human headed bull, and gives skill in astronomy and the liberal sciences, with good familiars. He knows the virtues of all herbs and precious stones. Click to view THE SEAL OF IPOS XXII. IPOS, a mighty earl and prince, appearing as an angel with a lion's head, the webbed feet of a goose and a hare's tail. He knows the past and future, and imparts wit and courage. Click to view THE SEAL OF AINI XXIII. AINI, a strong duke, who appears with the body of a handsome man but having three heads, the first like a serpent, the second like a man with two stars on the forehead and the third like a cat. He rides on a viper and carries a blazing firebrand, with which he spreads destruction. He imparts much cunning and gives true answers concerning private matters. Click to view THE SEAL OF NABERIUS XXIV. NABERIUS, a valiant marquis, who appears in the form of a crowing cock and flutters about the circle. He speaks hoarsely, gives skill in arts and sciences, especially rhetoric, and restores lost dignities and honours. Click to view THE SEAL OF GLASYALABOLAS XXV. GLASYALABOLAS, a mighty president, who comes in the form of a dog, but winged like a griffin, He teaches all arts and sciences instantaneously, incites to bloodshed, is the leader of all homicides, discerns past and future, and makes men invisible. Click to view THE SEAL OF BUNE XXVI. BUNE, a strong duke, who appears as a three-headed dragon, the heads being respectively those of a dog, griffin and man. He has a pleasant voice; he changes the places of the dead, causes demons to crowd round sepulchres, gives riches, makes men wise and eloquent, answers questions truly. Click to view THE SEAL OF RONOBE XXVII. RONOBE, a great marquis and earl, appears in a monstrous form; he teaches rhetoric and the arts, gives a good understanding, the knowledge of tongues and favour of friends and foes. XXVIII. BERITH, a terrible duke, appearing in the form Click to view THE SEAL OF BERITH of a soldier in red apparel, with a golden crown, and bestriding a red horse. The ring used for Berith is required for his evocation. He gives true answers of things past, present and to come, turns all metals into gold, gives and confirms dignities. He speaks in a clear and persuasive voice, but is a great liar and his advice must not be trusted. Click to view THE SEAL OF ASTAROTH XXIX. ASTAROTH, a great and powerful duke, appears like a beautiful angel riding on an infernal dragon and carrying a viper in his right hand. He must not be permitted to approach on account of his stinking breath, and the magician must defend his face with the magic ring. answers truly concerning past, present and future, discovers all secrets and gives great skill in the liberal sciences. He will also discourse willingly concerning the fall of spirits. Click to view THE SEAL OF FORNEUS XXX. FORNEUS, a great marquis, appears as a sea-monster. He teaches all arts and sciences, including rhetoric, gives a good reputation and the knowledge of tongues, and causes men to be loved by their enemies even as by their friends."


[content]
body = "These will suffer citation, but the success of the Pauline experiments generally will depend ( a .) upon the construction of the seals attributed to the twenty-four ruling hours of the day and night, which seals must exhibit the proper astrological signs referable to the day and hour of each intelligence; ( b .) upon the use, when invocation takes place, of the proper planetary perfumes; ( c .) upon the astrological seals referable to the chief intelligences of the Twelve Signs under the presidency of the four great archangels; ( d .) upon a consecrated crystal into which the zodiacal spirits must be called by the operator; and ( e .) upon the ceremonial use of the invoking formulæ, specimens of which are as follows.\n\nHOURS OF THE DAY AND NIGHT Invocation of a Supreme Ruler O mighty and potent Prince Samael, who art the ruler and governor of the first hour of the day by the decree of the Most High God, King of Glory; I, the servant of the Most High, do desire and entreat you by three great and potent names of God, ADONAI , AGLAON , TETRAGRAMMATON , and by the Power and virtue thereof, to assist me in my affairs, and by your power and authority to send me, causing to appear before me, all or any of the angels whom I shall call by name, the same being.\n\nresident under your government.\n\nI do further entreat and require that they shall help in all matters which accord with their office, even as I shall desire, and that they shall act for me as for the servant of the Most High.\n\nAmen .\n\nTHE INVOCATION OP A GENIUS IN THE CRYSTAL The ceremony is performed facing towards that quarter of heaven in which the sign is situated.\n\nPRAYER O thou great and blessed angel N., my angel guardian, vouchsafe to descend from thy holy mansions bringing thy holy influence and presence into this crystal stone, that I may behold thy glory and enjoy thy society and aid, both now and evermore.\n\nO thou that art higher than the fourth heaven, thou who knowest the secrets of ELANEL , thou who ridest on the wings of the wind and art endowed with superlunary motion; do thou descend and be present, I pray thee.\n\nIf ever I have merited thy society, if my intentions are pure in thy sight, bring hither thine eternal Presence; deign to hold commune with me, in the name of the Great God JEHOVAH , to Whom the whole choir of heaven continually sings: O MAPPA LA MAN , Hallelujah.\n\nAmen .\n\nBy the proper observation of the rules laid down in the Pauline Art respecting the Angels of Men, and on the assumption that he is acquainted with the actual minute of his birth, it is said that the operator may attain to all arts and sciences, even to the sum of wisdom.\n\nIn a word, it is the royal road of knowledge, both in the theoretical and the practical degrees.\n\nOf such is Astronomical Magic, according to the Lemegeton and its dependencies.\n\nIt does not differ essentially from the system of the Enochian Tablets followed by John Dee and Edward Kelley, his skryer, as found in the Faithful Relation .\n\nThe same observation will apply to the content of the next section, which may be permitted to follow without further preface."


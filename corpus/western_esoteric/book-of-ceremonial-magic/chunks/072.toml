[content]
body = "§ 5.\n\nMinor and Spurious Rituals of Black Magic To distinguish in a mass of forged literature certain books as more spurious than others, seems at first sight a needless ingenuity of criticism.\n\nThere are, however, some Rituals of Black Magic which are merely the knavish speculations of catchpenny booksellers, and there are others, anterior to the period, and foreign to the centres, of colportage , which have never exercised any influence, and are, in fact, generally unknown.\n\nBoth classes neither possess a history nor have contributed anything to their subject.\n\nYet it does not follow that they offer no points of curiosity or interest, and some account of them must be given in this place.\n\nThe Verus Jesuitarum Libellus , or \"True Magical Work of the Jesuits, containing most powerful conjurations for all evil spirits of whatever state, condition and office they are, and a most powerful and approved conjuration of the Spirit Uriel; to which is added Cyprian's Invocation of Angels, and his Conjuration of the Spirits guarding Hidden Treasures, together with a form for their dismissal,\"--purports to have been published at Paris in the Latin tongue, and in the year 1508.\n\nIt was reprinted by Scheible at Stuttgart in 1845, forming part of the curious collection of Faust documents already mentioned.\n\nFinally, in the year 1875, the late Major Herbert Irwin made, or procured privately, an English translation, which remains in MS.\n\nThe date placed on the title-page of the original edition at once betrays the imposture.\n\nIt will be almost needless to say that in the first decade of the sixteenth century there were no Jesuits; the Society originated with St.\n\nIgnatius, who died in 1556, being two years after the confirmation of the Society by Pope Paul III.\n\nThe Conjurations are excessively curious.\n\nThe first is addressed to a spirit whose name is not indicated, but he is, supposed to have been obedient to Abraham and Isaac, and is directed to bring the magician, out of the depths of the sea, so many millions--the number is not specified and depends upon the cupidity of the operator--of the best Spanish gold; otherwise, says the Conjuration, I will condemn thy body ( sic ) and thy soul.\n\nIn the second.\n\nformula, the spirit is cited by the knowledge and exorcising power of Agrippa, which again puts a definite limit to the antiquity of the collection, were it otherwise necessary.\n\nThe third Invocation is addressed to the spirit Zayariel , who is conjured by Agla Scheffert and the great Jehova Podashocheia .\n\nThe remainder, to the number of seven in all, are nearly identical in character and precisely in purpose, the demon being invariably required too bring that which is desired by the operator from the depths of the sea, or from the abyss of the waters, or from the spiritual abyss.\n\nThe Discharge or Absolution which concludes the series is really an additional conjuration.\n\nThe Citation of St.\n\nCyprian is presumably an experiment in what is distinguished as White Magic, seeing that it is addressed to an Angel who was the guest of Lot and Abraham.\n\nThe object being \"help in need,\" and this in all simplicity, it is apparently appropriate for every strait in life, and should be, therefore, noted for reference by those who may think it worth while; it is too cumbrous and tedious for these pages, A similar observation would apply only too truly to the Process for the Magical Acquisition of Hidden Treasures , but it is much more complete than the rest and has so much connection with the Summum Bonum , the desire of the eyes of all Ceremonial Magic, that it may be held necessary to give it."


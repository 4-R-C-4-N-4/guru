[content]
body = "Their particular forms are an armed king riding on a wolf; an armed man; a woman holding a buckler on her thigh; a she-goat; a horse; a stag; a red garment; wool; a cheestip.\n\nWool of a choleric disposition is perhaps a Goëtic form of gun-cotton.\n\nThe Spirits of the Sun are usually large of body and limb, sanguine, gross, and of a gold colour tinctured with blood--which recalls Mrs.\n\nBrowning's pomegranate.\n\nTheir motion is that of lightning; their sign is to produce sweat in the operator, which might, however, be the normal property of all these stellar nondescripts of the world infernal.\n\nTheir particular forms are a sceptred king riding on a lion; a crowned king; a queen with a sceptre; a bird-not otherwise described, but anything probably except that of paradise; a lion; a cock; a golden garment; a sceptre; and lastly, something which Robert Turner wisely left untranslated-- caudatus , i.e.\n\n, tailed.\n\nThe Spirits of Venus have a body of medium height and a pleasant visage, of which the upper part is golden and the lower white or green.\n\nTheir motion is like that of a brilliant star.\n\nTheir sign is the semblance of maids sporting about the circle and luring the Magician to join them.\n\nTheir particular forms are a sceptred king riding on a camel; a naked maid; a she-goat; a camel--possibly the atrocious demon of Cazotte; a dove; a white or green garment; the herb savine.\n\nThe Spirits of Mercury appear commonly with a body of middle stature, cold, liquid, moist, which sounds redundant, but the reference is to the properties of quicksilver--that is to say, the Mercury of the philosophers was supposed not to wet the hand, but the Mercurial spirits of the sorcerer apparently did.\n\nThey are withal fair, affable in speech, of human shape and like unto armed knights.\n\nThey are comparable to silver-coloured clouds in their motion.\n\nTheir sign is that they cause horror and fear in the operator.\n\nTheir special shapes are a king riding on a bear; a comely youth; a woman holding a distaff-it is difficult to understand how such an apparition can be like an armed knight, an observation which, if it were worthwhile, might apply to the remaining modes of manifestation; a dog; a she-bear; a magpie; a garment of many changing colours; a rod; and a little staff.\n\nFinally, the Spirits of the Moon have a large, soft, phlegmatic body, even as a dark cloud in colour.\n\nTheir countenance is swollen, their head bald, their eyes are red and rheumy, their teeth like those of a wild boar.\n\nTheir motion is like that of a great tempest sweeping the sea.\n\nTheir sign is a heavy shower of rain about the circle.\n\nTheir particular shapes area king like an archer riding on a doe; a little boy; a huntress with bow and arrows; a cow; a small doe; a goose; a green or silver-coloured garment; an arrow; a many-footed creature--perhaps a centipede.\n\nThe imbecility of this muddled tabulation places the forged Fourth Book in a more absurd light than it otherwise deserves.\n\nIt really reproduces the manner of Agrippa's treatise with a fidelity which is not unskilful and has quite as much claim to be taken seriously as any of the composite Rituals.\n\nIt is difficult to say whether it is more especially on the side of the devil or on that of folly, except in so far as these two are one."


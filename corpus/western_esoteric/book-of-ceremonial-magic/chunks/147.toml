[content]
body = "CONJURATIONS FOR EACH DAY OF THE WEEK For Monday, to Lucifer This experience is commonly performed in the circle between eleven and twelve o'clock, or between three and four.\n\nClick to view [paragraph continues] Requisites: coal, and consecrated chalk to compose the circle, about which these words must be written: I forbid thee, Lucifer, in the name of the Most Holy Trinity, to enter within this circle .\n\nA mouse must be provided to give him; the master must have a stole and holy water, an alb also and a surplice.\n\nHe must recite the Conjuration in a lively manner, commanding sharply and shortly, as a lord should address his servant, with all kinds of menaces: SATAN, RANTAM, PALLANTRE, LUTAIS, [paragraph continues] CORICACOEM, SCIRCIGREUR, I require thee to give me very humbly , &c.\n\nCONJURATION I conjure thee, Lucifer, by the living God, by the true God, by the holy God, Who spake and all was made, Who commanded and all things were created and made!\n\nI conjure thee by the Ineffable Names of God, ON, ALPHA and OMEGA, ELOY, ELOYM, YA, SADAY, LUX, MUGIENS, REX, SALUS, ADONAY, EMMANUEL, MESSIAS ; and I adjure, conjure, and exorcise thee by the Names which are declared under the letters V, C, X, as also by the Names JEHOVAH, SOL, AGLA, RIFFASORIS, ORISTON, ORPHITNE, PHATON IPRETU, OGIA, SPERATON, IMAGON, AMUL, PENATON, SOTER, TETRAGRAMMATON, ELOY, PREMOTON, SITMON, PERIGARON, IRATATON, PLEGATON, ON, PERCHIRAM, TIROS, RUBIPHATON, SIMULATON, PERPI, KLARIMUM, TREMENDUM, MERAY , and by the most high Ineffable names of God, GALI, ENGA, EL, HABDANUM, INGODUM, OBU ENGLABIS , do thou make haste to come, or send me N., having a comely and human form, in no wise repulsive, that he may answer in real truth whatsoever I shall ask him, being also powerless to hurt me, or any person whomsoever, either in body or soul .\n\nFor Tuesday, to Frimost This experience is performed in its proper circle at night from nine to ten o'clock, and the first stone found is given to him.\n\nHe is to be received with dignity and honour.\n\nProceed as on Monday; compose the circle, and write about it: Obey me , FRIMOST!\n\nObey me , FRIMOST!\n\nObey me , FRIMOST!\n\nCONJURATION I conjure and command thee, FRIMOST , by all the names wherewith thou canst be constrained and bound!\n\nI exorcise thee, NAMBROTH , by thy name, by the virtue of all spirits, by all characters, by the Jewish, Greek and Chaldean conjurations, by thy confusion and malediction, and I will redouble thy Pains and torments from day to day for ever, if thou come not now to accomplish my will and submit to all that I shall command, being Powerless to harm me, or those who accompany me, either in body or soul ."


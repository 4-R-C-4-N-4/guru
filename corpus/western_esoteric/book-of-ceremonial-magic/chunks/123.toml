[content]
body = "Make, therefore, reasonable answers to my demands; be obedient to me, thy Master, in the Name of the Lord BATHAL , rushing upon ABRAC, ABEOR , coming upon BEROR.\n\nHe will become obedient and bid you ask what you will, for he is made subject by God to your purpose.\n\nWhen he shews himself humble and meek, say:-- Welcome, Spirit (or, most noble King), welcome art thou unto me; I have called through Him Who created Heaven, Earth and Hell, with all contained therein, and thou hast obeyed, also by the like power.\n\nI bind thee to remain affably and visibly before this circle, within this triangle, so long as I need thee, to depart not without my license, till thou hast truly and faithfully fulfilled all that I shall require .\n\nTHE LICENSE TO DEPART O Spirit N., because thou hast diligently answered my demands, I do hereby license thee to depart, without injury to man or beast.\n\nDepart, I say, and be thou willing and ready to come, whensoever duly exorcised and con red by the Sacred Rites of Magic.\n\nI conjure thee to withdraw peaceably and quietly, and may the peace of God continue for ever between me and thee.\n\nAmen .\n\nGo not out of the circle till he be gone, but make prayers to God for the great blessing He has bestowed upon you by thus granting your desires and delivering you from the malice of the enemy.\n\nFor these verbose and tiresome conjurations the Latin version of Wierus substitutes one general form of citation, in the Name of the Christian Trinity, which is not really an especial anachronism, for the compiler of the Lemegeton was acquainted at least with the books of the New Testament.\n\nThis is proved by the references in the Second Conjuration to the Living Creatures of the Apocalypse, and it leaves the attribution to Solomon in precisely that state which our respect for a prince in Israel would naturally desire.\n\nNo doubt, however, the English editor of The Key Major of Magic would see no reason to question the attribution and would explain the anachronism very simply as a late interpolation.\n\nClick to view HELL MOUTH AND THE DEVIL CHAINED.\n\nFrom Cædmon ."


[content]
body = "If a man be the operator, she who wins will place herself in the arm-chair which you have set by the bed, and she will remain and commune with you until midnight, at which hour she will depart with her companions, without any need of dismissal.\n\nAs regards the two others, they will keep themselves by the fire, while the other entertains you.\n\nSo long as she remains you may question her upon any art or science, or upon what subject soever, and she will immediately give you a positive answer.\n\nYou may also inquire of her whether she is aware of any hidden treasure, and she will instruct you as to its locality and the precise time suited to its removal.\n\nShe will even appear there with her companions to defend you against the assaults of the Infernal Spirits who may have it in their possession.\n\nAt parting, she will present you with a ring, which, worn on the finger, will render you lucky at play, while if it be placed upon the finger of any woman or girl, you shall there and then have your will with them.\n\nObserve, however, that you must leave your window open in order that they may enter.\n\nThis ceremony may be repeated frequently at the will of the operator.\n\nIt must be acknowledged that the above experiment offers a large return for very small pains in the preparation, and hence it is very popular with the makers of Grimoires.\n\nThe same observation applies to the following process, which is common to the supplementary portions of the Grand Grimoire , the Grimorium Verum , the Grimoire of Honorius and most of the minor collections.\n\nIt is described as an experience of the wonderful power of the Superior Intelligences.\n\nThe nature of the superiority may, however, be inferred from the title.\n\nTO CAUSE A GIRL TO SEEK YOU OUT, HOWEVER PRUDENT SHE MAY BE Click to view Whether in the increase or wane of the Moon, a star must be observed between eleven o'clock and midnight.\n\nBut before beginning do as follows.\n\nTake a virgin parchment.\n\nWrite thereon her name whose presence you desire.\n\nThe parchment must be shaped as represented in the following figure.\n\nOn the other side inscribe these words: Melchiael , Bareschas .\n\nThen place your parchment on the earth, with the person's name against the ground.\n\nSet your right foot above it, while your left knee is bent to the earth.\n\nIn this position observe the brightest star in the firmament, holding in the right hand a taper of white wax, large enough to last for an hour, and recite the following CONJURATION I salute and conjure you, O beautiful Moon, O beautiful Star, O bright light which I hold in my hand!\n\nBy the air which I breathe, by the breath which is within me, by the earth which I touch, I conjure you, and by all the names of the spirits who are Princes residing in you; by the ineffable Name ON , Which hath created all; by thee, O Resplendent Angel Gabriel, together with the Prince Mercury, Michiael and Melchidael !\n\nI conjure you again by all the Divine Names of God, that you send down to obsess, torment and harass the body, spirit, soul and five senses of the nature of N., whose name is written here below, in such a way that she shall come unto me and accomplish my will, having no friendship for any one in the world, but especially for N., so long as she shall be indifferent to me.\n\nSo shall she endure not, so shall she be obsessed, so suffer, so be tormented.\n\nGo then, promptly; go, Melchidael, Baresches, Zazel, Firiel, Malcha , and all those who are without you (sic) .\n\nI conjure you by the great living God to accomplish my will, and I, N., do promise to satisfy you duly ."


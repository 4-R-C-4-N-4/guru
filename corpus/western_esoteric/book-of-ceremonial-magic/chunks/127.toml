[content]
body = "CHAPTER VI The Mysteries of Infernal Evocation according to the Grand Grimoire § 1.\n\nThe Rite of Lucifuge THE Grand Grimoire divides with the Grimoire of Honorius the darksome honour of an intelligible and unmutilated Ritual of Black Magic.\n\nEach after its own kind is indeed an exceedingly curious work.\n\nIn the first is contained what is probably the only printed method of making pacts; the second is remarkable, firstly, on account of its pretended origin and the elaboration with which it is set forth, secondly, for the ecclesiastical complexion of its process, which can scarcely have failed to impose upon some credulous and priestly sorcerers of the illiterate kind, and assuming their willingness to disgrace the vows of ordination.\n\nBoth require, in a study of the present kind, to be printed almost in extenso, and, setting aside their preliminary portions, already adequately dealt with, they are given practically verbatim in the chapters which here follow.\n\nIt will be remembered that the operator, or Karcist, as he is termed in the Grand Grimoire , is recommended continence, fasting and similar privations for an entire quarter of the moon, such quarter coinciding with that of the luminary.\n\nOn the morning which succeeds the first night of the quarter, he must repair to a druggist's, and purchase a blood-stone, called Ematille [paragraph continues] ( id est, Hæmatites ), which must be carried continually about him for fear of accident, and in expectation that the spirit whom it is proposed to compel and bind will henceforth do all in his power to overwhelm the operator with terror, so as to incite him to abandon the enterprise, hoping in this manner to escape from the wiles which are beginning, to be woven about him.\n\nThe next operation is the purchase of a virgin kid, which must be decapitated on the third day of the moon.\n\nPreviously to the sacrifice, a garland of vervain must be wound about the neck of the animal, immediately below the head, and secured by means of a green ribbon.\n\nThe sacrifice must be offered on the scene of the coming evocation, a forlorn and isolated spot free from all interruption.\n\nThere, with the right arm bared to the shoulder, having armed himself with a blade of fine steel, and having kindled a fire of white wood, the Karcist shall recite the following words in a hopeful and animated manner:-- INITIAL OFFERING I immolate this victim to Thee., O grand ADONAY, ELOIM, ARIEL and JEHOVAM , to the honour, glory and Power of Thy Name, which is superior to all Spirits.\n\nO grand ADONAY I Vouchsafe to receive it as an acceptable offering.\n\nAmen .\n\nHere he must cut the throat of the kid, skin it, set the body on the fire and reduce it to ashes, which must be collected and cast towards the rising of the sun, at the same time repeating the following words:-- It is to the honour, glory and dominion of Thy Name, O grand ADONAY, ELOIM.\n\nARIEL, JEHOVAM , that I spill the blood of this victim!\n\nVouchsafe, O Thou grand ADONAY , to receive its ashes as an acceptable sacrifice .\n\nWhile the victim is being consumed by the flames, the operator shall rejoice in the honour and glory of the grand ADONAY, ELOIM, ARIEL and JEHOVAM, taking care to preserve the skin of the virgin kid to form the round or grand Kabalistic circle, in which he must himself stand on the day of the supreme enterprise.\n\nThe sacrifice of the victim is followed by the selection and composition of the Blasting Rod, of which a description has been given."


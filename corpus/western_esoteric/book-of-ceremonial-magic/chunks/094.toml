[content]
body = "The same work gives particulars concerning the extraction of the sword-feather from the right wing of a swallow, preceding the action with the words Yin He .\n\nIt should then be made into a pen by means of the Knife of the Art, and the name Anereton must be written on it with the goose-quill, after which the Psalms Ecce quam bonum et quam jucundum and Laudate Dominum ommes gentes are to be recited over it, followed by aspersion and fumigation.\n\nIt is not to be supposed that any ordinary ink could be suitable for so serious a business as that of engrossing pacts.\n\nEven the consecrations previously given are inadequate in such a case.\n\nIt is understood that the signature is written with the blood of the operator, but the deed itself requires a special preparation, as follows:--Place river-water in a new, varnished earthenware pot, together with the powder hereinafter described.\n\nThen take sprigs of fern gathered on the Eve of St.\n\nJohn and vine twigs cut in the full moon of March.\n\nKindle this wood.\n\nby means of virgin paper, and when the water boils the ink will be made.\n\nIt must be changed each time that there is occasion to write, that is to say, whensoever the appellation of a spirit is undertaken.\n\nPowder for Pact-Ink ℞ Gall-nuts 10 Oz.\n\nRoman Vitriol or Green Copperas 3 Oz.\n\nRock Alum or Gum Arabic 3 Oz.\n\nMake an impalpable powder, and when you would compose the ink, use as above described.\n\nThe authorities for this process are not the Grimoires proper but the collections of Magical Secrets which are sometimes appended to them but sometimes form independent works."


[content]
body = "It would also appear that parchment or vellum proper may be dispensed with in favour of:--( a .) The skin of some other animal, which would, however, involve a like process; or ( b .) the caul of a new-born child, which would, of course, possess the requisite virgin character, and was simply consecrated according to the following instructions, as found in True Black Magic .\n\nWhen you have succeeded in obtaining the caul of a newborn child, perfume the same with sweet odours and sprinkle it, after which say the following Psalms: Domine, exaudi oratiomem meam, and Domine, Deus meus, respice in me , with the conjuration hereunto attached:--BOSMELETIC, JEYSMY, ETH, HODOMOS, BELUREOS.\n\nO Lord, Who didst make all things in wisdom; Who didst choose Abraham, Thy first believer, and his seed hath multiplied like the stars of heaven; Who didst appear unto Moses, Thy servant, surrounded with flaming fire, and didst make known to him Thy names, which are HEIE, ACER, HEIE --that is to say, I am that I am; Who didst also lead forth Thy people dry-shod over the Red Sea; Who unto Moses, Thy servant, didst give the Law of Salvation on Mount Sinai; Who unto Solomon didst impart wisdom above the measure of men: I humbly adore Thy majesty and beseech Thy mercy, praying Thee to consecrate this skin by Thy virtue, O Most Holy ADONAY , Whose reign endureth for ever.\n\nAmen .\n\nAsperge the caul with the blessed water of the Art, place it in the silken cloth, and when working the exorcisms, the requisitions made to the spirits must be written on this skin, which should be fumigated with stinking odours."


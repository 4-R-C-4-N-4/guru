body = "Click to view CHARACTER OF CLISTHERET CLISTHERET makes day or night about thee at pleasure.\n\nClick to view CHARACTER OF SIRCHADE SIRCHADE has power to shew thee all kinds of animals, of whatsoever nature they may be.\n\nClick to view CHARACTER OF SEGAL SEGAL causes all manner of prodigies visibly, both natural and supernatural.\n\nClick to view CHARACTER OF HIEPACTH HIEPACTH will bring thee a distant person in an instant.\n\nClick to view CHARACTER OF HUMOTS HUMOTS can transport all manner of books for thy pleasure.\n\nClick to view CHARACTER OF FRUCISSIERE FRUCISSIERE brings the dead to life.\n\nClick to view CHARACTER OF GULAND GULAND can cause all varieties of disease.\n\nClick to view CHARACTER OF SURGAT SURGAT opens all locks.\n\nClick to view CHARACTER OF MORAIL MORAIL has the power to make everything in the world invisible.\n\nClick to view CHARACTER OF FRUTIMIERE FRUTIMIERE dights thee all kinds of festivals.\n\nClick to view CHARACTER OF HUICTIIGARA HUICTIIGARA occasions sleep and waking in some, and afflicts others with insomnia.\n\nSATANACHIA and SATANICÆ govern forty-five, or, as some say, fifty-four demons, four of whom are Sergutthy, Heramael, Trimasel and Sustugriel .\n\nTwo of these rank as chief.\n\nThe rest are of no great importance.\n\nThese are serviceable spirits, who act easily and quickly, provided that they are content with the operator.\n\nSergutthy has power over wives and virgins, when the occasion is favourable.\n\nHeramael teaches the art of medicine, gives absolute knowledge of all diseases, with their full and radical cure, makes known all plants in general, the places where they grow, the times of their gathering, their virtues also and their composition for the attainment of a perfect cure.\n\nTrimasel teaches chemistry and all sleight of hand.\n\nHe imparts the true secret for confecting the powder of projection which changes imperfect metals--lead, iron, pewter, copper and quicksilver--into true good silver and good gold, namely, Sun and Moon, according to the ferment thereof.\n\nOnly he must be satisfied with the operator, if the operator would be satisfied with him.\n\nSustugriel teaches magical art; he gives familiar spirits for all things that can be desired, and furnishes mandragores.\n\nAgalierept and Tarihimal govern Elelogap , whose power is over water.\n\nThe two Nebirots rule Hael and Sergulath .\n\nHael instructs in the art of writing all kinds of letters, gives an immediate power of speaking all kinds of tongues and explains the most secret things.\n\nSergulath furnishes every manner of speculation, teaches tactics and the breaking of hostile ranks.\n\nThey have eight powerful inferiors.\n\n1.\n\nProculo , who gives sleep for twenty-four hours, with knowledge of the spheres of sleep.\n\n2.\n\nHaristum , who gives the power of passing unsinged through the fire.\n\n3.\n\nBrulefer , who makes one loved by women.\n\n4.\n\nPentagonony , who renders invisible and also beloved by great lords.\n\n5.\n\nAglasis , who transports through the whole world.\n\n6.\n\nSidrargrosam , who makes girls dance stark naked, 7.\n\nMinoson , who insures winning in all games.\n\n8.\n\nBucon , who has the power to excite hatred and jealousy between the two sexes."


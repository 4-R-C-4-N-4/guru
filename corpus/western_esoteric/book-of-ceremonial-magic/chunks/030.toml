[content]
body = "The sources of occult wisdom, it proceeds, are, firstly, in God; secondly, in spiritual essences--that is to say, the Angelical Hierarchy; thirdly, in corporeal creatures, the reference being probably to the signatura rerum of Paracelsus; fourthly, in Nature--that is to say, in a knowledge of the secret virtues of natural things, as, for example, herbs and precious stones; fifthly, but after a long interval, in the apostate spirits reserved to the last judgment; sixthly, in the administers of punishment in hell, which seems to connect with the classical conception of avenging infernal gods; seventhly, in the people of the elements, that is, the Salamanders, Sylphs, Undines and Gnomes or Pigmies.\n\nThe secrets deriving from these sources range from the highest achievements of reputed mystical science to the bourgeois ambitions of daily life, from the Regeneration of Enoch and the Knowledge of God, Christ and His Holy Spirit--wherein is the perfection of the Microcosm--to the attainment of honours and dignities, the ingathering, of much money, the foundation of a family, good fortune in mercantile pursuits, and successful housewifery both in town and country.\n\nThe prolongation of life, the transmutation of metals and the talismanic cure of all diseases, with other \"paradoxes of the highest science,\" also figure in the list.\n\nMeditation, inward contemplation and the love of God are the chief aids to the acquisition of Magical Art, together with great faith, strict taciturnity and even justice in the things of daily life.\n\nFinally, a true magician is brought forth as such from his mother's womb; others who assume the function will be unhappy.\n\nClick to view CHARACTER OF ARATRON The powers and offices of the Seven Olympic Spirits are as follows: ARATRON governs those things which are ascribed astrologically to Saturn.\n\nHe can convert any living organism, plant or animal into stone, and that in a moment of time; he can also change coals into treasure and treasure into coals; he gives familiars and reconciles subterranean spirits to men; he teaches Alchemy, Magic and Medicine, imparts the secret of invisibility, makes the barren fruitful and, lastly, confers long life.\n\nHe should be invoked on a Saturday, in the first hour of the day, making use of his character, given and confirmed by himself.\n\nClick to view THE CHARACTER OF BETHOR The affairs of Jupiter are administered by BETHOR, who responds quickly when called.\n\nThe person dignified by his character may be exalted to illustrious positions and may obtain large treasures.\n\nHe reconciles the Spirits of the Air to man, so that they will give true answers, transport precious stones and compose medicines having miraculous effects.\n\nBETHOR also grants familiars of the firmament, and can prolong life to seven hundred years, subject to the will of God, which qualification imparts an air of caution.\n\nClick to view THE CHARACTER OF PHALEG PHALEG governs the things that are attributed to Mars.\n\nThe person who possesses his character is raised by him to great honour in military affairs.\n\nClick to view THE CHARACTER OF OCH Solar interests are administered by OCH, who prolongs life to six hundred years, with perfect health therein.\n\nHe imparts great wisdom, gives excellent (familiar) spirits, composes perfect medicines, converts any substance into the purest of metals, or into precious stones; he also bestows gold and a purse, quaintly described by the English translator of the Arbatel as \"springing with gold.\" He causes the possessor of his character to be worshipped as a god by the kings of the whole world."


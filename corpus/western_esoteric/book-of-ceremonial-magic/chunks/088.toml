[content]
body = "§ 2.\n\nA General Instruction concerning the Instruments required for the Art Most Goëtic rituals specify with considerable minuteness the instruments which are required for the operations, and in these respects, but with variations peculiar to themselves, and distinguishing them also from one another, they follow the authority of the Key of Solomon .\n\nPeter de Abano tells us nothing concerning them, nor yet pseudo-Agrippa, with the one exception of the sword, which, following a physical analogy, seems to be universal in practical magic.\n\nIn the Grimoires, however, though sometimes the first weapon to be mentioned, its position is comparatively insignificant, as the knife is a readier instrument.\n\nSpeaking generally, there is little in the literature to justify the complex modern elaborations of Éliphas Lévi and of Christian.\n\nAmong the necessary properties mentioned by the Book of True Black Magic are the sword, the staff, the rod, the lancet, the arctrave or hook, the bolline or sickle, the needle, the poniard, a white-handled knife and another knife, with a black handle, used to describe the circle.\n\nThe most important to make is that called the bolline; it must be forged on the day and in the hour of Jupiter, selecting a small piece of unused steel.\n\nSet it thrice in the fire and extinguish it in the blood of a mole mixed with the juice of the pimpernel.\n\nLet this be done when the Moon is in her full light and course.\n\nOn the same day and in the hour of Jupiter, fit a horn handle to the steel, shaping it with a new sword forged thrice as above in the fire.\n\nWhen made and perfected, recite over it this PRAYER OR CONJURATION I conjure thee, O form of this instrument, by the authority of God the Father Almighty, by the virtue of Heaven and the stars, by the virtue of the Angels, by that of the elements, by that of stones and herbs, and in like manner by the virtue of snowstorms, thunder and winds, that thou receive all power unto the performance of those things in the perfection of which we are concerned, the whole without trickery, falsehood or deception, by the command of God, Creator of the ages and Emperor of the Angels.\n\nAmen .\n\nThe ensuing salutations must then be pronounced over the instrument: Domine, Deus meus, in te speravi; Confitebor tibi, Domine, in toto corde meo: Quemadmodum desiderat cervus ad fontes aquarum , &c., adding the following words: DAMAHII, LUMECH, GADAL, PANCIA, VELOAS, MEOROD, LAMIDOCH, BALDACH, ANERETHON, MITATRON, most holy angels, be ye wardens of this instrument, because I shall make use of it for several necessary works .\n\nPlace it in a new wrapper of red silk, making suffumigation with odoriferous perfumes, as will be hereinafter set forth.\n\nTake care not to perfect the instrument otherwise than on the day of Venus, and in the hour thereof, when also the needle and other like instruments may be prepared.\n\nSubsequently, on the day of Venus, the Moon being in the sign of Capricorn, or otherwise of the Virgin, if the same be possible, thou shalt make the first knife and shalt steep it in the blood of the mole and the juice of the pimpernel.\n\nLet the Moon be in an acute time of course and light, the operation beginning in the first hour of Venus and ending at the ninth hour of the same day."


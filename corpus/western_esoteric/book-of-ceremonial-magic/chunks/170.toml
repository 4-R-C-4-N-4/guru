[content]
body = "Then, cutting down the carcase from the tree, they shall lay its head towards the east; in the space that this following conjuration is repeating, they shall set a chafing-dish of fire at its right hand, into which they shall pour a little wine, some mastic and some gum-aromatic, and lastly [the contents of] a vial full of the sweetest oil.\n\nThey shall have also a pair of bellows and some unkindled charcoal to make the fire burn bright when the carcase rises.\n\nThe conjuration is this:-- I conjure thee, thou Spirit of N., that thou do immediately enter into thy ancient body again and answer to my demands; by the virtue of the Holy Resurrection, and by the posture of the body of the Saviour of the world, I charge thee, I conjure thee, I command thee, on pain of the torments and wandering of thrice seven years.\n\nwhich I, by the force of sacred magic rites, have power to inflict upon thee; by thy sighs and groans I conjure thee to utter thy voice.\n\nSo help thee God and the prayers of the.\n\nHoly Church.\n\nAmen .\n\nThis ceremony being thrice repeated, while the fire is burning with mastic and gum-aromatic, the body will begin to rise, and at last will stand upright before the exorcist, answering with a faint and hollow voice the questions propounded unto it: why it destroyed itself, where its dwelling is, what its food and life are, how long it will be ere it enter into rest, and by what means the magician may assist it to come to rest; also of the treasures of this world, where they are hid.\n\nMoreover, it can answer very punctually concerning the places where ghosts reside, and of the manner of communicating with them, teaching the nature of Astral Spirits and hellish beings so far as its capacity alloweth.\n\n[paragraph continues] All this when the ghost hath fully answered, the magician ought out of commiseration and reverence to the deceased, to use what means can possibly be used for procuring rest unto the spirit, to which effect he must dig a grave, and, filling the same half full of quick-lime, with a little salt and common sulphur, must put the carcase naked into it.\n\nNext to the burning of the body into ashes, this is of great force to quiet and end the disturbance of the Astral Spirit.\n\nBut in this and in all cases where the ghosts or apparitions of deceased persons are raised up and consulted, great caution is to be observed by the Magician to keep close within the circle; for if, by the constellation and position of the stars at his nativity, he be in the predicament of those who follow the Black Art for iniquitous purposes, it is very dangerous to conjure any spirits without describing the form of the circle, and wearing upon the heart, or holding in the hand, the Pentacle of Solomon.\n\nFor the ghosts of men deceased can easily effect sudden death to the magician born under such a constellation of the planets, even whilst in the act of being exorcised.\n\nIt must be confessed that this process is grim and depressing, and the occult student will not envy the sorcerer at the first palpitation of the corpse.\n\nYet the rite is methodical, and even sober, when compared with the monstrous alternative of the Grand Grimoire , which must be given on the authority of Lévi; for no available editions of the work which is in question, nor yet of the Red Dragon , nor indeed any ritual of my acquaintance, contains it.\n\nThere is reasonable probability that he invented it to make out his case at the moment."


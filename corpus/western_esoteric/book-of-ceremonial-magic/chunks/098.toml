[content]
body = "But first let the salt be blest in the following manner:-- EXORCISM OF THE SALT I exorcise thee, creature of salt, by the living, God, by the God of gods and the Lord of lords, that all illusions may depart from thee, and that so thou mayst serve to make the virgin chart .\n\nBENEDICTION OF THE SALT God of gods and Lord of lords, Who hast created all things out of nothing, and hast especially designed salt for human health, bless ✠ and sanctify this salt, and may I so use it that all things which are in this circle may receive the required virtue for that effect which we desire.\n\nAmen .\n\nThis ended, place your salted skin in the rays of the sun for the space of one day.\n\nThen prepare a vessel of glazed clay and write the characters of Guland and Surgat (Chap.\n\nIII.\n\nSec.\n\n2) about it with the pen and ink of the Art.\n\nSet quicklime slaked with exorcised water in the pot, and while it is liquid place your skin therein, and so leave it till it peels of itself.\n\nWhen the hair is ready to fall at the touch of a finger, take it from the pot and peel it with a knife of hazel-wood, over which you have pronounced these words: Host Holy ABOEZRA , be pleased to impart such virtue unto this wood that I may cleanse this skin therewith, through Thy Holy Name AGASON .\n\nAmen .\n\nThis done, and the skin being also cleansed, stretch the same upon a board of new wood, and round about it set stones of the same length as the sides of the skin.\n\nBut first say over them the prayer which here follows PRAYER O ADONAY, most strong and powerful God, grant that these stones may stretch this skin, and do Thou remove from them all illusion, so that by Thy power they may possess the virtue which we desire.\n\nAmen .\n\nThis done, the skin may be left to dry, but before quitting it recite the following PRAYER JE, AGLA, JOD, HOI, HE, EMMANUEL, be ye guardians of this parchment or skin, so that no phantoms may possess it .\n\nThis finished, leave it in the air until it be dried, taking care that the place is clean and has been asperged while reciting the following holy words: In the name of the immortal God, may God asperge thee and cleanse thee from all delusion and from all wickedness; so shall thou be whiter than snow.\n\nAmen .\n\nWhen the skin is dry, take it from the board, bless it with aspersion and fumigation, and preserve it for use.\n\nIt must not be seen by women, especially in their times, for it will lose its virtue, and whosoever makes this parchment must be, in like manner, most pure and clean and chaste.\n\nLet him say a Mass of the Nativity, whether it be the day of the Feast or another day, and note that all the instruments must be generally on the Altar.\n\nThe Book of True Black Magic reproduces with further variations the process of the genuine Clavicle:--Secure the animal which is to furnish the parchment in a secret place, where no one dwells or can behold it.\n\nThen take a virgin rod; shape it into the form of a knife with the white-handled Knife of the Art, paring it neatly of all branches.\n\nOver this say: I conjure thee, Rod, by the Creator of the Universe and the King of Angels, Whose name is HELSADAY!\n\nReceive thou power and virtue to skin this animal for the making of the parchment, that so all things which I shall write thereon may prosper, by God Almighty, Who liveth and reigneth for ever and ever."


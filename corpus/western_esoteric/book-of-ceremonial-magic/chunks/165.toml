[content]
body = "§ 7.\n\nConcerning the Mirror of Solomon, suitable for all Kinds of Divination The following process is found in the Grimorium Verum and in some other compilations.\n\nIt is a mode of divination akin to that given in the preceding section.\n\nIt does not connect with Black Magic except by the use of blood and is really an auto-hypnotic experiment fortified by conventional ceremonies.\n\nTo Compose the Mirror of Solomon In the Name o the Lord, Amen.\n\nYe shall behold in this mirror all things whatsoever that ye may desire.\n\nIn the Name of the Lord Who is blessed, in the Name of the Lord, Amen .\n\nIn the first place, ye shall do no fleshly actions, nor sin in thought or deed, during the period hereinafter prescribed.\n\nIn the second place, ye shall perform many good works of piety and mercy.\n\nIn the third place, take a shining and well-polished plate of fine steel, slightly concave, and with the blood of a white pigeon inscribe thereon--to wit, at the four corners--the names JEHOVA, ELOYM, METATRON, ADONAY.\n\nPlace the said steel in a clean and white cloth.\n\nNow, when ye shall behold the new moon during the first hour after sunset, draw nigh unto a window, look up to Heaven with devotion, and say: O Eternal!\n\nO King Eternal!\n\nGod ineffable!\n\nThou Who hast created all things for love of men, and by a secret judgment for the health of man, do Thou deign to look upon me, N., Thy most unworthy servant, and upon this my intention.\n\nVouchsafe to send unto me Thine Angel ANAËL , even upon this mirror, who doth order, command and ordain his companions and Thy subjects, whom Thou hast made, O Thou Almighty Click to view [paragraph continues] Lord, Who hast been, Who art, Who shall remain eternally, that in Thy Name they may judge and act justly, instructing me in all that I shall require of them .\n\nLastly, cast upon burning coals a suitable perfume, and while casting it say: In this, by this, and with this, which I pour out before Thy face, O God, my God, Who art blessed , Three and One, and in the most sublime exaltation, Who sittest above the Cherubim and above the Seraphim, Who wilt judge the world by fire, hear Thou me!\n\nRepeat this three times, and having done so, breathe also thrice upon the mirror, and say: Come, ANAËL , come, and may it be thy good pleasure to be with me by thy will, in the Name ✠ of the Father most mighty, in the Name ✠ of the Son most wise, in the Name of the Holy Spirit most living!\n\nCome, ANAËL , in the Name of the terrible Jehovah!\n\nCome, ANAËL , by the virtue of the immortal Elohim!\n\nCome, ANAËL , by the right arm of the almighty METATRON !\n\nDo thou come unto me, N.\n\n(here repeat your name over the mirror), and so command thy subjects that in love, joy and peace, they may make manifest unto my eyes the things which are hidden from me.\n\nSo be it.\n\nAmen .\n\nHaving said and done as above, lift your eyes to heaven and say: O Lord Almighty, Who dost cause all things to move according to Thy good pleasure, hear Thou my prayer, and may my desire be agreeable unto Thee!"


[content]
body = "§ 2.\n\nConcerning the Rite of Conjuration, from the Lemegeton In communicating with the seventy-two spirits, the age of the Moon should be observed, for it is affirmed on the authority of Solomon that all days are profitable save the second, fourth, sixth, ninth, tenth, twelfth or fourteenth of that luminary.\n\nThe seals must be made of metals; those of the chief kings should be of gold; marquises, of silver; dukes, of copper; prelates, of tin or silver; knights, of lead; presidents, of fixed quicksilver; and earls, of silver and copper in equal parts.\n\nThe entire cohort is governed by AMAYMON, King of the Click to view THE DOUBLE SEAL OF SOLOMON East; CORSON, King of the West; ZIMINAR, King of the North; and GAAP, King of the South.\n\nThese may be bound from 9 A.M.\n\ntill noon, but, except on occasions of great importance, should not be invoked themselves, as they act commonly by their inferiors.\n\nMarquises may be bound from 3 to 9 P.M.\n\nand from sunset to sunrise; dukes from sunrise till noon, in clear weather; prelates in any hour of the day; knights only from dawn till sunrise, or from 4 P.M.\n\ntill sunset; presidents in any daylight hour up to the evening twilight; counts and earls in any hour of the day, but it must be in the woods and forests, or in a place that is free from noise and far from the resort of Click to view THE PENTAGRAM OF SOLOMON men.\n\nThe ceremonial circle must be drawn towards that side to which the spirit who is to be called is attributed.\n\nThe triangle into which Solomon summoned the rebellious demons must be made two feet outside this circle and three feet over it.\n\nThe double seal and pentagram of Solomon must be drawn on a parchment of calf-skin, or otherwise on gold or silver, Click to view THE MAGICAL CIRCLE and should be worn upon the white vestment of the operator, together with the seal of the spirit, which must be exhibited on his appearance--to compel obedience and assumption of the human form.\n\nIn addition to these characters, the secret seal of Solomon must be drawn with the blood of a black cock that has never engendered, on virgin parchment, the operator himself being clean within and without, having abstained from sexual intercourse for the space of one month and having Click to view MAGICAL SWORDS AND WAND obtained pardon for his sins by means of fasting and prayer.\n\nIt is to be composed on a Tuesday or Saturday at midnight, with the Moon increasing in Virgo, and with burning of perfumes of aloes, resin, cedar and alum.\n\nThe other directions correspond broadly to those prescribed in the second chapter.\n\nThere is the rod or sceptre; the sword; the mitre or cap; a long robe of white linen; a girdle of lion's skin, three inches wide and inscribed with the names which appear in the outer circle of practice; material for the fumigations; oil to anoint the temples and eyes; and clean water for the ablution.\n\nThe Prayer at Lustration is simply the versicle of David:-- Thou shall purge me with hyssop, O Lord, and I shall be cleansed; Thou shall wash me and I shall be made whiter than snow ."


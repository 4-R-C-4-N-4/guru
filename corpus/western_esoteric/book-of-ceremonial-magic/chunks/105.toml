[content]
body = "SATANACHIA.--Commander-in-Chief.\n\nAGALIAREPT.--Another Commander.\n\nFLEURETY.--Lieutenant-General.\n\nSARGATANAS.--Brigadier-Major.\n\nNEBIROS.--Field-Marshal and Inspector-General.\n\nIt will be seen that the principalities of Infernus are chiefly represented in the light of a standing army, yet their interference in earthly matters is not of a military kind.\n\nLUCIFUGE ROFOCALE has the control, with which Lucifer has invested him, over all the wealth and treasures of the world.\n\nHis subordinates are Baal , Agares and Marbas.\n\nThe grand SATANACHIA has the power of subjecting all wives and maidens to his wishes, and of doing with them as he wills.\n\nHis subordinates are Pruslas , Aamon and Barbatos .\n\nAGALIAREPT has the faculty of discovering arcane secrets in all the courts and council-chambers of the world; he also unveils the most sublime mysteries.\n\nHe commands the Second Legion of Spirits, and his subordinates are Buer , Gusoyn and Botis .\n\nFLEURETY has the power to perform any labour during the night and to cause hailstones in any required place.\n\nHe controls a prodigious army of spirits, and has Bathsin (or Bathim ), Pursan and Eligor as his subordinates.\n\nSARGATANAS has the power to make any person invisible, to transport him anywhere, to open all locks, to reveal whatsoever is taking place in private houses, to teach all the arts of the shepherds.\n\nHe commands several Brigades of Spirits, and has Zoray , Valefar and Faraii for his immediate inferiors.\n\nNEBIROS has the power to inflict evil on whomsoever he will; he discovers the Hand of Glory and reveals every virtue of metals, minerals, vegetables, as also of all animals, both pure and impure.\n\nHe possesses the art of predicting things to come, being one of the greatest Necromancers in all the Infernal Hierarchies; he goes to and fro everywhere and inspects the hordes of perdition.\n\nHis immediate subordinates are Ayperos , Naberrs and Glassyalabolas .\n\nIt is added that there are millions of other spirits in subjection to those which have been mentioned, but their enumeration serves no purpose, as they are required only when it pleases the superiors to employ them in their own place, for the latter make use of all the inferior Intelligences like workmen or slaves.\n\nThe Grimorium Verum , however, mentions seventeen of the most important subordinate spirits, who seem to correspond with the ministers of the six great leaders mentioned above, but there is little unanimity among makers of magical rituals, whether white or black.\n\nClick to view CHARACTER OF CLAUNECK CLAUNECK has power over goods and riches; he can discover hidden treasures to him who makes pact with him; he can bestow great wealth, for he is well loved by Lucifer.\n\nHe brings money from a distance.\n\nObey him, and he will obey thee.\n\nClick to view CHARACTER OF MUSISIN MUSISIN has power over great lords; he instructs them in all that passes in the Republics and the realms of the Allies.\n\nClick to view CHARACTER OF BECHARD BECHARD has power over winds and tempests, over lightning, hail and rain, by means of a charm with toads and other things of this nature, &c.\n\nClick to view CHARACTER OF FRIMOST FRIMOST has power over wives and maids, and will help thee to enjoy them.\n\nClick to view CHARACTER OF KHIL KHIL occasions great earthquakes.\n\nClick to view CHARACTER OF MERSILDE MERSILDE can transport thee instantaneously wheresoever may be desired."


[content]
body = "CONJURATION TO LUCIFER LUCIFER ✠, OUYAR ✠, CHAMERON ✠, ALISEON ✠, MANDOUSIN ✠, PREMY ✠, ORIET ✠, NAYDRUS ✠, ESMONY ✠, EPARINESONT ✠, ESTIOT ✠, DUMOSSON ✠, DANOCHAR ✠, CASMIEL ✠, HAYRAS ✠, FABELLERONTHON ✠, SODIRNO ✠, PEATHAM ✠, Come ✠, LUCIFER ✠.\n\nAMEN.\n\nCONJURATION FOR BEELZEBUTH BEELZEBUTH ✠, LUCIFER ✠, MADILON ✠, SOLYMO ✠, SAROY ✠, THEU ✠, AMECLO ✠, SEGRAEL ✠, PRAREDUN ✠, ADRICANOROM ✠, MARTIRO ✠, TIMO ✠, CAMERON ✠, PHORSY ✠, METOSITE ✠, PRUMOSY ✠, DUMASO ✠, ELIVISA ✠, ALPHROIS ✠, FUBENTRONTY ✠, Come , BEELZEBUTH ✠.\n\nAMEN.\n\nCONJURATION FOR ASTAROTH ASTAROTH ✠, ADOR ✠, CAMESO ✠, VALUERITUF ✠, MARESO ✠, LODIR ✠, CADOMIR ✠, ALUIEL ✠, CALNISO ✠, TELY ✠, PLEORIM ✠, VIORDY ✠, CUREVIORBAS ✠, CAMERON ✠, VESTURIEL ✠, VULNAVII ✠, BENEZ ✠, MEUS CALMIRON ✠, NOARD ✠, NISA CHENIBRANBO CALEVODIUM ✠, BRAZO ✠, TABRASOL ✠, Come ✠, ASTAROTH ✠.\n\nAMEN.\n\nHaving repeated seven times the conjuration addressed to one of these superior spirits, the same will forthwith manifest to perform whatsoever shall be desired.\n\nNOTE.--Such conjuration must have been written on virgin paper or parchment before invoking the spirits.\n\nThese, having been satisfied, may be dismissed by using the following DISCHARGE Go in peace unto your places; may peace be with you, and be ye ready to come whensoever I shall call upon you, In the Name of the Father ✠ and of the Son ✠ and of the Holy Ghost ✠.\n\nAmen.\n\nCONJURATION FOR INFERIOR SPIRITS O SURMY ✠, DELMUSAN ✠, ATALSLOYM ✠, CHARUSIHOA ✠, MELANY ✠, LIAMINTHO ✠, COLEHON ✠, PARON ✠, MADOIN ✠, MERLOY ✠, BULERATOR ✠, DONMEO ✠, HONE ✠, PELOYM ✠, IBASIL ✠, MEON ✠, ALYMDRICTELS ✠, PERSON ✠, CRISOLSAY ✠, LEMON SEFLE NIDAR HORIEL PEUNT ✠, HALMON ✠, ASOPHIEL ✠, ILNOSTREON ✠, BANIEL ✠, VERMIAS ✠, ESLEVOR ✠, NOELMA ✠, DORSAMOT ✠, LHAVALA ✠, OMOT ✠, FRANGAM ✠, BELDOR ✠, DRAGIN ✠, Come ✠."


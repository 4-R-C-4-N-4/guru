[content]
body = "Thus: Go, all Spirits accursed, who are condemned to the flame eternal which is Prepared for you and your companions, if ye be rebellious and disobedient.\n\nI conjure you by the same authority, I exhort and call you, I constrain and command you, by all the Powers of your superior demons, to come, obey and reply positively to what I direct you, in the Name of Jesus Christ.\n\nWhence, if you or they do not obey promptly and without tarrying, I will shortly increase your torments for a thousand years in hell.\n\nI constrain you therefore to appear here in comely human shape, by the Most High Names of God, HAIN, LON, HILAY, SABAOTH, HELIM, RADISHA, LEDIEHA, ADONAY, JEHOVA, YAH, TETRAGRAMMATON, SADAI, MESSIAS, AGIOS, ISCHYROS, EMMANUEL, AGLA , Jesus Who is ALPHA and OMEGA , the beginning and the end, that you be justly established in the fire, having no Power to reside, habit or abide in this Place henceforth; and I require your doom by the virtue of the said Names, to wit, that St.\n\nMichael drive you to the uttermost of the infernal abyss, in the Name of the Father, and of the Son, and of the Holy Ghost.\n\nSo be it .\n\nI conjure thee, Acham , or whomsoever thou mayest be, by the Most Holy Names of God, by MALHAME, JAE, MAY, MABRON, JACOB, DASMEDIAS, ELOY, ATERESTIN, JANASTARDY, FINIS, AGIOS, ISCHYROS, OTHEOS, ATHANATOS, AGLA, JEHOVA, HOMOSION, AGA, MESSIAS, SOTHER, CHRISTUS VINCIT, CHRISTUS IMPERAT, INCREATUS SPIRITUS SANCTUS.\n\nI conjure thee, Cassiel , or whomsoever thou mayest be, by all the said names, with power and with exorcism!\n\nI warn thee by the other Sacred Names of the most great Creator, which are or shall hereafter be communicated to thee; hearken forthwith and immediately to my words, observe them inviolably, as sentences of the last dreadful day of judgment, which thou must obey inviolately, nor think to repulse me because I am a sinner, for therein shall thou repulse the commands of the Most High God.\n\nKnowest thou not that thou art bereft of thy powers before thy Creator and ours?\n\nThink therefore what thou refusest, and pledge therefore thine obedience, swearing by the said last dreadful day of judgment and by Him Who hath created all things by His word, Whom all creatures obey.\n\nP.\n\nper sedem Baldarey et per gratiam et diligentiam tuam habuisti ab eo hanc nalatimanamilam , as I command thee .\n\nClick to view HORUS-RA, WEARING THE SOLAR DISC AND URÆUS ."


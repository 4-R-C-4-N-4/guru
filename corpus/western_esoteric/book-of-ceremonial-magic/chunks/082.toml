[content]
body = "§ 3.\n\nConcerning Continence and Abstinence The Fourth Book of Occult Philosophy , referred to Cornelius Agrippa, but composite in character and spurious in attribution, as already seen, gives an exceedingly curious explanation of the rule of sanctity prescribed by all forms of Ceremonial Magic.\n\nThe instruments used in the Art are ineffective without consecration.\n\nThe act of consecration is the act by which virtue is imparted to them, and this virtue derives from two sources, the power of sanctification residing in Divine Names and in the prayers which incorporate them, and the power of sanctification residing in the holiness of the person consecrating.\n\nAn indispensable part of this holiness was the preservation of chastity for a defined-but, it should be observed, a limited-period preceding operation, and it was to be combined with a fast of graduated severity.\n\nIn their directions concerning these points the Rituals of Black Magic differ little from their prototypes, the earlier Keys of Solomon, the work of pseudo-Agrippa, or The Magical Elements of Peter de Abano.\n\nHere is the direction of the Neophyte which occurs in the Grand [paragraph continues] Grimoire : \"You must abstain during an entire quarter of the moon from the society of females, so as to protect yourself from the possibility of impurity.\n\nYou must commence your magical quarter at the same moment with that of the luminary itself, by a pledge to the Grand Adonai, who is the Master of all Spirits, to make no more than two collations daily, that is to say, in every twenty-four hours of the said quarter of the Moon, which collations should be taken at noon and midnight, or, if it better please you, at seven o'clock in the morning and at the corresponding hour in the evening, using the following prayer previously to each repast during the whole of the said quarter:-- PRAYER I implore Thee, O Thou Grand and Powerful ADONAY , Master of all Spirits!\n\nI beseech Thee, O ELOIM !\n\nI implore Thee, O JEHOVAH !\n\nO Grand ADONAY , I give unto Thee my soul, my heart, my inward parts, my hands, my feet, my desires, my entire being!\n\nO Grand ADONAY , deign to be favourable unto me!\n\nSo be it.\n\nAmen .\n\nThen take your repast, disrobe as seldom and sleep as little as possible during the whole of the said period, but meditate continually on your undertaking, and centre all your hopes in the infinite goodness of the Great Adonay.\n\nThe Grimoire of Honorius , which is intended exclusively for persons in Holy Orders, restricts the period of fasting to three days, as will be seen later on, and makes no condition of continence in those who are devoted to celibacy.\n\nThe Grimorium Verum prescribes a similar period and adds that the fast should be most austere, that human society and human communications must be avoided as much as possible, but those of women especially.\n\nThe Book of True Black Magic varies the instruction as follows: If the Priest-Exorcist would succeed in operation, he must, when all things else are prepared, abstain from every labour of soul and body, from much eating and drinking, from all luxury, from all vice, and he must meditate on those things which he is about to put in practice for nine complete days before undertaking the work; his assistants--if any--must do in like manner, so that all may be truly fulfilled.\n\nLet them begin by the following prayer, which should be recited twice in the night and once in the day.\n\nPRAYER O Lord God Almighty, be Thou favourable unto us, though unworthy to lift our eyes to Heaven by reason of the multitude of our offences!"


[content]
body = "He shall then begin the Office of the Dead with Venite exultemus Domino , &c.\n\nHe shall recite Matins and Lauds, but in place of the versicle of the ninth Lesson he shall say: Deliver us, O Lord, from the fear of hell.\n\nLet not the demons destroy my soul when I shall raise them from the deep Pit, when I shall command them to do my will.\n\nMay the day be bright, may the sun and moon shine forth, when I shall call upon them.\n\nTerrible of aspect are they, deformed and horrible to sight; but do Thou restore unto them their angelic shapes when I shall impose my will upon them.\n\nO Lord, deliver me, from those of the dread visage, and grant that they shall be obedient when I shall raise them up from hell, when I shall impose my will upon them .\n\nAfter the Office of the, Dead the operator shall extinguish the taper, and at sunrise shall cut the throat of a male lamb of nine days, taking care that the blood does not gush forth upon the earth.\n\nHe shall skin the lamb, and shall cast its tongue and heart into the fire.\n\nThe fire must be freshly kindled, and the ashes shall be preserved for use at the proper time.\n\nThe skin of the lamb shall be spread in the middle of a field and for the space of nine days shall be sprinkled four times every day with holy water.\n\nOn the tenth day, before the rising of the sun, the lambskin shall be covered with the ashes of the heart and tongue, and with the ashes also of the cock.\n\nOn Thursday, after sunset, the flesh of the lamb shall be interred in a secret place where no bird can come, and the priest with his right thumb shall inscribe on the grave the characters here indicated:-- Click to view In the edition already cited the signs are varied thus:-- Click to view Moreover, for the space of three days he shall sprinkle the four corners with holy water, saying: Sprinkle me, O Lord, with hyssop, and I shall be cleansed!\n\nWash me, and I shall be made whiter than snow!\n\nAfter the aspersion let him recite the following prayer, kneeling with his face towards the east:-- PRAYER Christ Jesus, Redeemer of men, Who, being the Lamb without spot, wast immolated for the salvation of the human race, Who alone wast found worthy to open the Book of Life, impart such virtue to this lambskin that it may receive the signs which we shall trace thereon, written with Thy blood, so that the figures, signs and words may become efficacious; and grant that this skin may Preserve us against the wiles of the demons; that they may be terrified at the sight of these figures and may only approach them trembling.\n\nThrough Thee, Jesus Christ, Who livest and reignest through all ages.\n\nSo be it .\n\nThe Litanies of the Holy Name of Jesus must then be repeated, but instead of the Agnus Dei , substitute: Immolated Lamb, be Thou a Pillar of strength against the demons!\n\nSlain Lamb, give Power over the Powers of Darkness!\n\nImmolated Lamb, grant favour and strength unto the binding of the Rebellious Spirits.\n\nSo be it .\n\nThe lambskin shall be stretched for eighteen days, and on the nineteenth day the fleece shall be removed, reduced into powder and interred in the same place.\n\nThe word vellus shall be written above it with the finger, together with the following character and the words:-- May this which hath been reduced into ashes preserve against the demons through the name of Jesus ."


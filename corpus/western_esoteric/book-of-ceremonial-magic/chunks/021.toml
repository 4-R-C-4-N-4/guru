[content]
body = "§ 2.\n\nThe Distinction between White and Black Magic Having considered the possible standpoints from which the Rituals may be regarded, we come now to the distinctions that are made between them, and, first and foremost, to that which has been already mentioned and is artificially instituted between White and Black Magic.\n\nThe history of this distinction is exceedingly obscure, but there can be no question that in its main aspect it is modern--that is to say, in so far as it depends upon a sharp contrast between Good and Evil Spirits.\n\nIn Egypt, in India and in Greece, there was no dealing with devils in the Christian sense of the expression; Typhon, Juggernaut and Hecate were not less divine than the gods of the over-world, and the offices of Canidia were probably in their way as sacred as the peaceful mysteries of Ceres.\n\nEach of the occult sciences was, however, liable to that species of abuse which is technically but fantastically known as Black Magic.\n\nAstrology, or the appreciation of the celestial influences in their operation upon the nature and life of man, could be perverted in the composition of malefic talismans by means of those influences.\n\nEsoteric Medicine, which consisted in the application of occult forces to the healing of disease in man, and included a traditional knowledge of the medicinal properties resident in some substances disregarded by ordinary pharmacy, produced in its malpractice the secret science of poisoning and the destruction of health, reason or life by unseen forces.\n\nThe transmutation of metals by Alchemy resulted in their sophistication.\n\nIn like manner, Divination, or the processes by which lucidity was supposed to be induced, became debased into various forms of witchcraft and Ceremonial Magic into dealing with devils.\n\nWhite Ceremonial Magic is, by the terms of its definition, an attempt to communicate with Good Spirits for a good, or at least an innocent, purpose.\n\nBlack Magic is the attempt to communicate with Evil Spirits for an evil, or for any, purpose.\n\nThe contrasts here established seem on the surface perfectly clear.\n\nWhen we come, however, to compare the ceremonial literature of the two classes, we shall find that the distinction is by no means so sharp as might be inferred from the definitions.\n\nIn the first place, so-called Theurgic Ceremonial, under the pretence of White Magic, usually includes the Rites for the invocation of Evil Spirits.\n\nSupposing that they are so invoked for the enforced performance of works contrary to their nature, the issue becomes complicated at once, and White Magic must then be defined as the attempt to communicate with Good or Evil Spirits for a good, or at least for an innocent, purpose.\n\nThis, of course, still leaves a tolerably clear distinction, though not one that I should admit, if I admitted the practical side of the entire subject to anything but unconditional condemnation.\n\nYet the alternative between a good and an innocent object contains all the material for a further confusion.\n\nIt will be made clear as I proceed that the purposes and ambitions of Magic are commonly very childish, so that we must distinguish really between Black and White Magic, not as between the essentially good and evil, but as between that which is certainly evil and that which may only be foolish.\n\nNor does this exhaust the difficulty.\n\nAs will also be made evident in proceeding, White Ceremonial Magic seems to admit of a number of intentions which are objectionable, as well as many that are frivolous.\n\nHence it must be inferred that there is no very sharp distinction between the two branches of the Art.\n\nIt cannot be said, even, that Black Magic is invariably and White Magic occasionally evil.\n\nWhat is called Black Magic is by no means diabolical invariably; it is almost as much concerned with preposterous and stupid processes as the White variety with those of an accursed kind."


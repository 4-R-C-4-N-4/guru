[content]
body = "But Jesus said unto them: I am He.\n\nAnd Judas, who was to deliver Him, was with them.\n\nAs soon then as He had said unto them: I am He, they fell backward upon the earth.\n\nThen asked He them again: Whom seek ye?\n\nAnd they said: Jesus of Nazareth.\n\nJesus answered: I have told you that I am He; if therefore ye seek Me, let these go their way (speaking of His disciples).\n\nThe lance, the nails, the cross ✠ , the thorns, the death which I have endured, prove that I have effaced and expiated the crimes of the unfortunate.\n\nPreserve me.\n\nO Lord Jesus Christ, from all afflictions of Poverty and from the snares of my enemies.\n\nMay the five wounds of our Lord be unto me an everlasting remedy.\n\nJesus is the Way ✠ , Jesus is the Life ✠ , Jesus is the Truth ✠ , Jesus has suffered ✠ , Jesus has been crucified ✠ , Jesus, Son of the living God, have Pity on me ✠ .\n\nNow, Jesus passing went through the midst of them, and no one could place his murderous hand upon Jesus, because His hour was not yet come.\n\nWhile these prayers are in some respects curious enough, and may not be unreasonably termed pure and simple by their intention, they compare unfavourably with the sublimity and good sense which characterise those of the Roman Liturgy; they are inexact in their references and confused in their method, and no person who seriously considers them will sustain the early date which is claimed for them.\n\nTheir period is subsequent to the Renaissance, and the ignorance of liturgical formulæ which they shew, in common with all similar forgeries, makes it doubtful whether they are the work of an ecclesiastic at all.\n\nIn any case, they are clumsy imitations, the product of an unskilful hand."


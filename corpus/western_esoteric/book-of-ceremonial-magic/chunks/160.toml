[content]
body = "§ 4.\n\nConcerning the Hand of Glory No person who is familiar with the humours of Ingoldsby will have forgotten the wondrous legend of the Hand of Glory, which includes a transcript from the Grimoires.\n\nIt is less generally known that there are two processes, serving distinct uses, and there can be little doubt that they should both be in the possession of every well-equipped operator who is anxious to test the virtues of White and Black Magic in this particular form.\n\nThe possession of the first alone might be a source of temptation, as it is designed primarily for the protection of burglars.\n\nThe second renders housebreaking unnecessary, as it ensures a decent competence, but is at the same time without prejudice to its companion, which might be serviceable in a number of emergencies not, at least technically, illegal.\n\nClick to view According to the Albertus Parvus Lucii Libellus , the Hand of Glory is indifferently the right or left hand of a criminal who has been gibbeted.\n\nThe sorcerer obtains it as he can, and in the days of Tyburn Tree such requisites might have cost nothing beyond the personal risk of the adventure; it is indispensable, however, that it should be wrapped in a piece of winding-sheet, and this suggests that the criminal must have been previously cut down with a view to interment.\n\nThus enclosed, the hand must be well squeezed to as to force out any blood which may possibly remain in the member, after which it must be placed in an earthen vessel, together with some zimort, saltpetre, common salt and pepper-corns--all pounded.\n\nIt should remain in this vessel for fifteen days and when extracted should be exposed to the heat of the sun during the time of the dog-star until it is extremely desiccated.\n\nIf solar warmth be insufficient, it may be placed in a furnace, heated with bracken and vervain.\n\nThe object is to extract all the grease from the member, and therefrom, in combination with virgin wax and sesame from Lapland, to compose a species of candle.\n\nWheresoever this frightful object is lighted, the spectators will be deprived of all motion and the sorcerer can do what he will.\n\nIt is possible to destroy its influence by anointing the threshold of the door, or other places through which entrance may be gained to a house, with an unguent composed of the gall of a black cat, grease from a white fowl and the blood of a screech-owl.\n\nThis should also be confected in the dog-days.\n\nIt is to be regretted that this signal process does not rest upon the personal testimony of its historian, but he was present, as report tells us, at the trial of several who confessed, under torture, that they had applied it with complete success.\n\nIt is to be regretted also that the alternative experiment must remain, as regards its materials, in the language of its inventor.\n\nIt will be seen, however, that the Hand of Glory is not a hand, but a serpent; the process has, in fact, no connection whatever with its name, but this is wholly in accordance with the genius of Black Magic, its variants and its substitutes.\n\nArrachez le poil avec sa racine d'une jument en chaleur, le plus près de la nature , saying: DRAGNE, DRAGNE, DRAGNE.\n\nTie the same in a knot, and go forthwith to purchase, without haggling, a new earthen pot, fitted with a lid.\n\nReturn home at full speed; fill the said pot with spring water within two inches of the brim.\n\nPlace your material therein, cover the vessel, and set it where neither you nor any one can perceive it, for the same is danger, saith the Grimoire."


[content]
body = "§ 5. Concerning the External Preparation of the Operator, and secondly Concerning the Vestments The use of special garments in the ceremonies of Magic follows reasonably enough from the religious character ascribed to these operations. Peter de Abano recommends a priest's garment if possible, by which an alb may be understood. [paragraph continues] The Book of Black Magic , following the Key of Solomon , and representing the Jewish rite, prescribes an outer vestment like that of the Levites, with the following characters embroidered in red silk upon the breast:-- Click to view All garments, even to the shirt, must be of linen cloth, and when assuming them these words should be recited: ANTON, AMATOR, EMITES, THEODONIEL, PONCOR, PAGOR, ANITOR; by the virtue of these most holy Angelic Names do I clothe myself, O Lord, in my Sabbath garments, that so I may fulfil, even unto their term, all things which I desire to effect through Thee, Most Holy ADONAY, Whose kingdom and rule endure for ever and ever. Amen . The shoes and hat should be of white leather, bearing the same characters written in cinnabar diluted with gum-water, the pen of the Art being used. The following names must be written about the hat: JEHOVA, behind; ADONAY, on the right hand; ELOY, on the left; and GIBOR, at the front."


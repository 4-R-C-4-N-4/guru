[content]
body = "There is no extant Ritual, as there is no doctrine, which contains, or can possibly contain, the real secret of magical procedure or the essence of occult doctrine.\n\nThe reason--whatever may be said in the excess of some self-constituted exponents--is not because there is, or can be, any indicible process, but because the knowledge in question is in the custody of those who have taken effectual measures for its protection; and though, from time to time, some secrets of initiation, belonging to this order, have filtered through printed books into the world at large, the real mysteries have never escaped.\n\nThe literature of Magic falls, therefore, on this hypothesis, under three heads: ( a .) The work of putative adepts, stating as much as could be stated outside the circle of initiation, and primarily designed to attract those who might be ripe for entrance.\n\n( b .) The speculations of independent seekers, who, by thought, study and intuition, sometimes attained veridic results without assistance.\n\n( c .) Travesties of occult doctrine, travesties of occult intention, travesties of occult procedure, complicated by filtrations from the superior source.\n\nThe opinions of professed occultists on any subject whatsoever are of no importance to myself, and are named only to establish a point of view; but most Ceremonial Magic belongs to the third class, on the assumption that it still exists, like some other paths of Satanism; the first, by its nature, is not represented, and the second only slightly.\n\nIn a word, Ceremonial Magic reflects mainly the egregious ambitions and incorporates the mad processes of mediæval sorcery--of the Sabbath above all.\n\nThe additional elements are debased applications of various Kabalistic methods, seering processes current among country people and fantastic attempts to reduce magical legends to a formal practice.\n\nWhichever of the above views the reader may prefer to adopt, it will be seen that the net result as regards the Rituals is not generically different, that they are of literary and historical interest, but nothing further.\n\nFor the occultist they will possess, from their associations, an importance which will be of no moment to another student.\n\nIt is desirable that they should not be undervalued, as records of the past, because they have exercised an influence, and they are memorable as curiosities thereof; but it is more desirable still that the weak and credulous should be warned against acting like fools, and that those who are seeking spiritual certitude should be dissuaded from the science of the abyss."


[content]
body = "CHAPTER IX Concerning Infernal Necromancy IT is only within recent times that the attempt to communicate with the dead has been elevated to the dignity of White Magic.\n\nHere it is necessary to affirm that the phenomena of Modern Spiritualism are to be distinguished clearly from those of old Necromancy.\n\nThe identity of purpose is apt to connect the methods, but the latter differ generically.\n\nTo compare them would be almost equivalent to saying that the art of physical Alchemy is similar to mercantile pursuits because the acquisition of wealth is the end in either case.\n\nTo appreciate the claim of Modern Spiritualism would be to exceed the limits of this inquiry; it is mentioned only with the object of setting it quite apart.\n\nIt should, however, be added that occult writers--with the indiscrimination which is common to their kind--have sometimes sought ambitiously to represent the communication with departed souls by means of Ceremonial Magic as something much more exalted than mere Spiritualism, whereas the very opposite is nearer the truth.\n\nAncient Necromancy was barbarous and horrible in its rites; it is only under the auspices of Éliphas Lévi and Pierre Christian that it has been purged and civilised, but in the hands of these elegant magicians it has become simply a process of auto-hallucination, having no scientific consequence whatever.\n\nThe secret of true evocation belongs to the occult sanctuaries, by the hypothesis of those who are their spokesmen; it is not the process of Spiritualism, and still less, so far as may be gleaned, is it that of the magical Rituals, nor would the secret at best seem respected by those who possess it, because the higher soul of man transcends evocation, and that which does respond ought to be beneath the initiate.\n\nThe claim, however, is naturally one of delusion complicated by imposture.\n\nIn any case, the Necromancy of the Rituals is, properly speaking, a department of Black Magic, and for this reason no doubt it was excluded from the theurgic scheme of the Arbatel ; nor do even such composite works as the two Keys of Solomon and the Magical Elements contain any account of a process which was always held in execration.\n\nIt was lawful apparently for the Magus to conjure and compel the devils, to rack the hierarchy of Infernus by the agony of Divine Names, but he must leave the dead to their rest.\n\nWhere the process is given, as in the Fourth Book of Cornelius Agrippa, it is confined to the evocation of those souls who might be reasonably supposed to be damned, and it involves revolting rites.\n\nIt assumes that the evil liver carries with him into the next world the desires which have depraved him here, and it allures him by his persistent affinities with the relinquished body.\n\nIn this way the use of blood came to be regarded as indispensable, because blood was held to be the medium of physical life; so also a portion of the body itself, whether flesh or bone, was prescribed in the rite.\n\nThere is not any need to say that evocations involving the use of such materials belong to Black Magic, but they would not in any case offer a redeeming feature to the consideration of the informed student.\n\n\"It is also to be understood,\" says pseudo-Agrippa, \"that those who are proposing to raise up the souls of any deceased persons must do so in places with which it is known that they were familiar, in which some special alliance between soul and body may be assumed, or some species of attracting affection, still leading the soul to such places.\n\n.\n\n.\n\n.\n\nTherefore the localities most suited for the purpose are churchyards, and, better still, those which have been the scene of the execution of criminal judgments\"--in plain words, the immediate neighbourhood of a gibbet."


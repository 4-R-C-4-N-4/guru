[content]
body = "Here Magic itself rises up and responds that there is a Black and a White Art, an Art of Hermes and an Art of Canidia, a Science of the Height and a Science of the Abyss, of Metatron and Belial.\n\nIn this manner a fourth point of view emerges; they are all, however, illusive; there is the positive illusion of the legend, affirmed by the remaining adherents of its literal sense, and the negative illusion which denies the legend crassly without considering that there is a possibility behind it; there is the illusion which accounts for the legend by an opposite hypothesis, and the illusion of the legend which reaffirms itself with a distinction.\n\nWhen these have been disposed of, there remain two really important questions--the question of the Mystics and the question of history and literature.\n\nTo a very large extent the first is closed to discussion, because the considerations which it involves cannot be presented with profit on either side in the public assemblies of the reading world.\n\nSo far as may be held possible, it has been dealt with already.\n\nAs regards the second, it is the large concern and purpose of this inquiry, and the limits of its importance may therefore be stated shortly.\n\nThere can be no extensive literatures without motives proportionate to account for them.\n\nIf we take the magical literature of Western Europe from the Middle Ages and onward, we shall find that it is moderately large.\n\nNow, the acting principles in the creation of that literature will prove to rule also in its history; what is obscure in the one may be understood by help of the other; each reacted upon each; as the literature grew, it helped to make the history, and the new history was so much additional material for further literature.\n\n[paragraph continues] There were, of course, many motive principles at work, for the literature and history of Magic are alike exceedingly intricate, and there are many interpretations of principles which are apt to be confused with the principles, as, for example, the influence of what is loosely called superstition upon ignorance; these and any interpretations must be ruled out of an inquiry like the present.\n\nThe main principles are summed in the conception of a number of assumed mysterious forces in the universe which could be put in operation by man, or at least followed in their secret processes.\n\nIn the ultimate, however, they could all be rendered secondary, if not passive, to the will of man; for even in astrology, which was the discernment of forces regarded as peculiarly fatal, there was an art of ruling, and sapiens dominabitur astris became an axiom of the science.\n\nThis conception culminated or centred in the doctrine of unseen, intelligent powers, with whom it was possible for prepared persons to communicate; the methods by which this communication was attempted are the most important processes of Magic, and the books which embody these methods, called Ceremonial Magic, are the most important part of the literature.\n\nHere, that is to say, is the only branch of the subject which it is necessary to understand in order to understand the history.\n\nHad Magic been focussed in the reading of the stars, it would have possessed no history to speak of, for astrology involved intellectual equipments which, comparatively speaking, were possible only to the few.\n\nHad Magic centred in the transmutation of metals, it would never have moved multitudes, but would have remained what that still is, the quixotic hope which emerges at a far distance from the science of chemistry.\n\nWe may take the remaining occult sciences collectively, but there is nothing in them of themselves which would make history.\n\nIn virtue of the synthetic doctrine which has been already formulated, they were all magically possible, but they were all subsidiary to that which was head and crown of all--the art of dealing with spirits.\n\nThe presumed possession of the secret of this art made Magic formidable, and made therefore its history."


[content]
body = "Citation COLPRIZIANA, OFFINA, ALTA, NESTERA, FUARO, MENUET.\n\nCharge ALIM, JEHOH, JEHOVAH, AGLA, ON, TETRAGRAMMATON.\n\nWhen the Spirit makes visible appearance, say :-- ADON, SCHADAI, ELIGON, AMANAI, ELION, PNEUMATON, ELII, ALNOAL, MESSIAS, JA, HEYNAAN, TETRAGRAMMATON.\n\nAdd the following Conjuration :-- ADONAI, ZEBOTH.\n\nADON, SCHADAI.\n\nELION, TETRAGRAMMATON, ELOI, ELOHIM, MESSIAS, JA, HAGIOS, Ho THEOS.\n\nAmen.\n\nSay inwardly :-- ALLEY, FORTISSIAN, FORTISSIO, ALLINSON, ROA.\n\nThe Discharge OMGROMA, EPYN, SEYOK, SATANY, DEGONY, EPARYGON, GALLIGANON, ZOGOGEN, FERSTIGON.\n\nThe most barbarous and unintelligible words are said by Picus de Mirandola to be the most powerful in Black Magic, and the affirmation applies everywhere, for the whole art is one of illiterate delight in unintelligible images.\n\nAs those here cited from the Verus Jesuitarum Libellus seem in most cases fortuitous assemblages of letters, they are doubtless all that can be desired, but additional constraints and conjurations, should the spirit of the deceased miser refuse to appear, will readily occur to the reader.\n\nHere ends the Complete Grimoire of Black Magic Click to view APOPHIS ."


[content]
body = "Lord, O Lord, if Thou wilt, condescend to look upon this mirror and bless it, that so ANAËL , one of Thy servants, may Pause thereon with his companions, to satisfy me, N., Thy poor and humble servant, O God, blessed and exalted above all the heavenly Spirits, Who livest and reignest for ever and ever.\n\nAmen .\n\nWhen you shall have accomplished these things, make the sign of the Cross upon yourself and upon the mirror on the first and following days for forty-five days in succession, at the end of which time Anaël will appear to you under the form of a beautiful child, will salute you, and will command his companions to obey you.\n\nObserve--says the process in its benignity--that it does not invariably require forty-five days to compose the mirror.\n\nThe Angel will frequently appear on the fourteenth day, according to the intention, devotion and fervour of the operator.\n\nWhen he shall appear, ask of him that which you desire, and pray him to come at all times, whensoever you shall invoke him, to grant your demands.\n\nOn subsequent occasions, when you desire to see in this mirror, it is not necessary to recite all the prayers as above provided, but having perfumed it, say only: Come ANAËL , come, according to thy good pleasure , &c.\n\nTo dismiss him, say: I thank thee, ANAËL, because thou hast appeared and hast satisfied my demands.\n\nDo thou therefore depart in peace, and return when I shall call thee .\n\nThe perfume of Anaël is saffron."


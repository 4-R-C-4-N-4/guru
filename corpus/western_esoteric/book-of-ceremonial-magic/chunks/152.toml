[content]
body = "Do likewise when the experiment is performed with characters and names, by touching the lovers with words, or by whatsoever other manner.\n\nBut when the experiment is made by giving something to be eaten, the same must be performed on the day and hour proper to this work.\n\nAll things being prepared, place them before you, and say: Where are ye, SOIGNATORE, USORE, DILAPIDATORE, and DENTORE; CONCISORE, DIVORATORE, SEDUCTORE, and SEMINATORE?\n\nYe Who sow discord, where are you?\n\nYe who infuse hatred and propagate enmities, I conjure you by Him who hath created you for this ministry, to fulfil this work, in order that whensoever N.\n\n[ naming the person ] shall eat of like things, or shall touch them, in whatsoever manner, never shall he go in peace .\n\nGive then whatsoever you please to the person designated, but let it be in the hour of Saturn or that of Mars, observing all things needful for such experiments."


body = "Figure II., the Labarum of Constantine, another form.\n\nFigure III., the inscription on this talisman is unintelligible.\n\nFigure IV., the occult symbol of the pentagram, reversed, and therefore the sign of the Demon, according to Éliphas Lévi.\n\nPossibly misplaced by the ignorance of the printer, but it occurs in this manner in many books which do not apparently connect with Black Magic.\n\nFigure V., a talisman with the monogram of Michael.\n\nFigure VI., undescribed, but belonging to a prayer of St.\n\nAugustine addressed to the Holy Spirit to receive a revelation.\n\nFigure VII., the characters of this talisman would seem to be Hebrew, but are so corrupt that they are unintelligible.\n\nFigure VIII., a talisman with the monogram of Gabriel.\n\nFigure IX., the talisman and monogram of Michael.\n\nPLATE V Page 84 The Characters of Evil Spirits, from the so-called \"Fourth Book\" of Cornelius Agrippa, and described as follows in the original.\n\n1.\n\nA right line; 2.\n\na crooked line; 3.\n\na reflexed line; 4.\n\na simple figure; 5.\n\npenetrate; 6.\n\nbroken; 7.\n\na right letter; 8.\n\na retrograde letter; 9.\n\nan inverted letter; 10.\n\nflame; 11.\n\nwind; 12.\n\nwater; 13.\n\na mass; 14.\n\nrain; 15.\n\nclay; 16.\n\na flying creature; 17.\n\na creeping thing; 18.\n\na serpent; 19.\n\nan eye; 20.\n\na hand; 21.\n\na foot; 22.\n\na crown; 23.\n\na crest; 24.\n\nhorns; 25.\n\na sceptre; 26.\n\na sword; 27.\n\na scourge.\n\nPLATE VI Page 135 The Sabbatic Goat, from the Ritual of Transcendental Magic , by Éliphas Lévi, who identifies it with the Baphomet of Mendes, and does not regard it as connected with Black Magic, but as \"a pantheistic and magical figure of the absolute.\" PLATE VII Page 156 The instruments of Black Magic, from the Grimoire entitled True Black Magic .\n\nFigure I., the knife with the white handle.\n\nFigure II., the knife with the black handle.\n\nFigure III., the arctrave, or hook.\n\nFigure IV., the bolline or sickle.\n\nFigure V., the stylet.\n\nFigure VI..\n\nthe needle.\n\nFigure VII., the wand.\n\nFigure VIII., the lancet.\n\nFigure IX., the staff.\n\nFigure X., the sword of the master.\n\nFigures XI., XII., XIII., the swords of the assistants.\n\nPLATE VIII Page 223 The Magical circle used in Goëtic Theurgy, according to the Lesser Key of Solomon the King, showing the position of the operator, the divine names and symbols to be inscribed within and about the double circle, and the situation of the lights.\n\nThe figure and place of the triangle into which the spirit is commanded will be found, with description, in the text, pp.\n\n220 -223.\n\nThe Divine Names differ in some of the manuscripts.\n\nPLATE IX Page 259 The Goëtic Circle of Black Evocations and Pacts, according to Éliphas Lévi.\n\nThe circle is formed from the skin of the victim, fastened to the ground by four nails taken from the coffin of an executed criminal.\n\nThe skull is that of a parricide; the horns those of a goat; the male bat opposite the skull must have been drowned in blood; and the black cat, whose head forms the fourth object on the circumference of the circle, must have been fed on human flesh.\n\nThere is no authority for any of these stipulations."


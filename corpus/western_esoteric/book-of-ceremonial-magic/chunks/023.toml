[content]
body = "§ 3.\n\nThe Unprinted Literature of Ceremonial Magic For the purposes of the present, inquiry it will be convenient to consider the Rituals under the three heads of Transcendental, Composite and Black, subject, as regards the first, to some specific qualifications which will appear in the second chapter, and subject, in respect of all, to the perfect understanding that these three are one.\n\nSo far as may be possible, the antiquity of individual Rituals will be determined in the course of their examination, but as this inquiry is based, with a single exception of undeniable importance, upon the printed literature, because it is that only which has exercised a real influence, it may be well, as a conclusion to this introductory part, to give some information regarding magical processes which have remained in manuscript, and are to be found only, or can at least be consulted only, in the public libraries of Europe.\n\nAlmost without exception, the source of their inspiration is the work mentioned in the preface, namely, The Key of Solomon , and they are consequently of later date.\n\nThe Library of the Arsénal at Paris has a reputation for being especially rich in Magical MSS., but there is also a large collection in the British Museum which may be regarded as typical.\n\nThere is nothing of earlier date or more importance among the French treasures, and, to determine the question of antiquity in a few words, there is nothing among our own that is much anterior to the beginning of the fourteenth century.\n\nThe numerical strength of the treatises, late and early combined, is in itself considerable, but, setting aside the codices made use of by the English editor of The Key of Solomon , the interest of which was exhausted long since by the appearance of that work, there are only three small classes or cycles to which an especial appeal attaches in connection with the present inquiry.\n\nThe first may be termed the group of Honorius, comprising three MSS.; the second is that of the Sepher Raziel , of which there are two forms; the third includes the English codices of the Lemegeton .\n\nThe chief MS.\n\nof the first group is also one of the most ancient treatises dealing with Magic in the library.\n\nThis is Sloane 313, a Latin MS.\n\non vellum, in a bad state of preservation.\n\nThe close writing and abbreviations make it somewhat difficult to read.\n\nIt is interesting, however, because it connects with the Grimoire of Honorius , one of the most historical and notable Rituals of Black Magic, being the work of some person bearing that name.\n\nIt belongs to the fourteenth century and has no title or other determinate name, but it appears from the text that it was understood to be the Sworn Book of Honorius .\n\nThe introduction or prologue to the work is obscurely worded in the initial pages, but it seems to account for the condemnation of magic by the prelates of the Church on the ground that they have been deceived by demons.\n\nThe result is the convocation of all the \"masters of Magic,\" to the number of 811, all of whom seem to have come out of Naples, Athens and a place.\n\nentitled Tholetus.\n\nAmong these a species of spokesman was chosen, whose name was Honorius, the son of Euclidus, Master of the Thebans.\n\nHe was deputed to work for the rest, and he entered into counsel with an angel called Hochmel or Hocroel , (?"


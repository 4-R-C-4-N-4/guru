[content]
body = "Having read so far, if he come not, write his seal on parchment; put it in a black box, with brimstone, assafœtida and other stinking perfumes; bind the said box with iron wire, hang it on the point of your sword, hold it over the fire of charcoal, which shall have been placed towards that quarter whence the spirit will Come, and say first unto the Fire:-- I conjure thee, O Fire, by Him Who made thee, and all other creatures in the world, to torment, burn, and consume this Spirit N.\n\neverlastingly .\n\nTO THE SPIRIT Because thou art disobedient, and obeyst not my commandments nor the precepts of the Lord thy God, now I, who am the servant of the Most High and Imperial Lord God of Hosts, JEHOVAH , having His celestial power and permission, for this thine averseness and contempt, thy great disobedience and rebellion, will excommunicate thee, will destroy thy name and seal, which I have in this box, will burn them with unquenchable fire and bury them in unending oblivion, unless thou comest immediately, visibly and affably, here before this circle, within this triangle, assuming a fair and comely form, without doing harm unto myself or any creature whatsoever, but giving, reasonable answer to m requests and performing, my desire in all things .\n\nIf he appear not at this point, say as follows:-- Thou art still pernicious and disobedient, willing not to appear and inform me upon that which I desire to know; now therefore, in the Name and by the power and dignity of the [paragraph continues] Omnipotent and Immortal Lord God of Hosts, JEHOVAH TETRAGRAMMATON , sole Creator of Heaven, Earth and Hell, with all contained therein, the marvellous Disposer of all things visible and invisible, I do hereby curse and deprive thee of all thine office, power and place; I bind thee in the depth of the Bottomless Pit, there to remain unto the Day of judgment, in the Lake of Fire and Brimstone, prepared for the rebellious Spirits.\n\nMay all the Company of Heaven curse thee; may the Sun, the Moon, the Stars, the Light of the Hosts of Heaven, curse thee into fire unquenchable, into torments unspeakable; and even as thy name and seal are bound up in this box, to be choked with sulphureous and stinking substances and to burn in this material fire, so, in the Name of JEHOVAH , and by the power and dignity of the three Names, TETRAGRAMMATON, ANEXHEXETON, PRIMEMATUM , may all these drive thee, O thou disobedient Spirit N., into the Lake of Fire, prepared for the damned and accursed Spirits, there to remain until the Day of Doom, remembered no more before the face of that God Who shall come to judge the quick and the dead, with the whole world, by fire .\n\nSet the box in the flame, whereupon he will appear; when he comes, quench the fire, make sweet perfumes, give him good entertainment, shewing him the pentacle on the hem of your vestment covered with a linen cloth, and saying:-- Behold thy confusion, if thou be disobedient.\n\nBehold the Pentacle of Solomon which I have brought into thy presence.\n\nBehold the person of the Exorcist, who is called OCTINIMOES , in the midst of the Exorcism, armed by God and fearless, potently invoking and calling."


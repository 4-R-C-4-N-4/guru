[content]
body = "\"There are also necromantic processes, comprising the tearing up of earth from graves with the nails, dragging out some of the bones, setting them crosswise on the breast, then assisting at midnight mass on Christmas Eve, and flying out of the church at the moment of consecration, crying: 'Let the dead rise from their tombs!'--then returning to the graveyard, taking a handful of earth nearest to the coffin, running back to the door of the church, which has been alarmed by the clamour, depositing the two bones crosswise, again shouting: 'Let the dead rise from their tombs!'--then, if we escape being seized and shut up in a madhouse, retiring at a slow pace, and counting four thousand five hundred steps in a straight line, which means following a broad road or scaling walls; finally, having traversed this space, lying flat upon the earth as if in a coffin, repeating in doleful tones: 'Let the dead rise from their tombs!'--and calling thrice on the person whose apparition is desired.\" The object of Necromantic evocations was much the same as the other operations of the Grimoires.\n\nIf the sorcerer of old, like the modern magician, had ever dispossessed the shade of Apollonius of its eternal rest, it would have been upon a question of finance.\n\nThe remaining process in Necromancy will be therefore an appropriate conclusion to our whole inquiry, as it is designed to raise up and expel a human spirit who is supposed to stand guard over a hidden treasure.\n\nIt is from the Verus Jesuitarum Libellus , and is the ne plus ultra of Ceremonial Magic, however distributed according to the colours of the spectrum.\n\nThe end of all things is money, says the sorcerer, and if asked to define Occult Science, he would answer that it was the method of obtaining concealed money.\n\nThe testimony of the entire literature coincides with this definition.\n\nA CONJURATION FOR THE SPIRIT GUARDIANS OF HIDDEN TREASURE I cite, require and command thee, Human Spirit, who frequentest this place, and in thy life hast interred thy treasure herein, who also of recent time, to wit, in the day or night of .\n\n.\n\n.\n\n., about the hour of .\n\n.\n\n.\n\n., hast shewn thyself in the form of a fire at this spot..\n\nI conjure thee by God the Father e, by God the Son ✠ , by God the Holy Spirit ✠ , by the most glorious and Holy Mother ✠ of God ✠ , by the most holy wounds of our Saviour, by all miracles performed through His Divine sorrows, Passion and tears, by His material death, by His descent into Hell, by His triumphant Resurrection, by His most glorious ascension into Heaven, by His sitting on the right hand of God the Father, giving rule to His angels from thence over the whole earth ✠ .\n\nI conjure thee by the terrible Day of Judgment ✠ , by the power and virtue.\n\nof St.\n\nJohn the Baptist ✠ , by all the martyrs, apostles and prophets.\n\nCome to me.\n\nI adjure and beseech thee by the terrible, ineffable and Divine Names inscribed on this sheet, and in reverence and confession of their power, to come before me, and to make thy sign visible, without lightning, without thunder, without noise of dread tempests, without causing fear or trembling, harm to body or soul, or annoyance of any kind.\n\nBut do thou perform my will in all things, even as I shall command thee, by the virtue of the, one stupendous and holy Name, which even the adverse and inferior powers of the Abyss do venerate and adore, ever confessing the Almighty, Whose creatures we all are."


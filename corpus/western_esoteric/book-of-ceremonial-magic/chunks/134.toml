[content]
body = "Having determined to make a pact, continues the Grand Grimoire , you must begin on the previous evening by cutting with a new and unused knife a rod of wild hazel, which has never borne fruit and shall be similar to the Blasting Rod, as it has been previously described.\n\nThis must be done precisely at the moment when the sun appears upon our horizon.\n\nThe same being accomplished, arm yourself with the stone called Ematille and with two blessed candles, and proceed to select a place for the coming operation where you will be wholly undisturbed; you may even make the pact in some isolated room, or in some subterranean part of an old ruinous castle, for the spirit has the power to transport the treasure--or, presumably, one of its alternatives--to any required place.\n\nThis having been duly fulfilled, describe a triangle with the stone called Ematille --which is exclusively needed on the first occasion of making a pact.\n\nThen set the two blessed candles in a parallel position on either side of the Triangle of Pacts, inscribing the Holy Name of Jesus below, so that no spirits can injure you after any manner.\n\nYou may now take up your position in the middle of the triangle, holding the mysterious rod, together with the grand Conjuration of the Spirit, the Clavicle, the written Requisition which you mean to make and the Discharge of the Spirit.\n\nHaving exactly fulfilled what things soever have been above described, begin by reciting the following Conjuration with decision and hopefulness:-- GRAND CONJURATION OF SPIRITS WITH WHOM IT IS SOUGHT TO MAKE A PACT Taken from the Grand Clavicle Emperor Lucifer, Master of all the revolted Spirits, I entreat thee to favour me in the adjuration which I address to thy mighty minister, LUCIFUGE ROFOCALE , being desirous to make a pact with him.\n\nI beg thee also, O Prince Beelzebuth, to protect me in my undertaking.\n\nO Count Astarôt!\n\nbe propitious to me, and grant that to-night the great LUCIFUGE may appear to me under a human form, free from, evil smell, and that he may accord me, in virtue of the pact which I propose to enter into, all the riches that I need.\n\nO grand LUCIFUGE , I pray thee to quit thy dwelling, wheresoever it may be, and come hither to speak with me; otherwise will I compel thee by the power of the strong living God, His beloved Son and the Holy Spirit.\n\nObey promptly, or thou shalt be eternally tormented by the Power of the Potent words in the grand Clavicle of Solomon, wherewith he was accustomed to compel the rebellious spirits to receive his compact.\n\nThen straightway appear, or I will persistently torture thee by the virtue of these great words in the Clavicle .\n\nAGLON, TETRAGRAM, VAYCHEON STIMULAMATON EZPHARES RETRAGRAMMATON OLYARAM IRION ESYTION EXISTION ERYONA ONERA ORASYM MOZM MESSIAS SOTER EMANUEL SABAOTH ADONAY, te adoro, et te invoco .\n\nAMEN.\n\nYou may rest assured that the recitation of these potent words will be followed by the appearance of the spirit, who will say:-- Manifestation of the Spirit Lo .\n\nI am here!\n\nWhat dost thou seek of me?\n\nWhy dost thou disturb my repose?\n\nAnswer me .\n\nLUCIFUGE ROFOCALE Reply to the Spirit It is my wish to make a Pact with thee, so as to obtain wealth at thy hands immediately, failing which I will torment thee by the potent words of the Clavicle ."


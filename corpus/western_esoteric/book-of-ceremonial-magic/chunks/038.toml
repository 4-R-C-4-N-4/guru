[content]
body = "May the blessing of the Patriarchs and prophets, apostles, martyrs, confessors, virgins, and of all the saints of God, be with me for ever ✠ , Amen.\n\nMay the blessing of all the heavens of God be with me for ever ✠ , Amen.\n\nMay the majesty of God Omnipotent sustain and protect me; may His eternal goodness lead me; may His boundless charity inflame me; may His supreme Divinity direct me; May the Power of the Father preserve me; may the wisdom of the Son enliven me; may the virtue of the Holy Ghost stand always between me and my enemies, both visible and invisible.\n\nPower of the Father, strengthen me; wisdom of the Son, enlighten me; consolation of the Holy Ghost, comfort me.\n\nThe Father is peace, the Son is life, the Holy Ghost is the consoling and saving remedy, Amen.\n\nMay the Divinity of God bless me, Amen.\n\nMay His Piety warm me; may His love preserve me.\n\nO Jesus Christ, Son of the living God, have Pity upon me a Poor sinner.\n\nWEDNESDAY O Emmanuel, defend me against the malignant enemy, and against all my enemies, visible and invisible, and deliver me from all evil.\n\nJesus Christ the King hath come in Peace, God made man, Who hath suffered Patiently for us.\n\nMay Jesus Christ, the gentle King, stand always for my defence between me and my enemies, Amen.\n\nJesus Christ triumphs, Jesus Christ reigns, Jesus Christ commands.\n\nMay Jesus Christ deliver me from all evils for ever, A men.\n\nMay Jesus Christ vouchsafe me grace to triumph over all my adversaries, Amen.\n\nBehold the Cross of our Lord Jesus Christ.\n\nFly, therefore, O my enemies, at the sight thereof; the Lion of the Tribe of Juda and of the Race of David hath conquered.\n\nAlleluia, Alleluia, Alleluia.\n\nSaviour of the world, save and succour me.\n\nThou who hast Purchased me by Thy Cross and Thy Blood, succour me, I conjure Thee, my God.\n\nO Agios, O Theos, Agios, Ischyros, Agios, Athanatos, Elieson, Himas, Holy God, Strong God, Merciful and Immortal God, have Pity upon me Thy creature, N.\n\nSustain me, O Lord; forsake me not, reject not my prayers, O Thou, the God of my salvation.\n\nDo Thou assist me always, O God of my salvation.\n\nClick to view MYSTIC FIGURES OF THE ENCHIRIDION THURSDAY Enlighten mine, eyes with true light, that they may never be closed in eternal sleep, lest mine enemy should say: I have prevailed over him.\n\nSo long as the Lord is with me, I will not fear for malice of my enemies.\n\nO most sweet Jesus, preserve me, aid me, save me; at the Name of Jesus let every knee bow, in heaven, on earth and in hell, and let every tongue confess openly that Jesus Christ is in the glory of His Father, Amen.\n\nI know beyond doubt that in what day soever I shall call upon the Lord, in the same hour shall I be saved."


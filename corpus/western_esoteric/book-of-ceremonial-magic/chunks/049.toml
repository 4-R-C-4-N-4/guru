[content]
body = "Lesser officers: Pammon, Dracon, Gemtzod, Enariel, Rudosor, Salmon .\n\nThe Seventh Hour.\n\nSupreme Ruler--MENDRION.\n\nThe chief officers include Ammiel, Choriel, Genaritzod, Pendroz, Memsiel, Ventariel .\n\nLesser officers: Zacharel, Razziel, Tarmitzod, Anapion, Framoch, Machmay .\n\nThe Eighth Hour.\n\nSupreme Ruler--NARCORIEL.\n\nThe chief officers: Cambill, Nedarijin, Astrocon, Marifiel, Dramozin, Amelzom .\n\nLesser officers: Hanoziz, Gastrion, Thomax, Hebrazym, Zimeloz, Gamsiel .\n\nThe Ninth Hour.\n\nSupreme Ruler--NACORIEL.\n\nThe chief officers, not subdivided: Adrapen, Chermes, Fenadros, Vemasiel, [paragraph continues] Comary, Demanor, Nameal, Maliel, Hanozoz, Brandiel, Evandiel, Iamariel .\n\nThe Tenth Hour: JUSGUARIN.\n\nThe chief officers ten, including Lapheriel, Emerziel, Mameroijud , Lesser officers one hundred, including Chameray, Hazamil, Vraniel .\n\nThe Eleventh Hour: DARDARIEL.\n\nThe great officers include Cardiel, Permon, Armiel, Hastoriel, Casmiros, Dumariel, Tumoriel .\n\nLesser officers: Hermas, Druchas, Charman, Elamiz, Ialcoajul, Lamersij, Hamarytzod .\n\nThe Twelfth Hour: SARINDIEL.\n\nThe chief officers include Adoniel, Darmosiel, Ambriel, and the lesser officers Nefrias, Irmanotzod, Melanos .\n\nThere are others cited, but the list is confused in my example and these will serve all purposes of enumeration.\n\nThe Angels of the Twelve Signs--classing the latter according to the elementary triplicities--are: Fiery Triplicity : Aries--Angel = Aiel ; Leo--Angel = Ol ; Sagittarius--Angel = Sizajasel .\n\nAiry Triplicity : Gemini--Angel = Giel ; Libra--Angel = Jael ; Aquarius--Angel = Ausiul .\n\nWatery Triplicity : Cancer--Angel = Cael ; Scorpio--Angel = Sosol ; Pisces--Angel = Pasiel .\n\nEarthy Triplicity : Taurus--Angel = Tual ; Virgo--Angel = Voil ; Capricornus-Angel = Casujoiah .\n\nBut the supreme zodiacal presidency is allocated to the archangels as follows: for the Fiery Triplicity, Michael; for the Airy Triplicity, Raphael; for the Watery Triplicity, Gabriel; for the Earthy Triplicity, Uriel.\n\nThis follows all the traditional precedents.\n\nIt is impossible to cite here the so-called angels or genii of men who govern the zodiacal degrees to the number of 360.\n\nThey are exemplified by the ruling archangels, whose invocation does not seem to be possible, and by the spirits attendant on these, as, for example: Asajel, Sochiel and Cassiel , of the Earthy Triplicity; Samael , [paragraph continues] Madiel and Mael , of the Watery Triplicity; and so forth."


[content]
body = "The smoke generated passes through the holes, and when it is smelt by the Angel it is said that he begins to speak.\n\nI should explain, however, that the furniture of the oratory and the vestments worn by the operator must be of the same colour as the Almadel .\n\nThe candles are lighted at the inception, the golden seal is placed in the middle of the talisman, and the Invocant kneels down, holding the Prayer at Calling, which must be written on virgin parchment.\n\nThe apparition manifests over the Almadel , at first in the form of a mist.\n\nThis Clears gradually, and when the incense rises the face of the Angel is turned towards the operator, who is asked in a low voice why the Princes of the particular Choir or Altitude have been thus called.\n\nThe answer is: \"I desire that all my requests may be granted and that which I pray for accomplished, for it appears and is declared by your office that the same is possible to you, if it please God.\" The particulars are enumerated without fear and without disrespect.\n\nIt would seem on the surface of the text as if no preliminary invocation were needed for this work, but that is the confusion of the Ritual which relegates it to the end and to a distinct part of the process.\n\nTHE PRAYER AT CALLING Thou great, mighty and blessed angel of God N., who rulest as the chief and first governing Angel in the first choir or altitude in the East, under the great Prince of the East whom you obey, who also is set over you as King by the Divine Power of God, ADONAI , HELOMI , PINE , Who is the disposer of all things in heaven, earth and hell: I, the servant of that God, ADONAI , HELOMI , PINE , Whom you obey, do invoke, conjure and entreat thee, N., that thou wilt appear forthwith.\n\nBy the virtue and power of the same God I do command thee from thine order or place of abode to come unto me and skew thyself plainly here before me in thine own proper shape and glory, speaking in a voice intelligible to mine understanding.\n\nO thou mighty and blessed Angel N., I, the servant of the same thy God, do entreat and humbly beseech thee to come and shew unto me all things that I shall desire of thee, subject to the power of thine office and the good Pleasure of the Lord our God.\n\nBy the three names of the true God, ADONAI , HELOMI , PINE , and by the name ANA BONA , I beseech and constrain thee forthwith to appear visibly in thy proper shape, speaking in my ears audibly, that I may have thy blessed, angelical and glorious assistance, familiar friendship, constant society, communication and instruction, now and at all times, herein and in all truths which the Almighty God, King of Kings, Giver of all good gifts, shall be graciously pleased to bestow on me.\n\nTherefore, O thou blessed Angel N., be friendly unto me, do for me as God hath empowered thee, whereunto I now adjure thee to appear it; power and presence, that I may sing with His Holy Angels O MAPPA LAMAN, HALLELUJAH.\n\nAMEN.\n\nWhen he appears , says the Ritual, give him a kind entertainment; ask what is lawful, possible and becoming to his office; and you shall obtain it .\n\nIf, however, he should fail to appear, the four candles must be marked with the gold or silver seal, which apparently will ensure obedience.\n\nThere are, however, certain planetary considerations connected with this process, on which its success depends."


body = "CHAPTER IV The Rituals Of Black Magic § 1.\n\nThe Grimorium Verum THE four specific and undisguised handbooks of Black Magic, all in the French language, but in three cases, like so much of the Ceremonial literature, possessing Italian connections, real or imputed, are:-- I.\n\nGRIMORIUM VERUM, or the Most Approved Keys of Solomon the Hebrew Rabbin, wherein the Most Hidden Secrets, both Natural and Supernatural, are immediately exhibited; but it is necessary that the Demons should be contented on their part.\n\nTranslated from the Hebrew by Plaingière, a Dominican Jesuit, with a Collection of Curious Secrets.\n\nPublished by Alibeck the Egyptian.\n\n1517.\n\nII.\n\nTRUE BLACK MAGIC, or the Secret of Secrets, an MS.\n\nfound at Jerusalem in the Sepulchre of Solomon, containing: 1.\n\nForty-five Talismans with their representation, as also the manner of using them, together with their Marvellous Properties.\n\n2.\n\nAll Magical Characters known unto this day.\n\nTranslated from the Hebrew of the Magus Iroë-Grego.\n\nRome.\n\nIn the year of grace, 1750.\n\nIII.\n\nTHE GRAND GRIMOIRE, with the Powerful Clavicle of Solomon and of Black Magic; or the Infernal Devices of the Great Agrippa for the Discovery of all Hidden Treasures and the Subjugation of every Denomination of Spirits, together with an Abridgment of all the Magical Arts.\n\n(In its earliest edition, without place or date.) IV.\n\nTHE CONSTITUTION OF POPE HONORIUS THE GREAT, wherein may be found the Arcane Conjurations which must be used against the Spirits of Darkness.\n\nWith a Collection of the Most Rare Secrets.\n\nRome, 1670.\n\nThey are all tiny volumes, nominally in duodecimo, but much smaller according to modern measurements.\n\nThe date specified in the title of the Grimorium Verum is undeniably fraudulent; the work belongs to the middle of the eighteenth century, and Memphis is Rome.\n\nThe Grand Grimoire is not of higher antiquity.\n\nThat of Honorius is said to have appeared originally in 1629, but it has been sometimes referred erroneously to the same period of the previous century.\n\nAs indicated by the authorship which is attributed to it, the Grimorium Verum is based to some extent upon the Key of Solomon , the main points of resemblance being in the description of the magical instruments and in some of the forms of prayer.\n\nIt distinguishes plainly the powers which it is proposed to invoke by the name of Devils.\n\nAt the same time it refers them nominally to the four elements, which would connect them with the Sylphs, Salamanders and so forth; but the classification in question, somewhat incidentally made, does not really obtain.\n\nThere is an account of the Hierarchy of Spirits, with Lucifer, Beelzebuth and Astaroth as potentates in chief.\n\nA portion of this account is drawn from the Lemegeton , perhaps through the Pseudo-monarchia of Wierus.\n\nThe work purports to be divided into three sections, containing:--( a .) The Characters and Seals of the Demons, with the forms for their Evocation and Dismissal.\n\n( b .) A description of the Natural and Supernatural Secrets which can be operated by the power of the Demons, and that without any deception.\n\n( c .) The Key of the work, and the proper application thereof.\n\nPassing over typographical errors, the MS."


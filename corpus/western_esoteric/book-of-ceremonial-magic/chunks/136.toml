[content]
body = "We know, O Lord, that a contrite and humble heart Thou wilt not despise, nor can any writing be an impediment in the way of Thy mercy; we beseech Thee, therefore, that, by the abundance of Thy clemency, not only may the heinousness of this sin be blotted out with the Blood of Thy Son our Lord Jesus Christ, but that the demon, by the word of Thy Power, may be compelled to restore the deed and obligation and delivery, lest he glory in his tyranny and Pretend to any right over the man whom we pray to be delivered through Thy Son from his bonds.\n\nThrough the same Jesus Christ, Thy Son, our Lord, &c .\n\nThe propitiation of offended Deity is followed by a citation of the demon who is required to disgorge his prey.\n\nEXORCISM I exorcise thee, O impious Satan, who, when thy power has passed away, dost still pretend to impose a tyrant yoke on man.\n\nI exorcise thee by Jesus Christ, Who came into this world for the salvation of sinners; I conjure thee to remove thy yoke immediately from this creature, who, deceived by thy wiles, formerly delivered himself unto thee.\n\nAbandoning thee henceforth, he commits himself to the Divine mercy, seeking His service unto Whom he alone is owing, Who also promises the reward of eternal life to those who follow Him.\n\nI exorcise thee by the precious Blood of Jesus Christ, by which the deed of judgment against us hath been blotted out, so that when Jesus receiveth the sinner into His favour, thou shalt dare not to advance anything against him, and shalt not fail to restore the deed by which this creature bound himself unto thee, the same being now cancelled by the Blood of Jesus Christ .\n\nHear, therefore, accursed Satan, who art powerless over a servant of God, when, encouraged by his true Lord, he turneth unto another service; in vain dost thou boast of this deed; I command thee to restore it in the name of the Lord, as a Proof before the whole world that when God receiveth a sinner, thou hast no longer any Yule over his soul.\n\nI abjure thee, by Him who expelled thee from thy stronghold, bereft thee of the arms which thou didst trust in and distributed thy spoils.\n\nReturn therefore this deed, whereby this creature of God foolishly bound himself to thy service; return it, I say, in His name by Whom thou art overcome; when thy Power has come to nothing, presume not longer to retain this useless document.\n\nBy penitence already hath this creature of God restored himself to his true Lord, spurning thy yoke, hoping in the Divine mercy for defence against thine assaults, and assisted by the Most Holy and Glorious Virgin Mary, Mother of God, through whose intercession he shall obtain from Jesus Christ, His Son, that which he himself is not worthy to expect.\n\nThrough the same Christ our Lord .\n\nWhether this process was supposed to insure the visible and material return of the incriminating document, or, failing this, was held to cancel it formally, does not certainly appear and will matter little; for what with the subtleties of the sorcerer and the assistance of the Church in the revocation of such acts and deeds, there was little chance for Infernus, and the reluctance of Lucifuge Rofocale to enter into the tricky contract is, on the whole, exceedingly intelligible."


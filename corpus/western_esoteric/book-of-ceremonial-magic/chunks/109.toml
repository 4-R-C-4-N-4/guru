[content]
body = "Click to view THE SEAL OF BAAL I. BAAL, a king ruling in the East, who imparts invisibility and wisdom. He appears with a human head, or with that of a toad or cat, but sometimes with all at once. He speaks with a hoarse voice. Click to view THE SEAL OF AGARES Click to view THE SEAL OF VASSAGO Click to view THE SEAL OF VASSAGO USED IN WHITE MAGIC II. AGARES, a duke ruling in the East, who appears in the form of a comely old man, ambling upon a crocodile and carrying a goshawk on his wrist. He makes those who run stand still, brings back runaways, teaches all languages, destroys spiritual and temporal dignities and causes earthquakes. He is of the Order of the Virtues. III. VASSAGO, a mighty prince, of the nature of Agares, who declares things past, present and future, and discovers what has been lost or hidden. He is good by nature. IV. GAMYGYN, a great marquis, appearing in the form of a small horse or ass, but afterwards in human shape. He speaks hoarsely, teaching the liberal sciences, and giving news of souls who have died in sin. Click to view THE SEAL OF GAMYGYN Click to view THE SEAL OF MARBAS Click to view THE SEAL OF VALEFOR V. MARBAS, a president, who appears as a mighty lion, and then in human shape. He answers truly concerning all things hidden or secret, causes and cures diseases, imparts skill in mechanics, and changes men into various shapes. VI. VALEFOR, a powerful duke, appearing as a many-headed lion. He leads those with whom he is familiar into theft. Click to view THE SEAL OF AMON VII. AMON, a strong and powerful marquis, who appears like a wolf with a serpent's head and vomiting flame. When so ordered, he assumes a human shape, but with the teeth of a dog. He discerns past and future, procures love and reconciles friends and foes. Click to view THE SEAL OF BARBATOS VIII. BARBATOS, a great count and duke, who appears when the sun is in Sagittarius with four noble kings and three companies of troops; he gives instruction in all the sciences, reveals treasures concealed by enchantment, knows the past and future, reconciles friends and those in power, and is of the Order of the Virtues. Click to view THE SEAL OF PAIMON IX. PAIMON, a great king, very obedient to Lucifer. He appears like a crowned man seated on a dromedary, preceded by all manner of musicians. He speaks with a roaring voice, teaches all arts, sciences and secrets, gives and confirms dignities, makes men subject to the will of the Magician, provides good familiars. He is observed towards the North-West, and is of the Order of Dominions."


[content]
body = "CHAPTER III Concerning the Descending Hierarchy § 1.\n\nThe Names and Offices of Evil Spirits IN all matters of ceremonial the inspiration of the Grimoires must be sought in the Key of Solomon proper, but for the names and offices of the demons it must be sought in the Lesser Key .\n\nThe hierarchy, according to the Lemegeton , with its accompanying evoking processes, will be given in the fourth chapter, as there is no special reason for separating it from the practical context.\n\nI shall therefore deal in this place with the simpler though later summaries, which will prevent these curious issues from being confused.\n\nThe Book of True Black Magic , like its prototype the original Clavicle , gives no account of the nature of the Spirits with which it professes to deal, and, as already seen, it breaks off abruptly at the point where the conjuring formulae should follow to complete the work.\n\nThis Secret of Secrets , as the Grimoires term the methods for raising and discharging spirits, being omitted, it may now be dismissed from consideration till we come to the minor processes of Ceremonial Magic, chiefly venereal and fantastic, which are grouped in the eighth chapter.\n\nThe Grimoire of Honorius mentions by name four kings, referred to the cardinal points, and seven lesser spirits to be invoked on the days of the week, but as will appear later on, there is no explicit notice of the Descending Hierarchy.\n\nThese deficiencies are supplied by the Grimorium Verum and the Grand Grimoire .\n\nClick to view THE SEAL AND CHARACTERS OF LUCIFER Click to view THE SEAL AND CHARACTERS OF BEELZEBUTH Click to view THE SEAL AND CHARACTER OF ASTAROTH As regards spirits, says the former, some are superior and others inferior.\n\nThe three superior are Lucifer, Beelzebuth and Astaroth.\n\nAccording to the latter, Lucifer is Emperor; Beelzebuth, Prince; and Astaroth, Grand Duke.\n\nThey must be invoked by means of the characters which they themselves have made known, and these characters must be written with the blood of the operator, or with that of a sea-tortoise.\n\nFailing this, they may be engraved on an emerald or ruby, for both these stones have great sympathy with spirits, especially with those of the solar race, who are wiser, better and more friendly than the rest.\n\nThe character must be worn upon the person; in the case of a male, it should be placed in the right pocket, but a female must carry it between the breasts, towards the left side, like a reliquary.\n\nIt should be graven or written on the day and in the hour of Mars for both sexes, and apparently in the case of each of the three spirits.\n\nThe lord commands the servants, so the Grimoire proceeds, and these three spirits can do all things.\n\nBut the operator is advised that he shall obey those who obey him, because the exalted and powerful spirits serve only their confidants and intimate friends.\n\nHe is further grimly warned to keep upon his guard lest any spirit should seize him unawares.\n\nEach of the rulers has two chief officers, who announce to the subjects all things which their lord hath commanded throughout the world, and ordain all that is to be done.\n\nThe inferiors of Lucifer are Put Satanachia and Agaliarept ; they inhabit Europe and Asia.\n\nThose of Beelzebuth are Tarchimache and Fleurety ; they dwell in Africa.\n\nThose of Astaroth are Sargatanas and Nebiros , whose asylum is America, so that this kind of Magic is presumably post-Columbian.\n\nThe Grand Grimoire does not distribute the six subordinate spirits among three rulers, but enumerates them somewhat differently, together with their dignities, as follows: -- LUCIFUGE ROFOCALE.--Prime Minister."


[content]
body = "FIRST PRAYER O great and living God, subsisting in one and the same person, the Father, the Son and the Holy Ghost; I adore Thee with the deepest veneration., and I submit with the liveliest confidence to Thy holy and sufficient Protection.\n\nI believe with the most sincere faith that Thou art my Creator, my Benefactor, my Preserver and my Lord, and I testify to Thy sovereign Majesty that my sole desire is to belong to Thee through the whole of eternity.\n\nSo be it.\n\nAmen .\n\nSECOND PRAYER O great and living God, Who hast created man to enjoy felicity in this life, Who hast adapted all things for his necessities, and didst declare that everything should be made subject to his will, be favourable to this my design, and permit not the rebellious spirits to be in Possession of those treasures which were formed by Thine own hands for our temporal requirements.\n\nGrant me, O great God, the power to dispose of them by the potent and terrific names in Thy Clavicle: ADONAY, ELOIM, ARIEL, JEHOVAM, TAGLA, MATHON , be ye propitious unto me.\n\nSo be it.\n\nAmen .\n\nOFFERTORY I offer Thee this incense as the purest which I have been able to obtain, O sublime ADONAY, ELOIM, ARIEL and JEHOVAM ; vouchsafe to receive it as an acceptable holocaust.\n\nIncline to me in Thy Power, and enable me to succeed in this great enterprise.\n\nSo be it.\n\nAmen .\n\nFIRST CONJURATION Addressed to the Emperor Lucifer Emperor Lucifer, Master and Prince of Rebellious Spirits, I adjure thee to leave thine abode, in whatsoever quarter of the world it may be situated, and come hither to communicate with me.\n\nI command and I conjure thee in the Name of the Mighty living God, Father, Son and Holy Ghost, to appear without noise and without any evil smell, to respond in a clear and intelligible voice, point by Point, to all that I shall ask thee, failing which, thou shall be most surely compelled to obedience by the Power of the divine ADONAY, ELOIM, ARIEL, JEHOVAM, TAGLA, MATHON , and by the whole hierarchy of superior intelligences, who shall constrain thee against thy will.\n\nVenité, Venité!\n\nSubmiritillor Lucifuge , or eternal torment shall overwhelm thee, by the great Power of this Blasting Rod.\n\nIn subito.\n\nSECOND CONJURATION I command and I adjure thee, Emperor Lucifer, as the representative of the mighty living God, and by the power of Emanuel, His only Son, Who is thy master and mine, and by the virtue of His precious blood, which He shed to redeem mankind from thy chains, I command thee to quit thine abode, wheresoever it may be, swearing that I will give thee one quarter of an hour alone, if thou dost not straightway come hither and communicate with me in an audible and intelligible voice, or, if thy Personal presence be impossible, despatch me thy Messenger Astarôt in a human form, without either noise or evil smell, failing which I will smite thee and thy whole race with the terrible Blasting Rod into the depth of the bottomless abysses, and that by the Power of those great words in the Clavicle--By ADONAY, ELOIM, ARIEL, JEHOVAM, TAGLA, MATHON, ALMOUZIN, ARIOS, PITHONA, MAGOTS, SYLPHÆ, TABOTS, SALAMANDRÆ, GNOMUS, TERRÆ, CŒLIS, GODENS, AQUA.\n\nIn subito ."


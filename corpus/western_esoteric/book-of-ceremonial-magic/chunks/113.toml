[content]
body = "Click to view THE SEAL OF MALPAS XXXIX.\n\nMALPAS, a powerful president, appears at first like a crow, but afterwards, when so commanded, assumes a human form, speaking with a hoarse voice.\n\nHe brings artificers swiftly from all parts of the world, destroys the desires and thoughts of enemies, gives good familiars and receives a sacrifice kindly, but will deceive him who offers it.\n\nClick to view THE SEAL OF RAUM XL.\n\nRAUM, a great earl, appears in the form of a crow, but assumes human shape when bidden.\n\nHe steals treasure, even out of the King's house, and carries it where commanded; he destroys cities and dignities; he discerns past, present and future; he causes love between friends and foes.\n\nFinally, he is of the Order of the Thrones.\n\nClick to view THE SEAL OF FOCALOR Click to view THE SEAL OF SABNACK XLI.\n\nFOCALOR, a strong duke, appears in the form of a man with the wings of a griffin.\n\nHe drowns men, sinks warships and has power over the winds and the sea, but he will not hurt any one if commanded to forbear by the exorcist.\n\nHe hopes to return to the Seventh Thrones in 1050 years.\n\nXLII.\n\nSABNACK, a mighty marquis, appears in the form of an armed soldier, having a lion's head and riding on a pale-coloured horse.\n\nHe builds towers, camps and cities, fortifies the same, torments men with wounds and putrid sores swarming with worms; he also gives good familiars.\n\nClick to view THE SEAL OF VEPAR XLIII.\n\nVEPAR, a great duke, appears as a mermaid.\n\nHe guides the waters and battleships; he occasions storms at sea, when so commanded by the Magician.\n\nHe also causes the sea to seem full of ships; he occasions death in three days by means of putrefying sores and worm-eaten wounds.\n\nClick to view THE SEAL OF SHAX Click to view THE SEAL OF VINE XLIV.\n\nSHAX, a great marquis, comes in the form of a stockdove, speaking with a hoarse voice.\n\nHe destroys the sight, hearing and understanding of any man or woman at the will of the exorcist, steals money from the king's exchequer and returns it in 1200 years.\n\nHe will transport anything, but must first be commanded into the triangle; otherwise he will deceive the operator.\n\nHe discovers all hidden things which are not in the keeping of wicked spirits and gives good familiars .\n\nXLV.\n\nVINE, a great king and earl, appears in a monstrous form, but assumes human shape when commanded.\n\nHe discerns things hidden, reveals witches and makes known the past, present and future.\n\nAt the command of the exorcist he will build towers, demolish walls and make the waters stormy.\n\nClick to view THE SEAL OF BIFRONS Click to view THE SEAL OF VUAL XLVI.\n\nBIFRONS, a great earl, appears in a monstrous form but assumes the human shape when commanded.\n\nHe gives proficiency in astrology, geometry and other mathematical arts; he teaches the virtue of herbs, precious stones and woods; he changes dead bodies, puts them in other places and lights phantom candles on their graves.\n\nClick to view THE SEAL OF HAGENTI XLVII.\n\nVUAL, a great duke, comes at first as an enormous dromedary, but afterwards assumes human form and speaks in the Egyptian tongue.\n\nHe procures the love of women, discerns past, present and future, and excites friendship even between foes.\n\nHe was of the Order of the Powers.\n\nXLVIII."


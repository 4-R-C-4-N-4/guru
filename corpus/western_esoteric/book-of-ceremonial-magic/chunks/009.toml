[content]
body = "The anonymous Cloud of Unknowing belongs, I believe, to the early part of the fifteenth century, and it is to be classed among the most signal presentations of the conditions and mode of the Union which I have met with in Christian literature.\n\nIt offers an experiment in integration which seems to me more practical because it is more express than the great intimations of Dionysius.\n\nThe integration is grounded on the identity of our essential nature with the Divine Nature and our eternal being therein: \"That which thou art thou hast from Him, and He it is\"; and again: \"Yet hath thy being been ever in Him, without all beginning, from all beginning, from all eternity, and ever shall be, without end, as Himself is.\" There is sufficient kinship on the surface of these statements for the casually literate and not too careful reader to speak of them as a simple presentation of the pantheistic doctrine of identity; but they are saved herefrom by the important qualification that--this state of eternal Divine indwelling notwithstanding--man had \"a beginning in the substantial creation, the which was sometime nothing.\" This beginning signifies the coming forth of man's spirit into the state of self-knowing in separateness, or some more withdrawn condition to which we cannot approximate in language--I mean in language that will offer a satisfactory consideration to the higher part of our understanding.\n\nIf it is conceivable that there is a possible state of distinction in Divine Consciousness by which the true self of our spirit became self-knowing, but not in separateness, then it is this state which is called in The Cloud of Unknowing \"a beginning in the substantial creation.\" It will be seen that I set aside implicitly the suggestion that the passage is a simple reference to the soul in physical birth.\n\nI do not think that the mystic whose chief flowers are of all things exotic would offer a distinction like this as a qualification of the soul's eternity by integration in the Godhead, or, more correctly, by substantial unity.\n\nThat which I take, therefore, to have been present to the writer's mind was the implicit pre-existence of all souls in the Divine Being for ever, and secondly their explication--as if the living thought became the living word; but there are no commensurate analogies.\n\nIn this manner there arose \"the substantial creation, the which was sometime nothing,\" and we know of all that has followed in the past and continued ages of our separateness.\n\nThis state is our sickness, and the way of return is our healing.\n\nThat return, according to The Cloud and its connections and identities in the great literature, is \"the high wisdom of the Godhead ...\n\ndescending into man's soul ...\n\nand uniting it to God Himself.\" The path is a path of undoing, though it is at this point that so many mystics stand in fear of the irresistible consequences which follow from their own teachings: it is the returning of the substantial creation into nothing; it is an entrance into the darkness; an act of unknowing wherein the soul is wholly stripped and unclothed of all sensible realisation of itself, that it may be reclothed in the realisation of God.\n\nIt may well seem that in this House Mystic of ineffable typology all the old order has passed away."


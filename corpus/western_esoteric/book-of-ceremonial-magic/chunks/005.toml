[content]
body = "I have secured this object--which after all is clear and simple--not by a regrettable comparison of what I have written there with that which appears in the present place, but by shewing in a brief introduction the proper sense in which phenomenal occultism and all its arts indifferently connect with the tradition of the mystics: they are the path of illusion by which the psychic nature of man enters that other path which goes down into the abyss.\n\nThe book in its present revision remains of necessity a presentation of old texts by the way of digest; I have added some new sections that in this department it may be rendered more representative, and if a touch of fantasy, which is not wholly apart from seriousness, will be pardoned here at the inception, the work itself is now an appendix to the introductory thesis--the textual, historical and other evidence by which it is supported.\n\nIn the year 1889 an expositor of the more arid and unprofitable side of Kabalistic doctrine edited in English a text of Ceremonial Magic, entitled Clavicula Salomonis , or, the Key of Solomon the King .\n\nIn an introduction prefixed to the work he stated that he saw no reason to doubt, and therefore presumably accepted, the tradition of its authorship, which in respect of the critical sense may be taken to summarise his qualifications for a mentor stultorum .\n\nIt should be added, as an additional light, that he undertook his translation more especially for the use of occult students, that is to say, for those persons who believe in the efficacy of magical rites and may, as an illustration of their faith, desire to put them in practice.\n\nWith this exception, the large body of literature which treats of Theurgic Ceremonial in its various branches has remained inaccessible to the generality of readers, in rare printed books and rarer manuscripts, in both cases mostly in foreign languages.\n\nThere is probably a considerable class outside occult students to whom a systematic account of magical procedure may be not unwelcome, perhaps mainly as a curiosity of old-world credulity, but also as a contribution of some value to certain side issues of historical research; these, however, an edition for occult students would deter rather than attract.\n\nIn the present work several interests have been as far as possible considered.\n\nThe subject is approached from the bibliographical and critical standpoints, and all sources of information which many years of inquiry have made known to the writer have been consulted to render it complete.\n\nAt the same time, seeing that there is a section of readers who will not disdain to be classed as professed occultists, whatever my view of their dedications, I am dealing with texts over which their interest may be held to exercise a certain primary jurisdiction, and I have therefore studied their requirements in two important respects, which will not, as I believe, be a source of offence to merely historical students.\n\nThey have been studied, firstly, by the observance of strict technical exactitude; the ceremonial produced in this book is absolutely faithful to the originals, and removes all necessity of having recourse to the originals before determining any doubtful point of magical procedure in the past.\n\nFor convenience of reference--if I may venture to make the modest bid for recognition on the part of such a circle--it is indeed superior to the originals, because it has been put systematically, whereas they often exceed understanding owing to the errors of transcribers, the misreadings of printers, the loose methods of early translators, and seemingly, it must be added, the confused minds of the first compilers, \"Solomon\" himself not excepted.\n\nThe innumerable offices of vain observance which constitute Ceremonial Magic, as it is presented in books, will therefore be found substantially intact by those who concern themselves with such observance."


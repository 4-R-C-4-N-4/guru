[content]
body = "O God all-merciful, Who wiliest not the death of a sinner, but rather his true conversion, bestow Thy grace on us!\n\nO Lord, O God, full of compassion, aid us in this work which we are about to perform, that Thy Name may be blessed for ever!\n\nAmen .\n\nThe concluding days of the fast should be additionally strict, the meals being limited to bread and water, with abstinence from all sin and repetition of the above prayer."


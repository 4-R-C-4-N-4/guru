[content]
body = "This being repeated frequently, if the spirit do not yet appear, say as follows:-- SECOND CONJURATION I invoke, conjure and command thee, O Spirit N., to appear and shew thyself visibly before this circle, in fair and comely shape, without deformity or guile, by the Name Of ON ; by the Name Y and V , which Adam heard and spake; by the Name Of JOTH , which Jacob learned from the Angel on the night of his wresting and was delivered from the hands of his brother Esau; by the Name of God AGLA , which Lot heard and was saved with his family; by the Name ANEHEXETON , which Aaron spake and was made wise; by the Name SCHEMES AMATHIA , which Joshua invoked and the Sun stayed upon his course; by the Name EMMANUEL , which the three children, Shadrach, Meshach and Abednego, chanted in the midst of the fiery furnace, and they were delivered; by the Name ALPHA and OMEGA , which Daniel uttered, and destroyed Bel and the Dragon; by the Name ZEBAOTH , which Moses named, and all the rivers and waters in the land of Egypt brought forth frogs, which ascended into the houses of the Egyptians, destroying all things; by the Name ESCERCHIE ARISTON , which also Moses named, and the rivers and waters in the land of Egypt were turned into blood; by the Name ELION , on which Moses called, and there fell a great hail, such as never was seen since the creation of the world; by the Name ADONAI , which Moses named, and there came up locusts over all the land of Egypt and devoured what the hail had left; by the Name HAGIOS , by the Seal of ADONAI , by those others, which are JETROS, ATHENOROS, PARACLETUS ; by the three Holy and Secret Names, AGLA, ON, TETRAGRAMMATON ; by the dreadful Day of Judgment; by the changing Sea of Glass which is before the face of the Divine Majesty, mighty and powerful; by the four beasts before the Throne, having eyes before and behind; by the fire which is about the Throne, by the Holy Angels of Heaven, by the Highly Wisdom of God; by the Seat of BASDATHEA , by this Name PRIMEMATUM , which Moses named, and the earth opened and swallowed Corah, Dathan and Abiram; do thou make faithful answers unto all my demands, and perform all my desires, so far as thine office shall permit.\n\nCome therefore peaceably and affably; come visibly and without delay; manifest that which I desire; speak with a clear and intelligible voice, that I may understand thee .\n\nIf he come not at the rehearsing of these Conjurations, as without doubt he will, proceed as follows, it being a Constraint:-- THIRD CONJURATION I conjure thee, O spirit N., by all the most glorious and efficacious Names of the Great and Incomparable Lord the God of Hosts, come quickly and without delay, front whatsoever part of the world thou art in; make rational answers to my demands; come visibly, speak affably, speak intelligibly to my understanding.\n\nI conjure and constrain thee, O Spirit N., by all the aforesaid Names, as also by those seven other Names wherewith Solomon bound thee and thy fellows in the brazen vessels to wit, ADONAI, PRERAI, TETRAGRAMMATON, ANEXHEXETON, INESSENSATOAL, PATHUMATON and ITEMON ; do thou manifest before this circle, fulfil my will in all things that may seem good to me."


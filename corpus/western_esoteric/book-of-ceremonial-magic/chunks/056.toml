[content]
body = "Reiterate the same three times, from stronger to stronger, using objurgations, contumelies, cursings, punishments, suspensions from his office and power, and the like.\n\nAfter all the courses are finished, again cease a little, and if any Spirit shall appear, let the invocant turn towards him, receive him courteously, and, earnestly entreating him, let him require his name.\n\nThen proceeding further, let him ask whatsoever he will.\n\nBut if in anything the Spirit shall shew himself obstinate or lying, let him be bound by convenient conjurations, and if you still doubt of any lie, make outside the circle, with the consecrated sword, the figure of a triangle or pentacle, and compel the Spirit to enter it.\n\nIf you would have any promise confirmed upon oath, stretch the sword out of the circle, and swear the Spirit by laying his hand upon the sword.\n\nThen having obtained of the Spirit that which you desire, or being otherwise contented, license him to depart with courteous words, giving command unto him that he do no hurt.\n\nIf he will not depart, compel him by powerful conjurations, and, if need require, expel him by exorcism and by making contrary fumigations.\n\nWhen he is departed, go not out of the circle, but stay, making prayer for your defence and conservation, and giving thanks unto God and the good angels.\n\nAll these things being orderly performed, you may depart.\n\nBut if your hopes are frustrated, and no Spirit will appear, yet for this do not despair, but, leaving the circle, return again at other times, doing as before.\n\nAnd if you shall judge that you have erred in anything, then you shall amend by adding or diminishing, for the constancy of reiteration doth often increase your authority and power, and striketh terror into the Spirits, humbling them to obedience.\n\nHence some do use to make a gate in the circle, whereby they go in and out, which they open and shut as they please, and fortify it with Holy Names and pentacles.\n\nThis also we are to take notice of, that when no Spirits will appear, but the Master, being wearied, hath determined to cease and give over, let him not therefore depart without licensing the Spirits, for they that do neglect this are very greatly in danger, except they are fortified with some sublime defence.\n\nOftentimes also the Spirits do come, although they be not visible (for to cause terror to him that calls them), either in the thing which he useth or in the operation itself.\n\nBut this kind of licensing is not given simply, but by a kind of dispensation with suspension, until they shall render themselves obedient.\n\nWhen we intend to execute any effect by evil Spirits where an apparition is not needful, this is to be done by making the required instrument or subject of the experiment itself, whether it be an image, a ring or a writing, any candle, character or sacrifice, or anything of the like sort.\n\nThe name of the Spirit is to be written thereon, with his character, according to the exigency of the experiment, either writing with blood or using some perfume agreeable to the Spirit, making also frequent prayers to God and the good angels before we invocate the evil Spirit, and conjuring him by the Divine Power.\n\nOver and above the formal diabolism of this process, there are instructions for composing a book of evil spirits, to be prepared ceremonially, according to their name and order.\n\nBy means of a \"holy oath,\" the ready obedience of the Spirit, whose name is written therein, is supposed to be insured."


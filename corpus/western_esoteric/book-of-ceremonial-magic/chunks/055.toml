[content]
body = "Refinements of this kind were evidently outside the magic of the fifteenth century.\n\nIn the following citation I shall depart from my usual custom of translating at first hand, and make use, with some needful prunings, of the version of Robert Turner, which is quite faithful and has, moreover, the pleasant flavour of antiquity.\n\nCONCERNING THE INVOCATION OF EVIL SPIRITS If we would call any evil Spirit to the circle, it first behoveth us to consider and to know his nature, to which of the planets it agreeth, and what offices are distributed to him from the planet.\n\nThis being known, let there be sought out a place fit and proper for his invocation, according to the nature of the planet and the quality of the offices of the same Spirit, as near as the same may be done.\n\nFor example, if his power be over the sea, rivers or floods, then let a place be chosen on the shore, and so of the rest.\n\nIn like manner, let there be chosen a convenient time, both for the quality of the air-which should be serene, clear, quiet and fitting for the Spirits to assume bodies---and for the quality and nature of the planet, and so too of the Spirit, to wit, on his day, noting the time wherein he ruleth, whether it be fortunate or unfortunate, day or night, as the stars and spirits do require.\n\nThese things being considered, let there be a circle framed at the place elected, as well for the defence of the invocant as for the confirmation of the Spirit.\n\nIn the circle itself there are to be written the general Divine Names, and those things which do yield defence unto us; the Divine Names which do rule the said planet, with the offices of the Spirit himself; the names, finally, of the good Spirits which bear rule and are able to bind and constrain that Spirit which we intend to call.\n\nIf we would further fortify our circle, we may add characters and pentacles agreeing to the work.\n\nSo also, and within or without the circle, we may frame an angular figure, inscribed with such numbers as are congruent among themselves to our work.\n\nMoreover, the operator is to be provided with lights, perfumes, unguents and medicines compounded according to the nature of the planet and Spirit, which do partly agree with the Spirit, by reason of their natural and celestial virtue, and partly are exhibited to the Spirit for religious and superstitious worship.\n\nThe operator must also be furnished with holy and consecrated things, necessary as well for the defence of the invocant and his fellows as to serve for bonds which shall bind and constrain the Spirits.\n\nSuch are holy papers, lamens, pictures, pentacles, swords, sceptres, garments of convenient matter and colour, and things of the like sort.\n\nWhen all these are provided, the master and his fellows being in the circle, and all those things which he useth, let him begin to pray with a loud voice and a convenient gesture and countenance.\n\nLet him make an oration unto God, and afterwards entreat the good Spirits.\n\nI he will read any prayers, psalms or gospels for his defence, they should take the first place.\n\nThereafter, let him begin to invocate the Spirit which he desireth, with a gentle and loving enchantment to all the coasts of the world, commemorating his own authority and power.\n\nLet him then rest a little, looking about him to see if any Spirit do appear, which if he delay, let him repeat his invocation as before, until he hath done it three times.\n\nIf the Spirit be still pertinacious and will not appear, let him begin to conjure him with Divine Power, but in such a way that all the conjurations and commemorations do agree with the nature and offices of the Spirit himself."


[content]
body = "The Master of the operation shall thereupon command him to gaze fixedly into the phial, when, approaching his right ear, and in a moderate tone of voice, but as distinctly as possible, let him make the following CONJURATION Uriel, Seraph, Josata, Ablati, Agla, Caila, I pray and conjure thee by the Four Words which God uttered with His mouth unto His servant Moses, Josata, Ablati, Agla, Caila , and by the Nine Heavens wherein thou dwellest, as also by the virginity of this child who is before thee, that thou appearest, and without any delay, visibly in this phial, to discover, without disguising, the truth which I desire to know; which done, I will discharge thee in peace and goodwill, in the Name of the Most Holy Adonay .\n\nAfter this conjuration the child must be asked whether he beholds anything in the phial; and if he should reply that he beholds an Angel or another apparition, the Master of the operation shall say in an affable tone of voice: Blessed Spirit, be thou welcome!\n\nI conjure thee once more, in the Name of the Most Holy Adonay, to give me prompt enlightenment upon , &c.\n\n[Here name the subject upon which information is desired.] And if for reasons unknown to us, thou art unwilling to proceed in an audible tone of voice , I conjure thee in the Most Holy Name of Adonay to write upon the virgin parchment here present, between now and to-morrow morning, or at least reveal unto me that which I desire this coming might in my sleep .\n\nIf the Spirit make answer to what is said, he shall be heard respectfully; should he fail to speak after thrice making the same supplication, let the tapers be extinguished and withdraw from the chamber, closing the door until the morrow, when the operator may return in the morning, and that which was required will be found within, on the virgin parchment, unless indeed it shall have been made known in the night.\n\nIn the Verum Jesuitarum Libellus this experiment in the induction of clairvoyance by means of a seering cup and a fantastic ceremonial, having only one monstrous condition, is replaced by a fierce conjuration of many pages, commanding the Spirit Uriel by all the words which have ever proceeded out of the mouth of the Creator of Heaven and Earth against the Evil Angels, and on pain of compulsion and torture, to appear before the operator, an unworthy servant of God, wherever the said Spirit may be, even in the abyss of Hell.\n\nHe is directed to appear visibly and modestly in a human form, and to bring whatsoever is desired in all tranquillity and patience, without tumult, without detriment, without blinding, without dumbness, without whispering, without thunder, without hail, without explosion, without puffing up, without trembling.\n\nIt is unnecessary to quote the entire citation, as the process is not complete; but it is evident that the Conjuration of Uriel in the forged treatise on the Magic of the Jesuits is intended for the compulsion of a devil and not for the solicitation of favours from the Blessed Spirit of the Grimorium Verum ."


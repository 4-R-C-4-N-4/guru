[content]
body = "CHAPTER V Concerning the Mystery of the Sanctum Regnum, or the Government of Evil Spirits; being the Rite of Conjuration according to the Grimorium Verum TH E preparations of the operator prescribed by the Grimorium Verum are fully represented in the earlier chapters, but they may be summed here as follows: 1.\n\nAn austere fast of three days; 2.\n\nRetreat or isolation from human society; 3.\n\nAbstinence from sexual intercourse; 4.\n\nThe recitation of certain prayers and the performance of certain ablutions; 5.\n\nThe composition of the required instruments.\n\nHe must further devote himself to the invocations, lest memory fail him at the moment set apart for the work, and to insure mastery of the practice.\n\nHe should also recite the following prayer daily --at Prime once, at Tierce twice, at Sext three times, at Nones four times, at Vespers five times, and six times before going to rest.\n\nIt is explained that these hours are planetary and unequal.\n\nPrime is reckoned at the rising of the sun, Tierce at three hours after, Sext at mid-day, Nones at three in the afternoon and Vespers at sunset.\n\nPRAYER ASTRACHIOS, ASACH, ASARCA, ABEDUMABAL, SILAT, ANABOTAS, JESUBILIN, SCIGIN, GENEON, DOMOL, Lord God, Who dwellest above the heavens, Whose glance searchest the abyss,.\n\ngrant me, I pray Thee, the power to conceive in my mind and to execute that which I desire to do, the end of which I would attain by Thy help, O God Almighty, Who livest and reignest for ever and ever.\n\nAmen .\n\nThese things being done, says the Grimoire, it remains only to follow the invocations and to compose the characters, to which end the operator shall proceed as follows:--On the day and in the hour of Mars, the Moon waxing, and at the first hour of the day, which begins automatically fifteen minutes before the rising of the Sun, a piece of virgin parchment must be prepared, containing all the characters and invocations of the spirits on whom it is desired to call.\n\nOn the day and in the hour aforesaid let the operator bind the little finger of the (left) hand, which is the finger of Mercury, with a thread woven by a virgin girl; let him pierce that finger with the lancet of the Art, so as to draw blood, and form therewith the character of Scirlin , from whom all other spirits depend, since he is their messenger and can compel them to appear despite themselves, because he has the power of the Emperor to him deputed.\n\nHis invocation, which must be written, is as follows:-- THE INVOCATION OF SCIRLIN HELON ✠, TAUL ✠, VARF ✠, PAN ✠, HEON ✠, HOMONOREUM ✠, CLEMIALH ✠, SERUGEATH ✠, AGLA ✠, TETRAGRAMMATON ✠, CASOLY ✠.\n\nWith the confusion so common in the Grimoires, the character of Scirlin is not given, whence the operator who followed the instructions of this Ritual must have had recourse to one of the superior spirits.\n\nThe instructions, however, are not described ad clerum , and it is scarcely possible to extract from them an intelligible method of procedure.\n\nThe name and surname of the operator must apparently be written below the character of the spirit, following a prescribed manner, which is also omitted; the conjuration of the spirit must be added and incense burnt in his honour."


[content]
body = "But seeing that until this present the Sovereign Pontiffs have alone possessed the Power of using invocations and commanding Spirits, His Holiness Honorius the Third, being moved by his Pastoral care, has benignly desired to communicate the methods and faculty of invoking and controlling Spirits to his venerable Brethren in Jesus Christ, adding the Conjurations which must be used in such case, the whole being contained in the Bull which here follows .\n\nHONORIUS , Servant of the Servants of God, unto all and each of our venerable Brethren of the Holy Roman Church, Cardinals, Archbishops, Bishops, Abbots; unto all and each of our sons in Jesus Christ, Priests, Deacons, Subdeacons, Acolytes, Exorcists, Cantors, Pastors, Clerks both Secular and Regular, Health and Apostolic Benediction.\n\nIn those days when the Son of God, Saviour of the World, generated in the fulness of time, and born, according to the flesh, of the Race of David, did live on this earth, Whose Most Holy Name is Jesus, before which the heavens., earth and hell do bend the knee; we have seen with what Power He commanded demons, which Power was also transmitted to St.\n\nPeter by that utterance: Upon this rock I will build my Church, and the Gates of Hell shall not Prevail against it.\n\nThese words were addressed to St.\n\nPeter as the Head and Foundation of the Church.\n\nWe then, who, by the mercy of God, and despite the Poverty of our merit, have succeeded to the Sovereign Apostolate, and, as lawful successor of St.\n\nPeter, have the Keys of the Kingdom of Heaven committed to our hands, desiring to communicate the Power of invoking and commanding Spirits, which hath been reserved unto us alone, and our Possessors did alone enjoy; wishing, I repeat, by Divine inspiration, to share it with our venerable Brethren and dear sons in Jesus Christ, and fearing lest in the exorcism of the Possessed, they might otherwise be appalled at the frightful figures of those rebellious angels who in sin were cast into the abyss, lest also they should be insufficiently learned in those things which must be Performed and observed, and that those who have been redeemed by the blood of Jesus Christ may not be tormented by any witchcraft or possessed by the demon, we have included in this Bull the manner of their invocation, which same must be observed inviolably.\n\nAnd because it is meet that the ministers of the Altar should have authority over the rebellious Spirits, we hereby depute unto them all powers which we possess, in virtue of the Holy Apostolic Chair, and we require them, by our Apostolic authority, to observe what follows inviolably, lest by some negligence unworthy of their character they should draw down on themselves the wrath of the Most High .\n\nThe Grimorium Verum has once been reprinted in the French language.\n\nOf the Italian version there have been two modern editions, both poorly produced.\n\nThe book of True Black Magic is known only by the edition of 1750.\n\nThe Grand Grimoire reappeared at Nismes in 1823 and is, moreover, in all respects identical with the work entitled the Red Dragon , of which there are several examples.\n\nThe Grimoire of Honorius is exceedingly rare in the original, but is better known by the reprints of 1660 and 1670, though these also are scarce.\n\nThere is, finally, an edition dated 1760, and this even commands a high price among collectors.\n\nIt remains to state that the Abbé d'Artigny was presented about the middle of the last century with an MS.\n\ncopy of this Grimoire, which was much more complete that the printed editions."


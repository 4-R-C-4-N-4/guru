[content]
body = "§ 5. Concerning Virgin Wax or Virgin Earth The candles used in evocation or in other magical experiences, and the images required for bewitchment, must be composed of virgin wax or virgin earth--that is to say, the substances in question must not have been applied previously to another purpose. Before operating the following words must be recited over the material:--ENTABOR, NATABOR, Si tacibor , ADONAY, AN, LAYAMON, TINARMES, EOS PHILODES. Angels Of God, be ye present! I invoke you in my work, that I may obtain virtue by your mediation and may be perfected very surely . Then recite the Psalms Domine, non est exaltatum cor meum and Domine, quis habitabit , adding these words: I exorcise thee, creature of wax [ or earth ], and, by the Creator and God Almighty, Who created all things from nothing by His Most Holy Name, and by His angels, I ordain thee to receive virtue and benediction in His Name, that so thou mayst be sanctified and blessed, thus obtaining that virtue which we desire, by the Most Holy Name ADONAY , which is the life of all creatures, Amen . Asperge the substance with the holy water of the Art, after which preserve it, to make use thereof when needed. So doing, says True Black Magic , thou shalt obtain a sure result in all which thou undertakest."


[content]
body = "It is doubtful whether the presence of these elements can be accounted for on the principle that mankind in all ages works unconsciously for the accomplishment of similar intentions in an analogous way; a bizarre intention, of course, tends independently to be fulfilled in a bizarre manner, but in this case the similarity is so close that it is more easily explained by the perpetuation--sporadic and natural or concerted and artificial--of an antique tradition, for which channels could be readily assigned.\n\nThere is one upon the face of the literature, and that is the vehicle of Kabalistic symbolism, though it cannot be held to cover the entire distance in time.\n\nThere have been two ways of regarding the large and imperfectly explored literature which embodies the Kabalah of the Jews, and these in turn will give two methods of accounting for the spurious and grotesque processes which enter so extensively into Ceremonial Magic.\n\nIt is treated either as a barren mystification, a collection of supremely absurd treatises, in which obscure nonsense is enunciated with preternatural solemnity, or it is regarded as a body of theosophy, written chiefly in the form of symbolism.\n\nThe first view is that which is formed, I suppose, almost irresistibly upon a superficial acquaintance, and there is not any need to add that it is the one which obtains generally in derived judgments, for here, as in other cases, the second-hand opinion issues from the most available source.\n\nIt is just to add that it does not differ very seriously from the opinions expressed in the past by a certain section of scholarship.\n\nThe alternative judgment is that which prevails among those students of the literature who have approached it with a certain preparation through acquaintance with other channels of the Secret Tradition.\n\nFrom the one it would follow that the Ceremonial Magic which at a long distance draws from the Kabalah, reproduces its absurdities, possibly with further exaggerations, or it is the subject-matter of the literature carried to its final results.\n\nTwo erroneous views have issued from the other--an exaggerated importance attributed to the processes in question on the ground of their exalted connections, and--this, however, is rarely met with--an inclination to regard them also as symbolical writing.\n\nThere is no ground for the criticism of the first inference, which has arisen legitimately enough and is that which will be most acceptable to the majority of readers.\n\nThose who value Kabalistic literature as a storehouse of symbolism, the inner sense of which is or may be of importance, but see nothing in the processes of Ceremonial Magic to make them momentous in their literal sense or susceptible to interpretation, will be tempted to dismiss them as mediæval and later impostures, which must be carefully distinguished from the true symbolical tradition.\n\nIn either case the ceremonial literature is disdainfully rejected, and it follows in this manner that alternatives which exclude one another both reach the truth as their term.\n\nThere is, however, yet another point of view, and it is of some moment, as it connects with that question of the Instituted Mysteries about which it has been already observed that very little has transpired.\n\nMost students of occultism are acquainted with intimations and rumours of the existence in modern times of more than one Occult as of more than one Mystical Fraternity, deriving, or believed to derive, from other associations of the past.\n\nThere are, of course, many unaffiliated occultists, as most mystics are unaffiliated, but the secret Fraternities exist, and the keys of occult symbolism are said to be in their possession.\n\nFrom a variety of isolated statements scattered up and down the works of professed Occultists in recent years, it is possible to summarise broadly the imputed standpoint of these bodies in respect of Ceremonial Magic.\n\nI will express it in brief as follows."


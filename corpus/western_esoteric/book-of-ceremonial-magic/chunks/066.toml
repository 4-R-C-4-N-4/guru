[content]
body = "§ 3.\n\nThe Grand Grimoire The Grand Grimoire is the most fantastic of the cycle and is introduced with great pomp by its pretended editor, Antonio Venitiana del Rabina, a personage whose name indicates the Italian origin of the work.\n\nBy reason of its rarity and the great request in which it is, we are informed that it must be regarded as the veritable Magnum Opus --a view which may appear inconsequential, but for which the authority of Rabbinical writers is cited.\n\nIt is to these authors that we owe the priceless treasure which innumerable charlatans have endeavoured to counterfeit, but have never succeeded in discovering.\n\nThe copy made use of by Antonio in preparing his edition was transcribed from the genuine writings of the mighty King Solomon, which were obtained by pure chance.\n\n\"Of a truth, what other man, save this invincible genius, would have had the hardihood to reveal the withering words which God makes use of to strike terror into the rebellious angels and compel them into obedience?\n\nHaving soared into the celestial altitudes that he might master the secrets and learn the omnipotent words which constitute all the power of a terrible and venerable Deity, the essence of those innermost arcana, made use of by an infinite Divinity, was extracted by this grand king, who passed all the days of his life in the most laborious researches, and in pursuit of the most obscure and hopeless secrets.\n\nHe succeeded ultimately in all his undertakings, penetrating into the most remote haunts of spirits, whom he bound, one and all, and forced them to obey him by the power of his Talisman or Clavicle.\n\nTherein he has discovered unto us the stellar influences, the constellation of the planets and the method for the evocation of all hierarchies of spirits by the recitation of certain sublime Appellations, as they are hereafter set down for you in this book, as well as the true composition and effects of the dreadful Blasting Rod, which causes the spirits to tremble; which God also used to arm his Angel when Adam and Eve were driven out of the Earthly Paradise; wherewith, finally, he smote the rebellious Angels, precipitating their ambitions into the most appalling gulfs by the power of this very Rod-of this Rod which collects the clouds, disperses tempests, averts the lightning, or precipitates each and all upon any portion of the earth at the pleasure of its director.\" Such is the preamble of the Grand Grimoire .\n\nThe work is divided into two parts, the first containing the evocation of Lucifuge Rofocale by means of the Blasting Rod, the second being that which Antonio inscrutably regards as the Sanctum Regnum , namely, the Rite of making Pacts; but one of the most notable characteristics of all the Grimoires is not their diabolical malice, but their unconscious ingenuousness, while the devout, almost laudable, character of all the operations seems to have been held quite sincerely.\n\nThe Grand Grimoire is, however, regarded as one of the most atrocious of its class; it has a process in Necromancy which is possible, say some occult writers--in the geniality of a lucid interval--only to a dangerous maniac or an irreclaimable criminal.\n\nIt must be admitted that the Rite is highly unreasonable, but in dealing with such literature it seems unsafe to advance the objection, for it applies much too widely.\n\nAs to its criminality, this centres in the creation of a disturbance at midnight Mass on Christmas Eve.\n\nThere is further an account of a poison entitled \"The Composition of Death, or Philosophical Stone,\" which is supposed to indicate an advanced degree of diabolism."


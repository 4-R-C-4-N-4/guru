[content]
body = "There was a time indeed when Ceremonial Magic threatened to absorb the whole circle of the occult sciences; it was the superior method, the royal road; it effected immediately what the others accomplished laboriously, after a long time.\n\nIt had, moreover, the palmary recommendation that it was a conventional art, working by definite formulæ; above all, it was a process in words.\n\nIt was the fascination of this process which brought men and women-all sorts and conditions of both--to the Black Sabbath and to the White Sabbath, and blinded them to the danger of the stake.\n\nIt was the full and clear acceptation of this process as effectual by Church and State which kindled the faggots for the magician in every Christian land.\n\nAstrology was scarcely discouraged, and if the alchemist were occasionally tortured, it was only to extract his secret.\n\nThere was no danger in these things, and hence there was no judgment against them, except by imputation from their company; but Magic, but dealing with spirits, was that which made even the peasant tremble, and when the peasant shakes at his hearth, the king is not secure in his palace nor the Pope at St.\n\nPeter's, unless both can protect their own.\n\nMoreover, in the very claim of Ceremonial Magic there was an implied competition with the essential claim of the Church.\n\nThe importance of Ceremonial Magic, and of the literature which embodies it, to the history of the occult sciences being admitted, there is no need to argue that this history is a legitimate and reasonable study; in such a case, knowledge is its own end, and there can be certainly no question as to the distinguished influence which has been exercised by the belief in Magic throughout the ages.\n\nIn order, however, to understand the literature of Magic, it is necessary to obtain first of all a clear principle of regarding it.\n\nIt will be superfluous to say that we must surrender the legends, as such, to those who work in legends, and dispute about their essential value.\n\nWe need not debate whether Magic, for example, can really square the circle, as magicians testify, or whether such an operation is impossible even to Magic, as commonly would be objected by those who deny the art.\n\nWe need not seriously discuss the proposition that the devil assists the magicians to perform a mathematical impossibility, or its qualified form, that the circle can be squared indifferently by those who invoke the angel Cassiel of the hierarchy of Uriel and those who invoke Astaroth.\n\nWe shall see very shortly, as already indicated in the preface, that we are dealing with a bizarre literature, which passes, by various fantastic phases, through all folly into crime.\n\nWe have to account for these characteristics.\n\nThe desire to communicate with spirits is older than history; it connects with ineradicable principles in human nature, which have been discussed too often for it to be necessary to recite them here; and the attempts to satisfy that desire have usually taken a shape which does gross outrage to reason.\n\nBetween the most ancient processes, such as those of Chaldean Magic, and the rites of the Middle Ages, there are marked correspondences, and there is something of common doctrine, as distinct from intention, in which identity would more or less obtain, underlying them both.\n\nThe doctrine of compulsion, or the power which both forms pretended to exercise even upon superior spirits by the use of certain words, is a case in point.\n\nIn approaching the Ceremonial Magic of the Middle Ages, we must therefore bear in mind that we are dealing with a literature which, though modern in its actual presentation, embodies some elements of great antiquity."


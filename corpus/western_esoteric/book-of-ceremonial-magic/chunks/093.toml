[content]
body = "§ 4.\n\nConcerning the Pen and Ink of the Art Preliminary magical ceremonial seems to have as its chief object the personal consecration of every article, great or small, indispensable or occasional, which is connected with the several processes.\n\nThe pen and ink with which characters and names are written must both be specially prepared.\n\nTake a new quill, says the Grimorium Verum ; asperge and fumigate it after the manner of the other instruments; when you hold it in your hand to shape it, say the following words:--ABABALOY, SAMOY, ESCAVOR, ADONAY: I have expelled all illusion from this pen, that it may retain efficaciously within it the virtue necessary for all things which are used in this Art, as well for operations as for characters and conjurations.\n\nAmen .\n\nIn like manner, a horn or ink-well must be bought on the day and in the hour of Mercury, and in the same hour the following names of God must be written about it:--JOD, HE, VAU, HE, METATRON, JOD, CADOS, ELOYM, SABAOTH.\n\nIt must then be filled with fresh ink which has been exorcised as follows -- EXORCISM OF THE INK I exorcise thee, creature of Ink, by ANSTON, CERRETON, STIMULATOR, ADONAY , and by the name of Him Whose one Word created all and can achieve all, that so thou shall assist me in my work, that my work may be accomplished by my will, and fulfilled with the permission of God, Who ruleth in all things and through all things, everywhere and for ever.\n\nAmen .\n\nBENEDICTION OF THE INK Lord God Almighty, Who rulest all and reignest through all eternity, Who dost fulfill great wonders in Thy creatures, grant unto us the grace of Thy Holy Spirit by means of this pen.\n\nBless it ✠ , sanctify it ✠ and confer upon it a peculiar virtue, so that whatsoever is said, whatsoever we desire to do and to write herewith, may succeed through Thee, Most Holy Prince ADONAY .\n\nAmen .\n\nThen asperge, fumigate and exorcise.\n\nThe Book of True Black Magic , on the other hand, directs the operator to pluck the third feather from the right wing of a male goose and to say when extracting it: ABRACHAY, ARATON, SAMATOY, SCAVER, ADONAY!\n\nExpel all evil from this feather, so that it may possess full power to write whatsoever I will .\n\nThen shape it with the Knife of the Art, namely, that having a white handle; incense also and asperge it.\n\nLastly, take a new earthen cornicle or inkhorn, made on the day and in the hour of Venus, and write about it these names with the exorcised lancet of the Art: JOD, HE, VAU, HE, MITATRON, JAE, JAE, JAE, CADOS, ELOYN, ZEVAO.\n\nThen dip the pen therein, pronouncing the following words:-- I exorcise thee, creature of the feather kind, by ETERETON, by STIMULATON and by the name ADONAY.\n\nDo thou aid me in all my works .\n\nThe instruction continues---As it is sometimes necessary to write with coloured inks, have several horns containing white inks, in which infuse thy colours for the pentacles and characters.\n\nThe colours must be diluted with the blessed water which we term exorcised, and with gum arabic.\n\nLastly, perfume them.\n\nLet this be done with all devotion, humility and faith, wanting which nothing can be accomplished, says the Grimoire."


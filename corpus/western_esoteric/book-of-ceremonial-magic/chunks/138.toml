body = "It should be added that the profanations of the mysteries of religion prescribed by the Grimoire of Honorius are not intentional profanations, and may be condoned to that extent.\n\nTheir purpose is not outrage, but increase of efficacy.\n\nHaving made these initial provisions, the substance of this exceedingly curious Ritual may now be offered to the student in the words of its writer.\n\nIt will be remembered that the person who desires to invoke the perverse \"Spirits of Darkness\" according to the method of Honorius must observe a three days' fast; he must further confess and approach the Holy Altar.\n\nHe should also, by the hypothesis, be a priest of the Latin Church.\n\nAfter these three days, upon the morrow, and at the hour of sunrise, he shall recite the Seven Gradual Psalms, with the accompanying Litanies and Prayers, the whole on his knees; further, he must drink no wine and eat no meat on that day.\n\nNext, he shall rise at midnight on the first Monday of the month, and, seeing that he is apparently a priest, shall say a Mass of the Holy Ghost.\n\nAfter the consecration, taking the Host in his left hand, he shall recite the following prayer on his knees:-- PRAYER My Sovereign Saviour Jesus Christ, Son of the living God!\n\nThou Who for the Salvation of all mankind didst suffer the death of the Cross; Thou Who, before being abandoned to Thine enemies, by an impulse of ineffable love, didst institute the Sacrament of Thy Body; Thou Who hast vouchsafed to us miserable creatures the Privilege of making daily commemoration thereof; do Thou deign unto Thine unworthy servant, thus holding Thy Living Body in his hands, all strength and ability for the Profitable application of that power with which he has been entrusted against the horde of rebellious spirits.\n\nThou art their true God, and if they tremble at the utterance of Thy Name, upon that Holy Name will I call, crying Jesus Christ!\n\nJesus, be Thou my help, now and for ever!\n\nAmen .\n\nAfter sunrise, a black cock must be killed, the first feather of its left wing being plucked and preserved for use at the required time.\n\nThe eyes must be torn out, and so also the tongue and heart; these must be dried in the sun and afterwards reduced to powder.\n\nThe remains must be interred at sunset in a secret place, a cross of a palm in height being set upon the mound, while at each of the four corners the signs which here follow must be drawn with the thumb:-- Click to view A later edition substitutes the following signs:-- Click to view On this day also the operator should drink no wine and abstain from eating meat.\n\nOn Tuesday, at break of day, let him say a Mass of the Angels, placing the feather taken from the bird upon the altar, together with a new penknife.\n\nThe signs hereinafter represented must be inscribed on a sheet of clean paper with the consecrated wine which is the Blood of Jesus Christ:-- Click to view In an edition circa 1800 the following signs are substituted:-- Click to view They should be written upon the altar, and at the end of the Mass the paper should be folded in a new veil of violet silk, to be concealed on the morrow, together with the oblation of the Mass and a part of the consecrated Host.\n\nOn the evening of Thursday the operator must rise at midnight and, having sprinkled holy water about the chamber, he must light a taper of yellow wax, which shall have been prepared on the Wednesday and pierced in the form of a cross.\n\nWhen it is lighted he shall recite Psalm lxxvii.\n\n-- Attendite, Popule meus, legem meam , &c.--without the Gloria Patri ."


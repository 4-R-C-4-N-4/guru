[content]
body = "The perfumes are aloes wood and incense for most occasions, and mace for the fumigation of the circle.\n\nThe Book of True Black Magic omits mace but substitutes benzoin and storax, and any others at choice, without specific distinction as to the circle.\n\nThe following Prayers, Exorcisms and Benedictions, to be said over the aromatic perfumes, occur in the two Rituals, the first and third being common to both, and borrowed from the Key of Solomon ; the second, also referable to the same source, is not found in the Grimorium Verum .\n\nFIRST EXORCISM O God of Abraham ✠, God of Isaac ✠, and God of Jacob ✠, vouchsafe to bless and sanctify these creatures, of whatsoever species they may be, so that they may obtain virtue and Power to discern good spirits from bad, even phantoms and enemies, through Thee, O ADONAY, Who livest and reignest for ever and ever.\n\nAmen .\n\nSECOND EXORCISM I exorcise thee, O impure Spirit, who art the phantom of the Enemy.\n\nIn the Name of God Almighty, come out from this kind, with all thy falsehood and wickedness, so that it may become sanctified and exorcised, in the Name of God Almighty; that all virtues may inspire those who partake of this odour; that the Spirit of God may descend, and the virtue of the Lord manifest, in the burning of this species; and that no phantom may dare to accost it.\n\nThrough the Ineffable Name of God Almighty.\n\nAmen .\n\nTHIRD EXORCISM Deign, O Lord, to sanctify this creature, so that it may become a signal remedy for the human race, and the salvation of our souls and bodies, through the invocation of Thy Most Holy Name, that so all creatures which inhale the smoke of this kind may have health of body and soul.\n\nThrough that Lord Who hath created the ages of ages.\n\nSo be it .\n\nThis done, sprinkle the perfumes with exorcised water, and set them aside in the silken cloth for use as prescribed.\n\nWhen you would fumigate anything, take new coal which has not been kindled, set it alight, and while it is still black, exorcise it, saying: EXORCISM OF THE LIGHTED COAL I exorcise thee, O creature of Fire, by Hint Who hath made all things!\n\nDo thou expel from thee all phantoms, so that they may in no wise harm or trouble us in our work, by the invocation of the Most High Creator.\n\nAmen.\n\nO Saviour, Almighty and merciful, bless Thy creature of this kind, so that no harm may come to him who shall make use of it.\n\nAmen .\n\nIn concluding this portion of its ceremonial, the Book of True Black Magic states that there are occasions on which perfumes of a stinking or malodorous kind must be used.\n\nAs the first point of their preparation, the operator must say over them: ADONAY, LAZAY, DELMAY, AMAY, SADAY, ELOY, by the invocation, O Saviour, of Thy Most Holy Name, vouchsafe us, through this kind, the help of Thy grace, and may it assist us in all things which we need to fulfil; may all malice pass out herefrom, may it be blessed and sanctified in Thy most powerful Name.\n\nAmen .\n\nAsperge the stinking perfume with exorcised water, place it in the silken cloth and use it as needed, but always in the name of the Most Holy ADONAY.\n\nSo doing, thou shalt obtain thy desire, says the \"Manuscript discovered at Jerusalem in the Sepulchre of Solomon.\""


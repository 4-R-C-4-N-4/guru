[content]
body = "The technicalities of the occult sciences may seem hard to the beginner, and they are actually hard like the wilderness, because they are barren wastes, but they are in words of one syllable if compared with the little catechisms of eternal life, which are exclusive to the children of God.\n\nBehind this Open Entrance to the Closed Palace of the King--which is so like the eye of the needle--there is the concealed tradition in and behind the mysticism of Christian Times.\n\nAbout this it is scarcely possible to speak here, and it will require some care not to confuse the image with which I have opened my statement.\n\nThe Open Entrance of course leads to the Palace, but at a certain point there is found an exceedingly hidden postern and a path beyond, which is absolutely unattainable except through the lawful entrance, because, although the Kingdom of Heaven tolerates a certain quality of enlightened and loving violence, the sanctuary of all its sanctuaries responds only to the violence of that man who knows how to lay hands on himself, so that he may carry none of his extrinsics to the most intrinsecus place in all the world of God.\n\nThis postern is hidden deeply on the deepest side of tradition, but by what can be traced concerning it, I think that there has been such a going to and fro upon the Ladder of Jacob that something more of the states which are not the term, but are perhaps penultimate thereto, has been brought back by those who have accomplished the next but one to all of the Great Work.\n\nI think further that they have gone so far that they have seen with their own eyes some intimacies of the term itself--being the state of those who go in and do not evermore come back.\n\nThese are aspects of the Secret Tradition in so far as it has declared itself on the side of God.\n\nIt remains now to be said that there is a tradition à rebours , and though it may seem very hard to put it so roughly and frankly, I have not taken all the consciousness of the inward man for my province to smooth or reduce any of the distinctions between the loss and gain of the soul.\n\nThe tradition a rebours is definitely and clearly that of miraculous power in the quest and attainment thereof.\n\nIt is summarised by the ambition of the Magus in its contrast with the desire of the eyes and the hope which fills the heart of the true mystic.\n\nI am not intending to suggest that the Magus as such is of necessity at issue with the decalogue, or that he is under judgment by this sole standard, whether for vengeance or reward.\n\nAs the position is capable of dogmatic statement, and as such is without any subjection to vicissitude, I will express it in dogma as follows: Whosoever goes inward to find anything but the Divine in his centre is working on the side of his own loss.\n\nAs there is the height of Kether in Kabalism, so there is the abyss which is below Malkuth , and those who are seeking to exercise the powers of the soul apart from its graces are treading the downward path.\n\nThe operation of grace is so utterly catholic, and there is correspondingly so much of the Divine prevention operating everywhere, that in most instances the experiments come to little and the frittering does not continue from the mere weariness of its business; but the quest of miraculous power--and I use an unscientific phrase of set purpose, because I am dealing now with the most inexact of all subjects--is that which is usually comprehended by the term occult science, and the occult sciences, speaking generally, are the sciences of the abyss.\n\nI except astrology, which--only through the accident of many associations--has been taken by force into the category: it is not an occult science, and notwithstanding a few negligible claims on the part of a few sanctuaries, it has no secret mode of working whatsoever."


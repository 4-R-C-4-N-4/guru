[content]
body = "PREFACE THE art which is called Goëtic, being that of incantation, of sorcery, fascination and of the illusions and impostures connected therewith, has come somewhat arbitrarily to signify the last issue in diabolism of the more catholic and general art which is termed Practical Magic.\n\nThe latter designation implies that there is a Magic on the theoretical side, or, as it may be, a philosophy of the subject, and this again is of two kinds: in modern days it has embodied various attempts to provide an explanation, a working hypothesis, for alleged phenomena of the past; of old it came forward with the accent of authority and carrying the warrants of a peculiar and secret knowledge; it taught rather than explained.\n\nBehind this, in virtue of a specific assumption, there stood the source of such authority, the school or schools that issued, so to speak, the certificates of title which the records of the expounding master are supposed to shew that he possessed.\n\nHerein resided presumably that Higher Magic which justified the original meaning of the term Magic; this was the science of wisdom, and of that wisdom which was the issue of experience and knowledge particular to sacred sanctuaries in the years of the Magi.\n\nIn this manner a remote and abstract magnificence has been allocated to the practical work; but between this aspect as we know it otherwise and that dream as it has been dilated in the forms of its expression there is the kind of relation which subsists between renown and its non-fulfilment.\n\nIf Magic in its proper and original meaning be synonymous with wisdom; if that wisdom, by virtue of this assumption which I have mentioned, were something inconceivably great, it is of certitude that it had no causal connection with the congeries of arts and processes which are understood by Practical Magic.\n\nThat there was, as there still is, a science of the old sanctuaries, I am certain as a mystic; that this science issued in that experience which imparts wisdom I am also certain; but it did not correspond to any of the arts and processes to which I refer here, nor to anything which can be received by the mind as the result of their exaltation.\n\nThe consideration of a possibility thus already condemned is therefore ruled out of the inquiry which I have attempted in the present work.\n\nI have also ruled out, as it will be seen, the distinctions which have subsisted between the good and evil side of the arts and processes, not that it does not exist on the bare surface, but because the two aspects dissolve into one another and belong one to another in the root that is common to both.\n\nThe actual question before us is after what manner, if any, magical procedure draws anything from secret tradition in the past, and so enters into the general subject of such tradition, whether in Christian or anterior times.\n\nIt would and could only be of tradition on its worthless side, and it will not exalt a subject which the records of centuries have shewn to be incapable of being raised; it will, however, let us know where we are.\n\nOn the face of the question a tradition of all kinds of rubbish is very likely to have been handed down from antiquity, and in respect of occultism, the last drift and scattermeal has passed into the Grimoires, Keys of Solomon and other rituals innumerable by which Art Magic has passed into written record.\n\nAs this book represents, under a new title and with many additions, a work which was issued originally in 1898, I have accepted the opportunity to indicate its position in respect of far more important works embodying my construction of the Secret Tradition in Christian Times."


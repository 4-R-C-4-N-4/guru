[content]
body = "The attempt to propitiate the Deity by means of prayers, sacrifices and abstinence, and thus to obtain the Divine assistance for the successful consummation of hideous offences and preposterous or impossible undertakings, is, of course, madness; for the God acknowledged and invoked by Goëtic Magic is not the Principle of Evil, as the myth of Modern Satanism supposes, but the \"terrible and venerable Deity\" Who destroyed the power of the rebellious angels--alternatively the Jehovah of the Jewish rituals and the Trinity of the Christian magical cycle.\n\nThe insane observance followed in reality from the interpretation placed by Goëtic Theurgy on the fundamental doctrine of Practical Magic, namely, the power of Divine words to compel the obedience of all spirits to those who could pronounce them.\n\n[paragraph continues] Collections of these words and names were recited as invoking and binding forms, and, incorporated into a suitable setting of official prayers, were used in all magical ceremonies.\n\nBlack Magic was sometimes their application to more unlawful purposes and sometimes to the same purposes.\n\nThe utterance of the Divine Name, which was supposed to make the devils tremble and place them at the will of the Magus, was at least equally powerful, it was argued, to enforce their obedience for a purpose in consonance with their own nature.\n\nBehind this there lay also the tacit assumption that it was easier to control demons than to persuade angels.\n\nThen seeing that prayer to God and the invocation of the Divine Names presuppose a proper spirit of reverence, devotion and love as the condition upon which prayer is heard, it became a condition in Goëtia.\n\nThe first impossibility required of the adept in Black Magic is therefore that he should love God before he bewitches his neighbour; that he should put all his hopes in God before he makes pact with Satan; that, in a word, he should be good in order to do evil."


[content]
body = "Click to view For Wednesday, to Astaroth This experience is performed in its circle at night, from ten to eleven o'clock; it is designed to obtain the good graces of the King and others.\n\nWrite in the circle as follows: Come , ASTAROTH!\n\nCome , ASTAROTH!\n\nCome , ASTAROTH!\n\nCONJURATION I conjure thee, ASTAROTH , wicked spirit, by the words and virtues of God, by the Powerful God, Jesus Christ of Nazareth , unto Whom all demons are submitted, Who was conceived of the Virgin Mary; by the mystery of the Angel Gabriel, I conjure thee; and again in the name of the Father, and of the Son, and of the Holy Ghost; in the name of the glorious Virgin Mary and of the Most Holy Trinity, in Whose honour do all the Archangels, Thrones, Dominations, Powers, Patriarchs , Click to view Prophets, Apostles and Evangelists sing without end; Hosannah, Hosannah.\n\nHosannah, Lord God of Hosts, Who art, Who wast, Who art to come, as a river of burning fire!\n\nNeglect not my commands, refuse not to come.\n\nI command thee by Him Who shall appear with flames to judge the living and the dead, unto Whom is all honour, praise and glory.\n\nCome, therefore, promptly, obey my will; appear and give Praise to the true God, unto the living God, yea, unto all His works; fail not to obey me, and give honour to the Holy Ghost, in Whose name I command thee .\n\nFor Thursday, to Silcharde This experience is made at night, from three to four o'clock, at which hour he is called, and appears in the form of a King.\n\nA little bread must be given him when he is required to depart; he renders man happy and also discovers treasures.\n\nClick to view Write about the circle as follows: Holy God!\n\nHoly God!\n\nHoly God!\n\nCONJURATION I conjure thee, SILCHARDE , by the image and likeness of Jesus Christ our Saviour, Whose death and passion redeemed the entire human race, Who also wills that, by His Providence, thou appear forthwith in this place.\n\nI command thee by all the Kingdoms of God.\n\nI adjure and constrain thee by His Holy Name, by Him Who walked upon the asp, Who crushed the lion and the dragon.\n\nDo thou obey me and fulfill my commands , being Powerless to do harm unto me or any person whomsoever, either in body or soul.\n\nFor Friday, to Bechard This experience is performed at night from eleven to twelve Click to view o'clock, and a nut must be given to him.\n\nWrite within the circle: Come , BECHARD!\n\nCome , BECHARD!\n\nCome , BECHARD!\n\nCONJURATION I conjure thee, BECHARD , and constrain thee, in like manner, by the Most Holy Names of God, ELOY, ADONAY, ELOY, AGLA, SAMALABACTAY , which are written in Hebrew, Greek and Latin; by all the sacraments, by all the names written in this book; and by him who drove thee from the height of Heaven.\n\nI conjure and command thee by the virtue of the Most Holy Eucharist, Which hath redeemed men from their sins; I conjure thee to come without any delay, to do and perform all my biddings , without any prejudice to my body or soul, without harming my book or doing injury to those that accompany me .\n\nFor Saturday, to Guland This experience is performed at night from eleven to twelve o'clock, and so soon as he appears burnt bread must be given him.\n\nAsk him anything that you will, and he will obey you Click to view on the spot."


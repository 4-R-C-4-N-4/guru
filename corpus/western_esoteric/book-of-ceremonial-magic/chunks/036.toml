[content]
body = "There are prayers for voyages, prayers addressed to the Cross, and then under the Tau symbol, commencing with the curious exclamation, Per signum ✠ Domini Tau, libera me , there follows a long conjuration, as express as anything in Magic, designed to prevent the petitioner from injury by any steel weapons whatsoever.\n\nForming part of this ceremony is the pseudo-epistle addressed by Jesus Christ to King Abgar, explaining why our Saviour could not come Himself to that monarch, and promising to send His disciple Thaddeus when He had fulfilled the work given Him by His Father.\n\nIt goes on to say that Christ has written it with His own hand, and that wheresoever the recipient shall be, in house or field, by sea or stream, sive in prætio Paganorum seu Christianorum --such is the stultification thereof--his enemy shall never prevail over him.\n\nThe king received the epistle with many tears and prayers, all which being duly described, the conjuration of the baculi, gladii, lanceæ, enses, cultelli, sagittæ, claves, funes, et omnia alia genera armorum , is continued.\n\nAs it is difficult to say where the original Enchiridion actually begins, so it is uncertain where it ends.\n\nA variety of miscellaneous prayers are, however, attributed to well-known saints quite outside the Carlovingian period, and to Innocent IV.\n\nand John XX., without prejudice to a further orison of the great Pope Leo himself.\n\nThen come the \"curious secrets\"--to conciliate and discover one's proper genius, to become invulnerable, to prevent a gun from going off, to behold a future husband or wife, all effected by means of formal prayers--a kind of royal road to the chief ends of Magic, without apparently exceeding the devotional discipline of the Church.\n\nTo complete the analysis of this curious collection, its most important practical part is here added, namely:--"


[content]
body = "Click to view THE SECRET SEAL OF SOLOMON PRAYER AT VESTING By the figurative mystery of this holy vestment, I will clothe me with the armour of salvation in the strength of the Most High, ANCOR, AMICAR, AMIDES, THEODONIAS, ANITOR , that so the end which I desire may be effected, O ADONAI , through Thy strength, to whom be praise and glory for ever and ever .\n\nPrayers should also be offered in harmony with the intention of the operator before pronouncing the forms of evocation, as follows-- Click to view THE RING OF THE EXORCIST FIRST CONJURATION I invoke and conjure thee, O Spirit N., and, fortified with the power of the Supreme Majesty, I strongly command thee by BARALAMENSIS, BALDACHIENSIS, PAUMACHIE, APOLORESEDES and the most potent princes GENIO, LIACHIDE , Ministers of the Tartarean Seat, chief princes of the seat of APOLOGIA in the ninth region; I exorcise and command thee, O Spirit N., by Him Who spake and it was done, by the Most Holy and glorious Names ADONAI, EL, ELOHIM, ELOHE, ZEBAOTH, ELION, ESCHERCE, JAH, TETRAGRAMMATON, SADAI : do thou forthwith appear and shew thyself unto me, here before this circle, in a fair and human shape, without any deformity or horror; do thou come forthwith, from whateverpart of the world, and make rational answers to my questions; come presently, come visibly, come affably, manifest that which I desire, being conjured by the Name of the Eternal, Living and True God, HELIOREM ; I conjure thee also by the particular and true Name of thy God to whom thou owest thine obedience; by the name of the King who rules over thee, do thou come without tarrying; come, fulfil my desires; persist unto the end, according, to mine intentions .\n\nI conjure thee by Him to Whom all creatures are obedient, by this ineffable Name, TETRAGRAMMATON JEHOVAH , by which the elements are overthrown, the air is shaken, the sea turns back, the fire is generated, the earth moves and all the hosts of things celestial, of things terrestrial, of things infernal, do tremble and are confounded together; speak unto me visibly and affably in a clear, intelligible voice, free from ambiguity.\n\nCome therefore in the name ADONAI ZEBAOTH ; come, why dost thou tarry?\n\nADONAI SADAY , King of kings, commands thee ."


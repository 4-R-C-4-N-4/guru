[content]
body = "Click to view THE SEAL OF VAPULA LX.\n\nVAPULA, a strong duke, comes in the form of a lion with griffin's wings.\n\nHe gives skill not only in manual professions but also in philosophy and the sciences contained in books--I suppose, as distinguished from the secret sciences.\n\nClick to view THE SEAL OF ZAGAN LXI.\n\nZAGAN, a great king and president, appears at first in the form of a bull, with the wings of a griffin, but after in human shape.\n\nHe makes men witty, turns water into wine, blood into oil and oil into water; he can change any metal into coin of the realm and can make fools wise.\n\nClick to view THE SEAL OF VALAC LXII.\n\nVALAC, a great president, comes as a little boy with the wings of an angel and riding on a two-headed dragon.\n\nHe gives true answers concerning hidden treasures, tells where serpents may be seen and will deliver them helpless to the exorcist.\n\nClick to view THE SEAL OF ANDRAS Click to view THE SEAL OF FLAUROS LXIII.\n\nANDRAS, a great marquis, comes in the form of an angel, with the head of a black night-raven, riding upon a strong black wolf and having a sharp bright sword gleaming in his hands.\n\nHe sows discord and will kill the unwary.\n\nLXIV.\n\nFLAUROS, a great duke, appears at first like a terrible leopard, but at the command of the exorcist he puts on the shape of a man, with fiery eyes and terrible countenance.\n\nHe gives true answers of things past, present and future, but unless commanded into the triangle he will deceive the exorcist.\n\nHe converses gladly of divinity and the creation of the world, as also of the fall of spirits, his own included.\n\nIf desired, he will destroy and burn the enemies of the operator, nor will he suffer him to be tempted, by spirits or otherwise.\n\nLXV.\n\nANDREALPHUS, a mighty marquis, appears at first in the form of a peacock, with a great noise, but after puts on human shape.\n\nHe teaches geometry perfectly and all that belongs to measurements, astronomy included.\n\nHe can transform men into the likeness of a bird.\n\nClick to view THE SEAL OF ANDREALPHUS Click to view THE SEAL OF CIMERIES LXVI.\n\nCIMERIES, a powerful marquis, appears like a valiant soldier on a black horse.\n\nHe rules the spirits in the parts of Africa; he teaches grammar, logic and rhetoric, discovers buried treasures and things lost and hidden; he can make a man appear like a soldier of his own kind.\n\nClick to view THE SEAL OF AMDUSCIAS LXVII.\n\nAMDUSCIAS, a great duke, comes first like an unicorn, but will stand up at request in human shape, causing all manner of musical instruments to be heard but not seen.\n\nHe makes trees fall at the will of the operator and gives excellent familiars.\n\nLXVIII.\n\nBELIAL, a mighty king, created next after Lucifer, appears in the form of a beautiful angel, seated in a chariot of fire and speaking with a pleasant voice.\n\nHe fell first amongst the superior angels who went before Michael and other heavenly angels.\n\nHe distributes preferences for senatorships, Click to view THE SEAL OF BELIAL causes favours of friends and foes and gives excellent familiars.\n\nHe must have offerings and sacrifices made to him.\n\nClick to view THE SEAL OF DECARABIA LXIX.\n\nDECARABIA, a marquis, comes in the form of a star in a pentacle, but puts on the image of man at command.\n\nHe discovers the virtues of herbs and precious stones, makes birds seem to fly before the exorcist and remain with him as familiars, singing and eating like other birds."


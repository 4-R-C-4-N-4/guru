[content]
body = "That designed for the Master or chief operator should bear the words ELOHIM JITOR, proceeding from point to hilt.\n\nFor that of the first disciple, write the name CARDIEL upon the handle, and upon the blade REGION, proceeding from point to hilt.\n\nIt should appear on both sides transversely, but add on the one PANORAIM ✠, and on the other HEOMESIM ✠.\n\nOn the sword of the second disciple write URIEL, SARAION, GAMERIN ✠, DEBALIIN, in the manner before described.\n\nOn that of the third disciple write DANIEL, IMETON, LAMEDIIN ✠, ERADIN, and fit the same with a handle of white bone.\n\nThe following Conjuration must be recited secretly over the swords:-- I conjure you, O sword, by the three Holy Names, ALBROT, ABRACADABRA, JEOVA!\n\nBe thou my fortress and defence against all enemies, visible and invisible, in every magical work.\n\nBy the Holy Name SADAY , which is great in power, and by these other names, CADOS, CADOS, CADOS, ADONAY, ELOY, ZENA, OTH, OCHIMANUEL , the First and the Last, Wisdom, Way, Life, Virtue, Chief, Mouth, Speech, Splendour, Light, Sun, Fountain, Glory, Mountain, Vine, Gate, Stone, Staff, Priest, Immortal, MESSIAH , Sword, do thou rule in all my affairs and prevail in those things which oppose me.\n\nAmen ."


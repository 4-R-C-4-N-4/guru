body = "Click to view Or, according to the later edition:-- Click to view Add also these signs.-- Click to view Or, according to the later edition:-- Click to view Lastly, on the eastern side, the said skin must be set to dry in the sun for three days, the ensuing characters being cut with a new knife:-- Click to view This being accomplished, recite Psalm lxxi., Deus, judicium tuum regi da , &c., and cut the following characters:-- Click to view The figure being thus far completed, recite the verses Afferte Domino, patriæ gentium , occurring in Psalm xcv.: Cantate Domino Canticum novum , of which the seventh versicle is: Offerte Domino, Filii Dei , &c., and cut subsequently these characters:-- Click to view Next recite Psalm lxxvii.: Attendite, popule meus, legem meam , and compose the following figure:-- Click to view This being accomplished, recite Psalm ii.: Quare fremuerunt gentes populi meditati sunt inania ?\n\nThen make another figure as follows:-- Click to view Or, alternatively:-- Click to view And recite Psalm cxv.: Credidi propter quod locutus sum .\n\nFinally, on the last day of the month a Mass for the Dead shall be offered; the prose shall be omitted and also the Gospel of St.\n\nJohn, but at the end of the Mass the priest shall recite the Psalm Confitemini Domino quoniam bonus , &c.\n\nIn Honour of the Most Holy and August Trinity, the Father, the Son, and the Holy Ghost.\n\nAmen.\n\nThe Seventy-two Sacred Names of God.--TRINITAS, SOTHER, MESSIAS, EMMANUEL, SABAHOT, ADONAY, ATHANATOS, JESU, PENTAGNA, AGRAGON, ISCHIROS, ELEYSON, OTHEOS, TETRAGRAMMATON, ELY, SADAY, AQUILA, MAGNUS HOMO, VISIO, FLOS, ORIGO, SALVATOR, ALPHA AND OMEGA, PRIMUS, NOVISSIMUS, PRINCIPIUM ET FINIS, PRIMOGENITUS, SAPIENTIA, VIRTUS, PARACLITUS, VERITAS, VIA, MEDIATOR, MEDICUS, SALUS, AGNUS, OVIS, VITULUS, SPES, ARIES, LEO, LUX, IMAGO, PANIS, JANUA, PETRA, SPONSA, PASTOR, PROPHETA, SACERDOS, SANCTUS, IMMORTALITAS, JESUS, CHRISTUS, PATER, FILIUS HOMINIS, SANCTUS, PATER OMNIPOTENS, DEUS, AGIOS, RESURRECTIO, MISCHIROS, CHARITAS, ÆTERNAS, CREATOR, REDEMPTOR, UNITAS, SUMMUM BONUM, INFINITAS.\n\nAMEN.\n\nHereinafter follow the three small pentacles of Solomon, and that of the Gospel of St.\n\nJohn.\n\nClick to view The Beginning of the Holy Gospel according to John.\n\nGlory be to Thee, O Lord .\n\nIN THE BEGINNING WAS THE WORD, &c., in extenso, so far as the end of the fourteenth versicle .\n\nThanks be to God.\n\nHosanna to the Son of David!\n\nBlessed is He Who cometh in the Name of the Lord.\n\nHosanna in the Highest.\n\nWe invoke Thee.\n\nWe adore Thee.\n\nWe Praise.\n\nThee."


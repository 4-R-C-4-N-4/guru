[content]
body = "Be this done by the virtue of God the Father ✠ , by His blessed Son ✠ and by the union of the Holy Spirit ✠ , even by the Trinity in unity, Which liveth and reigneth for ever and ever.\n\nAmen ✠ .\n\nIncessantly do I call, adjure, conjure, ordain and require thee, Human Spirit, by the Most Holy and Undivided Trinity, by the immortality which cometh after death, by the power and victory of Hell, by the bearer of the Seven Swords, by the Most Holy and Secret Seal, by the sacred love of Jesus, by all the Ministers and Archangels of God, Ophanim ✠ , Aralim ✠ , Hasmalim ✠ , [paragraph continues] Cherubim ✠ , Seraphim ✠ , and Malachim ✠ , and by the terrible torments of the demons.\n\nI conjure thee also by the good angels Maluzim ✠ , Penpalabim ✠ , and Calizantin ✠ , by all the Powers of Heaven ✠ , by the earth ✠ and by the torments of Hell; I adjure thee by all mysteries, by the Crucifixion, by the dolorous scourging, by the crowning with thorns, by the bitterness of the Divine death, by the Most Holy and Ineffable Name of Jesus ✠ , which is sacred unto all Christians, but terror and anguish to the evil, for they have refused the salvation which has been offered them by the great living God.\n\nI conjure thee to come before me immediately, in thy Proper human form, even as when thy treasure was buried.\n\nCome before this circle, answer me faithfully, without falsehood and without enigmas.\n\nThis I command thee, in the Name and by the Power of the Triune God, Father, Son and Holy Ghost.\n\nAmen .\n\nA CONJURATION COMPELLING OBEDIENCE I adjure and command thee, Human Spirit, to appear before me under the similitude of fire.\n\nBy the ineffable Name JEHOVAH , by the ineffable and incomprehensible Fiat, by the power which created all things and sustains all things, I conjure and adjure thee to come visibly before this circle.\n\nBy the good ness of God when He created man in His own likeness, by the power of His justice, which expelled the demons, enchaining them in the Infernal Abyss; by His infinite mercy when He sent His Son to redeem us; by all Divine Names and Attributes; by the omnipotence of our Saviour Jesus Christ, destroying the works of hell, blessing the seed of the woman and empowering it to crush the serpent's head--do thou answer me and obey faithfully.\n\nBy the ineffable Name TETRAGRAMMATON , inscribed on this rod, answer me without deception or equivocation.\n\nBy the Power of our Saviour, Who shall judge both thee and me, the quick and the dead, I conjure thee.\n\nCome .\n\nIF THE SPIRIT BE OBSTINATE I conjure thee, Human Spirit, by the Ineffable Name of God, written on this sheet, but not to be Pronounced; by my blood, most excellently redeemed by the Lord of the Prophets, Jesus Christ; by His most Glorious Mother; by the insignia of His humility; by the great book of the judgments of God; by the angels, archangels and all the host of heaven.\n\nBe thou obedient unto me, a Christian baptized in the holy waters of Jordan.\n\nAnswer me exactly, without enigma or pretence.\n\nMake known the power which aids thee.\n\nI command thee by the most holy Name of God, Who hath condemned thee to frequent this place wherein thou hast buried thy treasure.\n\nAmen.\n\nAmen.\n\nAmen ."


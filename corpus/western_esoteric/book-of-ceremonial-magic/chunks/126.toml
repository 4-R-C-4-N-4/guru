[content]
body = "The name of the required spirit must here be added on the parchment, when he will duly appear-the ordinary accidents excepted--and will grant what is desired of him--that is to say, if it so happen--after which he may be dismissed by the previous Discharge.\n\nThe characters should be burnt in each case, as they avail once only.\n\nANOTHER CONJURATION I conjure thee, N., by the great living God, the Sovereign Creator of all things, to appear under a comely human form, without noise and without terror, to answer truly unto all questions that I shall ask thee.\n\nHereunto I conjure thee by the virtue of these Holy and Sacred Names .\n\nClick to view THE IMP STATUE.\n\nLINCOLN."


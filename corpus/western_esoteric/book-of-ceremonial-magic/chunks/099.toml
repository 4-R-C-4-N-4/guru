[content]
body = "Amen .\n\nWhen shaping this knife recite the Psalm Deus, judicium tuum Regi da .\n\nThen write these words upon the Rod: AGLA, ADONAY, ELOE, may the work of this wooden Knife be accomplished by you!\n\nSay also over it: CARA, CHERNA, SITO, CIRNA.\n\nNext, skin the animal with the same wooden knife, saying: ADIRAM, DAHNAY, SADAY, TETRAGRAMMATON, ANERETON, ANERETON, CURETON, Holy Angels of God, be ye present and give virtue to this parchment.\n\nMay it be consecrated by you, and thus may all things which shall be written therein acquire the virtue needful for the attainment of the desired end .\n\n.\n\n.\n\n.\n\nWhen you have skinned it, take salt and say over it: God of gods, vouchsafe to bless and sanctify this salt, so that it may cleanse the parchment which I am about to prepare therewith, and that both may obtain virtue, power and effect .\n\n.\n\n.\n\n.\n\nSalt the skin and set it in the sun for fifteen days; next take a pot of glazed clay and write these characters about it; place a large Click to view piece of quicklime with some blessed water in this vessel, and when the lime is slaked, steep the skin for the space of nine whole days therein, after which it must be extracted and scraped with a wooden knife to remove the hair.\n\nLet it dry for eight days in the shade, but when setting it to dry, asperge it and say: In the Name of the Great Eternal God, I asperge thee.\n\nBe thou cleansed from all vice and iniquity !\n\n[When dry] perfume it with sweet-smelling herbs; wrap it in the silken cloth with the other instruments of the Art; and take notice that if it be seen by a woman in her times, it will lose all its virtue.\n\nBut if this kind of parchment be too difficult to prepare, take virgin parchment of any animal; exorcise it as before; place lighted coal in a new glazed pot; mix good perfumes therewith; and hold your parchment above the vessel to receive them.\n\nBefore all, however, write these characters about the pot Click to view with the instruments of the Art.\n\nSo long as the fumigation goes on, say: Angels of God, be my help, and by you be my work accomplished !\n\n.\n\n.\n\n.\n\nWhen it is finished, say: LAZAY, SALMAY, DALMAY, ANEPATON, CENDRION, ANITOR, ENCHEION, Holy Angels of God, be ye present and give virtue to this parchment, so that it may in turn acquire that of all characters with which it shall be inscribed, by the help of the pious and merciful God .\n\n.\n\n.\n\n.\n\nRecite the Psalms Deus, judicium tuum Regi da and Laudate Dominum omnes gentes , adding the following CONJURATION I conjure thee, creature of parchment, by all the names of God, that nothing which shall be written within thee may ever be blotted from truth .\n\nLastly, asperge it and place it in the silken cloth, as above.\n\nThe Grimorium Verum indulges the weak pupil by a further simplification, as follows:--If you are unable to prepare the parchment yourself, buy a new one and conjure it; asperge also and fumigate it three times.\n\nThe sacrifice, with its delays and unpleasantness, is thus abrogated, and the operator can proceed at once to the practical mystery of the Sanctum Regnum ."


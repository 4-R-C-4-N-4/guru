[content]
body = "Click to view THE SEAL OF SEERE LXX.\n\nSEERE, a mighty prince under Amaymon, King of the East, appears in the form of a beautiful man on a strong, winged horse.\n\nHe brings all things to pass suddenly, transports to any place in the twinkling of an eye and discovers all thefts.\n\nHe is indifferently good or bad, and will do the will of the operator.\n\nLXXI.\n\nDANTALIAN, a mighty duke, appears in the form of a man with many faces of men and women; he has a book in his right hand.\n\nHe teaches all arts and sciences, declares all secret counsels, for he knows all human thoughts and can change them at his will.\n\nHe kindles love and shews the similitude of any person in a vision, wheresoever they may be.\n\nClick to view THE SEAL OF DANTALIAN Click to view THE SEAL OF ANDROMALIUS LXXII.\n\nANDROMALIUS, a great duke and earl, appears in the form of a man holding a serpent in his hand.\n\nHe returns stolen goods, reveals the thief, discovers all wickedness and underhand dealing, as also hidden treasures.\n\nSuch are the prime mysteries of Goëtia according to the tradition of the Lemegeton ; such is the work which has been described in the interest of White Magic as distinct from the Key of Solomon , but highly important and valuable in its own department.\n\nViewed in the light of these two-and-seventy methods of accomplishing all abominations, it would seem that the three \"analogical realms of occult philosophy\" are the three kingdoms which we have known under other names from our childhood--as \"the world, the flesh and the devil.\" It will be unnecessary after their enumeration to argue any longer upon the distinction between Black and White Magic as it appears in one of the oldest and best of the Rituals.\n\nThere is no longer any need to inquire whether the operator is saved by his intention, for we are acquainted with the nature of the intentions which govern procedure in one of the most reputable memorials of White Magic which is now extant.\n\nThe evocation of Lucifer and Astaroth, whatever the pretext, must be Click to view THE TRIANGLE OF SOLOMON the first step towards Satanism; but here we have Satanism undiluted, plus all the mysteries of the impure Venus.\n\nTo dismiss, therefore, the definition which no longer perplexes, let us establish that the distinction between White and Black Magic is the distinction between the Lemegeton and the Grimoire of Honorius ,--in other words, between cipher and zero."


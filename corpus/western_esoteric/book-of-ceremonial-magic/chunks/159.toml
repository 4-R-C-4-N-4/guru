[content]
body = "Éliphas Lévi observes that the directions recall the history of the bell of Rodilard, but the criticism is scarcely commensurate, for the material is certainly obtainable, nor would it be necessary to catch one's own hyena.\n\nThe point which was missed by the occultist may be evident to the ordinary reader; the head of the hyena is short-coated, and the hairs could not be braided.\n\nIt is not, however, unreasonable that impossible conditions should attach to an impossible object."


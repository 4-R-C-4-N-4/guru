[content]
body = "He relies, however, on the help of those Guardian Angels which Christian tradition and doctrine attribute to each soul of man.\n\nOn the other hand, he makes no use of words, figures or pentacles, which he proscribes as abominations invented by diabolical enchanters.\n\nHe is, therefore, an exponent of Art Magic in the utmost simplification thereof, but that which he saves in ritual he expends in the dramatic elaboration of general mise en scène .\n\nLooking, however, at his claim, one is tempted to think for a moment that we are in the presence of new modes and even of new intentions in respect of \"magical vanity.\" This time surely, the work is on the side of God, and there is a certain encouragement in the mere title, which says that the content of the book is actually that Holy Magic which God gave unto Moses--to Aaron, David, Solomon--to the other saints, patriarchs and prophets; that it is also the true and the Divine Wisdom, a statement reiterated continually throughout the text itself.\n\nIt is all for the glory of God, for His high honour, the good of the pious operator and that of the human race.\n\nBut when we come to the dealings with spirits, we find that they are Lucifer, Leviathan, Satan and Belial, for the superior princes, and Astaroth, Asmodeus, Beelzebub, et hoc genus omne , for the lesser powers.\n\nFurthermore, these demons may be summoned indifferently for operations of good or evil, while the objects are the usual objects, the time-long interests, the glorious dedications of White and Black Magic, as established by the concurrent testimony of all the Rituals.\n\nThe recovery of stolen things, the acquisition of buried treasures, the stirring up of hatred and enmity, the casting of spells and the usual venereal experiments-such are the ends in view.\n\nThere are even processes in Necromancy, which art is eschewed by all but the most abominable forms of Black Magic.\n\nAs the text has been made available, it may be left at this point.\n\nNo doubt the translator will continue to regard it as a work of great \"importance\" from the occult standpoint, and its existence in an English form as \"a real benefit\" to students.\n\nI leave it to him.\n\nClick to view THE SUN-GOD RA SLAYING THE DRAGON OF DARKNESS.\n\nFrom the Papyrus of Hunefer, c.\n\nB.C.\n\n1370 ."


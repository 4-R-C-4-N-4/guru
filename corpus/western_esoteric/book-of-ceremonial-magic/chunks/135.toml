[content]
body = "The Spirit's Reply I cannot comply with thy request except thou dost give thyself Click to view PLATE IX: THE GOËTIC CIRCLE OF PACTS .\n\nover to me in twenty years, to do with thy body and soul as I please .\n\nLUCIFUGE ROFOCALE Thereupon throw him your pact, which must be written with your own hand on a sheet of virgin parchment; it should be worded as follows, and signed with your own blood:-- I Promise the grand LUCIFUGE to reward him in twenty years' time for all treasures that he may give me.\n\nIn witness whereof I have signed myself N.N.\n\nReply of the Spirit I cannot grant thy request .\n\nLUCIFUGE ROFOCALE In order to enforce his obedience, again recite the Supreme Appellation, with the terrible words of the Clavicle, till the spirit reappears, and thus addresses you:-- Of the Spirit's Second Manifestation Why dost thou torment me further?\n\nLeave me to rest, and I will confer upon thee the nearest treasure, on condition that thou dost set apart for me one coin on the first Monday of each month, and dost not call me oftener than once a week, to wit, between ten at night and two in the morning.\n\nTake up thy pact; I have signed it.\n\nFail in thy promise, and thou shalt be, mine at the end of twenty years .\n\nLUCIFUGE ROFOCALE Reply to the Spirit I agree to thy request, subject to the delivery of the nearest treasure which I can at once carry away .\n\nFollow the spirit without fear, cast your pact upon the hoard, touch it with your rod, remove as much as you can, return into the triangle, walking backwards, place the treasure in front of you, and recite the Discharge of the Spirit, as given in the preceding Rite.\n\nIt will be seen from the wording of the compact that it is designedly evasive and the final response of the supposed spirit seems to recognise that it can obtain only by neglect on the part of the sorcerer.\n\nBut if there are Courts of judgment in the nethermost world, the sorcerer might find a certain difficulty in arguing such a case with the advocatus diaboli .\n\nLucifer and his deputies are accredited with an awkward skill in getting possession of the defendant when the time of the pact expires.\n\nThere were apparently more binding contracts, and better ways of over-riding them, for in the year 1678 the Abbé Eynatton published a Manual of Exorcisms which contains the following formal process for forcing the Demon to return any writing which constitutes an agreement with him:-- EXORCISM O most merciful God, Whose Power hath no limit, Whose dominion is supreme over all beings, so that nothing can possibly be estreated from Thy rule by apostasy; behold, we have sinned against Thee, we have provoked Thy most just wrath, when we have failed to obey Thy commands, above all when., forsaking Thy rule and Thy friendship, we have abjured Thee and have consorted with the impious demons, nor yet contented with Thy denial, have bound ourselves in writing to those demons, surrendering the document of our voluntary obligation against Thee into their custody.\n\nBut Thy mercies aye without number, O Lord of loving-kindness, and it is Thine to spare and to Pardon; look, therefore, with compassion upon this Thy creature, who, having formerly denied Thee and given himself in writing to the demons, but now, having returned to himself by the help of Thine infinite goodness, doth abhor his impiety, doth desire to be restored unto Thee his true Lord, and to be received with contrite heart into Thy favour."


[content]
body = "§ 2.\n\nConcerning Venereal Experiments We have seen that the sorcerer of the Middle Ages was usually squalid and necessitous; hence he coveted treasures: he was usually despised, and hence he longed for mastery, for the prestige of mystery and the power of strange arts: he was usually lonely and libidinous, and hence he sought, by means of spells and philtres, to compel the desire of women.\n\nTo be rich in worldly goods, to trample on one's enemies and to gratify the desires of the flesh--such are the ends, variously qualified and variously attained, of most Ceremonial Magic; hence also the Rituals abound in Venereal Experiments.\n\nIn such as the Grimorium Verum there is no attempt to hide their illicit nature; in the Key of Solomon it is disguised, but the process for obtaining favour and love which occurs in that work is not really a more lawful experiment than that Pour faire venir une Fille vous trouver, si sage qu'elle soit .\n\nThe Key of Solomon is reticent and the Grimoires are frank; the one promises the fulfilment of the operator's desire without defining it; the others are explicit and particular.\n\nIt is true also that the one has recourse to Adonai and implores his assistance, while the others invoke the powers of Hell.\n\nThe Book of True Black Magic for once ignores the experience of the Clavicle and substitutes the following:-- Concerning the Experiment of Love Whatsoever person be the object of this experiment, whether man or woman, it is needful in making it to observe the proper day and hour.\n\nNote further that it is performed by means of an image of wax or other suitable matter.\n\nBefore composing it, say the following words over the wax: NOGA, JES, ASTROPOLIM, ASMO, COCCAV, BERMONA, TENTATOR, SOIGNATOR-- I conjure you, ministers of love and incontinence, by Him who hath condemned you to hell!\n\nDo ye consecrate this wax in a regular manner, that it may acquire the desired virtue, by the Power of the Most Holy Adonay, Who liveth and reigneth for ever and ever.\n\nAmen .\n\nThe image must then be composed and suitable characters inscribed thereon with the male goose-quill of the Art, after which it must be fumigated while reciting the following words:-- O thou most Powerful King PAYMON , whose absolute rule and reign is in the western quarter!\n\nO thou, EGIM , Most strong King, whose empire is in the cold region!\n\nO thou, ASMODEUS , who governest in the South!\n\nO thou, AYMAMON , Most noble [paragraph continues] King, monarch of the Eastern world, whose reign began from of old and will endure to the end of time!\n\nI invoke and beseech you by Him Who spake and it was, Whose sole word hath created all, Whom all creatures obey; by the seat of His Majesty; by His Will and His Name; by Him Who was before the ages and hath created the ages; Whose Name is written with the four letters JOD, HE, VAU, HE ; by the enchantments and power thereof; and by all the signal Names of the Creator; I conjure you to consecrate this image and grant that it may acquire virtue according to our desire, by the Most Holy Name Adonay, the Power of which is without beginning or end .\n\nThis being done, conjure with the Conjuration of the image, and if the woman or man should not appear, place the said image beneath the pillow of your bed, and before three days you shall behold admirable things, while chains or earth shall not stay the desired person from coming to you, for the fulfilment of your purpose, nothing being excepted."


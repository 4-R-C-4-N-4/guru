[content]
body = "Notice.--Before uttering the third Conjuration, should the spirit refuse to comply, read what follows in the Clavicle, and smite all the spirits by plunging both the forked extremities of your rod into the flames.\n\nBe not alarmed in so doing at the frightful howls which you may hear, for at this extreme moment all the spirits will manifest.\n\nThen, before reading the Clavicle, and in the midst of the commotion, recite the third Conjuration.\n\nTHIRD CONJURATION I adjure thee, Emperor Lucifer, as the agent of the strong living God, of His beloved Son and of the Holy Ghost, and by the Power of the Great ADONAY, ELOIM, ARIEL and JEHOVAM , to appear instantly, or to send thy Messenger Astarôt, forcing thee to forsake thy hiding-place, wheresoever it may be, and warning thee that if thou dost not manifest this moment, I will straightway smite thee and all thy race with the Blasting Rod of the great ADONAY, ELOIM, ARIEL and JEHOVAM , &c.\n\nAt this point, should the spirit still fail to appear, plunge the two ends of your rod a second time into the flames, and recite the following potent words from the grand Clavicle of Solomon:-- GRAND CONJURATION Extracted from the Veritable Clavicle I adjure thee, O Spirit!\n\nby the Power of the grand ADONAY , to appear instanter, and by ELOIM , by ARIEL , by JEHOVAM, by AQUA, TAGLA, MATHON, OARIOS, ALMOAZIN, ARIOS, MEMBROT, VARIOS, PITHONA, MAJODS, SULPHÆ, GABOTS, SALAMANDRÆ, TABOTS, GINGUA, JANNA, ETITNAMUS, ZARIATNATMIX, &C.\n\nA.\n\nE.\n\nA.\n\nJ.\n\nA.\n\nT.\n\nM.\n\nO.\n\nA.\n\nA.\n\nM.\n\nV.\n\nP.\n\nM.\n\nS.\n\nC.\n\nS.\n\nJ.\n\nC.\n\nG.\n\nA.\n\nJ.\n\nF.\n\nZ.\n\n&c.\n\nClick to view LUCIFUGE ROFOCALE After a second repetition of these sublime and powerful words, you may be sure--as the deposition affirms--that the spirit will respond after the ensuing manner.\n\nOf the Manifestation of the Spirit Lo, I am here!\n\nWhat dost thou seek of me?\n\nWhy dost thou disturb my repose?\n\nSmite me no more with that dread rod!\n\nLUCIFUGE ROFOCALE Reply to the Spirit Hadst thou appeared when I first invoked thee, I had by no means smitten thee; remember, if the request which I make thee be refused, I am determined to torment thee eternally .\n\nSOLOMON The Spirit's Answer Torment me no further.\n\nSay, rather, what thou dost require at my hands .\n\nLUCIFUGE ROFOCALE The Requisition I require that thou shalt communicate two several times on each night of the week, either with myself or with those who are entrusted with my present Book, the which thou shalt approve and sign; I permit thee the choice of those hours which may suit thee, if thou approvest not those which I now enumerate.\n\nTo wit: On Monday at nine o'clock and at midnight.\n\nOn Tuesday at ten o'clock and at one in the morning.\n\nOn Wednesday at eleven o'clock and at two in the morning.\n\nOn Thursday at eight and ten o'clock.\n\nOn Friday at seven in the evening and at midnight.\n\nOn Saturday at nine in the evening and at eleven at night."


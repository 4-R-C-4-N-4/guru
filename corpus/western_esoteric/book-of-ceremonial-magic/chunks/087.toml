[content]
body = "Sun Moon Mars It will be seen from this table that there is a recurring rule of the planets in unbroken succession through the whole week, after which the sequence recommences in the same order, each planet ruling the first and the eighth of the day hours and the third and the tenth of the night hours of the day referred to that planet.\n\nThese constitute the planetary hours.\n\nThe Book of Black Magic , still following and confusing the statements of the Clavicle, lays down that the hours of Saturn, Mars and Venus are good for communion with spirits; the hour of Saturn serves for invoking souls in hell, and to have news of those who have died naturally.\n\nThe souls of those who have been slain should be invoked in the hour and also on the day of Mars.\n\nIt adds that experiments made faithfully and with great diligence, observing all that is laid down, will be invariably verified, but to fail over the smallest part will void perfection in any.\n\nThe hours of Saturn and of Mars are also good for preparation, on those days when they are in conjunction with the Moon, or indeed with one another.\n\nIn a contrary or quadrate aspect they are good for experiences of hatred, lawsuits, enmities, discords and so forth.\n\nThe hours of the Sun, Jupiter and Venus, especially their planetary hour, are favourable both to ordinary and extraordinary experiments not included in those already mentioned.\n\nThose of the Moon are especially suited to the conjuration of spirits, works of necromancy, and the finding of stolen goods; but the luminary must be collocated and in a terrestrial sign-that is to say, (in conjunction) with Mercury for love, favours and invisibility; for works of hatred and discord in a sign belonging to the fiery triplicity--Aries, Leo, Sagittarius; for extraordinary experiences in an aquatic sign--Cancer, Scorpio, or Pisces.\n\nShould, however, the observation of these rules seem over-difficult, \"do this only\"--see that the Moon waxing is in an equal number of degrees with the Sun; it is then very good for the performance of the above experiments.\n\nWhen the full Moon is in opposition to the Sun, it is excellent for warlike, riotous and discordant experiments; in its last quarter it favours works which deal directly with operations of destruction and ruin.\n\nThe best time for the experiences of death and invisibility is when the Moon is almost deprived of light.\n\nWhen the Moon is in conjunction with the Sun nothing must be undertaken, because it is an unfortunate time and all things fail therein; but when in its crescent period, acuated with light, any experiences may be prepared and any writings and operations accomplished, especially for conversing with spirits.\n\nIt must, however, be the day of Mercury and in the hour of that planet, the Moon being in an earthly or aërial sign, as above said, and in a pair number with the Sun."


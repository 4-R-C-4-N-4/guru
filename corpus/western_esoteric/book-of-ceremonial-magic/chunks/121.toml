[content]
body = "Be disobedient, refuse to come, and by the power of the Supreme Being, the everlasting Lord, that God Who created thee and me, the whole world, with all contained therein, in the space of six days; by EYE , by SARAY , by the virtue of the Name PRIMEMATUM , which commands the whole host of Heaven; be disobedient, and behold I will curse and deceive thee of thine office, thy joy and thy place; I will bind thee in the depths of the bottomless pit, there to remain until the Day of the Last judgment.\n\nI will chain thee in the Lake of Eternal Fire, in the Lake of Fire and Brimstone, unless thou come quickly, appearing before this circle, to do my will Come, therefore, in the Holy Names ADONAI, ZEBAOTH, AMIORAM ; come, ADONAI commands thee .\n\nShould he still fail to appear, you may be sure that he has been sent by his King to some other place.\n\nInvoke, therefore, the King to despatch his servant as follows:-- INVOCATION OF THE KING O thou great and powerful King AMAYMON , Who rulest by the power of the Supreme God, EL , over all Spirits, superior and inferior, but especially over the Infernal Order in the Dominion of the East, I invoke and command thee by the particular and true Name of God, by the God Whom thou dost worship, by the Seal of thy creation, O the most mighty and powerful Name of God, JEHOVAH, TETRAGRAMMATON , Who cast thee out of Heaven with the rest of the Infernal Spirits; by all the other potent and great Names of God, Creator of Heaven, Earth and Hell, of all contained therein; by their powers and virtues; by the Name PRIMEMATUM , which commands the whole host of Heaven.\n\nDo thou force and compel the Spirit N.\n\nhere before this circle, in a fair and comely shape, without injury to myself or to any creature, that he may give me true and faithful answer, so that I may accomplish my desired end, whatsoever it be, provided that it is proper to his office, by the power of God, EL , Who hath created and doth dispose of all things, celestial, aërial, terrestrial and infernal .\n\nHaving twice or thrice invoked the King in this manner, again conjure the spirit, using the previous forms, and rehearsing them several times, whereupon he will come assuredly.\n\nYet should he fail, be convinced that he is bound with chains in hell, and is not in the custody of his King.\n\nTo set him free it is necessary to recite THE CHAIN CURSE O thou wicked and disobedient N., because thou hast not obeyed or regarded the words which I have rehearsed, the glorious and incomprehensible Names of the true God, Maker of all things in the world, now I, by the power of these Names, which no creature can resist, do curse thee into the depths of the Bottomless Pit, to remain until the Day of Doom, in the Hell of unquenchable fire and brimstone, unless thou shalt forthwith appear in this triangle, before this circle, to do my will.\n\nCome, therefore, quickly and peaceably, by the Names ADONAI, ZEBAOTH, ADONAI, AMIORAM .\n\nCome, come, ADONAI , King, of commands thee ."


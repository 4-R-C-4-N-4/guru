[content]
body = "This he must cast upon the treasure, grasping one of its coins at the same moment as a pledge and a surety, and previously flinging down a piece of his own money bitten by his own teeth, after which he may retire, walking backwards and carrying away what he can of the treasure.\n\nThe rest cannot escape him after the above precautions.\n\nHe must, however, take heed not to turn round, whatever noise he may hear, for at this critical moment it will truly seem as if all the mountains in the world were being precipitated upon him.\n\nHe must for this cause be fortified with special intrepidity, must take fright at nothing but keep perfectly firm.\n\nSo acting, he will be led back by the Spirit to the entrance of the circle.\n\nThen shall the Karcist recite the following discharge of the Spirit.\n\nCONJURATION AND DISCHARGE OF THE SPIRIT O Prince Lucifer, I am, for the time, contented with thee.\n\nI now leave thee in peace, and permit thee to retire wheresoever it may seem good to thee, so it be without noise and without leaving any evil smell behind thee.\n\nBe mindful, however, of our engagement, for shouldst thou fail in it, even for a moment, be assured that I shall eternally smite thee with the Blasting Rod of the great ADONAY, ELOIM, ARIEL and JEHOVAM .\n\nAmen .\n\nACT OF THANKSGIVING O Omnipotent God, Who hast created all things for the service and convenience of men, we return Thee most humble thanks for the benefits which, in Thy great bounty, Thou hast poured out on us during this night of Thine inestimable favours, wherein Thou hast granted us according to our desires.\n\nNow, O Almighty God, have we realised all the scope of Thy great promises, when Thou didst say to as.\n\nSeek and ye shall find, knock and it shall be opened unto you.\n\nAnd as Thou hast commanded and warned us to succour the poor, we promise Thee, in the Presence of the great ADONAY, ELM, ARIEL and JEHOVAM , to be charitable and to pour out on them the beneficent beams of the Sun with which those four Potent divinities have enriched us.\n\nSo be it.\n\nAmen .\n\nVALE"


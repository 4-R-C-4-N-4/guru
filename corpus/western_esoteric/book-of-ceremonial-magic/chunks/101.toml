[content]
body = "§ 8.\n\nConcerning Aspersion and Cleansing In the preparation of the instruments, as already abundantly evident, and in the more important works which follow it.\n\nthe ceremonies of aspersion and fumigation, that is, of purifying and consecrating, are continually enjoined.\n\nSprinkling is performed with the Aspergillus , which, according to the Grimorium Verum , should be composed of mint, marjory and rosemary, bound about with a thread woven by a virgin girl.\n\nIt should be made on the day and in the hour of Mercury, the moon waxing.\n\nThe ewer, in the canons of procedure established by True Black Magic , should be a pot of glazed earth, filled with fresh spring water, in which some salt has been cast.\n\nThe following Psalms should be recited over it:-- Domine, ne in furore tuo arguas me , and Domine, exaudi orationem meam , with the addition of this PRAYER O Thou most powerful Lord, my God, my rest, and my life I Do Thou help me, Most Holy Father!\n\nIn Thee I place my hope, Who art the God of Abraham, God of Isaac, God of Jacob, God of the Angels and Archangels, God of the Prophets, and God the Creator of all things.\n\nIn all humility, and with the invocation of Thy Holy Name, I pray that Thou will vouchsafe to bless this water, that in whatsoever place it shall be cast it may sanctify our bodies and our souls, through Thee, Most Holy ADONAY , Whose reign is without end.\n\nAmen .\n\nThe Aspergillus recommended by this Ritual differs somewhat from the former, being of vervain, periwinkle, sage, mint, valerian, ash and basil, taking care not to use hyssop but rosemary in place thereof.\n\nIt should be fitted with a handle of virgin hazel, three palms in length, and bound as before.\n\nThe following characters should be engraved on one side of the said handle:-- Click to view This Aspergillus may be used on any occasion with perfect assurance that all phantoms will be expelled from every place which shall be sprinkled thereby with water duly exorcised.\n\nThe prayer to be used at sprinkling is thus given by the Grimorium Verum :-- In the Name of God Immortal, may God asperge thee, N., and cleanse thee from all illusion and from all wickedness, and thou shall be whiter than snow .\n\nWhen asperging add also: In the Name of the Father ✠ and of the Son ✠ and of the Holy Ghost ✠ .\n\nAmen .\n\nConcerning Incense and Fumigation The Grimorium Verum prescribes a cruse or chafing-dish for fumigation, adding, with a decorative redundance corresponding to its impossible spirit, that it should be filled with freshly kindled coal and fresh fire, the whole blazing.\n\nPlace aromatics thereon, and perfume what you would, saying: Angels of God, be our help, and by you be our work fulfilled !\n\nZAZAY, SALMAY, DALMAY, ANGERECTON, LEDRION, AMISOR, EUCHEY, OR!\n\nGreat Angels!\n\nAnd do Thou also, O ADONAY , be present and impart hereto such virtue that this creature may receive a form, whereby our work may be accomplished!\n\nIn the Name of the Father ✠ and of the Son ✠ and of the Holy Ghost .\n\n✠ Amen .\n\n.\n\n.\n\n.\n\nRecite the Seven Psalms which follow Judicium tuum Regi da and Laudate Dominum omnes gentes ."


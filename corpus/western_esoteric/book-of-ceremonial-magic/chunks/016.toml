body = "PART I THE LITERATURE OF CEREMONIAL MAGIC Click to view THE SERPENT OF THE GARDEN OF THE HESPERIDES.\n\nFrom a Greek Vase Painting.\n\nCHAPTER I The antiquity of Magical Rituals § 1.\n\nThe Importance of Ceremonial Magic THE ordinary fields of psychological inquiry, largely in possession of the pathologist, are fringed by a borderland of occult and dubious experiment into which pathologists may occasionally venture, but it is left for the most part to unchartered explorers.\n\nBeyond these fields and this borderland there lies the legendary wonder-world of Theurgy, so called, of Magic and Sorcery, a world of fascination or terror, as the mind which regards it is tempered, but in either case the antithesis of admitted possibility.\n\nThere all paradoxes seem to obtain actually, contradictions coexist logically, the effect is greater than the cause and the shadow more than the substance.\n\nTherein the visible melts into the unseen, the invisible is manifested openly, motion from place to place is accomplished without traversing the intervening distance, matter passes through matter.\n\nThere two straight lines may enclose a space; space has a fourth dimension, and untrodden fields beyond it; without metaphor and without evasion, the circle is mathematically squared.\n\nThere life is prolonged, youth renewed, physical immortality secured.\n\nThere earth becomes gold, and gold earth.\n\nThere words and wishes possess creative power, thoughts are things, desire realises its object.\n\nThere, also, the dead live and the hierarchies of extra-mundane intelligence are within easy communication, and become ministers or tormentors, guides or destroyers, of man.\n\nThere the Law of Continuity is suspended by the interference of the higher Law of Fantasia.\n\nBut, unhappily, this domain of enchantment is in all respects comparable to the gold of Faerie, which is presumably its medium of exchange.\n\nIt cannot withstand daylight, the test of the human eye, or the scale of reason.\n\nWhen these are applied, its paradox becomes an anticlimax, its antithesis ludicrous; its contradictions are without genius; its mathematical marvels end in a verbal quibble; its elixirs fail even as purges; its transmutations do not need exposure at the assayer's hands; its marvel-working words prove barbarous mutilations of dead languages, and are impotent from the moment that they are understood; departed friends, and even planetary intelligences, must not be seized by the skirts, for they are apt to desert their draperies, and these are not like the mantle of Elijah.\n\nThe little contrast here instituted will serve to exhibit that there are at least two points of view regarding Magic and its mysteries--the simple and homogeneous view, prevailing within a charmed circle among the few survivals whom reason has not hindered from entering, and that of the world without, which is more complex, more composite, but sometimes more reasonable only by imputation.\n\nThere is also a third view, in which legend is checked by legend and wonder substituted for wonder.\n\nHere it is not the Law of Continuity persisting in its formulae despite the Law of Fantasia; it is Croquemetaine explained by Diabolus, the runes of Elf-land read with the interpretation of Infernus; it is the Law of Bell and Candle, the Law of Exorcism, and its final expression is in the terms of the auto-da-fé .\n\nFor this view the wonder-world exists without any question, except that of the Holy Tribunal; it is not what it seems, but is adjustable to the eye of faith in the light from the Lamp of the Sanctuaries; in a word, its angels are demons, its Melusines stryges, its phantoms vampires, its spells and mysteries the Black Science."


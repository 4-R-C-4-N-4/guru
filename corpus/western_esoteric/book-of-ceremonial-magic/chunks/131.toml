[content]
body = "Further, I command thee to surrender me the nearest treasure, and I promise thee as a reward the first Piece of gold or silver which I touch with my hands on the first day of every month.\n\nSuch is my demand.\n\nSOLOMON The Spirit's Reply I cannot comply with thy request on such terms, nor on any others, unless thou shalt give thyself over to me in fifty years, to do with thy body and soul as I please.\n\nLUCIFUGE ROFOCALE Rejoinder to the Spirit Lo, will I smite thee and thy whole race, by the might of great Adonay, if, on the contrary, thou dost not comply with my request .\n\nNotice .--Here plunge the points of the Blasting Rod into the fire and repeat the Grand Conjuration of the Clavicle till the spirit surrenders himself to your will.\n\nAnswer and Compliance of the Spirit Smite me no further; I Pledge myself to do what thou desirest two several times on every night of the week.\n\nTo wit: On Monday at ten o'clock and at midnight.\n\nOn Tuesday at eleven o'clock and at one in the morning.\n\nOn Wednesday at midnight and at two in the morning.\n\nOn Thursday at eight and at eleven o'clock.\n\nOn Friday at mine o'clock and at midnight.\n\nOn Saturday at ten o'clock and at one in the morning.\n\nI also approve thy Book, and I give thee my true signature on parchment, which thou shalt affix at its end, to make use of at thy need.\n\nFurther, I place myself at thy disposition, to appear before thee at thy call when, being purified, and holding the dreadful Blasting Rod, thou shalt open the Book, having described the Kabalistic circle and pronounced the word Rofocale.\n\nI promise thee to have friendly commerce with those who are fortified by the Possession of the said Book, where my true signature stands, provided that they invoke me according to rule, on the first occasion that they require me.\n\nI also engage to deliver thee the treasure which thou seekest, on condition that thou keepest the secret for ever inviolable, art charitable to the Poor and dost give me a gold or silver coin on the first day of every month.\n\nIf thou failest, thou art mine everlastingly.\n\nLUCIFUGE ROFOCALE IMPRIMATUR Reply to the Spirit I agree to, thy conditions.\n\nSOLOMON INVITATION OF THE SPIRIT Follow me, and come lay thy hands on the treasure .\n\nThereupon the Karcist, armed with the Blasting Rod and the stone called Ematille , shall issue from the circle at that point where the door of mighty Adonay is figured, and shall follow the spirit; the assistants, however, shall not stir one step from the circle, but shall remain firm and immovable within it, whatever reports they hear, whatever visions they behold.\n\nThe spirit shall then conduct the Karcist to the vicinity of the treasure, when it may befall that the Karcist shall behold the apparition of a large and fierce dog, with a collar as resplendent as the sun.\n\nThis will be a Gnome, which he can drive off by the point of his rod, when the apparition will make off towards the treasure.\n\nThe Karcist must follow, and, on reaching the treasure, will be astonished to discover the person who has hidden it, who also will endeavour to grapple with him, but will be unable so much as to approach him.\n\nThe Karcist must be provided with a sheet of virgin parchment inscribed with the grand conjuration of the Clavicle."


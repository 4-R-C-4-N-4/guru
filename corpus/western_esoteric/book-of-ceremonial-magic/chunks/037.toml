[content]
body = "§ 4.\n\nThe Seven Mysterious Orisons SUNDAY Pater noster, &c.\n\nDeliver me, O Lord, I beseech Thee, me even, thy creature, N., from all evils Past, present and to come, whether of body or soul; grant me peace and health in Thy goodness; incline favourably unto me, Thy creature, by the intercession of the Blessed Virgin Mary and of Thy holy apostles, Peter, Paul, Andrew and of all the saints.\n\nVouchsafe peace unto Thy creature, and health during all my life, so that, strengthened by the mainstay of Thy mercy, I may never be the slave of sin, nor go in fear of any trouble, through the same Jesus Christ Thy Son, our Saviour, Who, being truly God, liveth and reigneth in the unity of the Holy Spirit for ever and ever, Amen.\n\nMay the peace of the Lord be always with me, Amen.\n\nMay that peace, O Lord, which Thou didst leave to Thy disciples abide ever with power in my heart, standing always between me and my enemies, both visible and invisible, Amen.\n\nMay the Peace of the Lord, His countenance, His body, His blood, assist, console and protect me, Thy creature, N., in my soul and my body, Amen.\n\nLamb of God, Who didst deign to be born of the Virgin Mary, Who didst cleanse the world from its sins upon the Cross, have pity on my soul and my body.\n\nO Christ, Lamb of God, immolated for the salvation of the world, have Pity on my soul and my body.\n\nLamb of God, by Whom all the faithful are saved, give unto me Thy peace, to remain with me for ever, both in this life and that which is to come, Amen.\n\nMONDAY O great God, by Whom all things have been set free, deliver me also from all evil.\n\nO great God, Who hast granted Thy consolation unto all beings, grant it even unto me.\n\nO great God, Who hast succoured and assisted all things, aid me also; succour me in all my necessities and miseries, my enterprises and dangers; deliver me from all the hindrances and snares of my enemies, both visible and invisible, in the Name of the Father Who created the whole world ✠ , in the Name of the Son Who hath redeemed it ✠ , in the name of the Holy Ghost Who hath fulfilled the entire law in its Perfection.\n\nI cast myself utterly into Thine arms, and place myself unreservedly under Thy holy protection, Amen.\n\nMay the blessing of God the Father Almighty, of the Son and of the Holy Ghost, be always with me ✠ , Amen.\n\nMay the blessing of God the Father, Who by His only Word hath made all things, be with me for ever ✠ , Amen.\n\nMay the blessing of our Lord Jesus Christ, Son of the great living God, be with me for ever ✠ , Amen.\n\nMay the blessing and Seven Gifts of the Holy Spirit be with me for ever ✠ , Amen.\n\nMay the blessing of the Virgin Mary, and of her Son, be with me for ever, Amen.\n\nTUESDAY May the blessing and consecration of the bread and of the wine, which our Lord Jesus Christ made when He gave them to His disciples and said unto them: Take and eat ye all of this, for this is My body which shall be delivered for you, in remembrance of Me and for the remission of all sins--be with me for ever ✠ .\n\nMay the blessing of the Holy Angels, Archangels, Virtues, Powers, Thrones, Dominations, Cherubim and Seraphim, be with me for ever ✠ , Amen."


[content]
body = "Begin cutting it when the sun is first rising over this hemisphere, and pronounce the following words:-- I beseech Thee, O Grand ADONAY, ELOIM, ARIEL and JEHOVAM , to be propitious unto me, and to endow this Wand which I am cutting with the power and virtue of the rods of Jacob, of Hoses and of the mighty Joshua!\n\nI also beseech Thee, O Grand ADONAY, ELOIM, ARIEL and JEHOVAM , to infuse into this Rod the whole strength of Samson, the righteous wrath of EMANUEL and the thunders of mighty Zariatnatmik, who will avenge the names of men at the Day of judgment!\n\nAmen .\n\nHaving pronounced these \"sublime and terrific words,\" and still keeping your eyes turned towards the region of the rising sun, you may finish cutting your rod, and may then carry it to your abode.\n\nYou must next go in search of a piece of ordinary wood, fashion the two ends like those of the genuine rod and take it to an ironsmith, who shall weld the steel blade of the sacrificial knife into two pointed caps and shall affix them to the said ends.\n\nThis done, you may again return home, and there, with your own hands, affix the steel caps to the joints of the genuine rod.\n\nSubsequently, you must obtain a piece of loadstone and magnetise the steel ends, pronouncing the following words:-- By the grand ADONAY, ELOIM, ARIEL and JEHOVAM , I bid thee join with and attract all substances which I desire, by the power of the sublime ADONAY, ELOIM, ARIEL and JEHOVAM .\n\nI command thee, by the opposition of fire and water, to separate all substances, as they were separated on the day of the worlds creation.\n\nAmen .\n\nFinally, you must rejoice in the honour and glory of the sublime Adonay, being convinced that you are in possession of a most priceless Treasure of the Light."


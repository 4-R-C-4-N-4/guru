[content]
body = "Among the chiefs are Sarfiel, Amatino, Choriel, Mosiel, Lanthros , and among the subalterns Demaros, Osmajloel, Januviel, Vernael, Thribiel .\n\nThe Ruler of the Ninth Hour is VADRIEL, having ten chief and one hundred lesser officers and serving spirits even as the sands of the sea.\n\nThe greater include Astroniel, Charms, Pamerif, Damiel, Madriel ; among the lesser are Kremos, Meros, Brasiel, Nafarin, Zoigmiel .\n\nThe Ruler of the Tenth Hour is ORIEL, who has ten cohorts of officers presiding over many serving spirits.\n\nThese orders include Armesi, Darbiel, Panales, Mesriel, Chorob, Lemure, Ormas, Charnij, Zazior, Namon --being one of each choir.\n\nThe Ruler of the Eleventh Hour is BARIEL, whose army is similarly divided, and as typical specimens of the ten orders there are Almariz, Pralimiel, Chardros, Furmiel, Lamie, Menafiel, Demasar, Ormary, Hevas, Zemoel .\n\nThe Ruler of the Twelfth Hour is BERATIEL, whose officers are divided into twelve orders, some greater and some lesser, the examples of each being--in the first class, Cameron, Altrofiel, Penatiel, Demarae, Famaris ; and in the second, Pharniel, Nerostiel, Emarson, Voizia, Sameron .\n\nHOURS OF THE NIGHT The Negotia perambulantia in tenebris are more numerous than those of the daylight.\n\nThey are divided under their respective Supreme Rulers into six chief and six secondary orders, and the serving spirits are proportionately great in number.\n\nThe First Hour.\n\nSupreme Ruler--GAMIEL.\n\nThe chief officers include Moriel, Garthiel, Sepharon, Mousien, Arathiel , [paragraph continues] Cosel .\n\nLesser officers: Zanias, Noxin, Tempast, Farion, Glaras, Belsal .\n\nThe Second Hour.\n\nSupreme Ruler--FARRIS.\n\nThe chief officers include Almodar, Tamarid, Nedros, Ormisiel, Chabril, Praxil .\n\nLesser officers: Permaz, Umeroz, Emaril, Fromezin, Ramasiel, Granozin .\n\nThe Third Hour.\n\nSupreme Ruler--SARQUAMICH.\n\nThe chief officers include Meriarijm, Crusiel, Penarys, Amriel, Dencinoz, Nestozoz .\n\nLesser officers: Evanel, Sarmezin, Haglon, Uvabriel, Thymitzod, Fromzon .\n\nThe Fourth Hour.\n\nSupreme Ruler--JEFISCHA.\n\nThe chief officers include Armesiel, Nedruel, Maneij, Ormael, Phorsiel, Rimezin .\n\nLesser officers: Rayziel, Gemezin, Fremiel, Hamayzod, Japnoill, Lamediel .\n\nThe Fifth Hour.\n\nSupreme Ruler--ABASDARHON.\n\nThe chief officers include Moniel, Charby, Apiniel, Dematron, Nechoxim, Hameriel .\n\nLesser officers: Harptzall, Chrymos, Patrozin, Nameton, Barmas, Phatiel .\n\nThe Sixth Hour.\n\nSupreme Ruler--ZAAZONASH.\n\nThe chief officers include Menorita, Prenostix, Namedor, Cheratiel, Dramazod, Fuleriel ."


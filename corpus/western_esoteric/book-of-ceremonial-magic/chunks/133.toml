[content]
body = "§ 2.\n\nConcerning the Genuine Sanctum Regnum, or the True Method of Making Pacts There are two kinds of pacts, says the Grimorium Verum, the tacit and the manifest; but know at the same time that among the several kinds of spirits there are some which bind and some which do not bind, save only in a very light manner.\n\nAs to the first, they are those which require something personally belonging to you whensoever a pact is agreed.\n\nAgainst these you must be on your guard, because the guileful friend becometh an open enemy.\n\nThe Grimorium Verum does not, however, entertain more largely the question of a compact with Satan or his ministers, though it may perhaps be inferred from its pages that all commerce with evil spirits is founded on a law of exchange.\n\nThey can be bent to the intention of the operator, but it is on the express understanding that they are satisfied for their part, because, as we have seen, these kinds of creatures give nothing for nothing.\n\nWith the author of the Grand Grimoire , the pact is a concession to the poverty of the operator's resources.\n\nIn Black Magic, as in some other processes, the necessitous must be ready to sacrifice, and the sorcerer who is insufficiently equipped must pay a higher price in the end.\n\nThe genuine Sanctum Regnum of the Grand Clavicle, otherwise termed the Pacta Conventa Dæmonum , is explained by the Grand Grimoire for the information of those who are desirous to bind spirits, but are devoid of the requisite resources for composing the Blasting Rod and Kabalistic circle.\n\nSuch persons, it is affirmed, will never succeed in evoking spirits unless they perform, point by point, all that is detailed hereinafter concerning the manner of making pacts with any spirit whatsoever, whether the object in view may be the possession of treasures concealed in the earth, the enjoyment of women or girls, and for obtaining any desired favour at their hands, whether for the discovery of the most hidden secrets in all Courts and Cabinets of the world, whether for the revelation of the most impenetrable mysteries, whether for engaging a spirit to perform one's work in the night, whether to cause a fall of hail or a storm in any appointed place, whether to open seals, to behold what is passing in private houses and learn all the skill of the shepherds, whether to obtain the Hand of Glory and discern all the qualities and virtues of metals, minerals and vegetables, of animals both pure and impure, and \"to perform things so astounding that no person in existence can fail to be in a condition of utter bewilderment on seeing that by means of a pact with certain spirits one can discover the grandest secrets of Nature, which are hidden from the eyes of all other men.\" It is to the Clavicle of the great King Solomon, says the Grimoire, that we owe the discovery of the genuine method of making pacts, which he also made use of himself for the acquisition of his immense riches, for the pleasure of such innumerable women and for the revelation of the most impenetrable arcana of Nature, whereby every species of good and evil may be accomplished.\n\nWith the highest potentates of Infernus, with Lucifer, Beelzebuth and Astaroth, it does not seem possible to enter into a binding compact.\n\nThe sorcerer must be content with some one among the six governors, who will generally work by their agents.\n\nAn invariable covenant of the pact should bargain for service by one of the three superiors among such special subordinates."


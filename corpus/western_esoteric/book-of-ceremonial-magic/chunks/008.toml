[content]
body = "Click to view THE TEMPTATION OF EVIL From Cædmon.\n\nINTRODUCTION THE mystic tradition in Christian Times is preserved, apart from all questions and traces of Instituted Mysteries, in the literature of Christian Mystical Theology; it is a large and exceedingly scattered literature; some of its most important texts are available in no modern language; they stand very seriously in need of codification, and--if I may be so frank--even of re-expression.\n\nBut if, for other reasons, they are in their entirety a study which must be left to the expert, there is no person now living in Europe who has not close at his hands the specific, simple, isolated texts--much too numerous to name--which are sufficient to give some general idea of the scope and aims of the tradition.\n\nIf I were asked to define the literature shortly and comprehensively as a whole, I should call it the texts of the way, the truth and the life in respect of the mystic term.\n\nIt is not only full but exhaustive as to the way--which is that of the inward world, recollection, meditation, contemplation, the renunciation of all that is lower in the quest of all that is higher--but perhaps the most catholic word of all would be centralisation.\n\nIt is very full also on the fundamental truth, out of which it arises, that a way does exist and that the way is open.\n\nThe truth is formulated in all simplicity by the Epistle to the Hebrews --that God is and that He recompenses those who seek Him out.\n\nI have cited this testimony on several occasions in the same connection, and I do so here and now without a word of apology and with no sense of repetition, since it can never be a matter of redundancy to remember after what manner the Divine ways are justified to humanity, when humanity is seeking the Divine.\n\nThe literature, in fine, is full as to that which it understands in respect of the life, but this is the Divine Life; it is grace which fills the heart; it is the Holy Spirit of God which makes holy the spirit of man; it is life in God.\n\nThere is no doubt that in its formulation it was presented to the mind of Christian Mysticism as the life which was hidden with Christ in God, and this ineffable concealment was equivalent to the presentation in open teaching of that mystery of emblematic death which lies behind all the pageants of initiation.\n\nThis was the state, and the dogma from which the state depended is defined by that Johannine Epistle which affirms: (1) That God hath given to us eternal life; (2) That this life is His Son; (3) That whosoever hath the Son hath life; (4) That whosoever is without the Son is without life also.\n\nThese points follow naturally enough from the testimony of the Fourth Gospel: (1) In the person of the Divine Voice, saying--I am the Way, the Truth and the Life: I am the Resurrection and the Life: I am the Bread of Life; (2) In the person of the witness, saying: In Him was life and the life was the light of men.\n\nThere is no doubt, in the second place, that the Divine Voice was incarnate for Christian Mysticism in Jesus of Nazareth, and we must cast out from us the images of those false witnesses who from time to time have pretended that the masters of the hidden life in the Christian centuries had become far too enlightened spiritually to tolerate the external cortex of their faith and creed.\n\nThis point is of much greater importance than it may appear in the present connection, for I am not doing less than establish a canon of criticism.\n\nI will take two typical examples, one of which is moderately early and the other sufficiently late to serve as a distinction in time."


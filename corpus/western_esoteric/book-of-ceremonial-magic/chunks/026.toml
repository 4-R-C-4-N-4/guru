[content]
body = "Sloane 3884 includes a process in Necromancy--how to call the ghost of a dead body--the invocation of spirits into a crystal--the form for summoning spirits within the circle--and a method of exorcism in the Tuscan language,--all impudently attributed to the author of the Nullity of Magic --that is to say, Roger Bacon.\n\nIn the second part of my present work a special chapter is devoted to Infernal Necromancy, and the MS.\n\nhere mentioned will be useful for purposes of reference.\n\nSloane 3850 is a MS.\n\nof the seventeenth century, which contains transcripts from the fourth book of Cornelius Agrippa and from the Heptameron of Peter de Abano in Latin.\n\nThere is also a Good and Proved Experiment for evocation, which uses the Pater , Ave , Credo and Litany of the Saints as magical formulae.\n\nFinally, there are processes, mostly in Latin, but some in English, for the discovery of things lost, the recovery of things stolen, for the spirits of the dead who cannot rest in their graves, and for persons possessed by evil spirits.\n\nThe treatise De Novem Candariis Salomonis , containing curious figures and sigils, deserves particular mention, as this again seems unknown to students.\n\nIts attribution notwithstanding, it is the work of a Catholic writer.\n\nClick to view THE SACRED URÆUS OR BASILISK"


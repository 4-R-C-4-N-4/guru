[content]
body = "CHAPTER V THE MENTAL UNIVERSE \"The Universe is Mental--held in the Mind of THE ALL.\"--The Kybalion.\n\nTHE ALL is SPIRIT!\n\nBut what is Spirit?\n\nThis question cannot be answered, for the reason that its definition is practically that of THE ALL, which cannot be explained or defined.\n\nSpirit is simply a name that men give to the highest conception of Infinite Living Mind--it means \"the Real Essence\"--it means Living Mind, as much superior to Life and Mind as we know them, as the latter are superior to mechanical Energy and Matter.\n\nSpirit transcends our understanding, and we use the term merely that we may think or speak of THE ALL.\n\nFor the purposes of thought and understanding, we are justified in thinking of Spirit as Infinite Living Mind, at the same time acknowledging that we cannot fully understand it.\n\nWe must either do this or stop thinking of the matter at all.\n\nLet us now proceed to a consideration of the nature of the Universe, as a whole and in its parts.\n\nWhat is the Universe?\n\nWe have seen that there can be nothing outside of THE ALL.\n\nThen is the Universe THE ALL?\n\nNo, this cannot be, because the Universe seems to be made up of MANY, and is constantly changing, and in other ways it does not measure up to the ideas that we are compelled to accept regarding THE ALL, as stated in our last lesson.\n\nThen if the Universe be not THE ALL, then it must be Nothing--such is the inevitable conclusion of the mind at first thought.\n\nBut this will not satisfy the question, for we are sensible of the existence of the Universe.\n\nThen if the Universe is neither THE ALL, nor Nothing, what Can it be?\n\nLet us examine this question.\n\nIf the Universe exists at all, or seems to exist, it must proceed in some way from THE ALL--it must be a creation of THE ALL.\n\nBut as something can never come from nothing, from what could THE ALL have created it.\n\nSome philosophers have answered this question by saying that THE ALL created the Universe from ITSELF--that is, from the being and substance of THE ALL.\n\nBut this will not do, for THE ALL cannot be subtracted from, nor divided, as we have seen, and then again if this be so, would not each particle in the Universe be aware of its being THE ALL--THE ALL could not lose its knowledge of itself, nor actually BECOME an atom, or blind force, or lowly living thing.\n\nSome men, indeed, realizing that THE ALL is indeed ALL, and also recognizing that they, the men, existed, have jumped to the conclusion that they and THE ALL were identical, and they have filled the air with shouts of \"I AM GOD,\" to the amusement of the multitude and the sorrow of sages.\n\nThe claim of the corpuscle that: \"I am Man!\" would be modest in comparison.\n\nBut, what indeed is the Universe, if it be not THE ALL, not yet created by THE ALL having separated itself into fragments?\n\nWhat else can it be-- of what else can it be made?\n\nThis is the great question.\n\nLet us examine it carefully.\n\nWe find here that the \"Principle of Correspondence\" (see Lesson I.) comes to our aid here.\n\nThe old Hermetic axiom, \"As above so below,\" may be pressed into service at this point.\n\nLet us endeavor to get a glimpse of the workings on higher planes by examining those on our own.\n\nThe Principle of Correspondence must apply to this as well as to other problems.\n\nLet us see!\n\nOn his own plane of being, how does Man create?\n\nWell, first, he may create by making something out of outside materials.\n\nBut this will not do, for there are no materials outside of THE ALL with which it may create."


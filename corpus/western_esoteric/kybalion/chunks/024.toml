[content]
body = "To know it otherwise, but actual experience, we must be THE ALL itself.\n\nIt is true that the higher we rise in the scale--the nearer to \"the mind of the Father\" we reach--the more apparent becomes the illusory nature of finite things, but not until THE ALL finally withdraws us into itself does the vision actually vanish.\n\nSo, we need not dwell upon the feature of illusion.\n\nRather let us, recognizing the real nature of the Universe, seek to understand its mental laws, and endeavor to use them to the best effect in our upward progress through life, as we travel from plane to plane of being.\n\nThe Laws of the Universe are none the less \"Iron Laws\" because of the mental nature.\n\nAll, except THE ALL, are bound by them.\n\nWhat is IN THE INFINITE MIND OF THE ALL is REAL in a degree second only to that Reality itself which is vested in the nature of THE ALL.\n\nSo, do not feel insecure or afraid--we are all HELD FIRMLY IN THE INFINITE MIND OF THE ALL, and there is naught to hurt us or for us to fear.\n\nThere is no Power outside of THE ALL to affect us.\n\nSo we may rest calm and secure.\n\nThere is a world of comfort and security in this realization when once attained.\n\nThen \"calm and peaceful do we sleep, rocked in the Cradle of the Deep\"--resting safely on the bosom of the Ocean of Infinite Mind, which is THE ALL.\n\nIn THE ALL, indeed, do \"we live and move and have our being.\" Matter is none the less Matter to us, while we dwell on the plane of Matter, although we know it to be merely an aggregation of \"electrons,\" or particles of Force, vibrating rapidly and gyrating around each other in the formations of atoms; the atoms in turn vibrating and gyrating, forming molecules, which latter in turn form larger masses of Matter.\n\nNor does Matter become less Matter, when we follow the inquiry still further, and learn from the Hermetic Teachings, that the \"Force\" of which the electrons are but units is merely a manifestation of the Mind of THE ALL, and like all else in the Universe is purely Mental in its nature.\n\nWhile on the Plane of matter, we must recognize its phenomena-- we may control Matter (as all Masters of higher or lesser degree do), but we do so by applying the higher forces.\n\nWe commit a folly when we attempt to deny the existence of Matter in the relative aspect.\n\nWe may deny its mastery over us--and rightly so--but we should not attempt to ignore it in its relative aspect, at least so long as we dwell upon its plane.\n\nNor do the Laws of Nature become less constant or effective, when we know them, likewise, to be merely mental creations.\n\nThey are in full effect on the various planes.\n\nWe overcome the lower laws, by applying still higher ones--and in this way only.\n\nBut we cannot escape Law or rise above it entirely.\n\nNothing but THE ALL can escape Law--and that because THE ALL is LAW itself, from which all Laws emerge.\n\nThe most advanced Masters may acquire the powers usually attributed to the gods of men; and there are countless ranks of being, in the great hierarchy of life, whose being and power transcends even that of the highest Masters among men to a degree unthinkable by mortals, but even the highest Master, and the highest Being, must bow to the Law, and be as Nothing in the eye of THE ALL."


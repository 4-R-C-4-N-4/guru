[content]
body = "The Hermetists have grasped this Principle, finding its universal application, and have also discovered certain means to overcome its effects in themselves by the use of the appropriate formulas and methods.\n\nThey apply the Mental Law of Neutralization.\n\nThey cannot annul the Principle, or cause it to cease its operation, but they have learned how to escape its effects upon themselves to a certain degree depending upon the Mastery of the Principle.\n\nThey have learned how to USE it, instead of being USED BY it.\n\nIn this and similar methods, consist the Art of the Hermetists.\n\nThe Master of Hermetics polarizes himself at the point at which he desires to rest, and then neutralizes the Rhythmic swing of the pendulum which would tend to carry him to the other pole.\n\nAll individuals who have attained any degree of Self-Mastery do this to a certain degree, more or less unconsciously, but the Master does this consciously, and by the use of his Will, and attains a degree of Poise and Mental Firmness almost impossible of belief on the part of the masses who are swung backward and forward like a pendulum.\n\nThis Principle and that of Polarity have been closely studied by the Hermetists, and the methods of counteracting, neutralizing, and USING them form an important part of the Hermetic Mental Alchemy.\n\n6.\n\nThe Principle of Cause and Effect \"Every Cause has its Effect; every Effect has its Cause; everything happens according to Law; Chance is but a name for Law not recognized; there are many planes of causation, but nothing escapes the Law.\"--The Kybalion.\n\nThis Principle embodies the fact that there is a Cause for every Effect; an Effect from every Cause.\n\nIt explains that: \"Everything Happens according to Law\"; that nothing ever \"merely happens\"; that there is no such thing as Chance; that while there are various planes of Cause and Effect, the higher dominating the lower planes, still nothing ever entirely escapes the Law.\n\nThe Hermetists understand the art and methods of rising above the ordinary plane of Cause and Effect, to a certain degree, and by mentally rising to a higher plane they become Causers instead of Effects.\n\nThe masses of people are carried along, obedient to environment; the wills and desires of others stronger than themselves; heredity; suggestion; and other outward causes moving them about like pawns on the Chessboard of Life.\n\nBut the Masters, rising to the plane above, dominate their moods, characters, qualities, and powers, as well as the environment surrounding them, and become Movers instead of pawns.\n\nThey help to PLAY THE GAME OF LIFE, instead of being played and moved about by other wills and environment.\n\nThey USE the Principle instead of being its tools.\n\nThe Masters obey the Causation of the higher planes, but they help to RULE on their own plane.\n\nIn this statement there is condensed a wealth of Hermetic knowledge--let him read who can.\n\n7.\n\nThe Principle of Gender \"Gender is in everything; everything has its Masculine and Feminine Principles; Gender manifests on all planes.\"--The Kybalion.\n\nThis Principle embodies the truth that there is GENDER manifested in everything--the Masculine and Feminine Principles ever at work.\n\nThis is true not only of the Physical Plane, but of the Mental and even the Spiritual Planes.\n\nOn the Physical Plane, the Principle manifests as SEX, on the higher planes it takes higher forms, but the Principle is ever the same.\n\nNo creation, physical, mental or spiritual, is possible without this Principle.\n\nAn understanding of its laws will throw light on many a subject that has perplexed the minds of men.\n\nThe Principle of Gender works ever in the direction of generation, regeneration, and creation.\n\nEverything, and every person, contains the two Elements or Principles, or this great Principle, within it, him or her."


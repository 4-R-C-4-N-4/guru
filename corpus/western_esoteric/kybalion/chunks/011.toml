body = "CHAPTER III MENTAL TRANSMUTATION \"Mind (as well as metals and elements) may be transmuted, from state to state; degree to degree; condition to condition; pole to pole; vibration to vibration.\n\nTrue Hermetic Transmutation is a Mental Art.\"--The Kybalion.\n\nAs we have stated, the Hermetists were the original alchemists, astrologers, and psychologists, Hermes having been the founder of these schools of thought.\n\nFrom astrology has grown modern astronomy; from alchemy has grown modern chemistry; from the mystic psychology has grown the modern psychology of the schools.\n\nBut it must not be supposed that the ancients were ignorant of that which the modern schools suppose to be their exclusive and special property.\n\nThe records engraved on the stones of Ancient Egypt show conclusively that the ancients had a full comprehensive knowledge of astronomy, the very building of the Pyramids showing the connection between their design and the study of astronomical science.\n\nNor were they ignorant of Chemistry, for the fragments of the ancient writings show that they were acquainted with the chemical properties of things; in fact, the ancient theories regarding physics are being slowly verified by the latest discoveries of modern science, notably those relating to the constitution of matter.\n\nNor must it be supposed that they were ignorant of the so-called modern discoveries in psychology--on the contrary, the Egyptians were especially skilled in the science of Psychology, particularly in the branches that the modern schools ignore, but which, nevertheless, are being uncovered under the name of \"psychic science\" which is perplexing the psychologists of to-day, and making them reluctantly admit that \"there may be something in it after all.\" The truth is, that beneath the material chemistry, astronomy and psychology (that is, the psychology in its phase of \"brain-action\") the ancients possessed a knowledge of transcendental astronomy, called astrology; of transcendental chemistry, called alchemy; of transcendental psychology, called mystic psychology.\n\nThey possessed the Inner Knowledge as well as the Outer Knowledge, the latter alone being possessed by modern scientists.\n\nAmong the many secret branches of knowledge possessed by the Hermetists, was that known as Mental Transmutation, which forms the subject matter of this lesson.\n\n\"Transmutation\" is a term usually employed to designate the ancient art of the transmutation of metals--particularly of the base metals into gold.\n\nThe word \"Transmute\" means \"to change from one nature, form, or substance, into another; to transform\" (Webster).\n\nAnd accordingly, \"Mental Transmutation\" means the art of changing and transforming mental states, forms, and conditions, into others.\n\nSo you may see that Mental Transmutation is the \"Art of Mental Chemistry,\" if you like the term--a form of practical Mystic Psychology.\n\nBut this means far more than appears on the surface.\n\nTransmutation, Alchemy, or Chemistry on the Mental Plane is important enough in its effects, to be sure, and if the art stopped there it would still be one of the most important branches of study known to man.\n\nBut this is only the beginning.\n\nLet us see why!\n\nThe first of the Seven Hermetic Principles is the Principle of Mentalism, the axiom of which is \"THE ALL is Mind; the Universe is Mental,\" which means that the Underlying Reality of the Universe is Mind; and the Universe itself is Mental--that is, \"existing in the Mind of THE ALL.\" We shall consider this Principle in succeeding lessons, but let us see the effect of the principle if it be assumed to be true.\n\nIf the Universe is Mental in its nature, then Mental Transmutation must be the art of CHANGING THE CONDITIONS OF THE UNIVERSE, along the lines of Matter, Force and mind."


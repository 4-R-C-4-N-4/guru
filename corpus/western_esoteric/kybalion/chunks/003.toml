[content]
body = "CHAPTER I THE HERMETIC PHILOSOPHY \"The lips of wisdom are closed, except to the ears of Understanding\"--The Kybalion.\n\nFrom old Egypt have come the fundamental esoteric and occult teachings which have so strongly influenced the philosophies of all races, nations and peoples, for several thousand years.\n\nEgypt, the home of the Pyramids and the Sphinx, was the birthplace of the Hidden Wisdom and Mystic Teachings.\n\nFrom her Secret Doctrine all nations have borrowed.\n\nIndia, Persia, Chaldea, Medea, China, Japan, Assyria, ancient Greece and Rome, and other ancient countries partook liberally at the feast of knowledge which the Hierophants and Masters of the Land of Isis so freely provided for those who came prepared to partake of the great store of Mystic and Occult Lore which the masterminds of that ancient land had gathered together.\n\nIn ancient Egypt dwelt the great Adepts and Masters who have never been surpassed, and who seldom have been equaled, during the centuries that have taken their processional flight since the days of the Great Hermes.\n\nIn Egypt was located the Great Lodge of Lodges of the Mystics.\n\nAt the doors of her Temples entered the Neophytes who afterward, as Hierophants, Adepts, and Masters, traveled to the four corners of the earth, carrying with them the precious knowledge which they were ready, anxious, and willing to pass on to those who were ready to receive the same.\n\nAll students of the Occult recognize the debt that they owe to these venerable Masters of that ancient land.\n\nBut among these great Masters of Ancient Egypt there once dwelt one of whom Masters hailed as \"The Master of Masters.\" This man, if \"man\" indeed he was, dwelt in Egypt in the earliest days.\n\nHe was known as Hermes Trismegistus.\n\nHe was the father of the Occult Wisdom; the founder of Astrology; the discoverer of Alchemy.\n\nThe details of his life story are lost to history, owing to the lapse of the years, though several of the ancient countries disputed with each other in their claims to the honor of having furnished his birthplace--and this thousands of years ago.\n\nThe date of his sojourn in Egypt, in that his last incarnation on this planet, is not now known, but it has been fixed at the early days of the oldest dynasties of Egypt--long before the days of Moses.\n\nThe best authorities regard him as a contemporary of Abraham, and some of the Jewish traditions go so far as to claim that Abraham acquired a portion of his mystic knowledge from Hermes himself.\n\nAs the years rolled by after his passing from this plane of life (tradition recording that he lived three hundred years in the flesh), the Egyptians deified Hermes, and made him one of their gods, under the name of Thoth.\n\nYears after, the people of Ancient Greece also made him one of their many gods--calling him \"Hermes, the god of Wisdom.\" The Egyptians revered his memory for many centuries-yes, tens of centuries-- calling him \"the Scribe of the Gods,\" and bestowing upon him, distinctively, his ancient title, \"Trismegistus,\" which means \"the thrice-great\"; \"the great-great\"; \"the greatest-great\"; etc.\n\nIn all the ancient lands, the name of Hermes Trismegistus was revered, the name being synonymous with the \"Fount of Wisdom.\" Even to this day, we use the term \"hermetic\" in the sense of \"secret\"; \"sealed so that nothing can escape\"; etc., and this by reason of the fact that the followers of Hermes always observed the principle of secrecy in their teachings."


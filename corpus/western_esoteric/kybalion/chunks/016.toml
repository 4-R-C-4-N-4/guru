[content]
body = "It must be Infinite in Space--it must be Everywhere, for there is no place outside of THE ALL--it cannot be otherwise than continuous in Space, without break, cessation, separation, or interruption, for there is nothing to break, separate, or interrupt its continuity, and nothing with which to \"fill in the gaps.\" It must be Infinite in Power, or Absolute, for there is nothing to limit, restrict, restrain, confine, disturb or condition it--it is subject to no other Power, for there is no other Power.\n\n(3) THE ALL must be IMMUTABLE, or not subject to change in its real nature, for there is nothing to work changes upon it nothing into which it could change, nor from which it could have changed.\n\nIt cannot be added to nor subtracted from; increased nor diminished; nor become greater or lesser in any respect whatsoever.\n\nIt must have always been, and must always remain, just what it is now--THE ALL--there has never been, is not now, and never will be, anything else into which it can change.\n\nTHE ALL being Infinite, Absolute, Eternal and Unchangeable it must follow that anything finite, changeable, fleeting, and conditioned cannot be THE ALL.\n\nAnd as there is Nothing outside of THE ALL, in Reality, then any and all such finite things must be as Nothing in Reality.\n\nNow do not become befogged, nor frightened--we are not trying to lead you into the Christian Science field under cover of Hermetic Philosophy.\n\nThere is a Reconciliation of this apparently contradictory state of affairs.\n\nBe patient, we will reach it in time.\n\nWe see around us that which is called \"Matter,\" which forms the physical foundation for all forms.\n\nIs THE ALL merely Matter?\n\nNot at all!\n\nMatter cannot manifest Life or Mind, and as Life and Mind are manifested in the Universe, THE ALL cannot be Matter, for nothing rises higher than its own source--nothing is ever manifested in an effect that is not in the cause--nothing is evolved as a consequent that is not involved as an antecedent.\n\nAnd then Modern Science informs us that there is really no such thing as Matter--that what we call Matter is merely \"interrupted energy or force,\" that is, energy or force at a low rate of vibration.\n\nAs a recent writer has said \"Matter has melted into Mystery.\" Even Material Science has abandoned the theory of Matter, and now rests on the basis of \"Energy.\" Then is THE ALL mere Energy or Force?\n\nNot Energy or Force as the materialists use the terms, for their energy and force are blind, mechanical things, devoid of Life or Mind.\n\nLife and Mind can never evolve from blind Energy or Force, for the reason given a moment ago: \"Nothing can rise higher than its source--nothing is evolved unless it is involved--nothing manifests in the effect, unless it is in the cause.\n\n\" And so THE ALL cannot be mere Energy or Force, for, if it were, then there would be no such things as Life and Mind in existence, and we know better than that, for we are Alive and using Mind to consider this very question, and so are those who claim that Energy or Force is Everything.\n\nWhat is there then higher than Matter or Energy that we know to be existent in the Universe?\n\nLIFE AND MIND!\n\nLife and Mind in all their varying degrees of unfoldment!\n\n\"Then,\" you ask, \"do you mean to tell us that THE ALL is LIFE and MIND?\" Yes!\n\nand No!\n\nis our answer.\n\nIf you mean Life and Mind as we poor petty mortals know them, we say No!\n\nTHE ALL is not that!\n\n\"But what kind of Life and Mind do you mean?\" you ask."


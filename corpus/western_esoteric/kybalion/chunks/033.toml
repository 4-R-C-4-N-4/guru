body = "So that while a plane is not \"a place,\" nor yet \"a state or condition,\" yet it possesses qualities common to both.\n\nWe shall have more to say regarding the subject of the scale of Vibrations in our next lessons, in which we shall consider the Hermetic Principle of Vibration.\n\nYou will kindly remember, however, that the Three Great Planes are not actual divisions of the phenomena of the Universe, but merely arbitrary terms used by the Hermetists in order to aid in the thought and study of the various degrees and Forms of universal activity and life.\n\nThe atom of matter, the unit of force, the mind of man, and the being of the arch -angel are all but degrees in one scale, and all fundamentally the same, the difference between solely a matter of degree, and rate of vibration--all are creations of THE ALL, and have their existence solely within the Infinite Mind of THE ALL.\n\nThe Hermetists sub-divide each of the Three Great Planes into Seven Minor Planes, and each of these latter are also sub-divided into seven sub-planes, all divisions being more or less arbitrary, shading into each other, and adopted merely for convenience of scientific study and thought.\n\nThe Great Physical Plane, and its Seven Minor Planes, is that division of the phenomena of the Universe which includes all that relates to physics, or material things, forces, and manifestations.\n\nIt includes all forms of that which we call Matter, and all forms of that which we call Energy or Force.\n\nBut you must remember that the Hermetic Philosophy does not recognize Matter as a thing in itself, or as having a separate existence even in the Mind of THE ALL.\n\nThe Teachings are that Matter is but a form of Energy--.that is, Energy at a low rate of vibrations of a certain kind.\n\nAnd accordingly the Hermetists classify Matter under the head of Energy, and give to it three of the Seven Minor Planes of the Great Physical Plane.\n\nThese Seven Minor Physical Planes are as follows: 1.\n\nThe Plane of Matter (A) 2.\n\nThe Plane of Matter (B) 3.\n\nThe Plane of Matter (C) 4.\n\nThe Plane of Ethereal Substance 5.\n\nThe Plane of Energy (A) 6.\n\nThe Plane of Energy (B) 7.\n\nThe Plane of Energy (C) The Plane of Matter (A) comprises the forms of Matter in its form of solids, liquids, and gases, as generally recognized by the text-books on physics.\n\nThe Plane of Matter (B) comprises certain higher and more subtle forms of Matter of the existence of which modern science is but now recognizing, the phenomena of Radiant Matter, in its phases of radium, etc., belonging to the lower sub-division of this Minor Plane.\n\nThe Plane of Matter (C) comprises forms of the most subtle and tenuous Matter, the existence of which is not suspected by ordinary scientists.\n\nThe Plane of Ethereal Substance comprises that which science speaks of as \"The Ether\", a substance of extreme tenuity and elasticity, pervading all Universal Space, and acting as a medium for the transmission of waves of energy, such as light, heat, electricity, etc.\n\nThis Ethereal Substance forms a connecting link between Matter (so-called) and Energy, and partakes of the nature of each.\n\nThe Hermetic Teachings, however, instruct that this plane has seven sub-divisions (as have all of the Minor Planes), and that in fact there are seven ethers, instead of but one.\n\nNext above the Plane of Ethereal Substance comes the Plane of Energy (A), which comprises the ordinary forms of Energy known to science, its seven sub-planes being, respectively, Heat; Light; Magnetism; Electricity, and Attraction (including Gravitation, Cohesion, Chemical Affinity, etc.) and several other forms of energy indicated by scientific experiments but not as yet named or classified."


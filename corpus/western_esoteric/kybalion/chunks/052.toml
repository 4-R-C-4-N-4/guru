[content]
body = "But the Masters, knowing the rules of the game, rise above the plane of material life, and placing themselves in touch with the higher powers of their nature, dominate their own moods, characters, qualities, and polarity, as well as the environment surrounding them and thus become Movers in the game, instead of Pawns-Causes instead of Effects.\n\nThe Masters do not escape the Causation of the higher planes, but fall in with the higher laws, and thus master circumstances on the lower plane.\n\nThey thus form a conscious part of the Law, instead of being mere blind instruments.\n\nWhile they Serve on the Higher Planes, they Rule on the Material Plane.\n\nBut, on higher and on lower, the Law is always in operation.\n\nThere is no such thing as Chance.\n\nThe blind goddess has been abolished by Reason.\n\nWe are able to see now, with eyes made clear by knowledge, that everything is governed by Universal Law-that the infinite number of laws are but manifestations of the One Great Law-the LAW which is THE ALL.\n\nIt is true indeed that not a sparrow drops unnoticed by the Mind of THE AL--that even the hairs on our head are numbered--as the scriptures have said There is nothing outside of Law; nothing that happens contrary to it.\n\nAnd yet, do not make the mistake of supposing that Man is but a blind automaton-far from that.\n\nThe Hermetic Teachings are that Man may use Law to overcome laws, and that the higher will always prevail against the lower, until at last he has reached the stage in which he seeks refuge in the LAW itself, and laughs the phenomenal laws to scorn.\n\nAre you able to grasp the inner meaning of this?"


[content]
body = "CHAPTER VII \"THE ALL\" IN ALL \"While All is in THE ALL, it is equally true that THE ALL is in ALL.\n\nTo him who truly understands this truth hath come great knowledge.\"--The Kybalion.\n\nHow often have the majority of people heard repeated the statement that their Deity (called by many names) was \"All in All\" and how little have they suspected the inner occult truth concealed by these carelessly uttered words?\n\nThe commonly used expression is a survival of the ancient Hermetic Maxim quoted above.\n\nAs the Kybalion says: \"To him who truly understands this truth, hath come great knowledge.\" And, this being so, let us seek this truth, the understanding of which means so much.\n\nIn this statement of truth--this Hermetic Maxim--is concealed one of the greatest philosophical, scientific and religious truths.\n\nWe have given you the Hermetic Teaching regarding the Mental Nature of the Universe--the truth that \"the Universe is Mental--held in the Mind of THE ALL.\" As the Kybalion says, in the passage quoted above: \"All is in THE ALL.\" But note also the co-related statement, that: \"It is equally true that THE ALL is in ALL.\" This apparently contradictory statement is reconcilable under the Law of Paradox.\n\nIt is, moreover, an exact Hermetic statement of the relations existing between THE ALL and its Mental Universe.\n\nWe have seen how \"All is in THE ALL\"--now let us examine the other aspect of the subject.\n\nThe Hermetic Teachings are to the effect that THE ALL is Imminent in (\"remaining within; inherent; abiding within\") its Universe, and in every part, particle, unit, or combination, within the Universe.\n\nThis statement is usually illustrated by the Teachers by a reference to the Principle of Correspondence.\n\nThe Teacher instructs the student to form a Mental Image of something, a person, an idea, something having a mental form, the favorite example being that of the author or dramatist forming an idea of his characters; or a painter or sculptor forming an image of an ideal that he wishes to express by his art.\n\nIn each case, the student will find that while the image has its existence, and being, solely within his own mind, yet he, the student, author, dramatist, painter, or sculptor, is, in a sense, immanent in; remaining within; or abiding within, the mental image also.\n\nIn other words, the entire virtue, life, spirit, of reality in the mental image is derived from the \"immanent mind\" of the thinker.\n\nConsider this for a moment, until the idea is grasped.\n\nTo take a modern example, let us say that Othello, Iago, Hamlet, Lear, Richard III, existed merely in the mind of Shakespeare, at the time of their conception or creation.\n\nAnd yet, Shakespeare also existed within each of these characters, giving them their vitality, spirit, and action.\n\nWhose is the \"spirit\" of the characters that we know as Micawber, Oliver Twist, Uriah Heep--is it Dickens, or have each of these characters a personal spirit, independent of their creator?\n\nHave the Venus of Medici, the Sistine Madonna, the Apollo Belvidere, spirits and reality of their own, or do they represent the spiritual and mental power of their creators?\n\nThe Law of Paradox explains that both propositions are true, viewed from the proper viewpoints.\n\nMicawber is both Micawber, and yet Dickens.\n\nAnd, again, while Micawber may be said to be Dickens, yet Dickens is not identical with Micawber."


[content]
body = "The answer is \"LIVING MIND,\" as far above that which mortals know by those words, as Life and Mind are higher than mechanical forces, or matter--INFINITE LIVING MIND as compared to finite \"Life and Mind.\" We mean that which the illumined souls mean when they reverently pronounce the word: \"SPIRIT!\" \"THE ALL\" is Infinite Living Mind--the Illumined call it SPIRIT!"


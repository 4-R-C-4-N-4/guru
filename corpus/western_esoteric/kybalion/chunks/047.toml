[content]
body = "It is this Law of Compensation to which the Kybalion refers when it says: \"The measure of the swing to the right is the measure of the swing to the left; rhythm compensates.\" The Law of Compensation is that the swing in one direction determines the swing in the opposite direction, or to the opposite pole-the one balances, or counterbalances, the other.\n\nOn the Physical Plane we see many examples of this Law.\n\nThe pendulum of the clock swings a certain distance to the right, and then an equal distance to the left.\n\nThe seasons balance each other in the same way.\n\nThe tides follow the same Law.\n\nAnd the same Law is manifested in all the phenomena of Rhythm.\n\nThe pendulum, with a short swing in one direction, has but a short swing in the other; while the long swing to the right invariably means the long swing to the left.\n\nAn object hurled upward to a certain height has an equal distance to traverse on its return.\n\nThe force with which a projectile is sent upward a mile is reproduced when the projectile returns to the earth on its return journey.\n\nThis Law is constant on the Physical Plane, as reference to the standard authorities will show you.\n\nBut the Hermetists carry it still further.\n\nThey teach that a man's mental states are subject to the same Law.\n\nThe man who enjoys keenly, is subject to keen suffering; while he who feels but little pain is capable of feeling but little joy.\n\nThe pig suffers but little mentally, and enjoys but little--he is compensated.\n\nAnd on the other hand, there are other animals who enjoy keenly, but whose nervous organism and temperament cause them to suffer exquisite degrees of pain and so it is with Man.\n\nThere are temperaments which permit of but low degrees of enjoyment, and equally low degrees of suffering; while there are others which permit the most intense enjoyment, but also the most intense suffering.\n\nThe rule is that the capacity for pain and pleasure, in each individual, are balanced.\n\nThe Law of Compensation is in full operation here.\n\nBut the Hermetists go still further in this matter.\n\nThey teach that before one is able to enjoy a certain degree of pleasure, he must have swung as far, proportionately, toward the other pole of feeling.\n\nThey hold, however, that the Negative is precedent to the Positive in this matter, that is to say that in experiencing a certain degree of pleasure it does not follow that he will have to \"pay up for it\" with a corresponding degree of pain; on the contrary, the pleasure is the Rhythmic swing, according to the Law of Compensation, for a degree of pain previously experienced either in the present life, or in a previous incarnation.\n\nThis throws a new light on the Problem of Pain.\n\nThe Hermetists regard the chain of lives as continuous, and as forming a part of one life of the individual, so that in consequence the rhythmic swing is understood in this way, while it would be without meaning unless the truth of reincarnation is admitted.\n\nBut the Hermetists claim that the Master or advanced student is able, to a great degree, to escape the swing toward Pain, by the process of Neutralization before mentioned.\n\nBy rising on to the higher plane of the Ego, much of the experience that comes to those dwelling on the lower plane is avoided and escaped.\n\nThe Law of Compensation plays an important part in the lives of men and women.\n\nIt will be noticed that one generally \"pays the price\" of anything he possesses or lacks.\n\nIf he has one thing, he lacks another--the balance is struck.\n\nNo one can \"keep his penny and have the bit of cake\" at the same time Everything has its pleasant and unpleasant sides.\n\nThe things that one gains are always paid for by the things that one loses.\n\nThe rich possess much that the poor lack, while the poor often possess things that are beyond the reach of the rich."


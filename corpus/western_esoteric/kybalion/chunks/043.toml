[content]
body = "Good and Bad are not absolute--we call one end of the scale Good and the other Bad, or one end Good and the other Evil, according to the use of the terms.\n\nA thing is \"less good\" than the thing higher in the scale; but that \"less good\" thing, in turn, is \"more good\" than the thing next below it--and so on, the \"more or less\" being regulated by the position on the scale.\n\nAnd so it is on the Mental Plane.\n\n\"Love and.\n\nHate\" are generally regarded as being things diametrically opposed to each other; entirely different; unreconcilable.\n\nBut we apply the Principle of Polarity; we find that there is no such thing as Absolute Love or Absolute Hate, as distinguished from each other.\n\nThe two are merely terms applied to the two poles of the same thing.\n\nBeginning at any point of the scale we find \"more love,\" or \"less hate,\" as we ascend the scale; and \"more hate\" or \"less love\" as we descend this being true no matter from what point, high or low, we may start.\n\nThere are degrees of Love and Hate, and there is a middle point where \"Like and Dislike\" become so faint that it is difficult to distinguish between them.\n\nCourage and Fear come under the same rule.\n\nThe Pairs of Opposites exist everywhere.\n\nWhere you find one thing you find its opposite-the two poles.\n\nAnd it is this fact that enables the Hermetist to transmute one mental state into another, along the lines of Polarization.\n\nThings belonging to different classes cannot be transmuted into each other, but things of the same class may be changed, that is, may have their polarity changed.\n\nThus Love never becomes East or West, or Red or Violet-but it may and often does turn into Hate and likewise Hate may be transformed into Love, by changing its polarity.\n\nCourage may be transmuted into Fear, and the reverse.\n\nHard things may be rendered Soft.\n\nDull things become Sharp.\n\nHot things become Cold.\n\nAnd so on, the transmutation always being between things of the same kind of different degrees.\n\nTake the case of a Fearful man.\n\nBy raising his mental vibrations along the line of Fear- Courage, he can be filled with the highest degree of Courage and Fearlessness.\n\nAnd, likewise, the Slothful man may change himself into an Active, Energetic individual simply by polarizing along the lines of the desired quality.\n\nThe student who is familiar with the processes by which the various schools of Mental Science, etc., produce changes in the mental states of those following their teachings, may not readily understand the principle underlying many of these changes.\n\nWhen, however, the Principle of Polarity is once grasped, and it is seen that the mental changes are occasioned by a change of polarity-a sliding along the same scale-the hatter is readily understood.\n\nThe change is not in the nature of a transmutation of one thing into another thing entirely different-but is merely a change of degree in the same things, a vastly important difference.\n\nFor instance, borrowing an analogy from the Physical Plane, it is impossible to change Heat into Sharpness, Loudness, Highness, etc., but Heat may readily be transmuted into Cold, simply by lowering the vibrations.\n\nIn the same way Hate and Love are mutually transmutable; so are Fear and Courage.\n\nBut Fear cannot be transformed into Love, nor can Courage be transmuted into Hate.\n\nThe mental states belong to innumerable classes, each class of which has its opposite poles, along which transmutation is possible.\n\nThe student will readily recognize that in the mental states, as well as in the phenomena of the Physical Plane, the two poles may be classified as Positive and Negative, respectively.\n\nThus Love is Positive to Hate; Courage to Fear; Activity to Non-Activity, etc., etc."


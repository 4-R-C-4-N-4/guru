[content]
body = "CHAPTER XI RHYTHM \"Everything flows out and in; everything has its tides; all things rise and fall; the pendulum-swing manifests in everything; the measure of the swing to the right, is the measure of the swing to the left; rhythm compensates\"--The Kybalion.\n\nThe great Fifth Hermetic Principle--the Principle of Rhythm-embodies the truth that in everything there is manifested a measured motion; a to-and-from movement; a flow and inflow; a swing forward and backward; a pendulum-like movement; a tide-like ebb and flow; a high-tide and a low- tide; between the two-poles manifest on the physical, mental or spiritual planes.\n\nThe Principle of rhythm is closely connected with the Principle of Polarity described in the preceding chapter.\n\nRhythm manifests between the two poles established by the Principle of Polarity.\n\nThis does not mean, however, that the pendulum of Rhythm swings to the extreme poles, for this rarely happens; in fact, it is difficult to establish the extreme polar opposites in the majority of cases.\n\nBut the swing is ever \"toward\" first one pole and then the other.\n\nThere is always an action and reaction; an advance and a retreat; a rising and a sinking; manifested in all of the airs and phenomena of the Universe.\n\nSuns, worlds, men, animals, plants, minerals, forces, energy, mind and matter, yes, even Spirit, manifests this Principle.\n\nThe Principle manifests in the creation and destruction of worlds; in the rise and fall of nations; in the life history of all things; and finally in the mental states of Man.\n\nBeginning with the manifestations of Spirit--of THE ALL--it will be noticed that there is ever the Outpouring and the Indrawing; the \"Outbreathing and Inbreathing of Brahm,\" as the Brahmans word it.\n\nUniverses are created; reach their extreme low point of materiality; and then begin in their upward swing.\n\nSuns spring into being, and then their height of power being reached, the process of retrogression begins, and after aeons they become dead masses of matter, awaiting another impulse which starts again their inner energies into activity and a new solar life cycle is begun.\n\nAnd thus it is with all the worlds; they are born, grow and die; only to be reborn.\n\nAnd thus it is with all the things of shape and form; they swing from action to reaction; from birth to death; from activity to inactivity--and then back again.\n\nThus it is with all living things; they are born, grow, and die--and then are reborn.\n\nSo it is with all great movements, philosophies, creeds, fashions, governments, nations, and all else-birth, growth, maturity, decadence, death-and then new-birth.\n\nThe swing of the pendulum is ever in evidence.\n\nNight follows day; and day night.\n\nThe pendulum swings from Summer to Winter, and then back again.\n\nThe corpuscles, atoms, molecules, and all masses of matter, swing around the circle of their nature.\n\nThere is no such thing as absolute rest, or cessation from movement, and all movement partakes of rhythm.\n\nThe principle is of universal application.\n\nIt may be applied to any question, or phenomena of any of the many planes of life.\n\nIt may be applied to all phases of human activity.\n\nThere is always the Rhythmic swing from one pole to the other.\n\nThe Universal Pendulum is ever in motion.\n\nThe Tides of Life flow in and out, according to Law.\n\nThe Principle of rhythm is well understood by modern science, and is considered a universal law as applied to material things."


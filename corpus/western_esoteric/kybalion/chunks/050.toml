[content]
body = "Toss a penny in the air, and it may come down either \"heads\" or \"tails\"; but make a sufficient number of tosses, and the heads and tails will about even up.\n\nThis is the operation of the law of average.\n\nBut both the average and the single toss come under the Law of Cause and Effect, and if we were able to examine into the preceding causes, it would be clearly seen that it was simply impossible for the die to fall other than it did, under the same circumstances and at the same time.\n\nGiven the same causes, the same results will follow.\n\nThere is always a \"cause\" and a \"because\" to every event.\n\nNothing ever \"happens\" without a cause, or rather a chain of causes.\n\nSome confusion has arisen in the minds of persons considering this Principle, from the fact that they were unable to explain how one thing could cause another thing--that is, be the \"creator\" of the second thing.\n\nAs a matter of fact, no \"thing\" ever causes or \"creates\" another \"thing.\" Cause and Effect deals merely with \"events.\" An \"event\" is \"that which comes, arrives or happens, as a result or consequent of some preceding event.\" No event \"creates\" another event, but is merely a preceding link in the great orderly chain of events flowing from the creative energy of THE ALL.\n\nThere is a continuity between all events precedent, consequent and subsequent.\n\nThere is a relation existing between everything that has gone before, and everything that follows.\n\nA stone is dislodged from a mountain side and crashes through a roof of a cottage in the valley below.\n\nAt first sight we regard this as a chance effect, but when we examine the matter we find a great chain of causes behind it.\n\nIn the first place there was the rain which softened the earth supporting the stone and which allowed it to fall; then back of that was the influence of the sun, other rains, etc., which gradually disintegrated the piece of rock from a larger piece; then there were the causes which led to the formation of the mountain, and its upheaval by convulsions of nature, and so on ad infinitum.\n\nThen we might follow up the causes behind the rain, etc.\n\nThen we might consider the existence of the roof In short, we would soon find ourselves involved in a mesh of cause and effect, from which we would soon strive to extricate ourselves.\n\nJust as a man has two parents, and four grandparents, and eight great-grandparents, and sixteen great-great-grandparents, and so on until when, say, forty generations are calculated the numbers of ancestors run into many millions--so it is with the number of causes behind even the most trifling event or phenomena, such as the passage of a tiny speck of soot before your eye.\n\nIt is not an easy matter to trace the bit of soot hack to the early period of the world's history when it formed a part of a massive tree-trunk, which was afterward converted into coal, and so on, until as the speck of soot it now passes before your vision on its way to other adventures.\n\nAnd a mighty chain of events, causes and effects, brought it to its present condition, and the later is but one of the chain of events which will go to produce other events hundreds of years from now."


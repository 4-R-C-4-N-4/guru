[content]
body = "With this difference, always, between the various hypotheses--that under the old views Mental Power was ignored as a Natural Force, while under Mentalism it becomes the Greatest Natural Force.\n\nAnd this one difference revolutionizes Life, to those who understand the Principle and its resulting laws and practice.\n\nSo, finally, students all, grasp the advantage of Mentalism, and learn to know, use and apply the laws resulting therefrom.\n\nBut do not yield to the temptation which, as The Kybalion states, overcomes the half-wise and which causes them to be hypnotized by the apparent unreality of things, the consequence being that they wander about like dream-people dwelling in a world of dreams, ignoring the practical work and life of man, the end being that \"they are broken against the rocks and torn asunder by the elements, by reason of their folly.\" Rather follow the example of the wise, which the same authority states, \"use Law against Laws; the higher against the lower; and by the Art of Alchemy transmute that which is undesirable into that which is worthy, and thus triumph.\" Following the authority, let us avoid the half-wisdom (which is folly) which ignores the truth that: \"Mastery consists not in abnormal dreams, visions, and fantastic imaginings or living, but in using the higher forces against the lower--escaping the pains of the lower planes by vibrating on the higher.\" Remember always, student, that \"Transmutation, not presumptuous denial, is the weapon of the Master.\" The above quotations are from The Kybalion, and are worthy of being committed to memory by the student.\n\nWe do not live in a world of dreams, but in an Universe which while relative, is real so far as our lives and actions are concerned.\n\nOur business in the Universe is not to deny its existence, but to LIVE, using the Laws to rise from lower to higher--living on, doing the best that we can under the circumstances arising each day, and living, so far as is possible, to our biggest ideas and ideals.\n\nThe true Meaning of Life is not known to men on this plane .if, indeed, to any--but the highest authorities, and our own intuitions, teach us that we will make no mistake in living up to the best that is in us, so far as is possible, and realising the Universal tendency in the same direction in spite of apparent evidence to the contrary.\n\nWe are all on The Path--and the road leads upward ever, with frequent resting places.\n\nRead the message of The Kybalion--and follow the example of \"the wise\"--avoiding the mistake of \"the half-wise\" who perish by reason of their folly."


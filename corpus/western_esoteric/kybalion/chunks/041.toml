[content]
body = "It must be remembered, in the above illustration, that at the stages at which the \"object\" throws off vibrations of light, heat, etc., it is not actually \"resolved\" into those forms of energy (which are much higher in the scale), but simply that it reaches a degree of vibration in which those forms of energy are liberated, in a degree, from the confining influences of its molecules, atoms and corpuscles, as the case may be.\n\nThese forms of energy, although much higher in the scale than matter, are imprisoned and confined in the material combinations, by reason of the energies manifesting through, and using material forms, but thus becoming entangled and confined in their creations of material forms, which, to an extent, is true of all creations, the creating force becoming involved in its creation.\n\nBut the Hermetic Teachings go much further than do those of modern science.\n\nThey teach that all manifestation of thought, emotion, reason, will or desire, or any mental state or condition, are accompanied by vibrations, a portion of which are thrown off and which tend to affect the minds of other persons by \"induction.\" This is the principle which produces the phenomena of \"telepathy\"; mental influence, and other forms of the action and power of mind over mind, with which the general public is rapidly becoming acquainted, owing to the wide dissemination of occult knowledge by the various schools, cults and teachers along these lines at this time.\n\nEvery thought, emotion or mental state has its corresponding rate and mode of vibration.\n\nAnd by an effort of the will of the person, or of other persons, these mental states may be reproduced, just as a musical tone may be reproduced by causing an instrument to vibrate at a certain rate--just as color may be reproduced in the same may.\n\nBy a knowledge of the Principle of Vibration, as applied to Mental Phenomena, one may polarize his mind at any degree he wishes, thus gaining a perfect control over his mental states, moods, etc.\n\nIn the same way he may affect the minds of others, producing the desired mental states in them.\n\nIn short, he may be able to produce on the Mental Plane that which science produces on the Physical Plane--namely, \"Vibrations at Will.\" This power of course may be acquired only by the proper instruction, exercises, practice, etc., the science being that of Mental Transmutation, one of the branches of the Hermetic Art.\n\nA little reflection on what we have said will show the student that the Principle of Vibration underlies the wonderful phenomena of the power manifested by the Masters and Adepts, who are able to apparently set aside the Laws of Nature, but who, in reality, are simply using one law against another; one principle against others; and who accomplish their results by changing the vibrations of material objects, or forms of energy, and thus perform what are commonly called \"miracles.\" As one of the old Hermetic writers has truly said: \"He who understands the Principle of Vibration, has grasped the scepter of Power.\""


[content]
body = "So that if even these highest Beings, whose powers exceed even those attributed by men to their gods--if even these are bound by and are subservient to Law, then imagine the presumption of mortal man, of our race and grade, when he dares to consider the Laws of Nature as \"unreal!\" visionary and illusory, because he happens to be able to grasp the truth that the Laws are Mental in nature, and simply Mental Creations of THE ALL.\n\nThose Laws which THE ALL intends to be governing Laws are not to be defied or argued away.\n\nSo long as the Universe endures, will they endure--for the Universe exists by virtue of these Laws which form its framework and which hold it together.\n\nThe Hermetic Principle of Mentalism, while explaining the true nature of the Universe upon the principle that all is Mental, does not change the scientific conceptions of the Universe, Life, or Evolution.\n\nIn fact, science merely corroborates the Hermetic Teachings.\n\nThe latter merely teaches that the nature of the Universe is \"Mental,\" while modern science has taught that it is \"Material\"; or (of late) that it is \"Energy\" at the last analysis.\n\nThe Hermetic Teachings have no fault to find with Herbert Spencer's basic principle which postulates the existence of an \"Infinite and Eternal Energy, from which all things proceed.\" In fact, the Hermetics recognize in Spencer's philosophy the highest outside statement of the workings of the Natural Laws that have ever been promulgated, and they believe Spencer to have been a reincarnation of an ancient philosopher who dwelt in ancient Egypt thousands of years ago, and who later incarnated as Heraclitus, the Grecian philosopher who lived B.\n\nC.\n\n500.\n\nAnd they regard his statement of the \"Infinite and Eternal Energy\" as directly in the line of the Hermetic Teachings, always with the addition of their own doctrine that his \"Energy\" is the Energy of the Mind of THE ALL.\n\nWith the Master-Key of the Hermetic Philosophy, the student of Spencer will be able to unlock many doors of the inner philosophical conceptions of the great English philosopher, whose work shows the results of the preparation of his previous incarnations.\n\nHis teachings regarding Evolution and Rhythm are in almost perfect agreement with the Hermetic Teachings regarding the Principle of Rhythm.\n\nSo, the student of Hermetics need not lay aside any of his cherished scientific views regarding the Universe.\n\nAll he is asked to do is to grasp the underlying principle of \"THE ALL is Mind; the Universe is Mental--held in the mind of THE ALL.\" He will find that the other six of the Seven Principles will \"fit into\" his scientific knowledge, and will serve to bring out obscure points and to throw light in dark corners.\n\nThis is not to be wondered at, when we realize the influence of the Hermetic thought of the early philosophers of Greece, upon whose foundations of thought the theories of modern science largely rest.\n\nThe acceptance of the First Hermetic Principle (Mentalism) is the only great point of difference between Modern Science and Hermetic students, and Science is gradually moving toward the Hermetic position in its groping in the dark for a way out of the Labyrinth into which it has wandered in its search for Reality.\n\nThe purpose of this lesson is to impress upon the minds of our students the fact that, to all intents and purposes, the Universe and its laws, and its phenomena, are just as REAL, so far as Man is concerned, as they would be under the hypotheses of Materialism or Energism.\n\nUnder any hypothesis the Universe in its outer aspect is changing, ever-flowing, and transitory--and therefore devoid of substantiality and reality.\n\nBut (note the other pole of the truth) under the same hypotheses, we are compelled to ACT AND LIVE as if the fleeting things were real and substantial."


[content]
body = "Man, like Micawber, may exclaim: \"The Spirit of my Creator is inherent within me-- and yet I am not HE!\" How different this from the shocking half-truth so vociferously announced by certain of the half-wise, who fill the air with their raucous cries of: \"I am God!\" Imagine poor Micawber, or the sneaky Uriah Heep, crying: \"I Am Dickens\"; or some of the lowly clods in one of Shakespeare's plays, eloquently announcing that: \"I Am Shakespeare!\" THE ALL is in the earthworm, and yet the earth-worm is far from being THE ALL.\n\nAnd still the wonder remains, that though the earth-worm exists merely as a lowly thing, created and having its being solely within the Mind of THE ALL--yet THE ALL is immanent in the earthworm, and in the particles that go to make up the earth-worm.\n\nCan there be any greater mystery than this of \"All in THE ALL; and THE ALL in All?\" The student will, of course, realize that the illustrations given above are necessarily imperfect and inadequate, for they represent the creation of mental images in finite minds, while the Universe is a creation of Infinite Mind--and the difference between the two poles separates them.\n\nAnd yet it is merely a matter of degree--the same Principle is in operation--the Principle of Correspondence manifests in each--\"As above, so Below; as Below, so above.\" And, in the degree that Man realizes the existence of the Indwelling Spirit immanent within his being, so will he rise in the spiritual scale of life.\n\nThis is what spiritual development means--the recognition, realization, and manifestation of the Spirit within us.\n\nTry to remember this last definition--that of spiritual development.\n\nIt contains the Truth of True Religion.\n\nThere are many planes of Being--many sub-planes of Life--many degrees of existence in the Universe.\n\nAnd all depend upon the advancement of beings in the scale, of which scale the lowest point is the grossest matter, the highest being separated only by the thinnest division from the SPIRIT of THE ALL.\n\nAnd, upward and onward along this Scale of Life, everything is moving.\n\nAll are on the Path, whose end is THE ALL.\n\nAll progress is a Returning Home.\n\nAll is Upward and Onward, in spite of all seemingly contradictory appearances.\n\nSuch is the message of the Illumined.\n\nThe Hermetic Teachings concerning the process of the Mental Creation of the Universe, are that at the beginning of the Creative Cycle, THE ALL, in its aspect of Being, projects its Will toward its aspect of \"Becoming\" and the process of creation begins.\n\nIt is taught that the process consists of the lowering of Vibration until a very low degree of vibratory energy is reached, at which point the grossest possible form of Matter is manifested.\n\nThis process is called the stage of Involution, in which THE ALL becomes \"involved,\" or \"wrapped up,\" in its creation.\n\nThis process is believed by the Hermetists to have a Correspondence to the mental process of an artist, writer, or inventor, who becomes so wrapped up in his mental creation as to almost forget his own existence and who, for the time being, almost \"lives in his creation,\" If instead of \"wrapped\" we use the word \"rapt,\" perhaps we will give a better idea of what is meant."


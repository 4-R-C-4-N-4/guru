body = "CHAPTER II THE SEVEN HERMETIC PRINCIPLES \"The Principles of Truth are Seven; he who knows these, understandingly, possesses the Magic Key before whose touch all the Doors of the Temple fly open.\"--The Kybalion.\n\nThe Seven Hermetic Principles, upon which the entire Hermetic Philosophy is based, are as follows: 1.\n\nThe Principle of Mentalism.\n\n2.\n\nThe Principle of Correspondence.\n\n3.\n\nThe Principle of Vibration.\n\n4.\n\nThe Principle of Polarity.\n\n5.\n\nThe Principle of Rhythm.\n\n6.\n\nThe Principle of Cause and Effect.\n\n7.\n\nThe Principle of Gender.\n\nThese Seven Principles will be discussed and explained as we proceed with these lessons.\n\nA short explanation of each, however, may as well be given at this point.\n\n1.\n\nThe Principle of Mentalism \"THE ALL IS MIND; The Universe is Mental.\"--The Kybalion.\n\nThis Principle embodies the truth that \"All is Mind.\" It explains that THE ALL (which is the Substantial Reality underlying all the outward manifestations and appearances which we know under the terms of \"The Material Universe\"; the \"Phenomena of Life\"; \"Matter\"; \"Energy\"; and, in short, all that is apparent to our material senses) is SPIRIT which in itself is UNKNOWABLE and UNDEFINABLE, but which may be considered and thought of as AN UNIVERSAL, INFINITE, LIVING MIND.\n\nIt also explains that all the phenomenal world or universe is simply a Mental Creation of THE ALL, subject to the Laws of Created Things, and that the universe, as a whole, and in its parts or units, has its existence in the Mind of THE ALL, in which Mind we \"live and move and have our being.\" This Principle, by establishing the Mental Nature of the Universe, easily explains all of the varied mental and psychic phenomena that occupy such a large portion of the public attention, and which, without such explanation, are non-understandable and defy scientific treatment.\n\nAn understanding of this great Hermetic Principle of Mentalism enables the individual to readily grasp the laws of the Mental Universe, and to apply the same to his well-being and advancement.\n\nThe Hermetic Student is enabled to apply intelligently the great Mental Laws, instead of using them in a haphazard manner.\n\nWith the Master-Key in his possession, the student may unlock the many doors of the mental and psychic temple of knowledge, and enter the same freely and intelligently.\n\nThis Principle explains the true nature of \"Energy,\" \"Power,\" and \"Matter,\" and why and how all these are subordinate to the Mastery of Mind.\n\nOne of the old Hermetic Masters wrote, long ages ago: \"He who grasps the truth of the Mental Nature of the Universe is well advanced on The Path to Mastery.\" And these words are as true today as at the time they were first written.\n\nWithout this Master-Key, Mastery is impossible, and the student knocks in vain at the many doors of The Temple.\n\n2.\n\nThe Principle of Correspondence \"As above, so below; as below, so above.\"--The Kybalion.\n\nThis Principle embodies the truth that there is always a Correspondence between the laws and phenomena of the various planes of Being and Life.\n\nThe old Hermetic axiom ran in these words: \"As above, so below; as below, so above.\" And the grasping of this Principle gives one the means of solving many a dark paradox, and hidden secret of Nature.\n\nThere are planes beyond our knowing, but when we apply the Principle of Correspondence to them we are able to understand much that would otherwise be unknowable to us.\n\nThis Principle is of universal application and manifestation, on the various planes of the material, mental, and spiritual universe--it is an Universal Law."


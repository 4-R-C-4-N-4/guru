[content]
body = "While at first there seems to be only an \"I\" existing, a more careful and closer examination reveals the fact that there exists an \"I\" and a \"Me.\" These mental twins differ in their characteristics and nature, and an examination of their nature and the phenomena arising from the same will throw much light upon many of the problems of mental influence.\n\nLet us begin with a consideration of the Me, which is usually mistaken for the I by the student, until he presses the inquiry a little further back into the recesses of consciousness.\n\nA man thinks of his Self (in its aspect of Me) as being composed of certain feelings, tastes likes, dislikes, habits, peculiar ties, characteristics, etc., all of which go to make up his personality, or the \"Self\" known to himself and others.\n\nHe knows that these emotions and feelings change; are born and die away; are subject to the Principle of Rhythm, and the Principle of Polarity, which take him from one extreme of feeling to another.\n\nHe also thinks of the \"Me\" as being certain knowledge gathered together in his mind, and thus forming a part of himself.\n\nThis is the \"Me\" of a man.\n\nBut we have proceeded too hastily.\n\nThe \"Me\" of many men may be said to consist largely of their consciousness of the body and their physical appetites, etc.\n\nTheir consciousness being largely bound up with their bodily nature, they practically \"live there.\" Some men even go so far as to regard their personal apparel as a part of their \"Me\" and actually seem to consider it a part of themselves.\n\nA writer has humorously said that \"men consist of three parts--soul, body and clothes.\" These \"clothes conscious\" people would lose their personality if divested of their clothing by savages upon the occasion of a shipwreck.\n\nBut even many who are not so closely bound up with the idea of personal raiment stick closely to the consciousness of their bodies being their \"Me\" They cannot conceive of a Self independent of the body.\n\nTheir mind seems to them to be practically \"a something belonging to\" their body-which in many cases it is indeed.\n\nBut as man rises in the scale of consciousness he is able to disentangle his \"Me\" from his idea of body, and is able to think of his body as \"belonging to\" the mental part of him.\n\nBut even then he is very apt to identify the \"Me\" entirely with the mental states, feelings, etc., which he feels to exist within him.\n\nHe is very apt to consider these internal states as identical with himself, instead of their being simply \"things\" produced by some part of his mentality, and existing within him--of him, and in him, but still not \"himself.\" He sees that he may change these internal states of feelings by all effort of will, and that he may produce a feeling or state of an exactly opposite nature, in the same way, and yet the same \"Me\" exists.\n\nAnd so after a while he is able to set aside these various mental states, emotions, feelings, habits, qualities, characteristics, and other personal mental belongings--he is able to set them aside in the \"not-me\" collection of curiosities and encumbrances, as well as valuable possessions.\n\nThis requires much mental concentration and power of mental analysis on the part of the student.\n\nBut still the task is possible for the advanced student, and even those not so far advanced are able to see, in the imagination, how the process may be performed.\n\nAfter this laying-aside process has been performed, the student will find himself in conscious possession of a \"Self\" which may be considered in its \"I\" and \"Me\" dual aspects.\n\nThe \"Me\" will be felt to be a Something mental in which thoughts, ideas, emotions, feelings, and other mental states may be produced."


[content]
body = "Well, then, secondly, Man pro-creates or reproduces his kind by the process of begetting, which is self-multiplication accomplished by transferring a portion of his substance to his offspring.\n\nBut this will not do, because THE ALL cannot transfer or subtract a portion of itself, nor can it reproduce or multiply itself--in the first place there would be a taking away, and in the second case a multiplication or addition to THE ALL, both thoughts being an absurdity.\n\nIs there no third way in which MAN creates?\n\nYes, there is--he CREATES MENTALLY!\n\nAnd in so doing he uses no outside materials, nor does he reproduce himself, and yet his Spirit pervades the Mental Creation.\n\nFollowing the Principle of Correspondence, we are justified in considering that THE ALL creates the Universe MENTALLY, in a manner akin to the process whereby Man creates Mental Images.\n\nAnd, here is where the report of Reason tallies precisely with the report of the Illumined, as shown by their teachings and writings.\n\nSuch are the teachings of the Wise Men.\n\nSuch was the Teaching of Hermes.\n\nTHE ALL can create in no other way except mentally, without either using material (and there is none to use), or else reproducing itself (which is also impossible).\n\nThere is no escape from this conclusion of the Reason, which, as we have said, agrees with the highest teachings of the Illumined.\n\nJust as you, student, may create a Universe of your own in your mentality, so does THE ALL create Universes in its own Mentality.\n\nBut your Universe is the mental creation of a Finite Mind, whereas that of THE ALL is the creation of an Infinite.\n\nThe two are similar in kind, but infinitely different in degree.\n\nWe shall examine more closely into the process of creation and manifestation as we proceed.\n\nBut this is the point to fix in your minds at this stage: THE UNIVERSE, AND ALL IT CONTAINS, IS A MENTAL CREATION OF THE ALL.\n\nVerily indeed, ALL IS MIND!\n\n\"THE ALL creates in its Infinite Mind countless Universes, which exist for aeons of Time--and yet, to THE ALL, the creation, development, decline and death of a million Universes is as the time of the twinkling of an eye.\"--The Kybalion.\n\n\"The Infinite Mind of THE ALL is the womb of Universes.\"--The Kybalion.\n\nThe Principle of Gender (see Lesson I.\n\nand other lessons to follow) is manifested on all planes of life, material mental and spiritual.\n\nBut, as we have said before, \"Gender\" does not mean \"Sex\" sex is merely a material manifestation of gender.\n\n\"Gender\" means \"relating to generation or creation.\" And whenever anything is generated or created, on any plane, the Principle of Gender must be manifested.\n\nAnd this is true even in the creation of Universes.\n\nNow do not jump to the conclusion that we are teaching that there is a male and female God, or Creator.\n\nThat idea is merely a distortion of the ancient teachings on the subject.\n\nThe true teaching is that THE ALL, in itself, is above Gender, as it is above every other Law, including those of Time and Space.\n\nIt is the Law, from which the Laws proceed, and it is not subject to them.\n\nBut when THE ALL manifests on the plane of generation or creation, then it acts according to Law and Principle, for it is moving on a lower plane of Being.\n\nAnd consequently it manifests the Principle of Gender, in its Masculine and Feminine aspects, on the Mental Plane, of course.\n\nThis idea may seem startling to some of you who hear it for the first time, but you have all really passively accepted it in your everyday conceptions."


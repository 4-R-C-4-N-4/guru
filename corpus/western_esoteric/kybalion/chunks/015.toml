[content]
body = "And still more presumptuous are those who attempt to ascribe to THE ALL the personality, qualities, properties, characteristics and attributes of themselves, ascribing to THE ALL the human emotions, feelings, and characteristics, even down to the pettiest qualities of mankind, such as jealousy, susceptibility to flattery and praise, desire for offerings and worship, and all the other survivals from the days of the childhood of the race.\n\nSuch ideas are not worthy of grown men and women, and are rapidly being discarded.\n\n(At this point, it may be proper for me to state that we make a distinction between Religion and Theology--between Philosophy and Metaphysics.\n\nReligion, to us, means that intuitional realization of the existence of THE ALL, and one's relationship to it; while Theology means the attempts of men to ascribe personality, qualities, and characteristics to it; their theories regarding its affairs, will, desires, plans, and designs, and their assumption of the office of '' middle-men'' between THE ALL and the people.\n\nPhilosophy, to us, means the inquiry after knowledge of things knowable and thinkable; while Metaphysics means the attempt to carry the inquiry over and beyond the boundaries and into regions unknowable and unthinkable, and with the same tendency as that of Theology.\n\nAnd consequently, both Religion and Philosophy mean to us things having roots in Reality, while Theology and Metaphysics seem like broken reeds, rooted in the quicksands of ignorance, and affording naught but the most insecure support for the mind or soul of Man.\n\nwe do not insist upon our students accepting these definitions--we mention them merely to show our position.\n\nAt any rate, you shall hear very little about Theology and Metaphysics in these lessons.) But while the essential nature of THE ALL is Unknowable, there are certain truths connected with its existence which the human mind finds itself compelled to accept.\n\nAnd an examination of these reports form a proper subject of inquiry, particularly as they agree with the reports of the Illumined on higher planes.\n\nAnd to this inquiry we now invite you.\n\n\"THAT which is the Fundamental Truth--the Substantial Reality--is beyond true naming, but the Wise Men call it THE ALL.\"--The Kybalion.\n\n\"In its Essence, THE ALL is UNKNOWABLE.\"--The Kybalion.\n\n\"But, the report of Reason must be hospitably received, and treated with respect.\"--The Kybalion.\n\nThe human reason, whose reports we must accept so long as we think at all, informs us as follows regarding THE ALL, and that without attempting to remove the veil of the Unknowable: (1) THE ALL must be ALL that REALLY IS.\n\nThere can be nothing existing outside of THE ALL, else THE ALL would not be THE ALL.\n\n(2) THE ALL must be INFINITE, for there is nothing else to define, confine, bound, limit; or restrict THE ALL.\n\nIt must be Infinite in Time, or ETERNAL,--it must have always continuously existed, for there is nothing else to have ever created it, and something can never evolve from nothing, and if it had ever \"not been,\" even for a moment, it would not \"be\" now,--it must continuously exist forever, for there is nothing to destroy it, and it can never \"not-be,\" even for a moment, because something can never become nothing."


[content]
body = "The ancient Hermetists considered this Principle as one of the most important mental instruments by which man was able to pry aside the obstacles which hid from view the Unknown.\n\nIts use even tore aside the Veil of Isis to the extent that a glimpse of the face of the goddess might be caught.\n\nJust as a knowledge of the Principles of Geometry enables man to measure distant suns and their movements, while seated in his observatory, so a knowledge of the Principle of Correspondence enables Man to reason intelligently from the Known to the Unknown.\n\nStudying the monad, he understands the archangel.\n\n3.\n\nThe Principle of Vibration \"Nothing rests; everything moves; everything vibrates.\"--The Kybalion.\n\nThis Principle embodies the truth that \"everything is in motion\"; \"everything vibrates\"; \"nothing is at rest\"; facts which Modern Science endorses, and which each new scientific discovery tends to verify.\n\nAnd yet this Hermetic Principle was enunciated thousands of years ago, by the Masters of Ancient Egypt.\n\nThis Principle explains that the differences between different manifestations of Matter, Energy, Mind, and even Spirit, result largely from varying rates of Vibration.\n\nFrom THE ALL, which is Pure Spirit, down to the grossest form of Matter, all is in vibration--the higher the vibration, the higher the position in the scale.\n\nThe vibration of Spirit is at such an infinite rate of intensity and rapidity that it is practically at rest--just as a rapidly moving wheel seems to be motionless.\n\nAnd at the other end of the scale, there are gross forms of matter whose vibrations are so low as to seem at rest.\n\nBetween these poles, there are millions upon millions of varying degrees of vibration.\n\nFrom corpuscle and electron, atom and molecule, to worlds and universes, everything is in vibratory motion.\n\nThis is also true on the planes of energy and force (which are but varying degrees of vibration); and also on the mental planes (whose states depend upon vibrations); and even on to the spiritual planes.\n\nAn understanding of this Principle, with the appropriate formulas, enables Hermetic students to control their own mental vibrations as well as those of others.\n\nThe Masters also apply this Principle to the conquering of Natural phenomena, in various ways.\n\n\"He who understands the Principle of Vibration, has grasped the scepter of power,\" says one of the old writers.\n\n4.\n\nThe Principle of Polarity \"Everything is Dual; everything has poles; everything has its pair of opposites; like and unlike are the same; opposites are identical in nature, but different in degree; extremes meet; all truths are but half-truths; all paradoxes may be reconciled.\"--The Kybalion.\n\nThis Principle embodies the truth that \"everything is dual\"; \"everything has two poles\"; \"everything has its pair of opposites,\" all of which were old Hermetic axioms.\n\nIt explains the old paradoxes, that have perplexed so many, which have been stated as follows: \"Thesis and antithesis are identical in nature, but different in degree\"; \"opposites are the same, differing only in degree\"; \"the pairs of opposites may be reconciled\"; \"extremes meet\"; \"everything is and isn't, at the same time\"; \"all truths are but half-truths\"; \"every truth is half-false\"; \"there are two sides to everything,\" etc., etc., etc.\n\nIt explains that in everything there are two poles, or opposite aspects, and that \"opposites\" are really only the two extremes of the same thing, with many varying degrees between them.\n\nTo illustrate: Heat and Cold, although \"opposites,\" are really the same thing, the differences consisting merely of degrees of the same thing.\n\nLook at your thermometer and see if you can discover where \"heat\" terminates and \"cold\" begins!"


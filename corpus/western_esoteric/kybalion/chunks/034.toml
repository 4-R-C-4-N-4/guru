[content]
body = "The Plane of Energy (B) comprises seven subplanes of higher forms of energy not as yet discovered by science, but which have been called \"Nature's Finer Forces\" and which are called into operation in manifestations of certain forms of mental phenomena, and by which such phenomena becomes possible.\n\nThe Plane of Energy (C) comprises seven sub-planes of energy so highly organized that it bears many of the characteristics of \"life,\" but which is not recognized by the minds of men on the ordinary plane of development, being available for the use on beings of the Spiritual Plane alone--such energy is unthinkable to ordinary man, and may be considered almost as \"the divine power.\" The beings employing the same are as \"gods\" compared even to the highest human types known to us.\n\nThe Great Mental Plane comprises those forms of \"living things\" known to us in ordinary life, as well as certain other forms not so well known except to the occultist.\n\nThe classification of the Seven Minor Mental Planes is more or less satisfactory and arbitrary (unless accompanied by elaborate explanations which are foreign to the purpose of this particular work), but we may as well mention them.\n\nThey are as follows: 1.\n\nThe Plane of Mineral Mind 2.\n\nThe Plane of Elemental Mind (A) 3.\n\nThe Plane of Plant Mind 4.\n\nThe Plane of Elemental Mind (B) 5.\n\nThe Plane of Animal Mind 6.\n\nThe Plane of Elemental Mind (C) 7.\n\nThe Plane of Human Mind The Plane of Mineral Mind comprises the \"states or conditions\" of the units or entities, or groups and combinations of the same, which animate the forms known to us as \"minerals, chemicals, etc.\" These entities must not be confounded with the molecules, atoms and corpuscles themselves, the latter being merely the material bodies or forms of these entities, just as a man's body is but his material form and not \"himself.\" These entities may be called \"souls\" in one sense, and are living beings of a low degree of development, life, and mind--just a little more than the units of \"living energy\" which comprise the higher sub-divisions of the highest Physical Plane.\n\nThe average mind does not generally attribute the possession of mind, soul, or life, to the mineral kingdom, but all occultists recognize the existence of the same, and modern science is rapidly moving forward to the point-of-view of the Hermetic, in this respect.\n\nThe molecules, atoms and corpuscles have their \"loves and hates\"; \"likes and dislikes\"; \"attractions and repulsions\".\n\n\"affinities and non-affinities,\" etc., and some of the more daring of modern scientific minds have expressed the opinion that the desire and will, emotions and feelings, of the atoms differ only in degree from those of men.\n\nWe have no time or space to argue this matter here.\n\nAll occultists know it to be a fact, and others are referred to some of the more recent scientific works for outside corroboration.\n\nThere are the usual seven sub-divisions to this plane.\n\nThe Plane of Elemental Mind (A) comprises the state or condition, and degree of mental and vital development of a class of entities unknown to the average man, but recognized to occultists.\n\nThey are invisible to the ordinary senses of man, but, nevertheless, exist and play their part of the Drama of the Universe.\n\nTheir degree of intelligence is between that of the mineral and chemical entities on the one hand, and of the entities of the plant kingdom on the other.\n\nThere are seven subdivisions to this plane, also."


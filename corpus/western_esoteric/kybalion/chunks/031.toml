[content]
body = "The Law of Correspondence, in our opinion, reaches only to that aspect of THE ALL, which may be spoken of as \"The Aspect of BECOMING.\" Back of that Aspect is \"The Aspect of BEING\" in which all Laws are lost in LAW; all Principles merge into PRINCIPLE--and THE ALL; PRINCIPLE; and BEING; are IDENTICAL, ONE AND THE SAME.\n\nTherefore, Metaphysical speculation on this point is futile.\n\nWe go into the matter here, merely to show that we recognize the question, and also the absurdity of the ordinary answers of metaphysics and theology.\n\nIn conclusion, it may be of interest to our students to learn that while some of the ancient, and modern, Hermetic Teachers have rather inclined in the direction of applying the Principle of Correspondence to the question, with the result of the \"Inner Nature\" conclusion,--still the legends have it that HERMES, the Great, when asked this question by his advanced students, answered them by PRESSING HIS LIPS TIGHTLY TOGETHER and saying not a word, indicating that there WAS NO ANSWER.\n\nBut, then, he may have intended to apply the axiom of his philosophy, that: \"The lips of Wisdom are closed, except to the ears of Understanding,\" believing that even his advanced students did not possess the Understanding which entitled them to the Teaching.\n\nAt any rate, if Hermes possessed the Secret, he failed to impart it, and so far as the world is concerned THE LIPS OF HERMES ARE CLOSED regarding it.\n\nAnd where the Great Hermes hesitated to speak, what mortal may dare to teach?\n\nBut, remember, that whatever be the answer to this problem, if indeed there be an answer the truth remains that: \"While All is in THE ALL, it is equally true that THE ALL is in All.\" The Teaching on this point is emphatic.\n\nAnd, we may add the concluding words of the quotation: \"To him who truly understands this truth, hath come great knowledge.\""


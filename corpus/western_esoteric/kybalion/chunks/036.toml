[content]
body = "The great kingdoms of Elementals are fully recognized by all occultists, and the esoteric writings are full of mention of them.\n\nThe readers of Bulwer's \"Sanoni\" and similar tales will recognize the entities inhabiting these planes of life.\n\nPassing on from the Great Mental Plane to the Great Spiritual Plane, what shall we say?\n\nHow can we explain these higher states of Being, Life and Mind, to minds as yet unable to grasp and understand the higher subdivisions of the Plane of Human Mind?\n\nThe task is impossible.\n\nWe can speak only in the most general terms.\n\nHow may Light be described to a man born blind--how sugar, to a man who has never tasted anything sweet--how harmony, to one born deaf?\n\nAll that we can say is that the Seven Minor Planes of the Great Spiritual Plane (each Minor Plane having its seven sub-divisions) comprise Beings possessing Life, Mind and Form as far above that of Man of to-day as the latter is above the earth-worm, mineral or even certain forms of Energy or Matter.\n\nThe Life of these Beings so far transcends ours, that we cannot even think of the details of the same; their minds so far transcend ours, that to them we scarcely seem to \"think,\" and our mental processes seem almost akin to material processes; the Matter of which their forms are composed is of the highest Planes of Matter, nay, some are even said to be \"clothed in Pure Energy.\" What may be said of such Beings?\n\nOn the Seven Minor Planes of the Great Spiritual Plane exist Beings of whom we may speak as Angels; Archangels; Demi-Gods.\n\nOn the lower Minor Planes dwell those great souls whom we call Masters and Adepts.\n\nAbove them come the Great Hierarchies of the Angelic Hosts, unthinkable to man; and above those come those who may without irreverence be called \"The Gods,\" so high in the scale of Being are they, their being, intelligence and power being akin to those attributed by the races of men to their conceptions of Deity.\n\nThese Beings are beyond even the highest flights of the human imagination, the word \"Divine\" being the only one applicable to them.\n\nMany of these Beings, as well as the Angelic Host, take the greatest interest in the affairs of the Universe and play an important part in its affairs.\n\nThese Unseen Divinities and Angelic Helpers extend their influence freely and powerfully, in the process of Evolution, and Cosmic Progress.\n\nTheir occasional intervention and assistance in human affairs have led to the many legends, beliefs, religions and traditions of the race, past and present.\n\nThey have superimposed their knowledge and power upon the world, again and again, all under the Law of THE ALL, of course.\n\nBut, yet, even the highest of these advanced Beings exist merely as creations of, and in, the Mind of THE ALL, and are subject to the Cosmic Processes and Universal Laws.\n\nThey are still Mortal.\n\nWe may call them \"gods\" if we like, but still they are but the Elder Brethren of the Race,--the advanced souls who have outstripped their brethren, and who have foregone the ecstasy of Absorption by THE ALL, in order to help the race on its upward journey along The Path.\n\nBut, they belong to the Universe, and are subject to its conditions--they are mortal--and their plane is below that of Absolute Spirit.\n\nOnly the most advanced Hermetists are able to grasp the Inner Teachings regarding the state of existence, and the powers manifested on the Spiritual Planes.\n\nThe phenomena is so much higher than that of the Mental Planes that a confusion of ideas would surely result from an attempt to describe the same."


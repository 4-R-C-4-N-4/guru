[content]
body = "The Plane of Plant Mind, in its seven sub-divisions, comprises the states or conditions of the entities comprising the kingdoms of the Plant World, the vital and mental phenomena of which is fairly well understood by the average intelligent person, many new and interesting scientific works regarding \"Mind and Life in Plants\" having been published during the last decade.\n\nPlants have life, mind and \"souls,\" as well as have the animals, man, and super-man.\n\nThe Plane of Elemental Mind (B), in its seven sub-divisions, comprises the states and conditions of a higher form of \"elemental\" or unseen entities, playing their part in the general work of the Universe, the mind and life of which form a part of the scale between the Plane of Plant Mind and the Plane of Animal Mind, the entities partaking of the nature of both.\n\nThe Plane of Animal Mind, in its seven sub-divisions, comprises the states and conditions of the entities, beings, or souls, animating the animal forms of life, familiar to us all.\n\nIt is not necessary to go into details regarding this kingdom or plane of life, for the animal world is as familiar to us as is our own.\n\nThe Plane of Elemental Mind (C), in its seven sub-divisions, comprises those entities or beings, invisible as are all such elemental forms, which partake of the nature of both animal and human life in a degree and in certain combinations.\n\nThe highest forms are semi-human in intelligence.\n\nThe Plane of Human Mind, in its seven sub-divisions, comprises those manifestations of life and mentality which are common to Man, in his various grades, degrees, and divisions.\n\nIn this connection, we wish to point out the fact that the average man of today occupies but the fourth sub-division of the Plane of Human Mind, and only the most intelligent have crossed the borders of the Fifth Sub-Division.\n\nIt has taken the race millions of years to reach this stage, and it will take many more years for the race to move on to the sixth and seventh sub-divisions, and beyond.\n\nBut, remember, that there have been races before us which have passed through these degrees, and then on to higher planes.\n\nOur own race is the fifth (with stragglers from the fourth) which has set foot upon The Path.\n\nAnd, then there are a few advanced souls of our own race who have outstripped the masses, and who have passed on to the sixth and seventh sub-division, and some few being still further on.\n\nThe man of the Sixth Sub-Division will be \"The Super-Man\"; he of the Seventh will be \"The Over-Man.\" In our consideration of the Seven Minor Mental Planes, we have merely referred to the Three Elementary Planes in a general way.\n\nWe do not wish to go into this subject in detail in this work, for it does not belong to this part of the general philosophy and teachings.\n\nBut we may say this much, in order to give you a little clearer idea, of the relations of these planes to the more familiar ones--the Elementary Planes bear the same relation to the Planes of Mineral, Plant, Animal and Human Mentality and Life, that the black keys on the piano do to the white keys.\n\nThe white keys are sufficient to produce music, but there are certain scales, melodies, and harmonies, in which the black keys play their part, and in which their presence is necessary.\n\nThey are also necessary as \"connecting links\" of soul-condition; entity states, etc., between the several other planes, certain forms of development being attained therein--this last fact giving to the reader who can \"read between the lines\" a new light upon the processes of Evolution, and a new key to the secret door of the \"leaps of life\" between kingdom and kingdom."


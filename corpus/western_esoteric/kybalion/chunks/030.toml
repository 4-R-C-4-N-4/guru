[content]
body = "And just as THE ALL arouses itself from the meditation upon the Universe, so does Man (in time) cease from manifesting upon the Material Plane, and withdraws himself more and more into the Indwelling Spirit, which is indeed \"The Divine Ego.\" There is one more matter of which we desire to speak in this lesson, and that comes very near to an invasion of the Metaphysical field of speculation, although our purpose is merely to show the futility of such speculation.\n\nWe allude to the question which inevitably comes to the mind of all thinkers who have ventured to seek the Truth.\n\nThe question is: \"WHY does THE ALL create Universes\" The question may be asked in different forms, but the above is the gist of the inquiry.\n\nMen have striven hard to answer this question, but still there is no answer worthy of the name.\n\nSome have imagined that THE ALL had something to gain by it, but this is absurd, for what could THE ALL gain that it did not already possess?\n\nOthers have sought the answer in the idea that THE ALL \"wished something to love\" and others that it created for pleasure, or amusement; or because it \"was lonely\" or to manifest its power;--all puerile explanations and ideas, belonging to the childish period of thought.\n\nOthers have sought to explain the mystery by assuming that THE ALL found itself \"compelled\" to create, by reason of its own \"internal nature\"--its \"creative instinct.\" This idea is in advance of the others, but its weak point lies in the idea of THE ALL being \"compelled\" by anything, internal or external.\n\nIf its \"internal nature,\" or \"creative instinct,\" compelled it to do anything, then the \"internal nature\" or \"creative instinct\" would be the Absolute, instead of THE ALL, and so accordingly that part of the proposition falls.\n\nAnd, yet, THE ALL does create and manifest, and seems to find some kind of satisfaction in so doing.\n\nAnd it is difficult to escape the conclusion that in some infinite degree it must have what would correspond to an \"inner nature,\" or \"creative instinct,\" in man, with correspondingly infinite Desire and Will.\n\nIt could not act unless it Willed to Act; and it would not Will to Act, unless it Desired to Act and it would not Desire to Act unless it obtained some Satisfaction thereby.\n\nAnd all of these things would belong to an \"Inner Nature,\" and might be postulated as existing according to the Law of Correspondence.\n\nBut, still, we prefer to think of THE ALL as acting entirely FREE from any influence, internal as well as external.\n\nThat is the problem which lies at the root of difficulty--and the difficulty that lies at the root of the problem.\n\nStrictly speaking, there cannot be said to be any \"Reason\" whatsoever for THE ALL to act, for a \"reason\" implies a \"cause,\" and THE ALL is above Cause and Effect, except when it Wills to become a Cause, at which time the Principle is set into motion.\n\nSo, you see, the matter is Unthinkable, just as THE ALL is Unknowable.\n\nJust as we say THE ALL merely \"IS\"--so we are compelled to say that \"THE ALL ACTS BECAUSE IT ACTS.\" At the last, THE ALL is All Reason in Itself; All Law in Itself; All Action in Itself--and it may be said, truthfully, that THE ALL is Its Own Reason; its own Law; its own Act--or still further, that THE ALL; Its Reason; Its Act; is Law; are ONE, all being names for the same thing.\n\nIn the opinion of those who are giving you these present lessons, the answer is locked up in the INNER SELF of THE ALL, along with its Secret of Being."


[content]
body = "Only those whose minds have been carefully trained along the lines of the Hermetic Philosophy for years--yes, those who have brought with them from other incarnations the knowledge acquired previously--can comprehend just what is meant by the Teaching regarding these Spiritual Planes.\n\nAnd much of these Inner Teachings is held by the Hermetists as being too sacred, important and even dangerous for general public dissemination.\n\nThe intelligent student may recognize what we mean by this when we state that the meaning of \"Spirit\" as used by the Hermetists is akin to \"Living Power\"; \"Animated Force;\" \"Inner Essence;\" \"Essence of Life,\" etc., which meaning must not be confounded with that usually and commonly employed in connection with the term, i.e., \"religious; ecclesiastical; spiritual; ethereal; holy,\" etc., etc.\n\nTo occultists the word \"Spirit\" is used in the sense of \"The Animating Principle,\" carrying with it the idea of Power, Living Energy, Mystic Force, etc.\n\nAnd occultists know that that which is known to them as \"Spiritual Power\" may be employed for evil as well as good ends (in accordance with the Principle of Polarity), a fact which has been recognized by the majority of religions in their conceptions of Satan, Beelzebub, the Devil, Lucifer, Fallen Angels, etc.\n\nAnd so the knowledge regarding these Planes has been kept in the Holy of Holies in all Esoteric Fraternities and Occult Orders,--in the Secret Chamber of the Temple.\n\nBut this may be said here, that those who have attained high spiritual powers and have misused them, have a terrible fate in store for them, and the swing of the pendulum of Rhythm will inevitably swing them back to the furthest extreme of Material existence, from which point they must retrace their steps Spiritward, along the weary rounds of The Path, but always with the added torture of having always with them a lingering memory of the heights from which they fell owing to their evil actions.\n\nThe legends of the Fallen Angels have a basis in actual facts, as all advanced occultists know.\n\nThe striving for selfish power on the Spiritual Planes inevitably results in the selfish soul losing its spiritual balance and falling back as far as it had previously risen.\n\nBut to even such a soul, the opportunity of a return is given--and such souls make the return journey, paying the terrible penalty according to the invariable Law.\n\nIn conclusion we would again remind you that according to the Principle of Correspondence, which embodies the truth: \"As Above so Below; as Below, so Above,\" all of the Seven Hermetic Principles are in full operation on all of the many planes, Physical Mental and Spiritual.\n\nThe Principle of Mental Substance of course applies to all the planes, for all are held in the Mind of THE ALL.\n\nThe Principle of Correspondence manifests in all, for there is a correspondence, harmony and agreement between the several planes.\n\nThe Principle of Vibration manifests on all planes, in fact the very differences that go to make the \"planes\" arise from Vibration, as we have explained.\n\nThe Principle of Polarity manifests on each plane, the extremes of the Poles being apparently opposite and contradictory.\n\nThe Principle of Rhythm manifests on each Plane, the movement of the phenomena having its ebb and flow, rise and flow, incoming and outgoing.\n\nThe Principle of Cause and Effect manifests on each Plane, every Effect having its Cause and every Cause having its effect.\n\nThe Principle of Gender manifests on each Plane, the Creative Energy being always manifest, and operating along the lines of its Masculine and Feminine Aspects.\n\n\"As Above so Below; as Below, so Above.\" This centuries old Hermetic axiom embodies one of the great Principles of Universal Phenomena."


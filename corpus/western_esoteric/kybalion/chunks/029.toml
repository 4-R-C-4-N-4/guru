[content]
body = "This Involuntary stage of Creation is sometimes called the \"Outpouring\" of the Divine Energy, just as the Evolutionary state is called the \"Indrawing.\" The extreme pole of the Creative process is considered to be the furthest removed from THE ALL, while the beginning of the Evolutionary stage is regarded as the beginning of the return swing of the pendulum of Rhythm--a \"coming home\" idea being held in all of the Hermetic Teachings.\n\nThe Teachings are that during the \"Outpouring,\" the vibrations become lower and lower until finally the urge ceases, and the return swing begins.\n\nBut there is this difference, that while in the \"Outpouring\" the creative forces manifest compactly and as a whole, yet from the beginning of the Evolutionary or \"Indrawing\" stage, there is manifested the Law of Individualization--that is, the tendency to separate into Units of Force, so that finally that which left THE ALL as unindividualized energy returns to its source as countless highly developed Units of Life, having risen higher and higher in the scale by means of Physical, Mental and Spiritual Evolution.\n\nThe ancient Hermetists use the word \"Meditation\" in describing the process of the mental creation of the Universe in the Mind of THE ALL, the word \"Contemplation\" also being frequently employed.\n\nBut the idea intended seems to be that of the employment of the Divine Attention.\n\n\"Attention\" is a word derived from the Latin root, meaning \"to reach out; to stretch out,\" and so the act of Attention is really a mental \"reaching out; extension\" of mental energy, so that the underlying idea is readily understood when we examine into the real meaning of \"Attention.\" The Hermetic Teachings regarding the process of Evolution are that, THE ALL, having meditated upon the beginning of the Creation--having thus established the material foundations of the Universe--having thought it into existence--then gradually awakens or rouses from its Meditation and in so doing starts into manifestation the process of Evolution, on the material mental and spiritual planes, successively and in order.\n\nThus the upward movement begins--and all begins to move Spiritward.\n\nMatter becomes less gross; the Units spring into being; the combinations begin to form; Life appears and manifests in higher and higher forms; and Mind becomes more and more in evidence--the vibrations constantly becoming higher.\n\nIn short, the entire process of Evolution, in all of its phases, begins, and proceeds according to the established \"Laws of the Indrawing\" process.\n\nAll of this occupies aeons upon aeons of Man's time, each aeon containing countless millions of years, but yet the Illumined inform us that the entire creation, including Involution and Evolution, of an Universe, is but \"as the twinkle of the eye\" to THE ALL.\n\nAt the end of countless cycles of aeons of time, THE ALL withdraws its Attention--its Contemplation and Meditation--of the Universe, for the Great Work is finished--and All is withdrawn into THE ALL from which it emerged.\n\nBut Mystery of Mysteries--the Spirit of each soul is not annihilated, but is infinitely expanded--the Created and the Creator are merged.\n\nSuch is the report of the Illumined!\n\nThe above illustration of the \"meditation,\" and subsequent \"awakening from meditation,\" of THE ALL, is of course but an attempt of the teachers to describe the Infinite process by a finite example.\n\nAnd, yet: \"As Below, so Above.\" The difference is merely in degree."


[content]
body = "Taken separately, any of the incidents in this strange eventful history can be explained away, but taken together they make a curious story, especially when it is remembered that without any previous information a psychic investigation had “spotted” the existence of a person with abnormal faculties who was interested in Mr.\n\nC.\n\nCancer is a disease upon which certain occult hypotheses throw a good deal of light.\n\nIt is believed to be a disease of the etheric double, not of the physical body, and that a “Cancer Elemental” is the infective factor.\n\nTo prove or disprove anything concerning the foregoing story is impossible, but the following occult hypothesis may explain much.\n\nIf this hypothesis be not accepted, readers may find an interesting exercise for their ingenuity in constructing another that shall explain more satisfactorily the circumstances of the case.\n\nMiss X.\n\nretained subconsciously the knowledge and powers that had been hers during the previous life when she was implicated in the witch-cult.\n\nShe also retained her passion for Mr.\n\nC., a passion which was obviously unrequited, She employed her power of projection of the astral body to visit Mr.\n\nC.\n\nat night, during sleep.\n\nIn the absence of details it is impossible to decide definitely whether the “fit” of Mr.\n\nC.\n\nwas a struggle or an embrace.\n\nIt might be either, or it might be both, an initial struggle ending in an embrace.\n\nThe dreams of Mrs.\n\nC.\n\nobviously related to the same astral visitant who caused the seizures of Mr.\n\nC.\n\nThere is, unfortunately, no record to show at what phase of the moon these attacks took place, but presumably at the Hecate phase, which is the period of evil witchcraft.\n\nThe condition of Miss Xs fiancé and aunt and the death of her first lover point markedly towards vampirism.\n\nIt is difficult to believe that a consumptive would continue for so many years without his disease either being checked or making definite progress.\n\nIt is difficult to say what the connection, if any, might be between Miss X.\n\nand the death of her sister’s lover, but it is a curious thing that three men, associated with this ill-omened household as prospective husbands, should lose their lives in the same way.\n\nThis, together with the mysterious illness of the aunt, are very suspicious.\n\nAs noted before, any one of these incidents could be explained away, but taken together they call for thought.\n\nIt is also curious that Miss X.\n\nshould keep her fiancé in her house and yet not marry him, from every normal point of view an arrangement with many drawbacks and no advantages.\n\nOn the other hand, if her feelings were fixed upon Mr.\n\nC.\n\nand were obtaining satisfaction by astral visits, she would naturally not want to break her rapport with the man she loved by giving herself to the man she did not love.\n\nIf she were a vampire, her motive for keeping the aunt and lover in her house, and their condition, would be readily explained.\n\nAlso her breakdown, which followed immediately upon their deaths.\n\nThe fact that Mr.\n\nCS first wife died of cancer of the womb does not in itself call for remark, but it is a curious thing that he should lose his second wife from the same disease.\n\nCancer is not as common as all that, and in any case, there are many available sites beside the womb.\n\nOn the other hand, Diana, one of the aspects of Luna, of whom Hecate, the goddess of witches, was another, presides over the female reproductive organs.\n\nThe illness of Mrs.\n\nC.\n\nbegan to show itself soon after Miss X.\n\nwas excluded from the house.\n\nFinally, what shall we say concerning the deaths of the three people most intimately associated with Miss X.\n\nwithin a short time of each other, and her immediate break down?"


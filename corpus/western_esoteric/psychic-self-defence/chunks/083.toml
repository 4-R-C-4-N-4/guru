[content]
body = "The curser declares, “I curse you by so and so.” This is the form of evocation which calls the ensouling essence into the thought- form, thus making an artificial elemental which is endowed with an independent life of its own.\n\nIf we want to know something of the efficacy of curses, we have only to consider the record of the men who were connected with the opening of the famous Tut-ankh-amen tomb.\n\nThere are many other cases equally well authenticated.\n\nOne can become exposed to occult unpleasantness either by thwarting or in some other way falling foul of an un scrupulous occultist, or by getting oneself involved with a dubious occult fraternity.\n\nIn the case of a quarrel with an occultist, in addition to the ordinary human motives for an abuse of power, one has to reckon with the fact that an adept who is not of the whitest nearly always suffers from that unpleasant psychic disease of “hypertrophied ego.” He will love power for its own sake, and take any defection on the part of an erstwhile follower, or any resistance to his imperious will as a personal insult or even injury.\n\nWith a trained mind, an angry thought will do damage, and I have known cases of occultists who, out of pure pique, went to extraordinary lengths of spite.\n\nOne can only hope that they did not really believe in the efficacy of what they did, and were merely playing to the gallery “pour encourager les autres” and ensure loyalty among their supporters.\n\nAnother thing which is particularly disliked by this type of adept is any attempt on the part of a pupil who has broken with him to make use of what he has been taught.\n\nThere seem to be no lengths to which a jealous guru will not go in order to smash his chela psychically.\n\nIn one case which came to my knowledge a concert singer had had “treatment” for the improvement of her voice from an adept of sorts.\n\nShe finally decided that she would spend no more money on this enterprise, and told him so at the visit which she had decided should be the last.\n\nHe concentrated his gaze upon her and told her that if she broke with him, as soon as she went on the concert platform she would see his face in the air in front of her, and her throat would close and she would be unable to utter a sound, and that this horrible experience would occur every time she tried to sing until she returned to him and continued to have “treatment” (at a guinea a time).\n\nThis potent hypnotic suggestion proved effective, and her career was at an end until the spell was broken.\n\nThe following letter contains a very illuminating experience, and is of value, not only for its account of a psychic attack, but also for its description of the manner in which the attack was combated.\n\n“In the winter of 1921-2 I was told (from the Inner Planes), ‘We see your initiation into the Order of the Christ.’ I did not understand very clearly and I waited.\n\n“In June, 1922, an Oriental, the head of a great religious Order, came to see me.\n\n(I was living in Switzerland.) We will call him Z.\n\nI expected great things from him and looked on him as a sort of Master.\n\nKnowing that he had met Abdul Baha, I thought to please him by putting A.\n\nB.’s photo on my walls, but when Z.\n\nentered my room I saw at once that he did not quite like it.\n\nWe conversed for a while and he asked me several questions.\n\nSuddenly he offered me initiation into his Order.\n\nI was taken aback and did not feel the inner consent.\n\nI said I must reflect."


[content]
body = "I smashed my way through two entire tea-sets and all the mantelpiece ornaments.\n\nThe ornaments just fell off the mantelpiece one by one of their own accord.\n\nI actually saw two of them do it.\n\nI did not know at the time that the Element of Air had this sinister reputation.\n\nI realised that something queer was afoot, however, and asked my teacher about it.\n\nShe was much amused, but I was not, because it was my crockery that was supplying the raw material for the phenomena.\n\nShe advised me to get into sympathetic touch with the Sylphs, as the initiation had evidently not been altogether successful.\n\nI tried to do this, but I was in London at the time and met with no success, for the elemental contacts, with the exception of Fire, cannot be worked successfully in a city.\n\nThe smashing went on, and I was reduced to a tin mug and a tooth-glass, for I saw it was useless to get any more china until things had settled down.\n\nThen I went away for my summer holiday and found myself on the summit of a high and isolated hill on a day of bright sun and high wind.\n\nI was very conscious of the nearness of the elemental kingdoms.\n\nThe air seemed full of silver sparkles, which is always a sign that the veil is thin.\n\nThere was no one present save some friends who were sympathetic.\n\nI faced into the wind and raised my arms in Invocation.\n\nSuddenly we saw below us a figure bursting through hedges and leaping ditches and running wildly towards it.\n\nWe presently recognised it as another of our friends, and when he joined us he told us that he had felt the sudden rush of power while in the valley and on an over powering impulse started for the hill-top.\n\nThen all of us, without any suggestion of leadership, began the Dance of the Elements, whirling like dancing dervishes upon that hill-top.\n\nFortunately nobody was about, but I do not know that it would have made very much difference if they had been, for we were caught up out of ourselves and the air seemed full of rushing golden flames, lying level in the wind.\n\nFor days afterwards we seemed charged with elemental energy by that extraordinary dance.\n\nIt may be interesting to note that we danced with a circular movement, each revolving on our own axis at the same time, and that we both danced and revolved deosil, that is, with the sun.\n\nAll this occurred spontaneously, the tide of the elements catching us up and away.\n\nI have never known a more glorious experience.\n\nIt was indeed the divine inebriation of the Mysteries.\n\nAfter this there were no more smashings of crockery.\n\nI have already noted my exceptionally bad head for heights.\n\nI have found that it is considerably mitigated, temporarily at any rate, by the Invocation of Air.\n\nI am of the opinion that the curious impulse which causes people for no reason whatsoever to commit suicide by throwing themselves from heights may be due to the same impulse that causes people who are obsessed by the Element of Water to swim out to sea, as I have recorded of Swinburne.\n\nThese apparently causeless suicides by Water and Air are, in my opinion, a form of union with the god which is one of the ideas underlying human sacrifice.\n\nThere are two types of human sacrifice, the willing and the unwilling.\n\nThe unwilling sacrifice, the prisoner struggling or drugged into passivity, is used, not to propitiate the god, as is usually thought, but in order that his vital forces may serve as a basis of manifestation.\n\nThe willing sacrifice, in which the victim will be either a priest or a devotee of the god, has for its motive the idea of divine union, not altogether unknown to Christian mystics, who seek its achievement by a living death, whereas the adherents of Juggernaut escape with one brief pang."


[content]
body = "In the absence of details any conclusion must be guesswork, but we have good grounds for supposing that Miss Xs magical operations were attended by some mishap.\n\nIt may be said that such a theory is the wildest improbability and does violence to all the laws of evidence.\n\nLet it, however, be born in mind that two years before these matters eventuated, the work of a witch in connection with Mr.\n\nCS epileptiform attacks was suspected and the nature of her relationship to him was indicated; and subsequent enquiries revealed the curious facts in connection with Miss Xs history and menage; let it also be noted that the happenings which subsequently occurred are such as have been recorded in many accounts of witch-trials.\n\nIt is a scientific maxim that the power to foretell the course of phenomena is a good indication of the truth of a theory."


[content]
body = "BEFORE we can leave the subject of attack by incarnate human beings, we must consider the subject of etheric projection.\n\nIn this case not only is the mind at work, but also something which is pretty nearly physical; sufficiently physical, at any rate, to leave bruises on the flesh of the victim, throw the furniture about, or at least make a considerable amount of noise.\n\nWhere such manifestations take place, it is obvious that we are dealing with something more substantial than the mind, for although mind can influence mind, and through it the body to an extent to which in the present state of our knowledge it is difficult to set limits, mind cannot manipulate matter directly: that is to say, you cannot smash a window by means of a thought.\n\nThere must be some physical vehicle that can be manipulated by the mind if effects are to be wrought on the physical plane.\n\nThe living body is such an instrument; it is manipulated by the mind every time a voluntary movement takes place, and the operations of spiritual healing are simply an extension of this principle to the involuntary muscles and physiological processes not ordinarily directed by the conscious mind.\n\nOccultists maintain that mind affects body by means of the etheric double, as it is called, the “mortal mind” of the Christian Scientists.\n\nWe may not unreasonably conclude that when physical action is produced at a distance by occult means, it is done by employing this etheric double.\n\nThe etheric double is primarily a body of magnetic stresses in the framework of whose meshes every cell and fibre of the physical body is held as in a rack.\n\nBut intermediate between this and the dense physical body as we know it, there is what may be called the raw material out of which dense matter is condensed.\n\nThis was called by the ancients, Hyle, or First Matter, and by the moderns, Ectoplasm.\n\nIt is this projected ectoplasm which produces the phenomena whenever physical manifestations are in question.\n\nIt may be projected as long rods, which will operate up to a distance of a dozen feet or so; or it may be projected as a nebulous cloud, connected with the medium by a tenuous thread.\n\nThis cloud can be organised into distinct forms, having the semblance of life and acting as vehicles for conscious wills.\n\nThere is a great deal of information available on this subject in the literature of spiritualism, to which reference may be found in the bibliography at the end of this book.\n\nThe adept who was head of the occult college to which I have previously referred, and from whom I received my first training in occultism, was able to perform this operation, and I have many times seen him do it.\n\nHe would go into deep trance, after a few convulsive movements, somewhat like a slow tetany, and would then lose about two-thirds of his weight.\n\nI have many times helped to lift him, or even lifted him single-handed, when he was in this state, and he weighed no more than a child.\n\nA man can fake many things, but he cannot fake his weight.\n\nI have lifted him single handed from the floor on to a sofa when in this state.\n\nIt is quite true that, being rigid as a board, he was much easier to handle than the ordinary limp, unconscious human form; but there is a certain ratio between the weight of a grown man and the strength of a woman of average physique.\n\nWhat became of the missing weight on these occasions I found out one night.\n\nHe had been ill, with some delirium, and the lion’s share of the nursing, especially the night work, had fallen to my lot.\n\nThere came a time, however, when we decided that he was so far recovered that it was unnecessary for anyone to sit up with him, so to bed we all went, for the first time for several days.\n\nI shared a room with another member of the community."


[content]
body = "Great power-tides are flowing on the Inner Planes, and these are very difficult to handle.\n\nIf there is going to be astral trouble, it usually blows up for storm at this season.\n\nThere are also certain meetings which take place on the Astral Plane, and many occultists attend them out of the body.\n\nIn order to do this, one has to throw one self into a trance and then the mind is free to travel.\n\nIt is usual to get someone who understands these methods of work to watch beside the body while it is vacated to see that it comes to no harm.\n\nIn the ordinary way, when an occult attack is afoot, one clings to waking consciousness at all costs, sleeping by day and keeping awake and meditating while the sun is below the horizon.\n\nAs ill-luck would have it, however, I was obliged to make one of these astral journeys at this season.\n\nMy attacker knew this as well as I did.\n\nI therefore made my preparations with all the precautions I could think of; gathered together a carefully chosen group to form the watching circle, and sealed up the place of operation with the usual ceremonial.\n\nI had not much faith in this operation under the circumstances, for my attacker was of much higher grade than I was, and could come through any seals I might set.\n\nHowever, it afforded protection against minor unpleasantness.\n\nThe method of making these astral journeys is highly technical, and I cannot enter upon it here.\n\nIn the language of psychology, it is auto-hypnosis by means of a symbol.\n\nThe symbol acts as a door to the Unseen.\n\nAccording to the symbol chosen will be the section of the Unseen to which access is obtained.\n\nThe trained initiate, therefore, does not wander on the astral like an uneasy ghost, but comes and goes by well-known corridors.\n\nMy enemy’s task was therefore not a difficult one; for she knew about the time I must make this journey and the symbol I must use in order to get out of the body.\n\nI was therefore prepared for opposition, though I did not know what form it would take.\n\nThese astral journeys are really lucid dreams in which one retains all one’s faculties of choice, will-power and judgment.\n\nMine always begin with a curtain of the symbolic colour through whose folds I pass.\n\nNo sooner was I through the curtain on this occasion than I saw my enemy waiting for me, or, if another terminology is preferred, I began to dream about her.\n\nShe appeared to me in the full robes of her grade, which were very magnificent, and barred my entry, telling me that by virtue of her authority she forbade me to make use of these astral pathways.\n\nI replied that I did not admit her right to close the astral paths to me because she was person ally offended, and that I appealed to the Inner Chiefs, to whom both she and I were responsible.\n\nThen ensued a battle of wills in which I experienced the sensation of being whirled through the air and falling from a great height and found myself back in my body.\n\nBut my body was not where I had left it, but in a heap in the far corner of the room, which looked as if it had been bombed.\n\nBy means of the well- known phenomenon of repercussion the astral struggle had apparently communicated itself to the body, which had somersaulted round the room while an agitated group had rescued the furniture from its path.\n\nI was somewhat shaken by this experience, which had not been a pleasant one.\n\nI recognised that I had had the worst of it and had been effectually ejected from the astral paths; but I also realised that if I accepted this defeat my occult career was at an end."


[content]
body = "I cannot here enter into either the precautions to be taken against untoward happenings in practical occult work, nor the remedies to apply if they take place; I will merely indicate the signs by which such an eventuality may be recognised.\n\nThis is all that can be done, and all that is necessary in a book of this type; the initiate knows what to do without need of guidance from me; the non-initiate cannot do anything, and must seek assistance.\n\nIt is enough for him if he knows when such assistance is needed.\n\nIf things go wrong in the course of a magical ceremonial, the power “shorts,” and someone, it may be the operator, or it may be the weakest person in the team, gets ” knocked out ” as if he had received a punch from an invisible pugilist.\n\nWhen picked up, he will be very dazed and badly shaken, and will certainly be some days, possibly weeks, before he gets over it.\n\nHe will be in a state of complete prostration and considerable mental confusion, which will gradually wear off.\n\nUnless there is some organic defect, such as hereditary mental instability, a bad heart, or hardened arteries, there will be a complete recovery, given time; but naturally it is a bad outlook should one of these conditions be present, and those who have them should not take part in occult experiments.\n\nPersonally, I do not believe that the invisible forces alone will ever actually cause the loss of life or permanent disability in the absence of any physical lesion.\n\nThe person who goes out of his mind as the result of a psychic shock would have gone out of his mind if he had been in a railway disaster or any other drastic emotional experience.\n\nUnless the psychic atmosphere indicates otherwise, it is not necessary to do any banishings, or take precautions against obsession, because the power has dispersed itself in the very act of inflicting the shock.\n\nDuring my early days of occultism I developed my powers very rapidly because I recovered the memories of previous incarnations en bloc, and with them the capacities acquired in previous lives, and I shook myself up severely on numerous occasions before I learnt the technique of handling the invisible forces.\n\nI never experienced any permanent ill-effects from my mishaps, though I admit that upon occasion I have been extricated by my friends from a considerable amount of debris.\n\nDuring the early days of my occult career a girl was brought to me by a mutual friend, who told me that the mother of this girl, an ardent student of occultism, seemed to have a terrible effect upon her daughter.\n\nThe mother was a widow, and mother and daughter lived together under very comfortable material circumstances; but whenever the girl made a friend, or showed any desire to leave home, the mother performed extraordinary antics, coming to the daughter’s room at night and drawing signs in the air about her bed.\n\nThe effect of all this upon the girl was most peculiar.\n\nShe felt unable to free herself from the mental domination the mother had obtained over her, and she was wasting away in a most curious fashion.\n\nWhen I saw her, although able to get about, she looked like nothing I have ever seen save a famine victim.\n\nI made a psychic investigation, and formed the opinion that the mother was working by means of an entity of which she had obtained possession.\n\nHow this had been accomplished in the present instance, I do not know, but such things are common in occultism.\n\nI determined to take on the case, and to chase and, if possible, break up this artificial elemental.\n\nI was away from the group I was accustomed to work with, but among people keenly interested in occultism of every sort, size and description, and I had no difficulty in picking up a team to help me with the undertaking.\n\nI had no qualms about the undertaking.\n\nA second-hand elemental, directed by a woman with only a rule-of-thumb knowledge of magic, did not appear to me to be a formidable opponent."


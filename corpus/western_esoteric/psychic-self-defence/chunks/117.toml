[content]
body = "Having discerned the type of the force with which he has to deal, he then proceeds to meditate upon its opposite, concentrating upon purity and selflessness if the force be lust; compassion and love, if it be malice; and upon God as the creator and sustainer of all life if it be vampiric.\n\nHe continues this meditation until he feels himself suffused with the quality upon which he is meditating; until he feels himself so imbued with purity and selflessness that lust causes him to feel nothing but pity, malice causes him to feel nothing but compassion, and in regard to vampirism, he is so assured that his life is hid with Christ in God that he would willingly let the vampire finish its meal in peace if he could thereby help it.\n\nIn fact, the adept who proposes to perform a magical absorption has to reach the point where he has clearly realised the nothingness of the evil he proposes to absorb, and no longer has any feeling towards it but pity for an ignorance that thinks it can gain any good thing for itself in this way.\n\nHe desires to uplift and educate and free the misguided soul from its bondage.\n\nUntil he has arrived at the point when he has no other feeling than this towards his persecutor, it is not safe for him to attempt an absorption.\n\nHaving satisfied himself that he is ready for the attempt, he proceeds to draw the thought-form towards him by pulling in the silver cord that connects it with his solar plexus if it be a vampiric thought-form, or by opening his aura to it and enfolding it if it be one of the other two types.\n\nHe literally sucks it in.\n\nThis process should be done slowly and gradually, taking some minutes in the doing.\n\nIf it be done suddenly, the adept may not find it possible to keep his own vibrations steady, and then he will indeed be in an unpleasant situation.\n\nAs the thought-form is absorbed, the adept will feel a reaction in his own nature corresponding to the type of the thought-form.\n\nIf it is a lust-force, he will feel desire rise within him; if it is a malicious force, he will feel anger; and if it is a vampire, he will feel blood-lust.\n\nHe must immediately overcome this feeling and revert to his mediation upon the opposite quality, maintaining it until his vibrations are once more fully harmonised.\n\nHe will then know that the evil force has been neutralised and there is that much less evil in the world.\n\nHe will immediately feel a great access of vigour and a sense of spiritual power, as if he could say to a mountain, “Be ye cast into the sea,” and it would be done.\n\nIt is this sense of spiritual exaltation and power which tells him that the work has been successfully accomplished.\n\nIt is, however, advisable to repeat the meditation at intervals for two or three days in case another thought-form is formulated and sent after the first.\n\nAs for the sender of the thought-form, when the absorption takes place he will feel that “virtue has gone out of him,” and may even be reduced temporarily to a state of semi- collapse.\n\nHe will soon revive, however, but with his power for evil of this particular type considerably reduced for some time to come; and if he have the possibility of reform in his nature, it may even be that he himself will be permanently freed from this type of evil.\n\nThe great advantage of this method is that it actually destroys the evil, root and branch; whereas the mere destruction of a thought-form is like cutting off the top of a weed.\n\nOn the other hand, it can only be done by an advanced occultist keyed up to the highest pitch.\n\nIf one is disturbed or harassed or has in any degree lost his nerve, one dare not attempt it."


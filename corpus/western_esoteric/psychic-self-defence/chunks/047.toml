[content]
body = "THERE are other forms of life as well as ours whose sphere of evolution impinges upon the earth.\n\nIn the realm of folk-lore we constantly meet with the idea of intercourse between the human and the fairy kingdoms; of the marriage of a human being with a fairy spouse, or the theft of a child by the fairies, an impish changeling being left in its place.\n\nWe shall be rash if we assume that an extensive body of folk-belief is entirely without foundation in fact.\n\nLet us therefore examine these old and crude beliefs and see whether we can find any grounds for them, and if so, what the real nature of the facts may be, and whether they throw any light upon modem psychic phenomena of the kind we are considering in these pages.\n\nThere are many of us who have met people who might well be described as non-human, soulless, in that the ordinary human motives are not operative with them, nor do the ordinary human feelings prompt or inhibit them.\n\nWe cannot but love them, for they have great charm, but we cannot but dread them as well, for they spread an infinitude of suffering around them.\n\nAlthough seldom deliberately evil, they are singularly detrimental to all with whom they come in contact.\n\nThey, for their part, are unhappy and lonely in our midst.\n\nThey feel themselves to be alien and uncompanioned; every man’s hand is against them, and in consequence it all too often happens that their hand is against everyone and they develop a puckish malevolence, though there is seldom calculated evil-doing.\n\nGratitude, compassion, good faith, morality and common honesty are utterly foreign to their natures, as far beyond their conception as the differential calculus.\n\nThey are not immoral, however, but simply non-moral.\n\nOn the other hand, they possess the virtues of absolute sincerity and great courage.\n\nIn terms of human ethics they are “undesirables,” but they have an ethic of their own to which they are loyal, and that is the beauty which is truth, and this is all they know, and, as far as their life is concerned, all they need to know.\n\nIn appearance they are usually small and slight, possessing unusual physical strength and endurance but very liable to nervous exhaustion and brain-storms.\n\nIn social relations they take violent likes and dislikes; they show a facile and demonstrative affection towards those they like, but quickly forget them.\n\nGratitude and pity are unknown to their nature.\n\nTowards those they dislike they are pettily malicious, and in all relations of life they are utterly irresponsible.\n\nOne cannot describe them better than to say that they resemble nothing so much as a blend of Persian kitten and pet monkey.\n\nThey have the beauty and aloofness and charm of the cat, and the amusing, mischievous destructiveness of the monkey.\n\nMany human beings hate them at sight; others are fascinated by them because they bring with them a sense of unearthly beauty and a quickening of the life-forces.\n\nI have been able to investigate the history of two such beings, and it is interesting to note that both of them were conceived while their mothers were under the influence of drink.\n\nThere is a very great deal of information available concerning the occult aspect of the incarnation of souls, but not much of the knowledge concerning the actual facts of conception has ever found its way into print.\n\nI have given a little in my book, The Esoteric Philosophy of Love and Marriage.\n\nI cannot enter into the subject deeply in these pages, for it would be too much of a digression.\n\nSome points, however, it is essential to touch upon for a comprehensive survey of our subject.\n\nAt the moment of sexual union a psychic vortex is formed resembling a waterspout, a funnel-shaped swirling that towers up into other dimension.\n\nAs body after body engages, the vortex goes up the planes."


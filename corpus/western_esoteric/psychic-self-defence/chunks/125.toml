body = "At his request she wrote to me to enquire how I was faring, but mentioned no names, and I, not realising the significance of the incident, returned a non-committal answer.\n\nHe heard my story and told me to leave the matter in his hands, which I did.\n\nThis is a queer enough story of coincidence, but the sequel is even queerer.\n\nAfter leaving Colonel Y., I enquired once more of the Unseen whether I should take any further steps.\n\nThe reply came through that for the present I was to do nothing, but that I would be told when further action was to be taken.\n\nI learnt afterwards that X.\n\nhad left the country a few days after my interview with Colonel Y.\n\nNothing happened for about five months, and then one evening when I was sitting over my fire in the dusk I distinctly heard the Inner Voice telling me that now was the time to make a move in the matter of X., and that I was to go to Mr.\n\nZ.\n\nand tell my story.\n\nNow Mr.\n\nZ.\n\nwas a very eminent person indeed, whom I knew of as being an advanced occultist, but whom I had never met.\n\nI replied to the interior voice that for me to approach Mr.\n\nZ.\n\nwas impossible, I should merely be shown the door, and that unless they could open up the way from their end, I did not see how it was to be done.\n\nThe answer came through very clearly that the way would be made plain.\n\nAnd it was.\n\nA couple of days later a visitor was announced, an old friend whom I only saw occasionally, and after the usual greetings and exchange of news, he said, “I should very much like you to meet a friend of mine who I think would be interested in your work.\n\nMay I take you to see him?\n\nHis name is Mr.\n\nZ.” Needless to say I agreed.\n\nWhen I came to the appointed meeting, I said to Mr.\n\nZ., after I had been introduced, “ I have got a message for you,” thinking I might as well be hung for a sheep as a lamb.\n\nHe listened attentively, and when I mentioned the name of the Indian, my friend who was present, exclaimed, “It is a curious thing that you should be moving in this matter at the present moment.\n\nX.\n\nlanded in England a couple of days ago.” It will be noted that as soon as X.\n\nleft England, I was instructed to hold my hand, and as soon as he returned after an absence of five months, I was instructed to commence action again.\n\nUnless we are prepared to pull the long arm of coincidence clean out of its socket, we must conclude that some directing intelligence was at work.\n\nThis is but one among many instances in my experience.\n\nLimitations of space forbid me to mention any more.\n\nIn addition to the Occult Police, who function solely on the Inner Planes, there also exist certain groups of occultists who have banded themselves together for the purpose of combating Black Occultism.\n\nI suppose they give themselves different names, but I do not know what these are; I have always heard them referred to generically as the Hunting Lodges.\n\nUpon various occasions I have skirmished on their flanks and looked on at some lively forays.\n\nI imagine them to be organised in conjunction with the Occult Police, and they certainly possess means of obtaining information which point to co-operation from the Inner Planes.\n\nThey appear to possess alliances in unexpected quarters and to be able to pull a remarkable number of strings.\n\nWhat psychic weapons they use I do not know, but upon the physical plane they appear to rely largely upon newspaper exposes, and upon keeping undesirables on the move, never allowing them to settle down and organise.\n\nKnowing what I do of their methods, I have from time to time recognised their sign-manual in various transactions for which decent citizens have every reason to be grateful."


[content]
body = "We compared notes, and found we had all, some six or seven of us, had similar nightmares, and proceeded to exchange experiences.\n\nThe effect of this upon Miss L.\n\nwas curious.\n\nShe squirmed upon her chair as if it had suddenly become red-hot and said with much emphasis: “These things should not be discussed, it is most unwholesome.” Out of deference to her feelings we desisted.\n\nBut presently up to the open window came another member of our community, a woman who slept in an open-air shelter at some little distance from the house.\n\nWe enquired after her health, as usual, and she replied that she was not feeling very well, as she had slept badly, and proceeded to recount the same nightmare as the rest of us.\n\nLater on in the morning, another lady, who had a house a little way down the road, arrived, and she in her turn told of a similar nightmare.\n\nThese nightmares continued, on and off for the next few days, to afflict different members of the community.\n\nThey were vague and nebulous, and there was nothing we could pitch upon for diagnostic purposes, and we put it down to indigestion caused by the village baker’s version of war bread.\n\nThen one day I had a quarrel with Miss L.\n\nShe had conceived a “crush” for me; I have a constitutional repulsion for crushes and give them scant politeness, and she complained bitterly of my lack of responsiveness.\n\nWhat ever may be the rights and wrongs of the case, I had roused her resentment in good earnest.\n\nThat night I was afflicted with the most violent nightmare I have ever had in my life, waking from sleep with the terrible sense of oppression on my chest, as if someone were holding me down, or lying upon me.\n\nI saw distinctly the head of Miss L., reduced to the size of an orange, floating in the air at the foot of my bed, and snapping its teeth at me.\n\nIt was the most malignant thing I have ever seen.\n\nStill not attaching any psychic significance to my experiences, and being firmly convinced that the local baker was responsible, I told no one of my dream, thinking it one of those things that are better kept to oneself; but when the members of the community came to talk matters over in the light of subsequent events, we found that two other people had had similar experiences.\n\nA night or two later, however, as it came to bed-time, I was overcome with a sense of impending evil, as if something dangerous were lurking in the bushes around the house threatening attack.\n\nSo strong was this sensation that I came down from my room and went all round the house, testing the catches of the windows to make sure that all was secure.\n\nMiss L.\n\nheard me, and called out to know what I was doing.\n\nI told her of my feelings.\n\n“You silly child,” she said, “it is no use latching the windows, the danger is not outside the house but in it.\n\nGo to bed, and be sure and lock your door.” She would give no answer to my questions except to reiterate that I should lock my door.\n\nThis was the first night I had slept in that house, previously having been in a cottage on the opposite side of the road.\n\nI did not lock my door because the night was intolerably hot and the room and the window small.\n\nI compromised, however, by putting an enamel slop-pail at a strategic spot in the fairway, trusting that any intruder would fall over it and give the alarm.\n\nNothing happened, and I slept quietly.\n\nNext morning, however, the storm broke.\n\nMiss L.\n\nand I were peacefully at work in the kitchen when she suddenly caught up a carving-knife and started after me, as mad as a March hare."


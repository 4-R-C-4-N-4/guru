[content]
body = "Hypnotic suggestion (which means, literally, suggestion made during sleep, and is to some extent a misnomer) is of three kinds: firstly, true hypnotic suggestion, made when the subject has been rendered insensible by magnetic passes or fixation of the eyes on a bright object; secondly, suggestion given during normal sleep, as Coue advises should be done with children, in my opinion a most undesirable proceeding; and, thirdly, telepathic suggestion.\n\nAll these modes of suggestion enter the mind behind the censor; that is to say, they are independent of consciousness, which is neither asked to co-operate, nor has the power to inhibit them.\n\nIn most cases, suggestions made in this way are never recognised as coming from outside, but are only discovered after they have matured in the subconsciousness and are beginning to take effect.\n\nWe do not see the invisible seed, that has been sown in our mind by the mind of another, but in due course germination takes place and the strong-growing shoot appears above the threshold of consciousness as if it were a native growth.\n\nThe skillful suggestionist always aims at making his suggestions harmonise with the bias of the personality; for if they do not, the established sub-conscious complexes will expel them before they have time to strike root.\n\nAll he can really do is to reinforce and stimulate the ideas and impulses that are already there, though perhaps latent.\n\nHe cannot plant an entirely alien seed.\n\nHe cannot graft a rose-shoot on a lilac bush, for it will merely wither and die.\n\nFor growth of the thought-seeds of suggestion to take place they must find a congenial soil.\n\nIt is herein lies the strength of the defence.\n\nWe may not be able to prevent the minds of others from sending us suggestions, but we may so purify the soil of our own natures that no harmful ones can find a congenial seed-bed.\n\nIt is a simple matter to pull up a seedling nettle, but it is quite a different business to eradicate a thickset bank of tangled roots and stinging shoots, many years old.\n\nIt has been said, and not untruly, that a person cannot be hypnotised into doing anything which is contrary to his real nature.\n\nBut what is the real nature of each one of us?\n\nHave we all overcome the ape and tiger, or are they merely caged?\n\nSuggestion can unbar the cage of all our secret temptations and let them loose upon us.\n\nNone but the saint is naturally immune.\n\nIt is possible to reduce anybody to anything provided suggestion has unchecked scope for a sufficient length of time.\n\nThe purest woman can be made a harlot, the noblest man a murderer under certain conditions.\n\nKnowledge is necessary to protect, and it is that knowledge which I intend to give in these pages.\n\nLet us now consider exactly how a psychic attack operates.\n\nIn the realms of mind there is neither time nor space as we understand them.\n\nI do not propose to argue this statement philosophically, but state it as a fact of experience which anyone who is accustomed to operating on the Inner Planes will have shared.\n\nIf we think of a person, we are in touch with that person.\n\nIf we picture them clearly, it is as if we were face to face with them.\n\nIf we picture them vaguely, it is as if we saw them in the distance.\n\nBeing in the mental vicinity of a person, we can create a thought- atmosphere by dwelling upon certain ideas in connection with him.\n\nThis is how spiritual healing is done.\n\nThe affirmations of Christian Science are used in order to get the mind of the healer into a certain emotional state, and his condition effectually influences the mind of the patient with whom he has put himself en rapport."


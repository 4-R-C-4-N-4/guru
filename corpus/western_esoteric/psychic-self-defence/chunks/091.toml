[content]
body = "IT is a matter of general knowledge among occultists that it is not a pleasant thing to fall foul of an occult fraternity of which one has been made a member by means of a ceremonial initiation and to which one is bound by oaths.\n\nAs we have already seen, the malignant mind of a trained occultist is a nasty weapon; how much more so the group-mind formed out of a number of trained minds, especially if concentrated by means of ritual?\n\nBut in addition to the individual mental force of the members of a fraternity, and in addition to the collective force of its group-mind, there is another factor to be reckoned with when a genuine occult organisation is concerned in operations of either protection or destruction.\n\nEvery occult organisation depends for Its power to initiate upon what are called its “contacts,” that is to say, upon one or more of its leaders being psychically in touch with certain forces.\n\nIf, in addition to this, the organisation has a long line of tradition behind it, a very potent collection of thought-forms will be built up in its atmosphere.\n\nEvery initiation ceremony contains in some form or other the Oath of the Mysteries, which binds the candidate neither to reveal the secrets of the Mysteries nor to abuse the knowledge they bestow.\n\nThis oath always contains a Penalty Clause and an Invocation wherein the candidate submits himself to a penalty in the event of a breach of faith, and calls upon some Being to exact the penalty.\n\nSome of these oaths are most formidable affairs, and they are administered with every circumstance of solemnity that stage management can devise.\n\nThe way in which the occult fraternities have succeeded in preserving their secrets shows how seldom these oaths are broken.\n\nIn the event of a dispute with an occult fraternity, the force invoked in this oath may come into action automatically.\n\nIf the recalcitrant brother is in the spirit of the tradition and it is his chiefs who are at fault, the power invoked in the oath will be a potent protective influence with which the chiefs themselves will collide.\n\nIf, on the other hand, he breaks faith with the Mysteries, this avenging punitive current will come into action although his defection may pass undiscovered.\n\nI was informed by an eye-witness of an incident which took place at an initiation, in which the candidate, a man to all appearances normal in every way, after taking the oath in the usual manner, suddenly screamed most terribly, startling everyone, and was ill for some weeks as if from a severe nervous shock, and never had anything more to do with occultism.\n\nNo explanation of the incident was ever forthcoming.\n\nI was present myself upon one occasion when a batch of three candidates was being “done,” and it was suddenly noticed in the course of the ceremony that the number of the candidates had become reduced to two.\n\nEnquiry elicited the fact that the third had taken fright and fled.\n\nWhat happened in these two cases, I do not know; whether there had been a breach of good faith, or whether one was intended, no one can say; but something put the fear of the Lord into these two individuals pretty effectually.\n\nThat no such shock is inherent in the ceremony is proved by the fact that these are the only two cases in my experience, and I have seen a very large number of ceremonies.\n\nPerson ally, when I took my own initiation I felt as if I had come into harbour after a stormy voyage.\n\nAnother man who was intimately known to me as an advanced occultist was turned out of the Order to which he belonged, why, I do not know, but from what I saw of him I should imagine there were plenty of reasons.\n\nIn defiance of his initiation oath he began to work an independent lodge.\n\nHe was warned to desist, and did so, dismantling his temple."


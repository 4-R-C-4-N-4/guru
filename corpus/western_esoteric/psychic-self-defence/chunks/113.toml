[content]
body = "It is necessary to reaffirm this circle each time the tides change; that is to say, a circle made after sundown will hold good till sunrise, and a circle made after sunrise will maintain its potency till sunset.\n\nAfter the circle has been affirmed a number of times in the same place its influence will persist for a considerable period, but it is advisable to re-formulate it morning and evening during the active phase of an attack.\n\nIncense burnt within the circle is very helpful, but care has to be exercised in the choice of an incense.\n\nJoss-sticks of unknown composition should never be used, as they are usually compounded with a view to assisting manifestation.\n\nGood quality church incense, such as can be bought at most church furnishers, is safe and satisfactory because it is compounded according to traditional recipes; cheaper qualities may not fulfill these conditions.\n\nIn dealing with elementals or non-human entities the Pentagram, or Pentalapha, is the best weapon.\n\nThis is a five-pointed star drawn in a particular way.\n\nPointing the first and second fingers of the right hand, and folding the others into the palm and touching their tips with the thumb, proceed to draw the Pentagram in the air, keeping the elbow stiff and swinging the arm at full length.\n\nStart with the right arm across the body, the hand about the level of the left hip, the extended fingers pointing downwards and outwards.\n\nSwing it upwards, as if drawing a straight line in the air, until the fingers point straight upwards above the head at arm’s length.\n\nNow sweep it down again, keeping the elbow stiff, until the hand occupies the corresponding position upon the right side to that from which it started on the left.\n\nYou have now drawn a gigantic V upside down.\n\nNext swing the hand across the body, on a rising incline, until it is stretched on a level with the left shoulder, pointing to the left.\n\nBring it across the body horizontally until it is in the same position on the right, fingers pointing away from the body.\n\nNow swing it downwards across the body till the hand has come back to the point by the left hip whence it started.\n\nThis is an exceedingly potent sign.\n\nThe value of the Five-pointed Star, the symbol of Humanity, is widely known among occultists, but its potency depends upon the manner in which it is drawn.\n\nThe method I have given is the correct one for banishing.\n\nThe potency of the sign may be illustrated by an experience of my own in using it, which the sceptical are at liberty to doubt if they wish; I merely mention it for the sake of those who may be interested.\n\nI was taking part in some work with an Indian occultist when I became suspicious that all was not as it should be, protested, and was asked to withdraw.\n\nI did so, determined to watch proceedings from a distance, and if my suspicions were confirmed, to have an expose.\n\nA few days later I was sitting in my room one afternoon chatting with a friend; it was just getting dusk, and we were talking by the light of a gas-fire.\n\nSuddenly we were both aware simultaneously of a presence in the room and turned spontaneously in the same direction.\n\nMy friend sensed an antagonistic presence, and I, being more psychic, saw who it was, and had no difficulty in perceiving the form of my Indian associate in an egg-shaped sphere of misty yellow light.\n\nI told my friend to quit the room and wait in the hall, and as soon as the door closed behind her, I made use of the Pentagram I have described, together with certain Names of Power that are unsuitable for disclosure in these pages.\n\nImmediately the appearance in the corner by the door shattered and vanished, at the same time there was a resounding crack, which my friend heard in the hall."


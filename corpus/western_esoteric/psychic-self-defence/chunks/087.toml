[content]
body = "According to the Qabalists, Lilith was the first wife of Adam, who used to visit him in his dreams while he was as yet alone in the Garden of Eden, and the Lord God became so perturbed at these goings-on that He created Eve as a counter- attraction.\n\nWitches were the recipients of similar attentions from the Devil.\n\nSt.\n\nTheresa of Avila records that the Godhead Itself visited her.\n\nThe Virgin Mary received the Holy Ghost.\n\nSt.\n\nAnthony was tempted by apparitions of beautiful female demons.\n\nThere are many cases on record of whole nunneries being attacked by the Devil, who visited their members.\n\nGeorge Moore, in his exceedingly interesting study of convent life, Sister Theresa, gives an account of an outbreak of “Counterparts” among the younger nuns, in which they formed liaisons with angelic lovers, who were supposed to be the souls of those who were drowned in the Flood.\n\nWe read in Genesis and in the Book of Enoch that the Sons of God mated with the daughters of men, and the demonic race was the result.\n\nThe folk-lore of every country contains instances of the mating of humans with elementals, usually with disastrous consequences.\n\nClassical literature is full of stories of the visits of gods and goddesses to human kind.\n\nWhat shall we say of all such stories?\n\nIs there any element in them beyond fairy-tale and wish-fulfilment?\n\nWe can readily understand the motive of the nun who, wishing to conceal the identity of her paramour, declares herself to be with child by the Devil.\n\nWe can equally understand the psychology of the rest of the convent that take up the story and see the Devil in every corner.\n\nLet me cite certain cases which have come within my personal knowledge and see whether in the light of these we can sift fact from phantasy.\n\nThere came to visit me once a young man who was in love with a married woman.\n\nHe told me that upon several occasions he had had a very vivid dream of visiting her, and she had simultaneously dreamed of receiving his visit.\n\nHe was anxious to perfect the technique of this operation, hence the visit to me.\n\nI am afraid I was unsympathetic, consequently I did not obtain any further information concerning this curious experiment.\n\nAn even more curious case came to my knowledge some years ago.\n\nA woman told me that in the days of her youth she had been engaged to marry a man to whom she was very deeply attached, and who was murdered while working as a missionary in West Africa.\n\nHaving lost the only man she felt she could love, she consented to marry a second cousin who had long been in love with her, and who was a semi-invalid.\n\nWhenever she had relations with her husband, she always visualised the form of her first lover.\n\nShe herself was short, dark and petite.\n\nHer husband, a blood relation, was similar in type to herself, and a weed into the bargain.\n\nBut her three sons were tall, upstanding blond men of the nordic type, bearing a strong resemblance to the dead man.\n\nThe truth of this story was vouched for to me by a friend of the family.\n\nI have know personally two alleged “changelings.” The male had the pointed ears of Pan, and if anyone was ever a son of the Devil, he was.\n\nThe female was a curious and fascinating creature, essentially non-human, and when her child was born it came into the world with no more trouble than a kitten.\n\nBoth these beings were conceived when their mothers were under the influence of drink, and both of them were characterised by a marked callousness, which in one case developed into deliberate cruelty.\n\nAlthough very peculiar to look at, neither of them was in the least defective, both being, in fact, possessed of considerably more than the average share of brains."


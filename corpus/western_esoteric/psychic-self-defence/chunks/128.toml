body = "In the preceding pages I have endeavoured to discharge a difficult task, one that it is almost impossible to discharge satisfactorily.\n\nLimitations of space prevent me from explaining my concepts step by step and offering proofs thereof.\n\nTo have done so would have required a library, not a book.\n\nI have had to presume in my readers not only an acquaintance with the literature of occultism but, what is much rarer, some experience of its practice.\n\nAt the same time I have endeavoured to offer sufficient explanation as I went along to make my pages comprehensible to those whose acquaintance with the subject is but cursory.\n\nThis book is not, and cannot be, a satisfactory handbook for the treatment of psychic disorders.\n\nAll it can do is to point in directions where enquiries might be pursued with advantage.\n\nIf it serves to direct attention to certain subjects that badly need investigation it will have fulfilled its purpose.\n\nI may be charged with having revived the superstitions of the Middle Ages.\n\nTo this charge I must plead guilty.\n\nBut I must put forward as a counter-claim the plea that there could not be so much smoke without some fire, and that the superstitions of the Middle Ages may repay examination in the light of the recent discoveries concerning the psychology of subconsciousness.\n\nWhoever is familiar with the literature of psychic research, abnormal psychology, and the baser aspects of that movement which took its rise from the inspiration of Christian Science and spread into a hundred uncontrolled cults, cannot fail to be struck by the fact that the old witch-finders were getting exactly the same phenomena as we meet with in all these different movements and fields of thought.\n\nIt has been said that since we find the stigmata of hysteria liberally distributed among those unhappy beings charged with witchcraft that the witch-cult is explained and disposed of.\n\nBut we may find that a study of the real motives underlying the witch-cult would throw light on hysteria and the allied mental states.\n\nIt has also been said that history moves in cycles.\n\nAt the present moment we are seeing a great revival of interest in psychic and occult subjects.\n\nWe shall not have to look very much further to find that there are also the very promising beginnings of a witch-cult in our midst.\n\nLet it be remembered that the cases I have quoted in these pages are from the experience of a single person, and I am by no means exceptional in the range of my experience, though I may be less cautious than most in committing myself to paper.\n\nIf one dip of the bucket reveals so much, what might not be brought up by systematic dredging?\n\nSince my treatment of my subject must necessarily be cursory, I should like to direct the attention of my readers to certain books which throw a great deal of light upon the question from various angles.\n\nNot only occultists, but psychologists, alienists and students of psychic matters owe an immense debt of gratitude to the scholarship of the Rev.\n\nMontague Summers and the enterprise of Messrs.\n\nRodker for making available exact and complete translations of the principal books upon witchcraft that were written by the men who were actually concerned in stamping out the witch-cult and had first-hand knowledge of its nature.\n\nIn addition to these I would direct my readers’ attention to Projection of the Astral Body, by Muldoon and Carrington, which throws a very interesting light upon the manner in which genuine witches attended the Sabbats.\n\nI do not mean by these words to imply that Mr.\n\nMuldoon is addicted to wizardry, but he certainly possesses the traditional powers, and if he can do these things at the present day, why could not the witches have done them in days past?\n\nAt any rate, I do not think there is much doubt that the Holy Inquisition would have paid him the compliment of burning him if he had lived during its hey-day.\n\nThirty Years with the Dead, by Dr."


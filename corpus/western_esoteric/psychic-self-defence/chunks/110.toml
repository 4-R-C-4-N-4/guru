[content]
body = "THERE are two types of practical psychic work which may be used separately or in combination, the latter method, in my opinion, giving by far the best results, though the exponents of each are apt to decry the other.\n\nThe method which we will distinguish as the meditative method consists of mediation upon abstract qualities, such as peace, harmony, protection and the love of God.\n\nIt is the method of the New Thought school, and its value lies in the harmonising effect it has upon the emotional state and its counteracting of harmful auto-suggestions.\n\nThe other method, which we will call the invocative, consists in the invocation of external potencies and the employment of formal methods for the focussing of their force.\n\nThis method has many gradations of complexity and an infinite variety of technique.\n\nIt ranges from the simplest prayer which calls upon Christ with the Sign of the Cross, to the most elaborate rituals of exorcism performed with bell, book and candle.\n\nThe essence of the system lies in the attempt to dissect out from the general force of good the particular aspect of energy that is needed, and the use of some symbol to act as the magical vehicle of that force upon the plane of form.\n\nThis symbol may be a mental picture of the blue robe of Our Lady; it may be the action of making the Sign of the Cross; it may be the consecrated water sprinkled for token of cleansing; or it may be some object specially magnetised to act as a talisman.\n\nIn the invocative method the aim is to concentrate the force, and therefore some symbol of form has to be employed.\n\nIn the meditative method the aim is to escape beyond the bounds of form into the atmosphere of pure spirit, too exalted for evil to enter, and therefore the use of any form or formula is eschewed as calculated to prevent the soul from rising into this pure air.\n\nIn my opinion, and with all due respect to the practitioners of this latter method, much better results would be obtained if the invocative method, with its utilisation of the efficacy of formula, were used to enable the mind to climb into the pure air of spiritual consciousness where no evil is.\n\nIt is only those who are highly trained in meditation who can rise on the planes unaided.\n\nIt is exceedingly difficult to “take off” from sense consciousness without the use of some kind of psychological device to act as a spring-board.\n\nThere seems to be little object in refusing for purely academic reasons to avail ourselves of a method of proven efficacy.\n\nIf we realise that the use of forms and symbols is merely a psychological device to enable the mind to get a grip on the intangible, we shall not fall into the error of superstitious observances.\n\nA superstition has been defined as the blind use of a form whose significance has been forgotten.\n\nOn the other hand, we shall be unwise to rely exclusively upon formal or ceremonial methods unless at the same time we use meditative methods in order to purify and harmonise our own consciousness.\n\nIf we neglect this aspect of our work, we shall re-infect by our own vibrations the magic circle as fast as we have cleared it.\n\nIt is not much use sealing a circle with the protective Names if we allow a panic- stricken imagination to run riot, picturing every conceivable kind of evil and leaving blank spaces for the possibility of inconceivable kinds.\n\nEqually, however, we shall find it very much easier to perform the harmonising meditation if we are working within the protection of a magic circle.\n\nTo attempt to perform the work of exorcism solely by means of meditation is like raising a weight by the unaided effort of our two hands.\n\nThe employment of the magical method resembles the use of a lever, or a pulley and block.\n\nOur muscles are still the sole source of energy, but by the utilisation of mechanical principles we have redoubled their power."


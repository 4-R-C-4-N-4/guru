[content]
body = "At the post-mortem it was found that there was nothing whatever the matter with his heart.\n\nImagine the feelings of the doctor who had given this rash diagnosis.\n\nA person already upset by a psychic attack will be in a state to jump at shadows.\n\nHe must be handled very discreetly.\n\nBe very chary of announcing your suspicions until they are conclusively verified.\n\nWhen all is said and done, the main object is a cure, not an explanation.\n\nIt is of little value to your patient to fix the blame unless the matter can be cleared up.\n\nHe is considerably worse off if his suspicions are turned towards some person in his environment from whom he cannot escape, than if he be left to attribute his trouble to unidentified psychic influences.\n\nWhere ignorance is bliss ‘tis folly to be wise is truer in psychic matters than anywhere else.\n\nNever open the eyes of your patient to a danger for which you cannot give him an effectual defence.\n\nThe surgeon who is about to operate covers his instruments with a cloth so that the patient shall not see them.\n\nThe wise occultist does the same.\n\nDo not forget that the Unseen is always suspect to the uninitiated.\n\nHaving conducted an enquiry along the lines laid down in the previous pages, you should have acquired a considerable amount of material for investigation.\n\nExamine it carefully for correlations of cause and effect.\n\nNote if any exacerbation of the trouble is regularly associated with any incident, place, or person.\n\nConsider also the various type-cases that I have given as examples in the previous chapters, and see if you can find any that resemble the case you are investigating.\n\nNote the explanations given, and see if they throw any light upon the problem, or suggest lines along which enquiry might be pursued.\n\nWorking in this way, you ought to be able to arrive at a tentative diagnosis.\n\nIf this is confirmed by the findings of the psychics to whom you have sent specimens for psychometry, then you may feel confident you are upon the right track and go forward boldly.\n\nRemember, however, that although the psychics ought to agree as to the main points of their investigation, you cannot expect any complete agreement as to details.\n\nThey are inspecting a composite photograph of the patient’s entire life, and there is so much to see that no one person is likely to see everything.\n\nThe things in which they confirm each other may be held to be established, but the things which the one sees and the other does not are not necessarily illusionary."


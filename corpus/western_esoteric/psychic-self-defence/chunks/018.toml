[content]
body = "CS nightmares usually heralded Mr.\n\nCS attacks.\n\nThese occurrences showed a certain cyclic regularity, occurring about once a month.\n\nIn the case of a woman this would naturally be referred to the twenty-eight day cycle of her nature, but in the case of a man, no such explanation was forthcoming, and we therefore had to look for another twenty-eight day cycle to explain his periodicity.\n\nThe only other cycle of this period is that of the phases of the moon.\n\nWe were then confronted by a correlation of epileptiform attacks, which had no organic basis, the nightmares of a second person, and the phases of the moon.\n\nSome theory had to be found which would resume these three and explain their inter-relationship.\n\nA dream is commonly the first way in which psychic manifestations make themselves known, the subconscious perceptions being reflected into consciousness in this form.\n\nIt is held by many occultists that congenital epilepsy, as distinguished from that due to tumours of the brain, has its roots in the operations of black magic or witchcraft in which the sufferer participated in a past life, whether as practitioner or victim, the fit being an astral struggle with a discarnate entity, reflected on the physical body by means of the well-known phenomenon of repercussion.\n\nThe moon plays a very important part in all occult operations, different tides being available at different phases of her cycle.\n\nPersephone, Diana and Hecate, all aspects of Luna, are three very different persons.\n\nIt therefore appeared probable that as the physical investigation had drawn blank, a psychic investigation might yield fruits.\n\nOne was performed.\n\nAnd with the following results.\n\nNothing at all was discerned with regard to Mrs.\n\nC.\n\nShe was merely what lawyers call an accessory after the fact.\n\nBut the psychic trail of Mr.\n\nC.\n\nwas soon picked up and followed, and it appeared that in his last incarnation he had been associated with two women, mother and daughter, who had practised witchcraft for his benefit.\n\nThe younger of the two women had been for a short time his mistress.\n\nMother and daughter had paid the penalty for their crimes, but their male partner had escaped.\n\nThe diagnosis was as follows: It is the younger witch that is at the bottom of the trouble.\n\nIt is her astral visits which cause the seizures of Mr.\n\nC.\n\nand the nightmares of Mrs.\n\nC., and they correlate with the phases of the moon because certain phases are favourable for the operation she performs and she therefore takes advantage of them.\n\nThe question now remains, is this woman in incarnation or not?\n\nThat is to say, is the midnight visit paid in an astral body projected from a living human being, or by an earth-bound spirit which has succeeded in evading the Second Death?\n\nMrs.\n\nC.\n\nhad by now been taken into the confidence of the mutual friend who was concerned for her welfare, and lent a ready ear to the suggestion that some psychic influence might be at the bottom of the trouble, for this explanation coincided with her own intuitions in the matter, intuitions she had not dared to divulge for fear of ridicule.\n\nWhen asked if she could identify anyone in the circle of her husband’s acquaintances who might prove to be the younger witch, she replied immediately that she could with out any difficulty identify both the women, and told the following curious story.\n\nThe older witch she identified as her husband’s mother, an aged lady who occupied a suite of rooms in their house.\n\nFor this inoffensive old creature Mrs.\n\nC.\n\nhad always had a peculiar horror and repulsion, although admitting there were no rational grounds for it, and honestly endeavouring to do her duty by her.\n\nSo great was her horror of the old lady that she would never remain in the house after her husband had left for his office in the morning, but went out herself to her club if she had no other engagement.\n\nAmong the frequenters of the house was an intimate friend of the elder Mrs."


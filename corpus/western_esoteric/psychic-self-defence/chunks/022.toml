body = "THE part played by the ex-witch in occult attack is very marked.\n\nAgain and again do the investigations of independent psychics point to witchcraft in a previous incarnation when trouble of this sort is afoot.\n\nThe motive is nearly always vengeance, but there is also good reason to believe that the projection of the astral body takes place involuntarily during sleep, and is not deliberately willed by the offender.\n\nVery many people who are at present psychics and sensitives got their training in the covens of medieval witchcraft, and for this reason experienced occultists are very wary of the natural psychic, as distinguished from the initiate with his technique of psychism.\n\nWhere psychism and mental unbalance are found conjoined with a malevolent disposition, there is strong presumption that the cult of Diabolus is not far to seek.\n\nA curious set of happenings, in which I myself was one of the actors, throws a good deal of light on this by no means uncommon occurrence.\n\nIt was in the early days of my interest in occultism, when I was still buying nay experience by the expensive but effectual method of running my head into obstacles, I made the acquaintance of a woman who was interested in psychic matters.\n\nShe was a person of the most extreme sensitiveness to anything unclean or ugly, fastidious to a degree in her personal habits, living almost exclusively on uncooked vegetarian foods, even refusing eggs as too stimulating.\n\nAlthough not an animal lover, she was morbidly humanitarian, reading with gusto those papers which give lurid and detailed descriptions of vivisection experiments.\n\nHad I been older and wiser I should have recognised the significance of her ultra-cleanliness and ultra-sensitiveness as marking the ab-reaction of a sadistic temperament - sadism being a pathology of the emotional nature in which the sex instinct takes the form of an impulse to inflict pain.\n\nNot having learnt then many things which I now know, I looked upon her characteristics as indicative of an exalted spirituality.\n\nAt the time I knew her she was verging on a breakdown which was alleged to be due to overwork, and she was very anxious to get away from cities and back to nature.\n\nI was just leaving London to take up my residence at an occult college which was hidden away in the sandy fastnesses of the Hampshire barrens.\n\nIn the innocence of my heart I suggested that she might come down there and help with the domestic duties.\n\nThe suggestion was acted upon, and a few days after my own arrival Miss L.\n\njoined us.\n\nShe seemed quite normal, made herself agreeable, and was well liked.\n\nOne incident, however, in the light of subsequent events, was significant.\n\nOn getting out of the ancient fly in which she had driven from the station, she immediately went and patted the still more ancient horse that drew it.\n\nThat beast, usually sunk in an apathy from which he was with difficulty roused when action was required of him, galvanised into life at her touch as if she had stung him.\n\nHe threw up his head, backed, snorted, and nearly turned the equipage over in the ditch, to the amazement of his jehu, who declared he had never been known to do such a thing before, and viewed our visitor with disfavour.\n\nMiss L., however, appeared quite normal, made herself agreeable, and was given a friendly reception by the humans at any rate.\n\nThat night I was awakened by nightmare, a thing to which I am not usually subject.\n\nI struggled with a weight on my chest, and even after consciousness had fully returned, the room seemed full of evil.\n\nI performed such simple banishing formula as I knew, and peace was restored.\n\nAt breakfast next morning an assembly of blear-eyed people met together, complaining of having passed disturbed nights."


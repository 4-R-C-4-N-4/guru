[content]
body = "For instance, a small animal may be baptised with the victim’s name, and then immolated, usually with torture, the operator meanwhile concentrating upon the personality of the original.\n\nThe old device of making a wax image and melting it before a fire, or driving nails into a wooden statue, baptised with the name of the victim, are frequently met with in the records of witch-trials.\n\nThe actual driving of the nail has no conceivable effect upon the victim, but it helps the concentration of the operator.\n\nThe talismanic method in various forms is also employed.\n\nA talisman is a symbol representing a certain force, or combination of forces, depicted upon a suitable substance and magnetised by ritual.\n\nIt can be made from anything which will retain magnetism; metals, precious stones or parchment are usually employed; paper is less effective unless it be enclosed in a metal case.\n\nWater and oil can be effectually magnetised but soon lose their potency.\n\nA talisman is made by invoking the requisite force, as already described, and then concentrating it upon the prepared object, which is placed ready upon the altar before the evocation begins.\n\nA talisman thus made has next to be brought into the magnetic sphere of the victim.\n\nIt is related that Lady Burton, anxious to convert her free-thinking husband, the famous Sir Richard Burton, the great explorer, used to get her priest to bless little statues of the saints and put them in the pockets of his clothes.\n\nA similar device is used by the workers of black occultism.\n\nMagnetised objects are placed in the rooms habitually occupied by the victim, or buried in his path, so that he must pass over them frequently.\n\nThese talismans of evil not only work by their own power, but also serve the sorcerer as a point of concentration for his meditations.\n\nHarmful effects are also produced by objects which have been used in black magic and have become impregnated with the forces they were employed in generating.\n\nOdds and ends of magical equipment turn up in some queer places.\n\nI was present at an auction in a country town when the twelve signs of the Zodiac, neatly painted on a blackboard, came up for sale.\n\nVarious of my friends have picked up magical treasures, such as altar lamps and incense burners that obviously came out of ritual lodges, but the prize of the collection was a magical rod that was put up to auction along with a bundle of fire-irons.\n\nLarge crystals for scrying are frequently seen in antique shops.\n\nAll such things need carefully de-magnetising before they are brought into one’s psychic sphere.\n\nI was taking part at one time in a series of psychic experiments which had been going on very well, when, for no apparent reason, things went wrong and there was a considerable upheaval.\n\nWe did not know at the time, but we learnt later, that the owner of the flat where they were being held had obtained possession of a floor-cloth that had been used in ritual magic by an occultist whom only the utmost leniency could call doubtful.\n\nThe artificial elemental is really the basis of the efficacy of curses.\n\nin this case no physical substance is employed, but a portion of the Akasha is moulded into a definite form and held thus by the will of the operator until, as it were, it “sets.” Into this mould is poured the concentrated energy of the operator, something of his own self goes into it.\n\nThis is its soul, and it is like a self-steering torpedo which is set to move in a curve towards a chosen mark.\n\nOr the operator, if an expert magician, may deliberately ensoul this thought-form with elemental essence, which is the raw, undifferentiated substance of life drawn from one or another of the elemental kingdoms.\n\nIt is in order to do this that the curse is invoked in the name of some being."


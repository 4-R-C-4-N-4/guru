body = "Taverner, but the actual facts are such that they were unsuitable for a work supposedly designed to amuse.\n\nAt that time I was doing the tutorials in abnormal psychology at the clinic I have spoken of, and supervising the work of the other students; one of them took counsel with me concerning a case that had come to her in private practice, the case of a youth in the late ‘teens, one of those degenerate but intellectual and socially presentable types that not infrequently crop up in old families whose blood is too blue to be wholesome.\n\nThis lad was taken as boarder in a flat which the student shared with another woman, and they soon began to be troubled with curious phenomena.\n\nAbout the same time every evening the dogs in a neighbouring mews began a furious outcry of barking and howling, and a few moments later the French window leading on to the verandah would open.\n\nIt did not matter how often they got the locksmith to it, nor how they barricaded it, open it would come at the appointed time, and a cold draught sweep through the flat.\n\nThis phenomenon took place one evening when the adept, Z., was present, and he declared that an unpleasant invisible entity had entered.\n\nThey lowered the lights, and were able to see a dull glow in the corner he indicated, and when they put their hands into this glow, felt a tingling sensation such as is experienced when the hands are put into electrically-charged water.\n\nThen began a mighty spook-hunt up and down the flat, and the presence was finally cornered and dispatched in the bathroom.\n\nI have staged the incident somewhat more picturesquely in my story, but the essential facts are the same.\n\nThe result of the dispatching of this entity was a marked improvement in the condition of the boy patient, and the elicitation of the following story.\n\nThe boy, whom we will call D., was in the habit of going to sit with a cousin who had been invalided home from France suffering from alleged shell-shock.\n\nThis young man was another scion of a worn-out stock, and it transpired that he had been caught red-handed in that unpleasant per version called necrophilia.\n\nAccording to the story elicited from the parents of D., this vice was not uncommon on certain sections of the Front, as were also attacks on wounded men.\n\nThe authorities were taking drastic steps to put it down.\n\nOwing to family influence the cousin of D.\n\nwas able to escape incarceration in a military prison, and was placed in the care of his family as a mental case, and they put him in the charge of a male nurse.\n\nIt was while the male nurse was off duty that the unfortunate young D.\n\nwas misguidedly employed to sit with him.\n\nIt also came out that the relations between D.\n\nand his cousin were of a vicious nature, and on one occasion he bit the boy on the neck, just under the ear, actually drawing blood.\n\nD.\n\nhad always been under the impression that some “ghost” attacked him during his crises, but had not dared to say so for fear of being thought mad.\n\nWhat may have been the exact percentages of neurotic taint, vice, and psychic attack, it is difficult to say, nor is it easy to decide which was the predisposing cause that opened the door to all the trouble, but one thing stood out clearly to all beholders, that with the dispatch of the psychic visitant, not only did D.’s condition clear up immediately, but after a short, sharp upheaval the cousin also recovered.\n\nThe method of dispatch used by the adept, Z., was to pin the entity inside a magic circle, so that it could not get away, and then absorb it into himself through compassion.\n\nAs he completed the operation, he fell over backwards unconscious."


[content]
body = "Just as a child who has been thrown by his pony must immediately get up and remount if he is ever to ride again, so I knew that at all costs I must make that astral journey if I were to retain my powers.\n\nSo I told my group to pull themselves together and re-form the circle because we must make another attempt; I invoked the Inner Chiefs, and went out once more.\n\nThis time there was a short sharp struggle, and I was through.\n\nI had the Vision of the Inner Chiefs, and returned.\n\nThe fight was over.\n\nI have never had any trouble since.\n\nBut when I took off my clothes in order to go to bed my back felt very sore, and taking a hand-glass I examined it in the mirror, and I found that from neck to waist I was scored with scratches as if I had been clawed by a gigantic cat.\n\nI told this story to some friends of mine, experienced occultists, who at one time had been closely associated with the person which whom I had had this trouble, and they told me that she was well known for these astral attacks, and that a friend of theirs after a quarrel with her had had an exactly similar experience, and she too had been covered with claw-marks.\n\nIn her case, however, she had been ill for six months and had never touched occultism again.\n\nThere is a curious epilogue to this story, which may or may not have any bearing upon it.\n\nI have already told the story of the mysterious death that took place on lona.\n\nHow the body of this unfortunate girl was found lying naked on a cross cut out of the turf.\n\nNo cause of death could be found, and the verdict was that she died of exposure.\n\nBut if she were lost, how did she come to lie down to die in this ritual manner, instead of wandering about?\n\nWhy had she taken off all her clothes before leaving her house, covering herself only with a black cloak?\n\nAnd why did she take with her the large knife with which she cut the cross in the turf?\n\nI do not know her later history, for I had lost sight of her during the last two or three years of her life, but at the time I knew her she was associated with the woman I have referred to.\n\nThe only marks found upon her dead body were scratches."


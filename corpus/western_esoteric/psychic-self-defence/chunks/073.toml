[content]
body = "WE have seen in a previous Chapter that nervous and mental disorders can simulate a psychic attack, especially if the subject is familiar with the terminology of occultism.\n\nWe must also consider the part played by psychic attack in nervous and mental disorders.\n\nBut before we can embark upon this section of our studies, we must give a brief explanation of the nature of nervous and mental disturbances and the distinction between them.\n\nWe will not go into academic considerations, for these pages are not written for the orthodox professional psychologist, who has an abundance of textbooks at his disposal, but for the person whose interest is primarily in occult matters, and who comes to the study of the subject unequipped with the technicalities of psychology and psycho-physiology, two sciences of which at least a working knowledge is exceedingly necessary in the pursuit of practical occultism.\n\nIn the course of an incarnation the mind is built up on the foundations of the traits of the Higher Self, or Individuality, which is the immortal soul that develops in the course of an evolution.\n\nThe mind, therefore, is part of the personality -the unit of incarnation - commencing at birth and dissolving at death, its essence being absorbed by the individuality , which evolves thereby.\n\n[Note for clarification from the Editor/Arranger of this html document: The Personality is the ego or external identity and ordinary consciousness of a person, and the Individuality is the Higher-self, H.G.A., or spiritual component of a person.] The mind is essentially the organ of adaptation to the environment, and it is when that adaptation fails that neurotic and hysterical troubles begin.\n\nEach living creature is the channel for a current of life-force which proceeds from the Logos, the Creator of this universe.\n\nThis current is divided into three main channels represented to us as the three great natural instincts, Self-preservation, Reproduction, and the Social Instinct.\n\nThese are the mainsprings of our lives.\n\nThe pressure of Life itself is behind them, and if they are thwarted beyond their power of compensation (considerable as that is), they are like streams whose channels are blocked, and which in consequence overflow and make a morass of the adjacent land.\n\nEmotion is the subjective aspect of an instinct.\n\nThat is to say, when an instinct is at work, we feel emotion.\n\nEvery emotion we feel can be referred to one or other of the instincts.\n\nOur resentment of a slur upon our dignity has its roots in the instinct of Self-preservation.\n\nOur love of art has its roots in the instinct of love, beauty and creative expression which, upon its lowest arc, is called sex.\n\nEach of these instincts has its high spiritual aspect and its elemental physical aspect, and transmution from one plane to another takes place freely, so that unless we understand the significance of these manifestations we shall be misled.\n\nIn their understanding is the key to the science of life.\n\nIf one of these great instincts is so thwarted that all attempts at compensation break down; or if the temperament is so inelastic and unaccommodating that it will not modify its demands, the ego makes a final desperate attempt at adjustment which goes outside the limits within which harmonious relations with the environment can be maintained.\n\nCommunications with the environment break down, and the mind has, in part at least, quitted the sphere of reality for the sphere of imagination.\n\nThe sense of fixed values is lost, and things assume a symbolic importance.\n\nThis breakdown may be partial, relating to certain aspects of the life only, or it may be total.\n\nIn hysteria, the dammed-up forces of life remain in the channel, but spurt with concentrated force through any sluice that may be opened to them.\n\nConsequently, instead of the river below the obstruction being a smooth-flowing body of water, it descends in rapids and whirlpools difficult and dangerous to navigate, so that the barque of life makes shipwreck therein."


body = "The older faiths knew this, but popular Christianity, which has no roots in tradition, has forgotten it.\n\nProtestant Christianity threw away its occult aspect at the Reformation.\n\nAll the pagan pantheons have gross aspects of divinities as well as etherial ones.\n\nWe need to search the refuse-heap of history for the lost parts of our own tradition if our faith is to be complete, and the most profitable line of search is in the Qabalah and the Gnostic literature.\n\nThe literature of the Gnosis has been largely destroyed by systematic persecution, but in the Qabalah there is still left us a complete system.\n\nThe Jews, being strictly monotheistic, did not speak of gods, but they recognised a hierarchy of angels and archangels which is the equivalent of the pagan pantheons.\n\nIt is through these etherial messengers that the All-Father formed the worlds.\n\nLet us consider once more the Qabalistic doctrine of the Qlippoth, for it has an intimate bearing upon the problem of insanity.\n\nThe doctrine of the Ten Holy Sephiroth, arranged in their correct pattern to form the Tree of Life, is invaluable in enabling us to conceive the Invisible.\n\nThe First Sephira is concentrated out of the Unmanifest, the Point within the Circle.\n\nThis emanates the Second, which in its turn emanates the Third.\n\nAs soon as one has emanated another, these two are said to be equilibrated; but when emanation is in process, there is a period of unbalanced force.\n\nThis, as it were, goes off by itself in the Cosmos and establishes a sphere of its own, unconnected with the Cosmic system.\n\nConsequently, each sphere of the Cosmos has its counterpart in Chaos, in miniature, it is true, but nevertheless potent and functional.\n\nEach sphere, in the course of its evolution, builds up an Oversoul which is called by different names in different systems.\n\nIn the Qabalistic system we call them the Archangels, the Spirits before the Throne.\n\nThe Sphere of the Sun is represented by Raphael, the Sphere of the Moon by Gabriel.\n\nThe Obverse Sephiroth, or Qlippoth, build up in exactly the same way.\n\nIn the Habitations of Hell these two are known as the Disputers and the Obscene Ones, whose names sufficiently indicate their characters.\n\nThe Sphere of the Sun is also the point of manifestation of the Messiah or Saviour upon earth.\n\nThe Prince of Peace has His obverse in the Disputers.\n\nWho that has had the Vision Beautiful does not know the reaction that follows it, and the need of wisdom, self-control and patience to deal with the forces that are released not only in the soul but in the environment?\n\nIt is for this reason that periods of purgation and discipline precede all revelations.\n\nWe must keep the vigil before we can sit at the feast.\n\nConsciousness, released from the Sphere of Earth, rises straight upwards to the Sphere of the Moon.\n\nThis is the negative, feminine, receptive, psychic sphere.\n\nFrom thence it passes onwards to the Sphere of the Sun.\n\nThis is the positive, masculine sphere of the higher consciousness, the vision of the seer as distinguished from the psychic.\n\nUpon either hand the path is flanked by the Spheres of Hermetic Wisdom and Elemental Beauty.\n\nThese Spheres, which have to do with the grades of initiation, need not concern us in the present pages.\n\nWe shall only have to do with the Sphere of the Moon, Luna, the Mistress of the Luna-tic.\n\nNow Luna was represented by the ancients under diverse forms as Diana the chaste huntress, symbol of sublimation, and Hecate, patroness of witchcraft and childbirth.\n\nWe have already noted that the Qlippoth of the Sphere of Luna are called the Obscene Ones."


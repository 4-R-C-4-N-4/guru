[content]
body = "So much occult knowledge is abroad in the world, so much of the kind of things described in these pages is going on unknown and unsuspected in our midst, that it is very desirable that men of goodwill should investigate the forces which men of evil will have perverted to their own ends.\n\nThese things are the pathologies of the mystic life, and if they were better understood, many tragedies might be averted.\n\nOn the other hand, it is not well that everybody should indulge in the study of textbooks of pathology.\n\nA vivid imagination and a weak head are a disastrous combination.\n\nThe readers of that one-time “best seller,” Three Men in a Boat, may remember the fate of the individual who spent a wet Sunday afternoon reading a medical textbook.\n\nAt the finish he was firmly convinced he had got every single disease described therein with the single exception of house maid’s knee.\n\nThis book is not intended merely to make the flesh creep, but is designed as a serious contribution to a little-understood aspect of abnormal psychology, perverted, in some instances, to the purposes of crime.\n\nIt is a book intended for serious students and for those who find themselves confronted by the problems it describes, and who are trying to understand them and find a way out.\n\nMy chief aim in speaking so frankly is to open the eyes of men and women to the nature of the forces that are at work below the surface of everyday life.\n\nIt may happen to any one of us to break through the thin crust of normality and find ourselves face to face with these forces.\n\nReading of the cases cited in this book, we may well say that there, but for the grace of God, goes any one of us.\n\nIf I can give in these pages the knowledge which protects, I shall have fulfilled my purpose."


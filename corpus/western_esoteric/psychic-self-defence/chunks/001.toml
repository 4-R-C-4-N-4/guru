[content]
body = "It is with a sense of the seriousness of the issues involved that I set myself to the task of writing a book on psychic attack and the best methods of defence against it.\n\nThe undertaking is beset with pitfalls.\n\nIt is hardly possible to give practical information on the methods of psychic defence without at the same time giving practical information on the methods of psychic attack.\n\nIt is not without reason that initiates have always guarded their secret science behind closed doors.\n\nTo disclose sufficient to be adequate without disclosing sufficient to be dangerous is my problem.\n\nBut as so much has already been made known concerning the esoteric teachings, and as the circle of students of the occult is becoming rapidly wider every day, it may well be that the time has now come for plain speaking.\n\nThe task is not of my seeking, but as it has come into my hands, I will do my best to discharge it honourably, making available the knowledge which has come to me in the course of many years’ experience of the strange by-ways of the mind which the mystic shares with the lunatic.\n\nThis knowledge has not been attained without cost, nor, I suspect, will the divulging of it be altogether free from cost, either.\n\nI have endeavoured to avoid, as far as possible, the use of second-hand material.\n\nWe all know the person who has a friend whose friend saw the ghost with her own eyes.\n\nThat is not of very much use to anybody.\n\nWhat we need is to have the eye-witness under cross-examination.\n\nFor this reason I have not drawn upon the vast literature of the subject for illustrations of my thesis, but have preferred to rely upon cases that have come within the range of my own experience and which I have been able to examine.\n\nI think I may fairly claim to have practical, and not merely theoretical, qualifications for the task.\n\nMy attention was first turned to psychology, and subsequently to occultism as the real key to psychology, by the personal experience of a psychic attack which left me with shattered health for a considerable period.\n\nI know for myself the peculiar horror of such an experience, its insidiousness, its potency, and its disastrous effects on mind and body.\n\nIt is not easy to get people to come forward and bear witness to psychic attacks.\n\nFirstly, because they know there is very little likelihood of their being believed, and that they will be more likely to earn themselves a reputation for mental unbalance than for anything else.\n\nSecondly, because any tampering with the foundations of the personality is an experience of such peculiar and unique horror that the mind shrinks from the contemplation of it and one cannot talk about.\n\nI am of the opinion that psychic attacks are far commoner than is generally realised, even by occultists themselves.\n\nCertainly the general public has no conception at all of the sort of things that are done by people who have a knowledge of the powers of the human mind and set to work to exploit them.\n\nI am convinced that this factor played a large part in the witch-cult, and was the real cause of the universal horror and detestation of the witch.\n\nThese powers have always been known to students of occultism, but nowadays they are known and used by people who would be exceedingly surprised to find who are their fellow-practitioners.\n\nMrs.\n\nEddy, the founder of Christian Science, stumbled on to these methods empirically without ever acquiring any rational knowledge as to their modus operandi.\n\nShe endeavoured to teach them in such a way that they could only be used for good and their power for evil should be concealed; but that she herself was well aware of their possibilities if abused is witnessed by the dread of what she called “Malicious Animal Magnetism,” which shadowed her whole life.\n\nThe methods of Christian Science, without its strict discipline and careful organisation, were developed and exploited by the innumerable schools and sects of the New Thought Movement."


body = "We now come to the consideration of Positive Evil.\n\nThis again has a “negative’s and “positive’s aspect.\n\nIts “negative’s aspect is pure chaos, unformed substance and unco-ordinated force.\n\nIt has been aptly called the Cosmic Abortion.\n\nTo drift into the sphere of “negative” Positive Evil is like being caught in a psychic quicksand.\n\nWe are now ready to consider the sphere of “positive” Positive Evil, the demons themselves, or the Qlippoth, as they are called in the Qabalah.\n\nIn order to understand their significance we must make a further excursion into Qabalistic philosophy.\n\nThe Creator is conceived of as bringing the universe into manifestation through a series of Divine Emanations, ten in number.\n\nThese are called the Ten Holy Sephiroth, and are represented in a diagram as arranged in a particular pattern.\n\nThis is the famous Tree of Life, the key to all symbolism.\n\nThe Sephiroth were not emanated independently, each from the Divine Source; but overflowed, the one from the other.\n\nAs soon as one Sephira has emanated another, these two are said to be in equilibrium, compensating each other.\n\nBut there is a period during the emanation of a Sephira when the force is not yet in equilibrium, but is pushing out unsupported, like an incomplete arch.\n\nIt is the uncompensated force emanated during this epoch of unbalance, and never subsequently absorbed after the establishment of the new sphere, which constitutes Positive Evil.\n\nThere are, therefore, ten kinds of Positive Evil, just as there are ten Divine Emanations.\n\nTo these spheres go, according to their kind, all the evil imaginings of the heart of man that are not neutralised by repentance or compensated by the overplus of good in other members of the same group-soul.\n\nThere is a deep occult doctrine here which we cannot enter upon now; it must suffice to state it dogmatically in explanation of the Qabalistic conception of the Qlippoth.\n\nWhen we consider all that must have been poured into these ten sinks of iniquity since the days of Atlantean Magic, through the decadence of Babylon and Rome, down to the Great War, we can guess what rises up from them when their seals are broken.\n\nNot only do influences emanate from them which tempt and corrupt souls, each according to its susceptibility, but time has served for the formulation of evil intelligences.\n\nThese probably originated through the workings of Black Magic, which took the essential evil essence and organised it for purposes of its own.\n\nThe beings thus formulated assumed an independent existence, developed, and multiplied their kind.\n\nThey appear as dreams and hallucinations, and may produce a considerable degree of objective phenomena, such as noise, deposit of slime or blood, balls of light, and, above all, stenches of an amazing pungency.\n\nThe Ten Divine Emanations are personified as Archangels, and the Ten Infernal Emanations are personified as Archdemons.\n\nIt is these which are the Names of Power in Magic.\n\nEach Sephira, then, has its obverse side in the corresponding Qlippottic demon.\n\nThe initiated adept always gains control over the demonic force before he attempts to utilise the angelic force which, by the appropriated means, can be contacted in each Sephira.\n\nIf he does not do so, he contacts them both simultaneously.\n\nMoreover, the planets, the elements and the Signs of the Zodiac are all intimately connected with the Sephiroth, being arranged upon the Tree of Life in a pattern known only to initiates.\n\nThe initiated adept is exceedingly careful what he does when he is working with these potencies because he knows that he has always got the Qlippoth in the background."


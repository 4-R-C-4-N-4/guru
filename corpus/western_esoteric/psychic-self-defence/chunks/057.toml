[content]
body = "Secondly, when I speak of physical happenings, the smashing of glass and voices, they were never, with one absolutely inexplicable exception, actual, but pure obsessions; and this leads to the third point.\n\nNot one of these incidents happened while I was asleep.\n\nAlways I found myself awake with the terror upon me and struggling violently to cast off the spell.\n\nI have had nightmares before, but no nightmare that I have ever had could hold my mind in its grip for minutes at a time as this thing did, or send me plunging through a ten-foot-high window to the ground below.\n\n“The first indication I had that these visitations were absolutely out of the ordinary course of events came on May 30 .\n\nAbout midnight I was suddenly awakened by a voice calling loudly, ‘Look out,’ and at once I became aware of a red serpent coiling and uncoiling itself under my bed, and reaching out onto the floor with its head.\n\nJust as it was about to attack me I jumped through my window, and came to earth among the rose bushes below, fortunately with no more damage done than a badly bruised arm.\n\n“After this there was absolute peace until June 30 , when the real climax came.\n\nI had seen the thing again on the night of the new moon, and had noticed considerable changes in its appearance.\n\nEspecially it seemed far more active, while its long hair had changed into serpent heads.\n\nThe night after I was awakened by a violent noise and jumped out of bed.\n\nI then saw the noise was caused by a great red obelisk which crashed through the west wall of my room and leaned against the wall at the east end, smashing both that and the window to pieces but missing my bed, which was in an alcove to the left of its path.\n\nIn its transit it had smashed all the mirrors, and the floor and top of my bed were strewn with broken glass and fragments of wood.\n\nThis time the obsession must have lasted some minutes, I dared not move for fear of cutting myself, and to reach the matches - wherein, I knew, lay safety - I had to lean across the bed and again risk the glass.\n\nYet in my heart I knew that all this was false, but had no power to move.\n\nI could only stand there, incapable, looking at the shattered room in a state of hopeless terror.\n\n“And now comes the most extraordinary part of the whole business.\n\nWhen I had finally mastered the obsession, I went to bed again dead tired, and I know that the only sound I made that night was jumping to the floor, also my room is at least a hundred yards from the rest of my family, yet next morning at breakfast I was asked what was the terrible noise in my room during the night.\n\n“After that I realised that the game was up.\n\nI had not taken these occurrences lying down, but I knew that it was impossible for me to try and control the force which I had set in motion.\n\nIn desperation I turned to a good friend, who, I was aware, knew much of these things.\n\nShe did not hesitate, but came at once to my assistance, and from that day to the present the trouble has absolutely gone from me.\n\n“Such is the case; and I only hope it may warn those who are contemplating my folly to treat with the greatest of care any printed systems of magic, and not to use them at all unless they have the fullest control over the entities invoked.” Among the general public, who do not dabble in occultism, the results of a magical mishap are never seen, and the only doctors who ever see them are fellow-initiates who happen to be medical men, and they, naturally, keep silence.\n\nThe catastrophes are of varying degrees of severity, ranging from a bad fright to a fatality.\n\nI cannot say much upon these subjects, for they are among the most secret paths of occult lore."


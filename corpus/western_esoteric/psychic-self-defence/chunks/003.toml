[content]
body = "As a young girl of twenty I entered the employment of a woman who I now know must have had a considerable knowledge of occultism obtained during a long residence in India, and concerning which she used to drop hints that I could make nothing of at the time, but which, in the light of later knowledge, I have come to understand.\n\nIt was her custom to control her staff by means of her knowledge of mind-power, and she had a steady succession of most peculiar breakdowns among the people working under her.\n\nI had not been with her very long when she wanted me to give evidence in a lawsuit.\n\nShe was a woman of violent temper, and had dismissed an employee without notice and without wages, and he was sueing her for the money due to him.\n\nShe wanted me to say that his behaviour had been such that she was justified in thus dismissing him.\n\nHer method of collecting my evidence was to look into my eyes with a concentrated gaze and say, “Such and such things happened.” Fortunately for all concerned I had kept a diary and had a day-to-day record of the whole transaction.\n\nIf it had not been for this I should not have known where I was.\n\nAt the end of the interview I was dazed and exhausted, and lay down on my bed in my clothes and slept the sleep of utter exhaustion till next morning.\n\nI suppose I slept for about fifteen hours.\n\nSoon after this she wanted my testimony again.\n\nShe wished to get rid of my immediate superior, and wanted to find sufficient grounds to justify her in doing so.\n\nShe repeated her previous maneuvers, but this time I had not got a diary record to fall back upon, and to my intense surprise I found myself agreeing with her in a series of entirely baseless charges against the character of a man I had no reason to believe to be otherwise than perfectly straight.\n\nThe same exhaustion and the same dead sleep descended upon me immediately after this interview as aft& the preceding one, but an additional symptom now manifested itself.\n\nAs I walked out of the room at the end of the interview I had a curious sensation as if my feet were not in the place I expected them to be.\n\nAnyone who has walked across a carpet that is bellying up with the under-floor draught will know what I mean.\n\nOccultists will recognise it as having to do with the extrusion of the etheric double.\n\nThe next incident to occur in this curious menage did not concern myself, but another girl, an orphan with considerable means.\n\nMy employer kept this girl constantly with her, and finally persuaded her to put the whole of her capital into her schemes.\n\nHowever, trustees descended in wrath, forced my employer to disgorge, and took the girl away with them then and there, leaving all her belongings behind, to be packed up and sent on to her afterwards.\n\nAnother incident followed quick on the heels of this one.\n\nThere was an elderly woman in the establishment who was slightly “minus” mentally.\n\nA dear old thing, but childlike and eccentric.\n\nMy employer now turned her attention to her, and we watched the same process of domination beginning.\n\nIn this case there were no trustees to interfere, and the poor old lady was being persuaded to take her affairs out of the hands of her brother, who had hitherto managed them, and commit them to the tender mercies of my employer.\n\nMy suspicions had by now been thoroughly aroused.\n\nIt was more than I could bear to see old” Auntie” rooked, so I took a hand in the game, woke “Auntie” up to the situation, pushed her belongings into a box, and got her off to her relatives while my employer was away for a brief absence.\n\nI hoped my complicity in the affair would not become known, but I was soon disillusioned."


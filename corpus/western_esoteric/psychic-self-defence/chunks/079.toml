[content]
body = "ANYONE who reads the old books on witchcraft, usually compiled by the professional witch-finders from the confessions of alleged witches extorted under torture, will find that the phenomena described fall into certain broad categories which are so constant in (lifferent ages and in different parts of the world that we are left with the impression that there must be some fire behind so much smoke.\n\nThe State records of witch-trials in Scotland, the reports of a priest charged with the task of extirpating witchcraft in Northern Italy, the archives of Brittany, the stories of magic in classical literature, and finally, travellers’ accounts of the practices of primitive people all over the world, all corroborate each other, agreeing as to the phenomena described, the explanations given by the witches of their methods, and the broad divisions into which the phenomena fall.\n\nWe must first take account of the use of drugs, of which the Black Fraternity in all ages have possessed a remarkable knowledge.\n\nPotions, unguents and fumigations were used extensively, and among all the weird and wonderful ingredients of which they were composed we now and again find substances which are known to be medicinally potent.\n\nThe poppy which gives sleep and dreams, hemp which gives visions, datura which produces loss of memory, blighted grains which produce abortion, certain insects which are powerfully aphrodisiac, certain barks which are effectually anaphrodisiac, and, in the New World, the buds of a certain cactus &m dash; all these and many others play their part in the witchbrews.\n\nParacelsus earned fame by turning some of the traditional magical brews to medicinal purposes.\n\nThe Borgias earned infamy by employing them as subtle poisons which destroyed the mind without necessarily destroying the body.\n\nIt is related that the Roman philosopher Lucretius was driven insane by a magical draught given him by his wife in order to restore to her his lost affections.\n\nThere exist old recipes for witch-unguents which contain opium and cantharides.\n\nIt is not difficult to imagine what manner of dreams would come in the sleep thus induced.\n\nC.\n\nS.\n\nOllivier, in his recent book, Analysis of Magic and Witchcraft, gives it as his opinion that attendance at the Sabbat was often achieved by means of drug-induced dreams.\n\nSubtle poisons also undoubtedly play a part in the effectiveness of curses, a favourite method being to make a talisman of brass, copper or lead, and fasten it inconspicuously at the bottom of a drinking vessel or cooking pot.\n\nWhat effect the talisman had is conjectural, but there is no doubt at all about the effect of the steady dissolving of small quantities of lead and verdigris in the food.\n\nBut while all these things were a part, and a considerable part, of the witch-cult, they cannot, strictly speaking, be considered a psychic method of attack, and we only refer to them in these pages in order that their effects may be excluded from the diagnosis.\n\nThere are three factors in a psychic attack, any or all of which may be employed in a given instance.\n\nThe first of these is telepathic hypnotic suggestion.\n\nThe second is the reinforcement of the suggestion by the invocation of certain invisible agencies.\n\nThe third is the employment of some physical substance as a point d’appui, point of contact, or magnetic link.\n\nThe force employed may be used as direct current, transmitted by the mental concentration of the operator, or it may be reserved in a kind of psychic storage battery, which may be either an artificial elemental or a talisman.\n\nIn Chapter II we have considered in some detail the psychology of suggestion, and need not repeat what has already been said, save to remind the reader that the essence of telepathy consists in the sympathetic induction of vibration."


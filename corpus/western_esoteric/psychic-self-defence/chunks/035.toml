[content]
body = "It was, in fact, the same method that I was instructed to use in dealing with my were-wolf, but it is a much more formidable task to absorb and transmute the projection of another person than to absorb one’s own, and could only have been accomplished by an initiate of a very high grade, which Z.\n\nindubitably was.\n\nHis opinion concerning the case, though there was no means of obtaining independent confirmation of this, was that some Eastern European troops had been brought to the Western Front, and among these were individuals with the traditional knowledge of Black Magic for which South Eastern Europe has always enjoyed a sinister reputation among occultists.\n\nThese men, getting killed, knew how to avoid going to the Second Death, that is to say, the disintegration of the Astral Body, and maintained themselves in the etheric double by vampirising the wounded.\n\nNow vampirism is contagious; the person who is vampirised, being depleted of vitality, is a psychic vacuum, himself absorbing from anyone he comes across in order to refill his depleted resources of vitality.\n\nHe soon learns by experience the tricks of a vampire without realising their significance, and before he knows where he is, he is a full-blown vampire himself, vampirising others.\n\nThe earth-bound soul of a vampire sometimes attaches itself permanently to one individual if it succeeds in making a functioning vampire of him, systematically drawing its etheric nutriment from him, for, since he in his turn is re-supplying himself from others, he will not die from exhaustion as victims of vampires do in the ordinary way.\n\nZ.\n\nwas of the opinion that D.’s cousin was not the primary vampire in the case, but was himself a victim.\n\nBeing a youth of unstable morale, he speedily acquired the vampire tricks, and the earth-bound soul of some Magyar magician exploited him.\n\nThrough his act of biting and drawing blood from the neck of his cousin, this entity became transferred to young D., preferring pastures new to the depleted resources of its previous victim.\n\nProbably it alternated between the two, for it was not constantly with D.\n\nExactly what Z.\n\ndid we do not know, for he was exceedingly secretive concerning his methods, but in the light of subsequent knowledge I should imagine that he absorbed the etheric energy of the earthbound soul, and thus deprived it of its means of resisting the Second Death.\n\nMerely to drive the resisting soul out to the Judgment Hall of Osiris would have involved leaving behind an astral corpse, which for some time would have continued to give trouble.\n\nIt may be interesting to note in connection with this case that during the time that Miss L.\n\nwas at the occult college in Hampshire we had some rather curious happenings.\n\nThere was an outbreak among us of exceedingly bad “mosquito bites.” The bites themselves were not poisonous, but the stabs were of such a nature that they bled freely.\n\nI remember waking up one morning to find a patch of blood the size of the palm of my hand on the pillow; it had apparently come from a small puncture just behind the angle of the jaw.\n\nSeveral others had similar experiences.\n\nI have never seen anything like it, either before or since, nor did it occur again after Miss L.\n\nleft.\n\nI did not tell the adept Z.\n\nabout it at the time, and later, when I was reminded of the incident and mentioned it, the opportunity for investigation had gone by.\n\nHe expressed the opinion that it was a vampire’s work, and cited similar cases which he had met with in the course of his experience.\n\nHe said he had seen cases in Africa where the victim had become so bloodless that it was with difficulty that a specimen of blood could be obtained for examination, for it could hardly be induced to flow from the debilitated tissues.\n\nNothing can be done for such cases by medical science.\n\nThey are dying by inches, and yet no organic disease can be demonstrated."


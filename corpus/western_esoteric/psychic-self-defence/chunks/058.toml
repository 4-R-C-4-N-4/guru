[content]
body = "Enough must be hinted, however, to reveal what, under certain circumstances, may be experienced.\n\nI do not think it in the least likely, however, that the Qlippotic demons will be encountered save through the use of ceremonial magic.\n\nThey are as rare as anthrax in England, but it is as well to know the manner of their manifestation so that, when encountered, they may be recognised.\n\nThe great majority of dabblers in occultism are protected by their own ineptitude.\n\nThey fail to get results, and consequently come to no harm; but if they should succeed in getting results they would find that they had their hands full.\n\nThe serious student, unless he is working under skilled guidance, may also find himself in difficulties, and for various reasons.\n\nHe may be insufficiently experienced in the operation he has undertaken, for in magic theory is one thing and practice is another.\n\nA student of occult science will often take a formula out of a book and try to use it.\n\nHe ~night just as well study the instructions in a book on surgery and try to operate.\n\nMost formula are incomplete, there is always unwritten work.\n\nSome of the “barbarous names of evocation” which the uninitiated use as Words of Power, are really the initial letters of a mantric sentence or formula.\n\nI came across an invocation once in which the Word of Power was Tegatoo.\n\nOn investigation this turned out to be the battered remains of The Great Architect Of The Universe.\n\nEven an experienced occultist may get into difficulties if he attempts magical work when he is in bad health, over-tired, or has had even a moderate amount of alcohol, for very little is too much when the Invisible Forces are being handled.\n\nEqually does this apply to each of his assistants.\n\nA chain is no stronger than its weakest link, and if one of the team cannot handle the forces, everybody is going to suffer.\n\nA ritual lodge is no place for the well- meaning ineffectual.\n\nThere is an immense amount of dabbling in occultism going on today.\n\nMost of it is innocuous because it is totally ineffective; but there is never any knowing when one is going to strike a live wire.\n\nTake, for instance, the advertisers in various occult papers who offer to supply “charms that work.” One of two things is certain.\n\nEither they do not work at all, in which case one is wasting one’s money on them; or they work by means of some power with which they have been charged.\n\nWhat is the nature of that power, and did the persons who made the charm or talisman really know what they were about?\n\nDid they take the precaution to bind the baser aspect before magnetising with the higher aspect?\n\nThese are the elementary precautions of the practical occultist who has been properly trained.\n\nDid the maker of the talisman know them?\n\nAgain, one buys second-hand books on magic.\n\nWho was the previous owner and for what purposes were these books used?\n\nOr one buys a new book which has been brought out by some occult school for propaganda purposes.\n\nThese books are often magnetised before they are sent out, and so form a magnetic link between the purchaser and the Order which caused them to be issued.\n\nOr someone may join a group who has previously been associated with another occult group whose contacts were debased.\n\nUnless the proper precautions are taken, that person will bring the psychic contagion in with him, and his fellow-members may have unpleasant experiences.\n\nI well remember it being said to me by an occultist of great experience that two things are necessary for safety in occultism, right motives and right associates.\n\nWe lull ourselves into a false security if we believe that good intentions are sufficient protection.\n\nMy advice to the would-be student is to invoke the Master to send him an initiator, and to refuse to attempt any practical work until he is fully satisfied that the initiator has been found."


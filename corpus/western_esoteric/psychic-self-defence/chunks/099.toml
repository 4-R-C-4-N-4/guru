[content]
body = "In front of an old-fashioned four-poster bedstead stands a ferocious female armed with a rolling-pin, and from under the valance protrudes the head of her spouse, who says, “Ye may whack me, and ye may thwack me, but ye canna break my manly spirit, for I’ll no cam’ oot.” If the victim of an occult attack concentrates on mundane things he is a heart-breaking proposition for any sorcerer.\n\nWhat is the sorcerer to do if, at the time when he is operating the Black Art, his victim is at the local cinema roaring at the antics of Charley Chaplin?\n\nThere is an old saying that one nail drives out another.\n\nIf in fear of in visible dangers, take up a sport with an element of risk in it."


[content]
body = "WE have distinguished the various types of psychic attack, we have described the methods that can be employed in carrying them out, and we have also noted the various forms of delusion, fraud and auto-suggestion that may complicate the issue.\n\nWe are now in a position to discuss the question of diagnosis.\n\nLet us consider the whole matter from the practical point of view.\n\nSupposing a stranger comes with a story of a psychic attack, what should be our procedure?\n\nWe must first of all bear in mind that there is great need of caution in presuming that a psychic attack is being made.\n\nPsychic attacks are comparatively rare things.\n\nWe must not assume we are dealing with one until we have excluded all the other things it can possibly be.\n\nNot so long ago I came across a case of alleged obsession which turned out to be neglected constipation, and which was effectually exorcised with castor oil.\n\nIf there are any physical symptoms at all, even if they are no more than a bad colour or a bad breath, a diagnosis ought to be made by a qualified medical practitioner, for even if the trouble have a predominating psychic element, its origin may be physical.\n\nSeptic foci are really centres of decomposition, and as such they open the door to low forms of elemental life whose function is to assist in the return of dust to dust.\n\nImpurities in the blood-stream may poison the brain.\n\nNew growths or abscesses may derange its functions.\n\nThese things can only be recognised by the man who understands the body; other things being equal, the trained man is the better man, and the man with the best training is the best man, and the only place where an adequate training in diagnosis can be obtained is a general hospital.\n\nMoreover, should things turn out badly, the only person who can pull the chestnuts out of the fire is the person whose signature the authorities will accept on a certificate.\n\nSupposing the patient turns out to be a lunatic, what is the unqualified practitioner going to do with him?\n\nA very large proportion of the cases of alleged psychic attack turn out to be lunatics and hysterics.\n\nIncipient lunacy is a very hard thing to detect; hysteria is very cunning and plausible; a doctor who is handling human nature in bulk every day of his life will detect either of these two conditions much quicker than the layman who has never met them before.\n\nIt may be objected that it is a very difficult thing to find a doctor who will have a sympathetic attitude towards occultism.\n\nTo argue thus is to misunderstand the position.\n\nThe doctor is not being asked to co-operate with any occult operation, but to examine for physical disease, and if he finds it, to treat it.\n\nHe is no more concerned in the occult measures that are taken for the benefit of his patient than he is in the church his patient attends.\n\nIf the doctor finds no evidence of organic disease, or some complaint such as varicose veins which can obviously have no bearing on the mental condition, the case may be held to have passed the first test, and we may feel that it is worth while to proceed to the psychic investigation.\n\nIf the case is a bad one, or the trouble is of long standing, the doctor will probably find that the patient is debilitated, even if there is nothing definitely amiss, and will proceed to treat the condition accordingly.\n\nThis is all to the good, for the better the physical condition of the patient the more mental control and stamina he will have.\n\nSleeping-draughts, however, should be avoided if possible, and if they have to be administered, then the patient should be watched while he sleeps by someone who knows how to keep an occult guard, and the room in which he sleeps should be purified and sealed."


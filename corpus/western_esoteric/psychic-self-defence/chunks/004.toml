[content]
body = "My employer’s secretary came to my room one night, after “lights out,” and warned me that the Warden, as we called our employer, had found out who it was that had engineered “Auntie’s” escape, and I had better look out for trouble.\n\nKnowing her to be of an exceedingly revengeful nature, I knew that my best refuge was flight, but flight was not altogether easy to achieve.\n\nThe institution in which I was employed was an educational one, and a term’s notice had to be given before leaving.\n\nI did not look forward to working out that term under the unchecked control of a spiteful woman.\n\nSo I watched for an opportunity that should justify me in walking out.\n\nWith my employer’s uncontrolled temper it was not long to seek.\n\nI was up late the following night packing, in preparation for my intended flight, when there came to my room another member of the staff, a girl who seldom spoke, had no friends, and went about her work like an automaton.\n\nI had never had any dealings with her, and was more than surprised at her visit.\n\nIt was soon explained, however.\n\n“You are going to leave?” she said.\n\nI admitted that it was so.\n\n“Then go without seeing the Warden.\n\nYou will not get away if you don’t.\n\nI have tried several times, and I cannot get away.” However, I was young and confident in my untried strength, with no means of gauging the forces arrayed against me, and next morning, dressed for the journey and suitcase in hand, I went down and bearded my formidable employer in her den, determined to tell her what I thought of her and her methods, quite unsuspicious that anything save ordinary knavery and bullying was afoot.\n\nI was not allowed to get started with my carefully prepared speech, however.\n\nAs soon as she learnt that I was leaving, she said: “Very well, if you want to go, go you shall.\n\nBut before you go you have got to admit that you are incompetent and have no self-confidence.” To which I replied, being still full of fight, that if I were incompetent, why did she not dismiss me herself, and anyway, I was the product of her own training- school.\n\nWhich remark naturally did not improve matters.\n\nThen commenced a most extraordinary litany.\n\nShe resumed her old trick of fixing me with an intent gaze, and said: “You are incompetent, and you know it.\n\nYou have no self-confidence, and you have got to admit it.” To which I replied, “That is not true.\n\nI know my work, and you know I know it.” Now there was no doubt that much could be said concerning my competency in my first post at the age of twenty, with a great deal of responsibility on my shoulders, and newly inducted into a disorganised department; but nothing whatever could be said against my self- confidence, except that I had too much of it.\n\nI was quite prepared to rush in where archangels would have hung back in the collar.\n\nMy employer did not argue or abuse me.\n\nShe kept on with these two statements repeated like the responses of a litany.\n\nI entered her room at ten o’clock, and I left it at two.\n\nShe must have said these two phrases several hundreds of times.\n\nI entered it a strong and healthy girl.\n\nI left it a mental and physical wreck and was ill for three years.\n\nSome instinct warned me that if I admitted I were incompetent and had no self-confidence my nerve would be broken, and I would never be good for anything afterwards, and I recognised that this peculiar maneuver on the part of my employer was an act of revenge."


[content]
body = "Moreover, there is a considerable literature on the subject to be found in quarters where one would least expect it - in accounts of folk-lore and ethnology, in the State Records of witch-trials, and even under the guise of fiction.\n\nThese independent records, by people in no way interested in psychic phenomena, confirm the statements made by those who have experienced occult attacks.\n\nOn the other hand, we have to distinguish very carefully between psychic experience and subjective hallucination; we have to be sure that the person who complains of a psychic assault is not hearing the reverberation of his own dissociated complexes.\n\nThe differential diagnosis between hysteria, insanity and psychic attack is an exceedingly delicate and difficult operation, for so frequently a case is not clear-cut, more than one element being present; a severe psychic attack causing a mental breakdown, and a mental breakdown laying its victim open to invasion from the Unseen.\n\nAll these factors have to be borne in mind when investigating an alleged occult attack, and it shall be my task in these pages not only to indicate the methods of occult defence, but also to show the methods of differential diagnosis.\n\nIt is very necessary, with so much occult knowledge about, that people should know an occult attack when they see it.\n\nThese things are much more common than is generally realised.\n\nThe recent tragedy in Iona gives point to this assertion.\n\nNo occultist is under any illusion as to that death being from natural causes.\n\nIn my own experience I have known of similar deaths.\n\nIn my novel, The Secrets of Dr.\n\nTaverner, there were presented, under the guise of fiction, a number of cases illustrative of the hypotheses of occult science.\n\nSome of these stories were built up to show the operation of the invisible forces; others were drawn from actual cases; and some of these were written down rather than written up in order to render them readable by the general public.\n\nSo much first-hand experience, confirmed by independent evidence, should not go unregarded, especially since rational explanations are difficult to find save in terms of the occult hypotheses.\n\nIt may be possible to explain away each individual case mentioned in these pages by alleging hallucination, fraud, hysteria, or plain lying, but it is not possible to explain the sum-total of them in this way.\n\nThere cannot be so much smoke without some fire.\n\nIt is not possible that the prestige of the magician in antiquity and the dread of the witch in the Middle Ages could have arisen without some basis in experience.\n\nThe vapourings of the wise woman would be no more heeded than those of the village idiot if no painful consequences had ever been found to follow upon them.\n\nFear was the motive of these persecutions, and fear founded upon bitter experience; for it was not officialdom which incited the witch-burnings, but whole country-sides that rose up for a lynching.\n\nThe universal horror of the witch must have some cause behind it.\n\nThe labyrinthine windings of the Left-hand Path are as extensive as they are devious; but while exposing them in something, at any rate, of their horror, I still maintain that the Right-hand Path of initiation and occult knowledge is a way to the loftiest mystical experiences and a means of lifting the burden of human suffering.\n\nNot every student of this knowledge necessarily abuses it; there are many, nay, the great majority, who hold it selflessly in trust for mankind, using it to heal and bless and redeem that which is lost.\n\nIt may well be asked, If this knowledge can be so disastrously abused, why should its veil ever be lifted?\n\nWhat answer is made to this question is a matter of temperament.\n\nSome will maintain that knowledge of whatever kind cannot be without its value.\n\nOther may say we had better let sleeping dogs lie.\n\nThe trouble is, however, that sleeping dogs have an unfortunate knack of waking up spontaneously."


[content]
body = "In the Name of God the Father Almighty, Who decreed a firmament in the midst of the waters, and of Jesus Christ His Son our Saviour, I consecrate thee (+) to the service of God, in the Name of the Father and of the Son and of the Holy Ghost.\n\nAmen.” “(Casting the salt into the water.) We pray Thee, O God, Lord of Heaven and earth, and of all that in them is, both visible and invisible, that Thou mayest stretch forth the right hand of Thy power upon these creatures of the elements and hallow them in Thy holy Name.\n\nGrant that this salt may make for health of body and this water for health of soul, and that there may be banished from the place where they are used every power of adversity and every illusion and artifice of evil, for the sake of Jesus Christ our Saviour.\n\nAmen.” The water thus consecrated may be used as a bath, or for making the Sign of Cross upon the forehead, or for sprinkling about a place.\n\nWhen thus using it, the following prayer may be employed.\n\n“In the Name which is above every other name, and in the power of the Father and of the Son and of the Holy Ghost, I exorcise all influences and seeds of evil; I lay upon them the spell of Christ’s Holy Church, that they may be bound fast as with chains and cast into outer darkness, that they trouble not the servants of God.” In pointing or making the Sign of the Cross (+) , the first and second fingers are extended and the third and fourth are bent towards the palm of the hand and the thumb laid upon their nails.\n\nWhen the hand is extended in blessing over the salt and water, it is held flat, fingers together and parallel, and thumb stretched at right angles to the fore finger.\n\nIf there is sufficient occult force at work to produce physical phenomena, it is very advisable to take precautions to prevent materialisations taking place.\n\nThe physical phenomena are of several types.\n\nThey may take the form of noises, usually creakings, thuds, or more rarely bell-like notes or wailing sounds.\n\nIf actual words are heard, auditory hallucinations should be suspected, for in the absence of a medium, spirit messages are given to the inner ear, not to the auditory nerve.\n\nLights may also be seen, usually taking the form of dim balls of luminous mist drifting like soap-bubbles.\n\nThey may be any size from mere points of light to considerable dimensions, some six feet or more in diameter.\n\nIn these spheres of dim luminosity psychics can generally see forms, sometimes human, sometimes from the animal kingdom.\n\nWhitish-grey clouds can also sometimes be seen, rising pillar-wise from the floor like smoke.\n\nThese are usually fixed to one place and do not move about the room as do the spheres of light, such movement as occurs being within themselves, like the eddyings of smoke caught under a tumbler.\n\nMore rarely a distinctive odour may be noticed, and still more rarely there may be precipitations of powdery substances or slime.\n\nLight objects also may be overturned or thrown about the room.\n\nThere are certain substances which experience has proved to be effectual in preventing the condensation of etheric energy from taking place.\n\nCamphor dissolved in vinegar and placed in saucers about the room will cope effectually with low degrees of force, but for higher potencies nitric acid is the best thing to use, a small quantity being poured into a saucer and exposed to the air.\n\nIt is best to use it well diluted to prevent accidents, for it is not the strength of the acid in the saucer that is efficacious, but its evaporation into the air, and it will evaporate just as well when diluted as when neat.\n\nIn what manner it works I have not the slightest idea, but its value is well known among psychic experimenters."


[content]
body = "Next morning I visited her to see how she was getting on, and found her sitting up in bed eating a hearty breakfast and looking an entirely different woman to the grey-faced, exhausted creature I had seen the day before.\n\nWithout waiting for any enquiry from me, she said, “I don’t know what has been done, but I feel as if something has been broken and I am free.” After breakfast she got up, went for a stroll, and met the doctor who was attending her in the street.\n\nSo great was the change in her appearance that he failed to recognise her until she spoke to him.\n\nI told her that in my opinion she ought to have nothing whatever to do with occult studies lest she re-form the magnetic link with her old Order, and also taught her how to prevent her subconscious mind from giving disruptive suggestions to her bodily systems of functional control.\n\nFor some years she remained in good health, but later, unfortunately, took up the study of occultism again and relapsed into a condition approximating to her previous one, having presumably re-forged the contacts with the Thibetan Brotherhood which had proved so disastrous to her."


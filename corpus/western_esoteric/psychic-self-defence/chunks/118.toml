[content]
body = "If the rapport is perceived as a line of light, a cord, or any similar form, attached to the solar plexus, the forehead, or any other part of the body, the best way of severing the rapport is to forge a magical weapon and cut it.\n\nIn fact, if a rapport is felt, the first thing to do is to visualise the cord and try to see where it attaches; the solar plexus is the commonest place.\n\nNext formulate the cross-handled sword as already described, and invoke God’s blessing upon it.\n\nThen visualise a flaming torch, and invoke the power of the Holy Ghost, whose symbol it is.\n\nNow with the sword hack through the cord or ray until every shred is severed.\n\nThen sear the stump with the consecrated fire of the torch until it shrivels up and falls off from its point of attachment to your body.\n\nAfter such a severing one must, of course, take the ordinary human precautions to prevent the link being re-formed.\n\nRefuse to meet the person responsible for its formulation, or to either read or answer letters from him.\n\nIn fact, cut off physical communications as thoroughly and resolutely as one has cut off astral ones for a period of some months at least.\n\nThere are occasions, however, when a person is so completely overshadowed and dominated that he cannot perform this operation for himself.\n\nThe magical operation of Substitution can then be performed, if he can find a friend ready to undertake the task.\n\nIn order to perform this operation, the two friends agree that it shall be done, but the one who is to become the substitute does not tell the original victim when he proposes to undertake the operation lest that latter should be so completely in the hands of the dominator that he should give the game away involuntarily.\n\nChoosing a time at which he is sure his friend is asleep, the substitute concentrates upon him and imagines himself to be standing beside him, and visualises the cord or ray of the rapport stretching from his friend out into space.\n\nIf he can visualise its other point of attachment in the dominator, so much the better.\n\nHe then formulates the sword and the torch as above described, and with these in his hands he imagines himself stepping right through the line of rapport, so as to break it with his body.\n\nHe must not use either sword or torch for this process, but break it with his own flesh, as it were.\n\nHaving thus severed it from his friend, he should then go for it with sword and torch with all his strength as it tries to enwrap him, as it assuredly will do, for it resembles nothing so much as the tentacle of an octopus.\n\nHe should go for it hammer and tongs, making up in zeal what he lacks in knowledge, until it has had enough, and begins to curl up and withdraw.\n\nThe combat, of course, takes place in the imagination, but if a clear and vivid image is produced it will be effectual.\n\nIn illustration of this method I may mention a case I once handled by its means.\n\nI was asked if I could help a woman who had been a lifelong invalid, but whose case the many doctors she had consulted were neither able to diagnose satisfactorily, nor to help.\n\nThey all agreed that there was nothing organic the matter with her, and after trying in vain to get her better, they generally united in saying that it was pure hysteria.\n\nShe suffered from a chronic condition of exhaustion, indigestion, attacks of vomiting, blinding headache and palpitation of the heart.\n\nShe was, however, not in the least of a neurotic disposition, but a quiet, sensible, intellectual woman, bearing her sufferings with fortitude.\n\nI made a psychic diagnosis and came to the following conclusion."


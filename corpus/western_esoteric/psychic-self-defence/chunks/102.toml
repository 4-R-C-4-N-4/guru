[content]
body = "While awaiting these returns, and while his mind is still uninfluenced by them, the occultist should make his own independent diagnosis.\n\nIn order to do this he should have at least two interviews with his patient.\n\nIn the first he should hear the case-history, allowing the patient to present the facts in his own way, without guidance or leading questions.\n\nImmediately the patient has left, the operator should write out the case-history with as much detail as he can recall.\n\nIt is exceedingly undesirable to take notes in the presence of a patient, because it makes him nervous, for he feels that, in the words of the police-court, “everything he is saying will be taken down and used as evidence against him.” In preparation for the second interview the occultist should study this record carefully and have its points and sequence clear in his mind.\n\nNow is the time to question the patient concerning any discrepancies or hiatuses.\n\nThis proceeding will reveal the liar, whether deliberate or hysterical, quicker than anything else, for the discrepancies of his second statement will be clearly revealed against the written record of his first.\n\nIf he is telling the truth, the two statements will be in agreement.\n\nIf he is distorting the facts, he will soon contradict himself.\n\nRemember that you are dealing with a person who has something of either the psychic or the neurotic, or very likely both, in his disposition, and that your attitude towards him, and even your unspoken thoughts, will influence him profoundly.\n\nIf he feels that you are doubting his veracity, he will lose his self-confidence and begin to think that his experiences may, after all, be the fruits of his own imagination.\n\nConsequently, he will suppress things which may be all-important from the diagnostic standpoint.\n\nIt is in this outpouring of relevant and irrelevant detail that you are going to find your clues.\n\nThere are certain landmarks which you want to look out for in taking this case-history, but you do not want to let your patient realise what you are looking for, because if you have won his confidence, he will be very apt to take on your view-point, and if he sees you have formed any opinion, he will unconsciously twist incidents so that they fit in with that opinion.\n\nDo not allow him to guess the bearing of your questions, and then you will obtain from him an unbiassed response.\n\nIn order to prevent his guessing what you are driving at, do not ask a series of questions elucidating information on a specific point.\n\nThere will probably be several points on which you want information.\n\nAsk questions upon first one and then another of these.\n\nFor instance, if you suspect that the trouble may be due to the house in which your patient is living, the last thing you want to do is to rouse his suspicions in this respect lest you should be on a false scent.\n\nAnd even if you should prove to be on the right track, you do not want to disclose the facts to him until you are ready to act, for by increasing his apprehensions you will increase his sufferings.\n\nIf you suspect that sex plays a part in his trouble, and he guesses the trend of your questionings, he will immediately cover his tracks, and you will find it very difficult to get at the facts at all.\n\nWhereas, if his suspicions are not aroused, he will reveal himself to an astute and experienced questioner who approaches him indirectly, without realising that he has done so.\n\nBy approaching thus indirectly you not only get at the real facts of the case, but spare his feelings.\n\nIn taking a case-history you want to look for correlations between your patient’s psychic experiences and the circumstances of his life.\n\nDates and places therefore should be sedulously sought for.\n\nWhen did the trouble start, and where?\n\nHaving obtained as detailed information as possible on these two points, set out to see whether any occult significance is to be found in it."


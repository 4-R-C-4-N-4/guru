[content]
body = "Let us, then, in meditation, use symbols to concentrate our attention; we shall find this much easier than meditation in terms of abstract thought.\n\nIndeed, in times of stress and crisis, abstract thought may be impossible for us unless we are very experienced in its use; but we shall seldom reach a state when we cannot picture the Cross and call upon the Name of Christ.\n\nOccult attacks may be divided into two types, those which take place by means of thought-forms, and those which operate by means of a current of force.\n\nBut even in the latter case the current of force soon gathers to itself or germinates thought-forms congenial to its nature.\n\nTherefore in every psychic disturbance the thought-form is a factor which has to be considered and dealt with, and which, in fact, forms the readiest means of diagnosis; for it is by the perception of the associated thought-forms that the experienced psychic is able to detect the nature of the attack.\n\nThought-force is a thing which has no relation to geographical position, but is a matter of pure consciousness and of tuning in to its key-note.\n\nWe can pick up the forces of dead faiths a thousand years after the death of their last votary, and upon the opposite side of the globe to that in which they flourished.\n\nBut thought-forms are a different matter.\n\nThey have position in space, and although they can be moved about with the speed of thought, and can be withdrawn to the subtlest level of the astral and there anchored to an idea and thus prevented from impinging upon the planes of form for all practical purposes, nevertheless, although they do not occupy space, they can be referred to definite positions in space.\n\nThey can, for instance, be associated with a particular object, and will follow that object about, remaining within its magnetic field.\n\nThe immediate magnetic field is anything from twelve to thirty feet; the remote magnetic field from a hundred to three hundred yards.\n\nPowerful holy centres, like Glastonbury or Lourdes, have a bigger magnetic field than this, extending possibly to a couple of miles; they are also inter-connected among themselves by lines of force.\n\nThese things have to be taken into account in practical occult work.\n\nWhen we are confronted by a disturbing influence emanating from a focus of power, such as the site of an old temple, we have got to deal with the remote magnetic field by means of ceremonial.\n\nAs this is a method that can only be used by a high-grade initiate, we will not consider it here.\n\nFor all practical purposes in a psychic attack it is the immediate magnetic field that has to be considered.\n\nThe best method to deal with this is to make a magic circle.\n\nA mere banishing by itself is not so effective as a banishing performed within a circle, because the circle will effectually prevent the banished forces from flowing back again.\n\nThere are various methods of performing this operation, but the principle of all valid ones is the same.\n\nThe more potent conjurations cannot be given in these pages, because their effective use depends upon the grade of initiation possessed by the person who proposes to use them, and to possess a formula without the grade to which it belongs is as unsatisfactory as possessing a gun without any knowledge of shooting.\n\nThe formula I will give will be found effectual for all ordinary conditions.\n\nExtra-ordinary conditions can only be dealt with by a person who has had experience.\n\nIn making the magic circle the operator stands upright facing east.\n\nHe faces east because the magnetic current on which he proposes to operate runs from east to west.\n\nHis first procedure must be to steady his own vibrations and purify his aura.\n\nIn order to do this, he makes the Qabalistic Cross on breast and brow."


body = "It soon became noticeable that she, who had previously had a very lovable and gentle disposition, was gradually changing, so that not only in temperament, but in facial expression, she was growing like her late husband.\n\nNext a curious thing ensued.\n\nHer husband had died of an inflammatory spinal lesion which caused no pain at the site of the trouble, but intense pain in the nerves that issued from the spine at that point, so that the pain was referred to a particular distribution in the hands and arms, more upon one side than the other.\n\nThis lady developed a severe neuritis that exactly corresponded in its distribution to her late husband’s symptoms.\n\nAnother illustrative case is that of Miss E., whose fiancé was killed during the War.\n\nShe says in a letter written to the person whom she consulted with regard to her problem: “I was able to rise above the loss and separation at the time, but six months later I suffered nervous breakdown, from this time I have been troubled with weak nerves.\n\nFor the last two months I have been having very extraordinary experiences which are causing me much perplexity and rendering me unfit for work.\n\nIt is a night experience and has not once occurred during the day.\n\nAfter I have composed myself for sleep I find that gradually my body is losing all sensation; it feels as if I was being slowly frozen stiff.\n\n(I don’t know how else to describe it.) At this stage I can sometimes rouse myself and overcome it, but I cannot always do this.\n\nMy efforts to rouse myself are in vain, and although fully conscious I feel unable to move or call.\n\nUsually after this I sink into some kind of sleep.\n\nI have all kinds of experiences.\n\nSometimes I visit strange places and talk with people I don’t know.\n\nSometimes my experiences are beautiful beyond description; sometimes I am threatened with danger of drowning or falling, but in these cases I always rise in the air and travel for miles, it seems to me.\n\nSometimes I feel that I am just floating in the air.\n\nHow long the dream lasts I cannot tell.\n\nWhen I wakeup, however, I have great difficulty in moving for some time; but gradually I regain the power to move about, and after a lot of stinging sensation in the limbs I get up, usually feeling very tired and unrefreshed, but sometimes I feel none the worse for the strange experience.\n\nBut it is under mining my health and happiness, and it cannot be good.” In conversation she amplified the statements in her letter, and said that during the experiences described, someone, she thought it was her fiancé, was trying to prevent her from getting back into her body again after these nocturnal expeditions.\n\nThe case was entirely cleared up in one week by means of telepathic treatment.\n\nThe notes on the manner in which the work was done are of considerable interest.\n\n“The treatment was given to the entity that was causing the trouble, not merely to the patient, and it was the release of the obsessor from his plane of work and helping him Heavenward that gave freedom to his victim.” In the other type of haunting, that in which it is the place which is the focus of manifestation, not a special person, we must distinguish between the earth-bound entity which remains attached to a particular spot, and the thought-atmosphere which is left behind after violent emotions have been experienced there.\n\nLet us consider first the question of thought-atmosphere, of which I can give a very illuminating example.\n\nA friend of mine who was a student at a school of dramatic art consulted me concerning an attack of stage fright she had had, which left her rather nervous as to its recurrence.\n\nShe was an experienced student, in fact a pupil teacher, and she was having some extra tuition from the head of the school.\n\nGoing for her lesson one afternoon, she found that her teacher had just finished taking the junior students for their end-of-the-term examination in elocution."


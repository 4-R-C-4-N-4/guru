[content]
body = "IF we look at the universe around us we cannot fail to realise that there must be some overruling plan co-ordinating its infinite complexity.\n\nIf we take into our hands and examine minutely any living thing, however simple, equally must we realise that the ordered diversity of its parts is built up on a determining framework.\n\nScience has sought in vain for this organising principle; it will never find it on the physical plane, for it is not physical.\n\nIt is not the inherent nature of atoms which causes them to arrange themselves in the complex patterns of living tissues.\n\nThe driving forces of the universe, the framework upon which it is built up in all its parts, belong to another phase of manifestation than our physical plane, having other dimensions than the three to which we are habituated, and perceived by other modes of consciousness than those to which we are accustomed.\n\nWe live in the midst of invisible forces whose effects alone we perceive.\n\nWe move among invisible forms whose actions we very often do not perceive at all, though we may be profoundly affected by them.\n\nIn this mind-side of nature, invisible to our senses, intangible to our instruments of precision, many things can happen that are not without their echo on the physical plane.\n\nThere are beings that live in this invisible world as fish live in the sea.\n\nThere are men and women with trained minds, or special aptitudes, who can enter into this invisible world as a diver descends to the ocean-bed.\n\nThere are also times when, as happens to a land when the sea-dykes break, the invisible forces flow in upon us and swamp our lives.\n\nNormally this does not occur.\n\nWe are protected by our very incapacity to perceive these invisible forces.\n\nThere are four conditions, however, in which the veil may be rent and we may meet the Unseen.\n\nWe may find ourselves in a place where these forces are concentrated.\n\nWe may meet people who are handling these forces.\n\nWe may ourselves go out to meet the Unseen, led by our interest in it, and get out of our depth before we know where we are; or we may fall victim to certain pathological conditions which rend the veil.\n\nThe Threshold of the Unseen is a treacherous coast on which to bathe.\n\nThere are potholes and currents and quicksands.\n\nThe strong swimmer, who knows ±he coast, may venture in comparative safety.\n\nThe non-swimmer, who takes counsel of nothing but his own impulses, may pay for his temerity with his life.\n\nBut we must not make the mistake of thinking that these invisible forces are necessarily evil and inimical to humanity.\n\nThey are no more inimical in themselves than are water or fire, but they are potent.\n\nIf we run counter to them, the result is disastrous for us, for we have broken a natural law; but they are not out to attack us, any more than we are out to attack them.\n\nWe must face the fact, however, that men and women with knowledge of these things, have, both in the past and in the present, used that knowledge unscrupulously, and that we may find our selves involved in the results of their actions.\n\nIt may safely be said that the Unseen is only evil and inimical to humanity when it has been corrupted and perverted by the activities of these unscrupulous men and women, whom initiates call adepts of the Left-hand Path.\n\nWe must consider the outward and visible signs of psychic attack before we are in a position to analyse the nature of such attacks and indicate their source of origin.\n\nIt is a fundamental rule that diagnosis must precede treatment.\n\nThere are many different kinds of psychic attacks, and the methods that will dispose of one will be ineffectual against another.\n\nThe commonest form of psychic attack is that which proceeds from the ignorant or malignant mind of our fellow human beings."


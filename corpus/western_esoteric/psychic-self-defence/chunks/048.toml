[content]
body = "In all cases the physical, etheric and astral bodies are involved; the vortex therefore always reaches as far as the astral plane; a soul upon the astral plane may be drawn into this vortex if it is ripe for incarnation, and thus enter the sphere of the parents.\n\nIf the vortex extends higher than the astral plane, souls of a different type may enter this sphere, but such extension is rare, and therefore it is said that man is born of desire, for few are born of anything else.\n\nBut this vortex may not only extend vertically up the planes (speaking metaphorically), but it may also, under certain conditions, be deflected, as it were, out of the normal human line of evolution, so that its open end extends into the sphere of evolution of another type of life.\n\nUnder such circumstances it is theoretically possible for a being of a parallel evolution to be drawn into incarnation in a human body.\n\nOccultists hold that this occasionally occurs, and explains certain types of non-pathological abnormality which are occasionally met with.\n\nThese non-humans are either adored or hated by their human associates.\n\nThey have a peculiar fascination for certain types of temperament, the types that psychologists call the unstable.\n\nIn these types the subconscious comes very near to the surface, deep calls to deep, and they are instinctively drawn towards the elemental kingdoms.\n\nThere is nothing more disastrous than marriage with a non-human, for they have nothing in their nature that can satisfy the normal human yearnings for affection and sympathy.\n\nThe one saving feature in such a union is that grounds for divorce are invariably readily available, for the morals of the non-human are those of the barnyard.\n\nThe power of non-humans to injure their enemies is comparatively small, for they are aliens in a strange land when incarnated in human form, and cannot avail themselves of any of the ordinary human resources of mischief.\n\nThey are, in fact, singularly defenceless and helpless, and themselves suffer acutely at the hands of society.\n\nIt is otherwise, however, in their relations with their friends.\n\nThey seem to have an infinite capacity for inflicting hurt on those who love them.\n\nNot deliberately or maliciously, but like a child pulling flies to pieces out of idleness, not realising what it is doing.\n\nObeying the laws of their own nature, they are destructive to beings of the human evolution.\n\nYet what other laws can they obey?\n\nFor them to submit to our standards is to deny their deepest instincts.\n\nThe effect they have upon those who love them constitutes such a well-marked syndrome among the psychic pathologies that we must consider it in detail.\n\nThe person who forms a rapport with a non-human becomes deeply stirred by the elemental forces that find ingress to our sphere through the channel of this wandering and alien soul.\n\nHe becomes, as it were, drawn away from normal human things and set wandering upon the confines of the fairy kingdom, and yet he can find there no rest for his foot and no sustenance for his soul.\n\nThe story of the handsome fisher-lad and the mermaid is indicative of this condition.\n\nShe loves him, draws him to her and he drowns, for he cannot live in the element of water.\n\nThe explanation of the curious power, both of fascination and destruction, which is exercised by non-humans may lie in the fact that they belong to one element only, whereas in man all four are combined.\n\nAny elemental contact is stimulating to us, because elemental beings pour forth in abundance the vitality of their own particular sphere, and this vitalises the corresponding element in ourselves.\n\nBut if a four-element creature is drawn into the sphere of a single element he is poisoned by an overdose of the one element in which he finds himself, and starved of the other three.\n\nIt is for this reason that mortals in the fairy kingdom are always said to be enchanted or asleep."


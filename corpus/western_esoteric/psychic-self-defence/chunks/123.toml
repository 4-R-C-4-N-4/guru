[content]
body = "It should be invoked in every operation of psychic self-defence where any human element, incarnate or discarnate, is concerned.\n\nWhere non-human elements, such as elementals, thought-forms, or the Qlippoth, have to be dealt with, it is the power of God the Father, as Creator of the universe, that is invoked, His supremacy over all the kingdoms of nature, visible and invisible, being affirmed.\n\nGod the Holy Ghost is the force that is employed in initiations, and it should not be invoked during times of psychic difficulty, as its influence will tend to intensify the condition and render the Veil yet thinner.\n\nThere is a very curious aspect of the occult field concerning which something must be said in the present pages, though not a great deal can be revealed, and, to be frank, I do not know a great deal about it myself, but only such aspects as I have actually come across.\n\nI have always heard it called the Occult Police; others may know it by different names but I believe it to be a very real and concrete thing, though its organisation is not upon the physical plane, nor, so far as I know, are its mundane activities gathered up into any single pair of hands.\n\nI have crossed its trail upon a number of occasions, and played my part in its activities, and I have talked with others who have also been concerned in it, and they have always said as I do, that it is the inner voice and circumstances alone that direct our activities when we co-operate with this mysterious organisation.\n\nI think myself that it is organised in national units, for people seem to go in and out of jurisdictions, or to be passed on from one to another.\n\nIn my experience it has no particular political bias, but concerns itself solely with occult methods applied to criminal ends and offences against society.\n\nOne or two illustrative cases may help to make the matter clear.\n\nSome complications arose at one time over an Indian occultist who was visiting this country in order to found a school.\n\nHe was deeply involved in the politics of his own country, and there could be no doubt about it that he disliked the English and all their ways very much indeed.\n\nI think that I was the only pure-blooded Anglo-Saxon who was in touch with him.\n\nAs far as I know, he did not concern himself with mundane plane political activities, his idea being to organise a meditation group which should pour the regenerative spiritual force of the East into the group- soul of the British Empire, which he declared was in a very bad way indeed.\n\nI maintained, however, that the group-soul was not dying, as he held, but very tired, for it was immediately after the War.\n\nMoreover, I could not see how any body who disliked it so very much was going to be able to regenerate it.\n\nNor was I sure that the regeneration was going to be to our taste if we were to get it.\n\nThis man, whom I will call X., was of an intense spiritual pride, and his root-idea was that England must acknowledge the spiritual supremacy of India and take her spiritual inspiration from the East.\n\nI was young and inexperienced at the time, but I began to ask myself what manner of spiritual force was going to be poured in through the channel we were constructing.\n\nSup posing during the War a group of English Occultists had tried to perform a similar service for Germany, what line would they have taken?\n\nWould they not have tried to influence the German group-mind to give up its militarist ideals and concentrate on the League of Nations?\n\nWas it not more than likely that our Indian friend was trying to disabuse us of our Imperialistic tendencies?\n\nWould it not appear to him, smarting as he was under the race prejudice of the white man, that the world would be a much better place for humanity if the English cultivated their own garden and let other people alone?"


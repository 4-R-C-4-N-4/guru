[content]
body = "A great deal of relief can be given to lunatics by breaking up the thought-forms that are surrounding them, but unfortunately the relief is short-lived; for unless the cause of the illness can be dealt with, a fresh batch of thought-forms is built up as soon as the original ones are destroyed."


[content]
body = "Experimental psychologists are already suspecting that emotion is closely akin to electricity; they have proved conclusively that emotional states alter the electrical conductivity of the body.\n\nThe occultist believes that emotion is a force of an electrical type, and that in the case of the ordinary man it radiates out from him in all directions, forming a magnetic field; but in the case of the trained occultist it can be concentrated into a beam and directed.\n\nSupposing you are able to concentrate your whole attention upon a single feeling, inhibiting all else, you will have achieved a pure emotional state, unadulterated and undiluted.\n\nAll the life-force coming into your soul will therefore flow in this single subdivision of a single channel instead of in the many ramifications of the usual three channels previously referred to.\n\nThe concentration will be terrific, but it will only be achieved at a terrific price.\n\nIt is in order to achieve this terrible concentration that the saints of the West and the yogis of the East practise a torturing asceticism.\n\nYou must sell all that you possess in order to purchase this pearl of great price, and an echo of the method lingers in the fairy-tale tradition that the person who finds the lucky stone can only have one wish.\n\nSuch a concentration is good for one purpose, and one purpose only.\n\nWe can concentrate on a healing, or on a destruction, but we cannot work at both simultaneously; neither can we readily change over from one to the other.\n\nWe cannot com bine incompatibles within the limits of a single life.\n\nThat is to say, if we have concentrated on a work of malediction and death in order to achieve an act of revenge, our rage being satiated, we cannot immediately reverse the spin of the soul and reconcentrate upon works of wisdom and redemption.\n\nWe may liken the soul moving with the tide of evolution to a wheel spinning clockwise, or deosil; and a soul moving against the tide of evolution to a wheel spinning counter clockwise, or widdershins.\n\nThe position of the axle can be altered so that the wheel revolves at any angle without the direction of its revolution being effected, but the flywheel has to be stopped before the engine can be reversed, and a big flywheel takes a great deal of stopping.\n\nMoreover, in order to reverse the flywheel, we have to stop the engine.\n\nThe normal movement of the soul is deosil, forward with the current of evolution.\n\nWe need to think many times before we undertake to reverse that spin even momentarily, in order to undertake a work of malediction and death.\n\nThe old saying, “There is the devil to pay,” is a true one.\n\nIndeed, it is questionable whether there is such a thing as a momentary reversal of spin.\n\nMomentum has to be checked and worked up again before reversal of spin can take place.\n\nVery great forces can be developed by this subjective concentration of the mind itself, but even greater forces can be rendered available if we apply the mechanical equivalent of gearing; if, in other words, while this tremendous concentration is being held, we pick up the contacts of the corresponding cosmic force.\n\nWe use the powers of the human mind as a self-starter, and as soon as its lesser driving- wheel is flying round merrily, we throw in the clutch of the main engine.\n\nThere is a brief period of struggle as the little machine forces over the reluctant levers of the great machine, then the vapour fires and the engine takes up its work.\n\nAfter that it is only a matter of engaging the gears and driving - if you can!\n\nSo it is with ceremonial magic.\n\nLet us consider a concrete case of someone who wants to avail himself of a fighting force.\n\nHe would have recourse to a ceremony of the planet Mars.\n\nHe would therefore gather together in his temple all that was appropriate to Mars."


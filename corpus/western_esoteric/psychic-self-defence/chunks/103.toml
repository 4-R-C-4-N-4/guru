[content]
body = "Note the dates carefully, and turn them up in an ephemeris of those years, and observe how the moon stood in relation to them, also the planets.\n\nObserve whether they fell on or about the equinoxes or solstices.\n\nNote also the days of the week upon which they occurred.\n\nIf you found that all the crises of the case occurred on Thursdays, or round about the Vernal Equinox, or at the full moon, you would have a piece of information which was of considerable significance.\n\nYou would be sure of one thing, at any rate, that you were dealing with a case in which the invisible psychic tides played a part.\n\nInformation should also be sought concerning the place or places in which the different crises of the trouble took place, and especially the circumstances attending its first onset.\n\nIt is exceedingly useful if possible to visit the place and sense its atmosphere.\n\nA very great deal can also be learnt from visiting the place where the patient is living.\n\nHaving obtained such geographical information as you can, study it carefully in connection with a large-scale Ordnance map.\n\nAccess to this, and to all relevant information desired, can readily be obtained at any public library.\n\nNote whether there are any prehistoric remains in the neighbourhood, and if so, how the house bears in relation to them.\n\nObserve not only whether it is near any of them, but whether it is in a direct line between any two of them.\n\nLook up the history of the district, and see whether it affords any further information.\n\nRoman remains are often at the bottom of the trouble, for the legions brought some very queer cults with them in the days of Rome’s decadence.\n\nDruid remains, too, should be suspect if they are near neighbours.\n\nEnquire also concerning any unusual objects in the house, such as images of the deities of primitive cults or savage weapons.\n\nIt is quite possible that powerful elementals are attached to these.\n\nEnquire whether the trouble seems to lift when the patient goes away to another place.\n\nIf the reply is in the affirmative, it may safely be presumed that local conditions are at the bottom of the trouble.\n\nBut if the reply is in the negative, it does not necessarily follow that the opposite is the case.\n\nIt may also be that the trouble does not depend upon the place, but upon some person residing at the place.\n\nNever forget that in the great majority of cases that person’s harmful influence is due to an unfortunate psychic make-up rather than deliberate abuse of occult knowledge.\n\nBe very slow to accept the latter hypothesis, for its occurrence is comparatively rare.\n\nAnd even if the person suspected is known to have occult knowledge and can be proved to be antagonistic to the patient, it does not necessarily follow that the attack is conscious and deliberate.\n\nIt may be unconscious and reflex.\n\nIt is quite true that an occultist ought to have sufficient control over his vehicles to prevent them from acting independently of his will and consciousness; but this is not always the case.\n\nPeople are at many different stages of development.\n\nThere is always a difficult period between the awakening of the higher powers and their full control.\n\nEnquiries should also be made concerning the nature of the dreams, and whether the patient is subject to night mares apart from any question of occult attack.\n\nAlso whether he has ever had any other psychic experiences, and if so, of what nature.\n\nFinally, a careful enquiry should be made concerning the patient’s associates, as to whether any of them are psychic, or students of the occult.\n\nBe very careful, however, not to cast suspicion upon any person unless you have conclusive evidence and it is essential to do so in order to save the patient.\n\nRemember it is always possible that you may be mistaken.\n\nA case was reported in the papers not so long ago of a man who committed suicide because a doctor told him that he had organic heart disease and ought not to marry the girl he was engaged to."


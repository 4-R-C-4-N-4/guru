[content]
body = "If the problem of psychic self-defence is to be adequately dealt with, we must have an understanding of a subject upon which very little has been written - the nature of the forces of intelligent and organised evil.\n\nThe great faiths of the ancient world all had their evil gods as well as their beneficent deities, and they did not call these evil gods devils.\n\nIn Hinduism we have Shiva and Kali; in the Egyptian system we have Set and Besz and Typhon; in the Grecian pantheon there are Pluto and Hecate.\n\nAll the other faiths, also, have their angelic choirs, their Archons, or builders, and all the hierarchy of heaven.\n\nProtestant Christianity alone has forgotten its angiology, the Creator has to be both Architect of the Universe and Bricklayer, forming man from the dust of the ground without assistance.\n\nIf we refer to Paradise Lost, however, we shall find that Milton was familiar with both divine and infernal hierarchies, and that these were graded and charted according to a definite system.\n\nAnyone who is acquainted with the Qabalah will recognise that in Milton he meets a fellow Qabalist.\n\nIn the Qabalah we find the esotericism of the Old Testament.\n\nI propose to use the Qabalistic terminology to explain the esoteric theory of evil because, firstly, it is the one I am most familiar with; secondly, it forms the basis of Western occult thought and all medieval magic is based upon it, together with much modern magic; thirdly, it is, in my opinion, singularly lucid, coherent and comprehensive; and being a system consecrated by antiquity, I cannot be accused of romancing, or fabricating my own system.\n\nIn order to render my concepts clear, a brief explanation of Qabalistic doctrine must be given.\n\nAs it is not possible to enter into an exposition of this vast system, I will state certain axioms dogmatically, and explain them by illustration instead of argument, thus obtaining the maximum clarity for the minimum expenditure of space.\n\nThe initiate recognises two kinds of evil, Negative Evil and Positive Evil.\n\nNegative Evil is the polarising opposite of good.\n\nLet us try and make this clear by an illustration.\n\nEvery action gives rise to a reaction.\n\nThe forward drive of the bullet is equated by the recoil of the gun.\n\nEverything which moves has to have the equivalent of a thrust-block against which to push - something firm under its feet from which to take off.\n\nIt is difficult to walk on a slippery surface because it offers no resistance.\n\nWe must have something for the foot to grip, to push against, and give us the forward impulse at each step.\n\nNegative Evil is the thrust-block of Good; the principle of resistance, of inertia, that enables Good to “get a purchase.” But Negative Evil is more than this.\n\nWe might call the principle of resistance the “negative— aspect of Negative Evil.\n\nFor it has also a “positives’ aspect, the Principle of Destruction.\n\nWe can best explain the cosmic function of the Principle of Destruction by calling it by its esoteric name of the Scavenger of the Gods.\n\nIts function is to clear up behind the advancing tide of evolution, removing that which has become effete so that it may not choke and clog evolving life.\n\nWe now find the answer to the eternal riddle as to why God tolerates the Devil.\n\nThe Devil is the cosmic thrust-block and Scavenger of the Gods.\n\nIt is this aspect of evil which is given a more detailed symbolism in the pantheons of other faiths, having its Shiva and Kali, or its Pluto and Hecate aspects.\n\nWe can now see why these resistive and destructive forces are classed as gods and not as demons, for they are reactions according to cosmic law, not anarchical and chaotic forces."


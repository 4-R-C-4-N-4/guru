[content]
body = "Firstly, it is your duty as a citizen in order that others may not be victimised as you have been.\n\nSecondly, if you don’t, your persecutors will not leave you until they have sucked you absolutely dry, and not even then if they can still find a use for you as a catspaw.\n\nA blackmailer is never got rid of by giving him money.\n\nIt is merely an invitation to call again.\n\nAct quickly and firmly at the outset and you will soon be at the end of your troubles.\n\nTo demand money with threats is blackmail, and to coerce to any course of action by threats is also a crime.\n\nAny arrangements entered into, or documents signed in con sequence of threats are not binding.\n\nThreats need not necessarily be gross and open, such as the pointing of a revolver; anything which coerces you against your inclinations may be interpreted as a threat.\n\nFor instance, supposing it were intimated to you, however tactfully, that if you did not subscribe to the funds of an organisation, your interest in occultism would be liable to be gossiped about, and possibly involve you in unpleasantness with your relatives, or your employers, this, in the eyes of the law, would be blackmail.\n\nAnything, in fact, which plays upon a person’s fears is a threat.\n\nLet us now consider what is the best thing to do if you are being threatened.\n\nIt is seldom wise to answer threat with threat.\n\nThe best thing is to reply that you will think it over and see what can be done, and then go straight to the nearest police-station and tell the whole story.\n\nYou can be sure of the utmost courtesy and kindness, and that every effort will be made to help you, even if you have to admit that you have not been wholely blameless yourself.\n\nIn coming to the police and telling them frankly the position of affairs you have, in popular language, “turned King’s evidence,” and the authorities will go a long way to protect anyone who does this.\n\nDo not be deterred by the fact that you cannot bring forward any additional testimony in support of your statement.\n\nThe police may tell you that there is not sufficient evidence for them to apply for a warrant; nevertheless, they will make enquiries, and the very fact that the police are making enquiries will be sufficient to frighten black mailers out of their wits and probably out of the country, nor will they usually stop to make the threatened disclosures en route, but will “go while the going is good.” Moreover, your complaint will go on to the police records, and a watch will be kept; in due course another complaint may be made, or, for all you know, may already have been made, and then the net begins to tighten.\n\nAlways remember that the blackmailer has a great deal more to fear from exposure than you have; for whatever unpleasantness may be in store for you, he has to look forward to a long term of penal servitude, and possibly the dreaded “cat” if the case is a bad one.\n\nA timely reminder of this fact works wonders with prospective blackmailers.\n\nNor need the fear of exposure of your own shortcomings deter you.\n\nThe nature of the charges brought against you by the blackmailer will never be mentioned.\n\nIt is not you who are being tried.\n\nNeither will your identity be disclosed.\n\nYou will be referred to as Mr.\n\nA.\n\nor Mrs.\n\nB.\n\nFar from being treated as an evil-doer or having the finger of scorn pointed at you, you will find that you are looked upon as a person who is performing a public service and every effort will be made by those in authority to smooth your path.\n\nA determined effort is being made at the present time to stamp out this abominable crime, and judges are giving exemplary sentences and protecting prosecutors in every way in order to encourage them to come forward."


[content]
body = "Indeed, pressure without heat will give relief, and I have known cases where a firm pad held in place by a belt or corsets gave much comfort.\n\nAbove all things, the bowels should be kept freely open while facing a psychic attack, because there is nothing that puts one at so great a disadvantage as the accumulation of effete matter within the body.\n\nAll these simple physical remedies are readily available.\n\nThey will not afford a cure for psychic pathologies, nor a complete defence from psychic attack, but they can give great relief from distress; they enable the victim to put up a much more effectual resistance, and by relieving the strain, they increase his endurance.\n\nIn many cases of psychic attack, he who endures longest wins; psychic attacks by human beings are not things which can be maintained indefinitely because they use up too much energy.\n\nThere is an old adage, “Never use a big spade if a little spade will do.” Physical methods of defence involve much less outlay of energy than psychic ones, therefore it is psychically economical to make as much use of them as possible.\n\nWhy trouble to exorcise the earth elementals with a ritual if you can do it with a pill?\n\nThe question of diet also requires to be considered in this connection.\n\nThe widespread propaganda of the Theosophical Society has caused vegetarianism to be regarded as a sine qua non of occult training.\n\nThis, however, is not the case.\n\nThe Western Esoteric Tradition does not make vegetarianism any part of its system, but teaches that a man should partake sparingly and temperately of the food of the land in which he finds himself.\n\nPersonally I am inclined to think that occultism and vegetarianism are apt to be an injudicious mixture for a European, the result being a hyper-sensitiveness that makes life very difficult in our hard-driving civilisation.\n\nVegetarianism has to be thoroughly understood and exceedingly well done if it is to be successful, and even so, there is a goodly proportion of people who are incapable of digesting vegetable proteins, which are not nearly so easily dealt with as animal substances.\n\nNothing but experience and experimentation can show whether a vegetarian diet suits a given person.\n\nIndigestion is not the only indication that all is not well.\n\nLoss of appetite, loss of energy, loss of weight, or a flabby stoutness are all danger signals which if disregarded will cause chronic ill-health.\n\nVegetarianism may agree with a person well enough at first, but after a considerable period, possibly years, they may find that they are becoming subject to neuritis, neuralgia, sciatica, or one or another of the nerve pains.\n\nThis is a sure indication that a vegetarian diet is affording insufficient nourishment, not because it does not contain the necessary food units, but because the digestion is unable to assimilate them and they are passing out of the body unchanged.\n\nWherever there is a history of neuralgic pains complicating a case of psychic disturbance, I should be inclined to suspect chronic malnutrition as the cause of a hypertrophied psychism.\n\nIn such cases it will probably be found that a gradual return to a nourishing mixed diet will bring about a reduction of the hyper-sensitiveness, the undesirable contacts that have been formed will fade, and the condition return to normal.\n\nThe change of diet, however, should always be made gradually lest the digestion be upset.\n\nAnyone who is having trouble with psychic disturbance should immediately discontinue all occult practices and should exchange his habitual meditations for the prayers of his childhood, or New Thought methods.\n\nIt is no time to open up the psychic centres when there is astral trouble.\n\nThe thing to do in such cases is to get back on to the physical plane and stop there resolutely.\n\nThere was a picture in an old number of Punch which to my way of thinking exactly expresses the correct attitude for the person afflicted by psychic trouble."


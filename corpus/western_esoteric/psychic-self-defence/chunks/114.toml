[content]
body = "I called to her to return, and as she entered she exclaimed, “Look what has happened to the door!” and we found that one of the panels had split clean in two.\n\nIt was this that had evidently caused the loud crack we had both heard.\n\nI offer no explanation of this incident for the good and sufficient reason that I do not know what the explanation may be.\n\nI merely state what happened.\n\nMy readers can explain it as they please.\n\nWhen it is not possible to seal the room, it is a very useful thing to be able to seal the aura.\n\nStand upright and cross yourself, by touching forehead, breast, right shoulder and left shoulder, saying, “By the power of the Christ of God within me, whom I serve with all my heart and with all my soul and with all my strength (extend your hands forward as far as you can reach at the level of the solar plexus, finger tips touching, then sweep them round to the back and touch the finger-tips together again behind you, saying), I encompass myself about with the Divine Circle of His protection, across which no mortal error dares to set its foot.” This is an old monkish formula.\n\nIt is very effectual, but its potency only lasts about four hours.\n\nThere are various other devices which are useful, not only in dealing with psychic attacks, but in any case of undue influence or domination.\n\nIf you have to interview persons whose influence you find overwhelming, imagine that they are separated from you by a sheet of plate-glass.\n\nYou can see them, and hear them, but their magnetism cannot reach you.\n\nVisualise this sheet of glass until it appears to you to be absolutely tangible.\n\nIf you have to associate with persons who distress you, but are not actually interviewing them, imagine that they are separated from you by a brick wall, and say to yourself, “You just aren’t there.\n\nI can’t see you or hear you, and you simply don’t exist.” When dealing with a person who saps your vitality, interlace your fingers, and lay your folded hands upon your solar plexus, keeping your elbows pressed against your sides.\n\nKeep your feet touching each other.\n\nYou have thus contacted all your own terminals and made of your body a closed circuit.\n\nNo magnetism will go out from you while you maintain this attitude.\n\nYour friend will probably complain of your lack of sympathy, however kindly you may speak.\n\nIf anyone tries to dominate you by gazing intently into the eyes, do not attempt to return gaze for gaze, for this only leads to an exhausting struggle in which you may get the worst of it, but look steadily at the spot just above the base of their nose, between the inner ends of the eyebrows.\n\nIf you are merely dealing with an ordinary bully, you will immediately have the upper hand.\n\nIf, however, your antagonist has knowledge of mind-power, you may not be able to dominate him, but he certainly will not be able to dominate you, and the result will be a stalemate.\n\nDo not attempt to dominate him, merely keep your eye on the spot and wait for him to weary of his attempt to dominate you.\n\nYou will not have long to wait.\n\nBy the use of the methods described in the preceding pages any person of normal courage and mentality, provided he avoids drugs, alcohol and long periods without food, can, if he does not lose his nerve, wear down any ordinary psychic attack; or in the case of attacks of abnormal potency, can at least ensure himself time to make good his escape and seek help.\n\nThe sacraments are also a most potent source of spiritual power, and a church where the Blessed Sacrament is reserved, or which is sufficiently old to have been consecrated before the Reformation, is an effectual sanctuary."


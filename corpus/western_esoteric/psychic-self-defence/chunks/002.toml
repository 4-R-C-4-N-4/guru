[content]
body = "In many of the developments the religious aspect was lost sight of, and they simply became a method of mental manipulation for purely personal ends, though not necessarily deliberately evil.\n\nTheir exponents advertised that they would teach the art of salesmanship, of making oneself popular and dominant in society, of attracting the opposite sex, of drawing to oneself money and success.\n\nThe amazing number of these courses advertised shows their popularity; in a recent issue of an American magazine I counted advertisements for sixty-three different courses in various forms of mind-power.\n\nThey would not be so popular if they achieved no results at all.\n\nLet us consider some of these advertisements and see what they indicate, reading between the lines and drawing our own conclusions.\n\n“Transfer your thoughts to others.\n\nSend for free folder, Telepathy, or Mental Radio.” “Troubled - health, love, money?\n\nLet me help you.\n\nNo failures, instructions being followed.\n\nStrictly personal and professional.\n\nCareful as family physician.\n\nFive dollars must accompany enquiry.\n\nMoney back if not satisfied.” “What do you want?\n\nWhatever it is, we can help you to get it.\n\nJust give us the chance by writing for ‘Clouds Dispelled.’ Absolutely free.\n\nYou will be delighted.” “HYPNOTISM.\n\nWould you possess that strange mysterious power which charms and fascinates men and women, influences their thoughts, controls their desires and makes you supreme master of every situation?\n\nLife is full of alluring possibilities for those who master the secrets of hypnotic influence, for those who develop their magnetic powers.\n\nYou can learn at home, cure diseases and bad habits without drugs, win the friendship and love of others, increase your income, gratify your ambitions, drive worry and trouble from your mind, improve your memory, overcome domestic difficulties, give the most thrilling entertainment ever witnessed and develop a wonderfully magnetic will power that will enable you to overcome all obstacles to your success.\n\n“You can hypnotise people instantly - quick as a flash - put yourself or anyone else to sleep at any hour of the day or night, or banish pain and suffering.\n\nOur free book tells you the secrets of this wonderful science.\n\nIt explains exactly how you can use this power to better your condition in life.\n\nIt is enthusiastically endorsed by ministers of the gospel, lawyers, doctors, business men and society women.\n\nIt benefits everybody.\n\nIt costs nothing.\n\nWe give it away to advertise our institution.” These are a few specimens chosen from among the sixty- three similar advertisements counted in this single issue of a popular weekly magazine.\n\nThey are given in extenso, in no way edited save by the omission of addresses.\n\nLet us now consider what such advertisements as these signify from the point of view of the persons to whom they are not addressed, the persons over whom the reader is presumed to want to acquire power.\n\nWhat will be their position should he break the tenth commandment and covet his neighbour’s wife, or his ox, or his ass, or any of his other valuables?\n\nSupposing the diligent student of these methods wants something he ought not to have?\n\nSupposing he is on the shady side of the law?\n\nOr is nursing a sense of injury and desires to be revenged?\n\nOr merely loves power for its own sake?\n\nWhat is the fate of the cannon-fodder that supplies the student of mind-power with the material for his experiments?\n\nWhat does it feel like to be dominated by these methods, and what results may ultimately be obtained by a competent experimenter?\n\nLet me give my own experience, painful though it is, for someone has got to be the first to come forward and uncover these abuses which are only able to flourish because of the general failure to realise their significance."


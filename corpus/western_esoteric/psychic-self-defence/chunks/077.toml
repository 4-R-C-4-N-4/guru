[content]
body = "Hence it is that when the unstable soul advances by the Path of Saturn that bridges the Astral and enters the Sphere of Luna, he touches her Hecate aspect and finds himself en rappart with the Gamaliel, the Obscene Ones, whose chief is Lilith, she who giveth lustful dreams.\n\nNeed we then wonder that Freud finds the dreams of the neurotic filled with sexual images in their most perverted and debased forms?\n\nThe Rabbis knew their psychology just as well as he does.\n\nAs has already been noted, the neurotic is very often psychic, and the psychic is very often neurotic.\n\nWhat may we expect to happen to the soul that has taken initiation in a past life, retains subconsciously the psychic development thus conferred, and finds itself incarnated in a neurotic personality in this life?\n\nHe will come under the dark dominion of the Moon, and Lilith will be his mistress.\n\nThrough the ill-fitting doors of the neurotic temperament the forces of the Abyss find ingress.\n\nThe dissociated complexes of the Microcosm are reinforced by the dissociated complexes of the Macrocosm, for that is precisely what the Qlippoth are.\n\nOccultists and their ignorant admirers, the superstitious, have always held that insanity had to do with demonic possession.\n\nModern medicine disputes this, and declares the various manifestations of the diseased mind to be due entirely to subjective psychological processes.\n\nAt present these two schools of thought are like two armed camps, drawn up for battle and shaking their weapons at each other.\n\nEach is too sure of his own ground to be willing to give the other a hearing.\n\nIt is my belief that a common ground can be found for the meeting of these two opposing view-points.\n\nPsychology demonstrates the mechanism of the mind and can explain the mental processes whereby the ideas of the deranged assume their ultimate form.\n\nIt can show the connection between these ideas and the dreams of the normal mentality.\n\nWhat it cannot explain is the fundamental difference between these subjective states and the normal waking consciousness.\n\nIt is here that the occultist can tell the psychologist something that it is worth his while to hear, for he can show how these visions can be produced experimentally and at will by means of ceremonial magic.\n\nAnd still more important, the occultist can show him how these visions can be dispersed and the psychic faculties closed down and sealed.\n\nThis brings us to the practical part of our considerations: How far can the methods of ritual magic be applied to the relief of mental disease?\n\nThey are undoubtedly palliative, but they will not produce a permanent cure unless the origin of the disturbed mental condition is found and cleared up.\n\nUnless this be done, as fast as we disperse the phantoms, they will re-form, because the mental state of the patient is invoking them.\n\nUnder such circumstances, no magic circle can be kept intact.\n\nAs fast as we break the rapport with the Abyss, the patient renews it.\n\nBut such conditions constitute a vicious circle.\n\nThe Qlippotic forces with which a contact has been established will actively develop it, and will hold on to their victim when attempts are made to dislodge them.\n\nIn this rationalistic age we are apt to forget that there is such a thing as organised and intelligent evil.\n\nIf the physical causes of this disturbance have been cleared up, the septic focus eradicated, or the tumour pressing upon the ductless gland excised, and still the mentality does not return to normal, an exorcism will often produce immediate and marked results.\n\nIn the case of the neurotic, whose trouble is entirely in the sphere of the mind, an exorcism is of enormous value as a preliminary to the appropriate psycho-therapeutic treatment because it clears the ground and prevents re-infection, giving the patient a chance to make a fresh start."


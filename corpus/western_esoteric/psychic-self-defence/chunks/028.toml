[content]
body = "It was a comparatively small cottage we were in, and our two beds were close together, side by side, right under the uncurtained open window.\n\nIt was the time of the full moon, and I remember that I had no need to light a candle in order to see to undress.\n\nI fell asleep at once, for I was very tired.\n\nI could not have been asleep very long, however, when I was awakened by the sensation of a weight upon my feet.\n\nIt was as if a good-sized dog, say, a collie, had jumped up and lain down on the bed.\n\nThe room was flooded with moonlight, and as bright as day, and I clearly saw, lying apparently asleep across the foot of my bed, the man whom we had left safely tucked up for the night in the room below.\n\nIt was a somewhat embarrassing situation, and I lay still, taking thought before I did any thing.\n\nI was wide enough awake by now, as may well be imagined.\n\nI concluded that Z., as I will call this man, had either had a return of the delirium, or was sleep-walking.\n\nIn any case I was very anxious to get him safely back to bed again without a fuss or a scene.\n\nMy companion had a bad heart, and I did not want her to get a shock; neither did I want him to get a shock in his weak state.\n\nI was afraid that if I waked my room-mate first, she might scream, and wake Z.\n\nup with a start, with disastrous consequences.\n\nI decided therefore to wake him gently, as being the worse case of the two, and let her take her chance.\n\nHaving cogitated these matters for several moments at least, I finally took action.\n\nI sat up in bed and leant quietly forward with the intention of touching him gently on the shoulder and so arousing him.\n\nIn order to lean forward, I had to withdraw my feet from under him, for they were pinned by his weight, which until now had rested upon them, for I had been careful not to stir while thinking out my plan of campaign.\n\nZ.\n\nwas plainly visible in the moonlight, clad apparently in his dressing-gown, or so I took the muffling folds of material to be that swathed him about.\n\nBoth his face and wrappings appeared grey and colourless in the moonlight, but there was no question in my mind as to his solidarity, for not only could I see him, but I could feel his weight resting upon my feet.\n\nBut the moment I moved, he vanished, and I was left staring in amazement at the smooth fold of the blankets over the end of the little camp-bed on which I lay.\n\nIt was then, and then only, that I realised he had appeared all grey and colourless, more like a shaded pencil sketch than a human being of flesh and blood.\n\nI asked him about this incident in the morning, but he said he had no recollection of it; he had been dreaming the uneasy, broken dreams of a sick man, but could not recall them.\n\nThis, of course, was in no way an occult attack, but rather the visit of a friend, who had come to lean upon me in the course of his illness, and instinctively came to me for consolation when out of his body in trance at a time when his weakened condition prevented him from retaining his normal control over his psychic activities.\n\nNevertheless, it serves to illustrate what could be done if the etheric form that visited me had been energised by a malignant will.\n\nIt may explain the nature of the sense of weight that oppresses the victims of a certain type of nightmare.\n\nI have heard of more than one case wherein bruises resembling finger-marks were found on the throats of people who had been victims of an astral attack."


[content]
body = "The European belief of one man, one life, has imbued us with the idea of death as the supreme evil.\n\nTherefore the European very often does not go to his death when he unites with the elements, but his higher self withdraws from incarnation, leaving his body ensouled by a curious kind of intelligent automaton, which deteriorates rapidly.\n\nWhat ever may be the status of the soul that withdraws, that which is left behind is not nice.\n\nI feel, therefore, that it must seriously delay and distort the evolution of the human Monad if it turns aside into the sphere of the Deva evolution.\n\nIt may well be that some of the creatures whom at first sight we might classify as non-humans are really humans who have had a Deva phase in their Karmic record.\n\nThere is a very interesting field of research awaiting the person who systematically investigates the past lives of the weak- minded and the mentally deranged.\n\nThe pathologies of the Element of Fire are also rare, though it may be that the aimless incendiary and pyromaniac belong to this class.\n\nI have never personally had any opportunity of investigating this type of case.\n\nAlgernon Blackwood writes of one in his very interesting story, “The Regeneration of Lord Ernie,” which is published in his volume of short stories entitled Incredible Adventures.\n\nIndeed, this author is exceedingly fond of drawing his inspiration from the Deva kingdom, and has some most interesting studies of the subject scattered through his books.\n\nAny organic geographical unit develops something of an oversoul, and where the differentiation is marked, the over soul may become a very definite entity.\n\nIf there are among the inhabitants of the district any who are sensitive to the Unseen, they may form either an affinity or a repulsion for this oversoul.\n\nA great forest has a very marked personality, and there are few white men who can resist its influence, becoming markedly changed and de-humanised if exposed to it for long periods without the companionship of others of their race.\n\nNatives, on the other hand, seem to enter into it and be part of it.\n\nIt is well known how often trees are objects of worship in all parts of the world.\n\nThey have very marked personalities and strong magnetic fields.\n\nIn the spring, when the sap is rising, even non-psychics can often see the aura of a tree.\n\nIt can best be seen by getting at a distance of a couple of hundred yards and looking at the sky beyond the top of the tree.\n\nThe aura will then be perceived as a whitish cloud, like a patch of lighter-coloured sky, surrounding the top of the tree, and usually swaying gently from side to side.\n\nThere is a curious antagonism between elms and humanity, and about orchids all sensitive persons agree there is some thing sinister.\n\nTropical vegetation, as a whole, is over-powerful for humanity.\n\nUnder the tremendous stimulation of the solar fire the elemental forces are concentrated to a poisonous strength.\n\nI am not personally acquainted with the West Coast of Africa, but from what I can gather I am of the opinion that the elemental forces and the atmosphere made by Juju rites are between them more responsible than the climate for earning that part of the world its sinister reputation as the White Man’s Grave.\n\nThere are other spots where the climate is equally hot and humid, Burmah, for instance, but there is no other spot that produces the same loosening of moral fibre.\n\nThe only place that is at all comparable to it is the Carribbean Sea, which produces, not so much a demoralisation, as a fierceness and violence quite alien to the racial characteristics of the people who go there."


[content]
body = "Why I did not pursue the obvious remedy of taking refuge in flight, I do not know, but by the time one realises that something abnormal is toward on these occasions, one is more or less glamoured, and just as the bird before the snake cannot use its wings, so one cannot move or turn away.\n\nGradually everything began to feel unreal.\n\nAll I knew was that I had to hold on at all costs to the integrity of my soul.\n\nOnce I agreed to her suggestions, I was done for.\n\nWe went on with our litany.\n\nBut I was getting near the end of my resources.\n\nI had a curious sensation as if my field of vision were narrowing.\n\nThis, I believe, is a characteristic phenomenon of hysteria.\n\nOut of the corners of my eyes I could see two walls of darkness creeping up behind me on either side, as if one stood with one’s back to the angle of a screen, and it were being slowly closed upon one.\n\nI knew that when those two walls of darkness met, I should be broken.\n\nThen a curious thing happened.\n\nI distinctly heard an inner voice say: “Pretend you are beaten before you really are.\n\nThen she will let up the attack and you will be able to get away.” What this voice was, I have never known.\n\nI immediately followed its advice.\n\nWith my tongue in my cheek I asked my employer’s pardon for everything I had ever done or ever should do.\n\nI promised to remain on in my post and to go softly all the days of my life.\n\nI remember I went down on my knees to her, and she purred complacently over me, well satisfied with the morning’s work, as she had every reason to be.\n\nThen she let me go, and I went up to my room and lay down on the bed.\n\nBut I could not rest until I had written her a letter.\n\nWhat that letter contained, I do not know.\n\nAs soon as I had written it and put it where she would get it, I fell into a sort of stupor, and lay in this state with my mind completely in abeyance till the following evening.\n\nThat is to say, from two o’clock one afternoon till about eight o’clock of the following day, thirty hours.\n\nIt was a cold spring day with snow on the ground.\n\nA window close to the head of the bed was wide open and the room unheated.\n\nI had no covering over me, but I felt neither cold nor hunger, and all the processes of the body were in abeyance.\n\nI never stirred.\n\nHeartbeat and respiration were very slow, and continued so for several days.\n\nI was found eventually by the housekeeper, who revived me by the simple application of a good shaking and a cold sponge.\n\nI was dazed, and disinclined to move or even to eat.\n\nI was left to lie in bed, my work taking care of itself, the housekeeper coming to look at me from time to time, but making no comment on my condition.\n\nMy employer never showed herself.\n\nAfter about three days my especial friend, who thought I had left the house, learnt of my continued presence, and came along to see me; an act requiring some courage, for our mutual employer was a formidable antagonist.\n\nShe asked me what had happened at my interview with the Warden, but I could not tell her.\n\nMy mind was a blank and all memory of that interview had gone as if a sponge had been passed over a slate.\n\nAll I knew was that out of the depths of my mind a most terrible state of fear was rising up and obsessing me.\n\nNot fear of any thing or person.\n\nJust plain fear without an object, but none the less terrible for that.\n\nI lay in bed with all the physical symptoms of intense fear.\n\nDry mouth, sweating palms, thumping heart and shallow, hasty breathing."


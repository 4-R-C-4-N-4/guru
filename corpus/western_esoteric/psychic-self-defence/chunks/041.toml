[content]
body = "Celts are notoriously susceptible to psychic influences, and are always the first to be affected by them.\n\nIt will be observed that the babies went down first under the attack, their resistance being low compared to that of an adult; and then the most sensitive of the adults was affected, the Irish Celt.\n\nOn several occasions the sound was heard of a cart and horse coming up the drive, but when the maid went to the door to open it, there was nothing to be seen.\n\nSoon the ghost became even more energetic, and took to shoveling the coal from side to side of an outhouse.\n\nIt would shift several tons of coal in this way in a night, the occupants of the house lying shivering in their beds while lumps of coal thudded and rumbled’ against the sides of the bunkers.\n\nAs to why or wherefore this particular manifestation should take place, I can offer no suggestion.\n\nOn several occasions different people saw a strange man crossing the hall, and immediately afterwards children were taken ill.\n\nFinally, in addition to all other troubles, mysterious fires began to break out all over the house.\n\nA basket of clean linen in an empty room was found to be on fire.\n\nCurtains were found to be smouldering.\n\nMeanwhile the unfortunate Irish nurse went from bad to worse, lying in bed too weak to stand up, and rapidly going off her head.\n\nIt will probably be suggested that some mischievous or demented person was at the bottom of the trouble, but it is difficult to know what human agency either could or would shovel a truck-load of coal across a shed single-handed during the night.\n\nThe superintendent of the home was interested in mental healing and knew enough of the mind side of things to realise that something abnormal was happening in the house under her charge.\n\nShe consulted a mental healer, who in her turn consulted me.\n\nI made a psychic diagnosis of the case, and reported that in my opinion the house had at some time been occupied by someone who had a knowledge of occultism, and who, being upon the Left-hand Path, objected strongly to going to face his portion of Purgatory after the death of the physical body, and that he was maintaining himself in an intermediate state as an earth-bound spirit by drawing upon the vitality of the unfortunate children, and had accidentally drawn too much from one, thus killing it outright.\n\nWorking on this hypothesis, the healer undertook to give the case “absent treatment.” Needless to say, the officials of the home were not taken into our confidence.\n\nThe result of this treatment was that the manifestations immediately ceased.\n\nNo more children had seizures and the Irish nurse rapidly recovered.\n\nThe superintendent was then told the hypothesis upon which we had worked.\n\nShe was greatly interested, and made enquiries in the village as to the history of the house, and learned that it was notoriously haunted, which was the reason they had obtained it so cheaply.\n\nIt appeared that no tenant could stop there long, and that there was a constant record of these exhausting and mysterious illnesses.\n\nIt also transpired that about sixty years previously the house had been occupied for a long period by a man who was viewed askance by his neighbours as an eccentric and mysterious personage, and was reported to be engaged in some sort of research which necessitated the use of a laboratory into which no one was ever allowed to go, and in which he worked by night.\n\nIt is interesting to note that neither the mental healer or myself ever visited the house or were within twenty miles of it; for it shows in what way these unseen forces can be manipulated from a distance.\n\nA final example, taken from The Confessions of Aleister Crowley, will serve to show the nature of a haunting produced by ceremonial magic in which the forces invoked are not adequately dispersed.\n\n“The demons connected with Abramelin do not wait to be invoked, they come unsought.\n\nOne night Jones and I went out to dinner."


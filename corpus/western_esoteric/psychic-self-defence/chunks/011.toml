[content]
body = "We say ignorant as well as malignant, for all attacks are not deliberately motived; the injury may be as accidental as that inflicted by a skidding car.\n\nThis must always be borne in mind, and we should not impute malice or wickedness as a matter of course when we feel we are being victimised.\n\nOur persecutor may himself be a victim.\n\nWe should not accuse a man of malice if we had linked hands with him and he had stepped on a live rail.\n\nNevertheless, we should receive at his hands a severe shock.\n\nSo it may be with many an occult attack.\n\nThe person from whom it emanates may not have originated it.\n\nTherefore we should never respond to attack by attack, thus bringing ourselves down to the moral level of our attackers, but rely upon more humane methods, which are, in reality, equally effectual and far less dangerous to handle.\n\nPeople also come into touch with the Unseen through the influence of places.\n\nSomeone who is not actually psychic, but who is sufficiently sensitive to perceive the invisible forces subconsciously, may go to a place where they are concentrated at a high tension.\n\nNormally, although we move in the midst of these forces (for they sustain our universe), we are oblivious of them.\n\nWhere they are concentrated, however, unless we are very dense-minded, we begin to be dimly conscious of something that is affecting us and stirring our subliminal self.\n\nIt may happen that the barrier between consciousness and subconsciousness is dense in some people, and they are never able clearly to realise what is going on.\n\nThey merely have the sense of oppression and general malaise, which lifts when they go away to another place.\n\nConsequently, the condition may never be detected, and lead to years of ill-health and misery.\n\nMore commonly, however, if there is a definite psychic attack of sufficient force to make itself noticeable at all, there will soon begin to appear characteristic dreams.\n\nThese may include a sense of weight upon the chest, as if someone were kneeling on the sleeper.\n\nIf the sense of weight is present, it is certain that the attack emanates locally, for the weight is due to the concentration of etheric substance or ectoplasm, and is sufficiently tangible to press down the scale of a balance when it is possible to capture it for measurement.\n\nA great deal of research has been done with materialising mediums upon the nature of this tangible subtle substance, and the reader is referred to the books on the experiments conducted by Crawford with the Goligher Circle at Belfast, and in Paris with Eva C.\n\nby other experimenters, for further information and evidence on this subject.\n\nIt may be noted that Crawford eventually committed suicide for no known reason.\n\nA sense of fear and oppression is very characteristic of.\n\noccult attack, and one of the surest signs that herald it.\n\nIt is extremely rare for an attack to make itself manifest out of the blue, as it were.\n\nWe are not in our normal state of mind, body and circumstance, and then find ourselves suddenly in the midst of an invisible battle.\n\nAn approaching occult influence casts its shadow on consciousness before it makes itself apparent to the non-psychic.\n\nThe reason for this is that we perceive subconsciously before we realise consciously, and a line of creeping shade indicates the penetrating of the subconscious censor from below upwards.\n\nAs the attack progresses, nervous exhaustion becomes increasingly marked, and there may, under certain conditions, which we will consider later, be such wasting of the tissues that the victim is reduced to a mere bloodless shell of skin and bones, lying on the bed, too weak to move.\n\nAnd yet no definite disease can be demonstrated.\n\nSuch a case is an extreme example, proceeding unchecked to its logical conclusion.\n\nOther issues are possible, however."


[content]
body = "No one has said harder things of the occult movement than I have, and if I thought that there were any organised system of evil influence, I should not hesitate to say so, for I have the integrity of the movement very much at heart; but I honestly do not believe that there is any generalised organisation of the occult movement, whether for good or evil, whatever may be one’s conception of good and evil.\n\nOne can, of course, only speak of that which one has seen, but I think it would have been impossible for me to have been as intimately associated with that movement as I have been and never to have crossed its trail at any point.\n\nI have crossed so many trails, and seen, I will not deny it, so much that was evil, but this particular evil I have not seen, and I do not believe it exists outside the imagination of people with bees in their bonnets.\n\nThe true nexus of the occult movement is devotion to a common ideal, but this ideal is approached by an infinite diversity of paths, as many as the breaths of the sons of men.\n\nI am sorry for the hypothetical person who has the task of organising the occult movement, for occultists of different schools cannot be induced to co-operate.\n\nAny technique which differs from that which they are used to is suspect; any unfamiliar contact is black.\n\nThe great majority of the heads of schools that I have known have sat each in his own circle of light and damned everybody else.\n\nLike the old lady who watched her son march past with the Territorials, they exclaim, “They’re all out of step except our Jock.” I had once dreamed of a federation of occult societies with an annual convention, but I soon realised that it was unwork able.\n\nIf occultists cannot be got to organise to serve their own interests, it is very unlikely that they would ever be got to organise to serve anybody else’s.\n\nThe most prevalent abuses of Western occultism are immorality, drug-taking and the bamboozling of silly women.\n\nIts worst faults are credulity, a slipshod scholarship that verges on illiteracy, and a widespread sappiness of intellect.\n\nFortune-telling in all its forms and some very spurious spiritual healing constitute another slur upon what should be holy ground.\n\nIt is difficult to do justice to ideals which one does not share, but it has always seemed to me that the highly-coloured humanitarianism with which certain sections of the movement are soaked is not an ornament.\n\n“By their fruits ye shall know them.” Such fruits of this as I have seen have appeared to me to be somewhat over-ripe.\n\nThe finest minds in occultism are totally unknown outside their own Orders.\n\nA very common clause in initiation oaths binds the candidate not to reveal the names of his fellow members.\n\nIf this oath were broken, the general public would get some surprises.\n\nOccultism not being in good repute with the general public, men in public positions cannot afford to have their names associated with it; their interest is therefore carefully concealed, and they only speak of it to those upon whose sympathy and discretion they can count.\n\nThose who know what to look for, however, can pick them out readily.\n\nAnyone who is accustomed to the analysis of literary style can detect the regular reader of the Bible.\n\nAnyone who knows the occult rituals will detect their flavour in the literary or oratorical style of a man who is habituated to their use.\n\nPerhaps at this length of time I may be forgiven if I break the Oath of the Mysteries that binds to secrecy concerning the names of initiates and suggest that the key to the Bacon-Shakespeare controversy may lie in the fact that Bacon and Shakespeare were members of the same Order?"


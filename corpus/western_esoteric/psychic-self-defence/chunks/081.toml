[content]
body = "He would drape his altar with a scarlet cloth; he would himself wear a scarlet robe.\n\nAll his magical implements would be of iron and his rod of power would be a naked sword.\n\nUpon his altar he would place five lights, five being the number of Mars.\n\nUpon his breast would be the symbol of Mars engraved upon a steel pentagon.\n\nOn his hand would be a ruby ring.\n\nHe would burn sulphur and saltpetre in his thurible.\n\nThen, according to the work in hand, he would call upon the angelic or demonic aspect of the Fifth Sephira, Geburah, the sphere of Mars.\n\nHe would invoke either the deity-name in Geburah, calling upon the God of Battles to hear him, or the arch-devil of the Fifth Infernal Habitation.\n\nHaving performed this mighty invocation, he would then offer himself upon the altar as the channel for the manifestation of the force.\n\nThere are many formulae extant designed to enable a force to be brought through without the necessity of the magician himself being the channel.\n\nIn my opinion they are one and all ineffectual; the only possible substitute for the magician himself being a trance medium.\n\nIt is for this reason that ritual magic so often fails to come off.\n\nYou cannot make custards without breaking eggs, and if you mean to be a magician you have got to “go the whole hog.” When it is a question of bringing through the angelic aspect of a force, the matter is on a clear footing.\n\nTo be the channel of such a force is a great privilege and is an initiation in itself.\n\nThe operator has simply to eliminate from his nature all incompatibles and maintain his concentration without wavering.\n\nThe worst that can happen is that he should fail to obtain his results.\n\nBut when it comes to bringing through the demonic aspect of a sphere, the matter is on an entirely different footing.\n\nVery few people care to offer themselves for the manifestation of such a force as Asmodeus.\n\nI do not believe that there is any reliable device for invoking the devils without being obsessed by them save the method of Abramelin, which involves six months’ preparation and is only operated after the knowledge and conversation of the Holy Guardian Angel have been attained.\n\nThe edge of the Abyss is well fenced.\n\nIt is not possible to fire a gnn and avoid the recoil.\n\nHaving invoked and concentrated his force, our sorcerer has next to consider his target.\n\nHe has to get into astral contact with his victim.\n\nIn order to do this, he must form a rapport, not quite as easy as might be imagined.\n\nFirst he has to find his victim and establish a point of contact in his sphere, and then, working from this base, succeed in piercing his aura.\n\nAn unfocussed force is not very much use.\n\nA focus has to be achieved.\n\nThe usual method is to obtain some object which is impregnated with the intended victim’s magnetism, a lock of hair, nail-paring, or something habitually worn or handled.\n\nSuch an object is magnetically connected with its owner, and the sorcerer can work up the trail and thus enter the sphere of his victim and establish a rapport.\n\nHe then proceeds as does any other practitioner of suggestion who has succeeded in getting his victim into the first stages of hypnosis.\n\nBy means of the magnetic link he has gamed the psychic ear of his victim, who will hear his suggestions subconsciously.\n\nIt now remains to be seen whether the thought-seeds thus planted will strike root or be cast out from the mind.\n\nIn any case the victim is rendered disturbed and uneasy.\n\nIf a magnetic link cannot be obtained, the practitioner of black magic has to fall back upon other devices.\n\nOne of the most common is that of Substitution.\n\nSomething is chosen and by means of ceremonial is identified with the intended Victim."


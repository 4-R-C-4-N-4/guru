[content]
body = "I have never actually seen such bruises myself, but I have been told of them by people who have either had them themselves, or seen them.\n\nIt is a well-known fact that if an occultist, functioning out of the body, meets with unpleasantness on the astral plane, or if his subtle body is seen, and struck or shot at, the physical body will show the marks.\n\nI myself have many times found curiously patterned bruises on my body after an astral skirmish.\n\nThe mechanism of the production of such marks must, I think, be of the same nature as that which produces the stigmata of saints and the curious physical marks and swellings sometimes seen in hysterics - the mind, powerfully stirred, affects the etheric double, and the etheric double acts upon the physical molecules held in its meshes.\n\nI dare to prophesy the next advances in medicine will be bound up with the knowledge of the nature and function of the etheric double.\n\nThe next type of psychic attack which we must consider is that conducted by means of artificial elementals.\n\nThese are distinguished from thought-forms by the fact that, once formulated by the creative mind of the magician, they possess a distinct and independent life of their own, though strictly conditioned as to nature by the concept of their creator.\n\nThe life of these creatures is akin to that of an electric battery, it slowly leaks out by means of radiation, and unless recharged periodically, will finally weaken and die out.\n\nThe whole question of the making, charging, recharging, or destruction of these artificial elementals is an important one in practical occultism.\n\nThe artificial elemental is constructed by forming a clear- cut image in the imagination of the creature it is intended to create, ensouling it with something of the corresponding aspect of one’s own being, and then invoking into it the appropriate natural force.\n\nThis method can be used for good as well as evil, and “guardian angels” are formed in this way.\n\nIt is said that dying women, anxious concerning the welfare of their children, frequently form them unconsciously.\n\nI myself once had an exceedingly nasty experience in which I formulated a were-wolf accidentally.\n\nUnpleasant as the incident was, I think it may be just as well to give it publicity, for it shows what may happen when an insufficiently disciplined and purified nature is handling occult forces.\n\nI had received serious injury from someone who, at considerable cost to myself, I had disinterestedly helped, and I was sorely tempted to retaliate.\n\nLying on my bed resting one afternoon, I was brooding over my resentment, and while so brooding, drifted towards the borders of sleep.\n\nThere came to my mind the thought of casting off all restraints and going berserk.\n\nThe ancient Nordic myths rose before me, and I thought of Fenris, the Wolf-horror of the North.\n\nImmediately I felt a curious drawing-out sensation from my solar plexus, and there materialised beside me on the bed a large wolf.\n\nIt was a well-materialised ectoplasmic form.\n\nLike Z., it was grey and colourless, and like him, it had weight.\n\nI could distinctly feel its back pressing against me as it lay beside me on the bed as a large dog might.\n\nI knew nothing about the art of making elementals at that time, but had accidentally stumbled upon the right method -the brooding highly charged with emotion, the invocation of the appropriate natural force, and the condition between sleeping and waking in which the etheric double readily extrudes.\n\nI was horrified at what I had done, and knew I was in a tight corner and that everything depended upon my keeping my head."


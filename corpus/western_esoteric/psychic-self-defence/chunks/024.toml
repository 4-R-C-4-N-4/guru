[content]
body = "Fortunately for me I had in my hands a large saucepan full of freshly boiled greens, and I used this as a weapon of defence, and we danced round the kitchen table, slopping hot cabbage-water in all directions.\n\nWe neither of us made a sound; I fended her off with the hot and sooty saucepan, and she slashed at me with an unpleasantly large carving-knife.\n\nAt a psychological moment in walked the head of the community.\n\nHe took in the situation at a glance, and handled it by the tactful method of scolding us both impartially for making so much noise and telling us to get on with our work.\n\nMiss L.\n\nfinished whatever she was doing with the carver, I dished up the cabbage, and the incident passed off quietly.\n\nAfter lunch Miss L.\n\nexperienced the reaction from her excitement and went to her room completely prostrated with exhaustion.\n\nI was somewhat perturbed.\n\nAlthough used to mental cases, and therefore not as disturbed by the recent fracas as anyone else might have been, I did not relish the prospect of being the housemate of a dangerous lunatic who was under no sort of control.\n\nThe head of the community, however, said there was no cause for alarm, he would soon have the case in hand.\n\nHe went up to the bath room, filled a soap-dish with water from the tap, made certain passes over it, and dipping his finger in the water, proceeded to draw a five-pointed star upon the threshold of Miss L.’s room.\n\nMiss L.\n\nmade no attempt to leave her room until forty-eight hours later when he fetched her out himself.\n\nAs he had promised, he soon had her in hand.\n\nHe had several long talks with her, at which I was not present, and at the end of a few days a very chastened Miss L.\n\nbegan to go about her household duties again.\n\nThere were relapses, and there were struggles, but in the course of a few weeks she became comparatively normal, and when I met her again some eighteen months later there had been no relapse.\n\nTwo curious incidents occurred during the period of her treatment at the hands of this man, an adept if ever there was one.\n\nThe house in which she had a room was a very old one, and the front door exceedingly massive.\n\nIt was secured at night by two enormous bolts that extended right across it, a chain that could have moored a barge, and a huge lock with a key the size of a trowel.\n\nWhen the door was opened in the morning it acted as an alarm clock for the entire village.\n\nIt creaked, it groaned, and it clanged.\n\nYet night after night we came down in the morning to find this door standing ajar.\n\nWe all slept with our doors open on to the small landing.\n\nTo go down the ancient, creaking stairs was like walking on organ-stops.\n\nThe back door was a modern affair, which could have been opened easily.\n\nThe windows were modern casements of the most gimcrack description.\n\nWho opened the heavy front door, and why?\n\nWe exchanged recriminations several mornings at break fast as to who had left the door open the night before, but no one could ever be convicted of the blame.\n\nFinally the matter came to the knowledge of the head of the group.\n\n“I will soon put a stop to that,” he said, and each night he re-sealed Miss L.’s room with the pentagram.\n\nWe had no more trouble with the front door coming open after that.\n\nWhile he was dealing with Miss L.\n\nhe made a practice of sealing the threshold of his own room in the same way, only in this case he drew the pentagram point outwards, to prevent Miss D.\n\nfrom coming in; whereas when he sealed her room, he put its point inwards, to prevent her coming out."


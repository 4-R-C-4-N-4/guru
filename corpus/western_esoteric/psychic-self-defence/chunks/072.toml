[content]
body = "Needless to say, the correspondence was sent straight to the authorities.\n\nThe problems which we have considered in this chapter are not peculiar to occult fraternities, but are common to any organisation which does not discriminate as to its members.\n\nThe organisations which advertise must perforce take all comers and sort them out in the light of subsequent experience, and some of these experiences can be very queer indeed.\n\nOne cannot blame an organisation that picks up an occasional black sheep, one only takes exception if it retains an accumulation of them.\n\nA lodge of dubious whiteness can be readily recognised by the type of people who belong to it, who may best be described as the seedy adventurer type with a sprinkling of smart society folk who often have a taste for crude flavours in the way of sensation.\n\nThe really Black Lodges are as carefully guarded as the high-grade White Lodges, and no outsider can gain entrance to them.\n\nThe serious student of Black Occultism is out for knowledge and magical experiment and he is not going to waste his time on a tyro.\n\nThose who choose to graduate into a Black Lodge after serving their apprenticeship in the Outer Court of a White Lodge do so with their eyes open, and experience must be their teacher.\n\nOne cannot feel that they deserve much sympathy if the experience is a painful one.\n\nThe person I am out to help is the person who is a victim, not the one who is hoist with his own petard.\n\nThe man or woman who, rejecting the steady grade of the Way of Initiation, chooses to go up with rocket had better come down with the stick.\n\nAny request for a large sum of money should always be regarded as a danger signal.\n\nIt is one of the strictest conditions of initiation that occult knowledge may never be sold or used for gain.\n\nI know of an occultist who charges £300 for one of the initiations he confers; and he will give it to anyone who has got £300.\n\nIn my opinion, the person who pays out £300 for such a purpose deserves the kind of initiation he is going to get.\n\nIt is also a bad sign when an occultist makes free with signs and wonders before the uninitiated.\n\nNo genuine adept ever does this.\n\nThe person who reads your past incarnations, describes your aura, rolls up his eyes, twitches, and gives you a message from your Master as soon as he is introduced, is a person to be avoided.\n\nThe more I see of the occult movement, the more I am amazed at the things people can say and do and “get away with.” The average person is out of his depth when he deals with psychic matters.\n\nHe usually goes through three phases.\n\nFirstly, he thinks it is all superstition and fraud.\n\nSecondly, his scepticism being breached, he will believe anything.\n\nThirdly, if he ever gets as far as thirdly, he learns discrimination, and distinguishes between the Black Fraternities, the White Fraternities and Fatuous Fraternities."


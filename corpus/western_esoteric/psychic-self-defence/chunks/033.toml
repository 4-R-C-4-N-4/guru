body = "Such cases are by no of means uncommon, and clear up rapidly when the victim is separated from the vampire.\n\nWhenever there is a record of a close and dominating bond between two people with the devitalisation of one of them, it is a good plan to recommend a temporary separation and observe the results.\n\nSuch cases as these, however, may more justly be described as parasitism than vampirism.\n\nSuch psychic parasitism is exceedingly common, and explains many psychological problems.\n\nWe will not pursue the subject in these pages, however, as it is outside the scope of our present enquiry, and is merely mentioned for illustrative purposes.\n\nVampirism, as generally understood, is a very different matter, and we shall do well to reserve the term for those cases wherein the attack is deliberate, applying the term parasitism to the cases wherein it is unconscious and involuntary.\n\nIn my opinion, true vampirism cannot take place unless there is power to project the etheric double.\n\nAll the records of vampirism that we have give an account of something much more tangible than a haunting.\n\nIn Western Europe the occurrence seems to be comparatively rare in modern times, but in Eastern Europe and in primitive countries it appears to be by no means uncommon, and innumerable well-authenticated cases occur in books of travel.\n\nCommander Gould, in his exceedingly interesting book, Oddities, gives an account of vampirism among the Berberlangs of the Philippine Islands.\n\nHis account is based on a paper printed in the Journal of the Asiatic Society, Vol.\n\nLXV, 1896.\n\nThese unpleasant people, according to Mr.\n\nSkertchley, the author of the article which Commander Gould quotes, “are ghouls, and must eat human flesh occasionally or they would die.\n\n.\n\n.\n\n.\n\nWhen they feel a craving for a meal of human flesh they go away into the grass, and having carefully hidden their bodies, hold their breaths and fall into a trance.\n\nTheir astral bodies are then liberated.\n\n.\n\n.\n\nThey fly away, and entering a house, make their way into the body of one of the occupants and feed on his entrails.\n\n“The Berberlangs may be heard coming, as they make a moaning noise, which is loud at a distance and dies away to a feeble moan as they approach.\n\nWhen they are near you, the sound of their wings may be heard, and the flashing lights of their eyes can be seen dancing like fire-flies in the dark.” Mr.\n\nSkertchley declares that he himself saw and heard a flight of Berberlangs pass by, and visiting next day the house he saw them enter, found the occupant dead without any sign of external violence.\n\nCompare Mr.\n\nSkertchley’s account of the Berberlangs lying in the long grass and throwing themselves into trance with Mr.\n\nMuldoon’s account of “The Projection of the Astral Body,” with which every student of occultism ought to be familiar, for it is undoubtedly a classic of occult literature, being a practical account of occult experiences and detailed instructions how to go and do likewise.\n\nBut to return nearer home.\n\nIn the course of my experience of the byways of the human mind, which, from the nature of my work, has been, like Sam Weller’s knowledge of London, extensive and peculiar, I have only known one case of genuine vampirism, according to the sense in which I use the term, and this was not one of my own cases, though I knew the persons concerned, but was handled by my original teacher, whom I have already referred to in connection with the case of the good lady who chased me with a carving-knife.\n\nI have made use of the facts of this case as a groundwork for one of the stories in The Secrets of Dr."


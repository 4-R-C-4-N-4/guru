[content]
body = "C., a woman of peculiar psychic temperament, who always called the old lady mother and was singularly attached to her, She was also very attached to Mr.\n\nC., but her feelings never exceeded, outwardly at any rate, the bounds of propriety, and Mr.\n\nC., who was sincerely attached to his own wife, never paid the slightest attention to her, looking upon her as his mother’s friend, and as such to be tolerated.\n\nMrs.\n\nC.\n\nunhesitatingly identified Miss X., as we will call her, as the younger witch.\n\nEnquiries were then made regarding her history, and a very curious story unfolded.\n\nAs a young girl she had become engaged to a man who, soon after the engagement was announced, had developed galloping consumption and died after a short illness with a violent hemorrhage.\n\nSoon after this, Miss Xs sister also became engaged, and by a strange fatality her lover shared the same fate, dying as died the other man, in a flood of his own blood.\n\nYears went by, and Miss X.\n\nbecame engaged again.\n\nSoon the second lover fell ill, not, this time, with galloping consumption, but with a more lingering form of the complaint, in which hemorrhage was the principle symptom.\n\nHe seemed to linger on from hemorrhage to hemorrhage, and this went on for years.\n\nMiss X., a woman of considerable private means, took a house, installed an aunt as a chaperone, and took her fiancé to live there and be nursed by her.\n\nSoon the aunt developed symptoms of illness; she appeared to be drained of all vitality and for days at a time would lie unconscious, but no specific cause was ever discovered for her illness.\n\nThis peculiar menage continued for years, Miss X.\n\nliving in her big house with these two moribund creatures lingering on from attack to attack.\n\nShe was a constant visitor at the home of the CS, both during the lifetime of Mr.\n\nCS first wife and that of his second, the friend of my friend.\n\nOn the death of Mr.\n\nCS first wife she had great hopes, it was observed, that his attentions would turn towards herself, but they did not; nevertheless she swallowed her chagrin, and succeeded in maintaining her foothold as an intimate friend of the family when the new Mrs.\n\nC.\n\ncame to preside over the household.\n\nCertain methods of protection were suggested to Mrs.\n\nC.\n\nwhich helped her considerably, but it was not possible to exclude Miss X.\n\nfrom the house owing to her intimacy with the old lady.\n\nIn due course, however, old Mrs.\n\nC.\n\nwas gathered to her fathers, and then young Mrs.\n\nC.\n\nput her foot down and said she would have no more to do with Miss X.\n\nMr.\n\nC.\n\nconcurred in this, as he had always had a repulsion for Miss X., and had only tolerated her for his mother’s sake.\n\nSoon after this Mrs.\n\nC.\n\nbegan to feel unwell, the indisposition slowly progressed, until finally, although she had no definite symptoms, she was obliged to consult a doctor on account of her steadily increasing weakness and sense of malaise.\n\nA diagnosis of rapidly growing cancer of the womb was made.\n\nAn operation was performed, which gave temporary relief, it was not expected to do any more, and she went downhill steadily.\n\nTowards the end she lapsed into unconsciousness, and at the same time, Mr.\n\nC.\n\nalso became unconscious, apparently having one of his seizures in sleep, from which he never awakened.\n\nThey died within a few hours of each other.\n\nMr.\n\nC.’s first wife had also died of cancer of the womb.\n\nAbout this time Miss X.’s aunt and fiancé died within a short time of each other, and the last that was heard of Miss X.\n\nwas that she had been removed to a nursing-home in the country with a severe mental breakdown."


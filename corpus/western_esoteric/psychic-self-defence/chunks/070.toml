[content]
body = "But quite apart from any form of coercion, unwary persons may, while filled with enthusiasm or glamoured by the new revelation, part with considerably more money than they can comfortably spare; they may even literally lay their all upon the altar, and then, disillusioned by subsequent events, greatly regret having done so.\n\nIn many such cases a competent solicitor can secure a refund.\n\nThe courts do not look with favour on excessive contributions to “movements.” It goes without saying, that no rightly conducted organisation would consent to augment its funds at the expense of the ruin of one of its members.\n\nIt must, of course, equally protect itself against capriciousness and spite and the machinations of the kind of mentality that tries to buy influence by subscriptions.\n\nIt has always been our custom, in the Fraternity of the Inner Light, to insist that any woman who proposes to give a large donation should consult her financial adviser before doing so.\n\nFor one reason or another we have refused upwards of twenty-five thousand pounds during the last seven years.\n\nNor have we had any reason at regret having done so.\n\nThe strength of an occult organisation does not lie upon the physical plane.\n\nIt is well known that there are various drugs which can be used to exalt consciousness and induce a temporary psychism.\n\nIt may not be equally well known that most of these substances come under the regulations of the Dangerous Drugs Act, and that to obtain them from irregular sources, or even to be found in possession of them save for a legitimate purpose, is to render oneself liable to prosecution, and in this case too the authorities are exceedingly alert All initiates of the Right-hand Path agree in declaring that to exalt consciousness by means of drugs is a dangerous and undesirable proceeding.\n\nThere may be research workers who for legitimate reasons wish to undertake experiments, but I cannot conceive of any legitimate reason for introducing a neophyte to the drug habit.\n\nIn any case, if such experiments are undertaken, they should be conducted under the supervision of a qualified medical practitioner who will be in a position to prevent catastrophe or deal with it should it arise.\n\nThe drugs that alter consciousness also affect the heart, and hearts are not always all they should be.\n\nMore over, the composition of rare drugs is not standardised and varies enormously; they are liable to contain various impurities, and samples may turn out to be unusually toxic.\n\nThe unpleasantness of having upon one’s hands an unexpected and unaccountable corpse is only exceeded by the unpleasantness of becoming the corpse oneself, either of which eventualities may happen when people begin to experiment with the drugs that “unloose the girders of the mind.” The morals of mankind in general leave much to be desired from the point of view of the purist, and the occult organisations, occupying as they do, the sea-coast of Bohemia, leave more than usual.\n\nA few of the best, maintaining that occultism is essentially a religion, uphold a high standard; the remainder are blest with a kaleidoscopic collection of soul-mates.\n\nThis need not concern us here.\n\nIf people choose to kick over Mrs.\n\nGrundy’s apron-strings, that is their affair.\n\nNor need we at the moment consider the occult abuses of sex-force, which will require detailed consideration in their proper place.\n\nAll we need consider in this chapter is the purely normal form of loose living which is camouflaged under a pretence of occultism.\n\nOf this I have seen numerous cases.\n\nThe head of one group systematically seduced his pupils under the pretext that it was part of their initiation, and the group accepted the situation in a spirit of the purest self-sacrifice.\n\nSeveral others sailed unpleasantly near the wind, with the result that “crushes” and the subsequent nervous breakdowns were very prevalent.\n\nIt ought hardly to be necessary to say that such methods form no part of the Right-hand Path."


[content]
body = "THE essence of a psychic attack is to be found in the principles and operations of telepathic suggestion.\n\nIf we put together what we know of telepathy and what we know of suggestion, we shall understand its modus operandi.\n\nSuggestion is of three kinds: Auto-suggestion, Conscious Suggestion and Hypnotic Suggestion.\n\nThe distinction, however, is not as fundamental as at first sight appears; for the goal of all suggestions in the subconscious mind is the same, and they do not become operative until, it is reached.\n\nSuggestion is distinguished from threats and appeals to reason by the fact that these aim at a mark in the conscious mind.\n\nIf they succeed, they owe their success to the acquiescence of the conscious personality, whether coerced or voluntary.\n\nBut suggestion does not make its appeal to consciousness, but aims at laying its hands upon the springs of action in the subconsciousness and manipulating them from there.\n\nWe might compare these two processes to the operation of pulling at the bell-knob outside the front door and taking up a floor-board and twitching the bell-wires themselves.\n\nThe result will be the same in both cases, the bell will ring.\n\nThreats and argument pull the bell-knob with varying degrees of emphasis, from the persistent tinkling of moral suasion to the resounding peal of the blackmailer.\n\nSuggestion twitches the wires at various points in their course.\n\nAuto-suggestion is given by one’s own conscious mind to one’s own subconscious mind.\n\nNow, you may ask, why can I not give orders to my subconscious mind direct, without having to resort to the paraphernalia of suggestion?\n\nThe answer to this question is very simple.\n\nThe subconscious mind belongs to a much earlier phase of evolution than the conscious mind; belongs, in fact, to a phase prior to the development of speech.\n\nTo address it in words, therefore, is like speaking to a man in a language he does not understand, In order to deal with him we must have resort to sign-language.\n\nSo it is with the subconscious mind.\n\nIt is no use to say to it, Do this: or, Don’t do that.\n\nWe must make a mental picture of the thing we want done and hold it in consciousness till it begins to sink into the subconsciousness.\n\nThe subconscious mind will understand this picture, and act upon it.\n\nThe actor who wishes to cure himself of stage-fright will fail to do so if he says to his subconscious mind, “Don’t be frightened,” for a nod is as good as a wink to a blind horse.\n\nEqually, if he makes a mental picture of stage fright and says to his subliminal self, “Now don’t do that,” the result will be disastrous, for the subliminal self will see the picture and omit the negative, because the word “not” means nothing to it.\n\nIn order to handle the subconscious mind effectually, we make a mental picture of the thing we want done and hold it in mind by repeated applications until the subconsciousness begins to be influenced and takes up the task of its own accord.\n\nThis is the end-result of all suggestion, and the different kinds of suggestion are distinguished, not by the difference in end-result, but by the gate through which they enter the subconscious mind.\n\nAuto-suggestion originates in our own consciousness; waking suggestion originates in the mind of another and is conveyed to our mind by the ordinary channels of the spoken or written word; hypnotic suggestion enters the subconscious mind direct, without impinging upon consciousness at all."


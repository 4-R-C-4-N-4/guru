[content]
body = "Four women are persuaded to embark upon a meditation process whose aim is to pour out force.\n\nThe nature of the force that is to be poured out is indicated by the fact that the married women are instructed not to live with their husbands and the unmarried girl is encouraged to fall in love with the man who is made the focus of the operation.\n\nThis man is the head of a group of people known to be occupied with practical occultism and ceremonial.\n\nThe conclusion I draw is that an occult experiment was afoot, and that, regardless of the consequences to them, these women were being made use of in order to carry it out, the procurer being the well-known psychic, Mr.\n\nX., and the operator the notorious Mr.\n\nZ.\n\nThe same group have to their credit a recurring series of scandals in connection with unnatural vice.\n\nIf this were merely vice as such it would not come within the purview of these pages, but it appears to be used systematically as a means of obtaining occult power.\n\nThose who have any knowledge of the deeper aspects of occultism know that sex force is one of the manifestations of kundalini, the serpent- fire that according to Tantric philosophy lies coiled at the base of the spine, or in the terms of Western occultism, the sacral plexus.\n\nThe control and concentration of the kundalini force is an important part of the technique of practical occultism.\n\nThere is a right way of directing it through thought-control, the technique of which I have explained in my little book, The Problem of Purity (Rider); but there is also another method, which consists in stimulating this force, and then directing it into abnormal channels where it will not be absorbed, but remain available for magical purposes.\n\nIt is for this reason that in certain forms of the Black Mass the altar is the naked body of a woman who may either be still living, or have been slain sacrificially.\n\nA.\n\nE.\n\nW.\n\nMason gives an account of such a transaction in his book, The Prisoner in the Opal.\n\nLess expert operators, however, cannot control this form of force; as soon as they generate it, it has to go to its logical conclusion.\n\nThey therefore employ another type of stimulus, not the woman, but the boy or youth.\n\nThe practice of paederasty in connection with occultism is very old, and was one of the causes of the degeneration of the Greek Mysteries.\n\nI have dealt with these subjects in some detail in another book of mine, Sane Occultism.\n\nParticulars of the actual cases can be found by reference to the files of Truth, the journal already referred to."


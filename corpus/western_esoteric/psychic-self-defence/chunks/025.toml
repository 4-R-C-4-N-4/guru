[content]
body = "She did not know this, nor was it likely to reach her ears indirectly, for he was very uncommunicative, I only knew that he was sealing his room because I chanced to see him doing it.\n\nNevertheless, one day I heard a knock at my door, and there was Miss L.\n\nwith her arms full of clean linen.\n\nShe asked me if I would be good enough to take it into the room of the head of the community, and put it away.\n\nI asked her why she did not do so herself, for I knew he was out, and it was her work to put away the linen.\n\nShe replied that she had been to his room for that purpose, but there was a psychic barrier across the threshold that prevented her entering.\n\nShe also asked me, on several occasions, to put inside my frock out of sight a little silver cross that I habitually wore, as she said she could not bear the sight of it.\n\nThis cross I had purchased just before coming to this occult college, and had taken it to a priest of my acquaintance to be blessed, for I had not been altogether easy in my mind concerning the nature of the group I was joining, and during the early days of my association with it was poised on tiptoe, as it were, ready for instant flight.\n\nNaturally I had kept my own council concerning the psychic precautions I had taken against my new friends, and no one was aware that the cross had been specially magnetised against psychic attack.\n\nNevertheless, the woman who would have attacked if she could, felt its influence and feared it.\n\nAuto-suggestion and imagination play so large a part in so-called psychic impressions that one is chary of accepting confirmatory testimony from a psychic who knows what is expected of him, but a spontaneous reaction is in my opinion evidential.\n\nWhen the treatment of Miss L.\n\nhad progressed some way towards her final recovery, much interesting information was elicited.\n\nShe told us that she had distinct memories of dealings with black magic in her previous lives.\n\nThis, she said, had been confirmed by several independent psychics, and I would certainly have been willing to add my testimony to theirs had I been asked.\n\nAs a child, she used to day dream that she was a witch, willing the death or misfortune of those who annoyed her, and she also averred, though whether this was true or not I cannot say, that her wishes were so effectual that she was frightened and tried to abandon the practice.\n\nShe also volunteered that she was in the habit of visualising herself standing before people she was angry with, scolding them, and projecting malignant force at them.\n\nThis, of course, would explain our nightmares.\n\nShe also said that she had been in the habit of attacking her mother and sister in this way, and had made her sister very ill, so that they now refused to have her in the house.\n\nThis statement was later confirmed by the mother.\n\nShe told us that she felt as if she were two distinct persons, her normal self being spiritually-minded, intensely compassionate and idealistic.\n\nHer other, and lower self, which came to the surface when she was crossed, upset, or over tired, being intensely malicious and subject to paroxysms of hate and cruelty.\n\nThese characteristics had been particularly marked when she was little.\n\nBut as she grew older she recognised the wrongfulness of them, and her lofty idealism represented her endeavour to rise above them.\n\nThis endeavour was, I am convinced, an honest one; unfortunately it was not always successful.\n\nShe referred to the incident in which she told me to lock my door, and said she had done so in the hope of affording me some measure of protection against the astral projection in which she knew she was tempted to indulge.\n\nAt first sight her case had looked like one, of obsession, and had been so diagnosed by one or two members of the community, but wise handling revealed otherwise."


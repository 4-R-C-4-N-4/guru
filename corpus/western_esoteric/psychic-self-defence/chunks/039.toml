[content]
body = "She went on to the stage and stood beside the small table which had been placed there for the convenience of the examiner, and commenced to recite the piece on which she was to have her lesson.\n\nShe herself had no occasion for nervousness; as had already been noted, she was an experienced speaker and teacher; moreover, nothing of importance hung upon this lesson, it was merely one of a series.\n\nNor was she usually nervous or self-conscious.\n\nBut as soon as she tried to start, she experienced a complete “dry-up,” and stood paralysed, unable to utter a word.\n\nA little prompting soon started her off, however, but she had experienced a nasty attack of stage fright, and it shook her nerve.\n\nFrom the psychic point of view, the explanation was not far to seek.\n\nShe was standing in the mental atmosphere created by a series of girls who had gone on to that platform for an examination upon which a good deal depended for them, and who had all been correspondingly nervous.\n\nShe herself, being sensitive, had been affected by this atmosphere, which induced in her a similar mental state by means of which is called “sympathetic induction,” a phenomenon well known in electricity and in acoustics, but equally valid in psychology.\n\nNo doubt the unfortunate examinees themselves were infecting each other.\n\nIt may well be that the “microphone panic,” so well known to broadcasters, is caused by the thought-atmosphere generated by a succession of nervous people who have stood upon the same spot.\n\nAn experience of my own may be of interest in this connection.\n\nI took a bed-sitting-room in a hostel, and as soon as I came there, I found myself afflicted with the most intense depression.\n\nI am not usually subject to the blues, being normally a cheerful soul, but as soon as I entered this room, which was a sunny and pleasant one, the cloud descended upon me, but lifted again as soon as I went out of it, whether into the dining-room of the hostel, or out of doors.\n\nI soon recognised that here was something that needed to be dealt with, and enquired as to the history of the room.\n\nI was told that it had previously been the bed room of the last owner of the house, who had been addicted to drink and had gone bankrupt.\n\nIt is a curious fact that drunkards and drug addicts make very evil psychic atmospheres, whereas a person who is a common criminal, however bad, is not nearly so noxious and his atmosphere fades rapidly.\n\nIn these two cases there was no question of an entity, discarnate or incarnate, being concerned in the matter; there was merely an unpleasant mental atmosphere generated by some powerful and painful emotion that had been experienced over a considerable period at that spot.\n\nSuch a concentration, if very strong, will linger almost indefinitely.\n\nThe structures that saw the concentration may have been pulled down and new ones built, nevertheless the forces remain, like a previous exposure on a photographic plate, and sensitive people are affected by them.\n\nThe insensitive may escape comparatively scatheless.\n\nIt is not altogether an easy matter to determine whether the disturbance is due to atmosphere alone, or whether an earth-bound entity complicates the situation.\n\nWhere an entity is present, it will usually be seen sooner or later.\n\nMoreover, it will usually be heard as well as felt.\n\nThis latter sign, however, does not invariably indicate the presence of an organised entity, for I know of a case wherein a room that had been used as a lodge of ritual initiation was subsequently partitioned into an office and two bedrooms after the lodge was moved elsewhere, and the bedrooms were practically uninhabitable owing to the din of cracks, bangs and thumpings that went on at night.\n\nIn such a case there was no reason to suspect the presence of any entity, for the rituals had not been of an evocative type, nor was the influence evil."


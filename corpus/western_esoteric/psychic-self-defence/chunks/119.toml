[content]
body = "That for many past lives she had been upon the Path, and that in her last life, a male incarnation, in order to speed up her progress she had travelled in the East, and eventually took initiation into one of the Thibetan Orders, which unfortunately turned out to be upon the Left-hand Path.\n\nHere she learnt the Hatha Yoga which gives control over the functions of the body.\n\nIn her present life, she retained the powers her training had given her, but not the memory of its technique.\n\nConsequently her emotional states affected those automatic systems of nervous control whose functions are normally not under the direction of the mind.\n\nWhenever, therefore, she was emotionally disturbed, her subconscious mentation overflowed into the automatic mind and threw certain of the functional systems of the body out of gear.\n\nIt is my belief that this explanation affords a key to a good many cases of functional disorder.\n\nMany people in the course of occult meditative practices obtain control of the automatic mind which controls the functioning of the bodily organs.\n\nIt may be recalled that the famous scientist, Sir Francis Galton, the founder of the science of eugenics, experimented with mental control of respiration, and having obtained it, found that the automatic function had fallen into abeyance, and he had to spend three anxious days breathing by will power and voluntary attention until the automatic function was re-established.\n\nIn this particular case, however, there was more than disturbance of function, there was this peculiar and very marked chronic exhaustion.\n\nI formed the opinion that a rapport still existed between her and the Thibetan Order of which she had been an initiate in her previous life.\n\nAs is well known to occultists, one returns life after life to the Order of which one is an initiate, the rapport being a very strong one.\n\nThis is one of the reasons why the great Mystery Schools have no need to make themselves known by advertising, they know their own, and pick them up on the astral plane.\n\nBut while it is an invaluable thing to be under the aegis of a reputable Order, it is an exceedingly unpleasant thing to stand in a similar relationship to a disreputable Order.\n\nIn this particular case it was my opinion that the Order to which this lady had belonged in her previous life had sunk to a very low ebb indeed, and its leaders were deliberately drawing upon the vitality of its members.\n\nActing upon this hypothesis, I projected myself astrally in the way I have already described, and visited this lady at night.\n\nI perceived that from her solar plexus as she lay asleep there stretched a black, elastic, stringy-looking substance that resembled nothing so much as a stick of Spanish liquorice that has been well chewed by a small boy.\n\nThis went off into space.\n\nUpon trying to see its further end I had a brief and far-off vision of a monastery with a Chinese type of roof perched on a crag among vast mountains.\n\nI tackled the situation by the simple expedient of passing in my astral body athwart the line of black substance, thus breaking it.\n\nIt immediately transferred itself to my solar plexus, and for a moment I felt a surge of tempting thoughts urging me to get this woman under my thumb and exploit her to her full financial capacity.\n\nI cast these out, and “went for” the rope of astral liquorice in the manner I have described, casting it off and searing the stump, and had the satisfaction of seeing it curl up and disappear into the darkness.\n\nI then fell into what I considered a well-earned sleep.\n\nI had told this lady nothing of my ideas because I wanted to see whether I could clear up the case by working solely on the occult hypothesis without any admixture of suggestion."


[content]
body = "Anyone who has any knowledge of the esoteric aspect of sex knows that union is as much etheric as physical.\n\nIt is this fact which constitutes the real difference between normal union and self-abuse, and explains why the former is vitalising and harmonising, and the latter is exhausting and nerve-wrecking.\n\nMay we not conceive it possible for anyone who can project the etheric body, or a being whose densest vehicle is etheric, to play a part in unions under certain conditions?\n\nAnd if we accept the theory of medium- ship, or of obsession, which is a pathological form of mediumship, what shall we say concerning the possibility of a union while one or other of the partners is under control?\n\nWhat maimer of soul might come through into incarnation under such conditions?\n\nMedieval tradition recognised two classes of demons which invade sleep, and called them Incubi and Succubi.\n\nThese were held to be responsible for lascivious dreams.\n\nModern psychology discounts their services and looks nearer home.\n\nThe psychic, however, is of the opinion that there is something in the old belief, and that the lustful imaginings of men’s hearts (and women’s too, for that matter) do indeed produce artificial elementals according to the method described in a previous chapter, and that these elementals are something more than subjective images, and have an objective etheric existence and play their part in the genesis of certain experiences.\n\nFor instance, a person may have dreams and phantasies of a lascivious nature, and these may give rise to their characteristic thought-forms; these thought-forms, now existing independently of the mind that originally conceived them, and being in the aura of that person, give him suggestion just as any other thought-forms projected telepathically from the mind of another person might do.\n\nWe little realise the extent to which we give ourselves telepathic suggestion by means of extruded thought-forms.\n\nWe are, in fact, ensphered by our own atmospheres, emanated by ourselves.\n\nI remember being told as a child that if a bird-cage were hung immediately under the canopy of an old-fashioned four-poster bed, the bird would be found dead in the morning, poisoned by the carbonic acid gas exhaled by the sleeper lying below.\n\nWe little realise the extent to which we are psychically poisoned by our own emanations of unguarded and unpurified thoughts.\n\nIt is well known that orgasm takes place in dreams, accompanied by appropriate dream-pictures.\n\nThe ancients believed that such an experience was due to the action of demons.\n\nModerns believe it to be due to physical tension.\n\nIt is not so generally known that there are people, both male and female, who can produce the same reaction at will solely by means of day-dreams.\n\nMay we not ask ourselves whether it cannot also be produced by means of telepathic suggestion, and whether this may not have played a part in the operations of many covens?\n\nThere is another curious phase of this aspect of the Left- hand Path, which was brought to my knowledge through a case which came into my hands.\n\nA young girl, simple minded and unsophisticated, living a very isolated life with a widowed mother, went to consult a well-known psychic, whom we will call Mr.\n\nX.\n\nIn the circle in which both Miss Y.\n\nand Mr.\n\nX.\n\nmoved there was another, and prominent figure, whom we will call Mr.\n\nZ., who had a reputation for a knowledge of magic.\n\nMr.\n\nX.\n\ntold Miss Y.\n\nthat he had read the records of her past lives, and that there was a karmic tie between herself and Mr.\n\nZ., and that she could help him in his work by pouring out upon him her love and magnetism.\n\nShe was instructed to meditate upon Mr.\n\nZ.\n\nevery night as she lay in bed, until she fell asleep."


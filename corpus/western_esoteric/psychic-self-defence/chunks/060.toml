[content]
body = "I had seen a good deal of practical occultism, had lent a hand at similar operations, and possessed the necessary formulae.\n\nSo I went round the town, asked certain friends to lend a hand, and others to come and see the fun.\n\nTo be frank, our attitude was that of a party of small boys going ratting.\n\nWe met at the appointed time and place.\n\nFormed our circle, and went to work.\n\nThe method I meant to use made it necessary for me to leave my body, and the group were really there to look after it while I was out of it, and see it came to no harm.\n\nI got out on to the astral readily enough, did my job, and returned, feeling very pleased with myself, for it was the first time I had operated entirely on my own, without the supervision by my teacher.\n\nAs I began to recover physical consciousness, which is just like coming round from an anaesthetic, I had a sensation as of machinery running, and felt as if I were lying on something very lumpy.\n\nI opened my eyes, and saw some thing brown towering above me to an enormous height.\n\nAs I gathered my senses together, I discovered that I was lying on the floor, close to the skirting, across the feet of an unfortunate man, who was thus securely pinned against the wall, and it was he, shaking in his shoes, that had felt to me like the vibration of machinery.\n\nVarious other members of the circle slowly and reluctantly reappeared from behind the piano and sofa and other heavy articles of furniture.\n\nThey had seen some practical occultism for once in their lives, but they did not appear to like it.\n\nIt appears that, after I had gone out and left them with my unconscious body, they got a good deal of phenomena in the way of bells and voices outside the circle.\n\nIf they had kept quiet, it would have been quite all right, but they lost their heads and scattered.\n\nThen, the circle being broken, I began to perform antics, arching up on my head and my heels and, in some way that has never been explained, arriving at the far side of the room at the feet of one of the circle, which, of course, did not improve matters.\n\nThen an extraordinary thing happened.\n\nWe were just gathering ourselves together, thinking that everything was over, when a force of what nature I have never known suddenly rushed round the circle, and one member seemed to take the brunt of it.\n\nHe went flying across the room and landed, fortunately for him, face downwards in an arm-chair, and was ill in bed for three weeks.\n\nWhile all this was going on, the father of one of the people taking part became uneasy about her, and walked across from where he lived at the far side of the little town, to see what was happening.\n\nLike most little country towns, this one usually went to bed early, but he told us that as he came along he saw that innumerable windows were lit up, and he heard the sounds of children crying all down the street.\n\nWhen I think of the risks I took and the conditions under which I worked in those early days, I wonder that I or any of my friends are alive to tell the tale.\n\nIt is said that there is a special Providence to look after fools, drunkards and little children.\n\nI think there must be another that looks after inexperienced occultists and their friends.\n\nIt may be interesting to note that as a result of this operation which I so rashly undertook, the girl was entirely freed from the domination of her mother, and began forth with to put on flesh and rapidly became normal.\n\nThat end of it, at least, was entirely successful.\n\nAnother very curious case is that referred to in the Occult Review of January, 1930 .\n\n“The mysterious death of a student of occultism, Miss N."


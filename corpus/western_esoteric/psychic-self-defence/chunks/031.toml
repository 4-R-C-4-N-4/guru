[content]
body = "It was tangible, even to the dog-like odour.\n\nFrom it to me stretched a shadowy line of ectoplasm, one end was attached to my solar plexus, and the other disappeared in the shaggy fur of its belly, but I could not see the actual point of attachment.\n\nI began by an effort of the will and imagination to draw the life out of it along this silver cord, as if sucking lemonade up a straw.\n\nThe wolf- form began to fade, the cord thickened and grew more substantial.\n\nA violent emotional upheaval started in myself; I felt the most furious impulses to go berserk and rend and tear anything and anybody that came to hand, like the Malay running amok.\n\nI conquered this impulse with an effort, and the upheaval subsided.\n\nThe wolf-form had now faded into a shapeless grey mist.\n\nThis too absorbed along the silver cord.\n\nThe tension relaxed and I found myself bathed in perspiration.\n\nThat, as far as I know, was the end of the incident.\n\nI had had a sharp lesson, and a highly instructive one.\n\nIt may not be convincing to other people, owing to the lack of corroborative evidence, but it was exceedingly evidential to me, and I put it on record for what it is worth to those who, having personal knowledge of these things, can see its significance.\n\nIt is a curious point that, during the brief twenty-four hours of the Thing’s life, the opportunity for an effectual vengeance presented itself."


body = "This poor girl, lonely and unsuspicious, gave herself up unreservedly to this task.\n\nPresently, however, she began to grow uneasy.\n\nHer common sense asserted itself, for she found the meditations she was required to perform were having a very disturbing effect upon her; but Mr.\n\nX.\n\nallayed her fears and recalled her to her allegiance by assuring her that he had looked into the future and seen that eventually Mr.\n\nZ.\n\nwould marry her.\n\nBy now she had upon her hands a heart-breaking love affair which was making her very unhappy and unfitting her for work.\n\nA number of letters upon the subject were exchanged between Miss Y.\n\nand Mr.\n\nX., which I have seen.\n\nI did my best to persuade her to drop the whole affair.\n\nMr.\n\nX.\n\nsucceeded in persuading her to go on with it, playing upon her feelings and telling her how terrible would be the plight of Mr.\n\nZ.\n\nif she withdrew her psychic support, and renewing his assurance of a karmic tie which would result in an ultimate marriage if she were faithful.\n\nMiss Y., pitifully distressed and bewildered, betook herself to certain of the leaders of the organisation to which all three of them belonged.\n\nThese people seconded my advice that she should discontinue these practices, but persuaded her to surrender the very compromising letters which were in her possession.\n\nHaving secured these, they declared that the whole transaction was imagination on her part, and instead of turning this choice pair of scoundrels out of their ranks, let them continue to function as usual.\n\nThis would be a strange enough case if it were an isolated one, but it is not.\n\nAnother woman came to me about this time in a state bordering on insanity, and told me that she too had been consulting Mr.\n\nX., who had told her that she had already received initiation on the Inner Planes, though she might not be conscious of it, and that her psychic faculties were on the point of opening (a stock remark of his), but if she wanted to make real progress on the Path she must cease to live with her husband and he (Mr.\n\nX.) would put her in touch with her astral soul-mate.\n\nThe consequence of this precious advice was to break up her home and send her out of her mind.\n\nOne day, walking in the Park, she met Mr.\n\nZ., and declared him to be her astral lover, a statement which Mr.\n\nX.\n\nconfirmed, and embellished with the information that Mr.\n\nZ.\n\nwas also the Master who would initiate her.\n\nI tried to persuade her to bring the whole transaction to a summary conclusion and return to her husband, but she replied that she could never do this after the astral experiences she had had.\n\nMr.\n\nX.\n\nre-established his influence over her, she left the address at which I had known her, and I have never heard what became of her.\n\nHer condition when I last saw her was deplorable - emaciated, wild-eyed and twitching with convulsive movements.\n\nWould anyone believe the story of such a woman?\n\nObviously no one, unless they had seen the letters that I had seen.\n\nNor is this the only case; a fellow-worker of mine told me of two precisely similar ones which had come to her knowledge in connection with Mr.\n\nX.\n\nIt is cases such as these which make the honest investigator of occult phenomena thankful that there is upon our statute-book a law which enables magistrates to deal effectually with occultists who prostitute their powers.\n\nIt is so generally known that no initiate may use the occult arts for gain that it is difficult to sympathise with people who pay some advertising occultist his half-crown or half-guinea and then find themselves let in for unpleasantness.\n\nWhat conclusions may we draw from the incidents that I have related, for the facts of which I can vouch from personal knowledge?"


[content]
body = "Whatever it may be that affects the diviner is probably the same thing that affects the occult attack.\n\nWhen we recall, moreover, that running water will throw hounds off the scent just as effectually as it will the alleged witch, we may feel that we cannot be accused of gross superstition if we give the old folk-tradition a trial and note the results.\n\nWater, again, is the vehicle of purification.\n\nIt is used in the rite of baptism by the Church and in the Preparation of the Place by the occultist about to perform a ceremony.\n\nStrictly speaking, there should be a trace of salt in the water thus employed, and both salt and water are blessed with powerful invocations when the priest is preparing holy water, whether for a baptism, or for placing in the holy water stoup for the use of the congregation.\n\nAs far as the occultist is concerned, salt to him is the emblem of the element of earth.\n\nIt is also a crystalline substance, and crystalline substances, in their different forms, receive and hold etheric magnetism better than anything else.\n\nWater, on the other hand, is the emblem of the psychic sphere.\n\nThese two realms, between them, contain by far the greatest part of occult evil.\n\nIt is rare indeed that spiritual wickedness in high places will reach up as far as the airy realms of mind or the fiery realms of spirit.\n\nIf we want to get into touch with, or operate upon a particular sphere, we use as base a substance appropriate thereto.\n\nConsequently, a solution of salt and water makes a better base than either salt or water could do separately because it enables us to cover the whole of the sphere of probable operations in a single act.\n\nIt may be interesting to note concerning the magical properties of crystalline substances, that crystals are used in wireless apparatus to pick up the subtle vibrations of the ether.\n\nOnce again we are close upon the trail of our electro-bacteriological analogy.\n\nIt is an excellent plan, when trying to break an undesirable psychic contact, to immerse oneself in a bath of water that has been especially consecrated for the purpose; re-dressing in new or at least clean clothing afterwards, and if it be by any means possible, moving into a different room.\n\nIf this cannot be done, move the bed into a different position, taking care to turn it at a different angle; that is to say, if you have been in the habit of sleeping lying north and south, place your bed so that you will now be lying east and west.\n\nThe following prayers may be used for the blessing of the salt and water.\n\n“(Pointing the first and second fingers at the salt.) I exorcise thee, creature of earth, by the living God (+), by the holy God (+), by the omnipotent God (+), that thou mayest be purified of all evil influences in the Name of Adonai, Who is Lord of Angels and of men.\n\n“(Extending hand over salt.) Creature of earth, adore thy Creator.\n\nIn the Name of God the Father Almighty, maker of heaven and earth, and of Jesus Christ His Son, our Saviour, I consecrate thee (+) to the service of God, in the Name of the Father and of the Son and of the Holy Ghost.\n\nAmen.” “(Pointing first and second fingers at the water.) I exorcise thee, creature of water, by the living God (+), by the Holy God (+) by the omnipotent God (+), that thou mayest be purified from all evil influences in the Name of Elohim Sabbaoth, Who is Lord of Angels and of men.\n\n“(Extending hand over water.) Creature of water, adore thy Creator."


[content]
body = "A garment recently and habitually worn, a lock of hair, a piece of jewellery, all these can be made to serve provided they are properly preserved.\n\nCrystalline substances, such as precious stones, hold magnetism better than anything else; metals are also good, whether precious or otherwise.\n\nA pocket knife, for instance, will hold magnetism well.\n\nWood holds it badly, and so do paper, wool, cotton and artificial silk, especially the latter.\n\nSilk and linen are good.\n\nIndia-rubber is useless.\n\nGlass depends for its holding powers upon its form.\n\nIf it is cut so that it will refract light it can be very good; if it is flat and purely transparent, like a window pane, it is almost useless.\n\nStone is fair.\n\nEarthenware poor.\n\nAn elaborate article is not as good as a simple article.\n\nFor instance, a marquise ring is not as good as a signet ring.\n\nLetters are apt to be misleading because they often contain nearly as much of the magnetism of the recipient as of the writer.\n\nSome psychics can work from a photograph, but this method is not, strictly speaking, psychometry, for the mental image evoked by the photograph is used to pick up the corresponding image in the reflecting ether.\n\nGreat care should be used in taking a psychometric specimen, for it is readily contaminated by the magnetism of anyone who handles it, who is in proximity to it, or who even thinks about it concentratedly.\n\nFor instance, if while packing up such a specimen for sending off you are brooding over the problem it presents and working out your own theory, the psychometrist may pick up your thought-form instead of reading the conditions of the person to whom the object belongs.\n\nThe materials which are used for packing should also be free from magnetism.\n\nI knew of a case wherein the psychic said that a certain trinket belonged either to a nurse or to someone who had to do with hospitals.\n\nAs a matter of fact, it belonged to neither, but had been packed in surgical cotton-wool.\n\nWhen packing up a psychometric specimen, do it as expeditiously and with as little handling as possible.\n\nTake a piece of “virgin” black or white silk (not coloured), large enough to serve as a wrapper.\n\nThrow it over the article and bundle it up rapidly, handling it through the silk.\n\nIn the occult sense, “virgin” means something that has never been used for any other purpose.\n\nFor instance, you should not use part of an old dress or a cushion-cover.\n\nAn article which does not lend itself to handling by this method can be picked up with sugar-tongs or the points of a pair of scissors and laid on the square of silk in which it is to be wrapped.\n\nPack the wrapped article in a wooden box, being sure that any padding which is used is also virgin.\n\nThe report of a single psychometrist should not be relied upon.\n\nSpecimens should be sent to two at least.\n\nIt is also well when sending specimens, and especially when sending a birth-hour for a horoscope, not to allow the name to be known lest gossip should be spread about.\n\nAstrologers are much too fond of handing round charts and discussing them.\n\nI have known some very unfortunate things come about in this way.\n\nA horoscope from someone who understands the nature of the work in hand is of great value, for the position of the planets in the heavenly houses not only serves as an aid to diagnosis but is a very important guide to treatment.\n\nIt is best therefore to explain to the astrologer the nature of the case, and the kind of information that is wanted, so that he can examine the chart accordingly.\n\nA horoscope is to an occult therapist what an X-ray photograph is to a doctor."


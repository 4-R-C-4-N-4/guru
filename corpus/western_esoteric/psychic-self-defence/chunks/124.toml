[content]
body = "I got more and more uneasy, and X., being a good psychic, detected my uneasiness, and I was asked to withdraw from the group he was organising.\n\nI felt quite convinced that something sinister was being attempted against the group-mind of my race, but I had no means of gauging its extent or potency.\n\nThis was not the kind of tale one could take to Scotland Yard; moreover, several of my personal friends believed in the bonafides of X.\n\nand were taking part in the group he was organising, and I was very anxious not to involve them in any unpleasantness.\n\nIn my perplexity I resolved to do nothing upon the physical plane and to invoke the Masters upon the Inner Planes.\n\nAt this time I was not of a grade which is supposed to have direct access to the Masters, but I determined to try and get them telepathically, though I did not know whether those to whom I was trying to telepath were human or non-human, incarnate in physical bodies or discarnate entities, for at that time I was not very advanced in my occult studies.\n\nAll I had to hold on to was an abstract idea and the knowledge that in previous difficulties I had been able to get in touch with Something on the Inner Planes which had proved a powerful friend.\n\nIn telepathing, the usual method of getting in touch is to visualise the person you want to communicate with and call him by name.\n\nI had nothing I could visualise and I knew no names.\n\nHowever, I determined to make the attempt as best I might and, metaphorically speaking, I put my head out of the window of this fleshly tabernacle and called for the police.\n\nAnd I got an answer.\n\nThe Inner Voice replied to me very clearly and distinctly: “You are to go to Colonel Y.” I was taken aback at this, for Colonel Y.\n\nwas a rather eminent person to whom I had once been introduced, and the last person in the world one would invite to go mare’s nesting.\n\nI had no desire to make myself ridiculous by bearding this forminable warrior in his den.\n\nMy psychological studies had made me familiar with the workings of the subconscious mind and what it can do when dissociated, and I felt that the situation required handling with considerable caution because the results of a mis-step might be unpleasant.\n\nI therefore replied to the Inner Voice, “I cannot trust you unless you will give me a sign.” The reply came through, “Colonel Y.\n\nwill be at our next lecture.\n\nTell him then.” To this I replied, “I know that Colonel Y.\n\ncannot be at my lecture because his regiment is ordered abroad, and he will have left before it takes place.” The answer came back, “Colonel Y.\n\nwill be at your next lecture.” “Very well,” I said, “that shall be my sign.\n\nIf Colonel Y.\n\nis there, I will tell him, and if not, I shall leave the affair to take its course.” The day duly arrived when I was to give a public lecture at a certain town.\n\nI arrived at the hall in due course, and the first thing I saw was Colonel Y.\n\ngoing up the stairs!\n\nSo I determined to take the bull by the horns, and immediately after the lecture I went straight to him and said, “I have got a message for you.” “I know you have,” he replied, “for I have been told to expect it.” It appears that he was sitting in his quarters one evening with his two dogs.\n\nThey suddenly became disturbed and began to investigate something that wasn’t there.\n\nHe heard a voice saying distinctly to his inner ear that I should come and ask his help and that he was to give it.\n\nHe was so impressed by this occurrence that he went to a mutual friend and asked her whether I was in trouble of any sort."


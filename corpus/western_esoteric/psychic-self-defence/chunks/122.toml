[content]
body = "From being in the midst of turmoil one is suddenly raised high above it and sees all the circumstances of one’s life spread out like a bird’s-eye view, as one might see the land from a high place, and one knows intuitively the out come of the matter.\n\nAll emotional turmoil ceases, and one is like a ship hove-to, securely riding out the storm.\n\nWhen this occurs to me, the memory of my past incarnations is always vividly present also.\n\nIt is this simultaneous wakening of the past which makes me feel that the voice is that of my own Higher Self, and not of another entity.\n\nIt is my belief that in times of spiritual crisis the man that has faith in the law of God can rise up and invoke its protection and a seeming miracle will be performed for his benefit.\n\nYet there can be no breach of natural law; there fore such a miracle must simply be an example of the working of a law with which we are as yet unfamiliar, just as an eclipse appears to the savage as a miracle, but to the astronomer as a natural phenomenon which he can forecast with accuracy.\n\nWhat is it that induces this change of control in our lives?\n\nWe are familiar with the fact that the engine of a car has three speeds and a reverse.\n\nMay it not be that our minds are also geared, and that it is a changing of gears which induces psychism?\n\nAre there not times when we get into reverse and the ape and tiger within us take charge?\n\nBehind the physical plane lies the astral plane, and behind the astral plane lies the mental plane, and behind the mental plane lies the spiritual plane, each plane acting as plane of causation to the one beneath it, and each in turn being controlled from the subtler plane above it.\n\nWhen we “change gear,” consciousness is shifted from a denser to a subtler plane and we begin to move among remoter and remoter causes of which the happenings upon the physical plane are the end-results; we manipulate these causes and the results are immediately effected.\n\nWhen we change gear from the physical to the astral, we find’ ourselves upon the plane of psychic consciousness and the lesser magic.\n\nSupposing a psychic combat is taking place between two occultists, if one of them is of such a grade that he can change gear again, so that consciousness is lifted from the astral to the mental plane, he will be in the sphere of the greater magic and be in full control of the situation.\n\nThe other can make no stand against him.\n\nBut what happens in the case of the rare and mystic soul who can shift consciousness once again and engage the gears of a purely spiritual power?\n\nHe has outclassed the adept.\n\nThere are many souls who have this mystical spiritual consciousness although they have no occult knowledge.\n\nBetween the higher and the lower modes of thought there is a great gulf fixed across which they leap precariously.\n\nIf in a time of crisis they are able to rise up in faith and enter into this mystical consciousness and be still, they will have the upper air of any occultist who relies upon nothing save the technique of occultism.\n\nThe question of mystical consciousness is, however, outside the scope of our present enquiry, which is concerned with psychic methods and the traditional technique of the occultist.\n\nDifferent temperaments will employ different methods, and the mystical method does not appeal to everybody.\n\nThe occultist does not ignore the Christ-force, however; he recognises it as among the hierarchy of supreme forces of the universe, although he may not be prepared to assign to it the exclusive position which it occupies in the heart of the Christian mystic.\n\nIn the Western Tradition it is symbolised by Tiphareth, the central Sephira of the Ten Holy Sephiroth of the Qabalistic Tree of Life.\n\nThe Christ-force is the equilibriating, compensating, healing, redeeming, purifying factor of the universe."


[content]
body = "PSYCHISM, however genuine, is a fruitful cause of self-delusion.\n\nA psychic is invariably highly sensitive and suggestible.\n\nThis is the basis of his gifts.\n\nPsychism not being a normal development, among Europeans at any rate, the psychic is, in the language of nautical engineers, “over-engined for his hull.” He is consequently unstable, liable to violent emotional reactions, and in general exhibits those aberrations of conduct we are accustomed to associate with artistic genius.\n\nUnless a psychic is trained, disciplined, protected and watched over by those who understand his condition, his psychism is never reliable because he is blown about by every wind of influence.\n\nThe psychic and the neurotic are closely akin in their reactions to life, but the neurotic differs from the psychic in that, instead of being over-engined for his hull, he is under-hulled for his engines.\n\nThe result is the same, however - a discrepancy between the force and form with the consequent inability to maintain a central, reasoned, directing control.\n\nThe technique of the occult discipline is largely directed towards maintaining control of the disparate forces, compensating the sensitiveness of the psychic, and protecting him from unwanted impressions.\n\nIt is never well to learn how to open the door of the Unseen unless at the same time one learns how to close and latch it.\n\nAs was noted in the Introduction, it is comparatively seldom that the Unseen comes in search of human beings.\n\nAs the Caterpillar told Alice concerning the Puppy-dog, “You let it alone, and it will let you alone.” But if we begin to study occultism, or even to dabble in it, sooner or later we are liable to obtain results, provided, of course, that the system we are using contains the germs of efficacy.\n\nIn the case of a person who is coming on to the Path for the first time, progress is necessarily slow and laborious; but a soul that has taken initiation in previous incarnations may reopen the latent psychic faculties so rapidly that the problem of maintaining the harmonised co-ordination of the personality becomes a serious one.\n\nIt is exceedingly common for a person who is making his first contact with the occult movement to experience psychic disturbance.\n\nThis is sometimes attributed to evil influences, sometimes to evil entities.\n\nNeither of these inferences may be just.\n\nThere is a third possibility, which is responsible for by far the greater percentage of victims - the mere fact that consciousness is being disturbed by an unaccustomed force.\n\nHow common a thing it is to see a child feverish and fretful during the first few days of a seaside holiday.\n\nIt is not necessarily sickening for an illness.\n\nThe strong air and unaccustomed food and the excitement of its new surroundings are disturbing its sensitive physical equilibrium.\n\nSo it is when the neophyte is disturbed at the outset of his occult career.\n\nThe unaccustomed vibrations are upsetting him, and he is having an attack of occult indigestion.\n\nIn both cases the treatment is the same - temporary restriction of the diet which has caused the disturbance.\n\nAnother cause of psychic upset may lie in the partial recovery of the memories of past incarnations if these include any painful episodes, especially such as are connected with esoteric studies.\n\nThe entry of occult concepts into the conscious mind tends to awaken the subconscious memory of similar experiences in past lives.\n\nThe emotion surrounding a memory is invariably recovered before the actual image of the incident.\n\n(This is one of the best tests for the accuracy of memories of past lives.) This foreshadowing emotion may hang about for a long time on the threshold of consciousness before the images clarify sufficiently to became tangible.\n\nIf the emotion that is rising over the horizon is of a painful nature it may cause considerable disturbance, and in the absence of an experienced adviser may be attributed to an occult attack, or to the psychic perception of evil influences in the occult group to which the neophyte is affiliated."


body = "The uninitiated occultist goes ahead gaily, juggling with such Names of Power as he has picked up from the innumerable books on the subject now available for the general reader, thinking that if he does not invoke the demons he will not get them.\n\nHe forgets that every planet is a Jekyll and Hyde.\n\nConsequently, ceremonial magic has got a bad name owing to the unpleasant frequency of untoward results, just as surgery got a bad name before the days of Lister.\n\nIt is the imperfect technique that is the trouble.\n\nI was once doing some experimental work with geomancy, which is a method of divination belonging to the Element of Earth.\n\nNow all divinations, when performed according to their esoteric formulae, always begin with an evocation of the genius that presides over that particular operation.\n\nThe genii of geomancy are not of a very high type.\n\nI was imperfectly familiar with the method, and was trying to set up my prick-figure on a piece of paper instead of using a tray of wet sand as I should have done.\n\nThings began to go wrong, and the room was filled with the most terrible stench of drains.\n\nThe appropriate banishing ritual was immediately performed, and the air cleared; but there was not much doubt about the objectivity of this phenomenon while it lasted.\n\nA very interesting case is given in the Occult Review for December, 1929 .\n\nin a letter to the editor, signed H.\n\nCampell.\n\n“Desiring some information which I could not get in any ordinary way, I resorted to the System of Abra Melin, and to this end prepared a copy of the necessary Talisman, perfecting it to the best of my ability with my little stock of knowledge.\n\nThe ritual performed, I proceeded to clear my ‘place of working.’ A little knowledge is a dangerous thing; my ritual was imperfect and I only rendered the Talisman useless without in any way impairing the activities of the entity invoked.\n\nThis looks like nothing else than gross carelessness on my part; and to a certain extent this is true - but the point I wish to make is this, that my knowledge of this particular system, and therefore my ritual, were imperfect; and in any case, I had been shown no method of combating this particular entity when once aroused.\n\nNow note the results.\n\n“Unfortunately I have no account of the date when these occurrences began, but the first hint of trouble must have come on or about March 3, 1927.\n\nI can guess the date with fair accuracy because, as I was to learn, the manifestations were always strongest about the new moon, and after I had gone to sleep.\n\nUpon this occasion I can remember waking up suddenly with a vague feeling of terror oppressing me; yet it was no ordinary nightmare terror, but an imposed emotion that could be thrown off by an effort of the will.\n\nThis passed almost as soon as I stood up, and I thought no more about it.\n\n“Again on April 2, or thereabouts, I was troubled by the same feeling, but regarded it as nothing more than a severe nightmare, though the fact that my sleep was distorted towards the time of the new moon had occurred to me; while as full moon drew on, the nights were peaceful again.\n\n“The new moon of May I brought a recurrence of the trouble.\n\nThis time very much more powerful, and necessitating an almost intolerable effort of will to cast if off.\n\nAlso it was about this time that I first saw the entity which was rapidly obsessing me.\n\nIt was not altogether unlovely to look at.\n\nIts eyes were closed and it was bearded, with long flowing hair.\n\nIt seemed a blind force slowly waking to activity.\n\n“Now there are three points which I must make quite clear before I proceed.\n\nIn the first place, I was never attacked twice in the same night."


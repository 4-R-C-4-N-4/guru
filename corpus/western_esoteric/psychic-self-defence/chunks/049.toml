[content]
body = "They are never living normally in full possession of their faculties.\n\nAn equally difficult problem is set to the non-human who is drawn into our midst.\n\nA single-element creature is bidden to control and assimilate an additional three elements for which it has no equipment or experience, and the result is disastrous.\n\nBut it is not enough that we should merely describe the conditions and state the problem in these pages.\n\nOur aim is essentially practical.\n\nWhat then can be done when a non-human has to be faced and dealt with?\n\nIt must be clearly realised that any mating between a human and a non-human is a hopeless proposition.\n\nIn the first place, it can only be the preamble to a divorce, because non-humans are promiscuous in their sexual habits; and, secondly, there is nothing in the nature of a non-human that can satisfy the higher aspirations of the human.\n\nWe must not allow the human form to mislead us as to the existence of a human soul.\n\nA non-human is a pet animal, not a fellow-creature.\n\nThat, frankly, is the only possible ground upon which they can be approached.\n\nIf we expect no more of them than we should of a pet bird, if we manage them as we should manage a kitten, we have got as near to the solution of the problem as we are ever likely to get until the Dark Angel mercifully restores them to their own kingdom; a mercy seldom long delayed, for non-humans do not make old bones.\n\nHuman beings may also come into touch with elemental beings by themselves venturing into the spheres of elemental life.\n\nSuch contacts need not necessarily be harmful to either kingdom provided those who enter into them know what they are about.\n\nIn fact, such associations are frequently entered into by occultists in the course of their work and researches, but it is an undertaking for the advanced initiate only, not for neophytes.\n\nThere are cases, however, where such an association may lead to harm.\n\nThe human partner in the association may be ill-equipped or ill-adapted for the undertaking.\n\nHe may have ventured out beyond his depth, having picked up a formula from some more experienced occultist and used it without proper preparation.\n\nOr again, it is not uncommon to find people who have brought through from previous incarnations a natural aptitude for getting into touch with the elemental kingdoms.\n\nIn such cases it may occur that an elemental who has had experience of relations with human beings may deliberately get into touch with them.\n\nThis is in every way undesirable, for the elemental has not got the knowledge of human conditions necessary to enable it to avoid injuring its new friend.\n\nIn any case, elementals have got a one-way intelligence, and it is not well that they should be senior partners in any alliance with human beings.\n\nThe whole question of elemental contacts, an exceedingly fascinating one, is too extensive and intricate to be entered upon in these pages.\n\nIt has been necessary to refer to it, however, for certain cases of psychic difficulty may be due to inexpert operations on both sides of the Veil.\n\nThese elementals, or nature spirits, are quite different to the controls with whom Spiritualistic circles come into touch.\n\nThe Spiritualistic movement is highly organised on the Inner Planes, and promiscuous controlling is not permitted.\n\nControls have, in fact, to “sit” for development in just the same way that mediums do, and there is invariably some experienced entity within call who can come to the assistance of the circle if all is not going well.\n\nWestern Occultism was thoroughly disorganised and broken up by centuries of persecution; its Inner Plane conditions, consequently, present many tangles and gaps even to this day.\n\nIt is nothing like as well organised as the Spiritualistic sphere."


[content]
body = "In the ordinary way, if a person who is out on the astral meets with an occult attack, he bolts back to his body like a rabbit to its burrow and wakes up as if from a nightmare; but if the sleep is made unnaturally deep by a sleeping- draught, he cannot wake up, and is locked out on the astral, as it were, which is the last thing one wants in the case of a psychic attack.\n\nIf a sleeping-draught is considered essential, for it is impossible to go without sleep indefinitely, the person who is watching beside the sleeper should observe carefully any signs that the sleep is being disturbed by dreams, and if he observes muttering or twitching, should immediately perform the necessary banishings and whisper into the ear of the sleeper soothing and reassuring suggestions such as Coue recommends should be done in the case of young children.\n\nOne of the most distressing features of a psychic attack is that the victim fears to sleep because he feels that in sleep he is defenceless.\n\nThose who have read Kipling’s terrible story, “The End of the Passage,” may remember that the victim of the occult attack therein described always went to bed wearing spurs in order that he might rowel himself and so wake up if he were struggling with his invisible enemy during sleep.\n\nThere is a great deal that can be done upon the physical plane to help the person who is suffering from an occult attack, and we may as well consider these physical methods while we are upon the subject of the part that can be played by a doctor in dealing with the case.\n\nSunlight is exceedingly valuable because it strengthens the aura and makes it much more resistant.\n\nPeople are often advised to go away into the country on this account, but for the victim of an occult attack to go into the depths of the country may not be the wisest thing, because elemental forces are much more potent away from towns, and if he is threatened by an uprush of atavistic forces, he had better cling to the haunts of men.\n\nThe sea, too, is an elemental force that is best avoided, for water is an element intimately associated with psychism.\n\nLarge bodies of water and high mountains should be avoided in choosing a health resort for a person suffering from psychic trouble.\n\nThe best place is an inland spa.\n\nGames, physical training, massage, anything that improves the bodily condition, are invaluable, but long solitary walks should be avoided because there is often a risk of suicide.\n\nThe person who is the victim of an occult attack should at all costs avoid solitude.\n\nThere is another very simple measure which gives immense relief in cases of psychic interference.\n\nIt is obvious that the attack is made through the psychic centres, therefore any thing which closes those centres will render the victim comparatively immune.\n\nIt is well known how the stolid, materialistic type of person can live with impunity in haunted houses that drive the sensitive to madness and suicide.\n\nIt is also well known that psychic work cannot be performed if there is food in the stomach; the best results are always obtained when fasting.\n\nThe obvious corollary of these facts is that if we want to keep the psychic centres closed, we should not allow the stomach to become empty.\n\nThe person who is facing a psychic attack should not go more than two hours without food.\n\nCertain important psychic centres are in the head.\n\nOne of the simplest ways of checking their activity is by drawing the blood down from the head.\n\nThis can be done effectually by a hot bath or putting the feet in hot mustard and water.\n\nAnother important centre is the solar plexus; during a psychic attack this is often felt to be tense and distressing.\n\nA large hot-water bottle, well filled so that it is heavy as well as hot, laid upon the solar plexus, which is the hand-breadth between the pit of the stomach and the ribs, will effectually relieve tension in that spot."


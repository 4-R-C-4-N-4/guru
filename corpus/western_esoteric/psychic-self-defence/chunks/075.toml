[content]
body = "In fact, we may say that no occult process is really potent, nor can it be said to have completed its circuit, unless it has its point of contact with dense matter; a point which many occultists leave out of their calculations.\n\nOccultism, though primarily a mental process, is not a purely mental process.\n\nIt is both spiritual and material.\n\nIn the great majority of cases of insanity, organic brain changes cannot be demonstrated, but alienists are more and more coming to recognise that they may look for the lues of Hecate in the blood.\n\nIts chemical composition may depart from normal, whether owing to a change in the hormone balance or to the by-products of disease.\n\nThis change in the blood chemistry is immediately followed by a change in the emotional tone.\n\nIt may become over-emotional or depressed, apathetic or irritable.\n\nThe ancients described these conditions admirably as the four humours, the sanguine, the bilious, the limphatic and the choleric.\n\nIt has been abundantly demonstrated by physiologists that emotional states affect the chemical composition of the blood.\n\nIt is gradually being realised that these changes are brought about through the mediation of the ductless glands, which may be called the emotional brain, just as the grey matter within the skull may be called the sensory-motor brain.\n\nIt follows, therefore, that if through some interference with their functioning the glands produce a blood-composition corresponding to that produced by them when a particular emotional state is giving its special stimulus, the individual will experience the physical sensations associated with the corresponding emotional state.\n\nHis mind will proceed to adjust itself to these conditions by accounting for them through the imagination as best it may.\n\nSo that if there is a state of the blood characteristic of the condition of fear, fear-images will arise in the mind.\n\nIt is upon this basis that the organic insanities produce their characteristic mental states.\n\nWhether the emotional state be due to a mental cause or a physical cause, the result is the same for the patient.\n\nOrganic insanities are distinguished from functional ones solely by their origin.\n\nAn organic insanity tends to depart further from the normal than a functional nervous disorder, because in the latter a considerable degree of compensation takes place, for the patient can to a great extent pull himself together and keep himself from going to disastrous extremes.\n\nThis is not the case with an organic insanity, which proceeds to its logical conclusion.\n\nIt is for this reason that a neurotic, although he may suffer severely, seldom has a complete breakdown unless he is sure of the necessities of life.\n\nThe self-preservation instinct keeps him on his feet.\n\nHaving considered the physical and subjective bases of mental disturbances, we are now in a position to assess accurately the part played by the Unseen.\n\nWhat happens when a neurotic takes up occultism?\n\nWe can best answer this question by considering what happens when a normal person takes up occultism.\n\nHe learns for the first time of the existence of the Invisible Worlds and begins to think about them.\n\nImmediately he does this he comes into touch with them.\n\nAt first he may not be able to perceive them consciously; nevertheless he is feeling them subconsciously and they are affecting him.\n\nHis life shows this to the close observer in a thousand ways.\n\nThere are great forces moving like currents in the Unseen and we are drawn into these according to our temperamental affinity for them.\n\nThe violent personality is drawn into the Current of Mars, the emotional, suggestible one into the sphere of Luna.\n\nThe influences of these spheres play upon them.\n\nNow the occultist working under a proper system, knowing that he has got to meet these forces sooner or later, picks them up one by one voluntarily and by means of the appropriate rituals, and synthesises them within his own nature.\n\nHe knows too that each aspect has its obverse.\n\nThe Virgin Mary is reflected in Lilith."


[content]
body = "I had had enough experience of practical occultism to know that the thing I had called into visible manifestation could be controlled by my will provided I did not panic; but that if I lost my nerve and it got the upper hand, I had a Frankenstein monster to cope with.\n\nI stirred slightly, and the creature evidently objected to being disturbed, for it turned its long snout towards me over its shoulder, and snarled, showing its teeth.\n\nI had now “got the wind up” properly; but I knew that everything depended on my getting the upper hand and keeping it, and that the best thing I could do was to fight it out now, because the longer the Thing remained in existence, the stronger it would get, and the more difficult to disintegrate.\n\nSo I drove my elbow into its hairy ectoplasmic ribs and said to it out loud: “If you can’t behave yourself, you will have to go on the floor,” and pushed it off the bed.\n\nDown it went, meek as a lamb, and changed from wolf to dog, to my great relief.\n\nThen the northern corner of the room appeared to fade away, and the creature went out through the gap.\n\nI was far from happy, however, for I had a feeling that this was not the end of it, and my feeling was confirmed when next morning another member of my household reported that her sleep had been disturbed by dreams of wolves, and she had awakened in the night to see the eyes of a wild animal shining in the darkness in the corner of her room.\n\nNow thoroughly alarmed, I went off to seek advice from one whom I have always looked upon as my teacher, and I was told that I had made this Thing out of my own substance by revengeful thoughts, and that it was really a part of myself extruded, and that I must at all costs recall it and reabsorb it into myself, at the same time forgoing my desire to “settle accounts” with the person who had injured me.\n\nCuriously enough, just at this time there came an opportunity most effectually to “settle” with my antagonist.\n\nFortunately for all concerned, I had enough sense left to see that I was at the dividing of the ways, and if I were not careful would take the first step on to the Left-hand Path.\n\nIf I availed myself of the opportunity to give practical expression to my resentment, the wolf-form would be born into an independent existence, and there would be the devil to pay, literally as well as metaphorically.\n\nI received the distinct impression, and impressions are important things in psychic matters, for they often represent subconscious knowledge and experience, that once the wolf-impulse had found expression in action, the wolf-form would sever the psychic navel-cord that connected it with my solar plexus, and it would be no longer possible for me to absorb it.\n\nThe prospect was not a pleasant one.\n\nI had to forgo my dearly-loved revenge and allow harm to be done to me without defending myself, and I also had to summon and absorb a wolf-form which, to my psychic consciousness at any rate, looked unpleasantly tangible.\n\nNor was it a situation in which I could either ask for assistance nor expect much sympathy.\n\nHowever, it had to be faced, and I knew that with every hour of the Thing’s existence it would be harder to deal with, so I made the resolution to let the opportunity for revenge slip through my fingers, and at first dusk summoned the Creature.\n\nIt came in through the northern corner of the room again (subsequently I learnt that the north was considered among the ancients as the evil quarter), and presented itself upon the hearthrug in quite a mild and domesticated mood.\n\nI obtained an excellent materialisation in the half-light, and could have sworn that a big Alsatian was standing there looking at me."


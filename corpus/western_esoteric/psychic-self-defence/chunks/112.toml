[content]
body = "Touching his forehead he says, “To Thee, O God (touching his solar plexus) be the Kingdom, (touching his right shoulder) and the Power (touching his left shoulder) and the Glory, (clasping his hands) unto the ages of the ages.\n\nAmen.” By this formula the operator affirms the power of God as sole creator and supreme law of the universe to which all things must bow, and he establishes this formula magnetically in his aura by the action of making the Sign of the Cross upon himself.\n\nThis Sign is not an exclusively Christian symbol, and can be used as readily by the Jew as the Churchman, for it is the Equi-limbed Cross of Nature that is being used, not the Calvary Cross, of which the shaft is double the length of the cross-bar, and which is the symbol of sacrifice.\n\nThe Equi-limbed Cross refers to the four quarters of the globe and the four elements, and the formula associated with it proclaims the dominion of God over these, and thereby occultly formulates His kingdom within the sphere of the operator.\n\nThe operator next imagines himself to be clasping in his right hand a large, cross-handled sword, such as is depicted in pictures of Crusaders.\n\nHe holds it point upright and says, “In the Name of God I take in hand the Sword of Power for defence against evil and aggression,” and imagines himself to be towering up to twice his natural height, a tremendous armed and mailed figure, vibrating with the force of the Power of God with which he has been charged by his formulation of the Sword of Power.\n\nHe now proceeds to draw the Magic Circle upon the floor with the point of the Sword of Power, and he should see in his imagination a line of flame following the point of the Sword, consisting of small flames, such as spring up when methylated spirit is spilt and ignited, but of a pale golden colour.\n\nA little practice should enable this circle of light to be formulated effectually.\n\nKeep on going round the circle until it is formulated.\n\nThe circle should always be drawn deosil, that is to say, from east, to south, to west, to north, in the same way that the hands of a clock would move were the clock laid face upwards on the floor.\n\nThe contrary way is widdershins, the way in which the witches danced at the Sabbats.\n\nThe deosil movement affirms the rule of God’s law in Nature because it is the Way of the Sun; the widdershins movement repudiates God’s rule over Nature by moving against the sun.\n\nIn resisting an occult attack the whole formula should be tuned to the key-note of asserting God’s dominion over all existence, the aim of the operator being to align himself with Cosmic Law and cause the Power of God to deal with the interference.\n\nThe Circle being formulated, the operator, ceasing to visualise the sword but still visualising the circle, clasps his hands in prayer, and raising them above his head towards the east, prays, “ May the mighty archangel Raphael protect me from all evil approaching from the east.” Turning to the south he repeats the same formula in prayer to Gabriel.\n\nTurning to the west, he invokes Michael.\n\nTurning to the north he invokes Uriel.\n\nFacing to the east again, and thus completing the circle, he repeats the formula of the Qabalistic Cross.\n\nThis formulation of the magic circle is especially valuable for protecting the sleeping-place, the circle being drawn around the bed.\n\nIt is not necessary to move about the room, or shift the furniture in order to draw the circle, it will be formulated wherever it is visualised to be."


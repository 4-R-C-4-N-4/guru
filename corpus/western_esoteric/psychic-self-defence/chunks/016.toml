[content]
body = "This power, however, can be used for evil as well as good; the Founder of Christian Science was wise enough to put her teaching in such a way that her students would not readily discern the second edge of the sword.\n\nAs long as the world in general was ignorant of the powers of the mind, it was better that nothing should be said by those who knew, because the knowledge, if spread abroad indiscriminately, might do more harm than good, giving information to those who ought not to have it.\n\nBut now that so much is generally known and even practised concerning the powers of the human mind, it is as well that the real facts should also be known and the whole matter brought out into the open, and as far as lies in my power I am prepared to do this.\n\nAny message to the subconscious mind must be couched in very simple terms, because subconscious thought is a primitive form of mentation, developed before spoken language was known to mankind.\n\nThe primary aim of the suggestion is to create a mental atmosphere about the soul of the person, whether that person is to be attacked or healed, until a sympathetic response or reaction is elicited within the soul itself.\n\n(I use the term soul to include both the mental and emotional processes, but to exclude the spiritual ones.) Once this reaction is achieved, the battle is half over, for the gate of the city has been opened from within, and there is free ingress.\n\nThe telepathic suggestion of definite ideas can now proceed rapidly.\n\nIt is this point which is the critical one in any occult attack.\n\nUp to this point, the defender has the advantage.\n\nIf he has sufficient knowledge, the knowledge I hope to make available through this book, he can without any undue exertion retain that advantage indefinitely, and wear his attackers down, even if unable to meet them on their own ground of occult knowledge.\n\nThere is nothing in this world or the next that a hypnotist can do with the person who keeps his nerve and won’t pay attention.\n\nThere are two gates, and two only, by which the attacker can gain entrance to the city of Mansoul, and these are the Self-preservation Instinct and the Sex Instinct.\n\nThe hypnotic appeal must be couched in terms of one or both of these if it is to be successful.\n\nHow does the attacker proceed?\n\nHe has to create an atmosphere about the soul of his victim on the Inner Planes.\n\nHe can only do this by creating that atmosphere within his own consciousness while he thinks of his victim.\n\nIf he wants to perform a psychic murder, he must fill his own soul with the rage of destruction until it overflows.\n\nIf he wants to perform a psychic rape, he must fill his soul with lust and cruelty.\n\nThe cold rage of cruelty is essential to effectual operations of this nature.\n\nNow what happens when he does this?\n\nHe has sounded a ringing keynote in the Abyss.\n\nIt will be answered.\n\nAll beings who have this keynote for the basis of their nature will respond.\n\n“Dark Uriel and Azrael and Ammon on the wing - “ and will join in the operation.\n\nBut they do not operate direct upon the victim, they work through the operator.\n\nIt is like the old game of Nuts and May, in which the one who is sent “to fetch her away” is gripped round the waist by the leader of a chain of supporters.\n\nThe real pressure comes on his own abdominal muscles, as anyone who has played the game will remember.\n\nAnd when the magical operation is over, what then?\n\nWill the operator be left to enjoy his victim in peace?\n\nIs IT LIKELY ?\n\nThis is the mystical basis of the story of Faust.\n\nThe Devil might be not only willing but anxious to enable Dr.\n\nFaustus to win Margarita, but he came for his soul at the appointed time."


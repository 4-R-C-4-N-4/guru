[content]
body = "The great Orders have their definite contacts and work strictly within them, keeping a firm hand on neophytes; outside the Orders there is a good deal of chaos and banditry, and it is unwise to venture far save in the company of an experienced occultist who understands the technique of the methods employed.\n\nThere are many people for whom the Deva Kingdom, as the sphere which the elementals share with the Nature Spirits is sometimes called, has a great fascination, and they try by meditation and ritual to get into touch with it.\n\nIn my opinion it is decidedly risky for a person who is not an initiate to attempt this work.\n\nIt is exceedingly apt to lead to mental unbalance, if not to actual obsession.\n\nNot that the nature contacts are evil, but they are profoundly disturbing to the human consciousness because they stir those atavistic depths which the psycho-analyst aims at laying bare by means of his technique.\n\nAnyone who is acquainted with the literature or practice of psycho-analysis knows that the ab-reaction is an important factor in this system; it is a crisis, and can, for the time being at any rate, upset the patient pretty thoroughly and exacerbate all his symptoms.\n\nWhen we touch the elemental contacts we get the same reaction that is caused by psycho-analysis when the censor is being penetrated.\n\nPersons in whom the subconscious mind is near the surface, such as the artist, the crank, the unstable, and, for the matter of that, the genius in any walk of life, love the elemental contacts because they stimulate the elemental forces in their own nature which are to them the springs of their power and inspiration.\n\nBut the average citizen, whose mental content is organised largely in a basis of repression and compromise in order that he may be a citizen at all and take his place in organised society, is upset by the elemental contacts according to the proportion of repression to compromise in his make-up.\n\nCompromise is the normal lot of humanity; repression is the pathology of compromise.\n\nThe person who has managed to effect a working compromise between the different elements of his nature can afford to allow himself a holiday with the Devas without doing any body any harm; but the person who is repressed will find that they disagree with him actively because they are having the same effect upon him that a drastic psycho-analysis would have.\n\nWe hear sometimes of the tragedy that results from taking the last dose in a bottle of tonic of which arsenic is one of the ingredients.\n\nThis is due to the fact that the bottle has not been thoroughly shaken up each time a dose has been taken, so that the arsenical sediment has all collected in the last dose and reached a poisonous concentration.\n\nSo it is with the elemental contacts; they are a potent tonic, but they can reach a poisonous concentration under unsuitable circumstances.\n\nI have never come across or heard of a case of pathology due to the fascination of the Element of Earth; it is not an element that usually attracts the amateur experimenter, though the initiate appreciates its value and importance.\n\nI have come across cases, however, of sensitive people dwelling in a mountainous country, especially in narrow gulches where there is a paucity of sunlight, who have become obsessed with the fear of the mountains.\n\nThey do not fear so much that the mountains will fall upon them as that they will close over them, as the cave closed upon the children who followed the Pied Piper of Hamelin.\n\nThe psychiatrist will, of course, recognise this symptom as belonging to the well-known psycho-neurosis of claustrophobia.\n\nThis, however, does not invalidate my statement; for in my opinion we may find that in a more intimate knowledge of the elemental kingdoms we shall come upon the clue to both claustrophobia and agarophobia.\n\nMountaineers also know this peculiar terror with which the great hills can obsess mankind."


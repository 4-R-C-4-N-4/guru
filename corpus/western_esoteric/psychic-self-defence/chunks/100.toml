[content]
body = "HAVING considered the purely physical factors in a psychic disturbance, we may now come to the consideration of its genuinely psychic factors.\n\nWe must always bear in mind, however, that because physical disease is found, it does not necessarily eliminate the psychic factor.\n\nA physical condition, such as an abnormal state of the blood, may cause a low form of psychism and put its victim in touch with evil astral conditions.\n\nScience may call it delirium or hallucination, but the occultist calls it pathological psychism and can do a great deal to relieve it, either by closing down the psychic centres, or by excluding evil psychic influences from the environment of the patient so that the spirits he sees shall be angelic instead of demonic, and cause him happiness instead of distress.\n\nThe psychic centres forced open by a diseased blood-stream perceive anything that comes within their range of vision.\n\nTherefore let us ensure that nothing save what is pleasant shall come near them.\n\nWe may not be able entirely to keep him off the Astral, but at least we can ensure that his wanderings shall be in a safe and pleasant part of the Astral.\n\nPeople do not realise the extent to which the wanderings of delirium can be directed and controlled by suggestions whispered into the ear of the sick person.\n\nWe can companion the sick man in his astral wanderings and make our voice heard among his visions, by our knowledge driving away the evil presences that threaten him and guiding his dreams into the way of peace.\n\nAt the commencement of our diagnosis we must distinguish between three broad classes of psychic disturbance: those which are a by-product of physical disease, those which are due to malicious human action, and those which are due to non-human interference.\n\nThe first type should be readily picked out by the doctor if, as has already been advised, recourse has been had to him as the essential preliminary.\n\nMoreover, he will also be effective in eliminating the frauds, for people moving in psychic circles and familiar with their terminology may simulate a psychic attack either in order to borrow money or obtain hospitality, or out of pure love of notoriety, a far commoner motive for human aberrations than is generally realised.\n\nFrauds usually either fade away or recover quickly when threatened with a physical overhaul.\n\nThose who decide to chance their luck are pretty quickly caught out by the man who has served his time in the out-patient department of a general hospital.\n\nThe diagnosis which the occultist has to make therefore lies in distinguishing between the attack of an incarnate mind and the attack of a discarnate mind.\n\nThere are two ways in which he can do this, and he ought to use them both, so that they countercheck each other.\n\nHe ought to get at least two independent psychics to psychometrise the case, and he himself ought to make his own diagnosis entirely from the case-history interpreted in the light of first principles.\n\nIt is a great mistake to mix the psychic and the scientific.\n\nThey are apt to neutralise each other.\n\nLet one person do the psychism and another the observation, and let proper precautions be taken to prevent the results of the clairvoyant investigation being vitiated by suggestion, or by the thought-reading of previously conceived opinions held in the mind of any of the persons concerned.\n\nIt is therefore a good thing to send off the specimens for psychometrising at the commencement of an occult investigation, before any opinions have been formed.\n\nIt is not the simplest matter in the world to take psychometric specimens properly.\n\nI have seen a man bring a lock of hair belonging to someone else out of his pocket, where he had carried it about for a couple of days, and hand it over for psychometry.\n\nIt was of course so thoroughly impregnated with his own emanations as to be useless.\n\nA psychometrical specimen should be some object thoroughly impregnated with the vibrations of a person."


[content]
body = "PSYCHIC trouble not infrequently arises owing to the formation of an undesirable rapport.\n\nIn order to understand the nature of this problem we must consider the whole subject of rapport.\n\nWe have already considered in some detail the question of telepathic suggestion.\n\nRapport might be considered as the passive aspect of that of which telepathic suggestion is the active aspect.\n\nIt forms, in fact, the basic condition necessary for telepathic suggestion to take place.\n\nTwo people who are in rapport might be described as astral Siamese twins.\n\nAlthough the physical bodies are independent units, the astral bodies are linked in such a manner that there is free circulation of astral force between them, just as the circulatory system of the mother is connected through the umbilical cord with the unborn child, and the same blood circulating freely through both.\n\nThis fact explains many important occult phenomena.\n\nIt is the real key to marriage, and explains many facts in the relationship of parent and child.\n\nIt also accounts for some important aspects of the relation of pupil and teacher.\n\nBut not only is it possible for a rapport to be established between two individuals, but between an individual and a group.\n\nThis fact plays an important part in all fraternity work.\n\nIt is also possible to establish rapport between a human being and other kingdoms of nature; with discarnate entities, superhuman beings, and, in fact, with any form of life with which an individual can form a sympathetic understanding.\n\nThere must be some ground of sympathy as the basis for the formation of a rapport, but once formed, it can be developed almost indefinitely.\n\nIt is a curious fact that if a rapport is long continued, the persons thus united gradually come to resemble each other.\n\nWe all know the “horsey” type of man; also the son of the soil of whom it was expressively remarked, “Father’s in the pig-stye.\n\nYou’ll know him by his hat.” When two human beings are in rapport, the less positive of the two tends to lose his own individuality and becomes the pale reflection of the other.\n\nIt is for this reason that the Western occultist, who values individuality highly, does not take personal pupils in the same way as does the Eastern guru, but prefers to work through ritual with a group because this method is more impersonal.\n\nBut even so, the individual members of a group will undergo certain changes whereby they are tuned in to the group-tone, so that there will be a certain common denominator which they all possess.\n\nWho cannot recognise the sign-manual of the Christian Scientist, the Theosophist, the Quaker?\n\nAny system which has group meditation rapidly puts its mark on its members.\n\nIn this fact, of course, lies much of the value of association with a worthy group.\n\nIn it, equally, lies the detriment of association with an unworthy group.\n\nLet us consider what happens when a person of ordinary good character becomes associated with a group of degenerate moral tone.\n\nHe will either find himself in such sharp antagonism to the group-mind that he will have no option but to withdraw, or he will rapidly but unconsciously be tuned to the keynote of his new associates.\n\nWithout his being aware of the fact, his moral sense will have become blunted and he will accept as a matter of course what he would originally have turned from in disgust.\n\nRapport once established, other things beside the general feeling-tone can be shared.\n\nActual ideas can be transferred from one mind to another as in telepathy; and in the same way, vital force can be transmitted.\n\nIt is this fact which is the explanation of certain types of spiritual healing.\n\nWhen etheric vitality is being transmitted, it is necessary that the persons concerned should be within the immediate magnetic field of each other; but when astral force is in question, this is not necessary.\n\nTransmission is independent of space."


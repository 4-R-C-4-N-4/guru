[content]
body = "It is neither giddiness nor mountain sickness, but a curious oppression of the spirits by the overwhelming grandeur of nature.\n\nThe same force, when not at a poisonous concentration, inspires the passion ate love of the hills or of the sea that Kipling has celebrated so gloriously in one of his poems.\n\nThe pathologies of the Element of Water may be a fascination so great that a man will walk out into the sea until he drowns.\n\nSwinburne had this peculiarity, and has immortalised it in several of his poems, “Strike out as the heart in us bids and beseeches, athirst for the foam.” On one occasion he was picked up in the open sea by a Breton fishing-smack, swimming tirelessly, many miles from land, borne on the sea by currents, but oblivious of his danger.\n\nBeing rescued, he sat upon the deck with his mane of red hair drying in the wind, chanting sea-poems to his rescuers, a spectacle that one would have given much to witness.\n\nAnother curious case of water-pathology I knew person ally.\n\nA very level-headed woman, a school teacher, was obsessed by a horror of rough waves.\n\nShe always declared that if she went on the sea-front to watch a storm, the waves made a “dead set” at her.\n\nShe lived at a seaside place, but so great was her dislike of the waves that she did not care to walk on the promenade when the tide was in.\n\nShe was cured of her fear in a curious way.\n\nShe took initiation into Co-Masonry, and found to her surprise that from that day forth she was free from her fear of the sea.\n\nI am not a Co-Mason, and speak subject to correction, but I believe I am right in saying that Co-Masonry differs from other forms of Masonry in that Elemental Invocations have been introduced into it.\n\nThe Element of Air, as all occultists know, is a very tricky element to deal with.\n\nMore initiates turn off the Path in the Grade of Air than in any other, and it is rare to see a Ritual of Air worked without something being dropped or knocked over.\n\nIt is a quarrelsome element; when it is being worked, the operators are apt to bicker and squabble.\n\nIt is also intimately associated with sex, as is revealed by its symbolism.\n\nIf an occultist is making a magic circle, and for any reason wishes to seal it with the Kerubim of the Elements instead of the Archangels, as is more commonly done, and feels himself unequal to the task of drawing a presentable eagle, the symbolic form of the Kerub of Air, he will use the Zodiacal sign for Scorpio.\n\nThe evolutionary connection between the snake and the bird is well known to biologists; but long ages before Darwin, initiates used the Serpent and the Eagle to represent the unsublimated and sublimated aspects of the life-force.\n\nThe Scorpion connects with the Serpent through the Dragon.\n\nI had a very curious experience myself in connection with the Element of Air.\n\nI am betraying no secrets if I say that certain grades of initiation refer to the elements, for the fact is too generally known, and too obvious, for it to be any more mysterious than the Queen of Spain’s legs.\n\nTo begin with, I have an exceptionally bad head for heights, and as the Abyss of Height belongs to the Element of Air, I obviously have no natural affinity with it.\n\nThe ceremony went exceptionally badly even for an Air Ritual.\n\nTwo of the principal officers, husband and wife, helped to maintain its reputation as a contentious element by having a family jar in the middle of the proceedings, and the usual upsets and smashings occurred on a generous scale.\n\nFor the next fortnight I lived in the midst of a cataclysm of crockery."


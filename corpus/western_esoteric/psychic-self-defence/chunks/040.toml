[content]
body = "It was merely force in a state of tension.\n\nIt was sheer physical noise that made the disturbance, as I can testify, for I have slept, or rather, tried to sleep, there.\n\nWhere a ghost is seen, it is usually also heard because for a form to be sufficiently substantial to be visible there must be a modicum at least of ectoplasm in its composition, and ectoplasm is capable of exercising force on the physical plane, in some degree at least.\n\nWhere a ghost is both seen and heard, we may be sure there is an actual haunting.\n\nWhere it is seen, but not heard, it may possibly be that a person with psychic tendencies is perceiving the images in the reflecting ether, the photographic plate of Nature, and there may be no actual entity present.\n\nWhere the disturbance is heard, but not seen, it may be due to astral forces set in motion by ritual magic, and which continue for a while after the original impulse is withdrawn.\n\nThese may be perfectly harmless, save that they disturb the sleep in the same way that a rattling window would do.\n\nOn the other hand, if powerful evocative rituals have been performed, and the clearing of the sphere has not been properly done, profound disturbances may result and the whole situation be exceedingly unpleasant.\n\nExamples will again help to make the problem clear.\n\nAs an instance of a non-ritual haunting, I may cite the case of a friend of mine who went to live in a block of modern mansions.\n\nFrom the first she was not happy there, and as time went by the oppression and distress strengthened.\n\nComing into her drawing-room one evening at dusk, she saw in the half-light a man standing with his back to the room, gazing intently out of the window.\n\nShe switched on the light, and found that there was no one there.\n\nOn several occasions her maid saw someone walk down the passage leading to this room.\n\nMoreover, the hall door had a knack of coming open of its own accord.\n\nMy friend’s depression deepened until finally, when standing herself at the drawing-room window one day, she had a sudden impulse to fling herself out.\n\nThen she realised that things were serious and that liver-pills and a week-end at the seaside would not put them right.\n\nBeing an occultist, she understood the significance of the happenings that had been going on in her flat, and she made enquiries concerning the history of the square in which this block of modern mansions had been built.\n\nShe learnt that it was the site of an old madhouse of sinister reputation.\n\nThe form that she and her maid had seen was probably that of some unfortunate patient of suicidal tendencies who had succeeded in giving effect to his impulses on a spot corresponding to the situation of her room.\n\nThe terrific emotional forces generated by his brooding and last desperate act were photographed on the atmosphere, as it were, and suggested to her mind thoughts of self-destruction just as the ill-temper or depression of a companion will induce a similar mood in ourselves without any word spoken.\n\nAnother example within the sphere of my experience, although it was not actually my case, is of much interest in that it combines an example of a very definite poltergeist haunting with vampirism.\n\nI was once consulted by a mental healer to whom a very curious case had been brought.\n\nSome charitably disposed people had raised funds to found a home for unwanted babies, and a suitable house had been purchased on the outskirts of a village not far from London.\n\nThe house had been a conspicuous bargain and they were very pleased with it.\n\nSoon, however, they began to be disturbed by some very curious phenomena, and also by inexplicable illness and seizures among the babies.\n\nOne child, in fact, actually died, and its death was not satisfactorily accounted for.\n\nThen one of the nurses, an Irish girl, began to be affected also."


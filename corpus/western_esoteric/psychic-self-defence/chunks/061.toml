[content]
body = "Fornario, is receiving the attention of the authorities at the present time.\n\nMiss Fornario was found lying nude on the bleak hill-side in the lonely island of Iona Round her neck was a cross secured by a silver chain, and near at hand lay a large knife which had been used to cut a large cross in the turf.\n\nOn this cross her body was lying.\n\nA resident of London, Miss Fornario seems to have made her way to lona for some purpose connected with occultism.\n\nOne of the servants at her house in London stating that a letter had been received saying she had a ‘terrible case of healing on.’ One newspaper report alludes to ‘mysterious stories on the island about blue lights having been seen in the vicinity of where her body was found, and there is also a story of a cloaked man.’ Occultists no less than the general public will await with interest any disclosures that may be forth coming concerning this occurrence.” No disclosures ever were forthcoming, however, and conjecture alone can work upon the case.\n\nOne detail only can I add to the brief but comprehensive report of the Occult Review.\n\nThe body bore marks of scratches.\n\nI knew Miss Fornario intimately, and at one time we did a good deal of work together, but some three years before her death we went our separate ways and lost sight of each other.\n\nShe was half Italian and half English, of unusual intellectual calibre, and was especially interested in the Green Ray elemental contacts; too much interested in them for my peace of mind, and I became nervous and refused to co-operate with her.\n\nI do not object to reasonable risks, in fact one cannot expect to achieve anything worth while in life if one will not take risks, but it appeared to me that “Mac,” as we called her, was going into very deep waters, even when I knew her, and that there was certain to be trouble sooner or later.\n\nShe had evidently been on an astral expedition from which she never returned.\n\nShe was not a good subject for such experiments, for she suffered from some defect of the pituitary body.\n\nWhether she was the victim of a psychic attack, whether she merely stopped out on the astral too long and her body, of poor vitality in any case, became chilled lying thus exposed in mid-winter, or whether she slipped into one of the elemental kingdoms that she loved, even as Swinburne swam out to sea, who shall say?\n\nThe information at our disposal is insufficient for an opinion to be formed.\n\nThe facts, however, cannot be questioned, and remain to give sceptics food for thought.\n\nIt may be as well to say in concluding this chapter, that when I speak of the experiments of ceremonial magic, I do not mean ritual initiation.\n\nNow a ritual initiation is of course ceremonial magic, and so, for the matter of that, are the sacraments of the Church.\n\nBut the occultist, using his terms perhaps somewhat loosely, does not include the initiatory rituals when he speaks of ceremonial magic.\n\nThere are many varieties of initiatory ceremonies, but these are all designed to work upon the soul of the candidate only.\n\nCeremonial magic, on the other hand, in the technical sense of the term, is designed to work upon the soul of nature.\n\nThe two operations, although there are innumerable forms of each, are entirely different in type, and aim at, and achieve, entirely different results.\n\nThere is a strong prejudice against ritual magic among those interested in popular occultism owing to the strictures passed upon it by Mme Blavatsky.\n\nNow Mine Blavatsky was trained in the Eastern School and had very little, if any, practical acquaintance with the inner aspect of Western Occultism, nor was she a master of its methods."


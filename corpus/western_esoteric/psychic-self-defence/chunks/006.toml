[content]
body = "My heart was beating so hard that at each beat a loose brass knob on the bedstead rattled.\n\nFortunately for me, my friend saw that something was seriously wrong and she sent for my family, who fetched me away.\n\nThey were exceedingly suspicious.\n\nThe Warden was exceedingly uncomfortable, but no one could prove anything, so nothing was said.\n\nMy mind was a blank.\n\nI was thoroughly cowed and very exhausted, and my one desire was to get away.\n\nI did not recover, however, as had been expected.\n\nThe intensity of the symptoms wore off, but I continued to be exceedingly easily tired, as if I had been drained of all vitality.\n\nI knew that, somewhere at the back of my mind, was hidden the memory of a terrible experience, and I dared not think of it, because if I did, the shock and strain would be so severe that my mind would give way altogether.\n\nMy chief consolation was an old school arithmetic book, and I used to spend hour upon hour doing simple sums to keep my mind from racing itself to pieces in wondering what had been done to me and sidling up towards the memory, and then shying away from it like a frightened horse.\n\nFinally I gained some measure of peace by coming to the conclusion that I had simply had a breakdown from overwork, and that the whole queer transaction was the fruit of my imagination.\n\nAnd yet there was a lingering feeling that it was real and this feeling would not let me rest.\n\nAbout a year after the incident, my health still being very poor, I went away to the country to recuperate, and there came across a friend who had been on the spot at the time of my breakdown.\n\nIt had apparently caused a good deal of talk, and I found here one who was not inclined to explain away my experience, but asked pertinent questions.\n\nAnother new friend became interested in my case and haled me off to the family doctor, who bluntly gave it as his opinion that I had been hypnotised.\n\nIt was before the days of psycho therapy, and his ministrations to a mind diseased were limited to patting me on the back and giving me a tonic and bromide.\n\nThe tonic was useful, but the bromide was not, as it lowered my powers of resistance, and I speedily discarded it, preferring to put up with my discomfort rather than to render myself defenceless.\n\nFor all the time I was obsessed by the fear that this strange force, which had been applied to me so effectually, would be applied again.\n\nBut although I feared this mysterious power, which I now realised was abroad in the world, I cannot tell what a relief it was to me to find that the whole transaction was not an hallucination, but an actual fact that one could rise up and cope with.\n\nI obtained my release from the bondage of this fear by facing the whole situation and determining to find out exactly what had been done to me and how I could protect myself against a repetition of the experience.\n\nIt was an exceedingly unpleasant process, in fact the reaction caused by recovering the lost memories was only a little less violent than the original one; but I finally succeeded in freeing myself from my hag-ridden condition of fear, although it was a very long time before my physical health became normal.\n\nMy body was like an electric battery that has been completely discharged.\n\nIt took a long time to charge up again, and every time it was used before the charging was completed, it ran down again rapidly.\n\nFor a long time I had no reserves of energy, and after the least exertion would fall into a dead sleep at any hour of the day.\n\nIn the language of occultism, the etheric double had been damaged, and leaked prana.\n\nIt did not become normal until I took initiation into the occult order in which I subsequently trained."


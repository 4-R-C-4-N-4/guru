[content]
body = "We are not now considering the legitimate use of this force for healing, or for teaching and developing neophytes, so we will not, therefore, consider its modus operandi in detail.\n\nEnough has been said to show in what way it works.\n\nLet us now proceed to the consideration of the practical methods of breaking such a rapport if for any reason it is desired to discontinue its use.\n\nTo astral vision the telepathic link appears as a ray of light, a shining cord, or some similar thought-form, because it is in this form that it is usually formulated by the person who is making the magnetic link.\n\nIt sometimes happens, however, if the operator has a high grade of initiation, that instead of connecting the ray direct to the person with whom he desires to be in touch, he will formulate an astral animal at the end of it to which he transfers a modicum of his own consciousness.\n\nThis animal-form is called a Watcher; it does not act on its own initiative unless attacked, when it defends itself according to the nature of the species in whose likeness it is made.\n\nThe use of a Watcher is to obtain a record of what is transpiring without the necessity of focussing consciousness thereon.\n\nWhen the psychic substance of the Watcher is reabsorbed by the adept, he becomes aware of the content of the Watcher’s consciousness.\n\nThe disadvantage of this method lies in the vulnerableness of the Watcher to psychic attack, and the fact that its projector is affected if it is injured or disintegrated.\n\nIn dealing with a thought-form, always bear in mind that it is the product of the imagination, and is in no sense self- existent.\n\nWhat the imagination has made the imagination can unmake.\n\nIf the maker of a thought-form has thought it into existence by picturing it imaginatively, you can equally well think it out of existence by picturing it clearly and imagining it bursting into a thousand fragments, or going up in flames, or dissolving into water and being absorbed by the soil.\n\nThat which is thought into existence by the imagination can be thought out of existence by the imagination.\n\nIf what was taken for a thought-form resists destruction by this method, it is probably an artificial elemental.\n\nNow there are two such elementals, one kind being ensouled by the invocation of elemental essence into a thought-form, and the other by the projection of something of the magician’s own nature into it.\n\nIf it is ensouled by elemental essence, the use of the Pentagram will serve to banish it; but if it is of the kind that is ensouled by the magician’s own force, another method must be used, known as absorption.\n\nNow absorption is a very high-grade method, and its successful use depends upon the state of consciousness of the user.\n\nEach individual has to decide for himself whether in any given case at a given moment he is in a fit state to attempt it.\n\nUnless he can completely steady his own vibrations and arrive at a state of perfect serenity and freedom from all sense of effort, he should not make the attempt.\n\nWe will, however, describe the method for the benefit of those who care to try it.\n\nHarmonising himself by mediation upon the Christ, the adept, as soon as he is satisfied that his own vibrations are steady, proceeds to call up before his astral vision the image of the form he intends to destroy.\n\nHe sees it clearly in all its details and seeks to divine its nature, whether it is a vehicle for malice or lust, or vampiric action: these are the three most common, and it can almost certainly be assigned to one or other of these classes."


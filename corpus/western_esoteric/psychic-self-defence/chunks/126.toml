body = "I came across them in a manner which serves to illustrate the way in which occultists can “call” for information they may be in need of, and the fortuitious train of circumstances that will supply it.\n\nAs a young girl, at the commencement of my interest in occultism, I came in touch with an adept whom I soon realised to be on the Left-hand Path, and with whom I soon severed my connection.\n\nShortly after I broke with him, I was watching a gymkhana in company with some friends, among them a student of occultism, and we began to discuss matters of mutual interest.\n\nImpelled by I know not what impulse to confide in him what I had never told a soul, I told him of my experiences with the adept I have referred to.\n\nTo my surprise he knew all about him.\n\nIt seems that my new acquaintance was connected with a group of occultists who had taken for their work the hunting out of Black Lodges; they had already crossed the trail of my black adept and had compelled him to close down, and he had sworn not to reorganise his Order.\n\nThey had had reason to believe recently that this oath was not being kept and that he had again organised a Lodge and was working his rituals, but they did not know where to lay their hands on him.\n\nThen here came I, a bit of human flotsam tossed up on a sports field to give them the information they needed at the very moment when they needed it.\n\nThese things happen too regularly in occultism for one to be able to look upon them as chance.\n\nIt is my belief that It Is possible for anyone who has need of them to get into touch telepathically with this occult police force.\n\nThe symbol I was taught to use was a black Calvary Cross with circle on a scarlet ground.\n\nThis is pictured in the imagination, and while gazing at it mentally the call is sent out into the Unseen, projecting it from the centre of the forehead.\n\nVarious attempts have been made to prove that the occult fraternities are all directed from a single headquarters, said variously to be situated in Germany, Thibet, Mongolia and South America.\n\nPersonally I do not believe it.\n\nI suppose that I have a pretty varied acquaintance with the inner workings of the occult movement, and I have never seen anything whatever that indicated any centralised control, whether for good or for evil.\n\nEverything, in fact, points the other way, and indicates that there is no connecting link save that of a common literature, a common idealism, and a set of symbols which, if not common to all sections, are readily translatable by means of well-understood equivalents.\n\nThe position in the occult field is analogous to that of Protestant Christianity, not Roman Christianity.\n\nOccultism has no Pope.\n\nNor do I think that Bolshevism ever gained any foothold in the Lodges, though I believe it tried; as witness the application to my own fraternity.\n\nThe average occultist is not interested in politics, his concern is with things invisible.\n\nMoreover, the occult fraternities are too inco-ordinated and scattered to be formidable political weapons even if they were imbued with Bolshevism.\n\nIt has also been said that the occult fraternities are controlled by the Jews in the interests of Zionism.\n\nThis is quite untrue.\n\nThere are very few Jews in the occult movement.\n\nIt is true, however, that the Qabalah, the traditional mysticism of the Jewish race, is one of the principal sources of Western occultism, and that any occultist working on that tradition must know at least enough Hebrew to be able to transliterate Hebrew script.\n\nThe study of the modern mystical Qabalah is almost exclusively in the hands of Gentiles, and orthodox Jewish scholars know little or nothing of its literature and nothing whatever of its mystical significance."


[content]
body = "It is necessary to use very great caution in drawing conclusions from the psychic impressions of an inexperienced student, who is apt to be as full of alarms as a two-year-old thorough bred.\n\nOn the other hand, the instinctive reactions of a pure and sensitive soul are not to be ignored.\n\nThere are such things as Black Lodges and evil entities.\n\nWe must not allow the cry of “Wolf!\n\nWolf!” to make us either callous or careless.\n\nIn any case, the victim is suffering remediable discomfort.\n\nIt is an exceedingly difficult thing to determine psychic ally whether the complainant has reasonable grounds for his feelings, for his own imagination will have filled his atmosphere with menacing thought-forms.\n\nIt is no simple matter to decide whether these thought-forms are subjective or objective.\n\nThe wisest way is to rely ‘on such evidence as is capable of objective examination, and enquire into the record of the particular group or occultist against whom the charges are being brought.\n\nBut it is equally necessary to enquire into the record of the person who is bringing the charges.\n\nThat that person is filled with the loftiest ideals is no proof that he has a level head, a clear and unbiassed judgment, or appreciation of the nature of evidence.\n\nA person need not be a deliberate liar to make statements that are very far from the truth.\n\nAnother factor which has to be reckoned with is the vagaries of the sex instinct in a person in whom that instinct is repressed.\n\nConsider the case of a woman, perhaps no longer young, whose circumstances for the first time permit her to follow her own inclinations; a very common case with home-keeping women, who have to wait for dead men’s shoes before they can set out on life’s journey.\n\nShe takes up occultism, towards which she may always have had a leaning, and joins some circle for study and possibly ritual initiation.\n\nThe leader of that circle will in all probability be a person of strong individuality.\n\nThe inexperienced, love-starved new-comer is glamoured.\n\nRitual is a very stimulating thing, as Anglo-Catholic clergy have found to their cost.\n\nThe woman, possibly quite ignorant of the facts of life, finds herself strangely stirred.\n\nShe is frightened, she senses that something of the Kingdom of Pan is approaching.\n\nHer instincts will usually guide her truly enough in divining the source from which the disturbing influence proceeds.\n\nShe will point an unerring finger at the magnetic male.\n\nShe will seldom take into account the reactions of the female in the presence of the male.\n\nIf she is a woman ignorant of the facts of life, the charge she brings will usually take the form of an accusation of hypnotic influence.\n\nShe does not realise that nature is the hypnotist.\n\nIf she is a woman who knows something of the world, the charge may be of improper advances.\n\nOne glance at the woman is usually enough to tell us whether there is likely to be any foundation in this charge or not.\n\nIt is seldom the young and pretty girl, who might reasonably be apprehensive, who is the teller of these stories.\n\nIt is a curious fact that it never seems to occur to the complainants either to take refuge in flight or put the matter in the hands of a solicitor.\n\nIf at the end of a long tale, full of dark hints and unspeakable innuendos, the question is asked, “What exactly did he do?\n\n”the answer usually is, “He looked at me in a meaning way.” When one of these stories is being told we should be wise to give more attention to the bearing of the person who is telling it than to the facts alleged.\n\nThis will usually yield the more valuable information.\n\nIt is the most difficult thing in the world to get a genuine victim to speak."


[content]
body = "heat,\ncold,\nwetness,\nand dryness.\n\nHowever, the mother of all of them is matter,\n\nbut he who rules over heat, Phloxopha;\nbut he who rules [IV, 28] over cold, Oroorrothos;\nbut he who rules over dryness, Erimacho;\nbut he who rules over wetness, Athuro.\n\nHowever, the mother of all of these, Onorthochras, stands among them, because she is the one who is without limit, and she combines with them all, and she really is matter, because she nourishes them.\n\nThe four chief demons (are):\n\nEphememphi, who pertains to pleasure;\nYoko, who pertains to lust;\nNenentophni, who pertains to grief;\nBlaomen, who pertains to fear.\n\nHowever, the mother of all of them (is) Esthensis-Ouch-Epi-Ptoe.\n\nPassions issued forth from the four demons, but from grief: envy, jealousy, misfortune, trouble, pain, cruelty, anxiety, lamentation, and so on.\n\nHowever, from pleasure arise plentiful evil, and vacuous arrogance, and the like.\n\nHowever, from lust: anger, fury, and bitterness, and bitter passion, and never being satisfied, and the like.\n\nHowever, from [IV, 29] fear: horror, groveling, misery, and humiliation.\n\nAll these resemble things virtuous, but also things vicious.\n\nHowever, insight into their reality (comes from) Anaro, the chief of the\n\nhylic soul, [II, 19] because it pertains to the seven senses, to Ouch-Epi-Ptoe.\n\nHere is the number of the angels: All together, they are 365. All of them worked on it, limb by limb, until they finished both the psychic and the hylic body.\n\nIn addition to these, there are others who control the remaining passions.\n\nAlthough I have not listed them for you, if you want to know who they are, this is (all) written in the Book of Zoroaster."


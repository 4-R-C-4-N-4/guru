[content]
body = "The first <is> Athoth – he has the face of a sheep;\nthe second is Eloaiou – he has the face of a donkey;\nthe third is Astaphaios – he has the face of a [hyena];\nthe fourth is Yao – he has the face of a seven-headed [dragon];\nthe fifth is Sabaoth – he has the face of a dragon;\nthe sixth is Adonin – he has the face of a monkey;\nthe seventh is Sabbede – he has the face of a glowing fire.\n\nThese are the sevenfold (aspect) of the week.\n\nYaltabaoth, however, possessed a multitude [II, 12] of faces – more than all the others – so that when among the seraphs he was able put on any face [IV, 19] in front of all of them as he wished. Because he shared his fire with them, he became their overlord. On account of the glorious power he possessed owing to his mother’s light, he named himself God, and he was disobedient to the place where he had originated. He further joined the seven powers inside his thought together with the authorities who were with him, and when he spoke, it happened, and he named each of the powers, beginning with the highest:\n\nThe first is Goodness, together with the first (authority), Athoth;\nthe second is Providence, together with the second (authority), Eloaio;\nand the third is Divinity, together with the third (authority), Astraphaio;\nthe fourth is Lordship, together with the fourth (authority), Yao;\nthe fifth is Kingdom, together with the fifth (authority), Sabaoth;\n\nthe sixth is Jealousy, together with the sixth (authority), Adonein;\nthe seventh is Sophia, together with the seventh (authority), Sabbateon.\n\nThese also possess a [IV, 20] firmament that corresponds to each heavenly aeon. They were given names that accord with the glory of the heavenly entities, to bring about the [annihilation of the] powers, but power dwelt in the names given to [them by] their originator, yet the names that were given to them in accord with the glory of the heavenly entities will mean for them annihilation and feebleness. In this way, they possess two names.\n\nFurther, everything he organized (var. *[Further, after] creating [everything, he organized] them)* in accord with the semblance of the first aeons that had come into being, in order that he could [II, 13] create them after the likeness of the indestructible ones.\n\nIt was not because of his seeing the indestructible entities, but because of the power inside him, which he had procured from his mother, that he generated inside him the likeness of the world, and when he saw the creation around him and the host of the angels around him, which had issued forth from him, he declared to them: ‘I am a jealous God, and there is no God other than me.’ By declaring this, however, he implied to the angels attending him that there is another God, because if there had not been another, how could he be jealous of another?\n\nThe mother then began ‘to move back and forth,’ becoming aware of the deficiency as the luminosity [IV, 21] of her light decreased, and she grew dark on account of her companion not having agreed together with her.”"


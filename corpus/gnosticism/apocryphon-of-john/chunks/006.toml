[content]
body = "This is because [we do] not [understand unspeakable things, and we] do not understand what [cannot be measured], apart from him who originated [from] him, that is, [the] Father, because he [alone] is the one\n\nwho [explained] it to us, given that he is the one who studies him[self] inside his light that surrounds [him], that is, the spring [of] living water, and he is the one who supplies [every aeon], and in every direction (at once) he [observes] his image by gazing in the spring of the [Spirit]. He is the one who places his desire inside his [water]- light, [which dwells in the] spring of the [pure light]-water [IV, 7] [that] surrounds him, and [his (potential) thought became] actual, and she approached, [that is], she who had [appeared] in front of him inside [the glow of] his light.\n\nThis is the first [power, which existed] before the All, and [which issued] forth from his mind. She [is the Providence of the All] – her light [glows like his] light – the [perfect] power who is [the] image of the perfect unseen, virginal Spirit. [The first power] (is) the glory of Barbelo, the perfect [II, 5] glory inside the aeons, the glory of the revelation. She extolled the virginal Spirit, and she is the one who praised him, because on account of him she had come forth.\n\nThis is the first thought, his image.\nShe became the universal womb because she is the one who exists before all of them,\nthe Mother-Father,\nthe Primal Man,\nthe holy Spirit,\nthe triple-male,\nthe triple-powerful,\nthe triple-named androgynous one,\nand the eternal aeon among the unseen ones,\neven the first one to issue forth.\n\n<She> entreated the unseen, virginal Spirit – that is, Barbelo – to grant her [IV, 8] Precognition, and the Spirit agreed, and when he had [agreed], Precognition approached, and attended Providence, she who\n\noriginates from the Idea of the unseen, virginal Spirit. She extolled him [and] his perfect power, Barbelo, because they had come into being on account of her.\n\nShe also entreated once more to grant her [Indestructibility], and he agreed. When he had [agreed], Indestructibility [approached], and attended Idea and Precognition. She extolled the unseen one and Barbelo, the one on whose account they had come into being. Barbelo also entreated to grant her eternal life, and the unseen Spirit agreed, and when he had agreed, Eternal Life approached, and they [attended] and extolled the unseen [Spirit] and Barbelo, on whose account they had come into being.\n\nShe also entreated once more to grant her truth, and the unseen Spirit agreed. (var. *and [he agreed], and [when he had] agreed,*) Truth approached, and they attended and extolled the unseen, [II, 6] admirable Spirit and his Barbelo on whose account they had come into being.\n\n[IV, 9] This is the aeonic pentad of the Father, which is the Primal Man, the image of the unseen Spirit.\n\nThis is Providence – that is, Barbelo – and Idea, and Precognition, and Indestructibility, and Eternal Life and Truth.\n\nThis is the androgynous aeonic pentad, being the aeonic decad, which is the Father."


[content]
body = "Immediately, [as I was musing on these matters], lo, the [heavens were opened, and] the [entire] creation underneath heaven glowed, and [the world] was shaken. [II, 2] [I grew fearful, and lo, I] saw inside the [light a child standing] near me. As I gazed [on it, it became] similar to an old man, and he [altered his] appearance, growing similar to a son. It [was not a diverse entity] in front of me, but there was an [appearance] featuring multiple forms inside the [light], and [the resemblances] made their appearance through each other, [and] [IV, 3] the [appearance] possessed three forms."


[content]
body = "He also peered into Barbelo with the pure light that surrounds the unseen Spirit, and his spark, and from him she conceived. He begot a light- spark by means of a light similar to blessedness, but (the latter) is not equal to his greatness. Such was an only-\n\nbegotten one of the Mother-Father who had issued forth, he being his only offspring, the only-begotten one of the Father, the pure light. The unseen, virginal Spirit also rejoiced because of the light who had come into being, who had issued forth from the first power of his Providence – which [IV, 10] is Barbelo – and he anointed him with his anointing until he became perfect, lacking nothing of the anointing because he had anointed him with the anointing of the unseen Spirit, and he attended him as he poured onto him, and as soon as he had received of the Spirit, he extolled the holy Spirit and the perfect Providence on whose account he had issued forth. He also entreated to give him a companion laborer, which is Mind, and he agreed *gladly*, and when the unseen Spirit had agreed, [II, 7] Mind approached, and he attended Christ (the anointed), extolling him and Barbelo, and all of these came to dwell inside silence. Mind also willed to make something by means of the Logos of the unseen Spirit, and his (potential) will became actual, and approached with Mind and Light extolling him, and the Logos followed Will, because by means of the Logos, Christ, the self-generated God, created the All."


[content]
body = "Therefore, I, the perfect Providence of the all, transformed myself into my (own) seed, because I was the first to exist, traveling all paths, because I am the wealth of the light.\n\n[IV, 47] I am the remembrance of the Fullness, but I entered into the realm of darkness, and I persevered until I entered the middle of the prison, and the foundations of chaos trembled, and I hid myself away from them because of their evil, and they failed to recognize me.\n\nI again returned a second time, and I traveled around. I issued forth from those who are of the light, which I am, being the remembrance of Providence.\n\nI entered into the middle of the darkness and into the interior of Hades, given that I was looking after my mission, and the foundations of Chaos trembled, seeking to collapse on those who dwell in Chaos, and to destroy them, and again I hastened upward to my light-root, so that they would not be destroyed before the time.\n\nEven for a third time I went forth, I being the light that is inside the light, I being the remembrance of Providence, to enter into the middle of the darkness and the interior [II, 31] of Hades, and I [IV, 48] filled my face with the light of the consummation of their aeon, and I entered into the middle of their prison, namely, the prison <of> the body, and I said, ‘He who hears, let him rise up from the deep slumber,’ and he wept and the tears flowed.\n\nHe wiped away bitter tears off himself, and he said: ‘Who is calling my name, and from where has this hope come to me, while I am in the fetters of the prison?’\n\nI also said: ‘I am the Providence of the pure light. I am the thought of the virginal Spirit who lifts you up to the praiseworthy place. Rise up and remember that you are the one who gave heed, and follow your root, which I am, the Merciful One, and protect yourself from the angels of destitution and from the demons of Chaos, and from all those who trap you, and watch out for the deep slumber and the confinement [IV, 49] in the interior of Hades.’\n\nI also lifted him up and sealed him with the light of the water of five seals, so that Death would not overpower\n\nhim from this time on, and lo, I will now ascend to the perfect aeon."


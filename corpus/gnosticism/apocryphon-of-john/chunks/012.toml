[content]
body = "I, however, said: “Lord, what (is) ‘she moved back and forth’?”\n\nAnd he grinned, and said: “Think not that it agrees with what Moses said, ‘above the waters,’ no!\n\nInstead, when she had witnessed the evil that had occurred, and the theft her son had perpetrated, she repented, and she was overwhelmed by oblivion inside the darkness of ignorance, and she began to feel shame (*[and she dared not] to return, but [she was moving]*) about.\n\nThe movement, however, is ‘to go back and forth,’ and the proud one procured a power from his mother, because he was ignorant, assuming that no one but his mother existed. When he, however, saw the host of angels he had created, he then lifted up himself above them.\n\nFurther, when the mother realized that the garment of darkness was flawed, she then understood that her companion had not agreed together with her. She repented, [II, 14] weeping [IV, 22] copiously, and the entire Fullness hearkened to her prayer of repentance, and on her behalf they praised the unseen, virginal Spirit. (*And [he] agreed, but when [the unseen Spirit] had agreed*), the holy Spirit poured out on her from their entire Fullness, because it was not that her companion approached her (alone), but he approached her by means of the Fullness, so that he could rectify her deficiency, and she was taken up, not, however, to her own aeon, but above her son, so that she would dwell in the Ninth until she had rectified her deficiency.\n\nA voice also came forth from the lofty heavenly aeon: ‘The Man exists, and the Son of Man,’ and the chief archon, Yaltabaoth, overheard and assumed that the voice had come from\n\nhis mother, and he knew not from where it had come.\n\nHe also taught them, that is, the sacred and perfect Mother-Father, the perfect Providence, the image of the unseen one, who is the Father of the All, through whom everything came to be, the Primal [IV, 23] Man, because in a male form he made manifest his likeness.\n\nFurther, the entire aeon of the chief archon shook, and the foundations of the abyss moved, and the bottom of the waters above matter was illuminated by the appearance of this image that had been made manifest, and when all of the authorities and the chief archon looked, they saw the entire region underneath them illuminated."


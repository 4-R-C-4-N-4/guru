[content]
body = "Further, being an aeon, Sophia of Reflection thought a thought [IV, 15] on her own, together with the conception of the unseen Spirit and Precognition. She willed to bring forth a likeness from out of herself, apart from the agreement of the Spirit, who had not accepted it, and apart from her companion, and apart from his deliberation, and although the face of her maleness had not accepted this.\n\nFurther, she brought forth despite having failed to find her companion, as well as having deliberated apart from the agreement of the Spirit and the knowledge of her companion, [II, 10] and on account of the invulnerable strength dwelling inside her, her thought did not remain barren, and she produced from herself something that was incomplete and that differed from her own appearance, because she had created him apart from her companion, and he differed from the appearance of his mother, because he possesses a different form. Further, when she saw (the result of) her own will, he morphed into a lion-faced dragon form, and his eyes resembled lightning fires that flash.\n\nShe thrust him away from her, outside those places, so that none of the immortal ones could [IV, 16] see him, because she had created him in ignorance.\n\nShe also surrounded him with a shining cloud, and she erected a throne in the midst of the cloud, so that none could see him, apart from the holy Spirit – whose name is the Mother of the Living – and she called his name Yaltabaoth.\n\nThis is the chief archon who procured a strong power from his mother, and he extricated himself from her, and moved away from the places where he had been born. He grasped and created for himself further aeons with a shining spark that exists (even) now, and he was astounded in his pride that is inside him, and he begot authorities for himself.\n\nThe first has the name Athoth, whom the generations call [the Reaper].\nThe second is Harmas, [being the] evil [eye].\nThe third is Kalila-Oumbri.\nThe fourth is Yabel.\nThe fifth is Adonaiou, who is called Sabaoth.\n\nThe sixth is Cain, whom [IV, 17] the generations of men call the Sun.\nThe seventh is Abel.\nThe eighth is Abrisene.\nThe ninth is Yobel.\n[II, 11] The tenth is Armoupieel.\nThe eleventh is Melcheir-Adonein.\nThe twelfth is Belias, who is over the deeps of Hades.\n\nHe further set up seven kings, each one of whom corresponds to the heavenly firmaments over the seven heavens, and five over the deep of the abyss, so that they would rule.\n\nHe further shared his fire with them, but he did not dispatch from the power of the light he had procured from his mother, because he is ignorant darkness, and when the light had combined with the darkness, it made the darkness shine, and when the darkness had combined with the light, it darkened the light, and it became neither light nor dark, but it grew gloomy.\n\nFurther, the archon who is feeble possesses three names, the first name being Yaltabaoth, the second [IV, 18] being Saklas, and the third being Samael, and he is wicked in his pride that is inside him, because he said: ‘I am God, and there is no god other than me,’ because he is unaware of his strength, the place from which he originated.\n\nAnd the archons created seven powers for themselves, and each of the powers created for themselves six angels, so that they numbered 365\n\nangels, and these are the bodies that pertain to the names:"


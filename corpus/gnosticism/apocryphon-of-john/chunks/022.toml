[content]
body = "I, however, asked: “Lord, where did the vile spirit originate?”\n\nHe then said to me: “The Mother- Father, who is abundant in mercy, the holy Spirit in every mode, the one who is merciful and [II, 28] who shows compassion for all of you – that is, Reflection of Radiant Providence – he raised up the seed of the perfect race, and its intellect, and the eternal light of the Man.\n\nWhen the chief archon became aware that they were loftier than him in the height, and that they surpass him in intellect, he then desired to grasp their objective, unaware that they surpassed him in intellect, and that he would be unable to grasp them.\n\nHe concocted a plot with his authorities, who are his powers, and together they committed adultery with Sophia; and bitter Destiny was begotten by them, the final inconstant fetter, being of a vacillating kind, [IV, 44]\n\nand it is more durable and stronger than she with whom the gods joined (in adultery), and the angels, and the demons, and all the generations up to the present day, because from that Destiny issued forth all transgression, and injustice, and blasphemy, and the fetter of oblivion and ignorance, and every stern command with grievous transgressions, and overwhelming fears.\n\nIn this way also all of creation was blinded, so that they would not know God who is over all of them, and on account of the fetter of oblivion their sins were concealed, because they are fettered with measurements and times and moments, given that it is the universal overlord. He then regretted everything that had transpired because of him.\n\nThis time he conspired to bring a flood [II, 29] on the productions of humanity, but the greatness of the radiant Providence notified Noah, and he preached to all the seed of the children of humanity, but those who were strangers to him did not heed him.\n\n[IV, 45] It was not as Moses said, ‘They hid themselves in an ark,’ but they hid themselves in a place – not only Noah, but many other people also from the unmoving race.\n\nThey entered a place and concealed themselves inside a radiant cloud, and he was aware of his authority, and she who pertains to the light accompanied him. She had shone on them because he had caused darkness to cover all the earth, and he concocted a plot together with his powers.\n\nHe dispatched his angels to the daughters of men, to take some for themselves, even to raise up seed for their pleasure, and they were at first unsuccessful. When they had not\n\nsucceeded, they again assembled and together concocted a plot. They created a vile spirit resembling the Spirit who had descended, in order thereby to defile souls, and the angels transformed their likeness into the likeness of their mates, making them to be full of the spirit of darkness, [IV, 46] which for them they had mixed together with evil.\n\nThey presented gold and silver, and a gift even of copper and iron, and objects of every kind of metal, and they led the people following them [II, 30] into great troubles by leading them astray with a plethora of tricks. They grew old without enjoying any pleasures. Without discovering the truth, and without knowledge of the true God, they died, and in this way all of creation fell into an age-long slavery, lasting from the foundation of the world until now.\n\nThey further selected women and begot children from the darkness, according to the likeness of their (own) spirit, and they shut up their hearts, and they hardened themselves by means of the hardness of the vile spirit, (even) until now."


[content]
body = "[IV, 11] Eternal Life also <with> his Will, and Mind with Precognition, attended and extolled the unseen Spirit and Barbelo, given that they had come into being on her account. The holy Spirit also completed the self- generated God, his Son, together with Barbelo, so that he would attend the great and unseen, virginal Spirit of the self-generated God, the Christ, whom he had extolled with a loud voice. He issued forth by means of Providence, and the unseen, virginal Spirit appointed the truly self-generated God over the All. He also subjected every authority under him, as well as the truth to be inside him, so that he\n\nwould know the All, he who had been named with a name exalted above every name, because that name [IV, 12] will be spoken to those who deserve it, given that from Light, which is Christ, and Indestructibilty, by means of the gift of the Spirit (*and the four [great] lights*) from the self-generated God [...]. He waited for them to attend [II, 8] him, even the three:\n\nWill,\nIdea,\nand Life,\n\neven the four powers:\n\nUnderstanding,\nGrace,\nPerception,\nDiscretion.\n\nFurther, Grace pertains to the light- aeon Armozel – who is the first angel – and there are three more aeons together with this aeon:\n\nGrace,\nTruth,\nForm;\n\nalso the second light, Oriael, who had been appointed over the second aeon. Further, there are three more aeons together with him:\n\nReflection,\nPerception,\nMemory.\n\nFurther, the third light is Daveithai, who has been appointed over the third aeon, and there are three more aeons together with him:\n\nUnderstanding,\nLove,\nIdeal Form.\n\nFurther, the fourth aeon was appointed over the fourth [IV, 13] light, Eleleth. Further, there are three more aeons together with him:\n\nPerfection,\nPeace,\nSophia\n\nThese are the four lights who attend the self-generated God. These are the twelve aeons who attend the Son of the Mighty One, the self-generated, Christ, by means of the will and the gift of the unseen Spirit, and the twelve aeons pertain to the self-generated Son.\n\nFurther, everything was established by means of the will of the holy Spirit, by means of the self-generated one."


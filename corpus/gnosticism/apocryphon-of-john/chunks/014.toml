[content]
body = "Ararim, the left shoulder joint;\nAreche, the belly;\nPhthave, the navel;\nSenaphim, the abdomen;\nArachethopi, the right ribs;\nZabedo, the left ribs;\nBarias, the *right hip;*\n*Phnouth, the* left hip;\nAbenlenarchei, the marrow;\nChnoumeninorin, the bones;\nGesole, the stomach;\nAgromauma, the heart;\nBano, the lungs;\nSostrapal, the liver;\nAnesimalar, the spleen;\nThopithro, the intestines;\nBiblo, the kidneys;\nRoeror, the sinews;\nTaphreo, the bodily spine;\nIpouspoboba, the veins;\nBineborin, the arteries;\n[IV, 26] Aatoimenpsephei, to them belong the breath in every limb;\nEntholleia, all of the flesh;\nBedouk, the right bottom;\nArabeei, the left penis;\nEilo, the testicles (var. *twin*);\nSorma, the genitals;\nGorma-Kaiochlabar, the right thigh;\nNebrith, the left thigh;\nPserem, the right leg kidneys;\nAsaklas, the left kidney;\nOrmaoth, the right leg;\nEmenun, the left leg;\nKnyx, the [II, 17] right shin-bone;\nTupelon, the left shin-bone;\nAchiel, the right knee;\nPhneme, the left knee;\nPhiouthrom, the right foot;\nBoabel, its toes;\nTrachoun, the left foot;\nPhikna, its toes;\nMiamai, the feet nails;\nLabernioum, [. . .].\nHowever, those set over all these are seven:\nAthoth, Armas, Kalila, Jabel,\n*Sabaoth, Cain, Abel*.\nHowever, especially at work in the limbs are these:\nThe head, Diolimodraza;\n\nthe neck, Yammeax;\nthe right shoulder, Yakoubib;\nthe left shoulder, Yerton;\nthe right hand, Oudidi;\nthe left (hand), Arbao;\nthe right-hand fingers, Lampno;\nthe left-hand fingers, Leekaphar;\nthe right breast, Barbar;\nthe left breast, Imae;\nthe chest, Pisandraptes;\nthe right shoulder joint, Koade;\nthe left shoulder joint, Odeor;\nthe [IV, 27] right ribs, Asphixix;\nthe left ribs, Synogchouta;\nthe belly, Arouph;\nthe womb, Sabalo;\nthe right thigh, Charcharb;\nthe left thigh, Chthaon;\nall the genitals, Bathinoth;\nthe right leg, Choux;\nthe left leg, Charcha;\nthe right shin-bone, Aroer;\nthe left shin-bone, Toechtha;\nthe right knee, Aol;\nthe left knee, Charaner;\nthe right foot, Bastan;\nits toes, Archentechtha;\nthe left foot, Marephnounth;\nits toes, Abrana.\n\nThose who wield power over all these are seven, 7:\n\nMichael,\nOuriel,\nAsmenedas,\nSaphasatoel,\nAarmouriam,\nRichram,\nAmiorps.\n\nFurther, those who control the senses,\n\nArchendekta; and he who controls perception,\nDeitharbathas; and he who controls imagination,\nOummaa; and he who controls proportioning, [II, 18] Aachiaram; and he who controls all impulses,\nRiaramnacho.\n\nHowever, the origin of the demons that dwell in all the body is set at four:"


[content]
body = "Further, from the Precognition of Perfect Mind, by means of the revelation of the will of the unseen Spirit and the will of the self-generated one, (issued forth) <the> Perfect Man, the first revelation, even the truth.\n\nHe is the one whom the virginal Spirit named Pigera-Adama(s), and he appointed him over [II, 9] the first aeon together with the Mighty One, the self- generated one, Christ, by the first light, Armozel, escorted by his powers. Further, [IV, 14] the unseen one granted him a spiritual, invulnerable strength, and he spoke and extolled and praised the unseen Spirit, saying:\n\n‘On your account the All has come forth into being,\n\nand to you will return the All.\n\nI will praise and extol you\n\nand the self-generated one,\n\nand the three aeons,\n\nthe Father, the Mother, the Son,\n\nthe perfect power.’\n\nHe appointed also his son Seth over the second aeon, in front of the second light, Oroiel, and inside the third aeon\n\nthe seed of Seth was appointed over the third light, Daveithai, and (inside it) were placed the souls of the holy ones.\n\nFurther, inside the fourth aeon were placed the souls of those unacquainted with the Fullness, and who failed to repent immediately, but who instead continued (unrepentant) for some time, and who repented (only) afterwards. These are the fourth light, Eleleth. These are creatures who extol the unseen Spirit."


[content]
body = "I also asked the savior: “Lord, will then all the souls be conducted safely into the pure light?”\n\nHe answered and said to me: “Great things have arisen in your mind, because it is difficult to explain them to others, with the exception of those who are from the unmoving race.\n\nThose on whom the Spirit of life will alight, and whom he will empower, they will be saved and become perfect, and they will be deserving of the Greatness, and [IV, 40] in that place, they will be made clean of all evil, as well as participation in evil. Therefore, because they possess no concern other than solely indestructibility, on which they will concentrate from this time on, without wrath, or envy or jealousy, or lust and greed for anything, they will not be troubled by anything except only the condition of fleshly existence, which they will cope with by waiting expectantly for the time when they will be greeted [II, 26] by the receivers. These kind, then, are deserving of the indestructible, eternal life, and the election, because they withstand all and endure all, so that they can complete the good (var. *the contest*) and inherit eternal life.”\n\nI asked him: “Lord, the souls of those who will not have performed these works, on whom the power <and> Spirit of life had descended, *will they be [rejected]?”*\n\n*He answered and said to me: “If* the Spirit *descended on them,* they will be saved despite this, and they will reform, because the power will descend on all people, because apart from it no one can endure.\n\nHowever, after [IV, 41] being born, then, as the Spirit of life increases, and the power arrives and strengthens that soul, no one will be able to lead it astray with evil deeds.\n\nHowever, those on whom the false spirit descends are dragged by him, and are led astray.”\n\nI, however, asked: “Lord, when their souls have departed from their flesh, where will they go?”\n\nHe, however, grinned and said to me: “The soul, in which the power will grow stronger than the vile spirit – because it is strong and runs away from evil – even by the intervention of the indestructible one, it will be saved and brought up to the repose of the aeons.”\n\nI, however, asked: “Lord, but those who were unaware of the one to whom they belong, where will their souls dwell?”\n\nHe then said to me: “In those, when the vile spirit [II, 27] increased in strength, they went astray; and it weighs down the soul and drags it to evil deeds, and he throws [IV, 42] it down into oblivion, and after it departs, it is delivered over to the authorities who originated through the archon, and they fetter it with chains, and throw it into prison, and accompany it until it rouses from oblivion and obtains knowledge, and if in this way it is perfected, it will be saved.”\n\nI, however, asked: “Lord, how can the soul grow smaller and return into the natural state of its mother or into the man?”\n\nHe then rejoiced when I had asked him this, and he said to me: “Truly, you are blessed, because you have come to understand that such a soul will be made to succeed another, in whom the Spirit of life dwells. It will be saved through him. It will not be thrown again into another flesh.”\n\nI also asked: “Lord, these who also did know, but who have turned away, where will their souls go?”"


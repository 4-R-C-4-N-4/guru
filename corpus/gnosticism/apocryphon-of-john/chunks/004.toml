[content]
body = "[I also] asked to [understand it; and he said] to me: “The monad [is a unity with nothing] higher than it. [It is that which exists] as [God] and as Father of the All, [the unseen] one, who is higher than [the All, who exists as] indestructability, [as] pure light, [IV, 4] at which no [eye] can gaze.\n\nHe [is the] unseen [Spirit] of whom it is improper [to think of] as a god or as anything similar, because he is more than a god, given that nothing exists that is higher than him, because no one [II, 3] rules over him.\n\n[This is because he does] not [exist] inside something subordinate [to him, given that everything] exists inside him, *because he is the one who is* self- [established]. [He is eternal], given that he stands in need of [nothing], because [he] is complete perfection. [He lacked nothing] so that he would need to be perfected by [it. Instead], he is forever completely perfect in [light].\n\nHe is [limitless], given that no one exists [before him] who could place limits on him.\nHe is unfathomable, [given that there] exists before him no one who could [fathom him.\nHe is] beyond measuring, given that no one [existed before to him who could measure] him.\n[He is unseen, given that no] one has seen [him.\nHe is eternal], given that he [exists] eternally.\nHe is [unspeakable, given that] no one existed who could conceive of him in order to speak [of him].\nHe cannot be named, given that [no one existed before him] who could name [him].\nHe is [light] [IV, 5] [beyond measure],\nbeing pure, sacred, [unstained].\nHe is unspeakable, [existing in perfect] indestructability.\n(He exists) [not] (confined) inside perfection,\nnor inside blessedness,\nnor inside divinity,\nbut he is highly exalted (above these).\nHe is neither somatic, [nor] non- somatic.\nHe is neither large, [nor] small.\n\n[It is impossible] to say that he has a quantity or that [he has a quality], because no one can [understand him]. He is not a being among [beings, but he is] highly exalted, [not] as [though\n\nhe were loftier], but (he is lofty in) himself. He neither [participates] in the aeons nor in temporality, because he who participates in [an aeon] that was set up previously [. . .]. He [was not] not assigned a temporal measurement, [given that] he does not obtain anything from another, [because it would be obtained] as a loan, given that he who exists before someone (else) [has no need] to accept (something) from [another].\n\nThis is because he is the one who gazes at himself, waiting, in [II, 4] [his] light, given that the [. . .] is glorious.\nTo him belongs purity beyond measure.\nHe is an aeon that bestows aeons.\n[IV, 6] He is [life] that bestows life.\nHe is a blessed one who bestows blessedness.\nHe is knowledge that bestows knowledge.\n[He is] goodness that bestows goodness.\n[He is] mercy and redemption [that bestow mercy].\nHe is grace that bestows grace, [not] because it belongs to him, but because he bestows [the light] that is beyond measure and comprehension."


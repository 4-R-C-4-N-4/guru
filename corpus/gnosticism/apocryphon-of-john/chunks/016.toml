[content]
body = "However, all the angels and demons labored until they had formed the psychic body, and their creation was entirely inert and without movement for a prolonged time.\n\nWhen, however, the mother wished to regain the power she had granted to the chief archon, she entreated the Most Merciful Mother-Father of the All.\n\nWith the sacred decree, he [IV, 30] dispatched the five lights down onto the place of the angels of the chief archon, and they counseled him that they should bring forth the power of the mother, and they said to Yaltabaoth, ‘Blow of your Spirit into his face, and his body will stand up,’ and he blew into his face his Spirit, which is the power of his mother. He was unaware, because he exists in ignorance, and the power of the mother went forth from Yaltabaoth into the psychic body they had formed according to the image of he who is from the beginning.\n\nThe body moved and attained strength, and it was radiant, and at that time the rest of [II, 20] the powers grew envious, because he had come into existence through all of them, and they had bestowed their power on the man, and his intellect surpassed (that of)\n\nthose who had made him, and the chief archon.\n\nWhen, however, they saw that he was radiant, and that he could reason better than they, and that he was unburdened by [IV, 31] evil, they took him up and thrust him down into the nethermost region of all matter. However, the Blessed One, the Mother-Father, the beneficent and merciful one, showed mercy to the power of the mother which had been brought forth from the chief ruler, because they might acquire power over the psychic and sensory body, and through his beneficent Spirit and his great mercy he dispatched to Adam a helper, Radiant Reflection who emerges out of him, who is called ‘Life.’\n\nShe, however, helps the entire creation by laboring together with him, and by restoring to him his perfection, and by instructing him concerning the descent of his seed, and by instructing him concerning the way of ascent, the way by which it descended.\n\nFurther, Reflection of Light was concealed inside Adam, so that the archons would be unknowing, but that Reflection would be a rectification of the deficiency of the mother, and [IV, 32] the man became visible on account of the light-shadow inside him, and his intellect surpassed (that of) all those who had made him."


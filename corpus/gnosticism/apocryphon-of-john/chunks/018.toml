[content]
body = "Reflection of Light then concealed herself inside him, and the chief archon desired to extract her from his rib, but Reflection of Light is beyond grasping. Even though the darkness chased after her, it could not catch her, and he extracted from him a portion of his power, and he made another mold in the form of a woman, according to the likeness of Reflection, who had appeared to him, and he brought [II, 23] the portion he had extracted from the\n\npower of the man inside the female mold, and not as Moses said, ‘his rib,’ and he beheld the woman next to him.\n\nAlso at that moment, Radiant Reflection appeared, and she lifted the veil that had covered his mind, and he recovered his sobriety after the inebriation of darkness, [IV, 36] and he recognized the counterpart of his own image, and he said: ‘This is surely bone of my bones, and flesh of my flesh.\n\nTherefore will the man leave his father and his mother, and he will cleave to his wife, and both of them will become one flesh,’ because his companion will be sent to him, and he will leave his father and his mother, even Sophia, our sister, she who descended in innocence to rectify her deficiency, because of which she was called ‘Life,’ who is ‘the mother or the living,’ through the Providence of the sovereignty of Heaven,\n\n*and [Reflection who appeared] to him*, and through her they have tasted of perfect knowledge."


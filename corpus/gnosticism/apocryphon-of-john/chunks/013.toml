[content]
body = "Further, through the light they saw the shape of the image inside the water, [II, 15] and he said to the authorities attending him: ‘Come, let us create a man according to the image of God, and according to our likeness, so that his image will become a light for us.’\n\nFurther, they created by means of their individual powers in agreement with the allotted attributes, and each authority provided an attribute by means of the shape of the image he had seen in its psychic (dimension). He created an entity according to the likeness of the perfect Primal Man, and they said: ‘Let us call him Adam, so that [IV, 24] his name will become for us a power of light,’ and the powers commenced:\n\nThe first one, Goodness, created a living bone;\nand the second, Providence, created a living sinew;\nthe third, Divinity, created a living flesh;\n\nand the fourth, Lordship, created a living marrow;\nThe fifth, Kingdom, created living blood;\nThe sixth, Jealousy, created a living skin;\nThe seventh, Understanding, created living hair.\n\nHowever, the host of the angels attended him, and they obtained from the authorities the seven substances of the life-soul to be able to create the sizes of the limbs and the sizes of the torso, and the correct functioning of all the parts with each other.\n\nThe first one began creating the head;\nEteraphaope-Abron created his head;\nMeniggesstroeth created the brain;\nAsterechmen, the right eye;\nThaspomocham, the left eye;\nYeronumos, the right ear;\nBissoum, the left ear;\nAkioreim, the nose;\n[II, 16] Banen-Ephroum, the lips;\nAmen, the teeth;\nIbikan, the molars;\nBasiliademe, [IV, 25] the tonsils;\nAchcha, the staphyle;\nAdaban, the neck;\nChaaman, the vertebrae;\nDearcho, the throat;\nTebar, the *right shoulder;*\n*N[..., the]* left shoulder;\nMniarchon, the *right elbow;*\n*[...e, the]* left elbow;\nAbilrion, the right underarm;\nEvanthen, the left underarm;\nKrys, the right hand;\nBeluai, the left hand;\nTreneu, the right-hand fingers;\nBalbel, the left-hand fingers;\nKriman, the nails of the hands;\nAstrops, the right breast;\nBarroph, the left breast;\nBaoum, the right shoulder joint;"


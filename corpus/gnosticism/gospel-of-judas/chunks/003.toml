[content]
body = "The next morning, he appeared to his disciples. [And] they said to him, \"Master, where did [you] go and what did you do when you left us?\" Jesus said to them, \"I went to another great and holy generation.\" His disciples said to him, \"Lord, what great generation is better and holier than us, that's not in these realms?\" Now when Jesus heard this, he laughed. He said to them, \"Why are you wondering in your hearts about the strong and holy generation? 37 Truly I say to you, no one born [of] this realm will see that [generation], no army of angels from the stars will rule over it, and no person of mortal birth will be able to join it, because that generation doesn't come from […] that has become […] the generation of the people among [them] is from the generation of the great people […] the powerful authorities who […] nor the powers […] those by which you rule.\" When his disciples heard these things, they were each troubled in their spirit. They couldn't say a thing."


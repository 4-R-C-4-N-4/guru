[content]
body = "One day he was with his disciples in Judea. He found them sitting together practicing their piety. When he [came up to] his disciples 34 sitting together praying over the bread, [he] laughed. The disciples said to him, \"Master, why are you laughing at [our] prayer? What have we done? [This] is what's right.\" He answered and said to them, \"I'm not laughing at you. You're not doing this because you want to, but because through this your God [will be] praised.\" They said, \"Master, you […] are the Son of our God!\" Jesus said to them, \"How do [you] know me? Truly [I] say to you, no generation of the people among you will know me.\" When his disciples heard this, [they] started to get angry and furious and started to curse him in their hearts. But when Jesus noticed their ignorance, [he said] to them, \"Why are you letting your anger trouble you? Has your God within you and [his stars] 35 become angry with your souls? If any of you is [strong enough] among humans to bring out the perfect Humanity, stand up and face me.\" All of them said, \"We're strong enough.\" But their spirits weren't brave enough to stand before [him] – except Judas Iscariot. He was able to stand before him, but he couldn't look him in the eye, so he looked away. Judas [said] to him, \"I know who you are and where you've come from. You've come from the immortal realm of Barbelo, and I'm not worthy to utter the name of the one who's sent you.\" Then Jesus, knowing that he was thinking about what's exalted, said to him, \"Come away from the others and I'll tell you the mysteries of the kingdom. Not so that you'll go there, but you'll grieve much 36 because someone else will replace you to complete the twelve [elements] before their God.\" Judas said to him, \"When will you tell me these things, and when will the great day of light dawn for the generation […]?\" But when he said these things, Jesus left him."


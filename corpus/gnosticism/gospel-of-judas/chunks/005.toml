[content]
body = "And when Jesus [said] these things, he left, [taking] Judas Iscariot with him. He said to him, \"The water on the exalted mountain is [from] 43 […] it didn't come to [water … the well] of the tree of [the fruit …] of this realm […] after a time […], but came to water God's paradise and the enduring [fruit], because [it] won't corrupt that generation's [walk of life], but [it will exist] for all eternity.\" Judas said to [him, \"Tell] me, what kind of fruit does this generation have?\" Jesus said, \"The souls of every human generation will die; however, when these people have completed the time in the kingdom and the spirit leaves them, their bodies will die but their souls will live, and they'll be taken up.\" Judas said, \"What will the rest of the human generations do?\" Jesus said, \"It's not possible 44 to sow on [rock] and harvest its fruit. In the same way, it's [not possible to sow on] the [defiled] race along with the perishable wisdom [and] the hand which created mortal humans so that their souls may go up to the realms above. [Truly] I say to you, [no ruler], angel, [or] power will be able to see the [places] that [this great], holy generation [will see].\" When Jesus said this, he left. Judas said, \"Master, just as you've listened to all of them, now listen to me too, because I've seen a great vision.\" But Jesus laughed when he heard this. He said to him, \"Why are you all worked up, you thirteenth demon? But speak up, and I'll bear with you.\" Judas said to him, \"In the vision, I saw myself. The twelve disciples are stoning me and 45 chasing [me rapidly]. And I also came to the place where [I had followed] you. I saw [a house in this place], and my eyes couldn't [measure] its size. Great people surrounded it, and that house had a roof of greenery. In the middle of the house was [a crowd …]. Master, take me in with these people!\" [Jesus] answered and said, \"Your star has led you astray, Judas,\" and that \"no person of mortal birth is worthy to enter the house you've seen, because that place is reserved for those who are holy. Neither the sun nor the moon will rule there, nor the day, but those who are holy will always stand in the realm with the holy angels. Look, I've told you the mysteries of the kingdom 46 and I've taught you about the error of the stars and […] sent [on high] over the twelve realms.\" Judas said, \"Master, surely my seed doesn't dominate the rulers, does it?\" Jesus answered and said to him, \"Come, let me [tell] you [about the holy generation. Not so that you'll go there], but you'll grieve much when you see the kingdom and all its generation.\" When Judas heard this, he said to him, \"What good has it done me that you've separated me from that generation?\" Jesus answered and said, \"You'll become the thirteenth, and will be cursed by the other generations and will rule over them. In the last days they'll […] to you and you won't go up 47 to the holy generation.\""


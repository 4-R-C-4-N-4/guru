[content]
body = "\"And the twelve rulers spoke with the twelve angels: 'Let each of you 52 […] and let them […] generation [… five] angels: The first [is Yaoth], who's called 'the Good One.' The second is Harmathoth, [the eye of fire].\n\nThe [third] is Galila.\n\nThe fourth [is] Yobel.\n\nThe fifth is Adonaios.\n\n\"These are the five who ruled over Hades and are the first over Chaos.\n\n\"Then Saklas said to his angels, 'Let's create a human being after the likeness and the image.' And they fashioned Adam and his wife Eve, who in the cloud is called 'Life,' because by this name all the generations seek him, and each of them calls her by their names.\n\nNow Saklas didn't 53 [command …] give birth, except […] among the generations […] which this […] and the [angel] said to him, 'Your life will last for a limited time, with your children.'\" Then Judas said to Jesus, \"[How] long can a person live?\" Jesus said, \"Why are you amazed that the lifespans of Adam and his generation are limited in the place he's received his kingdom with his ruler?\" Judas said to Jesus, \"Does the human spirit die?\" Jesus said, \"This is how it is.\n\nGod commanded Michael to loan spirits to people so that they might serve.\n\nThen the Great One commanded Gabriel to give spirits to the great generation with no king – the spirit along with the soul.\n\nSo the [rest] of the souls 54 […] light [… the] Chaos […] seek [the] spirit within you which you've made to live in this flesh from the angelic generations.\n\nThen God caused knowledge to be brought to Adam and those with him, so that the kings of Chaos and Hades might not rule over them.\" [Then] Judas said to Jesus, \"So what will those generations do?\" Jesus said, \"Truly I say to you, the stars complete all these things.\n\nWhen Saklas completes the time span that's been determined for him, their first star will appear with the generations, and they'll finish what's been said.\n\nThen they'll sleep around in my name, murder their children, 55 and [they'll …] evil and […] the realms, bringing the generations and presenting them to Saklas.\n\n[And] after that […] will bring the twelve tribes of [Israel] from […], and the [generations] will all serve Saklas, sinning in my name.\n\nAnd your star will [rule] over the thirteenth realm.\" Then Jesus [laughed].\n\n[Judas] said, \"Master, why [are you laughing at me?\" Jesus] answered [and said], \"I'm not laughing [at you but] at the error of the stars, because these six stars go astray with these five warriors, and they'll all be destroyed along with their creations.\" Then Judas said to Jesus, \"What will those do who've been baptized in your name?\""


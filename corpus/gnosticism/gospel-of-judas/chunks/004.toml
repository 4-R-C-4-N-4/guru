[content]
body = "Another day Jesus came up to them. They said to him, \"Master, we've seen you in a dream, because we had great [dreams last] night.\" But Jesus said, \"Why […] hidden yourselves?\" 38 And they [said, \"We saw] a great [house, with a great] altar [in it, and] twelve people – we'd say they were priests – and a name. And a crowd of people was waiting at the altar [until] the priests [finished receiving] the offerings. We kept waiting too.\" [Jesus said], \"What were they like?\" And they said, \"[Some] fast [for] two weeks. Others sacrifice their own children; others their wives, praising and humbling themselves among each other. Others sleep with men; others murder; yet others commit many sins and do criminal things. [And] the people standing [before] the altar invoke your [name]! 39 And in all their sacrificing, they fill the [altar] with their offerings.\" When they said this, [they] fell silent because they were troubled. Jesus said to them, \"Why are you troubled? Truly I say to you, all the priests standing before that altar invoke my name. And [again], I say to you, my name has been written on this [house] of the generations of the stars by the human generations. [And they] have shamefully planted fruitless trees in my name.\" Jesus said to them, \"You're the ones receiving the offerings on the altar you've seen. That's the God you serve, and you're the twelve people you've seen. And the animals you saw brought in to be sacrificed are the crowd you lead astray 40 before that altar. [Your minister] will stand up and use my name like that, and [the] generations of the pious will be loyal to him. After him, another person will present [those who sleep around], and another those who murder children, and another those who sleep with men, and those who fast, and the rest of impurity, crime, and error. And those who say, 'We're equal to the angels' – they're the stars that finish everything. It's been said to the human generations, 'Look, God has accepted your sacrifice from the hands of priests,' that is, the minister of error. But the Lord who commands is the Lord over everything. On the last day, they'll be found guilty.\" 41 Jesus said [to them], \"Stop [sacrificing animals]. You've [offered them] over the altar, over your stars with your angels where they've already been completed. So let them become […] with you and let them [become] clear.\" His disciples [said to him], \"Cleanse us from our [sins] that we've committed through the deceit of the angels.\" Jesus said to them, \"It's not possible […], nor [can] a fountain quench the fire of the entire inhabited world. Nor can a [city's] well satisfy all the generations, except the great, stable one. A single lamp won't illuminate all the realms, except the second generation, nor can a baker feed all creation 42 under [heaven].\" And [when the disciples heard] these [things], they said to [him], \"Master, help us and save us!\" Jesus said to them, \"Stop struggling against me. Each one of you has his own star, [and …] of the stars will […] what belongs to it […] I wasn't sent to the corruptible generation, but to the strong and incorruptible generation, because no enemy has ruled [over] that generation, nor any of the stars. Truly I say to you, the pillar of fire will fall quickly and that generation won't be moved by the stars.\""


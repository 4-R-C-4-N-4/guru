[content]
body = "Jesus said, \"[Come] and I'll teach you about the [mysteries that no] human [will] see, because there exists a great and boundless realm whose horizons no angelic generation has seen, [in] which is a [great] invisible Spirit, which no [angelic] eye has ever seen, no heart has ever comprehended, and it's never been called by any name.\n\n\"And a luminous cloud appeared there.\n\nAnd he (the Spirit) said, 'Let an angel come into being to attend me.' And a great angel, the Self-Begotten, the God of the Light, emerged from the cloud.\n\nAnd because of him, another four angels came into being from another cloud, and they attended the angelic Self-Begotten.\n\nAnd said 48 the [Self-Begotten], 'Let [a realm] come into being,' and it came into being [just as he said].\n\nAnd he [created] the first luminary to rule over it.\n\nAnd he said, 'Let angels come into being to serve [it,' and myriads] without number came into being.\n\nAnd he said, '[Let a] luminous realm come into being,' and it came into being.\n\nHe created the second luminary to rule over it, along with myriads of angels without number to offer service.\n\nAnd that's how he created the rest of the realms of light.\n\nAnd he made them to be ruled, and created for them myriads of angels without number to assist them.\n\n\"And Adamas was in the first cloud of light that no angel could ever see among all those called 'God.' 49 And [Adamas begat Seth in] that [place after the] image [of …] and after the likeness of [this] angel.\n\nHe made the incorruptible [generation] of Seth appear to the twelve androgynous [luminaries.\n\nAnd then] he made seventy-two luminaries appear in the incorruptible generation according to the Spirit's will.\n\nThen the seventy-two luminaries themselves made three hundred sixty luminaries appear in the incorruptible generation according to the Spirit's will so that there'd be five for each.\n\nAnd the twelve realms of the twelve luminaries make up their father, with six heavens for each realm so there are seventy-two heavens for the seventy-two luminaries, and for each one 50 [of them five] firmaments [for a total of] three hundred sixty [firmaments.\n\nThey] were given authority and a [great] army of angels without number for honor and service, along with virgin spirits [too] for the honor and [service] of all the realms and the heavens with their firmaments.\n\n\"Now the crowd of those immortals is called 'cosmos' – that is, 'perishable' – by the father and the seventy-two luminaries with the Self-Begotten and his seventy-two realms.\n\nThat's where the first human appeared with his incorruptible powers.\n\nIn the realm that appeared with his generation is the cloud of knowledge and the angel who's called 51 [Eleleth …] After these things [Eleleth] said, 'Let twelve angels come into being [to] rule over Chaos and [Hades].\n\nAnd look, from the cloud there appeared an [angel] whose face flashed with [fire] and whose likeness was [defiled] by blood.\n\nHis name was Nebro, which means 'Rebel.' Others call him Yaldabaoth.\n\nAnd another angel, Saklas, came from the cloud too.\n\nSo Nebro created six angels – and Saklas (did too) – to be assistants.\n\nThey brought out twelve angels in the heavens, with each of them receiving a portion in the heavens."


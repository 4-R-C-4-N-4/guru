body = "The common swamp gallinule, locally known as mudhen or didapper ( Gallinula galeata ), is called diga′gwanĭ′ (lame or crippled), on account of its habit of flying only for a very short distance at a time.\n\nIn the Diga′gwanĭ′ dance the performers sing the name of the bird and endeavor to imitate its halting movements.\n\nThe dagûl′kû , or white-fronted goose ( Anser albifrons ), appears in connection with the myth of the origin of tobacco.\n\nThe feathers of the tskwâyĭ , the great white heron or American egret ( Herodias egretta ), are worn by ball players, and this bird probably the “swan” whose white wing was used as a peace emblem in ancient times.\n\nBUREAU OF AMERICAN ETHNOLOGY NINETEENTH ANNUAL REPORT PL.\n\nXV PHOTOGRAPH BY AUTHOR, 1888 SAWĂNU′GĬ, A CHEROKEE BALL-PLAYER A rare bird said to have been seen occasionally upon the reservation many years ago was called by the curious name of nûñdă-dikanĭ′ , “it looks at the sun,” “sun-gazer.” It is described as resembling a blue crane, and may possibly have been the Floridus cerulea , or little blue heron.\n\nAnother infrequent visitor, which sometimes passed over the mountain country in company with flocks of wild geese, was the gu′wisguwĭ′ , so called from its cry.\n\nIt is described as resembling a large snipe, with yellow legs and feet unwebbed, and is thought to visit Indian Territory at intervals.\n\nIt is chiefly notable from the fact that the celebrated chief John Ross derives his Indian name, Gu′wisguwĭ′, from this bird, the name being perpetuated in Cooweescoowee district of the Cherokee Nation in the West.\n\nAnother chance visitant, concerning which there is much curious speculation among the older men of the East Cherokee, was called tsun′digwûntsu′ʻgĭ or tsun′digwûn′tskĭ , “forked,” referring to the tail.\n\nIt appeared but once, for a short season, about forty years ago, and has not been seen since.\n\nIt is said to have been pale blue, with red in places, and nearly the size of a crow, and to have had a long forked tail like that of a fish.\n\nIt preyed upon hornets, which it took upon the wing, and also feasted upon the larvæ in the nests.\n\nAppearing unexpectedly and as suddenly disappearing, it was believed to be not a bird but a transformed red-horse fish ( Moxostoma , Cherokee âligă′ ), a theory borne out by the red spots and the long, forked tail.\n\nIt is even maintained that about the time those birds first appeared some hunters on Oconaluftee saw seven of them sitting on the limb of a tree and they were still shaped like a red-horse, although they already had wings and feathers.\n\nIt was undoubtedly the scissor-tail or swallow-tailed flycatcher ( Milvulus forficatus ), which belongs properly in Texas and the adjacent region, but strays occasionally into the eastern states.\n\nOn account of the red throat appendage of the turkey, somewhat resembling the goitrous growth known in the South as “kernels” (Cherokee, dule′tsĭ ), the feathers of this bird are not worn by ball players, neither is the neck allowed to be eaten by children or sick persons, under the fear that a growth of “kernels” would be the result."


[content]
body = "If the reply be “Yes,” all is well, and the Little Deer goes on his way; but if the reply be “No,” he follows on the trail of the hunter, guided by the drops of blood on the ground, until he arrives at his cabin in the settlement, when the Little Deer enters invisibly and strikes the hunter with rheumatism, so that he becomes at once a helpless cripple.\n\nNo hunter who has regard for his health ever fails to ask pardon of the Deer for killing it, although some hunters who have not learned the prayer may try to turn aside the Little Deer from his pursuit by building a fire behind them in the trail.\n\nNext came the Fishes and Reptiles, who had their own complaints against Man.\n\nThey held their council together and determined to make their victims dream of snakes twining about them in slimy folds and blowing foul breath in their faces, or to make them dream of eating raw or decaying fish, so that they would lose appetite, sicken, and die.\n\nThis is why people dream about snakes and fish.\n\nFinally the Birds, Insects, and smaller animals came together for the same purpose, and the Grubworm was chief of the council.\n\nIt was decided that each in turn should give an opinion, and then they would vote on the question as to whether or not Man was guilty.\n\nSeven votes should be enough to condemn him.\n\nOne after another denounced Man’s cruelty and injustice toward the other animals and voted in favor of his death.\n\nThe Frog spoke first, saying: “We must do something to check the increase of the race, or people will become so numerous that we shall be crowded from off the earth.\n\nSee how they have kicked me about because I’m ugly, as they say, until my back is covered with sores;” and here he showed the spots on his skin.\n\nNext came the Bird—no one remembers now which one it was—who condemned Man “because he burns my feet off,” meaning the way in which the hunter barbecues birds by impaling them on a stick set over the fire, so that their feathers and tender feet are singed off.\n\nOthers followed in the same strain.\n\nThe Ground-squirrel alone ventured to say a good word for Man, who seldom hurt him because he was so small, but this made the others so angry that they fell upon the Ground-squirrel and tore him with their claws, and the stripes are on his back to this day.\n\nThey began then to devise and name so many new diseases, one after another, that had not their invention at last failed them, no one of the human race would have been able to survive.\n\nThe Grubworm grew constantly more pleased as the name of each disease was called off, until at last they reached the end of the list, when some one proposed to make menstruation sometimes fatal to women.\n\nOn this he rose up in his place and cried: “ Wadâñ′!\n\n[Thanks!] I’m glad some more of them will die, for they are getting so thick that they tread on me.” The thought fairly made him shake with joy, so that he fell over backward and could not get on his feet again, but had to wriggle off on his back, as the Grubworm has done ever since.\n\nWhen the Plants, who were friendly to Man, heard what had been done by the animals, they determined to defeat the latters’ evil designs.\n\nEach Tree, Shrub, and Herb, down even to the Grasses and Mosses, agreed to furnish a cure for some one of the diseases named, and each said: “I shall appear to help Man when he calls upon me in his need.” Thus came medicine; and the plants, every one of which has its use if we only knew it, furnish the remedy to counteract the evil wrought by the revengeful animals."


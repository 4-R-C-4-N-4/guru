[content]
body = "HOW THE WORLD WAS MADE The earth is a great island floating in a sea of water, and suspended at each of the four cardinal points by a cord hanging down from the sky vault, which is of solid rock.\n\nWhen the world grows old and worn out, the people will die and the cords will break and let the earth sink down into the ocean, and all will be water again.\n\nThe Indians are afraid of this.\n\nWhen all was water, the animals were above in Gălûñ′lătĭ, beyond the arch; but it was very much crowded, and they were wanting more room.\n\nThey wondered what was below the water, and at last Dâyuni′sĭ, “Beaver’s Grandchild,” the little Water-beetle, offered to go and see if it could learn.\n\nIt darted in every direction over the surface of the water, but could find no firm place to rest.\n\nThen it dived to the bottom and came up with some soft mud, which began to grow and spread on every side until it became the island which we call the earth.\n\nIt was afterward fastened to the sky with four cords, but no one remembers who did this.\n\nAt first the earth was flat and very soft and wet.\n\nThe animals were anxious to get down, and sent out different birds to see if it was yet dry, but they found no place to alight and came back again to Gălûñ′lătĭ.\n\nAt last it seemed to be time, and they sent out the Buzzard and told him to go and make ready for them.\n\nThis was the Great Buzzard, the father of all the buzzards we see now.\n\nHe flew all over the earth, low down near the ground, and it was still soft.\n\nWhen he reached the Cherokee country, he was very tired, and his wings began to flap and strike the ground, and wherever they struck the earth there was a valley, and where they turned up again there was a mountain.\n\nWhen the animals above saw this, they were afraid that the whole world would be mountains, so they called him back, but the Cherokee country remains full of mountains to this day.\n\nWhen the earth was dry and the animals came down, it was still dark, so they got the sun and set it in a track to go every day across the island from east to west, just overhead.\n\nIt was too hot this way, and Tsiska′gĭlĭ′, the Red Crawfish, had his shell scorched a bright red, so that his meat was spoiled; and the Cherokee do not eat it.\n\nThe conjurers put the sun another hand-breadth higher in the air, but it was still too hot.\n\nThey raised it another time, and another, until it was seven handbreadths high and just under the sky arch.\n\nThen it was right, and they left it so.\n\nThis is why the conjurers call the highest place Gûlkwâ′gine Di′gălûñ′lătiyûñ′, “the seventh height,” because it is seven hand-breadths above the earth.\n\nEvery day the sun goes along under this arch, and returns at night on the upper side to the starting place.\n\nThere is another world under this, and it is like ours in everything—animals, plants, and people—save that the seasons are different.\n\nThe streams that come down from the mountains are the trails by which we reach this underworld, and the springs at their heads are the doorways by which we enter it, but to do this one must fast and go to water and have one of the underground people for a guide.\n\nWe know that the seasons in the underworld are different from ours, because the water in the springs is always warmer in winter and cooler in summer than the outer air."


[content]
body = "According to Cherokee tradition, as given by the chief Stand Watie, the war was finally brought to an end by the Iroquois, who sent a delegation to the Cherokee to propose a general alliance of the southern and western tribes.\n\nThe Cherokee accepted the proposition, and in turn sent out invitations to the other tribes, all of which entered into the peace excepting the Osage, of whom it was therefore said that they should be henceforth like a wild fruit on the prairie, at which every bird should pick, and so the Osage have remained ever a predatory tribe without friends or allies.\n\nThis may be the same treaty described in the story of “The Seneca Peacemakers.” A formal and final peace between the two tribes was arranged through the efforts of the British agent, Sir William Johnson, in 1768.\n\nIn 1847 there were still living among the Seneca the grandchildren of Cherokee captives taken in these wars.\n\nIn 1794 the Seneca pointed out to Colonel Pickering a chief who was a native Cherokee, having been taken when a boy and adopted among the Seneca, who afterward made him chief.\n\nThis was probably the same man of whom they told Schoolcraft fifty years later.\n\nHe was a full-blood Cherokee, but had been captured when too young to have any memory of the event.\n\nYears afterward, when he had grown to manhood and had become a chief in the tribe, he learned of his foreign origin, and was filled at once with an overpowering longing to go back to the south to find his people and live and die among them.\n\nHe journeyed to the Cherokee country, but on arriving there found to his great disappointment that the story of his capture had been forgotten in the tribe, and that his relatives, if any were left, failed to recognize him.\n\nBeing unable to find his kindred, he made only a short visit and returned again to the Seneca.\n\nFrom James Wafford, of Indian Territory, the author obtained a detailed account of the Iroquois peace embassy referred to by Stand Watie, and of the wampum belt that accompanied it.\n\nWafford’s information concerning the proceedings at Echota was obtained directly from two eyewitnesses—Sequoya, the inventor of the alphabet, and Gatûñ′waʻlĭ, “Hard-mush,” who afterward explained the belt at the great council near Tahlequah seventy years later.\n\nSequoya, at the time of the Echota conference, was a boy living with his mother at Taskigi town a few miles away, while Gatûñ′waʻlĭ was already a young man.\n\nThe treaty of peace between the Cherokee and Iroquois, made at Johnson Hall in New York in 1768, appears from the record to have been brought about by the Cherokee, who sent for the purpose a delegation of chiefs, headed by Âgănstâ′ta, “Groundhog-sausage,” of Echota, their great leader in the war of 1760–61 against the English.\n\nAfter the treaty had been concluded the Cherokee delegates invited some of the Iroquois chiefs to go home with them for a visit, but the latter declined on the ground that it was not yet safe, and in fact some of their warriors were at that very time out against the Cherokee, not yet being aware of the peace negotiations.\n\nIt is probable, therefore, that the Iroquois delegates did not arrive at Echota until some considerable time, perhaps three years, after the formal preliminaries had been concluded in the north."


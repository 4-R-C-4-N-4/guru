[content]
body = "Here are extensive remains of an ancient settlement, including mounds, cemetery, and also, some seventy years ago, a small square inclosure or “fort” of undressed stone.\n\nAccording to a tradition given to Wafford, the Cherokee once prepared an ambush here for a hostile war party which they were expecting to come up the river, but were themselves defeated by the enemy, who made a detour around the Black mountain and came in upon their rear.\n\nTennessee : The Cherokee form is Tănăsĭ′, and was applied to several localities within the old territory of the tribe.\n\nThe most important town of this name was on the south bank of Little Tennessee river, halfway between Citico and Toco creeks, in Monroe county, Tennessee.\n\nAnother was on the south side of Hiwassee, just above the junction of Ocoee, in Polk county, Tennessee.\n\nA third district of the same name was on Tennessee creek, the extreme easterly head of Tuckasegee river, in Jackson county, North Carolina.\n\nThe meaning of the name is lost.\n\nIt was not the Indian name of the river, and does not mean “Big spoon,” as has been incorrectly asserted."


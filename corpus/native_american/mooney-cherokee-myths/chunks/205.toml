[content]
body = "LOCAL LEGENDS OF TENNESSEE For the more important legends localized in Tennessee see the stories The Hunter in the Dăkwă′, The Nest of the Tlă′nuwă, The Removed Townhouses, The Haunted Whirlpool, Ûñtsaiyĭ′, and Uʻtlûñ′ta.\n\nBuffalo Track rock : This rock, of which the Indian name is now lost, is indefinitely mentioned as located southwest from Cumberland gap, on the northern border of the state.\n\nAccording to Wafford, it was well known some eighty years ago to the old Cherokee hunters, who described it as covered with deep impressions made by buffalo running along the rock and then butting their heads, as though in mad fury, against a rock wall, leaving the prints of their heads and horns in the stone.\n\nChattanooga : This city, upon Tennessee river, near the entrance of the creek of the same name in Hamilton county, was incorporated in 1848.\n\nSo far as is known there was no Cherokee settlement at the place, although some prominent men of the tribe lived in the vicinity.\n\nThe name originally belonged to some location upon the creek.\n\nThe Cherokee pronounce it Tsatănu′gĭ, but say that it is not a Cherokee word and has no meaning in their language.\n\nThe best informants express the opinion that it was from the Chickasaw (Choctaw) language, which seems possible, as the Chickasaw country anciently extended a considerable distance up the Tennessee, the nearest settlement being within 80 miles of the present city.\n\nThe Cherokee sometimes call the city Aʻtlă′nuwă′, “Tlă′nuwă (Hawk) hole,” that being their old name for a bluff on the south side of the river at the foot of the present Market street.\n\nFrom this circumstance probably originated the statement by a magazine writer that the name Chattanooga signifies “The crow’s nest.” Chickamauga : The name of two creeks in Hamilton county, entering Tennessee river from opposite sides a few miles above Chattanooga.\n\nA creek of the same name is one of the head-streams of Chattahoochee river, in White county, Georgia.\n\nThe Cherokee pronounce it Tsĭkăma′gĭ, applying the name in Tennessee to the territory about the mouth of the southern, or principal, stream, where they formerly had a town, from which they removed in 1782.\n\nThey state, however, that it is not a Cherokee word and has no meaning in their language.\n\nFilson, in 1793, erroneously states that it is from the Cherokee language and signifies “Boiling pot,” referring to a dangerous whirlpool in the river near by, and later writers have improved upon this by translating it to mean “Whirlpool.” The error arises from confounding this place with The Suck, a whirlpool in Tennessee river 15 miles farther down and known to the Cherokee as Ûñtiguhĭ′, “Pot in the water” (see number 63 , “Ûñtsaiyĭ′, the Gambler”).\n\nOn account of the hard fighting in the neighborhood during the Civil war, the stream was sometimes called, poetically, “The River of Death,” the term being frequently given as a translation of the Indian word.\n\nIt has been suggested that the name is derived from an Algonquian word referring to a fishing or fish-spearing place, in which case it may have originated with the Shawano, who formerly occupied middle Tennessee, and some of whom at a later period resided jointly with the Cherokee in the settlements along this part of the river.\n\nIf not Shawano it is probably from the Creek or Chickasaw."


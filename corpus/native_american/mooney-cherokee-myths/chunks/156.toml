[content]
body = "GAʼNA’S ADVENTURES AMONG THE CHEROKEE Gaʼnaʼ was a Seneca war chief.\n\nHe called a council and said, “We must go to the Cherokee and see if we can’t agree to be friendly together and live in peace hereafter.” The people consented, and the chief said, “We must go to water first before we start.” So they went, a great party of warriors, far away into the deep forest by the river side.\n\nThere were no women with them.\n\nFor ten days they drank medicine every morning to make them vomit and washed and bathed in the river each day.\n\nThen the chief said, “Now we must get the eagle feathers.” They went to the top of a high hill and dug a trench there the length of a man’s body, and put a man into it, with boughs over the top so that he could not be seen, and above that they put the whole body of a deer.\n\nThen the people went off out of sight, and said the words to invite Shadaʼge′a, the great eagle that lives in the clouds, to come down.\n\nThe man under the brushwood heard a noise, and a common eagle came and ate a little and flew away again.\n\nSoon it came back, ate a little more, and flew off in another direction.\n\nIt told the other birds and they came, but the man scared them away, because he did not want common birds to eat the meat.\n\nAfter a while he heard a great noise coming through the air, and he knew it was Shadaʼge′a, the bird he wanted.\n\nShadaʼge′a is very cautious, and looked around in every direction for some time before he began to eat the meat.\n\nAs soon as he was eating the man put his hand up cautiously and caught hold of the bird’s tail and held on to it.\n\nShadaʼge′a rose up and flew away, and the man had pulled out one feather.\n\nThey had to trap a good many eagles in this way, and it was two years before they could get enough feathers to make a full tail, and were ready to start for the Cherokee country.\n\nThey were many days on the road, and when they got to the first Cherokee town they found there was a stockade around it so that no enemy could enter.\n\nThey waited until the gate was open, and then two Seneca dancers went forward, carrying the eagle feathers and shouting the signal yell.\n\nWhen the Cherokee heard the noise they came out and saw the two men singing and dancing, and the chief said, “These men must have come upon some errand.” The Seneca messengers came up and said, “Call a council; we have come to talk on important business.” All turned and went toward the townhouse, the rest of the Seneca following the two who were dancing.\n\nThe townhouse was crowded, and the Seneca sang and danced until they were tired before they stopped.\n\nThe Cherokee did not dance.\n\nAfter the dance the Seneca chief said, “Now I will tell you why we have come so far through the forest to see you.\n\nWe have thought among ourselves that it is time to stop fighting.\n\nYour people and ours are always on the lookout to kill each other, and we think it is time for this to stop.\n\nHere is a belt of wampum to show that I speak the truth.\n\nIf your people are willing to be friendly, take it,” and he held up the belt."


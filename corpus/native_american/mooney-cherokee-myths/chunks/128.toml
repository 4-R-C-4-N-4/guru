[content]
body = "TSUWE′NĂHĬ: A LEGEND OF PILOT KNOB In the old town of Kănuga, on Pigeon river, there was a lazy fellow named Tsuwe′năhĭ, who lived from house to house among his relatives and never brought home any game, although he used to spend nearly all his time in the woods.\n\nAt last his friends got very tired of keeping him, so he told them to get some parched corn ready for him and he would go and bring back a deer or else would never trouble them again.\n\nThey filled his pouch with parched corn, enough for a long trip, and he started off for the mountains.\n\nDay after day passed until they thought they had really seen the last of him, but before the month was half gone he was back again at Kănuga, with no deer, but with a wonderful story to tell.\n\nHe said that he had hardly turned away from the trail to go up the ridge when he met a stranger, who asked him where he was going.\n\nTsuwe′năhĭ answered that his friends in the settlement had driven him out because he was no good hunter, and that if he did not find a deer this time he would never go back again.\n\n“Why not come with me?” said the stranger, “my town is not far from here, and you have relatives there.” Tsuwe′năhĭ was very glad of the chance, because he was ashamed to go back to his own town; so he went with the stranger, who took him to Tsuwaʻtel′da (Pilot knob).\n\nThey came to a cave, and the other said, “Let us go in here;” but the cave ran clear to the heart of the mountain, and when they were inside the hunter found there an open country like a wide bottom land, with a great settlement and hundreds of people.\n\nThey were all glad to see him, and brought him to their chief, who took him into his own house and showed him a seat near the fire.\n\nTsuwe′năhĭ sat down, but he felt it move under him, and when he looked again he saw that it was a turtle, with its head sticking out from the shell.\n\nHe jumped up, but the chief said, “It won’t hurt you; it only wants to see who you are.” So he sat down very carefully, and the turtle drew in its head again.\n\nThey brought food, of the same kind that he had been accustomed to at home, and when he had eaten the chief took him through the settlement until he had seen all the houses and talked with most of the people.\n\nWhen he had seen everything and had rested some days, he was anxious to get back to his home, so the chief himself brought him to the mouth of the cave and showed him the trail that led down to the river.\n\nThen he said, “You are going back to the settlement, but you will never be satisfied there any more.\n\nWhenever you want to come to us, you know the way.” The chief left him, and Tsuwe′năhĭ went down the mountain and along the river until he came to Kănuga.\n\nHe told his story, but no one believed it and the people only laughed at him.\n\nAfter that he would go away very often and be gone for several days at a time, and when he came back to the settlement he would say he had been with the mountain people.\n\nAt last one man said he believed the story and would go with him to see.\n\nThey went off together to the woods, where they made a camp, and then Tsuwe′năhĭ went on ahead, saying he would be back soon."


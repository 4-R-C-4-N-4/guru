body = "THE KATYDID’S WARNING Two hunters camping in the woods were preparing supper one night when a Katydid began singing near them.\n\nOne of them said sneeringly, “ Kû!\n\nIt sings and don’t know that it will die before the season ends.” The Katydid answered: “ Kû!\n\nniwĭ (onomatope); O, so you say; but you need not boast.\n\nYou will die before to-morrow night.” The next day they were surprised by the enemy and the hunter who had sneered at the Katydid was killed.\n\nWonder Stories 63.\n\nÛÑTSAIYĬ′, THE GAMBLER Thunder lives in the west, or a little to the south of west, near the place where the sun goes down behind the water.\n\nIn the old times he sometimes made a journey to the east, and once after he had come back from one of these journeys a child was born in the east who, the people said, was his son.\n\nAs the boy grew up it was found that he had scrofula sores all over his body, so one day his mother said to him, “Your father, Thunder, is a great doctor.\n\nHe lives far in the west, but if you can find him he can cure you.” So the boy set out to find his father and be cured.\n\nHe traveled long toward the west, asking of every one he met where Thunder lived, until at last they began to tell him that it was only a little way ahead.\n\nHe went on and came to Ûñtiguhĭ′, on Tennessee, where lived Ûñtsaiyĭ′ “Brass.” Now Ûñtsaiyĭ′ was a great gambler, and made his living that way.\n\nIt was he who invented the gatayûstĭ game that we play with a stone wheel and a stick.\n\nHe lived on the south side of the river, and everybody who came that way he challenged to play against him.\n\nThe large flat rock, with the lines and grooves where they used to roll the wheel, is still there, with the wheels themselves and the stick turned to stone.\n\nHe won almost every time, because he was so tricky, so that he had his house filled with all kinds of fine things.\n\nSometimes he would lose, and then he would bet all that he had, even to his own life, but the winner got nothing for his trouble, for Ûñtsaiyĭ′ knew how to take on different shapes, so that he always got away.\n\nAs soon as Ûñtsaiyĭ′ saw him he asked him to stop and play a while, but the boy said he was looking for his father, Thunder, and had no time to wait.\n\n“Well,” said Ûñtsaiyĭ′, “he lives in the next house; you can hear him grumbling over there all the time”—he meant the Thunder—“so we may as well have a game or two before you go on.” The boy said he had nothing to bet.\n\n“That’s all right,” said the gambler, “we’ll play for your pretty spots.” He said this to make the boy angry so that he would play, but still the boy said he must go first and find his father, and would come back afterwards.\n\nHe went on, and soon the news came to Thunder that a boy was looking for him who claimed to be his son.\n\nSaid Thunder, “I have traveled in many lands and have many children.\n\nBring him here and we shall soon know.” So they brought in the boy, and Thunder showed him a seat and told him to sit down."


[content]
body = "It was either smoked in the pipe or sprinkled upon the fire, never rolled into cigarettes, as among the tribes of the Southwest, neither was it ever smoked for the mere pleasure of the sensation.\n\nOf late years white neighbors have taught the Indians to chew it, but the habit is not aboriginal.\n\nIt is called tsâlû , a name which has lost its meaning in the Cherokee language, but is explained from the cognate Tuscarora, in which charhû′ , “tobacco,” can still be analyzed as “fire to hold in the mouth,” showing that the use is as old as the knowledge of the plant.\n\nThe tobacco originally in use among the Cherokee, Iroquois, and other eastern tribes was not the common tobacco of commerce ( Nicotiana tabacum ), which has been introduced from the West Indies, but the Nicotiana rustica , or wild tobacco, now distinguished by the Cherokee as tsâl-agăyûñ′li , “old tobacco,” and by the Iroquois as “real tobacco.” Its various uses in ritual and medicine are better described under other headings.\n\nFor the myth of its loss and recovery see number 6 , “How They Brought Back the Tobacco.” The cardinal flower ( Lobelia ), mullein ( Verbascum ), and one or two related species are called tsâliyu′stĭ , “like tobacco,” on account of their general resemblance to it in appearance, but they were never used in the same way.\n\nThe poisonous wild parsnip ( Peucedanum ?) bears an unpleasant reputation on account of its frequent use in evil spells, especially those intended to destroy the life of the victim.\n\nIn one of these conjurations seven pieces of the root are laid upon one hand and rubbed gently with the other, the omen being taken from the position of the pieces when the hand is removed.\n\nIt is said also that poisoners mix it secretly with the food of their intended victim, when, if he eats, he soon becomes drowsy, and, unless kept in motion until the effect wears off, falls asleep, never to wake again.\n\nSuicides are said to eat it to procure death.\n\nBefore starting on a journey a small piece of the root is sometimes chewed and blown upon the body to prevent sickness, but the remedy is almost as bad as the disease, for the snakes are said to resent the offensive smell by biting the one who carries it.\n\nIn spite of its poisonous qualities, a decoction of the root is much used for steaming patients in the sweat bath, the idea seeming to be that the smell drives away the disease spirits.\n\nThe poison oak or poison ivy ( Rhus radicans ), so abundant in the damp eastern forests, is feared as much by Indians as by whites.\n\nWhen obliged to approach it or work in its vicinity, the Cherokee strives to conciliate it by addressing it as “My friend” ( hi′gĭnaliĭ ).\n\nIf poisoned by it, he rubs upon the affected part the beaten flesh of a crawfish.\n\nOne variety of brier ( Smilax ) is called diʻnû′skĭ , “the breeder,” from a belief that a thorn of it, if allowed to remain in the flesh, will breed others in a day or two."


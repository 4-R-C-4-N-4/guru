[content]
body = "There is another story, that once while all the warriors of a certain town were off on a hunt, or at a dance in another settlement, one old man was chopping wood on the side of the ridge when suddenly a party of the enemy came upon him—Shawano, Seneca, or some other tribe.\n\nThrowing his hatchet at the nearest one, he turned and ran for the house to get his gun and make the best defense that he might.\n\nOn coming out at once with the gun he was surprised to find a large body of strange warriors driving back the enemy.\n\nIt was no time for questions, and taking his place with the others, they fought hard until the enemy was pressed back up the creek and finally broke and retreated across the mountain.\n\nWhen it was over and there was time to breathe again, the old man turned to thank his new friends, but found that he was alone—they had disappeared as though the mountain had swallowed them.\n\nThen he knew that they were the Nûñnĕ′hĭ, who had come to help their friends, the Cherokee."


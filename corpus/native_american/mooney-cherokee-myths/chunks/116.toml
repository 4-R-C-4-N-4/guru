[content]
body = "They went down a path that had a cornfield on one side and a peach orchard fenced in on the other, until they came to another trail, and the man said, “Go along this trail across that ridge and you will come to the river road that will bring you straight to your home, and now I’ll go back to the house.” So the man went back to the house and the boy went on along the trail, but when he had gone a little way he looked back, and there was no cornfield or orchard or fence or house; nothing but trees on the mountain side.\n\nHe thought it very queer, but somehow he was not frightened, and went on until he came to the river trail in sight of his home.\n\nThere were a great many people standing about talking, and when they saw him they ran toward him shouting, “Here he is!\n\nHe is not drowned or killed in the mountains!” They told him they had been hunting him ever since yesterday noon, and asked him where he had been.\n\n“A man took me over to his house just across the ridge, and I had a fine dinner and a good time with the children,” said the boy, “I thought Udsi′skală here”—that was the name of the man he had seen at dinner—“would tell you where I was.” But Udsi′skală said, “I haven’t seen you.\n\nI was out all day in my canoe hunting you.\n\nIt was one of the Nûñnĕ′hĭ that made himself look like me.” Then his mother said, “You say you had dinner there?\n\n” “Yes, and I had plenty, too,” said the boy; but his mother answered, “There is no house there—only trees and rocks—but we hear a drum sometimes in the big bald above.\n\nThe people you saw were the Nûñnĕ′hĭ.” Once four Nûñnĕ′hĭ women came to a dance at Nottely town, and danced half the night with the young men there, and nobody knew that they were Nûñnĕ′hĭ, but thought them visitors from another settlement.\n\nAbout midnight they left to go home, and some men who had come out from the townhouse to cool off watched to see which way they went.\n\nThey saw the women go down the trail to the river ford, but just as they came to the water they disappeared, although it was a plain trail, with no place where they could hide.\n\nThen the watchers knew they were Nûñnĕ′hĭ women.\n\nSeveral men saw this happen, and one of them was Wafford’s father-in-law, who was known for an honest man.\n\nAt another time a man named Burnt-tobacco was crossing over the ridge from Nottely to Hemptown in Georgia and heard a drum and the songs of dancers in the hills on one side of the trail.\n\nHe rode over to see who could be dancing in such a place, but when he reached the spot the drum and the songs were behind him, and he was so frightened that he hurried back to the trail and rode all the way to Hemptown as hard as he could to tell the story.\n\nHe was a truthful man, and they believed what he said.\n\nThere must have been a good many of the Nûñnĕ′hĭ living in that neighborhood, because the drumming was often heard in the high balds almost up to the time of the Removal.\n\nOn a small upper branch of Nottely, running nearly due north from Blood mountain, there was also a hole, like a small well or chimney, in the ground, from which there came up a warm vapor that heated all the air around."


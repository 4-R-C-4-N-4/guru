[content]
body = "THE BIRD TRIBES Winged creatures of all kinds are classed under the generic term of aninâ′hilidâ′hĭ (flyers).\n\nBirds are called, alike in the singular and plural, tsi′skwa , the term being generally held to exclude the domestic fowls introduced by the whites.\n\nWhen it is necessary to make the distinction they are mentioned, respectively, as inăgĕhĭ (living in the woods), and uluñni′ta (tame).\n\nThe robin is called tsiskwa′gwă , a name which can not be analyzed, while the little sparrow is called tsiskwâ′yă (the real or principal bird), perhaps, in accord with a principle in Indian nomenclature, on account of its wide distribution.\n\nAs in other languages, many of the bird names are onomatopes, as waʻhuhu′ (the screech owl), u′guku′ (the hooting owl), wagulĭ′ (the whippoorwill), kâgû (the crow), gŭgwĕ′ (the quail), huhu (the yellow mocking-bird), tsĭ′kĭlilĭ′ (the chickadee), sa′sa′ (the goose).\n\nThe turtledove is called gulĕ′-diskaʻnihĭ′ (it cries for acorns), on account of the resemblance of its cry to the sound of the word for acorn ( gulĕ′ ).\n\nThe meadow lark is called năkwĭsĭ′ (star), on account of the appearance of its tail when spread out as it soars.\n\nThe nuthatch ( Sitta carolinensis ) is called tsulie′na (deaf), and is supposed to be without hearing, possibly on account of its fearless disregard for man’s presence.\n\nCertain diseases are diagnosed by the doctors as due to birds, either revengeful bird ghosts, bird feathers about the house, or bird shadows falling upon the patient from overhead.\n\nThe eagle ( awâ′hĭlĭ ) is the great sacred bird of the Cherokee, as of nearly all our native tribes, and figures prominently in their ceremonial ritual, especially in all things relating to war.\n\nThe particular species prized was the golden or war eagle ( Aquila chrysætus ), called by the Cherokee the “pretty-feathered eagle,” on account of its beautiful tail feathers, white, tipped with black, which were in such great demand for decorative and ceremonial purposes that among the western tribes a single tail was often rated as equal in value to a horse.\n\nAmong the Cherokee in the old times the killing of an eagle was an event which concerned the whole settlement, and could be undertaken only by the professional eagle killer, regularly chosen for the purpose on account of his knowledge of the prescribed forms and the prayers to be said afterwards in order to obtain pardon for the necessary sacrilege, and thus ward off vengeance from the tribe.\n\nIt is told of one man upon the reservation that having deliberately killed an eagle in defiance of the ordinances he was constantly haunted by dreams of fierce eagles swooping down upon him, until the nightmare was finally exorcised after a long course of priestly treatment.\n\nIn 1890 there was but one eagle killer remaining among the East Cherokee.\n\nIt does not appear that the eagle was ever captured alive as among the plains tribes.\n\nThe eagle must be killed only in the winter or late fall after the crops were gathered and the snakes had retired to their dens.\n\nIf killed in the summertime a frost would come to destroy the corn, while the songs of the Eagle dance, when the feathers were brought home, would so anger the snakes that they would become doubly dangerous."


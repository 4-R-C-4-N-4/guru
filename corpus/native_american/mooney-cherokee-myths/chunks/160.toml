[content]
body = "The Creeks, being near neighbors, pretended friendship, while at the same time secretly aiding the Shawano.\n\nHaving discovered the treachery, the Cherokee took advantage of the presence of the Creeks at a great dance at Itsâ′tĭ, or Echota, the ancient Cherokee capital, to fall suddenly upon them and kill nearly the whole party.\n\nThe consequence was a war, with the final result that the Creeks were defeated and forced to abandon all their settlements on the waters of the Tennessee river.\n\n5 Haywood says that “Little Cornplanter” had seen Shawano scalps brought into the Cherokee towns.\n\nWhen he was a boy, his father, who was also a chief, had told him how he had once led a party against the Shawano and was returning with several scalps, when, as they were coming through a pass in the mountains, they ran into another party of Cherokee warriors, who, mistaking them for enemies, fired into them and killed several before they discovered their mistake.\n\n6 Schoolcraft also gives the Cherokee tradition of the war with the Shawano, as obtained indirectly from white informants, but incorrectly makes it occur while the latter tribe still lived upon the Savannah.\n\n“The Cherokees prevailed after a long and sanguinary contest and drove the Shawnees north.\n\nThis event they cherish as one of their proudest achievements.\n\n‘What!’ said an aged Cherokee chief to Mr Barnwell, who had suggested the final preservation of the race by intermarriage with the whites.\n\n‘What!\n\nShall the Cherokees perish!\n\nShall the conquerors of the Shawnees perish!\n\nNever!’” 7 Tribal warfare as a rule consisted of a desultory succession of petty raids, seldom approaching the dignity of a respectable skirmish and hardly worthy of serious consideration except in the final result.\n\nThe traditions necessarily partake of the same trivial character, being rather anecdotes than narratives of historical events which had dates and names.\n\nLapse of time renders them also constantly more vague.\n\nOn the Carolina side the Shawano approach was usually made up the Pigeon river valley, so as to come upon the Cherokee settlements from behind, and small parties were almost constantly lurking about waiting the favorable opportunity to pick up a stray scalp.\n\nOn one occasion some Cherokee hunters were stretched around the camp fire at night when they heard the cry of a flying squirrel in the woods— tsu-u!\n\ntsu-u!\n\ntsu-u!\n\nAlways on the alert for danger, they suspected it might be the enemy’s signal, and all but one hastily left the fire and concealed themselves.\n\nThat one, however, laughed at their fears and, defiantly throwing some heavy logs on the fire, stretched himself out on his blanket and began to sing.\n\nSoon he heard a stealthy step coming through the bushes and gradually approaching the fire, until suddenly an enemy sprang out upon him from the darkness and bore him to the earth.\n\nBut the Cherokee was watchful, and putting up his hands he seized the other by the arms, and with a mighty effort threw him backward into the fire.\n\nThe dazed Shawano lay there a moment squirming upon the coals, then bounded to his feet and ran into the woods, howling with pain.\n\nThere was an answering laugh from his comrades hidden in the bush, but although the Cherokee kept watch for some time the enemy made no further attack, probably led by the very boldness of the hunter to suspect some ambush.\n\nOn another occasion a small hunting party in the Smoky mountains heard the gobble of a turkey (in telling the story Swimmer gives a good imitation).\n\nSome eager young hunters were for going at once toward the game, but others, more cautious, suspected a ruse and advised a reconnaissance."


[content]
body = "It is not a Cherokee word, and Cherokee informants state positively that the Taskigi were a foreign people, with distinct language and customs.\n\nThey were not Creeks, Natchez, Uchee, or Shawano, with all of whom the Cherokee were well acquainted under other names.\n\nIn the townhouse of their settlement at the mouth of Tellico they had an upright pole, from the top of which hung their protecting “medicine,” the image of a human figure cut from a cedar log.\n\nFor this reason the Cherokee in derision sometimes called the place Atsĭnă′-kʻtaûñ, “Hanging-cedar place.” Before the sale of the land in 1819 they were so nearly extinct that the Cherokee had moved in and occupied the ground.\n\nAdair, in 1775, mentions the Tae-keo-ge ( sic —a double misprint) as one of several broken tribes which the Creeks had “artfully decoyed” to incorporate with them in order to strengthen themselves against hostile attempts.\n\nMilfort, about 1780, states that the Taskigi on Coosa river were a foreign people who had been driven by wars to seek an asylum among the Creeks, being encouraged thereto by the kind reception accorded to another fugitive tribe.\n\nTheir request was granted by the confederacy, and they were given lands upon which they built their town.\n\nHe puts this event shortly before the incorporation of the Yuchi, which would make it early in the eighteenth century.\n\nIn 1799, according to Hawkins, the town had but 35 warriors, “had lost its ancient language,” and spoke Creek.\n\nThere is still a “white” or peace town named Taskigi in the Creek Nation in Indian Territory.\n\n27 The nearest neighbors of the Cherokee on the west, after the expulsion of the Shawano, were the Chickasaw, known to the Cherokee as Ani′-Tsĭ′ksû, whose territory lay chiefly between the Mississippi and the Tennessee, in what is now western Kentucky and Tennessee and the extreme northern portion of Mississippi.\n\nBy virtue, however, of conquest from the Shawano or of ancient occupancy they claimed a large additional territory to the east of this, including all upon the waters of Duck river and Elk creek.\n\nThis claim was disputed by the Cherokee.\n\nAccording to Haywood, the two tribes had been friends and allies in the expulsion of the Shawano, but afterward, shortly before the year 1769, the Cherokee, apparently for no sufficient reason, picked a quarrel with the Chickasaw and attacked them in their town at the place afterward known as the Chickasaw Old Fields, on the north side of Tennessee river, some twenty miles below the present Guntersville, Alabama.\n\nThe Chickasaw defended themselves so well that the assailants were signally defeated and compelled to retreat to their own country.\n\n28 It appears, however, that the Chickasaw, deeming this settlement too remote from their principal towns, abandoned it after the battle.\n\nAlthough peace was afterward made between the two tribes their rival claim continued to be a subject of dispute throughout the treaty period.\n\nThe Choctaw, a loose confederacy of tribes formerly occupying southern Mississippi and the adjacent coast region, are called Ani′-Tsa′ʻta by the Cherokee, who appear to have had but little communication with them, probably because the intermediate territory was held by the Creeks, who were generally at war with one or the other.\n\nIn 1708 we find mention of a powerful expedition by the Cherokee, Creeks, and Catawba against the Choctaw living about Mobile bay."


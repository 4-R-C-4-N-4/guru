[content]
body = "“I’ll manage that,” said the Water Spider; so she spun a thread from her body and wove it into a tusti bowl, which she fastened on her back.\n\nThen she crossed over to the island and through the grass to where the fire was still burning.\n\nShe put one little coal of fire into her bowl, and came back with it, and ever since we have had fire, and the Water Spider still keeps her tusti bowl."


[content]
body = "It was the custom among the Cherokee to let two women say what should be done with captives.\n\nThey decided that he should be tortured with fire, so he was tied to a tree, and the wood was piled around him.\n\nHatcinoñdoñ gave himself up for lost, when a rain storm came up and the people concluded to wait until it was over.\n\nThey went away and left him tied to the tree.\n\nPretty soon an old woman came up to him, and said, “My grandson, you think you are going to die, but you are not.\n\nTry to stir your limbs.” He struggled and finally got his limbs free.\n\nThen she said, “Now you are free.\n\nI have come to repay your kindness.\n\nYou remember that you once found a frog in the middle of a circle of fire and that you picked it up and put it into the water.\n\nI was that frog, and now I help you.\n\nI sent the rain storm, and now you must go down to the creek and follow the current.” When the rain was over the people came back, but Hatcinoñdoñ was gone.\n\nThey trailed him down to the creek, but he had found a hollow tree lying in the water, with a hole on the upper side through which he could breathe, so he crawled into it and they could not find him.\n\nOnce two of the Cherokee came and sat on the log and he could hear them talking about him, but they did not know that he was inside.\n\nWhen they were all gone, he came out and kept on down the stream.\n\nAfter dark he came to a place where three hunters had made a fire and gone to sleep for the night.\n\nTheir hatchets and arms were hung up on a tree.\n\nHatcinoñdoñ was naked.\n\nHe listened until he was sure the men were asleep, then he took one of their hatchets and killed all three, one after another.\n\nHe dressed himself in the clothes of one, and put on his belt, with the knife and hatchet.\n\nThen he washed himself at the creek and sat down by the fire and cooked his supper.\n\nAfter that he stretched and painted the three scalps and lay down by the fire to sleep.\n\nIn the morning he took what provision he could carry and traveled in a great circle until he found the road by which he and his warriors had come.\n\nHe found fresh tracks and followed them until he saw smoke ahead.\n\nHe listened until he heard men speaking Seneca, and knew that it was his party.\n\nThen he gave the Seneca shout— Gowe′!\n\n—three times and his friends ran out to meet him.\n\nThey had been afraid that he was killed, but were glad now that they had waited for him.\n\nThey went home together.\n\nThis is their story.—Arranged from Curtin, Seneca manuscript."


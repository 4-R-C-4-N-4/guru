[content]
body = "Chewed linn bark is also applied to the bite, perhaps from the supposed occult connection between the snake and the thunder, as this tree is said to be immune from the lightning stroke.\n\nNotwithstanding the fear of the rattlesnake, his rattles, teeth, flesh, and oil are greatly prized for occult or medical uses, the snakes being killed for this purpose by certain priests who know the necessary rites and formulas for obtaining pardon.\n\nThis device for whipping the devil around the stump, and incidentally increasing their own revenues, is a common trick of Indian medicine men.\n\nOutsiders desiring to acquire this secret knowledge are discouraged by being told that it is a dangerous thing to learn, for the reason that the new initiate is almost certain to be bitten, in order that the snakes may “try” him to know if he has correctly learned the formula.\n\nWhen a rattlesnake is killed the head must be cut off and buried an arm’s length deep in the ground and the body carefully hidden away in a hollow log.\n\nIf it is left exposed to the weather, the angry snakes will send such torrents of rain that all the streams will overflow their banks.\n\nMoreover, they will tell their friends, the deer, and the ginseng in the mountains, so that these will hide themselves and the hunters will seek them in vain.\n\nThe tooth of a rattlesnake which has been killed by the priest with the proper ceremonies while the snake was lying stretched out from east to west is used to scarify patients preliminary to applying the medicine in certain ailments.\n\nBefore using it the doctor holds it between the thumb and finger of his right hand and addresses it in a prayer, at the end of which the tooth “becomes alive,” when it is ready for the operation.\n\nThe explanation is that the tense, nervous grasp of the doctor causes his hand to twitch and the tooth to move slightly between his fingers.\n\nThe rattles are worn on the head, and sometimes a portion of the flesh is eaten by ball players to make them more terrible to their opponents, but it is said to have the bad effect of making them cross to their wives.\n\nFrom the lower half of the body, thought to be the fattest portion, the oil is extracted and is in as great repute among the Indians for rheumatism and sore joints as among the white mountaineers.\n\nThe doctor who prepares the oil must also eat the flesh of the snake.\n\nIn certain seasons of epidemic a roasted (barbecued) rattlesnake was kept hanging up in the house, and every morning the father of the family bit off a small piece and chewed it, mixing it then with water, which he spit upon the bodies of the others to preserve them from the contagion.\n\nIt was said to be a sure cure, but apt to make the patients hot tempered.\n\nThe copperhead, wâ′dige-askâ′lĭ , “brown-head,” although feared on account of its poisonous bite, is hated, instead of being regarded with veneration, as is the rattlesnake.\n\nIt is believed to be a descendant of a great mythic serpent (see number 5 ) and is said to have “eyes of fire,” on account of their intense brightness.\n\nThe blacksnake is called gûle′gĭ , “the climber.” Biting its body is said to be a preventive of toothache, and there is also a belief, perhaps derived from the whites, that if the body of one be hung upon a tree it will bring rain within three (four?) days.\n\nThe small greensnake is called sălikwâ′yĭ , the same name being also applied to a certain plant, the Eryngium virginianum , or bear grass, whose long, slender leaves bear some resemblance to a greensnake."


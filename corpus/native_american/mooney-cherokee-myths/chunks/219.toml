[content]
body = "Ginseng, which is sold in large quantities to the local traders, as well as used in the native medical practice, is called âtalĭ-gûlĭ′ , “the mountain climber,” but is addressed by the priests as Yûñwĭ Usdi′, “Little Man,” or Yûñwi Usdi′ga Ada′wehi′yu, “Little Man, Most Powerful Magician,” the Cherokee sacred term, like the Chinese name, having its origin from the frequent resemblance of the root in shape to the body of a man.\n\nThe beliefs and ceremonies in connection with its gathering and preparation are very numerous.\n\nThe doctor speaks constantly of it as of a sentient being, and it is believed to be able to make itself invisible to those unworthy to gather it.\n\nIn hunting it, the first three plants found are passed by.\n\nThe fourth is taken, after a preliminary prayer, in which the doctor addresses it as the “Great Ada′wehĭ,” and humbly asks permission to take a small piece of its flesh.\n\nOn digging it from the ground, he drops into the hole a bead and covers it over, leaving it there, by way of payment to the plant spirit.\n\nAfter that he takes them as they come without further ceremony.\n\nThe catgut or devil’s shoestring ( Tephrosia ) is called distai′yĭ , “they are tough,” in allusion to its stringy roots, from which Cherokee women prepare a decoction with which to wash their hair in order to impart to it the strength and toughness of the plant, while a preparation of the leaves is used by ballplayers to wash themselves in order to toughen their limbs.\n\nTo enable them to spring quickly to their feet if thrown to the ground, the players bathe their limbs also with a decoction of the small rush ( Juncus tenuis ), which, they say, always recovers its erect position, no matter how often trampled down.\n\nThe white seeds of the viper’s bugloss ( Echium vulgare ) were formerly used in many important ceremonies of which the purpose was to look into the future, but have now been superseded by the ordinary glass beads of the traders.\n\nThe culver root ( Leptandra ) is used in love conjurations, the omen being taken from the motion of the root when held in the hand.\n\nThe campion ( Silene stellata ), locally known as “rattlesnake’s master,” is called ganidawâ′skĭ , “it disjoints itself,” because the dried stalk is said to break off by joints, beginning at the top.\n\nAs among the white mountaineers, the juice is held to be a sovereign remedy for snake bites, and it is even believed that the deadliest snake will flee from one who carries a small portion of the root in his mouth.\n\nAlmost all varieties of burs, from the Spanish needle up to the cocklebur and Jimsonweed, are classed together under the generic name of u′nistilûn′istĭ , which may be freely rendered as “stickers.” From their habit of holding fast to whatever object they may happen to touch, they are believed to have an occult power for improving the memory and inducing stability of character.\n\nVery soon after a child is born, one of the smaller species, preferably the Lespedeza repens , is beaten up and a portion is put into a bowl of water taken from a fall or cataract, where the stream makes a constant noise.\n\nThis is given to the child to drink on four successive days, with the intention of making him quick to learn and retain in memory anything once heard."


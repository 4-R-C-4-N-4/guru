[content]
body = "As with the blacksnake, it is believed that toothache may be prevented and sound teeth insured as long as life lasts by biting the greensnake along its body.\n\nIt must be held by the head and tail, and all the teeth at once pressed down four times along the middle of its body, but without biting into the flesh or injuring the snake.\n\nSome informants say that the operation must be repeated four times upon as many snakes and that a certain food tabu must also be observed.\n\nThe water moccasin, kanegwâ′tĭ , is not specially regarded, but a very rare wood snake, said to resemble it except that it has blue eyes, is considered to have great supernatural powers, in what way is not specified.\n\nThe repulsive but harmless spreading adder ( Heterodon ) is called dalĭkstă′ , “vomiter,” on account of its habit of spitting, and sometimes kwandăya′hû , a word of uncertain etymology.\n\nIt was formerly a man, but was transformed into a snake in order to accomplish the destruction of the Daughter of the Sun (see the story).\n\nFor its failure on this occasion it is generally despised.\n\nThe Wahnenauhi manuscript mentions a legend of a great serpent called on account of its color the “ground snake.” To see it was an omen of death to the one who saw it, and if it was seen by several persons some great tribal calamity was expected.\n\nFor traditions and beliefs in regard to the Uktena, the Uksuhĭ, and other mythic serpents, see under those headings."


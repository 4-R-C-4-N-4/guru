[content]
body = "THE UNSEEN HELPERS Ganogwioeoñ, a war chief of the Seneca, led a party against the Cherokee.\n\nWhen they came near the first town he left his men outside and went in alone.\n\nAt the first house he found an old woman and her granddaughter.\n\nThey did not see him, and he went into the âsĭ and hid himself under some wood.\n\nWhen darkness came on he heard the old woman say, “Maybe Ganogwioeoñ is near; I’ll close the door.” After a while he heard them going to bed.\n\nWhen he thought they were asleep he went into the house.\n\nThe fire had burned down low, but the girl was still awake and saw him.\n\nShe was about to scream, when he said, “I am Ganogwioeoñ.\n\nIf you scream I’ll kill you.\n\nIf you keep quiet I’ll not hurt you.” They talked together, and he told her that in the morning she must bring the chief’s daughter to him.\n\nShe promised to do it, and told him where he should wait.\n\nJust before daylight he left the house.\n\nIn the morning the girl went to the chief’s house and said to his daughter, “Let’s go out together for wood.” The chief’s daughter got ready and went with her, and when they came to the place where Ganogwioeoñ was hiding he sprang out and killed her, but did not hurt the other girl.\n\nHe pulled off the scalp and gave such a loud scalp yell that all the warriors in the town heard it and came running out after him.\n\nHe shook the scalp at them and then turned and ran.\n\nHe killed the first one that came up, but when he tried to shoot the next one the bow broke and the Cherokee got him.\n\nThey tied him and carried him to the two women of the tribe who had the power to decide what should be done with him.\n\nEach of these women had two snakes tattooed on her lips, with their heads opposite each other, in such a way that when she opened her mouth the two snakes opened their mouths also.\n\nThey decided to burn the soles of his feet until they were blistered, then to put grains of corn under the skin and to chase him with clubs until they had beaten him to death.\n\nThey stripped him and burnt his feet.\n\nThen they tied a bark rope around his waist, with an old man to hold the other end, and made him run between two lines of people, and with clubs in their hands.\n\nWhen they gave the word to start Ganogwioeoñ pulled the rope away from the old man and broke through the line and ran until he had left them all out of sight.\n\nWhen night came he crawled into a hollow log.\n\nHe was naked and unarmed, with his feet in a pitiful condition, and thought he could never get away.\n\nHe heard footsteps on the leaves outside and thought his enemies were upon him.\n\nThe footsteps came up to the log and some one said to another, “This is our friend.” Then the stranger said to Ganogwioeoñ, “You think you are the same as dead; but it is not so.\n\nWe will take care of you.\n\nStick out your feet.” He put out his feet from the log and felt something licking them.\n\nAfter a while the voice said, “I think we have licked his feet enough.\n\nNow we must crawl inside the log and lie on each side of him to keep him warm.” They crawled in beside him.\n\nIn the morning they crawled out and told him to stick out his feet again.\n\nThey licked them again and then said to him, “Now we have done all we can do this time."


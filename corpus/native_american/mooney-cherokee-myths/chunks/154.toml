[content]
body = "ORIGIN OF THE YONTOÑWISAS DANCE Two Seneca women who were sisters, with the baby boy of the older one, were in a sugar grove near their home when a war party of Cherokee came upon them and carried them off.\n\nWhen the people of the town learned what had happened, they decided not to go after the enemy for fear they would kill the women, so their made no pursuit.\n\nThe Cherokee carried the women with them until they were within one day of the Cherokee towns.\n\nThe elder sister learned this and made up her mind to try to escape.\n\nShe had a knife without a handle hidden under her belt, and that night when all lay down to sleep by the fire she kept awake.\n\nWhen they were sleeping soundly, she looked around.\n\nShe and her sister were tied together, and on each side of them was a Cherokee with the end of the rope under his body on the ground.\n\nTaking out her knife, she cut the rope without waking the men, and then rousing her sister quietly she whispered to her to come.\n\nThey were going to leave the little boy, but he started to cry, so she said, “Let us die together,” and took him up on her back, and the two women hurried away.\n\nIn a little while they heard an alarm behind them, and knew that their escape was discovered, and then they saw the blazing pine knots waving through the trees where the Cherokee were coming on looking for them.\n\nThe women knew the Cherokee would hunt for them toward the north, along the trail to the Seneca country, so they made a circuit and went around to the south until they came in sight of a fire and saw a man sitting by a tree, shaking a rattle and singing in a low voice.\n\nThey found they had come directly back to the enemy’s camp, so the older sister said, “This will never do; we must try again.\n\nLet us go straight ahead to that big tree in front, and from that straight on to the next, and the next.” In this way they kept on a straight course until morning.\n\nWhen the sun came up, they took another direction toward home, and at night they rested in the woods.\n\nThey traveled all the next day, and at night rested again.\n\nIn the night a voice spoke to the younger woman, “Is that where you are resting?” and she answered, “Yes.” The voice said again, “Keep on, and you will come out at the spot where you were captured.\n\nNo harm will come to you.\n\nTo-morrow you will find food.” She roused her sister and told her what the voice had said.\n\nIn the morning they went on and at noon found a buck freshly killed.\n\nNear by they found a log on fire, so they roasted some of the meat, had a good meal, and carried away afterwards as much of the meat as they could.\n\nThey kept on, camping every night, and when the meat was nearly gone they saved the rest for the little boy.\n\nAt last one night the voice spoke again to the younger sister and said, “You are on the right road, and to-morrow you will be on the border of the Seneca country.\n\nYou will find food.\n\nThat is all.” In the morning she told her older sister.\n\nThey started on again and walked until about noon, when they came to a patch of wild potatoes.\n\nThey dug and found plenty, and as they looked around they saw smoke where there had been a camp fire.\n\nThey gathered wood, made up the fire, and roasted the potatoes.\n\nThen they ate as many as they wanted and carried the rest with them.\n\nThey traveled on until the potatoes were almost gone.\n\nThen at night the voice came again to the younger woman, saying: “At noon tomorrow you will reach your home, and the first person you will meet will be your uncle."


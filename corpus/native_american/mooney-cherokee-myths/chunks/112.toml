[content]
body = "THE BEAR MAN A man went hunting in the mountains and came across a black bear, which he wounded with an arrow.\n\nThe bear turned and started to run the other way, and the hunter followed, shooting one arrow after another into it without bringing it down.\n\nNow, this was a medicine bear, and could talk or read the thoughts of people without their saying a word.\n\nAt last he stopped and pulled the arrows out of his side and gave them to the man, saying, “It is of no use for you to shoot at me, for you can not kill me.\n\nCome to my house and let us live together.” The hunter thought to himself, “He may kill me;” but the bear read his thoughts and said, “No, I won’t hurt you.” The man thought again, “How can I get anything to eat?” but the bear knew his thoughts, and said, “There shall be plenty.” So the hunter went with the bear.\n\nThey went on together until they came to a hole in the side of the mountain, and the bear said, “This is not where I live, but there is going to be a council here and we will see what they do.” They went in, and the hole widened as they went, until they came to a large cave like a townhouse.\n\nIt was full of bears—old bears, young bears, and cubs, white bears, black bears, and brown bears—and a large white bear was the chief.\n\nThey sat down in a corner, but soon the bears scented the hunter and began to ask, “What is it that smells bad?” The chief said, “Don’t talk so; it is only a stranger come to see us.\n\nLet him alone.” Food was getting scarce in the mountains, and the council was to decide what to do about it.\n\nThey had sent out messengers all over, and while they were talking two bears came in and reported that they had found a country in the low grounds where there were so many chestnuts and acorns that mast was knee deep.\n\nThen they were all pleased, and got ready for a dance, and the dance leader was the one the Indians call Kalâs′-gûnăhi′ta, “Long Hams,” a great black bear that is always lean.\n\nAfter the dance the bears noticed the hunter’s bow and arrows, and one said, “This is what men use to kill us.\n\nLet us see if we can manage them, and may be we can fight man with his own weapons.” So they took the bow and arrows from the hunter to try them.\n\nThey fitted the arrow and drew back the string, but when they let go it caught in their long claws and the arrows dropped to the ground.\n\nThey saw that they could not use the bow and arrows and gave them back to the man.\n\nWhen the dance and the council were over, they began to go home, excepting the White Bear chief, who lived there, and at last the hunter and the bear went out together.\n\nThey went on until they came to another hole in the side of the mountain, when the bear said, “This is where I live,” and they went in.\n\nBy this time the hunter was very hungry and was wondering how he could get something to eat.\n\nThe other knew his thoughts, and sitting up on his hind legs he rubbed his stomach with his forepaws— so —and at once he had both paws full of chestnuts and gave them to the man.\n\nHe rubbed his stomach again— so —and had his paws full of huckleberries, and gave them to the man.\n\nHe rubbed again— so —and gave the man both paws full of blackberries.\n\nHe rubbed again— so —and had his paws full of acorns, but the man said that he could not eat them, and that he had enough already."


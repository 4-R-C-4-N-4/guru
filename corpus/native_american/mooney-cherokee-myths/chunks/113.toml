[content]
body = "The hunter lived in the cave with the bear all winter, until long hair like that of a bear began to grow all over his body and he began to act like a bear; but he still walked like a man.\n\nOne day in early spring the bear said to him, “Your people down in the settlement are getting ready for a grand hunt in these mountains, and they will come to this cave and kill me and take these clothes from me”—he meant his skin—“but they will not hurt you and will take you home with them.” The bear knew what the people were doing down in the settlement just as he always knew what the man was thinking about.\n\nSome days passed and the bear said again, “This is the day when the Topknots will come to kill me, but the Split-noses will come first and find us.\n\nWhen they have killed me they will drag me outside the cave and take off my clothes and cut me in pieces.\n\nYou must cover the blood with leaves, and when they are taking you away look back after you have gone a piece and you will see something.” Soon they heard the hunters coming up the mountain, and then the dogs found the cave and began to bark.\n\nThe hunters came and looked inside and saw the bear and killed him with their arrows.\n\nThen they dragged him outside the cave and skinned the body and cut it in quarters to carry home.\n\nThe dogs kept on barking until the hunters thought there must be another bear in the cave.\n\nThey looked in again and saw the man away at the farther end.\n\nAt first they thought it was another bear on account of his long hair, but they soon saw it was the hunter who had been lost the year before, so they went in and brought him out.\n\nThen each hunter took a load of the bear meat and they started home again, bringing the man and the skin with them.\n\nBefore they left the man piled leaves over the spot where they had cut up the bear, and when they had gone a little way he looked behind and saw the bear rise up out of the leaves, shake himself, and go back into the woods.\n\nWhen they came near the settlement the man told the hunters that he must be shut up where no one could see him, without anything to eat or drink for seven days and nights, until the bear nature had left him and he became like a man again.\n\nSo they shut him up alone in a house and tried to keep very still about it, but the news got out and his wife heard of it.\n\nShe came for her husband, but the people would not let her near him; but she came every day and begged so hard that at last after four or five days they let her have him.\n\nShe took him home with her, but in a short time he died, because he still had a bear’s nature and could not live like a man.\n\nIf they had kept him shut up and fasting until the end of the seven days he would have become a man again and would have lived."


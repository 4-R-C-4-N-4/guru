[content]
body = "THE FALSE WARRIORS OF CHILHOWEE Some warriors of Chilhowee town, on Little Tennessee, organized a war party, as they said, to go against the Shawano.\n\nThey started off north along the great war trail, but when they came to Pigeon river they changed their course, and instead of going on toward the Shawano country they went up the river and came in at the back of Cowee, one of the Middle settlements of their own tribe.\n\nHere they concealed themselves near the path until a party of three or four unsuspecting townspeople came by, when they rushed out and killed them, took their scalps and a gun belonging to a man named Gûñskăli′skĭ, and then hurriedly made their way home by the same roundabout route to Chilhowee, where they showed the fresh scalps and the gun, and told how they had met the Shawano in the north and defeated them without losing a man.\n\nAccording to custom, preparations were made at once for a great scalp dance to celebrate the victory over the Shawano.\n\nThe dance was held in the townhouse and all the people of the settlement were there and looked on, while the women danced with the scalps and the gun, and the returned warriors boasted of their deeds.\n\nAs it happened, among those looking on was a visitor from Cowee, a gunstocker, who took particular notice of the gun and knew it at once as one he had repaired at home for Gûñskăli′skĭ.\n\nHe said nothing, but wondered much how it had come into possession of the Shawano.\n\nThe scalp dance ended, and according to custom a second dance was appointed to be held seven days later, to give the other warriors also a chance to boast of their own war deeds.\n\nThe gunstocker, whose, name was Gûlsadihĭ′, returned home to Cowee, and there heard for the first time how a Shawano war party had surprised some of the town people, killed several, and taken their scalps and a gun.\n\nHe understood it all then, and told the chief that the mischief had been done, not by a hostile tribe, but by the false men of Chilhowee.\n\nIt seemed too much to believe, and the chief said it could not be possible, until the gunstocker declared that he had recognized the gun as one he had himself repaired for the man who had been killed.\n\nAt last they were convinced that his story was true, and all Cowee was eager for revenge.\n\nIt was decided to send ten of their bravest warriors, under the leadership of the gunstocker, to the next dance at Chilhowee, there to take their own method of reprisal.\n\nVolunteers offered at once for the service.\n\nThey set out at the proper time and arrived at Chilhowee on the night the dance was to begin.\n\nAs they crossed the stream below the town they met a woman coming for water and took their first revenge by killing her.\n\nMen, women, and children were gathered in the townhouse, but the Cowee men concealed themselves outside and waited.\n\nIn this dance it was customary for each warrior in turn to tell the story of some deed against the enemy, putting his words into a song which he first whispered to the drummer, who then sang with him, drumming all the while.\n\nUsually it is serious business, but occasionally, for a joke, a man will act the clown or sing of some extravagant performance that is so clearly impossible that all the people laugh.\n\nOne man after another stepped into the ring and sang of what he had done against the enemies of his tribe."


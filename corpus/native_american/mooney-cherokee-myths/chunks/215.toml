body = "Thus ginseng, or “sang,” as it is more often called by the white mountaineers, is known to the laity as â′talĭ-gûlĭ′ , “the mountain climber,” but is addressed in the formulas as Yûñwĭ Usdi′ , “Little Man,” while selu (corn) is invoked under the name of Agawe′la in myths, as, for instance, that of Prosartes lanuginosa , which bears the curious name of walâs′-unûl′stĭ , “frogs fight with it,” from a story that in the long ago— hĭlahi′yu —two quarrelsome frogs once fought a duel, using its stalks as lances.\n\nIn the locative form this was the name of a former Cherokee settlement in Georgia, called by the whites Fighting-town, from a misapprehension of the meaning of the word.\n\nOf the white clover, the Cherokee say that “it follows the white man.” The division of trees into evergreen and deciduous is accounted for by a myth, related elsewhere, according to which the loss of their leaves in winter time is a punishment visited upon the latter for their failure to endure an ordeal to the end.\n\nWith the Cherokee, as with nearly all other tribes east and west, the cedar is held sacred above other trees.\n\nThe reasons for this reverence are easily found in its ever-living green, its balsamic fragrance, and the beautiful color of its fine-grained wood, unwarping and practically undecaying.\n\nThe small green twigs are thrown upon the fire as incense in certain ceremonies, particularly to counteract the effect of asgina dreams, as it is believed that the anisgi′na or malevolent ghosts can not endure the smell; but the wood itself is considered too sacred to be used as fuel.\n\nIn the war dance, the scalp trophies, stretched on small hoops, were hung upon a cedar sapling trimmed and decorated for the occasion.\n\nAccording to a myth the red color comes originally from the blood of a wicked magician, whose severed head was hung at the top of a tall cedar.\n\nThe story is now almost forgotten, but it was probably nearly identical with one still existing among the Yuchi, former neighbors of the Cherokee.\n\nAccording to the Yuchi myth, a malevolent magician disturbed the daily course of the sun until at last two brave warriors sought him out and killed him in his cave.\n\nThey cut off his head and brought it home with them to show to the people, but it continued still alive.\n\nTo make it die they were advised to tie it in the topmost branches of a tree.\n\nThis they did, trying one tree after another, but each morning the head was found at the foot of the tree and still alive.\n\nAt last they tied it in a cedar, and there the head remained until it was dead, while the blood slowly trickling down along the trunk gave the wood its red color, and henceforth the cedar was a “medicine” tree.\n\n35 The linn or basswood ( Tilia ) is believed never to be struck by lightning, and the hunter caught in one of the frequent thunderstorms of the southern mountains always seeks its shelter.\n\nFrom its stringy bark are twisted the hunting belts worn about the waist.\n\nSourwood ( Oxydendrum ) is used by the hunters for barbecue sticks to roast meat before the fire, on account of the acid flavor of the wood, which they believe to be thus communicated to the meat.\n\nSpoons and combs are also carved from the wood, but it is never burned, from an idea that lye made from the ashes will bring sickness to those who use it in preparing their food."


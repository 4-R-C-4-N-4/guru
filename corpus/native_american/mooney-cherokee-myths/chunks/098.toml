[content]
body = "THE HUNTER AND THE TLĂ′NUWĂ A hunter out in the woods one day saw a Tlă′nuwă overhead and tried to hide from it, but the great bird had already seen him, and sweeping down struck its claws into his hunting pack and carried him far up into the air.\n\nAs it flew, the Tlă′nuwă, which was a mother bird, spoke and told the hunter that he need not be afraid, as she would not hurt him, but only wanted him to stay for a while with her young ones to guard them until they were old enough to leave the nest.\n\nAt last they alighted at the mouth of a cave in the face of a steep cliff.\n\nInside the water was dripping from the roof, and at the farther end was a nest of sticks in which were two young birds.\n\nThe old Tlă′nuwă set the hunter down and then flew away, returning soon with a fresh-killed deer, which it tore in pieces, giving the first piece to the hunter and then feeding the two young hawks.\n\nThe hunter stayed in the cave many days until the young birds were nearly grown, and every day the old mother hawk would fly away from the nest and return in the evening with a deer or a bear, of which she always gave the first piece to the hunter.\n\nHe grew very anxious to see his home again, but the Tlă′nuwă kept telling him not to be uneasy, but to wait a little while longer.\n\nAt last he made up his mind to escape from the cave and finally studied out a plan.\n\nThe next morning, after the old bird had gone, he dragged one of the young birds to the mouth of the cave and tied himself to one of its legs with a strap from his hunting pack.\n\nThen with the flat side of his tomahawk he struck it several times in the head until it was dazed and helpless, and pushed the bird and himself together off the shelf of rock into the air.\n\nThey fell far, far down toward the earth, but the air from below held up the bird’s wings, so that it was almost as if they were flying.\n\nAs the Tlă′nuwă revived it tried to fly upward toward the nest, but the hunter struck it again with his hatchet until it was dazed and dropped again.\n\nAt last they came down in the top of a poplar tree, when the hunter untied the strap from the leg of the young bird and let it fly away, first pulling out a feather from its wing.\n\nHe climbed down from the tree and went to his home in the settlement, but when he looked in his pack for the feather he found a stone instead.\n\n66.\n\nUʻTLÛÑ′TĂ, THE SPEAR-FINGER Long, long ago— hĭlahi′yu —there dwelt in the mountains a terrible ogress, a woman monster, whose food was human livers.\n\nShe could take on any shape or appearance to suit her purpose, but in her right form she looked very much like an old woman, excepting that her whole body was covered with a skin as hard as a rock that no weapon could wound or penetrate, and that on her right hand she had a long, stony forefinger of bone, like an awl or spearhead, with which she stabbed everyone to whom she could get near enough.\n\nOn account of this fact she was called Uʻtlûñ′tă , “Spear-finger,” and on account of her stony skin she was sometimes called Nûñ′yunu′wĭ , “Stone-dress.” There was another stone-clothed monster that killed people, but that is a different story."


[content]
body = "The Ani′-Tsâ′gûhĭ, the Ani′-Tsâ′gûhĭ, I want to lay them low on the ground, The Ani′-Tsâ′gûhĭ, the Ani′-Tsâ′gûhĭ, I want to lay them low on the ground—Yû!\n\nThe bear hunter starts out each morning fasting and does not eat until near evening.\n\nHe sings this song as he leaves camp, and again the next morning, but never twice the same day.\n\n* * * Second Bear Song This song also is sung by the bear hunter, in order to attract the bears, while on his way from the camp to the place where he expects to hunt during the day.\n\nThe melody is simple and plaintive.\n\nHe-e!\n\nHayuya′haniwă′, hayuya′haniwă′, hayuya′haniwă′, hayuya′haniwă′, Tsistuyi′ nehandu′yanû′, Tsistuyi′ nehandu′yanû′—Yoho-o!\n\nHe-e!\n\nHayuya′haniwă′, hayuya′haniwă′, hayuya′haniwă′, hayuya′haniwă′, Kuwâhi′ nehandu′yanû′, Kuwâhi′ nehandu′yanû′—Yoho-o!\n\nHe-e!\n\nHayuya′haniwă′, hayuya′haniwă′, hayuya′haniwă′, hayuya′haniwă′, Uyâhye′ nehandu′yanû′, Uyâhye′ nehandu′yanû′—Yoho-o!\n\nHe-e!\n\nHayuya′haniwă′, hayuya′haniwă′, hayuya′haniwă′, hayuya′haniwă′, Gâtegwâ′ nehandu′yanû′, Gâtegwâ′ nehandu′yanû′—Yoho-o!\n\n(Recited) Ûlĕ-ʻnû′ asĕhĭ′ tadeyâ′statakûhĭ′ gûñ′năge astû′ tsĭkĭ′.\n\nHe!\n\nHayuya′haniwă′ (four times), In Tsistu′yĭ you were conceived (two times)—Yoho!\n\nHe!\n\nHayuya′haniwă′ (four times), In Kuwâ′hĭ you were conceived (two times)—Yoho!\n\nHe!\n\nHayuya′haniwă′ (four times), In Uyâ′hye you were conceived (two times)—Yoho!\n\nHe!\n\nHayuya′haniwă′ (four times), In Gâte′gwâ you were conceived (two times)—Yoho!\n\nAnd now surely we and the good black things, the best of all, shall see each other."


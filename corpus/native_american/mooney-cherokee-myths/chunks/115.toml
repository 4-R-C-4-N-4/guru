[content]
body = "THE NÛÑNĔ′HĬ AND OTHER SPIRIT FOLK The Nûñnĕ′hĭ or immortals, the “people who live anywhere,” were a race of spirit people who lived in the highlands of the old Cherokee country and had a great many townhouses, especially in the bald mountains, the high peaks on which no timber ever grows.\n\nThey had large townhouses in Pilot knob and under the old Nĭkwăsĭ′ mound in North Carolina, and another under Blood mountain, at the head of Nottely river, in Georgia.\n\nThey were invisible excepting when they wanted to be seen, and then they looked and spoke just like other Indians.\n\nThey were very fond of music and dancing, and hunters in the mountains would often hear the dance songs and the drum beating in some invisible townhouse, but when they went toward the sound it would shift about and they would hear it behind them or away in some other direction, so that they could never find the place where the dance was.\n\nThey were a friendly people, too, and often brought lost wanderers to their townhouses under the mountains and cared for them there until they were rested and then guided them back to their homes.\n\nMore than once, also, when the Cherokee were hard pressed by the enemy, the Nûñnĕ′hĭ warriors have come out, as they did at old Nĭkwăsĭ′, and have saved them from defeat.\n\nSome people have thought that they are the same as the Yûñwĭ Tsunsdi′, the “Little People”; but these are fairies, no larger in size than children.\n\nThere was a man in Nottely town who had been with the Nûñnĕ′hĭ when he was a boy, and he told Wafford all about it.\n\nHe was a truthful, hard-headed man, and Wafford had heard the story so often from other people that he asked this man to tell it.\n\nIt was in this way: When he was about 10 or 12 years old he was playing one day near the river, shooting at a mark with his bow and arrows, until he became tired, and started to build a fish trap in the water.\n\nWhile he was piling up the stones in two long walls a man came and stood on the bank and asked him what he was doing.\n\nThe boy told him, and the man said, “Well, that’s pretty hard work and you ought to rest a while.\n\nCome and take a walk up the river.” The boy said, “No”; that he was going home to dinner soon.\n\n“Come right up to my house,” said the stranger, “and I’ll give you a good dinner there and bring you home again in the morning.” So the boy went with him up the river until they came to a house, when they went in, and the man’s wife and the other people there were very glad to see him, and gave him a fine dinner, and were very kind to him.\n\nWhile they were eating a man that the boy knew very well came in and spoke to him, so that he felt quite at home.\n\nAfter dinner he played with the other children and slept there that night, and in the morning, after breakfast, the man got ready to take him home."


[content]
body = "THE SNAKE TRIBE The generic name for snakes is inădû′ .\n\nThey are all regarded as anida′wehĭ , “supernaturals,” having an intimate connection with the rain and thunder gods, and possessing a certain influence over the other animal and plant tribes.\n\nIt is said that the snakes, the deer, and the ginseng act as allies, so that an injury to one is avenged by all.\n\nThe feeling toward snakes is one of mingled fear and reverence, and every precaution is taken to avoid killing or offending one, especially the rattlesnake.\n\nHe who kills a snake will soon see others; and should he kill a second one, so many will come around him whichever way he may turn that he will become dazed at the sight of their glistening eyes and darting tongues and will go wandering about like a crazy man, unable to find his way out of the woods.\n\nTo guard against this misfortune there are certain prayers which the initiated say in order that a snake may not cross their path, and on meeting the first one of the season the hunter humbly begs of him, “Let us not see each other this summer.” Certain smells, as that of the wild parsnip, and certain songs, as those of the Unika′wĭ or Townhouse dance, are offensive to the snakes and make them angry.\n\nFor this reason the Unika′wĭ dance is held only late in the fall, after they have retired to their dens for the winter.\n\nWhen one dreams of being bitten by a snake he must be treated the same as for an actual bite, because it is a snake ghost that has bitten him; otherwise the place will swell and ulcerate in the same way, even though it be years afterwards.\n\nFor fear of offending them, even in speaking, it is never said that a man has been bitten by a snake, but only that he has been “scratched by a brier.” Most of the beliefs and customs in this connection have more special reference to the rattlesnake.\n\nThe rattlesnake is called utsa′nătĭ , which may be rendered, “he has a bell,” alluding to the rattle.\n\nAccording to a myth given elsewhere, he was once a man, and was transformed to his present shape that he might save the human race from extermination by the Sun, a mission which he accomplished successfully after others had failed.\n\nBy the old men he is also spoken of as “the Thunder’s necklace” (see the story of Ûñtsaiyĭ′), and to kill one is to destroy one of the most prized ornaments of the thunder god.\n\nIn one of the formulas addressed to the Little Men, the sons of the Thunder, they are implored to take the disease snake to themselves, because “it is just what you adorn yourselves with.” For obvious reasons the rattlesnake is regarded as the chief of the snake tribe and is feared and respected accordingly.\n\nFew Cherokee will venture to kill one except under absolute necessity, and even then the crime must be atoned for by asking pardon of the snake ghost, either in person or through the mediation of a priest, according to a set formula.\n\nOtherwise the relatives of the dead snake will send one of their number to track up the offender and bite him so that he will die (see story, “The Rattlesnake’s Vengeance”).\n\nThe only thing of which the rattlesnake is afraid is said to be the plant known as campion, or “rattlesnake’s master” ( Silene stellata ), which is used by the doctors to counteract the effect of the bite, and it is believed that a snake will flee in terror from the hunter who carries a small piece of the root about his person."


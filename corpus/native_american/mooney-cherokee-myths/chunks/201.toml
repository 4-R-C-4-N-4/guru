body = "Skwan′-digûʻgûñ′yĭ : For Askwan′-digûʻgûñ′yĭ, “Where the Spaniard is in the water,” on Soco creek, just above the entrance of Wright’s creek, in Jackson county.\n\nAccording to tradition a party of Spaniards advancing into the mountains was attacked here by the Cherokee, who threw one of them (dead?) into the stream.\n\nSoco gap : Ăhălu′na, Ă′hălunûñ′yĭ, or Uni′hălu′na, “Ambush,” or “Where they ambushed”; at the head of Soco creek, on the line between Swain and Haywood counties.\n\nThe trail from Pigeon river crosses this gap, and in the old times the Cherokee were accustomed to keep a lookout here for the approach of enemies from the north.\n\nOn the occasion which gave it the name, they ambushed here, just below the gap, on the Haywood side, a large party of invading Shawano, and killed all but one, whose ears they cut off, after which, according to a common custom, they released him to carry the news back to his people.\n\nStanding Indian : A high bald peak at the extreme head of Nantahala river, in Macon county.\n\nThe name is a rendering of the Cherokee name, Yûñ′wĭ-tsulenûñ′yĭ, “Where the man stood” (originally Yû′ñwĭ-dĭkatâgûñ′yĭ, “Where the man stands”), given to it on account of a peculiarly shaped rock formerly jutting out from the bald summit, but now broken off.\n\nAs the old memory faded, a tradition grew up of a mysterious being once seen standing upon the mountain top.\n\nStekoa : A spot on Tuckasegee river, just above Whittier, in Swain county, better known as the Thomas farm, from its being the former residence of Colonel W.\n\nH.\n\nThomas, for a long time the agent of the East Cherokee.\n\nThe correct form is Stikâ′yĭ, the name of an ancient settlement at the place, as also of another on a creek of the same name in Rabun county, Georgia.\n\nThe word has been incorrectly rendered “little grease,” from usdi′ga or usdi′ , “little,” and ka′ĭ , “grease” or “oil,” but the true meaning is lost.\n\nSwannanoa : A river joining the French Broad at Asheville, and the gap in the Blue ridge at its head.\n\nA magazine writer has translated this name “the beautiful.” The word, however, is a corruption of Suwa′li-nûñnâ′(-hĭ), “Suwali trail,” the Cherokee name, not of the stream, but of the trail crossing the gap toward the country of the Ani′-Suwa′lĭ or Cheraw (see number 104 , “The Eastern Tribes”).\n\nSwim bald or Wolf Creek bald.\n\nSee Cheowa Maximum.\n\nTsi′skwunsdi′-adsisti′yĭ : “Where they killed Little-bird,” a place near the head of West Buffalo creek, southwest of Robbinsville, in Graham county.\n\nA trail crosses the ridge near this place, which takes its name from a man who was killed here by a hostile war party in the old fighting days.\n\nTsu′dinûñti′yĭ : “Throwing down place,” the site of a former settlement in a bend on the west side of Nantahala river, just within the limits of Macon county.\n\nSo called from a tradition that a Cherokee pursued by the enemy threw away his equipment there."


[content]
body = "HATCINOÑDOÑ’S ESCAPE FROM THE CHEROKEE Hatcinoñdoñ was a great warrior, the greatest among the Seneca.\n\nOnce he led a company against the Cherokee.\n\nThey traveled until they came to the great ridge on the border of the Cherokee country, and then they knew their enemies were on the lookout on the other side.\n\nHatcinoñdoñ told his men to halt where they were while he went ahead to see what was in front.\n\nThe enemy discovered and chased him, and he ran into a canebrake, where the canes were in two great patches with a narrow strip of open ground between.\n\nThey saw him go into the canes, so they set fire to the patch and watched at the open place for him to come out, but before they got around to it he had run across into the second patch and escaped.\n\nWhen the canes had burned down the Cherokee looked for his body in the ashes, but could not find any trace of it, so they went home.\n\nWhen Hatcinoñdoñ got into the second canebrake he was tired out, so he lay down and fell asleep.\n\nAt night while he was asleep two men came and took him by the arm, saying: “We have come for you.\n\nSomebody has sent for you.” They took him a long way, above the sky vault, until they came to a house.\n\nThen they said: “This is where the man lives who sent for you.” He looked, but could see no door.\n\nThen a voice from the inside said “Come in,” and something like a door opened of itself.\n\nHe went in and there sat Hawĕñni′o, the Thunder-god.\n\nHawĕñni′o said, “I have sent for you and you are here.\n\nAre you hungry?” Hatcinoñdoñ thought: “That’s a strange way to talk; that’s not the way I do—I give food.” The Thunder knew his thoughts, so he laughed and said, “I said that only in fun.” He rose and brought half a cake of bread, half of a wild apple, and half a pigeon.\n\nHatcinoñdoñ said, “This is very little to fill me,” but the Thunder replied, “If you eat that, there is more.” He began eating, but, as he ate, everything became whole again, so that he was not able to finish it.\n\nWhile he was sitting he heard some one running outside, and directly the door was thrown open and the Sun came in, so bright that Hatcinoñdoñ had to hold his head down.\n\nThe two beings talked together, but the Seneca could not understand a word, and soon the visitor went out again.\n\nThen the Thunder said: “That is the one you call the Sun, who watches in the world below.\n\nIt is night down there now, and he is hurrying to the east.\n\nHe says there has just been a battle.\n\nI love both the Seneca and the Cherokee, and when you get back to your warriors you must tell them to stop fighting and go home.” Again he brought food, half of each kind, and when Hatcinoñdoñ had eaten, the Thunder said, “Now my messengers will take you to your place.” The door opened again of itself, and Hatcinoñdoñ followed the two Sky People until they brought him to the place where he had slept, and there left him.\n\nHe found his party and told the warriors what he had seen.\n\nThey held a council over it and decided to strike the enemy once before going home.\n\nHatcinoñdoñ led them.\n\nThey met the Cherokee and went home with scalps.\n\nHe led another party against the Cherokee, but this time he was taken and carried to the Cherokee town."


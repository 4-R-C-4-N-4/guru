[content]
body = "Go on until you come to the place where you made a bark shelter a long time ago, and under the bark you will find something to help you.” Ganogwioeoñ crawled out of the log, but they were gone.\n\nHis feet were better now and he could walk comfortably.\n\nHe went on until about noon, when he came to the bark shelter, and under it he found a knife, an awl, and a flint, that his men had hidden there two years before.\n\nHe took them and started on again.\n\nToward evening he looked around until he found another hollow tree and crawled into it to sleep.\n\nAt night he heard the footsteps and voices again.\n\nWhen he put out his feet again, as the strangers told him to do, they licked his feet as before and then crawled in and lay down on each side of him to keep him warm.\n\nStill he could not see them.\n\nIn the morning after they went out they licked his feet again and said to him, “At noon you will find food.” Then they went away.\n\nGanogwioeoñ crawled out of the tree and went on.\n\nAt noon he came to a burning log, and near it was a dead bear, which was still warm, as if it had been killed only a short time before.\n\nHe skinned the bear and found it very fat.\n\nHe cut up the meat and roasted as much as he could eat or carry.\n\nWhile it was roasting he scraped the skin and rubbed rotten wood dust on it to clean it until he was tired.\n\nWhen night came he lay down to sleep.\n\nHe heard the steps and the voices again and one said, “Well, our friend is lying down.\n\nHe has plenty to eat, and it does not seem as if he is going to die.\n\nLet us lick his feet again.” When they had finished they said to him, “You need not worry any more now.\n\nYou will get home all right.” Before it was day they left him.\n\nWhen morning came he put the bearskin around him like a shirt, with the hair outside, and started on again, taking as much of the meat as he could carry.\n\nThat night his friends came to him again.\n\nThey said, “Your feet are well, but you will be cold,” so they lay again on each side of him.\n\nBefore daylight they left, saying, “About noon you will find something to wear.” He went on and about midday he came to two young bears just killed.\n\nHe skinned them and dressed the skins, then roasted as much meat as he wanted and lay down to sleep.\n\nIn the morning he made leggings of the skins, took some of the meat, and started on.\n\nHis friends came again the next night and told him that in the morning he would come upon something else to wear.\n\nAs they said, about noon he found two fawns just killed.\n\nHe turned the skins and made himself a pair of moccasins, then cut some of the meat, and traveled on until evening, when he made a fire and had supper.\n\nThat night again he heard the steps and voices, and one said, “My friend, very soon now you will reach home safely and find your friends all well.\n\nNow we will tell you why we have helped you.\n\nWhenever you went hunting you always gave the best part of the meat to us and kept only the smallest part for yourself.\n\nFor that we are thankful and help you.\n\nIn the morning you will see us and know who we are.” In the morning when he woke up they were still there—two men as he thought—but after he had said the last words to them and started on, he turned again to look, and one was a white wolf and the other a black wolf.\n\nThat day he reached home.—Arranged from Curtin, Seneca manuscript."


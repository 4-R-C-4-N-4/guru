[content]
body = "They went on and soon met Kana′tĭ, who seemed much surprised to see them, and said, “What!\n\nare you here again?” “O, yes, we never give up.\n\nWe are great men!” “What did the cannibals do to you?” “We met them and they brought us to their townhouse, but they never hurt us.” Kana′tĭ said nothing more, and they went on.\n\n* * * He soon got out of sight of the boys, but they kept on until they came to the end of the world, where the sun comes out.\n\nThe sky was just coming down when they got there, but they waited until it went up again, and then they went through and climbed up on the other side.\n\nThere they found Kana′tĭ and Selu sitting together.\n\nThe old folk received them kindly and were glad to see them, telling them they might stay there a while, but then they must go to live where the sun goes down.\n\nThe boys stayed with their parents seven days and then went on toward the Darkening land, where they are now.\n\nWe call them Anisga′ya Tsunsdi′ (The Little Men), and when they talk to each other we hear low rolling thunder in the west.\n\nAfter Kana′tĭ’s boys had let the deer out from the cave where their father used to keep them, the hunters tramped about in the woods for a long time without finding any game, so that the people were very hungry.\n\nAt last they heard that the Thunder Boys were now living in the far west, beyond the sun door, and that if they were sent for they could bring back the game.\n\nSo they sent messengers for them, and the boys came and sat down in the middle of the townhouse and began to sing.\n\nAt the first song there was a roaring sound like a strong wind in the northwest, and it grew louder and nearer as the boys sang on, until at the seventh song a whole herd of deer, led by a large buck, came out from the woods.\n\nThe boys had told the people to be ready with their bows and arrows, and when the song was ended and all the deer were close around the townhouse, the hunters shot into them and killed as many as they needed before the herd could get back into the timber.\n\nThen the Thunder Boys went back to the Darkening land, but before they left they taught the people the seven songs with which to call up the deer.\n\nIt all happened so long ago that the songs are now forgotten—all but two, which the hunters still sing whenever they go after deer.\n\nWAHNENAUHI VERSION After the world had been brought up from under the water, “They then made a man and a woman and led them around the edge of the island.\n\nOn arriving at the starting place they planted some corn, and then told the man and woman to go around the way they had been led.\n\nThis they did, and on returning they found the corn up and growing nicely.\n\nThey were then told to continue the circuit.\n\nEach trip consumed more time.\n\nAt last the corn was ripe and ready for use.” Another story is told of how sin came into the world.\n\nA man and a woman reared a large family of children in comfort and plenty, with very little trouble about providing food for them.\n\nEvery morning the father went forth and very soon returned bringing with him a deer, or a turkey, or some other animal or fowl.\n\nAt the same time the mother went out and soon returned with a large basket filled with ears of corn which she shelled and pounded in a mortar, thus making meal for bread.\n\nWhen the children grew up, seeing with what apparent ease food was provided for them, they talked to each other about it, wondering that they never saw such things as their parents brought in."


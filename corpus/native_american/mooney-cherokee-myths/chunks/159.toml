[content]
body = "THE SHAWANO WARS Among the most inveterate foes of the Cherokee were the Shawano, known to the Cherokee as Ani′-Sawănu′gĭ, who in ancient times, probably as early as 1680, removed from Savannah (i.\n\ne., Shawano) river, in South Carolina, and occupied the Cumberland river region in middle Tennessee and Kentucky, from which they were afterward driven by the superior force of the southern tribes and compelled to take refuge north of the Ohio.\n\nOn all old maps we find the Cumberland marked as the “river of the Shawano.” Although the two tribes were frequently, and perhaps for long periods, on friendly terms, the ordinary condition was one of chronic warfare, from an early traditional period until the close of the Revolution.\n\nThis hostile feeling was intensified by the fact that the Shawano were usually the steady allies of the Creeks, the hereditary southern enemies of the Cherokee.\n\nIn 1749, however, we find a party of Shawano from the north, accompanied by several Cherokee, making an inroad into the Creek country, and afterward taking refuge among the Cherokee, thus involving the latter in a new war with their southern neighbors (Adair, Am.\n\nInds., 276, 1775).\n\nThe Shawano made themselves respected for their fighting qualities, gaining a reputation for valor which they maintained in their later wars with the whites, while from their sudden attack and fertility of stratagem they came to be regarded as a tribe of magicians.\n\nBy capture or intermarriage in the old days there is quite an admixture of Shawano blood among the Cherokee.\n\nAccording to Haywood, an aged Cherokee chief, named the Little Cornplanter (Little Carpenter?), stated in 1772 that the Shawano had removed from the Savannah river a long time before in consequence of a disastrous war with several neighboring tribes, and had settled upon the Cumberland, by permission of his people.\n\nA quarrel having afterward arisen between the two tribes, a strong body of Cherokee invaded the territory of the Shawano, and, treacherously attacking them, killed a great number.\n\nThe Shawano fortified themselves and a long war ensued, which continued until the Chickasaw came to the aid of the Cherokee, when the Shawano were gradually forced to withdraw north of the Ohio.\n\nAt the time of their final expulsion, about the year 1710, the boy Charleville was employed at a French post, established for the Shawano trade, which occupied a mound on the south side of Cumberland river, where now is the city of Nashville.\n\nFor a long time the Shawano had been so hard pressed by their enemies that they had been withdrawing to the north in small parties for several years, until only a few remained behind, and these also now determined to leave the country entirely.\n\nIn March the trader sent Charleville ahead with several loads of skins, intending himself to follow with the Shawano a few months later.\n\nIn the meantime the Chickasaw, learning of the intended move, posted themselves on both sides of Cumberland river, above the mouth of Harpeth, with canoes to cut off escape by water, and suddenly attacked the retreating Shawano, killing a large part of them, together with the trader, and taking all their skins, trading goods, and other property.\n\nCharleville lived to tell the story nearly seventy years later.\n\nAs the war was never terminated by any formal treaty of peace, the hostile warriors continued to attack each other whenever they chanced to meet on the rich hunting grounds of Kentucky, until finally, from mutual dread, the region was abandoned by both parties, and continued thus unoccupied until its settlement by the whites.\n\n4 According to Cherokee tradition, a body of Creeks was already established near the mouth of Hiwassee while the Cherokee still had their main settlements upon the Little Tennessee."


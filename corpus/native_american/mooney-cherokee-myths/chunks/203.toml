[content]
body = "Ukte′na-utansi′nastûñ′yĭ : “Where the uktena crawled,” a large rock on the Hyatt farm, on the north bank of Tuckasegee river, about four miles above Bryson City, in Swain county.\n\nIn the rock bed of the stream and along the rocks on the side are wavy depressions said to have been made by an uktena in going up the river.\n\nUntlasgâsti′yĭ : “Where they scratched,” at the head of Hyatt creek, of Valley river, in Cherokee county.\n\nAccording to hunting tradition, every animal on arriving at this spot was accustomed to scratch the ground like a turkey.\n\nVengeance creek : A south tributary of Valley river, in Cherokee county.\n\nSo called by the first settlers from an old Indian woman who lived there and whom they nicknamed “Vengeance,” on account of her cross looks.\n\nThe Cherokee call the district Gănsaʻti′yĭ, “Robbing place,” from their having robbed a trader there in the Revolution.\n\nWaya gap : A gap in the Nantahala mountains, in Macon county, where the trail crosses from Laurel creek of Nantahala river to Cartoogaja creek of the Little Tennessee.\n\nThe Cherokee call it Aʻtâhi′ta, “Shouting place.” For the tradition see number 13 .\n\nIt was the scene of a stubborn encounter in the Revolution (see page 49 ).\n\nThe name Waya appears to be from the Cherokee wă′ʻya , “wolf.” Webster : The county seat of Jackson county, on Tuckasegee river.\n\nKnown to the Cherokee as Unadanti′yĭ, “Where they conjured.” The name properly belongs to a gap 3 miles east of Webster, on the trail going up Scotts creek.\n\nAccording to tradition, a war party of Shawano, coming from the direction of Pigeon river, halted here to “make medicine” against the Cherokee, but while thus engaged were surprised by the latter, who came up from behind and killed several, including the conjurer.\n\nYâ′nû-dinĕhûñ′yĭ : “Where the bears live,” on Oconaluftee river, about a mile above its junction with Tuckasegee, in Swain county.\n\nA family of “water bears” is said to live at the bottom of the river in a deep hole at this point.\n\nYâ′nû-u′nătawasti′yĭ : “Where the bears wash,” a small pond of very cold, purple water, which has no outlet and is now nearly dried up, in a gap of the Great Smoky mountains, at the extreme head of Raven fork of Oconaluftee, in Swain county.\n\nIt was said to be a favorite bear wallow, and according to some accounts its waters had the same virtues ascribed to those of Atagâ′hĭ (see number 69 ).\n\nYawâ′ĭ : “Yawa place,” a spot on the south side of Yellow creek of Cheowa river, in Graham county, about a mile above the trail crossing near the mouth of the creek.\n\nThe legend is that a mysterious personage, apparently a human being, formerly haunted a round knob near there, and was sometimes seen walking about the top of the knob and crying, Yawă′!\n\nYawă′!\n\nwhile the sound of invisible guns came from the hill, so that the people were afraid to go near it."


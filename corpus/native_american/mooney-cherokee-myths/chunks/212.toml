body = "BUREAU OF AMERICAN ETHNOLOGY NINETEENTH ANNUAL REPORT PL.\n\nXX PETROGLYPHS AT TRACK-ROCK GAP, GEORGIA (From sketches by the author, 1889.\n\nPortions cut out by vandals are indicated by lighter shading) The Cherokee have various theories to account for the origin of the carvings, the more sensible Indians saying that they were made by hunters for their own amusement while resting in the gap.\n\nAnother tradition is that they were made while the surface of the newly created earth was still soft by a great army of birds and animals fleeing through the gap to escape some pursuing danger from the west—some say a great “drive hunt” of the Indians.\n\nHaywood confounds them with other petroglyphs in North Carolina connected with the story of the giant Tsulʻkălû′ (see number 81 ).\n\nThe following florid account of the carvings and ostensible Indian tradition of their origin is from White, on the authority of Stevenson: The number visible or defined is 136, some of them quite natural and perfect, and others rather rude imitations, and most of them from the effects of time have become more or less obliterated.\n\nThey comprise human feet from those 4 inches in length to those of great warriors which measure 17½ inches in length and 7¾ in breadth across the toes.\n\nWhat is a little curious, all the human feet are natural except this, which has 6 toes, proving him to have been a descendant of Titan.\n\nThere are 26 of these impressions, all bare except one, which has the appearance of having worn moccasins.\n\nA fine turned hand, rather delicate, occupied a place near the great warrior, and probably the impression of his wife’s hand, who no doubt accompanied her husband in all his excursions, sharing his toils and soothing his cares away.\n\nMany horse tracks are to be seen.\n\nOne seems to have been shod, some are very small, and one measures 12½ inches by 9½ inches.\n\nThis the Cherokee say was the footprint of the great war horse which their chieftain rode.\n\nThe tracks of a great many turkeys, turtles, terrapins, a large bear’s paw, a snake’s trail, and the footprints of two deer are to be seen.\n\nThe tradition respecting these impressions varies.\n\nOne asserts that the world was once deluged with water, and men with all animated beings were destroyed, except one family, together with various animals necessary to replenish the earth; that the Great Spirit before the floods came commanded them to embark in a big canoe, which after long sailing was drawn to this spot by a bevy of swans and rested there, and here the whole troop of animals was disembarked, leaving the impressions as they passed over the rock, which being softened by reason of long submersion kindly received and preserved them.\n\nWar Woman’s creek : Enters Chattooga river in Rabun county, northeastern Georgia, in the heart of the old Lower Cherokee country.\n\nThe name seems to be of Indian origin, although the Cherokee name is lost and the story has perished.\n\nA writer quoted by White (Historical Collections of Georgia, p.\n\n444) attempts to show its origin from the exploit of a certain Revolutionary amazon, in capturing a party of Tories, but the name occurs in Adair (note, p.\n\n185) as early as 1775.\n\nThere is some reason for believing that it refers to a former female dignitary among the Cherokee, described by Haywood under the title of the “Pretty Woman” as having authority to decide the fate of prisoners of war."


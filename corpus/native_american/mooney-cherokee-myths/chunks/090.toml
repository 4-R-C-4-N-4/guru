[content]
body = "Infants slow in learning to speak have their tongues scratched with the claw of a gûlʻkwâgĭ, the living insect being held in the hand during the operation, in order that they may soon learn to speak distinctly and be eloquent, wise, and shrewd of speech as they grow older, and of such quick intelligence as to remember without effort anything once heard.\n\nThe same desirable result may be accomplished with a grown person, but with much more difficulty, as in that case it is necessary to scratch the inside of the throat for four successive mornings, the insect being pushed down with the fingers and again withdrawn, while the regular tabus must be strictly observed for the same period, or the operation will be without effect.\n\nIn some cases the insect is put into a small bowl of water overnight, and if still alive in the morning it is taken out and the water given to the patient to drink, after which the gûlʻkwâgĭ is set at liberty.\n\nBees are kept by many of the Cherokee, in addition to the wild bees which are hunted in the woods.\n\nAlthough they are said to have come originally from the whites, the Cherokee have no tradition of a time when they did not know them; there seems, however, to be no folklore connected with them.\n\nThe cow-ant ( Myrmica ?), a large, red, stinging ant, is called properly dasûñ′tălĭ atatsûñ′skĭ , “stinging ant,” but, on account of its hard body-case, is frequently called nûñ′yunu′wĭ , “stone-dress,” after a celebrated mythic monster.\n\nStrange as it may seem, there appears to be no folklore connected with either the firefly or the glowworm, while the spider, so prominent in other tribal mythologies, appears in but a single Cherokee myth, where it brings back the fire from across the water.\n\nIn the formulas it is frequently invoked to entangle in its threads the soul of a victim whom the conjurer desires to bring under his evil spells.\n\nFrom a fancied resemblance in appearance the name for spider, kă′năne′skĭ , is applied also to a watch or clock.\n\nA small yellowish moth which flies about the fire at night is called tûñ′tăwû , a name implying that it goes into and out of the fire, and when at last it flits too near and falls into the blaze the Cherokee say, “Tûñ′tăwû is going to bed.” On account of its affinity for the fire it is invoked by the doctor in all “fire diseases,” including sore eyes and frostbite."


[content]
body = "THE EASTERN TRIBES Besides the Iroquois and Shawano, the Cherokee remember also the Delawares, Tuscarora, Catawba, and Cheraw as tribes to the east or north with which they formerly had relations.\n\nThe Cherokee call the Delawares Anakwan′ʻkĭ, in the singular Akwan′ʻkĭ, a derivative formed according to usual Cherokee phonetic modification from Wapanaq′kĭ, “Easterners,” the generic name by which the Delawares and their nearest kindred call themselves.\n\nIn the most ancient tradition of the Delawares the Cherokee are called Talega, Tallige, Tallige-wi, etc.\n\n9 In later Delaware tradition they are called Kĭtu′hwa, and again we find the two tribes at war, for which their neighbors are held responsible.\n\nAccording to the Delaware account, the Iroquois, in one of their forays to the south, killed a Cherokee in the woods and purposely left a Delaware war club near the body to make it appear that the work had been done by men of that tribe.\n\nThe Cherokee found the body and the club, and naturally supposing that the murder had been committed by the Delawares, they suddenly attacked the latter, the result being a long and bloody war between the two tribes.\n\n10 At this time, i.\n\ne., about the end of the seventeenth century, it appears that a part at least of the Cherokee lived on the waters of the Upper Ohio, where the Delawares made continual inroads upon them, finally driving them from the region and seizing it for themselves about the year 1708.\n\n11 A century ago the Delawares used to tell how their warriors would sometimes mingle in disguise with the Cherokee at their night dances until the opportunity came to strike a sudden blow and be off before their enemies recovered from the surprise.\n\nBUREAU OF AMERICAN ETHNOLOGY NINETEENTH ANNUAL REPORT PL.\n\nXVIII PHOTOGRAPH By AUTHOR, 1888 WALINI′, A CHEROKEE WOMAN Later there seems to have been peace until war was again brought on by the action of the Shawano, who had taken refuge with the Delawares, after having been driven from their old home on Cumberland river by the Cherokee.\n\nFeeling secure in their new alliance, the Shawano renewed their raids upon the Cherokee, who retaliated by pursuing them into the Delaware country, where they killed several Delawares by mistake.\n\nThis inflamed the latter people, already excited by the sight of Cherokee scalps and prisoners brought back through their country by the Iroquois, and another war was the result, which lasted until the Cherokee, tired of fighting so many enemies, voluntarily made overtures for peace in 1768, saluting the Delawares as Grandfather, an honorary title accorded them by all the Algonquian tribes.\n\nThe Delawares then reprimanded the Shawano, as the cause of the trouble, and advised them to keep quiet, which, as they were now left to fight their battles alone, they were glad enough to do.\n\nAt the same time the Cherokee made peace with the Iroquois, and the long war with the northern tribes came to an end.\n\nThe friendly feeling thus established was emphasized in 1779, when the Cherokee sent a message of condolence upon the death of the Delaware chief White-eyes.\n\n12 The Tuscarora, formerly the ruling tribe of eastern North Carolina, are still remembered under the name Ani′-Skălâ′lĭ, and are thus mentioned in the Feather dance of the Cherokee, in which some of the actors are supposed to be visiting strangers from other tribes."


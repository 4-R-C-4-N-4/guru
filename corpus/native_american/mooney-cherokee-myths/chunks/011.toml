[content]
body = "At last one proposed to watch when their parents went out and to follow them.\n\nAccordingly next morning the plan was carried out.\n\nThose who followed the father saw him stop at a short distance from the cabin and turn over a large stone that appeared to be carelessly leaned against another.\n\nOn looking closely they saw an entrance to a large cave, and in it were many different kinds of animals and birds, such as their father had sometimes brought in for food.\n\nThe man standing at the entrance called a deer, which was lying at some distance and back of some other animals.\n\nIt rose immediately as it heard the call and came close up to him.\n\nHe picked it up, closed the mouth of the cave, and returned, not once seeming to suspect what his sons had done.\n\nWhen the old man was fairly out of sight, his sons, rejoicing how they had outwitted him, left their hiding place and went to the cave, saying they would show the old folks that they, too, could bring in something.\n\nThey moved the stone away, though it was very heavy and they were obliged to use all their united strength.\n\nWhen the cave was opened, the animals, instead of waiting to be picked up, all made a rush for the entrance, and leaping past the frightened and bewildered boys, scattered in all directions and disappeared in the wilderness, while the guilty offenders could do nothing but gaze in stupefied amazement as they saw them escape.\n\nThere were animals of all kinds, large and small—buffalo, deer, elk, antelope, raccoons, and squirrels; even catamounts and panthers, wolves and foxes, and many others, all fleeing together.\n\nAt the same time birds of every kind were seen emerging from the opening, all in the same wild confusion as the quadrupeds—turkeys, geese, swans, ducks, quails, eagles, hawks, and owls.\n\nThose who followed the mother saw her enter a small cabin, which they had never seen before, and close the door.\n\nThe culprits found a small crack through which they could peer.\n\nThey saw the woman place a basket on the ground and standing over it shake herself vigorously, jumping up and down, when lo and behold!\n\nlarge ears of corn began to fall into the basket.\n\nWhen it was well filled she took it up and, placing it on her head, came out, fastened the door, and prepared their breakfast as usual.\n\nWhen the meal had been finished in silence the man spoke to his children, telling them that he was aware of what they had done; that now he must die and they would be obliged to provide for themselves.\n\nHe made bows and arrows for them, then sent them to hunt for the animals which they had turned loose.\n\nThen the mother told them that as they had found out her secret she could do nothing more for them; that she would die, and they must drag her body around over the ground; that wherever her body was dragged corn would come up.\n\nOf this they were to make their bread.\n\nShe told them that they must always save some for seed and plant every year."


[content]
body = "The underlying idea is that the fetid smell repels the disease spirit, and upon the same principle the buzzard, which is so evidently superior to carrion smells, is held to be powerful against the same diseases.\n\nThe beaver ( dâ′yĭ ), by reason of its well-known gnawing ability, against which even the hardest wood is not proof, is invoked on behalf of young children just getting their permanent teeth.\n\nAccording to the little formula which is familiar to nearly every mother in the tribe, when the loosened milk tooth is pulled out or drops out of itself, the child runs with it around the house, repeating four times, “ Dâ′yĭ, skĭntă′ (Beaver, put a new tooth into my jaw)” after which he throws the tooth upon the roof of the house.\n\nIn a characteristic song formula to prevent frostbite the traveler, before starting out on a cold winter morning, rubs his feet in the ashes of the fire and sings a song of four verses, by means of which, according to the Indian idea, he acquires in turn the cold-defying powers of the wolf, deer, fox, and opossum, four animals whose feet, it is held, are never frostbitten.\n\nAfter each verse he imitates the cry and the action of the animal.\n\nThe words used are archaic in form and may be rendered “I become a real wolf,” etc.\n\nThe song runs: Tsûñ′wa′ʻya-ya′ (repeated four times), wa + a!\n\n(prolonged howl).\n\n(Imitates a wolf pawing the ground with his feet.) Tsûñ′-ka′wi-ye′ (repeated four times), sauh!\n\nsauh!\n\nsauh!\n\nsauh!\n\n(Imitates call and jumping of a deer.) Tsûñ′-tsu′ʻla-ya′ (repeated four times), gaih!\n\ngaih!\n\ngaih!\n\ngaih!\n\n(Imitates barking and scratching of a fox.) Tsûñ′-sĭ′kwa-ya′ (repeated four times), kĭ +.\n\n(Imitates the cry of an opossum when cornered, and throws his head back as that animal does when feigning death.)"


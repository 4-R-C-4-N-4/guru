[content]
body = "Under the blanket on the seat were long, sharp thorns of the honey locust, with the points all sticking up, but when the boy sat down they did not hurt him, and then Thunder knew that it was his son.\n\nHe asked the boy why he had come.\n\n“I have sores all over my body, and my mother told me you were my father and a great doctor, and if I came here you would cure me.” “Yes,” said his father, “I am a great doctor, and I’ll soon fix you.” There was a large pot in the corner and he told his wife to fill it with water and put it over the fire.\n\nWhen it was boiling, he put in some roots, then took the boy and put him in with them.\n\nHe let it boil a long time until one would have thought that the flesh was boiled from the poor boy’s bones, and then told his wife to take the pot and throw it into the river, boy and all.\n\nShe did as she was told, and threw it into the water, and ever since there is an eddy there that we call Ûñ′tiguhĭ′, “Pot-in-the-water.” A service tree and a calico bush grew on the bank above.\n\nA great cloud of steam came up and made streaks and blotches on their bark, and it has been so to this day.\n\nWhen the steam cleared away she looked over and saw the boy clinging to the roots of the service tree where they hung down into the water, but now his skin was all clean.\n\nShe helped him up the bank, and they went back to the house.\n\nOn the way she told him, “When we go in, your father will put a new dress on you, but when he opens his box and tells you to pick out your ornaments be sure to take them from the bottom.\n\nThen he will send for his other sons to play ball against you.\n\nThere is a honey-locust tree in front of the house, and as soon as you begin to get tired strike at that and your father will stop the play, because he does not want to lose the tree.” When they went into the house, the old man was pleased to see the boy looking so clean, and said, “I knew I could soon cure those spots.\n\nNow we must dress you.” He brought out a fine suit of buckskin, with belt and headdress, and had the boy put them on.\n\nThen he opened a box and said, “Now pick out your necklace and bracelets.” The boy looked, and the box was full of all kinds of snakes gliding over each other with their heads up.\n\nHe was not afraid, but remembered what the woman had told him, and plunged his hand to the bottom and drew out a great rattlesnake and put it around his neck for a necklace.\n\nHe put down his hand again four times and drew up four copperheads and twisted them around his wrists and ankles.\n\nThen his father gave him a war club and said, “Now you must play a ball game with your two elder brothers.\n\nThey live beyond here in the Darkening land, and I have sent for them.” He said a ball game, but he meant that the boy must fight for his life.\n\nThe young men came, and they were both older and stronger than the boy, but he was not afraid and fought against them.\n\nThe thunder rolled and the lightning flashed at every stroke, for they were the young Thunders, and the boy himself was Lightning.\n\nAt last he was tired from defending himself alone against two, and pretended to aim a blow at the honey-locust tree.\n\nThen his father stopped the fight, because he was afraid the lightning would split the tree, and he saw that the boy was brave and strong."


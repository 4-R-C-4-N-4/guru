[content]
body = "The Cherokee chief stepped forward and said, “I will hold it in my hand, and to-morrow we will tell you what we decide.” He then turned and said to the people, “Go home and bring food.” They went and brought so much food that it made a great pile across the house, and all of both tribes ate together, but could not finish it.\n\nNext day they ate together again, and when all were done the Cherokee chief said to the Seneca, “We have decided to be friendly and to bury our weapons, these knives and hatchets, so that no man may take them up again.” The Seneca chief replied, “We are glad you have accepted our offer, and now we have all thrown our weapons in a pile together, and the white wampum hangs between us, and the belt shall be as long as a man and hang down to the ground.” Then the Cherokee chief said to his people, “Now is the time for any of you that wishes to adopt a relative from among the Seneca to do so.” So some Cherokee women went and picked out one man and said, “You shall be our uncle,” and some more took another for their brother, and so on until only Gaʼnaʼ, the chief, was left, but the Cherokee chief said, “No one must take Gaʼnaʼ, for a young man is here to claim him as his father.” Then the young man came up to Gaʼnaʼ and said, “Father, I am glad to see you.\n\nFather, we will go home,” and he led Gaʼnaʼ to his own mother’s house, the house where Gaʼnaʼ had spent the first night.\n\nThe young man was really his son, and when Gaʼnaʼ came to the house he recognized the woman as his wife who had been carried off long ago by the Cherokee.\n\nWhile they were there a messenger came from the Seoqgwageono tribe, that lived near the great salt water in the east, to challenge the Cherokee to a ball play.\n\nHe was dressed in skins which were so long that they touched the ground.\n\nHe said that his people were already on the way and would arrive in a certain number of days.\n\nThey came on the appointed day and the next morning began to make the bets with the Cherokee.\n\nThe Seneca were still there.\n\nThe strangers bet two very heavy and costly robes, besides other things.\n\nThey began to play, and the Cherokee lost the game.\n\nThen the Seneca said, “We will try this time.” Both sides bet heavily again, and the game began, but after a little running the Seneca carried the ball to their goal and made a point.\n\nBefore long they made all the points and won the game.\n\nThen the bets were doubled, and the Seneca won again.\n\nWhen they won a third game also the Seoqgwageono said, “Let us try a race,” and the Seneca agreed.\n\nThe course was level, and the open space was very wide.\n\nThe Cherokee selected the Seneca runner, and it was agreed that they would run the first race without betting and then make their bets on the second race.\n\nThey ran the first race, and when they reached the post the Seneca runner was just the measure of his body behind the other.\n\nHis people asked him if he had done his best, but he said, “No; I have not,” so they made their bets, and the second race—the real race—began.\n\nWhen they got to the middle the Seneca runner said to the other, “Do your best now, for I am going to do mine,” and as he said it he pulled out and left the other far behind and won the race."


[content]
body = "According to the same myth the Flying Squirrel ( Tewa ) also aided in securing the victory, and hence both these animals are still invoked by the ball player.\n\nThe meat of the common gray squirrel ( sălâ′lĭ ) is forbidden to rheumatic patients, on account of the squirrel’s habit of assuming a cramped position when eating.\n\nThe stripes upon the back of the ground squirrel ( kiyu′ʻga ) are the mark of scratches made by the angry animals at a memorable council in which he took it upon himself to say a good word for the archenemy, Man (see “Origin of Disease and Medicine”).\n\nThe peculiarities of the mink ( sûñgĭ ) are accounted for by another story.\n\nThe buffalo, the largest game animal of America, was hunted in the southern Allegheny region until almost the close of the last century, the particular species being probably that known in the West as the wood or mountain buffalo.\n\nThe name in use among the principal gulf tribes was practically the same, and can not be analyzed, viz, Cherokee, yûñsû′ ; Hichitee, ya′nasi ; Creek, yĕna′sa ; Choctaw, yanash .\n\nAlthough the flesh of the buffalo was eaten, its skin dressed for blankets and bed coverings, its long hair woven into belts, and its horns carved into spoons, it is yet strangely absent from Cherokee folklore.\n\nSo far as is known it is mentioned in but a single one of the sacred formulas, in which a person under treatment for rheumatism is forbidden to eat the meat, touch the skin, or use a spoon made from the horn of the buffalo, upon the ground of an occult connection between the habitual cramped attitude of a rheumatic and the natural “hump” of that animal.\n\nThe elk is known, probably by report, under the name of aʻwĭ′ e′gwa , “great deer”, but there is no myth or folklore in connection with it.\n\nThe deer, aʻwĭ′ , which is still common in the mountains, was the principal dependence of the Cherokee hunter, and is consequently prominent in myth, folklore, and ceremonial.\n\nOne of the seven gentes of the tribe is named from it (Ani′-Kawĭ′, “Deer People”).\n\nAccording to a myth given elsewhere, the deer won his horns in a successful race with the rabbit.\n\nRheumatism is usually ascribed to the work of revengeful deer ghosts, which the hunter has neglected to placate, while on the other hand the aid of the deer is invoked against frostbite, as its feet are believed to be immune from injury by frost.\n\nThe wolf, the fox, and the opossum are also invoked for this purpose, and for the same reason.\n\nWhen the redroot ( Ceanothus americanus ) puts forth its leaves the people say the young fawns are then in the mountains.\n\nOn killing a deer the hunter always cuts out the hamstring from the hind quarter and throws it away, for fear that if he ate it he would thereafter tire easily in traveling.\n\nThe powerful chief of the deer tribe is the A[ʻ]wĭ′ Usdi′, or “Little Deer,” who is invisible to all except the greatest masters of the hunting secrets, and can be wounded only by the hunter who has supplemented years of occult study with frequent fasts and lonely vigils.\n\nThe Little Deer keeps constant protecting watch over his subjects, and sees well to it that not one is ever killed in wantonness.\n\nWhen a deer is shot by the hunter the Little Deer knows it at once and is instantly at the spot.\n\nBending low his head he asks of the blood stains upon the ground if they have heard—i."


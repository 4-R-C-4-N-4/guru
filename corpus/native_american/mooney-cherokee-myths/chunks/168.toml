[content]
body = "As the majority of the Tuscarora fled from Carolina to the Iroquois country about 1713, in consequence of their disastrous war with the whites, their memory has nearly faded from the recollection of the southern Indians.\n\nFrom the scanty light which history throws upon their mutual relations, the two tribes seem to have been almost constantly at war with each other.\n\nWhen at one time the Cherokee, having already made peace with some other of their neighbors, were urged by the whites to make peace also with the Tuscarora, they refused, on the ground that, as they could not live without war, it was better to let matters stand as they were than to make peace with the Tuscarora and be obliged immediately to look about for new enemies with whom to fight.\n\nFor some years before the outbreak of the Tuscarora war in 1711 the Cherokee had ceased their inroads upon this tribe, and it was therefore supposed that they were more busily engaged with some other people west of the mountains, these being probably the Shawano, whom they drove out of Tennessee about this time.\n\n13 In the war of 1711–1713 the Cherokee assisted the whites against the Tuscarora.\n\nIn 1731 the Cherokee again threatened to make war upon the remnant of that tribe still residing in North Carolina and the colonial government was compelled to interfere.\n\n14 The Cheraw or Sara, ranging at different periods from upper South Carolina to the southern frontier of Virginia, are also remembered under the name of Ani′-Suwa′lĭ, or Ani′-Suwa′la, which agrees with the Spanish form Xuala of De Soto’s chronicle, and Suala, or Sualy, of Lederer.\n\nThe Cherokee remember them as having lived east of the Blue ridge, the trail to their country leading across the gap at the head of Swannanoa river, east from Asheville.\n\nThe name of the stream and gap is a corruption of the Cherokee Suwa′lĭ-Nûñnâ′hĭ, “Suwa′li trail.” Being a very warlike tribe, they were finally so reduced by conflicts with the colonial governments and the Iroquois that they were obliged to incorporate with the Catawba, among whom they still maintained their distinct language as late as 1743.\n\n15 The Catawba are known to the Cherokee as Ani′ta′gwa, singular Ata′gwa, or Ta′gwa, the Cherokee attempt at the name by which they are most commonly known.\n\nThey were the immediate neighbors of the Cherokee on the east and southeast, having their principal settlements on the river of their name, just within the limits of South Carolina, and holding the leading place among all the tribes east of the Cherokee country with the exception of the Tuscarora.\n\nOn the first settlement of South Carolina there were estimated to be about 7,000 persons in the tribe, but their decline was rapid, and by war and disease their number had been reduced in 1775 to barely 500, including the incorporated remnants of the Cheraw and several smaller tribes.\n\nThere are now, perhaps, 100 still remaining on a small reservation near the site of their ancient towns.\n\nSome local names in the old Cherokee territory seem to indicate the former presence of Catawba, although there is no tradition of any Catawba settlement within those limits.\n\nAmong such names may be mentioned Toccoa creek, in northeastern Georgia, and Toccoa river, in north-central Georgia, both names being derived from the Cherokee Tagwâ′hĭ, “Catawba place.” An old Cherokee personal name is Ta′gwădihĭ′, “Catawba-killer.” The two tribes were hereditary enemies, and the feeling between them is nearly as bitter to-day as it was a hundred years ago."


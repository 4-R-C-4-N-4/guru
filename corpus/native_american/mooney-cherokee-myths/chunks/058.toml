[content]
body = "The meat of the ruffed grouse, locally known as the pheasant ( Bonasa umbellus ), is tabued to a pregnant woman, because this bird hatches a large brood, but loses most of them before maturity.\n\nUnder a stricter construction of the theory this meat is forbidden to a woman until she is past child bearing.\n\nThe redbird, tatsu′hwă , is believed to have been originally the daughter of the Sun (see the story).\n\nThe huhu , or yellow mocking-bird, occurs in several stories.\n\nIt is regarded as something supernatural, possibly on account of its imitative powers, and its heart is given to children to make them quick to learn.\n\nThe chickadee ( Parus carolinensis ), tsĭkĭlilĭ′ , and the tufted titmouse, ( Parus bicolor ), utsu′ʻgĭ , or u′stûtĭ , are both regarded as news bringers, but the one is venerated as a truth teller while the other is scoffed at as a lying messenger, for reasons which appear in the story of Nûñyunu′wĭ (q.\n\nv.).\n\nWhen the tsĭkĭlilĭ′ perches on a branch near the house and chirps its song it is taken as an omen that an absent friend will soon be heard from or that a secret enemy is plotting mischief.\n\nMany stories are told in confirmation of this belief, among which may be instanced that of Tom Starr, a former noted outlaw of the Cherokee Nation of the West, who, on one occasion, was about to walk unwittingly into an ambush prepared for him along a narrow trail, when he heard the warning note of the tsĭkĭlilĭ′, and, turning abruptly, ran up the side of the ridge and succeeded in escaping with his life, although hotly pursued by his enemies."


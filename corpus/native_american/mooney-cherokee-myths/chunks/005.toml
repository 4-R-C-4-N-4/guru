[content]
body = "KANA′TĬ AND SELU: THE ORIGIN OF GAME AND CORN When I was a boy this is what the old men told me they had heard when they were boys.\n\nLong years ago, soon after the world was made, a hunter and his wife lived at Pilot knob with their only child, a little boy.\n\nThe father’s name was Kana′tĭ (The Lucky Hunter), and his wife was called Selu (Corn).\n\nNo matter when Kana′tĭ went into the wood, he never failed to bring back a load of game, which his wife would cut up and prepare, washing off the blood from the meat in the river near the house.\n\nThe little boy used to play down by the river every day, and one morning the old people thought they heard laughing and talking in the bushes as though there were two children there.\n\nWhen the boy came home at night his parents asked him who had been playing with him all day.\n\n“He comes out of the water,” said the boy, “and he calls himself my elder brother.\n\nHe says his mother was cruel to him and threw him into the river.” Then they knew that the strange boy had sprung from the blood of the game which Selu had washed off at the river’s edge.\n\nEvery day when the little boy went out to play the other would join him, but as he always went back again into the water the old people never had a chance to see him.\n\nAt last one evening Kana′tĭ said to his son, “Tomorrow, when the other boy comes to play, get him to wrestle with you, and when you have your arms around him hold on to him and call for us.” The boy promised to do as he was told, so the next day as soon as his playmate appeared he challenged him to a wrestling match.\n\nThe other agreed at once, but as soon as they had their arms around each other, Kana′tĭ’s boy began to scream for his father.\n\nThe old folks at once came running down, and as soon as the Wild Boy saw them he struggled to free himself and cried out, “Let me go; you threw me away!” but his brother held on until the parents reached the spot, when they seized the Wild Boy and took him home with them.\n\nThey kept him in the house until they had tamed him, but he was always wild and artful in his disposition, and was the leader of his brother in every mischief.\n\nIt was not long until the old people discovered that he had magic powers, and they called him I′năge-utăsûñ′hĭ (He-who-grew-up-wild).\n\nWhenever Kana′tĭ went into the mountains he always brought back a fat buck or doe, or maybe a couple of turkeys.\n\nOne day the Wild Boy said to his brother, “I wonder where our father gets all that game; let’s follow him next time and find out.” A few days afterward Kana′tĭ took a bow and some feathers in his hand and started off toward the west.\n\nThe boys waited a little while and then went after him, keeping out of sight until they saw him go into a swamp where there were a great many of the small reeds that hunters use to make arrowshafts.\n\nThen the Wild Boy changed himself into a puff of bird’s down, which the wind took up and carried until it alighted upon Kana′tĭ’s shoulder just as he entered the swamp, but Kana′tĭ knew nothing about it.\n\nThe old man cut reeds, fitted the feathers to them and made some arrows, and the Wild Boy—in his other shape—thought, “I wonder what those things are for?” When Kana′tĭ had his arrows finished he came out of the swamp and went on again."


[content]
body = "Then there was a louder roll of thunder and the woman said, “Now our brother is nearly home.” While they urged and he still refused to come nearer or sit down, suddenly there was a great thunder clap just behind him, and turning quickly he saw a man standing in the doorway of the cave.\n\n“This is my brother,” said the woman, and he came in and sat down upon the turtle, which again rose up and stretched out its claws.\n\nThe young warrior still refused to come in.\n\nThe brother then said that he was just about to start to a council, and invited the young man to go with him.\n\nThe hunter said he was willing to go if only he had a horse; so the young woman was told to bring one.\n\nShe went out and soon came back leading a great uktena snake, that curled and twisted along the whole length of the cave.\n\nSome people say this was a white uktena and that the brother himself rode a red one.\n\nThe hunter was terribly frightened, and said “That is a snake; I can’t ride that.” The others insisted that it was no snake, but their riding-horse.\n\nThe brother grew impatient and said to the woman, “He may like it better if you bring him a saddle, and some bracelets for his wrists and arms.” So they went out again and brought in a saddle and some arm bands, and the saddle was another turtle, which they fastened on the uktena’s back, and the bracelets were living slimy snakes, which they got ready to twist around the hunter’s wrists.\n\nHe was almost dead with fear, and said, “What kind of horrible place is this?\n\nI can never stay here to live with snakes and creeping things.” The brother got very angry and called him a coward, and then it was as if lightening flashed from his eyes and struck the young man, and a terrible crash of thunder stretched him senseless.\n\nWhen at last he came to himself again he was standing with his feet in the water and both hands grasping a laurel bush that grew out from the bank, and there was no trace of the cave or the Thunder People, but he was alone in the forest.\n\nHe made his way out and finally reached his own settlement, but found then that he had been gone so very long that all the people had thought him dead, although to him it seemed only the day after the dance.\n\nHis friends questioned him closely, and, forgetting the warning, he told the story; but in seven days he died, for no one can come back from the underworld and tell it and live."


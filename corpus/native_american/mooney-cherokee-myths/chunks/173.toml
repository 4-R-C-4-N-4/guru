[content]
body = "They were gradually dispossessed by the whites, and were incorporated with the Creeks about the year 1740, but retain their separate identity and language to this day, their town being now the largest in the Creek Nation in Indian Territory.\n\nAccording to the testimony of a Cherokee mixed-blood named Gansĕ′ʻtĭ or Rattling-gourd, who was born on Hiwassee river in 1820 and came west with his people in 1838, a number of Yuchi lived, before the Removal, scattered among the Cherokee near the present Cleveland, Tennessee, and on Chickamauga, Cohutta, and Pinelog creeks in the adjacent section of Georgia.\n\nThey had no separate settlements, but spoke their own language, which he described as “hard and grunting.” Some of them spoke also Cherokee and Creek.\n\nThey had probably drifted north from the Creek country before a boundary had been fixed between the tribes.\n\nWhen Tahlequah was established as the capital of the Cherokee Nation in the West in 1839 a few Yuchi were found already settled at the spot, being supposed to have removed from the East with some Creeks after the chief McIntosh was killed in 1825.\n\nThey perished in the smallpox epidemic which ravaged the frontier in 1840, and their graves were still pointed out at Tahlequah in 1891.\n\nShortly before the outbreak of the Civil war there was a large and prosperous Yuchi settlement on Cimarron river, in what was afterward the Cherokee strip.\n\nRamsey states that “a small tribe of Uchees” once occupied the country near the mouth of the Hiwassee, and was nearly exterminated in a desperate battle with the Cherokee at the Uchee Old Fields, in Rhea (now Meigs) county, Tennessee, the few survivors retreating to Florida, where they joined the Seminoles.\n\n23 There seems to be no other authority for the statement.\n\nAnother broken tribe incorporated in part with the Creeks and in part with the Cherokee was that of the Na′ʻtsĭ, or Natchez, who originally occupied the territory around the site of the present town of Natchez in southern Mississippi, and exercised a leading influence over all the tribes of the region.\n\nIn consequence of a disastrous war with the French in 1729–31 the tribe was disrupted, some taking refuge with the Chickasaw, others with the Creeks, either then or later, while others, in 1736, applied to the government of South Carolina for permission to settle on the Savannah river.\n\nThe request was evidently granted, and we find the “Nachee” mentioned as one of the tribes living with the Catawba in 1743, but retaining their distinct language.\n\nIn consequence of having killed some of the Catawba in a drunken quarrel they were forced to leave this region, and seem to have soon afterward joined the Cherokee, as we find them twice mentioned in connection with that tribe in 1755.\n\nThis appears to be the last reference to them in the South Carolina records.\n\n24 Just here the Cherokee tradition takes them up, under the name of Anin′tsĭ, abbreviated from Ani′-Na′ʻtsĭ, the plural of Na′ʻtsĭ.\n\nFrom a chance coincidence with the word for pine tree, naʻtsĭ′ , some English speaking Indians have rendered this name as “Pine Indians.” The Cherokee generally agree that the Natchez came to them from South Carolina, though some say that they came from the Creek country.\n\nIt is probable that the first refugees were from Carolina and were joined later by others from the Creeks and the Chickasaw."


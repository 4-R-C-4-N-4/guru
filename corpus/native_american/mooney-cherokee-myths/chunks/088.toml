[content]
body = "The small scorpion lizard ( tsâne′nĭ ) is sometimes called also gigă-danegi′skĭ , “blood taker.” It is a striped lizard which frequents sandy beaches and resemble the diyâ′hălĭ, but is of a brown color.\n\nIt is believed also to be sucking blood in some mysterious way whenever it nods its head, and if its heart be eaten by a dog that animal will be able to extract all the nutrient properties from food by simply looking at these who are eating.\n\nThe small spring lizard ( duwĕ′ʻgă ), which lives in springs, is supposed to cause rain whenever it crawls out of the spring.\n\nIt is frequently invoked in the formulas.\n\nAnother spring (?) lizard, red, with black spots, is called dăgan′ʻtû′ or aniganti′skĭ “the rain maker,” because its cry is said to bring rain.\n\nThe water dog ( tsuwă′ , mud puppy, Menopoma or Protonopsis ) is a very large lizard, or rather salamander, frequenting muddy water.\n\nIt is rarely eaten, from an unexplained belief that if one who has eaten its meat goes into the field immediately afterward the crop will be ruined.\n\nThere are names for one or two other varieties of lizard as well as for the alligator ( tsula′skĭ ), but no folklore in connection with them.\n\nAlthough the Cherokee country abounds in swift-flowing streams well stocked with fish, of which the Indians make free use, there is but little fish lore.\n\nA number of “dream” diseases, really due to indigestion, are ascribed to revengeful fish ghosts, and the doctor usually tries to effect the cure by invoking some larger fish or fish-eating bird to drive out the ghost.\n\nToco creek, in Monroe county, Tennessee, derives its name from a mythic monster fish, the Dăkwă′, considered the father of all the fish tribe, which is said to have lived formerly in Little Tennessee river at that point (see story, “The Hunter and the Dăkwă′”).\n\nA fish called ugûñste′lĭ , “having horns,” which appears only in spring, is believed to be transformed later into the giga-tsuha′lĭ lizard, already mentioned.\n\nThe fish is described as having horns or projections upon its nose and beautiful red spots upon its head, and as being attended or accompanied by many smaller red fish, all of which, including the ugûñste′lĭ, are accustomed to pile up small stones in the water.\n\nAs the season advances it disappears and is believed then to have turned into a giga-tsuha′lĭ lizard, the change beginning at the head and finishing with the tail.\n\nIt is probably the Campostoma or stone roller, which is conspicuous for its bright coloring in early spring, but loses its tints after spawning.\n\nThe meat of the sluggish hog-sucker is tabued to the ball player, who must necessarily be active in movement.\n\nThe fresh-water mussel is called dăgû′nă , and the same name is applied to certain pimples upon the face, on account of a fancied resemblance.\n\nThe ball player rubs himself with an eel skin to make himself slippery and hard to hold, and, according to the Wahnenauhi manuscript, women formerly tied up their hair with the dried skin of an eel to make it grow long.\n\nA large red crawfish called tsiska′gĭlĭ , much resembling a lobster, is used to scratch young children in order to give them a strong grip, each hand of the child being lightly scratched once with the pincer of the living animal."


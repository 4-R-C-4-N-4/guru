[content]
body = "Tsukilûñnûñ′yĭ : “Where he alighted,” two small bald spots on the side of the mountain at the head of Little Snowbird creek, southwest of Robbinsville, in Graham county.\n\nA mysterious being, having the form of a giant, with head blazing like the sun, was once seen to fly through the air, alight at this place, and stand for some time looking out over the landscape.\n\nIt then flew away, and when the people came afterward to look, they found the herbage burned from the ground where it had stood.\n\nThey do not know who it was, but some think it may have been the Sun.\n\nTsulâ′sinûñ′yĭ : “Where the footprint is,” on Tuckasegee river, about a mile above Deep creek, in Swain county.\n\nFrom a rock now blasted out to make way for the railroad, on which were impressions said to have been the footprints of the giant Tsulʻkălû′ (see story ) and a deer.\n\nTsundaʻnilti′yĭ : “Where they demanded the debt from him,” a fine camping ground, on the north side of Little Santeetla creek, about halfway up, west from Robbinsville, Graham county.\n\nHere a hunter once killed a deer, which the others of the party demanded in payment of a debt due them.\n\nThe Cherokee commonly give the creek the same name.\n\nTsûta′ga Uweyûñ′ĭ : “Chicken creek,” an extreme eastern head-stream of Nantahala river, entering about 4 miles above Clear branch, in Macon county.\n\nSo called from a story that some hunters camping there for the night once heard a noise as of chickens constantly crowing upon a high rock farther up the stream.\n\nTsuta′tsinâsûñ′yĭ : “Where it eddies,” a deep hole at the mouth of Cockram creek of Cheowa river, in Graham county, where is an eddy said to be caused by a buffalo which lives under the water at this spot, and which anciently lived at the mouth of West Buffalo creek, farther up the river.\n\nTusquittee bald : A bald mountain at the head of Tusquittee creek, eastward from Hayesville, in Clay county.\n\nThe Cherokee name is Tsuwă′-uniyetsûñ′yĭ, “Where, the water-dogs laughed,” the water-dog of the southern Alleghenies, sometimes also called mud-puppy or hell-bender, being a large amphibious lizard or salamander of the genus Menopoma , frequenting muddy waters.\n\nAccording to the story, a hunter once crossing over the mountain in a very dry season, heard voices, and creeping silently toward the place from which the sound proceeded, peeped over a rock and saw two water-dogs walking together on their hind legs along the trail and talking as they went.\n\nTheir pond had dried up and they were on the way over to Nantahala river.\n\nAs he listened one said to the other, “Where’s the water?\n\nI’m so thirsty that my apron (gills) hangs down,” and then both water-dogs laughed.\n\nUkte′na-tsuganûñ′tatsûñ′yĭ : “Where the uktena fastened,” a spot on Tuckasegee river, about 2 miles above Deep creek, near Bryson City, in Swain county.\n\nThere is a tradition that an uktena, trying to make his way upstream, became fastened here, and in his struggles pried up some large rocks now lying in the bed of the river, and left deep scratches upon other rocks along the bank."


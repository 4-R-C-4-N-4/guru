body = "The error arises from the fact that a word of somewhat similar sound denotes “having children” or “being pregnant,” used in speaking of a woman.\n\nOne informant derives it from tălulŭ′ , the cry of a certain species of frog known as dulusĭ , which is found in that neighborhood, but not upon the reservation, and which was formerly eaten as food.\n\nA possible derivation is from a′tălulû′ , “unfinished, premature, unsuccessful.” The fall was called Ugûñ′yĭ, a name of which the meaning is lost, and which was applied also to a locality on Little Tennessee river near Franklin, North Carolina.\n\nFor a myth localized at Tallulah falls, see number 84 , “The Man who Married the Thunder’s Sister.” In this connection Lanman gives the following story, which, notwithstanding its white man’s dress, appears to be based upon a genuine Cherokee tradition of the Nûñnĕ′hĭ: During my stay at the Falls of Tallulah I made every effort to obtain an Indian legend or two connected with them, and it was my good fortune to hear one which has never yet been printed.\n\nIt was originally obtained by the white man who first discovered the falls from the Cherokees, who lived in the region at the time.\n\nIt is in substance as follows: Many generations ago it so happened that several famous hunters, who had wandered from the West toward what is now the Savannah river, in search of game, never returned to their camping grounds.\n\nIn process of time the curiosity as well as the fears of the nation were excited, and an effort was made to ascertain the cause of their singular disappearance, whereupon a party of medicine men were deputed to make a pilgrimage toward the great river.\n\nThey were absent a whole moon, and, on returning to their friends, they reported that they had discovered a dreadful fissure in an unknown part of the country, through which a mountain torrent took its way with a deafening noise.\n\nThey said that it was an exceedingly wild place, and that its inhabitants were a species of little men and women, who dwelt in the crevices of the rocks and in grottoes under the waterfalls.\n\nThey had attempted by every artifice in their power to hold a council with the little people, but all in vain; and, from the shrieks they frequently uttered, the medicine men knew that they were the enemies of the Indian race, and, therefore, it was concluded in the nation at large that the long-lost hunters had been decoyed to their death in the dreadful gorge, which they called Tallulah.\n\nIn view of this little legend, it is worthy of remark that the Cherokee nation, previous to their departure for the distant West, always avoided the Falls of Tallulah, and were seldom found hunting or fishing in their vicinity.\n\n34 Toccoa : (1) A creek flowing into Tugaloo river, in Habersham county, with a fall upon its upper course, near the village of the same name.\n\n(2) A river in upper Georgia, flowing northwestward into Hiwassee.\n\nThe correct Cherokee form applied to the former settlement on both streams is Tagwâ′hĭ, “Catawba place,” implying the former presence of Indians of that tribe.\n\nThe lands about Toccoa falls were sold by the Cherokee in 1783 and were owned at one time by Wafford’s grandfather.\n\nAccording to Wafford, there was a tradition that when the whites first visited the place they saw, as they thought, an Indian woman walking beneath the surface of the water under the falls, and on looking again a moment after they saw her sitting upon an overhanging rock 200 feet in the air, with her feet dangling over."


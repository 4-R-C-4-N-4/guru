[content]
body = "Soon there was another raven cry outside, and the old man said to himself, “Now my wife is coming,” and sure enough in a little while the old woman came in and sat down by her husband.\n\nThen the young man knew they were Raven Mockers and he was frightened and kept very quiet.\n\nSaid the old man to his wife, “Well, what luck did you have?” “None,” said the old woman, “there were too many doctors watching.\n\nWhat luck did you have?” “I got what I went for,” said the old man, “there is no reason to fail, but you never have luck.\n\nTake this and cook it and let’s have something to eat.” She fixed the fire and then the young man smelled meat roasting and thought it smelled sweeter than any meat he had ever tasted.\n\nHe peeped out from one eye, and it looked like a man’s heart roasting on a stick.\n\nSuddenly the old woman said to her husband, “Who is over in the corner?” “Nobody,” said the old man.\n\n“Yes, there is,” said the old woman, “I hear him snoring,” and she stirred the fire until it blazed and lighted up the whole place, and there was the young man lying in the corner.\n\nHe kept quiet and pretended to be asleep.\n\nThe old man made a noise at the fire to wake him, but still he pretended to sleep.\n\nThen the old man came over and shook him, and he sat up and rubbed his eyes as if he had been asleep all the time.\n\nNow it was near daylight and the old woman was out in the other house getting breakfast ready, but the hunter could hear her crying to herself.\n\n“Why is your wife crying?” he asked the old man.\n\n“Oh, she has lost some of her friends lately and feels lonesome,” said her husband; but the young man knew that she was crying because he had heard them talking.\n\nWhen they came out to breakfast the old man put a bowl of corn mush before him and said, “This is all we have—we have had no meat for a long time.” After breakfast the young man started on again, but when he had gone a little way the old man ran after him with a fine piece of beadwork and gave it to him, saying, “Take this, and don’t tell anybody what you heard last night, because my wife and I are always quarreling that way.” The young man took the piece, but when he came to the first creek he threw it into the water and then went on to the settlement.\n\nThere he told the whole story, and a party of warriors started back with him to kill the Raven Mockers.\n\nWhen they reached the place it was seven days after the first night.\n\nThey found the old man and his wife lying dead in the house, so they set fire to it and burned it and the witches together."


[content]
body = "When you get to the town, you must call the people together and tell them all that has happened.\n\nYou must go to the long house and take off your skirt and carry it on your shoulder.\n\nThen you must go inside and go around once, singing, ‘We have come home; we are here.’ This is the Yontoñwisas song, and it shall be for women only.\n\nKnow now that we are the Hadionyageonoñ , the Sky People, who have watched over you all this time.” When the girl awoke, she told her sister, and they said, “We must do all this,” and they began to sing as they went along.\n\nAbout noon they heard the sound of chopping, and when they went to the place they found it was their uncle cutting blocks to make spoons.\n\nHe did not see them until they spoke, and at first could hardly believe that they were living women, because he knew that they had been taken by the Cherokee.\n\nHe was very glad to see them, and as they walked on to the town they told him all they had been commanded to do by the Sky People.\n\nWhen they arrived at the town, he called all the people together, and they went to the long house.\n\nThere the two women sang their song and did everything exactly as they had been told to do, and when it was over they said, “This is all,” and sat down.\n\nThis is the same Yontoñwisas song that is still sung by the women.—Arranged from Curtin, Seneca manuscript."


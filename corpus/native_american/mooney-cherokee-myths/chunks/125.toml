[content]
body = "She was very glad to meet her brother and talked with him a long time, but did not ask him to come inside, and at last he went away without having seen her husband.\n\nSeveral other times her brother came to the mountain, but always his sister met him outside, and he could never see her husband.\n\nAfter four years had passed she came one day to her mother’s house and said her husband had been hunting in the woods near by, and they were getting ready to start home to-morrow, and if her mother and brother would come early in the morning they could see her husband.\n\nIf they came too late for that, she said, they would find plenty of meat to take home.\n\nShe went back into the woods, and the mother ran to tell her son.\n\nThey came to the place early the next morning, but Tsulʻkălû′ and his family were already gone.\n\nOn the drying poles they found the bodies of freshly killed deer hanging, as the girl had promised, and there were so many that they went back and told all their friends to come for them, and there were enough for the whole settlement.\n\nStill the brother wanted to see his sister and her husband, so he went again to the mountain, and she came out to meet him.\n\nHe asked to see her husband, and this time she told him to come inside with her.\n\nThey went in as through a doorway, and inside he found it like a great townhouse.\n\nThey seemed to be alone, but his sister called aloud, “He wants to see you,” and from the air came a voice, “You can not see me until you put on a new dress, and then you can see me.” “I am willing,” said the young man, speaking to the unseen spirit, and from the air came the voice again, “Go back, then, and tell your people that to see me they must go into the townhouse and fast seven days, and in all that time they must not come out from the townhouse or raise the war whoop, and on the seventh day I shall come with new dresses for you to put on so that you can all see me.” The young man went back to Kănuga and told the people.\n\nThey all wanted to see Tsulʻkălû′, who owned all the game in the mountains, so they went into the townhouse and began the fast.\n\nThey fasted the first day and the second and every day until the seventh—all but one man from another settlement, who slipped out every night when it was dark to get something to eat and slipped in again when no one was watching.\n\nOn the morning of the seventh day the sun was just coming up in the east when they heard a great noise like the thunder of rocks rolling down the side of Tsunegûñ′yĭ.\n\nThey were frightened and drew near together in the townhouse, and no one whispered.\n\nNearer and louder came the sound until it grew into an awful roar, and every one trembled and held his breath—all but one man, the stranger from the other settlement, who lost his senses from fear and ran out of the townhouse and shouted the war cry.\n\nAt once the roar stopped and for some time there was silence.\n\nThen they heard it again, but as if it were going farther away, and then farther and farther, until at last it died away in the direction of Tsunegûñ′yĭ, and then all was still again.\n\nThe people came out from the townhouse, but there was silence, and they could see nothing but what had been seven days before.\n\nStill the brother was not disheartened, but came again to see his sister, and she brought him into the mountain."


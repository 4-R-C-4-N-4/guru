[content]
body = "ORIGIN OF DISEASE AND MEDICINE In the old days the beasts, birds, fishes, insects, and plants could all talk, and they and the people lived together in peace and friendship.\n\nBut as time went on the people increased so rapidly that their settlements spread over the whole earth, and the poor animals found themselves beginning to be cramped for room.\n\nThis was bad enough, but to make it worse Man invented bows, knives, blowguns, spears, and hooks, and began to slaughter the larger animals, birds, and fishes for their flesh or their skins, while the smaller creatures, such as the frogs and worms, were crushed and trodden upon without thought, out of pure carelessness or contempt.\n\nSo the animals resolved to consult upon measures for their common safety.\n\nThe Bears were the first to meet in council in their townhouse under Kuwâ′hĭ mountain, the “Mulberry place,” and the old White Bear chief presided.\n\nAfter each in turn had complained of the way in which Man killed their friends, ate their flesh, and used their skins for his own purposes, it was decided to begin war at once against him.\n\nSome one asked what weapons Man used to destroy them.\n\n“Bows and arrows, of course,” cried all the Bears in chorus.\n\n“And what are they made of?” was the next question.\n\n“The bow of wood, and the string of our entrails,” replied one of the Bears.\n\nIt was then proposed that they make a bow and some arrows and see if they could not use the same weapons against Man himself.\n\nSo one Bear got a nice piece of locust wood and another sacrificed himself for the good of the rest in order to furnish a piece of his entrails for the string.\n\nBut when everything was ready and the first Bear stepped up to make the trial, it was found that in letting the arrow fly after drawing back the bow, his long claws caught the string and spoiled the shot.\n\nThis was annoying, but some one suggested that they might trim his claws, which was accordingly done, and on a second trial it was found that the arrow went straight to the mark.\n\nBut here the chief, the old White Bear, objected, saying it was necessary that they should have long claws in order to be able to climb trees.\n\n“One of us has already died to furnish the bow-string, and if we now cut off our claws we must all starve together.\n\nIt is better to trust to the teeth and claws that nature gave us, for it is plain that man’s weapons were not intended for us.” No one could think of any better plan, so the old chief dismissed the council and the Bears dispersed to the woods and thickets without having concerted any way to prevent the increase of the human race.\n\nHad the result of the council been otherwise, we should now be at war with the Bears, but as it is, the hunter does not even ask the Bear’s pardon when he kills one.\n\nThe Deer next held a council under their chief, the Little Deer, and after some talk decided to send rheumatism to every hunter who should kill one of them unless he took care to ask their pardon for the offense.\n\nThey sent notice of their decision to the nearest settlement of Indians and told them at the same time what to do when necessity forced them to kill one of the Deer tribe.\n\nNow, whenever the hunter shoots a Deer, the Little Deer, who is swift as the wind and can not be wounded, runs quickly up to the spot and, bending over the blood-stains, asks the spirit of the Deer if it has heard the prayer of the hunter for pardon."


body = "There was a tradition among the few old traders still living in upper Georgia in 1890 that a large tract in that part of the State had been won by the Cherokee from the Creeks in a ballplay.\n\n20 There are no Indians now living in that region to substantiate the story.\n\nAs originally told it may have had a veiled meaning, as among the Cherokee the expression “to play a ball game” is frequently used figuratively to denote fighting a battle.\n\nThere seems to be no good ground for Bartram’s statement that the Cherokee had been dispossessed by the Creeks of the region between the Savannah and the Ocmulgee, in southwestern Georgia, within the historic period.\n\n21 The territory is south of any traditional Cherokee claim, and the statement is at variance with what we know through history.\n\nHe probably had in mind the Uchee, who did actually occupy that country until incorporated with the Creeks.\n\nThe victory was not always on one side, however, for Adair states that toward the end of the last war between the two tribes the Creeks, having easily defeated the Cherokee in an engagement, contemptuously sent against them a number of women and boys.\n\nAccording to this writer, the “true and sole cause” of this last war was the killing of some adopted relatives of the Creeks in 1749 by a party of northern Shawano, who had been guided and afterward sheltered by the Cherokee.\n\nThe war, which he represents as a losing game for the Cherokee, was finally brought to an end through the efforts of the governor of South Carolina, with the unfortunate result to the English that the Creeks encouraged the Cherokee in the war of 1760 and rendered them very essential help in the way of men and ammunition.\n\n22 The battle of Tali′wă, which decided in favor of the Cherokee the long war between themselves and the Creeks, was fought about 1755 or a few years later at a spot on Mountain creek or Long-swamp creek, which enters Etowah river above Canton, Georgia, near where the old trail crossed the river about Long-swamp town.\n\nAll our information concerning it is traditional, obtained from James Wafford, who heard the story when a boy, about the year 1815, from an old trader named Brian Ward, who had witnessed the battle sixty years before.\n\nAccording to his account, it was probably the hardest battle ever fought between the two tribes, about five hundred Cherokee and twice that number of Creek warriors being engaged.\n\nThe Cherokee were at first overmatched and fell back, but rallied again and returned to the attack, driving the Creeks from cover so that they broke and ran.\n\nThe victory was complete and decisive, and the defeated tribe immediately afterward abandoned the whole upper portion of Georgia and the adjacent part of Alabama to the conquerors.\n\nBefore this battle the Creeks had been accustomed to shift about a good deal from place to place, but thereafter they confined themselves more closely to fixed home locations.\n\nIt was in consequence of this defeat that they abandoned their town on Nottely river, below Coosa creek, near the present Blairsville, Georgia, their old fields being at once occupied by Cherokee, who moved over from their settlements on the head of Savannah river.\n\nAs has been already stated, a peace was made about 1759, just in time to enable the Creeks to assist the Cherokee in their war with South Carolina.\n\nWe hear little more concerning the relations of the two tribes until the Creek war of 1813–14, described in detail elsewhere; after this their histories drift apart.\n\nThe Yuchi or Uchee, called Ani′-Yu′tsĭ by the Cherokee, were a tribe of distinct linguistic stock and of considerable importance in early days; their territory bordered Savannah river on both sides immediately below the Cherokee country, and extended some distance westward into Georgia, where it adjoined that of the Creeks."


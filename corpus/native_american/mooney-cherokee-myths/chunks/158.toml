[content]
body = "Then the Seoqgwageono said, “There is one more race yet—the long race,” and they got ready for it, but the Cherokee chief said to his own men, “We have won everything from these people.\n\nI think it will be best to let them have one race, for if they lose all, they may make trouble.” They selected a Cherokee to run, and he was beaten, and the Seoqgwageono went home.\n\nIn a few days they sent a messenger to challenge the Cherokee to meet them halfway for a battle.\n\nWhen the Cherokee heard this they said to the Seneca, “There are so few of you here that we don’t want to have you killed.\n\nIt is better for you to go home.” So the Seneca went back to their own country.\n\nThree years later they came again to visit the Cherokee, who told them that the Seoqgwageono had won the battle, and that the chief of the enemy had said afterward, “I should like to fight the Seneca, for I am a double man.” Before long the enemy heard that the Seneca were there and sent them a challenge to come and fight.\n\nThe Seneca said, “We must try to satisfy them,” so with Cherokee guides they set out for the country of the Seoqgwageono.\n\nThey went on until they came to an opening in the woods within one day’s journey of the first village.\n\nThen they stopped and got ready to send two messengers to notify the enemy, but the Cherokee said, “You must send them so as to arrive about sundown.” They did this, and when the messengers arrived near the town they saw all the people out playing ball.\n\nThe two Seneca went around on the other side, and began throwing sumac darts as they approached, so that the others would think they were some of their own men at play.\n\nIn this way they got near enough to kill a man who was standing alone.\n\nThey scalped him, and then raising the scalp yell they rushed off through the woods, saying to each other as they ran, “Be strong—Be strong.” Soon they saw the Seoqgwageono coming on horses, but managed to reach a dry creek and to hide under the bank, so that the enemy passed on without seeing them.\n\nThe next morning they came out and started on, but the enemy was still on the watch, and before long the two men saw the dust of the horses behind them.\n\nThe others came up until they were almost upon them and began to shoot arrows at them, but by this time the two Seneca were near the opening where their own friends were hiding, drawn up on each side of the pass.\n\nAs the pursuers dashed in the two lines of the Seneca closed in and every man of the Seoqgwageono was either killed or taken.\n\nThe Seneca went back to the Cherokee country and after about a month they returned to their own homes.\n\nAfterward the Cherokee told them, “We hear the Seoqgwageono think you dangerous people.\n\nThey themselves are conjurers and can tell what other people are going to do, but they cannot tell what the Seneca are going to do.\n\nThe Seneca medicine is stronger.”—Arranged from Curtin, Seneca manuscript."


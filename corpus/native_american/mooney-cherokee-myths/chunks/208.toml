body = "LOCAL LEGENDS OF GEORGIA For more important legends localized in Georgia see the stories Yahula, The Nûñnĕhĭ, The Ustû′tlĭ, Âgan-uni′tsĭ’s Search for the Uktena, and The Man who Married the Thunder’s Sister.\n\nWhite’s Historical Collections of Georgia is responsible for a number of pseudo-myths.\n\nChopped oak : A noted tree, scarred with hundreds of hatchet marks, formerly in Habersham county, 6 miles east of Clarkesville, on the summit of Chattahoochee ridge, and on the north side of the road from Clarkesville to Toccoa creek.\n\nThe Cherokee name is Digălu′yătûñ′yĭ, “Where it is gashed with hatchets.” It was a favorite assembly place for the Indians, as well as for the early settlers, according to whom the gashes were tally marks by means of which the Indians kept the record of scalps taken in their forays.\n\nThe tradition is thus given by White (Historical Collections of Georgia, p.\n\n489, 1855) on some earlier authority: Among the curiosities of this country was the Chopped Oak, a tree famous in Indian history and in the traditions of the early settlers.\n\nThis tree stood about 6 miles southeast of Clarkesville, and was noted as being the Law Ground, or place of holding company musters and magistrates’ courts.\n\nAccording to tradition, the Chopped Oak was a celebrated rendezvous of the Indians in their predatory excursions, it being at a joint where a number of trails met.\n\nHere their plans of warfare were laid; here the several parties separated; and here, on their return, they awaited each other; and then, in their brief language, the result of their enterprise was stated, and for every scalp taken a gash cut in the tree.\n\nIf tradition tells the truth, and every scar on the blasted oak counts for a scalp, the success of their scouting parties must have been great.\n\nThis tree was alive a few years since when a young man, possessing all the prejudices of his countrymen, and caring less for the traditions of the Indians than his own revenge, killed the tree by girdling it, that it might be no longer a living monument of the cruelties of the savages.\n\nThe stump is still standing.\n\nDead Man’s gap : One mile below Tallulah falls, on the west side of the railroad, in Habersham county.\n\nSo called from a former reputed Indian grave, now almost obliterated.\n\nAccording to the story, it was the grave of an Indian who was killed here while eloping with a white woman, whom he had stolen from her husband.\n\nFrogtown : A creek at the head of Chestatee river, north of Dahlonega, in Lumpkin county.\n\nThe Cherokee name is Walâsi′yĭ, “Frog place.” The name was originally applied to a mountain to the northeast (Rock mountain?), from a tradition that a hunter had once seen there a frog as large as a house.\n\nThe Indian settlement along the creek bore the same name.\n\nHiwassee : A river having its source in Towns county, of northern Georgia, and flowing northwestward to join the Tennessee.\n\nThe correct Cherokee form, applied to two former settlements on the stream, is Ayuhwa′sĭ (meaning “A savanna”).\n\nAlthough there is no especial Cherokee story connected with the name, White (Historical Collections of Georgia, p."


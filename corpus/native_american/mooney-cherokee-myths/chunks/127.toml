[content]
body = "Some of the mountain people wanted to prevent this, but the chief said, “No; let him go if he will, and when he tells his friends they may want to come, too.\n\nThere is plenty of room for all.” Then he said to the man, “Go back and tell your friends that if they want to come and live with us and be always happy, there is a place here ready and waiting for them.\n\nOthers of us live in Datsu′nalâsgûñ′yĭ and in the high mountains all around, and if they would rather go to any of them it is all the same.\n\nWe see you wherever you go and are with you in all your dances, but you can not see us unless you fast.\n\nIf you want to see us, fast four days, and we will come and talk with you; and then if you want to live with us, fast again seven days, and we will come and take you.” Then the chief led the man through the cave to the outside of the mountain and left him there, but when the man looked back he saw no cave, but only the solid rock.\n\nThe people of the lost settlement were never seen again, and they are still living in Tsuwaʻtel′da.\n\nStrange things happen there, so that the Cherokee know the mountain is haunted and do not like to go near it.\n\nOnly a few years ago a party of hunters camped there, and as they sat around their fire at supper time they talked of the story and made rough jokes about the people of old Kăna′sta.\n\nThat night they were aroused from sleep by a noise as of stones thrown at them from among the trees, but when they searched they could find nobody, and were so frightened that they gathered up their guns and pouches and left the place."


[content]
body = "The Uktena was still asleep, and, putting an arrow to his bow, Âgăn-uni′tsĭ shot and sent the arrow through its heart, which was under the seventh spot from the serpent’s head.\n\nThe great snake raised his head, with the diamond in front flashing fire, and came straight at his enemy, but the magician, turning quickly, ran at full speed down the mountain, cleared the circle of fire and the trench at one bound, and lay down on the ground inside.\n\nThe Uktena tried to follow, but the arrow was through his heart , and in another moment he rolled over in his death struggle, spitting poison over all the mountain side.\n\nBut the poison drops could not pass the circle of fire, but only hissed and sputtered in the blaze, and the magician on the inside was untouched except by one small drop which struck upon his head as he lay close to the ground; but he did not know it.\n\nThe blood, too, as poisonous as the froth, poured from the Uktena’s wound and down the slope in a dark stream, but it ran into the trench and left him unharmed.\n\nThe dying monster rolled over and over down the mountain, breaking down large trees in its path until it reached the bottom.\n\nThen Âgăn-uni′tsĭ called every bird in all the woods to come to the feast, and so many came that when they were done not even the bones were left.\n\nAfter seven days he went by night to the spot.\n\nThe body and the bones of the snake were gone, all eaten by the birds, but he saw a bright light shining in the darkness, and going over to it he found, resting on a low-hanging branch, where a raven had dropped it, the diamond from the head of the Uktena.\n\nHe wrapped it up carefully and took it with him, and from that time he became the greatest medicine-man in the whole tribe.\n\nWhen Âgăn-uni′tsĭ came down again to the settlement the people noticed a small snake hanging from his head where the single drop of poison from the Uktena had struck; but so long as he lived he himself never knew that it was there.\n\nWhere the blood of the Uktena had filled the trench a lake formed afterwards, and the water was black and in this water the women used to dye the cane splits for their baskets."


[content]
body = "Accordingly a hunter went around to the back of the ridge, and on coming up from the other side found a man posted in a large tree, making the gobble call to decoy the hunters within reach of a Shawano war party concealed behind some bushes midway between the tree and the camp.\n\nKeeping close to the ground, the Cherokee crept up without being discovered until within gunshot, then springing to his feet he shot the man in the tree, and shouting “Kill them all,” rushed upon the enemy, who, thinking that a strong force of Cherokee was upon them, fled down the mountain without attempting to make a stand.\n\nAnother tradition of these wars is that concerning Tunâ′ĭ, a great warrior and medicine-man of old Itsâ′tĭ, on the Tennessee.\n\nIn one hard fight with the Shawano, near the town, he overpowered his man and stabbed him through both arms.\n\nRunning cords through the holes he tied his prisoner’s arms and brought him thus into Itsâ′tĭ, where he was put to death by the women with such tortures that his courage broke and he begged them to kill him at once.\n\nAfter retiring to the upper Ohio the Shawano were received into the protection of the Delawares and their allies, and being thus strengthened felt encouraged to renew the war against the Cherokee with increased vigor.\n\nThe latter, however, proved themselves more than a match for their enemies, pursuing them even to their towns in western Pennsylvania, and accidentally killing there some Delawares who occupied the country jointly with the Shawano.\n\nThis involved the Cherokee in a war with the powerful Delawares, which continued until brought to an end in 1768 at the request of the Cherokee, who made terms of friendship at the same time with the Iroquois.\n\nThe Shawano being thus left alone, and being, moreover, roundly condemned by their friends, the Delawares, as the cause of the whole trouble, had no heart to continue the war and were obliged to make final peace.\n\n8"


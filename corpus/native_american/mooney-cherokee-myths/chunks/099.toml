[content]
body = "Spear-finger had such powers over stone that she could easily lift and carry immense rocks, and could cement them together by merely striking one against another.\n\nTo get over the rough country more easily she undertook to build a great rock bridge through the air from Nûñyû′-tluʻgûñ′yĭ, the “Tree rock,” on Hiwassee, over to Sanigilâ′gĭ (Whiteside mountain), on the Blue ridge, and had it well started from the top of the “Tree rock” when the lightning struck it and scattered the fragments along the whole ridge, where the pieces can still be seen by those who go there.\n\nShe used to range all over the mountains about the heads of the streams and in the dark passes of Nantahala, always hungry and looking for victims.\n\nHer favorite haunt on the Tennessee side was about the gap on the trail where Chilhowee mountain comes down to the river.\n\nSometimes an old woman would approach along the trail where the children were picking strawberries or playing near the village, and would say to them coaxingly, “Come, my grandchildren, come to your granny and let granny dress your hair.” When some little girl ran up and laid her head in the old woman’s lap to be petted and combed the old witch would gently run her fingers through the child’s hair until it went to sleep, when she would stab the little one through the heart or back of the neck with the long awl finger, which she had kept hidden under her robe.\n\nThen she would take out the liver and eat it.\n\nShe would enter a house by taking the appearance of one of the family who happened to have gone out for a short time, and would watch her chance to stab some one with her long finger and take out his liver.\n\nShe could stab him without being noticed, and often the victim did not even know it himself at the time—for it left no wound and caused no pain—but went on about his own affairs, until all at once he felt weak and began gradually to pine away, and was always sure to die, because Spear-finger had taken his liver.\n\nWhen the Cherokee went out in the fall, according to their custom, to burn the leaves off from the mountains in order to get the chestnuts on the ground, they were never safe, for the old witch was always on the lookout, and as soon as she saw the smoke rise she knew there were Indians there and sneaked up to try to surprise one alone.\n\nSo as well as they could they tried to keep together, and were very cautious of allowing any stranger to approach the camp.\n\nBut if one went down to the spring for a drink they never knew but it might be the liver eater that came back and sat with them.\n\nSometimes she took her proper form, and once or twice, when far out from the settlements, a solitary hunter had seen an old woman, with a queer-looking hand, going through the woods singing low to herself: Uwe′la nátsĭkû′.\n\nSu′ să′ sai′.\n\nLiver, I eat it.\n\nSu′ să′ sai′.\n\nIt was rather a pretty song, but it chilled his blood, for he knew it was the liver eater, and he hurried away, silently, before she might see him.\n\nAt last a great council was held to devise some means to get rid of Uʼtlûñ′tă before she should destroy everybody.\n\nThe people came from all around, and after much talk it was decided that the best way would be to trap her in a pitfall where all the warriors could attack her at once.\n\nSo they dug a deep pitfall across the trail and covered it over with earth and grass as if the ground had never been disturbed."


[content]
body = "HOW THE RABBIT STOLE THE OTTER’S COAT The animals were of different sizes and wore coats of various colors and patterns.\n\nSome wore long fur and others wore short.\n\nSome had rings on their tails, and some had no tails at all.\n\nSome had coats of brown, others of black or yellow.\n\nThey were always disputing about their good looks, so at last they agreed to hold a council to decide who had the finest coat.\n\nThey had heard a great deal about the Otter, who lived so far up the creek that he seldom came down to visit the other animals.\n\nIt was said that he had the finest coat of all, but no one knew just what it was like, because it was a long time since anyone had seen him.\n\nThey did not even know exactly where he lived—only the general direction; but they knew he would come to the council when the word got out.\n\nNow the Rabbit wanted the verdict for himself, so when it began to look as if it might go to the Otter he studied up a plan to cheat him out of it.\n\nHe asked a few sly questions until he learned what trail the Otter would take to get to the council place.\n\nThen, without saying anything, he went on ahead and after four days’ travel he met the Otter and knew him at once by his beautiful coat of soft dark-brown fur.\n\nThe Otter was glad to see him and asked him where he was going.\n\n“O,” said the Rabbit, “the animals sent me to bring you to the council; because you live so far away they were afraid you mightn’t know the road.” The Otter thanked him, and they went on together.\n\nThey traveled all day toward the council ground, and at night the Rabbit selected the camping place, because the Otter was a stranger in that part of the country, and cut down bushes for beds and fixed everything in good shape.\n\nThe next morning they started on again.\n\nIn the afternoon the Rabbit began to pick up wood and bark as they went along and to load it on his back.\n\nWhen the Otter asked what this was for the Rabbit said it was that they might be warm and comfortable at night.\n\nAfter a while, when it was near sunset, they stopped and made their camp.\n\nWhen supper was over the Rabbit got a stick and shaved it down to a paddle.\n\nThe Otter wondered and asked again what that was for.\n\n“I have good dreams when I sleep with a paddle under my head,” said the Rabbit.\n\nWhen the paddle was finished the Rabbit began to cut away the bushes so as to make a clean trail down to the river.\n\nThe Otter wondered more and more and wanted to know what this meant.\n\nSaid the Rabbit, “This place is called Di′tatlâski′yĭ [The Place Where it Rains Fire].\n\nSometimes it rains fire here, and the sky looks a little that way to-night.\n\nYou go to sleep and I’ll sit up and watch, and if the fire does come, as soon as you hear me shout, you run and jump into the river.\n\nBetter hang your coat on a limb over there, so it won’t get burnt.” The Otter did as he was told, and they both doubled up to go to sleep, but the Rabbit kept awake.\n\nAfter a while the fire burned down to red coals.\n\nThe Rabbit called, but the Otter was fast asleep and made no answer.\n\nIn a little while he called again, but the Otter never stirred.\n\nThen the Rabbit filled the paddle with hot coals and threw them up into the air and shouted, “It’s raining fire!\n\nIt’s raining fire!” The hot coals fell all around the Otter and he jumped up.\n\n“To the water!” cried the Rabbit, and the Otter ran and jumped into the river, and he has lived in the water ever since."


[content]
body = "THE SMALLER REPTILES—FISHES AND INSECTS There are several varieties of frogs and toads, each with a different name, but there is very little folklore in connection with them.\n\nThe common green frog is called walâ′sĭ , and among the Cherokee, as among uneducated whites, the handling of it is thought to cause warts, which for this reason are called by the same name, walâ′sĭ .\n\nA solar eclipse is believed to be caused by the attempt of a great frog to swallow the sun, and in former times it was customary on such occasions to fire guns and make other loud noises to frighten away the frog.\n\nThe smaller varieties are sometimes eaten, and on rare occasions the bullfrog also, but the meat is tabued to ball players while in training, for fear that the brittleness of the frog’s bones would be imparted to those of the player.\n\nThe land tortoise ( tûksĭ′ ) is prominent in the animal myths, and is reputed to have been a great warrior in the old times.\n\nOn account of the stoutness of its legs ball players rub their limbs with them before going into the contest.\n\nThe common water turtle ( săligu′gĭ ), which occupies so important a place in the mythology of the northern tribes, is not mentioned in Cherokee myth or folklore, and the same is true of the soft-shelled turtle ( uʻlănă′wă ), perhaps for the reason that both are rare in the cold mountain streams of the Cherokee country.\n\nThere are perhaps half a dozen varieties of lizard, each with a different name.\n\nThe gray road lizard, or diyâ′hălĭ (alligator lizard, Sceloporus undulatus ), is the most common.\n\nOn account of its habit of alternately puffing out and drawing in its throat as though sucking, when basking in the sun, it is invoked in the formulas for drawing out the poison from snake bites.\n\nIf one catches the first diyâ′hălĭ seen in the spring, and, holding it between his fingers, scratches his legs downward with its claws, he will see no dangerous snakes all summer.\n\nAlso, if one be caught alive at any time and rubbed over the head and throat of an infant, scratching the skin very slightly at the same time with the claws, the child will never be fretful, but will sleep quietly without complaining, even when sick or exposed to the rain.\n\nThis is a somewhat risky experiment, however, as the child is liable thereafter to go to sleep wherever it may be laid down for a moment, so that the mother is in constant danger of losing it.\n\nAccording to some authorities this sleep lizard is not the diyâ′hălĭ, but a larger variety akin to the next described.\n\nThe gigă-tsuha′ʻlĭ (“bloody mouth,” Pleistodon ?) is described as a very large lizard, nearly as large as a water dog, with the throat and corners of the mouth red, as though from drinking blood.\n\nIt is believed to be not a true lizard but a transformed ugûñste′lĭ fish (described below) on account of the similarity of coloring and the fact that the fish disappears about the time the gigă-tsuha′ʻlĭ begins to come out.\n\nIt is ferocious and a hard biter, and pursues other lizards.\n\nIn dry weather it cries or makes a noise like a cicada, raising itself up as it cries.\n\nIt has a habit of approaching near to where some person is sitting or standing, then halting and looking fixedly at him, and constantly puffing out its throat until its head assumes a bright red color.\n\nIt is thought then to be sucking the blood of its victim, and is dreaded and shunned accordingly."


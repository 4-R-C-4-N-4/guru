[content]
body = "He climbed higher and higher, but every time he looked up the hole seemed to be farther than before, until at last he was tired and came down again.\n\nWhen he reached home he found his father very weak, but still alive, and one draw at the pipe made him strong again.\n\nThe people planted the seed and have had tobacco ever since."


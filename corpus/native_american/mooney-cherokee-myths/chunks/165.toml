[content]
body = "At last one of the late war party rose from his seat, and after a whisper to the drummer began to sing of how they had gone to Cowee and taken scalps and the gun, which he carried as he danced.\n\nThe chief and the people, who knew nothing of the treacherous act, laughed heartily at what they thought was a great joke.\n\nBut now the gunstocker, who had been waiting outside with the Cowee men, stripped off his breechcloth and rushed naked into the townhouse.\n\nBending down to the drummer—who was one of the traitors, but failed to recognize Gûlsadihĭ′—he gave him the words, and then straightening up he began to sing, “ Hi!\n\nAsk who has done this!” while he danced around the circle, making insulting gestures toward everyone there.\n\nThe song was quick and the drummer beat very fast.\n\nHe made one round and bent down again to the drummer, then straightened up and sang, “ Yu!\n\nI have killed a pregnant woman at the ford and thrown her body into the river!” Several men started with surprise, but the chief said, “He is only joking; go on with the dance,” and the drummer beat rapidly.\n\nAnother round and he bent down again to the drummer and then began to sing, “We thought our enemies were from the north, but we have followed them and they are here!” Now the drummer knew at last what it all meant and he drummed very slowly, and the people grew uneasy.\n\nThen, without waiting on the drummer, Gûlsadihĭ′ sang, “Cowee will have a ball play with you!”—and everyone knew this was a challenge to battle—and then fiercely: “But if you want to fight now my men are ready to die here!” With that he waved his hand and left the townhouse.\n\nThe dancers looked at each other uneasily and some of them rose to go.\n\nThe chief, who could not understand it, urged them to go on with the dance, but it was of no avail.\n\nThey left the townhouse, and as they went out they met the Cowee men standing with their guns ready and their hatchets in their belts.\n\nNeither party said anything, because they were still on friendly ground, but everyone knew that trouble was ahead.\n\nThe Cowee men returned home and organized a strong party of warriors from their own and all the neighboring Middle settlements to go and take vengeance on Chilhowee and on Kuwâ′hĭ, just below, which had also been concerned in the raid.\n\nThey went down the Tennessee and crossed over the mountains, but when they came on the other side they found that their enemies had abandoned their homes and fled for refuge to the remoter settlements or to the hostile Shawano in the north."


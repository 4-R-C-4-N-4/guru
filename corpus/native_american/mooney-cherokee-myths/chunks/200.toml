[content]
body = "The giant Tsulʻkălû′, or Jutaculla, as the name is corrupted by the whites, had his residence in the mountain (see story), and according to local legend among the whites, said to be derived from the Indians, this bald spot was a clearing which he made for a farm.\n\nSome distance farther to the west, on the north bank of Cany fork, about 1 mile above Moses creek and perhaps 10 miles above Webster, in the same county, is the Jutaculla rock, a large soapstone slab covered with rude carvings, which, according to the same tradition, are scratches made by the giant in jumping from his farm on the mountain to the creek below.\n\nJutaculla rock : See Jutaculla old fields.\n\nKâl-Detsi′yûñyĭ : “Where the bones are,” a ravine on the north side of Cheowa river, just above the mouth of East Buffalo creek, in Graham county.\n\nIn the old time two Cherokee were killed here by the enemy, and their fate was unknown until, long afterward, their friends found their bones scattered about in the ravine.\n\nNantahala : A river and ridge of very steep mountains in Macon county, the name being a corruption of Nûñ′dăye′ʻlĭ, applied to a former settlement about the mouth of Briertown creek, the townhouse being on the west side of the river, about the present Jarretts.\n\nThe word means “middle sun,” i.\n\ne., “midday sun,” from nûñdă′ , “sun,” and aye′ʻlĭ , “middle,” and refers to the fact that in places along the stream the high cliffs shut out the direct light of the sun until nearly noon.\n\nFrom a false idea that it is derived from unûñtĭ , “milk,” it has been fancifully rendered, “Center of a woman’s breast,” “Maiden’s bosom,” etc.\n\nThe valley was the legendary haunt of the Uwʼtsûñ′ta (see number 45 ).\n\nAs illustrating the steepness of the cliffs along the stream it was said of a noted hunter, Tsasta′wĭ, who lived in the old town, that he used to stand on the top of the bluff overlooking the settlement and throw down upon the roof of his house the liver of the freshly killed deer, so that his wife would have it cooked and waiting for him by the time he got down the mountain.\n\nNugătsa′nĭ : A ridge below Yellow Hill (Cherokee), on Oconaluftee river, in Swain county, said to be a resort of the Nûñnĕ′hĭ fairies.\n\nThe word is an archaic form denoting a high ridge with a long, gradual slope.\n\nQualla : A post-office and former trading station in Jackson county, on the border of the present East Cherokee reservation, hence sometimes called the Qualla reservation.\n\nThe Cherokee form is Kwalĭ, or Kwalûñyĭ in the locative.\n\nAccording to Captain Terrell, the former trader at that place, it was named from Kwalĭ, i.\n\ne., Polly, an old Indian woman who lived there some sixty years ago.\n\nSăligu′gĭ : “Turtle place,” a deep hole in Oconaluftee river, about half a mile below Adams creek, near Whittier, in Swain county, said to be the resort of a monster turtle."


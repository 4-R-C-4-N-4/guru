[content]
body = "BABY SONG, TO PLEASE THE CHILDREN Ha′wiye′-hyuwe′, Ha′wiye′-hyuwe′, Yu′wĕ-yuwĕhe′, Ha′wiyĕhyu′-uwe′— Yâ′nû une′guhi′ tsana′sehâ′; Eʼtĭ une′guhi′ tsana′sehâ′; Yâ′nû nudûñnelû′ tsa′nadiskâ′. Ha′wiye′-hyuwe′, Ha′wiye′-hyuwe′, Yu′wĕ-yuwĕhe′, Ha′wiyĕhyu′-uwe′— The Bear is very bad, so they say; Long time ago he was very bad, so they say; The Bear did so and so, they say."


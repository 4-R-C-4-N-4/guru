[content]
body = "Then he cautiously climbed to the top and looked over and saw the Ustû′tlĭ still slowly working its way toward the summit.\n\nHe went down to the base of the mountain, opened his fire pouch, and set fire to the grass and leaves.\n\nSoon the fire ran all around the mountain and began to climb upward.\n\nWhen the great snake smelled the smoke and saw the flames coming it forgot all about the hunter and turned to make all speed for a high cliff near the summit.\n\nIt reached the rock and got upon it, but the fire followed and caught the dead pines about the base of the cliff until the heat made the Ustû′tlĭ’s scales crack.\n\nTaking a close grip of the rock with its hind feet it raised its body and put forth all its strength in an effort to spring across the wall of fire that surrounded it, but the smoke choked it and its hold loosened and it fell among the blazing pine trunks and lay there until it was burned to ashes."


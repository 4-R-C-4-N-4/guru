[content]
body = "Wafford once knew an old woman whose name was Daʻnă-gâ′stă, an abbreviated form for Daʻnăwă-gâsta′yă, “Sharp war,” understood to mean “Sharp ( i.\n\ne., Fierce) warrior.” Several cases of women acting the part of warriors are on record among the Cherokee."


[content]
body = "He asked why Tsulʻkâlû′ had not brought the new dresses, as he had promised, and the voice from the air said, “I came with them, but you did not obey my word, but broke the fast and raised the war cry.” The young man answered, “It was not done by our people, but by a stranger.\n\nIf you will come again, we will surely do as you say.” But the voice answered, “Now you can never see me.” Then the young man could not say any more, and he went back to Kănuga.\n\n82.\n\nKĂNA′STA, THE LOST SETTLEMENT Long ago, while people still lived in the old town of Kăna′sta, on the French Broad, two strangers, who looked in no way different from other Cherokee, came into the settlement one day and made their way into the chief’s house.\n\nAfter the first greetings were over the chief asked them from what town they had come, thinking them from one of the western settlements, but they said, “We are of your people and our town is close at hand, but you have never seen it.\n\nHere you have wars and sickness, with enemies on every side, and after a while a stronger enemy will come to take your country from you.\n\nWe are always happy, and we have come to invite you to live with us in our town over there,” and they pointed toward Tsuwaʻtel′da (Pilot knob).\n\n“We do not live forever, and do not always find game when we go for it, for the game belongs to Tsulʻkălû′, who lives in Tsunegûñ′yĭ, but we have peace always and need not think of danger.\n\nWe go now, but if your people will live with us let them fast seven days, and we shall come then to take them.” Then they went away toward the west.\n\nThe chief called his people together into the townhouse and they held a council over the matter and decided at last to go with the strangers.\n\nThey got all their property ready for moving, and then went again into the townhouse and began their fast.\n\nThey fasted six days, and on the morning of the seventh, before yet the sun was high, they saw a great company coming along the trail from the west, led by the two men who had stopped with the chief.\n\nThey seemed just like Cherokee from another settlement, and after a friendly meeting they took up a part of the goods to be carried, and the two parties started back together for Tsuwaʻtel′da.\n\nThere was one man from another town visiting at Kăna′sta, and he went along with the rest.\n\nWhen they came to the mountain, the two guides led the way into a cave, which opened out like a great door in the side of the rock.\n\nInside they found an open country and a town, with houses ranged in two long rows from east to west.\n\nThe mountain people lived in the houses on the south side, and they had made ready the other houses for the new comers, but even after all the people of Kăna′sta, with their children and belongings, had moved in, there were still a large number of houses waiting ready for the next who might come.\n\nThe mountain people told them that there was another town, of a different people, above them in the same mountain, and still farther above, at the very top, lived the Ani′-Hyûñtĭkwălâ′skĭ (the Thunders).\n\nNow all the people of Kăna′sta were settled in their new homes, but the man who had only been visiting with them wanted to go back to his own friends."


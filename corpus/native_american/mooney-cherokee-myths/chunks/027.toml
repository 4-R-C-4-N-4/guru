[content]
body = "THE FOURFOOTED TRIBES In Cherokee mythology, as in that of Indian tribes generally, there is no essential difference between men and animals.\n\nIn the primal genesis period they seem to be completely undifferentiated, and we find all creatures alike living and working together in harmony and mutual helpfulness until man, by his aggressiveness and disregard for the rights of the others, provokes their hostility, when insects, birds, fishes, reptiles, and fourfooted beasts join forces against him (see story, “Origin of Disease and Medicine”).\n\nHenceforth their lives are apart, but the difference is always one of degree only.\n\nThe animals, like the people, are organized into tribes and have like them their chiefs and townhouses, their councils and ballplays, and the same hereafter in the Darkening land of Usûñhi′yĭ.\n\nMan is still the paramount power, and hunts and slaughters the others as his own necessities compel, but is obliged to satisfy the animal tribes in every instance, very much as a murder is compounded for, according to the Indian system, by “covering the bones of the dead” with presents for the bereaved relatives.\n\nThis pardon to the hunter is made the easier through a peculiar doctrine of reincarnation, according to which, as explained by the shamans, there is assigned to every animal a definite life term which can not be curtailed by violent means.\n\nIf it is killed before the expiration of the allotted time the death is only temporary and the body is immediately resurrected in its proper shape from the blood drops, and the animal continues its existence until the end of the predestined period, when the body is finally dissolved and the liberated spirit goes to join its kindred shades in the Darkening land.\n\nThis idea appears in the story of the bear man and in the belief concerning the Little Deer.\n\nDeath is thus but a temporary accident and the killing a mere minor crime.\n\nBy some priests it is held that there are seven successive reanimations before the final end.\n\nCertain supernatural personages, Kana′tĭ and Tsulʻkălû′ (see the myths), have dominion over the animals, and are therefore regarded as the distinctive gods of the hunter.\n\nKana′tĭ at one time kept the game animals, as well as the pestiferous insects, shut up in a cave under ground, from which they were released by his undutiful sons.\n\nThe primeval animals—the actors in the animal myths and the predecessors of the existing species—are believed to have been much larger, stronger, and cleverer than their successors of the present day.\n\nIn these myths we find the Indian explanation of certain peculiarities of form, color, or habit, and the various animals are always consistently represented as acting in accordance with their well-known characteristics.\n\nFirst and most prominent in the animal myths is the Rabbit ( Tsistu ), who figures always as a trickster and deceiver, generally malicious, but often beaten at his own game by those whom he had intended to victimize.\n\nThe connection of the rabbit with the dawn god and the relation of the Indian myths to the stories current among the southern negroes are discussed in another place.\n\nBall players while in training are forbidden to eat the flesh of the rabbit, because this animal so easily becomes confused in running.\n\nOn the other hand, their spies seek opportunity to strew along the path which must be taken by their rivals a soup made of rabbit hamstrings, with the purpose Of rendering them timorous in action.\n\nIn a ball game between the birds and the fourfooted animals (see story) the Bat, which took sides with the birds, is said to have won the victory for his party by his superior dodging abilities.\n\nFor this reason the wings or sometimes the stuffed skin of the bat are tied to the implements used in the game to insure success for the players."


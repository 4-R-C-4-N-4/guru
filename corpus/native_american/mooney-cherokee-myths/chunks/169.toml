[content]
body = "Perhaps the only case on record of their acting together was in the war of 1711–13, when they cooperated with the colonists against the Tuscarora.\n\nThe Cherokee, according to the late Colonel Thomas, claim to have formerly occupied all the country about the head of the Catawba river, to below the present Morganton, until the game became scarce, when they retired to the west of the Blue ridge, and afterward “loaned” the eastern territory to the Catawba.\n\nThis agrees pretty well with a Catawba tradition recorded in Schoolcraft, according to which the Catawba—who are incorrectly represented as comparatively recent immigrants from the north—on arriving at Catawba river found their progress disputed by the Cherokee, who claimed original ownership of the country.\n\nA battle was fought, with incredible loss on both sides, but with no decisive result, although the advantage was with the Catawba, on account of their having guns, while their opponents had only Indian weapons.\n\nPreparations were under way to renew the fight when the Cherokee offered to recognize the river as the boundary, allowing the Catawba to settle anywhere to the east.\n\nThe overture was accepted and an agreement was finally made by which the Catawba were to occupy the country east of that river and the Cherokee the country west of Broad river, with the region between the two streams to remain as neutral territory.\n\nStone piles were heaped up on the battlefield to commemorate the treaty, and the Broad river was henceforth called Eswau Huppeday (Line river), by the Catawba, the country eastward to Catawba river being left unoccupied.\n\n16 The fact that one party had guns would bring this event within the early historic period.\n\nThe Catawba assisted the whites against the Cherokee in the war of 1760 and in the later Revolutionary struggle.\n\nAbout 100 warriors, nearly the whole fighting strength of the tribe, took part in the first-mentioned war, several being killed, and a smaller number accompanied Williamson’s force in 1776.\n\n17 At the battle fought under Williamson near the present site of Franklin, North Carolina, the Cherokee, according to the tradition related by Wafford, mistook the Catawba allies of the troops for some of their own warriors, and were fighting for some time under this impression before they noticed that the Catawba wore deer tails in their hair so that the whites might not make the same mistake.\n\nIn this engagement, which was one of the bloodiest Indian encounters of the Revolution, the Cherokee claim that they had actually defeated the troops and their Catawba allies, when their own ammunition gave out and they were consequently forced to retire.\n\nThe Cherokee leader was a noted war chief named Tsanĭ (John).\n\nAbout 1840 nearly the whole Catawba tribe moved up from South Carolina and joined the eastern band of Cherokee, but in consequence of tribal jealousies they remained but a short time, and afterward returned to their former home, as is related elsewhere.\n\nOther tribal names (of doubtful authority) are Ani′-Sa′nĭ and Ani′-Sawahâ′nĭ, belonging to people said to have lived toward the north; both names are perhaps intended for the Shawano or Shawnee, properly Ani′-Sawănu′gĭ.\n\nThe Ani′-Gilĭ′ are said to have been neighbors of the Anin′tsĭ or Natchez; the name may possibly be a Cherokee form for Congaree."


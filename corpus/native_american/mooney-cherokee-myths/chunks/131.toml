[content]
body = "THE MAN WHO MARRIED THE THUNDER’S SISTER In the old times the people used to dance often and all night.\n\nOnce there was a dance at the old town of Sâkwi′yĭ, on the head of Chattahoochee, and after it was well started two young women with beautiful long hair came in, but no one knew who they were or whence they had come.\n\nThey danced with one partner and another, and in the morning slipped away before anyone knew that they were gone; but a young warrior had fallen in love with one of the sisters on account of her beautiful hair, and after the manner of the Cherokee had already asked her through an old man if she would marry him and let him live with her.\n\nTo this the young woman had replied that her brother at home must first be consulted, and they promised to return for the next dance seven days later with an answer, but in the meantime if the young man really loved her he must prove his constancy by a rigid fast until then.\n\nThe eager lover readily agreed and impatiently counted the days.\n\nIn seven nights there was another dance.\n\nThe young warrior was on hand early, and later in the evening the two sisters appeared as suddenly as before.\n\nThey told him their brother was willing, and after the dance they would conduct the young man to their home, but warned him that if he told anyone where he went or what he saw he would surely die.\n\nHe danced with them again and about daylight the three came away just before the dance closed, so as to avoid being followed, and started off together.\n\nThe women led the way along a trail through the woods, which the young man had never noticed before, until they came to a small creek, where, without hesitating, they stepped into the water.\n\nThe young man paused in surprise on the bank and thought to himself, “They are walking in the water; I don’t want to do that.” The women knew his thoughts just as though he had spoken and turned and said to him, “This is not water; this is the road to our house.” He still hesitated, but they urged him on until he stepped into the water and found it was only soft grass that made a fine level trail.\n\nThey went on until the trail came to a large stream which he knew for Tallulah river.\n\nThe women plunged boldly in, but again the warrior hesitated on the bank, thinking to himself, “That water is very deep and will drown me; I can’t go on.” They knew his thoughts and turned and said, “This is no water, but the main trail that goes past our house, which is now close by.” He stepped in, and instead of water there was tall waving grass that closed above his head as he followed them.\n\nThey went only a short distance and came to a rock cave close under Ugûñ′yĭ (Tallulah falls).\n\nThe women entered, while the warrior stopped at the mouth; but they said, “This is our house; come in and our brother will soon be home; he is coming now.” They heard low thunder in the distance.\n\nHe went inside and stood up close to the entrance.\n\nThen the women took off their long hair and hung it up on a rock, and both their heads were as smooth as a pumpkin.\n\nThe man thought, “It is not hair at all,” and he was more frightened than ever.\n\nThe younger woman, the one he was about to marry, then sat down and told him to take a seat beside her.\n\nHe looked, and it was a large turtle, which raised itself up and stretched out its claws as if angry at being disturbed.\n\nThe young man said it was a turtle, and refused to sit down, but the woman insisted that it was a seat."


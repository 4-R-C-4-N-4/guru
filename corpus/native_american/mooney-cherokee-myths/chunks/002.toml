[content]
body = "When the animals and plants were first made—we do not know by whom—they were told to watch and keep awake for seven nights, just as young men now fast and keep awake when they pray to their medicine.\n\nThey tried to do this, and nearly all were awake through the first night, but the next night several dropped off to sleep, and the third night others were asleep, and then others, until, on the seventh night, of all the animals only the owl, the panther, and one or two more were still awake.\n\nTo these were given the power to see and to go about in the dark, and to make prey of the birds and animals which must sleep at night.\n\nOf the trees only the cedar, the pine, the spruce, the holly, and the laurel were awake to the end, and to them it was given to be always green and to be greatest for medicine, but to the others it was said: “Because you have not endured to the end you shall lose your hair every winter.” Men came after the animals and plants.\n\nAt first there were only a brother and sister until he struck her with a fish and told her to multiply, and so it was.\n\nIn seven days a child was born to her, and thereafter every seven days another, and they increased very fast until there was danger that the world could not keep them.\n\nThen it was made that a woman should have only one child in a year, and it has been so ever since."


[content]
body = "The noise of the cataract from which the water is taken is believed to be the voice of Yûñwĭ Gûnahi′ta, the “Long Man,” or river god, teaching lessons which the child may understand, while the stream itself is revered for its power to seize and hold anything cast upon its surface.\n\nA somewhat similar ceremony is sometimes used for adults, but in this case the matter is altogether more difficult, as there are tabus for four or seven days, and the mind must be kept fixed upon the purpose of the rite throughout the whole period, while if the subject so far forgets himself as to lose his temper in that time he will remain of a quarrelsome disposition forever after.\n\nA flowering vine, known as nuniyu′stĭ , “potato-like,” which grows in cultivated fields, and has a tuberous root somewhat resembling a potato, is used in hunting conjurations.\n\nThe bruised root, from which a milky juice oozes, is rubbed upon the deer bleat, aʻwĭ′-ahyeli′skĭ , with which the hunter imitates the bleating of the fawn, under the idea that the doe, hearing it, will think that her offspring desires to suck, and will therefore come the sooner.\n\nThe putty-root (Adam-and-Eve, Aplectrum hiemale ), which is of an oily, mucilaginous nature, is carried by the deer hunter, who, on shooting a deer, puts a small piece of the chewed root into the wound, expecting as a necessary result to find the animal unusually fat when skinned.\n\nInfants which seem to pine and grow thin are bathed with a decoction of the same root in order to fatten them.\n\nThe root of the rare plant known as Venus’ flytrap ( Dionæa ), which has the remarkable property of catching and digesting insects which alight upon it, is chewed by the fisherman and spit upon the bait that no fish may escape him, and the plant is tied upon the fish trap for the same purpose.\n\nThe root of a plant called unatlûñwe′hitû , “having spirals,” is used in conjurations designed to predispose strangers in favor of the subject.\n\nThe priest “takes it to water”—i.\n\ne., says certain prayers over it while standing close to the running stream, then chews a small piece and rubs and blows it upon the body and arms of the patient, who is supposed to be about to start upon a journey, or to take part in a council, with the result that all who meet him or listen to his words are at once pleased with his manner and appearance, and disposed to give every assistance to his projects."


[content]
body = "THE IROQUOIS WARS Long wars were waged between the Cherokee and their remote northern relatives, the Iroquois, with both of whom the recollection, now nearly faded, was a vivid tradition fifty years ago.\n\nThe (Seneca) Iroquois know the Cherokee as Oyadaʼgeʻoñnoñ, a name rather freely rendered “cave people.” The latter call the Iroquois, or rather their largest and most aggressive tribe, the Seneca, Nûndăwe′gĭ, Ani′-Nûn-dăwe′gĭ, or Ani′-Sĕ′nikă, the first forms being derived from Nûndawa′ga or Nûndawa′-ono, “people of the great hills,” the name by which the Seneca know themselves.\n\nAccording to authorities quoted by Schoolcraft, the Seneca claim to have at one time had a settlement, from which they were afterward driven, at Seneca, South Carolina, known in history as one of the principal towns of the Lower Cherokee.\n\nThe league of the Iroquois was probably founded about the middle of the sixteenth century.\n\nBefore 1680 they had conquered or exterminated all the tribes upon their immediate borders and had turned their arms against the more distant Illinois, Catawba, and Cherokee.\n\nAccording to Iroquois tradition, the Cherokee were the aggressors, having attacked and plundered a Seneca hunting party somewhere in the west, while in another story they are represented as having violated a peace treaty by the murder of the Iroquois delegates.\n\nWhatever the cause, the war was taken up by all the tribes of the league.\n\nFrom the Iroquois country to the Cherokee frontier was considered a five days’ journey for a rapidly traveling war party.\n\nAs the distance was too great for large expeditions, the war consisted chiefly of a series of individual exploits, a single Cherokee often going hundreds of miles to strike a blow, which was sure to be promptly retaliated by the warriors from the north, the great object of every Iroquois boy being to go against the Cherokee as soon as he was old enough to take the war path.\n\nCaptives were made on both sides, and probably in about equal numbers, the two parties being too evenly matched for either to gain any permanent advantage, and a compromise was finally made by which the Tennessee river came to be regarded as the boundary between their rival claims, all south of that stream being claimed by the Cherokee, and being acknowledged by the Iroquois, as the limit of their own conquests in that direction.\n\nThis Indian boundary was recognized by the British government up to the time of the Revolution.\n\nMorgan states that a curious agreement was once made between the two tribes, by which this river was also made the limit of pursuit.\n\nIf a returning war party of the Cherokee could recross the Tennessee before they were overtaken by the pursuing Iroquois they were as safe from attack as though entrenched behind a stockade.\n\nThe pursuers, if they chose, might still invade the territory of the enemy, but they passed by the camp of the retreating Cherokee without offering to attack them.\n\nA similar agreement existed for a time between the Seneca and the Erie.\n\nThe Buffalo dance of the Iroquois is traditionally said to have had its origin in an expedition against the Cherokee.\n\nWhen the warriors on their way to the south reached the Kentucky salt lick they found there a herd of buffalo, and heard them, for the first time, “singing their favorite songs,” i.\n\ne., bellowing and snorting.\n\nFrom the bellowing and the movements of the animals were derived the music and action of the dance."


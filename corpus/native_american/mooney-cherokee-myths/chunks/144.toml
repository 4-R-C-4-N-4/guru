[content]
body = "THE TWO MOHAWKS “In the year 1747 a couple of the Mohawk Indians came against the lower towns of the Cheerake, and so cunningly ambuscaded them through most part of the spring and summer, as to kill above twenty in different attacks before they were discovered by any party of the enraged and dejected people.\n\nThey had a thorough knowledge of the most convenient ground for their purpose, and were extremely swift and long-winded.\n\nWhenever they killed any and got the scalp they made off to the neighboring mountains, and ran over the broad ledges of rocks in contrary courses, as occasion offered, so as the pursuers could by no means trace them.\n\nOnce, when a large company was in chase of them, they ran round a steep hill at the head of the main eastern branch of Savana river, intercepted, killed, and scalped the hindmost of the party, and then made off between them and Keeowhee.\n\nAs this was the town to which the company belonged, they hastened home in a close body, as the proper place of security from such enemy wizards.\n\nIn this manner did those two sprightly, gallant savages perplex and intimidate their foes for the space of four moons in the greatest security, though they often were forced to kill and barbecue what they chiefly lived upon, in the midst of their watchful enemies.\n\nHaving sufficiently revenged their relations’ blood and gratified their own ambition with an uncommon number of scalps, they resolved to captivate one and run home with him as a proof of their having killed none but the enemies of their country.\n\nAccordingly, they approached very near to Keeowhee, about half a mile below the late Fort Prince George.\n\nAdvancing with the usual caution on such an occasion, one crawled along under the best cover of the place about the distance of a hundred yards ahead, while the other shifted from tree to tree, looking sharply every way.\n\nIn the evening, however, an old, beloved man discovered them from the top of an adjoining hill, and knew them to be enemies by the cut of their hair, light trim for running, and their postures.\n\nHe returned to the town and called first at the house of one of our traders and informed him of the affair, enjoining him not to mention it to any, lest the people should set off against them without success before their tracks were to be discovered and he be charged with having deceived them.\n\nBut, contrary to the true policy of traders among unforgiving savages, that thoughtless member of the Choktah Sphynx Company busied himself, as usual, out of his proper sphere, sent for the headmen, and told them the story.\n\nAs the Mohawks were allies and not known to molest any of the traders in the paths and woods, he ought to have observed a strict neutrality.\n\nThe youth of the town, by order of their headmen, carried on their noisy public diversions in their usual manner to prevent their foes from having any suspicion of their danger, while runners were sent from the town to their neighbors to come silently and assist them to secure the prey in its state of security.\n\nThey came like silent ghosts, concerted their plan of operation, passed over the river at the old trading ford opposite to the late fort, which lay between two contiguous commanding hills, and, proceeding downward over a broad creek, formed a large semicircle from the river bank, while the town seemed to be taking its usual rest.\n\nThey then closed into a narrower compass, and at last discovered the two brave, unfortunate men lying close under the tops of some fallen young pine trees.\n\nThe company gave the war signal, and the Mohawks, bounding up, bravely repeated it; but, by their sudden spring from under thick cover, their arms were useless.\n\nThey made desperate efforts, however, to kill or be killed, as their situation required."


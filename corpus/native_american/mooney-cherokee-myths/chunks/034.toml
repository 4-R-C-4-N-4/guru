[content]
body = "The Rabbit took the Otter’s coat and put it on, leaving his own instead, and went on to the council.\n\nAll the animals were there, every one looking out for the Otter.\n\nAt last they saw him in the distance, and they said one to the other, “The Otter is coming!” and sent one of the small animals to show him the best seat.\n\nThey were all glad to see him and went up in turn to welcome him, but the Otter kept his head down, with one paw over his face.\n\nThey wondered that he was so bashful, until the Bear came up and pulled the paw away, and there was the Rabbit with his split nose.\n\nHe sprang up and started to run, when the Bear struck at him and pulled his tail off, but the Rabbit was too quick for them and got away."


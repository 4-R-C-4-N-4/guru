[content]
body = "Tsulʻkălû′ was terribly angry.\n\nHe untwisted himself and came out of the âsĭ, and said good-bye to the girl, telling her that he would never let her mother see him again, but would go back to his own country.\n\nThen he went off in the direction of Tsunegûñ′yĭ.\n\nSoon after he left the girl had her monthly period.\n\nThere was a very great flow of blood, and the mother threw it all into the river.\n\nOne night after the girl had gone to bed in the âsĭ her husband came again to the door and said to her, “It seems you are alone,” and asked where was the child.\n\nShe said there had been none.\n\nThen he asked where was the blood, and she said that her mother had thrown it into the river.\n\nShe told just where the place was, and he went there and found a small worm in the water.\n\nHe took it up and carried it back to the âsĭ, and as he walked it took form and began to grow, until, when he reached the âsĭ, it was a baby girl that he was carrying.\n\nHe gave it to his wife and said, “Your mother does not like me and abuses our child, so come and let us go to my home.” The girl wanted to be with her husband, so, after telling her mother good-bye, she took up the child and they went off together to Tsunegûñ′yĭ.\n\nNow, the girl had an older brother, who lived with his own wife in another settlement, and when he heard that his sister was married he came to pay a visit to her and her new husband, but when he arrived at Kănuga his mother told him his sister had taken her child and gone away with her husband, nobody knew where.\n\nHe was sorry to see his mother so lonely, so he said he would go after his sister and try to find her and bring her back.\n\nIt was easy to follow the footprints of the giant, and the young man went along the trail until he came to a place where they had rested, and there were tracks on the ground where a child had been lying and other marks as if a baby had been born there.\n\nHe went on along the trail and came to another place where they had rested, and there were tracks of a baby crawling about and another lying on the ground.\n\nHe went on and came to where they had rested again, and there were tracks of a child walking and another crawling about.\n\nHe went on until he came where they had rested again, and there were tracks of one child running and another walking.\n\nStill he followed the trail along the stream into the mountains, and came to the place where they had rested again, and this time there were footprints of two children running all about, and the footprints can still be seen in the rock at that place.\n\nTwice again he found where they had rested, and then the trail led up the slope of Tsunegûñ′yĭ, and he heard the sound of a drum and voices, as if people were dancing inside the mountain.\n\nSoon he came to a cave like a doorway in the side of the mountain, but the rock was so steep and smooth that he could not climb up to it, but could only just look over the edge and see the heads and shoulders of a great many people dancing inside.\n\nHe saw his sister dancing among them and called to her to come out.\n\nShe turned when she heard his voice, and as soon as the drumming stopped for a while she came out to him, finding no trouble to climb down the rock, and leading her two little children by the hand."


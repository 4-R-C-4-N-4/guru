[content]
body = "Seven ears from the last year’s crop were always put carefully aside, in order to attract the corn until the new crop was ripened and it was time for the dance, when they were eaten with the rest.\n\nIn eating the first new corn after the Green Corn dance, care was observed not to blow upon it to cool it, for fear of causing a wind storm to beat down the standing crop in the field.\n\nMuch ceremony accompanied the planting and tending of the crop.\n\nSeven grains, the sacred number, were put into each hill, and these were not afterward thinned out.\n\nAfter the last working of the crop, the priest and an assistant—generally the owner of the field—went into the field and built a small inclosure ( detsănûñ′lĭ ) in the center.\n\nThen entering it, they seated themselves upon the ground, with heads bent down, and while the assistant kept perfect silence the priest, with rattle in hand, sang songs of invocation to the spirit of the corn.\n\nSoon, according to the orthodox belief, a loud rustling would be heard outside, which they would know was caused by the “Old Woman” bringing the corn into the field, but neither must look up until the song was finished.\n\nThis ceremony was repeated on four successive nights, after which no one entered the field for seven other nights, when the priest himself went in, and, if all the sacred regulations had been properly observed, was rewarded by finding young ears upon the stalks.\n\nThe corn ceremonies could be performed by the owner of the field himself, provided he was willing to pay a sufficient fee to the priest in order to learn the songs and ritual.\n\nCare was always taken to keep a clean trail from the field to the house, so that the corn might be encouraged to stay at home and not go wandering elsewhere.\n\nMost of these customs have now fallen into disuse excepting among the old people, by many of whom they are still religiously observed.\n\nAnother curious ceremony, of which even the memory is now almost forgotten, was enacted after the first working of the corn, when the owner or priest stood in succession at each of the four corners of the field and wept and wailed loudly.\n\nEven the priests are now unable to give a reason for this performance, which may have been a lament for the bloody death of Selu, as the women of Byblos were wont to weep for Adonis.\n\nNext to corn, the bean ( tuya ) is the most important food plant of the Cherokee and other southern Indians, with whom it is probably native, but there does not appear to be much special ceremony or folklore in connection with it.\n\nBeans which crack open in cooking are sometimes rubbed by mothers on the lips of their children in order to make them look smiling and good-tempered.\n\nThe association of ideas seems to be the same as that which in Ireland causes a fat mealy potato, which cracks open in boiling, to be called a “laughing” potato.\n\nMelons and squashes must not be counted or examined too closely, while still growing upon the vine, or they will cease to thrive; neither must one step over the vine, or it will wither before the fruit ripens.\n\nOne who has eaten a May-apple must not come near the vines under any circumstances, as this plant withers and dries up very quickly, and its presence would make the melons wither in the same way.\n\nTobacco was used as a sacred incense or as the guarantee of a solemn oath in nearly every important function—in binding the warrior to take up the hatchet against the enemy, in ratifying the treaty of peace, in confirming sales or other engagements, in seeking omens for the hunter, in driving away witches or evil spirits, and in regular medical practice."


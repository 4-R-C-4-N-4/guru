body = "LOCAL LEGENDS OF NORTH CAROLINA Owing chiefly to the fact that the Cherokee still occupy western North Carolina, the existing local legends for that section are more numerous than for all the rest of their ancient territory.\n\nFor the more important legends see the stories: Agân-unitsi’s Search for the Uktena, Atagâ′hĭ, Hemp-carrier, Herbert’s Spring, Kăna′sta, The Great Leech of Tlanusi′yĭ, The Great Yellow-jacket, The Nûñnĕ′hĭ, The Raid on Tĭkwali′tsĭ, The Removed Townhouses, The Spirit Defenders of Nĭkwăsĭ′, The Uwʼtsûñ′ta, Tsulʻkălû′, Tsuwe′năhĭ, The Uʻtlûñ′ta.\n\nAkwĕʻti′yĭ : A spot on Tuckasegee river, in Jackson county, between Dick’s creek and the upper end of Cowee tunnel.\n\nAccording to tradition there was a dangerous water monster in the river there.\n\nThe meaning of the name is lost.\n\nBUREAU OF AMERICAN ETHNOLOGY NINETEENTH ANNUAL REPORT PL.\n\nXIX PHOTOGRAPH BY AUTHOR, 1888 ON ONONALUFTEE RIVER Atsi′la-wa′ĭ : “Fire’s relative,” a peak, sometimes spoken of as Rattlesnake knob, east of Oconaluftee river and about 2 miles northeast of Cherokee or Yellow Hill, in Swain county.\n\nSo called from a tradition that a ball of fire was once seen to fly through the air from the direction of Highlands, in Macon county, and alight upon this mountain.\n\nThe Indians believe it to have been an ulûñsûtĭ (see number 50 ), which its owner had kept in a hiding place upon the summit, from which, after his death, it issued nightly to search for him.\n\nBlack rock : A very high bald peak toward the head of Scott’s creek, northeast of Webster, on the line of Jackson and Haywood counties.\n\nEither this peak or the adjacent Jones knob, of equal height, is known to the Cherokee as Ûñ′wădâ-tsuʻgilasûñ′, “Where the storehouse was taken off,” from a large flat rock, supported by four other rocks, so as to resemble a storehouse ( ûñwădâ′lĭ ) raised on poles, which was formerly in prominent view upon the summit until thrown down by lightning some fifty years ago.\n\nBuffalo creek, West : A tributary of Cheowa river, in Graham county.\n\nThe Cherokee name is Yûnsâi′ĭ, “Buffalo place,” from a tradition that a buffalo formerly lived under the water at its mouth (see Tsuta′tsinasûñ′yĭ).\n\nCheowa Maximum : A bald mountain at the head of Cheowa river, on the line between Graham and Macon counties.\n\nThis and the adjoining peak, Swim bald, are together called Sehwate′yĭ, “Hornet place,” from a monster hornet, which, according to tradition, formerly had its nest there, and could be seen flying about the tree tops or sunning itself on the bald spots, and which was so fierce that it drove away every one who came near the mountain.\n\nIt finally disappeared.\n\nDăkwâ′ĭ : “Dăkwă′ place,” in French Broad river, about 6 miles above Warm Springs, in Madison county, and 30 miles below Asheville.\n\nA dăkwă′ or monster fish is said to have lived in the stream at that point."


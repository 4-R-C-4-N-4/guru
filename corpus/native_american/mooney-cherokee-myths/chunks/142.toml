[content]
body = "They were then in the keeping of John Ross, principal chief at the time of the removal, and were solemnly produced at a great intertribal council held near Tahlequah, in the Indian Territory, in June, 1843, when they were interpreted by the Cherokee speaker, Gatûñ′waʻlĭ, “Hard-mush,” who had seen them delivered to the chiefs of his tribe at old Itsâ′tĭ seventy years before.\n\nWafford was present on this occasion and describes it.\n\nHolding the belts over his arm while speaking, Hard-mush told of the original treaty with the Iroquois, and explained the meaning of each belt in turn.\n\nAccording to the best of Wafford’s recollection, there was one large belt, to which the smaller belts were fitted.\n\nThe beads did not seem to be of shell, and may have been of porcelain.\n\nThere were also red pipes for the warriors, grayish-white pipes for the chiefs who were foremost in making the peace, and some fans or other ornaments of feathers.\n\nThere were several of the red pipes, resembling the red-stone pipes of the Sioux, but only one, or perhaps two, of the white peace pipes, which may have been only painted, and were much larger than the others.\n\nThe pipes were passed around the circle at the council, so that each delegate might take a whiff.\n\nThe objects altogether made a considerable package, which was carefully guarded by the Cherokee keeper.\n\nIt is thought that they were destroyed in the War of the Rebellion when the house of John Ross, a few miles south of Tahlequah, was burned by the Confederate Cherokee under their general, Stand Watie."


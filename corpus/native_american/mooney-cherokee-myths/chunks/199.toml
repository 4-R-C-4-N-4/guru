[content]
body = "Dunidû′lalûñyĭ : “Where they made arrows,” on Straight creek, a head-stream of Oconaluftee river, near Cataluchee peak, in Swain county.\n\nA Shawano war party coming against the Cherokee, after having crossed the Smoky mountains, halted there to prepare arrows.\n\nFrench Broad river : A magazine writer states that the Indians called this stream “the racing river.” This is only partially correct.\n\nThe Cherokee have no name for the river as a whole, but the district through which it flows about Asheville is called by them Un-ta′kiyasti′yĭ, “Where they race.” The name of the city they translate as Kâsdu′yĭ, “Ashes place.” Gakati′yĭ : “Place of setting free,” a south bend in Tuckasegee river about 3 miles above Bryson City, in Swain county.\n\nIt is sometimes put in the plural form, Diga′katiyĭ, “Place of setting them free.” In one of their old wars the Cherokee generously released some prisoners there.\n\nGatuti′yĭ : “Town-building place,” near the head of Santeetla creek, southwest from Robbinsville, in Graham county.\n\nHigh up on the slopes of the neighboring mountain, Stratton bald, is a wide “bench,” where the people once started to build a settlement, but were frightened off by a strange noise, which they thought was made by an uktena.\n\nGiʻlĭ′-Dinĕhûñ′yĭ : “Where the dogs live,” a deep place in Oconaluftee river, Swain county, a short distance above Yellow Hill (Cherokee) and just below the mound.\n\nIt is so named from a tradition that two “red dogs” were once seen there playing on the bank.\n\nThey were supposed to live under the water.\n\nGisehûñ′yĭ : “Where the Female lives,” on Tuckasegee river, about 2 miles above Bryson City, Swain county.\n\nThere is a tradition that some supernatural “white people” were seen there washing clothes in the river and hanging them out upon the bank to dry.\n\nThey were probably supposed to be the family of the Agis′-e′gwa, or “Great Female,” a spirit invoked by the conjurers.\n\nGregory bald : A high peak of the Great Smoky mountains on the western border of Swain county, adjoining Tennessee.\n\nThe Cherokee call it Tsistu′yĭ, “Rabbit place.” Here the rabbits had their townhouse and here lived their chief, the Great Rabbit, and in the old times the people could see him.\n\nHe was as large as a deer, and all the little rabbits were subject to him.\n\nJoanna bald : A bald mountain near the head of Valley river, on the line between Graham and Cherokee counties.\n\nCalled Diyâ′hăli′yĭ, “Lizard place,” from a traditional great lizard, with glistening throat, which used to haunt the place and was frequently seen sunning itself on the rocky slopes.\n\nJutaculla old fields : A bald spot of perhaps a hundred acres on the slope of Tennessee bald (Tsulʻkălû′ Tsunegûñ′yĭ), at the extreme head of Tuckasegee river, in Jackson county, on the ridge from which the lines of Haywood, Jackson, and Transylvania counties diverge."


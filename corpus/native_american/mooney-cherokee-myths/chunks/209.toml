[content]
body = "660) makes it the subject of a long pseudo-myth, in which Hiwassee, rendered “The Pretty Fawn,” is the beautiful daughter of a Catawba chief, and is wooed, and at last won, by a young Cherokee warrior named Notley, “The Daring Horseman,” who finally becomes the head chief of the Cherokee and succeeds in making perpetual peace between the two tribes.\n\nThe story sounds very pretty, but is a pure invention.\n\nNacoochee : A village on the site of a former Cherokee settlement, in a beautiful and fertile valley of the same name at the head of Chattahoochee river, in White county.\n\nThe Cherokee form is Naguʻtsĭ′, but the word has no meaning in that language and seems to be of foreign, perhaps Creek, origin.\n\nAbout 2 miles above the village, on the east bank of the river, is a large mound.\n\nWhite (Historical Collections of Georgia, p.\n\n486) quotes a fictitious legend, according to which Nacoochee, “The Evening Star,” was a beautiful Indian princess, who unfortunately fell in love with a chieftain of a hostile tribe and was killed, together with her lover, while fleeing from the vengeance of an angry father.\n\nThe two were buried in the same grave and the mound was raised over the spot.\n\nThe only grain of truth in the story is that the name has a slight resemblance to năkwĭsĭ′ , the Cherokee word for “star.” Nottely : A river rising in Union county and flowing northwestward into Hiwassee.\n\nThe Cherokee form is Na′dûʻlĭ′, applied to a former settlement on the west side of the river, in Cherokee county, North Carolina, about a mile from the Georgia line.\n\nAlthough suggestive of naʻtûʻlĭ , “spicewood,” it is a different word and has no meaning in the Cherokee language, being apparently of foreign, perhaps Creek, origin.\n\nFor a pseudo-myth connected with the name, see the preceding note on Hiwassee.\n\nTalking Rock : A creek in upper Georgia flowing northward to join Coosawatee river.\n\nThe Indian settlements upon it were considered as belonging to Sanderstown, on the lower part of the creek, the townhouse being located about a mile above the present Talking Rock station on the west side of the railroad.\n\nThe name is a translation of the Cherokee Nûñyû′-gûñwani′skĭ, “Rock that talks,” and refers, according to one informant, to an echo rock somewhere upon the stream below the present railroad station.\n\nAn old-time trader among the Cherokee in Georgia says that the name was applied to a rock at which the Indians formerly held their councils, but the etymology of the word is against this derivation.\n\nTallulah : A river in Rabun county, northeastern Georgia, which flows into the Tugaloo, and has a beautiful fall about 2 miles above its mouth.\n\nThe Cherokee form is Tălulŭ′ (Tărurĭ′ in the lower Cherokee dialect), the name of an ancient settlement some distance above the falls, as also of a creek and district at the head of Cheowa river, in Graham county, North Carolina.\n\nThe name can not be translated.\n\nA magazine writer has rendered it “The Terrible,” for which there is no authority.\n\nSchoolcraft, on the authority of a Cherokee lady, renders it “There lies your child,” derived from a story of a child having been carried over the falls.\n\nThe name, however, was not applied to the falls, but to a district on the stream above, as well as to another in North Carolina."


[content]
body = "THE RABBIT AND THE TAR WOLF Once there was such a long spell of dry weather that there was no more water in the creeks and springs, and the animals held a council to see what to do about it.\n\nThey decided to dig a well, and all agreed to help except the Rabbit, who was a lazy fellow, and said, “I don’t need to dig for water.\n\nThe dew on the grass is enough for me.” The others did not like this, but they went to work together and dug their well.\n\nThey noticed that the Rabbit kept sleek and lively, although it was still dry weather and the water was getting low in the well.\n\nThey said, “That tricky Rabbit steals our water at night,” so they made a wolf of pine gum and tar and set it up by the well to scare the thief.\n\nThat night the Rabbit came, as he had been coming every night, to drink enough to last him all next day.\n\nHe saw the queer black thing by the well and said, “Who’s there?” but the tar wolf said nothing.\n\nHe came nearer, but the wolf never moved, so he grew braver and said, “Get out of my way or I’ll strike you.” Still the wolf never moved and the Rabbit came up and struck it with his paw, but the gum held his foot and it stuck fast.\n\nNow he was angry and said, “Let me go or I’ll kick you.” Still the wolf said nothing.\n\nThen the Rabbit struck again with his hind foot, so hard that it was caught in the gum and he could not move, and there he stuck until the animals came for water in the morning.\n\nWhen they found who the thief was they had great sport over him for a while and then got ready to kill him, but as soon as he was unfastened from the tar wolf he managed to get away.—Wafford.\n\nSECOND VERSION “Once upon a time there was such a severe drought that all streams of water and all lakes were dried up.\n\nIn this emergency the beasts assembled together to devise means to procure water.\n\nIt was proposed by one to dig a well.\n\nAll agreed to do so except the hare.\n\nShe refused because it would soil her tiny paws.\n\nThe rest, however, dug their well and were fortunate enough to find water.\n\nThe hare beginning to suffer and thirst, and having no right to the well, was thrown upon her wits to procure water.\n\nShe determined, as the easiest way, to steal from the public well.\n\nThe rest of the animals, surprised to find that the hare was so well supplied with water, asked her where she got it.\n\nShe replied that she arose betimes in the morning and gathered the dewdrops.\n\nHowever the wolf and the fox suspected her of theft and hit on the following plan to detect her: They made a wolf of tar and placed it near the well.\n\nOn the following night the hare came as usual after her supply of water.\n\nOn seeing the tar wolf she demanded who was there.\n\nReceiving no answer she repeated the demand, threatening to kick the wolf if he did not reply.\n\nShe receiving no reply kicked the wolf, and by this means adhered to the tar and was caught.\n\nWhen the fox and wolf got hold of her they consulted what it was best to do with her.\n\nOne proposed cutting her head off.\n\nThis the hare protested would be useless, as it had often been tried without hurting her.\n\nOther methods were proposed for dispatching her, all of which she said would be useless.\n\nAt last it was proposed to let her loose to perish in a thicket.\n\nUpon this the hare affected great uneasiness and pleaded hard for life.\n\nHer enemies, however, refused to listen and she was accordingly let loose."


[content]
body = "“Then he must have passed in the night,” said the old woman, “for I have been here all day.” They were about to take another road when the Beetle, which had been circling about in the air above the old woman, made a dart at her and struck her on the forehead, and it rang like brass— ûñtsaiyĭ′ !\n\nThen they knew it was Brass and sprang at him, but he jumped up in his right shape and was off, running so fast that he was soon out of sight again.\n\nThe Beetle had struck so hard that some of the brass rubbed off, and we can see it on the beetle’s forehead yet.\n\nThey followed and came to an old man sitting by the trail, carving a stone pipe.\n\nThey asked him if he had seen Brass pass that way and he said no, but again the Beetle—which could know Brass under any shape—struck him on the forehead so that it rang like metal, and the gambler jumped up in his right form and was off again before they could hold him.\n\nHe ran east until he came to the great water; then he ran north until he came to the edge of the world, and had to turn again to the west.\n\nHe took every shape to throw them off the track, but the Green Beetle always knew him, and the brothers pressed him so hard that at last he could go no more and they caught him just as he reached the edge of the great water where the sun goes down.\n\nThey tied his hands and feet with a grapevine and drove a long stake through his breast, and planted it far out in the deep water.\n\nThey set two crows on the end of the pole to guard it and called the place Kâgûñ′yĭ , “Crow place.” But Brass never died, and can not die until the end of the world, but lies there always with his face up.\n\nSometimes he struggles under the water to get free, and sometimes the beavers, who are his friends, come and gnaw at the grapevine to release him.\n\nThen the pole shakes and the crows at the top cry Ka!\n\nKa!\n\nKa!\n\nand scare the beavers away."


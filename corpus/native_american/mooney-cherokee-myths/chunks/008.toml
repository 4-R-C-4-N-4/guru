[content]
body = "When the Wolf chief asked him his business, he said: “I have two bad boys at home, and I want you to go in seven days from now and play ball against them.” Although Kana′tĭ spoke as though he wanted them to play a game of ball, the Wolves knew that he meant for them to go and kill the two boys.\n\nThey promised to go.\n\nThen the bird’s down blew off from Kana′tĭ’s shoulder, and the smoke carried it up through the hole in the roof of the townhouse.\n\nWhen it came down on the ground outside, the Wild Boy took his right shape again and went home and told his brother all that he had heard in the townhouse.\n\nBut when Kana′tĭ left the Wolf people he did not return home, but went on farther.\n\nThe boys then began to get ready for the Wolves, and the Wild Boy—the magician—told his brother what to do.\n\nThey ran around the house in a wide circle until they had made a trail all around it excepting on the side from which the Wolves would come, where they left a small open space.\n\nThen they made four large bundles of arrows and placed them at four different points on the outside of the circle, after which they hid themselves in the woods and waited for the Wolves.\n\nIn a day or two a whole party of Wolves came and surrounded the house to kill the boys.\n\nThe Wolves did not notice the trail around the house, because they came in where the boys had left the opening, but the moment they went inside the circle the trail changed to a high brush fence and shut them in.\n\nThen the boys on the outside took their arrows and began shooting them down, and as the Wolves could not jump over the fence they were all killed, excepting a few that escaped through the opening into a great swamp close by.\n\nThe boys ran around the swamp, and a circle of fire sprang up in their tracks and set fire to the grass and bushes and burned up nearly all the other Wolves.\n\nOnly two or three got away, and from these have come all the wolves that are now in the world.\n\nSoon afterward some strangers from a distance, who had heard that the brothers had a wonderful grain from which they made bread, came to ask for some, for none but Selu and her family had ever known corn before.\n\nThe boys gave them seven grains of corn, which they told them to plant the next night on their way home, sitting up all night to watch the corn, which would have seven ripe ears in the morning.\n\nThese they were to plant the next night and watch in the same way, and so on every night until they reached home, when they would have corn enough to supply the whole people.\n\nThe strangers lived seven days’ journey away.\n\nThey took the seven grains and watched all through the darkness until morning, when they saw seven tall stalks, each stalk bearing a ripened ear.\n\nThey gathered the ears and went on their way.\n\nThe next night they planted all their corn, and guarded it as before until daybreak, when they found an abundant increase.\n\nBut the way was long and the sun was hot, and the people grew tired.\n\nOn the last night before reaching home they fell asleep, and in the morning the corn they had planted had not even sprouted.\n\nThey brought with them to their settlement what corn they had left and planted it, and with care and attention were able to raise a crop.\n\nBut ever since the corn must be watched and tended through half the year, which before would grow and ripen in a night.\n\nAs Kana′tĭ did not return, the boys at last concluded to go and find him.\n\nThe Wild Boy took a gaming wheel and rolled it toward the Darkening land.\n\nIn a little while the wheel came rolling back, and the boys knew their father was not there."


[content]
body = "One of the Cheerake, the noted half-breed of Istanare [Ustăna′lĭ] town, which lay 2 miles from thence, was at the first onset knocked down and almost killed with his own cutlass, which was wrested from him, though he was the strongest of the whole nation.\n\nBut they were overpowered by numbers, captivated, and put to the most exquisite tortures of fire, amidst a prodigious crowd of exulting foes.\n\nOne of the present Choktah traders, who was on the spot, told me that when they were tied to the stake the younger of the two discovered our traders on a hill near, addressed them in English, and entreated them to redeem their lives.\n\nThe elder immediately spoke to him, in his own language, to desist.\n\nOn this, he recollected himself, and became composed like a stoic, manifesting an indifference to life or death, pleasure or pain, according to their standard of martial virtue, and their dying behaviour did not reflect the least dishonor on their former gallant actions.\n\nAll the pangs of fiery torture served only to refine their manly spirits, and as it was out of the power of the traders to redeem them they, according to our usual custom, retired as soon as the Indians began the diabolical tragedy.”—Adair, American Indians, p.\n\n383, 1"


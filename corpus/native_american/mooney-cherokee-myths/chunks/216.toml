[content]
body = "It is said also that if one should sleep beside a fire containing sourwood sticks the sourwood “will barbecue him,” which may possibly mean that he will have hot or feverish pains thereafter.\n\nThe laurel, in its two varieties, large and small ( Rhododendron and Kalmia , or “ivy”), is much used for spoons and combs, on account of its close grain, as also in medicine, but is never burned, as it is believed that this would bring on cold weather, and would furthermore destroy the medicinal virtues of the whole species.\n\nThe reason given is that the leaves, when burning, make a hissing sound suggestive of winter winds and falling snow.\n\nWhen the doctor is making up a compound in which any part of the laurel is an ingredient, great precautions are taken to prevent any of the leaves or twigs being swept into the fire, as this would render the decoction worthless.\n\nSassafras is tabued as fuel among the Cherokee, as also among their white neighbors, perhaps for the practical reason that it is apt to pop out of the fire when heated and might thus set the house on fire.\n\nPounded walnut bark is thrown into small streams to stupefy the fish, so that they may be easily dipped out in baskets as they float on the surface of the water.\n\nShould a pregnant woman wade into the stream at the time, its effect is nullified, unless she has first taken the precaution to tie a strip of the bark about her toe.\n\nA fire of post-oak and the wood of the telûñ′lătĭ or summer grape ( Vitis æstivalis ) is believed to bring a spell of warm weather even in the coldest winter season.\n\nMysterious properties attach to the wood of a tree which has been struck by lightning, especially when the tree itself still lives, and such wood enters largely into the secret compounds of the conjurers.\n\nAn ordinary person of the laity will not touch it, for fear of having cracks come upon his hands and feet, nor is it burned for fuel, for fear that lye made from the ashes will cause consumption.\n\nIn preparing ballplayers for the contest, the medicine-man sometimes burns splinters of it to coal, which he gives to the players to paint themselves with in order that they may be able to strike their opponents with all the force of a thunderbolt.\n\nBark or wood from a tree struck by lightning, but still green, is beaten up and put into the water in which seeds are soaked before planting, to insure a good crop, but, on the other hand, any lightning-struck wood thrown into the field will cause the crop to wither, and it is believed to have a bad effect even to go into the field immediately after having been near such a tree.\n\nAmong all vegetables the one which holds first place in the household economy and ceremonial observance of the tribe is selu , “corn,” invoked in the sacred formulas under the name of Agawe′la, “The Old Woman,” in allusion to its mythic origin from the blood of an old woman killed by her disobedient sons (see number 3 , “Kana′tĭ and Selu”).\n\nIn former times the annual thanksgiving ceremony of the Green-corn dance, preliminary to eating the first new corn, was the most solemn tribal function, a propitiation and expiation for the sins of the past year, an amnesty for public criminals, and a prayer for happiness and prosperity for the year to come.\n\nOnly those who had properly prepared themselves by prayer, fasting, and purification were allowed to take part in this ceremony, and no one dared to taste the new corn until then."


[content]
body = "According to Sequoya’s account, as given to Wafford, there had been a long war between the Cherokee and the northern Indians, who were never able to conquer the Cherokee or break their spirit, until at last the Iroquois were tired of fighting and sent a delegation to make peace.\n\nThe messengers set out for the south with their wampum belts and peace emblems, but lost their way after passing Tennessee river, perhaps from the necessity of avoiding the main trail, and instead of arriving at Itsâ′tĭ or Echota, the ancient peace town and capital of the Cherokee Nation—situated on Little Tennessee river below Citico creek, in the present Monroe county, Tennessee—they found themselves on the outskirts of Tă′likwă′ or Tellico, on Tellico river, some 10 or 15 miles to the southward.\n\nFig.\n\n2 —Ancient Iroquois wampum belts.\n\n3 Concealing themselves in the neighborhood, they sent one of their number into the town to announce their coming.\n\nAs it happened the chief and his family were at work in their cornfield, and his daughter had just gone up to the house for some reason when the Iroquois entered and asked for something to eat.\n\nSeeing that he was a stranger, she set out food for him according to the old custom of hospitality.\n\nWhile he was eating her father, the chief, came in to see what was delaying her, and was surprised to find there one of the hereditary enemies of his tribe.\n\nBy this time the word had gone out that an Iroquois was in the chief’s house, and the men of the town had left their work and seized their guns to kill him, but the chief heard them coming and standing in the doorway kept them off, saying: “This man has come here on a peace mission, and before you kill him you must first kill me.” They finally listened to him, and allowed the messenger to go out and bring his companions to the chief’s house, where they were all taken care of.\n\nWhen they were well rested after their long journey the chief of Tă′likwă himself went with them to Itsâ′tĭ, the capital, where lived the great chief Âgănstâ′ta, who was now the civil ruler of the Nation.\n\nThe chiefs of the various towns were summoned and a council was held, at which the speaker for the Iroquois delegation delivered his message and produced the wampum belts and pipes, which they brought as proofs of their mission and had carried all the way in packs upon their backs.\n\nHe said that for three years his people had been wanting to make peace.\n\nThere was a spring of dark, cloudy water in their country, and they had covered it over for one year and then looked, but the water was still cloudy.\n\nAgain they had covered it over, but when they looked at the end of another year it was still dark and troubled.\n\nFor another year they had covered the spring, and this time when they looked the water was clear and sparkling.\n\nThen they knew the time had come, and they left home with their wampum belts to make peace with their enemies.\n\nThe friendly message was accepted by the Cherokee, and the belts and other symbolic peace tokens were delivered over to their keeping.\n\nOther belts in turn were probably given to the Iroquois, and after the usual round of feasting and dancing the messengers returned to their people in the north and the long war was at an end.\n\nFor nearly a century these symbolic records of the peace with the Iroquois were preserved by the Cherokee, and were carried with them to the western territory when the tribe was finally driven from its old home in 1838."


[content]
body = "Da′ʻnawa-(a) Sa′ʻtsûñyĭ : “War crossing,” a ford in Cheowa river about 3 miles below Robbinsville, in Graham county.\n\nA hostile war party from the North, probably Shawano or Iroquois, after having killed a man on Cheowa, was pursued and crossed the river at this place.\n\nDatle′yăsta′ĭ : “Where they fell down,” on Tuckasegee river, at the bend above Webster, in Jackson county, where was formerly the old town of Gănsâ′gĭ (Conasauga).\n\nTwo large uktenas, twined about each other as though in combat, were once seen to lift themselves from a deep hole in the river there and fall back into the water.\n\nDâtsi′yĭ : “Dâtsĭ place,” just above Eagle creek, on Little Tennessee river, between Graham and Swain counties.\n\nSo called from a traditional water monster of that name, said to have lived in a deep hole in the stream.\n\nDegalʻgûñ′yĭ : “Where they are piled up,” a series of cairns on both sides of the trail down the south side of Cheowa river, in Graham county.\n\nThey extend along the trail for several miles, from below Santeetla creek nearly to Slick Rock creek, on the Tennessee line (the first being just above Disgâ′gisti′yĭ, q.\n\nv.), and probably mark the site of an ancient battle.\n\nOne at least, nearly off Yellow creek, is reputed to be the grave of a Cherokee killed by the enemy.\n\nEvery passing Indian throws an additional stone upon each heap, believing that some misfortune will befall him should he neglect this duty.\n\nOther cairns are on the west side of Slick Rock creek about a mile from Little Tennessee river, and others south of Robbinsville, near where the trail crosses the ridge to Valleytown, in Cherokee county.\n\nDida′skasti′yĭ : “Where they were afraid of each other,” a spot on the east side of Little Tennessee river, near the mouth of Alarka creek, in Swain county.\n\nA ball game once arranged to take place there, before the Removal, between rival teams from Qualla and Valleytown, was abandoned on account of the mutual fear of the two parties.\n\nDisgâ′gisti′yĭ : “Where they gnaw,” a spot where the trail down the south side of Cheowa river crosses a small branch about half way between Cockram creek and Yellow creek, in Graham county.\n\nIndians passing gnaw the twigs from the laurel bushes here, in the belief that if they should fail to do so they will encounter some misfortune before crossing the next ridge.\n\nNear by is a cairn to which each also adds a stone (see Degalʻgûñ′yĭ).\n\nDuduñ′lĕksûñ′yĭ : “Where its legs were broken off,” a spot on the east side of Tuckasegee river, opposite the mouth of Cullowhee river, a few miles above Webster, in Jackson county.\n\nThe name suggests a tradition, which appears to be lost.\n\nDulastûñ′yĭ : “Potsherd place,” a former settlement on Nottely river, in Cherokee county, near the Georgia line.\n\nA half-breed Cherokee ball captain who formerly lived there, John Butler or Tsan-uga′sĭtă (Sour John), having been defeated in a ball game, said, in contempt of his men, that they were of no more use than broken pots."


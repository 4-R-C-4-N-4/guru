body = "THE SOUTHERN AND WESTERN TRIBES The nearest neighbors of the Cherokee to the south were the Creeks or Muscogee, who found mixed confederacy holding central and southern Georgia and Alabama.\n\nThey were known to the Cherokee as Ani′-Ku′sa or Ani′-Gu′sa.\n\nfrom Kusa, the principal town of the Upper Creeks, which was situated on Coosa river, southwest from the present Talladega, Alabama.\n\nThe Lower Creeks, residing chiefly on Chattahoochee river, were formerly always distinguished as Ani-Kawi′ta, from Kawita or Coweta, their ancient capital, on the west side of the river, in Alabama, nearly opposite the present Columbus, Georgia.\n\nIn number the Creeks were nearly equal to the Cherokee, but differed in being a confederacy of cognate or incorporated tribes, of which the Muscogee proper was the principal.\n\nThe Cherokee were called by them Tsal-gal′gi or Tsûlgûl′gi, a plural derivative from Tsa′lăgĭ′, the proper name of the tribe.\n\nThe ordinary condition between the two tribes was one of hostility, with occasional intervals of good will.\n\nHistory, tradition, and linguistic evidence combine to show that the Creeks at one time occupied almost the whole of northern Georgia and Alabama, extending a considerable distance into Tennessee and perhaps North Carolina, and were dispossessed by the Cherokee pressing upon them from the north and northeast.\n\nThis conquest was accomplished chiefly during the first half of the eighteenth century, and culminated with the decisive engagement of Tali′wă about 1755.\n\nIn most of their early negotiations with the Government the Creeks demanded that the lands of the various tribes be regarded as common property, and that only the boundary between the Indians and the whites be considered.\n\nFailing in that, they claimed as theirs the whole region of the Chattahoochee and Coosa, north to the dividing ridge between those streams and the Tennessee, or even beyond to the Tennessee itself, and asserted that any Cherokee settlements within those limits were only by their own permission.\n\nIn 1783 they claimed the Savannah river as the eastern boundary between themselves and the Cherokee, and asserted their own exclusive right of sale over all the territory between that river and the Oconee.\n\nOn the other hand the Cherokee as stoutly claimed all to a point some 70 miles south of the present city of Atlanta, on the ground of having driven the Creeks out of it in three successive wars, and asserted that their right had been admitted by the Creeks themselves in a council held to decide the question between the two tribes before the Revolution.\n\nBy mutual agreement, about 1816, members of either tribe were allowed to settle within the territory claimed by the other.\n\nThe line as finally established through the mediation of the colonial and Federal governments ran from the mouth of Broad river on Savannah nearly due west across Georgia, passing about 10 miles north of Atlanta, to Coosa river in Alabama, and thence northwest to strike the west line of Alabama about 20 miles south of the Tennessee.\n\n18 Among the names which remain to show the former presence of Creeks north of this boundary are the following: Coweeta, a small creek entering the Little Tennessee above Franklin.\n\nNorth Carolina; Tomatola (Cherokee."


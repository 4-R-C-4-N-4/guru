[content]
body = "The other waited for him, doing a little hunting near the camp, and two nights afterwards Tsuwe′năhĭ was back again.\n\nHe seemed to be alone, but was talking as he came, and the other hunter heard girls’ voices, although he could see no one.\n\nWhen he came up to the fire he said, “I have two friends with me, and they say there is to be a dance in their town in two nights, and if you want to go they will come for you.” The hunter agreed at once, and Tsuwe′năhĭ called out, as if to some one close by, “He says he will go.” Then he said, “Our sisters have come for some venison.” The hunter had killed a deer and had the meat drying over the fire, so he said, “What kind do they want?” The voices answered, “Our mother told us to ask for some of the ribs,” but still he could see nothing.\n\nHe took down some rib pieces and gave them to Tsuwe′năhĭ, who took them and said, “In two days we shall come again for you.” Then he started off, and the other heard the voices going through the woods until all was still again.\n\nIn two days Tsuwe′năhĭ came, and this time he had two girls with him.\n\nAs they stood near the fire the hunter noticed that their feet were short and round, almost like dogs’ paws, but as soon as they saw him looking they sat down so that he could not see their feet.\n\nAfter supper the whole party left the camp and went up along the creek to Tsuwaʻtel′da.\n\nThey went in through the cave door until they got to the farther end and could see houses beyond, when all at once the hunter’s legs felt as if they were dead and he staggered and fell to the ground.\n\nThe others lifted him up, but still he could not stand, until the medicine-man brought some “old tobacco” and rubbed it on his legs and made him smell it until he sneezed.\n\nThen he was able to stand again and went in with the others.\n\nHe could not stand at first, because he had not prepared himself by fasting before he started.\n\nThe dance had not yet begun and Tsuwe′năhĭ took the hunter into the townhouse and showed him a seat near the fire, but it had long thorns of honey locust sticking out from it and he was afraid to sit down.\n\nTsuwe′năhĭ told him not to be afraid, so he sat down and found that the thorns were as soft as down feathers.\n\nNow the drummer came in and the dancers, and the dance began.\n\nOne man followed at the end of the line, crying Kû!\n\nKû!\n\nall the time, but not dancing.\n\nThe hunter wondered, and they told him, “This man was lost in the mountains and had been calling all through the woods for his friends until his, voice failed and he was only able to pant Kû!\n\nKû!\n\nand then we found him and took him in.” When it was over Tsuwe′năhĭ and the hunter went back to the settlement.\n\nAt the next dance in Kănuga they told all they had seen at Tsuwaʻtel′da, what a large town was there and how kind everybody was, and this time—because there were two of them—the people believed it.\n\nNow others wanted to go, but Tsuwe′năhĭ told them they must first fast seven days, while he went ahead to prepare everything, and then he would come and bring them."


[content]
body = "Concerning “Chickamauga gulch,” a canyon on the northern stream of that name, a newspaper writer gives the following so-called legend, which it is hardly necessary to say is not genuine: The Cherokees were a tribe singularly rich in tradition, and of course so wild, gloomy, and remarkable a spot was not without its legend.\n\nThe descendants of the expatriated semi-barbarians believe to this day that in ages gone a great serpent made its den in the gulch, and that yearly he demanded of the red men ten of their most beautiful maidens as a sacrificial offering.\n\nFearful of extermination, the demand was always complied with by the tribe, amid weeping and wailing by the women.\n\nOn the day before the tribute was due the serpent announced its presence by a demoniacal hiss, and the next morning the fair ones who had been chosen to save the tribe were taken to the summit of a cliff and left to be swallowed by the scaly Moloch.\n\nChilhowee : A mountain and station on the north side of Little Tennessee river, in Blount county.\n\nThe correct Cherokee form is Tsûʻlûñwe′ĭ, applied to the lower part of Abrams creek, which enters the river from the north just above.\n\nThe meaning of the word is lost, although it may possibly have a connection with tsûʻlû , “kingfisher.” It has been incorrectly rendered “fire deer,” an interpretation founded on the false assumption that the name is compounded from atsi′la , “fire,” and aʻwĭ′ , “deer,” whence, Chil-howee.\n\nFor legends localized in this vicinity, see the stories noted above.\n\nChilhowee occurs also as the name of a stream in the mountains of southwestern Virginia.\n\nLenoir : On the north bank of the main Tennessee, at the junction of the Little Tennessee, in Loudon county.\n\nThe Cherokee name is Wa′gĭnsĭ′, of which the meaning is lost, and was applied originally to an eddy in the stream, where, it was said, there dwelt a large serpent, to see which was an omen of evil.\n\nOn one occasion a man crossing the river at this point saw the snake in the water and soon afterward lost one of his children.\n\nMorganton : On a rocky hill on the old Indian trail on the west side of Little Tennessee river, above and nearly opposite Morganton, in Loudon county, are, or were a few years ago, four trees blazed in a peculiar manner, concerning which the Indians had several unsatisfactory stories, the most common opinion being that the marks were very old and had been made by Indians to indicate the position of hidden mines.\n\nNashville : The state capital, in Davidson county.\n\nThe Cherokee name is Dăgû′năwelă′hĭ, “Mussel-liver place,” which would seem to have originated in some now forgotten legend.\n\nNickajack : A creek entering Tennessee river from the south about 15 miles below Chattanooga.\n\nNear its mouth is a noted cave of the same name.\n\nThe Cherokee form is Nĭkutse′gĭ, the name of a former settlement of that tribe at the mouth of the creek; but the word has no meaning in that language, and is probably of foreign, perhaps Chickasaw, origin.\n\nThe derivation from a certain “Nigger Jack,” said to have made the cave his headquarters is purely fanciful.\n\nSavannah : A farm on the north bank of Hiwassee river at a ford of the same name, about 5 miles above Conasauga creek and Columbus, in Polk county."


[content]
body = "Bienville states, in 1742, that some of them had gone to the Cherokee directly from the Chickasaw when they found the latter too hard pressed by the French to be able to care for them.\n\n25 They seem to have been regarded by the Cherokee as a race of wizards and conjurers, a view which was probably due in part to their peculiar religious rites and in part to the interest which belonged to them as the remnant of an extirpated tribe.\n\nAlthough we have no direct knowledge on the subject, there is every reason to suppose that the two tribes had had communication with each other long before the period of the Natchez war.\n\nAccording to the statement of James Wafford, who was born in 1806 near the site of Clarkesville, Ga., when this region was still Indian country, the “Notchees” had their town on the north bank of Hiwassee, just above Peachtree creek, on the spot where a Baptist mission was established by the Rev.\n\nEvan Jones in 1821, a few miles above the present Murphy, Cherokee county, North Carolina.\n\nOn his mother’s side he had himself a strain of Natchez blood.\n\nHis grandmother had told him that when she was a young woman, perhaps about 1755, she once had occasion to go to this town on some business, which she was obliged to transact through an interpreter, as the Natchez had been there so short a time that only one or two spoke any Cherokee.\n\nThey were all in the one town, which the Cherokee called Gwalʻgâ′hĭ, “Frog place,” but he was unable to say whether or not it had a townhouse.\n\nIn 1824, as one of the census takers for the Cherokee Nation, he went over the same section and found the Natchez then living jointly with the Cherokee in a town called Gûʻlăni′yĭ at the junction of Brasstown and Gumlog creeks, tributary to Hiwassee, some 6 miles southeast of their former location and close to the Georgia line.\n\nThe removal may have been due to the recent establishment of the mission at the old place.\n\nIt was a large settlement, made up about equally from the two tribes, but by this time the Natchez were not distinguishable in dress or general appearance from the others, and nearly all spoke broken Cherokee, while still retaining their own language.\n\nAs most of the Indians had come under Christian influences so far as to have quit dancing, there was no townhouse.\n\nHarry Smith, who was born about 1820, father of the late chief of the East Cherokee, also remembers them as living on Hiwassee and calling themselves Na′ʻtsĭ.\n\nGansĕ′ʻtĭ, already mentioned, states that when he was a boy the Natchez were scattered among the Cherokee settlements along the upper part of Hiwassee, extending down into Tennessee.\n\nThey had then no separate townhouses.\n\nSome of them, at least, had come up from the Creeks, and spoke Creek and Cherokee, as well as their own language, which he could not understand, although familiar with both of the others.\n\nThey were great dance leaders, which agrees with their traditional reputation for ceremonial and secret knowledge.\n\nThey went west with the Cherokee at the final removal of the tribe to Indian Territory in 1838.\n\nIn 1890 there was a small settlement on Illinois river a few miles south of Tahlequah, Cherokee Nation, several persons in which still spoke their own language.\n\nSome of these may have come with the Creeks, as by an agreement between Creeks and Cherokee about the time of the Removal it had been arranged that citizens of either tribe living within the boundaries claimed by the other might remain without question if they so elected."


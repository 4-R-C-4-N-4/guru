[content]
body = "When it is consulted for this purpose the future is seen mirrored in the clear crystal as a tree is reflected in the quiet stream below, and the conjurer knows whether the sick man will recover, whether the warrior will return from battle, or whether the youth will live to be old.\n\n51.\n\nÂGĂN-UNI′TSĬ’S SEARCH FOR THE UKTENA In one of their battles with the Shawano, who are all magicians, the Cherokee captured a great medicine-man whose name was Âgăn-uni′tsĭ, “The Ground-hogs’ Mother.” They had tied him ready for the torture when he begged for his life and engaged, if spared, to find for them the great wonder worker, the Ulûñsû′tĭ.\n\nNow, the Ulûñsû′tĭ is like a blazing star set in the forehead of the great Uktena serpent, and the medicine-man who could possess it might do marvelous things, but everyone knew this could not be, because it was certain death to meet the Uktena.\n\nThey warned him of all this, but he only answered that his medicine was strong and he was not afraid.\n\nSo they gave him his life on that condition and he began the search.\n\nThe Uktena used to lie in wait in lonely places to surprise its victims, and especially haunted the dark passes of the Great Smoky mountains.\n\nKnowing this, the magician went first to a gap in the range on the far northern border of the Cherokee country.\n\nHe searched and found there a monster blacksnake, larger than had ever been known before, but it was not what he was looking for, and he laughed at it as something too small for notice.\n\nComing southward to the next gap he found there a great moccasin snake, the largest ever seen, but when the people wondered he said it was nothing.\n\nIn the next gap he found a greensnake and called the people to see “the pretty sălikwâ′yĭ,” but when they found an immense greensnake coiled up in the path they ran away in fear.\n\nComing on to U′tăwagûn′ta, the Bald mountain, he found there a great diya′hălĭ (lizard) basking, but, although it was large and terrible to look at, it was not what he wanted and he paid no attention to it.\n\nGoing still south to Walâsi′yĭ, the Frog place, he found a great frog squatting in the gap, but when the people who came to see it were frightened like the others and ran away from the monster he mocked at them for being afraid of a frog and went on to the next gap.\n\nHe went on to Duniskwaʻlgûñ′yĭ, the Gap of the Forked Antler, and to the enchanted lake of Atagâ′hĭ, and at each he found monstrous reptiles, but he said they were nothing.\n\nHe thought the Uktena might be hiding in the deep water at Tlanusi′yĭ, the Leech place, on Hiwassee, where other strange things had been seen before, and going there he dived far down under the surface.\n\nHe saw turtles and water snakes, and two immense sun-perches rushed at him and retreated again, but that was all.\n\nOther places he tried, going always southward, and at last on Gahû′tĭ mountain he found the Uktena asleep.\n\nTurning without noise, he ran swiftly down the mountain side as far as he could go with one long breath, nearly to the bottom of the slope.\n\nThere he stopped and piled up a great circle of pine cones, and inside of it he dug a deep trench.\n\nThen he set fire to the cones and came back again up the mountain."


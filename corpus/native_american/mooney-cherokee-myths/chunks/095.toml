[content]
body = "The boy told his father how Ûñtsaiyĭ′ had dared him to play, and had even offered to play for the spots on his skin.\n\n“Yes,” said Thunder, “he is a great gambler and makes his living that way, but I will see that you win.” He brought a small cymling gourd with a hole bored through the neck, and tied it on the boy’s wrist.\n\nInside the gourd there was a string of beads, and one end hung out from a hole in the top, but there was no end to the string inside.\n\n“Now,” said his father, “go back the way you came, and as soon as he sees you he will want to play for the beads.\n\nHe is very hard to beat, but this time he will lose every game.\n\nWhen he cries out for a drink, you will know he is getting discouraged, and then strike the rock with your war club and water will come, so that you can play on without stopping.\n\nAt last he will bet his life, and lose.\n\nThen send at once for your brothers to kill him, or he will get away, he is so tricky.” The boy took the gourd and his war club and started east along the road by which he had come.\n\nAs soon as Ûñtsaiyĭ′ saw him he called to him, and when he saw the gourd with the bead string hanging out he wanted to play for it.\n\nThe boy drew out the string, but there seemed to be no end to it, and he kept on pulling until enough had come out to make a circle all around the playground.\n\n“I will play one game for this much against your stake,” said the boy, “and when that is over we can have another game.” They began the game with the wheel and stick and the boy won.\n\nÛñtsaiyĭ′ did not know what to think of it, but he put up another stake and called for a second game.\n\nThe boy won again, and so they played on until noon, when Ûñtsaiyĭ′ had lost nearly everything he had and was about discouraged.\n\nIt was very hot, and he said, “I am thirsty,” and wanted to stop long enough to get a drink.\n\n“No,” said the boy, and struck the rock with his club so that water came out, and they had a drink.\n\nThey played on until Ûñtsaiyĭ′ had lost all his buckskins and beaded work, his eagle feathers and ornaments, and at last offered to bet his wife.\n\nThey played and the boy won her.\n\nThen Ûñtsaiyĭ′ was desperate and offered to stake his life.\n\n“If I win I kill you, but if you win you may kill me.” They played and the boy won.\n\n“Let me go and tell my wife,” said Ûñtsaiyĭ′, “so that she will receive her new husband, and then you may kill me.” He went into the house, but it had two doors, and although the boy waited long Ûñtsaiyĭ′ did not come back.\n\nWhen at last he went to look for him he found that the gambler had gone out the back way and was nearly out of sight going east.\n\nThe boy ran to his father’s house and got his brothers to help him.\n\nThey brought their dog—the Horned Green Beetle—and hurried after the gambler.\n\nHe ran fast and was soon out of sight, and they followed as fast as they could.\n\nAfter a while they met an old woman making pottery and asked her if she had seen Ûñtsaiyĭ′ and she said she had not.\n\n“He came this way,” said the brothers."


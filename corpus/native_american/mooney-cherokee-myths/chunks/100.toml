[content]
body = "Then they kindled a large fire of brush near the trail and hid themselves in the laurels, because they knew she would come as soon as she saw the smoke.\n\nSure enough they soon saw an old woman coming along the trail.\n\nShe looked like an old woman whom they knew well in the village, and although several of the wiser men wanted to shoot at her, the others interfered, because they did not want to hurt one of their own people.\n\nThe old woman came slowly along the trail, with one hand under her blanket, until she stepped upon the pitfall and tumbled through the brush top into the deep hole below.\n\nThen, at once, she showed her true nature, and instead of the feeble old woman there was the terrible Uʼtlûñ′tă with her stony skin, and her sharp awl finger reaching out in every direction for some one to stab.\n\nThe hunters rushed out from the thicket and surrounded the pit, but shoot as true and as often as they could, their arrows struck the stony mail of the witch only to be broken and fall useless at her feet, while she taunted them and tried to climb out of the pit to get at them.\n\nThey kept out of her way, but were only wasting their arrows when a small bird, Utsŭ′ʻgĭ , the titmouse, perched on a tree overhead and began to sing “ un, un, un .” They thought it was saying u′nahŭ′ , heart, meaning that they should aim at the heart of the stone witch.\n\nThey directed their arrows where the heart should be, but the arrows only glanced off with the flint heads broken.\n\nThen they caught the Utsŭ′ʻgĭ and cut off its tongue, so that ever since its tongue is short and everybody knows it is a liar.\n\nWhen the hunters let it go it flew straight up into the sky until it was out of sight and never came back again.\n\nThe titmouse that we know now is only an image of the other.\n\nThey kept up the fight without result until another bird, little Tsĭ′kĭlilĭ′, the chickadee, flew down from a tree and alighted upon the witch’s right hand.\n\nThe warriors took this as a sign that they must aim there, and they were right, for her heart was on the inside of her hand, which she kept doubled into a fist, this same awl hand with which she had stabbed so many people.\n\nNow she was frightened in earnest, and began to rush furiously at them with her long awl finger and to jump about in the pit to dodge the arrows, until at last a lucky arrow struck just where the awl joined her wrist and she fell down dead.\n\nEver since the tsĭ′kĭlilĭ′ is known as a truth teller, and when a man is away on a journey, if this bird comes and perches near the house and chirps its song, his friends know he will soon be safe home.\n\n67.\n\nNÛÑ′YUNU′WĬ, THE STONE MAN This is what the old men told me when I was a boy.\n\nOnce when all the people of the settlement were out in the mountains on a great hunt one man who had gone on ahead climbed to the top of a high ridge and found a large river on the other side.\n\nWhile he was looking across he saw an old man walking about on the opposite ridge, with a cane that seemed to be made of some bright, shining rock.\n\nThe hunter watched and saw that every little while the old man would point his cane in a certain direction, then draw it back and smell the end of it."


[content]
body = "The sacred beast, bird, or reptile, represented by its stuffed skin, or by a rude painting, was treated with reverence and carried into battle to insure the guardianship of the spirits.\n\nThe symbolic attribute of beaver, bear, or tortoise, such as wisdom, cunning, courage, and the like, was supposed to be mysteriously conferred upon the wearer of the badge.\n\nThe totem or charm used in medicine was ordinarily that of the medicine lodge to which the practitioner belonged, though there were some great men who boasted a special revelation.\n\nThere are two ceremonial usages which, so far as I have been able to ascertain, were universal among American Indians, and apparently fundamental.\n\nThese have already been referred to as the “eneepee,” or vapor-bath, and the “chan-du-hu-pah-yu-za-pee,” or ceremonial of the pipe.\n\nIn our Siouan legends and traditions these two are preeminent, as handed down from the most ancient time and persisting to the last.\n\nIn our Creation myth or story of the First Man, the vapor-bath was the magic used by The-one-who-was-First-Created, to give life to the dead bones of his younger brother, who had been slain by the monsters of the deep.\n\nUpon the shore of the Great Water he dug two round holes, over one of which he built a low enclosure of fragrant cedar boughs, and here he gathered together the bones of his brother.\n\nIn the other pit he made a fire and heated four round stones, which he rolled one by one into the lodge of boughs.\n\nHaving closed every aperture save one, he sang a mystic chant while he thrust in his arm and sprinkled water upon the stones with a bunch of sage.\n\nImmediately steam arose, and as the legend says, “there was an appearance of life.” A second time he sprinkled water, and the dry bones rattled together.\n\nThe third time he seemed to hear soft singing from within the lodge; and the fourth time a voice exclaimed: “Brother, let me out!” (It should be noted that the number four is the magic or sacred number of the Indian.) This story gives the traditional origin of the “eneepee,” which has ever since been deemed essential to the Indian’s effort to purify and recreate his spirit.\n\nIt is used both by the doctor and by his patient.\n\nEvery man must enter the cleansing bath and take the cold plunge which follows, when preparing for any spiritual crisis, for possible death, or imminent danger.\n\nNot only the “eneepee” itself, but everything used in connection with the mysterious event, the aromatic cedar and sage, the water, and especially the water-worn boulders, are regarded as sacred, or at the least adapted to a spiritual use.\n\nFor the rock we have a special reverent name—“Tunkan,” a contraction of the Sioux word for Grandfather.\n\nThe natural boulder enters into many of our solemn ceremonials, such as the “Rain Dance,” and the “Feast of Virgins.” The lone hunter and warrior reverently holds up his filled pipe to “Tunkan,” in solitary commemoration of a miracle which to him is as authentic and holy as the raising of Lazarus to the devout Christian.\n\nThere is a legend that the First Man fell sick, and was taught by his Elder Brother the ceremonial use of the pipe, in a prayer to the spirits for ease and relief.\n\nThis simple ceremony is the commonest daily expression of thanks or “grace,” as well as an oath of loyalty and good faith when the warrior goes forth upon some perilous enterprise, and it enters even into his “hambeday,” or solitary prayer, ascending as a rising vapor or incense to the Father of Spirits."


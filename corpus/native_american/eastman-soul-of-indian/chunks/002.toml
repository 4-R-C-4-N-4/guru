[content]
body = "Sometimes an old man, standing upon the brink of eternity, might reveal to a chosen few the oracle of his long-past youth.\n\nThe native American has been generally despised by his white conquerors for his poverty and simplicity.\n\nThey forget, perhaps, that his religion forbade the accumulation of wealth and the enjoyment of luxury.\n\nTo him, as to other single-minded men in every age and race, from Diogenes to the brothers of Saint Francis, from the Montanists to the Shakers, the love of possessions has appeared a snare, and the burdens of a complex society a source of needless peril and temptation.\n\nFurthermore, it was the rule of his life to share the fruits of his skill and success with his less fortunate brothers.\n\nThus he kept his spirit free from the clog of pride, cupidity, or envy, and carried out, as he believed, the divine decree—a matter profoundly important to him.\n\nIt was not, then, wholly from ignorance or improvidence that he failed to establish permanent towns and to develop a material civilization.\n\nTo the untutored sage, the concentration of population was the prolific mother of all evils, moral no less than physical.\n\nHe argued that food is good, while surfeit kills; that love is good, but lust destroys; and not less dreaded than the pestilence following upon crowded and unsanitary dwellings was the loss of spiritual power inseparable from too close contact with one’s fellow-men.\n\nAll who have lived much out of doors know that there is a magnetic and nervous force that accumulates in solitude and that is quickly dissipated by life in a crowd; and even his enemies have recognized the fact that for a certain innate power and self-poise, wholly independent of circumstances, the American Indian is unsurpassed among men.\n\nThe red man divided mind into two parts,—the spiritual mind and the physical mind.\n\nThe first is pure spirit, concerned only with the essence of things, and it was this he sought to strengthen by spiritual prayer, during which the body is subdued by fasting and hardship.\n\nIn this type of prayer there was no beseeching of favor or help.\n\nAll matters of personal or selfish concern, as success in hunting or warfare, relief from sickness, or the sparing of a beloved life, were definitely relegated to the plane of the lower or material mind, and all ceremonies, charms, or incantations designed to secure a benefit or to avert a danger, were recognized as emanating from the physical self.\n\nThe rites of this physical worship, again, were wholly symbolic, and the Indian no more worshiped the Sun than the Christian adores the Cross.\n\nThe Sun and the Earth, by an obvious parable, holding scarcely more of poetic metaphor than of scientific truth, were in his view the parents of all organic life.\n\nFrom the Sun, as the universal father, proceeds the quickening principle in nature, and in the patient and fruitful womb of our mother, the Earth, are hidden embryos of plants and men.\n\nTherefore our reverence and love for them was really an imaginative extension of our love for our immediate parents, and with this sentiment of filial piety was joined a willingness to appeal to them, as to a father, for such good gifts as we may desire.\n\nThis is the material or physical prayer.\n\nThe elements and majestic forces in nature, Lightning, Wind, Water, Fire, and Frost, were regarded with awe as spiritual powers, but always secondary and intermediate in character.\n\nWe believed that the spirit pervades all creation and that every creature possesses a soul in some degree, though not necessarily a soul conscious of itself.\n\nThe tree, the waterfall, the grizzly bear, each is an embodied Force, and as such an object of reverence.\n\nThe Indian loved to come into sympathy and spiritual communion with his brothers of the animal kingdom, whose inarticulate souls had for him something of the sinless purity that we attribute to the innocent and irresponsible child."


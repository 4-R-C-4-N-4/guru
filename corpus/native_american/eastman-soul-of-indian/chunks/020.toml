[content]
body = "Crow Dog was under a vow to slay the chief, in case he ever betrayed or disgraced the name of the Brule Sioux.\n\nThere is no doubt that he had committed crimes both public and private, having been guilty of misuse of office as well as of gross offenses against morality; therefore his death was not a matter of personal vengeance but of just retribution.\n\nA few days before Crow Dog was to be executed, he asked permission to visit his home and say farewell to his wife and twin boys, then nine or ten years old.\n\nStrange to say, the request was granted, and the condemned man sent home under escort of the deputy sheriff, who remained at the Indian agency, merely telling his prisoner to report there on the following day.\n\nWhen he did not appear at the time set, the sheriff dispatched the Indian police after him.\n\nThey did not find him, and his wife simply said that Crow Dog had desired to ride alone to the prison, and would reach there on the day appointed.\n\nAll doubt was removed next day by a telegram from Rapid City, two hundred miles distant, saying: “Crow Dog has just reported here.” The incident drew public attention to the Indian murderer, with the unexpected result that the case was reopened, and Crow Dog acquitted.\n\nHe still lives, a well-preserved man of about seventy-five years, and is much respected among his own people.\n\nIt is said that, in the very early days, lying was a capital offense among us.\n\nBelieving that the deliberate liar is capable of committing any crime behind the screen of cowardly untruth and double-dealing, the destroyer of mutual confidence was summarily put to death, that the evil might go no further.\n\nEven the worst enemies of the Indian, those who accuse him of treachery, blood-thirstiness, cruelty, and lust, have not denied his courage, but in their minds it is a courage that is ignorant, brutal, and fantastic.\n\nHis own conception of bravery makes of it a high moral virtue, for to him it consists not so much in aggressive self-assertion as in absolute self-control.\n\nThe truly brave man, we contend, yields neither to fear nor anger, desire nor agony; he is at all times master of himself; his courage rises to the heights of chivalry, patriotism, and real heroism.\n\n“Let neither cold, hunger, nor pain, nor the fear of them, neither the bristling teeth of danger nor the very jaws of death itself, prevent you from doing a good deed,” said an old chief to a scout who was about to seek the buffalo in midwinter for the relief of a starving people.\n\nThis was his childlike conception of courage."


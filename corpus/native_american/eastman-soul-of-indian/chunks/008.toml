[content]
body = "Names of any dignity or importance must be conferred by the old men, and especially so if they have any spiritual significance; as Sacred Cloud, Mysterious Night, Spirit Woman, and the like.\n\nSuch a name was sometimes borne by three generations, but each individual must prove that he is worthy of it.\n\nIn the life of the Indian there was only one inevitable duty,—the duty of prayer—the daily recognition of the Unseen and Eternal.\n\nHis daily devotions were more necessary to him than daily food.\n\nHe wakes at daybreak, puts on his moccasins and steps down to the water’s edge.\n\nHere he throws handfuls of clear, cold water into his face, or plunges in bodily.\n\nAfter the bath, he stands erect before the advancing dawn, facing the sun as it dances upon the horizon, and offers his unspoken orison.\n\nHis mate may precede or follow him in his devotions, but never accompanies him.\n\nEach soul must meet the morning sun, the new, sweet earth, and the Great Silence alone!\n\nWhenever, in the course of the daily hunt, the red hunter comes upon a scene that is strikingly beautiful or sublime—a black thundercloud with the rainbow’s glowing arch above the mountain; a white waterfall in the heart of a green gorge; a vast prairie tinged with the blood-red of sunset—he pauses for an instant in the attitude of worship.\n\nHe sees no need for setting apart one day in seven as a holy day, since to him all days are God’s.\n\nEvery act of his life is, in a very real sense, a religious act.\n\nHe recognizes the spirit in all creation, and believes that he draws from it spiritual power.\n\nHis respect for the immortal part of the animal, his brother, often leads him so far as to lay out the body of his game in state and decorate the head with symbolic paint or feathers.\n\nThen he stands before it in the prayer attitude, holding up the filled pipe, in token that he has freed with honor the spirit of his brother, whose body his need compelled him to take to sustain his own life.\n\nWhen food is taken, the woman murmurs a “grace” as she lowers the kettle; an act so softly and unobtrusively performed that one who does not know the custom usually fails to catch the whisper: “Spirit, partake!” As her husband receives the bowl or plate, he likewise murmurs his invocation to the spirit.\n\nWhen he becomes an old man, he loves to make a notable effort to prove his gratitude.\n\nHe cuts off the choicest morsel of the meat and casts it into the fire—the purest and most ethereal element.\n\nThe hospitality of the wigwam is only limited by the institution of war.\n\nYet, if an enemy should honor us with a call, his trust will not be misplaced, and he will go away convinced that he has met with a royal host!\n\nOur honor is the guarantee for his safety, so long as he is within the camp.\n\nFriendship is held to be the severest test of character.\n\nIt is easy, we think, to be loyal to family and clan, whose blood is in our own veins.\n\nLove between man and woman is founded on the mating instinct and is not free from desire and self-seeking.\n\nBut to have a friend, and to be true under any and all trials, is the mark of a man!\n\nThe highest type of friendship is the relation of “brother-friend” or “life-and-death friend.” This bond is between man and man, is usually formed in early youth, and can only be broken by death.\n\nIt is the essence of comradeship and fraternal love, without thought of pleasure or gain, but rather for moral support and inspiration."


[content]
body = "After silent prayer, each medicine-man in turn addressed himself to his charge, exhorting him to observe all the rules of the order under the eye of the Mysterious One, and instructing him in his duty toward his fellow-man and toward the Ruler of Life.\n\nAll then assumed an attitude of superb power and dignity, crouching slightly as if about to spring forward in a foot-race, and grasping their medicine bags firmly in both hands.\n\nSwinging their arms forward at the same moment, they uttered their guttural “Yo-ho-ho-ho!” in perfect unison and with startling effect.\n\nIn the midst of a breathless silence, they took a step forward, then another and another, ending a rod or so from the row of kneeling victims, with a mighty swing of the sacred bags that would seem to project all their mystic power into the bodies of the initiates.\n\nInstantly they all fell forward, apparently lifeless.\n\nWith this thrilling climax, the drums were vigorously pounded and the dance began again with energy.\n\nAfter a few turns had been taken about the prostrate bodies of the new members, covering them with fine robes and other garments which were later to be distributed as gifts, they were permitted to come to life and to join in the final dance.\n\nThe whole performance was clearly symbolic of death and resurrection.\n\nWhile I cannot suppose that this elaborate ritual, with its use of public and audible prayer, of public exhortation or sermon, and other Caucasian features, was practiced before comparatively modern times, there is no doubt that it was conscientiously believed in by its members, and for a time regarded with reverence by the people.\n\nBut at a later period it became still further demoralized and fell under suspicion of witchcraft.\n\nThere is no doubt that the Indian held medicine close to spiritual things, but in this also he has been much misunderstood; in fact everything that he held sacred is indiscriminately called “medicine,” in the sense of mystery or magic.\n\nAs a doctor he was originally very adroit and often successful.\n\nHe employed only healing bark, roots, and leaves with whose properties he was familiar, using them in the form of a distillation or tea and always singly.\n\nThe stomach or internal bath was a valuable discovery of his, and the vapor or Turkish bath was in general use.\n\nHe could set a broken bone with fair success, but never practiced surgery in any form.\n\nIn addition to all this, the medicine-man possessed much personal magnetism and authority, and in his treatment often sought to reestablish the equilibrium of the patient through mental or spiritual influences—a sort of primitive psychotherapy.\n\nThe Sioux word for the healing art is “wah-pee-yah,” which literally means readjusting or making anew.\n\n“Pay-jee-hoo-tah,” literally root, means medicine, and “wakan” signifies spirit or mystery.\n\nThus the three ideas, while sometimes associated, were carefully distinguished.\n\nIt is important to remember that in the old days the “medicine-man” received no payment for his services, which were of the nature of an honorable function or office.\n\nWhen the idea of payment and barter was introduced among us, and valuable presents or fees began to be demanded for treating the sick, the ensuing greed and rivalry led to many demoralizing practices, and in time to the rise of the modern “conjurer,” who is generally a fraud and trickster of the grossest kind.\n\nIt is fortunate that his day is practically over.\n\nEver seeking to establish spiritual comradeship with the animal creation, the Indian adopted this or that animal as his “totem,” the emblematic device of his society, family, or clan.\n\nIt is probable that the creature chosen was the traditional ancestress, as we are told that the First Man had many wives among the animal people."


[content]
body = "The same thing occurred when he took his first step, when his ears were pierced, and when he shot his first game, so that his childish exploits and progress were known to the whole clan as to a larger family, and he grew into manhood with the saving sense of a reputation to sustain.\n\nThe youth was encouraged to enlist early in the public service, and to develop a wholesome ambition for the honors of a leader and feast-maker, which can never be his unless he is truthful and generous, as well as brave, and ever mindful of his personal chastity and honor.\n\nThere were many ceremonial customs which had a distinct moral influence; the woman was rigidly secluded at certain periods, and the young husband was forbidden to approach his own wife when preparing for war or for any religious event.\n\nThe public or tribal position of the Indian is entirely dependent upon his private virtue, and he is never permitted to forget that he does not live to himself alone, but to his tribe and his clan.\n\nThus habits of perfect self-control were early established, and there were no unnatural conditions or complex temptations to beset him until he was met and overthrown by a stronger race.\n\nTo keep the young men and young women strictly to their honor, there were observed among us, within my own recollection, certain annual ceremonies of a semi-religious nature.\n\nOne of the most impressive of these was the sacred “Feast of Virgins,” which, when given for the first time, was equivalent to the public announcement of a young girl’s arrival at a marriageable age.\n\nThe herald, making the rounds of the teepee village, would publish the feast something after this fashion: “Pretty Weasel-woman, the daughter of Brave Bear, will kindle her first maidens’ fire to-morrow!\n\nAll ye who have never yielded to the pleading of man, who have not destroyed your innocency, you alone are invited, to proclaim anew before the Sun and the Earth, before your companions and in the sight of the Great Mystery, the chastity and purity of your maidenhood.\n\nCome ye, all who have not known man!” The whole village was at once aroused to the interest of the coming event, which was considered next to the Sun Dance and the Grand Medicine Dance in public importance.\n\nIt always took place in midsummer, when a number of different clans were gathered together for the summer festivities, and was held in the centre of the great circular encampment.\n\nHere two circles were described, one within the other, about a rudely heart-shaped rock which was touched with red paint, and upon either side of the rock there were thrust into the ground a knife and two arrows.\n\nThe inner circle was for the maidens, and the outer one for their grandmothers or chaperones, who were supposed to have passed the climacteric.\n\nUpon the outskirts of the feast there was a great public gathering, in which order was kept by certain warriors of highest reputation.\n\nAny man among the spectators might approach and challenge any young woman whom he knew to be unworthy; but if the accuser failed to prove his charge, the warriors were accustomed to punish him severely.\n\nEach girl in turn approached the sacred rock and laid her hand upon it with all solemnity.\n\nThis was her religious declaration of her virginity, her vow to remain pure until her marriage.\n\nIf she should ever violate the maidens’ oath, then welcome that keen knife and those sharp arrows!\n\nOur maidens were ambitious to attend a number of these feasts before marriage, and it sometimes happened that a girl was compelled to give one, on account of gossip about her conduct.\n\nThen it was in the nature of a challenge to the scandal-mongers to prove their words!\n\nA similar feast was sometimes made by the young men, for whom the rules were even more strict, since no young man might attend this feast who had so much as spoken of love to a maiden."


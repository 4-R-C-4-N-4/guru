[content]
body = "At every meal time, a dish of food was placed under it, and some person of the same sex and age as the one who was gone must afterward be invited in to partake of the food.\n\nAt the end of a year from the time of death, the relatives made a public feast and gave away the clothing and other gifts, while the lock of hair was interred with appropriate ceremonies.\n\nCertainly the Indian never doubted the immortal nature of the spirit or soul of man, but neither did he care to speculate upon its probable state or condition in a future life.\n\nThe idea of a “happy hunting-ground” is modern and probably borrowed, or invented by the white man.\n\nThe primitive Indian was content to believe that the spirit which the “Great Mystery” breathed into man returns to Him who gave it, and that after it is freed from the body, it is everywhere and pervades all nature, yet often lingers near the grave or “spirit bundle” for the consolation of friends, and is able to hear prayers.\n\nSo much of reverence was due the disembodied spirit, that it was not customary with us even to name the dead aloud.\n\nIt is well known that the American Indian had somehow developed occult power, and although in the latter days there have been many impostors, and, allowing for the vanity and weakness of human nature, it is fair to assume that there must have been some even in the old days, yet there are well-attested instances of remarkable prophecies and other mystic practice.\n\nA Sioux prophet predicted the coming of the white man fully fifty years before the event, and even described accurately his garments and weapons.\n\nBefore the steamboat was invented, another prophet of our race described the “Fire Boat” that would swim upon their mighty river, the Mississippi, and the date of this prophecy is attested by the term used, which is long since obsolete.\n\nNo doubt, many predictions have been colored to suit the new age, and unquestionably false prophets, fakirs, and conjurers have become the pest of the tribes during the transition period.\n\nNevertheless, even during this period there was here and there a man of the old type who was implicitly believed in to the last.\n\nNotable among these was Ta-chank-pee Ho-tank-a, or His War Club Speaks Loud, who foretold a year in advance the details of a great war-party against the Ojibways.\n\nThere were to be seven battles, all successful except the last, in which the Sioux were to be taken at a disadvantage and suffer crushing defeat.\n\nThis was carried out to the letter.\n\nOur people surprised and slew many of the Ojibways in their villages, but in turn were followed and cunningly led into an ambush whence but few came out alive.\n\nThis was only one of his remarkable prophecies.\n\nAnother famous “medicine-man” was born on the Rum River about one hundred and fifty years ago, and lived to be over a century old.\n\nHe was born during a desperate battle with the Ojibways, at a moment when, as it seemed, the band of Sioux engaged were to be annihilated.\n\nTherefore the child’s grandmother exclaimed: “Since we are all to perish, let him die a warrior’s death in the field!” and she placed his cradle under fire, near the spot where his uncle and grandfathers were fighting, for he had no father.\n\nBut when an old man discovered the new-born child, he commanded the women to take care of him, “for,” said he, “we know not how precious the strength of even one warrior may some day become to his nation!” This child lived to become great among us, as was intimated to the superstitious by the circumstances of his birth."


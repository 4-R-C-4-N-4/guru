[content]
body = "He had faith in their instincts, as in a mysterious wisdom given from above; and while he humbly accepted the supposedly voluntary sacrifice of their bodies to preserve his own, he paid homage to their spirits in prescribed prayers and offerings.\n\nIn every religion there is an element of the supernatural, varying with the influence of pure reason over its devotees.\n\nThe Indian was a logical and clear thinker upon matters within the scope of his understanding, but he had not yet charted the vast field of nature or expressed her wonders in terms of science.\n\nWith his limited knowledge of cause and effect, he saw miracles on every hand,—the miracle of life in seed and egg, the miracle of death in lightning flash and in the swelling deep!\n\nNothing of the marvelous could astonish him; as that a beast should speak, or the sun stand still.\n\nThe virgin birth would appear scarcely more miraculous than is the birth of every child that comes into the world, or the miracle of the loaves and fishes excite more wonder than the harvest that springs from a single ear of corn.\n\nWho may condemn his superstition?\n\nSurely not the devout Catholic, or even Protestant missionary, who teaches Bible miracles as literal fact!\n\nThe logical man must either deny all miracles or none, and our American Indian myths and hero stories are perhaps, in themselves, quite as credible as those of the Hebrews of old.\n\nIf we are of the modern type of mind, that sees in natural law a majesty and grandeur far more impressive than any solitary infraction of it could possibly be, let us not forget that, after all, science has not explained everything.\n\nWe have still to face the ultimate miracle,—the origin and principle of life!\n\nHere is the supreme mystery that is the essence of worship, without which there can be no religion, and in the presence of this mystery our attitude cannot be very unlike that of the natural philosopher, who beholds with awe the Divine in all creation.\n\nIt is simple truth that the Indian did not, so long as his native philosophy held sway over his mind, either envy or desire to imitate the splendid achievements of the white man.\n\nIn his own thought he rose superior to them!\n\nHe scorned them, even as a lofty spirit absorbed in its stern task rejects the soft beds, the luxurious food, the pleasure-worshiping dalliance of a rich neighbor.\n\nIt was clear to him that virtue and happiness are independent of these things, if not incompatible with them.\n\nThere was undoubtedly much in primitive Christianity to appeal to this man, and Jesus’ hard sayings to the rich and about the rich would have been entirely comprehensible to him.\n\nYet the religion that is preached in our churches and practiced by our congregations, with its element of display and self-aggrandizement, its active proselytism, and its open contempt of all religions but its own, was for a long time extremely repellent.\n\nTo his simple mind, the professionalism of the pulpit, the paid exhorter, the moneyed church, was an unspiritual and unedifying thing, and it was not until his spirit was broken and his moral and physical constitution undermined by trade, conquest, and strong drink, that Christian missionaries obtained any real hold upon him.\n\nStrange as it may seem, it is true that the proud pagan in his secret soul despised the good men who came to convert and to enlighten him!\n\nNor were its publicity and its Phariseeism the only elements in the alien religion that offended the red man.\n\nTo him, it appeared shocking and almost incredible that there were among this people who claimed superiority many irreligious, who did not even pretend to profess the national faith.\n\nNot only did they not profess it, but they stooped so low as to insult their God with profane and sacrilegious speech!\n\nIn our own tongue His name was not spoken aloud, even with utmost reverence, much less lightly or irreverently."


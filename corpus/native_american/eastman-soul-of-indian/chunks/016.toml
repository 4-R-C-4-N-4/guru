[content]
body = "BARBARISM AND THE MORAL CODE Silence the Corner-Stone of Character.\n\nBasic Ideas of Morality.\n\n“Give All or Nothing!” Rules of Honorable Warfare.\n\nAn Indian Conception of Courage.\n\nLong before I ever heard of Christ, or saw a white man, I had learned from an untutored woman the essence of morality.\n\nWith the help of dear Nature herself, she taught me things simple but of mighty import.\n\nI knew God.\n\nI perceived what goodness is.\n\nI saw and loved what is really beautiful.\n\nCivilization has not taught me anything better!\n\nAs a child, I understood how to give; I have forgotten that grace since I became civilized.\n\nI lived the natural life, whereas I now live the artificial.\n\nAny pretty pebble was valuable to me then; every growing tree an object of reverence.\n\nNow I worship with the white man before a painted landscape whose value is estimated in dollars!\n\nThus the Indian is reconstructed, as the natural rocks are ground to powder, and made into artificial blocks which may be built into the walls of modern society.\n\nThe first American mingled with his pride a singular humility.\n\nSpiritual arrogance was foreign to his nature and teaching.\n\nHe never claimed that the power of articulate speech was proof of superiority over the dumb creation; on the other hand, it is to him a perilous gift.\n\nHe believes profoundly in silence—the sign of a perfect equilibrium.\n\nSilence is the absolute poise or balance of body, mind, and spirit.\n\nThe man who preserves his selfhood ever calm and unshaken by the storms of existence—not a leaf, as it were, astir on the tree; not a ripple upon the surface of shining pool—his, in the mind of the unlettered sage, is the ideal attitude and conduct of life.\n\nIf you ask him: “What is silence?” he will answer: “It is the Great Mystery!” “The holy silence is His voice!” If you ask: “What are the fruits of silence?” he will say: “They are self-control, true courage or endurance, patience, dignity, and reverence.\n\nSilence is the cornerstone of character.” “Guard your tongue in youth,” said the old chief, Wabashaw, “and in age you may mature a thought that will be of service to your people!” The moment that man conceived of a perfect body, supple, symmetrical, graceful, and enduring—in that moment he had laid the foundation of a moral life!\n\nNo man can hope to maintain such a temple of the spirit beyond the period of adolescence, unless he is able to curb his indulgence in the pleasures of the senses.\n\nUpon this truth the Indian built a rigid system of physical training, a social and moral code that was the law of his life.\n\nThere was aroused in him as a child a high ideal of manly strength and beauty, the attainment of which must depend upon strict temperance in eating and in the sexual relation, together with severe and persistent exercise.\n\nHe desired to be a worthy link in the generations, and that he might not destroy by his weakness that vigor and purity of blood which had been achieved at the cost of much self-denial by a long line of ancestors.\n\nHe was required to fast from time to time for short periods, and to work off his superfluous energy by means of hard running, swimming, and the vapor-bath.\n\nThe bodily fatigue thus induced, especially when coupled with a reduced diet, is a reliable cure for undue sexual desires.\n\nPersonal modesty was early cultivated as a safeguard, together with a strong self-respect and pride of family and race.\n\nThis was accomplished in part by keeping the child ever before the public eye, from his birth onward.\n\nHis entrance into the world, especially in the case of the first-born, was often publicly announced by the herald, accompanied by a distribution of presents to the old and needy."


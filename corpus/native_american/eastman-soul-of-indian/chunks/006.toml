[content]
body = "You may destroy him once and again, but he issues as often from that same gentle lap—a gift of the Great Good to the race, in which man is only an accomplice!” This wild mother has not only the experience of her mother and grandmother, and the accepted rules of her people for a guide, but she humbly seeks to learn a lesson from ants, bees, spiders, beavers, and badgers.\n\nShe studies the family life of the birds, so exquisite in its emotional intensity and its patient devotion, until she seems to feel the universal mother-heart beating in her own breast.\n\nIn due time the child takes of his own accord the attitude of prayer, and speaks reverently of the Powers.\n\nHe thinks that he is a blood brother to all living creatures, and the storm wind is to him a messenger of the “Great Mystery.” At the age of about eight years, if he is a boy, she turns him over to his father for more Spartan training.\n\nIf a girl, she is from this time much under the guardianship of her grandmother, who is considered the most dignified protector for the maiden.\n\nIndeed, the distinctive work of both grandparents is that of acquainting the youth with the national traditions and beliefs.\n\nIt is reserved for them to repeat the time-hallowed tales with dignity and authority, so as to lead him into his inheritance in the stored-up wisdom and experience of the race.\n\nThe old are dedicated to the service of the young, as their teachers and advisers, and the young in turn regard them with love and reverence.\n\nOur old age was in some respects the happiest period of life.\n\nAdvancing years brought with them much freedom, not only from the burden of laborious and dangerous tasks, but from those restrictions of custom and etiquette which were religiously observed by all others.\n\nNo one who is at all acquainted with the Indian in his home can deny that we are a polite people.\n\nAs a rule, the warrior who inspired the greatest terror in the hearts of his enemies was a man of the most exemplary gentleness, and almost feminine refinement, among his family and friends.\n\nA soft, low voice was considered an excellent thing in man, as well as in woman!\n\nIndeed, the enforced intimacy of tent life would soon become intolerable, were it not for these instinctive reserves and delicacies, this unfailing respect for the established place and possessions of every other member of the family circle, this habitual quiet, order, and decorum.\n\nOur people, though capable of strong and durable feeling, were not demonstrative in their affection at any time, least of all in the presence of guests or strangers.\n\nOnly to the aged, who have journeyed far, and are in a manner exempt from ordinary rules, are permitted some playful familiarities with children and grandchildren, some plain speaking, even to harshness and objurgation, from which the others must rigidly refrain.\n\nIn short, the old men and women are privileged to say what they please and how they please, without contradiction, while the hardships and bodily infirmities that of necessity fall to their lot are softened so far as may be by universal consideration and attention.\n\nThere was no religious ceremony connected with marriage among us, while on the other hand the relation between man and woman was regarded as in itself mysterious and holy.\n\nIt appears that where marriage is solemnized by the church and blessed by the priest, it may at the same time be surrounded with customs and ideas of a frivolous, superficial, and even prurient character.\n\nWe believed that two who love should be united in secret, before the public acknowledgment of their union, and should taste their apotheosis alone with nature."


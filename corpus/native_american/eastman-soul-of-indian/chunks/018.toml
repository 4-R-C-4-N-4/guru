[content]
body = "It was considered a high honor among us to have won some distinction in war and the chase, and above all to have been invited to a seat in the council, before one had spoken to any girl save his own sister.\n\nIt was our belief that the love of possessions is a weakness to be overcome.\n\nIts appeal is to the material part, and if allowed its way it will in time disturb the spiritual balance of the man.\n\nTherefore the child must early learn the beauty of generosity.\n\nHe is taught to give what he prizes most, and that he may taste the happiness of giving, he is made at an early age the family almoner.\n\nIf a child is inclined to be grasping, or to cling to any of his little possessions, legends are related to him, telling of the contempt and disgrace falling upon the ungenerous and mean man.\n\nPublic giving is a part of every important ceremony.\n\nIt properly belongs to the celebration of birth, marriage, and death, and is observed whenever it is desired to do special honor to any person or event.\n\nUpon such occasions it is common to give to the point of utter impoverishment.\n\nThe Indian in his simplicity literally gives away all that he has, to relatives, to guests of another tribe or clan, but above all to the poor and the aged, from whom he can hope for no return.\n\nFinally, the gift to the “Great Mystery,” the religious offering, may be of little value in itself, but to the giver’s own thought it should carry the meaning and reward of true sacrifice.\n\nOrphans and the aged are invariably cared for, not only by their next of kin, but by the whole clan.\n\nIt is the loving parent’s pride to have his daughters visit the unfortunate and the helpless, carry them food, comb their hair, and mend their garments.\n\nThe name “Wenonah,” bestowed upon the eldest daughter, distinctly implies all this, and a girl who failed in her charitable duties was held to be unworthy of the name.\n\nThe man who is a skillful hunter, and whose wife is alive to her opportunities, makes many feasts, to which he is careful to invite the older men of his clan, recognizing that they have outlived their period of greatest activity, and now love nothing so well as to eat in good company, and to live over the past.\n\nThe old men, for their part, do their best to requite his liberality with a little speech, in which they are apt to relate the brave and generous deeds of their host’s ancestors, finally congratulating him upon being a worthy successor of an honorable line.\n\nThus his reputation is won as a hunter and a feast-maker, and almost as famous in his way as the great warrior is he who has a recognized name and standing as a “man of peace.” The true Indian sets no price upon either his property or his labor.\n\nHis generosity is only limited by his strength and ability.\n\nHe regards it as an honor to be selected for a difficult or dangerous service, and would think it shame to ask for any reward, saying rather: “Let him whom I serve express his thanks according to his own bringing up and his sense of honor!” Nevertheless, he recognizes rights in property.\n\nTo steal from one of his own tribe would be indeed disgrace, and if discovered, the name of “Wamanon,” or Thief, is fixed upon him forever as an unalterable stigma.\n\nThe only exception to the rule is in the case of food, which is always free to the hungry if there is none by to offer it.\n\nOther protection than the moral law there could not be in an Indian community, where there were neither locks nor doors, and everything was open and easy of access to all comers.\n\nThe property of the enemy is spoil of war, and it is always allowable to confiscate it if possible.\n\nHowever, in the old days there was not much plunder."


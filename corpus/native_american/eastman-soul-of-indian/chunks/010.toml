body = "CEREMONIAL AND SYMBOLIC WORSHIP Modern Perversions of Early Religious Rites.\n\nThe Sun Dance.\n\nThe Great Medicine Lodge.\n\nTotems and Charms.\n\nThe Vapor-Bath and the Ceremonial of the Pipe.\n\nThe public religious rites of the Plains Indians are few, and in large part of modern origin, belonging properly to the so-called “transition period.” That period must be held to begin with the first insidious effect upon their manners and customs of contact with the dominant race, and many of the tribes were so influenced long before they ceased to lead the nomadic life.\n\nThe fur-traders, the “Black Robe” priests, the military, and finally the Protestant missionaries, were the men who began the disintegration of the Indian nations and the overthrow of their religion, seventy-five to a hundred years before they were forced to enter upon reservation life.\n\nWe have no authentic study of them until well along in the transition period, when whiskey and trade had already debauched their native ideals.\n\nDuring the era of reconstruction they modified their customs and beliefs continually, creating a singular admixture of Christian with pagan superstitions, and an addition to the old folk-lore of disguised Bible stories under an Indian aspect.\n\nEven their music shows the influence of the Catholic chants.\n\nMost of the material collected by modern observers is necessarily of this promiscuous character.\n\nIt is noteworthy that the first effect of contact with the whites was an increase of cruelty and barbarity, an intensifying of the dark shadows in the picture!\n\nIn this manner the “Sun Dance” of the Plains Indians, the most important of their public ceremonials, was abused and perverted until it became a horrible exhibition of barbarism, and was eventually prohibited by the Government.\n\nIn the old days, when a Sioux warrior found himself in the very jaws of destruction, he might offer a prayer to his father, the Sun, to prolong his life.\n\nIf rescued from imminent danger, he must acknowledge the divine favor by making a Sun Dance, according to the vow embraced in his prayer, in which he declared that he did not fear torture or death, but asked life only for the sake of those who loved him.\n\nThus the physical ordeal was the fulfillment of a vow, and a sort of atonement for what might otherwise appear to be reprehensible weakness in the face of death.\n\nIt was in the nature of confession and thank-offering to the “Great Mystery,” through the physical parent, the Sun, and did not embrace a prayer for future favors.\n\nThe ceremonies usually took place from six months to a year after the making of the vow, in order to admit of suitable preparation; always in midsummer and before a large and imposing gathering.\n\nThey naturally included the making of a feast, and the giving away of much savage wealth in honor of the occasion, although these were no essential part of the religious rite.\n\nWhen the day came to procure the pole, it was brought in by a party of warriors, headed by some man of distinction.\n\nThe tree selected was six to eight inches in diameter at the base, and twenty to twenty-five feet high.\n\nIt was chosen and felled with some solemnity, including the ceremony of the “filled pipe,” and was carried in the fashion of a litter, symbolizing the body of the man who made the dance.\n\nA solitary teepee was pitched on a level spot at some distance from the village, and the pole raised near at hand with the same ceremony, in the centre of a circular enclosure of fresh-cut boughs.\n\nMeanwhile, one of the most noted of our old men had carved out of rawhide, or later of wood, two figures, usually those of a man and a buffalo.\n\nSometimes the figure of a bird, supposed to represent the Thunder, was substituted for the buffalo."


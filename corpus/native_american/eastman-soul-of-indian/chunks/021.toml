[content]
body = "THE UNWRITTEN SCRIPTURES A Living Book.\n\nThe Sioux Story of Creation.\n\nThe First Battle.\n\nAnother Version of the Flood.\n\nOur Animal Ancestry.\n\nA missionary once undertook to instruct a group of Indians in the truths of his holy religion.\n\nHe told them of the creation of the earth in six days, and of the fall of our first parents by eating an apple.\n\nThe courteous savages listened attentively, and, after thanking him, one related in his turn a very ancient tradition concerning the origin of the maize.\n\nBut the missionary plainly showed his disgust and disbelief, indignantly saying:— “What I delivered to you were sacred truths, but this that you tell me is mere fable and falsehood!” “My brother,” gravely replied the offended Indian, “it seems that you have not been well grounded in the rules of civility.\n\nYou saw that we, who practice these rules, believed your stories; why, then, do you refuse to credit ours?” Every religion has its Holy Book, and ours was a mingling of history, poetry, and prophecy, of precept and folk-lore, even such as the modern reader finds within the covers of his Bible.\n\nThis Bible of ours was our whole literature, a living Book, sowed as precious seed by our wisest sages, and springing anew in the wondering eyes and upon the innocent lips of little children.\n\nUpon its hoary wisdom of proverb and fable, its mystic and legendary lore thus sacredly preserved and transmitted from father to son, was based in large part our customs and philosophy.\n\nNaturally magnanimous and open-minded, the red man prefers to believe that the Spirit of God is not breathed into man alone, but that the whole created universe is a sharer in the immortal perfection of its Maker.\n\nHis imaginative and poetic mind, like that of the Greek, assigns to every mountain, tree, and spring its spirit, nymph, or divinity either beneficent or mischievous.\n\nThe heroes and demigods of Indian tradition reflect the characteristic trend of his thought, and his attribution of personality and will to the elements, the sun and stars, and all animate or inanimate nature.\n\nIn the Sioux story of creation, the great Mysterious One is not brought directly upon the scene or conceived in anthropomorphic fashion, but remains sublimely in the background.\n\nThe Sun and the Earth, representing the male and female principles, are the main elements in his creation, the other planets being subsidiary.\n\nThe enkindling warmth of the Sun entered into the bosom of our mother, the Earth, and forthwith she conceived and brought forth life, both vegetable and animal.\n\nFinally there appeared mysteriously Ish-na-e-cha-ge, the “First-Born,” a being in the likeness of man, yet more than man, who roamed solitary among the animal people and understood their ways and their language.\n\nThey beheld him with wonder and awe, for they could do nothing without his knowledge.\n\nHe had pitched his tent in the centre of the land, and there was no spot impossible for him to penetrate.\n\nAt last, like Adam, the “First-Born” of the Sioux became weary of living alone, and formed for himself a companion—not a mate, but a brother—not out of a rib from his side, but from a splinter which he drew from his great toe!\n\nThis was the Little Boy Man, who was not created full-grown, but as an innocent child, trusting and helpless.\n\nHis Elder Brother was his teacher throughout every stage of human progress from infancy to manhood, and it is to the rules which he laid down, and his counsels to the Little Boy Man, that we trace many of our most deep-rooted beliefs and most sacred customs."


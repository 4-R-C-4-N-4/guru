[content]
body = "In all the war ceremonies and in medicine a special pipe is used, but at home or on the hunt the warrior employs his own.\n\nThe pulverized weed is mixed with aromatic bark of the red willow, and pressed lightly into the bowl of the long stone pipe.\n\nThe worshiper lights it gravely and takes a whiff or two; then, standing erect, he holds it silently toward the Sun, our father, and toward the earth, our mother.\n\nThere are modern variations, as holding the pipe to the Four Winds, the Fire, Water, Rock, and other elements or objects of reverence.\n\nThere are many religious festivals which are local and special in character, embodying a prayer for success in hunting or warfare, or for rain and bountiful harvests, but these two are the sacraments of our religion.\n\nFor baptism we substitute the “eneepee,” the purification by vapor, and in our holy communion we partake of the soothing incense of tobacco in the stead of bread and wine."


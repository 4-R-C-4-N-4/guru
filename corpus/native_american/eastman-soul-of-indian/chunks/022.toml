[content]
body = "Foremost among the animal people was Unk-to-mee, the Spider, the original trouble-maker, who noted keenly the growth of the boy in wit and ingenuity, and presently advised the animals to make an end of him; “for,” said he, “if you do not, some day he will be the master of us all!” But they all loved the Little Boy Man because he was so friendly and so playful.\n\nOnly the monsters of the deep sea listened, and presently took his life, hiding his body in the bottom of the sea.\n\nNevertheless, by the magic power of the First-Born, the body was recovered and was given life again in the sacred vapor-bath, as described in a former chapter.\n\nOnce more our first ancestor roamed happily among the animal people, who were in those days a powerful nation.\n\nHe learned their ways and their language—for they had a common tongue in those days; learned to sing like the birds, to swim like the fishes, and to climb sure-footed over rocks like the mountain sheep.\n\nNotwithstanding that he was their good comrade and did them no harm, Unk-to-mee once more sowed dissension among the animals, and messages were sent into all quarters of the earth, sea, and air, that all the tribes might unite to declare war upon the solitary man who was destined to become their master.\n\nAfter a time the young man discovered the plot, and came home very sorrowful.\n\nHe loved his animal friends, and was grieved that they should combine against him.\n\nBesides, he was naked and unarmed.\n\nBut his Elder Brother armed him with a bow and flint-headed arrows, a stone war-club and a spear.\n\nHe likewise tossed a pebble four times into the air, and each time it became a cliff or wall of rock about the teepee.\n\n“Now,” said he, “it is time to fight and to assert your supremacy, for it is they who have brought the trouble upon you, and not you upon them!” Night and day the Little Boy Man remained upon the watch for his enemies from the top of the wall, and at last he beheld the prairies black with buffalo herds, and the elk gathering upon the edges of the forest.\n\nBears and wolves were closing in from all directions, and now from the sky the Thunder gave his fearful war-whoop, answered by the wolf’s long howl.\n\nThe badgers and other burrowers began at once to undermine his rocky fortress, while the climbers undertook to scale its perpendicular walls.\n\nThen for the first time on earth the bow was strung, and hundreds of flint-headed arrows found their mark in the bodies of the animals, while each time that the Boy Man swung his stone war-club, his enemies fell in countless numbers.\n\nFinally the insects, the little people of the air, attacked him in a body, filling his eyes and ears, and tormenting him with their poisoned spears, so that he was in despair.\n\nHe called for help upon his Elder Brother, who ordered him to strike the rocks with his stone war-club.\n\nAs soon as he had done so, sparks of fire flew upon the dry grass of the prairie and it burst into flame.\n\nA mighty smoke ascended, which drove away the teasing swarms of the insect people, while the flames terrified and scattered the others.\n\nThis was the first dividing of the trail between man and the animal people, and when the animals had sued for peace, the treaty provided that they must ever after furnish man with flesh for his food and skins for clothing, though not without effort and danger on his part.\n\nThe little insects refused to make any concession, and have ever since been the tormentors of man; however, the birds of the air declared that they would punish them for their obstinacy, and this they continue to do unto this day."


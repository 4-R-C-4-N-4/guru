[content]
body = "THE GREAT MYSTERY Solitary Worship.\n\nThe Savage Philosopher.\n\nThe Dual Mind.\n\nSpiritual Gifts versus Material Progress.\n\nThe Paradox of “Christian Civilization.” The original attitude of the American Indian toward the Eternal, the “Great Mystery” that surrounds and embraces us, was as simple as it was exalted.\n\nTo him it was the supreme conception, bringing with it the fullest measure of joy and satisfaction possible in this life.\n\nThe worship of the “Great Mystery” was silent, solitary, free from all self-seeking.\n\nIt was silent, because all speech is of necessity feeble and imperfect; therefore the souls of my ancestors ascended to God in wordless adoration.\n\nIt was solitary, because they believed that He is nearer to us in solitude, and there were no priests authorized to come between a man and his Maker.\n\nNone might exhort or confess or in any way meddle with the religious experience of another.\n\nAmong us all men were created sons of God and stood erect, as conscious of their divinity.\n\nOur faith might not be formulated in creeds, nor forced upon any who were unwilling to receive it; hence there was no preaching, proselyting, nor persecution, neither were there any scoffers or atheists.\n\nThere were no temples or shrines among us save those of nature.\n\nBeing a natural man, the Indian was intensely poetical.\n\nHe would deem it sacrilege to build a house for Him who may be met face to face in the mysterious, shadowy aisles of the primeval forest, or on the sunlit bosom of virgin prairies, upon dizzy spires and pinnacles of naked rock, and yonder in the jeweled vault of the night sky!\n\nHe who enrobes Himself in filmy veils of cloud, there on the rim of the visible world where our Great-Grandfather Sun kindles his evening camp-fire, He who rides upon the rigorous wind of the north, or breathes forth His spirit upon aromatic southern airs, whose war-canoe is launched upon majestic rivers and inland seas—He needs no lesser cathedral!\n\nThat solitary communion with the Unseen which was the highest expression of our religious life is partly described in the word bambeday, literally “mysterious feeling,” which has been variously translated “fasting” and “dreaming.” It may better be interpreted as “consciousness of the divine.” The first bambeday, or religious retreat, marked an epoch in the life of the youth, which may be compared to that of confirmation or conversion in Christian experience.\n\nHaving first prepared himself by means of the purifying vapor-bath, and cast off as far as possible all human or fleshly influences, the young man sought out the noblest height, the most commanding summit in all the surrounding region.\n\nKnowing that God sets no value upon material things, he took with him no offerings or sacrifices other than symbolic objects, such as paints and tobacco.\n\nWishing to appear before Him in all humility, he wore no clothing save his moccasins and breech-clout.\n\nAt the solemn hour of sunrise or sunset he took up his position, overlooking the glories of earth and facing the “Great Mystery,” and there he remained, naked, erect, silent, and motionless, exposed to the elements and forces of His arming, for a night and a day to two days and nights, but rarely longer.\n\nSometimes he would chant a hymn without words, or offer the ceremonial “filled pipe.” In this holy trance or ecstasy the Indian mystic found his highest happiness and the motive power of his existence.\n\nWhen he returned to the camp, he must remain at a distance until he had again entered the vapor-bath and prepared himself for intercourse with his fellows.\n\nOf the vision or sign vouchsafed to him he did not speak, unless it had included some commission which must be publicly fulfilled."


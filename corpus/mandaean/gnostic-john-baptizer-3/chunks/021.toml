[content]
body = "1 The salt, bitter, water of the sea of death and destruction, as opposed to the fresh, sweet water, the living water or water of Life. 2 Equating with the Heavenly Jordan. 3 All symbolic objects in the cult. 4 Sc . the knife or sword of the Angel of Death. 1 This may mean at a certain period or appointed time. 2 The faithful are figured as birds as well as sheep. 3 An untranslatable idiom. 4 Sc . of this world."


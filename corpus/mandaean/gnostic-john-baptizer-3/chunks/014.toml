[content]
body = "That the Mandæan religion preserves echoes of a wealth of ancient mythical elements found in Iranian, Babylonian and Semitic traditions is evident on all hands. A process of syncretism had presumably gone on for generations before an impulse from within caused the blending to assume a distinctively Mandæan form; and when this emerged, the preservation of the memory of the process had no interest for the faith and fell back into the depths of the subconscious. At any-rate the writers or recorders of the tractates throughout seem honestly persuaded of the complete independence of their tradition from every other form of religion. They are for ever proclaiming the blessings of loyalty to what they claim to be the original, the one and only, revelation of Truth vouchsafed to the world throughout the ages, and declaring that continued spiritual contact with instructors from on high who mediated this divine wisdom, was still possible. They certainly do not give one the idea of being intellectualists consciously at work on a syncretic synthesis of prior material; on the contrary they seem to live and move in a milieu of prophetical outpourings and to have been extremely sensitive to psychical impressions. Inspirational discourses and intuitive interpretations of prophetical p. 89 utterances seem to have been their delight. The following piece may enable the reader to sense somewhat of the peculiar atmosphere of mystical expectancy in which they sought instruction. The topic is one of the chief points of their questioning—the conflict that arose between the Light and the Darkness in the beginnings and how victory is to be achieved. They were not of course absolute Dualists, for always and everywhere victory lies with Life Everlasting, who transcends not only the Darkness but also the Light.\n\nIN THE BEGINNING (§ 13).\n\nIn the Name of Great Life may hallowed Light be glorified.\n\nTo you I say and declare, ye chosen and perfect, ye who dwell in the world: Become not of the Darkness a portion, but lift up your eyes to Light's region. From the Evil unto the Good separate yourselves out; from the sinful evil of the region of Darkness separate yourselves out. Love and instruct one another, that your sin and [your] guilt be forgiven you. See and hear and get you instructed, that ye may ascend to Light's region victorious.\n\nThe good sit there and are in search; and all who are understanding let themselves be instructed. The good speak, take counsel together and say: \"Who will come, who tell me, who will set [it] forth for me, who give me instruction? Who will come, who will tell me whether there was one King or two [in the beginning]?\" The good speak and let themselves be instructed.\n\n\" Two Kings were there, two natures were fashioned—a King of this world and a King from outside of the worlds. The King of this age girt on a sword and [put on] a crown of Darkness. A crown of Darkness he put on his head, and took a sword in his right hand. A sword he took in his right hand; he stands there and slaughters his sons, and his sons slaughter each other. The King from outside of the worlds set a crown of Light on his head. A crown of Light he set on his head, and took Truth in his right hand. Truth in his right hand he took, and stands there and p. 90 instructs his sons. He stands there and instructs his sons, and his sons instruct one another.\""


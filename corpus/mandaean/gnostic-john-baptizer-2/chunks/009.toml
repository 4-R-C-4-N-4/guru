[content]
body = "5 'Fishes' and 'birds' are the new 'hearers' of the faith.\n\n1 Presumably kept hidden, or made conditions concerning their revelation.\n\n2 Compare with the above eloquent invitation to return the similar motive in the Talmūd Jesus stories: (1) \"When King Jannai directed the destruction of the Rabbis. R. Joshua ben Perachiah and Jeshu went to Alexandria. When security returned, R. Simeon ben Shetach sent him a letter to this effect: From me, Jerusalem the holy city, to thee, Alexandria in Egypt, my sister. My spouse tarries in thee, and I dwell desolate'\" ( Bab. Sandedrim , 107b, Sota , 47a). (2) \"The inhabitants of Jerusalem intended to appoint Jehuda ben Tabbai as Nasi [Prince or President of the Sanhedrim] in Jerusalem. He fled and went away to Alexandria, and the inhabitants of Jerusalem wrote: 'From Jerusalem the Great to Alexandria the Little: How long lives my betrothed with thee, whilst I am sitting grieving for him?'\" ( Pal. Chagiga , 77d). See my D. J. L. 100 B.C.? —pp. 137ff., 148ff.—for a discussion of these passages. Can Tabbai possibly in any way connect with the Ṭāb-Yōmīn of the Portents-piece § 18 ?\n\n1 Clearly indicating that the Mandā was originally not Jewish.\n\n2 Heb. ḥallah , the priests' share of the dough, Cp. Lev. 15:20, 21: \"Of the first of your dough (marg. coarse meal) ye shall offer up a cake for a heave-offering.\""


[content]
body = "MIRYAI IS EXPELLED FROM JEWRY (§ 34).\n\nIn the Name of Great Life, may hallowed Light be glorified.\n\nMIRYAI am I, of the Kings of Babel 1 a daughter, a daughter of Jerasalem's mighty rulers. They have given me birth; the priests brought me up. In the fold of their robe they carried me up into the dark house, into the temple. Adonai laid a charge on my hands and on my two arms: I must scour and cleanse the house [that is] without firmness. There is naght therein for supporting the poor, naught to revive the tormented souls.\n\nMy father went to the house of the people, my mother went to the temple. My father went out and said to me, and my mother went out and charged me: \"Miryai, close thy inner doors and bolt the bar. See that thou goest not forth into the main streets and that the suns of my Lord 2 fall not upon thee.\"\n\nBut I, Miryai, listened not to what my mother did tell me, and hearkened not with the ear to what my father did charge me. I opened the inner doors, and the outer let I stand open. Out went I into the main streets and the suns of my Lord fell upon me. To the house of the people would I not go, but my way bore me unto the temple [ sc . of the Mandćans]. I went and I found my brothers and sisters, how they stand and carry on proclamations. My brothers carry on proclamations and my sisters throw out explanations. 3 With the voice of their proclamations and with the voice of their explanations I became drowsy and laid me down on the spot. 4 My brothers went forth and did not wake me, and my sisters withdrew and roused me not. But thou, my sister in Truth, 5 dost rouse me from sleep and dost say: \"Arise, arise, Miryai, before the day breaks and the cock lets crow his morn-call, before the sun shines and his glory rises over the p. 63 worlds, before the priests and the priests' sons go forth and sit them down in the shade of the Ruins—Jerusalem, before thy father comes and brings upset upon thee such as thou never hast had.\"\n\nI, Miryai, keep secret my prayers and utterly secret keep my discourses.\n\nEarly, day began to dawn, early the cock let crow his call, early the sun shone and his glory rose over the worlds. The priests and priests' sons went out and sat them down in the shade of the Ruins—Jerusalem. Then came my bodily father and brought on me upset such as I never have had. He spake:\n\n\"Where hast come from, thou debauched trough, whom [? locks] and bars [cannot keep in]? Where hast thou come from? Woe [unto thee], thou bitch in heat, who [? mindest] not [door-] pins and lockings! Where hast thou come from? Woe, woe [unto thee], thou bit of coarse stuff that has been patched on my robe!\"\n\n\"If I am a debauched trough, I will burst thy [boltings] and bars. If I am a bitch in beat, I will draw back the pins and the lockings. If I am a bit of coarse stuff that has been patched on thy robe, then out of thy robe cut and rip me.\""


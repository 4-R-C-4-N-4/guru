[content]
body = "1 This makes it clear that the strict observance of a sabbath (Sunday) by the MM. was not taken over from the Christians, as Brandt supposes.  \n2 Cp. the Joshua ben Perachiah Jesus story in the Talmūd ( B. Sanhedrin 107b, Sota 47a): Joshua replied [to Jeshu]: \"Thou godless one, dost thou occupy thyself with such things?—directed that 400 horns should be brought and put him under strict excommunication.\" (Mead, D.J.L. 100 B.C.? pp. 137 and 146f.).  \n3 The Man 'with the Scales'—the Avestan Rashnu {?}—who weighs the good and bad deeds of the departed (J.B. xxix. f.).  \n4 Generally meaning an unmarried man.  \n\n1 Presumably her spiritual children.  \n2 Meaning God.  \n3 L. thinks that by zanḍīq (heretic) is meant a Zoroastrian or Manichćan who comes down from the mountains to join the Mandćans who live in the plains. This seems to me entirely mistaken. The Z.'s and M.'s lived as well on plains as on mountains. In every probability it means the Mount of Darkness on which the Seven assemble to plot against the righteous. The Seven are the lords of all the false religions. For the Mount of Hades, the Prison Mount of the Underworld in Bab. tradition, see my paper 'New-found Fragments of a Babylonian Mystery-play and the Passion-story,' Quest , Jan. 1922, p. 173."


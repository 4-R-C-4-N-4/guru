[content]
body = "6 A cryptic sentence referring to the 'fornicators' who are not true to the True Religion of MM.; 'she' = the soul. 7 That is the world-house illuminated by the Sun. 8 Sc . hell. 9 Sc . God, as in the thought-sphere of Philo's Therapeuts. 10 After renouncing heretical views. 11 That is from the body. 1 Miryai is the personification of the first Mand. community among the Jews. She is presumably not to be confounded in any way with Miriam, the mother of Išū Mšīhā (Jesus Messiah), who is called Miryam (not Miryai) in § 30 ; but this requires further investigation. 2 'Jewels,' 'pearls' and 'gold' are presumably the figures of spiritual riches."


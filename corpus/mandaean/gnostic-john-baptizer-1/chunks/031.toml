[content]
body = "3 Presumably before his birth, and perhaps dedicating him to God as a Nazīr. 4 This phrase is most probably a late interpolation. 1 Cp. Pistis Sophia (p. 115; Mead 2 , p. 97), where Jesus is made to say to his mother: \"Thou, also, Mary, hast received form which is in Barbēlō [the Great Mother], according to matter, and hast received likeness which is in the Virgin of Light, according to light . . . ; and on thy account the darkness hath arisen, and moreover out of thee did come forth the material body in which I am, which I have purified and refined.\" Again (p. 120; M. p. 100): \"Mary, my mother according to matter, thou in whom I have sojourned.\" And again, Mary speaking (p. 120; M. p. 103): \"'Grace and Truth met together,'—it is I, Mary, thy mother, and Elizabeth, mother of John, whom I have met. 'Grace' then is the power of Sabaōth in me, which went forth out of me, which thou art. . . . . 'Truth' on the other hand is the power in Elizabeth, which is John, who did come and hath made proclamation concerning the way of Truth [the M. Kushṭā] which thou art,—who hath made proclamation before thee.\" 1 The Angel of Death, as with the Jews. Cp, the knife, sword or scymytar of the Ophite Diagram in Origen's reply to Celsus. 2 Cp. the flaming sword of the Hebrew form of the Paradise-myth. 1 Here something seems to have fallen out. The following recital of the soul describes a burial which has taken place. 2 Unexplained; it may possibly mean two female and two male professional mourners."


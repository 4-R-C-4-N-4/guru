[chunking]
strategy = "page-as-chunk"
section_label_format = "Hymn {n}. {title}"
# Used when number_pattern (Roman numeral) does not match — i.e. the page
# is preface, dissertation, SECT material, etc. Avoids labeling those as
# "Hymn N" when they aren't hymns.
section_label_format_no_number_match = "Front Matter, p. {n}"

# Source pages from sacred-texts.com are paginated by print-edition page,
# NOT by hymn number — so the filename's NN is a page number, not a hymn
# number. The Roman numeral inside the body (e.g. "XXII. TO NEREUS.") is
# the canonical hymn id. Anchor on start of (post-strip) content.
number_source = "content"
# A hymn number is a Roman numeral followed by either a period (or period +
# whitespace) leading into the invocation, or the invocation " TO " itself
# ("XLII TO THE SEASONS" — the one hymn whose source omits the period, and
# "XXXIV. T O L A T O N A" whose title is letter-spaced). The lookahead
# requires one of those two followers, which is what keeps a leading ordinary
# word made of I/V/X/L/C/D/M letters (e.g. "CIVIL", "MILD. air", "DIM.")
# from being captured as a hymn number. Case-insensitive [Tt][Oo] because the
# source mixes "TO" and "To", matching title_pattern's (?i). Residual: a word
# that is ALSO a valid Roman numeral followed by " TO " (e.g. "MIX TO IT")
# is indistinguishable from a hymn opening at this level.
number_pattern = '^([IVXLCDM]+)(?=\.\s*[Tt]|\s*[Tt][Oo] )'

title_source = "content"
# Require literal 'TO X' (case-insensitive — source has both 'TO' and 'To').
# Otherwise candidate strings that happen to be bare Roman numerals (the
# leading 'XXII' in 'XXII. TO NEREUS.') match and the title duplicates the
# hymn number. The numeral prefix's period is optional ('\.?') so Hymn XLII's
# "XLII TO THE SEASONS" (no period) strips the numeral and still yields the
# title, matching the number_pattern's tolerance.
title_pattern = '(?i)^(?:[IVXLCDM]+\.?\s+)?TO\s+(.+?)[\.\*]?\s*$'
title_max_len = 80
max_tokens = 800

# Drop Taylor's editorial front matter — title page, Preface, and the
# "Dissertation on the Life and Theology of Orpheus" (raw pages 1-6). These
# are contiguous LEADING pages, so drop_before_marker is the right tool (not
# drop_chunk_patterns): drop every chunk before the first whose body matches
# the first hymn. Anchor on the Hymn I invocation, which is unique to the
# first hymn and absent from the dissertation.
drop_before_marker = "TO THE GODDESS PROTHYR"

# Drop the sacred-texts redirect page (raw page 93): "The new sacred-texts
# hypertext version of Homer's Iliad can be found here!...". Not a hymn and
# not a footnote — a nav redirect. Anchored to the body start so a hymn page
# whose footnotes merely quote that boilerplate can never match (the helper's
# own rule: anchor + length-bound drop_chunk_patterns).
drop_chunk_patterns = [
    '^The new sacred-texts hypertext version of Homer',
]

# The front-matter drop is load-bearing: if a re-scrape ever changes the
# Hymn I heading so the marker stops matching, chunk.py's default is to warn
# and keep EVERYTHING (fail-open). For this text that would silently
# reintroduce all 34 editorial chunks. require_drop_before_marker flips the
# shared mechanism to fail-closed for this config only (other configs keep
# the warn-and-keep default).
require_drop_before_marker = true

# Some hymn pages (Muses, Death, Protogonus, Apollo, ...) carry Taylor's
# appended footnotes/essays past the verse. The verse itself always fits in
# one chunk (longest verse is 567 tokens < max_tokens=800), so any
# commentary is strictly trailing on the page. Two complementary keys strip
# it (todo:f1e1e009, hardened after review of PR #87):
#
#   strip_appended_commentary : truncate each page body at the first
#       'Footnotes <n>:' marker (the verse is the leading block; no hymn
#       verse contains that token, and no verse follows it on the page).
#       This removes the commentary that would otherwise be packed into the
#       KEPT sub-chunk (the sub-split sentence-packing fills the 800-token
#       budget with verse + commentary head).
#   drop_trailing_nonprimary_subsplits : after truncation, any page that
#       STILL exceeds max_tokens sub-splits, and trailing parts that do NOT
#       open with the page's hymn number are dropped (covers multi-footnote
#       pages where truncation alone isn't enough).
#
# Both are opt-in per config (the truncate only fires when this flag is set)
# and documented here so other page-as-chunk texts keep their existing
# behavior.
drop_trailing_nonprimary_subsplits = true
strip_appended_commentary = "Footnotes"

# Strip sacred-texts navigation cruft. Each page comes back as a single
# line: "Sacred Texts Classics Index Previous Next XXII. TO NEREUS. ...
# Next: XXIII: To the Nereids". Embedding the prefix/suffix pollutes
# vector similarity (the nav phrases pull these chunks into unrelated
# queries). Patterns are applied in order via re.sub('').
pre_strip_patterns = [
    # Header: 'Sacred Texts Classics Index <link variants>'.
    # Variants seen: 'Previous Next', 'Previous' alone (last page), 'Next' alone
    # (first page). Strip any combination.
    '^Sacred Texts Classics Index(?:\s+(?:Previous|Next))+\s+',
    # Print-edition page marker that often appears at the very start of a
    # scraped page, e.g. 'p. 219 LXXXI. TO THE SOUTH WIND'. Stripping the
    # leading one only — interior 'p. NN' tokens are kept for citation
    # cross-reference. Match optional 'i'/'ii'/'iii' (front matter) or arabic.
    '^p\.\s+(?:[ivxlcdm]+|\d+)\s+',
    # Footer: 'Next: <Roman>: <Title>' or 'Next: <Title>' on the final page.
    '\s+Next:\s+(?:[IVXLCDM]+:)?.*$',
]

[metadata]
tradition = "Greek Mystery"
text_name = "Orphic Hymns"
translator = "Thomas Taylor"
sections_format = "hymn_number"

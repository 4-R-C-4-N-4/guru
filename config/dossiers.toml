# Guru dossier-generation campaign configuration
# (design doc §1.3.6; consumed by scripts/build_dossiers.py)
#
# The provider is a CAMPAIGN parameter, not architecture. A provider or model
# change is a NEW campaign (V9): bump campaign_id, re-run the plan step, and
# treat prior staged rows as a separate provenance line (the `model` column
# disambiguates).

[campaign]
# Namespaces the span-plan freeze artifact (data/span_plan_{campaign_id}.json).
# c2 = c1 + transcendental-magic (todo:91b4c43b). The c1 plan froze at 52
# works before the transcendental-magic ingest changed totals; per V9 that
# means a new campaign, never a partial re-plan. Provider/model/span_target
# unchanged, so the 52 prior works' span ids are identical under c2 and their
# c1 staged rows satisfy the generate-loop skip/upstream checks unchanged.
# c3 = c2 + secret-teachings-of-all-ages (STAA, 530 chunks → 71 new spans).
# The c2 plan froze at 53 works before the STAA pipeline pass completed; per
# V9 that is a new campaign, never a partial re-plan. Provider/model/span_target
# unchanged, so the 53 prior works' span ids are identical under c3 and their
# c2 staged rows satisfy the generate-loop skip/upstream checks unchanged.
# c4 = c3 + bhagavad-gita (todo:d95fd3f5, 42 chunks, 18 shards → 1 work).
# The c3 plan froze at 54 works before the Gita ingest changed totals; per V9
# that is a new campaign, never a partial re-plan. Provider/model/span_target
# unchanged, so the 54 prior works' span ids are identical under c4 and their
# c3 staged rows satisfy the generate-loop skip/upstream checks unchanged.
# c5 = c4 + julian-revelations (todo:277b26c5, 127 chunks → 1 work).
# The c4 plan froze at 55 works before the Julian ingest changed totals; per
# V9 that is a new campaign, never a partial re-plan. Provider/model/span_target
# unchanged, so the 55 prior works' span ids are identical under c5 and their
# c4 staged rows satisfy the generate-loop skip/upstream checks unchanged.
# c6 = c5 + mooney-cherokee-myths + eastman-soul-of-indian (todo:463078a8,
# 220 + 29 chunks → 2 works). The c5 plan froze at 56 works before the
# native_american ingest changed totals; per V9 that is a new campaign, never
# a partial re-plan. Provider/model/span_target unchanged, so the 56 prior
# works' span ids are identical under c6 and their c5 staged rows satisfy the
# generate-loop skip/upstream checks unchanged.
# c7 = c6 + gospel-of-judas + apocryphon-of-john + yoga-sutras-book-01..04
# (6 works, all ingested after c6 froze; gospel-of-judas 2026-08-12). Per V9
# that is a new campaign, never a partial re-plan. Provider/model/span_target
# unchanged for the corpus stream, so the 58 prior works' span ids are
# identical under c7 and their c6 staged rows satisfy the generate-loop
# skip/upstream checks unchanged. gospel-of-judas generation is agent-driven
# with the driving model recorded verbatim in `model`
# (hermes-deepseek-v4-flash — the provenance convention applied to dossiers);
# the other five new works generate under the campaign default.
campaign_id = "c7"

# "claude-code" — headless Claude Code on the subscription (default).
# "local"      — llama.cpp on the 3090 (V7 applies; set input_budget below).
provider = "claude-code"

# Recorded verbatim in staged rows' `model`. Always pinned explicitly —
# never rely on a session default.
model = "claude-opus-4-8"

# Reader-facing span size (TOC granularity + L1 review size), in pipeline
# tokens. Provider-INDEPENDENT: does not change when the backend does,
# so span identity survives provider switches (V9 / §1.3.5).
span_target = 6000

# Max tokens per generation call. 0 = effectively unbounded (claude-code).
# Local campaigns set 6000-8000; folds and figures/terms map-reduce activate
# only when this is > 0 and a work's L1 set exceeds it.
input_budget = 0

# Rubric sample size per field for the review loop (§1.3.4): works sampled
# stratified by tradition and size; structure entries sampled per-span.
review_k = 15

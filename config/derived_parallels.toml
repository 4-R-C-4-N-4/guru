# Guru derived-parallels configuration
# Consumed by: scripts/derive_parallels.py
#
# Ported from rellm tools/derived_parallels.py (docs/edges/derived-parallels-
# proposal.md, todo:5620391a / parent c3f479ff — "retire Pass C: parallels
# become a derived table"). Replaces LLM pair-classification with EXPRESSES
# (every edge of that type, any tier — including the ~29% tier='proposed'
# legacy auto-promoted residue frozen 2026-05-26; NOT restricted to
# human-reviewed rows. See scripts/derive_parallels.py's module header and
# todo:dd034dc4 for the tier-semantics question this deliberately
# leaves open) x thin-student (concept, chunk) scores: a chunk's PARALLELS
# partners are the top cross-tradition co-expressors of its concepts,
# RANKED by the student's own score. No LLM call, no staged_edges review
# queue.
#
# There used to be a min_grade floor here (removed by todo:ac63de1a, parent
# todo:7427712c): a (concept, chunk) pair had to clear an absolute score cut
# to anchor a panel or be picked as a partner. It is gone, and deliberately
# not replaced by any other absolute cut — the score ranks candidates, it
# does not admit or exclude them. The removed number (-4.415) was the thin
# scorer's calibrated operating point for a DIFFERENT frame — (query, chunk)
# EDGE_RERANK relevance — never re-derived for the (concept-definition,
# chunk) frame this script actually scores, and measurement showed it was
# wrong on this frame: only 18.9% of 27,395 human-VERIFIED (concept, chunk)
# pairs at node 11 cleared it, discarding four-fifths of completed review
# work, and clearance tracked passage length (12% under 500 chars vs 58% for
# 2,000–2,400 chars) rather than whether the chunk actually expressed the
# concept — auto-promoted, never-reviewed pairs cleared at 22.6%, slightly
# *more* permissively than human-verified ones. Full record:
# docs/ingest/16-derive-parallels.md's Failure modes section.

[scoring]
# Vendored checkpoint, guru-side path (NOT a rellm path — the checkpoint was
# copied to ~/programs/guru/scorer-v1 for this repo to pin independently of
# the rellm worktree). See training-card.json there for provenance:
# cross-encoder/ms-marco-MiniLM-L6-v2 student, val_pearson 0.878.
# training-card.json carries `pairs_sha` (a hash of the TRAINING DATA, not
# the checkpoint); model_sha256 below is the checkpoint pin itself (sha256 of
# model.safetensors) — together with the path, that is the full provenance
# record. Not read by derive_parallels.py; a documentation-only pin to detect
# drift if the vendored file is ever replaced without bumping the dir name.
model_path = "/home/ivy/programs/guru/scorer-v1"
model_sha256 = "be0174a36c98f8a8cd6bd979e2ec913a9365dadea87ad2d14d6399ee9e450fc7"  # model.safetensors

# Set as EDGE_RERANK_MODEL for guru.rerank.score_pairs (guru/rerank.py),
# which this script reuses for CPU-only scoring. That module already caps
# max_length at the checkpoint's own max_position_embeddings (512 for a
# BERT-family student — the "BERT students cap at 512 positions" gotcha)
# and truncates bodies to 2400 chars before tokenizing, so those are not
# separate knobs here.

# GATHER bound, not a panel ceiling. Via-concept round-robin gathers up to
# top_k * 2 raw candidates per chunk (ported as-is from the rellm prototype;
# diffed against rellm tools/derived_parallels.py — same behavior). The
# per-work cap below then thins that pool, but nothing truncates it back
# down to top_k afterward: a chunk's PARALLELS panel can carry up to
# 2 * top_k partners (tests/test_derive_parallels.py's
# test_build_panels_round_robin_alternates_via_concepts_deterministically
# demonstrates a 4-partner panel at top_k=2), or fewer than top_k if
# candidates cluster in one work. This is prototype-faithful, not a bug —
# ratified by the 2026-08-13 snapshot trial — and is NOT truncated. Do not
# size a reader panel layout assuming top_k is the maximum partner count.
top_k = 5

# Incremental (concept, chunk) score cache, keyed on a content hash of the
# concept definition + chunk body (post 2400-char trim) so a corpus update
# or a taxonomy definition edit only re-scores what actually changed. Path
# is relative to the project root; data/ is git-ignored.
score_cache = "data/derived_parallels_score_cache.json"

[panels]
# Max partners drawn from any single work (sources/works.toml; texts not
# listed there are implicit singleton works) in one chunk's panel. Without
# this, the snapshot trial found single-via, single-work monoculture panels.
per_work_cap = 2

# Max INCOMING partner slots any one chunk may occupy in the EXPORTED edge
# set — how many OTHER chunks' panels may list it as a partner. Nothing
# upstream bounds that: top_k/per_work_cap above bound only a chunk's OWN
# outgoing panel, and removing the score floor (todo:ac63de1a) can make a
# chunk expressing a common concept a partner in hundreds of panels at once
# (the v55 run produced a 1,178-partner panel). Omit this key entirely to
# disable the cap; 0 or negative is rejected at load.
#
# cap_fan_in() in scripts/derive_parallels.py enforces it, applied by run()
# rather than build_edges() so the before/after degree distribution can be
# reported. Only the RECEIVING leg is charged: an edge dies only when the
# chunk it points AT is over budget, never because the chunk that CHOSE it
# had already accumulated edges elsewhere. A mutual pair (both endpoints
# picked each other) is outgoing for both and always kept. Do not "simplify"
# this into a both-endpoints degree budget — that was the first cut, and
# letting each chunk's degree veto its neighbours' edges deleted 58% of the
# v55 edge set and left 367 chunks with no partners at all, 4,531 of the
# losers never having been over cap themselves.
#
# THE VALUE MATTERS MORE THAN THE MECHANISM. Swept over the v55 score cache
# (edges kept / chunks left with NO partners, against 50,148 and 5,054
# uncapped):
#   1000 -> 49,830 / 0     500 -> 44,330 / 0     200 -> 31,120 / 48
#    750 -> 48,168 / 0     400 -> 41,613 / 0     150 -> 26,769 / 134
#                          300 -> 37,713 / 3     100 -> 21,476 / 353
# Darkening a chunk is the hard failure — it drops out of the graph entirely
# — and it starts below 400. The distribution is why: median chunk degree is
# 10 but 41,807 of 50,148 edges (83%) touch one of the 129 chunks above 100,
# so a cap of 100 offers those hubs 12,900 slots for 41,807 hub-bound edges
# and MUST delete most of the graph. That is arithmetic, not a tuning
# accident. Uncapped p99 degree is 315, so 500 bites only the genuine
# outliers (max degree 1,178 -> 516) while keeping 88% of the edges. A value
# near 100 is not a tail trim; it is a second score floor wearing a degree
# cap's clothes, and it undoes what todo:ac63de1a just won.
#
# If you retighten this, read summary.json's fan_in_cap_chunks_darkened —
# any nonzero value means chunks fell out of the graph. See
# docs/ingest/16-derive-parallels.md's Failure modes section ("fan-in").
max_fan_in = 500

[export]
# Consumed by scripts/export.py (todo:6da4f965). derive_parallels.py writes
# each run to a fresh data/derived_parallels/<UTC timestamp>/ directory
# (edges_derived.jsonl + summary.json); export.py does not take a run
# directory on the command line — it picks the lexicographically latest
# subdirectory of derived_dir (the timestamp format sorts correctly) and
# uses that run's edges_derived.jsonl as the sole source of PARALLELS rows.
derived_dir = "data/derived_parallels"

# Guardrail, not a correctness mechanism: if the latest run's summary.json
# `generated_at` is older than this many days, export.py refuses to run
# rather than silently shipping a stale panel set. Bump derive_parallels.py
# and re-run to clear it; there is no override flag by design — a stale
# artifact should be regenerated, not waved through.
max_age_days = 30
